<script>const D=[{"t":"一、防治主张","h":"糖尿病的六条防治建议","c":"方法——倪海厦在评论美国糖尿病协会营养原则时，给出六条替代主张：**①\"不要吃消夜**，以免造成睡觉时过多食物在肠胃中无法消化，促使体内糖份增加\"；**②\"食不过饱，大约七分饱，不感觉饿就可以了\"**；**③\"不要吃油炸食物太多，造成消化系统的过量负担\"**；**④\"禁止使用抗生素**，得到感冒时服用中药（我有许多病人因为肺炎经过服用 Cipro 此强力抗生素后血糖升高），许多糖尿病患都是因为**吃到抗生素过多，破坏胰脏**而使血糖升高，原来根本没有此病\"；**⑤\"适合的运动，如打太极拳、走路、游泳等\"**；**⑥\"一旦得到糖尿病须要找中医治**，血糖高不会造成青光眼，**只要顾好肾脏、加强心脏的功能**，再按照以上的方法就会好的\"。他并给出一句总结：\"**惊慌及乱用西药，是造成人们死于糖尿病的主要原因**。\"**需明确说明**：六条中\"不消夜、七分饱、少油炸、太极与走路\"与现代生活方式干预（控制总热量、规律有氧运动）方向一致，可作参考；但\"抗生素破坏胰脏致糖尿病\"\"血糖高不造成青光眼\"两说与主流医学不符——感染本身即可显著升高血糖，青光眼与糖尿病确有明确关联，不可据此延误诊治。","o":"RJ-3031 · 专题·糖尿病篇·评论（PDF 第2页）"},{"t":"一、防治主张","h":"护肾与强心：其治疗重心的排序","c":"要点——倪海厦对糖尿病治疗的着力点不在\"降糖\"而在\"护脏\"。他明确表述：\"**血糖高不会造成青光眼，只要顾好肾脏，加强心脏的功能**，再按照以上的方法就会好的\"；并给出一条中医式的病机链条：\"**脾主甘味，脾气盛故甘味盛，甘伤肾，肾伤才伤心，所以中医治糖尿病必先顾肾，肾强则心无虑**；中风就是心伤。**西药都伤肝，肝主目，故肝伤则目伤**，所以是吃降血糖药才会失明。\"这条链条把糖尿病并发症按\"**脾→肾→心**\"与\"**肝→目**\"两条路径归因，其对应的治法重心即**先固肾、次强心、兼护肝**。这一思路在传统中医中确有渊源（消渴久病及肾、久病入络），但其\"先顾肾\"的具体排序属倪氏个人提炼；且他将失明归因于\"降糖药伤肝\"而非高血糖，与糖尿病视网膜病变的公认机制（微血管病变）相悖。","o":"RJ-3032 · 专题·糖尿病篇·评论（PDF 第2、6页）"},{"t":"二、独有论断","h":"\"降血糖药只降上半身血糖\"说及其推理","c":"要点——这是倪海厦最具争议的一个论断，其推理如下：\"就是因为病患使用降血糖的西药而**造成大量的血糖累积在双脚上**，因此而破坏血管以及血液的循环，才会有伤口不易愈合的现象……**降血糖药只能降上半身的血糖，无法降下半身的血糖**。\"**他的例证**：\"有一人验血得知**血糖为 300**，经服用降血糖药后**血糖降低到 100**，表面上看起来很好，**实际上少掉的 200 仍然在身体里**，'按照物质不灭定律'**去掉的血糖会停留在下身**，结果**脚指取得的一滴血中血糖是 500**，如与手指上的加起来就是 600，**除以 2 就是 300**，也就是说**血糖根本没有变**。\"\"由于过多的血糖停留在脚中，日子久了以后，就**形成'糖尿病足'**。\"**需要明确说明**：此说在生理学上不能成立——血糖是全身循环中的溶解物，不存在\"上半身/下半身\"的分区浓度差，末梢血糖与指血血糖的差别极小；\"物质不灭定律\"在此处被误用，药物降低的是\"血液中的葡萄糖浓度\"（通过促泌、增敏、排糖等机制被利用或排出），而非把糖\"搬\"到脚上。**此论断不可采信，更不可据此怀疑或停用降糖药。**","o":"RJ-3033 · 专题·糖尿病篇·评论（PDF 第3页）"},{"t":"二、独有论断","h":"糖尿病足的归因分歧","c":"风险——关于糖尿病足，书中并列了两种截然不同的解释，值得对照。**主流解释（书中引林口长庚陈恒民医师文）**：\"伤口的形成，与**周边神经病变及血管病变最为相关**。而周边神经病变的发生，除了**高血糖所诱发的代谢异常**，就以**缺血所致神经细胞失养性病变为主**……血管病变所导致组织缺血，实为此病之主要因素。\"其中血管病变分两类：**大血管病变**（动脉硬化，可用血管绕道手术）与**小血管病变**（\"血管内皮细胞失去功能，使血管无法正常扩张以供应组织之需求\"，\"尚无有效的治疗方式\"）。**倪海厦的归因**：糖尿病足是\"**吃西药的副作用**，根本与糖尿病无关\"；\"只有被西医判定得到糖尿病的病人，然后听西医的话使用西药降低血糖，而这被下降的血糖就屯积在病患双脚里……经年累月的屯积糖就造成双脚红肿疼痛，一旦有伤口就不会愈合，结果就是截肢\"。**两者的共同点**是都承认\"血管病变＋神经病变\"是机制；**分歧在于归因对象**（高血糖本身 vs 降糖药）。**最要紧的是：陈恒民医师本人明确强调**——\"无论如何治疗，**良好的血糖控制仍是最基本的步骤**，尤其针对小血管病变，此点更为重要。只有血糖控制得当，其它的治疗才能发挥效果。**病患千万不要贸然停掉原本使用之降血糖药物**，一旦如此，未蒙其利，先受其害。\"","o":"RJ-3034 · 专题·糖尿病篇（PDF 第2页）"},{"t":"三、临床边界","h":"二型可治、一型未验证的自述","c":"要点——倪海厦对自己的疗效范围作了明确界定：\"现在我的临床经验可以很确定告诉大家是**第二型的糖尿病**，也就是西医所谓非依赖型胰岛素的糖尿病患者，至于**第一型属于依赖胰岛素型的糖尿病患者，我就无法肯定了**。\"原因他解释为：\"每次有这类患者来看我，**我要他们停止使用胰岛素时，他们就已经吓坏了**，结果都不了了之，没有继续来做治疗，所以我无法确定。\"他由此提出一个治疗窗口的判断：\"**如果是初诊时尚未经西医确定是第一或第二型的糖尿病时，是最好治的阶段**；如果经过西医洗脑之后就很难治了，因为病人已经被西医吓死了，我们中医还未开始治疗，就已经因为病患慌乱害怕，先输一着了。\"这段自述的价值在于：它坦承了**疗效证据的边界**（一型无完整案例），这一点比许多同类论述更诚实。**但须强调**：对 1 型糖尿病患者而言，胰岛素是维持生命所必需，任何情况下都不可停用；所谓\"停用后治疗\"本身即构成重大风险。","o":"RJ-3035 · 专题·糖尿病篇·评论（PDF 第4~5页）"},{"t":"四、被评论的西医观点","h":"胰岛素的三项适应证与技术演进","c":"数据——书中收录的报道提供了几组数据。**使用比例的差距**：\"绝大多数糖尿病患者都使用口服降血糖药物，**接受胰岛素注射的仅约百分之十二**，低欧美国家的**百分之三十左右**\"（台湾地区数据）。**传统胰岛素的缺点**：\"必须**用餐前三十到四十五分钟注射**、**注射六到八小时后容易发生低血糖昏迷**\"。**新一代胰岛素**：\"可**随餐使用**，药效生效时间模拟人体胰岛素释放的模式，再加上**药效仅三到四小时**，正好是两餐之间的间隔，就不容易因为胰岛素作用时间太长导致血糖太低而昏倒\"；其机制说明——\"**人体在进食十五分钟后，血糖上升**，需要胰岛素吸收营养素\"。**结论性判断**：\"当糖尿病的病情进展到晚期时，**注射胰岛素是最直接有效的治疗方式**，可减少糖尿病晚期的视网膜病变、糖尿病脚部病变、肾衰竭等许多严重并发症。\"**胰岛素帮浦**：\"一九八〇年间问市，九十年代后普及\"，\"现今全世界已有接近**三十万**糖尿病患者选择此种治疗\"，\"在美国也有超过**六成**罹患糖尿病的医护人员选择帮浦\"；\"一套自费新台币**十八万元**\"，\"**每三天换一次针管组**\"。这些数据与操作参数本身中立可靠，与倪海厦的评论立场无关。","o":"RJ-3036 · 专题·糖尿病篇·转载报道（PDF 第3~4页）"},{"t":"四、被评论的西医观点","h":"醣禄类延缓发病与足部筛查的两组数据","c":"数据——**醣禄类（α-糖苷酶抑制剂）用于预防**：\"根据加拿大的跨国临床实验证明，服用醣禄类的降血糖药物可以**延缓罹患糖尿病的时间长达 5 年**，而且还能预防心血管疾病\"；\"这种降血糖药物可以**抑制淀粉吸收**，还有**减肥效果**\"；\"如果是预防性的治疗，健保不给付，**每天的药费大约 30 块钱**\"。文中并引台湾地区数据：\"糖尿病人口高达 **40 万人**，其中 **50 岁以下的年轻病患就有 25 万人**\"，\"临床上甚至出现 **10 岁**的小小糖尿病患\"。**足部筛查**：\"美国足科医学协会呼吁……健康检查时千万记得要把袜子脱下来，让医生好好地检查一番\"；\"**每年进行足部健康检查，可以降低百分之八十五的糖尿病截肢情形**\"；\"全美国估计有**五百二十万**的糖尿病患者并不清楚自己已罹患糖尿病\"。**倪海厦对后者的评论**认为：足部红肿、麻木、冰冷\"除非你扭伤了，**否则是早期心脏有问题了，跟糖尿病无关**\"。**客观判断**：足部筛查（尤以 10g 尼龙丝触觉、足背动脉搏动、皮肤检查）确为糖尿病足防治的核心手段，国际指南均予推荐，\"降低 85% 截肢\"属该协会的宣称数据，其精确性可商榷，但筛查本身的价值已确立。","o":"RJ-3037 · 专题·糖尿病篇·转载报道（PDF 第5~6页）"},{"t":"五、中医论治糖尿病足","h":"血瘀病机与三味抗凝中药","c":"方法——书中引陈恒民医师文，提供了较规范的辨证思路：\"根据糖尿病足发病的机理，**它属于中医学里血瘀的范畴。治疗上，以活血化瘀为其主要方式**。\"**药理层面的观察**：\"目前的中药研究中，可以发现，中药是透过各种不同层面，来治疗血瘀症问题。其中某些药物具有**类似 coumadin 或阿斯匹林的抗凝作用**，这其中包括大家所熟悉的**当归、丹参、川七**等。另外有一些药物，如**山栀子，甚至可以使失能的血管内皮细胞恢复功能**，此现象着实令人振奋。\"**复方疗效**：\"在一些复方的临床实验报告中，对于**周边血液灌流的改善、及糖尿病足伤口的愈合，乃至感染的预防，皆有显著的效果**。\"这一条的实用价值在于它点出了**三味药与一个特殊靶点**：当归（补血活血）、丹参（活血祛瘀、改善微循环）、川七（即三七，化瘀止血，止血而不留瘀）三者兼具\"抗凝\"与\"活血\"双重属性，与阿司匹林类单纯抗凝不同；而\"**山栀子恢复血管内皮功能**\"这一观察，对应的是糖尿病小血管病变的核心环节（内皮依赖性舒张功能丧失），恰是西医\"尚无有效治疗方式\"的那一类——这为中药介入提供了机制上的切入点。","o":"RJ-3038 · 专题·糖尿病篇·糖尿病足中药有潜力（PDF 第2页）"},{"t":"一、煎服规范","h":"\"不煮\"的三味药：芒硝、阿胶、大黄","c":"方法——《经典配方》反复标出三类**不可同煎**的药，其处理方式各异。**①芒硝**：大承气汤条下注\"**芒硝不要煮，待其他药煮好后，放入融化即可**\"（大黄20克、厚朴15克、枳实15克、芒硝10克）。**②阿胶**：胃癌方条下注\"**阿胶不要煮，待其他药煮好后再放入，调匀即可服用**\"（阿胶15克）。**③石膏**则相反——需**包煎**：大青龙汤治小儿发热条下注\"**石膏用棉布包好，和其他药一起煮**\"；越婢汤加半夏条下注\"**石膏用棉布包好再与其他药一起煮**\"。两组处理的原理不同：**芒硝、阿胶属\"溶入\"型**——芒硝为矿物盐类，久煎失效；阿胶为胶质，久煎粘锅且易附着他药，故均以药液溶化；**石膏属\"包煎\"型**——其为矿物，须煎出有效成分，但粉末易糊锅、刺激咽喉，故以棉布包裹后同煮。**这三条是煎药房最常出错的地方**：芒硝先下则失去泻下之力，阿胶先下则药液黏稠难以入口。","o":"RJ-3039 · 经典配方·大承气汤／胃癌方／大青龙汤／越婢汤加半夏（PDF 第6、9、5、7页）"},{"t":"一、煎服规范","h":"乌头类药的减毒法：蜜煎与\"切忌多服\"","c":"风险——书中对乌头的处理给出了完整流程与明确警告：\"治疗危重病人出现频繁吐口水、长时间低烧（出自《伤寒杂病论》——**大乌头煎**）：**乌头 30 克**。注：**用三碗水煮成一碗，煮好后放入一碗蜂蜜，再煮成一碗**。**每天服用乌头蜜一调羹，切忌不可多服！（乌头有剧毒）**\"这一流程的三个环节各有作用：**先水煎**——使乌头碱部分水解；**加蜜再煎**——蜂蜜既解毒又缓急，且能延长药效、便于服用；**限量**——\"一调羹／日\"\"切忌不可多服\"。**必须强调**：乌头（含川乌、草乌、附子）所含乌头碱属剧毒，**极少量即可引起心律失常甚至死亡**，其安全剂量与煎法须由有资质的中医师严格掌握，**任何情况下不可依书本自行配制或加量**；现代药典对川乌、草乌的内服用法有严格限制（多需制用、先煎、久煎），与本方所述并不等同。此条仅作古籍煎法记录，不构成用药指导。","o":"RJ-3040 · 经典配方·大乌头煎（PDF 第6页）"},{"t":"一、煎服规范","h":"丸剂的制备与用量调节","c":"方法——书中多处涉及丸剂的加工与服法，可归纳为一套操作规范。**加工**：\"到药房将以上几味药**加工成药丸**\"（麻子仁丸）。**用量**：\"如果是 **6 克以上的大丸，每天 3 次，每次 1 丸**；若是**小丸，适量增加即可**\"；乌梅丸条则注\"将以上药到药房**加工成 6 克药丸，每日三次，一日一丸**\"。**调节原则**（麻子仁丸条，最重要）：\"**服用后如果出现大便次数猛增，适当减量；若大便仍不通畅，可以酌情加量**。\"这条原则体现的是**\"以排便反应为反馈信号\"的剂量滴定法**——丸剂不比汤剂可随时改方，故以\"大便次数\"作为加减的唯一指标：**过则减、不及则加**。另有一条极小的细节：皂荚丸\"加工成**地黄丸大小的蜜丸**，每日三次，每次一丸，**用红枣汤送服**\"——以红枣汤送服峻药，取其护胃之意。","o":"RJ-3041 · 经典配方·麻子仁丸／乌梅丸／皂荚丸（PDF 第6、3、7页）"},{"t":"二、同症异治","h":"便秘四方：以舌苔、小便、腹痛、矢气分判","c":"方法——这是《经典配方》中最精彩的鉴别组，四方同治便秘，仅凭四症分工。**①大黄附子细辛汤**（大黄15克、炮附子15克、细辛10克）——\"治疗**舌苔白、小便淡白、小腹无异常**的便秘\"。**②大承气汤**（大黄20克、厚朴15克、枳实15克、芒硝10克）——\"治疗**舌苔黄、小便黄、小腹胀痛、无屁**的便秘\"。**③厚朴三物汤**（厚朴20克、大黄10克、枳实15克）——\"治疗**舌苔黄、小便黄、小腹痛、屁多**的便秘\"。**④小承气汤**（大黄20克、厚朴10克、枳实10克）——\"治疗**舌苔黄、小便黄、小腹胀、屁多**的便秘\"。分判逻辑清晰可循：**舌苔白／黄**定寒热——白属寒，用附子细辛温通；黄属热，用三承气类攻下。**小便淡白／黄**再确认寒热与津液状态。**有无矢气**定燥屎是否阻闭——**无屁**者燥屎内结、肠气不通，须大承气峻下；**屁多**者肠气尚通、结聚较轻，用厚朴三物汤或小承气。**痛与胀**之别则更细——\"小腹胀\"用小承气，\"小腹痛\"用厚朴三物汤。这一组四方、四症、四方的对应关系，是\"同症异治\"最完整的示范。","o":"RJ-3042 · 经典配方·便秘四方（PDF 第6页）"},{"t":"二、同症异治","h":"咳嗽二方：舌苔黄厚与白的对立","c":"方法——同书对咳嗽的处理同样以舌苔为枢。**皂荚丸**（皂荚40克）——\"治疗**有舌苔发黄且厚现象的咳嗽**\"；**射干麻黄汤**（射干15克、麻黄15克、生姜4片、细辛15克、紫苑15克、款冬花15克、大枣7枚、半夏15克、五味子15克）——\"治疗**有舌苔发白现象的咳嗽**\"。两方的性质截然相反：皂荚丸为**峻猛涤痰之剂**（皂荚辛咸、涌吐痰涎），适用于痰浊壅盛、苔黄厚腻者；射干麻黄汤为**温肺化饮之剂**（麻黄、细辛、半夏、五味子），适用于寒饮内停、苔白者。**注意两方的剂型差异**：皂荚丸作蜜丸、以红枣汤送服（缓其峻烈、护其胃气），射干麻黄汤为汤剂（需快速温散）。另有一条相关的分层：**小儿流鼻涕且咳嗽**——\"**发热且舌苔发黄者：大青龙汤**\"（麻黄10克、杏仁10克、石膏20克、炙甘草10克、桂枝15克、生姜2片、大枣10枚），即在小儿外感中，\"舌苔发黄\"同样被用作从寒证转向热证的判据。","o":"RJ-3043 · 经典配方·皂荚丸／射干麻黄汤／大青龙汤（PDF 第7、5页）"},{"t":"二、同症异治","h":"肺气肿的三阶与脉浮脉沉之分","c":"方法——书中对同一病（肺气肿）按阶段与脉象分三方：**①早期**——\"**越婢汤方加半夏**\"（麻黄20克、石膏15克、生姜3片、甘草10克、大枣12枚、半夏10克，注\"石膏用棉布包好再与其他药一起煮\"）。**②中晚期·脉浮者**——\"**厚朴麻黄汤方**\"（厚朴25克、麻黄15克、石膏15克、杏仁15克、半夏15克、干姜10克、细辛10克、小麦2调羹、五味子15克）。**③中晚期·脉沉者**——\"**泽漆汤方**\"（半夏15克、紫菀25克、生姜5片、白前25克、甘草15克、黄芩15克、人参15克、桂枝15克、红大戟15克）。三方的递进逻辑是\"**由表入里、由气入水**\"：早期病浅在肺卫，用越婢汤开表清里；中期脉浮表示病仍偏表、气机不利，用厚朴麻黄汤宣降并行；脉沉则表示病已入里、水饮内结，用泽漆汤逐水（含红大戟这一峻下逐水药）。**\"脉浮／脉沉\"在此成为选择攻邪力度的开关**——浮则轻宣，沉则峻逐。另有一条更细的分判：**胸闷且平躺加剧、不口渴**——\"**茯苓杏仁甘草汤方**\"（茯苓15克、杏仁20克、甘草5克），属水气上逆之轻证。","o":"RJ-3044 · 经典配方·肺气肿三方／茯苓杏仁甘草汤（PDF 第7页）"},{"t":"三、外治与食疗","h":"跟骨骨刺的外洗法","c":"方法——一条纯外治的处方：\"治疗**跟骨骨刺**（出自《本草纲目》）——**白术 50 克**。注：**用水煮取一盆，将患处浸于盆中，每日 3 次，每次半小时**。视病情轻重，**快则一两周，慢则两三月，即可好转**。\"此条的价值在于三点：**①单味药**——只用白术一味，不配合内服；**②外用而非内服**——煎取药液浸泡，避开了白术内服量大易致腹胀的问题；**③频次与时长的明确量化**——每日3次、每次半小时、疗程一两周至两三月。这套参数可以直接照做，也是全书中最\"可复制\"的一类条目。同类外治尚有**白癜风方**：芝麻油30毫升＋白酒30毫升，\"混合后**每次服20毫升，一日三次，两个月为一疗程**，服药期间**忌食生冷和鱼、肉、鸡**\"（注\"芝麻油有些地方称香油\"）。","o":"RJ-3045 · 经典配方·跟骨骨刺／白癜风（PDF 第6、3页）"},{"t":"三、外治与食疗","h":"孕产妇的四阶段保胎方","c":"方法——书中按孕程分四段给出用方（总注\"出自《伤寒杂病论》——桂枝汤、当归散、白术散、当归生姜羊肉汤\"）。**①孕期 1~2 个月**：**桂枝汤**（桂枝10克、炙甘草10克、白芍10克、生姜4片、大枣12枚）。**②孕期 2~6 个月**：**当归散**（当归250克、黄芩250克、芍药250克、川芎250克、白术125克），注\"以上诸味药**研磨成粉，一日四次，每次一汤勺**\"。**③孕期 6 个月到产前**：**白术散**（白术100克、川芎100克、蜀椒100克、牡蛎100克），同法研粉服用。**④哺乳期**：**当归生姜羊肉汤**（当归15克、生姜4片、羊肉500克）。四段的用药重心递变清晰：**前段安胎以调和营卫**（桂枝汤）；**中段以养血健脾清热**（当归散，黄芩清胎热、白术健脾）；**后段以温中健脾固胎**（白术散，蜀椒温中、牡蛎固摄）；**产后以温补**（当归生姜羊肉汤）。其中当归散、白术散皆作散剂少量频服（一日四次、一汤勺），属\"缓补\"之法，与汤剂的\"顿服\"不同。","o":"RJ-3046 · 经典配方·孕产妇保健处方（PDF 第4~5页）"},{"t":"四、糖尿病基础方","h":"两个基础方与出处","c":"方法——《经典配方》为糖尿病列出两个基础方，且均标明出处。**处方一**：\"出自《**辅行诀五脏用药法要**》——**大补肝汤**\"：桂枝47克、干姜47克、五味子47克、旋复花16克、代赭石16克、竹叶16克、大枣12枚。**处方二**：\"出自《伤寒杂病论》——**乌梅丸方**\"：乌梅300个、细辛94克、干姜156克、黄连250克、当归63克、炮附子94克、蜀椒63克、桂枝94克、人参94克、黄柏94克，注\"将以上药到药房**加工成 6 克药丸，每日三次，一日一丸**\"。这两个处方的选择本身传达了一个判断：**糖尿病在经方体系中不取\"滋阴清热\"一路，而取\"厥阴\"一路**——乌梅丸是《伤寒论》厥阴病主方（治\"消渴，气上撞心，心中疼热\"），大补肝汤亦属肝（厥阴）之方。这与《金匮》消渴篇以肾气丸、白虎加人参汤为主的取向形成互补：**前者从厥阴（肝与心包）论治，后者从少阴（肾）与阳明（胃）论治**。另需注意两方的剂型差异——乌梅丸为丸剂缓图，大补肝汤为汤剂，适用于不同阶段。","o":"RJ-3047 · 经典配方·糖尿病基础方（PDF 第3页）"},{"t":"一、健康标准","h":"倪海厦的\"正常人\"六项体征","c":"定义——倪海厦诊疗的起点不是\"你得了什么病\"，而是\"正常人应该是什么样\"。以下六项在多个医案中被反复用作判据与疗效终点：**①手脚温热**——\"你双脚一定是冷的，对不？\"（舌癌案）；\"当手脚温热起来后……你就可以停药了\"；反证是\"你太太与女儿都穿短袖，只有你穿厚衬衫加上夹克……表示你体内已寒\"。**②一觉到天亮**——\"当你……又睡觉可以睡通宵……这就是你恢复过来了\"；失眠被直接读作\"心脏有问题\"。**③每天须刮胡须**——\"你唇口已经没有刮胡子的痕迹……你已经有段时间不需要去每天都要刮了\"，视为阳气衰、残渣无力外达皮毛之征；恢复的标准是\"又每天须要刮胡须\"。**④耐寒与人同**——\"可以让你跟你太太女儿们穿同季的衣服\"。**⑤大便通畅**——医案中\"便秘\"被列为必问项。**⑥胃口与味觉嗅觉正常**——肝癌案以\"胃口很好，嗅觉恢复，味觉也好\"为好转标志。这六项的共同特征是**全部可自行感知、不需要仪器**，构成一套\"患者可自查的健康仪表盘\"。","o":"RJ-3048 · 诊疗医案 0606（PDF 第1~5页）"},{"t":"二、诊断方法","h":"望闻问三诊：与\"靠切脉治病\"的对立","c":"要点——倪海厦对诊法的主次有极鲜明的立场：\"**正统中医是唯有利用望、闻、问三诊来断病的医师，才是真正能够治病的医师，靠切脉看病的医师是治不好病的**。所以患者只要能够对正统中医说明白你身体的感觉，我们利用问诊也是一样能够改善你的病，根本不需要看到你的。\"他甚至把\"不摸脉就断病\"当作能力的证明——在舌癌案中，患者尚未开口，他已从望诊（肤色、衣着、唇口无须痕、舌色）完成判断。**与之配套的是对\"病人自述西医名词\"的排除**：\"就怕你只会跟正统中医尽说一些西医的名词，什么胆固醇过高，什么血糖过高，血压过高等等，是完全济于事的。\"他要求患者描述**自身的感受**（冷热、睡眠、二便、胃口），而非**检验数值**。**须说明**：这套主张有其合理内核——望闻问所得的是\"人的状态\"，而数值只是\"指标\"；但\"靠切脉治不好病\"之论失之绝对，四诊本应互参，切脉在脉象辨证中不可替代。","o":"RJ-3049 · 诊疗医案 0606（PDF 第1~2页）"},{"t":"二、诊断方法","h":"第五椎压痛：心脏的触诊窗口","c":"方法——这是倪海厦在红斑狼疮案中使用的一个具体触诊法，也是其诊断体系中最可操作的一项：\"**再查她第五椎下有强烈压痛点，我诊断结束了**。\"即**按压第五胸椎（T5）棘突下方，若出现强烈压痛，即为\"心火过剩\"之征**。他在该案中给出的病机链条为：\"**心脏与心包相连，而心包与三焦互为表里。甲状腺是属于三焦问题**……这病人根本就是吃这西药太久，这西药毒素已经伤害心脏，所以失眠；心脏受伤，于是**奶水无法全部下行进入子宫成为月经，于是过多的奶水回逆入心**，就好像火上加油般，所以病人燥热难当；而奶水是无法一下就进入心脏的，须要时间，此时这些**过盛的营养就会到四肢里，所以会很痛**。\"由此，\"第五椎压痛\"成为**从背部触诊反推心脏状态**的一个锚点。此法的价值在于**给了\"心病\"一个可触摸的体表定位**（T5 对应心之俞穴心俞所在节段）；须注意，压痛本身不具特异性，胸椎局部病变、肌肉劳损同样可引起压痛，不可单凭此项断病。","o":"RJ-3050 · 诊疗医案 0606（PDF 第3~4页）"},{"t":"三、病机推演","h":"心—小肠—三焦轴的推演（以舌癌案为例）","c":"要点——舌癌案完整展示了倪海厦的推演方式，从体表征象一路推到病位。**起点（望诊）**：皮肤泛黄、形瘦、同环境下独穿厚衣、唇口无须痕、舌上肿瘤呈黄色。**第一推**：\"你感觉冷，她们没有……**表示你体内已寒，因为心火不够旺，所以连带小肠火也衰**。\"**第二推**：\"**心脏是君主之官，本不受病，因此心包受病，而心包与三焦是相表里**，因此这残渣无法入心，而**只能到舌头为止**，无法透露出皮层变成胡须。\"**第三推（色诊）**：\"我一看你的舌头肿瘤呈现**黄色，这是中医的三焦原色**。三焦是汽化的营养流行的组织，正常人是不会积在一处的，现在居然屯积在你的舌头上……因此表面色黄。\"**第四推（验之以症）**：\"中医又如何知道它不够热？**我们不需要什么温度计插入小肠来测知，你双脚一定是冷的**\"；\"当心脏有问题时你会失眠\"；\"因为你心脏与小肠温度下降，所以你的造血功能出现问题，西医一定说你贫血了\"。**推演终点**给出了可验证的好转标准（手脚温热、须刮胡、睡通宵）。这一链条的方法论意义是：**每一环都以\"可观察的体表征象\"接续，不依赖内部检查**，故可被外人复核。","o":"RJ-3051 · 诊疗医案 0606（PDF 第1~2页）"},{"t":"三、病机推演","h":"奶水逆流：月经与奶水同源的病机模型","c":"定义——这是倪海厦解释妇科与乳房、乃至多种癌症来源的核心模型，在多份医案中反复出现：\"**心脏受伤，于是奶水无法全部下行进入子宫成为月经，于是过多的奶水回逆入心**\"；\"**这月经跟奶水是同源**\"；\"目前唯一就是咳嗽仍有一些，胸部双乳胀痛，而且延伸到右臂下方的极泉穴位，**这就是我常说的奶水胀满的现象**\"；\"我每次治这类癌症到尾声时，都会出现咳嗽症状，**这是奶水逆流准备入肺所造成，是疾病在做最后挣扎阶段**\"。其推论链为：**奶水（哺乳期）／月经（非哺乳期）为同一物质的不同出口**→ 心脏（火）不足则下行之力弱 → 奶水不下行而逆流 → 逆流入心（燥热、失眠）、入肺（咳）、积于乳房（胀痛、肿块）→ 故治乳癌、肺癌、脑瘤、淋巴癌皆须从\"心—奶水\"这条轴入手。**须明确说明**：此说属倪氏个人学说，与现代解剖生理学（乳腺与子宫内膜分属不同内分泌轴，月经非\"奶水下行\"）不符，**不可作为现代诊疗依据**；但其\"身心相关、治乳癌须顾及月经周期与心脏功能\"的整体观，仍有可借鉴处。","o":"RJ-3052 · 诊疗医案 0606（PDF 第3~6页）"},{"t":"四、重症辨证","h":"厥阴死症与\"症变入太阳即愈\"","c":"方法——肝癌兼肺癌案展示了倪海厦用六经框架判断重症预后与节奏。**初诊症候群**：\"咳血，无法平躺，无胃口，便秘，无体力，无味觉嗅觉，感觉人生乏味，四肢冰冷，夜间更冷。**所有症状都在厥阴**。\"**治疗过程中的动态定位**：\"自始到今我都是依据六经辨症来辨症论治，**目前病人是处在少阳与太阴之间**，一旦症变进入太阳，病人就会提早好转；**如果夏至日时仍然未现太阳症，就有可能延后**。\"**时间因素**：\"下个季节将是夏季，**夏主心，心为火，是君主之官，心不受病**，因此她如果无任何意外，将于**夏至之前后**应该就会完全恢复。\"这条判据的结构值得注意：他把**\"症从三阴转出三阳\"视为好转的方向**（由里出表），并以**节气（夏至）作为疗效的观察终点**——这与《伤寒论》\"阴阳自和者必自愈\"的思路一致，但**以节气定时限**则属其个人推演，缺乏可验证性。","o":"RJ-3053 · 诊疗医案 0606（PDF 第5页）"},{"t":"四、重症辨证","h":"重症的攻补节奏：\"重症下重手，累积一去立刻补强\"","c":"方法——同案中倪海厦自述用药的节奏控制：\"期间使用过**十枣汤、甘遂半夏汤、四逆汤**等等，一方面**排水毒**，一方面**攻坚**，一方面**补充体力**，一方面**顾到排便**，加上**强心补肾**；这些中药的交互使用，**重症出现我就下重手，累积一去，立刻补强，时常是间不容发**。\"归纳其节奏为三步循环：**①识别\"重症出现\"**（如腹水复发、脉数一息八至、心下痞闷）→ **②果断用峻药**（十枣汤逐水、甘遂半夏汤攻痰、四逆汤回阳）→ **③邪去一分即刻补虚**（补脾胃、增气血），不待其虚极。另有一条具体的险候判据：\"**如果吐血出来，表示血脉破裂，病势将加重**\"。这一\"攻—补交替、以邪之进退为节拍\"的思路，比\"攻补兼施\"的笼统说法更接近实际操作：**它的关键不是同时攻补，而是交替进行，且切换要快**。","o":"RJ-3054 · 诊疗医案 0606（PDF 第3、5页）"},{"t":"五、治疗预期","h":"恢复期的经验值：西医未介入者更快","c":"数据——倪海厦在多案中给出恢复期的经验估计，且反复强调一个前提变量——**是否经西医干预**。**血癌**：\"此君因为**西医没有介入**，在进入**第四周**疗程时，我就找不到血癌的踪迹……一般我们治血癌约须**四周左右**就足够了。\"**摄护腺癌**：\"就比较慢了，**端视病情深浅，与是否有先经过西医胡搞过**；举凡西医没有碰过的病人，一般而言**恢复期都很短**。\"**红斑狼疮**：\"目前治疗已经发病被西医查出得到 Lupus 的病人，我约耗时**55 天**左右；这未发病之时就得到正确的治疗，可能**连一个月都不须要**就可以改善。\"**舌癌**：\"今天是**第七次复诊，已经历时六周**，肿瘤已经缩小一半以上，而且会移动，以前是硬梆梆的，现在软许多了。\"这些数字的用法须谨慎：它们是**单个医者对自身病例的印象式汇总，未说明样本数与判定标准**（如\"找不到血癌的踪迹\"依据何项检查），不能作为疗效的客观证据；但其内部一致的规律——**恢复期与西医干预程度负相关**——反映了倪海厦本人的临床信念。","o":"RJ-3055 · 诊疗医案 0606（PDF 第4~7页）"},{"t":"六、食疗","h":"癌症病人的饮食原则","c":"方法——倪海厦对重症患者的饮食给出具体清单：\"我建议病人**每天喝葡萄、菠萝、苹果等新鲜果汁，要自己做的**，还有**多吃全麦面包或中国的糙米，与大量的蔬菜及鱼类**，**肉类以羊肉为主，牛肉为辅，因为红肉可以补血**。任何癌症病患的饮食非常重要，而现在西医医院里的伙食，对病人来说是毫无用处的。\"可归纳为四条：**①鲜榨果汁**（自做，非市售）——补充天然糖分与维生素；**②全谷物**（全麦面包、糙米）替代精制米面；**③大量蔬菜与鱼类**——优质蛋白与纤维；**④红肉以羊肉、牛肉为主**——取其\"补血\"。这与他在糖尿病专题中\"七分饱、少油炸、不消夜\"的主张同属一类：**以天然、少加工、不过量为总原则**。须说明的是，\"红肉补血\"之说在现代营养学中并非优选（红肉摄入与部分癌症风险相关），癌症患者的营养方案应由临床营养师个体化制定。","o":"RJ-3056 · 诊疗医案 0606（PDF 第5页）"},{"t":"七、立场","h":"对温病派\"卫气营血\"辨证的批评","c":"要点——倪海厦在重症医案中数次把矛头指向温病学派，其批评有具体的技术内容，值得单独记录：\"南方温病派中医呢？我保证他们一看到这类病人，立刻直觉反应就是送西医治，然后再加强语气告诉病人，此病中医只能为辅，必须西医为主……**因为他们都依据温病派的卫气营血来做辨症，自己都搞不清楚病人在什么阶段**，同时他们在大陆时就已经被西医教育的根深柢固，**诊断学都像西医要看验血报告与 X 光片**，所以他们治不好病。\"其批评的三点是：**①卫气营血的分层不如六经明确**（他认为温病派说不清病在何层）；**②依赖检验报告而非四诊**；**③遇重症即退让**。他对经方家的褒扬则点名具体人物：\"如果发生在大陆人士，我建议你们可以找两位中医，一位是**刘力红**，另一位是**郑友文**中医，这些都是经方家。\"**须说明**：卫气营血辨证（叶天士）在温热病领域有其独立价值，与六经辨证各有适用边界，不宜以一方否定另一方；此处的对立更多反映的是**经方派与温病派的学派之争**，而非单纯的优劣判断。","o":"RJ-3057 · 诊疗医案 0606（PDF 第5~6页）"},{"t":"一、进补的根本原则","h":"\"补能恋邪\"：便秘者不可进补","c":"定义——这是倪海厦论补法的第一原则，原文表述完整：\"中医的理论是'**补能恋邪**'，**食补是要在平日就要做到的**，选择质量好的食物，正确的煮熟，**在食补的同时必须注意排泄的问题**，正常人是每天都要有大便的；你或妳如果有便秘习惯，**就必须先改善它**，否则你本身有便秘，此时又大量进补，**其结果必然适得其反**。\"**其机制说明**：\"**任何的营养进入人体只有 24 小时可以吸收，一旦超过 24 小时，营养就会坏死掉**，因此**便秘就会造成更多毒素的累积于人体内**，所以**有便秘的人绝对不要吃补**——因为补药进入身体时是好的是新鲜的，但是因为你的便秘导致停留身体内过久，**反而是毒药**。\"这条原则的价值在于它把\"进补\"从\"吃什么\"转成了\"能不能吸收、能不能排出\"的问题：**进补的前提是通畅**。所谓\"补能恋邪\"，即补益之品会留恋邪气，使邪不易去——故**有实邪（含宿便、痰湿）时进补，等于资敌**。这一判断可直接用于日常：凡便秘、苔厚、腹胀者，先通再补。","o":"RJ-3058 · 专题·维他命篇·评论（PDF 第2页）"},{"t":"一、进补的根本原则","h":"原药材与提炼物之别：\"吃苹果，不要吃苹果丸\"","c":"要点——倪海厦对\"剂型\"有极严格的要求：\"**补药是须要使用原始药材来煮，或打粉加蜜烘焙而成的**，如此**药性才不会流失**；**一旦经过提炼或者精炼的手续，则药性全失**，反而会因为正常人体组织无法吸收，而成为毒药。\"**他用的比喻**：\"这就好像**吃苹果是很营养的**，但是**苹果如果用化学来分析，可能由上百种不同物质成份的组合而成的**；如果你只取一部份然后再浓缩成小药丸，**就变成毒药了**。依此类推，我们应该花时间去**直接吃苹果，而不是去买苹果丸吃**；所以**多喝橘子汁来取得维他命C 才是正确的**，千万不要吃维他命C 丸药。\"这一论断的核心是**\"整体 vs 分离\"**——天然食物的营养以复杂基质的形式存在，各成分间有协同与制约；分离提纯后，剂量、比例、伴随物质全部改变，其生理效应也随之改变。这一思路在营养学上确有对应（如\"食物基质效应\"food matrix effect），但\"提炼即毒药\"的表述过于绝对——许多药物（含中药有效成分）正是通过提取才得以精准使用。","o":"RJ-3059 · 专题·维他命篇·评论（PDF 第3页）"},{"t":"二、对营养补充剂的批判","h":"维他命C 片剂：肾结石与血管剥离","c":"风险——倪海厦对维他命C 片剂的批评包含三部分。**①药理风险**：\"美国去年的全美医学会议才报导过，**维他命C 药片会导致动脉血管剥离**。\"**②临床观察**：\"我在临床上发现**许多得到肾结石的病人，就是不断服用维他命C 造成的**。此地有位牙医，一生不吃任何维他命，也不生病；有一天他太太买了最新的维他命C 片产品，他服用了**约两星期就得到肾结石**。我把它清除后告诉他是因为他服用维他命C 的关系，于是他**打电话到药厂去问，得到的答复是有可能的，他们也不清楚**。\"**③剂量—效应的观察**：\"我就有许多病患来找我，因为肾结石及乳癌，结果我发现**吃维他命C 越多，肾结石越严重，乳房肿瘤也越大**。\"**须明确说明**：维生素C 在常规剂量下安全性高；**大剂量（通常指每日 1 克以上长期服用）确可增加草酸钙结石风险**，这一条有现代依据；但\"导致动脉血管剥离\"与\"使乳房肿瘤增大\"两说缺乏可靠证据，不应据此推断。**可采纳的部分是**：以天然果蔬替代片剂补充，这一建议本身合理。","o":"RJ-3060 · 专题·维他命篇·评论（PDF 第2页）"},{"t":"二、对营养补充剂的批判","h":"高钙食品与钙片：过多则反伤骨","c":"要点——针对\"高钙\"\"低脂\"的风潮，倪海厦的批评有两个层次。**①标示不可信（此为其引述的实测数据）**：消基会抽验 67 件宣称高钙的包装食品，\"**宣称高钙的包装食品必须达到每百公克 240 毫克钙含量标准**，但测试结果，**17 件宣称高钙的包装食品中，有 7 件（占 41%）未达规定值**\"；\"宣称添加或配合钙质的共有 19 件，其中**有 15 件样品连'含有'钙质的标准都未达到**\"；\"**固体食物的高钙标示一定要符合每公克 240 毫克，液态食物则是每百公克 120 毫克**；至于低脂则**脂肪含量应在 1.5% 以下**才算低脂\"；\"成人钙质摄取量**每天为 1000 毫克，上限摄取量为 2500 毫克**\"。**②他的医学判断**：\"**我们并不需要那么多的钙，摄取过多的钙只会造成肾结石**；而且这些**人工钙不但不能补充骨质**，所有的国外研究显示出，**它反而会使骨头更脆弱**，没有证据显示会有助骨质。因此我们必须回到过去，**多喝豆浆、多煮骨头汤喝、多吃芝麻等含天然钙质的食物最好**。\"**须说明**：钙与骨密度的关系在主流研究中是\"补充钙可减缓骨丢失\"而非\"使骨更脆弱\"，其表述有偏；但\"优先从食物（豆制品、芝麻、骨汤）取钙\"的建议与主流营养学一致。","o":"RJ-3061 · 专题·维他命篇·评论（PDF 第4~5页）"},{"t":"二、对营养补充剂的批判","h":"\"过敏\"作为诊断词的失效","c":"要点——倪海厦对西医术语\"过敏\"有一句广为流传的评断：\"**只要是西医对你说二字'过敏'，就表示他不知道你怎么回事**——反正诸错皆因你而起，他们永远都不会错的，只是不知道你到底怎么而已，要怪就怪你的身体太不争气，老是'过敏'。\"此言虽刻薄，却指出了一个真实的医学现象：**\"过敏\"与\"特发性\"（idiopathic）类似，常被用作\"机制未明\"的占位词**。他由此给出的建议是\"**永远不要吃人工合成的维他命**\"——过敏事小，这类人工合成的化学药物会要你的命才是大事；\"**我们要学会不可挑食，要从各种不同的食物中吸取各类的营养才是正确的**\"。**须说明**：过敏（尤其是严重过敏反应 anaphylaxis）是有明确免疫学机制与急救路径的病理状态（IgE 介导的肥大细胞脱颗粒等），绝非\"医生不知道\"；此处若照其字面理解，可能延误严重过敏的救治。其可采纳的内核是：**不要用\"过敏\"一词替代具体的机制探究**。","o":"RJ-3062 · 专题·维他命篇·评论（PDF 第3页）"},{"t":"三、替代方案","h":"天然取营养的四条路径","c":"方法——把散见于各篇评论的正向建议归拢，可成四条：**①果汁替代片剂**——\"**多喝橘子汁来取得维他命C 才是正确的**\"\"最好的取得维他命C 方式是喝橘子汁，毫作用相对平和\"；**②豆制品与骨汤替代钙片**——\"多喝豆浆、多煮骨头汤喝\"；**③坚果种子类**——\"多吃芝麻等含天然钙质的食物\"；**④不挑食**——\"我们要学会不可挑食，要从各种不同的食物中吸取各类的营养\"。另有一条与糖尿病专题相通的饮食原则：\"**我们应该花钱去买优良质量的食物来吃**，而不是浪费钱去买完全无效而且伤人的营养剂，来做自以为是的补充营养方式。\"这四条的共同逻辑是**\"以食物的完整性替代营养素的分离性\"**——与前述\"苹果与苹果丸\"之喻完全一致，构成一个自洽的饮食观：**吃食物，不吃营养素**。","o":"RJ-3063 · 专题·维他命篇·评论（PDF 第2~5页）"},{"t":"四、体例说明","h":"剪报评论：这种文体的价值与局限","c":"要点——《维他命篇》《糖尿病篇》《乳癌篇》《肝癌篇》《艾滋病篇》五部专题，使用的都是同一种文体：**先贴一篇当时的报刊报道（多为转载自台湾地区报纸或中央社），再针对该报道逐段写下评论**。这一体例有两个特点：**①选题由外部报道触发，不由作者自主决定**——故其内容分布不均，某些主题（维他命C、高钙、SARS）反复出现，而系统性论述反而稀薄；**②立场以\"反驳\"为主**——评论的常态是\"看这篇报导，又是大笑话一桩\"，其力量来自对抗性，也正因如此，**论证常以断言代替举证**（如\"维他命C 会导致动脉血管剥离\"仅称\"美国全美医学会议报导过\"，未给出处）。读者使用这批材料时应把握两点：**其一，报道原文与其评论应分开看**——前者是可核查的当时资讯（含具体数据），后者是个人观点；**其二，可采纳的多为\"原则\"而非\"结论\"**——如\"补能恋邪\"\"吃食物不吃营养素\"\"先通再补\"属原则层面的洞见，而具体的药理断言（致血管剥离、致乳癌增大）需另找证据。这一体例也解释了为何五部专题的篇幅虽大（维他命篇 8.2 万字、糖尿病篇 5.2 万字），但可直接提炼的知识点密度低于人纪五经。","o":"RJ-3064 · 专题·维他命篇（PDF 第1~59页）"},{"t":"一、病案框架","h":"问诊十二项：一套固定的取信息清单","c":"方法——倪海厦的病案记录有固定的问诊编号，据多份病案可复原如下：**1 睡眠；2 胃口；3 大便；4 小便；5 口渴；6 手足温度；8 问汗；10 头身；12 其他**（编号有空缺，实际使用的约十项）。每一项都有明确的判读意义，而非泛泛一问：**睡眠**——\"心脏有问题你会失眠\"，故睡眠是心之窗口；**胃口**——胃气之有无；**大便**——每日行否、成形否、颜色；**小便**——频、急、痛、色（淡白／淡黄）；**口渴**——有无、喜温饮或冷饮、夜间口干；**手足温度**——\"双足温／双足不冷／手足温\"，这是其判断里寒外寒的核心指标；**问汗**——有汗无汗、何处有汗（如\"右侧脸仍无汗出\"可定位病侧）；**头身**——头痛、身痛、睡时寒热；**其他**——体力、记忆、特殊感觉。这套清单的价值在于**可重复、可对照**：同一患者前后两次的记录逐项相比，即见进退。这也是中医问诊\"十问\"的具体化。","o":"RJ-3065 · 临床医案 0805（PDF 第2~6页）"},{"t":"一、病案框架","h":"脉诊：重按辨虚实","c":"方法——脉诊中有一条极简的虚实判据：\"**肾脉重按则无，表示没有实证；如果重按仍有，乃是实证。**\"即**轻按得脉、重按即散者为虚**（正气不足，脉不耐按）；**重按仍有者为实**（邪气内结，脉沉而实）。这一条把\"浮沉虚实\"压缩成一个可当场操作的动作——**加力按压，看脉是否仍然存在**。另一处记\"脉沉有力\"配\"中焦有寒水\"之诊断，可见其脉诊并非孤立使用，而是与问诊、望诊合参。","o":"RJ-3066 · 临床医案 0805（PDF 第2、4页）"},{"t":"一、病案框架","h":"望诊三个窗口：舌、眼、耳","c":"方法——病案中的望诊分三处记录，各有其定位功能。**①舌诊**——记\"外围一圈色红无苔，中央淡黄湿\"\"淡黄湿\"\"淡黄湿裂痕\"；其中\"**中央**\"对应**中焦**（脾胃），\"**外围一圈色红无苔**\"提示阴虚或津伤，\"湿\"与\"裂痕\"分别指水湿与津亏。**②眼诊**——这是倪海厦的独有诊法，记录极具体：\"**脾区过小，右眼肾区变形，心包有痰湿。瞳孔对光反应尚可**\"；另一案记\"**心区偏大**（**阳不足，则无法固守阴，故心区偏大**）\"——即眼部被划分为对应脏腑的\"区\"，**以区域的大小、形态、色泽判断对应脏腑之虚实**，且\"右眼肾区\"的**单侧定位**可对应单侧脏腑（此案即诊断为\"右肾变形\"）。**③耳诊**——\"**右耳肾区压痛**\"，与眼诊的右肾变形互相印证。三诊合看，其诊断路径是：**舌看中焦寒热湿燥，眼看脏腑形态虚实，耳按确认对应脏腑之实**。","o":"RJ-3067 · 临床医案 0805（PDF 第2~4页）"},{"t":"二、用药注释","h":"处方里的\"药—用\"对照：按功能分组的现场标注","c":"方法——这是医案中最具教学价值的部分：倪海厦在每张处方下，用箭头标出**每一组药的用途**，形成\"药组—功效\"的直接对应。据一案原文（括号内为其原注）：**旋覆花三钱、代赭石三钱、吴茱萸二钱、干姜二钱 → 制酸降逆**；**细辛二钱、乌药五钱 → 温下焦，治尿急**；**黄芩三钱、阿胶三钱、黄连二钱、白芍五钱 → 补心血，安眠**；**柴胡三钱、郁金五钱、龙胆草五钱 → 疏肝，重用龙胆草解肝毒**；**白芷三钱、麦冬三钱、西洋参三钱 → 生金水，润肺，肺主皮毛，故能润皮肤**；**补骨脂三钱、泽泻五钱 → 补肾**；**桂枝三钱、炙甘草三钱 → 强心阳**；**三七三钱、续断三钱 → 活血化瘀，伤科用**。另有一案注\"**补骨脂三钱、牡蛎一两 → 补肾补钙补骨质**\"。这套注释的实用价值在于：**它把\"君臣佐使\"从抽象原则落到具体药对**——读者可以反查：见\"旋覆花＋代赭石\"即知在降逆，见\"桂枝＋炙甘草\"即知在强心阳，见\"三七＋续断\"即知在治伤。","o":"RJ-3068 · 临床医案 0805（PDF 第3、2页）"},{"t":"二、用药注释","h":"由症推药的现场判断","c":"要点——病案中有若干\"由一症直取一药\"的即时判断，最能见其思路。**①闻水声即思小便**——患者\"自诉听到水声则想要小便\"，倪海厦旁注\"（**同气相求**）\"，随即问\"肌肉是否有跳动\"，答\"否\"，\"**师曰：用半夏即可**\"——即以此症属水气内停（水饮内动），故取半夏去水。**②膝痛的两条选择**——患者\"右膝打太极拳时某一动作才会痛，平常走路上下楼梯都不痛\"，其判断是\"**二选一，1.不打太极拳 2.痛打到不痛**\"——即痛有定处而因特定动作触发者，属局部气滞，可通过持续活动（或治疗）使之散，不必避开。**③中药不会产生胃酸**——患者\"服前方后，胃酸产生\"，其解释是\"（**倪师：中药不可能产生胃酸，此必定是因为前方将胃修补好，但病人不注意饮食所致**）\"——即治疗后的\"新症状\"可能是功能恢复后的正常反应，须与副作用区分。**④半夏与干姜的分工**——\"（**半夏去水、干姜去寒**）\"，八字概括两味药的界限。","o":"RJ-3069 · 临床医案 0805（PDF 第3~4页）"},{"t":"三、选方的排除法","h":"从\"没有呕酸、不吃甜食\"排除旋覆代赭汤","c":"方法——这是医案中一次完整的鉴别示范，原文为：\"此女**没有呕酸且长期没吃甜食，故非旋覆代赭证**。他会恶心是因为**停经后奶水无法进入子宫，若停聚中焦造成呕**，**温经汤常用于更年期女性**。**子宫有血块，造成心热反逆的现象**，方中**吴茱萸亦可止呕**。\"其鉴别逻辑分三层：**①先用两个阴性症状排除**——\"无呕酸\"（排除胃酸上逆）、\"长期不吃甜食\"（排除甘味助湿致呕），两者并见则不属旋覆代赭汤证（该方本治\"心下痞硬、噫气不除\"）；**②再以病机定位**——停经后\"奶水无法进入子宫\"而停聚中焦，故呕由中焦水停而生，非胃本身之病；**③以方证对应收束**——温经汤本治妇人冲任虚寒、内有瘀血，恰合\"子宫有血块\"与更年期之身热，且方中吴茱萸兼具止呕之功，一举两得。**这一条的可学之处**是：**排除法先于选择法**——先把不属于的方证剔除，剩下的方自然浮现。","o":"RJ-3070 · 临床医案 0805（PDF 第5页）"},{"t":"三、选方的排除法","h":"由\"少阳走到太阳\"判断转方","c":"方法——一案记：\"病人**从少阳证走到太阳证**。**虽无恶风，但脉浮缓、有汗出，就可以用桂枝汤了**。\"此条展示了两层判断：**①六经传变的动态追踪**——同一患者在不同次就诊中，其证可由少阳转出太阳（即由半表半里转回表），这是\"退\"而非\"进\"，属好转方向；**②主症缺失时以脉证补足**——桂枝汤本证为\"头痛、发热、汗出、恶风、脉浮缓\"，此案**无恶风**，按常规不足以用桂枝汤，但因\"**脉浮缓、有汗出**\"两症俱在，故仍取桂枝汤。其依据是《伤寒论》\"**太阳病，脉浮缓，身不疼但重……无汗不可与**\"一类的反面推论——**有汗而脉浮缓，即营卫不和之的证，不必待恶风齐备**。这提示一条原则：**方证不必全备，但须有决定性的一两症**（此处为\"汗出＋脉浮缓\"）。","o":"RJ-3071 · 临床医案 0805（PDF 第6页）"},{"t":"四、剂型与剂量","h":"汤剂与粉剂：两种给法的分工","c":"方法——病案中同时出现两种剂型，其用法有别。**①汤剂**——\"五付，**九碗水煮三碗，早晚饭前**\"；剂量以\"钱\"计（三线、二钱、五钱、一两），并按功能分组。汤剂特点是**可随证加减**，故多用于证情变化较快、需要调整的阶段。**②粉剂**——\"**四百粉量，三餐饭前三茶匙**\"\"**温经汤粉 5 加半夏 1，粉剂 100 克，三餐前 三茶匙**\"；即以\"某方粉若干份＋单味药若干份\"配伍，按固定份量分服。粉剂特点是**组成固定、便于长期服用**，多用于证已稳定、需缓调者。**③丸剂**——另有\"**HT-89 健筋骨丸 六兩，30X2，午饭与睡觉前**\"，即倪海厦自有编号的成药（HT 系列），按\"六两\"总量配\"30X2\"（推测为 30 包×2 次）分服。三种剂型的分工可概括为：**汤剂治变动之证、粉剂治稳定之证、丸剂治慢性之证**。","o":"RJ-3072 · 临床医案 0805（PDF 第2~5页）"},{"t":"一、体系结构","h":"HT 系列：一百个编号方","c":"要点——倪海厦的方剂以\"**HT-**\"编号自成体系，据本讲稿目录，共 **100 个方剂**（编号 HT-1 至 HT-100，中间有跳号：HT-55~58、HT-75~76、HT-86、HT-91、HT-94 未见，故实存约 92 方）。**须先说明来源性质**：本讲稿是**他人讲授倪海厦方剂的录音整理**（开篇为\"喂，哎好，现在大家都能听到声音吧……我们今天主要讲述汉唐方剂\"），**不是倪海厦本人的著作**，故其观点须与倪氏原文区分。**编号制的意义在于**：这些方不是传统经方，而是倪海厦依经方法度自拟、经长期临床定型的**固定方**——一旦编号，即意味着**组成、剂量、主治皆已固定**，可按号取用。这与《经典配方》中\"某症用某方\"的即时处方不同：**HT 系列是可成药的标准化产品，经典配方是随证变化的处方**。","o":"RJ-3073 · 汉唐中医方剂讲解·目录（PDF 第1~4页）"},{"t":"一、体系结构","h":"病类分布：从皮肤到肿瘤的全覆盖","c":"要点——据目录可将 92 方按病类粗分，其覆盖面极广：**皮肤／皮科**（HT-16 皮肤干痒癣、HT-17 湿疹脓疮、HT-18 腰蛇胸蛇颈蛇（带状疱疹）、HT-72 浮萍方（小儿风痒疥癞）、HT-79 青春痘、HT-83 皮肤诸病、HT-85 外用青春痘之剂）；**情志／神经**（HT-19 情绪焦虑、HT-41 中安丸（失眠）、HT-67 失心丸、HT-70 定心丸（心肾不交，主症焦虑忧郁）、HT-71 清郁开结丸（肝脾失衡致沮丧）、HT-93 小儿过动症）；**消化／中焦**（HT-31 中焦湿热、HT-33 中焦湿热过盛兼便秘（阳明胃热）、HT-78 健胃散、HT-84 肝结石、HT-68 护肝丸）；**结石**（HT-26 石淋砂淋小便带血、HT-65 膀胱结石）；**骨关节**（HT-27 痛风丸、HT-28 风湿丸、HT-63 骨损症、HT-89 健筋骨丸（关节肌肉萎缩）、HT-100 历节丸）；**妇人**（HT-36 天青丸（痛经兼下身瘀血）、HT-60 强力天青丸、HT-38 玉华丸、HT-64 经停后身热盗汗易怒）；**男科**（HT-37 天威丸（元阳不足）、HT-47 重阳丸（精中带血）、HT-49 起阳丸、HT-66 摄护腺肥大、HT-82 下焦寒实之四逆症）；**代谢／内分泌**（HT-24 上中下三消渴症、HT-23 肝阳上亢肾阳不足、HT-80 减肥药、HT-92 增高丸）；**肿瘤／化脓**（HT-90 消瘤丸（大脖子病）、HT-95 拖里化毒饮（淋巴脓块、乳房脓块恶臭、阴道脓疡）、HT-96 乳癌外用粉剂、HT-73 透脓方）；**五官**（HT-34 补天丸（掉发耳鸣）、HT-39 鼻渊丸、HT-50 牙痛止痛剂、HT-51 白内障、HT-61 明目地黄丸、HT-81 鼻过敏合并头痛、HT-88 磁珠丸）；**其他**（HT-25 疏通经络剂、HT-30 足三阳经虚实痛、HT-32 乌金丸、HT-35 紫金丹、HT-43 麻子仁丸、HT-44 皂荚丸、HT-45 己椒苈黄丸、HT-46 六味地黄丸、HT-48 金匮肾气丸、HT-62 沉香桂附丸、HT-69 肾脏积水、HT-98 五石乌头丸、HT-99 斑龙丸）。**这一分布本身就说明了倪海厦的临床版图**：从最日常的青春痘、鼻过敏，到最重的肿瘤、肾衰竭，皆以同一套方剂逻辑处理。","o":"RJ-3074 · 汉唐中医方剂讲解·目录（PDF 第1~4页）"},{"t":"一、体系结构","h":"与西医学病名的对照标注","c":"要点——目录中对部分方剂附有与西医学病名的对照说明，这是 HT 系列的一个鲜明特色，也是倪海厦\"以中医统摄西医病名\"立场的体现。其标注方式有三类：**①直接对照**——\"HT-30 **足三阳经虚实痛（西医名坐骨神经痛）**\"\"HT-88 **磁珠丸（中医名白内瘴，青光眼与西医同）**\"\"HT-90 **消瘤丸中医俗名大脖子病（可以参考西医学之甲状腺瘤）**\"；**②以\"可比较\"提示而非等同**——\"HT-82 **下焦寒实之四逆症（可比较西医学之摄护腺癌）**\"\"HT-87 **中医之九种心痛之一（可与西医学之心脏肥大症做比较）**\"；**③以中医病名为主、西医仅为参考**——\"HT-23 肝阳上亢、肾阳不足\"\"HT-31 中焦湿热\"\"HT-70 **中医之心肾不交（主症是有焦虑、忧郁之情志）**\"\"HT-71 **中医之肝脾失衡导致沮丧情绪低落**\"。三类之中，**第二类\"可比较\"最需留意**：它明确表示两者**不等于**，只是病象有可参之处——这与他在别处将中医病名与西医病名直接对等的做法相比，更为谨慎。","o":"RJ-3075 · 汉唐中医方剂讲解·目录（PDF 第2~4页）"},{"t":"二、代表方剂","h":"HT-24：上中下三消渴症","c":"要点——HT-24 是全系列中直接对应糖尿病的一方，题名为\"**降血糖中医之上中下三消渴症**\"，在目录中占 **191—208 页**，篇幅远超其他方剂（多数方仅占 3—8 页），可见其份量。**\"上中下三消\"的分型**是传统消渴学的框架：**上消**（肺热津伤，多饮而渴）、**中消**（胃热，多食而饥）、**下消**（肾虚，多尿而浊）。倪海厦取此框架，与其在金匮消渴篇的方剂谱系（肾气丸、白虎加人参汤、五苓散等）互为表里——**《金匮》给的是单方，HT-24 给的是整合后的成药**。另需注意其命名中的\"**降血糖**\"三字：这是以西医学的指标作为方的诉求，与其在专题篇中所批评的\"只降指标\"恰成张力——即他反对的是\"以西药降指标而伤脏腑\"，并不反对\"以中药使指标复常\"。","o":"RJ-3076 · 汉唐中医方剂讲解·目录（PDF 第1页）"},{"t":"二、代表方剂","h":"HT-89、HT-100：关节与肌肉萎缩的两方","c":"要点——骨关节类在 HT 系列中自成一个小组，可见倪海厦对此类病的重视。**HT-27 痛风丸**、**HT-28 风湿丸**、**HT-63 中医学之骨损症**、**HT-89 健筋骨丸（关节肌肉萎缩）**、**HT-100 历节丸**，构成由浅入深的一条线：**痛风**（急性红肿热痛，属实）→**风湿**（慢性疼痛，属虚实夹杂）→**骨损**（骨质与结构受损）→**关节肌肉萎缩／历节**（形体败坏，属虚极）。其中\"**历节**\"为《金匮》原病名（\"诸肢节疼痛，身体尪羸，脚气冲心\"），HT-100 取此名，说明其制方仍以经典病名为纲。**HT-89 在临床医案中亦有实证**：一例右肾变形、骨伤的患者，除汤剂外即配\"**HT-89 健筋骨丸 六两，30X2，午饭与睡觉前**\"，与汤剂中的\"补骨脂、牡蛎（补肾补钙补骨质）\"相呼应——**汤剂治当前之证，丸剂固其根本**，这一汤丸并用的搭配在医案中反复出现。","o":"RJ-3077 · 汉唐中医方剂讲解·目录（PDF 第2~4页）／临床医案 0805（PDF 第2页）"},{"t":"二、代表方剂","h":"HT-95、HT-96：脓疡与乳癌的外用与内服分工","c":"要点——肿瘤与化脓类方在 HT 系列中分工明确。**内服**：**HT-95 拖里化毒饮**——\"**淋巴脓块、乳房脓块恶臭、阴道脓疡恶臭等症候**\"，从命名与主治可见其针对的是**已化脓、有恶臭的溃破性病灶**（\"拖里\"疑为\"托里\"之音转，托里排脓是外科内治的正法）；**HT-73 透脓方**——专主\"透脓\"，即促其成脓外透而非强行消散。**外用**：**HT-96 乳癌的外用粉剂**——这是全系列中少见的**纯外用方**，专为乳癌体表病灶设。**内外分工的意义**：脓已成者不可强行内消（消之则毒内陷），只能\"托\"与\"透\"，使其外达；体表溃破者则以外用粉剂直接处理局部。这一组与《金匮》疮痈篇的\"排脓六方\"（仙方活命饮、阳和汤、大黄牡丹汤、薏苡附子败酱散、排脓散、排脓汤）属同一脉络——**HT 系列是六方的成药化延伸**。","o":"RJ-3078 · 汉唐中医方剂讲解·目录（PDF 第4页）／金匮要略·疮痈肠痈篇（PDF 第582~595页）"},{"t":"三、分类逻辑","h":"按脏腑病位：中焦与心肾两组","c":"要点——HT 系列的分类并不全按病名，有一组是**按脏腑病位**命名的，这最能看出其方剂学的骨架。**中焦组**：**HT-31 中焦湿热**、**HT-33 中焦湿热过盛兼便秘（过重兼便秘）阳明胃热**、**HT-78 健胃散**——三者构成\"中焦湿热\"由轻到重的阶梯：单纯湿热（31）→湿热兼便秘、阳明胃热（33）→日常调养（78）。**心肾组**：**HT-70 定心丸（中医之心肾不交，主症是有焦虑、忧郁之情志）**、**HT-67 失心丸**、**HT-41 中安丸（失眠）**——三者围绕\"心\"之不安：心肾不交（70）、心神失守（67）、失眠（41）。**升降组**：**HT-23 肝阳上亢、肾阳不足**——一语点出上盛下虚的格局（肝阳上亢于上、肾阳不足于下），是\"上实下虚\"类病（高血压、眩晕、中风先兆）的通用框架。按病位命名的好处是**可类推**：凡见\"中焦湿热\"之象（苔黄腻、腹胀、便黏），即可循 HT-31/33 的思路；凡见\"心肾不交\"（失眠、心烦、腰膝酸），即可循 HT-70 的思路。","o":"RJ-3079 · 汉唐中医方剂讲解·目录（PDF 第1~3页）"},{"t":"三、分类逻辑","h":"按性别与生命周期","c":"要点——妇人、男科与小儿三组，构成\"按人\"的分类轴。**妇人**：**HT-36 天青丸（妇女痛经，兼治下身瘀血、受伤）**、**HT-60 强力天青丸**、**HT-38 玉华丸（女性滋补良药）**、**HT-64 妇女经停后身热盗汗、易生气、情绪不稳定**、**HT-96 乳癌外用粉剂**——覆盖经期（36、60）、日常滋补（38）、更年期（64）、乳疾（96）四个阶段。**男科**：**HT-37 天威丸（男性与女子元阳不足）**、**HT-47 重阳丸（男子精中带血）**、**HT-49 起阳丸（振奋阳气，生精）**（目录并特别标注\"**VS 威而刚**\"——与西药壮阳药作对比）、**HT-66 摄护腺肥大**、**HT-82 下焦寒实之四逆症**。**小儿**：**HT-72 浮萍方（小儿风痒）**、**HT-93 小儿过动症**、**HT-92 增高丸**。**\"VS 威而刚\"这一标注值得记录**：它表明倪海厦明确把自己的方剂与西药在同一诉求上作对比较量——**比的不只是疗效，还有\"是否伤身\"**（起阳丸走\"振奋阳气、生精\"之路，而非强行刺激）。","o":"RJ-3080 · 汉唐中医方剂讲解·目录（PDF 第2~4页）"},{"t":"四、讲授者的医学观","h":"三因分类：外因、内因、非内外因","c":"定义——讲稿开篇由讲授者复述《内经》的病因三分法：\"人生病在《内经》里面，讲述的就是由**外因**，这个外因就是**四时不正之气、天之六淫**——也就是说一个伤寒、一个瘟疫，这些都是外因；第二个就是**内因**，内因便是**人的心理活动、七情六欲**所造成的疾病；第三个就是**非内外因**，包括**饮食所伤、金创、房劳**等等。\"这一分类的价值在于它给出了一张**穷尽的病因表**：凡病，不出此三类。讲授者据此进一步提出一个当代判断：\"**目前的疾病，因为心理导致人的肉体的疾病基本上要占到七成以上**……西医便称为**亚健康**。\"**其反驳**：\"**实际上亚健康就是不健康，健康就是健康，不健康就是不健康，就是一种疾病**——为什么西医称为亚健康呢？因为**西医没有办法调治**。\"**须说明**：\"七成由心理导致\"是讲授者的估计，无数据支撑；但\"亚健康即疾病状态、只是无对应治法\"这一判断，对理解\"治未病\"的价值有启发。","o":"RJ-3081 · 汉唐中医方剂讲解·开篇（PDF 第5~6页）"},{"t":"四、讲授者的医学观","h":"关于本书的性质与读法","c":"要点——使用本讲稿须留意三点，否则易误引。**①作者不是倪海厦**：全文为讲课录音整理，讲授者以第三人称谈倪氏（\"倪海厦先生说他的一些东西全部都是保密的\"），并夹入大量个人议论（五四运动、崇洋媚外、奴婢心理等），这些议论**不能算作倪海厦的观点**。**②方剂的\"保密\"之争**：讲授者称\"实际上倪海厦先生他的这所有的东西一点都不保密，都写在他的日志里面；懂的人、会看的人、可以产生共鸣的人，一看就可以明白；而不能产生共鸣、不懂的人，看一百遍也不明白\"——这一说法本身即是对\"倪氏藏私\"批评的回应，可作为理解其写作风格的注脚：**他以\"日记体\"记录心得，不列成教科书式的条目**，故读者须自行归纳。**③本书的价值在目录与主治**：其方剂组成、剂量在正文中虽有，但多为讲授者的转述与发挥；**目录所载的方名与主治（含与西医病名的对照）是可靠的一手信息**，而正文的推导与评议宜与倪氏原文（如《经典配方》《金匮》讲稿）对读。","o":"RJ-3082 · 汉唐中医方剂讲解·开篇（PDF 第5~8页）"},{"t":"一、理论基石","h":"奶水即月经：两个反证","c":"要点——倪海厦的妇科与乳癌理论全部建立在一条命题上：**\"女子的奶水就是月经\"。**其论证不靠引经据典，而用两个日常反证（原文）：**①\"女人在喂母乳期间是没有月经的，但是许多母亲在此期间仍然会怀孕，此表示婴儿吸取母乳，故月经没了，但是卵子仍然在排出。\"**——即哺乳期月经停止，但生育能力仍在，说明**月经的有无与排卵并不绑定**；若月经即\"卵子未受精之排出\"（西医解释），则哺乳期无月经应当同时无排卵，然而事实上仍可受孕，故西医之说不成立。**②\"女性结扎之后，因为无卵子释出，故不会怀孕，但是月经却每月仍然照样来潮，为什么呢？\"**——结扎后月经照常，进一步说明**月经不由卵子生成**。由此他断言：\"因为西医对月经的错误解读，导致对于许多女性疾病不知由何而生？因而无法预防，例如红斑性狼疮、肺癌、脑瘤、淋巴腺癌、血癌、乳癌等疾病。\"**须明确指出：这一整套推论属倪海厦的个人理论，与现代医学不符。**哺乳期闭经（ lactational amenorrhea ）的机制是泌乳素抑制下丘脑促性腺激素释放激素，排卵被抑制但不完全（故仍有受孕可能）；结扎（输卵管结扎）阻断的是卵子与精子相遇的通道，卵巢照常排卵、子宫内膜照常周期性脱落。**两处反证都能在主流生理学内得到完整解释，并不需要\"奶水即月经\"这一前提。**","o":"RJ-3083 · 专题·乳癌篇（PDF 第3~4页）／相关方剂 HT-2、HT-5"},{"t":"一、理论基石","h":"由\"奶水\"学说推出的疾病谱","c":"要点——一旦接受\"奶水即月经\"，一串疾病就被串到同一条因果链上。其原话：\"因为我依照中医的理论认为女性的奶水就是女子的月经，由此而解决了这些人人闻之色变的癌症\"——所列疾病为**红斑性狼疮、肺癌、脑瘤、淋巴腺癌、血癌、乳癌**。其内在逻辑是：奶水本应下行化为月经，若**不能下行而逆流**，则依逆流所停之处而生变——停于乳房为乳癌，入心为红斑狼疮，入肺为肺癌，入脑为脑瘤，入淋巴为淋巴腺癌，入骨髓为血癌。**这一\"一源多流\"的构造，是其理论最整齐处，也是最脆弱处**：整齐在于它用一个变量（奶水的去向）解释了六种病；脆弱在于**没有任何可检验的中间环节**——奶水如何\"逆流\"、逆流如何\"化为\"肿瘤，皆无观察依据，且六病的病理机制在现代医学中已有各自的明确解释（如红斑狼疮为自身免疫、血癌为造血系统恶性克隆）。**故这套谱系可作理解其思路的框架，不可作为诊断依据。**","o":"RJ-3084 · 专题·乳癌篇（PDF 第4页）"},{"t":"二、病理链","h":"心阳不足与情志郁结：乳癌的两个起点","c":"要点——乳癌的直接病因，其表述为两条并列：**\"女性患乳癌者，多起于情志郁结，心脏衰弱的病情\"**（此为病案首诊时对患者所言，由患者转述）。两条的内在关联在于：**心主神明**（情志郁结则心气不畅）、**心阳不足则推动无力**（奶水不得下行）。故治疗上，其主张**疏肝理气、强心阳、通大便**三者并行——患者自述服药期间\"主治疏肝理气、排便通畅，如厕不须一分钟\"、\"心情也渐渐转好\"，可见**通便与疏肝是其处方中的常规配置**。**须说明**：\"情志郁结\"与\"心阳不足\"属中医证候概念，可作为辨证线索；但将其作为乳癌的**病因**，缺乏流行病学支持——现代医学确认的乳癌风险因素为激素暴露（初潮早、绝经晚、未育、长期雌激素）、遗传（BRCA1/2）、饮酒、肥胖等，**情志与\"心阳\"不在其中**。把病因归于情志，实际风险是让患者忽视可干预的客观因素。","o":"RJ-3085 · 专题·乳癌篇（PDF 第2页）"},{"t":"三、主张与风险","h":"\"不必做切片与追踪检查\"：一条必须明确警告的主张","c":"风险——原文两处，态度极明确：**①\"不必再做任何检查！因为任何西医的检验设备只会刺激癌细胞。\"**（对患者所言）**②\"西医的切片与挤压式的照射检查，只会让病情更坏。\"**\"一旦经过西医的过度检验与切除手术，再加上化学治疗无效后，妳再来找中医治疗时，我现在就可以宣判妳是死定了。\"**⚠ 必须逐条标明其危险**：**（1）穿刺活检（细针／粗针）是乳腺肿块确诊的金标准**，其风险为局部出血、感染、极低概率的针道种植，**并无\"刺激癌细胞扩散、使病情更坏\"的公认证据**；现代指南（NCCN、CSCO）均以病理确诊为治疗前提。**（2）\"检验设备只会刺激癌细胞\"之说**，对 mammography 的辐射剂量已有大量研究，其获益（早期发现、降低死亡率）远超风险，且现代数字乳腺摄影剂量极低。**（3）\"一经西医治疗即宣判死刑\"**是最危险的一句——它直接劝止患者接受已被证实可显著改善生存的治疗，**可能造成可改善的早期乳癌被延误至晚期**。**结论：本节所记为其主张原貌，读者不可据此拒做活检、拒做影像随访或拒用FDA批准的治疗。**","o":"RJ-3086 · 专题·乳癌篇（PDF 第2~3页）"},{"t":"三、主张与风险","h":"患者可观察的三种服药反应","c":"要点——患者自述中记录了三个具体、可复述的身体反应，虽属个例，但作为\"服药后的观察点\"有价值：**①药归经的自我验证**——\"在服用倪大夫的药后两小时，我的左乳房左上方（在西医切片检查出癌块所在）会有疼痛的感觉，时间不长，有时像针穿过一样痛，但很快就会消失\"；即**服药后原病灶处出现短暂的定位性疼痛**，患者据此理解为药力达于病所。**②排痰**——\"直到五个月后，一日如厕感觉有所不同，只见排出如牛奶一样的白色黏稠物\"；其后\"每三五天周期性的排痰\"。**③体表反应**——\"身上出现像青春痘般的红疹，颇有疼痛感，左乳房较右乳房大两倍，癌症硬块时大时小\"。**须说明**：这类\"反应\"与疗效之间的因果关系无法由个例确立——**硬块\"时大时小\"既可能是治疗反应，也可能是肿瘤本身的波动或炎性变化**，而在未做影像与病理对照的情况下，无法区分。**这恰是\"不做检查\"这一主张的自相矛盾处**：拒绝客观检查，就只能依赖主观感受判断进退，而主观感受无法排除进展。","o":"RJ-3087 · 专题·乳癌篇（PDF 第2页）"},{"t":"三、主张与风险","h":"\"药只能治三分病，七分还得靠自己\"","c":"要点——这是首诊时对患者所说的一句话，患者记下并深有体会：\"无论中西医，也只能治病，而不能治心，自己必须帮助自己从情志中走出来。\"**其合理内核**在于：慢性重病中的情绪、睡眠、活动、饮食，确实显著影响生活质量与治疗耐受性，**心理支持与自我管理是现代肿瘤治疗的标准组成部分**（非替代）。**其风险处**则在于：这句话极易被引向\"疗效主要靠自己\"——一旦病情进展，责任被转移到患者身上，而**延误诊治的客观因素反而被掩盖**。**用法建议**：把它当作\"重视情志与生活管理\"的提醒，而不是\"疗效不确定\"的免责说法。","o":"RJ-3088 · 专题·乳癌篇（PDF 第2页）"},{"t":"四、可用的观察","h":"\"自己会知道\"：一条关于判断标准的对话","c":"要点——患者问\"中药要吃到何时？是否需要回到西医再做切片检查\"，其答：\"**服药到何时，你自己会知道**\"；患者不解，他解释：\"**我指的是，因为治疗的结果，感受在你的身体内，所以只有你自己最清楚。**\"**这段话本身有可取之处**：治疗是否有效，患者对体力、睡眠、疼痛、食欲的切身感受确是第一手信息，医生不应忽视。**但它不能替代客观评估**——患者\"感受良好\"与\"肿瘤缩小\"在临床上可以不一致（尤其肿瘤生长缓慢或患者适应了症状时）。**故正确的用法是两者并用**：以主观感受调整生活与用药的耐受性，以影像与病理评估病情的真实走向。**把自己完全交给任何一方，都不是负责的做法。**","o":"RJ-3089 · 专题·乳癌篇（PDF 第2~3页）"},{"t":"四、可用的观察","h":"月经周期与月亮：一段引文的用法","c":"要点——本篇中夹入了一段医师蔡锋博的科普（讲德尔沃的画与女性月经周期），其中有可用的生理事实：\"**女人自12～13岁起，大约在乳房发育到唐纳氏分期的第三期到第四期起，因为受到下视丘—脑下垂体—卵巢轴的成熟，开始有初经出现**\"；\"女人的月经周期，一如月亮般，有规律的转变\"。**这段文字被倪海厦引来作反衬**——先录西医的科普，再以\"月经究竟从何而来\"发问，转入自己的\"奶水\"论。**阅读上须分开**：前段（HPO 轴成熟、初潮年龄、唐纳氏分期）是可靠的现代生理学；后段的\"奶水即月经\"及其推演则是他的个人理论。**同一篇文章里，两种性质的知识并列**，这正是整理其文稿时最需小心的地方——**不因一段可信而全信，也不因一段可疑而全弃**。","o":"RJ-3090 · 专题·乳癌篇（PDF 第3~4页）"},{"t":"一、批判对象","h":"\"根本没有 C 型肝炎\"：一条须明确否定的主张","c":"风险——本篇对 C 型肝炎的成因给了一个完全不同的解释，原文：\"**我从临床上可知根本没有所谓的 C 型肝炎**，被西医诊断为 C 型肝炎的病患，**实际上都是服用过量的维他命，在得到感冒以后又使用一点也没有用的抗生素**，结果不但没有好，反而因为使用抗生素造成心脏受害、免疫系统更差，使得**感冒病毒进入肝脏才造成的**……西医很巧妙地把他们制造的问题改变为一个新的疾病，再冠上一个美丽名字——C 型肝炎。\"**⚠ 这一主张必须明确否定**：**（1）丙型肝炎病毒（HCV）是 1989 年由 Choo 等克隆鉴定的独立病原体**，其基因组为单股正链 RNA，属黄病毒科，**与\"维他命过量\"或\"感冒病毒\"无关**；**（2）HCV 已有可靠的检测手段**（抗-HCV 抗体、HCV RNA 定量 PCR），可确诊、可分型、可监测；**（3）HCV 已有高效改善手段**——直接抗病毒药物（DAA）的持续病毒学应答率 **>95%**，可使肝硬化进展停止甚至逆转。**故\"根本没有 C 型肝炎\"是事实层面的错误**，其实际危害是使患者放弃本可改善的感染。**可保留的部分**是他对抗生素滥用与\"维他命过量\"的批评本身——这两者确为真实存在的医疗问题，但**不能由\"滥用存在\"推出\"该病不存在\"**。","o":"RJ-3091 · 专题·肝癌篇（PDF 第1~2页）／相关方剂 HT-68"},{"t":"一、批判对象","h":"抗生素与免疫的恶性循环","c":"要点——其对抗生素的批评有一条完整链条，须与上条的错误主张分开看。原文：\"中药处方的**出发点，并不是要去杀死病毒，而是很自然的将感冒病毒排出体外**……在临床上证明，我们用中药在感冒的初期，就可以治疗感冒，病人以后较不会再得到感冒，也就是说免疫系统会增强。然而现今社会迷失在**抗生素的神话**中，到处滥用它，造成许多本来不该有的疾病，也由于**免疫系统的被抗生素的破坏，使得病毒越来越强，并且产生抗药性**，迫使西医使用更强的抗生素，如此恶性循环下来，不但造成新的疾病，也造成人类因为免疫系统不全而死亡。\"**其中站得住的部分**：抗生素对**病毒性感冒无效**（这是明确的医学共识）、抗生素滥用会筛选出耐药菌、破坏肠道菌群（\"免疫系统受影响\"的现代解释即菌群—免疫轴），**\"感冒不应常规使用抗生素\"这一主张是完全正确的**。**其中不严谨的部分**：抗生素针对的是细菌而非病毒，\"使病毒越来越强\"应表述为\"使细菌耐药\"，病毒的抗药性另有机制（如抗流感药）。**故这段可取其\"反对滥用、感冒不必用抗生素\"的核心，弃其术语混用。**","o":"RJ-3092 · 专题·肝癌篇（PDF 第1页）"},{"t":"二、热与癌","h":"\"热水是唯一能改善疾病的方法\"","c":"定义——在评论射频消融治疗肝癌的新闻时，他提出了一个贯穿其体系的命题：\"**我一直在强调热水（也就是气），是唯一能够改善疾病的方法**。**中药里头的热药与阳药，就是能够使全身水液呈汽化状态的药物**。**所有的病毒与癌细胞都喜欢冷水，一旦水变热了，它们会因为没有办法喝水而渴死了**。\"**其可取处**在\"阳药\"的实际作用——温阳药（附子、干姜、桂枝、吴茱萸等）确能改善末梢循环、提升代谢率、纠正寒证状态，这与\"体寒者易病\"的临床观察可以对应。**其不成立处**在于\"癌细胞喜冷、遇热渴死\"这一机制表述：**无任何实验依据**；肿瘤确对温度敏感（ hyperthermia 研究确有，42—45℃ 可增敏放化疗），**但作用机制是热对细胞膜与血管的破坏、以及热休克蛋白表达的改变，不是\"渴死\"**。**故这段话的正确读法是**：它是一则**比喻**，用以说明\"温阳\"这一治法方向，**不是可验证的病理机制**。","o":"RJ-3093 · 专题·肝癌篇（PDF 第2页）"},{"t":"二、热与癌","h":"热疗为何复发：一条自洽的推论","c":"要点——他对射频消融（RFA）的评价是其体系中少见的\"承认有效但指出局限\"，颇为自洽。原文：\"因此此一疗法是**可行的**，但是仍然有一个缺点，就是**没有研究到何种营养支持何种癌症**；如果知道，我们只要去断绝吸收此营养一段时间，癌细胞就会先因为饥饿而死，人体尚不会因为单独缺少此营养而死亡——**这就是热疗以后癌症会回来的原因**。\"**其推理是**：局部加热只能杀死被加热的那一团细胞，若肿瘤赖以生长的\"营养条件\"未变，则新灶必生；故治疗须同时改变\"土壤\"。**这一思路在现代肿瘤学中有对应的概念**——\"种子与土壤\"假说（seed and soil）、肿瘤微环境、以及代谢治疗（如限制特定氨基酸对某些肿瘤的影响）。**其局限**是\"断绝某一种营养即可饿死癌细胞而不伤人体\"过于乐观：肿瘤的代谢可塑性极强，单一营养素限制往往被代偿机制绕过。**可取的结论**是**局部治疗必须配合整体状态的改变**，这一点与其\"治人不止治病灶\"的立场一致。","o":"RJ-3094 · 专题·肝癌篇（PDF 第2页）"},{"t":"三、对干扰素","h":"副作用的读法：一份清单的两种解释","c":"方法——本篇大段引用了一篇关于干扰素治疗慢性 C 肝的科普，并在括号内逐句批注，形成\"原文—批注\"的对照，其中批注的方式值得记录：**①原文\"干扰素是人体自然产生的蛋白质\"** → 批注\"这段说的是人体自然产生的，非是在西药厂里合成出来的，二者完全两回事，我们绝对是无法取得真正人体合成的干扰素\"；**②原文陈述副作用（头痛、轻度发烧、肌肉酸痛、疲倦、恶心、食欲不振、体重减轻、注射部位发痒红疹、轻度腹泻）** → 批注\"每次西医做副作用的陈述时都很轻描淡写，**这根本就是人体中毒的现象与贫血症状**\"；**③原文\"约 20% 会出现情绪问题，必要时转介精神科，及早给予抗忧郁药物\"** → 批注以嘲讽语气回应；**④原文\"约 5%~10% 出现甲状腺低下或亢进，需每三个月抽血\"、\"干扰素有骨髓抑制，会产生白血球及血小板降低\"、\"Ribavirin 会导致畸胎及溶血性贫血\"** → 批注\"越看西医就越多病，从肝胆科看到精神科，现在又要去看新陈代谢科\"。**须辨明**：他所摘引的副作用本身**是真实的、教科书级的干扰素不良反应**（流感样症状、骨髓抑制、甲状腺功能异常、抑郁、Ribavirin 的溶血与致畸），**这些并非\"轻描淡写\"，而是标准知情同意的内容**。其批注的价值在于**提醒患者认真阅读副作用清单**；其错误在于把\"有副作用\"直接等同于\"无效且有害\"。","o":"RJ-3095 · 专题·肝癌篇（PDF 第3~4页）"},{"t":"三、对干扰素","h":"\"千万不要吃干扰素，吃后风险极高\"：必须明确警告","c":"风险——本篇末尾的结论句极为激烈：\"**我国正统医学可以从 A 型肝炎一直治疗到肝癌，都可以治疗的，不但仍有偏性与禁忌，而且可以预防肝病再度发生的……千万不要吃干扰素，吃后风险极高，请勿受骗。**\"**⚠ 逐条标明**：**（1）\"吃后风险极高\"没有任何依据**——干扰素治疗慢性肝炎的严重不良事件发生率有限，且可监测、可停药；**（2）\"仍有偏性与禁忌\"不成立**——任何有效中药方剂皆有偏性与禁忌（如含乌头、麻黄、细辛者），\"作用相对平和\"之说本身即不安全；**（3）\"从 A 型肝炎一直治到肝癌都可以治疗\"**是过度承诺，**肝硬化失代偿、肝癌进展期**均需多学科处理（抗病毒、TACE、靶向、免疫、移植）。**须同时说明一个时代背景**：干扰素＋Ribavirin 曾是慢性 C 肝的标准方案，**现已基本被 DAA（直接抗病毒药物）取代**，后者疗程 8—12 周、改善率 >95%、副作用远低。**故这段批评的靶子今天已部分失效**，但其\"劝人拒治\"的行为模式仍具风险，读者不可据以停药或拒诊。","o":"RJ-3096 · 专题·肝癌篇（PDF 第4页）"},{"t":"四、诊断的立场","h":"\"多读黄帝内经就会\"：一种知识传递的态度","c":"要点——面对\"一滴血验肝癌\"的基因芯片新闻，他的评论透露了一种一贯的态度：**①承认其工具价值**——\"这篇报导是可以做的，尤其是**给中医来做治肝癌的之前与之后的诊断依据**\"；**②声明自己不需要**——\"真正的正统北派中医经方家是不需要靠这检验的，**我们有许多方式可以诊断出肝癌**\"；**③拒绝公开**——\"网页上我不会公布任何诊断法与处方的，以免被别人学去然后说是祖先留下的，或是走在北京马路上一位老先生教的，甚至说是自己研发的\"；**④指向原典**——\"**只要多读黄帝内经就自然会的，不需要我来教，诊断与治法都在古籍上写得一清二楚，多读就会了，一点也不难**。\"**这一态度的两面**：正面是**逼人回到原典**（其讲稿的确大量以《内经》《难经》为据）；负面是**不提供可核对的诊断标准**，使\"我的诊断法\"成为不可检验的个人技艺——**这与其\"对 AI 幻觉零容忍、正文必有原文依据\"的整理原则恰好相反**，故本全集凡遇此类\"不公布\"之处，均只能记录其\"承认有此诊法\"这一事实，无法补出内容。","o":"RJ-3097 · 专题·肝癌篇（PDF 第3页）"},{"t":"四、诊断的立场","h":"\"治肝病的方法可参考 HT-68\"","c":"要点——本篇两次指向同一处：**\"我的治肝病方法可参考 HT-68，及首页的肝硬化及肝癌、肝病的区别。\"**即**肝病的方剂归口于 HT-68 护肝丸**，而完整的辨治框架则在其网站首页的专文（未收入本批文档）。**这一\"方—文\"对应的结构**在其体系中很常见：**HT 编号给成药，专题文章给思路，医案给实例**。故使用其肝病学说时，三者须合看：**HT-68 知其用何方，本篇知其为何如此想，医案见其如何随证加减**。单取其一，都不完整。","o":"RJ-3098 · 专题·肝癌篇（PDF 第2页）"},{"t":"说明（艾滋病与疫苗立场）","h":"\"艾滋病不危重，病人死于药物\"：一套已被彻底否定的主张","c":"风险——其原话：\"**首先我要强调的是艾滋病根本不是危重的病，是无害的，病人是死在药物的副作用上。**我在临床上见过许多被诊断为 HIV Positive 的病人，完全无危重的症状，反而是服用了 AZT、DDI 或用鸡尾酒疗法的药物以后，才出现了危重性的症状，\"并自述\"这个结论与加州柏克莱分校的 Peter H. Duesberg Ph.D 不谋而合\"。**⚠ 这一主张属\"HIV/AIDS 否认主义\"（AIDS denialism），已被科学彻底否定，并造成过可核查的死亡后果**：**（1）HIV 是艾滋病的病因**——1983 年由 Montagnier 与 Barré-Sinoussi 分离鉴定（2008 年诺贝尔生理学或医学奖），符合 Koch 法则的全部要求，且有大量干预性证据（母婴阻断、输血筛查、抗病毒治疗降低传播）。**（2）Duesberg 的\"药物致病\"假说**在 1990 年代被多项队列研究否定（如 1993 年 Schechter 等的自然史队列，未用药者的 CD4 同样下降）。**（3）已发生的真实危害**——南非在 1999—2005 年间因政府采纳否认主义立场、延迟提供抗病毒治疗，据 Harvard 研究（Chigwedere 等，2008）估算造成 **>33 万人** 过早死亡、约 **3.5 万** 例母婴感染可被避免。**（4）\"AZT 危险、鸡尾酒疗法致病\"**：AZT 早期的确副作用大、单药易耐药，但**联合抗病毒治疗（cART）自 1996 年问世后使 HIV 相关死亡率下降约 80%**，感染者预期寿命已接近常人。\"无危重症状\"是**潜伏期**的正常表现，不等于无害——**未经治疗的 HIV 感染者最终绝大多数进展为 AIDS**。","o":"RJ-3099 · 专题·艾滋病篇（PDF 第2页）"},{"t":"说明（艾滋病与疫苗立场）","h":"对何大一与\"鸡尾酒疗法\"的批评：不成立","c":"风险——本篇收录了何大一（David Ho，联合抗病毒疗法即\"鸡尾酒疗法\"的主要研究者之一）关于中国面临 SARS、艾滋、流感三重威胁的新闻，其后附有大段攻击性评语，称其\"不懂中医学\"\"对于免疫系统一知半解\"\"拿 AIDS 来吓唬人，目的是想有名，想大赚钱\"\"实际上从未改善过一个病\"，并预言\"这些烂医学博士反正都会死得比我早\"。**处理原则**：**（1）人身攻击与诅咒部分已全部剔除**，本全集不作转述；**（2）须说明其学术批评不成立**——何大一的贡献（阐明 HIV 在体内的动态复制、提出早期联合治疗策略）是 HIV 治疗史的转折点，其团队工作使艾滋病由\"风险极高之症\"变为\"可控的慢性病\"，这是有据可查的事实；**（3）\"从未改善过一个病\"这一指控在概念上亦有误**——抗病毒治疗的目标是**把病毒抑制到检测不到的水平、使免疫重建**，这在现代慢病管理中即视为治疗成功（如高血压、糖尿病亦非\"改善\"而是\"控制\"）。**评价人物的医学贡献，须以其可验证的临床结果为准，而不以其言辞风格或国籍为据。**","o":"RJ-3100 · 专题·艾滋病篇（PDF 第2~3页）"},{"t":"说明（艾滋病与疫苗立场）","h":"疫苗立场：记录而不复述","c":"风险——倪海厦对疫苗持明确的反对立场，在其文集（尤其《再论疫苗》一篇，篇幅达 383 页）中反复表述，语言激烈，并把多种疾病的成因归咎于疫苗。**处理原则：本章只记录\"他持反疫苗立场\"这一事实与其推论类型（即：把疾病谱的变化归因于疫苗、把免疫接种视为致病而非防病），不复述其具体论证**——理由是这类论证即便作为\"资料\"转述，也会被截取传播为可操作的反疫苗主张，从而造成实际伤害。**须明确的科学结论**：**（1）疫苗的作用是经大规模随机对照试验与长期上市后监测确立的**，如麻疹疫苗使麻疹发病率下降 >95%、天花被全球消灭（1980 年 WHO 宣布）、HPV 疫苗显著降低宫颈癌前病变；**（2）疫苗确有不良反应，但严重不良反应的发生率极低**，其风险—获益比在绝大多数人群中有明确结论；**（3）个体化的接种决策应咨询临床医生**（如免疫缺陷者、过敏史者的禁忌），而非依据网络言论。**读者若在其著作中读到此类内容，应整体跳过，不作参考。**","o":"RJ-3101 · 专题·艾滋病篇（PDF 第2页）／再论疫苗（全篇）"},{"t":"保留的理由","h":"为什么收录而不删除","c":"要点——既然上述两组观点是错误的、且有风险，为何仍在此全集中保留其条目？**三个理由**：**①完整性的需要**——本全集的目标是\"按原文整理其全部知识\"，若把不合己见的部分删去，得到的将是经过筛选的倪海厦，而非真实的倪海厦；**②识别价值的需要**——读者在别处读到其言论时，需要有一个明确的坐标来判断哪一部分可信、哪一部分不可信；**③思想史的价值**——其反疫苗、否认 HIV 的立场，与其对\"西方医学\"的整体批判同源：他先确立\"西医是错的\"这一前提，再由此推出\"凡西医所说皆反\"，**这正是其思想方法的破口所在**——**一个体系若以否定对方为先，其自身结论便不再受证据约束**。这一点对读其医案、方剂同样适用：**其可采处在其临床观察与方证对应，其不可采处在其对现代医学的整体否定**。","o":"RJ-3102 · 专题·艾滋病篇、再论疫苗（综合）"},{"t":"一、体例","h":"259 方的结构：症状在前，方剂在后","c":"要点——这部《经方经验总结大全 259 方》的编排方式与前面几部方剂文本都不同，它**以症状为索引**，每条固定五项：**①序号；②症状描述（作为条目标题）；③所用方剂名与出处（如\"出自《伤寒杂病论》——四逆散\"）；④药物组成与克数；⑤注（煎法、服法、禁忌）**。举例：第 1 条\"男子阳痿和女子性冷淡的基础方（出自《伤寒杂病论》——四逆散）**柴胡 6 克、枳实 6 克、芍药 6 克、炙甘草 6 克**；注：将以上药加工成粉末，每次小半匙，每日三次。\"**这种\"症状→方\"的编排**，使其成为一部**查阅型工具书**而非阅读型讲稿——遇到某症，按症查方，不必先通读理论。**其代价**是**辨证环节被压缩**：同一条目往往只给一句症状（如\"剧烈牙疼的经验方\"），不载舌脉与体质条件，故**只能作思路参考，不可照方抓药**。","o":"RJ-3103 · 经方经验总结大全 259 方（PDF 第1页起）"},{"t":"一、体例","h":"三层方剂文本的分工","c":"要点——倪海厦名下共有三层方剂文本，须分清其性质才能正确使用：**①《经典配方》**（76 页）——按\"症状→处方→克数剂量→煎服注\"，为**门诊常用方的直给**，最贴近日常使用；**②《259 方》**——规模最大，259 条，覆盖内、外、妇、儿、皮科、骨伤，**注明每条所出经方**，为**索引与总表**；**③HT 系列（约 92 方）**——**自拟定型方**，以编号成剂，可作丸散常服。三者的关系是：**259 方以经方为骨，经典配方是其中最常用的一部分，HT 系列则在经方基础上定型为自己的成药**。阅读上宜先经方（知其源），再 259 方（见其用），最后 HT 系列（识其变）。","o":"RJ-3104 · 经方经验总结大全 259 方／经典配方（PDF 第2~15页）／汉唐中医方剂讲解·目录"},{"t":"二、鉴别条目","h":"便秘四方：四症定位法","c":"方法——第 36~39 条构成一组极清晰的**便秘鉴别表**，其判别依据只有四症：**舌苔、小便色、腹胀、矢气**。原文排列如下：**①\"舌苔白、小便淡白、小腹无异常的便秘\"→ 大黄附子细辛汤**（大黄 15 克、炮附子 15 克、细辛 10 克）——**寒实内结**，故苔白、尿淡白、腹无所苦；**②\"舌苔黄、小便黄、小腹胀痛、无屁的便秘\"→ 大承气汤**（大黄 20 克、厚朴 15 克、枳实 15 克、芒硝 10 克）——**阳明腑实重证**，四症俱全且\"无屁\"（气机全闭）；**③\"舌苔黄、小便黄、小腹痛、屁多的便秘\"→ 厚朴三物汤**（厚朴 20 克、大黄 10 克、枳实 15 克）——**气滞重于热结**，故有矢气而痛；**④\"舌苔黄、小便黄、小腹胀、屁多的便秘\"→ 小承气汤**（大黄 20 克、厚朴 10 克、枳实 10 克）。**这张表的价值在于把\"何时用寒下、何时用温下、何时重在行气\"压成四个可数的体征**：苔黄尿黄者属热（三承气类），苔白尿淡者属寒（大黄附子细辛）；**\"无屁\"者闭之极（大承气），\"屁多\"者气未全闭（厚朴三物、小承气）**。**须提醒**：芒硝\"不要煮，待其他药煮好后放入融化即可\"；此类峻下方剂**须经中医师面诊确定剂量与适应证**，年老体弱、孕妇、电解质紊乱者尤须慎用。","o":"RJ-3105 · 经方经验总结大全 259 方（PDF 第10~11页）"},{"t":"二、鉴别条目","h":"咳嗽两方：以舌苔定寒热","c":"方法——第 43、44 条以**舌苔**为唯一分水岭：**①\"有舌苔发黄且厚现象的咳嗽\"→ 皂荚丸方**（皂荚 40 克，注：加工成地黄丸大小的蜜丸，每日三次，每次一丸，用**红枣汤送服**）——苔黄厚者属**痰热壅盛**，皂荚\"涤痰\"之力峻猛，故以蜜丸缓之、枣汤护胃；**②\"有舌苔发白现象的咳嗽\"→ 射干麻黄汤方**（射干 15、细辛 15、大枣 7 枚、麻黄 15、半夏 15、生姜 4 片、紫菀 15、款冬花 15、五味子 15）——苔白者属**寒饮**，故用麻黄、细辛、半夏温散水寒，紫菀、款冬花止咳。**两方对比可见其用方逻辑**：**同一症状（咳嗽），苔色一转，方剂即由温散改为涤痰，且都用丸/汤不同剂型以控峻缓**。此条与其\"舌诊看中焦寒热\"的诊断原则完全一致。","o":"RJ-3106 · 经方经验总结大全 259 方（PDF 第12页）"},{"t":"二、鉴别条目","h":"肺气肿：脉浮与脉沉两方","c":"方法——第 40 条\"中晚期肺气肿（出自《伤寒杂病论》——厚朴麻黄汤方＋泽漆汤方）\"以**脉**为分方之据：**①脉浮者用厚朴麻黄汤**——\"厚朴 25 克、细辛 10 克、麻黄 15 克、小麦 2 调羹、石膏 15 克、杏仁 15 克、半夏 15 克、干姜 10 克、五味子 15 克\"；**②脉沉者用泽漆汤**——\"半夏 15 克、紫菀 25 克、生姜 5 片、白前 25 克、甘草 15 克、黄芩 15 克、人参 15 克、桂枝 15 克、红大戟 15 克\"。**其义**：**脉浮者病偏于表、气逆于上**，故以麻黄、石膏、杏仁宣降，干姜、细辛、五味子温收并用（此即小青龙法之遗意）；**脉沉者病已入里、水饮内结**，故以泽漆、白前、大戟逐水，人参、甘草护正。**同一病、同一阶段，脉一浮一沉，治法即由\"宣散\"转为\"逐水\"**——这是\"脉定表里\"最典型的一例。","o":"RJ-3107 · 经方经验总结大全 259 方（PDF 第11页）"},{"t":"三、分期","h":"孕产妇保健：四个阶段的四方","c":"方法——第 27 条按孕期分四段给方，其原注说明系\"出自《伤寒杂病论》——桂枝汤＋当归散＋白术散＋当归生姜羊肉汤\"四方的组合运用：**①孕期 1—2 个月**——\"桂枝 10 克、炙甘草 10 克、白芍 10 克、生姜 4 片、大枣 12 枚、**黄芩 47 克、人参 47 克、干姜 47 克、黄连 16 克**\"（即桂枝汤合黄芩、人参、干姜、黄连，此为**安胎清热**之法，黄芩、黄连清胎热，人参、干姜护中）；**②孕期 2—6 个月**——\"**当归 250 克、黄芩 250 克、芍药 250 克、川芎 250 克、白术 125 克**\"，注\"研磨成粉，一日四次，每次一汤勺\"（即**当归散**，养血清热安胎）；**③孕期 6 个月至产前**——\"**白术 100 克、川芎 100 克、蜀椒 100 克、牡蛎 100 克**\"，同样为粉剂（即**白术散**，健脾温中、牡蛎安胎）；**④哺乳期**——\"**当归 15 克、生姜 4 片、羊肉 500 克**\"（即**当归生姜羊肉汤**，温补气血以生乳汁）。**四方的共同思路**是**\"分期而治\"**：前三月胎气未固，重在清热护中；中三月血虚有热，重养血；后三月脾虚湿停，重健脾；产后则温补。**须提醒**：孕期用药须由产科与中医师共同评估，**方中黄芩、黄连、川芎、蜀椒等皆有明确禁忌与剂量上限**，不可自行配制服用。","o":"RJ-3108 · 经方经验总结大全 259 方（PDF 第7~8页）"},{"t":"四、风险条目","h":"乌头：全书最危险的一处","c":"风险——第 35 条\"危重病人出现频繁吐口水长时间低烧（出自《伤寒杂病论》——大乌头煎）**乌头 30 克**；注：用三碗水煮成一碗，煮好后放入一碗蜂蜜，再煮成一碗。每天服用乌头蜜一调羹，**切忌不可多服！（乌头有剧毒）**\"。**⚠ 这条必须逐层标明危险**：**（1）乌头（含附子、川乌、草乌）含乌头碱，属剧毒**——口服纯乌头碱 **0.2 毫克即中毒、2—4 毫克可致死**；中毒表现为口唇四肢麻木、心律失常（室速、室颤）、呼吸抑制，**无特效解毒药**（仅对症与血液净化）。**（2）\"30 克\"这一剂量若不经炮制与久煎，足以危重**——经文用乌头须\"炮\"\"去皮\"\"熬黑\"，且须与蜜同煎以缓毒（本条保留了蜂蜜同煎，是正确的减毒法）。**（3）此处仅记原文，绝不可照此配药**——凡含乌头、附子、草乌者，**必须由有资质的中医师开具、在医疗机构内煎制与监护**。**（4）其\"以乌头治重症\"的用法，在当代属严格管控的高风险操作**，多见于危急重症的中西医结合病房，非家庭可用。","o":"RJ-3109 · 经方经验总结大全 259 方（PDF 第10页）"},{"t":"四、风险条目","h":"浓盐水催吐：一条不可照做的治法","c":"风险——第 31 条\"**三叉神经痛（民间验方）**：以钝物刺激天突穴辅以浓盐水催吐，每日一次，不出三日即可好转。\"**⚠ 必须明确警告**：**（1）浓盐水催吐可致高钠血症**——大量摄入高浓度盐水后催吐，血钠急升可致**意识障碍、抽搐、脑水肿甚至死亡**；儿童与肾功能不全者尤危。**（2）物理刺激天突穴（胸骨上窝）催吐**，可致误吸（吸入性肺炎）、喉痉挛、心跳骤停（迷走反射）。**（3）三叉神经痛的一线治疗为药物**（卡马西平、奥卡西平；难治者行微血管减压术），**催吐并无止痛机制**，其\"三日好转\"之说无依据。**本条收录的意义是记录\"其文集收录了此类民间验方\"这一事实**，读者切不可照做。**凡\"以吐、以泻、以汗\"强行驱病的峻法，都须有明确适应证与监护条件，不能作为家庭自我治疗。**","o":"RJ-3110 · 经方经验总结大全 259 方（PDF 第9页）"},{"t":"四、风险条目","h":"克数不能直接照抓：一个换算问题","c":"风险——全书剂量以\"克\"标注，但其来源是经方（汉代度量衡），**须留意三点**：**①部分剂量可疑偏大**——如第 26 条半夏泻心汤\"**半夏 125 克**\"、第 21 条乌梅丸\"**乌梅 300 个、黄连 250 克**\"、第 19 条腰椎间盘突出\"**白术 100 克**\"，此类克数若按现代煎法一次服用，**远超常规日用量**，多半是**一料（多日量）而非一剂**。**②剂型差异决定剂量**——粉剂、蜜丸的\"克\"是**整料总量**（如\"黄连 250 克\"做成 6 克药丸，一日三次、一日一丸），与汤剂的\"克\"（一剂）不可混算。**③须由医师换算**——经方\"一两\"约合今 15.6 克（汉制），但现代临床多按 3—9 克取用，安全区间由医师依病情、体质、配伍决定。**结论**：本书可作**方证对应的检索工具**，**不可作为抓药清单**——其克数是\"某方某量的记录\"，不是\"某人某次的处方\"。","o":"RJ-3111 · 经方经验总结大全 259 方（PDF 第6~10页）"},{"t":"四、风险条目","h":"与糖尿病有关的两首方","c":"要点——第 21 条\"糖尿病的基础方\"给出两方，可与其糖尿病专论对读：**处方一（出自《辅行诀五脏用药法要》——大补肝汤）**——\"桂枝 47 克、干姜 47 克、五味子 47 克、竹叶 16 克、旋覆花 16 克、大枣 12 枚、代赭石 16 克\"；**处方二（出自《伤寒杂病论》——乌梅丸方）**——\"乌梅 300 个、黄连 250 克、蜀椒 63 克、黄柏 94 克、细辛 94 克、当归 63 克、桂枝 156 克、炮附子 94 克、干姜 94 克、人参 94 克\"，注\"加工成 6 克药丸，每日三次，一日一丸\"。**两方的共同点**：**皆非滋阴清热套路的\"治消渴\"方，而是温阳、调肝、辛开苦降之剂**——大补肝汤以桂枝、干姜、五味子温收，旋覆花、代赭石降逆；乌梅丸以乌梅酸收、黄连黄柏苦寒、附子干姜蜀椒辛温，属**寒热并用**。这与其\"消渴本在厥阴、不可一味滋阴\"的主张一致（见糖尿病专论）。**须提醒**：乌梅丸含**附子、细辛**，剂量与炮制须严格；糖尿病患者的用药尤须与降糖方案协同，**不可自行停用胰岛素或口服降糖药**。","o":"RJ-3112 · 经方经验总结大全 259 方（PDF 第6页）"},{"t":"一、纲领","h":"扶阳派的三不出口","c":"定义——此篇开宗明义给出\"扶阳派\"的三条界线，倪海厦自述这是\"**我学习扶阳大家做的一小部分笔记**\"（即其整理他人之学，非本人独创，须与前述各篇区分）：**①诊断不出《黄帝内经》**；**②处方不出《伤寒》与《金匮》**——\"**不使用除此以外的方子**\"；**③药物选用依据《神农本草经》**。其原文：\"中医扶阳派治所有的癌症，**诊断不出黄帝内经，使用处方不出伤寒与金匮，不使用除此以外的方子，药物选用依据神农本草经的说明使用**。\"**这条\"三不\"的意义**在于：它把一切有效的治法限定在**三部经典之内**，凡出于后世方书者（如温病派之方、时方）皆不取。**其自陈的简化程度**更是夸张：\"如果学到它的神，你就可以**从最表面的感冒开始一直治到人体生病到最极限的肝癌**了；**诊断的方式简单到问几个问题、看一下气色，就已经结束了，多数时连脉都不必诊了**\"，并称扶阳大家\"早就已经把所有的医学理论**简化到如爱因斯坦的 E=mc²** 了\"。**须说明**：这种\"一以贯之\"的自信，既是其体系的力量来源（用一个原理统摄万病），也是其最脆弱处——**当一个理论声称能解释一切时，它就难以被任何反例证伪**。对读者而言，**可取其三经典据，不可取其\"连脉都不必诊\"的断言**。","o":"RJ-3113 · 中医扶阳摘记·开篇（PDF 第3页）"},{"t":"一、纲领","h":"四十五个病症的名目","c":"要点——本篇按病症编排，目录共约**四十五题**，其全目为：感冒、乳癌、胃癌、儿科、高血压、糖尿病、胆固醇、高血脂、营养药物、保养自己、心脏病、肝癌、子宫颈癌、舌癌、红斑狼疮、肺癌、血癌与摄护腺癌、永久性肺炎、肾病尿毒症、类风湿、脑瘤、听力散失、帕金森、铜中毒、大肠癌、颈椎瘤、失眠、甲状腺癌、扁桃体炎、脑垂体瘤、癫痫、夜尿、胰脏癌、**疫苗瘫痪**、子宫肌瘤、淋巴癌、多发性骨髓瘤、骨癌、更年期、慢性阑尾炎、忧郁、皮肤癌、腹痛、鼻炎、白血球过低。**这张目录的价值**在于：它是倪海厦（或其所本）**按病统方**的一次完整示范——**每一题之下即是一组\"该病如何辨、用何方\"的直答**，与其\"从感冒治到肝癌\"的自述相表里。**须留意两处**：**①\"疫苗瘫痪\"**一题的存在，表明反疫苗立场在此亦有专论（见艾滋病与疫苗立场一章的划界）；**②\"营养药物\"与\"保养自己\"**两题，属于**日常调养而非治病**，是全篇中最易被误用为\"人人可服\"的部分。**阅读次序建议**：先看感冒与心脏病、糖尿病三节（体例最完整），再看各癌（多为病案式），最后看调养两节（须谨慎）。","o":"RJ-3114 · 中医扶阳摘记·目录（PDF 第5~6页）"},{"t":"二、感冒三分","h":"太阳中风：中于风，不是脑中风","c":"定义——本篇第一个知识点，是把\"太阳中风\"与俗称的\"脑中风\"划清：\"**所谓太阳中风不是你们所想象的那种中风，是中于风**。比方说开车，冷气没开很闷热，结果窗户一开，风一吹，就中于风；在海边风很大，因为吹到风而感冒，所以叫中风。\"**其症状**：\"**有一点微汗，项强，头痛，发烧**。\"**其治**：\"这时候就用**桂枝汤剂（五味药）**来治疗\"。**这一条的价值**在术语的澄清——**\"中风\"在《伤寒论》里指\"伤于风邪\"，与后世\"脑卒中\"同字而异义**，初学最易混淆；他以\"开窗吹风、海边吹风\"两个日常场景作解，比任何定义都直观。**须提醒**：此处\"桂枝汤五味药\"即桂枝、芍药、生姜、大枣、炙甘草；其适应证为**有汗、脉浮缓**的表虚证（见医案章的\"虽无恶风，但脉浮缓、有汗出，就可以用桂枝汤\"），**若高热无汗、烦躁者不可用**。","o":"RJ-3115 · 中医扶阳摘记·感冒（PDF 第7页）"},{"t":"二、感冒三分","h":"太阳伤寒：麻黄汤与\"麻黄不单用\"","c":"方法——第二分是**太阳伤寒**：\"伤于寒症，比如说冬天的时候天气太冷，或者在冷气间里面工作，得到感冒是因为伤于寒\"，其症：\"**全身恶寒、怕冷、全身没有汗、高热、身痛、骨节像鞭打一样，很痛**\"；其治：\"**麻黄汤剂（四味药）**\"。**其后有一段关于麻黄的辩护，极为重要**：**①批评**——\"很多人有一个错误的观念，认为麻黄不好，其实是因为有些人拿**单味的麻黄**来提炼成减肥药\"；**②原则**——\"**北派中医在用麻黄的时候，从来不单味用药**\"，故\"现在美国联邦政府规定只有医师可以用麻黄\"；**③用途**——\"在治疗太阳伤寒的时候，一定要用麻黄，**我用麻黄治疗很多气喘，没有麻黄治不好**，像慢性支气管炎、咳嗽、气喘、百日咳\"；**④配伍**——\"**麻黄一定跟桂枝**，因为**麻黄是开表，所谓开表就是把毛孔打开来发散汗**；如果你光吃单味麻黄，心脏当然跳动快，**所以要加炙甘草，炙甘草可以让恻悸的心脏缓和**\"。**这一段的实用价值最高**：它把\"麻黄为何被误解\"（被当作减肥药滥用）、\"麻黄为何必须配伍\"（开表之力须以桂枝相配、以炙甘草护心）说得很清楚。**安全提醒**：麻黄含麻黄碱，**高血压、心脏病、甲亢、失眠者及孕妇慎用或禁用**；剂量与配伍须由医师决定，**不可自购单味麻黄煎服**。","o":"RJ-3116 · 中医扶阳摘记·感冒（PDF 第7页）"},{"t":"二、感冒三分","h":"太阳温病：葛根汤与\"南方无伤寒\"之辨","c":"要点——第三分是**太阳温病**，其解最见其立场：\"**小孩子得的比较多，温病是在温热的环境下得的病**。这时就讲到南派的中医，他们认为长江以南都是温病，因为温热，所以**南方无伤寒，这是完全错误的**。**当初张仲景讲温病，是因为小孩子好动，到处跑来跑去，热了所以流汗，在流汗的状态下所得的感冒，所以叫温病**，而不是说在温暖的地方才有这种病。于是就衍生出了温病派的南派中医，然后说南方无伤寒，所以**弃伤寒论不用**。其实在佛罗里达就常常改善很多太阳伤寒，就是用麻黄汤剂来治疗。\"**其症状与方**：\"**小朋友一感冒，喉咙痛，葛根汤症，葛根汤（复方，七味药）就是来治疗温病的**。\"**这一条的辩驳值得记录**：他把\"温病\"从**地域概念**（南方多温病）还原为**状态概念**（**汗出之时受风**），并以自己在佛罗里达（炎热之地）用麻黄汤改善多例太阳伤寒为反证——**\"地域不能决定病性，汗出与否才决定\"**。**这一反驳在逻辑上是成立的**：若病性由气候决定，则同一地区不应出现伤寒证；而其临床所见否定了这一点。**须说明**：温病学派自有其针对温热病的方药体系（如银翘散、白虎汤类），**\"南方无伤寒\"这一口号被否定，不等于温病学整体无效**——两者是不同证候的应对，不必互斥。","o":"RJ-3117 · 中医扶阳摘记·感冒（PDF 第7页）"},{"t":"二、感冒三分","h":"三层感冒：三张方与三种状态","c":"要点——把上述三分并列，可得一张极简的\"感冒首诊表\"，其分方之据只有一个变量：**有汗／无汗**。**①有微汗、项强、头痛、发烧**（中风）→ **桂枝汤（五味）**；**②无汗、恶寒、高热、身痛、骨节如鞭打**（伤寒）→ **麻黄汤（四味）**；**③汗出时受风、喉咙痛**（温病）→ **葛根汤（七味）**。**三方的用药规模也递增**：五味→四味→七味，而其法度不变——**皆以\"汗\"为眼**：有汗者调和营卫（桂枝汤），无汗者开表发汗（麻黄汤），汗出而津伤者升津解肌（葛根汤）。**这张表的意义**在于：它把\"感冒\"这一笼统的病名，压成了**三个可在问诊时当场分出的状态**——\"**你出汗吗**\"这一问，即是分方的关键。**这一思路与其医案中的\"问汗\"一项完全对应**，可见其\"问诊十二项\"中的每一项都不是虚设。","o":"RJ-3118 · 中医扶阳摘记·感冒（PDF 第7页）"},{"t":"三、风险","h":"扶阳方的两条硬约束","c":"风险——\"扶阳\"一路的核心用药是**附子、干姜、桂枝、麻黄、细辛**一类温热之品，其风险须明列：**①附子**——生附子含乌头碱，**必须炮制（炮附子）并久煎**（先煎 1—2 小时至口尝无麻感），中毒表现为口唇麻木、心律失常、呼吸抑制；**孕妇、心律失常者、阴虚火旺者禁用**。**②麻黄**——见前述，**高血压、冠心病、甲亢、失眠、前列腺肥大者慎用**；与西药 MAOI、部分降压药有相互作用。**③细辛**——含马兜铃酸（马兜铃科），**长期或大剂量使用有肾毒性风险**；\"细辛不过钱\"（传统一日量约 3 克）之说即由此而来。**④\"连脉都不必诊\"这一自述不可照做**——扶阳诸家实际皆重脉（尤其辨\"脉微欲绝\"之少阴证），**若真按\"问几个问题、看一下气色\"就下温热重剂，风险极高**。**结论**：扶阳之法**有其明确的适应证（阳虚寒盛、脉微肢冷、舌淡苔白）与明确的禁忌（阴虚、实热、瘀热）**，\"温热\"本身不是普适的补法；**凡服温热药后出现口干、咽痛、失眠、便秘、血压升高者，即为不对证，须停服并就医。**","o":"RJ-3119 · 中医扶阳摘记·感冒、心脏病、肾病尿毒症等篇（综合）"},{"t":"一、总则","h":"下盘绷紧、上盘放松：一套阴阳分工","c":"方法——文式易筋经十二式的共同要求只有一条，而这条决定了全功的性质：\"**易筋经所有动作的下盘都是一样：脚趾抓地，下半身肌肉绷紧，自然而然就会提肛；相对下半身的紧绷，上半身是放松的。**\"其原话讲得更具体：\"**肚脐以下要绷紧**，所谓绷紧的意思就是……**用手去打肌肉，肌肉会弹起来，会很强硬**；**上半身是松的**，这是松和紧。\"并给出**为什么这样分工**的解释（第十二式处）：\"**下半身绷紧就是要把阴固住，上半身练阳；当你一放松，这阴阳就流行得非常快，这是练功夫的一种诀窍。**\"**其可理解处**：下肢等长收缩（腿、臀、盆底持续用力）确实能提升稳定性、促进静脉回流、并自然激活核心；与上肢的松柔形成对比，正是传统导引\"上虚下实\"的典型构造。**唯一须注意**：**\"绷紧\"不等于\"憋气\"**——全程须保持自然呼吸，若出现头晕、血压升高、胸闷，应立即放松；**高血压、青光眼、疝气、孕期者不宜做长时间的下盘持续发力**。","o":"RJ-3120 · 文式易筋经·第一式（PDF 第1~2页）"},{"t":"一、总则","h":"寸劲：只在一寸之间","c":"定义——十二式共用一个发力原则：\"**只在一寸之间发紧**\"，其自述：\"上半身松掉，然后**只在一寸之间发紧**，指头往上抬，感觉好像是你手撑着桌子上跳起来这种感觉\"；并特别强调：\"**中国的功夫就在寸，一寸之间，这叫寸劲**\"；\"**转就转一点点，不需要大**\"；\"如果这样……转很长，然后筋伤到了\"。**其对\"寸劲\"的解释**（打比方）：\"**如果我们打人家，你这边用很大的力下去，速度就慢；所谓寸劲就是你感觉到全方位……就是要放松，快要打的那一刹那出力**，所以听起来的声音就不一样。\"**这一原则的实用价值**：**大幅度的动作伤关节，小幅度的发力练筋**——**动作幅度压到一寸，等于把\"位移\"换成了\"张力\"**，这正是等长／微动训练的思路。**对初学者最要紧的一句**是\"**不需要大**\"：若把十二式做成大幅伸展，反易致肩、腕、腰的损伤。","o":"RJ-3121 · 文式易筋经·第一、九式（PDF 第2、第4页）"},{"t":"一、总则","h":"呼吸与次数：四十九下","c":"方法——每一式的**次数固定为四十九下**，呼吸与之配合，规律为：**吸气时握紧／上提，吐气时下压／松开**（如第二式\"手臂伸直慢慢吐气，整个手握拳往下压，然后吸气上半身放松，握拳向上提\"；第三式\"吸气的时候拳头尽可能握紧，然后吐气将拳头向下放松开\"）。**其体感描述**（第一式）：\"**可能你做到第 30 个就开始出汗了。出汗的时候你摸摸背后，冰的**——因为背后是太阳，**太阳是寒水**……你一用力的时候，**玄府（毛孔）会打开来，汗水会出来，汗水出来后肠胃的津液会再补回去**，这时候把津液往外推，也就是说，**你不用跑步，一练马上就会出汗**。\"**须说明**：\"背后汗冷＝寒水排出\"是中医的解释；**从生理看**，等长收缩产热、交感兴奋、汗腺分泌增加，汗液蒸发时体表温度下降，确会有\"汗冷\"之感，**这一现象本身是真实的，其\"排寒\"的归因则属中医理论**。**初学者建议**：**不必强求 49 下**，可从每式 20—30 下起，逐周增加；**饭后一小时内、极度疲劳、发热时不宜练**。","o":"RJ-3122 · 文式易筋经·第一~三式（PDF 第1~2页）"},{"t":"二、十二式","h":"第一、二式：按跷式——心包与肺","c":"方法——前两式同名\"**按跷式**\"，其唯一差别在**手指翘起的方式**，也即所练之经不同。**第一式（练心包）**：\"**背挺直，眼睛瞪大，舌头顶在上颚，牙齿咬紧；自然抬起手掌，然后向下压，就好像手按在桌子上要跳起来的感觉；手下压的动作做一寸的距离就好**；吸气的时候手掌上提，吐气的时候手掌下压。\"其取名之据：\"**这一式因为手指往上翘，中指头是心包经，主要锻炼心包。**\"**第二式（练肺）**：\"**手握拳，大拇指往上翘，对齐裤线的位置**；同样下半身紧绷，上半身放松，手臂伸直慢慢吐气，整个手握拳往下压，然后吸气上半身放松，握拳向上提。\"其取名之据：\"**大拇指是手太阴肺经**……**五个手指头里面最有力的是大拇指**……**如何去练大拇指练肺的阳？这就是第二个动作**。\"**其共同的\"为什么\"**（第二式讲得最透）：\"**在练任何功夫，你一定要了解它的原由，为什么要这样子练，这样你才会练得很标准**\"——并举\"气动工具（空气压缩机）靠气压产生力量\"为例，说明\"肺主气\"与\"拇指最有力量\"之间的类比。**这一取象方法**（经络所过之指／经，决定翘哪一根手指）**是其功法的构造原理**；**其有效性**在传统导引体系内成立，**但\"翘中指即练心包\"无现代解剖学对应**。","o":"RJ-3123 · 文式易筋经·第一、二式（PDF 第2页）"},{"t":"二、十二式","h":"第三、四式：开关节与练大肠","c":"方法——**第三式**：\"还是下半身紧绷，上半身放松，**握拳稍微向上提，吸气的时候拳头尽可能握紧，然后吐气将拳头向下放松开**，同样的动作四十九下。\"其目的（原话）：\"**尽量握，握到水都进不去，这样才能够把关节整个打开来**……我们人都难免有点湿……**平常就要练的时候，每天给它清掉，就不会有大问题**。\"**第四式**：\"**手在握拳在肚脐处，不用贴到肚子上**，下半身一样绷紧，上半身放松；**然后吸气握紧拳，吐气的时候手往前扳**，做四十九下。\"其经络归属：\"**这个前扳的时候，这里是大肠经，这个是什么啊？肺经**。\"**两式的分工**：**第三式练\"握\"（手指与前臂的张力，开指关节），第四式练\"扳\"（腕与前臂的屈伸，牵动大肠经与肺经）**。**握拳有一条反复强调的要领**（见下条），**若不照做，此二式最易伤腕**。","o":"RJ-3124 · 文式易筋经·第三、四式（PDF 第2~3页）"},{"t":"二、十二式","h":"第五、六式：胸口与沉肩","c":"方法——**第五式**：\"**手在胸口这边，正中间是你的膻中穴**，握拳**不要碰到胸，不要碰到心脏、胸口**；下半身绷紧，上半身……**吸气时握拳，吐气时松开**；**注意沉肩，肩膀不要提起来**，做 49 下。\"**第六式**：\"下半身也是绷紧，**上半身手是握拳的正前方**……**肩膀沉肩，肩膀要沉下来不要出力**，握四十九下。\"其要诀：\"**握的时候永远诀窍是一样：下半身永远绷紧，当你在握的时候，上半身跟着绷紧，握到极限的时候全身是紧的；然后松掉的时候只有上半身松掉，下半身还是保持紧的。**\"**两式的意义**在于把\"松紧\"的层次讲清了：**不是\"上松下紧\"的静态二分，而是\"握到极限时全身皆紧、松时只松上半身\"的动态交替**——**紧是发力，松是回收，下盘始终为锚**。**\"沉肩\"这一要求尤其重要**：**耸肩发力会使颈肩代偿，是此类功法最常见的错误**。","o":"RJ-3125 · 文式易筋经·第五、六式（PDF 第3页）"},{"t":"二、十二式","h":"第七、八式：排留饮","c":"方法——此二式的目标明确指向\"**饮**\"（水液停聚），其自述：\"**为了避免身上有留饮，对不对？留饮都不好。第七个动作呢是脚手要一起动**\"；**第七式**：\"**手提上来以后转过来，往后撤出去，吸气，身体这样往后拉一下，脚是往上扳**\"——**双手向身后拉伸，同时两个脚尖向上翘**，其经络归属：\"**因为有关系到跷脉跟阳维脉**\"；**第八式**：\"**手在上面……仰，握拳**，握四十九下\"；其理：\"**你下半身是绷紧的，那你力量集中在下半身，这个阳会一直缩……利用呼吸的时候这个阳会逼上来，逼上来把身上的一些饮排掉**\"；\"**这就把浊物，一些停饮、留饮、支饮，统统给它排掉**。\"**须说明**：\"留饮、支饮\"是《金匮》水气病与痰饮病的病名（见金匮篇），此处借以指**体内停滞的水液**；**从生理看**，\"脚尖上翘＋体后伸＋握拳发力\"的组合确实能**激活小腿后侧与足太阳经线、促进静脉与淋巴回流**，与其\"排水\"的意图在方向上一致。","o":"RJ-3126 · 文式易筋经·第七、八式（PDF 第3~4页）"},{"t":"二、十二式","h":"第九、十式：辘轳式","c":"方法——第九、十式合称\"**辘轳式**\"，其名取自井上绞水的工具：\"**过去在井旁边要把水拉出来，用这辘轳式机器，叫辘轳，可以转呀**\"；其动作：\"**下半身绷紧，这个手这样……下半身不动，上半身转，握拳，然后上半身越来越紧，紧到不能再紧时再转上半身**\"；**关键限制**：\"**这不是说要全部转过来，而是下半身还是不转，只有上半身转，转一点点，左边一个**\"；其理：\"**转就转一点点，不需要大，中国的功夫就在寸**\"。**这一式的设计最见其\"寸劲\"思想**：**在躯干已绷到极限时，只加一个极小的旋转**——**\"紧到不能再紧时再转\"，等于在最大张力上叠加微小位移，是最典型的抗旋等长训练**。**须提醒**：**腰椎有病变者（间盘突出、椎体滑脱）不宜做旋转发力**，可将旋转改为\"抗旋\"（即只维持张力、不实际转动）。","o":"RJ-3127 · 文式易筋经·第九、十式（PDF 第4页）"},{"t":"二、十二式","h":"第十一、十二式：后拉与张弓（练阳）","c":"方法——**第十一式**：\"**手握拳，正面肚脐以下是绷紧的，肚脐以上，从后面拉；握住拳以后慢慢往后拉，拉到你不能拉了，放松下来；吸气，慢慢吐气**。\"**第十二式**：\"**握拳在胸前——这是阴和阳的地方；要把阳气调得很旺的时候，阳要张。所以在胸前，指头这样子握拳，注意要绷紧，好像张弓一样，把弓拉开来**，做 49 下。\"**第十二式是其\"练阳\"的总成**：\"**下半身永远是绷紧的；上半身——练易筋经的时候，舌头要顶住上颚，眼睛瞪目，往前瞪**\"；\"**练阳，这是练阳气的动作**……**这个小动作，当你练 49 下，你的胸阳很旺**\"；并附一句功效推断：\"**胸阳旺起来胸肌会起来；瞪眼的练，视力会改变——近视就是阳虚**\"。**⚠ 最后一句须标明**：\"瞪眼练功可改变视力、近视即阳虚\"**无医学依据**——近视的成因是眼轴过长或屈光力过强，**练功不能改变眼轴**；**但\"瞪目、舌抵上颚、挺胸\"作为姿态训练，确能改善头前倾与上交叉综合征，从而缓解视疲劳**——**这是它可能有效的现实路径，与\"治近视\"不是一回事**。","o":"RJ-3128 · 文式易筋经·第十一、十二式（PDF 第4~5页）"},{"t":"三、应用与注意","h":"风寒初起：练功出汗与桂枝汤两条路","c":"要点——本篇开篇即给出这套功法的**应用场景**：\"**当人体外感风寒的时候，寒湿进入体内，如果停留在肌肉关节里，会感觉到肌肉关节酸痛**。所以**久坐电脑或长时间低头玩手机都容易让身体受风寒**；如果肌肉关节酸痛就是信号，有风寒入体了。这个时候可以**喝桂枝汤（桂枝 3 钱、白芍 3 钱、炙甘草 2 钱、生姜 2 片、大枣 12 枚）解肌发汗，也可以练练文式易筋经**——**练完身体也会出微微的一层细汗，也可以把风寒排出体外**。\"并引张仲景之言作结：\"**服食节其冷热，苦酸辛甘，不遣形体有衰，病则无由入其腠理。腠者，三焦通会元真之处。**\"**这一条的价值**在于它把\"治未病\"落到了两个可执行的动作上：**一是初起即解（喝桂枝汤或练功出汗），二是不使形体有衰（节饮食冷热、常练强身）**。**须提醒**：**桂枝汤是方剂，须辨证（有汗、脉浮缓）后使用**，不可作为日常保健饮品常服；**练功出汗后须避风、及时更衣**，否则反受风寒。","o":"RJ-3129 · 文式易筋经·开篇（PDF 第1页）"},{"t":"三、应用与注意","h":"练前先做五脏逼毒法","c":"方法——第十二式之末附一条**前置要求**：\"**练易筋经之前先做五脏逼毒法。逼毒法很简单，做得好的话，如果你身体浊物比较多，会吐痰之类的，有的人甚至会呕出来。**\"**其位置**在整套功法之前，作用是\"**先清后练**\"——**即先把郁积之物排出，再行补练**，这与中医\"先攻后补\"\"邪去正安\"的次序一致。**须说明**：本篇未载\"五脏逼毒法\"的具体动作（其详在另处），故此处只能记其**位置与作用**，不能补出内容——**这也是整理其文稿时须守的界限：不凭推测补写原文未载之法**。**就练功次序的一般原则而言**，\"先做清理性动作、再做建构性动作\"是合理的：**若体内有急性炎症、发热、痰多咳嗽，应先休息或就医，不宜以\"逼毒\"自行处理**。","o":"RJ-3130 · 文式易筋经·第十二式（PDF 第5页）"},{"t":"三、应用与注意","h":"握拳要平：一条防伤腕的硬要领","c":"风险——十二式反复强调同一件事，因为**握错即伤**。原话（第一式最详）：\"**你们看这个三角形，这个有角度，真正的握拳是这个样子——把自己拳头调整，调整平，这一定是平的；第二个呢，你看这两个骨头，一定是跟这两个尺骨跟桡骨成平行的、直的。这样子你才有力；你这打不会受伤。如果你这样打，手腕就受伤了；如果你打完架手腕都受伤就是笨蛋**\"；第三式再申：\"**握拳的时候注意拳头要握平**\"。**其解剖学依据很清楚**：握拳时若腕关节屈曲或尺偏，**腕管内压力升高、肌腱与韧带受剪切**，久之易致腕管综合征与 TFCC（三角纤维软骨复合体）损伤；**保持腕中立位（与尺桡骨成一直线）**，则力线沿前臂传递，不易受伤。**这一条是全部十二式中最可直接验证、也最实用的一条**——**无论练不练此功，凡握拳发力（提重物、做俯卧撑、打拳）皆应守此**。","o":"RJ-3131 · 文式易筋经·第一、三式（PDF 第2页）"},{"t":"一、生平","h":"从摇滚青年到中医师：一条自述的路径","c":"要点——据 2009 年《中国之声·国学堂》梁冬访谈（第一讲），倪海厦自述其生平节点如下：**出生在台北**；**高中时代开始学医**；**一九八〇年移民美国**；\"在美国从头到尾大概**将近二十九年**\"（访谈时 2009 年）；身份为\"**美国汉唐中医学院院长、加州中医药大学博士班指导教授**\"。**其少年时的兴趣并非医学**：\"年轻的时候喜欢玩音乐……台北的年轻人以能够弹一些西洋音乐为荣\"；并自述\"我在东吴（大学）的时候，就能当'热门音乐合唱团'的团长\"。**转向医学的原因**（其自述）：\"玩音乐是个兴趣，**没有办法当职业**……**音乐对我来说只是嗜好，我没有办法把它当成终生的资质**；而医这方面我倒很希望能够把一生所学贡献出来。\"**这段自述的价值**在于它给出了一个**非科班出身者的成才路径**——**兴趣先行、自学为主、师承为辅**，与其后来\"只要多读黄帝内经就自然会的\"一语相呼应。","o":"RJ-3132 · 梁冬对话倪海厦·第一讲（PDF 第3~5页）"},{"t":"一、生平","h":"两位启蒙老师：周左宇与徐济民","c":"要点——其师承脉络极为具体，是理解其学术面貌的关键。**第一位**：\"我的一个老师叫做**周左宇**，他是以前**北京的四代家传的名医**，1949 年以后到台湾\"；拜师缘由：\"我妈妈看我喜欢读医书……让我拜个老师学学中医\"；初见时的怀疑与转变记述得很生动：\"**我刚开始还不相信：几根针能做什么？他还当场表演给我看，有个病人腰痛，针下来当场就好！我说：诶！这个真是不错啊**\"——**正是这一针见效的现场，使他进入中医**。访谈时周左宇\"还在台湾，还活着，已经快一百岁了\"。**第二位**：\"另外一个是**徐济民**，是我的启蒙恩师，他是**江苏来的，在上海的名医，他针灸非常厉害**\"；\"**是这两个老师引领我进入中医的大门**\"。**但有一条须特别注意**：\"**至于经方呢，倒不是他们两个传的，经方已经断代**\"——即**其针灸得自周、徐二师，而其经方之学另有来源（自学与私淑）**。**这一区分很重要**：其著作中\"针\"与\"方\"的部分来源不同，**针灸部分有明确的师承（周左宇、徐济民一脉），经方部分则是他自《伤寒》《金匮》直读而得的私淑之学**。","o":"RJ-3133 · 梁冬对话倪海厦·第一讲（PDF 第4~6页）"},{"t":"一、生平","h":"十七岁的第一张处方：《医宗金鉴》","c":"要点——这是他反复讲述的学医起点，细节完整、可复述：**缘起**——二姐\"长年的月经痛，每次月经一来就月经痛\"，\"她又很害羞，不愿意到医院去给西医看\"；**她找弟弟的方式很特别**：\"**她说：海厦，这样子，我买一套医书，你来看，看完以后，你来帮我治疗这个月经痛**\"；**所买之书**——\"她也不晓得什么医书好坏，就买了**《医宗金鉴》**\"；**研读方式**——\"我一看，哇，什么内科、外科什么都有；就想，她妇科嘛——月经痛，**我就专看妇科那里，大概看了三个月**\"；**结果**——\"我说：我开个处方，看你应该这样子就会好。结果我姐就抓了药……**从那时候开始到现在，月经也没有痛过，一直更年期了，都很好**。\"**这段经历的方法论意义**远大于其故事性：**①按需选读**——不从头读到尾，只读\"妇科\"一门三个月；**②以一书为纲**——《医宗金鉴》是清代官修的大型综合医书（含《订正伤寒论注》《金匮要略注》《删补名医方论》等十五种），**一书之内已备经方与方论**，故可作为入门总纲；**③以亲人为第一个验证对象**——即\"先在熟悉的人身上验证\"。**这一路径对自学者是可复制的**：**择一部有体系的综合医书为纲，按需精读一门，先解近亲之小病**。","o":"RJ-3134 · 梁冬对话倪海厦·第一讲（PDF 第5页）"},{"t":"二、学医方法","h":"师徒制与学院制：一条立场鲜明的对比","c":"要点——访谈中他对两种传承方式有一段直白的比较，可与天纪\"尊师重道\"之说合看：\"**中国几千年来，没有什么中医药大学什么东西，都是师徒传下来，或者是爸爸传儿子**……**传子不传媳不传女**\"；而台湾的情况是\"**他们不见得说一定要传自己的儿子，找有他们觉得有慧根的、有能力的、有聪明才智的来教**，他们觉得这是他们的荣幸\"。**其对\"学院制\"的评价**是：**古代无\"中医药大学\"这种建制，学问靠师徒相授**。**须辨明**：**师徒制之长在\"因材施教、边做边学、责任明确\"；其短在\"难以标准化、覆盖面窄、易失传\"**——中国历代官办医学（如唐之太医署、宋之太医局）其实一直存在，**\"几千年没有中医药大学\"之说并不准确**。**其可采的提醒**是**\"师徒制的核心是'跟'与'责'\"**——学生跟着老师看病人、老师对学生的每一次出手负责，这一层在今日的院校教育中确实薄弱，也正是\"跟诊\"（本批文档中有一份《传统中医跟诊过程》）的价值所在。","o":"RJ-3135 · 梁冬对话倪海厦·第一讲（PDF 第4页）"},{"t":"二、学医方法","h":"\"经方已经断代\"：一个须分辨的判断","c":"要点——访谈中他两次提到\"经方断代\"：一次是说\"至于经方呢，倒不是他们两个传的，**经方已经断代**，台湾也没有什么所谓的……\"（后文被截）。**这一判断的实质**是：他认为**以《伤寒》《金匮》为本的\"经方\"之学在近代一度中断**，故其经方知识是**直接从原典重新接续**而非得自师授。**须分辨**：**\"经方\"在中国并未真正断代**——历代皆有注家与运用者（如柯琴、尤怡、黄元御，近代如曹颖甫、恽铁樵、刘渡舟、胡希恕），**且近年来经方研究在院校与民间同时复兴**。**但他说对了一件事**：**在二十世纪中叶的台湾，经方的系统传授确实不盛**（当地中医教育长期以温病与杂病为主），故他\"直读原典\"的选择在当时的语境中确有其特殊性。**这一背景解释了其著作的两个特点**：**一是\"回到条文本身\"的读法（大量直引原文而不依注家）；二是强烈的\"反温病派\"立场**——**反的对象是当时当地的主流，而非温病学本身的价值**。","o":"RJ-3136 · 梁冬对话倪海厦·第一讲（PDF 第6页）"},{"t":"二、学医方法","h":"兴趣、成功与路径：一段可借鉴的经验","c":"要点——访谈结尾，主持人与他有一个共识性的总结，值得单列：梁冬说\"**兴趣，或者刚开始一点点的成功，对于一个人的这种这一辈子的路向真的很重要**\"；倪海厦的回应是承接其经历：\"**一看，我有兴趣了，这时候开始走入中医界**\"。**这段对话提出的机制很实在**：**早期的\"小成功\"会转化为长期的投入**——他治二姐的月经痛成功（\"对她来说，她结束了；对我来说，没有结束\"），**这一次成功是\"入口\"，而非\"终点\"**。**对学习者的启示**是：**不要一开始就啃最大的难题（如癌症），先在一个具体、可验证的小问题上取得成效**（如月经痛、感冒、便秘），**有了正反馈再深入**。**这与其医案中\"先解近亲之小病\"的做法完全一致**，也与其\"从最表面的感冒一直治到肝癌\"的自述形成同一条成长曲线。","o":"RJ-3137 · 梁冬对话倪海厦·第一讲（PDF 第5页）"},{"t":"一、成方新用","h":"皂荚丸加大枣粉：一个戒烟方","c":"方法——这是 0808 医案中反复出现的一处用法，两案皆有：**①一案处方**——\"**皂荚丸六两 30 粒，大枣粉三两，每次 2 茶匙枣粉汤吞服，饭后吃**\"，其注解直书\"**皂荚丸、大枣粉 → 戒烟**\"；**②另一案**（Bob Messer，\"平素抽烟重\"）——\"**皂荚 3、大枣 2、黄芩 3、黄柏 3、黄连 2、知母 3**，400 caps，8x3 before meals\"，解说\"**1. 抽烟欲戒烟 → 皂荚加大枣；2. 知母去其湿**\"。**其方源**为《金匮·肺痿肺痈咳嗽上气病》之**皂荚丸**（原方\"皂荚八两，刮去皮，用酥炙，蜜丸梧子大，以枣膏和汤服三丸\"），本治\"咳逆上气、时时吐浊、但坐不得眠\"；**倪海厦取\"皂荚涤痰之力峻\"这一点，移用于戒烟**——其思路是：**烟毒积于肺，属\"浊\"，须以峻药涤之，而皂荚恰能涤浊；大枣、枣膏护胃缓其峻**。**须提醒**：皂荚含皂苷，**内服过量可致呕吐、腹泻、溶血**，丸剂须严格按\"梧子大、日三丸\"的旧法起服；**此方非通用戒烟方案**，戒烟的一线方法为行为干预与药物（尼古丁替代、伐尼克兰、安非他酮）。","o":"RJ-3138 · 临床医案 0808（PDF 第2~3页）／金匮要略·肺痿肺痈篇（PDF 第277~288页）"},{"t":"一、成方新用","h":"利膈汤：咽喉吞咽困难的三味组合","c":"方法——一案记\"喉咙觉有异物压迫感，下午易疲倦\"，其注解为：\"**炮附子、栀子、半夏（利膈汤）→ 咽喉吞咽困难**\"；同案另有一条\"**喉咙为肾主管**\"的对应——即**咽喉之病，其根在肾**（少阴经循喉咙）。**\"利膈汤\"之名**出自《三因极一病证方论》的**利膈汤**（附子、栀子、半夏、生姜、甘草一类），其构造是**寒热并用**：**附子温少阴之阳以散结，栀子清上焦之热，半夏降逆化痰开结**——三味相合，专治\"**寒热错杂之咽部梗阻**\"（即半夏厚朴汤所治\"梅核气\"的偏寒者）。**这一条的可取处**在于它示范了**\"寒热并用\"在具体病位上的落地**：**咽部既为肾经所过（故用附子），又是热气上逆之所（故用栀子），还是痰结之处（故用半夏）**——**三味分别对应三个病因，不是随意混搭**。**须提醒**：吞咽困难首须排除器质性病变（食管癌、贲门失弛缓、甲状腺压迫），**不可径以\"梅核气\"论治而延误检查**；附子有毒，须炮制久煎。","o":"RJ-3139 · 临床医案 0808（PDF 第2页）"},{"t":"一、成方新用","h":"牡蛎与生硫磺：肿块为什么用这两味","c":"方法——一案记患者有肿块，其注解给出了一条完整的推理：\"**肿块（钙累积，因年轻时服降压药利尿造成水分丧失，因此钙累积沉淀）→ 牡蛎——咸能软坚；生硫磺入三焦（因肿块在腠理之间）**\"。**两味的分工很清楚**：**①牡蛎**——取其\"**咸能软坚**\"（《本经》谓牡蛎\"主……心下痞热\"，后世以咸味软坚散结），且\"补骨脂＋牡蛎→补肾补钙补骨质\"（0805 案），**即牡蛎兼具\"软坚\"与\"补钙\"两用**；**②生硫磺**——其用不在温阳而在\"**入三焦**\"，理由是\"**肿块在腠理之间**\"（腠理属三焦所主），即借硫磺之\"达三焦\"以引药至病所。**须说明**：\"钙累积致肿块\"这一病因解释**无医学依据**（组织钙化有多种机制，与利尿剂所致的水分丧失无此因果关系）；**生硫磺内服**在中医属特定用法（《本经》列上品，后世多外用），**现代已罕用，且有毒性风险**——**此条只记其配伍思路，不可照用**。**其可取处**在配伍逻辑：**病在腠理→取入三焦之药；病属坚结→取咸味软坚之药**——**\"按病位选药\"的思路比具体用药更值得记**。","o":"RJ-3140 · 临床医案 0808（PDF 第2页）"},{"t":"二、剂量的调整","h":"麻黄与杏仁的等量原则","c":"方法——一案（16 岁女性，手掌鲜红而热、皮肤粗糙有颗粒、毛孔大，诊为\"表实里热，大青龙汤证\"）记录了**一次完整的加量过程**：**首诊**用\"麻黄 3、石膏 1 两、杏仁 3、炙甘草 3、桂枝 3、生姜 2 片、大枣 10 枚、厚朴 2、枳实 2、大黄 2、芒硝 1（分两包冲服）\"；**服后仍无汗**，遂**加量**：\"**麻黄四钱、石膏一两、杏仁四钱、炙甘草三钱、桂枝三钱……**\"，其解说点明加量的理由与配套：\"**本诊处方加重麻黄剂量，加上等量杏仁，避免麻黄使用过量发汗伤及肺阴**\"。**这一条的实用价值很高**：**麻黄发汗，杏仁肃肺润降，二者等量则发汗而不伤肺阴**——**这正是\"药对\"的剂量关系**：不是\"加一味药\"，而是**\"加一量、配一量\"**。**另一层**：**服后无汗不等于药无效**，其判断是\"**药物剂量不足之故**\"（患者曾依嘱以\"孙思邈冷水浴生大热之法\"沐浴，仍无汗），故**加量而非换方**——**\"方对而量不足\"与\"方不对\"须分清**，这是临证的关键分水岭。","o":"RJ-3141 · 临床医案 0808（PDF 第4~5页）"},{"t":"二、剂量的调整","h":"双向调节：汗不出则加、心悸则减","c":"方法——同一案的处置给出了**一对相反的操作**，构成本章最完整的一条剂量纪律：**①加**——\"**汗不出身热不解**\"则**加重麻黄**（3 钱→4 钱）；**②减**——处方后附嘱：\"**本处方服后若觉心跳太快不适，每服减量**\"。**即同一味药，一边可加、一边须减，其界在于\"汗\"与\"心悸\"两个反应**：**汗不出（病未解）→ 可加；心悸（药过）→ 须减**。**这正是麻黄的双刃之处**：**其发汗之力足以解表，其兴奋之性亦足以扰心**——故须以\"**是否得汗**\"与\"**是否心悸**\"两个即时体征，把剂量调在**有效而不伤**的窄区间内。**实操提示**：加量应**渐进而非骤加**（此案仅加一钱），并须**同时增加相制之药（杏仁）**；**凡服含麻黄方后出现心慌、失眠、血压升高，应减量或停服并告知医师**。","o":"RJ-3142 · 临床医案 0808（PDF 第4~5页）"},{"t":"二、剂量的调整","h":"汗出的部位学：为什么只有腋下和膝窝出汗","c":"要点——此案的观察极细致，值得单独记一条。患者服药后\"**腋下及腘中出汗**\"，而身体其余部位无汗，且\"自觉身体痛、肌肉酸痛\"；其解说：\"**腋下及腘中因毛细孔较少，故汗出较明显；至于身体其它部位，乃因毛细孔数量较多，且津液聚于皮肉间尚未能顺利发出，故仍较无汗，且反而产生身体痛、肌肉酸痛的症**状。\"**这一解释的合理处**在于：**汗液须经毛孔排出，毛孔密处（躯干、四肢大面积）排出路径多而单点量少，毛孔疏处（腋下、腘窝）则单点排出明显**；**而当津液已聚于皮肉之间、却未能透出时，即形成\"身痛、肌肉酸痛\"**——**这正是《伤寒论》\"身疼腰痛、骨节疼痛\"属表实无汗的机制描述**。**故\"身痛\"在此不是新病，而是\"汗欲出而未出\"的表现**——**这一判断决定了处置方向：继续助其汗出（加麻黄），而非另治其痛**。**须说明**：此为中医的解释框架；从现代生理看，腋下与腘窝为大汗腺（顶泌汗腺）分布区，其分泌受交感胆碱能纤维控制，与\"毛孔密度\"之说并不完全对应，**但其\"局部先汗、全身未汗\"的临床观察是真实的**。","o":"RJ-3143 · 临床医案 0808（PDF 第5页）"},{"t":"三、禁忌","h":"出汗之后：严禁吹风与入冷水","c":"风险——同一处方后附有一条**极明确的禁忌**：\"**同时服药后约半小时若出汗后，严禁吹风（冷气）及入冷水中。**\"**其理**在《伤寒论》桂枝汤方后注：\"**温覆令一时许，遍身漐漐微似有汗者益佳，不可令如水流漓，病必不除**\"；**汗出之时毛孔开张，风邪与寒水最易乘虚而入**，轻则表证复作，重则转入他经。**此条的实用性远超其方**：**凡服发汗药（麻黄、桂枝、葛根类）后得汗者，皆须避风、避冷、避水、及时更衣**，并**不可大汗淋漓**（\"如水流漓，病必不除\"）。**⚠ 另须提醒一处**：此案患者曾用\"**孙思邈冷水浴生大热之法**\"沐浴以求汗——**此法属古代\"以冷激热\"的极端手段，现代不适用**：冷水浴可致外周血管骤缩、血压升高、诱发心律失常，**心血管病患者尤危**，**不可自行尝试**。","o":"RJ-3144 · 临床医案 0808（PDF 第4页）"},{"t":"一、源流","h":"\"温病\"二字的最早出处","c":"定义——《经方论治》开篇讲\"正统中医学与现代中医学的差异\"，其论证罕见地以学术史入手，先追\"温病\"一词的本源，其原话：\"**最早的温病二字就出现在《黄帝内经》与《伤寒论》中**——《素问·生气通天论》\"**冬伤于寒，春必病温**\"；《热论》\"**先夏至日为病温，后夏至日为病暑**\"；《难经》中也提出\"**湿温、热病、温病**\"的名词；而《伤寒论》里也提到\"**发热而渴，不恶寒者为温病**\"。**这一段梳理的价值**在于：它指出**\"温病\"并不是后世温病派的发明，而是经方原典中已有的概念**——故\"伤寒与温病\"之争，争的不是\"有没有温病\"，而是**\"温病该用何方\"**。**其由此得出的判断**：\"也就是因为这些，于是就造成后世的温病学说；也因为都是说热症，所以他们主张使用**辛凉清解**的治法直到今天。\"**须说明**：其引文可核（《素问·生气通天论》确有\"冬伤于寒，春必病温\"；《伤寒论》太阳篇确有\"发热而渴，不恶寒者为温病\"），**这一段的史料部分是可靠的**，与其平日的激愤文风判然不同。","o":"RJ-3145 · 经方论治·正统中医学与现代中医学的差异（PDF 第6页）"},{"t":"一、源流","h":"从王叔和到《千金》《外台》：温病学的层累","c":"要点——其后他按朝代梳理温病学的形成，脉络清楚、可作简表：**①晋·王叔和**——\"认定温病是因为**四时不正之气**造成的\"；**②隋《诸病源候论》**（\"再四百年以后\"）——\"将温病列出**二十二症候**，又给了温病学术的依据\"；**③唐·孙思邈《千金方》与王焘《外台秘要》**——\"此二巨著皆记载有温病的药方在内，像**温毒、温热、温毒发斑、冬温、冬温发斑**等症状陈述\"；**④宋金元四大家之刘完素**——\"将其治温热病之经验，**也主张使用寒凉之药**\"。**这四步的意义**在于：**温病学不是一次成型的，而是逐代累积**——**由\"病因之说\"（王叔和）→\"症候分类\"（诸病源候论）→\"方药积累\"（千金、外台）→\"治法主张\"（刘完素）**，四层叠起，至明清而大成。**这一梳理的客观性值得肯定**：他虽站在经方立场，却承认温病学有其**逐步形成的文献依据**，而非凭空而生。","o":"RJ-3146 · 经方论治·正统中医学与现代中医学的差异（PDF 第6页）"},{"t":"一、源流","h":"吴有性《温疫论》：转折点","c":"要点——在他的叙述中，明末**吴有性（江苏震泽人）**是真正的转折人物，其背景与主张被讲得很完整：**①时代背景**——\"明朝末年（崇祯十四年），当时因为**战乱而导致人民东奔西离、居无定所**，生活困苦之下造成**疫病流行**\"；**②旧法的失败**——\"当时医师使用**伤寒法**治疗这疫病，**却没成效**\"；**③新说**——\"吴有性认为**伤寒与温病二者截然不同**，温病是因为**天地间别有一种异气所感，非风非寒非暑非湿**\"；**④著作**——\"就在第二年，著作《**温疫论**》\"；**⑤其内容之详**——\"书中对于温疫的**传染病源、途径、与人体的抵抗力多强**等等都写得很详细，甚至包括**动物的传染，如鸡瘟、鸦瘟、猪瘟、牛瘟**等等，都发现到**同类动物传染同样的瘟疫、不同动物间不受传染**\"；**⑥与王叔和之别**——\"他虽然与王叔和都主张温病，但二者看法却不同：**王比较认定是气候造成温病，而吴比较倾向是口鼻吸入疠气所造成的温病**\"；**⑦其地位**——\"《温疫论》可以说是**我国第一部专论温疫病的书**\"。**这一段是全章最有价值处**：它指出**吴有性的贡献在于\"病原\"层面的突破**——**从\"气候致病\"转向\"疠气（特异性病原）致病\"，并已观察到\"同类动物相传染、异类不传染\"这一传染病学的基本特征**。**这一观察，比西方确立病原体学说早了两百余年**，是现代医学史亦承认的成就。","o":"RJ-3147 · 经方论治·正统中医学与现代中医学的差异（PDF 第6页）"},{"t":"一、源流","h":"叶天士与卫气营血","c":"要点——叙述至清代，落在他真正的批评对象上，但其记述仍具体：**①叶桂（字天士，安徽人）**——\"他先后曾**拜十七位师父**学习各家之长，一生没有多少著作，其《**温证论治**》与《**临证指南医案**》**都是他的学生帮他编辑而成**\"；**②其核心主张**——\"他基本上认为'**温邪上受，首先犯肺，再逆传心包**'，就是**由呼吸道先感染**，施治不当就会**神志昏乱**\"；**③其辨证框架**——\"其辨证时采用'**卫、气、营、血**'，就是**卫——表，气——由表入里时**，而**营、血就是里症**；也就是说**病情由卫进入营血就是越来越重**\"；**④其治法**——\"采用**清热解毒、芳香开窍、养阴生津**之法\"；**⑤同时代者**——\"当时有一人与叶天士齐名，叫做**薛生白**，著有《**温热病篇**》，其与叶有相同的看法\"。**这段记述的准确度较高**：\"温邪上受，首先犯肺，逆传心包\"确为叶天士《外感温热篇》名句；卫气营血四层辨证亦确为其所立；\"拜十七位师父\"之说见于其传记。**须辨明**：**卫气营血与六经辨证并非互斥，而是两套\"分层\"框架**——六经分表里与阴阳之层次，卫气营血分温热病之浅深；**两者所对治的病种侧重不同**（前者以寒邪为主，后者以温热／疫气为主）。**\"谁对谁错\"这一提问方式本身，是把两套不同用途的坐标当成了同一个坐标的两个候选答案。**","o":"RJ-3148 · 经方论治·正统中医学与现代中医学的差异（PDF 第6页）"},{"t":"二、分野","h":"辛凉清解与辛温解表：两派治法的实质差别","c":"要点——两派分歧落到治法上，可归结为一对词：**温病派主\"辛凉清解\"，经方派主\"辛温解表\"**（其原文：\"因为都是说热症，所以他们主张使用**辛凉清解**的治法\"）。**其背后的判断分歧**是：**同一场\"发热\"，其性质究竟是\"寒邪束表、郁而化热\"（当先辛温开表，热随汗解），还是\"温热之邪直入\"（当辛凉清解，直折其热）**。**这一分歧的临床意义**在于：**若为寒邪而误用寒凉，则表闭而热愈不透（\"冰伏\"）；若为温热而误用辛温，则助热伤津**。**故真正需要的不是\"选边\"，而是\"辨性质\"**——**而辨性质的依据，正是《伤寒论》所立的\"有汗无汗、渴与不渴、恶寒与否\"**（\"发热而渴、不恶寒者为温病\"一句，本身就是辨别的标准）。**故其批评的真正落点应是**：**若不加辨别而一律用辛凉，则失之**——**这与\"温病学本身无效\"是两个不同的命题**，后者不能由前者推出。","o":"RJ-3149 · 经方论治·正统中医学与现代中医学的差异（PDF 第6页）"},{"t":"三、体例","h":"六十余症的条目结构","c":"要点——《经方论治》的后半是一部\"按病论治\"的总表，其目录约六十余题，覆盖面与前几部方剂文本相当：**妇科与生殖**（女子白带过多、退乳、通乳、子宫症痼、更年期身热盗汗、子宫肌瘤）；**肿瘤**（血癌、乳癌、肝癌、肿瘤、消瘤丸、下焦寒实之四逆症（可比摄护腺癌））；**代谢与循环**（肝阳上亢肾阳不足（可比高血压）、上中下三消渴症（糖尿病）、中焦湿热过盛（可比三酸甘油脂过高）、胆固醇、心脏肥大及动脉血管剥离、上焦湿热且实之心绞痛）；**结石**（胆石症、石淋砂淋小便带血、肝结石）；**神经与情志**（手抖心颤、失眠、癫痫、过动儿、忧郁、记忆退化）；**皮肤与外科**（皮肤干痒、湿疹脓疮、青春痘、皮肤病、四肢末梢化脓不愈、血箭痔疮、静脉曲张）；**其他**（婴儿猝死、掉发耳鸣、食物过敏、肥胖、牙痛、白内障、扁桃腺发炎、摄护腺肥大、骨损症、风湿、痛风、足三阳经虚实痛）。**其编排的特点是\"以西医病名为参照、以中医证候为纲\"**——如\"肝阳上亢、肾阳不足（**可参考比较西医学之高血压**）\"\"中焦湿热过盛（**临床时可参考西医之三酸甘油脂过高**）\"，均以\"可参考\"\"可比较\"标示二者的**近似而非等同**。**须提醒**：这些条目的价值在于**思路示范**（某类证候用何方），**不可作为\"某西医病名即用某方\"的对照表**。","o":"RJ-3150 · 经方论治·目录（PDF 第2~4页）"},{"t":"三、体例","h":"十二经用药与奇经八脉用药","c":"方法——《经方论治》末附两篇极简的用药纲领：\"**中药与人体经络的关系属性**\"下有\"**十二经用药**\"与\"**奇经八脉用药**\"两节，其后为\"**切脉方法简述**\"（PDF 第66~68页）。**这一编排的意义**在于：**前六十余题是\"按病索方\"，末三节是\"按经索药\"与\"按脉辨证\"**——**三者构成一个从\"病\"退回到\"经\"、再退回到\"脉\"的逆向路径**。**即**：**若病名不明或方不对证，则退一步看\"病在何经\"，用该经之药；若经络亦难定，则再退一步看\"脉象\"，据脉定阴阳表里**。**这与前面各章所见的方法完全一致**（医案以\"问诊十二项\"定症、以\"重按辨虚实\"定脉、以\"舌眼耳\"定脏腑），**说明其体系的重心始终在\"定位\"而非\"命名\"**——**先确定病在何处，再决定用何方**。**须说明**：本节内容（十二经用药、奇经八脉用药、切脉简述）在目录中标有页码但正文简略，本稿未逐条展开；**其\"以经络定位\"的思路可记，\"某经必用某药\"的对应则须视为口诀而非定律**。","o":"RJ-3151 · 经方论治·中药与人体经络的关系属性（PDF 第66~68页）"},{"t":"三、体例","h":"一部书的两种文风","c":"要点——读《经方论治》会明显感到两种文风并置，这一点对理解其全部著作都有帮助。**前半（学术史部分）**：引《素问》《难经》《伤寒论》《诸病源候论》《千金》《外台》《温疫论》诸书，按朝代顺序排列，**述而不作、可核可查**；**后半（按病论治部分）**：多为断语式短论，间以激愤之词。**这两种文风的并存，正是其著作的普遍特征**——**当他讲\"史\"与\"条文\"时，是学者的笔法；当他讲\"西医\"与\"时医\"时，是论战者的笔法**。**故读其书宜分两层取用**：**史与条文取其可核者，评议则须自行判断**。**本章所取，全在前一层**——**因为\"温病学如何一步步形成\"这一问题，有文献可查，不必依赖任何人的立场**；而\"温病派该不该废\"这一问题，**则取决于具体病证的辨治，不能由史实直接推出**。","o":"RJ-3152 · 经方论治·正统中医学与现代中医学的差异（PDF 第6页）"},{"t":"一、常的标准","h":"正常人的七条标准","c":"定义——这是全部材料中最有用的一张清单：**判断一个人是否健康，不必先查病，先看是否合于\"常\"**。其七条（原文）：**①\"一年四季一日四时额凉手足温\"**（体内能量运行正常，阴阳平衡之象）；**②\"胃口好，饮食能自制（胃气平），食之有味（脾气充）\"**；**③\"睡觉容易入眠、能通宵（心肝血足），汗出正常（心气衡），睡时体表冬暖夏凉（表阳固密）\"**；**④\"大便每日晨起一行（肠道功能好）\"**；**⑤\"小便淡黄，一天 5—7 次、睡时不小便（肾气旺）\"**；**⑥\"白天精神好，体力足（肺气足）\"**；**⑦\"脉一息四、五至和缓有力，春弦夏洪秋浮冬沉，寸脉大于尺脉，男子右脉大于左脉，女子反之（阴平阳秘）\"**。并有一句总纲：\"**凡此七条，过与不及皆为病象。**\"**这份清单的可操作性极强**：前六条**患者自可核对**（额凉足温、胃口、睡眠、大便、小便次数、精神），第七条须医者诊脉。**其深意**在于\"**过与不及皆为病象**\"——**不只\"少\"是病，\"多\"也是病**（如小便过多、胃口过旺、出汗过多），**这一条把\"健康\"从\"没有症状\"改写成了\"各项皆在区间之内\"**。","o":"RJ-3153 · 传统中医跟诊过程（PDF 第1页）"},{"t":"一、常的标准","h":"先立\"常\"，才能见\"变\"","c":"要点——这份清单之所以放在篇首，有一个方法论上的理由，跟诊者讲得很清楚：\"**到了老师看诊现场，才知道正常人定义的重要。西方医学为什么拥有大量先进的高科技设备、建立了庞大复杂的医学理论，仍然常常会漏诊、误诊，常常不是过度治疗就是根本不知从何入手？究其原因，就是被一大堆细枝末节的信息所蒙蔽，因果颠倒，反而忘了什么才是正常人、忽略了人的本能反应。**\"并推进一步：\"**既然不知何为正常，又怎么知道何为不正常？自然动手即错。**\"**这一批评切中要害**：**诊断的第一步不是找异常，而是确立基线**——**没有\"常\"的定义，\"异常\"就只能是相对于某台仪器、某个平均值，而非相对于这个人本身**。**其办法被概括为\"读图之法\"**：\"**明白了人的正常之象，异常之处也就了了分明了，犹如高明的修车师傅，只用听就大致知道问题所在**\"。**这一比喻很准**：**修车师傅之所以能\"听\"出问题，因为他心里有一台\"正常运转的车\"的声音**——**先有常，才有辨**。","o":"RJ-3154 · 传统中医跟诊过程（PDF 第1页）"},{"t":"二、诊断","h":"六种诊断法及其分工","c":"要点——跟诊者把倪海厦的诊断手段归为六种，各有其功能定位：**①望法**——\"**上工治病，望而知之**\"，其核心为\"**形神气血、五行定位、色位生克、时色推移**\"（并注明\"结合了周易之学\"）；**②问法**——\"'**十问**'是常法，时医皆知，唯经老师临诊细解，方知其中奥妙\"；**③脉法**——\"**关键在于识'四时平人之脉'，辨过与不及，知浮沉迟数、明中空结代、晓附骨阴实之象**\"（并批评\"今人多喜以脉诊炫耀，哗众取宠\"）；**④触法**——\"**平常中医以此法为末学，弃而不学**\"，其触诊含四部分：**(1)以手测皮温**（\"额及手背应凉，手掌当热，重按手掌至骨可测骨之寒热\"）；**(2)脊椎骨、背俞、经穴、疾病反应点探察**（\"可迅速定位结实、肿瘤等疾病\"）；**(3)腹诊**（\"集合历代经方腹诊之大成，直接指导经方的辨证使用\"）；**(4)耳诊**（\"耳穴图是中华瑰宝，融诊治于双耳，诊断之时治疗已经开始了\"）；**⑤眼诊法**——\"**倪氏眼诊是老师自创的独门绝学，非亲传实难得其精髓；短短几秒钟，竟能从小小眼睛中看出五脏的虚实、确定病之所、邪之性**\"；**⑥辨阴阳法**——\"'**阴阳律**'是中医诊断的最高境界\"。**六法的层次很清楚**：**望、问、脉、触**是常规四诊的扩展（其中触诊被明确\"扶正\"），**眼诊**是其独有，**辨阴阳**是统摄**——**前五法取信息，第六法作判断**。**须说明**：眼诊的具体分区与判读，前文（医案体例章）已依医案记录复原了\"脾区、肾区、心区\"等对应；**其\"短短几秒钟看出五脏虚实\"的准确度无法由文字验证，须视为其个人技艺**。","o":"RJ-3155 · 传统中医跟诊过程（PDF 第1~2页）"},{"t":"三、治法","h":"治病七法：一张完整的治法表","c":"方法——跟诊者把其处方思路归纳为七条，这是全部材料中最系统的一张\"治法总表\"，其七条为：**①首重阳气，重视护心**——\"**心主神、主火，是人体所有阳气的源头**；善用**麻、桂、姜、附、硫磺**等阳药，方能行阳、助阳、壮阳，临危救逆\"；**②阴阳谐调，谨护肠胃**——\"阴阳失和，必以**桂芍等量，一散一收**，阴阳平衡之法；**虚阳上浮，龙牡镇；表阳不固，炮附收**；脾胃者后天之根、津液之总源，凡攻病之时常须谨护脾胃之津液，**参、姜、枣、草是补脾生津的常法**\"；**③上开玄府，下利水道**——\"病在表在肌，以**麻、桂、葛根**行阳气，废水从毛孔出，病从汗解；病在里在脏，以**苓、泽、术、夏**等甘淡渗湿利水，停滞的湿和水气从小便排出，病从下解\"；**④推陈致新，谷道常通**——\"病在腑，以**硝、黄、枳、朴**，通便去实，病从下解\"；**⑤调和枢机，疏理三焦**——\"病在三焦水道，当以**柴胡剂**和解少阳，疏通水道系统\"；**⑥祛瘀陈挫，血脉通利**——\"瘀血内停，速以**水蛭、虻虫、桃仁、白芍、茜草**等，活血化瘀通脉\"；**⑦寒热兼施，补不忘泻**——\"病在肠胃与厥阴肝时，常现寒热并结、虚实错杂的复杂形势；治此难症危候，**桂附吴萸等温中热药常与芩连石膏等并用**以顿挫病势；**山药、熟地、山萸之类合与茯苓、丹皮、泽泻同施**，一补一泻，则五脏满而不实\"。**七法的结构**是**按病位排列**：**心（阳之源头）→ 脾胃（后天之根）→ 表（玄府）→ 里（水道）→ 腑（谷道）→ 三焦（枢机）→ 血脉（瘀）→ 寒热错杂（厥阴）**，**构成一条由浅入深、由阳及阴的完整路径**。**须说明**：本章所列为**治法方向**，具体方药剂量须由医师定；其中**硫磺、水蛭、虻虫**皆属峻药或毒药，非可自用之物。","o":"RJ-3156 · 传统中医跟诊过程（PDF 第2~3页）"},{"t":"三、治法","h":"一句总纲：阳壮则自愈，通顺则无害","c":"要点——七法之后有一段总收，把整套思路讲成一句话：\"**归纳而言，经方治病时最重视救护阳气——阳就是动能，是生命力；阳壮起来了，就代表看不见的机体自然功能在恢复，那么依靠人的自然修复力，疾病当然可以好转。其次重视治水治瘀：积水停湿之处就近疏导，在表汗之，在里下之，去积化瘀保持水道、血脉和谷道通畅。能量和物质循环的主要路径通畅了，即使有些小的堵塞停积、短时间的功能异常，是无害于整体的，机体能自然调整。越俎代庖、无病而攻，反而适得其反，挫伤正气。**\"**这段话把两个关键词说清了**：**\"阳\"＝动能（不是热量，而是\"能不能动\"）**；**\"通\"＝路径（水道、血脉、谷道三条）**。**其结论是\"不妄攻\"**——**只要主路径通畅，小的淤堵可待其自解**；**反之，见一症即攻一症，反伤正气**。**这一条与其医案中\"药只能治三分病\"、与其治法中\"守而待天时\"完全一致**，可视为其临床哲学的浓缩表述。","o":"RJ-3157 · 传统中医跟诊过程（PDF 第3页）"},{"t":"四、肿瘤","h":"\"阴实\"：一个可讨论的成因假说","c":"定义——这是其肿瘤理论的核心概念，跟诊者记下了完整表述：\"**举凡各种肿瘤，不论是骨瘤、脑瘤，还是乳癌、大肠癌，虽然其生长位置不一样、呈现的症状也千差万别、具体辨证虽各不相同，但有一点是共同的：必有阳不入阴的表征，即所谓阴实已成。什么是阴实？就是当身体内局部温度过低、动能不足时，造成大量的营养物质和冷水停积聚集起来，局部压力逐渐升高，正常的津液和热能无力灌注和通过，于是阴实越积越重，肿瘤也越来越大。**\"**这一假说的内部逻辑是自洽的**：**温度低／动能不足 → 物质与水停积 → 局部压力升高 → 正常灌注受阻 → 停积更重**，构成一个**正反馈**。**须明确其与现代医学的关系**：**（1）\"局部温度低\"与肿瘤发生的关系，在现代肿瘤学中并非主流假说**（肿瘤微环境的核心特征是缺氧、酸化、免疫抑制，而**实体瘤内部常因代谢旺盛而温度偏高**）；**（2）\"营养过剩促进肿瘤\"这一方向则有部分支持**——肥胖与多种癌症的风险确有关联，限制热量在动物模型中可延缓肿瘤生长；**（3）\"阳不入阴\"是中医术语，对应\"阴阳之气不相顺接\"，不可与\"温度\"简单等号**。**故本节应作\"一种关于肿瘤形成的理论模型\"来读**：它提供了\"**为什么同一套治法能用于不同部位的肿瘤**\"这一解释框架，**但不可据以替代病理诊断与规范治疗**。","o":"RJ-3158 · 传统中医跟诊过程（PDF 第3页）"},{"t":"四、肿瘤","h":"王时猛攻：治癌的节奏","c":"方法——这是本章最有实操意味的一条，讲的是**时机而非方药**：\"诊所来得最多的病人是癌症，而且往往是那种历经各种治疗、只剩最后一口气的危重病人。细观老师处方用药，**谨小慎微，反复推敲，每每先护心气、壮心肾之阳、强脾胃，守而待天时；一旦到了病脏的'王时'，速发重剂猛攻；时机一过，即刻收兵。如此反复拉锯，步步为营，且战且进，快者月余，慢者数月多获奇效。**\"**其要害在\"王时\"二字**——**即该脏当令之时**（依五行旺衰，如肝旺于春、心旺于夏、肺旺于秋、肾旺于冬；亦有一日之中的十二时辰当令）。**其策略可分三段**：**①蓄势期**（护心、壮阳、健脾，\"守而待天时\"）——**不攻，只养**；**②窗口期**（病脏王时，\"速发重剂猛攻\"）——**全力一击**；**③收兵期**（\"时机一过，即刻收兵\"）——**不恋战**。**这一\"择时攻邪\"的思路，与其《内经》\"因天时而调血气\"的主张一致**，也与现代肿瘤治疗中的\"窗口期\"概念（如化疗按周期给药、放疗按分次）在形式上相似——**但中医的\"王时\"依据是五行旺衰，不是药物动力学**。**须说明**：此处所记为**跟诊者的观察与归纳**，其\"快者月余、慢者数月多获奇效\"属**个案印象**，**未提供病种、分期、对照与随访数据，不能作为疗效证据**。","o":"RJ-3159 · 传统中医跟诊过程（PDF 第3页）"},{"t":"四、肿瘤","h":"断瘤之源：治癌的第一条法则","c":"要点——既立\"阴实\"之说，其治癌的第一条法则便是**断其来源**：\"**1、断瘤之源——让病人停吃一切人工制造的高浓度、高营养的食品，包括奶制品等，断绝肿瘤的食物来源。**\"（其后各条因篇幅所限未在本篇展开。）**这一条的可取处**在于**它把\"忌口\"从模糊的\"清淡\"具体化为一条可执行的规则**：**停用\"人工制造的高浓度、高营养\"食品**（其例举为奶制品）。**其与现代营养学的交集**：**高糖、高脂、深加工食品与肥胖相关，而肥胖是多种癌症的风险因素**；**但\"奶制品致癌\"之说无据**——乳制品与结直肠癌、乳腺癌的关系在流行病学中结论并不一致，**多数指南仍推荐适量乳制品**。**故本条应理解为\"减少深加工与高热量密度食品\"的通俗表达**，**不可推衍为\"禁食奶制品\"**。**其更稳妥的表述是**：**在肿瘤治疗期，营养支持是必要的，忌口应以\"不加重代谢负担、不干扰治疗\"为度，具体须由临床营养师与主治医师定。**","o":"RJ-3160 · 传统中医跟诊过程（PDF 第3页）"},{"t":"一、病例记录","h":"乳癌一周之变：一份可对照的观察","c":"要点——2009 年 8 月的诊疗日志里有一段**前后对照的记述**，是全批材料中最接近\"随访记录\"的文字：患者为乳癌重症，\"上周来过一次\"，\"经过一周的服药后，她的症状就已经改变了许多\"。其具体变化（原文）如下：**①颜色**——\"表面看时颜色**从原先的深红色已经变为鲜红色**了\"；**②热度**——\"病人自述原本感到**炙热的左胸，热感逐渐退去**\"；**③肿瘤的位置与活动度**——\"原先乳癌肿瘤**紧紧地附着在胸肋骨上，非常坚硬不移动**，现在已经**离开骨头，跟着肌肉走动着**，用手推挤时可以感到**肿瘤在移动**\"；**④其他**——\"睡眠好转，大便一日一次，脚冷改善，体力也好转，胃口很好，不觉口渴\"；**⑤触诊**——\"我上周触摸到她左胸上方接近琵琶骨位的乳癌肿瘤，今天已经摸不到了。\"**这份记录的价值在于它给了\"好转\"以可观察的指标**：**颜色由深红转鲜红、热感减退、肿瘤由\"附骨固定\"转为\"离骨可动\"、睡眠与二便改善、足温回升**——**其中\"肿瘤由固定转为可动\"一项，在临床上确有重要意义**（**固定于胸壁提示侵犯，可动则提示与深部组织分离**），**即便不作因果判断，这一体征变化本身是客观的**。**须说明**：此为**单例、无影像对照、无病理复核**的观察，**\"摸不到\"不等于\"消失\"**，深部病灶与微小病灶无法由触诊排除。","o":"RJ-3161 · 诊疗日志 0908（PDF 第2页）"},{"t":"一、病例记录","h":"胰脏炎与咖啡：一条病因假说","c":"要点——日志中两次提到同一判断：\"周四时一位来自埃及的美国人，自述其**左肋下方一直疼痛**，到医院去做几次全身检查，却没有任何结果；这个案例与上周那位意大利裔美国人相同，**都是因为过量喝咖啡而导致的胰脏发炎**\"；\"此人的症状已经可以确定是胰脏发炎了，我开立的处方就可以改善这种炎症，**但是病人必须立刻停止喝咖啡，否则必然没有效果**。\"**其可取处**：**咖啡与胰腺的关系确有研究**——**大量流行病学证据显示咖啡消费与急性胰腺炎风险无正向关联，部分研究甚至提示咖啡摄入与慢性胰腺炎、胰腺癌风险呈负相关**；**但从\"上腹／左胁痛＋检查无异常\"出发，先想到\"饮食习惯相关\"并劝其停用刺激物，这一思路是可取的**（**上腹痛的常见原因还包括胆道疾病、胃炎、功能性消化不良**）。**须提醒**：**\"检查无结果\"不等于\"没有病\"**——胰腺位于腹膜后，早期病变常规超声易漏，**持续上腹痛须做增强 CT／MRI 与淀粉酶、脂肪酶检查**；**\"胰脏发炎之后就是胰脏癌\"这一说法过强**——**急性胰腺炎与胰腺癌有关联（慢性胰腺炎是风险因素之一），但绝大多数胰腺炎并不转为癌**。","o":"RJ-3162 · 诊疗日志 0908（PDF 第2页）"},{"t":"一、病例记录","h":"类风湿：就医时机造成的差别","c":"要点——日志中有一组对照，讲的是**时机而非医术**：\"同一天就看到这两个案例，同学们可以做一个比较：现在在美国状况是这样的，**美国人知道类风湿性关节炎西医是无法治疗的，于是找中医来治疗，因为时间上还来得及，所以效果都很好**；反观中国人，因为**迷信西药，于是一直吃止痛药，等到关节都变形了，才来找中医治疗，往往都已经太慢了**。\"**这一观察的现实意义**（抛开其民族情绪）：**类风湿关节炎的关键是早期达标治疗**——**发病后 6 个月至 1 年内是\"治疗窗口期\"，此期规范使用改善病情抗风湿药（DMARDs，如甲氨蝶呤）可显著降低关节破坏与致残率**；**延误至关节变形，则已发生的结构损伤不可逆**。**故其\"太慢\"的判断是对的，但归因不对**——**延误的原因不是\"迷信西药\"，而是\"只止痛、不控制病情\"**：**单用止痛药（NSAIDs）确实不能阻止关节破坏，这是医学界早已明确的事实，而非中医独有的发现**。**正确的结论应是**：**类风湿须尽早使用 DMARDs，并可配合中医改善症状**——**而不是\"用中药替代抗风湿药\"**。","o":"RJ-3163 · 诊疗日志 0908（PDF 第1页）"},{"t":"二、医德","h":"\"诚实第一\"：一段可全盘接受的宣言","c":"要点——日志中有一段关于医德的表述，是本批材料中最可照单全收的一处：\"**我要告诉妳，我训练学生的第一要件，就是要对病人诚实——并不是要求他们都做最好的医师，首先就要做最诚实的医师。如果今天妳服用我开的药，没有看见效果，我就会停止帮妳治疗，除非妳强力要求要我帮妳继续治疗，否则我就会立刻停止治疗。我认为病人的金钱与治疗时机最重要，任何会耽误病人病情与浪费病人金钱的医师，就是世上最恶质最烂的医师……我的学生如果违反这一条，一定会被我逐出师门。**\"**这段话可提炼为一条行医准则**：**\"无效即停\"**——**把\"治疗时机\"与\"病人花费\"当作比\"自己的面子与收益\"更重要的东西**。**其可贵处**在于：**它给\"承认失败\"设了一个机制**——**不是靠医师的自觉，而是靠一条可执行的规则（无效则停治）**。**这一条与其\"病人有权利自己决定开刀、化疗或任其自然\"（同篇）合看，构成其对患者自主权的尊重**——**虽然他在别处常以激烈言辞否定患者的选择，但在此处明确承认了决定权属于病人**。**两处并置，可见其立场并不一贯**；**而\"诚实第一、无效即停\"这一条，无论立场如何，都是可取的。**","o":"RJ-3164 · 诊疗日志 0908（PDF 第2页）"},{"t":"二、医德","h":"拒收病人的规定：一条必须批评的界线","c":"风险——同一篇中有一条规定，必须明确批评：\"**读者请注意，这位乳癌病患是美国人，所以虽然她经过开刀后才来找我治疗，我会接受；但是如果妳是中国人，不要说开刀了，光是妳只要被做过切片，我就不收治妳了，请妳找我诊所其它的医师帮妳治疗，我个人是绝对不接受妳了。**\"**⚠ 这条规定的性质须讲清**：**它以国籍与既往诊疗史作为是否接诊的条件**——**（1）以国籍区别对待，属歧视，违反医疗伦理的基本要求**（医疗资源的分配不得以国籍、种族、宗教为依据）；**（2）以\"是否做过切片\"拒诊，实质是把\"患者曾接受主流医学诊疗\"当作惩罚理由**，**而患者做活检是遵循医学常规的行为，不是过错**；**（3）其现实后果是延误**——**被拒者若因此得不到任何治疗，损失的是患者本人**。**须说明其背景**：他反对活检的立场（见乳癌专题章）在此处被推到了**规则层面**，**而一旦把\"反对某种检查\"变成\"惩罚做过该检查的人\"，就从学术分歧变成了对患者权益的侵害**。**本全集记录此条，是为了让读者看清这一界限在哪里——而不是提供任何\"如何绕过\"的暗示。**","o":"RJ-3165 · 诊疗日志 0908（PDF 第3页）"},{"t":"三、心理","h":"\"忧伤肺\"：恐惧如何使病情急转","c":"要点——一案记录了**情绪对病情的即时影响**，讲得很具体：\"那位乳癌末期的妇女，上周来诊时一切都在进步中，但是本周来时症状却转坏——她因为在海边晒太阳时突然觉得呼吸很困难，于是变得非常紧张，自己很怀疑乳癌已经转移成肺癌了，所以这次来时人非常紧张，**连上周跟我说的话自己都忘记了**……我归其原因是她因为**每天担心病情的发展，以致忧伤肺，于是就出现呼吸短气的现象**；这个症状出现后，让她更加紧张，**于是病情急转直下**。\"**其结论**：\"**这个案例可以证明，病人的心情好坏是主宰着病情发展好坏的主要原因；治疗重病患最难的一点，就是要将病人恐怖的惊吓，转变为无忧无惧的想法。**\"**这一观察在临床上有其真实性**：**焦虑可致呼吸急促、过度换气、胸闷（\"呼吸短气\"很可能即过度换气所致）**，**而恐惧会显著影响睡眠、食欲、治疗依从性与免疫功能（应激—免疫轴）**。**其\"忧伤肺\"的中医对应**（悲忧伤肺、肺主气）**与这一现象在方向上一致**。**须说明**：\"心情主宰病情\"过强——**情绪是影响因素之一，不是唯一因素**；**但其提出的处置方向极有价值**：**\"把恐惧转为无忧\"是重病医疗的必要环节**，现代肿瘤心理社会支持（如认知行为疗法、正念减压）正是为此而设。","o":"RJ-3166 · 诊疗日志 0908（PDF 第3页）"},{"t":"四、须纠正","h":"PSA 由 20 到 50：一次错误的因果推断","c":"风险——一案记一位 60 岁白人男性，\"一年前被判定得到摄护腺癌，当时他的 PSA 指数是 20\"；\"过去一年来从不做任何西医治疗，只吃成堆的各种维他命\"；\"请问你现在的 PSA 指数是多少？他说现在是 50\"。其结论：\"**只要 Common Sense 就可以替你做诊断：如果过去一年来你的所做所为都是对的，那你的 PSA 指数为何多出二倍以上呢？这个数字已经表示这些人工维他命不但无助于你的身体，还只会让癌症发展得更快。**\"**⚠ 这一推断不能成立**：**（1）未经治疗的摄护腺癌，其 PSA 本身就会随时间上升**——**这是病程自然进展的表现，不需要任何\"原因\"来解释**；**（2）其论证形式是\"若你的做法对，指标就不会变差；指标变差了，所以你的做法错\"**——**这是一个典型的\"以结果反推原因\"的谬误**：指标变差只能说明**疾病在进展**，不能说明**是维他命导致的进展**。**（3）\"维他命致癌\"之说无据**——**多数维生素在推荐剂量内是安全的**；**确有少数大规模试验提示某些补充剂（如高剂量 β-胡萝卜素在吸烟者中、高剂量维生素 E）可能增加特定癌症风险**，**但这是\"特定高剂量＋特定人群\"的结论，不能推广为\"维他命致癌\"**。**正确的处置应是**：**该患者需接受规范的摄护腺癌评估（分期、Gleason 评分）与治疗讨论**，**而非仅观察 PSA**；**同时不应把补充剂当作治疗手段**。","o":"RJ-3167 · 诊疗日志 0908（PDF 第3页）"},{"t":"四、须纠正","h":"关于 Avastin：一例进展不足以判定药物致害","c":"风险——一案记一位 2005 年确诊乳癌的女性，坚持\"自然疗法\"、\"没有接受开刀与化疗\"，来诊仅为\"保持体力的中药\"（其给\"六味地黄丸\"）；\"几个月前做出一个非常错误的决定，就是听信西医的话，**服用一种叫做 Avastin（贝伐珠单抗）的药**，结果**服用二个月后，左乳房中的肿块迅速扩大，而且又长出一个新的肿瘤**，同时肿瘤变得非常硬\"；其结论：\"**如果没有吃西药的话，可能还不会扩散如此之快**\"。**⚠ 须分别说明两点**：**（1）\"服药后肿块扩大\"这一事实若属实，也不足以判定为药物所致**——**肿瘤在两个月内进展，是该病自然病程中常见的情形**（**尤其未经手术与化疗者**）；**要判定药物致害，需要对照与影像基线**。**（2）Avastin（贝伐珠单抗）是抗血管生成药物**，用于多种实体瘤（含部分乳腺癌方案，**但其在乳腺癌的适应证曾因疗效争议被 FDA 撤销，属须个体化讨论的药物**）；**其已知风险包括高血压、蛋白尿、出血、血栓、胃肠穿孔**；**\"加速肿瘤生长\"不是其公认的不良反应**。**故本条应作\"一个个案的叙述\"读**，**不可据以否定该药，也不可据以否定规范治疗**；**患者用药的任何调整，须由肿瘤科医师决定**。","o":"RJ-3168 · 诊疗日志 0908（PDF 第1页）"},{"t":"一、内因","h":"五志伤五脏：情志致病的对应表","c":"定义——2003 年洛杉矶演讲中，他把\"内因\"归为六经辨证，并以情志立说：**\"所谓内因，就是喜、怒、忧、思、悲、恐\"**，逐条给出生理对应：**过喜伤心**——引\"范进中举\"之例：\"因为太高兴了，所以得了失心疯……结果只好找了一个范进最怕的女人（河东狮吼），平时范进看到她就会手脚发抖，结果她大声一叫，当场就把范进吓醒了，病就好了\"；**过怒伤肝**；**过忧伤肺**——\"诸位如果有咳嗽，再遇到过于忧虑的事情，咳嗽会加重，百日不会好\"；**过思伤脾**——\"思念得很严重……会伤到脾脏，**脾主胃口，所以味觉就没有了，吃东西如同嚼蜡**\"（并附一句可用的观察法：\"下次问你的男朋友或女朋友有没有犯相思，**只要看吃东西有没有胃口，就知道有没有骗人了**\"）；**过悲伤肺**（\"悲和忧是相同的\"）；**过恐伤肾**——\"有很多年纪大的人很怕孤单、小孩不在身边，所以很恐惧……**肾脏管头发、管脑的记忆、管听力、管骨骼**，于是就得**老人痴呆症、脑部收缩，很多骨质疏松症、掉头发、听力的问题，都是因为恐而造成的\"**。**这张表的用法在中医体系内成立**（五志配五脏）；**须说明**：情志影响躯体功能确有其生理路径（应激激素、睡眠、免疫、行为），**但\"恐致脑萎缩、骨质疏松\"属过度推演**——**这两者是年龄相关的退行性改变，情志不是病因**。","o":"RJ-3169 · 倪海厦文集 0606·洛杉矶演讲（PDF 第2页）"},{"t":"一、内因","h":"五情相胜：一套可自我调节的方法","c":"方法——在五志致病之后，他给出一条**反向的调节法**，即《内经》\"情志相胜\"之说：**\"思能胜恐，恐能胜喜，喜能胜忧，忧能胜怒，怒能胜思\"**。并举例说明其操作：\"**恐惧的人，给他喜乐**——比方说生日的时候给他庆祝，让他有很多喜乐，**喜能胜忧**\"；\"过喜……找一个他最怕的人来吓他，**恐能胜喜**\"（范进之例即是）。**这一套的完整对应是五行相克**：**思（土）胜恐（水）、恐（水）胜喜（火）、喜（火）胜忧（金）、忧（金）胜怒（木）、怒（木）胜思（土）**。**其可取处**：**它提供了一种\"以情治情\"的思路**——**不直接压制某种情绪，而用另一种更强的情绪把它\"克\"掉**（如以专注（思）制恐惧、以喜乐制忧愁）。**这在现代心理学中有对应概念**（情绪替代、注意力转移、行为激活），**但\"以情胜情\"须有分寸**：**用惊吓治狂喜、用愤怒治忧思，若施于不合适的人（如心脏病患者、抑郁者），可能造成伤害**；**故此法宜作理解，不作操作**。","o":"RJ-3170 · 倪海厦文集 0606·洛杉矶演讲（PDF 第3页）"},{"t":"二、传变","h":"六经的一条完整路径","c":"要点——这是本批材料中**最完整的一次六经传变叙述**，其路径为：**表症（太阳）→ 走里有两条（少阳 或 阳明）→ 少阳失治则入三阴（太阴→少阴→厥阴）**，并逐段给出症状与用方：**①太阳表症**（中风／伤寒／温病，见下条）；**②表症停留时间**——\"表症一般在身体上停留**一个礼拜**；如果表症超过一个礼拜，有两种情形：一种是你自己的**免疫系统把感冒解掉了**，一种是**感冒走到里面去了**\"；**③走里之一：少阳**——\"进入少阳，就是进入你的**淋巴系统、内分泌系统**，症状是**往来寒热**\"；\"在太阳症的时候，病人只会觉得寒、怕冷怕风；但进入少阳，病人会**忽冷忽热**，**两个太阳穴会间有疼痛、间有恶心呕吐**\"；其治：\"此时有两种汤剂，**小柴胡汤及大柴胡汤**——如果是往来寒热、头痛、恶心呕吐，**但大便很好很正常，则服用小柴胡汤；如果便秘，则服用大柴胡汤**\"；**④走里之二：阳明**——\"阳明症就是进入你的**胃及大肠系统**，病人会产生**燥热**，所谓**阳明无寒症，全部是热症**，而且**会饿、吃也吃不饱**……**不放一点东西在胃里面，马上手抖、全身冒冷汗、全身热，且便秘**\"；**关键一句**：\"**但是表症如果进入阳明的话，病毒就不会再往里走，到此为止**\"——**即阳明是\"终点站\"，不再深入**；**⑤三阴的次第**——\"少阳如果没有改善的话，就进入阴症；**阴是指脏**，阴症就是进入肝心脾肺肾\"：**太阴（脾）→ 少阴（心、肾）→ 厥阴（肝、心包）**；**⑥厥阴之危**——\"厥阴症的时候，危险的时候到最后是**但坐不得卧，晚上无法睡觉**；肝病到后来，**病人半夜坐在那边，不能躺下去的，因为阳要绝了**\"。**这张路径图的价值**在于它把\"感冒\"与\"重病\"接在同一条线上——**外感不是孤立的小病，而是可以沿六经逐层深入的起点**；而**每一步都有明确的症状标志与用方**，可作**临床定位的坐标**。","o":"RJ-3171 · 倪海厦文集 0606·洛杉矶演讲（PDF 第3~5页）"},{"t":"二、传变","h":"麻黄汤四味：一段极生动的配伍比喻","c":"方法——演讲中对麻黄汤四味的配伍给出了**最形象的一段解释**，值得完整记录：\"**麻黄是开表，所谓开表，就是把毛孔打开来发散汗**；如果你光吃单味麻黄，心脏当然跳动快，所以要加**炙甘草，炙甘草可以让心悸的心脏缓和，不会心跳加速**；**桂枝是把肌肉打开，杏仁是把肺里面的津液补足（杏仁色白入肺）**\"。其总述：\"我们知道病人是**寒在表、肺里面有寒水**，所以要把身体内的滤过性病毒利用发汗排出体外。我们**担心麻黄发汗的力量太强，把肺里面的津液伤到会脱水，所以把杏仁加进去**；**担心麻黄只把心脏加快、没有到达表、汗发不出，所以把肌肉先打开，加上桂枝**——**桂枝好比马，麻黄骑在马背上，利用桂枝的力量把肌肉打开，把麻黄推进皮肤去，不会使心脏加速**；**预防麻黄使心跳加速，因此加了炙甘草，缓和心脏悸的现象**。\"**这段比喻的实用性极强**：**麻黄＝骑手（发汗之力）、桂枝＝马（把药力送到肌表）、杏仁＝补给（护住肺津）、炙甘草＝缰绳（控住心率）**——**四味各司一职，缺一则偏**。**其要点可归结为两条**：**发汗之药必须有\"载药至表\"之品相配（桂枝），否则力在心脏而不在表**；**发汗之品必须有\"护津\"之品相配（杏仁），否则汗出而津伤**。","o":"RJ-3172 · 倪海厦文集 0606·洛杉矶演讲（PDF 第3页）"},{"t":"二、传变","h":"三阴的次第：太阴、少阴、厥阴","c":"要点——三阴的叙述是这条路径最具体的部分，逐层如下：**①太阴（脾）**——\"第一个进入的就是足太阴，足太阴就是进入脾脏；**我在这边所讲的脾脏，就包含了西医所讲的胰脏**\"；其功能对应讲得极细：\"**胰脏影响你的血糖、影响你的体重**；**脾主少腹**（各位小腹突出，就是脾脏的问题）；**脾主肌肉、骨节、四肢**；**脾脏在管胃口，胰脏在管味觉**（吃东西有没有味道是胰脏在管，肚子饿不饿、吃多少是脾脏在管）\"；其病象：\"**脾是土，就好像河道，水在河道中走，如果河道做得很好就不会淹水，所以脾能治水；如果脾脏不能治水，身体就会很重**，因为身上带有很多水——所以**肚子胀、四肢胀、胃口不好，都是属于脾脏的问题**\"；**②少阴（心、肾）**——\"少阴有两个地方，**心脏以及肾脏**；第一个症状是**嗜眠**——睡觉睡了八小时、十小时还睡不饱，还想睡，有时开车开着就睡着了，**这是进入肾脏**；还有**自心包经进入心脏，必定是晚上失眠、睡不好**；**大小便不正常，有时下痢有时便秘**；**胸闷、胸痛、手麻、四肢麻**\"；**③厥阴（肝、心包）**——\"厥阴症就进入**肝脏，还有心包经**\"；其危象为\"**但坐不得卧**\"。**这一段的结构很值得记**：**三阴的判别不是靠病名，而是靠\"睡\"与\"二便\"两个日常指标**——**嗜睡属肾（少阴），失眠属心（少阴）**，**二便失常、胸闷手麻是少阴的旁证**；**而太阴的判别靠\"胀\"与\"重\"**（腹胀、四肢胀、身重）。**⚠ 须说明**：\"脾包含西医的胰脏\"\"胰脏管味觉\"属中医的脏腑功能归类，**与现代解剖学的胰腺（外分泌／内分泌）不是同一实体**。","o":"RJ-3173 · 倪海厦文集 0606·洛杉矶演讲（PDF 第4~5页）"},{"t":"二、传变","h":"逆向传变：从厥阴治回太阳","c":"要点——这条路径最值得注意的一点是**它可以逆行**：其原话（论 C 型肝炎的治疗）：\"**我们在治疗……清除了之后，病人在恢复之前所出现的症状都是感冒症状**；因为**从厥阴一路治疗回去，到了太阳症，病就好了**。临床上很多都是这样改善的——**从厥阴到少阴，少阴到太阴，太阴到少阳，少阳到太阳，症状是往回走的**。\"**这一观察的临床意义**（抛开其对病因的解释）：**它提出\"治疗过程中的症状顺序可以作为疗效判断的线索\"**——**若症状按\"厥阴→少阴→太阴→少阳→太阳\"的顺序逐层减轻，则提示病在退**；**若顺序相反（太阳→少阳→……→厥阴），则提示病在进**。**这一\"退病顺序\"的思路，与其\"王时猛攻\"的节奏、与其\"药后反应须与副作用区分\"（医案章）共同构成其**\"如何判断进退\"**的一套方法**。**⚠ 须同时标明其错误处**：\"**事实上 C 型肝炎根本不是肝病，根本就是感冒的病毒所引起的，病毒由太阳表症一直进入你的肝脏**\"——**这一主张不成立**（见肝病专题章：HCV 是独立病原体，有 PCR 可查，DAA 可改善）。**故本条只取其\"逆向传变可作为进退判断\"的方法，弃其病因之说。**","o":"RJ-3174 · 倪海厦文集 0606·洛杉矶演讲（PDF 第4页）"},{"t":"三、须辨（六经传变）","h":"关于胆固醇的一段议论","c":"风险——演讲中有一段关于血脂的议论，须明确辨析。其原话：\"你们所得到的知识，西医告诉你们胆固醇有好的胆固醇以及坏的胆固醇，好的可以预防心脏病、坏的会导致心脏病，**简直就是胡说八道**，因为西医希望多一个名词、多一种药可以卖。事实上**坏的胆固醇会凝结、会堵塞，是要靠三酸甘油脂**，所以**真正三酸甘油脂高才是一个问题**。胆固醇和饮食有关……**但只要你的三酸甘油脂正常，是不会堵塞的**。结果你去吃降胆固醇的药，后遗症造成**短期记忆力失去、肾脏产生问题**。\"**⚠ 逐条辨析**：**（1）LDL 与 ASCVD 的因果关系有大量证据**（孟德尔随机化研究、他汀类 RCT 均支持\"LDL-C 降低 → 心血管事件减少\"），**\"好坏胆固醇之分是胡说八道\"不成立**；**（2）\"堵塞靠三酸甘油脂\"不成立**——**动脉粥样硬化的核心是 LDL 在血管壁的沉积与氧化，甘油三酯升高是独立风险因素之一，但不是\"堵塞的必要条件\"**；**（3）\"三酸甘油脂正常就不会堵塞\"是危险的推论**——**LDL-C 升高而甘油三酯正常者，风险依然显著升高**；**（4）他汀类的副作用确有（肌痛、肝酶升高、新发糖尿病风险轻度增加），但\"短期记忆丧失、肾脏损伤\"并非其典型或公认的后遗症**；**（5）其\"把降胆固醇药给讨厌的邻居吃\"一句属玩笑式的人身攻击，已不转录**。**结论**：**血脂管理须依风险分层（LDL-C 目标值因是否已有 ASCVD 而异），由医师决定是否用药**；**中医可作为生活调理与症状改善的补充，不能替代调脂治疗**。","o":"RJ-3175 · 倪海厦文集 0606·洛杉矶演讲（PDF 第4~5页）"},{"t":"三、须辨（六经传变）","h":"一部文集的两种用途","c":"要点——《倪海厦文集 0606》属**多篇短文与演讲的合集**，其书目部分（\"优质的中医书籍\"）颇值得记录，因为它显示了他所推重的书单：**古籍七种**——**《黄帝内经》《神农本草经》《伤寒论》《金匮》《针灸大成》《伤寒杂病论》《千金要方翼方（古籍部分）》**；**近代优良中医书籍七种**——**唐容川《中西汇通医书五种》、曹颖甫《伤寒发微》《金匮
