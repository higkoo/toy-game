发微》、余无言《伤寒论新义》《金匮要略新义》、《单穴治病选萃》（人民卫生出版社）、杨力《疾病预测学》、《经方实验录》（姜佐景）**。**这份书单的价值**在于：**它给出了一个\"以经典为骨、以近人注疏为肉\"的阅读次序**——**先四经典（内经、本草、伤寒、金匮），再针（针灸大成），再旁及千金；近人则取唐容川（中西汇通）、曹颖甫与余无言（经方注家）、姜佐景（医案实录）**。**其中《经方实验录》尤可注意**：此书为曹颖甫门人姜佐景辑录的**经方验案**，**其体例与本全集所据的医案记录属同一类**——**理论与实录对读，正是学习经方的正途**。","o":"RJ-3176 · 倪海厦文集 0606·优质的中医书籍（PDF 第2页）"},{"t":"一、可采","h":"晒太阳与\"天阳\"：一次中西相合","c":"要点——这是全部材料中**少见的\"其说与现代医学方向一致\"**的一处。所评新闻为\"每天晒太阳 15 分钟可预防乳癌\"（报道称晒太阳助合成维生素 D，维生素 D 能对抗乳癌，建议每天晒十五分钟）。其批注为：\"**这不需要外国人来提醒，中医学中所谓的'天阳'，指的就是这个意思。**\"并进一步说：\"**这篇报导证实了中医学的理论是正确的——天阳入肺，乳癌就是属于阳虚阴实的一种病，原因来自心脏，而治疗心脏时首要的动作就是要先治疗肺脏，也就是要加强肺之阳；现在的晒太阳方式就是最好的吸取天阳的方式了。**\"**须说明其吻合与不吻合处**：**（1）吻合的部分**——**维生素 D 与乳癌风险的关系确有多项研究支持**（**低血清 25(OH)D 与乳腺癌风险升高相关，但补充维生素 D 能否降低发病率，随机试验结论尚不一致**）；**适度日晒是获得维生素 D 的主要途径**，这一点明确。**（2）不吻合的部分**——\"乳癌源于心脏、治心先治肺\"属其特有的脏腑推演，**无现代医学对应**。**（3）须提醒的剂量问题**——**\"每天 15 分钟\"是常见建议，但应避开正午强紫外线，且需依肤色、纬度调整**；**过晒增加皮肤癌风险，日晒并非越多越好**。**这一条的价值在于**：**它显示其体系并非全然拒斥现代发现——凡与\"天阳／阳气\"相合的结论，他会接受并加以印证**；**这一\"接受机制\"本身也提示：其取舍标准是\"是否契合其理论框架\"，而非\"是否有证据\"。**","o":"RJ-3177 · 诊疗日志 0909（PDF 第3页）"},{"t":"一、可采","h":"\"忧伤肺，喜能胜忧\"：一次病情急转的记录","c":"要点——这是其\"心情影响病情\"论述中最具体的一例：一位肺癌老太太，\"从 2006 年的初诊至今年二月，她一切都很好，持续的一直在进步中\"；\"结果**今年五月她去加州探视她儿子与孙子，当她得知她孙子已经被当地西医宣告得到某种癌症、只能再活三个月时，她的心情就跌到谷底**，**从那天开始她的病情就急转直下，一直不见好转**\"。其现状描述极细：\"**现在她要花费三个小时才能服下一碗汤药，饭也吃不下去，近来每天半夜三点必醒来**\"；其处置：\"昨天我开出**以青龙为主力的药方，希望能将肺打开，让阳气进入肺中**——否则依照现在症状来看，她的**肺家阴实之症**虽然不是很危险，但可以肯定是**正在逐渐恶化中**\"；末句是全书最沉的一句：\"**忧伤肺，而喜能胜忧，至于何谓真喜呢？这就要读者仔细想想看了。**\"**这一条的临床价值**在于它把\"情志—病情\"的关联落在了**可观察的指标**上（**服药时间由正常延至三小时、食欲丧失、每夜三点定时醒来**）——**这三项都是恶性肿瘤进展与抑郁的常见表现**（**\"三点醒来\"在中医属肺经当令之时，与其\"忧伤肺\"之说相应**）。**须说明**：\"心情导致病情急转\"这一因果**难以确证**（**也可能同期疾病自然进展**），**但\"重病者的心理状态须被当作治疗对象\"这一结论是成立的**——这也正是现代肿瘤心理支持的依据。**\"何谓真喜\"这一问，实为全章最有分量的一句**：**它承认\"让人高兴\"并不等于\"让人真喜\"**。","o":"RJ-3178 · 诊疗日志 0909（PDF 第1页）"},{"t":"二、须驳（新闻评论）","h":"\"乳癌三成以上无害、不需治疗\"","c":"风险——本篇有一处主张，须明确驳正：\"**乳癌有百分之三十以上是无害的，根本就不需要去治疗**，而台湾的西医却不分青红皂白地将乳癌通通认定是会危重的，于是将这 30% 也列入他们的改善范围……**当你们发现妇女有乳癌时，你们可曾先鉴定过这种乳癌是属于危重的？还是不危重的？如果不做任何手术，病人是否会因此而短命？**\"**⚠ 逐层辨析**：**（1）\"有一部分乳癌无需积极治疗\"这一直觉，在医学上确有其事**——**导管原位癌（DCIS）的过度诊疗是公认的争议**（部分 DCIS 终生不进展为浸润癌），**近年有\"主动监测\"（active surveillance）的临床试验在探索低危 DCIS 的非手术治疗**。**（2）但\"30% 以上、明确不需治疗\"这一数字缺乏依据**——**DCIS 进展为浸润癌的比例、时间跨度，目前无法可靠预测**；**且\"乳头状／黏液癌等低危类型\"与\"三阴性、HER2 阳性\"的预后天差地别，不能以一个比例概括**。**（3）最危险的是它推导的行为**——**据此劝人\"不做检查、不做治疗\"，等于把可改善的早期病变拖到晚期**；**而早期乳癌的 5 年生存率可达 90% 以上（原位癌接近 100%）**，**这一存活率正是\"早发现早治疗\"的结果，不是\"本来就不会死\"**。**（4）其\"西医把 30% 列入改善范围是不要脸\"的指控**——**实为对\"生存率统计\"的误解**：**队列生存率统计的是\"该组患者的实际结局\"，不需要\"逐个鉴定是否危重\"**。**结论：乳癌的治疗决策须依分期、分型、年龄与意愿个体化讨论，这一讨论应由肿瘤科完成；\"三成不需治疗\"不可作为拒治的理由。**","o":"RJ-3179 · 诊疗日志 0909（PDF 第4页）"},{"t":"二、须驳（新闻评论）","h":"\"乳房变小是退化，内有乳癌也在退化\"","c":"风险——本篇对一则新闻的批注，是全批材料中最危险的一条。新闻原文为：新竹医院\"最近曾在一天当中，以数位式乳房摄影筛检出两位乳癌患者，两人都是六十岁左右的女性，患者在近年**单边乳房慢慢变小**，因为没摸到明显肿块，都以为是年纪大、乳房自然萎缩而不以为意；检查后发现**乳房深处有约三公分大小的肿瘤**\"；医师说明\"**侵犯性乳癌侵犯邻近组织时，常造成结构变形，引起乳头或表皮凹陷，导致乳房有变小的感觉**\"。其批注为：\"（**乳房变小绝对是退化现象，就算里面有乳癌，也应该是一起在退化中，何须治疗呢？**）\"以及\"（**这种乳癌不去治疗的话，终身都不会妨碍到病人生命；一旦强加治疗，就会蔓延转移，潘多拉的盒子是不可以被打开的**）\"。**⚠ 这是必须坚决否定的**：**（1）\"乳房变小一定是退化\"不成立**——**单侧、渐进性的乳房缩小伴结构变形，正是浸润性癌侵犯 Cooper 韧带与周围组织的典型体征**（新闻原文已说明机制）；**（2）\"有乳癌也在退化中\"没有任何依据**——**肿瘤不会因宿主年龄而\"同步退化\"**；**（3）\"终身不会妨碍生命\"与\"治疗会导致转移\"**——**前者与分期相关（三公分的浸润癌绝非\"无害\"），后者更无依据**：**规范治疗（手术、放疗、系统治疗）的目标正是降低复发与转移风险**。**（4）该条的实际后果**：**一位六十岁女性若因此放弃治疗，其可改善的早期乳癌极可能进展为晚期**。**故本条的记录意义在于示警——凡见\"XX 不用治\"\"治疗反而扩散\"一类断言，无论出自何人，都应视为危险信号。**","o":"RJ-3180 · 诊疗日志 0909（PDF 第3~4页）"},{"t":"二、须驳（新闻评论）","h":"阿司匹林：一条须按人群区分的评价","c":"风险——所评新闻为\"全球最长寿人瑞欢度 113 岁生日\"，其人自述长寿秘诀为\"维持优质饮食、维持身体以及脑部运动\"，并\"每天吃一颗阿司匹林\"。其批注：\"**此人真正长寿的原因是维持优质饮食、维持身体以及脑部运动，还有他住的地方必定有好空气与好水质——绝对不是因为每天吃一片阿司匹林而得到长寿的**……**每天吃一片阿司匹林的结果只会让他短命，而且是脑溢血或是动脉血管剥离而死的；如果吃太多的阿司匹林，还有机会得到胰脏癌。**\"**⚠ 须按人群分层辨析**：**（1）\"不是阿司匹林使他长寿\"这一句是对的**——**个案的长寿不能归因于单一药物，其饮食、运动、环境与基因的作用更明确**；**这一层判断是准确的**。**（2）\"每天一片只会让人短命、死于脑溢血\"则过强**——**阿司匹林在二级预防（已患冠心病、缺血性卒中、支架术后）中有明确获益**（**显著降低再发心血管事件，这是大量 RCT 支持的**）；**其主要风险是出血（消化道、颅内），故须评估出血风险后使用**，**但\"必然短命\"不是事实**。**（3）一级预防（无心血管病者）**——**近年指南已收紧**（**USPSTF 2022 建议：60 岁以上不作一级预防起始；40—59 岁高危者个体化决策**），**因其出血风险可能抵销获益**；**故\"人人每天一片\"确非良策，但这是\"适应证问题\"，不是\"药物有毒\"。** **（4）\"阿司匹林致胰脏癌\"无依据**。**结论**：**阿司匹林用与不用，取决于心血管风险与出血风险的权衡，须由医师评估——既不该人人皆服，也不该一概否定。**","o":"RJ-3181 · 诊疗日志 0909（PDF 第2~3页）"},{"t":"三、其他","h":"\"以青龙为主力开肺\"：一个治法表述","c":"方法——上引肺癌一案，其处方思路被概括为\"**以青龙为主力的药方，希望能将肺打开，让阳气进入肺中**\"。**\"青龙\"即小青龙汤**（麻黄、桂枝、芍药、细辛、干姜、五味子、半夏、甘草），为《伤寒》《金匮》治\"**外寒内饮**\"之主方；其\"开肺\"之力来自**麻黄、桂枝宣散，细辛、干姜温化，半夏降逆，五味子收敛**——**发散与收敛同用，是\"开中有阖\"的构造**。**其\"让阳气进入肺中\"的表述**，对应其\"阴实\"之说（**肺家阴实＝肺中阳不能入、水饮停聚**），**故以\"开肺\"为治**。**须说明**：**此方用于\"阳虚阴实\"之肺癌属其自创路径，非标准肿瘤治疗**；**小青龙汤本身有明确适应证（外寒内饮之咳嗽、喘息），但对肿瘤病灶无直接作用**；**且方中麻黄对高血压、心脏病患者须慎用**。**本条只记录其\"以某方为主力\"的表述方式，不构成任何用药建议。**","o":"RJ-3182 · 诊疗日志 0909（PDF 第1页）"},{"t":"三、其他","h":"\"我不在诊所时\"：一份医德与管理的样本","c":"要点——本篇有一节讲其离诊期间的安排，与医德章（诊疗日志 0908）互为补充，其三条可记：**①人员交代**——\"我诊所目前有三位我亲自传授的学生在帮病人治病：一位美国人、一位颜医师、今年又增加一位女性的林医师（**北京大学化学系第一名毕业，留美取得药物化学学位……病人所服用的西药药性与副作用，在我诊所中她是最了解的一位**）\"；**②不许中断治疗的告诫**——\"请已经在服药的病人一定要继续服药，**不可以因为我不在而自行停止治疗**……过去已经发生过有些病人的想法是'一定要等我回到诊所才来继续做治疗'……**也因为有这种错误的想法，于是造成病情恶化**\"；**③配套的机制**——\"**目前所有持续在治疗中的病人，如果出现问题时诊所都会通知我，由第一线医师跟我回报、讨论**，所以请大家放心，诊所绝对不会因为我不在而出现真空状态。\"**这一节的可取处**在于**它把\"名医依赖\"这一常见风险明确点出并设了机制**——**病人因\"等某位医生\"而中断治疗，是真实存在的延误原因**；**而\"由第一线医师回报、共同讨论\"的做法，与现代多学科会诊（MDT）的思路一致**。**须说明**：\"不再收治'要等我回来才治'的病人\"这一决定属其诊所的管理权，**但其后果仍应谨慎——拒诊可能使患者无处可去**（参见前章对其\"拒收\"规则的批评）。","o":"RJ-3183 · 诊疗日志 0909（PDF 第2页）"},{"t":"一、辨假象","h":"喜冰饮是假象","c":"要点——这是医案中最典型的\"辨假象\"一例。患者\"人一直消瘦下去，卧蚕明显\"，其症为\"**睡每两小时醒（11:30、2:00、4:00、5:30 醒）**；**晚上上半身温热，膝以下自觉冷，手一直是冷的**；**口一直渴，喜冰饮**；胃口好转；大便一天二到三次、质硬；小便淡白清；不易出汗\"；**脉浮数，重按即无**；舌诊\"黄湿\"；诊断\"**心阳不足、心包积湿、脾阳不振、无阴实之证**\"。其解说点出关键：\"**病人一直瘦下去，照理说是寒，但他喜冰饮看起来是热象，其实这喜冰饮乃是假象。**\"**此例的辨证结构非常完整**：**①体型与病程指向寒**（消瘦、膝冷、手冷、便次多、小便清、不易出汗）；**②\"喜冰饮\"是唯一的热象，而它被脉诊否掉**——**\"脉浮数，重按即无\"即虚阳外浮之象**（**浮数为热，但重按无力说明此热无根**）；**③上半身温热而下半身冷，是\"上热下寒\"的典型**。**故\"喜冰饮\"这一行为不能作热证之据**——**其可取的方法**：**凡\"单一症状与全身相反\"时，须以脉、以整体证候群为准，此即\"舍症从脉\"**。**须说明**：**\"喜冰饮\"在现代医学中常见于糖尿病、干燥综合征、精神性多饮等，\"渴喜冷饮\"本身即为症状，不能简单归为假象**；**本条记录其辨析逻辑，不等于该患者的情况可套用于他人。**","o":"RJ-3184 · 临床医案 0809（PDF 第4页）"},{"t":"一、辨假象","h":"舌苔黄而用熟地：一例思辨","c":"风险——同一案中有一处**关于\"应然与实然\"的自我修正**，值得单独记：\"**照理说他舌苔黄应用生地，但他下焦寒，故用熟地。**\"**这一句的分量在于它承认了规则的例外**：**按常规，舌苔黄（热象）当用生地（清热凉血、养阴）；但此案下焦寒，故选熟地（温补）**——**即\"局部之象从整体之证\"**。**其可取的思维**：**辨证不是\"见黄则清\"，而是\"黄在何处、兼证如何\"**。**须说明**：**生地（清热凉血）与熟地（补血滋阴）同为地黄，但炮制不同、性用大异**；**\"下焦寒而用熟地\"须有明确的寒证支撑（膝冷、便溏、小便清长），否则易致滋腻碍胃**。**此案的完整处方为**：\"同 8 月 7 日方加**生附子二钱、干姜二钱、天花粉二钱、熟地二钱、黄连二钱、厚朴三钱**\"——**寒热并用、攻补兼施**，可见其组方并不走\"纯温\"或\"纯清\"一端。","o":"RJ-3185 · 临床医案 0809（PDF 第4页）"},{"t":"一、辨假象","h":"\"水生木，但木不受\"","c":"定义——一案中，\"**右眼多泪水**\"的注释为：\"**肝开窍于目；水生木，但木不受。**\"**这句话的结构**是**以五行生克解释症状**：**肾（水）生肝（木），肝开窍于目**；**\"木不受\"即肝不能受肾之滋养，故泪自溢**。**其推演的用药方向**：**须治肝（木）本身，而非一味补水**。**须说明**：**\"肝开窍于目\"是中医的脏象学说（肝血养目、肝气通目）**；**\"水生木\"是五行相生的一般图式**；**\"木不受\"则是把\"补之无效\"这一临床现象归因于\"受者不受\"**——**这是一种自洽的解释，但不可证伪**：**若补之有效，则说\"木受\"；若无效，则说\"木不受\"，两说皆可成立**。**故此类解释宜作理解框架，不作判据**；**真正的判据仍是症状的变化**（**泪是否减少、胁痛是否减轻**——本案\"左肋痛减少\"即为其一）。","o":"RJ-3186 · 临床医案 0809（PDF 第3页）"},{"t":"二、药—用对照（续）","h":"乌药：\"频尿皆可用\"","c":"方法——医案在药名旁直接写用途，是本书体例（见医案体例章），本篇续有几条：**\"乌药五钱 → 频尿皆可用\"**；**\"细辛二钱 → 助膀胱气化\"**；**\"炮附子四钱 → 收敛\"**；**\"补骨脂四钱、泽泻五钱 → 补肾，治脚跟痛\"**；**\"黄芪五钱、升麻五钱、党参三钱 → 与炮附一起提升中气\"**；**\"白术三钱、茯苓五钱 → 若用等量，胃口会增加\"**；**\"大黄二钱、芒硝二钱（分三包冲服）→ 宁可下利也不能便秘\"**。**这几条的用法**：**它们是\"药—症\"的直接对应，而非\"药—性\"的抽象描述**——**读者可按症查药，比按性推药更实用**。**须注意两点**：**①\"白术、茯苓等量则胃口增加\"是一组配伍经验**（**白术健脾燥湿、茯苓利水渗湿，等量则健脾之力偏胜**），**并非通则**；**②\"宁可下利也不能便秘\"是一条明确的取舍原则**（**在其体系中，便秘属\"毒不出\"，故宁可通利**），**但对体虚、老弱者，泻下须慎**——**本条的另一面是\"攻邪不避伤正\"的风险**。","o":"RJ-3187 · 临床医案 0809（PDF 第3页）"},{"t":"二、药—用对照（续）","h":"炮附子因牙关痛而减量","c":"方法——一案中，\"**炮附子二钱 → 用量不要大**\"，其解为：\"**骨为肾之余，补肾对牙齿很好，但补肾太多，则牙关会受不了（病人有牙关痛），故炮附子用量不要大，补肾药也不要用太多。**\"**这一段讲的是\"补亦有度\"，且给了一个可观察的指征**：**牙关痛（颞下颌关节区）**。**其逻辑**：**肾主骨，齿为骨之余；补肾之药过用，则\"骨气\"偏盛而见于牙关**——**这一推演属其体系，现代医学无对应机制**（**颞下颌关节痛与补肾药无关**）。**但其\"因既有症状而调整补药剂量\"的做法是可取的**——**即\"补药不是越多越好，须看患者能否承受\"**。**须说明**：**附子是乌头类药材，含乌头碱，炮制与剂量皆有严格限制**（**0.2 mg 乌头碱即可致中毒，2—4 mg 可致死**，见 259 方章）；**\"二钱\"约合 6 克，属需在医师指导下使用的剂量，绝不可自行照抓**。","o":"RJ-3188 · 临床医案 0809（PDF 第1页）"},{"t":"三、针灸三则：双向调节、担迎手法与耳诊","h":"穴道的双向调节","c":"要点——一案中取\"**水分、双水道 → 水肿、小便滴漏（穴道有双向调节作用）**\"。**\"双向调节\"这一提法是针灸学中的一个重要概念**：**同一穴位在\"虚\"与\"实\"、\"太过\"与\"不及\"两种状态下，可产生方向相反的调节效果**——**如水道穴，水肿者可利之，小便滴漏者可约之**。**其后续案例也印证了这一用法**：\"**双隐白 → 病人会痛，痛就缩，可解决疝气与小便等问题**\"（**以痛感引发收缩，属\"以痛为刺激\"的思路**）。**须说明**：**\"双向调节\"在针灸学中是一种经验概括**，**现代研究提示其可能与神经反射、节段性调节有关**，**但\"同一穴位对不同状态产生相反效果\"这一命题尚无系统的机制证据**。**其实用价值在于**：**它使选穴不必\"一症一穴\"，而可按\"病位＋状态\"取穴**（**如本案：关元、中极为小肠与膀胱募穴——按病位；水分、水道治水——按功能**）。","o":"RJ-3189 · 临床医案 0809（PDF 第3页）"},{"t":"三、针灸三则：双向调节、担迎手法与耳诊","h":"担法与迎法：两种针刺手法","c":"方法——本篇出现两种具体手法，是针刺技术层面的可记内容：**①\"除皱美容针 → 在某一条皱纹的长度中点下针（担法）\"**——**\"担法\"指在病处之中点取穴，如以扁担担物，取\"当中挑起\"之意**；**②\"右阳辅（迎法）→ 病人左侧大腿以下胆经疼痛，新病，为实证，实则泻其子\"**——**\"迎法\"指逆经气方向而刺（迎而夺之），用于泻实**；**其配穴逻辑**：\"**新病为实证**\"，**故取胆经之子穴（阳辅）以泻之**。**这两处的价值在于它们把\"手法\"与\"证\"连了起来**：**担法用于\"线状病损\"（皱纹、疼痛沿一条线分布）**，**迎法用于\"新病实证\"**；**而\"实则泻其子\"是五输穴配五行的一般法则**（**胆属木，其子为火，阳辅为经火穴**）。**须说明**：**针刺手法须由受过训练者操作**，**\"除皱美容针\"属美容范畴，其安全性与疗效须由执业者评估**。","o":"RJ-3190 · 临床医案 0809（PDF 第2~3页）"},{"t":"三、针灸三则：双向调节、担迎手法与耳诊","h":"耳诊：贲门与幽门的定位","c":"方法——一案记\"**耳诊：右耳贲门有压痛點（若飯後痛，則病處在幽門）**\"。**这是一个具体的定位法**：**耳穴有贲门、幽门之分，压痛所在即病之所在**；**并以\"痛与食后的时间关系\"辅助判别**——**饭后即痛属贲门（食入即过贲门），饭后一段时间痛属幽门（食至幽门而痛）**。**此法的可取处**：**它提供了一个\"以压痛定位、以时间验证\"的双重判据**，**而不是单凭压痛**。**须说明**：**耳穴定位的解剖学基础薄弱**（**耳廓与内脏的对应关系无现代解剖学证据**），**其敏感性、特异性未经系统验证**；**故耳诊宜作提示，不可替代胃镜等检查**——**尤其\"贲门痛\"须与贲门炎、贲门失弛缓、贲门癌鉴别**，**这类诊断只能由内镜与病理确定**。","o":"RJ-3191 · 临床医案 0809（PDF 第1页）"},{"t":"一、方剂积木","h":"桂枝汤的四种变化","c":"方法——一案在处方下写了四行注释，把桂枝汤的**四种加减变化与其对应主治**并列，是全批材料中最经济的一段\"方剂积木\"：**①\"桂枝汤加龙骨、牡蛎 → 可用于晚上惊悸、盗汗、遗尿\"**（即桂枝加龙骨牡蛎汤）；**②\"桂枝汤加重白芍加麦芽糖 → 小建中汤 → 开胃\"**；**③\"当归、木通、细辛加桂枝汤 → 当归四逆汤 → 补血、治手脚冷\"**；**④\"柴胡、郁金、龙胆草、黄芩 → 清肝疏肝\"**。**这四行之所以值得记，因为它展示的是\"同一个底方，加什么就变成什么\"**：**底方桂枝汤（桂枝、白芍、炙甘草、大枣、生姜）本是调和营卫之剂**；**加龙牡则镇潜（治浮阳、惊悸、盗汗、遗尿）；倍芍药加饴糖则温中（小建中）；加当归、木通、细辛则温经养血（当归四逆）；另加柴胡、郁金、龙胆草、黄芩则转治肝**。**须说明**：**这是方剂学的常规内容，非其独创**——**《伤寒论》《金匮要略》原书即以此类加减成方**；**其价值在于把\"方与方的血缘关系\"一次摆清**，**学者由此可记一方而知四方**。**须提醒**：**当归四逆汤中的木通，今多用\"通草\"代之**（**关木通含马兜铃酸，可致肾损害，已被禁用**），**此点须格外注意**。","o":"RJ-3192 · 临床医案 0806（PDF 第1页）"},{"t":"一、方剂积木","h":"\"额头是热的，故知阳浮于上\"","c":"方法——上案为一名儿童（\"先天肾阳不足、肝区受损、阳上浮不潜入阴\"），其处方的依据被写明：\"**老师查他额头是热的，故知是阳浮于上、下不去，故用龙牡（龙骨、牡蛎）。**\"**这一处最可注意的是\"查额温\"这一动作**：**额凉为常（见\"正常人七条\"），额热则提示阳气浮越于上**——**这与\"正常人额凉手足温\"的标准恰成对照**：**额热手足冷者，是\"阳浮于上、不达于下\"**。**其配伍对应**：**龙骨、牡蛎镇潜浮阳**（**龙牡之\"潜\"，即把浮越之阳降回下焦**）；**配合桂枝汤调和营卫、当归四逆温经、柴胡郁金龙胆草黄芩清肝**。**须说明**：\"额温反映阳气浮越\"属其体表触诊经验，**现代无对应机制**；**但\"以头面温度与四肢温度之差判断气血分布\"这一思路，在中医望诊中有其传统**（**如\"戴阳\"之面赤而足冷**），**其可取者在于\"以可触摸的体征推内部状态\"，但判读须结合脉证**。","o":"RJ-3193 · 临床医案 0806（PDF 第1页）"},{"t":"二、剂量","h":"石膏与干姜同用：一例寒热并投","c":"要点——一案患者\"血压高、胆固醇高、血糖高，服大量西药；一吃食物则腹胀大……胆固醇原 358，服 Lipitor 后 220—240，易忧郁\"；其症：\"睡眠不好、频尿重；大便时秘（90%）、时又下利（10%）；小便黄；**口渴重，喜温饮，一饮冷则胃胀满（胃寒）**；**胃口过好**；**睡时身热且多汗，足趾冰冷，一年四季都如此**；体力不佳；记忆力差；性功能下降\"；**脉缓无力，舌苔黄厚干**；诊断\"**肺热、胃寒**\"。其处方为\"**石膏四两（另包）、知母五钱；干姜二钱**……\"，其解说只一句：\"**此人胃口过大，但是胃又寒，故石膏与干姜同用。**\"**这一例的要点在于\"寒热并见的处理\"**：**上焦（肺胃）有热（口渴、身热多汗、苔黄厚干、胃口过好），中下焦有寒（喜温饮、饮冷则胀、足趾冰冷、频尿）**——**故清热与温中并行**：**石膏、知母清肺胃之热（白虎汤之意），干姜温胃寒**。**须说明**：**石膏四两（约 120 克）是大剂量**，**须在辨证明确、由医师处方的前提下使用**；**\"热药冷服\"**（本案服法）**为传统反佐法之一，用于\"上有热、下有寒\"之证**。**这一条的可取处**：**它示范了\"不以寒热一概而论，而按部位分治\"**——**这是中医方剂学最实用的思路之一，与现代\"多靶点\"用药在形式上相通**。","o":"RJ-3194 · 临床医案 0806（PDF 第2页）"},{"t":"二、剂量","h":"\"大黄一錢半即可\"：剂量依程度","c":"方法——同一案中，\"**大黄一錢半 → 因此人是 90% 便秘，便秘不算太严重，故大黄用一錢半即可**\"。**这一句是一条明确的剂量原则**：**攻下之药的用量依\"便秘的程度\"而定**——**九成时间便秘而偶有下利者，属\"偏结而未全结\"，故用小量（一錢半，约 4.5 克）缓通；若全无便意、腹满硬痛，则须加量**。**同案还有一组可记的配伍**：\"**细辛二钱、乌药五钱、炮附子四钱 → 温暖下焦、治频尿**\"；\"**补骨脂三钱、泽泻五钱 → 二药常合用以补肾**\"；\"**天花五钱 → 治他口渴**\"。**这一条的价值在于它把\"剂量\"从\"固定用量\"变成\"按程度调节\"**——**而\"程度\"是可以用问诊量出来的**（**本案：便秘占九成、下利占一成，即是\"程度\"的量化表述**）。**这种\"以频率、以程度定量\"的问诊方式，比\"便秘／不便秘\"的二分要精确得多，值得单独抽出学习**。","o":"RJ-3195 · 临床医案 0806（PDF 第2页）"},{"t":"三、识病","h":"\"血尿会痛比不痛好\"","c":"风险——一案患者\"小便频尿时血尿（痛）\"，其记录中有一处**须认真对待的临床提示**：其师先问\"**当你尿痛时，你觉得是前面膀胱痛，或是后面肾区、骨盆区痛？**\"患者答\"**前面膀胱、少腹痛**\"；随后一句批注：\"**血尿会痛比不痛好——血尿又不痛的很多是癌症。**\"**这一条的医学价值很高，且与现代共识一致**：**无痛性肉眼血尿是泌尿系统恶性肿瘤（膀胱癌、肾癌、输尿管癌）的典型警示信号**，**临床上对\"无痛性血尿\"须优先排除肿瘤**；**而伴疼痛的血尿多与感染、结石相关**（**疼痛本身提示炎症或梗阻，而非肿瘤**）。**故\"会痛比不痛好\"这一经验判断，在方向上是对的**。**须补充三点**：**①\"痛\"不等于良性**——**结石长期存在亦可致损伤，感染可上行**；**②\"无痛\"不等于癌**——**但必须查**（**尿常规、尿细胞学、泌尿系超声／CT、必要时膀胱镜**）；**③\"疼在膀胱还是肾区\"的定位问诊极为实用**——**膀胱刺激征（尿频、尿急、尿痛、终末血尿）指向下尿路，腰痛伴血尿指向上尿路**。**这一条是全部材料中少见的、可直接用于临床警觉的内容。**","o":"RJ-3196 · 临床医案 0806（PDF 第3页）"},{"t":"三、识病","h":"眼诊三区：肝洞、瞳孔、肝脾混合","c":"方法——同一案的眼诊记录给出三个具体的\"读法\"：**\"肝区洞多\"**；**\"瞳孔没啥反应 → 肾阳差\"**；**\"肝脾区混合如松烂木头 → 肝脾不和，易忧郁\"**。**这三条对应三种不同的观察对象**：**①\"洞\"**——**指虹膜（肝区）的凹陷或色素缺损**，其取义为肝血不足或肝有损伤；**②\"瞳孔对光反应\"**——**其取义为肾阳之强弱**（\"没反应→肾阳差\"）；**③\"肝脾区混合、质如松烂木头\"**——**指该区域纹理松散混浊**，其取义为肝脾不和，并推及情志（易忧郁）。**须说明三点**：**①虹膜纹理确有医学观察价值**——**虹膜缺损、色素斑点与某些遗传病、代谢病相关（如 Lisch 结节于神经纤维瘤病）**，**但\"肝区\"\"肾区\"的分区对应无解剖学依据**；**②瞳孔对光反应是真实的神经体征**——**但其异常指向颅神经、中脑或药物影响，不指向\"肾阳\"**；**③\"虹膜纹理与情志\"的关联无证据**。**故眼诊宜作\"提示患者整体状态的一个窗口\"，不可作诊断依据**——**眼科检查（裂隙灯、眼底）才是可靠的观察手段**。","o":"RJ-3197 · 临床医案 0806（PDF 第2页）"},{"t":"四、脉","h":"小儿\"脉浮稍数\"与纯阳","c":"定义——一案为儿童，其脉诊记\"**脉浮稍数，小孩纯阳之故**\"。**这一句涉及中医儿科的一个基本判断**：**小儿为\"纯阳之体\"**（**生机旺盛、代谢快，故脉象偏数、偏浮属常态**），**故\"数\"在小儿不即等于热证**，须结合其他症候。**其对照意义在于**：**同一脉象在成人与小儿的意义不同**——**成人脉数多主热或虚，小儿脉数可为常态**。**须说明**：\"纯阳之体\"是中医儿科的传统概念，**现代医学的对应是\"小儿基础代谢率与心率本就高于成人\"**——**故\"小儿脉数\"确应放宽判读**，**但\"数\"若伴发热、脱水、贫血、甲亢等，仍须按病理处理**。**这一条的可取处**：**它提醒\"同一指标的正常范围随年龄而变\"**——**这在任何医学体系中都成立**（**如心率、血压、呼吸频率的儿童参考值均不同于成人**）。","o":"RJ-3198 · 临床医案 0806（PDF 第1页）"},{"t":"四、脉","h":"肾脉重按：一个有明确分界的判据","c":"方法——一案记\"**肾脉重按则无，表示没有实证；如果重按仍有，乃是实证**\"；诊断随之定为\"右肾变形、肾家寒湿、骨伤、尺脉无力\"。**这一条把一个\"虚实判断\"压缩成了可操作的动作**：**重按（沉取）**——**按之即无（无力）者为虚，按之仍有（有力）者为实**。**这与医案体例章所记的\"脉诊重按辨虚实\"是同一条原则，此处给出了它在\"肾脉／尺部\"上的具体用法**：**尺脉无力 → 肾虚（本案定为寒湿、骨伤）**。**须说明**：**脉诊的\"有力／无力\"在操作上依赖指下感觉，不同医师之间的一致性有限**（**这也是脉诊研究难以客观化的原因**）；**其临床价值更多在\"提示虚实的倾向\"，而非\"确定病名\"**。**可贵的是这条判据本身边界清楚**——**\"重按有无\"是二分的，不含糊**，**这也正是它可以被教、被学的原因**。","o":"RJ-3199 · 临床医案 0806（PDF 第3页）"},{"t":"一、个案","h":"末期乳癌：溃烂处愈合的一年","c":"要点——这是全部材料中**记录最详细的一个\"好转\"个案**。患者\"二年前被美国西医告知得到末期乳癌\"，服中药一年以上；其本次复诊所述：\"**她要我看看她原本已经溃烂的左乳房，她拉开衣服后，左乳上原本溃烂的皮肤，已经长出新皮了，而且是鲜嫩的红色皮肤，像婴儿皮肤一样**\"；\"从开始至今，她的体重一共少了 **65 磅**\"。其所列\"过去一年的变化\"共六条，可归纳为三类：**①月经恢复**——\"她原本已经有四年停止来潮的月经，经服用中药后，月经居然每个月都准时来，而且量很大，**每来一次，她就感到乳房中的硬块在缩小中**\"；**②情绪**——\"她每天都保持很开心的心情，随时都在跟周围的人开玩笑，脚上长年穿着珠珠鞋，人还没进诊疗室，就先听到她开心的笑声\"；**③依从性**——\"这一年多来她从未间断过吃中药，无论我开难喝的汤剂还是丸剂，她都照单接受……**从开始治疗到今天，她从未问过我一句话，就是'中药要吃多久'**\"。**须客观说明三点**：**（1）溃烂性乳癌（T4）局部创面在有效治疗下确有愈合的可能**，**\"长出粉红色新皮\"是一个可观察的客观变化**——**这是本个案最有分量的部分**；**（2）但个案不能推出\"中药可治乳癌\"**——**乳腺癌的病程异质性极大，同一病期不同患者的进展速度可以相差数倍**，**无对照的个案无法排除自然波动或同期其他因素**；**（3）\"体重减 65 磅\"须分辨原因**——**若为饮食控制与运动所致，是好事；若为肿瘤消耗（恶病质），则是坏信号**；**原文未述其减重方式**，**故不能一概视为疗效**。**本条的记录价值在于\"创面愈合\"这一客观变化，不在于其推论。**","o":"RJ-3200 · 诊疗日志 0812（PDF 第2~3页）"},{"t":"一、个案","h":"胃癌、肝癌与 Gleevec：一段\"停药后好转\"的叙述","c":"风险——此案叙述如下：患者\"因为胃癌开刀后，在临危的那一刻找到我，当时我使用经方，**第一剂后，病人体力就恢复许多**，后来经约二个月的治疗，**西医再检查他的胃时，就再也无法查到他有胃癌细胞了**\"；\"之后状况一直不错，但在今年六月时又被查出肝脏上有肿瘤，当时我不在美国，于是西医开给他一种所谓癌肿的标靶药物，叫做 **Gleevec**，**服用这药之后，原本身体硬朗的他，就开始感到倦怠、失眠、没有胃口，双脚与小腹都有水肿、小便不尽感、体内感到很冷、脸色发出黯黄中带有青黑色**\"；\"他立刻来找我，此时已经出现双脚肿胀到连走路都有困难、四肢时常抽筋、小便色深黄\"；\"**他拿出一份从网络上下载的、有关 Gleevec 的研究报告，说明这种药是根本无法治疗癌肿的药物**\"；其后再服中药二周，复诊时\"**证实肝癌肿瘤缩小许多，他的体重下降 20 磅左右，积水退尽、胃口好转、体力也好、睡眠可以睡整晚、每天都有大号**\"。**须逐点辨析**：**（1）Gleevec（伊马替尼）的适应证是明确的**——**它针对的是携带 KIT（CD117）突变的胃肠道间质瘤（GIST）与慢性髓性白血病（CML）等**，**对肝细胞癌并非标准用药**；**故\"给肝癌患者开 Gleevec\"这一处方本身在医学上可疑**——**若确为此药，其\"无效\"并不奇怪，因为它本非肝癌用药**。**（2）患者所描述的那些症状（水肿、乏力、食欲差、面色晦暗）**，**既可能是药物不良反应，也可能是肝功能恶化（肝病本身即可致此）**——**两者在无检验数据时无法区分**。**（3）\"停西药、服中药后肿瘤缩小\"这一因果不可确立**——**肿瘤大小的自然波动、影像测量误差、以及\"从胃癌术后到肝癌\"这一多原发的情况，都须考虑**。**（4）最须警惕的是其推论方式**：**以\"某个患者的一段经历\"反推\"某类药无效、某类治疗有害\"**——**这正是本集反复标明的\"个案不足以推翻群体证据\"**。**本条记录其叙述，并明确指出：其中的用药选择问题应由肿瘤科复核，不可据此自行停用任何处方药。**","o":"RJ-3201 · 诊疗日志 0812（PDF 第2页）"},{"t":"一、个案","h":"摄护腺癌：一个\"部分属实\"的论据","c":"要点——本篇开篇有一段以\"人瑞\"为据的议论：\"**现到这些人瑞并不是因为这些癌症而死亡，都是因为太老而死亡的——也就是说这些癌症是跟着他们生活一辈子，完全没有影响到他们的寿命，根本就是无害的癌症**\"；随后引美国的做法：\"**现在美国西医也发现老人的摄护腺癌是一种发展很慢很慢的癌症**，等到老人活到上百岁后，这些摄护腺癌都不会造成这些老人危重的结果，所以**现在美国医师都已经改态度，不再要求老人要一直做摄护腺检查，甚至于就算发现老人患有摄护腺癌，也不建议开刀或是做化疗，因为这样做反而会加速癌症的扩散**\"。**须分辨其\"对\"与\"过\"**：**（1）对的部分**——**低危前列腺癌的过度诊疗确是近十余年肿瘤学界最受重视的问题之一**，**\"主动监测（active surveillance）\"已成为低危前列腺癌的标准选项之一**；**PSA 筛查的指南确已收紧**（**USPSTF 将其对 70 岁以上者列为 D 级\"不建议\"**）。**这一方向的知识是准确的。** **（2）过强的部分**——**\"不建议开刀或化疗\"须依分级（Gleason 评分）与分期而定**：**低危可监测，中高危仍需调理性治疗**；**\"治疗会加速扩散\"不是通例**。**（3）\"人瑞体内的癌症都无害\"这一推断有偏差**——**能活到百岁者本身经过极强的选择**（**其肿瘤生物学行为偏惰性，是\"筛选后的结果\"，不能代表一般老人**）。**本条的可取处：它把\"过度诊疗\"这一真实问题提了出来；其不可取处：以偏概全，把\"低危可监测\"扩为\"多数不必治\"。**","o":"RJ-3202 · 诊疗日志 0812（PDF 第1页）"},{"t":"二、须驳（0812 个案）","h":"\"病人都是死于过度治疗，不是死于癌症\"","c":"风险——本篇的一句总结极强：\"**就是不治疗反而不会因此而死亡，越治疗就死得越快——也就是说病人都是死于过度的治疗，不是因为癌症而死的。**\"**⚠ 这一判断不能成立**：**（1）\"越治疗死得越快\"在部分情形下有其真实来源**——**过度治疗（对无获益者施以激进治疗）确会降低生存质量、增加并发症甚至缩短生存**，**这是肿瘤学正努力解决的问题**；**（2）但把它推广为\"病人都是死于过度治疗\"则是彻底颠倒**——**癌症是全球主要死因之一**（**据 WHO 统计，2020 年全球癌症死亡约 1000 万人**），**其中绝大多数在无有效治疗的时代即死亡；现代肿瘤治疗使多种癌症的死亡率显著下降**（**如儿童急性淋巴细胞白血病 5 年生存率从 1960 年代的不足 10% 升至今日逾 90%**）。**（3）该论断的实际后果最危险**——**若患者据此拒绝一切规范治疗，可改善之病变将转为不可改善**。**故本条不仅是\"过强\"，而是\"方向性错误\"，须明确否定。**","o":"RJ-3203 · 诊疗日志 0812（PDF 第1页）"},{"t":"二、须驳（0812 个案）","h":"\"问'要吃多久'就是不信任\"","c":"风险——本篇对患者的一句评论须单独驳正：\"**从开始治疗到今天，她从未问过我一句话，就是'中药要吃多久'——这种蠢问题，一旦病人问出这种问题，就表示对中药已经失去信心。**\"**⚠ 这是把患者正当的知情需求当成了不信任的证据**：**（1）询问疗程是患者的正当权利**——**任何治疗都应有可预期的疗程、疗效评估点与停药标准；患者据此安排工作、家庭与费用，是理性的**；**（2）\"不问\"才更值得警惕**——**临床上，\"不问疗程、不问副作用、只照单全收\"的患者，往往也最容易在疗效不佳时突然中断**；**（3）这一说法与同书另一处的立场相矛盾**——**其在诊疗日志 0908 明言\"我训练学生的第一要件就是要对病人诚实……服药后没有看见效果，我就会停止治疗\"**——**若讲诚实，就须能回答\"要吃多久\"；若不能答，则\"诚实\"打折**。**（4）须提醒患者**：**凡遇\"不许问疗程\"的医者，应格外谨慎——因为这使患者失去了\"何时该停\"的判断依据。** **本条的可取处仅剩一点**：**它指出了\"依从性\"对疗效的影响；但其判定标准（以\"是否提问\"衡量信心）是错的。**","o":"RJ-3204 · 诊疗日志 0812（PDF 第2~3页）"},{"t":"二、须驳（0812 个案）","h":"\"先给西医动过，就难恢复\"","c":"风险——本篇末段有一句极危险的话：\"**如果在中医治疗之前先给西医动过，就很难有机会再恢复到正常了。尤其是经过西医开刀切除乳房后的伤口将更坏，这种伤口会痛彻心肺，连止痛药都无法止痛——止痛药的副作用就是肝癌，而西医对此种副作用不加说明，却以'乳癌移转成肝癌'为理由，一口蒙骗过病人与其家属们。**\"**⚠ 逐条驳**：**（1）\"先经西医治疗就难恢复\"——不成立且有害**：**手术、放疗、系统治疗是现代乳腺癌的主要改善手段**，**早期乳腺癌经规范治疗的 5 年生存率逾 90%**；**把它说成\"妨碍恢复\"会使患者拒绝可改善的治疗**。**（2）\"术后伤口会痛彻心肺、止痛药无效\"**——**术后疼痛是可控的**（**多模式镇痛、神经阻滞等已相当成熟**）；**个别难治性疼痛不等于通例**。**（3）\"止痛药的副作用就是肝癌\"**——**这是明确的错误**：**阿片类、非甾体类等镇痛药的主要风险是成瘾、胃肠与肝肾毒性，与肝癌无因果关系**；**长期使用对乙酰氨基酚过量可致肝损伤，但那是\"药物性肝损\"，不是\"肝癌\"**。**（4）\"西医以乳癌转移成肝癌蒙骗病人\"**——**乳腺癌可转移至肝，是病理学确认的事实（肝转移是乳腺癌常见远处转移部位之一）**，**并非托辞**。**本条是全篇最须否定的一条：它以错误因果（止痛药致肝癌）与错误推论（治疗妨碍恢复）动摇患者对可改善手段的信心。**","o":"RJ-3205 · 诊疗日志 0812（PDF 第3页）"},{"t":"一、案例","h":"求孕一：一张娃娃床","c":"要点——这是**\"天纪地脉道\"被直接用于临床**的唯一完整记录。患者 An. L.，四十岁女性，2007 年 6 月初诊；治疗超过五个月仍未怀孕，但\"**治疗两个月后手脚已从冰冷转为温热，月经变得规则，腰腹来月经时也不再酸痛，诸证皆善**\"，医者\"不得其解\"，于是重新诊查：先生\"手脚暖、每日早晨阳举而精力充沛\"，平时以天雄散、汉唐斑龙丸、桂枝加龙牡汤保养；太太\"脉证平和、**左脉盛于右脉**，查不出有何问题\"。其所记的判断依据为：\"**唯一支持我的信念，我相信恩师的教导不会错——手脚暖、左脉盛于右脉，应该就能怀孕。**\" 其后：\"**『能不能划一下您家中的方位』**，我要求病人……我看了一下方位，发现**屋内东宫是个楼梯，没有卧室**（怪不得太子不肯来）；『请妳放置一张娃娃床，在楼梯旁，震宫的卦位』……**隔月，夫妻俩带着灿烂笑容，告诉我已经怀孕了**。\" **⚠ 这一例的推论必须严格辨析**：**（1）\"五个月未孕\"本身不构成不孕的诊断**——**四十岁女性每周期自然受孕率约 5%—10%，五个月未孕属常见**；**（2）\"放一张娃娃床后隔月怀孕\"无法排除自然受孕的可能**——**这正是\"干预后的偶合\"最典型的形态**；**（3）其\"判断依据\"（手脚温、左脉盛）在中医体系内成立，但与受孕无确定关系**。**故本例只能作\"其体系的自我呈现\"读，不能作\"地脉道有效\"的证据**——**它恰是\"不可证伪\"的最佳样本：成功则归功于布局，失败则归因于\"命\"。**","o":"RJ-3206 · 临床案例·人纪学生·中医小故事【一】（PDF 第5页）"},{"t":"一、案例","h":"求孕二：大黄牡丹皮汤一剂治肠痈","c":"方法——这是**学生独立完成、且医学上站得住的一个案例**。患者 Roci T.，三十岁，2008-02-12 就诊，\"原本是看不孕症，但今日来诊是为了**急性右下腹痛**而来\"；\"右下腹持续性痛已三天，无法入睡，**疼痛拒按**，弯腰也痛\"；**脉滑数**；\"**舌尖右侧明显瘀点，边齿痕**\"；\"**穴位诊：双足阑尾点压痛**\"；\"**腹诊：右下腹一处有包块略高起，表面温度高于周围，且肤色红，压痛、反跳痛，手一按即痛得弯起右膝**\"——其辨为\"**此乃肠痈无疑**\"，**急下处方大黄牡丹皮汤一剂**。服后：\"**2-12 当日泻下六次粘臭便，并下许多小颗粒状似粪球的物；夜晚痛过一次之后即能睡了**\"；2-13 仍泻三次；2-14 复诊\"已觉好多了，右下腹及右下背仍有微痛、自觉肿肿的，但摸起来不肿、不红、皮肤温度正常、按压微痛，**包块缩小至中指指腹大小**\"；改方\"**薏苡附子败酱散、四逆散、大黄牡丹皮汤加减**\"；**5-3 病人告知已怀孕六周**。**此案的医学价值高于前一例**：**①大黄牡丹皮汤是《金匮要略》治肠痈的主方**（**大黄、牡丹皮、桃仁、冬瓜仁、芒硝**），**其适应证即\"急性阑尾炎\"一类**；**②腹诊的四项（包块、局部温度高、肤色红、反跳痛）都是急性阑尾炎的典型体征**，**其描述精确**；**③\"泻下后痛减、包块缩小\"是可观察的变化**。**⚠ 但须强烈提示**：**急性阑尾炎可进展为化脓、穿孔、腹膜炎，是有致死风险的急腹症**；**本案在无外科监护条件下以中药观察，属高风险做法**。**正确路径是：疑似急性阑尾炎须立即至急诊评估（血常规、超声／CT），在具备手术条件的机构中决定治疗方案**；**中药可作为特定情形下的选项，但不可作为\"先吃一副看看\"的家庭处置。**","o":"RJ-3207 · 临床案例·人纪学生·中医小故事【二】（PDF 第6页）"},{"t":"一、案例","h":"\"有是证，用是药\"","c":"定义——上案末尾，学生写下一句总结，是**其方法论最凝练的表述**：\"**这是我第一次意外以大黄牡丹皮汤改善不孕症，足证恩师所言：无论病名为何，有是证，用是药。**\" **这句话的完整含义**：**治疗的依据是\"证\"（当下的症状与体征组合），不是\"病名\"**——**故一个治\"肠痈\"的方，可以用在\"不孕\"的患者身上，只要其当下之证相符**。**这与前章\"忘记病名\"（高血压案）是同一条原则的两种说法**。**其可取处**：**它避免了\"一病一方\"的机械化**（**同一病名下的患者，证候可以完全不同**），**这与现代医学\"同病异治、异病同治\"的思路相通**（**如某些药物在不同疾病中共用同一机制**）。**其风险处**：**\"病名\"并非无用**——**病名背后是预后、并发症风险与监测方案**（**如\"阑尾炎\"这个病名，提醒的是穿孔风险；\"不孕\"提醒的是需系统评估排卵、输卵管、精液**）；**若彻底\"忘记病名\"，可能漏掉必须处理的急症**。**故这句话宜作\"辨证的提醒\"，不宜作\"诊断的替代\"。**","o":"RJ-3208 · 临床案例·人纪学生·中医小故事【二】（PDF 第7页）"},{"t":"二、体系","h":"\"上知天文，下知地理，中知人事\"","c":"要点——上案之后有一段\"老师评语\"，是**其体系自我定位最直白的一次表述**：**\"第一案例中不孕症的补助方法就是来自天纪——当遇到天命中注定无子嗣时，就算你跑遍全世界西医院都是没用的，因为西医的治疗就是命……但是如果你遇到的是正统经方家就不一样了：我们上知天文、下知地理、中知人事……经方学就是人事的部分，占有三分之一强；地理的部分又占三分之一强；如果将人事与地理一起应用，就是占有三分之二强，当然就大于天命了，于是天命就被更改了。\"** 其依据引《内经》：\"**能上知天文、下知地理、中知人事者，此医道可以传世。**\" **这段话极重要，因为它把\"天纪＋人纪\"的关系说明了**：**人纪（医）＝人事（三分之一）；天纪（地理、命理）＝地理（三分之一）；两者相合＝三分之二，故能\"改命\"**。**这解释了本书为何要把两册分开又并置**——**在其体系中，二者本是配套使用的**。**须说明**：**这是\"以术数补医学\"的构想**；**\"三分之二的算术\"是比喻，不是论证**；**而\"天命可被更改\"这一命题，本身即无法验证**（**改与不改，皆可事后归因**）。**但从文献角度，这段是理解其思想结构的关键**。","o":"RJ-3209 · 临床案例·人纪学生·老师评语（PDF 第7~8页）"},{"t":"二、体系","h":"\"忘记病名\"：一条被反复强调的嘱咐","c":"方法——学生的高血压案开头记着一句：\"**见到高血压马上想到倪师交代，要灵台清明、忘记病名**\"；其案情为：\"汤先生，40 岁，体形中等，血压高已服西药，觉服西药身体不舒服、头晕晕的\"；\"二星期前来诊时刚好碰上你出国进修，因严重头痛只好找西医，一量血压 160/130，要我赶快服降压药——**服用时头痛减轻，但仍觉身体不舒服**\"。**\"忘记病名\"这条嘱咐的用意**：**不要让\"高血压\"这个标签替代对具体证候的观察**——**同是\"高血压\"，有人头痛、有人眩晕、有人无症状，其治当不同**。**其可取处**：**它对抗的是\"以指标代病\"的机械思维**（**把\"血压数字\"当成病本身**）。**其危险处**：**\"忘记病名\"若被推到极端，会忽略\"高血压\"作为心血管风险标志的意义**——**160/130 mmHg 属 3 级高血压（重度），是须立即处理的状态**，**其\"忘记\"只能是\"辨证时不拘于名\"，不能是\"管理中无视指标\"**。**故本集的表述是：**\"**忘记病名\"用于\"选方\"，不用于\"评估风险\"；血压、血糖、血脂这类指标，仍须监测。**","o":"RJ-3210 · 临床案例·人纪学生·高血压案（PDF 第8页）"},{"t":"三、须辨（学生案例）","h":"\"舌尖主下焦，舌根主上焦\"：一处与常规相反的定位","c":"风险——上案（肠痈）中有一句舌诊定位，须明确指出其与主流相反：\"**舌尖右侧明显瘀点，边齿痕。再次证明倪师所言：舌尖部主下焦，舌根部主上焦。**\" **⚠ 常规舌诊的分区与此相反**：**舌尖属心肺（上焦）、舌中属脾胃（中焦）、舌根属肾（下焦）、舌边属肝胆**——**这是中医教材与临床的通行划分**。**而文本所记是\"舌尖主下焦、舌根主上焦\"，正好颠倒**。**可能的解释有三种**：**①传抄或整理之误**；**②其师另有一说（如以舌的\"前—后\"对应\"下—上\"的另一种取象）**；**③学生记录有误**。**无论何种，本集须照实记录并标明\"与通行舌诊相反\"**——**因为读者若据此判断，会把舌尖的瘀点当作下焦瘀（本例恰好是下焦肠痈，故\"对上了\"，但这更可能是巧合而非验证）**。**⚠ 更要紧的是\"验证方式\"的问题**：**此例以\"舌尖瘀点\"印证\"下焦病\"，看似成功，实为\"以结论逆推分区\"**——**若该患者是肺病，同样的舌象便可被解为\"舌尖主上焦\"**。**这是本集反复标注的一类错误：用个案去验证一个可以两面解释的规则。**","o":"RJ-3211 · 临床案例·人纪学生·中医小故事【二】（PDF 第6页）"},{"t":"三、须辨（学生案例）","h":"目录所见的覆盖范围","c":"要点——本册（《临床案例·人纪学生》）的目录本身就是一份**可观的\"经方应用范围\"清单**，其条目（依原文标题）涵盖：**急重症**——脑意外撞伤昏迷的急救、外伤的急救、产后大出血、急性胆道阻塞、肺积水心脏衰竭；**肿瘤**——胃癌、食道肿瘤、血癌、肝癌（三例）；**慢性病**——慢性肝病、慢性胃病（\"一剂就好\"）、近二十年湿疹、长期失眠与头痛、皮肤干癣、手颤抖；**疑难病**——癫痫、渐冻人、克隆氏症（两例）、Rasmussen（一种罕见脑血管炎）、肾病综合症、肾脏衰竭、肾结石；**时病**——H1N1 新流感（两例）、日本脑炎疫苗后遗症、毒奶粉结石；**妇科与生育**——不孕症、妇科、餵乳后乳房胀满；**兽医**——兽医使用经方治狗、治狗下利便血、腊肠狗伤寒中风、肾衰竭的猫咪；**其他**——升麻鳖甲汤、泽漆汤、葶苈大枣汤、十枣汤等方剂专案。**这份清单的意义**：**①它显示\"经方\"被用于极宽的病谱，从感冒到昏迷、从肿瘤到兽医**；**②它显示\"学生独立出案\"已成为制度**（**署名者有张孟超、北辰、菲菲、陈医师、赵医师等**）；**③但须注意：目录是\"成功案例集\"**——**只有被记录的成功，没有失败的记录、没有总病例数、没有随访**，**故其\"疗效\"无法从这份材料中评估**。**这一点是本册所有案例共同的方法学缺陷，须在引用时一并说明。**","o":"RJ-3212 · 临床案例·人纪学生·目录（PDF 第1~3页）"},{"t":"一、六准则","h":"六大健康标准","c":"定义——2005 年《如何知道你的病好转了》一文，给出了其体系中最有名的一张清单，自称\"**倪氏六准则**\"：**\"所谓正常人必须有六大生理现象每天发生\"**——**第一，\"正常的胃口：不会超量吃，也不会没胃口，饮食津津有味，一日三餐有正常的饱与饿感\"**；**第二，\"每天早上一起床第一件事就是上大号，如果没有就要注意了\"**；**第三，\"一天小便五到七次；夏天出汗多自然小便就少些，冬天出汗少自然尿就多些，小便颜色呈淡清黄色\"**；**第四，\"每天睡觉一觉到天亮，没有失眠或无故会半夜醒来等现象\"**；**第五，\"一年四季无论在北方或是南方，每天晚上睡觉时双脚必须露在外面，一盖被就热得受不了；长年都感觉头面冷而手足温热\"**；**第六，\"每天早起时都有阳反应：男人要勃起，女人要感觉双乳很敏感\"**。**这张清单的价值在于它的\"可操作性\"**：**六条全是患者自己可以天天观察的现象**（**食欲、大便、小便、睡眠、体感温度、晨间反应**），**不需要仪器**——**故它既可用于\"自我监测\"，也可用于\"判断治疗是否在起作用\"**。**它与其\"跟诊实录\"版\"正常人七条\"（另有脉象、汗出两条，见前章）互为详略**：**此版偏患者自测，彼版偏医者诊察**。**须说明**：**这六条大体对应现代医学的\"功能状态良好\"**（**食欲、排便、排尿、睡眠、末梢循环、性激素水平**），**作为\"健康感的描述\"是合理的**；**但其要求\"每日必发生\"过于绝对**——**排便频率的正常范围是每周 3 次至每日 3 次，\"每天必须一次\"并非人人皆然**。","o":"RJ-3213 · 文集及医案 0507·如何知道你的病好转了（PDF 第28页）"},{"t":"一、六准则","h":"六准则的用途：一组\"进退指标\"","c":"方法——六准则的真正用途，其原文说得极明确：\"**其一，我们可以依照这六大症状来判定这病患在治疗期间到底是进步了还是退步了——今天无论医师是使用开刀或化学疗法或钴六十照射，如果事后病患出现这六大症状，我就可以说这治疗是有效的，反之就是无效**\"；其举例：\"**一位血癌病患，发病时必然手脚冰冷、失眠又没有胃口、加上便秘严重；经过更换骨髓或化学治疗后，病患手脚变温热了、睡眠好了、大便通畅了、胃口恢复了，就代表治疗有效，病人恢复健康指日可待**\"；反之\"**越便秘、越失眠、越没胃口、手脚越冷，就代表治疗无效，病情恶化中**\"。**这一用法的可取处**：**它提出了一套\"以功能状态评估疗效\"的框架**，**而不只依赖检验数字**——**这在现代肿瘤学中其实是被承认的**（**\"生活质量（QoL）\"\"体能状态（ECOG 评分）\"\"体重与食欲变化\"本身就是疗效与预后的评估项**）。**⚠ 须标明的边界**：**（1）\"六大症状出现＝该治疗有效\"这一推论过强**——**症状改善可由支持治疗、激素、营养、心理等因素带来，不等于肿瘤缩小**；**（2）\"反之即无效\"更危险**——**化疗后短期食欲差、乏力是常见且可逆的，若据此中断有效治疗，损失极大**；**（3）正确的用法是\"两者并用\"**：**功能状态与影像、检验互为补充，任一单项都不足以单独决定停药或换方案**。","o":"RJ-3214 · 文集及医案 0507·如何知道你的病好转了（PDF 第28~29页）"},{"t":"二、好转","h":"两条判据：中午胃口开与半夜饿醒","c":"要点——文中对\"好转\"另给了两条**极其具体**的判据，是其体系中最\"可观察\"的部分：\"**按照经方家对疾病好转的定义如下，一般分为二类：一是表症也就是感冒，吃药以后第二天中午病人胃口大开，就表示完全好了；二是里症也就是内科病含各类癌症在内，如果吃中药吃到半夜因为饥饿而醒来找东西吃，这就代表药到病灶了，离改善日是指日可待了。**\"**这两条为什么值得记**：**它们把\"好转\"从抽象概念落成了\"何时、何种现象\"**——**\"第二天中午\"与\"半夜饿醒\"，都是有时间点的可观察事件**，**患者自己能判断**。**其内在逻辑（其体系）**：**中午为阳气最盛之时（午时属心），胃口开则阳气复；半夜饿醒则说明中焦（脾胃）之气已通、阳气能入里**。**须说明**：**（1）感冒（多为病毒感染）本身即自限于数日，第二天胃口好转是自然病程的一部分，不能归因于任何特定药物**；**（2）\"半夜饿醒\"在临床上可有多种解释**（**血糖波动、激素治疗后的食欲增加、胃酸过多、睡眠质量改变**），**尤其使用糖皮质激素者极常见**——**把它一律视为\"药到病灶\"，会把药物副作用误读为疗效**。**（3）真正可靠的好转判断，仍须结合病原学／影像学（如感冒无须，肿瘤则必需）。**","o":"RJ-3215 · 文集及医案 0507·如何知道你的病好转了（PDF 第29页）"},{"t":"二、好转","h":"\"六大症状稳定即可停药\"","c":"方法——文中给出停药的标准：\"**换句话说，你如果吃对中药后，身体必可以感受到以上的六大症状；当这六大症状很稳定时，就是你可以停药的时候了——病都已经好了，还吃药干嘛。**\"**这一条的思路是\"以功能恢复为停药指征\"**。**其可取处**：**它反对\"无限期服药\"**——**长期服药确有负担与风险，设定一个\"何时可停\"的标准是合理的方向**；**它对\"终身服药\"的惯性提出了质疑**。**⚠ 其风险**：**停药指征须因病而定**——**高血压、糖尿病、抗排斥、抗凝、抗病毒等药物一旦骤停，可致反跳或急性事件**；**肿瘤的辅助治疗有明确的疗程设计（周期、年限），不是\"感觉好了就停\"**。**故\"六大症状稳定\"可作\"复查与评估\"的提示，不可作\"自行停药\"的依据**——**是否停药、如何减量，必须由开具处方的医师决定，并常需逐步减量而非骤停**。","o":"RJ-3216 · 文集及医案 0507·如何知道你的病好转了（PDF 第29页）"},{"t":"三、须驳","h":"\"上吐下泻、皮肤发痒＝药吃对了\"","c":"风险——这是本篇最危险的一段，须逐字辨析：\"**还有许多病人在吃中药时发生上吐下泻，或是全身皮肤发痒等症状，这是因为病患本身体内除了疾病的毒素之外还加上西药的毒素，中药进入体内正在排毒时会有的必然现象——也就是说体内累积毒素越多，就会越吐、或越下利、或皮肤就越痒**\"；\"**如有上吐下泻或是皮肤痒时，就代表吃对中药了，不用慌**\"；并给了一个\"验证法\"：\"**你如果不信，很简单，请把同样的药给你周围的人吃，他们没病所以吃了同样的药是不会有任何反应的**\"。**⚠ 这一段必须明确否定，理由有四**：**（1）呕吐与腹泻是药物不良反应最常见的表现**——**可引起脱水、电解质紊乱（低钾、低钠）、肾前性肾损伤，老年人尤危**；**（2）\"皮肤发痒\"须高度警惕药疹**——**药疹可进展为 Stevens-Johnson 综合征／中毒性表皮坏死松解症（TEN），病死率可达 20%—30%**；**\"痒一个月\"不是\"排毒\"，是需要立即停药的信号**；**（3）\"体内毒素越多反应越大\"这一说法无法成立**——**没有任何可测的\"毒素\"指标支持它**；**（4）\"把药给别人吃试试\"这一\"验证法\"极不负责**——**给无病之人服用来路不明的药物，本身即构成风险（过敏、肝损伤、药物相互作用）**。**正确的做法是：服药后出现呕吐、腹泻、皮疹、瘙痒，立即停药并就医，由医师判断是药物反应、疾病进展还是其他原因**。**\"不用慌\"这三个字，是本篇最须划掉的一句。**","o":"RJ-3217 · 文集及医案 0507·如何知道你的病好转了（PDF 第29页）"},{"t":"三、须驳","h":"\"不相信验血报告\"的风险","c":"风险——文中有一段对检验的态度，须标明其危险：\"**我每隔一段时间就会要求被我改善的病患——如肝癌、胰脏癌、血癌、胃癌等病人——来我这复诊；我只需问他们手脚是热的还是冷的就够了，并不需要他们的验血报告。我不相信验血报告能够说明什么。**\"**⚠ 这一立场对肿瘤患者尤其危险**：**（1）肿瘤的复发常无症状**——**肝癌切除后复发、白血病微小残留病（MRD）、胰腺癌术后局部进展，早期皆可无任何体感变化**，**故须靠影像（CT／MRI）与肿瘤标志物、血常规监测**；**（2）\"手脚温热\"不能替代这些检查**——**它无法发现 1 厘米以内的病灶，也无法发现血象变化**；**（3）本集前章已记其可敬的一面**（**\"我训练学生的第一要件就是要对病人诚实……服药后没有看见效果，我就会停止治疗\"**）——**而\"不看报告\"恰恰使\"看见效果\"失去了依据**。**故本条须明确：中医可参与肿瘤的全程管理（症状控制、生活质量、减轻治疗副作用），但随访监测必须依肿瘤科方案执行；放弃复查等同于放弃早期发现复发转移的唯一机会。**","o":"RJ-3218 · 文集及医案 0507·如何知道你的病好转了（PDF 第29页）"},{"t":"四、其他","h":"伤寒与金匮本是一书","c":"要点——文中有一段关于文献源流的说法，是**本册中难得的、可核查的学术内容**：\"**最早的经方出自伤寒杂病论，这是医圣当年的千古巨著；到了宋朝时期，政府开设了制版局，重新印制这书，自此以后区分为伤寒论与金匮二书——由于被分开成二本书，导致后人无法尽窥其貌，于是造成各说各话、百家争鸣。实际上这二本书根本是不应该分开的。即将开始的人纪班教学，就是要将这二书合而为一，重现其原貌。**\"**这段史实大体正确**：**张仲景《伤寒杂病论》原为一书**，**经晋·王叔和整理、宋·校正医书局（林亿等）校定，析为《伤寒论》十卷与《金匮要略方论》三卷（后者出自《金匮玉函要略方》）**——**\"合为一书\"的治学主张，在今日的伤寒学界仍有支持者**（**如主张\"以方类证、以病统方\"贯通二书**）。**其教学主张的价值**：**分读易生\"伤寒治外感、金匮治杂病\"的割裂**，**而仲景原意是一体**——**这一层认识对学习经方确有帮助**。**须说明**：**\"重现原貌\"在文献上已不可能**（**原书早佚，今本皆为辑校之本**），**但\"合观二书\"作为读法，是可行的**。**另附：文中对刘力红《思考中医》的评价颇高**（**\"此君为良医无疑……肯认错，也肯再学习，到处拜师学习经方\"**），**这一句记下来，是因为它显示其评人并非全凭门派**。","o":"RJ-3219 · 文集及医案 0507·如何知道你的病好转了（PDF 第29~30页）"},{"t":"一、立场","h":"\"维他命是给你的敌人吃的\"","c":"要点——《专题·维他命篇》是一份**对营养补充剂的全面否定书**，其立场从第一句就毫不含糊：\"**我一再告诫病人千万不要服维他命，不但没有用，反而会促进癌症的增多、滋养癌细胞，根本是要你的命**\"；\"**维他命是给你的敌人吃的，不是给你的亲友吃的**\"；并说\"**世界上最害人的就是这些西药厂雇用的此类食物营养学了**\"。**其论证路径**：**由\"提炼\"推出\"有毒\"**——见下条。**其攻击对象**包括**营养学家、药厂、以及借疫情推销产品的企业**（**如 SARS 期间抢购维他命 C、鸡精热销**）。**须说明**：**（1）\"维他命促癌\"这一概括不成立**（**见\"须辨\"条：不同补充剂结论相反**）；**（2）其对药厂营销的批评并非全无道理**——**补充剂行业的夸大宣传是确实存在的问题，各国监管机构也多次警示**；**（3）但其语言多为辱骂（\"不要脸到极点\"\"会绝子绝孙\"），本集不转录**——**按全书编例，剔除情绪与人身攻击，只留其学理主张与可核查的判断。**","o":"RJ-3220 · 专题·维他命篇（PDF 第1页）"},{"t":"二、可取","h":"\"补能恋邪\"：便秘者不可吃补","c":"方法——文中提出一条**在中医体系内相当重要、且对今人有直接用处**的原则，名为\"**补能恋邪**\"。其原话分三层：**①\"食补是要在平日就要做到的——选择质量好的食物、正确的煮熟\"**；**②\"在食补的同时必须注意排泄的问题，正常人是每天都要有大便的；你如果有便秘习惯，就必须先改善它，否则你本身有便秘，此时又大量进补，其结果必然适得其反\"**；**③其机制解释**：\"**任何的营养进入人体只有 24 小时可以吸收，一旦超过 24 小时，营养就会坏死掉；因此便秘就会造成更多毒素的累积于人体内。所以有便秘的人绝对不要吃补——因为补药进入身体时是好的是新鲜的，但因为你的便秘导致停留身体内过久，反而是毒药**\"。**这条原则的可取处有三**：**（1）\"先通后补\"的次序是中医治则的常识**（**虚不受补、先理肠胃再进补**），**在临床上确有道理**——**便秘者服滋腻补品，常见腹胀、口臭、食欲下降**；**（2）\"营养在肠道停留过久会腐败\"这一层，与现代医学的\"肠道菌群发酵、内毒素\"研究可对应**——**长期便秘者的肠道菌群改变、肠屏障功能受影响是有研究支持的方向**；**（3）\"24 小时\"这个数字不必当真**（**它是个形象说法，不是生理常数**），**但其\"及时排出\"的要点是成立的**。**故这一条可整条取用，只需把\"绝不要吃补\"改为\"先解决便秘，再考虑进补\"。**","o":"RJ-3221 · 专题·维他命篇（PDF 第2页）"},{"t":"二、可取","h":"\"吃苹果，不要吃苹果丸\"","c":"要点——其\"提炼即毒\"的论证，核心比喻极好：\"**补药是需要使用原始药材来煮、或打粉加蜜烘焙而成的，如此药性才不会流失；一旦经过提炼或者精炼的手续，则药性全失，反而会因为正常人体组织无法吸收而成为毒药。这就好像吃苹果是很营养的，但是苹果如果用化学来分析，可能由上百种不同物质成份组合而成；如果你只取一部分、然后再浓缩成小药丸，就变成毒药了。依此类推，我们应该花时间去直接吃苹果，而不是去买苹果丸吃。**\" **这一段的价值在于它触及了一个真实的营养学争论**：**\"whole food（完整食物）\"与\"isolated nutrient（分离营养素）\"孰优**——**现代营养学的主流建议确实是\"食物优先（food first）\"**：**从食物获取营养，因其伴随膳食纤维、植物化学物、多种维生素的协同；而高剂量单一营养素补充剂在多项大型试验中未显示获益，个别甚至有害**（**见下条**）。**其\"提炼即毒\"的表述过强**——**提炼不等于有毒**（**如维生素 C 纯品、药用级叶酸都是提炼物，在特定人群中有明确作用**）；**但其\"不要用一颗药丸替代一整颗苹果\"的直觉，方向是对的**。**故这一条的可用部分是**：**\"以食物为主、不以补充剂替代饮食\"**——**这一条与各国膳食指南一致**。","o":"RJ-3222 · 专题·维他命篇（PDF 第2~3页）"},{"t":"三、须辨（维他命篇）","h":"\"维他命促癌\"：须按品种分别看","c":"风险——文中反复断言\"维他命会促进癌症增多、滋养癌细胞\"，**这个概括必须按品种拆开，否则会误导**。**（1）确有害、且有大型试验证据的**——**β-胡萝卜素**：**在吸烟者中补充 β-胡萝卜素反而增加肺癌发生率与死亡率**（**CARET 与 ATBC 两项 RCT 均因此提前终止**）；**维生素 E**：**SELECT 试验（3.5 万人）显示补充维生素 E 未降低前列腺癌风险，反而略增**；**硒**：**SELECT 与后续研究未显示获益，高剂量硒有毒性风险**。**（2）确有明确获益的**——**叶酸**：**孕前及孕早期补充可显著降低神经管缺陷**（**这是公共卫生的定论**）；**维生素 D**：**缺乏者补充可改善骨代谢**（**但\"人人补 D 防癌\"的证据不足**）；**维生素 B12**：**素食者、老年人、二甲双胍长期使用者缺乏者须补**；**铁、碘、维生素 A**：**在明确缺乏地区属必需补充**。**（3）结论**：**\"维他命促癌\"不能一概而论**——**正确的表述是\"高剂量单一抗氧化补充剂在特定人群（吸烟者等）可能有害；而针对明确缺乏者的补充是必要的\"**。**其\"给敌人吃\"的玩笑已作辱骂剔除**；**但其\"不要盲目吃\"的警示，方向可取。**","o":"RJ-3223 · 专题·维他命篇（PDF 第1页）"},{"t":"三、须辨（维他命篇）","h":"维他命 C：结石与\"血管剥离\"须分开","c":"风险——文中关于维生素 C 有两处断言，须分别处理。**（1）\"维他命 C 致肾结石\"——部分成立**：其原话为\"**我在临床上发现许多得到肾结石的病人，就是不断服用维他命 C 造成的**\"；并举一例：\"**此地有位牙医，一生不吃任何维他命，也不生病；有一天他太太买了最新的维他命 C 片产品，他服用了约贰星期，就得到肾结石**\"。**其医学基础是成立的**：**大剂量维生素 C（通常 >1 克／日）在体内可代谢为草酸，增加草酸钙结石风险，这一点在泌尿科文献中有明确记载**。**但其\"两星期即结石\"的个案**——**结石形成通常需较长时间，\"两周\"更可能是原有结石被发现**，**不能作为\"维 C 迅速致石\"的证据**。**（2）\"维他命 C 导致动脉血管剥离\"——无依据**：其依据为\"**美国去年的全美医学会议才报导过**\"，**但此说在文献中找不到对应**；**主动脉夹层（剥离）的主要风险是高血压、结缔组织病（马凡综合征）、动脉粥样硬化，与维生素 C 无关**。**（3）正确做法**：**维生素 C 从果蔬摄取最安全；若需补充（如特定缺乏、吸收障碍），剂量由医师决定，且应关注尿草酸与结石史**——**这与文中\"喝橘子汁比吃药片好\"的建议，在方向上一致**。","o":"RJ-3224 · 专题·维他命篇（PDF 第2页）"},{"t":"三、须辨（维他命篇）","h":"一份论战文本的读法","c":"要点——须说明本篇的**文本性质**：**它不是一篇论文，而是一组\"新闻剪报＋评论\"的合辑**——**每一条结构相同：先引一段新闻（SARS 抢购维 C、鸡精广告、过敏体质乱补），再以评论逐一痛骂，最后给出自己的主张**。**这种体例的偏误是可预期的**：**（1）选择性引用**——**只引支持其立场的新闻，不引反证**；**（2）以个案代替证据**——**牙医两周得结石、病人吃维 C 越多乳房肿瘤越大，皆为个案**；**（3）以辱骂代替论证**——**\"不要脸\"\"绝子绝孙\"一类语言反复出现**。**故本集的读法**：**取其\"补能恋邪\"\"食物优先\"\"不要盲目补充\"三条（这三条在中医与现代营养学两边都站得住）**，**弃其\"维他命必致癌\"\"维 C 致血管剥离\"两类断言**，**并剔除全部辱骂**。**这一处理原则，与本册处理其\"乳癌不需治疗\"\"C 型肝炎不存在\"时一致**：**判断的标准不是\"谁说的\"，而是\"这一条能否被核查\"。**","o":"RJ-3225 · 专题·维他命篇（综合）"},{"t":"一、方","h":"一张每味都标用途的复合方","c":"方法——一案（\"里寒水，不深，在脾胃中寒湿\"）的处方把每一味药的用途都标了出来，是本书\"药—用对照\"体例最完整的一例：**\"桂枝三钱、白芍六钱、炙甘草三钱、大枣十枚、生姜二片 → 小建中汤\"**（**底方**，倍芍药而为建中）；**\"乌药四钱、细辛二钱 → 治频尿\"**；**\"厚朴二钱、代赭石三钱 → 降气\"**；**\"陈皮三钱、草果二钱 → 开胃\"**；**\"黄芪六钱 → 行气固表\"**；**\"吴茱萸三钱、干姜二钱 → 温胃散寒\"**；**\"白术三钱、茯苓四钱 → 健脾去湿\"**。**这张方的构造值得细看**：**它是一张\"以建中为底、按症加味\"的复合方**——**底方（小建中）解决\"中焦虚寒\"这个主轴**，**其余六组各治一症**（**频尿、气逆、纳差、表虚、胃寒、湿盛**）。**这种\"底方＋对症药对\"的组方方式，清晰地展示了其用药思路**：**先定主轴（何方为主），再逐症添减**。**须说明**：**方中\"吴茱萸、干姜\"为温热之品，\"黄芪\"为固表之品**，**其适用须有\"里寒、表虚\"之证**；**读者可按\"每味标用途\"的方式学习组方逻辑，但绝不可据此自行配药**——**药味一多，相互作用与剂量配比皆需专业判断**。","o":"RJ-3226 · 临床医案 0805（PDF 第25页）"},{"t":"二、复诊","h":"\"中午不能进食＝病在阳\"","c":"要点——随访记录中有一处**判读方法极精**：\"**胃口好些，中午仍无法吃食物（索性不吃）→ 病在阳，中午胃气仍未回**\"。**这一句把\"时间点\"与\"病位\"连了起来**：**中午（午时，阳气最盛）本应是胃口最好的时候**；**此时仍不能进食，说明\"阳气未复\"**；**其批注径写\"病在阳\"（即病仍在阳分，未入里、未至愈）**。**这与前章\"六准则\"里的好转判据完全同源**：**\"表症吃药后第二天中午胃口大开就表示完全好了\"**——**两处都以\"中午的胃口\"作为阳气回复的标志**。**这一判据的好处是\"可自我观察\"**（**患者自己知道中午饿不饿**）；**其局限是\"不能独立成立\"**（**食欲受情绪、药物、疾病多重影响**）。**但这种\"以固定时点观察固定指标\"的思路，是很实用的**——**它把模糊的\"好些了\"换成了\"中午能不能吃\"**。","o":"RJ-3227 · 临床医案 0805（PDF 第27页）"},{"t":"二、复诊","h":"眼诊决定加味","c":"方法——同一随访链中，眼诊被直接用作\"加药依据\"，记录极具体：\"**瞳孔对光反应无 → 加炮附子**\"；\"**胰区不工整且过大 → 湿盛，故加白术、茯苓**\"；\"**心区扁散色淡**\"（未注对应处置）。**这一处展示了其\"诊—药\"的直接映射**：**每一个眼部观察都对应一个加味动作**。**须说明三点**：**（1）瞳孔对光反应无，就其医学含义而言是神经系统体征**（**可能提示动眼神经、中脑或药物影响，也可能只是光线或记录条件所致**）；**把它等同于\"需加炮附子（温阳）\"，是体系内的映射，与现代神经检查不同**；**（2）\"胰区\"在虹膜上并无解剖对应**——**虹膜分区图（iridology）在视光学与眼科中被视为伪科学**；**（3）但这一处的方法是\"可复核\"的**：**同一患者前后多次的眼诊记录并列，可看出其变化**——**这正是它比\"一次性判断\"可靠一点的地方**。**故本集的立场**：**记录其\"以望诊定加味\"的操作，同时标明其映射无现代依据；患者若需查胰腺，应做超声／CT 与淀粉酶、脂肪酶、血糖等检验。**","o":"RJ-3228 · 临床医案 0805（PDF 第26页）"},{"t":"二、复诊","h":"两个\"以改善反推功能\"的例子","c":"要点——随访记录中有两处**以\"某一症状好转\"反推\"某一脏腑功能恢复\"** 的判读，可作方法示例：**①\"情绪好转 → 木土取得平衡了\"**——**情绪属肝（木），脾胃属土；情绪好转被解为\"木不克土\"**；**②\"睡眠品质改善中 → 心脏功能改善了\"**——**睡眠属心（心藏神），故睡眠改善被解为心功能恢复**。**这两处的推法相同**：**由\"症状改善\"推\"脏腑功能恢复\"**。**其可取处**：**它提供了一个\"以患者主观感受为指标\"的评估框架**（**情绪与睡眠都是生活质量的核心项，现代医学也把它们纳入评估**）。**其不可取处**：**方向是反的**——**\"情绪好转\"可能因为睡眠改善、症状减轻、被关心，而非\"木土平衡\"；\"睡眠改善\"也可能因为疼痛减轻或焦虑缓解，而非\"心功能改善\"**。**即：把\"相关性\"读成了\"因果\"，且归因于一个不可测的中间实体**。**须说明**：**在无客观检查时，医师以主观感受推断是常见的**；**但\"反推脏腑\"这一步，只能作体系内的解释，不能作医学结论。**","o":"RJ-3229 · 临床医案 0805（PDF 第27页）"},{"t":"三、退病","h":"\"以前是由体内冷出来\"","c":"要点——同一患者对\"怕冷\"的描述有一处**极有价值的层次变化**：\"**月经来前一周身冷（体表）、恶风仍有一点（月经明天将至），但比以前好——以前由体内冷出来**\"。**这一句把\"冷的层次\"讲清了**：**从前是\"由体内冷出来\"（里寒），现在是\"体表身冷、恶风\"（表寒）**——**即寒从里退到了表**。**其推论（其体系）**：**病在退**（**由里出表，是\"退病\"的方向**）。**这与前章\"逆向传变\"（从厥阴治回太阳，症状往回走）是同一套判断**：**治疗过程中的\"层次变化\"可作进退的依据**。**须说明**：**\"里寒→表寒\"这一转变，患者自己能感觉到**（**\"由体内冷出来\"是很具体的体感描述**），**故其记录是可用的**；**但\"这意味着病在退\"是推断**——**也可能是季节变化、贫血改善、或单纯的感受差异**。**本集记录它，是因为\"区分冷的层次\"这一问诊方式很精细**：**问\"是外面冷还是里面冷\"，比问\"怕不怕冷\"能多得一层信息。**","o":"RJ-3230 · 临床医案 0805（PDF 第27页）"},{"t":"三、退病","h":"\"无干姜则胸口气上不来\"","c":"要点——同一位患者对处方的反应，记下了一条**极少见的\"单味药依赖\"描述**：\"**若药中无干姜，则胸口有气上不来、憋着的感觉**\"。**这一条的价值在于它把\"患者体感\"与\"具体药味\"直接对应起来**——**患者能分辨出\"这一次的药里少了什么\"**（**因干姜温中，去之则中焦无以温，故气机上逆**，此为其体系内的解释）。**须说明**：**（1）患者对\"药中少了某味\"的辨识，可能来自味道或服后体感的差异**，**也可能受医师提问的引导（暗示效应）**；**（2）\"必须依赖某味药\"这一现象在临床上真实存在**（**如激素依赖、镇痛药依赖**），**但干姜作为温中之品，其\"不可去\"更可能是\"证未解，故需持续温中\"**；**（3）关键判断**：**长期依赖温燥之品须警惕伤阴**（**口干、便秘、舌红少津**）——**本案患者\"口渴有、喜凉水但不敢喝\"，正是须留意之处**。**这一条的可取处**：**它提示\"复诊时要问'这次的药和上次有何不同'\"，患者的体感往往比医师的推断更细**。","o":"RJ-3231 · 临床医案 0805（PDF 第26页）"},{"t":"三、退病","h":"一套复诊链的结构","c":"要点——0805 后半的病例是**连续编号的随访**（**014-12、014-13……同一患者多次复诊，每次一页**），其结构固定：**①\"服前方后（主诉变化）\"**；**②问诊十项（睡眠、大便、小便、口渴、胃口、手足温度、汗、其他）**；**③脉诊、舌诊、眼诊**；**④\"同某月某日方，改……加……\"**（**在底方上增损**）；**⑤解说与备注（常空）**。**这种\"链式记录\"的价值在于**：**它使\"加减\"的因果可追溯**——**每一次改动都能对上前一次的症状变化**。**这正是本册反复强调的一点**：**其材料的价值大多不在\"结论\"，而在\"过程记录\"**——**症状、处方、加减、复诊，四者连成一线，读者可自行检验其推理是否连贯**。**而其短板也明显**：**没有客观检验、没有随访终点、没有失败记录**（**与\"学生案例集\"同样的问题**）。**故本集引用时，一律以\"其记录了这样的过程\"为限，不外推为\"这样的治法有效\"。**","o":"RJ-3232 · 临床医案 0805（PDF 第25~27页）"},{"t":"一、材料","h":"一份完整的儿童接种时程","c":"要点——本篇开头转录了一位读者传真来的**台湾儿童疫苗接种时程**，是一份可核对的客观材料，其条目如下：**出生 24 小时**——B 型肝炎疫苗第一剂、卡介苗；**出生满一个月**——B 型肝炎第二剂；**出生满二个月**——白喉、百日咳、破伤风混合疫苗（第一剂）、小儿麻痹口服疫苗（第一剂）；**出生满四个月**——同上第二剂；**出生满六个月**——同上第三剂、B 型肝炎遗传工程疫苗第三剂；**出生满九个月**——麻疹疫苗一剂；**出生满一年三个月**——麻疹、腮腺炎、德国麻疹混合疫苗（MMR）一剂、日本脑炎第一剂；**出生满一年六个月**——白喉、百日咳、破伤风追加、小儿麻痹追加；**出生满二年三个月**——日本脑炎第三剂；**国小一年级**——破伤风减量白喉混合疫苗追加、小儿麻痹追加、日本脑炎追加；**育龄妇女**——德国麻疹疫苗一剂；**另（自费项）**——B 型流感嗜血杆菌疫苗（2、4、6 月各一剂，1 岁 6 个月追加）、水痘疫苗（满 1 岁一剂）。**这份时程表的价值在于它是\"事实\"**：**读者可据此对照各地现行儿童免疫规划**（**各地项目与月龄略有差异，应以当地卫生部门最新公布为准**）。**本集收录它的理由，正是为了把\"时程\"与\"评价\"分开**——**时程属公共卫生的标准安排，其依据是疾病负担与疫苗效果；而本篇对其的全部否定，是另一件事**（见下条）。","o":"RJ-3233 · 再论疫苗（PDF 第1页）"},{"t":"一、材料","h":"其立场的表述方式","c":"风险——其对疫苗的立场是全面的否定，原文用词极重：\"**从小开始就被西药厂盯上，被抓去打着些不但完全无用的疫苗，而且带来的副作用等后遗症层出不穷**\"；并以\"绿林好汉\"作比：\"**过去我国有一种行业叫做绿林好汉……他们打劫过路商旅时，只要留下买路钱，一般都会放人走的；而现在西药厂却是你花了钱想要健康，他们收了钱之后，却还要你的命**\"；其反复出现的句子是\"**请大家先不要注射疫苗**\"。**其所引依据为**：**《Vaccines》一书（称\"在每国销售目前超过 100,000 册\"）与网站 thinktwice.com 的\"personal stories\"栏目**。**⚠ 须说明其材料性质**：**（1）thinktwice.com 是反疫苗组织的网站，其\"personal stories\"为个案自述**——**个案自述无法证明因果，也无法提供分母（多少人接种、多少人出现该反应）**；**（2）《Vaccines》一书属反疫苗立场的著作，非同行评议的学术文献**；**（3）其自身亦承认材料未完**（\"待续中……原因我会慢慢说明\"），**故本篇不是一个完整论证，而是一份立场声明**。**本集对其语言的处理照旧**：**剔除辱骂与人身攻击，只保留其立场与所据材料，并在下条逐项给出可核查的对照。**","o":"RJ-3234 · 再论疫苗（PDF 第1~2页）"},{"t":"二、对照","h":"疫苗效果：几项可核查的数字","c":"风险——对\"疫苗完全无用\"这一断言，可用公共卫生史中几组明确的数字对照。**（1）天花**——**全球通过疫苗接种于 1980 年被宣布根除**（**这是人类唯一彻底消灭的人类传染病**）；**（2）脊髓灰质炎**——**全球病例自 1988 年约 35 万例／年降至近年仅数十例，野毒株仅存于极少数国家**；**（3）麻疹**——**疫苗前时代美国每年约 300 万—400 万例、约 500 人死亡；疫苗普及后 2000 年美国宣布消除本土传播**；**（4）乙型肝炎**——**台湾自 1984 年起实施新生儿普种，儿童 HBsAg 携带率由约 10% 降至不足 1%，儿童肝癌发病率显著下降**（**这是全球公认的疫苗成功案例之一，且发生在其所批评的同一地区**）；**（5）百日咳**——**疫苗使发病率下降逾 80%，但近年因疫苗犹豫出现回升**。**这五组数字均可查证，且指向同一结论：疫苗不是\"完全无用\"，而是现代公共卫生中效果最确切的干预之一。** **⚠ 须同时说明\"疫苗并非无风险\"**：**确有极罕见的不良反应**（**如 MMR 相关的血小板减少症、个别严重过敏、口服脊灰疫苗的疫苗相关麻痹型脊灰，后者正是全球改用注射型疫苗的原因**）——**但其发生率以\"每百万剂\"计，与所预防疾病的病死率不在同一量级**；**而\"个人故事\"无法反映这个量级差**。","o":"RJ-3235 · 再论疫苗（对照：WHO 与各地卫生部门公开数据）"},{"t":"二、对照","h":"\"药厂逐利\"：批评中可成立的部分","c":"要点——须把其批评拆成两层。**可成立的一层**：**制药行业的营销行为确有问题**——**包括对补充剂与\"健康产品\"的夸大宣传、对医师的推广活动、以及对某些药物风险的延迟披露**（**这在各国都有监管处罚的实例**）；**其\"不要因为花了钱就以为得到了健康\"的提醒，方向可取**。**不可成立的一层**：**由\"行业有逐利行为\"推出\"其产品无效且有害\"**——**这是\"发生学谬误\"**：**一个结论的动机不端，并不证明结论为假**；**疫苗的效果由疾病监测数据支持，与生产者的动机无关**。**另须指出其一处关键的逻辑跳跃**：\"**先造成身体的损伤，造成后再给你另外一个病名，然后再给你其他的药**\"——**这是一个无法证伪的循环论证**（**任何后续疾病都可被归因为\"先前药物造成的新病名\"**），**且它取消了\"疾病自然发生\"这一可能**。**本集的处理是**：**保留其对行业行为的批评（有实例可查），剔除其\"因此疫苗无用\"的推论。**","o":"RJ-3236 · 再论疫苗（PDF 第2页）"},{"t":"二、对照","h":"疫苗犹豫的实际后果","c":"风险——这一段须讲清\"不打疫苗\"会发生什么，因为这是本篇主张的**唯一实际后果**。**（1）个体层面**——**未接种者自身面临该病的风险**（**如麻疹的并发症包括肺炎、脑炎，婴幼儿病死率可达千分之几**）；**（2）群体层面**——**当接种率低于阈值（麻疹约需 95%）时，群体免疫失效，暴发即发生**：**2019 年全球麻疹病例回升至约 87 万例，多国暴发与接种率下降相关**；**美国 2019 年纽约等地暴发，主要发生在接种率低的社区**；**（3）最脆弱者承担后果**——**新生儿、免疫缺陷者、正在化疗者不能接种，他们的安全依赖于周围人的接种率**（**这就是\"群体免疫\"的伦理核心**）。**故\"请大家先不要注射疫苗\"这一句，其代价不是\"个人选择\"，而是把风险转移给无法接种的人**。**本集的立场明确**：**疫苗接种应按当地卫生部门的免疫规划执行；有禁忌证者（如严重过敏史、免疫缺陷、特定孕期）由医师个体化评估；任何\"全面不接种\"的建议，都不应采纳。**","o":"RJ-3237 · 再论疫苗（对照：WHO 麻疹与脊灰监测数据）"},{"t":"三、编例","h":"为何收录而不删除","c":"要点——须交代本册对这类内容的处理原则，因为这已是第二次出现（**前有\"艾滋病与疫苗立场\"章**）。**收录的理由有三**：**（1）它是理解其思想结构的一把钥匙**——**其\"阳气为人身之本\"的医学观，与\"不以外物干预身体\"的立场是同一套逻辑的延伸**；**（2）读者会在原始资料中读到它**，**与其让人在无对照的情况下接受，不如在给出对照后呈现**；**（3）它是可讨论的公共议题**——**疫苗犹豫在全球是真实存在的现象，理解其论证方式（个案、动机推论、循环归因）有助于识别同类论述**。**不删除但须标注的理由**：**本集不是\"资料汇编\"，而是\"带判断的整理\"**；**凡涉及可能致害的主张，一律附可核查的对照与明确的行为建议**——**这与其\"对 AI 幻觉零容忍、正文必须有原文依据\"的编例一致**：**原文依据用于\"记录他说了什么\"，对照材料用于\"判断这话是否成立\"。两者不可混为一谈。**","o":"RJ-3238 · 再论疫苗（综合）；参本册第 16 章\"艾滋病与疫苗立场\""},{"t":"一、取材","h":"四十四份文档与八百万字","c":"数据——本集所据为四十四份倪海厦相关文档（**另有 1 份为空白页，故可读者为 44 份**），其文本形态为三类：**①PDF 含文字层者 36 份**——**其中\"人纪\"五部（《针灸》《黄帝内经》《神农本草经》《伤寒论》《金匮要略》）合计约 356 万字**（**金匮 95.9 万、内经 88.8 万、神农本草经 66.0 万、伤寒 60.6 万、针灸 43.3 万**），**其余为专题（乳癌、肝癌、艾滋病、糖尿病、维他命）、临床医案（0805／0806／0808／0809）、诊疗日志（0609／0812／0908／0909）、方剂讲解（两个版本）、经方论治、259 方、经典配方、文集（0606／0507）、访谈（梁冬对话）、天纪（人间道／天机道／紫微详解）等**；**②doc／docx 8 份**——**含汉唐方剂讲解（28.6 万字）、天纪地脉道笔记、文式易筋经、以及四部经典的目录文件**；**③扫描件 2 份**——**《中医扶阳摘记》（90 页 / 8.8 万字）与《天纪·天机道》（82 页 / 4.3 万字），经 OCR 处理后并入**。**总计约 800 万字、PDF 页面约 7800 页**。**须说明一个取材上的事实**：**原书体量与本集的体量相差两个数量级**（**800 万字 → 13 万余字**），**这不是\"全文收录\"，而是\"按主题提炼\"**——**故凡本集未逐条展开的部分，原文仍在**（**所需原文皆已转为可检索的文本文件，可与本集并读**）。","o":"RJ-3239 · 本集取材说明（据 44 份原始文档统计）"},{"t":"一、取材","h":"三路判断：可采、须辨、须剔除","c":"方法——本集对所据材料一律作三路判断，这一原则贯穿全书，须在此明示。**①可采**——**有明确依据、可核查、且在中医或现代医学中站得住者**（**如六经传变的路径、方剂的配伍逻辑、望闻问切的四诊方法、六准则的可观察项、\"万不可不教而诛\"一类义理**）；**②须辨**——**在其体系内自洽、但与主流医学或可核查证据冲突者**（**本集一律保留原文主张，紧随其后给出对照，并写明\"不可据以停药、拒诊\"**）**——**例：\"C 型肝炎不存在\"\"奶水逆流致乳癌\"\"乳癌三成不需治疗\"\"维他命促癌\"\"疫苗完全无用\"\"止痛药致肝癌\"\"不问验血报告\"**；**③须剔除**——**与学术无关的辱骂、人身攻击、对具体人物的恶毒诅咒、以及歧视性表述**（**例：\"祸国殃民\"\"混蛋\"\"烂医学博士\"一类形容，对同行与医家的攻击，以及把\"有同性恋倾向\"列为凶兆的表述**）。**这三路的分界不是\"我同意与否\"，而是\"能否被核查\"**——**故本集既有大量对其理论的正面记录，也有大量逐条驳正，两者并不矛盾**：**记录的是\"他说了什么\"，驳正的是\"这话能否成立\"。**","o":"RJ-3240 · 本集编例（全书贯穿）"},{"t":"二、边界","h":"医学安全声明","c":"风险——本集是**文献整理与知识库**，**不是诊疗手册**，以下四条须明确。**（1）不可自行照方抓药**：**书中剂量皆为个案用量**（**如炮附子二钱、石膏四两、大黄一钱半**），**且部分药材属剧毒或受管制**（**乌头类：乌头碱 0.2 毫克即可中毒、2—4 毫克可致死**；**关木通含马兜铃酸，已被禁用，今多以通草代之**；**生硫磺、生半夏、浓盐水催吐等法皆有明确风险**）——**剂量与炮制须由执业中医师依具体证候决定**。**（2）不可据本集停药或拒诊**：**凡涉及降糖药、降压药、调脂药、抗病毒药、抗凝药、抗排斥药、化疗与放疗者，调整或停用必须由开具处方的医师决定**；**本集对这些主张的\"须辨\"处理，目的正是防止读者据此做出危险决定**。**（3）急症须走急诊**：**疑似急性阑尾炎、脑外伤昏迷、产后大出血、急性胆道阻塞、大量血尿、持续胸痛等，一律先至急诊**——**本集所记的\"中药改善\"个案，不能作为\"先在家服药观察\"的理由**。**（4）中医可作为补充，不替代规范治疗**：**在肿瘤、心血管、代谢病等领域，中医的价值主要在症状控制、生活质量、减轻治疗副作用与体质调理**；**其不能替代手术、放化疗、靶向与免疫治疗**。**本集收录这些内容，是为了\"让你知道它说了什么\"，不是为了\"让你照着做\"。**","o":"RJ-3241 · 本集编例（综合）"},{"t":"二、边界","h":"两册的分界","c":"要点——本集按用户要求分为两册，其分界如下。**《人纪全集（中医）》**——**取材于人纪五部经典讲义、临床医案与诊疗日志、专题论述（乳癌／肝癌／艾滋病／糖尿病／维他命）、方剂体系（汉唐 HT 系列、259 方、经典配方）、经方与温病之争、扶阳与感冒、针灸与易筋经、访谈与师承、六经传变、以及\"六准则\"与好转判定**；**其性质是\"医学内容\"。** **《天纪全集》**——**取材于天纪四部（人间道／天机道／地脉道／紫微斗数），内容为易理与六十四卦、紫微十二宫与星曜、阳宅形势、八字排盘与干支推算、六神占断**；**其性质是\"术数与命理\"**。**两册的关系，据其自述是配套的**（**\"人纪＝人事（三分之一强）、天纪＝地理（三分之一强），相合则占三分之二强，故能改命\"，见学生案例章**）；**但在本集的编例上，两册的判断标准不同**：**人纪部分按\"可采／须辨／须剔除\"三路处理；天纪部分则以\"记录其符号系统与义理、标明其不可验\"为主**——**因为前者有相当部分可与现代医学对话，后者（除八字排盘这一历法换算外）基本上不可核验**。**这一差别是本集有意为之，读者不宜把两册的\"可信度\"等同看待。**","o":"RJ-3242 · 本集编例（两册分界）"},{"t":"三、用法","h":"三种读法","c":"方法——本集有三种用法，各配其标记。**①按主题查**——**全书按\"主题（一级标题）＋知识点（三级标题）\"两级编排，每条含\"核心内容\"与\"出处\"两个字段（出处标至文档与 PDF 页码）**；**目录页列出全部主题，可按需直达**。**②按\"要/注意\"快速筛**——**每条核心内容以「定义」「方法」「要点」「数据」「风险」五类词起首**：**「风险」类条目全部是须警惕或须驳正的内容**（**如需快速掌握\"哪些主张不能照做\"，只读「风险」条目即可**）；**「方法」类为可操作的技法**（**配伍、剂量、针法、读卦之法**）；**「数据」类为可核查的数字**。**③按\"辨\"字检索**——**凡\"须辨\"与\"须驳\"之条，标题或正文多含\"须辨\"\"须驳\"\"须说明\"\"风险\"字样**，**可集中阅读以形成一份\"不可照做清单\"**。**须说明**：**本集的\"出处\"字段是给读者回查原文用的**（**原文文本已按文档名与页码整理，可一一对应**）；**凡写\"综合\"者，指该条由多处材料合并而成，非单一页所出**。**而每条之后的判断（\"须说明\"\"⚠ 不成立\"等）属编者所加，与原文引述须分开读。**","o":"RJ-3243 · 本集编例（使用说明）"},{"t":"三、用法","h":"未逐条展开的部分","c":"要点——为免读者误以为\"已全覆盖\"，须如实列出**本集未逐条展开**的部分。**（1）人纪五部经典的完整讲义**——**《金匮》《内经》《神农本草经》《伤寒》《针灸》合计约 356 万字**，**本集只按\"主题\"提炼了其治法、方证、药性标准、经络与针灸总则**（**见第 1、2、3、5、6、7 章**），**未逐篇逐条注出**；**若要逐条，须另作\"经典注疏体\"的书，与本集体例不同**。**（2）临床医案与诊疗日志的余下病例**——**0805／0806／0808／0809 与 0609／0812／0908／0909 合计近 190 万字、约 2000 页**，**本集只择其\"能说明方法\"的案例**（**辨假象、药症对照、复诊读法、须驳的主张**），**未作病案全集**。**（3）人间道的余下卦**——**六十四卦本集已详注乾、坤、屯、蒙、需五卦**（**另据卦解材料记了蹇、睽、大畜、颐、家人、明夷等卦的表格式断语**），**其余各卦未逐卦展开**。**（4）紫微斗数的完整排盘与推断**——**本集已记十二宫、星曜、四化、八字排盘与干支推算、六神占断**，**但\"如何依盘断事\"的完整流程未逐条展开**。**以上四处，或因体量、或因体例，本集未作穷尽**；**其原文皆在，可据本集所立的主题框架继续深入。** **这也是本集与\"全文汇编\"的根本区别：它给出的是骨架与判断，不是替你把八百万字重排一遍。**","o":"RJ-3244 · 本集编例（覆盖说明）"},{"t":"三、用法","h":"一句话的总结","c":"要点——若要用一句话概括这四十四份材料的价值与风险，可作如下表述：**其价值在\"过程\"**——**望闻问切的观察方式（额温、掌温、舌象、脉之重按）、方剂的配伍逻辑（麻黄骑在马背上、桂枝汤的四种变化）、病势进退的判读（由里出表、中午能否进食）、以及\"时未至则待\"\"辨之不早辨\"\"不教而诛\"这类反复出现的思维方式**——**这些是任何认真读者都能取走的东西**；**其风险在\"结论的越界\"**——**从个案推到普适、从动机推到事实、从体系自洽推到客观为真**，**凡此三种推论出现处，本集皆已标出**。**两者并不互相取消**：**一个人可以在某些观察上极敏锐，同时在另一些结论上极危险**——**这正是整理这类材料时必须\"分条判断\"而不是\"整体褒贬\"的原因**。**本集所做的，就是把这两面拆开摆在同一页上，让读者自己看得见。**","o":"RJ-3245 · 本集编例（综合）"},{"t":"专题篇与医论：乳癌、艾滋病、肝癌、疫苗与经方讲解","h":"乳癌专题（一）：情志郁结与心脏衰弱","c":"【专题-乳癌篇】讲义的核心论点：「**女性患乳癌者，多起于『情志郁结』，以及『心脏衰弱』的病情。****」讲义展开：**① 长期的情绪压抑（婚姻不幸、家庭压力）→ 气机郁结 → 乳络不通；② 心脏衰弱 → 气血运行无力 → 乳房（在心经/心包经循行线上）失养；③ 所以治乳癌要『治心』（疏肝解郁 + 强心）而不只是『消肿瘤』。****讲义还讲了一句很重的话：「**药只能治三分病，其他七分还得靠自己。」**——意思是情绪、生活方式、心态是主体，药只是辅助。****（须「绝「对「强「标」）这个论点必须严格限定：**① 『情志郁结』是『相关的心理社会因素』，不是『病因』——乳腺癌的确切病因是基因（BRCA1/2）、激素暴露、年龄、生育史等；② 『心脏衰弱致乳癌』无任何循证依据——这是把『相关』讲成『因果』；③ 『只靠中药不开刀』是本册最危险的替代医疗主张：早期乳腺癌规范治疗（手术 + 综合治疗）5 年生存率 > 90%，延误手术会显著降低生存率。**\n\n**【最重要】乳癌「情志郁结 + 心脏衰弱」论——须绝对限定**\n\n```\n讲义：情志郁结 + 心脏衰弱 → 乳癌\n「药只能治三分病，其他七分靠自己」（心理社会因素）\n```\n\n**须「绝「对「强「标」**：**「①乳腺肿块须超声 + 钼靶 + 穿刺（BI-RADS）；②乳癌须手术 + 综合治疗；③『只中药不开刀』会延误调理；④『心脏衰弱致癌』无循证依据」** ✓✓✓\n\n**「药只能治三分病」——「这是最精的一句（把心理社会因素放在主干位置）。」** ✓✓","o":"RJ-3246 · 《专题·乳癌篇》（PDF 第 1–2 页，病人自述及讲义批注）。"},{"t":"专题篇与医论：乳癌、艾滋病、肝癌、疫苗与经方讲解","h":"乳癌专题（二）：病人自述的三期病程","c":"【专题-乳癌篇·病人自述】一位乳癌患者（Gloria，2006 年 5 月—2007 年 7 月）记录了自己的一年：「**第一期，恐惧怨恨期**——对癌症的恐惧到了极点，已经准备好身后事；**第二期，认识中医期**——读了《走近中医》，才明白什么是『辨证论治』；**第三期，应证中医治疗期**——服药后两小时，左乳房原癌块处会有『针穿过一样』的痛（讲义解释为『药在攻瘤』），一个月后肿瘤缩小、有时摸不到。」****讲义强调：**① 『药后病灶处疼痛』被解释为『药在攻瘤』的反应（『好转反应』）；② 她的『子宫卵巢全切除』后被查出『只是一个水泡』——讲义用这个案例批评『过度手术』。****（须「绝「对「强「标」）这一段必须分三层读：**① 病人的主观体验（恐惧、希望、疼痛）是真实的，应当被尊重；② 『药后痛 = 药在攻瘤』是『不可验证的归因』——肿瘤缩小须靠影像（B 超/MRI）测量，不能靠『摸不到』；③ 『子宫卵巢全切除只是水泡』是单个案例的回顾，不能推出『凡切除皆过度』——卵巢囊肿有明确的手术指征（扭转、破裂、恶性可疑）。**\n\n**【极重要】乳癌病人自述的三期病程（真实主观记录 + 不可验证归因）**\n\n```\n三期：恐惧怨恨期 → 认识中医期 → 应证治疗期\n「药后病灶痛 = 药在攻瘤」（不可验证归因）\n「子宫卵巢全切只是水泡」（单案例，不可外推）\n```\n\n**须「强「标」**：**「①疗效须靠影像（B超/MRI）+病理；②不可靠『摸不到』判疗效；③单案例不可外推；④不可据此拒绝手术」** ✓✓✓","o":"RJ-3247 · 《专题·乳癌篇》（PDF 第 1–3 页，Gloria 自述 2006/5–2007/7）。"},{"t":"专题篇与医论：乳癌、艾滋病、肝癌、疫苗与经方讲解","h":"艾滋病专题：「西药造成病毒变异」须绝对否定","c":"【专题-愛滋病篇】这一篇的主体是**转载的新闻报道**（多维社记者王海川）：报道中国云南（吸毒共用针管）、河南（非法采血）的 HIV/HCV 流行，以及加州大学 Richman 的研究——『艾滋病毒外膜变异速度惊人，一个病人六个月的变异等于全球感冒病毒十年的变异』。****讲义在这段报道后面加了一句批注：「**（此变异的原因是因为西医滥用西药造成的。）**」****（须「绝「对「强「标」）这句批注必须整条否定：**① HIV 变异快的真实原因是『逆转录酶无校对功能 + 高复制率 + 免疫选择压力』——这是病毒学基本事实，与用药无关；② 恰恰相反，**规范抗逆转录病毒治疗（ART）能抑制复制、降低变异、把病毒载量压到检测不到（U=U，不传染）**；③ 『西药造成变异』的说法会诱导病人停药——停药会导致病毒反弹、免疫崩溃、机会性感染、死亡；④ 艾滋病已是可控慢病（规范 ART 者预期寿命接近常人）。**\n\n**【最重要】艾滋病篇「西药造成病毒变异」——须整条绝对否定**\n\n```\n报道事实：HIV 变异速度惊人（Richman 研究）\n讲义批注：「此变异是西医滥用西药造成的」→ 完全错误\n```\n\n**须「绝「对「强「标」**：**「①变异源于逆转录酶无校对 + 高复制 + 免疫选择；②规范ART能抑制变异（U=U）；③停药可致反弹/免疫崩溃/死亡；④艾滋病已是可控慢病」** ✓✓✓\n\n**「U=U」——「这是最精的现代事实（测不到 = 不传染）。」** ✓✓✓","o":"RJ-3248 · 《专题·艾滋病篇》（PDF 第 1–2 页，新闻报道 + 讲义批注）。"},{"t":"专题篇与医论：乳癌、艾滋病、肝癌、疫苗与经方讲解","h":"肝癌专题","c":"【专题-肝癌篇】讲义的核心主张：「**肝癌的成因，多是『肝气郁结 + 湿热瘀毒』——长期的情绪压抑、熬夜（丑时不睡）、饮酒、乙肝病毒，都会让肝『堵』住。****」讲义列的治法方向：**① 疏肝（柴胡、郁金、青皮）；② 化瘀（鳖甲、桃仁、丹皮）；③ 清湿热（茵陈、栀子）；④ 补脾（『见肝之病，当先实脾』）。****讲义还讲了『肝癌的早期信号』：**① 右胁隐痛（持续）；② 疲劳（休息不能缓解）；③ 食欲下降、体重下降；④ 皮肤/眼白发黄；⑤ 手掌红斑（肝掌）、蜘蛛痣。****（须「绝「对「强「标」）这一整段必须严格限定：**① 肝癌的**确诊必须靠『肝功能 + 乙肝/丙肝病毒 + 甲胎蛋白（AFP）+ 腹部超声 + 增强 CT/MRI + 病理』**；② 肝癌的**调理手段是手术切除、消融、肝移植、TACE、靶向/免疫**——早期肝癌手术 5 年生存率可达 60–70%；③ **针灸/中药绝不可替代上述治疗**，只能作为辅助（改善症状、减轻 TACE 副作用）；④ **乙肝/丙肝抗病毒治疗能显著降低肝癌风险**——这是最重要的预防。**\n\n**【极重要】肝癌「肝气郁结 + 湿热瘀毒」论 + 五个早期信号**\n\n```\n治法：疏肝（柴胡/郁金）+ 化瘀（鳖甲/桃仁）+ 清湿热（茵陈）+ 补脾\n早期信号：右胁隐痛 / 疲劳 / 体重食欲下降 / 黄疸 / 肝掌蜘蛛痣\n```\n\n**须「绝「对「强「标」**：**「①确诊须AFP + 超声 + 增强CT/MRI + 病理；②调理须手术/消融/移植/TACE/靶向；③早期手术5年生存60–70%；④乙/丙肝抗病毒可降肝癌风险；⑤中药仅辅助」** ✓✓✓\n\n**「乙肝抗病毒降肝癌风险」——「这是最精的预防（比任何治疗都重要）。」** ✓✓✓","o":"RJ-3249 · 《专题·肝癌篇》（PDF 第 1–3 页）。"},{"t":"专题篇与医论：乳癌、艾滋病、肝癌、疫苗与经方讲解","h":"再论疫苗","c":"【再论疫苗】讲义的核心立场：「**疫苗的危险大于收益**——讲义列举了它认为的证据：① 疫苗含『汞（硫柳汞）、铝佐剂』；② 疫苗可能引起『自体免疫反应』（如 Guillain-Barré、MS）；③ 儿童同时接种多种疫苗（『一针打六种』）负担过重；④ 疫苗厂有商业利益，数据被掩盖。」****（须「绝「对「强「标」）这一整篇必须整条否定：**① 硫柳汞已从绝大多数儿童疫苗中移除（WHO/CDC 数据）；② 铝佐剂剂量远低于安全阈值（婴儿 6 个月内从饮食摄入的铝远多于疫苗）；③ 大规模流行病学研究（数千万人）**未发现疫苗与自闭症、MS、GBS 的因果关系**（唯一的例外是某些流感疫苗与 GBS 有极低关联，且风险远低于感染本身）；④ **疫苗每年避免 400–500 万人死亡（WHO）**——麻疹、脊灰、白喉、百日咳的死亡率在疫苗时代下降 90%+；⑤ **反疫苗主张直接导致麻疹、百日咳暴发与儿童死亡**（2019 年全球麻疹病例回升）。**\n\n**【最重要】「再论疫苗」篇——须整篇绝对否定**\n\n```\n讲义主张：疫苗危险 > 收益（汞/铝佐剂、自体免疫、多联针、商业利益）\n```\n\n**须「绝「对「强「标」**：**「①硫柳汞已移除；②铝佐剂远低于安全阈；③数千万人研究未见自闭症/MS因果；④疫苗每年避免400–500万死亡；⑤反疫苗直接导致麻疹/百日咳暴发」** ✓✓✓\n\n**这是全书最需要整篇否定的内容**——因为它的公共卫生危害最大。** ✓✓✓","o":"RJ-3250 · 《再论疫苗》（PDF 第 1–10 页）。"},{"t":"专题篇与医论：乳癌、艾滋病、肝癌、疫苗与经方讲解","h":"汉唐中医方剂讲解","c":"【汉唐中医方剂讲解】讲义的核心：「**经方不是『古方』，是『经典之方』——『经』是『常道』，是经过千年验证的规律。****」讲义讲了方剂的三个层次：**① 方（君臣佐使的结构）；② 证（方对应的证候）；③ 量（剂量与比例，『中医的不传之秘在量』）。****讲义举的经典例子：**① 桂枝汤（桂枝:芍药 = 1:1，『调和营卫』；若芍药加倍就成了『桂枝加芍药汤』治腹痛——『一味之差，方向就变』）；② 小柴胡汤（柴胡:黄芩 = 8:3，『和解少阳』）；③ 四逆汤（附子:干姜 = 1:1.5，『回阳救逆』）。****讲义强调：『方剂的核心不是记住药物，而是记住『比例』与『煎法』——同样的药，比例变了、煎法变了，就是另一个方。』****（须「强「标」）剂量须由执业医师按个体调整；附子、乌头、细辛等有毒药物须严格炮制与久煎。**\n\n**【极重要】汉唐方剂讲解：方—证—量三层次（比例与煎法决定方）**\n\n```\n三层次：方（君臣佐使）/ 证（方证对应）/ 量（不传之秘在量）\n例：桂枝:芍药=1:1（调和）；芍药加倍→桂枝加芍药汤（治腹痛）\n「一味之差 / 比例一变，就是另一个方」\n```\n\n**须「强「标」**：**「①剂量须执业医师按个体；②附子/乌头/细辛须炮制 + 久煎；③不可自配」** ✓✓\n\n**「中医的不传之秘在量」——「这是最精的方剂学钥匙（量变则方变）。」** ✓✓✓","o":"RJ-3251 · 《汉唐中医·方剂讲解》（PDF 第 1–20 页，三个同名文件合并校读）。"},{"t":"专题篇与医论：乳癌、艾滋病、肝癌、疫苗与经方讲解","h":"经方经验总结 259 方","c":"【经方经验总结大全 259 方】讲义把《伤寒论》《金匮要略》的方剂整理为 **259 方**，按六经与病类分组：「**① 太阳篇方（桂枝类、麻黄类、青龙类、陷胸类、泻心类、十枣类）；② 阳明篇方（白虎类、承气类、茵陈类）；③ 少阳篇方（柴胡类）；④ 太阴篇方（理中类、四逆类）；⑤ 少阴篇方（附子类、黄连阿胶类、真武类）；⑥ 厥阴篇方（乌梅类、当归四逆类、白头翁类）。****」讲义强调三条使用原则：**① 方证对应——『有是证用是方』，不凭病名；② 剂量比例——原方比例不可随意改；③ 加减法——张仲景原方自带加减（如小青龙汤、真武汤、四逆散），要按原加减法。****讲义还讲了『方剂的三个禁忌』：**① 峻剂（十枣汤、大承气汤）不可轻用；② 有毒药（附子、乌头、巴豆）须炮制；③ 表里同病要先表后里（或先里后表，看急缓）。****（须「强「标」）259 方是学习地图，不是可自行照方抓药的处方集——每方都须辨证。**\n\n**【极重要】经方 259 方（六经分组 + 三条使用原则）**\n\n```\n分组：太阳（桂枝/麻黄/青龙/陷胸/泻心/十枣）→ 阳明（白虎/承气/茵陈）\n→ 少阳（柴胡）→ 太阴（理中/四逆）→ 少阴（附子/黄连阿胶/真武）→ 厥阴（乌梅/当归四逆/白头翁）\n原则：方证对应 / 剂量比例 / 原方加减\n```\n\n**须「强「标」**：**「①259方是学习地图，非处方集；②须辨证；③峻剂/毒药须专业医师」** ✓✓","o":"RJ-3252 · 《经方经验总结大全 259 方》（PDF 第 1–40 页）。"},{"t":"专题篇与医论：乳癌、艾滋病、肝癌、疫苗与经方讲解","h":"经方论治与梁冬对话","c":"【经方论治】讲义的核心：「**经方治病的三个层次：**① 治证（对症）；② 治人（对体质）；③ 治时（对时间/季节）。****」讲义强调『治人』：「**同样一个咳嗽，胖人、瘦人、老人、小孩，方不一样——这就是『因人施治』。****」【梁冬对话倪海厦】这是倪海厦接受梁冬采访的实录，讲义的核心观点：**① 中医是『整体观』（人是一个整体、人与自然是一个整体）；② 中医治『未病』（在病还没成形时干预）；③ 中医的『科学』在于『可重复的疗效』（几千年、几亿人的验证）；④ 学中医要『读经典』（《内经》《伤寒》《金匮》《本草经》）。****讲义还讲了一个很实用的观点：「**中医的短板是『急救』——所以急救要靠西医，中医的强项是『慢性病与体质调理』，两者应该互补而不是对立。」****（这一句是本册难得的、平衡的表述，与前面多处攻击性言论形成对照，应予保留。）**\n\n**【极重要】经方论治三层次（治证/治人/治时）+ 梁冬对话的平衡观点**\n\n```\n经方三层次：治证（对症）/ 治人（体质）/ 治时（时间季节）\n梁冬对话：整体观 / 治未病 / 疗效可重复 / 读经典\n「中医短板是急救，强项是慢病与体质——中西医互补而非对立」\n```\n\n**「中西医互补而非对立」——「这是全册最平衡的一句（最应保留）。」** ✓✓✓","o":"RJ-3253 · 《经方论治》《梁冬对话倪海厦》（PDF 第 1–30 页）。"},{"t":"专题篇与医论：乳癌、艾滋病、肝癌、疫苗与经方讲解","h":"跟诊、学生案例与文集","c":"【传统中医跟诊过程】讲义记录了跟诊的规范：「**① 先看病人（望闻问切），自己写辨证；② 再看老师的方，对比差异；③ 记下『为什么这样想』——不是记方，是记思路。****」讲义强调：「**跟诊学的不是『方』，是『辨』——同一个症状，老师为什么想到这个方？这才是要学的。****」【临床案例-人纪学生】这是学生独立接诊的案例集，讲义用它来说明：「**学生出错的三个常见点：**① 只看局部（不看整体）；② 只对症状（不对病机）；③ 剂量不敢用（该重的时候轻）。****」【倪海厦文集】收录了倪海厦多年的文章，主题包括：**① 对医疗体制的批评；② 对营养学的批评（『维他命是化学合成的，不是食物』）；③ 对疫苗的质疑（见前『再论疫苗』，须整篇否定）；④ 对中医教育的呼吁。****（须「绝「对「强「标」）文集中的体制批评、营养批判、疫苗质疑，须按『保留原文 + 分级标注』处理：**① 关于『精炼糖/维他命』的批评，部分与现代营养学一致（添加糖 < 10% 能量、优先食物基质）；② 关于『疫苗』与『西医无用』的主张，须逐条否定（见前条）。**\n\n**【极重要】跟诊规范（学辨不学方）+ 学生三错 + 文集主题**\n\n```\n跟诊：自己辨证 → 对比老师方 → 记「为什么这样想」\n「学的是辨，不是方」\n学生三错：只看局部 / 只对症状 / 剂量不敢用\n文集主题：体制批评 / 营养批判 / 疫苗质疑 / 中医教育\n```\n\n**须「绝「对「强「标」**：**「①文集的疫苗/西医主张须逐条否定；②营养批判部分与现代一致（添加糖 <10%）；③不可据此拒绝规范治疗」** ✓✓✓\n\n**「学的是辨，不是方」——「这是最精的师承心法。」** ✓✓✓","o":"RJ-3254 · 《传统中医跟诊过程》《临床案例-人纪学生》《倪海厦文集-0606》《文集及医案-0507》《倪海厦-视频课程汇总》（PDF 第 1–40 页）。"},{"t":"专题篇与医论：乳癌、艾滋病、肝癌、疫苗与经方讲解","h":"中医扶阳摘记","c":"【中医扶阳摘记】这是倪海厦摘录、评注的『扶阳学派』文献（清·郑钦安一脉）。讲义的核心：「**扶阳学派的核心是『阳主阴从』——阳气是生命的主宰，阴是阳的载体。****」讲义摘录的关键论点：**① 『万病皆损于一元阳气』——一切病最终都伤阳气；② 『阳衰则病，阳亡则死』；③ 治法『以阳化阴』——用温阳药（附子、干姜、肉桂）把阴邪『化』掉，而不是『滋阴』去对抗。****讲义还讲了扶阳的『三忌』：**① 忌过用寒凉（苦寒败阳）；② 忌过用滋阴（阴柔碍阳）；③ 忌峻补（虚不受补）。****（须「绝「对「强「标」）『扶阳』是一派学说，不是唯一真理：**① 阳气虚者宜温阳（对）；② 但**热证、阴虚火旺、感染急性期、出血期温阳会加重病情**；③ 附子、乌头有明确毒性（乌头碱 0.2 mg 中毒、2–4 mg 致死），须严格炮制与久煎；④ 『以阳化阴』不能替代抗感染、抗肿瘤、急救。**\n\n**【极重要】扶阳学派三论（阳主阴从 / 万病损阳 / 以阳化阴）+ 三忌**\n\n```\n核心：阳主阴从（阳为生命主宰）\n论点：万病皆损一元阳气 / 阳衰则病、阳亡则死 / 以阳化阴\n三忌：忌过用寒凉 / 忌过用滋阴 / 忌峻补\n```\n\n**须「绝「对「强「标」**：**「①热证/阴虚火旺/急性感染/出血期温阳禁；②乌头碱0.2mg中毒、2–4mg致死；③附子须炮制 + 久煎；④不可替代抗感染/抗肿瘤/急救」** ✓✓✓\n\n**「阳主阴从」——「这是最精的扶阳学派纲领（一派之说，非唯一真理）。」** ✓✓✓","o":"RJ-3255 · 《中医扶阳摘记》（90 页 OCR，PDF 第 1–90 页）。"}];</script>
