<script>const D=[{"t":"一、学术定位与治学方法","h":"倪海厦的学术版图：人纪、天纪、地纪三分","c":"定义——倪海厦（1954—2012），生于中国台湾台北，祖籍浙江瑞安，毕业于东吴大学政治系；曾于美国佛罗里达州开设汉唐中医院，任院长，兼任加州中医药大学博士指导教授、佛罗里达州卫生署中医委员会最高委员会委员，职掌医师鉴定资格、执照更新、医师再教育计划等业务。其学术体系分三大块：**《人纪》**为中医部分，耗时两年半，将《针灸大成》《黄帝内经》《神农本草经》《伤寒论》《金匮要略》以通俗语言讲成视频与讲稿；**《天纪》**完成于 1994 年前后，内容含八字、紫微斗数、阳宅风水、地理、面相、测字，是\"运用易经原理来解释宇宙之间、天地万物的物性方面的著作\"；**《地纪》**为地理堪舆。原书称其\"命、相、卜、山、医五术兼备\"。**教学法**上他倡导\"师徒制\"——\"让学生从始至终直接跟着临床接触病患，直到改善为止\"。","o":"RJ-0001 · 倪海厦传记（PDF 第10页）"},{"t":"一、学术定位与治学方法","h":"《人纪》五部经典的分工与\"各管一段\"原则","c":"要点——倪海厦对五部经典做了明确的功能切分，且强调学习时**不能混用**。他开篇即声明：\"针可以用在所有的疾病上面，从感冒到癌症都可以。**针灸及中药都是可以独立成为中医的一个部门**。所以，此时我们不谈中药，只谈针灸来治病。而日后我在教各位《伤寒》《金匮》时，大家也一样**把针灸忘掉，全用中药来治病**。\"这一原则的具体含义是：**针、药各自都是一套完整的治疗体系，学习时须分开掌握，不可学时依赖\"针药并用\"来遮掩某一方的不精**。他同时给出各部经典的分工：《针灸》讲外治（经络穴位手法）、《黄帝内经》讲生理病理与治则、《神农本草经》讲药性、《伤寒论》讲六经辨证与方证、《金匮要略》讲杂病。至于顺序，他以\"针灸的使用比中药早了约一千年\"为由，把《针灸》列为入门第一部。","o":"RJ-0002 · 第一章 针灸的使用时机（PDF 第10~11页）"},{"t":"二、针灸的使用时机","h":"四类不宜下针的情形","c":"风险——倪海厦列出四条禁忌时机，都是**正气不足或气血动荡**之时。**①** \"遇到**气血大虚、重病、刚刚失过很多血、病患完全没有元气**的时候，这时候我们不下针\"；**②** \"刚做完爱，行完房事后，也不针，**时机不好**\"；**③** \"**运动过后、大汗后**也不针\"；**④** \"**喝酒后，不针。体力不够，不下针**\"；另附一法：\"**在耳垂正中放几滴血可解醉酒**。\"这四条的共通原理是：针刺是以\"调气\"为手段的治疗，其前提是患者尚有可调之气；气血大虚或大汗亡阳之际强行针刺，等于在虚弱处再消耗一次正气。第四条尤其值得注意——酒后气血本已浮越，此时行针会加重气血紊乱；而\"耳垂放血解酒\"则是反其道用之：以放血泄其浮越之热。这一\"一禁一用\"的对照，正体现了针灸\"视气血状态而定\"的原则。","o":"RJ-0003 · 第一章·针灸的使用时机（PDF 第11页）"},{"t":"三、灸法","h":"艾草\"向下找水\"的特性与灸的适用位置","c":"要点——倪海厦解释为什么用艾而不用别的材料，给了一个基于物理特性的理由：\"**艾有一个特性，就是向下，艾会自己去找水，找到水以后烟就往上升**。\"他举古代部队找水的办法佐证：\"叫阿兵哥将艾草摊在土里烧，这时叫人到各处去看看，**看到地上有烟冒出来的地方，那个地方下面就有水**。\"由此推出两个用法：**其一**，正因为艾性向下、属纯阳，故能深入病所；**其二**，\"**当针力不足的地方，我们就会用到灸，气血大虚时，可用灸的方式处理**\"——即灸的定位是\"针之所不及\"，专补针力不达与气血大虚两种情形。这一说法虽属传统类比推理（艾烟上升的物理机制实为热气对流），但其临床指向明确：**灸法用于虚证、寒证、以及针刺难以到达的深部或大面积病灶**。","o":"RJ-0004 · 第一章·为什么要灸（PDF 第11页）"},{"t":"三、灸法","h":"隔姜灸的操作规范与\"一壮\"的定义","c":"方法——**材料**：\"切一片大概**五十元（一元硬币）大小**的生姜，**先戳几个洞**\"；\"拿一些艾绒，**捏成金字塔状**，再将它放在生姜上面，这样一个单位叫'**一壮**'\"。**操作要点**：①\"**灸的时候，这个生姜片不用换**。不要灸五壮，就换五片生姜\"——即姜片可重复使用多次，不必每壮换新；②\"**烧到温热，不用烧到很烫**。感觉温热，不用很烫时就换一壮\"——以温热为度，而非追求灼痛；③\"在旁边放一个**水盆**，未烧完的艾就丢到水里熄灭掉。**若不放水在里面，碗就会烧破**\"——这是安全细节，未熄灭的艾绒余烬会烧穿容器。**数量原则**：\"**灸单数不灸双数**，艾为纯阳，取阳数\"。**起泡处理**：\"若灸后起了水泡，就从皮肤旁边用**消毒过的针刺一个小洞**，把水慢按排出来。**不要把皮肤撕掉免得造成疤痕**，洒上一些**硫磺粉及大黄粉**就可以了\"。","o":"RJ-0005 · 第一章·隔姜灸（PDF 第11~12页）"},{"t":"三、灸法","h":"隔盐灸与隔蒜灸的各自用途","c":"方法——**隔盐灸**：'用盐巴填满**神阙穴（就是肚脐）**，再放艾绒上去灸'。三条要点：①\"**先将盐炒熟**\"；②\"**精盐不能用，要用青盐或海盐**\"；③\"要等盐变温一点了，凉了，**再倒在神阙穴上，否则会把肚皮烧坏了**\"。主治：\"古病人**下利**时，不管是寒利或热利（只要是食物没有消化就是寒，热利的话味道会很臭），灸，**寒症用的比较多些**，灸神阙就可以了\"。**隔蒜灸**：'灸一个就是一壮'，专治**久咳**；原理是\"**蒜是白色的，辛辣色白，才能入肺**，放在**舌上**——因为**舌为心表**，把舌头往外伸，灸后**心脏力量加强**；心和肺最接近，这时候我们去灸，咳嗽就会好\"。**选材区分**：\"你不要拿生姜，**要用蒜，肺的问题，我们要用隔蒜灸**\"。三种隔物灸由此形成分工：**姜（温中散寒，最常用）、盐（填补脐部、治下利）、蒜（入肺治久咳）**。","o":"RJ-0006 · 第一章·隔盐灸、隔蒜灸（PDF 第12页）"},{"t":"三、灸法","h":"灸的三个数量与火候原则","c":"方法——**①\"痛灸到不痛止，不痛灸到痛止\"**（灸的大原则）。书中给出两个例证：\"'**不痛灸到痛止**'的意思是，比如**脂肪瘤**隔姜灸，一直灸直到当你碰到患部病根的时候，那儿开始产生了痛，就表示到了\"；\"'**痛灸到不痛**'，像'**肿瘤**'就是，在肿瘤痛的地方一直灸，**直到不痛的地方就停住**\"。**②\"灸单数不灸双数\"**——\"艾为纯阳，取阳数\"。**③膏肓穴的特例**：\"不论是什么病，**灸膏肓穴灸百壮，无所不疗**，灸到**口干舌燥都没有关系**，小便都会有艾草味\"。这三条合起来构成灸法的\"量\"的体系：普通穴位按阳数（三五七壮），以痛感变化为停灸指征，而膏肓作为\"无所不疗\"的要穴则可用至百壮。需要说明：灸量的判定依赖患者主观痛感，操作者须同时防止烫伤，尤其糖尿病患者的皮肤感觉迟钝，施灸时更须控制距离与时长。","o":"RJ-0007 · 第一章·米粒灸与灸的大原则（PDF 第14页）"},{"t":"三、灸法","h":"灸的禁区：哪些情况不能灸","c":"风险——书中明确列出禁灸范围：\"**一般热症不用灸法**。当感冒发烧，病人已经很热了，不要灸。**流汗多的地方不灸**（手掌汗比较多，也不灸）。**津液很多的地方不要灸，眼睛不要灸，阴部不灸**。病人有**痔疮**时，已经是热了，也不能灸。\"归纳其逻辑：**①热证禁灸**（灸性属阳，热上加热）；**②多汗、多津液处禁灸**（津液已外泄之处再加火，易耗津）；**③眼、阴部禁灸**（部位娇嫩，且有伤及眼球、黏膜之虞）；**④痔疮属热禁灸**。这一组禁忌的背后是灸法\"以阳补阳\"的定性——凡病性属热、病位津液外泄者，用灸即\"以偏助偏\"。此外，书中另有一处强调针与灸的边界：\"**针就是针，灸就是灸**，我们要分开使用\"，并引歌诀：\"**针而勿灸灸勿针，针经为此常叮咛。庸医针灸一齐施，徒施患者炮烙刑**\"——批评当时流行的\"针上放艾绒\"（温针灸）做法，认为那是\"让病人更痛苦\"的花哨手法。","o":"RJ-0008 · 第一章·灸的禁忌、针与灸的分离（PDF 第13页）"},{"t":"四、病势判断","h":"病进与病退的走向判据","c":"方法——倪海厦给出一条可操作的判断法则：\"**当病进时，是由四肢末梢往身上走**，就像手有伤口被感染或被毒蛇咬到，这时会感到毒往身上走。而**病退时，就会由身上往四肢走**。譬如，原来是病在肩，第二天醒来，病虽还没好，但我的肩不痛了，但是**痛到手臂上了，这就是病在退了**。\"由此推出两条临床决策：**①病退时不可改方**——\"当病在退的时候，**处方不能改，所针的穴道也不能改，要等它病好了为止**\"；**②病进时须改方**——\"若病仍在进时，就表示你的**处方、穴道错了**！这时你就应该想想怎么去解决它\"。这一判据的价值在于它给出了一种**不依赖检验指标的方向性判断**：症状从躯干向末梢移动＝好转，从末梢向躯干移动＝恶化。它以\"病位移动方向\"而非\"症状强弱\"论进退，因此在症状加重但位置外移时（如肩痛减轻而手臂开始痛）仍判为好转，避免了\"以痛感强弱误判疗效\"的常见错误。","o":"RJ-0009 · 第一章·病进病退（PDF 第12页）"},{"t":"五、急救","h":"针灸急救的五级递进流程","c":"方法——适用于\"发病昏迷过去\"者，\"可能是心脏病，也可能是中风、溺水，我们不管是什么原因\"，按以下顺序逐级施治：**①人中**——\"鼻子下方、嘴唇上方的水沟处，把它**分三段，取上面三分之一处**下针，**针要斜刺往上**；若没有针在手上，**掐人中**\"。**②十宣放血**——\"在十只手指头的指尖放血\"；操作技巧：\"不要一个一个下，太慢了，可以**一次捉五个手指，针拿起来，一二三四五，一下子就刺完**，五只指头一起挤放血。这是老师傅的手法\"。**③足十趾尖放血**（若仍未醒）。**④涌泉**——\"将脚掌一握起来，会看到'**人**'字纹，**人字纹的纹头就是穴道**\"；\"这是我们的急救大穴，你不要拿一个三寸针下去\"。**⑤百会放血**——\"若还不醒，就在百会放血；百会穴一般是**放血用，我们不下针**。当病人整个脸都是呈现红色时，就是**刚中风**，就在百会放血\"。这一流程的设计逻辑是\"**由末端向中枢、由轻刺激向强刺激**\"：人中（近脑）→十宣/十趾（最远端）→涌泉（足心）→百会（头顶）。其临床意义在于：**整个过程不需要判断病因，也不需要药物，可在任何场合立即实施**。需强调：这是急救的辅助手段，意识丧失者应同时呼叫急救；面部通红者需与中暑、醉酒等鉴别。","o":"RJ-0010 · 第一章·针灸的急救法（PDF 第14~15页）"},{"t":"五、急救","h":"百会穴的定位与放血后的效验","c":"方法——**定位**：\"从**额头往上到顶**，再由**两耳尖直上**，两线相交的一点，**再往后半寸**，会摸到一个**凹洞**，就是百会穴\"。**操作**：\"放血时，让病人**躺下头靠着床沿往下垂**，在百会放血后，病人会感到**一阵清凉**——**凉到嘴巴，就可以讲话；凉到手脚，手脚就可以活动了**\"。这一\"效验描述\"（凉感由上向下传导至口、四肢）实际是疗效的即时验证指标：**凉感所到之处，即气血恢复周流之处**。从现代角度看，头顶放血可迅速降低颅内压与局部充血，对高血压性脑病、中风初期的面赤、神昏有一定急救意义；但须注意：**放血量应少（数滴至数毫升），且须消毒**，不可作为常规手段反复使用。书中另有一句立场鲜明的表述：\"在急救时，**管他有无执照，没有人会告你的，急救就去救**\"——这一说法属其个人主张，实际操作仍应在法律与资质允许范围内进行。","o":"RJ-0011 · 第一章·百会放血（PDF 第14~15页）"},{"t":"五、急救","h":"火罐的适用、判断与禁区","c":"方法——**功效**：\"火罐除了可以吸脓，还有**瘀血**，我们在活血化瘀的时候，比如**膝盖扭伤**，我们会在**痛点放血**，用火罐放血的时候**看颜色，由黑变淡，就起罐**\"；\"被**竹子刺到或海胆刺到**，都可以用火罐抽出来\"；**痔疮**\"现在是用放血针，刺完以后，就用火罐把它吸出来\"。**操作**：用真空拔罐器，\"拿火罐枪将空气吸出来，拿的时候后面的尾巴一拔，气就放出来了\"。**禁区**：\"有些地方不能拔火罐，例如**乳中**，否则**乳头会流黄水出来**。**多汗的地方不上火罐，头部也不用火罐**\"。**时机**：\"在**外科急性扭伤**的时候用的很多，**受伤时马上在扭到的地方上火罐**\"。这一条中最有临床价值的是\"**看颜色，由黑变淡，就起罐**\"——它给出了拔罐的**客观停止指征**，替代了\"拔多久\"的经验模糊；以及\"急性扭伤立即施术\"的时机原则，与一般\"扭伤 24 小时内不宜处理\"的说法不同，其实质是以放血泄瘀代替冷敷止血，适用于无骨折、无大血管损伤的单纯软组织扭挫。","o":"RJ-0012 · 第一章·火罐的使用（PDF 第15页）"},{"t":"六、针法基础","h":"同身寸的取法与适用部位","c":"方法——**定义**：\"所谓同身寸，因为每个人的**高矮体格都不一样**……所以**你不能用我的寸来量他的**，每一个人的寸都不一样\"。**取法**：\"把**中指头弯起来，这两个横纹头**，点跟这个点之间我们定义为**一寸**\"；\"**三个指头**拿起来，这是**两寸**；**四个指头**是**三寸**，以连接手掌的指端为长度标准\"。**铁律**：\"**你看的时候要看病人的手，不能看你的手**\"；\"**小孩子要看小孩子的手**\"。**适用范围**：\"同身寸大部分用在**四肢**上面，还有**经络之间**的寸。而**腹部跟胸部，另有个独立的丈量方式**\"（介绍任督二脉时讲\"均等法\"）。这一方法的意义在于解决了针灸取穴的根本问题——穴位是**相对位置**而非绝对距离，故必须以患者本人的身体比例为单位。其临床价值：在没有解剖标志可依的部位（如前臂、小腿），同身寸是唯一可行的定位法；而胸腹部因有肋骨、脐、耻骨等固定标志，故改用骨度分寸。","o":"RJ-0013 · 第二章 针灸穴位丈量方法（PDF 第16页）"},{"t":"六、针法基础","h":"针刺深浅的两条依据","c":"方法——深浅由两个变量决定。**依据一：季节**。\"在**春天**下针就要比较**浅**，**秋冬**的时候，针下的比较**深**\"；他打了个比方：\"好像我们钓鱼一样，**冬天的时候，鱼都在比较深的地方**，针就要下到骨髓去；春夏的时候，天气比较热，所以针下的比较浅\"。**依据二：病位层次**。\"中医认为，**皮毛是肺在管，肌肉是脾脏在管，血脉是心脏在管，骨是肾脏在管**。一般下针的时候，**如果病在皮毛，我们针就下在皮毛；如果病在肌肉，我们下在肌肉；病如果是在血脉上面，我们就扎在脉的旁边；如果病是在肾脏，我们会从皮肤上面下针下在骨头的旁边去**\"。这两条依据的共同逻辑是\"**针至病所**\"：针刺的有效深度必须与被治疗对象的所在层次一致——太浅则力不及病所，太深则徒伤无病之处。其中\"病在血脉扎在脉旁\"一条尤须留意，因直接刺血管有出血风险。","o":"RJ-0014 · 第二章·针刺的深浅（PDF 第16页）"},{"t":"六、针法基础","h":"\"腹深似井，背薄似饼\"","c":"风险——这是针灸深浅的总口诀：\"过去我们有一句话，叫做'**腹深似井，背薄似饼**'。这指的就是针刺的深浅。**腹部上扎针的时候，可深针；背上扎针，就不可以深针，否则会扎到内脏**。扎到肺会引起**肺**……（原文续述气胸等后果）。\"这一口诀的原理在于**解剖结构的差异**：腹部虽内有胃肠，但腹壁柔软、脏器可被推开，且针刺多取任脉、胃经等前部穴位，故可深刺；背部则紧邻**肺、胸膜、脊髓、肾**等重要器官，且背部穴位（如肺俞、心俞）本就对应内脏，深刺极易造成**气胸、内出血**。实操上，背部穴位宜**斜刺或平刺**（沿皮刺、向脊柱方向斜刺），不宜直刺深刺；胸背部进针前须明确肋骨下界，肩胛下角平第 7 肋，其下即为肺野。","o":"RJ-0015 · 第二章·针刺的深浅（PDF 第16页）"},{"t":"一、经络理论基础","h":"十二经纳天干与五行配属","c":"定义——天干歌：\"**甲胆乙肝丙小肠，丁心戊胃己脾乡，庚属大肠辛属肺，壬属膀胱癸肾脏，三焦亦向壬中寄，心包同归入癸水**\"。这套配属的作用是把十二经归入**五行**：\"甲乙是木，丙丁是火，戊己是土，庚辛属金，壬癸属水\"；因五行各有阴阳，故**脏为阴、腑为阳**——\"阴木就是肝，阳木就是胆；阴火就是心，阳火就是小肠；脾土就是阴，与阳土相对就是胃；肺是阴脏，阳是大肠；肾脏是阴，阳水就是膀胱\"。**为何要知道天干**：\"五运六气：**天干为运，地支为气**\"；书中举例说明推演法：\"甲己合化土运，甲太过、己不及；乙庚合化金运，乙不及、庚太过；丙辛合化水运……戊癸合化火运，戊太过、癸不及\"，并给出实例——\"**2018 年，戊戌年，对应火运太过**\"。地支六气：\"子午年：少阴君火司天，阳明燥金在泉；丑未年：太阴湿土司天，太阳寒水在泉……巳亥年：厥阴风木司天，少阳相火在泉\"。这一体系的实用价值在于：它把**年份、气候、脏腑、经络**串成一张对应表，为\"因时施治\"提供推演工具；但须注意五运六气属传统运气学说，其预测效验尚未经现代验证。","o":"RJ-0016 · 第三章·十二经纳天干歌（PDF 第19~20页）"},{"t":"一、经络理论基础","h":"十二经纳地支与十二时辰流注","c":"定义——地支歌：\"**肺寅大卯胃辰宫，脾巳心午小未中，申胱酉肾心包戌，亥焦子胆丑肝通**\"。具体时辰：\"**寅时开肺**，寅时是**凌晨三点到五点**；**大肠开卯时**，五点到七点；**胃开辰时**，七点到九点；**脾脏开巳时**，九点到十一点；**心开午时**，十一点到下午一点；**小肠**，一点到三点；**膀胱**，三点到五点；**肾脏**，五点到七点；**心包经**，七点到九点；晚上**九点到十一点是三焦经**；再回到**胆**，晚上十一点到凌晨一点；最后回到**肝经**，一点到三点\"。这套流注次序被倪海厦称为\"**气血流注**\"的路线，其临床意义在于提供了一个**不依赖仪器的时间维度诊断框架**：某一时辰的固定发病或症状加剧，指向对应脏腑。他特别强调这是\"**站在外面就知道里面**\"的工具，与需要抽血、拍片的检查手段形成对照。","o":"RJ-0017 · 第三章·十二经纳地支歌（PDF 第21~22页）"},{"t":"一、经络理论基础","h":"时辰诊断的三个实例","c":"方法——地支歌的临床应用，书中给三个判读实例。**例一（肝）**：\"病人来看你，**脸色黄黄的**，再看**手掌暗红色**，问一个问题——晚上好不好睡？答：**每天晚上一点多就醒过来**，从头到尾没问第二句。第一次问诊，睡觉好不好就结束了。\"其推理是：1—3 点为肝经当令，此时定时醒来即肝有问题。**例二（胆）**：\"有一个人每天晚上**十二点钟一定醒过来**，他有一个很大的**胆结石**，发病都是晚上**十一点到一点**\"。**例三（肝癌转移判断）**：\"本来**一点到三点不能睡、又变成三点到五点不能睡**，就是**转到肺癌**\"；反之\"本来一点到三点不能睡，治疗后来可以睡了，**能一觉到天亮，就是肝病好啦**，不需要查什么报告\"。这三个例子的共同方法是**以\"定时醒来\"的时段定位病脏，以时段是否前移判断病进病退**。其中\"治后能睡即愈、时段前移即恶化\"的判定，为疗效评估提供了一个患者自己就能报告的主观指标。","o":"RJ-0018 · 第三章·地支歌用于诊断与验证（PDF 第23页）"},{"t":"一、经络理论基础","h":"井荣俞原经合的主治分工","c":"定义——十二正经各有井、荥、俞、经、合五穴，另有原穴。**位置规律**：\"**井荣俞经合都是手不过肘，足不过膝**\"——即五输穴全在肘膝以下的远端。**五行配属**：\"**任何的阴经，他的井穴通通是木，任何荥穴都是火**……**每一条阳经**都有井荣俞经合，属性是**金水木火土**\"。**主治分工（引《聚英》总论）**：\"**井之所治，不以五脏六腑，皆主心下满；荥之所治，皆主身热；俞之所治，皆主体重节痛；经之所治，皆主喘嗽寒热；合之所治，皆主逆气而泄**\"；另\"**又总刺（原穴）**\"。**具体应用举例（胆病）**：\"假令得弦脉，病患善洁、面青善怒，此胆病也。若**心下满，当刺窍阴（井）**；**身热当刺侠溪（荥）**；**体重节痛刺临泣（俞）**；**喘嗽寒热刺阳辅（经）**；**逆气而泄刺阳陵泉（合）**；**又总刺丘墟（原）**\"。这一体系提供了\"**按症状选穴层级**\"的检索路径：先辨主症属井/荥/俞/经/合哪一类，再在该经对应穴位取穴，不风险极高记每个穴位的主治。","o":"RJ-0019 · 第三章·十二正经之井荣俞原经合穴（PDF 第24~25页）"},{"t":"二、脏腑生理观","h":"心为火、小肠为第二心脏","c":"要点——倪海厦解释\"为什么把心脏定义为火\"：\"因为**心一直跳产生热**……西医都是看到结构上的问题，也就是**只看到外形**，所以西医定的病名都是形，他**没有神**。就是因为心脏不断的搏动，**一天大概十万次以上**，你想想看心脏不断跳，热不热？既然热的话，我们没办法讲，只好用'**火**'来代替。所以**体温的来源，来自心脏**。\"**心与小肠的表里关系**：\"**小肠是阳火**……**心脏跟小肠是表里**……**心脏产生的热**，按照道理热应该往上走……所以制造了**肺**，**肺是金**，在阴阳五行里面**火是克金的，两个相互制衡**\"；\"**心脏的火往小肠下导**，所以正常人的**心脏和小肠是一样的速度、一样的温度、一样的压力**\"；\"**丹田是小肠的募穴**（关元），让气就往下走；因此**小肠的温度，变得非常的热**\"。这套推理把\"心—小肠—丹田\"串成一条**热力下行路径**，解释了下腹温暖、消化正常的生理基础，也提示：上热下寒（上身烦热、小腹冷）意味着这条下行路径受阻。","o":"RJ-0020 · 第三章·脏腑阴阳与表里（PDF 第21~22页）"},{"t":"二、脏腑生理观","h":"肺为\"水箱\"：火金相制的生理意义","c":"要点——\"**肺好像天空一样，天上都是寒冷的**。**把心当成引擎的话，肺就是水箱**。\"他解释这个比喻的逻辑：\"心脏产生热，热本生的性是往上升的，那光上升不行，**每天都会过热**，一发高烧就走人啦，脑袋烧坏掉了！所以制造了肺……**肺会让热往下走**，**练气的人让气往下走**。\"这一段是对\"心火刑金\"与\"金能制火\"的通俗化表述，其临床对应是：**肺的肃降功能正常，则上焦之热不至于壅滞于头面**；反之肺失肃降，则出现面赤、头晕、鼻衄、失眠等\"火不下行\"之象。由此可以理解倪海厦多处治法（如以降气、肃肺、引火下行为法）的立足点。需说明：这一\"引擎—水箱\"的比喻是功能类比而非解剖对应，其价值在于提示**心肺之间的制约关系**，而非生理学描述。","o":"RJ-0021 · 第三章·肺的生理功能（PDF 第22页）"},{"t":"二、脏腑生理观","h":"水液代谢的三段气化：肾、小肠、肝","c":"要点——倪海厦把水液代谢描述为三段气化。**第一段（肾／膀胱）**：\"**在肾脏这边第一次气化，在小肠里面是第二次气化**\"；\"当膀胱有**400CC 的尿**时会把膀胱撑起来，**膀胱变成热气球往上升**；**没有到 400CC 容量的时候，我们不会有尿意，不会想小便**。一到 400CC 满啦，就急着要上厕所。小便出来时，因**膀胱的热气**，才有办法产生**速度、力量、压力**，把小便排射出去\"；\"在膀胱气化的过程中间是**第一次蒸馏**\"。**第二段（小肠）**：\"在**第二次气化**时，**浊水会排出来**\"。**第三段（肝）**：\"而**干净的水会交给肝**，肝得到干净的水（**水去生木**），就可**把毒排掉、再交给胆、化成胆汁**\"。这一模型的核心是**\"气化\"**二字——水不是被动过滤，而是在热量作用下被蒸发、分离、重新分配。其可操作推论是：**若气化不足（下焦阳虚），则水液停滞为水肿、尿少、痰饮**；故治疗水液病多从温阳化气入手。书中\"400CC\"这一数值给了膀胱蓄尿与尿意的量化关联，但属经验值，个体差异很大。","o":"RJ-0022 · 第三章·水液代谢与气化（PDF 第23页）"},{"t":"二、脏腑生理观","h":"\"心脏不得癌\"的热度说","c":"要点——这是倪海厦反复讲的一个论断：\"**中医为何可以治疗癌症，很简单——你们听过人死在乳癌、肺癌、淋巴癌、肝癌，却有没有人死在心脏癌？只有死在心脏病，而不是心脏癌**。**心脏不会得癌，因为心脏很热，癌细胞经过心脏，像飞蛾扑火一样**。若把全身从头到脚变成像心脏一样很热，癌细胞就没有了。\"他并举证：\"**人身体很热**，怎么证明？**冬天一吐气，若吐出来不是白色的蒸气，那个人是火星人**……所以**气是热的**，中医的观念是热气，就是蒸气。\"**需要明确说明**：这是其个人学术主张，属于传统\"寒致癌\"思路的推演，并非现代肿瘤学的结论——心脏确实极少发生原发性恶性肿瘤，但公认原因是心肌细胞代谢率低、血流快、淋巴回流少等，与\"温度杀死癌细胞\"无关。此处保留原文，仅为呈现其学术全貌，不可据此替代肿瘤规范治疗。","o":"RJ-0023 · 第三章·心脏与癌（PDF 第22页）"},{"t":"三、中西医的立场差异","h":"\"中医是物理医学\"","c":"要点——倪海厦用物理学类比自己：\"**中医就是物理医学，物理学非常注重时间、速度、温度还有压力**。爱因斯坦一辈子没有上过太空，登陆月球是阿姆斯特朗，他的办公室很小，光用黑板、粉笔，就可以算出黑洞……**中医就是按照时间、速度、温度还有压力，你的身体就是一个小宇宙**。这就是中医，就是**站在外面可以看到里面**。\"这段比喻的落点是**诊断方法**：通过体表的温度（寒热）、速度（脉搏快慢）、压力（脉象张力）、时间（何时发病）四项可感知参数，推断体内的状态，而不必打开身体。与之配套的是他对\"什么是正常人\"的强调：\"**中医跟西医正好是相反的，西医是把病复杂化，中医是要知道什么叫做常人**。如果你被训练出来，一开始就查病，查了半天还是看不好病；如果你是被我训练出来的，**是不是不正常，你一看就知道了**\"。这一立场决定了他的诊断次序：**先立\"常\"的标准，再辨\"失常\"的偏差**。","o":"RJ-0024 · 第三章·中医是物理医学（PDF 第22页）"},{"t":"三、中西医的立场差异","h":"\"六经传变之后才被查出\"的时间差批评","c":"要点——倪海厦以六经传变说明中西医的发现时点差异：\"**中医分成三阶段**——当你是**正常的人，一得到症状的时候，身体马上就知道了**；**西医却还不知道**。等到病了，经过**太阳、少阳、阳明、太阴、少阴、厥阴六个阶段**，进入病**西医才查到了，这就太慢**！中医在一开始、一有动作就知道了。**中医的高手在一动就晓得**。\"**他给的一个健康自测标准**：\"正常人的**大肠是开早上五点到七点**，所以**起床要上大号**，这是正常的身体，代表你**气血流注没有问题**。一天二十四小时有十二时辰一个周天……不必去验血，这个人每天起床上大号，这是没有病的。\"这一论述的合理内核是**\"功能状态早于器质改变\"**——症状出现早于检验指标异常，这在现代医学中也成立（如糖尿病前期、慢性肾病早期）。但他据此得出的\"西医查不出＝不必查\"的推论则失之绝对：器质性疾病的早期发现恰恰依赖检验，两者应互补而非替代。","o":"RJ-0025 · 第三章·地支歌与健康判断（PDF 第23~24页）"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"针灸的使用时机","c":"【第一章】讲义开篇就讲「**什么时候可以用针灸**」：「**针灸的使用时机，第一个原则是『虚证、寒证可以用，实证、热证要谨慎』——但其实针灸也能治实证，只是要配合手法（泻法）。****真正不能针的情况是：病人大醉、大饥、大饱、大怒、大渴、大劳之后——这些时候气血正在调动，再针会扰乱气血。****另外，『孕妇忌针』（尤其腹部、腰骶部、合谷、三阴交），『大汗后不可针』，『房事后不可针』。****讲义特别强调：『针灸的使用时机，就是病人在气血平静的时候。』****这就是《内经》『无刺大醉、无刺大怒、无刺大劳、无刺大饥、无刺大渴』的临床落实。**」\n\n**【最重要】针灸四禁时机：大醉 / 大饥 / 大饱 / 大怒 / 大渴 / 大劳（气血未定）**\n\n```\n可用：虚寒（宜补）、实热（宜泻，需手法）\n禁忌时机：大醉、大饥、大饱、大怒、大渴、大劳、大汗后、房事后\n孕妇：腹腰部 + 合谷 + 三阴交 禁针\n```\n\n**「气血平静时才针」——「这是最精的针刺时机原则。」** ✓✓✓","o":"RJ-0026 · 《人纪·针灸》第一章「针灸的使用时机」（PDF 第 9–10 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"隔姜灸","c":"【第一章·隔姜灸】讲义：「**隔姜灸是最常用的一种灸法。****做法：把生姜切成一片（约 0.3 公分厚），在中间用针扎几个洞，放在穴位上，再把艾炷放在姜片上点燃。****为什么用姜？因为生姜性温、能散寒，借灸火之力把姜的温性带进体内。****隔姜灸最适合『寒证』——胃寒、宫寒、关节冷痛、呕吐、腹泻。****为什么隔一层东西？因为直接灸（艾炷直接放在皮肤上）会烧伤皮肤、留下疤痕；隔姜既能温通，又保护皮肤。****灸到什么程度？『灸到皮肤红润、病人觉得热』就够了，一般 5–7 壮（一个艾炷燃尽叫一壮）。**」\n\n**【最重要】隔姜灸：姜片（0.3 cm、扎孔）+ 艾炷（温散寒邪）**\n\n```\n适应：胃寒 / 宫寒 / 关节冷痛 / 呕吐 / 腹泻\n「隔物」的目的：保护皮肤（避免直接灸留疤）\n量：5–7 壮，灸到皮肤红润为度\n```\n\n**「借姜之温 + 灸之火」——「这是最精的双重温通。」** ✓✓","o":"RJ-0027 · 《人纪·针灸》第一章「隔姜灸」（PDF 第 10–11 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"隔盐灸","c":"【第一章·隔盐灸】讲义：「**隔盐灸专门用在『神阙穴』（肚脐）。****做法：用干净的细盐填满肚脐（盐要填平），上面放艾炷灸。****为什么用盐？盐味咸，能入肾；肚脐（神阙）是先天之本的门户，用盐灸能温肾回阳。****隔盐灸主治：① 霍乱（上吐下泻）；② 中风脱证（突然昏倒、四肢冰冷、汗出不止）；③ 虚脱（阳气欲绝）；④ 腹痛、腹泻。****这是『回阳救逆』的灸法——在急救上有重要地位。****注意：盐要用细盐（粗盐颗粒大、有空隙，火会透过去烫伤）；盐湿了要换（否则灸不热）。**」\n\n**【最重要】隔盐灸 = 神阙（肚脐）+ 细盐 → 温肾回阳救急**\n\n```\n主治：霍乱吐泻 / 中风脱证 / 虚脱 / 腹痛腹泻\n盐味咸入肾 → 温肾回阳\n注意：用细盐（粗盐导热会烫伤）\n```\n\n**须「绝「对「强「标」**：**「①中风脱证/休克须立即120急救；②灸法不可代替急救；③糖尿病足/皮损禁灸」** ✓✓✓","o":"RJ-0028 · 《人纪·针灸》第一章「隔盐灸」（PDF 第 11 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"隔蒜灸","c":"【第一章·隔蒜灸】讲义：「**隔蒜灸用大蒜。****做法：把大蒜切片（或捣成蒜泥），放在穴位上，艾炷放上面灸。****为什么用蒜？蒜性辛温、能解毒杀虫。****隔蒜灸主治：① 肿疡（疮疡初起、红肿未溃）——蒜能解毒消肿；② 蛇虫咬伤；③ 肺痨（肺结核）、瘰疬（淋巴结核）——蒜能杀虫。****注意：蒜刺激性强，灸的时间不能太长（皮肤容易起泡），一般 3–5 壮；而且蒜灸后会起一个小疤，这是正常的（古法认为这样效果更好）。****现在临床上隔蒜灸用得少了（因为有更好的抗结核药、抗生素），但在古代这是治瘰疬、肺痨的重要方法。**」\n\n**【极重要】隔蒜灸：蒜片/蒜泥 → 解毒杀虫（肿疡/蛇伤/瘰疬/肺痨）**\n\n```\n蒜性辛温 → 解毒杀虫\n主治：疮疡初起 / 蛇虫咬伤 / 瘰疬 / 肺痨\n量：3–5 壮（蒜刺激强，易起泡）\n```\n\n**须「强「标」**：**「①疮疡须排脓/清创/抗生素；②结核须规范抗结核治疗；③蛇伤须抗毒素+急诊」** ✓✓","o":"RJ-0029 · 《人纪·针灸》第一章「隔蒜灸」（PDF 第 11–13 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"米粒灸","c":"【第一章·米粒灸】讲义：「**米粒灸是把艾绒搓成米粒大小的小艾炷，直接放在皮肤上灸。****这是最小的灸法——艾炷只有米粒大，烧完只留下一个很小的疤。****主治：① 小的疣（赘疣）、鸡眼；② 局部的痛点（阿是穴）；③ 带状疱疹（蛇缠腰）——在疱疹的头尾各灸一壮，能截断它蔓延。****米粒灸的特点是『直接灸』——不留隔物，艾火直接接触皮肤，所以刺激最集中。****灸完会起一个小水泡，结痂脱落留一个小白点（古法认为这是『灸疮』，是好的）。****现代为了美观，很多人不愿意留疤，所以改用隔姜灸替代。**」\n\n**【极重要】米粒灸（直接灸）：米粒大艾炷 → 疣/鸡眼/阿是穴/带状疱疹截断**\n\n```\n直接灸（无隔物），刺激最集中，留小疤\n主治：赘疣 / 鸡眼 / 局部痛点 / 带状疱疹（头尾各一壮截断）\n```\n\n**须「强「标」**：**「①带状疱疹须抗病毒（72h内为黄金窗）；②糖尿病/免疫低下禁直接灸；③须无菌操作」** ✓✓","o":"RJ-0030 · 《人纪·针灸》第一章「米粒灸」（PDF 第 13 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"针灸急救法","c":"【第一章·针灸的急救法】讲义：「**针灸的急救，第一个动作是『放血』——十个手指头（十宣穴）放血。****为什么放血？因为突然昏倒（中风、中暑、癫痫）多是『气血上冲』（血都往头上跑），在指尖放血能把上冲的气血引下来（『引血下行』）。****第二个动作：如果放血还不醒，就针『人中』（水沟穴），强刺激。****第三个动作：如果还不醒，灸『百会』（头顶），或者灸『涌泉』（脚底）——一个在上面提，一个在下面引。****讲义强调：『急救的顺序是：十宣放血 → 人中 → 百会/涌泉。』****但最重要的一句：『针灸急救是辅助，真正救命要靠西医的急救（CPR、气管插管、溶栓）。』**」\n\n**【最重要】针灸急救三步：十宣放血 → 人中 → 百会/涌泉**\n\n```\n原理：气血上冲 → 指尖放血引血下行\n顺序：十宣 → 人中（水沟）→ 百会（灸）/ 涌泉\n```\n\n**须「绝「对「强「标」**：**「①昏倒须立即120/CPR；②针灸不可代替急救；③中风须4.5h溶栓窗；④放血须无菌/抗凝药慎」** ✓✓✓\n\n**「引血下行」——「这是最精的急救原理（上冲则下引）。」** ✓✓","o":"RJ-0031 · 《人纪·针灸》第一章「针灸的急救法」（PDF 第 13–14 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"火罐的使用","c":"【第一章·火罐】讲义：「**火罐的作用是『吸出』——把局部的瘀血、湿气、寒邪吸出来。****使用方法：用火在罐内烧一下（消耗氧气），迅速扣在皮肤上，罐就吸住了。****火罐的适应证：① 局部的瘀血、跌打损伤；② 风寒湿痹（关节痛、背痛）；③ 疮疡初起（吸毒）；④ 拔毒（蛇伤、蜂螫）。****禁忌：① 皮肤破损、溃疡处不能拔；② 大血管处（颈动脉）不能拔；③ 孕妇腹部、腰骶部不能拔；④ 高热、抽搐、痉挛时不能拔；⑤ 有出血倾向（血小板低、抗凝药）不能拔。****讲义特别提醒：『拔罐后留下的颜色（紫黑/红/白）可以判断病情——紫黑是瘀血，红是热，白是虚寒。』**」\n\n**【极重要】火罐：吸出瘀血/湿气/寒邪；五禁（破皮/大血管/孕妇/高热/出血倾向）**\n\n```\n适应证：瘀血 / 风寒湿痹 / 疮疡初起 / 蛇伤拔毒\n罐印判读：紫黑=瘀 / 红=热 / 白=虚寒\n五禁：皮肤破损、大血管、孕妇腹腰、高热抽搐、出血倾向\n```\n\n**须「强「标」**：**「①抗凝药/血小板低禁拔；②罐印不能作诊断依据；③须无菌；④拔罐不可代替治疗」** ✓✓","o":"RJ-0032 · 《人纪·针灸》第一章「火罐的使用时机/使用」（PDF 第 14 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"穴位丈量法","c":"【第二章·穴位丈量】讲义：「**穴位怎么量？用『同身寸』——以病人自己的手指为标准。****① 一寸：中指弯曲，中节两侧横纹头之间的距离（也叫『中指同身寸』）；② 三寸：四指并拢（食指到小指），以中指近端指关节横纹为准的宽度；③ 也有用『骨度分寸』的——把身体某些部位的长度折成分寸（比如肘横纹到腕横纹是 12 寸）。****为什么用病人自己的手？因为每个人的高矮胖瘦不同，用他自己的手量，比例才对。****讲义强调：『这是最朴素的『比例尺』——以人量人。』****『骨度分寸』是更精确的方法，比如：两乳头之间是 8 寸、胸剑联合到肚脐是 8 寸、肚脐到耻骨联合是 5 寸。**」\n\n**【极重要】穴位丈量：同身寸（中指一寸 / 四指三寸）+ 骨度分寸**\n\n```\n同身寸：中指中节 1 寸；四指并拢 3 寸\n骨度分寸：两乳间 8 寸 / 胸剑联合-脐 8 寸 / 脐-耻骨 5 寸\n「以人量人」（个体比例尺）\n```\n\n**「同身寸」——「这是最精的个体化度量（以人量人）。」** ✓✓","o":"RJ-0033 · 《人纪·针灸》第二章「针灸穴位丈量方法」（PDF 第 14–15 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"针刺的深浅","c":"【第二章·针刺的深浅】讲义：「**针要扎多深？这要看三个因素：****① 部位——头面部浅（皮薄），四肢较深，臀部/大腿最深；② 体型——胖人深，瘦人浅；③ 病情——病在表（浅刺）、病在里（深刺）；④ 季节——春夏宜浅、秋冬宜深（《内经》『春夏刺浅，秋冬刺深』）。****最重要的原则是：『不可伤及脏腑、大血管、神经』。****讲义特别强调几个危险部位：****① 胸背部（肺）——直刺太深会刺破肺，造成气胸；② 颈部（大血管、气管）；③ 腹部（肝、脾、肾、膀胱）；④ 后脑（延脑）。****『针不是越深越好——得气就够了。』**」\n\n**【极重要】针刺深浅四因素 + 四大危险区（胸背/颈/腹/后脑）**\n\n```\n四因素：部位（头浅肢深）/ 体型（胖深浅瘦）/ 病情（表浅里深）/ 季节（春夏浅秋冬深）\n危险区：胸背（气胸）/ 颈（血管气管）/ 腹（肝脾肾膀胱）/ 后脑（延脑）\n「得气就够了，不是越深越好」\n```\n\n**须「绝「对「强「标」**：**「①胸背部直刺过深可致气胸（危重）；②须严格掌握角度/深度；③须执业资质」** ✓✓✓","o":"RJ-0034 · 《人纪·针灸》第二章「针刺的深浅讨论」（PDF 第 15–16 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"九针型式","c":"【第二章·黄帝九针】讲义：「**《黄帝内经》记载九种针，各有用途：****① 镵针（箭头形）——刺皮肤；② 员针（卵圆形）——按摩分肉；③ 鍉针（黍粟形）——按脉；④ 锋针（三棱形）——放血（就是今天的三棱针）；⑤ 铍针（剑形）——切开排脓；⑥ 员利针（马尾形）——治急症；⑦ 毫针（细长）——治痹痛（今天最常用的就是毫针）；⑧ 长针（七寸长）——治深部；⑨ 大针（粗大）——治水肿。****今天临床主要用『毫针』（细针）和『三棱针』（放血）。****讲义讲这个是为了让学者知道：『针具的选择是根据病情定的，不是一根针打天下。』**」\n\n**【极重要】九针型式与用途（今日主用毫针 + 三棱针）**\n\n```\n镵针（皮肤）｜员针（按摩）｜鍉针（按脉）｜锋针（放血=三棱针）\n铍针（切排脓）｜员利针（急症）｜毫针（痹痛，最常用）｜长针（深部）｜大针（水肿）\n```","o":"RJ-0035 · 《人纪·针灸》第二章「黄帝时代九针型式」（PDF 第 18 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"十二经纳天干歌","c":"【第三章·十二经纳天干歌】讲义原歌诀：「**甲胆乙肝丙小肠，丁心戊胃己脾乡，庚属大肠辛属肺，壬属膀胱癸肾脏，三焦亦向壬中寄，包络同归入癸方。****」讲义解：「**这是把十二经配到十个天干上——**甲（胆）、乙（肝）、丙（小肠）、丁（心）、戊（胃）、己（脾）、庚（大肠）、辛（肺）、壬（膀胱/三焦）、癸（肾/心包）。****为什么要配天干？因为天干有五行属性：甲乙木、丙丁火、戊己土、庚辛金、壬癸水。****这样一配，就知道每条经的五行属性——比如胆属木、小肠属火、胃属土、大肠属金、膀胱属水。****这个表在『子午流注』和『按五行选穴』的时候必须用。」**\n\n**【最重要】十二经纳天干歌**\n\n```\n甲胆｜乙肝｜丙小肠｜丁心｜戊胃｜己脾\n庚大肠｜辛肺｜壬膀胱+三焦｜癸肾+心包\n五行：甲乙木 / 丙丁火 / 戊己土 / 庚辛金 / 壬癸水\n```","o":"RJ-0036 · 《人纪·针灸》第三章「十二经纳天干歌」（PDF 第 18–20 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"十二经纳地支歌","c":"【第三章·十二经纳地支歌】讲义原歌诀：「**肺寅大卯胃辰宫，脾巳心午小未中，申膀酉肾心包戌，亥焦子胆丑肝通。****」讲义解：「**这是十二经的『流注时辰』——每条经在一天中有一个『当令』的时辰：****肺（寅时 3–5 点）、大肠（卯时 5–7 点）、胃（辰时 7–9 点）、脾（巳时 9–11 点）、心（午时 11–13 点）、小肠（未时 13–15 点）、膀胱（申时 15–17 点）、肾（酉时 17–19 点）、心包（戌时 19–21 点）、三焦（亥时 21–23 点）、胆（子时 23–1 点）、肝（丑时 1–3 点）。****这个表极其有用：**① 病人说『每天 3 点醒』——那是肺经的时间；② 『1–3 点醒』——肝经；③ 『5–7 点拉肚子』——大肠经（『五更泻』）。****这就是『十二经流注时辰』的临床诊断价值。**」\n\n**【最重要】十二经纳地支（流注时辰）**\n\n```\n肺寅(3-5) 大卯(5-7) 胃辰(7-9) 脾巳(9-11) 心午(11-13) 小未(13-15)\n膀申(15-17) 肾酉(17-19) 包戌(19-21) 焦亥(21-23) 胆子(23-1) 肝丑(1-3)\n诊断：3 点醒=肺 / 1-3 点醒=肝 / 5-7 点泻=大肠\n```\n\n**「定时发作 = 定位经络」——「这是最精的时间诊断（与 n1771–3 点起床＝肝经病」互证）。** ✓✓✓","o":"RJ-0037 · 《人纪·针灸》第三章「十二经纳地支歌」（PDF 第 20–23 页）。"},{"t":"针灸·第一章至第三章：针灸使用时机、穴位丈量与井荥俞原经合","h":"井荥俞原经合六种取穴法","c":"【第三章·井荣俞原经合穴】讲义：「**每条正经都有五个『要穴』，按五行排列：井（木）、荥（火）、俞（土）、经（金）、合（水）。****配上一个『原穴』，就是『井荥俞原经合』六穴。****为什么这样配？因为气血在经络里流动，从井穴（指尖）出发，到荥穴、俞穴、经穴、合穴（肘膝），像水流一样由小到大、由浅到深。****六种取穴法（这是本章最核心的内容）：****① 病在脏 → 取井穴（脏病取井）；② 病变于色 → 取荥穴（脸色变了取荥）；③ 病在时间（定时发作）→ 取俞穴；④ 病变于音（声音变了）→ 取经穴；⑤ 病起于饮食 → 取合穴；⑥ 五脏不平衡 → 取原穴。****这六条是针灸选穴的总纲。**」\n\n**【最重要】井荥俞原经合 + 六种取穴法**\n\n```\n井（木）→ 病在脏\n荥（火）→ 病变于色\n俞（土）→ 病在时间（定时发作）\n经（金）→ 病变于音\n合（水）→ 病起于饮食\n原    → 五脏不平衡\n```\n\n**「六种取穴法」——「这是全书最核心的选穴总纲。」** ✓✓✓","o":"RJ-0038 · 《人纪·针灸》第三章「十二正经之井荣俞原经合穴」至「五脏不平衡时用原穴」（PDF 第 23–28 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"任脉为阴脉之海","c":"【第四章·任脉】讲义：「**任脉是『诸海之阴』——所有阴经的『海』。****为什么？因为十二阴经最后都汇到任脉（任脉在腹部正中线，总任一身之阴）。****『任』就是『担任、妊娠』——所以任脉主生殖、主胞胎。****任脉的循行：从会阴（前阴与后阴之间）起，沿腹部正中线上行，到下巴（承浆穴）。****任脉上的重要穴位：中极（膀胱募）、关元（小肠募）、石门（三焦募）、神阙（脐）、中脘（胃募）、膻中、承浆。****讲义强调：『任脉是阴经的总管——女人调经、男人补精，都要看任脉。』**」\n\n**【最重要】任脉 = 阴脉之海（诸阴之汇，主生殖/胞胎）**\n\n```\n循行：会阴 → 腹部正中线 → 承浆（下巴）\n要穴：中极（膀胱募）/ 关元（小肠募）/ 神阙 / 中脘（胃募）/ 膻中\n「阴经的总管」（主生殖）\n```","o":"RJ-0039 · 《人纪·针灸》第四章「任脉与督脉/任脉经穴」（PDF 第 29–32 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"督脉为阳脉之海","c":"【第四章·督脉】讲义：「**督脉是『阳脉之海』——总统一身之阳。****『督』就是『总督』。****督脉的循行：从长强（尾骨尖）起，沿脊柱正中线上行，经腰、背、颈、后脑，上头顶（百会），下前额，到上唇系带（龈交）。****督脉的要穴和主治：****① 长强——主治痔疮；② 命门——补肾要穴；③ 至阳、灵台——治心脏病；④ 身柱——治小儿咳嗽、增强体质；⑤ 大椎——退热要穴；⑥ 风府、哑门——治中风失语；⑦ 百会——诸阳之会（治头晕、脱肛、健忘）；⑧ 人中（水沟）——急救；⑨ 龈交——痔疮。****讲义强调：『督脉走的是脊柱——所以颈椎、腰椎的病，都要在督脉上找穴。』**」\n\n**【最重要】督脉 = 阳脉之海（总督一身之阳，走脊柱）**\n\n```\n循行：长强（尾骨）→ 脊柱 → 后脑 → 百会 → 前额 → 龈交\n要穴：长强（痔）/ 命门（补肾）/ 至阳灵台（心）/ 大椎（退热）/ 百会（诸阳之会）/ 人中（急救）\n```\n\n**「督脉走脊柱 → 颈腰椎病取督脉」——「这是最精的定位法。」** ✓✓","o":"RJ-0040 · 《人纪·针灸》第四章「督脉经穴篇」（PDF 第 30–32 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"长强穴治痔疮","c":"【第四章·长强穴】讲义：「**长强穴在尾骨尖端下方（尾骨尖与肛门之间的凹陷处）。****它是督脉的『络穴』，也是督脉的起点。****主治：① 痔疮（尤其是内痔出血、脱肛）；② 腹泻、下痢；③ 腰脊痛（尾骨痛）。****为什么能治痔疮？因为长强在肛门附近，『近治作用』——穴位在病灶旁边，能直接疏通局部的气血。****《针灸大成》里还有一个很妙的用法：『长强配承山』治痔疮——长强（局部）+ 承山（膀胱经，小腿肚，主治痔疮『远治』）。****这就是『远近配穴』。**」\n\n**【极重要】长强穴 = 督脉络穴（主治痔疮/脱肛/下利）**\n\n```\n定位：尾骨尖与肛门之间\n主治：痔疮（内痔出血）/ 脱肛 / 腹泻 / 尾骨痛\n配穴：长强 + 承山（远近配穴）\n```\n\n**须「强「标」**：**「①便血须排肠癌（尤其40岁以上）；②须肛肠科检查；③针灸不可代替诊断」** ✓✓","o":"RJ-0041 · 《人纪·针灸》第四章「长强穴（主治痔疮）」（PDF 第 32–36 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"关元穴与中极穴","c":"【第四章·关元/中极】讲义：「**中极穴——膀胱的募穴。****定位：肚脐下 4 寸。主治：① 膀胱病（尿频、尿急、尿不出）；② 泌尿生殖系统疾病；③ 妇科病（月经不调）。****关元穴——小肠的募穴。****定位：肚脐下 3 寸。主治：① 小肠病；② 男科（阳痿、遗精）、妇科（不孕、月经不调）；③ 虚证保健（『灸关元』是补元气第一法）。****讲义特别强调：『关元是『元气』的关口——每天灸关元，能强身延年。』这是『保健灸』的核心穴位。****注意：孕妇的腹部穴位（中极、关元）绝对禁针禁灸。**」\n\n**【极重要】中极（膀胱募，脐下 4 寸）与关元（小肠募，脐下 3 寸）**\n\n```\n中极（脐下 4 寸）：膀胱病 / 泌尿生殖 / 妇科\n关元（脐下 3 寸）：小肠病 / 男女科 / 补元气（保健灸第一穴）\n孕妇腹穴绝对禁针禁灸\n```\n\n**须「强「标」**：**「①孕妇腹部禁针禁灸；②尿不出须立即导尿（急症）；③须排前列腺/结石」** ✓✓✓","o":"RJ-0042 · 《人纪·针灸》第四章「膀胱之募穴—中极穴 / 小肠之募穴—关元穴」（PDF 第 36–43 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"神阙与中脘","c":"【第四章·神阙/中脘】讲义：「**神阙穴——就是肚脐。****神阙禁针（只灸不针）！****为什么禁针？因为肚脐是脐带脱落的地方，组织薄弱、直接通腹腔，针刺极危险（易感染、伤肠）。****神阙主治：① 一切虚脱、脱证（隔盐灸）；② 腹痛、腹泻（寒证）；③ 水肿。****中脘穴——胃的募穴。****定位：肚脐上 4 寸（胸剑联合到肚脐的中点）。主治：① 一切胃病（胃痛、胃胀、反酸、消化不良）；② 呕吐；③ 癫狂（『中脘配丰隆』治痰）。****讲义强调：『中脘是胃病的主穴——不管你什么胃病，先扎中脘。』**」\n\n**【极重要】神阙禁针只灸（隔盐灸）+ 中脘（胃募，一切胃病主穴）**\n\n```\n神阙（脐）：禁针只灸（组织薄弱通腹腔）→ 隔盐灸治虚脱/腹痛/水肿\n中脘（胃募，脐上 4 寸）：一切胃病主穴 / 呕吐 / 痰证（配丰隆）\n```\n\n**须「绝「对「强「标」**：**「①神阙绝不可针（感染/穿孔风险）；②腹痛须查因；③胃病须胃镜」** ✓✓✓","o":"RJ-0043 · 《人纪·针灸》第四章「神阙穴 / 胃之募穴—中脘」（PDF 第 43–52 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"百会与大椎","c":"【第四章·百会/大椎】讲义：「**百会穴——在头顶正中（两耳尖连线与头正中线的交点）。****『百会』意思是『百脉都会于此』——它是『诸阳之会』（所有阳经都在这里交会）。****主治：① 头晕、头痛（巅顶痛）；② 脱肛、子宫下垂（中气下陷）——灸百会能『升提』；③ 健忘、失眠；④ 中风昏倒（灸百会急救）。****大椎穴——在第七颈椎棘突下（低头时颈后最突出的骨头下方）。****主治：① 退热（一切发热，尤其外感高热——大椎放血或针）；② 咳嗽、感冒；③ 颈椎病；④ 疟疾。****讲义强调：『大椎是退热第一穴——高热不退，大椎放血立效。』**」\n\n**【极重要】百会（诸阳之会，升提）+ 大椎（退热第一穴）**\n\n```\n百会：头顶正中 → 头晕 / 脱肛子宫下垂（灸之升提）/ 健忘 / 中风急救\n大椎：第 7 颈椎棘突下 → 退热（放血）/ 感冒咳嗽 / 颈椎病\n```\n\n**须「强「标」**：**「①高热须查因（感染/血象）；②脱肛/子宫下垂须专科；③放血须无菌/抗凝慎」** ✓✓","o":"RJ-0044 · 《人纪·针灸》第四章「后顶与百会穴 / 大椎与陶道穴」（PDF 第 60–70 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"手太阴肺经","c":"【第四章·手太阴肺经】讲义：「**肺经是十二经的『第一经』（寅时当令，3–5 点）。****『肺法象天幕』——肺像天一样覆盖在五脏之上，主气、司呼吸、通调水道。****手太阴肺经 11 穴：中府、云门、天府、侠白、尺泽、孔最、列缺、经渠、太渊、鱼际、少商。****循行：从胸（中府）→ 上肢内侧前缘 → 拇指（少商）。****主治：① 呼吸系统病（咳嗽、气喘、咽痛）；② 胸痛；③ 上肢内侧痛。****几个关键穴：****① 中府——肺的募穴（肺病主穴）；② 尺泽——肺经合穴（『合主逆气而泻』，治咳嗽气喘）；③ 列缺——肺经络穴（『头项寻列缺』——治颈项痛、头痛）；④ 太渊——肺经原穴/俞穴（补气要穴）；⑤ 少商——肺经井穴（放血治咽喉肿痛）。**」\n\n**【最重要】手太阴肺经 11 穴与五大关键穴**\n\n```\n11 穴：中府/云门/天府/侠白/尺泽/孔最/列缺/经渠/太渊/鱼际/少商\n中府（肺募）｜尺泽（合，治喘）｜列缺（络，「头项寻列缺」）｜太渊（原，补气）｜少商（井，放血治咽痛）\n```\n\n**「头项寻列缺」——「这是最精的『四总穴歌』之一。」** ✓✓✓","o":"RJ-0045 · 《人纪·针灸》第四章「手太阴肺经 / 中府穴至经渠」（PDF 第 90–120 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"太渊穴补气","c":"【第四章·太渊穴】讲义：「**太渊穴在腕横纹桡侧（大拇指一侧）的凹陷处，是『脉会太渊』——所有脉都在这里会合。****太渊是肺经的『原穴』和『俞穴』（土），也是『脉会』。****三个身份，三个用途：****① 原穴——五脏不平衡时用（补肺气）；② 俞穴——『病在时间者取俞穴』（定时发作的病）；③ 脉会——治一切脉的病（脉弱、脉不通）。****讲义强调：『太渊是补气的第一穴——气虚、脉弱、讲话没力气，扎太渊。』****注意：太渊位置正好在桡动脉上，扎针时要避开动脉（摸到脉跳就偏一点）。**」\n\n**【极重要】太渊 = 肺经原穴 + 俞穴 + 脉会（补气第一穴）**\n\n```\n定位：腕横纹桡侧凹陷（桡动脉处）\n三重身份：原穴（补肺气）/ 俞穴（病在时间）/ 脉会（治脉病）\n「补气第一穴」；扎针须避开桡动脉\n```","o":"RJ-0046 · 《人纪·针灸》第四章「太渊穴—手太阴肺经母穴」（PDF 第 120–130 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"手阳明大肠经","c":"【第四章·手阳明大肠经】讲义：「**大肠经（卯时当令，5–7 点）。****手阳明大肠经 20 穴：商阳、二间、三间、合谷、阳溪、偏历、温溜、下廉、上廉、手三里、曲池、肘髎、手五里、臂臑、肩髃、巨骨、天鼎、扶突、禾髎、迎香。****循行：从食指（商阳）→ 上肢外侧前缘 → 肩 → 颈 → 鼻旁（迎香）。****几个关键穴：****① 商阳——井穴（放血治咽喉痛、退烧）；② 合谷——大肠经原穴（『面口合谷收』——头面口齿的病都治）；③ 阳溪——经穴；④ 偏历——络穴；⑤ 手三里——治上肢酸痛、腹痛；⑥ 曲池——合穴（『合主逆气而泻』，清热、降血压、治皮肤病）；⑦ 肩髃——肩关节病（『中风八大穴』之一）；⑧ 迎香——鼻病（鼻炎、鼻塞）。**」\n\n**【最重要】手阳明大肠经 20 穴与八大关键穴**\n\n```\n商阳（井，放血退热）｜合谷（原，「面口合谷收」）｜手三里（上肢痛）\n曲池（合，清热降压）｜肩髃（肩病，中风八大穴）｜迎香（鼻病）\n「面口合谷收」（四总穴歌）\n```","o":"RJ-0047 · 《人纪·针灸》第四章「手阳明大肠经 / 商阳穴至迎香穴」（PDF 第 130–170 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"合谷穴与四关穴","c":"【第四章·合谷穴】讲义：「**合谷穴在手背，第一、二掌骨之间（大拇指与食指之间）。****『面口合谷收』——脸部、口腔、牙齿的病，都取合谷。****主治：① 头面五官病（头痛、牙痛、面瘫、鼻炎）；② 发热（合谷是退热要穴）；③ 上肢痛；④ 腹痛、便秘。****孕妇禁针合谷（合谷能引起子宫收缩，可能流产）！****四关穴 = 合谷 + 太冲（左右共四针）。****『四关』的意思是『四个关口』——合谷（上，手）配太冲（下，足），一上一下、一阳一阴，能把全身的气血『开关』打开。****主治：① 一切气机不畅（胸闷、胁痛、情绪抑郁）；② 头痛、眩晕；③ 疼痛（『四关治痛』）。**」\n\n**【最重要】合谷（面口合谷收）+ 四关穴（合谷 + 太冲）**\n\n```\n合谷：手背 1、2 掌骨间 → 头面五官 / 退热 / 上肢痛 / 便秘\n孕妇禁针（可致子宫收缩）\n四关穴 = 合谷 + 太冲（四针）= 开气血之关（气滞/痛/眩晕）\n```\n\n**须「绝「对「强「标」**：**「①孕妇禁针合谷/三阴交；②合谷刺激可诱发宫缩；③须专业医师」** ✓✓✓\n\n**「四关」——「这是最精的上下配穴（一上一下开气血）。」** ✓✓✓","o":"RJ-0048 · 《人纪·针灸》第四章「合谷穴 / 四关穴」（PDF 第 140–155 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"曲池与手三里","c":"【第四章·曲池/手三里】讲义：「**曲池穴——屈肘成直角，肘横纹外端的凹陷处。****它是大肠经的『合穴』（土）。『合主逆气而泻』——合穴能治『气逆』和『泻』（清泄）。****主治：① 清热（高热、咽喉肿痛）；② 降血压（曲池是降压要穴）；③ 皮肤病（荨麻疹、湿疹——『治风先治血』，曲池能清血热）；④ 上肢不遂（中风后遗症）。****手三里穴——在曲池下 2 寸。****主治：① 上肢酸痛、麻木；② 腹痛、腹泻（『肚腹三里留』的『三里』有手三里和足三里）；③ 牙痛。****讲义强调：『曲池是清热第一穴，手三里是上肢病的要穴。』**」\n\n**【极重要】曲池（清熱降压/皮肤病）与手三里（上肢病/腹痛）**\n\n```\n曲池（合穴，屈肘横纹外端）：清热 / 降压 / 皮肤病（血热）/ 上肢不遂\n手三里（曲池下 2 寸）：上肢酸痛麻木 / 腹痛腹泻 / 牙痛\n```\n\n**「合主逆气而泻」——「这是最精的五输穴主治规律。」** ✓✓","o":"RJ-0049 · 《人纪·针灸》第四章「曲池与手三里穴」（PDF 第 160–168 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"商阳放血与中风八大穴","c":"【第四章·商阳穴/中风八大穴】讲义：「**商阳穴——食指桡侧指甲角旁 0.1 寸，是大肠经的『井穴』。****用法：三棱针点刺放血。****主治：① 咽喉肿痛（『商阳放血，咽喉立松』）；② 高热不退；③ 昏迷（急救）。****『中风八大穴』——讲义总结了治中风的八个主穴：****① 百会（升提、醒神）；② 肩髃（肩关节）；③ 曲池（上肢）；④ 合谷（手）；⑤ 环跳（髋）；⑥ 风市（下肢，中风瘫痪大穴）；⑦ 阳陵泉（筋会）；⑧ 足三里（补气）。****这八个穴覆盖了上肢、下肢、躯干——中风偏瘫的针灸就是这八个穴的加减。**」\n\n**【极重要】商阳放血（咽喉/高热）+ 中风八大穴**\n\n```\n商阳（井穴，点刺放血）→ 咽喉肿痛 / 高热 / 昏迷\n中风八大穴：百会/肩髃/曲池/合谷/环跳/风市/阳陵泉/足三里\n```\n\n**须「绝「对「强「标」**：**「①中风须立即急诊（4.5h溶栓）；②针灸为康复辅助；③放血须无菌/抗凝慎；④不可延误」** ✓✓✓","o":"RJ-0050 · 《人纪·针灸》第四章「商阳穴 / 中风八大穴」（PDF 第 130–140、165–170 页）。"},{"t":"针灸·第四章：任督二脉与十二正经（上）","h":"虚实症之诊治","c":"【第四章·虚实症之诊治】讲义：「**针灸怎么辨虚实？三个办法：****① 问——『你想按还是不想按？』喜按（按着舒服）是虚，拒按（按着更痛）是实；② 摸——皮肤的温度、肌肉的软硬（硬是实、软是虚）；③ 看——舌苔、面色。****治疗原则：『虚则补之，实则泻之』。****补的手法：**① 顺经而刺（顺着经络方向）；② 捻转慢、幅度小；③ 出针后按闭针孔（『开阖补泻』——补法要闭孔，不让气泄）；④ 呼气时进针（『呼吸补泻』）。****泻的手法：**① 逆经而刺；② 捻转快、幅度大；③ 出针后不按针孔（让气泄出去）；④ 吸气时进针。****讲义强调：『虚实辨不清，补泻就用反——用反了会加重病情。』**」\n\n**【极重要】虚实辨证与补泻手法对照**\n\n| | 虚（补） | 实（泻） |\n|---|---|---|\n| 按诊 | 喜按 | 拒按 |\n| 方向 | 顺经 | 逆经 |\n| 捻转 | 慢、小幅度 | 快、大幅度 |\n| 出针 | **按闭针孔** | **不按（开孔）** |\n| 呼吸 | 呼气进针 | 吸气进针 |\n\n**「出针按不按」——「这是最精的开阖补泻。」** ✓✓✓","o":"RJ-0051 · 《人纪·针灸》第四章「虚实症之诊治」（PDF 第 145–152 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"足阳明胃经","c":"【第四章·足阳明胃经】讲义：「**胃经（辰时当令，7–9 点）——十二经中穴位最多的一条（45 穴）。****『胃者，仓廪之官，五味出焉』——胃是『仓库』，接受食物、腐熟水谷。****循行：从头（头维、下关、颊车）→ 颈（人迎）→ 胸（缺盆、乳中）→ 腹（天枢）→ 腿前侧（梁丘、犊鼻、足三里）→ 脚（冲阳、厉兑）。****为什么胃经这么重要？因为『有胃气则生，无胃气则死』（《内经》）。****胃经的穴位主治：① 头面（头维治头痛、下关治牙痛）；② 肠胃（天枢、足三里、上巨虚）；③ 乳房（乳根——乳癌治疗）；④ 下肢（髀关、梁丘、足三里、丰隆）。****讲义强调：『胃经是『多气多血』之经——所以它的穴位特别能补、特别能通。』**」\n\n**【最重要】足阳明胃经 = 45 穴（十二经最多）+「有胃气则生」**\n\n```\n循行：头 → 颈 → 胸 → 腹 → 腿前 → 足\n主治：头面 / 肠胃 / 乳房 / 下肢\n「多气多血之经」（最善补、最善通）\n```","o":"RJ-0052 · 《人纪·针灸》第四章「足阳明胃经」（PDF 第 100–190 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"足三里穴","c":"【第四章·足三里】讲义：「**足三里在膝盖下方（犊鼻下 3 寸，胫骨前缘外一横指）。****它是胃经的『合穴』（土），也是全身最重要的强壮穴。****『肚腹三里留』——一切腹部、肠胃的病，都取足三里。****主治：① 一切胃病（胃痛、胃胀、消化不良）；② 腹泻、便秘；③ 补气强壮（『灸足三里』是保健第一法——『若要安，三里常不干』）；④ 下肢痿痹；⑤ 高血压（配曲池）。****补泻：**『足三里之补泻手法』——虚则用补（捻转慢、按闭针孔），实则用泻。****讲义强调：『足三里是长寿穴——古人有『三十岁以上，每月灸足三里十日』的说法。』**」\n\n**【最重要】足三里 = 胃经合穴（「肚腹三里留」+ 强壮长寿穴）**\n\n```\n定位：犊鼻下 3 寸，胫骨前缘外一横指\n主治：一切胃病 / 腹泻便秘 / 补气强壮 / 下肢痿痹 / 降压\n「若要安，三里常不干」（保健灸第一法）\n```\n\n**须「强「标」**：**「①胃痛须排溃疡/癌；②针灸为辅助；③须规范诊疗」** ✓✓","o":"RJ-0053 · 《人纪·针灸》第四章「足三里穴：胃经合穴 / 足三里之补泻手法」（PDF 第 175–185 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"天枢穴与腹四针","c":"【第四章·天枢/腹四针】讲义：「**天枢穴——肚脐旁开 2 寸，是『大肠的募穴』。****『天枢』是北斗七星的第一颗（天的枢纽）——这个名字说明它是『上下气机的枢纽』。****主治：① 一切大肠病（便秘、腹泻、腹痛、痢疾）；② 妇科（月经不调、痛经）；③ 肥胖（天枢能调节肠胃蠕动）。****『腹四针』——讲义自创的配穴：中脘 + 天枢（双）+ 关元，共四针。****主治：一切腹部病（胃痛、腹胀、便秘、腹泻）。****为什么这四个？中脘（胃募）+ 天枢（大肠募）+ 关元（小肠募）——把上、中、下三段肠胃全包了。****这是『一针管一段，四针管全部』的思路。**」\n\n**【极重要】天枢（大肠募，脐旁 2 寸）+ 腹四针（中脘+天枢双+关元）**\n\n```\n天枢（脐旁 2 寸）：便秘 / 腹泻 / 腹痛 / 痛经 / 肥胖\n腹四针 = 中脘（胃募）+ 天枢×2（大肠募）+ 关元（小肠募）\n「一针管一段，四针管全部」\n```\n\n**须「强「标」**：**「①腹痛须排急腹症；②便秘/腹泻须查因；③孕妇腹部禁针」** ✓✓","o":"RJ-0054 · 《人纪·针灸》第四章「天枢穴 / 腹四针」（PDF 第 190–200 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"丰隆穴与导痰针法","c":"【第四章·丰隆穴】讲义：「**丰隆穴在小腿外侧（外踝尖上 8 寸，胫骨前缘外二横指）。****它是胃经的『络穴』，也是『化痰第一穴』。****『痰'在中医里不只是咳出来的痰——还包括：① 有形之痰（咳嗽的痰）；② 无形之痰（头晕、胸闷、恶心、癫狂、肥胖、结节）。****丰隆主治：① 咳嗽痰多；② 头晕（痰湿上扰）；③ 癫狂（『怪病多痰』）；④ 高血脂、肥胖；⑤ 下肢痛。****『导痰针灸法』——丰隆配中脘、足三里，把全身的痰『导』下去。****讲义强调：『一切『怪病』（查不出原因的），先想痰——取丰隆。』**」\n\n**【极重要】丰隆 = 化痰第一穴（有形之痰 + 无形之痰）**\n\n```\n定位：外踝尖上 8 寸\n主治：咳嗽痰多 / 头晕（痰湿）/ 癫狂 / 高血脂肥胖 / 下肢痛\n导痰法：丰隆 + 中脘 + 足三里\n「怪病多痰」\n```\n\n**「怪病多痰」——「这是最精的痰病学（与 n238痰饮会造成怪病」互证）。** ✓✓✓","o":"RJ-0055 · 《人纪·针灸》第四章「丰隆穴与导痰针灸法」（PDF 第 205–210 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"条口透承山与阑尾穴","c":"【第四章·条口透承山/阑尾穴】讲义：「**『条口透承山』——从条口穴（小腿外侧）进针，一直刺透到承山穴（小腿后侧）。****这是『透穴法』——一针穿透两个穴位、两条经（胃经和膀胱经）。****主治：五十肩（肩关节周围炎）——『条口透承山』治肩痛立效。****为什么？因为胃经和膀胱经的气血都经过肩部，一针透两经，把两条经的气同时调动。****『奇穴：阑尾穴』——在足三里下 2 寸左右（偏外侧），是经外奇穴。****主治：① 盲肠炎（阑尾炎）——按压这里会剧痛（『阑尾点』），这是诊断急性阑尾炎的体征；② 腹痛。****讲义强调：『阑尾穴是『诊断 + 治疗』双用的穴——痛在这里，就可能是阑尾炎。』**」\n\n**【极重要】条口透承山（五十肩）+ 阑尾穴（阑尾炎诊断点）**\n\n```\n条口透承山：一针透胃经+膀胱经 → 五十肩（肩周炎）\n阑尾穴（足三里下 2 寸）：按压剧痛 = 阑尾炎体征\n```\n\n**须「绝「对「强「标」**：**「①阑尾炎须立即急诊/手术；②针灸不可代替；③延误可致穿孔；④肩痛须排心梗（左肩）」** ✓✓✓","o":"RJ-0056 · 《人纪·针灸》第四章「上巨虚、条口与下巨虚 / 奇穴-阑尾穴」（PDF 第 200–210 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"足太阴脾经","c":"【第四章·足太阴脾经】讲义：「**脾经（巳时当令，9–11 点）——21 穴。****『脾者，谏议之官，知周出焉』——脾像『谏议大夫』，负责把身体的『情报』上报、统筹全局。****脾主运化（消化吸收）、主统血（管住血不外流）、主肌肉四肢。****循行：从足大趾（隐白）→ 腿内侧 → 腹（腹哀、大横）→ 胸（食窦、天溪、周荣、大包）。****关键穴：****① 隐白——井穴（治崩漏、月经不止——『灸隐白止血』）；② 公孙——络穴（治胃心胸病）；③ 三阴交——（妇科要穴）；④ 地机——郄穴（治痛经）；⑤ 阴陵泉——合穴（祛湿第一穴）；⑥ 血海——（痛经三穴之一）；⑦ 大包——（全身脉络之主管）。****讲义强调：『脾经的穴位多治『湿』和『血』——因为脾主运化、主统血。』**」\n\n**【最重要】足太阴脾经 = 21 穴（主运化/统血/肌肉）**\n\n```\n隐白（井，灸之止血）｜公孙（络，胃心胸）｜三阴交（妇科）｜阴陵泉（合，祛湿第一）\n血海（痛经三穴）｜大包（全身脉络主管）\n「治湿 + 治血」（脾主运化/统血）\n```","o":"RJ-0057 · 《人纪·针灸》第四章「足太阴脾经：脾脏」（PDF 第 195–250 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"三阴交穴","c":"【第四章·三阴交穴】讲义：「**三阴交在内踝尖上 3 寸，胫骨内侧后缘。****它是『足三阴经（脾、肝、肾）交会之处』——所以叫『三阴交』。****一个穴位，同时调节脾、肝、肾三条经，这是它最重要的特点。****主治：① 妇科一切病（月经不调、痛经、不孕、白带、更年期）；② 男科（阳痿、遗精）；③ 泌尿（尿频、尿不出）；④ 脾胃（消化不良）；⑤ 失眠（配神门）；⑥ 皮肤病（湿疹、荨麻疹——『治风先治血』）。****孕妇禁针三阴交（可引起子宫收缩）！****讲义强调：『三阴交是女人的『万能穴』——调经、助孕、养颜，都取它。』**」\n\n**【最重要】三阴交 = 足三阴交会（妇科万能穴）**\n\n```\n定位：内踝尖上 3 寸\n主治：妇科一切（月经/痛经/不孕/白带/更年期）/ 男科 / 泌尿 / 失眠（配神门）/ 皮肤病\n孕妇禁针（可致宫缩）\n```\n\n**须「绝「对「强「标」**：**「①孕妇禁针三阴交；②不孕/月经异常须查因（激素/甲状腺/子宫）；③须专科」** ✓✓✓","o":"RJ-0058 · 《人纪·针灸》第四章「三阴交穴与妇病治疗」（PDF 第 215–230 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"公孙穴与血海","c":"【第四章·公孙/血海】讲义：「**公孙穴——在足内侧（第一跖骨基底前下方），是脾经的『络穴』，也通『冲脉』（八脉交会穴之一）。****主治：『胃、心、胸的病』——胃痛、心痛、胸闷、呕吐。****为什么？因为公孙通冲脉，冲脉是『十二经之海』，管全身气血。****血海穴——在膝盖内侧上方（髌骨内上缘上 2 寸）。****『血海』顾名思义是『血的海』——它是治血病的主穴。****主治：① 痛经、月经不调（『痛经三穴』= 血海 + 三阴交 + 地机）；② 皮肤病（湿疹、荨麻疹、皮肤瘙痒——『治风先治血，血行风自灭』）；③ 膝痛。****讲义强调：『血海是治皮肤病的要穴——一切『血热、血虚、血瘀』的皮肤病，都取血海。』**」\n\n**【极重要】公孙（胃心胸/通冲脉）+ 血海（血病主穴/痛经三穴）**\n\n```\n公孙（脾经络穴，通冲脉）：胃痛 / 心痛 / 胸闷 / 呕吐\n血海（髌骨内上 2 寸）：痛经 / 皮肤病（治风先治血）/ 膝痛\n痛经三穴 = 血海 + 三阴交 + 地机\n```\n\n**「治风先治血，血行风自灭」——「这是最精的皮肤病治则（与 n246 互证）。」** ✓✓✓","o":"RJ-0059 · 《人纪·针灸》第四章「公孙穴（胃心胸病）/ 痛经三穴：血海穴」（PDF 第 220–240 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"手少阴心经","c":"【第四章·手少阴心经】讲义：「**心经（午时当令，11–13 点）——9 穴。****『心者，君主之官，神明出焉』——心是『皇帝』，管神明（意识、思维）。****『心中一滴血：心藏神』——心的神明要靠血来养，血足则神安，血虚则神不安。****手少阴心经 9 穴：极泉、青灵、少海、灵道、通里、阴郄、神门、少府、少冲。****循行：从腋下（极泉）→ 上肢内侧后缘 → 小指（少冲）。****关键穴：****① 极泉——腋窝（治心痛、胁痛、上肢麻木）；② 少海——合穴（心经母穴，补心血）；③ 通里——络穴（治暴喑、舌强）；④ 阴郄——郄穴（治心痛、盗汗）；⑤ 神门——原穴/俞穴（安神第一穴）；⑥ 少冲——井穴（放血治昏迷）。****『非置入性治疗：清除动脉血管阻塞』——讲义提出用针灸（内关、心包经）改善心肌供血。**」\n\n**【最重要】手少阴心经 9 穴 + 神门（安神第一穴）**\n\n```\n9 穴：极泉/青灵/少海/灵道/通里/阴郄/神门/少府/少冲\n少海（合，补心血）｜通里（络，暴喑）｜阴郄（郄，心痛盗汗）｜神门（原，安神）｜少冲（井，放血）\n```\n\n**须「强「标」**：**「①心痛/胸闷须立即心电图/肌钙蛋白；②须排心梗；③针灸不可代替急救」** ✓✓✓","o":"RJ-0060 · 《人纪·针灸》第四章「手少阴心经 / 君主之官：心脏 / 心中一滴血」（PDF 第 250–275 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"神门穴与少海穴","c":"【第四章·神门/少海】讲义：「**神门穴——在腕横纹尺侧（小指一侧）的凹陷处。****它是心经的『原穴』和『俞穴』（土）。****『神门』顾名思义是『神的门户』——心神的出入口。****主治：① 失眠（安神第一穴）；② 心悸、心痛；③ 健忘、痴呆；④ 癫狂、癫痫；⑤ 心烦。****配穴：神门 + 三阴交（『神三』——治失眠最经典的组合）；神门 + 内关（治心悸）。****少海穴——屈肘时肘横纹内侧端。****它是心经的『合穴』（水），也是『心经的母穴』（心属火，木生火，所以心经的母穴是木穴——少海）。****『虚则补其母』——心气虚（心悸、气短、脉弱），补少海。****讲义强调：『神门安神、少海补心——一泻一补，心经的两大主力。』**」\n\n**【极重要】神门（安神第一穴）+ 少海（心经母穴，补心血）**\n\n```\n神门（腕横纹尺侧）：失眠 / 心悸 / 健忘 / 癫狂\n配：神门+三阴交（「神三」治失眠）/ 神门+内关（心悸）\n少海（合穴，心经母穴）：「虚则补其母」→ 补心气\n```","o":"RJ-0061 · 《人纪·针灸》第四章「母穴：少海穴 / 灵道、通里、阴郄与神门」（PDF 第 265–280 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"手太阳小肠经","c":"【第四章·手太阳小肠经】讲义：「**小肠经（未时当令，13–15 点）——19 穴。****『小肠者，受盛之官，化物出焉』——小肠是『受盛之官』，接受胃传来的食物，进一步『化物』（分清泌浊）。****循行：从小指（少泽）→ 上肢外侧后缘 → 肩胛（天宗）→ 颈 → 耳前（听宫）。****关键穴：****① 少泽——井穴（通乳要穴！产后缺乳，少泽放血或针）；② 后溪——输穴（通督脉，治颈项痛、腰痛——『督脉病取后溪』）；③ 腕骨——原穴（治黄疸、指挛）；④ 养老——（治目视不明、落枕）；⑤ 支正——络穴；⑥ 小海——合穴；⑦ 天宗——肩胛痛（『天宗治肩背痛』）；⑧ 听宫——耳病（耳鸣、耳聋、中耳炎）；⑨ 颧髎——面瘫、牙痛。****讲义强调：『小肠经的穴位多治『肩背、颈项、耳』——因为它走肩胛、上头面。』**」\n\n**【最重要】手太阳小肠经 19 穴 + 少泽（通乳）/后溪（通督脉）**\n\n```\n少泽（井，通乳要穴）｜后溪（输，通督脉→颈腰痛）｜腕骨（原）｜养老（目不明/落枕）\n天宗（肩背痛）｜听宫（耳鸣耳聋中耳炎）｜颧髎（面瘫牙痛）\n```\n\n**「后溪通督脉」——「这是最精的八脉交会（治颈腰）。」** ✓✓","o":"RJ-0062 · 《人纪·针灸》第四章「手太阳小肠经 / 少泽、前谷与后溪穴」（PDF 第 280–310 页）。"},{"t":"针灸·第四章：十二正经（中）胃经、脾经、心经、小肠经","h":"听宫穴与肩背痛","c":"【第四章·听宫/天宗】讲义：「**听宫穴——在耳屏前（张口时呈凹陷处），是『耳病第一穴』。****主治：① 耳鸣、耳聋；② 中耳炎（耳流脓）；③ 牙痛。****为什么叫『听宫』？『宫』是『宫殿』——这是听觉的『宫殿』，管听力的门户。****『奇穴：肠关、肝关、心关』——讲义介绍了三个经外奇穴（在手腕附近），分别对应肠、肝、心的急性问题。****『天宗穴』——在肩胛骨中央凹陷处。**主治：肩胛痛、肩背痛（『天宗治肩背』）。****讲义还讲了『红斑性狼疮』『督俞穴(血癌)』『膈俞穴(贫血、淤血)』等——把穴位和现代病名对应起来。****（这些对应须「标」——疾病诊断须靠现代检查，穴位只是辅助。）**」\n\n**【极重要】听宫（耳病第一穴）+ 天宗（肩背痛）+ 三大奇穴（肠关/肝关/心关）**\n\n```\n听宫（耳屏前）：耳鸣 / 耳聋 / 中耳炎 / 牙痛\n天宗（肩胛中央）：肩背痛\n奇穴：肠关 / 肝关 / 心关（手腕附近）\n```\n\n**须「强「标」**：**「①耳鸣/耳聋须查听力/耳镜/MRI；②肩背痛须排心梗/胆病/肺病；③穴位-病名对应不可作诊断」** ✓✓✓","o":"RJ-0063 · 《人纪·针灸》第四章「听宫穴：耳鸣耳脓中耳炎 / 天宗穴至秉风穴 / 奇穴：肠关、肝关、心关」（PDF 第 300–320 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"足太阳膀胱经","c":"【第四章·足太阳膀胱经】讲义：「**膀胱经（申时当令，15–17 点）——67 穴，是十二经中最长的一条。****『膀胱者，州都之官，津液藏焉，气化则能出矣』——膀胱是『州都之官』（水液汇聚的地方），靠肾的气化把尿排出去。****循行：从目内眦（睛明）→ 头顶 → 后脑 → 背部（两条侧线，五脏六腑的背俞穴全在这）→ 腰 → 腿后侧 → 小趾（至阴）。****膀胱经最重要的价值：『背俞穴』——五脏六腑的『俞穴』全部在膀胱经的背侧线上。****肺俞、心俞、肝俞、脾俞、肾俞……每一个『俞』都是一个脏腑的『窗口』。****所以膀胱经是『调理内脏的主干线』——内科病的针灸，一半在膀胱经上。****讲义强调：『背俞穴是内脏的『后门』——从背后就能治到里面的脏腑。』**」\n\n**【最重要】足太阳膀胱经 67 穴 = 五脏六腑背俞穴的所在（调理内脏主干线）**\n\n```\n循行：目内眦 → 头顶 → 后脑 → 背（两条侧线）→ 腰 → 腿后 → 小趾\n背俞穴：肺俞/心俞/肝俞/脾俞/肾俞/大肠俞/小肠俞/膀胱俞…\n「内脏的后门」\n```","o":"RJ-0064 · 《人纪·针灸》第四章「足太阳膀胱经 / 州都之官：膀胱」（PDF 第 180–225 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"俞募治疗法","c":"【第四章·俞募治疗法】讲义：「**『俞募治疗』是针灸治内科病的第一大法。****『俞』= 背俞穴（在背后膀胱经）；『募』= 募穴（在胸腹部）。****为什么两个一起用？因为『俞』在阳（背为阳），『募』在阴（腹为阴）——一前一后、一阴一阳，把脏腑的气血从两个方向同时调整。****具体配法：****① 肺病：肺俞（背）+ 中府（胸，肺募）；② 心病：心俞 + 巨阙；③ 肝病：肝俞 + 期门；④ 脾病：脾俞 + 章门；⑤ 肾病：肾俞 + 京门；⑥ 胃病：胃俞 + 中脘。****讲义强调：『俞募治疗是『从两头夹』——前面一个、后面一个，病在中间就跑不掉。』**」\n\n**【最重要】俞募治疗法 = 背俞穴 + 腹募穴（一前一后夹治）**\n\n| 脏腑 | 俞（背） | 募（腹） |\n|---|---|---|\n| 肺 | 肺俞 | 中府 |\n| 心 | 心俞 | 巨阙 |\n| 肝 | 肝俞 | 期门 |\n| 脾 | 脾俞 | 章门 |\n| 肾 | 肾俞 | 京门 |\n| 胃 | 胃俞 | 中脘 |\n\n**「从两头夹」——「这是最精的内科配穴法。」** ✓✓✓","o":"RJ-0065 · 《人纪·针灸》第四章「肺俞穴（俞募治疗法）」（PDF 第 195–200 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"大杼穴与膈俞穴","c":"【第四章·大杼/膈俞】讲义：「**大杼穴——在第 1 胸椎棘突下旁开 1.5 寸，是『骨会大杼』（八会穴之一）。****『骨会』的意思是『所有骨病都在这里会』。****主治：① 一切骨病（骨关节炎、骨质疏松、颈椎病、腰椎病）；② 肩背痛；③ 咳嗽。****为什么能治骨？因为『骨者，髓之府』，肾主骨生髓——大杼通肾气，所以治骨。****膈俞穴——在第 7 胸椎棘突下旁开 1.5 寸，是『血会膈俞』（八会穴之一）。****『血会』——一切血病都在这里会。****主治：① 贫血（血虚）；② 瘀血（跌打、瘀斑）；③ 一切出血（吐血、衄血、崩漏）；④ 皮肤病（血热）。****讲义强调：『大杼治骨、膈俞治血——这就是『八会穴』的用法（骨会大杼、血会膈俞、筋会阳陵泉、脉会太渊、气会膻中、髓会绝骨、脏会章门、腑会中脘）。』**」\n\n**【极重要】八会穴：大杼（骨会）+ 膈俞（血会）+ 其他六会**\n\n```\n大杼（第 1 胸椎旁）：一切骨病\n膈俞（第 7 胸椎旁）：贫血 / 瘀血 / 出血 / 皮肤病\n八会：骨→大杼｜血→膈俞｜筋→阳陵泉｜脉→太渊｜气→膻中｜髓→绝骨｜脏→章门｜腑→中脘\n```\n\n**「八会穴」——「这是最精的分类取穴（按组织/物质取穴）。」** ✓✓✓","o":"RJ-0066 · 《人纪·针灸》第四章「大抒穴（专治骨病）/ 膈俞穴（贫血、淤血）/ 八会穴介绍」（PDF 第 200–215 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"膏肓俞与痞根穴","c":"【第四章·膏肓/痞根】讲义：「**膏肓俞——在第 4 胸椎棘突下旁开 3 寸（膀胱经第二侧线）。****『膏肓』是古代医书里的一个说法：『病入膏肓』——病到了膏肓（心尖与膈之间的位置），就难治了。****但膏肓俞这个穴，恰恰是治『诸虚百损』的要穴。****主治：① 一切虚劳（久病体虚、消瘦）；② 肺痨（肺结核）；③ 健忘、遗精；④ 『灸膏肓』是古代保健灸的重要穴位。****『经外奇穴：痞根穴』——在第 1 腰椎棘突下旁开 3.5 寸。****『痞根』的意思是『痞块的根』——主治腹部的积块（肿瘤、囊肿、肝脾肿大）。****用法：灸痞根，或者按揉。****讲义强调：『痞根是『消积』的要穴——但（须「强「标」）积块必须先做影像学检查明确性质。』**」\n\n**【极重要】膏肓俞（诸虚百损）+ 痞根穴（积块/肿瘤的经外奇穴）**\n\n```\n膏肓俞（第 4 胸椎旁 3 寸）：虚劳 / 肺痨 / 遗精（保健灸要穴）\n痞根（第 1 腰椎旁 3.5 寸）：腹部积块 / 囊肿 / 肝脾肿大\n```\n\n**须「绝「对「强「标」**：**「①腹部积块须先做CT/超声/活检；②针灸不可代替诊断/治疗；③恶性肿瘤须规范治疗」** ✓✓✓","o":"RJ-0067 · 《人纪·针灸》第四章「膏肓俞穴 / 经外奇穴：痞根穴」（PDF 第 205–212 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"委中穴","c":"【第四章·委中穴】讲义：「**委中穴——在膝后腘窝横纹的中点。****它是膀胱经的『合穴』（土）。****『腰背委中求』——一切腰背痛，都取委中。****为什么？因为膀胱经从头顶一直走到脚，整条背部和腰部都是它的地盘；委中是它的合穴，能通调整条经的气血。****委中的特殊用法：『放血』。****讲义讲：『委中放血能去血中的毒』——主治：① 急性腰扭伤（委中放血立效）；② 皮肤病（癣、痲疯病）；③ 丹毒；④ 中暑。****放血方法：在腘窝的静脉上（『委中青筋』），用三棱针点刺，让黑血流出，『黑变红就停』。****讲义强调：『委中是『去血放毒』的大穴——但（须「强「标」）有出血倾向、抗凝药者禁。』**」\n\n**【极重要】委中 = 膀胱经合穴（「腰背委中求」+ 放血去毒）**\n\n```\n定位：腘窝横纹中点\n主治：急性腰扭伤（放血立效）/ 皮肤病 / 丹毒 / 中暑\n放血：「黑变红就停」\n```\n\n**须「绝「对「强「标」**：**「①抗凝药/血小板低禁放血；②腘窝有血管神经，须严格无菌；③腰痛须排因」** ✓✓✓","o":"RJ-0068 · 《人纪·针灸》第四章「委中穴（去血放毒、痲疯病、背痛、皮肤癣）」（PDF 第 213–215 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"至阴穴转胎","c":"【第四章·至阴穴】讲义：「**至阴穴——在足小趾外侧指甲角旁 0.1 寸，是膀胱经的『井穴』，也是膀胱经的终点。****『至阴』的意思是『到最阴的地方』——膀胱经走到这里，由阳转阴（接肾经）。****主治：① 胎位不正——『灸至阴』能让胎位转正（这是针灸最著名的『转胎』法）；② 头痛（太阳穴痛）；③ 鼻塞。****转胎的用法：孕妇 30 周后胎位不正（臀位），用艾条灸至阴穴（双侧），每次 15–20 分钟，每天 1–2 次，一周后复查 B 超。****讲义强调：『至阴转胎是有效的——但（须「强「标」）必须在产科监测下进行，不能替代剖宫产评估。』**」\n\n**【极重要】至阴穴（膀胱经井穴）= 灸之转胎位**\n\n```\n定位：足小趾外侧指甲角旁\n主治：胎位不正（灸至阴转胎）/ 头痛 / 鼻塞\n用法：孕 30 周后，双侧艾灸 15–20 min，日 1–2 次，一周复查\n```\n\n**须「绝「对「强「标」**：**「①胎位不正须产科监测；②灸法不可代替剖宫产评估；③须B超随访；④胎盘/脐带异常禁」** ✓✓✓","o":"RJ-0069 · 《人纪·针灸》第四章「通谷穴与至阴穴」（PDF 第 221–222 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"足少阴肾经","c":"【第四章·足少阴肾经】讲义：「**肾经（酉时当令，17–19 点）——27 穴。****『肾者，作强之官，伎巧出焉』——肾是『作强之官』，主力量、主技巧（精力、生殖、骨骼、智力）。****肾主藏精、主水、主纳气、主骨生髓。****循行：从足心（涌泉）→ 腿内侧后缘 → 腹（横骨、大赫）→ 胸（神封、俞府）。****关键穴：****① 涌泉——井穴（引火下行，治顽固头痛、高血压）；② 然谷——荥穴（治脑震荡）；③ 太溪——原穴（补肾第一穴，也是『肾结石诊断点』）；④ 大钟——络穴；⑤ 照海——八脉交会（通阴跷，治失眠、咽喉干）；⑥ 复溜——经穴（治水肿、盗汗）；⑦ 筑宾——（治奔豚、癫狂）；⑧ 阴谷——合穴。****『肾经与音羽吹声』——讲义讲肾对应的声音是『羽』（吹气声），五音疗法。**」\n\n**【最重要】足少阴肾经 27 穴（主藏精/主水/主骨）**\n\n```\n涌泉（井，引火下行）｜然谷（荥，脑震荡）｜太溪（原，补肾第一 + 肾结石点）\n照海（通阴跷，失眠/咽干）｜复溜（经，水肿盗汗）｜筑宾（奔豚癫狂）｜阴谷（合）\n```","o":"RJ-0070 · 《人纪·针灸》第四章「足少阴肾经 / 作强之官：肾脏」（PDF 第 222–239 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"涌泉穴","c":"【第四章·涌泉穴】讲义：「**涌泉穴——在足底（足趾屈曲时，足心前凹陷处，约在足底前 1/3 处）。****『涌泉』——像泉水从地下涌出，是肾经的『井穴』，也是全身最低的穴位。****主治：① 顽固头痛（『涌泉治头痛』——尤其巅顶痛、高血压头痛）；② 高血压（『引火下行』——把头部的火引到脚底）；③ 昏厥（急救——灸涌泉）；④ 失眠；⑤ 咽喉痛。****为什么能治头痛？因为『上病下取』——头部的火（肝阳上亢）需要往下引，涌泉在最下面，像『下水道』，能把上冲的火引下来。****讲义强调：『涌泉是『引火下行』的第一穴——高血压、头痛、失眠，都可以灸涌泉（或贴吴茱萸）。』**」\n\n**【极重要】涌泉 = 肾经井穴（引火下行，上病下取）**\n\n```\n定位：足底前 1/3 凹陷\n主治：顽固头痛 / 高血压 / 昏厥（灸）/ 失眠 / 咽喉痛\n「上病下取」——引火下行\n```\n\n**须「强「标」**：**「①高血压须规范降压药；②针灸为辅助；③糖尿病足禁灸（易溃疡）；④须监测」** ✓✓✓","o":"RJ-0071 · 《人纪·针灸》第四章「涌泉穴（顽固头痛）」（PDF 第 226 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"太溪穴与肾结石","c":"【第四章·太溪穴】讲义：「**太溪穴——在内踝尖与跟腱之间的凹陷处。****它是肾经的『原穴』，也是『补肾第一穴』。****主治：① 一切肾虚（腰酸、耳鸣、脱发、性功能减退）；② 水肿；③ 牙痛（肾虚牙痛）；④ 失眠；⑤ 咳嗽（肾不纳气）。****『太溪穴与肾结石诊治』——讲义讲了一个重要的诊断法：****肾结石的病人，按压太溪穴附近（或肾俞、京门）会有明显的压痛点。****所以『太溪压痛 = 肾结石的线索』。****（须「强「标」）但确诊必须靠 B 超/CT，不能只凭压痛。****另一个重要用途：太溪是『三脉』之一（太冲脉、冲阳脉、太溪脉）——摸太溪的脉动能判断肾气的强弱（『太溪脉在，肾气还在』）。**」\n\n**【极重要】太溪 = 肾经原穴（补肾第一穴）+ 肾结石压痛线索 + 三脉之一**\n\n```\n定位：内踝尖与跟腱之间\n主治：肾虚（腰酸耳鸣脱发）/ 水肿 / 牙痛 / 失眠 / 肾不纳气\n诊断：太溪压痛 → 肾结石线索；太溪脉在 = 肾气在\n```\n\n**须「绝「对「强「标」**：**「①肾结石须B超/CT确诊；②不可凭压痛诊断；③肾绞痛须急诊」** ✓✓✓\n\n**「太溪脉」——「这是最精的『三脉』之一（与 n54 互证）。」** ✓✓✓","o":"RJ-0072 · 《人纪·针灸》第四章「太溪穴与肾结石诊治」（PDF 第 228–230 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"照海穴","c":"【第四章·照海穴】讲义：「**照海穴——在内踝尖下方凹陷处。****它是肾经的穴位，也是『八脉交会穴』之一——通『阴跷脉』。****『照海』的意思是『照着海』——肾主水，这个穴位像海边的灯塔。****主治：① 失眠（『阴跷主寐』——照海配申脉治失眠，一个治阴、一个治阳）；② 咽喉干痛（『照海治咽干』——尤其夜间咽干）；③ 月经不调；④ 小便不利。****配穴：照海 + 列缺（八脉交会配穴法——照海通阴跷、列缺通任脉，治咽喉、胸膈的病）。****讲义强调：『照海是治『阴虚咽干』的要穴——晚上口干、咽喉干，取照海。』**」\n\n**【极重要】照海 = 通阴跷脉（失眠 + 夜间咽干）**\n\n```\n定位：内踝尖下方凹陷\n主治：失眠（阴跷主寐）/ 夜间咽干 / 月经不调 / 小便不利\n配穴：照海 + 列缺（阴跷 + 任脉）\n```","o":"RJ-0073 · 《人纪·针灸》第四章「大钟、水泉与照海穴」（PDF 第 230 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"手厥阴心包经","c":"【第四章·手厥阴心包经】讲义：「**心包经（戌时当令，19–21 点）——9 穴。****『心包』是心的『外围』——『心包络，心之外卫』，像心脏的『城墙』，代心受邪。****所以心包经的病，多是『心』的病（心痛、胸闷、心悸）。****手厥阴心包经 9 穴：天池、天泉、曲泽、郄门、间使、内关、大陵、劳宫、中冲。****循行：从胸（天池）→ 上肢内侧中线 → 中指（中冲）。****关键穴：****① 曲泽——合穴（治心痛、呕吐）；② 郄门——郄穴（治急性心痛）；③ 内关——络穴（心胸闷、呕吐第一穴）；④ 大陵——原穴（治癫狂、口臭）；⑤ 劳宫——荥穴（治口疮、心烦）；⑥ 中冲——井穴（放血治昏迷）。****讲义强调：『心包经是『救心』的经——心梗、心绞痛，先取内关。』**」\n\n**【最重要】手厥阴心包经 9 穴（代心受邪，「救心」之经）**\n\n```\n9 穴：天池/天泉/曲泽/郄门/间使/内关/大陵/劳宫/中冲\n曲泽（合）｜郄门（郄，急性心痛）｜内关（络，心胸呕吐）｜大陵（原）｜中冲（井，放血）\n```\n\n**须「绝「对「强「标」**：**「①胸痛须立即心电图/肌钙蛋白；②须排心梗/夹层；③针灸绝不可代替急救/PCI」** ✓✓✓","o":"RJ-0074 · 《人纪·针灸》第四章「手厥阴心包经 / 天池穴至曲泽穴」（PDF 第 239–245 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"内关穴","c":"【第四章·内关穴】讲义：「**内关穴——在腕横纹上 2 寸（两筋之间）。****它是心包经的『络穴』，也是『八脉交会穴』之一——通『阴维脉』。****主治：① 心脏一切病（心痛、心悸、胸闷）；② 呕吐（『内关止呕』——晕车、孕吐、化疗呕吐都有效）；③ 胃痛；④ 失眠；⑤ 癫狂。****为什么内关这么重要？因为它通阴维脉——『阴维为病苦心痛』（阴维脉的病表现为心痛）。****配穴：内关 + 公孙（八脉交会——内关通阴维、公孙通冲脉，治胃心胸的病）。****讲义强调：『内关是『心、胸、胃』的总穴——一针下去，上治心、中治胸、下治胃。』**」\n\n**【最重要】内关 = 心包络穴 + 通阴维脉（心/胸/胃总穴）**\n\n```\n定位：腕横纹上 2 寸（两筋间）\n主治：心痛心悸胸闷 / 呕吐（晕车/孕吐/化疗）/ 胃痛 / 失眠\n配穴：内关 + 公孙（阴维 + 冲脉）\n```\n\n**须「强「标」**：**「①心痛须急诊；②呕吐须查因；③针灸为辅助；④化疗呕吐须止吐药」** ✓✓✓\n\n**「心/胸/胃总穴」——「这是最精的一穴三治。」** ✓✓✓","o":"RJ-0075 · 《人纪·针灸》第四章「郄门穴至内关穴」（PDF 第 242–244 页）。"},{"t":"针灸·第四章：十二正经（下）膀胱经、肾经、心包经、三焦经","h":"外关穴与开天河水","c":"【第四章·外关穴】讲义：「**外关穴——在腕背横纹上 2 寸（两骨之间），是心包经『内关』的背面。****它是三焦经的『络穴』，也是『八脉交会穴』——通『阳维脉』。****主治：① 一切外感（感冒、发热——『外关解表』）；② 头痛、耳鸣；③ 上肢痛；④ 胁痛。****『通生死关与开天河水』——讲义介绍了小儿推拿的一个方法：****『开天河水』——用拇指从孩子腕部（外关）向上推，能退烧、安神。****这是小儿推拿的经典手法（『天河水』在小儿推拿里是退烧的『名穴』）。****『三关：幼儿治症（指针法）』——讲义讲了用『指针』（用手指代替针）治小儿病的方法，因为小儿不宜针刺。****讲义强调：『小儿用指针，不用针——这是安全原则。』**」\n\n**【极重要】外关（三焦络穴/通阳维）+ 开天河水（小儿推拿退烧）**\n\n```\n外关（腕背横纹上 2 寸）：外感发热 / 头痛耳鸣 / 上肢痛 / 胁痛\n开天河水：拇指从腕向上推 → 小儿退烧安神\n小儿用指针，不用针\n```\n\n**须「强「标」**：**「①小儿高热须查因（感染）；②推拿不可代替退烧药/就诊；③3月龄以下发热须急诊」** ✓✓✓","o":"RJ-0076 · 《人纪·针灸》第四章「外关穴（通生死关与开天河水）/ 三关：幼儿治症（指针法）」（PDF 第 248–249 页）。"},{"t":"针灸·第四章：十二正经（终）胆经与肝经","h":"足少阳胆经","c":"【第四章·足少阳胆经】讲义：「**胆经（子时当令，23–1 点）——44 穴，是十二经中第二长的。****『胆者，中正之官，决断出焉』——胆是『中正之官』，主决断（判断力、勇气）。****胆主『少阳』——少阳是『半表半里』，所以胆经的病常常表现为『寒热往来』（忽冷忽热）。****循行：从头侧（瞳子髎、听会、率谷、风池）→ 肩（肩井）→ 胁（日月、京门）→ 髋（环跳）→ 腿外侧（风市、阳陵泉、悬钟）→ 足（足窍阴）。****胆经的『侧线』特点很重要——它走的是身体的『侧面』，所以偏头痛、胁痛、髋痛、腿外侧痛，都在胆经上。****关键穴：****① 风池——祛风要穴；② 肩井——解胸中瘀血；③ 环跳——坐骨神经痛；④ 风市——中风瘫痪大穴；⑤ 阳陵泉——筋会；⑥ 悬钟——髓会；⑦ 足临泣——通带脉。****讲义强调：『胆经是『侧面』的经——偏头痛、胁痛、髋痛，先想胆经。』**」\n\n**【最重要】足少阳胆经 44 穴（主决断，走身体侧面）**\n\n```\n循行：头侧 → 肩（肩井）→ 胁（日月/京门）→ 髋（环跳）→ 腿外（风市/阳陵泉）→ 足\n风池（祛风）｜肩井（瘀血）｜环跳（坐骨神经）｜风市（瘫痪）｜阳陵泉（筋会）｜悬钟（髓会）\n```","o":"RJ-0077 · 《人纪·针灸》第四章「足少阳胆经」（PDF 第 259–281 页）。"},{"t":"针灸·第四章：十二正经（终）胆经与肝经","h":"风池穴","c":"【第四章·风池穴】讲义：「**风池穴——在后脑（枕骨下、胸锁乳突肌与斜方肌之间的凹陷处）。****『风池』的意思是『风汇聚的池子』——它是祛风的第一要穴。****主治：① 一切『风』的病（感冒、头痛、头晕、颈项强）；② 面瘫（配翳风、地仓）；③ 高血压（风池能平肝潜阳）；④ 眼病（近视、视疲劳）；⑤ 鼻塞。****为什么风池这么重要？因为『风为百病之长』——外感六淫，风为首；而风池是风邪最易停留的地方（后脑是风的入口）。****扎风池要特别注意方向：**针尖必须朝鼻尖方向（或对侧眼睛），**绝对不能朝上（朝上会刺入延脑/枕骨大孔，有生命危险）！****讲义强调：『风池是『高危穴』——方向错了会出人命。』**」\n\n**【极重要】风池 = 祛风第一要穴（方向必须朝鼻尖，忌朝上）**\n\n```\n定位：枕骨下、两肌之间凹陷\n主治：感冒 / 头痛头晕 / 颈项强 / 面瘫 / 高血压 / 眼病\n方向铁律：朝鼻尖（忌朝上 → 可刺入延脑致死）\n```\n\n**须「绝「对「强「标」**：**「①风池针尖绝不可朝上（延脑/枕骨大孔）；②须专业针灸师；③深刺可致死亡」** ✓✓✓\n\n**「方向朝鼻尖」——「这是最精的高危穴位安全规范。」** ✓✓✓","o":"RJ-0078 · 《人纪·针灸》第四章「头临泣、目窗穴与风池穴」（PDF 第 267 页）。"},{"t":"针灸·第四章：十二正经（终）胆经与肝经","h":"肩井穴","c":"【第四章·肩井穴】讲义：「**肩井穴——在肩上（大椎与肩峰连线的中点）。****它是胆经的穴位，也是『解胸中瘀血』的要穴。****主治：① 胸中瘀血（胸闷、胸痛、跌打内伤）；② 肩背痛；③ 乳痈（乳腺炎）；④ 难产（催产）。****『肩井解血瘀胸中』——这是它最独特的用途。****为什么？因为肩井在肩部最高处，胆经从这里经过胸胁；针肩井能『开胸』，把胸中的瘀血散开。****但肩井是『孕妇禁针』的穴位！****为什么？因为肩井能『催产』（古人用它下胎）——孕妇针肩井可能流产。****讲义强调：『肩井是『能打胎』的穴——孕妇绝对禁针。』**」\n\n**【极重要】肩井 = 解胸中瘀血（孕妇绝对禁针，能催产/下胎）**\n\n```\n定位：大椎与肩峰连线中点\n主治：胸中瘀血 / 肩背痛 / 乳痈 / 难产（催产）\n孕妇绝对禁针（可致流产）\n```\n\n**须「绝「对「强「标」**：**「①孕妇绝对禁针肩井；②深刺可致气胸（肺尖）；③须专业」** ✓✓✓","o":"RJ-0079 · 《人纪·针灸》第四章「肩井穴（解血瘀胸中）」（PDF 第 268 页）。"},{"t":"针灸·第四章：十二正经（终）胆经与肝经","h":"环跳穴","c":"【第四章·环跳穴】讲义：「**环跳穴——在臀部（股骨大转子与骶管裂孔连线的外 1/3 处）。****『环跳』的『环』是『环顾』，『跳』是『跳跃』——这个穴位管的是『髋关节的跳跃动作』。****它是胆经的穴位，也是治坐骨神经痛的『第一穴』。****主治：① 坐骨神经痛（从臀痛到腿后侧）；② 髋关节痛（股骨头坏死、髋关节炎）；③ 下肢瘫痪；④ 腰腿痛。****『居髎穴与环跳穴（骨之始）』——讲义说环跳是『骨之始』（骨的起点），因为它是髋关节的核心。****扎环跳的要点：**要深刺（2–3 寸），针感要往下传（『得气传到脚』才有效）。****讲义强调：『环跳是坐骨神经痛的主穴——但（须「强「标」）腿痛先要排除腰椎间盘突出、椎管狭窄。』**」\n\n**【极重要】环跳 = 坐骨神经痛第一穴（「骨之始」，须深刺得气下传）**\n\n```\n定位：股骨大转子与骶管裂孔连线外 1/3\n主治：坐骨神经痛 / 髋关节痛 / 下肢瘫痪 / 腰腿痛\n要点：深刺 2–3 寸，针感须下传至足\n```\n\n**须「强「标」**：**「①腿痛须排腰椎间盘/椎管狭窄；②髋痛须排股骨头坏死（MRI）；③深刺须专业」** ✓✓✓","o":"RJ-0080 · 《人纪·针灸》第四章「居髎穴与环跳穴（骨之始）」（PDF 第 272 页）。"},{"t":"针灸·第四章：十二正经（终）胆经与肝经","h":"风市穴","c":"【第四章·风市穴】讲义：「**风市穴——在腿外侧（直立时，两手中指贴腿，中指尖所指处）。****这个取穴法很妙：『手贴腿，中指尖到处就是风市』——不用量寸。****『风市』的意思是『风的市场』——风邪聚集的地方。****它是治中风瘫痪的『大穴』。****主治：① 中风偏瘫（下肢不遂）；② 下肢痿痹、麻木；③ 皮肤瘙痒（风疹、湿疹——『治风』）；④ 腿痛。****为什么叫『风市』？因为风邪多从腿外侧侵入（这里是身体的『风口』），所以这个穴位善治一切风证。****讲义强调：『风市是中风八大穴之一——下肢瘫痪必取。』**」\n\n**【极重要】风市 = 中风瘫痪大穴（「手贴腿中指到处」）+ 一切风证**\n\n```\n定位：直立垂手，中指尖所到处\n主治：中风偏瘫（下肢）/ 下肢痿痹麻木 / 皮肤瘙痒 / 腿痛\n「风的市场」（善治风证）\n```","o":"RJ-0081 · 《人纪·针灸》第四章「风市穴（中风瘫痪大穴）」（PDF 第 273 页）。"},{"t":"针灸·第四章：十二正经（终）胆经与肝经","h":"阳陵泉穴","c":"【第四章·阳陵泉穴】讲义：「**阳陵泉穴——在小腿外侧（腓骨小头前下方的凹陷处）。****它是胆经的『合穴』（土），也是『八会穴』中的『筋会』。****两个身份，两个用途：****① 筋会——一切『筋』的病（抽筋、筋膜炎、肌腱炎、关节僵硬、半身不遂）；② 胆经合穴——胆病（胆结石、胆囊炎、口苦、胁痛）。****『筋会阳陵泉』——为什么它能治筋？因为『肝主筋』，而胆与肝相表里；阳陵泉能调肝胆，所以能治筋。****主治：① 抽筋（小腿抽筋，针阳陵泉立止）；② 膝关节痛；③ 胁痛、口苦（胆病）；④ 下肢不遂。****配穴：阳陵泉 + 太冲（肝胆同治）；阳陵泉 + 足三里（下肢病）。****讲义强调：『阳陵泉是『筋的总管』——一切跟『筋』有关的病，先取它。』**」\n\n**【最重要】阳陵泉 = 筋会（一切筋病）+ 胆经合穴（胆病）**\n\n```\n定位：腓骨小头前下方凹陷\n主治：抽筋 / 筋膜炎肌腱炎 / 关节僵硬 / 半身不遂 / 胆结石胆囊炎 / 胁痛口苦\n「筋会」+ 胆经合穴\n```\n\n**「筋会阳陵泉」——「这是最精的八会穴（筋的总管）。」** ✓✓✓","o":"RJ-0082 · 《人纪·针灸》第四章「阳关穴、阳陵泉穴 / 八会穴介绍」（PDF 第 274–277 页）。"},{"t":"针灸·第四章：十二正经（终）胆经与肝经","h":"悬钟穴与足临泣","c":"【第四章·悬钟/足临泣】讲义：「**悬钟穴——在外踝尖上 3 寸（腓骨前缘），又叫『绝骨』。****它是『八会穴』中的『髓会』——一切『髓』的病（骨髓病、脑病、贫血、痴呆）。****『髓会绝骨』——为什么？因为『肾主骨生髓』，而胆经与肾经相通（少阳→少阴），悬钟能通髓。****主治：① 髓病（脑萎缩、痴呆、贫血）；② 落枕（『落枕取悬钟』）；③ 颈项强痛；④ 下肢痿痹。****足临泣穴——在足背（第 4、5 跖骨结合部前方）。****它是胆经的『输穴』，也是『八脉交会穴』——通『带脉』。****主治：① 带脉病（腰腹一圈像『束带』一样紧、妇科病）；② 偏头痛；③ 目赤；④ 『华佗夹脊痛』——足三里 + 足临泣专治华佗夹脊痛（脊柱两侧的痛）。****讲义强调：『悬钟治髓、临泣治带——两个『会穴』各管一路。』**」\n\n**【极重要】悬钟（髓会，治脑/髓）+ 足临泣（通带脉 + 华佗夹脊痛）**\n\n```\n悬钟（外踝上 3 寸，髓会）：脑萎缩痴呆 / 贫血 / 落枕 / 颈项痛\n足临泣（通带脉）：腰腹束带状紧 / 偏头痛 / 目赤\n华佗夹脊痛 = 足三里 + 足临泣\n```","o":"RJ-0083 · 《人纪·针灸》第四章「光明、阳辅与悬钟穴 / 八会穴介绍 / 华陀夹脊痛」（PDF 第 271–277 页）。"},{"t":"针灸·第四章：十二正经（终）胆经与肝经","h":"胆石点与阳交外丘","c":"【第四章·胆石点/阳交外丘】讲义：「**『奇穴：胆石点』——在小腿外侧（阳陵泉下 1–2 寸附近），是诊断胆结石的『压痛点』。****胆结石的病人，按压胆石点会明显疼痛（尤其右侧）。****这个点还能『治』——针胆石点 + 阳陵泉 + 日月 + 期门，能缓解胆绞痛。****（须「强「标」）但胆囊结石的确诊必须靠 B 超，急性胆囊炎/胆管梗阻须急诊手术。****『阳交穴至外丘穴』——这两个穴在腓骨后缘。****特殊用途：『治犬咬伤、疯狗咬伤』——古人用外丘穴治狂犬病（灸之）。****（须「绝「对「强「标」）狂犬病一旦发病，死亡率接近 100%——暴露后必须立即清洗伤口 + 打狂犬疫苗 + 免疫球蛋白，针灸绝无替代作用！**」\n\n**【极重要】胆石点（胆结石压痛诊断点）+ 外丘（古人治犬咬伤，今须绝对强标）**\n\n```\n胆石点（阳陵泉下 1–2 寸）：胆结石压痛 → 确诊须 B 超\n外丘（古人灸治犬咬伤）→ 现代绝不可替代狂犬疫苗！\n```\n\n**须「绝「对「强「标」**：**「①狂犬病暴露须立即冲洗15min + 疫苗 + 免疫球蛋白；②发病后死亡率近100%；③针灸绝无替代作用；④胆结石须B超/急诊」** ✓✓✓\n\n**「外丘治犬咬伤」必须绝对否定**——这是全书最危险的古代记载之一。** ✓✓✓","o":"RJ-0084 · 《人纪·针灸》第四章「奇穴：胆石点 / 阳交穴至外丘穴（治犬咬伤）」（PDF 第 275 页）。"},{"t":"针灸·第四章：十二正经（终）胆经与肝经","h":"足厥阴肝经","c":"【第四章·足厥阴肝经】讲义：「**肝经（丑时当令，1–3 点）——14 穴。****『肝者，将军之官，谋虑出焉』——肝是『将军』，主谋虑（计划、思考）。****肝主疏泄（调畅气机）、主藏血、主筋。****循行：从足大趾（大敦）→ 腿内侧 → 阴部 → 腹（章门、期门）→ 胁。****关键穴：****① 大敦——井穴（治疝气、阴部痛、子宫下垂）；② 行间——荥穴（清肝火，治目赤、口苦）；③ 太冲——原穴（疏肝第一穴，也是『三脉』之一）；④ 中封——经穴；⑤ 蠡沟——络穴；⑥ 曲泉——合穴；⑦ 阴包——治月经；⑧ 章门——脾募（脏会）；⑨ 期门——肝募。****『肝病与睡眠』——讲义讲：『肝经当令是丑时（1–3 点）——如果这段时间醒，是肝有问题。』**」\n\n**【最重要】足厥阴肝经 14 穴（主疏泄/藏血/主筋）**\n\n```\n大敦（井，疝气/阴痛）｜行间（荥，清肝火）｜太冲（原，疏肝第一）｜曲泉（合）\n章门（脾募/脏会）｜期门（肝募）\n肝经当令：丑时（1–3 点）\n```","o":"RJ-0085 · 《人纪·针灸》第四章「足厥阴肝经 / 胆肝经走向 / 肝病与睡眠」（PDF 第 281–291 页）。"},{"t":"针灸·第四章：十二正经（终）胆经与肝经","h":"太冲穴","c":"【第四章·太冲穴】讲义：「**太冲穴——在足背（第 1、2 跖骨结合部前的凹陷处）。****它是肝经的『原穴』，也是『疏肝第一穴』。****主治：① 一切『肝气郁结』（情绪抑郁、爱生气、胸闷、胁痛、月经不调）；② 头痛（巅顶痛、偏头痛）；③ 高血压（平肝潜阳）；④ 目赤、口苦；⑤ 失眠。****『消气穴』——太冲是著名的『消气穴』：生气之后按揉太冲，能把气『泄』下去。****『太冲穴与三脉（太冲脉、冲阳脉、太溪脉）』——讲义强调了三个『脉』的诊断价值：****① 太冲脉（肝经）——摸这里能判断肝血/肝气；② 冲阳脉（胃经，足背）——判断胃气；③ 太溪脉（肾经，内踝后）——判断肾气。****『三脉都在，人就还活着』——这是针灸的『脉诊三处』。****配穴：太冲 + 合谷 = 四关穴。**」\n\n**【最重要】太冲 = 肝经原穴（疏肝/消气穴）+「三脉」之一**\n\n```\n定位：足背第 1、2 跖骨结合部前\n主治：肝气郁结 / 头痛 / 高血压 / 目赤口苦 / 失眠\n「消气穴」；三脉 = 太冲（肝）+ 冲阳（胃）+ 太溪（肾）\n```\n\n**「三脉」——「这是最精的三处脉诊（与 n54脚上三个脉」互证）。** ✓✓✓","o":"RJ-0086 · 《人纪·针灸》第四章「太冲穴与三脉（太冲脉、冲阳脉、太溪脉）」（PDF 第 287 页）。"},{"t":"针灸·第四章：十二正经（终）胆经与肝经","h":"期门穴与章门穴","c":"【第四章·期门/章门】讲义：「**期门穴——在胸部（乳头直下，第 6 肋间隙）。****它是『肝的募穴』——肝病的主穴。****主治：① 一切肝病（肝炎、肝硬化、胁痛）；② 胸胁痛；③ 呕吐（肝气犯胃）。****为什么叫『期门』？『期』是『周期』——肝经的气血每 14 天在这里『换一次』（古说）。****章门穴——在第 11 肋游离端下方。****它是『脾的募穴』，也是『八会穴』中的『脏会』——五脏的病都可以取它。****主治：① 脾病（腹胀、腹泻）；② 五脏虚损（『脏会章门』）；③ 胁痛。****配穴：肝病用『俞募治疗』——肝俞（背）+ 期门（腹）；脾病用脾俞 + 章门。****讲义强调：『期门治肝、章门治脾——两个『门』，各管一个臓。』**」\n\n**【极重要】期门（肝募）+ 章门（脾募/脏会）——俞募治疗的核心**\n\n```\n期门（乳头下第 6 肋间）：肝病 / 胸胁痛 / 肝气犯胃\n章门（第 11 肋端）：脾病 / 五脏虚损（脏会）\n配：肝俞+期门 / 脾俞+章门\n```\n\n**须「强「标」**：**「①肝病须查肝功/B超/病毒；②肝硬化须专科；③胸部针刺须防气胸」** ✓✓✓","o":"RJ-0087 · 《人纪·针灸》第四章「章门穴与期门穴」（PDF 第 291 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"奇经八脉总表","c":"【第五章·奇经八脉】讲义：「**奇经八脉是『不归正经』的八条脉——它们不属于十二经的表里配属，所以叫『奇』（奇异的、单独的）。****① 任脉——阴脉之海（总任一身之阴），走腹正中线；② 督脉——阳脉之海（总督一身之阳），走背正中线；③ 冲脉——十二经之海（血海），起于胞中，上行散于胸；④ 带脉——环腰一周（像『腰带』），约束诸经；⑤ 阴跷脉——主一身左右之阴，主『寐』（睡眠）；⑥ 阳跷脉——主一身左右之阳，主『寤』（清醒）；⑦ 阴维脉——维系诸阴；⑧ 阳维脉——维系诸阳。****最实用的三个：任（阴海）、督（阳海）、冲（血海）；加上带脉（腰腹妇科）。****讲义强调：『奇经八脉不参与十二经的流注，但它们管的是『大局』——阴阳、气血、表里的总调度。』**」\n\n**【最重要】奇经八脉总表**\n\n```\n任（阴脉之海）｜督（阳脉之海）｜冲（十二经之海/血海）｜带（环腰束诸经）\n阴跷（主寐）｜阳跷（主寤）｜阴维（维阴）｜阳维（维阳）\n```\n\n**「带脉环腰」——「这是最精的解剖比喻（与 n126带脉环腰」互证）。** ✓✓","o":"RJ-0088 · 《人纪·针灸》第五章「奇经八脉」（PDF 第 295–300 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"十五络脉","c":"【第五章·十二经络与十五络脉歌】讲义：「**十五络脉 = 十二经各有一个『络穴』+ 任脉络（鸠尾）+ 督脉络（长强）+ 脾之大络（大包）。****『络』的作用是『联络』——正经是『主干道』，络脉是『支路』，把气血输送到全身的细微处。****十五络穴的临床意义：**① 络穴能治『表里两经』的病（因为络脉沟通表里）；② 络穴能治『久病』（『初病在经，久病入络』）。****具体：肺经—列缺、大肠经—偏历、胃经—丰隆、脾经—公孙、心经—通里、小肠经—支正、膀胱经—飞扬、肾经—大钟、心包经—内关、三焦经—外关、胆经—光明、肝经—蠡沟、任脉—鸠尾、督脉—长强、脾之大络—大包。****讲义强调：『络穴是治『慢性病、久病』的入口——病久了，要从络上治。』**」\n\n**【极重要】十五络穴全表（十二经 + 任督 + 脾之大络）**\n\n```\n肺-列缺｜大肠-偏历｜胃-丰隆｜脾-公孙｜心-通里｜小肠-支正\n膀胱-飞扬｜肾-大钟｜心包-内关｜三焦-外关｜胆-光明｜肝-蠡沟\n任-鸠尾｜督-长强｜脾之大络-大包\n「初病在经，久病入络」\n```","o":"RJ-0089 · 《人纪·针灸》第五章「十二经络与十五络脉歌」（PDF 第 294 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"烧山火（补法）","c":"【第五章·烧山火】讲义：「**『烧山火』是针灸最著名的『补法』——针刺后病人会觉得『一股热流』（所以叫『烧山火』）。****操作（三部三进）：****① 把穴位分成三层（天、人、地——浅、中、深）；② 先刺入天部（浅），得气后『紧按慢提』九次（重按轻提，九为阳数）；③ 再刺入人部（中），同样九次；④ 再刺入地部（深），同样九次；⑤ 最后从地部一次退到天部（『三进一退』）。****原理：『紧按慢提』是把阳气『推』进去，九为阳数，所以能生热（补阳）。****主治：一切虚寒证——阳虚、宫寒、关节冷痛、畏寒。****讲义强调：『烧山火的关键在『九』和『紧按』——数字和力度错了，就不热。』**」\n\n**【最重要】烧山火 = 补法（三进一退 + 紧按慢提 + 九数）**\n\n```\n三层（天/人/地）→ 每层紧按慢提 9 次 → 三进一退\n原理：紧按慢提 = 推阳气入内；九为阳数\n主治：一切虚寒（阳虚/宫寒/冷痛/畏寒）\n```\n\n**须「强「标」**：**「①须执业针灸师；②凝血障碍/抗凝药慎；③感染部位禁；④不可代替规范治疗」** ✓✓\n\n**「三进一退 + 紧按慢提 + 九」——「这是最精的补法三要素。」** ✓✓✓","o":"RJ-0090 · 《人纪·针灸》第五章「烧山火与透天凉」（PDF 第 302–304 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"透天凉（泻法）","c":"【第五章·透天凉】讲义：「**『透天凉』是『泻法』——与烧山火正相反，病人会觉得『一股凉意』。****操作（三部三退）：****① 先刺入地部（最深），得气后『紧提慢按』六次（重提轻按，六为阴数）；② 退到人部（中），同样六次；③ 退到天部（浅），同样六次；④ 最后从天部一次进到地部（『三退一进』）。****原理：『紧提慢按』是把邪气『提』出来，六为阴数，所以能生凉（泻热）。****主治：一切实热证——高热、炎症、红肿热痛。****烧山火与透天凉，就是针灸补泻的『两把刀』：**一个往里推（补），一个往外提（泻）；一个用九（阳），一个用六（阴）。**讲义强调：『这是针灸手法里最难、也最见功力的两个——补泻反了，病必加重。』**」\n\n**【最重要】透天凉 = 泻法（三退一进 + 紧提慢按 + 六数）**\n\n```\n先入地部 → 紧提慢按 6 次 → 退人部 6 次 → 退天部 6 次 → 三退一进\n原理：紧提慢按 = 提邪外出；六为阴数\n主治：一切实热（高热/炎症/红肿热痛）\n```\n\n**「烧山火 vs 透天凉」——「这是最精的补泻对照（九阳六阴、推进提出）。」** ✓✓✓","o":"RJ-0091 · 《人纪·针灸》第五章「烧山火与透天凉」（PDF 第 302–304 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"引气法与呼吸法","c":"【第五章·引气法与呼吸法】讲义：「**『引气』就是『把气引到病灶』——针扎下去，得气之后，要让『气』往病的地方走。****方法：**① 针尖朝向病所（针尖指向哪里，气就往哪里走）；② 配合病人的呼吸（呼气时进针/转针，气随呼出；吸气时退针，气随吸入）；③ 用手按压（『按压行气』——在针的上方或下方按压，引导气的方向）。****『呼吸法』的具体运用：**① 补法——病人呼气时进针，吸气时出针（『随』）；② 泻法——病人吸气时进针，呼气时出针（『迎』）。****这就是《内经》『迎而夺之，随而济之』。****讲义强调：『引气法是『让针有方向』——没有引气，针只是扎在皮肉上；引了气，针才真正『到病所』。』**」\n\n**【极重要】引气法三法（针尖朝向 / 配合呼吸 / 按压行气）+ 迎随补泻**\n\n```\n引气：针尖朝向病所 + 呼吸配合 + 按压引导\n补（随）：呼气进针，吸气出针\n泻（迎）：吸气进针，呼气出针\n「迎而夺之，随而济之」\n```","o":"RJ-0092 · 《人纪·针灸》第五章「引气法与呼吸法」（PDF 第 300–302 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"治痞：烧针法","c":"【第五章·治痞：烧针】讲义：「**『烧针』是治『痞块』（脂肪瘤、黑痣、化脓性肿块）的古老针法。****操作：**用火把针身烧红（『烧针』），迅速刺入痞块的中心。****为什么烧红？① 高温能灭菌（减少感染）；② 高温能『烧掉』组织（让痞块坏死脱落）。****主治：① 脂肪瘤（小的）；② 黑痣；③ 化脓的疮（排脓）；④ 疣、鸡眼。****『留气法、烧针与报刺法：治痞块』——讲义把三种治痞的方法并列：留气法（把气留住）、烧针（烧掉）、报刺法（反复刺）。****讲义强调：『烧针是古法——（须「绝「对「强「标」）现代绝不可自行操作：烧红的针会造成深度烧伤、感染、疤痕，而且黑痣可能本身就是恶性黑色素瘤，烧掉会延误诊断！』**」\n\n**【极重要】烧针治痞（古人法）——现代须绝对否定**\n\n```\n古法：火烧针红 → 刺入痞块中心\n主治（古）：脂肪瘤 / 黑痣 / 化脓 / 疣 / 鸡眼\n```\n\n**须「绝「对「强「标」**：**「①绝不可自行烧针（深度烧伤/感染）；②黑痣须排恶性黑色素瘤（活检）；③肿块须影像学明确；④烧掉会延误诊断」** ✓✓✓\n\n**「黑痣不可烧」——「这是最精的安全警告（黑色素瘤风险）。」** ✓✓✓","o":"RJ-0093 · 《人纪·针灸》第五章「留气法、烧针与报刺法：治痞块 / 治痞：烧针」（PDF 第 305 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"报刺法","c":"【第五章·治痞：报刺针法】讲义：「**『报刺』出自《内经》——『报刺者，刺其头而报之』。****操作：**在痞块的中央刺一针，然后『报』（报告、循环）——围绕痞块的四周再刺数针。****为什么叫『报刺』？因为古人认为：刺中心是『报信』，四周是『包围』——先报信、后包围，把痞块『围死』。****主治：脂肪瘤、纤维瘤、囊肿、结节（良性）。****讲义强调：『报刺是『围刺法』的雏形——今天的『围刺』（在肿块周围下针）就是从这个来的。』****（须「强「标」）现代用围刺治良性结节、甲状腺结节、乳腺增生有一定辅助作用，但恶性肿块绝不可用针灸『围』。**」\n\n**【极重要】报刺法（刺中心 + 围四周）= 今日「围刺」之源**\n\n```\n古法：中心一针「报信」+ 四周数针「包围」\n今用：围刺治良性结节/囊肿（辅助）\n```\n\n**须「绝「对「强「标」**：**「①恶性肿块绝不可针灸；②甲状腺/乳腺结节须先超声分级；③须专科评估」** ✓✓✓","o":"RJ-0094 · 《人纪·针灸》第五章「治痞：报刺针法」（PDF 第 306 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"提气法与中气法","c":"【第五章·提气法与中气法】讲义：「**『提气法』——治『冷麻』（局部发冷、麻木）。****操作：**针入后，慢慢『提』（向上提针），配合捻转——把气『提』到表层，让局部恢复感觉。****主治：① 局部冷麻（手脚发凉、麻木）；② 麻木不仁（中风后遗症）；③ 皮肤感觉减退。****『中气法』——治『积』『实』（痞块、实证）。****操作：**针入后，向深处『按』（向下压），把气『压』到深层，把积实散开。****主治：① 积块（腹中硬块）；② 实证（腹胀、便秘）。****两者正好相反：**提气（往外提，治虚冷）；中气（往里压，治积实）。**讲义强调：『一提一中，方向相反——这就是『针有方向』的意义。』**」\n\n**【极重要】提气法（提针治冷麻）vs 中气法（按针治积实）**\n\n```\n提气法：向上提 + 捻转 → 局部冷麻 / 麻木不仁 / 感觉减退\n中气法：向下按 → 积块 / 腹胀 / 便秘\n「一提一中，方向相反」\n```","o":"RJ-0095 · 《人纪·针灸》第五章「提气法（治冷麻）与中气法（治积、实）」（PDF 第 308 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"五门十变","c":"【第五章·五门十变与天干歌】讲义：「**『五门十变』是『按五行配穴』的高级方法——把十个天干分成五组（五门），每一门有『变』（相生相化）。****歌诀：**『甲己合化土，乙庚合化金，丙辛合化水，丁壬合化木，戊癸合化火。』****（这是『天干五合』）****用法举例：**病人是『甲』日发病（胆经），可以取『己』（脾经）的穴位——因为甲己合化土，胆与脾通过『土』相连。****更实用的用法：**两个穴位的五行『合化』成需要的五行。比如需要补『土』，可以取一个『火』穴 + 一个『土』穴（火生土），或者取『甲（木）+ 己（土）』合化土。****讲义强调：『五门十变是『五行配穴』的进阶——比单纯『虚则补其母』更灵活。』**」\n\n**【极重要】五门十变（天干五合）**\n\n```\n甲己合化土｜乙庚合化金｜丙辛合化水｜丁壬合化木｜戊癸合化火\n用法：两穴五行「合化」成所需之五行（比「虚补其母」更灵活）\n```","o":"RJ-0096 · 《人纪·针灸》第五章「五门十变与天干歌」（PDF 第 310–313 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"飞经引气四法","c":"【第五章·飞经引气】讲义：「**『飞经引气』是四种『催气、行气』的针法，名字都取自动物，非常形象：****① 青龙摆尾——针尖朝向病所，左右缓慢摆动（像龙摆尾）——用于『气不至』（针下没感觉）；② 白虎摇头——针身快速摇动（像虎摇头）——用于『行气』（让气快点走）；③ 苍龟探穴——针向四周探刺（像龟探头）——用于『搜气』（找气、找病所）；④ 赤凤迎源——针上下提插、左右捻转（像凤展翅）——用于『通气』（气机阻滞）。****『五脏交经法（青龙摆尾于本穴）』——讲义讲：在本穴上用青龙摆尾，能把气『交』到五脏。****『龙虎交战与龙虎升降』——『龙』（左转）与『虎』（右转）交替捻转，叫『龙虎交战』（补泻交替）；先升后降叫『龙虎升降』。****讲义强调：『这四法是『气功式』的针法——手法熟练的人，能让气『飞』起来。』**」\n\n**【极重要】飞经引气四法（青龙摆尾/白虎摇头/苍龟探穴/赤凤迎源）**\n\n```\n青龙摆尾（左右慢摆）→ 气不至\n白虎摇头（快速摇动）→ 行气\n苍龟探穴（四周探刺）→ 搜气\n赤凤迎源（提插捻转）→ 通气\n龙虎交战 = 左转右转交替（补泻交替）\n```","o":"RJ-0097 · 《人纪·针灸》第五章「飞经引气 / 青龙摆尾与白虎摇头 / 苍龟探穴与赤凤迎源 / 龙虎交战与龙虎升降」（PDF 第 313–315 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"原络治疗（主客治疗）","c":"【第五章·原络治疗】讲义：「**『原络治疗』（又叫『主客治疗』）是针灸配穴的四大法之一。****原理：**『原穴』是本经的『原气所在』（主）；『络穴』是表里经的『联络点』（客）。****配法：**本经的病，取本经的『原穴』（主）+ 表里经的『络穴』（客）。****举例：**① 肺经有病（咳嗽）→ 肺经原穴『太渊』（主）+ 大肠经络穴『偏历』（客）；② 胃经有病（胃痛）→ 胃经原穴『冲阳』（主）+ 脾经络穴『公孙』（客）。****为什么这样配？因为『原』是本经的正气，『络』是表里经的通道——先补本经（原），再从表里经借力（络），两头一起调。****讲义强调：『原络治疗是『表里同治』的标准法——内科病常用。』**」\n\n**【最重要】原络治疗（主客治疗）= 本经原穴（主）+ 表里经络穴（客）**\n\n```\n肺病：太渊（原）+ 偏历（大肠络）\n胃病：冲阳（原）+ 公孙（脾络）\n「原 = 本经正气；络 = 表里通道」\n```\n\n**「原络治疗」——「这是最精的表里同治（与 n154原络治疗」互证）。** ✓✓✓","o":"RJ-0098 · 《人纪·针灸》第五章「五俞穴治疗与原络治疗 / 主客治疗（原络治疗）」（PDF 第 322–325 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"会郄治疗","c":"【第五章·会郄治疗】讲义：「**『会郄治疗』专治『内脏痛症』——尤其是急性内脏痛。****原理：**『会穴』（八会穴）管『整体』，『郄穴』管『急性』。****配法：**脏病取『脏会』（章门）或本脏的『会穴』+ 本经的『郄穴』。****举例：**① 急性胃痛 → 中脘（胃募/腑会）+ 梁丘（胃经郄穴）；② 急性心痛 → 膻中（气会）+ 郄门（心包经郄穴）；③ 急性肺痛 → 中府 + 孔最（肺经郄穴）。****为什么用郄穴？因为『郄』是『孔隙』——经气深聚之处，善治『急症、痛症』（『郄治急』）。****讲义强调：『会郄治疗是『急痛』的标准配法——痛起来的时候，先取郄穴。』**」\n\n**【最重要】会郄治疗（内脏急痛）= 会穴/募穴 + 本经郄穴**\n\n```\n急性胃痛：中脘 + 梁丘（胃郄）\n急性心痛：膻中 + 郄门（心包郄）\n急性肺痛：中府 + 孔最（肺郄）\n「郄治急」\n```\n\n**「郄治急」——「这是最精的郄穴主治（十六郄穴皆治急症）。」** ✓✓✓","o":"RJ-0099 · 《人纪·针灸》第五章「俞募治疗（内科病）与会郄治疗（内脏痛症）/ 会郄治疗」（PDF 第 326 页）。"},{"t":"针灸·第五章（上）：奇经八脉、烧山火透天凉与治痞针法","h":"子午捣臼法","c":"【第五章·子午捣臼法】讲义：「**『子午捣臼』是治『水胀』（水肿、腹水）的特殊针法。****操作：**『九入六出』——针向深处捣九次（入），向浅处捣六次（出），像『捣臼』（用杵在石臼里捣东西）一样上下捣动。****为什么叫『子午』？**子为阴（水），午为阳（火）——一阴一阳交替捣动，能『通水』。****主治：水肿、腹水、小便不利。****原理：**捣动能让经气上下流通，『水』就会动起来（『气行则水行』）。****『九入六出』——九为阳数（入），六为阴数（出），阴阳交替。****讲义强调：『子午捣臼是治『水』的专法——水肿的病人，用它。』****（须「强「标」）但腹水（尤其肝性腹水、心衰腹水）须规范治疗（利尿剂、限盐、穿刺），针灸只是辅助。**」\n\n**【极重要】子午捣臼法（九入六出治水胀）**\n\n```\n九入六出（阳入阴出）→ 像捣臼上下捣动\n主治：水肿 / 腹水 / 小便不利\n原理：气行则水行\n```\n\n**须「强「标」**：**「①腹水须规范治疗（利尿/限盐/穿刺）；②须查心/肝/肾；③针灸为辅助」** ✓✓✓","o":"RJ-0100 · 《人纪·针灸》第五章「子午捣臼法（九入六出治水胀）」（PDF 第 319 页）。"},{"t":"针灸·第六章：针灸治症系列、回阳九针与十三鬼穴","h":"针灸疗程与针后禁忌","c":"【第六章·针灸疗程与针后禁忌】讲义：「**针灸的疗程怎么定？**『急性病——每天一次，连针 3–5 天；慢性病——隔天一次，10 次为一个疗程，疗程间休息 3–5 天。』****『针后禁忌』——讲义强调：**① 针后 2 小时内不要碰冷水、不要吹风（毛孔开着，易受寒）；② 针后不要马上剧烈运动（气血在重新分布）；③ 针后不宜过饱或过饥；④ 针后若出现『晕针』（头晕、心慌、出汗、面色苍白），立即起针、平卧、喝温水，必要时掐人中。****晕针的预防：**① 不要在病人空腹、疲劳、紧张时针；② 初次针灸用卧位；③ 手法不要太重。****讲义强调：『晕针多半是紧张 + 空腹——不是『针错了』，但要会处理。』**」\n\n**【最重要】针灸疗程 + 针后四禁 + 晕针处理**\n\n```\n疗程：急性每天×3–5 天；慢性隔天×10 次/疗程，间休 3–5 天\n针后：避冷水吹风 / 不剧烈运动 / 不过饱过饥\n晕针处理：起针 → 平卧 → 温水 → 掐人中\n```\n\n**须「强「标」**：**「①晕针须与过敏/心律事件鉴别；②持续不缓解须120；③针具须一次性/无菌」** ✓✓✓","o":"RJ-0101 · 《人纪·针灸》第六章「针灸疗程与针后禁忌」（PDF 第 348 页）。"},{"t":"针灸·第六章：针灸治症系列、回阳九针与十三鬼穴","h":"面部中风与起因","c":"【第六章·面部中风】讲义：「**『面部中风』（面瘫）——口眼歪斜（一侧脸不能动）。****讲义讲起因：**『吹到风』——睡觉时对着风扇/冷气吹，或者骑摩托吹风。****面瘫的针灸治疗（黄金期 = 发病 1–2 周内）：****① 地仓透颊车（健侧/患侧交替）；② 翳风（耳后，祛风）；③ 合谷（面口合谷收」）；④ 太冲（疏肝）；⑤ 阳白、四白（眼睑不能闭）；⑥ 颊车、下关（口角歪斜）。****注意：**『早期不宜强刺激』——急性期用轻刺激、浅刺，恢复期才加电针、强刺激。****讲义强调：『面瘫要早治——1 个月内是黄金期，超过 3 个月恢复就慢了。』****（须「强「标」）面瘫须先排除『中枢性面瘫』（脑卒中）——如果只是下半脸歪、额纹还在、闭眼正常，那是中枢性（危险）；如果整个半脸都歪、眼闭不上、额纹消失，那是周围性（面神经炎，Bell 麻痹）。**\n\n**【极重要】面部中风（面瘫）针刺方案 + 中枢/周围鉴别**\n\n```\n穴位：地仓透颊车 / 翳风 / 合谷 / 太冲 / 阳白四白（眼）/ 下关（口）\n急性期轻刺激，恢复期加电针；黄金期 1 个月\n鉴别：整个半脸歪+眼闭不上+额纹消失 = 周围性（Bell）\n     仅下半脸歪+额纹在+能闭眼 = 中枢性（卒中，急！）\n```\n\n**须「绝「对「强「标」**：**「①面瘫须先排卒中（中枢性）；②中枢性须立即急诊；③贝尔麻痹72h内激素改善预后；④须保护眼角膜」** ✓✓✓\n\n**「中枢 vs 周围」鉴别**——**这是最精的面瘫分诊（额纹是关键）。** ✓✓✓","o":"RJ-0102 · 《人纪·针灸》第六章「面部中风与起因」（PDF 第 335 页）。"},{"t":"针灸·第六章：针灸治症系列、回阳九针与十三鬼穴","h":"回阳九针","c":"【第六章·回阳九针】讲义：「**『回阳九针』是针灸的『急救九穴』——用于阳气暴脱（突然昏倒、四肢冰冷、脉微欲绝）。****九个穴位：**① 哑门；② 劳宫；③ 三阴交；④ 涌泉；⑤ 太溪；⑥ 中脘；⑦ 环跳；⑧ 足三里；⑨ 合谷。****（歌诀：『哑门劳宫三阴交，涌泉太溪中脘接，环跳三里合谷并，此是回阳九针穴。』）****为什么这九个？**它们覆盖了头（哑门）、手（劳宫、合谷）、足（涌泉、太溪）、腹（中脘）、下肢（环跳、足三里、三阴交）——从上到下、从阴到阳，把全身的阳气『拉回来』。****讲义强调：『回阳九针是『最后的针法』——但（须「绝「对「强「标」）它的前提是：先做 CPR、先打 120、先建立静脉通路。针灸绝不可用来替代心肺复苏！**」\n\n**【最重要】回阳九针（急救九穴歌诀）**\n\n```\n哑门 / 劳宫 / 三阴交 / 涌泉 / 太溪 / 中脘 / 环跳 / 足三里 / 合谷\n覆盖：头 → 手 → 足 → 腹 → 下肢（全身上下、阴阳相接）\n```\n\n**须「绝「对「强「标」**：**「①首先CPR + 120 + 静脉通路；②针灸绝不可替代心肺复苏；③每延迟1minCPR存活率下降7–10%；④须AED」** ✓✓✓","o":"RJ-0103 · 《人纪·针灸》第六章「回阳九针」（PDF 第 369 页）。"},{"t":"针灸·第六章：针灸治症系列、回阳九针与十三鬼穴","h":"十三鬼穴","c":"【第六章·孙真人针十三鬼穴歌】讲义：「**『十三鬼穴』是唐代孙思邈传下的十三个穴位，专治『癫狂、发狂奔走、中邪』（即今天的精神分裂、躁狂、癫痫发作）。****十三穴：**① 鬼宫（人中/水沟）；② 鬼信（少商）；③ 鬼垒（隐白）；④ 鬼心（大陵）；⑤ 鬼路（申脉）；⑥ 鬼枕（风府）；⑦ 鬼床（颊车）；⑧ 鬼市（承浆）；⑨ 鬼窟（劳宫）；⑩ 鬼堂（上星）；⑪ 鬼藏（会阴/男为阴下、女为玉门头）；⑫ 鬼臣（曲池）；⑬ 鬼封（舌下中缝）。****为什么叫『鬼』？因为古人认为癫狂是『鬼邪作祟』——这个名字反映了古代的鬼神观念，但穴位本身有实际作用（安神、开窍、清热）。****讲义强调：『十三鬼穴是治『神志病』的一套完整方案——从头顶到脚、从阴到阳。』****（须「绝「对「强「标」）精神分裂、躁狂发作必须用抗精神病药物，急性期须住院；针灸只能辅助，绝不可替代药物，更不能『驱鬼』延误治疗。**」\n\n**【最重要】十三鬼穴（孙思邈传，治癫狂/神志病）**\n\n```\n鬼宫（人中）/ 鬼信（少商）/ 鬼垒（隐白）/ 鬼心（大陵）/ 鬼路（申脉）/ 鬼枕（风府）\n鬼床（颊车）/ 鬼市（承浆）/ 鬼窟（劳宫）/ 鬼堂（上星）/ 鬼藏（会阴）/ 鬼臣（曲池）/ 鬼封（舌下）\n```\n\n**须「绝「对「强「标」**：**「①精神分裂/躁狂须抗精神病药 + 住院；②针灸仅辅助；③绝不可『驱鬼』延误；④自伤/伤人风险须急诊」** ✓✓✓\n\n**「十三鬼穴」须去鬼名而取穴用**——这是最需分级标注的古法。** ✓✓✓","o":"RJ-0104 · 《人纪·针灸》第六章「孙真人针十三鬼穴歌 / 十三鬼穴：癫痫发狂奔走中邪」（PDF 第 370–371 页）。"},{"t":"针灸·第六章：针灸治症系列、回阳九针与十三鬼穴","h":"灵龟八法与子午流注","c":"【第六章·灵龟八法】讲义：「**『灵龟八法』是『按时取穴』的高级方法——根据日期、时辰推算该取哪个穴位。****原理：**用『九宫八卦』配『八脉交会穴』（公孙、内关、临泣、外关、后溪、申脉、列缺、照海）。****推算：**根据日干、时干算出『开穴』——比如某日某时『公孙』开，就取公孙。****『灵龟八法与子午流注』——两个都是『时间针法』：**① 灵龟八法——按『日+时』推算八脉交会穴；② 子午流注——按『日+时』推算五输穴（井荥俞经合）。****讲义强调：『这两种是『择时针灸』——古人对『时间与气血』关系的研究。』****（须「强「标」）现代研究对『按时取穴』的优效性证据不足——实际操作中，按『经络当令时辰』选穴（如肝经病在丑时）比复杂推算更实用，也不必因『未到开穴时辰』而延误治疗。**」\n\n**【极重要】灵龟八法与子午流注（时间针法）**\n\n```\n灵龟八法：日+时 → 八脉交会穴（公孙/内关/临泣/外关/后溪/申脉/列缺/照海）\n子午流注：日+时 → 五输穴（井荥俞经合）\n```\n\n**须「强「标」**：**「①按时取穴的优效性证据不足；②不可因时辰延误治疗；③经络当令时辰更实用」** ✓✓","o":"RJ-0105 · 《人纪·针灸》第六章「灵龟八法 / 灵龟八法与子午流注」（PDF 第 361–365 页）。"},{"t":"针灸·第六章：针灸治症系列、回阳九针与十三鬼穴","h":"耳针治疗","c":"【第六章·耳针治疗】讲义：「**耳针是在『耳朵』上扎针——因为耳朵像一个『倒置的胎儿』（耳垂=头面、耳甲=内脏、耳轮=躯干四肢）。****讲义列的四个用途：**① 醒酒（耳针『醉点』，或耳尖放血）；② 肾结石（耳『肾区』）；③ 心脏（耳『心区』）；④ 消炎（耳尖放血，退热消炎）。****耳针的优点：**方便（耳朵好找）、见效快（尤其止痛）、可贴『耳豆』（王不留行籽）长期刺激。****主治范围：**① 疼痛（各种痛，耳针止痛快）；② 失眠（耳『神门』）；③ 减肥（耳『饥点』『内分泌』）；④ 戒烟（耳『口』『肺』）。****讲义强调：『耳朵是『全身的缩影』——一个耳朵，能治全身。』****（须「强「标」）耳针须无菌操作，耳软骨血供差、易感染（『菜花耳』）；耳尖放血不适合抗凝药者。**」\n\n**【极重要】耳针（耳=倒置胎儿）+ 四大用途（醒酒/肾结石/心脏/消炎）**\n\n```\n耳垂=头面｜耳甲=内脏｜耳轮=躯干四肢\n用途：醒酒 / 肾结石 / 心脏 / 耳尖放血消炎退热\n延伸：止痛 / 失眠（神门）/ 减肥（饥点）/ 戒烟（口、肺）\n```\n\n**须「强「标」**：**「①耳软骨血供差，感染易致菜花耳；②须严格无菌；③抗凝药禁耳尖放血；④不可代替诊疗」** ✓✓","o":"RJ-0106 · 《人纪·针灸》第六章「耳针治疗：醒酒、肾结石、心脏、消炎」（PDF 第 365–369 页）。"},{"t":"针灸·第六章：针灸治症系列、回阳九针与十三鬼穴","h":"治鼻病与瘿瘤","c":"【第六章·治鼻病/瘿瘤】讲义：「**治鼻病（鼻息肉、鼻炎）：**主穴——迎香（鼻旁）、上星（前额）、合谷（面口合谷收」）、风池（祛风）。****『鼻息肉』——讲义讲：**『鼻息肉是鼻内长出的小肉块』，针灸能改善鼻塞，但（须「强「标」）大的息肉须手术切除。****『瘿瘤（甲状腺治症）』——讲义讲甲状腺肿大（瘿）：**主穴——『合谷 + 列缺 + 天突 + 臑会』（古人治瘿的经典配穴）。****为什么？**『气会膻中』，瘿是『气结』——所以要调气（合谷、列缺开肺气，天突降气，臑会散结）。****讲义强调：『瘿瘤要早治——但（须「绝「对「强「标」）甲状腺结节必须先超声分级（TI-RADS），恶性须手术；甲亢/甲减须规范药物或碘 131。针灸只能作为辅助，绝不可替代。』**\n\n**【极重要】治鼻病（迎香+上星+合谷+风池）与瘿瘤（合谷+列缺+天突+臑会）**\n\n```\n鼻病：迎香 / 上星 / 合谷 / 风池\n瘿瘤（甲状腺）：合谷 + 列缺 + 天突 + 臑会（散结降气）\n```\n\n**须「绝「对「强「标」**：**「①甲状腺结节须超声TI-RADS分级；②恶性须手术；③甲亢/甲减须规范药物；④针灸仅辅助；⑤鼻息肉大者须手术」** ✓✓✓","o":"RJ-0107 · 《人纪·针灸》第六章「治鼻病：鼻息肉鼻炎 / 瘿瘤（甲状腺治症）」（PDF 第 332–337 页）。"},{"t":"针灸·第六章：针灸治症系列、回阳九针与十三鬼穴","h":"心脏肥大胸痛与心律不整","c":"【第六章·心脏肥大/胸痛/心律不整】讲义：「**讲义列的心脏病针灸方案：****① 心脏肥大——主穴：『巨阙（心募）+ 心俞（背）+ 关元 + 内关』；② 胸痛——『内关 + 公孙 + 膻中 + 巨阙』；③ 心律不整——『内关 + 神门 + 心俞 + 少海』。****为什么用『俞募』（心俞+巨阙）？**因为心脏的病要从前后两端调（俞募治疗法）。****为什么用内关？**内关是心包经的络穴、通阴维脉——『阴维为病苦心痛』。****讲义还讲了『非置入性治疗：清除动脉血管阻塞』——用针灸（内关、心包经）改善心肌供血。****（须「绝「对「强「标」）这一说法必须严格限定：**① 急性心梗（胸痛 > 15 分钟、冷汗、濒死感）必须立即 120 + 溶栓/PCI（黄金 120 分钟）；② 冠脉狭窄 > 70% 或有症状者需要支架/搭桥；③ 针灸绝不可替代血运重建，只能作为康复期辅助（改善症状、焦虑）。**」\n\n**【极重要】心脏病针灸方案（俞募 + 内关）+「清除血管阻塞」须绝对否定**\n\n```\n心脏肥大：巨阙（心募）+ 心俞 + 关元 + 内关\n胸痛：内关 + 公孙 + 膻中 + 巨阙\n心律不整：内关 + 神门 + 心俞 + 少海\n```\n\n**须「绝「对「强「标」**：**「①急性心梗须120+溶栓/PCI；②针灸绝不可『清除血管阻塞』；③须心电图/肌钙蛋白/冠脉CTA；④不可停抗血小板/降脂药」** ✓✓✓\n\n**「非置入性清除血管阻塞」必须绝对否定**——这是全书最危险的主张之一。** ✓✓✓","o":"RJ-0108 · 《人纪·针灸》第六章「心脏肥大、胸痛与心律不整」（PDF 第 341–343 页）。"},{"t":"针灸·第六章：针灸治症系列、回阳九针与十三鬼穴","h":"妇科治症与怀孕忌针","c":"【第六章·妇科治症】讲义：「**① 月经寒实症——主穴：『关元 + 三阴交 + 血海 + 中极』（温经散寒）；② 助孕——『关元 + 三阴交 + 子宫（经外奇穴）+ 肾俞』；③ 绝孕（古法）——『石门 + 合谷 + 三阴交』（须「强「标」：现代绝不可用于绝育，此古法不安全且不人道）；④ 痛经——『血海 + 三阴交 + 地机（痛经三穴）+ 关元』；⑤ 赤白带——『带脉 + 白环俞 + 气海 + 三阴交』；⑥ 子宫卵巢肿瘤——『中极 + 关元 + 三阴交 + 痞根』（辅助）。****『怀孕忌针、安胎、堕胎与胎位不正』——讲义强调：**① 孕妇禁针：腹部、腰骶部、合谷、三阴交、肩井（能下胎）；② 安胎——『肾俞 + 关元（轻灸）+ 脾俞』；③ 胎位不正——灸至阴（见 n264）；④ 古法『堕胎』——（须「绝「对「强「标」）绝不可用，堕胎须正规医疗，非法堕胎有生命危险且违法。**」\n\n**【极重要】妇科治症五方 + 怀孕禁针铁律**\n\n```\n月经寒实：关元+三阴交+血海+中极\n助孕：关元+三阴交+子宫穴+肾俞\n痛经三穴：血海+三阴交+地机\n赤白带：带脉+白环俞+气海+三阴交\n孕妇禁针：腹部 / 腰骶 / 合谷 / 三阴交 / 肩井\n```\n\n**须「绝「对「强「标」**：**「①孕妇禁针腹/腰骶/合谷/三阴交/肩井；②古法『堕胎/绝孕』绝不可用（违法且危重）；③子宫卵巢肿瘤须超声/CA125评估」** ✓✓✓\n\n**「绝孕/堕胎古法」必须绝对否定**——这是全书最需要剔除的伦理风险内容。** ✓✓✓","o":"RJ-0109 · 《人纪·针灸》第六章「月经寒实症、助孕与绝孕 / 痛经、赤白带与子宫卵巢肿瘤 / 怀孕忌针、安胎堕胎与胎位不正」（PDF 第 356–361 页）。"},{"t":"针灸·第六章：针灸治症系列、回阳九针与十三鬼穴","h":"血症","c":"【第六章·血症】讲义：「**『血症（内出血与外伤出血）』——讲义分两类：****① 内出血（吐血、衄血、崩漏）：**主穴——『膈俞（血会）+ 血海 + 三阴交 + 隐白（灸，治崩漏）』；**② 外伤出血：**『直接压迫 + 局部穴位（如委中放血的反面——止血要『按』）』。****几个要点：**① 『血会膈俞』——一切血病取膈俞；② 『灸隐白止崩漏』——脾不统血，灸脾经井穴隐白能收血；③ 『汗血同源』——止血的同时要防伤津。****讲义强调：『血症的针灸是『辅助』——（须「绝「对「强「标」）大出血（呕血、咯血、便血、产后出血）必须立即急诊：止血药、内镜、输血、手术。针灸绝不可用于止大出血！』**」\n\n**【极重要】血症针灸（膈俞+血海+三阴交+灸隐白）+ 大出血须绝对急诊**\n\n```\n内出血：膈俞（血会）+ 血海 + 三阴交 + 隐白（灸，崩漏）\n「血会膈俞」「灸隐白止崩漏」「汗血同源」\n```\n\n**须「绝「对「强「标」**：**「①大出血（呕血/咯血/便血/产后）须立即急诊；②须内镜/输血/手术；③针灸绝不可止大出血；④休克须抗休克」** ✓✓✓","o":"RJ-0110 · 《人纪·针灸》第六章「血症（内出血与外伤出血）」（PDF 第 349–351 页）。"},{"t":"针灸·第六章：针灸治症系列、回阳九针与十三鬼穴","h":"消渴与盲肠炎","c":"【第六章·消渴/盲肠炎】讲义：「**『消渴·痞块与肝结石治症』——消渴（糖尿病）的针灸：**主穴『胰俞（经外奇穴，第 8 胸椎旁）+ 太溪 + 三阴交 + 关元』。****（须「绝「对「强「标」）糖尿病必须以药物（二甲双胍/胰岛素等）+ 饮食运动为核心，针灸只能辅助改善症状（神经病变、胃轻瘫），绝不可替代降糖药，更不能停胰岛素（可致酮症酸中毒）。****『盲肠炎与奔豚症』——盲肠炎（阑尾炎）：**① 诊断——『阑尾穴』（足三里下 2 寸）压痛；② 治疗——『阑尾穴 + 天枢 + 足三里 + 上巨虚』。****（须「绝「对「强「标」）急性阑尾炎是外科急症——延误可致穿孔、腹膜炎、死亡。针灸绝不可用于治疗急性阑尾炎！典型表现：转移性右下腹痛 + 麦氏点压痛 + 发热 + 白细胞升高 → 立即急诊手术。****『奔豚症』——气从少腹上冲胸咽（自觉有一股气往上冲），主穴『奔豚穴（经外奇穴）+ 关元 + 气海 + 太冲』。**」\n\n**【极重要】消渴针灸 + 急性阑尾炎须绝对急诊**\n\n```\n消渴（辅助）：胰俞（T8 旁）+ 太溪 + 三阴交 + 关元\n阑尾炎：阑尾穴压痛（诊断）→ 急腹症，须立即手术！\n奔豚：奔豚穴 + 关元 + 气海 + 太冲\n```\n\n**须「绝「对「强「标」**：**「①糖尿病须药物 + 饮食运动，绝不可停降糖药/胰岛素；②急性阑尾炎须立即手术；③延误可致穿孔/腹膜炎/死亡；④针灸绝不可治阑尾炎」** ✓✓✓\n\n**「阑尾炎绝不可针灸」必须绝对强标**——这是最可能危重的误用。** ✓✓✓","o":"RJ-0111 · 《人纪·针灸》第六章「消渴、痞块与肝结石治症 / 盲肠炎与奔豚症」（PDF 第 351–354 页）。"},{"t":"针灸·第六章（续）与附篇：各科治症、梅花针与经络记忆法","h":"梅花针","c":"【第六章·梅花针】讲义：「**梅花针（七星针）——一种『多针头的皮肤针』：一根柄上装 5–7 根小针，像梅花一样。****用法：**在皮肤上『叩刺』（轻轻敲打），不出血或微微出血。****主治：**① 皮肤病（神经性皮炎、斑秃、白癜风——叩刺局部，促进血液循环）；② 麻痹症（中风后肢体麻木、面瘫——叩刺经络）；③ 头痛（叩刺头部）；④ 失眠（叩刺背部膀胱经）。****优点：**刺激面广（一次叩一片）、疼痛轻（老人小孩能接受）、不出血（比放血安全）。****讲义强调：『梅花针是『面的刺激』——比单针的『点』覆盖更大。』****（须「强「标」）梅花针须一人一针、严格消毒（可传播血源性疾病）；皮肤破损、感染、出血倾向者禁。**」\n\n**【极重要】梅花针（七星针）= 叩刺法（面刺激）**\n\n```\n主治：皮肤病（皮炎/斑秃/白癜风）/ 麻痹症 / 头痛 / 失眠\n优点：面广、痛轻、不出血\n```\n\n**须「强「标」**：**「①须一人一针/严格消毒（血源性疾病）；②皮损/感染/出血倾向禁；③白癜风/斑秃须皮肤科」** ✓✓","o":"RJ-0112 · 《人纪·针灸》第六章「梅花针（治皮肤病麻痹症）」（PDF 第 329 页）。"},{"t":"针灸·第六章（续）与附篇：各科治症、梅花针与经络记忆法","h":"治眼证与睛中法","c":"【第六章·治眼证】讲义：「**眼科针灸：**① 『四穴放血：治视力』——在耳尖、耳后（或攒竹、太阳）放血，能改善眼部的气血循环；② 主穴——『睛明、攒竹、太阳、风池、合谷、光明』（光明是胆经络穴，『光明』这个名字就是治眼的）；③ 『睛中法』——古人治白内障的特殊针法（直接刺入眼球）。****讲义讲『睛中法』：**古法用针拨白内障（『金针拨障』），这是古代的『白内障手术』。****（须「绝「对「强「标」）①『睛中法』（直接刺眼球）在现代绝对禁止——眼球穿刺可致眼内感染、视网膜脱离、失明；② 白内障须做超声乳化手术（10 分钟、成功率高）；③ 青光眼急性发作（眼痛、头痛、虹视）是眼科急症，须立即降眼压，否则几小时可失明。****讲义强调：『眼病要早查——视力下降先查眼底。』****（这一条须整段分级：古法『睛中法』列为历史知识，严禁操作。）**」\n\n**【极重要】眼科针灸（四穴放血 + 睛明/攒竹/太阳/风池/合谷/光明）+「睛中法」须绝对禁止**\n\n```\n四穴放血（耳尖/耳后）+ 睛明/攒竹/太阳/风池/合谷/光明（胆经络穴）\n古法「睛中法」（金针拨障）→ 现代绝对禁止！\n```\n\n**须「绝「对「强「标」**：**「①绝对禁止眼球穿刺（感染/网脱/失明）；②白内障须超声乳化；③青光眼急性发作须立即降眼压；④视力下降须查眼底」** ✓✓✓\n\n**「睛中法」必须绝对禁止**——这是全书最危险的眼科古法。** ✓✓✓","o":"RJ-0113 · 《人纪·针灸》第六章「治眼证及睛中法 / 四穴放血：治视力」（PDF 第 331 页）。"},{"t":"针灸·第六章（续）与附篇：各科治症、梅花针与经络记忆法","h":"治耳症与治舌症","c":"【第六章·治耳症/治舌症】讲义：「**治耳症（耳鸣、化脓、中耳炎）：**主穴——『听宫、翳风、耳门、中渚、太溪』。****① 耳鸣——『听宫 + 翳风 + 太溪（补肾）』（肾开窍于耳）；② 中耳炎（耳流脓）——『听宫 + 翳风 + 耳尖放血』；③ 耳聋——『听宫 + 耳门 + 外关』。****『治舌症与扁桃腺炎』：**① 舌强（舌不能言）——『通里（心经络穴，治暴喑）+ 廉泉 + 金津玉液（放血）』；② 扁桃腺炎——『少商（放血）+ 商阳（放血）+ 合谷 + 颊车』。****讲义强调：『舌为心之苗——舌的病要治心（通里）；咽为肺之门户——咽喉病要治肺（少商）。』****（须「强「标」）① 中耳炎须抗生素（尤其儿童，防听力损害）；② 扁桃腺炎反复发作须耳鼻喉科评估；③ 舌强（突然说话不清）可能是脑卒中，须立即急诊（FAST）。**」\n\n**【极重要】治耳症（听宫/翳风/太溪）+ 治舌（通里/廉泉）+ 扁桃腺（少商商阳放血）**\n\n```\n耳：听宫 + 翳风 + 耳门 + 中渚 + 太溪（肾开窍于耳）\n舌：通里（心经络穴，暴喑）+ 廉泉 + 金津玉液（放血）\n扁桃腺：少商 + 商阳（放血）+ 合谷 + 颊车\n「舌为心之苗，咽为肺之门户」\n```\n\n**须「绝「对「强「标」**：**「①突然说话不清/口角歪须立即120（FAST）；②中耳炎须抗生素；③扁桃腺反复感染须专科」** ✓✓✓","o":"RJ-0114 · 《人纪·针灸》第六章「治耳症：耳鸣化脓 / 治舌症与扁桃腺炎」（PDF 第 334–336 页）。"},{"t":"针灸·第六章（续）与附篇：各科治症、梅花针与经络记忆法","h":"肺症虚实与癫痫","c":"【第六章·肺症虚实/癫痫】讲义：「**『肺症虚实』：**① 肺实证（咳嗽有力、痰黄稠、胸痛）——『肺俞 + 尺泽（泻）+ 合谷』；② 肺虚证（咳声低弱、气短、易感冒）——『肺俞 + 太渊（补）+ 足三里』。****『内伤、五脏气乱与癫痫』：**癫痫的针灸——『百会 + 人中 + 涌泉 + 合谷 + 太冲 + 丰隆（化痰）』。****『五脏气乱』——**讲义讲：五脏的气『乱』了（不是虚也不是实，是『逆乱』），要『调气』——取『膻中（气会）+ 内关 + 太冲』。****讲义强调：『癫痫是『痰'与『风'的结合——所以要化痰（丰隆）+ 熄风（太冲）+ 开窍（人中）。』****（须「绝「对「强「标」）癫痫必须用抗癫痫药（卡马西平/丙戊酸等）；① 癫痫持续状态（发作 > 5 分钟或连续发作）是急症，须立即 120 + 静脉抗癫痫药；② 针灸绝不可替代抗癫痫药，突然停药可致持续状态甚至死亡；③ 不可在发作时强行按压肢体或往口中塞东西。**」\n\n**【极重要】肺症虚实（泻尺泽 vs 补太渊）+ 癫痫（化痰熄风开窍）**\n\n```\n肺实：肺俞+尺泽（泻）+合谷｜肺虚：肺俞+太渊（补）+足三里\n癫痫：百会+人中+涌泉+合谷+太冲+丰隆（化痰熄风开窍）\n五脏气乱（调气）：膻中+内关+太冲\n```\n\n**须「绝「对「强「标」**：**「①癫痫须抗癫痫药；②持续状态须立即120；③不可骤停药；④发作时勿按压/勿塞物」** ✓✓✓","o":"RJ-0115 · 《人纪·针灸》第六章「肺症虚实 / 内伤、五脏气乱与癫痫」（PDF 第 338 页）。"},{"t":"针灸·第六章（续）与附篇：各科治症、梅花针与经络记忆法","h":"肺积水与乳癌","c":"【第六章·肺积水/乳癌】讲义：「**『肺积水与胸肋积水』：**主穴——『水分（脐上 1 寸）+ 水道 + 三焦俞 + 肾俞 + 阴陵泉』。****① 肺积水——『肺俞 + 膻中 + 水分 + 足三里』；② 胸肋积水——『期门 + 章门 + 支沟 + 阳陵泉』。****『乳癌初期与中期肿块治疗』：**讲义列的主穴——『肩井（解胸中瘀血）+ 乳根 + 膻中 + 足三里 + 太冲』；末期『灸法治疗』——灸『膏肓 + 关元 + 足三里』。****（须「绝「对「强「标」）这一整段必须严格限定：**① 乳腺肿块必须先做『乳腺超声 + 钼靶 + 穿刺活检』明确性质（BI-RADS 分级）；② 乳腺癌是恶性肿瘤，标准治疗是『手术 + 化疗/放疗/内分泌/靶向』，早期乳腺癌 5 年生存率 > 90%；③ 针灸绝不可用来『治』乳腺癌，只能作为化疗期间辅助（减轻恶心、疼痛、淋巴水肿）；④ 『只灸不手术』会延误调理时机、显著降低生存率——这是本册最危险的替代医疗主张。**」\n\n**【极重要】肺积水针灸 + 乳癌段须绝对分级（不可替代手术）**\n\n```\n肺积水：水分+水道+三焦俞+肾俞+阴陵泉（+肺俞/膻中）\n乳癌（辅助）：肩井+乳根+膻中+足三里+太冲；末期灸膏肓/关元/足三里\n```\n\n**须「绝「对「强「标」**：**「①乳腺肿块须超声 + 钼靶 + 穿刺（BI-RADS）；②乳癌须手术 + 综合治疗；③针灸仅化疗辅助；④『只灸不手术』会延误调理」** ✓✓✓\n\n**「只灸不手术」必须绝对否定**——这是本册最危险的替代医疗主张。** ✓✓✓","o":"RJ-0116 · 《人纪·针灸》第六章「肺积水与胸肋积水 / 乳癌初期与中期肿块治疗 / 肺积水乳癌末期灸法治疗」（PDF 第 340–346 页）。"},{"t":"针灸·第六章（续）与附篇：各科治症、梅花针与经络记忆法","h":"胆结石与肝病","c":"【第六章·胆结石/肝病】讲义：「**『胆结石与肝病治症』：**主穴——『胆石点（阳陵泉下）+ 阳陵泉 + 日月（胆募）+ 期门（肝募）+ 支沟 + 太冲』。****① 胆结石——『胆石点 + 日月 + 阳陵泉』；② 肝病（肝炎、肝硬化）——『肝俞 + 期门（俞募）+ 太冲 + 足三里 + 三阴交』。****为什么用俞募？**『肝俞 + 期门』是标准的俞募治疗（前后夹治）。****讲义强调：『肝病要治脾——『见肝之病，知肝传脾，当先实脾』（《金匮》），所以加『脾俞 + 足三里』。』****（须「绝「对「强「标」）① 胆囊结石有症状（胆绞痛、胆囊炎）须腹腔镜胆囊切除——这是标准治疗；② 胆管结石/梗阻性黄疸是急症（可致胆管炎、胰腺炎），须 ERCP；③ 肝病须查『肝功能 + 乙肝/丙肝病毒 + 甲胎蛋白 + 超声』；④ 针灸绝不可替代手术/抗病毒治疗。**」\n\n**【极重要】胆结石（胆石点+日月+阳陵泉）+ 肝病（肝俞+期门俞募+治脾）**\n\n```\n胆结石：胆石点 + 日月（胆募）+ 阳陵泉\n肝病：肝俞 + 期门（俞募）+ 太冲 + 足三里 + 三阴交\n「见肝之病，知肝传脾，当先实脾」→ 加脾俞/足三里\n```\n\n**须「绝「对「强「标」**：**「①有症状胆囊结石须腹腔镜切除；②胆管梗阻须ERCP；③肝病须查功/病毒/AFP；④针灸不可替代手术/抗病毒」** ✓✓✓","o":"RJ-0117 · 《人纪·针灸》第六章「胆结石与肝病治症」（PDF 第 346–348 页）。"},{"t":"针灸·第六章（续）与附篇：各科治症、梅花针与经络记忆法","h":"脾肿大胃病与腹膜炎","c":"【第六章·脾肿大/朝食暮吐/腹膜炎】讲义：「**『脾肿大与胃病治疗』：**① 脾肿大——『脾俞 + 章门（脾募）+ 足三里 + 三阴交』；② 胃病——『中脘 + 足三里 + 内关 + 公孙』。****『朝食暮吐与腹膜炎』：**① 朝食暮吐（早上吃的晚上吐出来）——讲义明确指出这是『幽门梗阻』的表现，主穴『中脘 + 内关 + 足三里 + 公孙』；② 腹膜炎——『中脘 + 天枢 + 关元 + 足三里』。****（须「绝「对「强「标」）这两条必须严格限定：**① 朝食暮吐 = 幽门梗阻的典型表现（溃疡瘢痕、肿瘤、幽门痉挛）——必须立即做『胃镜 + 腹部 CT』，完全梗阻须禁食、胃肠减压、手术；② 腹膜炎是外科急症（压痛、反跳痛、肌紧张、发热、白细胞升高）——须立即急诊手术，延误死亡率极高；③ 针灸绝不可用于腹膜炎，也不可用来『观察』幽门梗阻。**」\n\n**【极重要】脾肿大/胃病针灸 + 朝食暮吐（幽门梗阻）与腹膜炎须绝对急诊**\n\n```\n脾肿大：脾俞 + 章门（脾募）+ 足三里 + 三阴交\n胃病：中脘 + 足三里 + 内关 + 公孙\n朝食暮吐 = 幽门梗阻 → 胃镜 + CT\n腹膜炎 = 外科急症 → 立即手术\n```\n\n**须「绝「对「强「标」**：**「①朝食暮吐须立即胃镜 + 腹部CT；②腹膜炎须立即急诊手术；③针灸绝不可用于此；④延误死亡率极高」** ✓✓✓\n\n**「朝食暮吐 = 幽门梗阻」——「这是最精的症状-病理对应（与 n48 互证）。」** ✓✓✓","o":"RJ-0118 · 《人纪·针灸》第六章「脾肿大与胃病治疗 / 朝食暮吐与腹膜炎」（PDF 第 348–351 页）。"},{"t":"针灸·第六章（续）与附篇：各科治症、梅花针与经络记忆法","h":"腹痛瘀血便秘","c":"【第六章·腹痛/瘀血/便秘】讲义：「**『腹痛、瘀血与便秘』：**① 腹痛——『中脘 + 天枢 + 关元 + 足三里』（腹四针）；② 瘀血——『膈俞（血会）+ 血海 + 三阴交 + 委中（放血）』；③ 便秘——『天枢 + 支沟 + 上巨虚 + 大肠俞』。****几个要点：**① 『支沟治便秘』——支沟（三焦经）是治便秘的要穴（『支沟透天枢』）；② 『上巨虚』——大肠的下合穴（『合治内腑』）；③ 『瘀血看三处』（舌下静脉、肌肤甲错、少腹硬）。****讲义强调：『便秘分虚实——实秘（腹胀拒按、舌苔黄）用泻法；虚秘（便软难出、乏力）用补法（灸关元、足三里）。』****（须「强「标」）① 便秘伴『体重下降、便血、贫血、家族史』须肠镜排癌；② 腹痛剧烈（板状腹、反跳痛）须急诊；③ 长期用泻药可致结肠黑变病。**」\n\n**【极重要】腹痛（腹四针）+ 瘀血（膈俞血海）+ 便秘（支沟/上巨虚）**\n\n```\n腹痛：中脘 + 天枢 + 关元 + 足三里（腹四针）\n瘀血：膈俞（血会）+ 血海 + 三阴交 + 委中（放血）\n便秘：天枢 + 支沟 + 上巨虚（大肠下合穴）+ 大肠俞\n```\n\n**须「强「标」**：**「①便秘 + 体重下降/便血/贫血须肠镜；②板状腹/反跳痛须急诊；③长期泻药致结肠黑变」** ✓✓","o":"RJ-0119 · 《人纪·针灸》第六章「腹痛、瘀血与便秘」（PDF 第 353–354 页）。"},{"t":"针灸·第六章（续）与附篇：各科治症、梅花针与经络记忆法","h":"痔疮肠漏与大肠癌","c":"【第六章·血痢/痔疮/肠漏/大肠癌】讲义：「**① 血痢（细菌性痢疾、阿米巴）——『天枢 + 上巨虚 + 曲池 + 合谷』；② 痔疮——『长强 + 承山 + 二白（经外奇穴）+ 委中（放血）』；③ 肠漏（肛瘘）——『长强 + 承山 + 局部』；④ 大肠癌——『天枢 + 大肠俞 + 上巨虚 + 足三里』（辅助）。****讲义强调：『痔疮的分型——内痔（便血、不痛）、外痔（痛、有肿块）、混合痔。』****（须「绝「对「强「标」）① 血痢须粪培养 + 抗生素 + 补液（儿童/老人可致死）；② 肛瘘须手术（不手术会反复感染）；③ 大肠癌须『肠镜 + 病理』确诊，标准治疗是手术 + 化疗；④ 便血绝不能一律当『痔疮』——40 岁以上便血必须先做肠镜排癌（这是最常见的误诊路径）。**」\n\n**【极重要】痔疮（长强+承山+二白）+ 大肠癌须绝对强标**\n\n```\n血痢：天枢 + 上巨虚 + 曲池 + 合谷\n痔疮：长强 + 承山 + 二白（奇穴）+ 委中（放血）\n肛瘘：长强 + 承山 + 局部\n大肠癌（辅助）：天枢 + 大肠俞 + 上巨虚 + 足三里\n```\n\n**须「绝「对「强「标」**：**「①40岁以上便血须先肠镜排癌；②大肠癌须手术 + 化疗；③肛瘘须手术；④血痢须抗生素 + 补液；⑤勿将便血一律当痔」** ✓✓✓\n\n**「便血勿一律当痔」——「这是最精的防误诊警告（最常见延误路径）。」** ✓✓✓","o":"RJ-0120 · 《人纪·针灸》第六章「血痢、痔疮、肠漏与大肠癌」（PDF 第 355 页）。"},{"t":"针灸·第六章（续）与附篇：各科治症、梅花针与经络记忆法","h":"定喘穴与十二经络记忆法","c":"【第六章·定喘穴 + 附篇】讲义：「**『奇穴：大椎外五分定喘穴』——在大椎穴旁开 0.5 寸。****主治：**① 哮喘（发作时平喘）；② 咳嗽；③ 肩背痛。****用法：**直刺 0.5–1 寸，或艾灸。****『附：刘医生学习整理——十二经络这样记，一目了然』**讲义附了一个极实用的记忆法：****① 手三阴（肺、心包、心）——都在上肢『内侧』，从胸走手；② 手三阳（大肠、三焦、小肠）——都在上肢『外侧』，从手走头；③ 足三阳（胃、胆、膀胱）——都在下肢『外侧/前侧』，从头走足；④ 足三阴（脾、肝、肾）——都在下肢『内侧』，从足走腹。****这个『内外、手足、走向』的三维记忆法，是十二经最快的学习路径。****讲义强调：『十二经不要死背——记住『阴内阳外、阴升阳降』，就记住一半了。』**」\n\n**【最重要】定喘穴（大椎旁 0.5 寸）+ 十二经络三维记忆法**\n\n```\n定喘（大椎旁 0.5 寸）：哮喘 / 咳嗽 / 肩背痛\n记忆法：手三阴（内侧，胸→手）｜手三阳（外侧，手→头）\n       足三阳（外侧，头→足）｜足三阴（内侧，足→腹）\n「阴内阳外」\n```\n\n**「阴内阳外」——「这是最精的十二经记忆钥匙。」** ✓✓✓","o":"RJ-0121 · 《人纪·针灸》第六章「奇穴：大椎外五分定喘穴 / 附：刘医生学习整理」（PDF 第 365、376–400 页）。"},{"t":"针灸·第六章（续）与附篇：各科治症、梅花针与经络记忆法","h":"针灸大成全书总结","c":"讲义总结「**针灸的核心精神**」：「**① 针灸是『外治』——通过体表（经络、穴位）调节内脏，不动刀、不吃药；② 针灸的灵魂是『气』——『得气』才有效，『气至而有效』；③ 针灸的关键是『辨虚实』——补泻反了，病必加重；④ 针灸的价值是『简便廉验』——一根针、几根艾条，能救急、能止痛、能调慢病；⑤ 针灸的边界是『该手术的要手术、该吃药的要吃药』——针灸是医学的一部分，不是全部。****全书 411 页、约 43.3 万字，从『针灸使用时机』到『十三鬼穴』，覆盖了针灸的全部基础与临床。****讲义最后强调：『针灸学到最后，不是记住多少个穴，而是明白『气怎么走、病在哪里、针往哪里去』——这才是针灸的心法。』**」\n\n**【最重要】针灸大成五大核心精神**\n\n```\n① 外治（体表调内脏）\n② 气（得气才有效）\n③ 辨虚实（补泻不可反）\n④ 简便廉验\n⑤ 边界（该手术手术、该吃药吃药）\n```\n\n**须「强「标」**：**「①针灸为医学一部分，不可替代急救/手术/药物；②须执业资质 + 无菌操作；③须结合现代诊断」** ✓✓\n\n**「气怎么走、病在哪里、针往哪里去」——「这是全书最精的针灸心法。」** ✓✓✓","o":"RJ-0122 · 《人纪·针灸》全书总结（PDF 第 1–411 页）。"}];</script>
