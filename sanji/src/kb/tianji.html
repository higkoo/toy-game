\"：\"**虽居下位之人，能永持中正之道，久必有亨；更加有明君在上，虽位远，但必因同德受福。**\" **两爻构成了\"刚起步的人\"的完整路径**：**初爻\"摧如\"（被压制、升不上去）→\"宽裕不求\"（不急、不索求）→\"以待上位之信\"**；**第二爻\"愁如\"（忧愁、无人援引）→\"守正\"\"日久彰显\"→\"因德同也\"（因为德行相同而被上级看见）。** **须说明**：**这是《易经》原文（晋初六、六二）**；**\"晋如摧如\"的\"摧\"是\"折、抑\"**（**即：想往上走，却被压住**）；**\"罔孚\"是\"还未得到信任\"**；**其可用的核极准**：**\"上位未能遽信\"是正常规律，不是不公**——**而\"小人始进而求上信，则必伤于义\"是它的反面**（**急着让人信任，就会做出违义的事**）。","o":"TJ-0407 · 天纪·人间道·晋卦·初、二爻（PDF 第88页）"},{"t":"一百四十八、晋卦六爻","h":"第三爻：\"众允，悔亡\"","c":"风险——第三爻\"**众允，悔亡**\"。其解：\"**柔居刚位，又不中正——此乃居不适位时，必有悔咎。惟居此时，能'明谋从众、顺应天心'，吉。**\"其\"象\"：\"**能顺从众志，居下位之上，又上从明君，合于众志。**\" **第三爻的位置很尴尬**：**\"柔居刚位，又不中正\"——能力不够却占了要位**，**\"此乃居不适位时，必有悔咎\"。** **而它的补救只有一条**：\"**明谋从众**\"（**公开地、明智地依靠众人的意见**）。**须说明**：**这是《易经》原文（晋六三）**；**\"众允\"是\"众人认可\"**；**其可用的核很实在**：**当一个人\"位置高于能力\"时，唯一的正解是\"从众\"**——**不是\"装作能行\"，也不是\"硬撑\"，而是\"把判断权交给众人\"**；**而\"悔亡\"（悔恨消失）是它的结果**（**即：承认自己不行、按大家的意思做，反而没有悔**）。","o":"TJ-0408 · 天纪·人间道·晋卦·第三爻（PDF 第88页）"},{"t":"一百四十八、晋卦六爻","h":"第四、五爻：\"晋如鼫鼠\"与\"失得勿恤\"","c":"风险——**第四爻\"晋如鼫鼠，贞厉\"**。其解：\"**阳刚居阴位，非适其位而居之，乃'贪据其位'——贪而畏人者，鼫鼠也。近君之位又不适，下位又求上进，居此时生畏忌之心，必生危矣。**\"其\"象\"：\"**不正又居高位，时怀贪而惧失之心，坚守此不放，招危险也。**\" **第五爻\"悔亡，失得勿恤，往吉，无不利\"**，是全卦最重要的管理判断：\"**柔居尊位，乃不正位，本凶；但用'大明之德'而上下皆附顺，故反吉。因下之顺附，必能尽诚委任众人之才，以济天下。明君不患其不能明照，患其'用明'之过于察察、有失委任之道——自任其明而以私意偏任，天下必无法为公。**\"其\"象\"：\"**有明之君、下又上附顺，能推诚委任，必能成天下之大功，往必有福也。**\" **\"明君不患其不能明照，患其'用明'之过于察察\"这一句，是全书最高级的一条管理判断**：**领导者的危险不是\"看不清\"，是\"看得太清\"**——**\"察察\"（事无巨细都要察）会\"有失委任之道\"**；**而\"自任其明而以私意偏任，天下必无法为公\"是它的后果**（**即：一切凭自己判断，公事就变成了私事**）。** 而\"失得勿恤\"（不要计较一时得失）是它的态度要求**。**须说明**：**这是《易经》原文（晋九四、六五）**；**\"鼫鼠\"（shí shǔ）是\"贪而畏人\"的鼠**（**取\"贪据其位\"而\"惧失\"两义**）；**其可用的核**：**\"贪据其位\"与\"贪而畏人\"是一件事的两面**——**因为怕失去，所以抓得更紧；抓得越紧，越危险**（**\"坚守此不放，招危险也\"**）。","o":"TJ-0409 · 天纪·人间道·晋卦·第四、五爻（PDF 第88页）"},{"t":"一百四十八、晋卦六爻","h":"上爻：\"晋其角\"","c":"风险——上爻\"**晋其角，维用伐邑，厉吉，无咎，贞吝**\"。其解：\"**阳刚又居最上，如角之象——此言进之极。过刚则易失于躁急，本刚又急于求进，必有失也。此惟有用之于'治内'（伐邑）可以无患；但如用其'治外'，反凶。观人之自治：能刚之人守道必固，求进躁急之人必迁善益速——唯须合中正之道，可无咎。**\"其\"象\"：\"**尽善之道，能安内攘外；今维用'伐邑'，能治内不能治外，其道未光大也。**\" **\"维用伐邑\"（只能用来整治自己的封邑）是这一爻的限定**：**\"进之极\"+\"过刚躁急\"的人，\"治内\"还行，\"治外\"反凶。** **而\"能刚之人守道必固，求进躁急之人必迁善益速\"这两句，是对两种气质的精准描述**：**刚的人\"守得住\"（但可能过 stiff）；躁急的人\"改得快\"（但可能守不住）**——**而\"唯须合中正之道\"是两者的共同要求。** **须说明**：**这是《易经》原文（晋上九）**；**\"伐邑\"在此作\"整治自己的领地\"解**（**即\"对内部\"**），**与\"征伐外国\"的\"治外\"对举**；**其可用的核**：**\"能治内不能治外，其道未光大\"**——**即：一个人如果只能管好自己的一摊，还称不上\"光大\"**（**而反过来，\"攘外必先安内\"式的强人，往往连\"内\"也没改善**）。","o":"TJ-0410 · 天纪·人间道·晋卦·上爻（PDF 第88页）  ---"},{"t":"一百四十九、明夷：明入地中","h":"卦序：物进不已，必有所伤","c":"定义——明夷卦（地火明夷）为\"**凤凰重翼之课，出明入暗之象**\"，其卦序讲义给了极简一句因果：\"**物进不已，必有所伤，故明夷为序卦——夷者，伤也。**\" **而它把明夷与晋的关系说得很清楚**：\"**此卦坤上离下，乃明入地中之象，为晋之反卦，故义亦反：晋为明且盛、上明君下群贤并进之时；明夷乃暗君在上、明者见伤之时，日入于地中象。**\" **\"物进不已，必有所伤\"六个字，是\"晋→明夷\"的枢纽**：**一直往前冲，必然受伤**——**即：明夷不是\"突然的灾\"，是\"进\"的必然代价。** **须说明**：**这是讲义对明夷卦序的注解**；**\"晋\"与\"明夷\"互为反卦（一个\"明出地上\"，一个\"明入地中\"）**——**两卦合起来，正好是\"明\"的升与降。** **卦图九物**：**①\"妇人在井中：女人招灾，或颈部灾，家内有灾\"**；**②\"虎在外：外人虎视眈眈\"**；**③\"钱缺：财伤也\"**；**④\"人逐鹿：财失也，争相为禄，逐鹿中原\"**；**⑤\"堠在人鹿中：猴作梗也\"**；**⑥\"尺也，工匠独有，匠，将也，武官人\"**；**⑦\"堠：不动也，尊位也\"**；**⑧\"鹿回头：回禄也，火灾\"**；**⑨\"人手上木枝：休象\"**——**而总断是\"见此课，必伤且凶矣\"。** **须说明**：**\"堠\"（hòu）是古代记里程的土堆**（**取\"不动\"\"尊位\"义**）；**\"猴作梗\"\"姓侯肖猴\"属象数谐音取象**，本集只记不解。","o":"TJ-0411 · 天纪·人间道·明夷卦（PDF 第89页）"},{"t":"一百四十九、明夷：明入地中","h":"卦辞：\"利艰贞\"——艰与贞两件事","c":"要点——明夷卦辞只有三个字：\"**明夷：利艰贞**\"，其解：\"**君子处明夷之时，须知时之艰难，必求不失正道，方为君子。小人则阿谀奉承、唯利是图、顺附势而为，不顾正道。**\" **\"艰\"与\"贞\"是两件事，也是一件事的两面**：**\"艰\"是\"知道难\"（如实承认处境的艰难）；\"贞\"是\"守住正\"（不因难而丢掉正）**——**两者缺一，\"君子\"就不成立。** **而小人的三种做法被列得极清楚**：**\"阿谀奉承\"\"唯利是图\"\"顺附势而为\"**——**三者的共同点是\"不顾正道\"**（**即：把\"正\"让位给了\"利\"与\"势\"**）。**须说明**：**\"明夷：利艰贞\"是《易经》原文**；**其可用的核极直接**：**在不利的环境里，\"好过\"与\"正确\"往往冲突**——**而\"利艰贞\"的意思不是\"应该牺牲\"，是\"承认难、但不改标准\"**（**\"贞\"是\"正\"的坚持，\"艰\"是\"难的承认\"，两者同时成立才叫\"处明夷\"**）。","o":"TJ-0412 · 天纪·人间道·明夷卦（PDF 第89页）"},{"t":"一百四十九、明夷：明入地中","h":"彖：\"内文明而外柔顺\"——文王以之","c":"方法——明夷\"彖\"为\"**明入地中，明夷，内文明而外柔顺，以蒙大难，文王以之**\"，其解：\"**君子处明夷之时，知'明者必见伤'，故求'内明外顺'之态势，应对大难之时——如此可内不失明、外又可远祸患。《易》之妙即在此，卦之德本亦卦之解也。**\" **\"内明外顺\"四个字，是明夷的核心方法**：**里面\"明\"（看得清、想得明），外面\"顺\"（不顶撞、不显锋芒）**——**其目的极清楚：\"内不失明，外又可远祸患。\"** **而\"卦之德本亦卦之解也\"这一句，是讲义给出的《易经》读法**：**卦的\"德\"（性质）和卦的\"解\"（读法）本来就是一回事**——**即：读卦不是\"解释它\"，是\"照着它做\"。** **须说明**：**\"明入地中，明夷，内文明而外柔顺，以蒙大难，文王以之\"是《易经》原文**；**\"文王以之\"指周文王被囚羑里而能以\"内明外顺\"自处**（**而本卦占例正是\"文王囚羑里\"**）；**须补一句**：**\"内明外顺\"是一种\"自保\"，不是\"伪装\"**——**它的前提是\"内不失明\"（里面没变），只是外面不露**（**若里面也变了，那就是\"顺附势而为\"，属小人**）。","o":"TJ-0413 · 天纪·人间道·明夷卦（PDF 第89页）"},{"t":"一百四十九、明夷：明入地中","h":"\"晦其明也\"——箕子以之","c":"要点——明夷\"彖\"后半为\"**利艰贞，晦其明也，内难而能正其志，箕子以之**\"，其解：\"**处艰难时，能知'晦藏其明'——不知藏晦，必生祸患；不能守正，必非贤人。**\" **\"晦其明\"三个字，是明夷的行为要求**：**\"晦\"（藏）的是\"明\"（自己的明亮、才能、判断）**——**而\"内难而能正其志\"是它的内核：外面藏，里面正。** **须说明**：**这是《易经》原文（明夷彖）**；**\"箕子以之\"指箕子（商纣王的叔父）在纣王暴虐时\"佯狂为奴\"而守其志**——**即：装疯以避祸，但不改其志**；**而\"不知藏晦，必生祸患；不能守正，必非贤人\"这两句，是讲义给的两条判据**：**前者说\"藏\"的必要（不藏就出事），后者说\"正\"的必要（不守正就不算贤人）**——**两者合起来才是\"晦其明\"**（**只藏不正＝顺从；只正不藏＝招祸**）。","o":"TJ-0414 · 天纪·人间道·明夷卦（PDF 第89页）"},{"t":"一百四十九、明夷：明入地中","h":"象：\"用晦而明\"——水至清则无鱼","c":"方法——明夷\"象\"为\"**明入地中，明夷；君子以莅众，用晦而明**\"，是全卦最实用的一条。其解：\"**君子观明入地中、明夷之道，乃知'不极其明察而用晦'之道——于莅众之时（面对众人、治理众人），如此必能容物和众、众亲而安。犹'水至清则无鱼，人至明则无徒'亦然。**\" **\"用晦而明\"这四个字，讲的是\"管理众人时的一个反常识要求\"**：**\"不极其明察\"**——**不是\"看不清\"，是\"不把一切都摊开、不把每个人都看穿\"。** **而其机制写得极准**：**\"如此必能容物和众、众亲而安\"**——**因为人受不了\"被彻底看透\"**。** 而\"水至清则无鱼，人至明则无徒\"这个比喻，是它的自然根据**：**水太清，鱼无处藏，就没有鱼；人太明察，别人无处容身，就没有人跟着你。** **须说明**：**\"明入地中，明夷；君子以莅众，用晦而明\"是《易经》原文**；**\"用晦而明\"与\"咸卦虚受人\"\"大壮非礼弗履\"是一组**：**三处都在讲\"力量的克制\"**（**咸卦讲\"心里留空位\"，大壮讲\"不做\"，明夷讲\"不全看清\"**）。**⚠ 须限定一句**：**\"用晦\"的适用场合是\"莅众\"（待人、治众），不是\"判断事实\"**——**凡涉及是非判定、风险认定、责任追究，\"明察\"必须做足**（**这与\"贲卦明庶政无敢折狱\"是同一条边界**）：**该看清的地方不能\"用晦\"，该\"用晦\"的地方不必看清。**","o":"TJ-0415 · 天纪·人间道·明夷卦（PDF 第89页）"},{"t":"一百五十、六爻（明夷卦用晦而明）","h":"初爻：\"明夷于飞，垂其翼\"","c":"方法——初爻\"**明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言**\"。其解：\"**明夷之初，乃见伤之始——暗君在上，阳刚之人不得上进，犹鸟飞而伤翼；小人害君子，皆害其'所以行'。君子之人能见事于微末，始见伤则避之——即令困穷亦退避之，取适之位而往，绝不以世俗之见而迟疑所行也。常人无法见伤于始，不知退避，至伤于己时，已不能退也。**\"其\"象\"：\"**义之所至，即令困穷，亦不所为不正，故君子能安之于苦闷。**\" **\"小人害君子，皆害其'所以行'\"这一句极精**：**小人要毁一个人，不毁他的\"人\"，毁他的\"能行\"（做事的能力与条件）**——**因为\"人\"毁不掉，\"行\"可以卡住。** **而\"垂其翼\"（垂下翅膀）就是\"飞不了了\"**。** 而\"常人无法见伤于始，不知退避，至伤于己时，已不能退也\"是它的关键**：**伤害刚发生时是最好退的，但大多数人\"看不见\"或\"不承认\"**——**等到\"伤于己\"（伤到自己身上），已经退不了了。** **须说明**：**这是《易经》原文（明夷初九）**；**\"三日不食\"是形容困窘**（**不是\"绝食\"**）；**\"主人有言\"指\"主事的人会有话说（即被责备）\"**——**即：退避会招来非议，但仍要退**；**其可用的核是\"微末\"二字**：**能不能\"见事于微末\"，决定了还有没有退路。**","o":"TJ-0416 · 天纪·人间道·明夷卦·初爻（PDF 第90页）"},{"t":"一百五十、六爻（明夷卦用晦而明）","h":"第二、三爻：\"用拯马壮\"与\"明夷于南狩\"","c":"方法——**第二爻\"明夷，夷于左股，用拯马壮，吉\"**。其解：\"**六二乃阴居阴位，得中正之德，顺时知处，乃至善也；但处明夷之时，亦不免有所损伤——但须如马之壮，可获免伤而吉；如自处之道不壮，则伤之深矣。**\"其\"象\"：\"**顺处且有原则，合于中正之道，故必能处明伤之时，而能保吉也。**\" **第三爻\"明夷于南狩，得其大首，不可疾贞\"**，是全卦最有政治智慧的一爻：\"**因上卦暗极，而又正居明之极——明即将与暗冲突之时也。居此，君子必前进除害，以获之魁首为要务；至于旧疾败俗，必不能立刻改变——须知渐进之道，教其渐改；如求剧革，必令不安，非上策也。**\"其\"象\"：\"**用下位之明，来除上位之暗，唯求目的在除害而已；如不然则为背乱之事也。**\" **第二爻的\"用拯马壮\"（借助强壮的马来救助）讲的是\"自救要有力量\"**：**\"如自处之道不壮，则伤之深矣\"**——**即：处境不利时，\"自己够不够强\"决定了伤得深不深**；**而\"顺处且有原则\"是它的分寸**（**\"顺处\"（顺着处境）但不能丢\"原则\"**）。** 而第三爻的\"不可疾贞\"（不可以急于彻底变革）极清醒**：**\"旧疾败俗，必不能立刻改变\"**——**\"如求剧革，必令不安，非上策也。\"** **须说明**：**这是《易经》原文（明夷六二、九三）**；**\"南狩\"是古代君王的冬季狩猎（一说\"南\"为\"向明\"）**，**此处取\"去除害\"义**；**其可用的核有两条**：**①\"除害以获魁首为要务\"（抓主要，不及其余）**；**②\"唯求目的在除害而已，如不然则为背乱之事也\"（正当性的界限——超出\"除害\"的目的，\"明\"就成了\"乱\"）**——**这两条合起来，是\"改革者的分寸\"。**","o":"TJ-0417 · 天纪·人间道·明夷卦·第二、三爻（PDF 第90页）  ---"},{"t":"一百五十一、明夷后三爻","h":"第四爻：\"入于左腹\"——柔邪之交如何结于上","c":"风险——明夷第四爻\"**入于左腹，获明夷之心，于出门庭**\"。其解：\"**此爻意阴邪之小人，处近君之位，乃以柔顺附于君主时——为保其固交，乃以'柔邪之法、隐敝之交'而结于上。而君本阴邪之人，必受蛊惑其心，而行之于外。故君必求明、守正道，而不为小人所煽动、所利用也，即此。**\"其\"象\"：\"**此以邪恶之'阴道'惑于君心、而逞其私欲；君为小人，必始终不悟也。**\" **\"以柔邪之法、隐敝之交而结于上\"这一句，是\"如何蛊惑上级\"的机制描述**：**不是明着讨好，是\"隐敝之交\"（不公开的、私下的结交）**——**而这种\"交\"一旦结成，\"君必受蛊惑其心\"。** **须说明**：**这是《易经》原文（明夷六四）**；**\"入于左腹\"（进入左边的腹部）在原文中喻\"深入其内、获知其心\"**（**\"左腹\"是较隐蔽、较深处**）；**其可用的核极实用**：**判断一个组织是否被\"柔邪之交\"侵入，看有没有\"不公开的关系\"**——**而\"君必求明、守正道\"是它的解法**（**即：唯一防法是主事者自己\"明\"且\"守正\"**，**因为\"隐敝之交\"无法从外部查，只能从内部防**）。","o":"TJ-0418 · 天纪·人间道·明夷卦·第四爻（PDF 第90页）"},{"t":"一百五十一、明夷后三爻","h":"第五、上爻：\"箕子之明夷\"与\"初登于天，后入于地\"","c":"要点——**第五爻\"箕子之明夷，利贞\"**：\"**此爻言'暗伤至极'，乃谓'明见伤'之主——若于此时显示其明，必见伤害。要如箕子之知晦藏，则可免于难；若不知晦藏其明，则害大矣。**\"其\"象\"是全卦最深的一句：\"**箕子知晦藏其明于暗伤之时，且能不失意志——同与阴暗之人合污，其明必能不灭；小人若受祸患所逼，必失其节守也。**\" **\"同与阴暗之人合污，其明必能不灭\"这一句，是个极高的示范**：**箕子\"佯狂为奴\"，表面上和黑暗的人混在一起，但\"其明不灭\"**——**即：形式上的\"合污\"，与内里的\"不灭\"，可以同时成立。** **而上爻\"不明晦，初登于天，后入于地\"**：\"**明之至高而又伤于此时，本可远照；今伤于明，必不明反昏悔，反失其道也。**\"其\"象\"：\"**始登于天，能明照四方；今伤于昏暗，反失其道。**\" **\"初登于天，后入于地\"是全卦最陡的一段落差**：**从\"照四国\"到\"入于地\"**——**而讲义把原因归在\"不明反昏悔\"**（**即：不是被打下去的，是自己\"昏\"了**）。**须说明**：**这是《易经》原文（明夷六五、上六）**；**\"不明晦\"（不明而晦）与\"用晦而明\"恰成一对**：**\"用晦\"是\"里面有明、外面藏\"；\"不明晦\"是\"里面没明、外面也暗\"**——**两者外形相似，实质相反。** **其可用的核**：**\"藏\"的前提是有东西可藏**——**没有\"明\"的人去\"用晦\"，只是\"暗\"而已。**","o":"TJ-0419 · 天纪·人间道·明夷卦·第五、上爻（PDF 第90~91页）"},{"t":"一百五十二、家人：家内之道","h":"卦序：\"人之伤于外而必后返于内\"","c":"定义——家人卦（风火家人）为\"**入海求珠之课，开花结子之象**\"，其卦序讲义说得极有人情味：\"**人之伤于外而必后返于内，故家人次明夷为序卦——此卦专论家内之道：父子、夫妇、长幼尊卑之伦理与恩义的家人之道。外风内火，乃风自火出——火愈炽则风生，有自内而出之象，故处家之道，有'内明外顺'象。圣人之谓：人能立于家，则必能施于国，以至天下大治。故治天下犹治家也。**\" **\"人之伤于外而必后返于内\"七个字，把\"明夷→家人\"接得极自然**：**在外面受了伤，人必然回到家里**——**即：家是\"伤\"之后的去处。** **而\"风自火出\"（火越旺，风越大）的取象，给了家人卦的机制**：**家里的\"火\"（内在的），会生出\"风\"（外在的影响）**——**所以\"处家之道，有内明外顺象\"**（**与明夷的\"内明外顺\"是同一结构，只是尺度不同**）。** 而\"治天下犹治家也\"这一句，是这一卦的总纲**。**卦图五物**：**①\"一人张弓：暗算，破坏也\"**；**②\"一带在水边：事滞也，弃官也\"**；**③\"云中文书：突而来之喜讯也\"**；**④\"贵人拜受：绶命也\"**；**⑤\"妇人携手：家和之象，此卦卜婚姻大吉\"**。**须说明**：**这是讲义对家人卦序与卦图的注解**；**占例\"董永丧父卖身，卜之，后感得仙女为妻\"是二十四孝故事**，**本集只记其占例，不取孝道宣传内容**。","o":"TJ-0420 · 天纪·人间道·家人卦（PDF 第91页）"},{"t":"一百五十二、家人：家内之道","h":"彖：\"家人有严君焉\"与\"正家而天下定\"","c":"要点——家人\"彖\"有三层，讲义逐层给了判断。**第一层\"家人，女正位乎内，男正位乎外，男女正，天地之大义也\"**：\"**家人之道，正位且坚心——男主外、女主内，其有尊卑有道，乃合乎天地阴阳之道。**\" **第二层\"家人有严君焉，父母之谓也\"**：\"**父母为一家之君长——无尊严则无人孝，无大小则伦理废，故君严则家正。**\" **第三层\"父父子子，兄兄弟弟，夫夫婦婦，而家道正，正家而天下定矣\"**：\"**父母兄弟夫妻各适其位，则家道正矣；能治家道，其道亦可推而治天下。**\" **二层是最要紧的一句**：\"**无尊严则无人孝，无大小则伦理废**\"——**它把\"严\"的必要性说成了两件事**：**没有\"尊严\"，\"孝\"就无从谈起；没有\"大小\"（长幼之别），\"伦理\"就废了。** **须说明**：**这是《易经》原文（家人彖）**；**\"男主外、女主内\"\"尊卑\"是古代的性别与等级分工语汇**，**本集只取\"职能分工与角色边界\"这一层结构义**（**不取其性别与等级内容**）——**即：一个稳定的家（或组织），需要\"内外各有人负责、边界清楚\"**；**而\"各适其位\"是它的核心：不是\"谁高谁低\"，是\"各在其位\"。** **其可用的核**：**\"家道正\"的标准不是\"和睦\"，是\"各适其位\"**——**和睦可能是\"没人管事\"的假象**（**这与\"初九闲有家\"正好相反**）。","o":"TJ-0421 · 天纪·人间道·家人卦（PDF 第91页）"},{"t":"一百五十二、家人：家内之道","h":"象：\"言有物，而行有恒\"","c":"方法——家人\"象\"为\"**风自火出，家人；君子以言有物，而行有恒**\"，其解：\"**君子观风自火出之象，知'正身之道，皆由内出'——故言必有物、行必有恒，身正而能治家。**\" **\"正身之道，皆由内出\"六个字，是家人卦的方法论**：**\"正\"不是从外面管出来的，是从里面长出来的**——**而它落在两件事上：说话有\"物\"（有内容、有实指），行动有\"恒\"（有常、有连续）。** **须说明**：**\"风自火出，家人；君子以言有物，而行有恒\"是《易经》原文**；**\"言有物\"（说话有内容）与\"行有恒\"（做事有恒常）这两条，是\"内\"（自身）的可见部分**——**即：一个人\"里面正不正\"，别人看不见；但\"他说的有没有东西\"\"他做的有没有连续性\"，别人看得见。** **其可用的核极准**：**\"言有物\"的反面是\"空话\"；\"行有恒\"的反面是\"三天打鱼\"**——**而这两条合起来，正好能判断一个人（或一个家的风气）\"里面\"是什么样。**","o":"TJ-0422 · 天纪·人间道·家人卦（PDF 第91页）"},{"t":"一百五十三、家人卦前二爻","h":"初爻：\"闲有家\"——立规矩的最佳时机","c":"方法——家人初爻\"**闲有家，悔亡**\"。其解：\"**家人道之始为初九——须以阳刚立家道；如无法则度量，则终至人情流放，必悔。**\"其\"象\"是全卦最实用的一条：\"**'闲'即预防之法则也——闲必于始初而立：在正志未流散之前，变动而法规之。因始立规之时，必不伤恩、不失义；如于志变后再思治，则多有伤，必有悔。**\" **\"闲\"（防）这个字用得极准**：**\"闲\"的本义是\"门中有木\"（栅栏、防范）**——**而\"闲有家\"就是\"在家里先把栅栏立起来\"。** **\"始立规之时，必不伤恩、不失义；如于志变后再思治，则多有伤\"这一句，讲的是\"立规矩的时机经济学\"**：**关系还好的时候立规矩，不伤感情**（**因为\"正志未流散\"，大家都还讲理**）；**等出了事再立，就\"多有伤\"**（**因为此时立的规矩，就是针对某个人的**）。** 而\"如无法则度量，则终至人情流放\"是它的反面**：**没有规矩，人情就会\"流放\"（失控、散掉）**。**须说明**：**这是《易经》原文（家人初九）**；**\"闲\"在此不作\"闲暇\"解，而作\"防闲\"（防范）解**——**这一点与通行读法一致**；**其可用的核极实用**：**规矩要在\"还没有人违反\"的时候立**——**这既适用于家庭，也适用于新团队、新合作**（**因为\"后来才立\"总会被理解为\"针对谁\"**）。","o":"TJ-0423 · 天纪·人间道·家人卦·初爻（PDF 第91页）"},{"t":"一百五十三、家人卦前二爻","h":"第二爻：\"无攸遂，在中馈\"——以情胜礼、以恩去义","c":"风险——家人第二爻\"**无攸遂，在中馈，贞吉**\"。其解先说了一句对\"家庭治理\"最狠的诊断：\"**常人处家，唯骨肉亲情，故常'以情胜礼、以恩去义'——偏私之人多矣。独有能刚之人，不以私爱而不顾理。今以阴柔之人治家，必无可为——唯妇人之道可以柔顺：如能处正、居中协调，则必能吉。**\"其\"象\"：\"**今以阴柔居中，能顺从而动其心，此为妇人之正道。**\" **\"以情胜礼、以恩去义——偏私之人多矣\"这一句，是家人卦对\"家为什么难治\"的回答**：**在\"家\"这个场域里，\"情\"天然大于\"礼\"，\"恩\"天然取代\"义\"**——**所以\"偏私\"是常态，不是例外。** **而\"独有能刚之人，不以私爱而不顾理\"是它的解法**：**需要有一个人\"能刚\"**（**能在亲情面前仍讲\"理\"**）。**须说明**：**这是《易经》原文（家人六二）**；**\"无攸遂\"（无所专断）\"在中馈\"（主持家中饮食之事）是古代对\"内主\"的定位**，**本集只取\"居中协调而非专断\"这一层结构义**，**不取其性别内容**（**\"妇人\"\"阴柔\"在此指\"内主\"这个角色，不是\"女性\"**）；**其可用的核**：**\"以情胜礼\"是家的优势也是家的病根**——**优势是\"有温度\"，病根是\"无标准\"**（**而\"偏私之人多矣\"就是它的后果**）。","o":"TJ-0424 · 天纪·人间道·家人卦·第二爻（PDF 第91~92页）  ---"},{"t":"一百五十四、家人后四爻","h":"第三爻：\"家人嗃嗃\"——过严与过宽之间","c":"要点——家人第三爻\"**家人嗃嗃，悔厉吉；妇子嘻嘻，终吝**\"。其解是一个极清醒的权衡：\"**'嗃嗃'乃严厉约束意。家人之道如约束过严，必有悔；然能令人心敬畏，也比让妇人之放肆、喜乐无节、终至家败而来得好。同理：人能刚立，必知忠义；喜爱玩乐必不能正伦理、知恩义也。**\"其\"象\"：\"**虽过严厉伤恩，但犹未失家人之道；但令妇人喜节无度、失家之道，必乱矣。**\" **这一爻的判语其实在回答一个所有\"管人\"的人都会遇到的问题**：**\"太严\"和\"太松\"，哪个更坏？**——**讲义的答案是\"太松更坏\"**：**\"过严\"只是\"伤恩\"（还有悔、还能改），\"过松\"是\"失家之道，必乱\"**（**乱起来就收不回了）。** **须说明**：**这是《易经》原文（家人九三）**；**\"嗃嗃\"（hè hè）是严酷的样子，\"嘻嘻\"是嬉笑无度的样子**；**其可用的核是它的比较方式**：**不是\"严好还是松好\"，是\"两种坏的后果哪个更重\"**——**\"过严\"的后果是\"伤恩\"，\"过松\"的后果是\"家败\"**；**而\"人能刚立，必知忠义\"这一句，还给了\"严\"的正面产出**（**严厉能养出\"知忠义\"的人**）。**⚠ 须补一句**：**此爻的前提是\"约束过严\"仍属\"未失家人之道\"**——**若严到\"伤恩\"变成\"伤身\"（暴力、羞辱），则已越出此爻范围**（**这一点讲义没有说，本集补上**）。","o":"TJ-0425 · 天纪·人间道·家人卦·第三爻（PDF 第92页）"},{"t":"一百五十四、家人后四爻","h":"第四、五爻：\"富家，大吉\"与\"王假有家\"","c":"方法——**第四爻\"富家，大吉\"**：\"**能有其富，于家道大吉——保有富之人，而能保其家，此吉之大也。**\"其\"象\"：\"**以巽顺之道而能保其家富，此家之大吉也。**\" **第五爻\"王假有家，勿恤，吉\"**：\"**能刚又处君位，位尊而中正，又能顺应内——此治家之至正至善。是故修身来齐家，家家能正，则天下大治，此不须忧劳而天下自治矣。**\"其\"象\"是全卦对\"关系\"最深的一句：\"**尊位又能有家之道，不但能使其顺从而已，必使其能从内心而化合。丈夫能爱内助，妇能爱其威治于家——此'交相爱'，为家之至道。**\" **\"不但能使其顺从而已，必使其能从内心而化合\"这一句，是\"管人\"的最高标准**：**\"顺从\"是表面的（人可能只是不敢违抗）；\"从内心而化合\"才是真服**——**两者之间差着\"心甘情愿\"。** **而\"交相爱\"（\"丈夫能爱内助，妇能爱其威治于家\"）给了它的机制**：**不是单方面的\"服从\"，是双向的\"各自爱对方所承担的角色\"**。**须说明**：**这是《易经》原文（家人六四、九五）**；**\"王假有家\"的\"假\"（gé）通\"格\"（至、达到）**——**\"王能达到'有家'的境界\"**；**其可用的核有两条**：**①\"富家\"之吉在\"能保其家\"（富而能守，才是大吉，富而不能守则不是）；②\"勿恤\"（不须忧劳）是\"治家至善\"的结果——因为\"家家能正\"之后，\"天下自治\"。**","o":"TJ-0426 · 天纪·人间道·家人卦·第四、五爻（PDF 第92页）"},{"t":"一百五十四、家人后四爻","h":"上爻：\"有孚威如\"——先严其身","c":"方法——家人上爻\"**有孚威如，终吉**\"。其解：\"**此言治家之道，非至诚之心不能也。己能守其规如常则人自化；如己不能守，况于他人乎？家之患必在礼法不足、下犯上、上凌下。如能守正礼法、又有威严，则必能吉。**\"其\"象\"是全卦的收尾：\"**此即言治家之道，以正身为本——当先严其身，后有威望于人，则人能服。此'反身'之意。**\" **\"己能守其规如常则人自化；如己不能守，况于他人乎\"这一句，是\"以身作则\"最直接的表述**：**规矩是给自己定的**——**\"自己能守\"，别人就\"自化\"（自己会变好）；\"自己不能守\"，那凭什么要求别人。** **而\"先严其身，后有威望于人\"这个顺序也重要**：**\"威望\"是\"严其身\"的结果，不是\"要求\"来的**——**先立威再自律，那是威权；先自律再立威，那是威望。** **须说明**：**这是《易经》原文（家人上九）**；**\"有孚威如\"（有诚信而又有威严的样子）**——**\"孚\"（诚）在\"威\"之前**，**顺序不能倒**；**\"反身\"（反省自己）是《易经》常用的一个词**（**\"反身\"即\"反过来要求自己\"**）；**其可用的核极准**：**一个家／一个团队的风气，看主事者\"守不守他自己定的规矩\"**——**\"家之患必在礼法不足、下犯上、上凌下\"这三样，都能从\"主事者自己不守\"追到头。**","o":"TJ-0427 · 天纪·人间道·家人卦·上爻（PDF 第92页）"},{"t":"一百五十五、睽卦：二女同居","h":"卦序：家之道到穷途则生乖违","c":"定义——睽卦（火泽睽）为\"**猛虎陷井之课，二女同舟之象**\"，其卦序只一句：\"**家之道到穷途，则生乖违离散，故睽卦为之序。**\" **\"家之道到穷途，则生乖违离散\"这十一个字，把\"家人→睽\"接得极准**：**家道走到尽头，结果就是\"乖违离散\"（彼此背离、各走各的）**——**而这正是\"睽\"（乖离、背离）的本义。** **而卦体给了它更细的原因**：\"**此卦上火下泽，二体相违，此睽之义——二女三女同居一室，但所归各异，乃因志之不同也。**\" **\"同居一室，但所归各异\"这个意象极准**：**在一个屋檐下，但各自的去处不同**——**而原因不是\"不和\"，是\"志之不同\"**（**志向不一样）。** **卦图六物**：**①\"人执斧在手：求快也，行刑之人、执法之人，有权柄也\"**；**②\"文书半破：无望象，毁约也\"**；**③\"牛鼠：秋冬吉，春夏凶\"**；**④\"桃开：逃开也\"**；**⑤\"门掩：牢狱之灾，闭也，隔也\"**；**⑥\"雁飞鸣：悲也，孤单也，报凶讯也\"**。**须说明**：**这是讲义对睽卦序与卦图的注解**；**\"桃开＝逃开\"\"门掩＝隔\"两物，正好是\"睽\"的两种表现**（**一个跑掉，一个关起来**）；**而\"文书半破＝毁约\"是它的起因**（**约定破了，关系才乖离**）。","o":"TJ-0428 · 天纪·人间道·睽卦（PDF 第93页）"},{"t":"一百五十五、睽卦：二女同居","h":"卦辞：\"小事吉\"——与不良之人乖离是吉的","c":"要点——睽卦辞只有\"**睽：小事吉**\"，而其解给了一个极重要的转义：\"**睽违之道于小之事，可言吉——如与不良之人乖离、与不正之事违背也。**\" **\"睽\"不只是\"关系破裂\"这个负面**：**与\"不良之人\"乖离、与\"不正之事\"违背，也是\"睽\"，而且是\"吉\"的**——**即：有些\"背离\"是对的。** **而\"小事吉\"的\"小\"也讲究**：**\"处睽之时虽无法去天下之睽，但于小处则吉矣\"**（**见彖辞之解**）——**即：大局面（整个天下的乖离）你改不了，但\"小处\"（个人的取舍）你还能做对。** **须说明**：**\"睽：小事吉\"是《易经》原文**；**其可用的核极实用**：**当\"合\"已经不可能时，\"分得对\"也是好的**——**而\"与不正之事违背\"这一条，给了\"分\"的道德标准**（**不是\"谁对我好我跟谁\"，是\"跟不正的划清界限\"**）。","o":"TJ-0429 · 天纪·人间道·睽卦（PDF 第93页）"},{"t":"一百五十五、睽卦：二女同居","h":"彖：\"天地睽而其事同\"——物虽异而其本同","c":"方法——睽卦\"彖\"末段为\"**天地睽而其事同也，男女睽而其志通也，万物睽而其事类也，睽之时用大矣哉**\"，其解是全卦最高的一段：\"**天上地下虽睽，然天阳下降、地阴上升而成万物，其事本同也；男女之质不同，但互相求之志却同也；天下万物不同是睽，然皆禀天地之气而成，则相同也。是故'物虽异而其本同'——圣人用睽之道，能令天下不同之群众，合而为一，故其事大矣哉。**\" **这一段把\"睽\"从\"坏\"翻成了\"可用\"**：**天地相\"睽\"（一个在上一个在下），但\"其事同\"（共同生成万物）；男女相\"睽\"（质不同），但\"其志通\"（互相求）；万物相\"睽\"（各不相同），但\"其事类\"（同禀天地之气）。** **而\"物虽异而其本同\"这一句是它的总结**：**差异是表面的，共同是根本的。** **须说明**：**这是《易经》原文（睽彖）**；**其可用的核极准**：**\"不同\"不是\"分裂\"的理由，而是\"合作\"的材料**——**因为\"其事同\"（目标相同）比\"其质同\"（条件相同）更重要**；**而\"圣人用睽之道，能令天下不同之群众合而为一\"这一句，是\"团结\"的古典定义**（**不是\"消除差异\"，是\"在差异之上找到共同\"**）。","o":"TJ-0430 · 天纪·人间道·睽卦（PDF 第93页）"},{"t":"一百五十五、睽卦：二女同居","h":"象：\"君子以同而异\"","c":"方法——睽卦\"象\"为\"**上火下泽，睽；君子以同而异**\"，其解：\"**火在上、泽在下，二物之性相违，为睽象。君子观睽而知'于世俗所同者，有时须独异于世人'——《中庸》曰'和而不流'，即义此也。**\" **\"同而异\"三个字，是全卦最精的一条**：**\"同\"（与大家一致）与\"异\"（与大家不同）不是二选一**——**而是\"在大家都一样的地方，（有时候）要能独异于世人\"。** **须说明**：**\"上火下泽，睽；君子以同而异\"是《易经》原文**；**\"同而异\"这个提法与\"大壮象'和而不流，大立而不倚'\"是同一判断**（**两处都引《中庸》的\"和而不流\"**）；**其可用的核极准**：**\"同\"是常态（人是群居的），\"异\"是必要时的选择**——**而难点在\"何时该异\"**：**讲义说\"于世俗所同者，有时须独异\"**——**即：当\"大家都一样\"这件事本身成了问题的时候**（**比如大家一起沉默、一起妥协、一起装作没看见**）。**这一条与\"明夷用晦而明\"合起来，是\"内与外\"的完整答案**：**该\"用晦\"时藏，该\"独异\"时异。**","o":"TJ-0431 · 天纪·人间道·睽卦（PDF 第93~94页）  ---"},{"t":"一百五十六、睽卦六爻","h":"初爻：\"丧马勿逐，自复\"与\"见恶人，无咎\"","c":"方法——睽卦初爻\"**悔亡，丧马勿逐，自复；见恶人，无咎**\"，两条判断方向相反，正好补全。其解：\"**卦之初，即睽之始时，于睽时又刚动于下，其悔可知。于此时因不能行而丧其马——如'勿逐'，则马自复回。因睽时小人必众，若弃之，则必天下而仇己乎？就会丧失坤德之含弘功能，乃致凶地。不但无法使之化善，更遑论能合之——故有'必见恶人'之议。所以自古以来能化奸邪为善良、去仇敌而为臣民者，皆因不拒绝见之。**\"其\"象\"：\"**于睽时人情乖违，为求和合，若因其恶人而避之，则生众仇于君子，故'见恶人'乃为避免怨咎之悔也。**\" **\"丧马勿逐，自复\"讲的是\"不要追\"**：**马跑了不要追，它自己会回来**——**用在关系上，就是\"对方走开时，追反而推远\"。** **而\"见恶人，无咎\"讲的是\"不要躲\"**：**明明厌恶的人，还要见**——**理由极硬：\"若因其恶人而避之，则生众仇于君子\"**（**躲开一个人，会招来一群人的敌意**）。** 而\"自古以来能化奸邪为善良、去仇敌而为臣民者，皆因不拒绝见之\"这一句，是它的历史根据**：**\"化\"（转化）的前提是\"见\"（接触）**——**不见，就永远只能是对手。** **须说明**：**这是《易经》原文（睽初九）**；**\"丧马\"与\"见恶人\"在通行注家中多解为\"不追失物、不避恶人\"两事并列**，**本集按讲义记录**；**⚠ 须补一句边界**：**\"见恶人\"不等于\"与恶人深交\"**——**它的目的是\"避免众仇\"与\"留有转化余地\"**（**这与\"遯卦不恶而严\"是同一条：见，但不亲近**）。","o":"TJ-0432 · 天纪·人间道·睽卦·初爻（PDF 第94页）"},{"t":"一百五十六、睽卦六爻","h":"第二、三爻：\"遇主于巷\"与\"见舆曳，其牛掣\"","c":"方法——**第二爻\"遇主于巷，无咎\"**。其解给了\"委曲\"与\"屈道\"的分野：\"**睽违之时乃阴阳不合、且刚戾相对——即令为阳刚之中臣，当以'委曲而婉转'之善道将就于主，期使之合；绝非求附君主而屈道相向也。**\"其\"象\"：\"**此意即当以至诚以动君心，使明义理而能求相合，不可屈道迎逢，乃真未失道。今之小人明知不正，然于乖违之时，只知迎合奉承、为求己利、枉顾正道——故'因时局而恋志之人'乃真小人也。**\" **第三爻\"见舆曳，其牛掣，其人天且劓，无初有终\"**：\"**三爻位为下卦之上，本离下卦而求进于上；今逢四之刚为阻，而下二爻之阳刚于后——处此时又逢乖违不和，犹牛车之行具：牛受掣阻于前，后有车舆在后。如以此状况又求力进，则必重伤于上。宜刚守中正之道与其对应，待睽终极之时必合，方为善处之道。**\"其\"象\"：\"**见车牛之负掣后拖曳而行，知位所不当；圣人知理顺行、知时而守，待遇刚而能合。**\" **\"委曲而婉转\"与\"屈道迎逢\"的区别，是睽卦最细的一处分寸**：**\"委曲\"是\"换方式\"，\"屈道\"是\"换立场\"**——**前者\"期使之合\"（目的是合），后者\"为求己利\"（目的是己）。** **须说明**：**这是《易经》原文（睽九二、六三）**；**\"遇主于巷\"的\"巷\"是\"侧径、非正式场合\"**（**即：走一条不拘形式的通道，与\"坎卦纳约自牖\"同一手法**）；**\"天且劓\"（受黥额割鼻之刑）是形容\"重伤\"**；**其可用的核**：**\"因时局而恋志之人乃真小人\"**——**把\"恋志\"（舍不得自己的志向）与\"因时局\"（看风向）放在一起**，**即：看风向就走的人，才是真小人**（**而这与\"明夷晦其明\"（藏而不变）恰成对照**）。","o":"TJ-0433 · 天纪·人间道·睽卦·第二、三爻（PDF 第94页）"},{"t":"一百五十六、睽卦六爻","h":"第四、五爻：\"睽孤，遇元夫\"与\"厥宗噬肤\"","c":"方法——**第四爻\"睽孤，遇元夫，交孚，厉无咎\"**：\"**四爻近君位，君不与应，乃睽乖之时，故为'孤'——唯求与同德之人相合，且至诚相与交往；能如此，虽处危，但仍可无咎也。**\"其\"象\"：\"**睽乖之时，上下至诚相交，不止无咎，且其志必可行。故'救睽'之道，唯君子以阳刚之才、至诚相辅，何所不能济也。**\" **第五爻\"悔亡，厥宗噬肤，往何咎\"**：\"**阴柔又居尊位，于睽时其危可知；然有九二阳刚之贤相辅，可以悔亡。且阳刚之贤又能成党、且深入之，则往而有庆也——如刘禅之庸，有孔明之辅，乃成中兴之态势。**\"其\"象\"是全卦对\"才不足者\"最实用的一条：\"**人君之才不足，如知信任贤辅、使其道能深入于己，亦可为也。今人不知己之才不足，以为'博士就是好的'，不但不能成事，且造成乖违之势愈烈，果必凶。**\" **两爻合起来是\"救睽\"的两条路**：**第四爻\"孤而求同德\"（自己孤立时，找与自己同德的人）；第五爻\"才不足而信贤辅\"（自己不够时，让贤者进来）。** **而\"使其道能深入于己\"这一句极精**：**不是\"用他的才能\"，是\"让他的道进入自己\"**——**即：真正的信任，是让对方的判断改变自己的判断。** **须说明**：**这是《易经》原文（睽九四、六五）**；**\"元夫\"（善士、大丈夫）指\"同德的贤者\"**；**\"厥宗噬肤\"（与自己的同宗相合，如咬软肉那样容易）喻\"亲近无阻\"**；**\"以为博士就是好的\"是讲义对\"唯学历／头衔论\"的批评**，本集照录。","o":"TJ-0434 · 天纪·人间道·睽卦·第四、五爻（PDF 第94页）"},{"t":"一百五十六、睽卦六爻","h":"上爻：\"见豕负涂，载鬼一车\"——群疑亡也","c":"要点——睽卦上爻\"**睽孤，见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇婚媾，往遇雨则吉**\"，是全卦最精彩的一条。其解：\"**睽极之时，必反复正道。犹人见污浊之豕、且全身烂泥，又车载一群恶鬼——心厌恶之，乃欲张弓射之；后思之如动必反，而弗射——化仇寇为婚媾，阴阳交合而成雨。故'始因疑而睽，睽至极因不疑而合'——犹天地阴阳上为雨，往而遇之，则吉也。**\"其\"象\"只有四个字，却是全卦的收束：\"**遇雨之吉，群疑亡也。**\" **\"始因疑而睽，睽至极因不疑而合\"这一句，讲清了\"乖离\"的完整机制**：**起点是\"疑\"（怀疑）；终点是\"不疑\"（疑消）**——**中间那些\"豕负涂（满是烂泥的猪）\"\"载鬼一车\"（一车恶鬼），全都是\"疑\"看见的东西。** **而\"先张之弧，后说之弧\"（先拉开弓，后放下弓）是\"疑\"的松动过程**：**先想射（攻击），后放下（不攻）**。** 而\"匪寇婚媾\"（不是强盗，是来结亲的）是\"疑消之后的重新认识\"**。**须说明**：**这是《易经》原文（睽上九）**；**\"说\"通\"脱\"（放下）**；**其可用的核极准**：**关系破裂到最后，\"疑\"是唯一的原因**——**而\"群疑亡\"（疑全部消失）之后，\"雨\"（和合）才下得来**；**这一条与\"咸卦'憧憧往来，未光大'\"（疑）与\"比卦'有孚盈缶'\"（信）可合读**：**《易经》讲关系的三处，落点都在\"疑与信\"。**","o":"TJ-0435 · 天纪·人间道·睽卦·上爻（PDF 第94页）"},{"t":"一百五十七、蹇卦：乖离必生难","h":"卦序与卦体","c":"定义——蹇卦（水山蹇）为\"**飞雁衔草之课，背明向暗之象**\"，其卦序只一句：\"**睽，乖违也；乖离必生难——蹇即难也。因时之乖违，必有蹇难，故蹇次睽为序卦。**\" **\"乖离必生难\"四个字，把\"睽→蹇\"的因果锁上了**：**关系一旦乖离，必然产生\"蹇\"（难）**——**即：蹇不是\"外面的灾难\"，是\"内部乖离\"的结果。** **须说明**：**这是讲义对蹇卦卦序的注解**；**\"蹇\"（jiǎn）本义为\"跛、行走困难\"**（**\"水山蹇\"的卦象是\"水在山上\"——水在高处，流不动，故\"难\"**）；**占例\"钟离末将收楚，卜得之，乃知身不王矣\"**（**\"钟离末\"为楚将钟离眜一类人物**）；**其可用的核**：**\"难\"的来处往往是\"内部的乖离\"，不是\"外部的阻力\"**——**而这与\"睽卦'二女同居其志不同行'\"正好接上。**","o":"TJ-0436 · 天纪·人间道·蹇卦（PDF 第85页）  ---"},{"t":"一百五十八、蹇之道","h":"卦辞：\"利西南，不利东北\"","c":"要点——蹇卦辞为\"**蹇：利西南，不利东北，利见大人，贞吉**\"，其解先给了方位之义：\"**西南为坤，坤体顺；东北为艮，艮体险止——此言于蹇难之时，利处平易之地，不利止于危险。**\" **而紧接的一句是全卦最漂亮的辨析**：\"**今人遇险而止，不知'因险而止'乃更险也。**\" **\"遇险而止\"与\"因险而止\"看似同一件事，实则是两件**：**\"遇险而止\"是\"看到危险就停在原地\"**（**而停在险地，险还在，甚至更险**）；**\"因险而止\"是\"因为险，所以改变走法\"**（**不进那一步，但换个方向走**）。** **须说明**：**\"蹇：利西南，不利东北，利见大人，贞吉\"是《易经》原文**；**\"西南为坤（顺）\"\"东北为艮（止、险）\"是后天八卦方位的配属**；**其可用的核极准**：**\"止\"的正确含义是\"不往险里去\"，不是\"停在险里不动\"**——**而在险里不动，本身就是一种危险**（**讲义说\"乃更险也\"**）。","o":"TJ-0437 · 天纪·人间道·蹇卦（PDF 第85~86页）"},{"t":"一百五十八、蹇之道","h":"彖：\"见险而能止，知矣哉\"","c":"方法——蹇卦\"彖\"为\"**蹇，难也，险在前也。见险而能止，知矣哉！**\"，其解：\"**蹇有险阻之难也，因险在前，止而不进状。处蹇之道，乃能'见险而止'——此知蹇难也。此'止'非真止也，乃'不犯险而进'之意。**\" **\"见险而能止，知矣哉\"六个字，把\"能止\"判成了\"智慧\"**：**不是\"能进\"是本事，\"能止\"也是本事**。** 而\"此止非真止也，乃'不犯险而进'之意\"这一句，是它的精确化**：**\"止\"是\"止于那一步\"，不是\"止于整件事\"**——**即：停下一步，但继续前进（换一条不犯险的路）。** **须说明**：**这是《易经》彖传原文加讲义之解**；**\"见险而能止\"这个判断，在《易经》里是全书的\"止损\"总纲**（**与\"大壮上六艰则吉\"（守）、\"遯卦'其贵在速及远'\"（退）合起来看，是三种\"停\"**）；**其可用的核**：**\"知\"（智）的表现，不在\"敢冲\"，在\"知道哪一步不能迈\"**——**而\"能止\"比\"能进\"更难**（**因为\"进\"是本能，\"止\"要克制**）。","o":"TJ-0438 · 天纪·人间道·蹇卦（PDF 第86页）"},{"t":"一百五十八、蹇之道","h":"彖：\"利见大人，往有功也\"——适时而动，量险而行","c":"方法——蹇卦\"彖\"末段为\"**利见大人，往有功也；当位贞吉，以正邦也。蹇之时用大矣哉**\"，其解：\"**蹇难之时，唯圣贤能济天下之蹇——故'用贤人'，能往求而成功；在位之人坚心执意如此，必能正家邦。此即知蹇之时、任用贤人、适时而动、量险而行，使至正之大道能济天下之蹇。今之为政者，不知蹇之时难，乃因不知古圣先哲之智慧也。**\" **\"适时而动，量险而行\"八个字，是蹇卦的行动纲领**：**\"适时\"（在对的时候）、\"量险\"（先估量险有多大）**——**两者缺一，动就是莽。** **须说明**：**这是《易经》彖传原文加讲义之解**；**\"利见大人，往有功\"的意思很直接**：**难的时候，要找\"大人\"（有德有能的人）**——**因为\"唯圣贤能济天下之蹇\"**（**个体扛不住\"天下之蹇\"**）；**其可用的核**：**\"量险而行\"是一种可操作的顺序**——**先量，后行**（**不是\"先动再想\"**）；**而\"今之为政者，不知蹇之时难\"这一句是讲义的批评**（**把\"不知时难\"归到了\"不知古圣先哲之智慧\"**）。","o":"TJ-0439 · 天纪·人间道·蹇卦（PDF 第86页）"},{"t":"一百五十八、蹇之道","h":"象：\"君子以反身修德\"","c":"方法——蹇卦\"象\"为\"**山上有水，蹇；君子以反身修德**\"，其解：\"**山已为险阻，上又有水，故有上下险阻状，为蹇。君子观蹇象，知此时乃'反求于己、修身进德'——故必省自身，以待时之至也。**\" **\"反身修德\"四个字，是蹇卦最重要的一条，也是《易经》对\"困境\"最正面的一次回答**：**山上有水（险上加险）的时候，该做的不是\"往外冲\"，是\"往里看\"**——**\"反求于己\"（回头查自己）＋\"修身进德\"（把自己修好）。** **而\"省自身，以待时之至\"是它的时间观**：**不是\"永远等\"，是\"修着等\"**——**\"时\"（时机）会来，但来的时候，你得是\"修好了\"的那个人。** **须说明**：**\"山上有水，蹇；君子以反身修德\"是《易经》原文**；**\"反身\"（反求自己）这一词与\"家人上九'反身之谓也'\"同一语汇**（**两处都指向\"先查自己\"**）；**其可用的核极准**：**遇到\"山上有水\"（双重险阻）的局面，\"自我检讨\"不是道德要求，是唯一还有效的动作**——**因为此时\"往外\"的每个动作都会被险吃掉，而\"往里\"的动作（修身、修德、修方法）却不会。**","o":"TJ-0440 · 天纪·人间道·蹇卦（PDF 第86页）"},{"t":"一百五十九、蹇卦六爻","h":"初、二爻：\"往蹇，来誉\"与\"王臣蹇蹇\"","c":"方法——**初爻\"往蹇，来誉\"**：\"**此蹇之初，以阴柔无助而求进，蹇之甚也——是'知止而不进'，乃因知进退而成誉也。**\"其\"象\"：\"**于蹇之初，进必愈蹇——宜见几而止、待时而进，不可燥进。**\" **第二爻\"王臣蹇蹇，匪躬之故\"**：\"**二爻为阴位，阴居之为正位，乃意为'中正之臣'，又与上五君同德而受信任，此即'王臣'。今处蹇难时，即令中正之人，以阴柔之质，不能胜任，故有'蹇中之蹇'状。因为中正之人，其所为必忠于君、非为私己——故即令不胜，亦因其能忠而可嘉勉。**\"其\"象\"：\"**中正之臣所为必为其君、不为私，故于蹇难时，虽未成功，但终无过也。**\" **\"匪躬之故\"（不是为了自己）是全卦的道德支点**：**在\"蹇中之蹇\"（难上加难）的处境里，\"忠\"不能保证\"成\"，但能保证\"无过\"**——**这一条对\"尽力而失败\"的人是一条真正的安慰**（**也是判据：失败了还能\"无过\"，前提是\"所为必为其君、不为私\"**）。**须说明**：**这是《易经》原文（蹇初六、六二）**；**\"王臣蹇蹇\"后来成为\"王臣尽瘁\"的典故**；**而\"知止而不进，乃因知进退而成誉\"这一句，把\"退\"判成了\"誉\"**（**与\"遯卦'小人易进难出'\"是同一判断**）：**在难之初就能\"见几而止\"的人，得到的是\"誉\"（声誉），不是\"怯\"。**","o":"TJ-0441 · 天纪·人间道·蹇卦·初、二爻（PDF 第86页）"},{"t":"一百五十九、蹇卦六爻","h":"第三、四爻：\"往蹇，来反\"与\"往蹇，来连\"","c":"方法——**第三爻\"往蹇，来反\"**：\"**以刚居下卦之上，处蹇时，下位之人皆柔，依附于上状。欲再上进，又逢阴柔、无法相济——故有'来反'，即还归也，反回其所。**\"其\"象\"：\"**下之阴柔无法独立，必附于九三之阳刚。故吾人知，于处蹇之时，必得下之心可以求安——此求内而喜之也。**\" **第四爻\"往蹇，来连\"**：\"**蹇之时以阴柔而往入坎险之深处，为'往蹇'；如能与同志之人，使合众而附之，此即'来连'——乃真得处蹇之道也。**\"其\"象\"：\"**处蹇，居于上位，能不与下往而众来，乃得众志也——能得众志之人，必始之于'诚待下'，方可得也。**\" **\"来反\"（回来）与\"来连\"（联结）是蹇卦给出的两条\"内部动作\"**：**第三爻\"反回其所\"（回到自己的位置，先把下面的人心聚住）；第四爻\"合众而附之\"（与同志联合）。** **而\"能得众志之人，必始之于诚待下\"这一句，是\"联结\"的前提**：**\"众来\"（别人来到你这边）的前提是\"诚待下\"**——**不是\"我需要人帮忙时才去联\"，是\"平时就以诚待下\"。** **须说明**：**这是《易经》原文（蹇九三、六四）**；**\"连\"（liǎn）在此为\"联合、牵连\"**；**其可用的核是\"方向\"**：**蹇卦的六爻，前三爻讲\"往（出去）必蹇\"，后三爻讲\"来（回来／让人来）\"**——**即：难的时候，一切\"往外\"的动作都受阻，有效动作全在\"往内\"**（**与\"反身修德\"完全一致**）。","o":"TJ-0442 · 天纪·人间道·蹇卦·第三、四爻（PDF 第86页）"},{"t":"一百五十九、蹇卦六爻","h":"第五、上爻：\"大蹇，朋来\"与\"往蹇，来硕\"","c":"风险——**第五爻\"大蹇，朋来\"**：\"**君处蹇难之时，必天下处难也，故名'大蹇'。此时如能得朋来助，且须为阳刚中正之才来相辅，方有效。**\"其\"象\"给了一句极锋利的批评：\"**大蹇之时，须阳刚中正之才——如臣之才不足济蹇，只守于节义，不能济世也。今之政客，多属此类，不知己之才不济，而力进，徒显其无能也。**\" **上爻\"往蹇，来硕，吉，利见大人\"**：\"**六以阴柔居蹇之极处，蹇之极有'将离蹇'之态；如以阴柔必不得出，须有阳刚之助，以宽裕之大量，见有德之人，方可为吉。**\"其\"象\"：\"**六位阴柔又处蹇之极，能近阳刚中正之君、来求自济——此以'从贵'之义，吉也。**\" **\"只守于节义，不能济世\"这一句，是蹇卦最重的一条判断**：**\"节义\"（守住气节、道德）与\"济世\"（真能解决问题）是两件事**——**而\"才不足济蹇\"的人，只能做到前者**；**\"不知己之才不济，而力进，徒显其无能\"是它的后果**（**即：越用力，越显出无能**）。** 而\"以宽裕之大量\"这一句，是\"求助\"的正确姿态**：**\"宽裕\"（心里有空间、不计较）＋\"大量\"（气量大）**——**即：求助不是\"低三下四\"，是\"心宽而量大的那种从容\"。** **须说明**：**这是《易经》原文（蹇九五、上六）**；**\"朋来\"指\"同德者来助\"**（**与\"咸卦'朋从尔思'\"同一词，但义不同：此为\"助\"，彼为\"从\"**）；**\"今之政客，多属此类\"是讲义的现实批评**，本集照录；**其可用的核极准**：**\"节义\"能让人尊敬，\"才\"才能\"济蹇\"**——**两者不可互替**（**而\"未知己之才不济\"是这一条真正警告的东西**）。","o":"TJ-0443 · 天纪·人间道·蹇卦·第五、上爻（PDF 第86页）  ---"},{"t":"一百六十、解之道","h":"卦序：\"万物无终难之理，难至极而散\"","c":"定义——解卦（雷水解）为\"**雷行风止之课，患难解散之象**\"，其卦序讲义给了极简一条：\"**解者散也，万物无终难之理，难至极而散，故解为蹇之序。此卦震上坎下，外动内险——即动于险外，有出险之象，故为患难解散之时也。**\" **\"万物无终难之理，难至极而散\"这一句，是\"蹇→解\"的枢纽**：**没有永远持续的难——难到极点，它自己会散**（**这与\"剥极必复\"（复卦）是同一判断的另一处**）。** 而\"外动内险\"的卦象又给了它的条件**：**\"动于险外\"（在险的外面动）——而\"外动\"才能\"出险\"**。** **占例\"项羽受困垓下，卜得之，后果士卒溃散也\"**——**\"溃散\"二字正好是\"解\"的另一面**（**\"散\"既是难散，也可能是自己散**）。**卦图七物**：**①\"旗上提字：指名提凶，不利，有远走他乡之象\"**；**②\"一刀插地：求快也\"**；**③\"一兔走：卯年\"**；**④\"一鸡在边鸣：有竞争象\"**；**⑤\"贵人云中：不及救也\"**；**⑥\"道士手指门：入空门也，逃亡方向\"**；**⑦\"道人献书：装饰外表，示诚象\"**。**其中\"贵人云中：不及救也\"一物最要紧**：**贵人（救援）在\"云中\"——看得见，够不着**（**即：难解之时，不要指望\"贵人天降\"**）。**须说明**：**这是讲义对解卦序与卦图的注解**；**\"旗上提字＝指名提凶\"一物，指被点名通缉**，**本集只记象义，不涉现实对象**。","o":"TJ-0444 · 天纪·人间道·解卦（PDF 第87页）"},{"t":"一百六十、解之道","h":"卦辞：\"利西南，无所往，其来复吉，有攸往，夙吉\"","c":"要点——解卦辞为\"**解：利西南，无所往，其来复吉，有攸往，夙吉**\"，其解是全书对\"危机后的治理\"最完整的一段：\"**西南即坤方，坤之体本'含弘光大'。于天下之难方解时，人始离困苦——当以'宽大简易'之法待之，切不可使烦于苛政，人心必安；再求重修治道、立纲纪、建法治。且宜早动——如俟难复，则不及矣。**\" **这一段的次序极讲究，四步**：**①\"宽大简易\"（先让人喘口气）→②\"人心必安\"（安下来）→③\"重修治道、立纲纪、建法治\"（秩序重建）→④\"宜早动\"（趁热）。** **而\"切不可使烦于苛政\"是它的禁忌**：**刚脱困的人最受不了\"烦\"与\"苛\"**——**同样的法令，在平常不算苛，在难后就是苛。** **须说明**：**\"解：利西南，无所往，其来复吉，有攸往，夙吉\"是《易经》原文**；**\"西南\"为坤（顺、柔、含弘光大）**；**\"如俟难复，则不及矣\"这一句是它的时机判断**：**\"难复\"（难再起）之后再动手，就来不及了**（**因为\"人心\"只在刚解时是\"可安\"的，一旦重新固化，就难改了**）。","o":"TJ-0445 · 天纪·人间道·解卦（PDF 第87~88页）"},{"t":"一百六十、解之道","h":"彖：\"险以动，动而免乎险\"","c":"方法——解卦\"彖\"为\"**解，险以动，动而免乎险，解**\"，其解：\"**险则示难也，不险必不难；遇解时，如不动必不能出险——故此动是免于招险也。**\" **\"动而免乎险\"五个字，与\"坎卦'险以能行为功'\"是同一判断**：**险里\"动\"才有出路，不动就\"常居险中\"。** **而其递进的一句\"如不动必不能出险\"更直接**：**解卦的\"解\"不是\"等来的\"，是\"动出来的\"**。** 而\"不险必不难\"这一句，是\"解\"的相对性**：**没有险，就没有难**（**而\"解\"之后能维持多久，取决于\"险\"有没有被真正移除**）。**须说明**：**这是《易经》彖传原文加讲义之解**；**其可用的核**：**\"解\"有两个来源——一是\"难至极而散\"（自然的解），二是\"动而免乎险\"（作为的解）**；**而讲义把重点放在了后者**（**因为\"自然的解\"你等不到，或者等到了也不完美**）。","o":"TJ-0446 · 天纪·人间道·解卦（PDF 第88页）"},{"t":"一百六十、解之道","h":"\"有攸往夙吉\"与\"读《易》须体时之义\"","c":"要点——解卦\"彖\"中有三句短注，与一条方法论自述。**\"解利西南，往得众也\"**：\"**此即解难之道，须'广大且平易'之法以待民，则民心必归。**\" **\"其来复吉，乃得中也\"**：\"**治世之道，必待解之时来临方可往用，此为得宜。**\" **\"有攸往夙吉，往有功也\"**：\"**欲动而往，则必利速——愈早前往，功愈大；迟则害已生矣。**\" **而\"天地解而雷雨作，雷雨作而百果草木皆甲坼，解之时大矣哉\"的解，是全册极珍贵的一句方法论自述**：\"**天地之气开而和畅生雷雨，雷雨生而万物甲坼——故解能成天地之功，故圣人知'解之时'大也。读《易》须体'时'之义，方成得《易》之道。《易》之道与天地合而同德。**\" **\"读《易》须体'时'之义\"这一句，是讲义给出的读《易经》总纲**：**《易》的核心不是\"卦\"本身，是\"时\"**——**同一卦，在不同的\"时\"，含义不同**（**这一条与本册贯穿始终的\"随时\"\"知时\"\"适时\"完全一致**）。** **须说明**：**\"天地解而雷雨作……解之时大矣哉\"是《易经》彖传原文**；**\"甲坼\"（jiǎ chè）是\"种皮裂开、发芽\"**；**其可用的核有两条**：**①\"愈早前往，功愈大；迟则害已生矣\"——\"解\"的窗口期很短；②\"《易》之道与天地合而同德\"——这不是玄学，是\"以自然规律为尺度\"。**","o":"TJ-0447 · 天纪·人间道·解卦（PDF 第88页）"},{"t":"一百六十、解之道","h":"象：\"君子以赦过宥罪\"","c":"方法——解卦\"象\"为\"**雷雨作，解；君子以赦过宥罪**\"，其解：\"**天地解散而生雷雨，君子观雷雨之象，体会'发育之功'，而知'施恩仁、行宽法'也。**\" **\"赦过宥罪\"（赦免过失、宽宥罪责）是解卦给出的具体做法**：**在\"难方解\"的时候，要做的是\"宽\"，不是\"严\"**——**因为此时人刚从困苦里出来，再严一层，就又回到\"难\"里。** **须说明**：**\"雷雨作，解；君子以赦过宥罪\"是《易经》原文**；**⚠ 须限定**：**\"赦过宥罪\"是古代的治国语境（君主大赦），本集不取其字面的\"取消法律责任\"义**——**现代法治下，罪责的免除须依法定程序**；**其可用的核是\"宽严的时机\"**：**\"宽\"要放在\"刚解\"之时，\"严\"要放在\"重建秩序\"之时**（**而讲义给出的顺序正是：先宽（赦过宥罪）→后立（纲纪法治）**）——**倒过来（先严后宽）会把刚解的势又压回去。**","o":"TJ-0448 · 天纪·人间道·解卦（PDF 第88页）"},{"t":"一百六十一、解卦六爻","h":"初、二爻：\"无咎\"与\"田获三狐\"","c":"方法——**初爻\"无咎\"**：\"**初解之时，柔居阳刚，乃'柔而能刚'象——知刚柔之合宜，使患难解散。**\"其\"象\"：\"**刚柔相接又得其时宜，必无灾也。**\" **第二爻\"田获三狐，得黄矢，贞吉\"**，讲义把它放在了\"君弱臣强\"的处境里：\"**二与五阴位相应，此言'阴柔之君在上、阳刚之臣在'之时也。古来如君柔则小人易蔽——威必受损，又不果断且易受小人之惑；小人一近，则心动矣。处此时又逢灾难初解，圣人必以'能去小人、来正君之心、行其刚中之道'，方可吉。狐为邪媚之兽，黄乃直中也。**\"其\"象\"：\"**能得中正之道，除去邪恶，乃正且吉也。**\" **\"狐为邪媚之兽，黄乃直中也\"这一句，把爻辞的取象解尽了**：**\"三狐\"＝三个\"邪媚\"的人（谄媚之辈）；\"黄矢\"＝\"直中\"（黄色为中色，矢为直）**——**即：猎获三只狐狸（清除谄媚者），得到黄色的箭（守住\"直\"与\"中\"）。** **须说明**：**这是《易经》原文（解初六、九二）**；**\"田获三狐\"的\"田\"是\"田猎\"**；**其可用的核是\"君柔则小人易蔽\"这一句诊断**：**\"君柔\"（主事者性格软）不是\"温和\"，是\"易被遮蔽\"**——**因为\"柔\"的人\"不果断\"\"易受小人之惑\"，而\"小人一近则心动\"**（**即：软的人不是\"不会拒绝\"，是\"拒绝之后会动摇\"**）。","o":"TJ-0449 · 天纪·人间道·解卦·初、二爻（PDF 第88页）"},{"t":"一百六十一、解卦六爻","h":"第三、四爻：\"负且乘，致寇至\"与\"解而姆\"","c":"风险——**第三爻\"负且乘，致寇至，贞吝\"**。其解：\"**小人本非在上之物，今居下之上位，犹'负重而乘车'，乃招寇至，终必悔矣。**\"其\"象\"：\"**负重乘车、招寇致其之丑，乃咎由自取，又可怪谁呢？小人不量力、勉居君子之位处上，必终自招盗而夺之，自取其辱也。**\" **\"负重而乘车\"这个形象极准**：**背着沉重的东西（本分不够、能力不足），却坐在车上（占着高位）**——**两件事都对不上，所以招寇**（**\"寇\"来抢的不是\"车\"，是\"你不该坐的位置\"**）。** 而\"不量力、勉居君子之位\"是它的病因**。** 第四爻\"解而姆，朋至斯孚\"**：\"**阳刚之人居阴柔君之侧时，如居上位亲近小人，必使贤士远矣——须斥去小人，则君子必进，能得人之信孚。**\"其\"象\"：\"**如与君子至诚以交，则必无挡；故小人如能介乎中，则示人其交必不诚至也。**\" **须说明**：**这是《易经》原文（解六三、九四）**；**\"姆\"（mǔ）在此指\"贴身亲昵之人\"**（**一说为\"拇指\"，喻\"最亲近者\"**），**本集取\"亲昵之人\"义**；**其可用的核有两条**：**①\"负重乘车\"是\"德不配位\"的古典形象——\"致寇至\"说明祸不是外来的，是\"位置与能力不匹配\"招来的；②\"小人如能介乎中，则示人其交必不诚至\"——即：如果中间夹着一个\"亲昵之人\"，那么\"与君子至诚相交\"这件事本身就是可疑的。**","o":"TJ-0450 · 天纪：人间道·解卦·第三、四爻（PDF 第88页）"},{"t":"一百六十一、解卦六爻","h":"第五、上爻：\"君子维有解\"与\"射隼于高墉\"","c":"方法——**第五爻\"君子维有解，吉，有孚于小人\"**。其解：\"**君主之人必去小人，则君子必进、正道乃行；如不去小人，则天下不治——此可反看，即'天下不治，乃小人不去也'。**\"其\"象\"：\"**君子能解退小人，则君子之道方行——故能行君子之道，乃因能去小人也。**\" **\"此可反看，即天下不治，乃小人不去也\"这一句，是极精的\"反向推论\"**：**正面说法是\"去小人则天下治\"；反向说法是\"天下不治＝小人没去\"**——**而后者比前者更有力**（**因为它把\"治不好\"变成了一个可查的指标）。** **上爻\"公用射隼于高墉之上，获之无不利\"**：\"**解之至极如仍未解，必有坚强之害也——故于此时可强用弓矢，如射鹰隼于高处：时至而发。如无良器、又动不以时，射未成，必反生害。故此言'器之重要'与'动之时机'——获之必吉，不成反招凶。**\"其\"象\"：\"**公用射隼，以解悖也。**\" **上爻的\"器\"与\"时\"两件事，是全卦的收束**：**要解决\"解之极仍未解\"的顽症，需要\"良器\"（合适的工具／人）＋\"时至而发\"（正确的时机）**——**两者缺一，就会\"射未成，必反生害\"**（**即：一击不成，反被反噬**）。** **须说明**：**这是《易经》原文（解六五、上六）**；**\"隼\"（sǔn）是猛禽，\"高墉\"是高墙**——**喻\"居于高处、难以触及的强害\"**；**其可用的核极准**：**对\"高处的强害\"，不能\"随手一试\"**——**因为失败的成本是\"反生害\"**，**这与\"大过九三栋桡\"（无辅则不可当大任）是同一组判断。**","o":"TJ-0451 · 天纪·人间道·解卦·第五、上爻（PDF 第88页）  ---"},{"t":"一百六十二、损之道","h":"卦序：损下益上与取下求自足","c":"定义——损卦（山泽损）为\"**凿石见玉之课，握土为山之象**\"，其卦序讲义给了极清楚的判据：\"**解，散也、斥去也，其后必有所失，故损为序。此卦「艮」上「兑」下——山体高在上而泽体深在下，乃有'损下益上'之义。如损上而益下，为益卦；取下而求益上，则为损。故居人上而施恩泽于下则益，如取下而求自足，乃损。**\" **这一段的判据极硬，而且只用了两个动作来分**：**\"施恩泽于下\"（把好处往下给）＝益；\"取下而求自足\"（从下面拿上来给自己）＝损。** **即：损与益的分界不在\"谁多谁少\"，在\"方向\"。** **卦图四物**：**①\"二人对酌：二人夹木，来也\"**；**②\"酒瓶倒案：目前无指望也\"**；**③\"毬在地上：所求不成状\"**；**④\"文书二策有再告二字：再次求，方成\"**——**而总注是\"居此之时唯求有益于人，乃得损之真道也——'损其多余，同志乃至'\"**。** **须说明**：**这是讲义对损卦序与卦图的注解**；**\"损其多余，同志乃至\"六个字，是全卦对\"损\"最正面的一个定义**：**减掉多余的部分，\"同志\"（同气相求的人）才会来**——**即：多的东西挡着，该来的人就来不了。** **占例\"薛仁贵将收燕，卜得之，大破燕军\"**。","o":"TJ-0452 · 天纪·人间道·损卦（PDF 第89页）"},{"t":"一百六十二、损之道","h":"卦辞：\"有孚，元吉\"与\"二簋可用享\"","c":"要点——损卦辞为\"**损：有孚，元吉，无咎，可贞，利有攸往。曷之用？二簋可用享**\"。**前段的解**：\"**损之道须持之正理，来自诚正——则损因顺理而至大善，此可吉也。坚固常行，必利有所往。常人之损，有过或不及或不常，皆不合乎正理。**\" **\"常人之损，有过或不及或不常\"这三个偏差，正好是最常见的三种错法**：**\"过\"（损得太多，伤本）、\"不及\"（舍不得损，留着病）、\"不常\"（一阵一阵，没有持续性）。** **而后段\"二簋可用享\"（两簋饭就够祭了）的解，是全册对\"俭\"最完整的一段**：\"**人间祭祀之礼，文繁节褥，常人多备祭品；圣人以俭为礼之本，示以至诚之心敬天——如求祭物过多，乃求饰其诚，实示人伪矣。故知凡人之欲望若有遇者，其始初皆起于奉养，常久以后则成宫楼峻墙、酒池肉林——圣人有见于此，故先制其本以俭。故损之精义在'损灭人欲以近乎天理'而已。**\" **\"如求祭物过多，乃求饰其诚，实示人伪矣\"这一句极精**：**礼的规格一旦超过\"诚\"的需要，它就不再是\"敬\"，是\"表演\"**——**而\"表演\"的本质是\"伪\"。** **须说明**：**\"损：有孚，元吉，无咎，可贞，利有攸往；曷之用？二簋可用享\"是《易经》原文**；**\"二簋\"是\"两簋饭\"（最简的祭品）**；**其可用的核**：**\"俭\"不是\"省钱\"，是\"把'本'立在'诚'上，而不是立在'物'上\"**——**而\"欲望\"的膨胀有它的路径：起于奉养（过日子）→久而成宫楼酒池（奢）**（**讲义说\"先制其本以俭\"——要在它还小的时候制）。**","o":"TJ-0453 · 天纪·人间道·损卦（PDF 第89页）"},{"t":"一百六十二、损之道","h":"彖：\"损刚益柔有时\"与\"损益盈虚，与时偕行\"","c":"方法——损卦\"彖\"中有两条极重要的方法判断。**第一条\"二簋应有时，损刚益柔有时\"**：\"**吾人应损去外在浮饰，使至诚见。万事之始，必有长幼尊卑；然于事之末，往往已流于形式。损之时乃知何时须'损刚益柔'——此损之道必以'时'乃吉。**\" **\"万事之始，必有长幼尊卑；然于事之末，往往已流于形式\"这一句，是\"形式化\"的规律**：**事情开始时定的规矩（长幼尊卑）是必要的**；**但到了后来，它就\"流于形式\"（只剩下形式，没有内容）**——**而\"损\"要损的，正是这个\"已经空掉的形式\"。** **第二条\"损益盈虚，与时偕行\"**：\"**须损须益、求盈求虚，只随时之一念而已——《易》之于'时'义，于此可见。**\" **须说明**：**这是《易经》彖传原文加讲义之解**；**\"与时偕行\"是《易经》的核心命题之一**（**与\"解卦读《易》须体时之义\"同一主张**）；**其可用的核极准**：**判断\"该损还是该益\"，没有固定答案，只有\"看时\"**——**而在\"事之末\"（形式已空）时该损，在\"事之始\"（内容未立）时该益**；**⚠ 须补一句**：**\"损刚益柔\"的\"刚柔\"在此是卦爻的阴阳配属（并非\"刚强／柔弱\"的人格义）**，**本集不取人格义**。","o":"TJ-0454 · 天纪·人间道·损卦（PDF 第89~90页）"},{"t":"一百六十二、损之道","h":"象：\"君子以惩忿窒欲\"","c":"方法——损卦\"象\"为\"**山下有泽，损；君子以惩忿窒欲**\"，其解只一句却极硬：\"**君子观损之象，以'损己'为上——修己之道在'忿'与'欲'上；能知损己之忿与欲，乃得真损之时义。**\" **\"惩忿窒欲\"（制住忿怒、堵住欲望）四个字，把\"损\"的第一个对象定在了\"自己\"身上**：**损卦的名字是\"损下益上\"（从下面拿给上面），而它的第一件事是\"损己\"**——**即：先损自己的\"忿\"与\"欲\"，才谈得上别的\"损\"。** **须说明**：**\"山下有泽，损；君子以惩忿窒欲\"是《易经》原文**；**\"惩\"是\"制止\"，\"窒\"是\"堵住\"**；**其可用的核**：**这两样（忿、欲）之所以被单独点出，是因为它们是\"往下拿\"（损人）的两个动机**——**\"忿\"（生气）时人会去损别人，\"欲\"（贪求）时人也会去损别人**（**故先制住这两样，才不会以\"损\"为名去\"损人\"**）。**这一条与\"咸卦虚受人\"（先空出位置）、\"大壮非礼弗履\"（先约束自己）构成一组**：**三处都在讲\"先处理自己\"。**","o":"TJ-0455 · 天纪·人间道·损卦（PDF 第90页）"},{"t":"一百六十三、损卦六爻","h":"初、二爻：\"已事遄往\"与\"弗损益之\"","c":"方法——**初爻\"已事遄往，无咎，酌损之\"**：\"**损之道，在'损刚益柔'也。今居下之人为益上，当以功与之、不求己居——事毕则速去，不求居功，乃能无过。若求享其功之美，此离'损下益上'之道，不可也。**\"其\"象\"：\"**事毕后退居不居功，能与上合志也。**\" **第二爻\"利贞，征凶，弗损益之\"**：\"**刚中之人与君位柔性相应；居损时，用'柔悦态度'求应于上，则有失刚中之德——其动必凶，乃因不知坚心于阳刚也。此适足以损也。**\"其\"象\"：\"**九二阳刚之人能守中正之道，则何有不吉；志存乎中道，则必自正也。**\" **初爻给了一条极实用的\"做事规矩\"**：**\"事毕则速去，不求居功\"**——**而这恰是\"损下益上\"的正确姿势**（**把功劳给上面，自己不留**）；**而\"若求享其功之美\"是它的反面**（**想要享受那份功劳的\"美\"，就已经背离了\"损\"）。** **第二爻则给了另一个反面**：**\"用柔悦态度求应于上\"**（**为了迎合上面，把自己变软**）——**\"则有失刚中之德\"**。** **须说明**：**这是《易经》原文（损初九、九二）**；**\"遄\"（chuán）是\"快、速\"**；**\"酌损之\"（斟酌着损）说明\"损\"要有度**；**其可用的核有两条**：**①\"不求居功\"不是\"不要功劳\"，是\"不享受那个位置\"；②\"为了迎合而变软\"是\"自损其德\"**——**两处都在讲\"损\"的一个前提：损可以损\"物\"，不能损\"德\"。**","o":"TJ-0456 · 天纪·人间道·损卦·初、二爻（PDF 第90页）"},{"t":"一百六十三、损卦六爻","h":"第三爻：\"三人行，则损一人\"","c":"要点——第三爻\"**三人行，则损一人；一人行，则得其友**\"，是全卦最有名的一条。其解：\"**天下没有独一之人，必有二者——如男女之往，由其精一，故能生也。一阴一阳，无法加入——故三人因志不专一，必生'损一人'；一人独行，由其志为专，故必有一友能同其志。故天地之间，'损'义之明且大哉，莫过于此。**\"其\"象\"：\"**一人行而能得友；三人行则易生疑——于此时须明损之道：损去一人，乃损多余。**\" **\"三人行则损一人，一人行则得其友\"讲的是\"专一\"与\"多余\"**：**一阴一阳（两个人）刚好，加不进第三个——所以三个人必然要\"损一人\"**；**而\"一人行\"（独自走）反而\"得其友\"（得到一个真正的同伴），因为\"其志为专\"。** **而\"三人因志不专一，必生损一人\"这一句的解释极准**：**三个人在一起，不是\"人多力量大\"，是\"志不专一\"**——**因为注意力分散在三个人之间，每一对关系都不完整。** **须说明**：**这是《易经》原文（损六三）**；**\"损去一人，乃损多余\"是象辞的定论**——**即：减掉的那个人，不是\"被淘汰\"，是\"本来就多余\"**；**其可用的核极准**：**判断一段关系／一个团队\"该不该减人\"，看的是\"志专不专一\"，不是\"人多不多\"**——**而\"三人行则损一人\"的结论是\"减到能专一为止\"**（**这与\"比卦'两志相求'\"、\"咸卦'所感狭小'\"是同一组关于\"关系密度\"的判断**）。","o":"TJ-0457 · 天纪·人间道·损卦·第三爻（PDF 第90页）"},{"t":"一百六十三、损卦六爻","h":"第四爻：\"损其疾，使遄有喜\"","c":"方法——第四爻\"**损其疾，使遄有喜，无咎**\"。其解：\"**阴柔之人居损时，须自损以从阳刚中正之道——即'损不善而从善'，必有喜而无灾。人之损过失，唯患不速——如速，则此过必不至深，为可喜也。**\"其\"象\"：\"**知损之道、得损之时，速去其不善，此可喜也。**\" **\"人之损过失，唯患不速；如速，则此过必不至深\"这一句，是\"纠错\"最实用的一条**：**改错的关键不在\"改得彻底\"，在\"改得早\"**——**因为早改，过还没 \"深\"（还没长出根）。** **须说明**：**这是《易经》原文（损六四）**；**\"疾\"在此作\"毛病、过失\"解**（**不是\"疾病\"**）；**\"遄\"（快）与初爻\"已事遄往\"同字**——**两处都用\"速\"**；**其可用的核极准**：**\"损\"的对象若是\"自己的毛病\"，则唯一的要求是\"快\"**——**而\"使遄有喜\"的意思是：快一点，就有\"喜\"（好的结果）**（**这与\"复卦不远复、知不对立改\"是同一判断**：**\"立\"字排除了\"等等再说\"**）。","o":"TJ-0458 · 天纪·人间道·损卦·第四爻（PDF 第90页）  ---"},{"t":"一百六十四、损卦后二爻","h":"第五爻：\"或益之，十朋之龟\"——虚中自损","c":"方法——损卦第五爻\"**或益之，十朋之龟，弗克违，元吉**\"。其解：\"**君王能柔顺居尊位，处损之时，知'虚中自损'、顺从在下阳刚之贤人——人君能如此，则天下人必从其德，咸以'损己'为美，故有众民之公论助之；因合正理，即龟筮亦不相违，可谓大善之吉也。古云：'谋能从众，则合天心。'**\"其\"象\"：\"**人君能尽众人之见，合于天地之理，天必降福祐也。**\" **\"虚中自损\"四个字，是\"损\"在君位上的正确姿势**：**\"虚中\"（心里空着，不预设）、\"自损\"（先减自己）**——**而它的结果是\"顺从在下阳刚之贤人\"**（**即：因为自己空了，下面的人才上得来**）。** **须说明**：**这是《易经》原文（损六五）**；**\"十朋之龟\"是\"极贵重的宝龟\"**（**古代以贝为币，\"十朋\"是重价**）——**取\"最有价值的判断（龟卜）都不违逆它\"**；**其可用的核**：**\"谋能从众，则合天心\"这一句，是\"决策\"的古典标准**——**而\"能尽众人之见\"是它的做法**（**不是\"听大家的\"，是\"把大家的见都尽量纳进来\"**）。","o":"TJ-0459 · 天纪·人间道·损卦·第五爻（PDF 第100页）"},{"t":"一百六十四、损卦后二爻","h":"上爻：\"弗损益之\"——君子之志唯在益人","c":"要点——损卦上爻\"**弗损益之，无咎，贞吉，利有攸往，得臣无家**\"。其解：\"**损道之终极：能居上而不损其下、又益增在下之人，则天下莫不服从、人心归顺，无远近内外之区限。**\"其\"象\"是全卦的总结，也是全册对\"君子\"最简的一个定义：\"**居上而不损下、又能增益之，君子必能遂行其志。故简言之：'君子之志，唯在如何益于人而已。'**\" **\"君子之志，唯在如何益于人而已\"这一句，把\"损卦\"整个翻了过来**：**这一卦叫\"损\"，讲的是\"减法\"；而它的终点是\"弗损\"（不再减）＋\"益之\"（反而增加）。** **即：损的尽头是益。** **须说明**：**这是《易经》原文（损上九）**；**\"得臣无家\"指\"得到臣民而不分彼此（无内外之别）\"**；**其可用的核极准**：**\"君子之志，唯在如何益于人\"是一个可自检的标准**——**如果一个人（或一个组织）的\"志\"里，\"如何益人\"这一条长期缺位，那它就不是\"君子之志\"，无论它多能\"损\"。**","o":"TJ-0460 · 天纪·人间道·损卦·上爻（PDF 第100页）"},{"t":"一百六十五、益卦：损上益下","h":"卦序：\"损而不已必生益\"与\"民厚则国安\"","c":"定义——益卦（风雷益）为\"**鸿鹄遇风之课，河水溢出之象**\"，其卦序讲了一个循环：\"**损而不已必生益——自古盛衰损益，天理循环，损至极生益，所以继损也。此卦巽上震下，风雷二物互相增益——雷受风则迅，风受雷激则烈，互相助威，所以成益象。损上益下故为益；前卦乃损下益上故损。以其义而推，吾人可知'民厚则国安'。**\" **\"损而不已必生益\"六个字，是\"损→益\"的枢纽**：**一直减下去，必然生出\"增\"来**——**而\"天理循环\"（盛衰损益）是它的背景。** **而\"风雷二物互相增益\"（雷受风则迅、风受雷激则烈）的取象，给了\"益\"的机制**：**\"益\"不是\"一方给另一方\"，是\"互相助威\"**——**两者都在长。** **而\"民厚则国安\"这一句，是\"损上益下\"的政治结论**：**下面的人厚了，国家才安**。**卦图四物**：**①\"官人抱合子：倌人，丈夫也，事必先成后破\"**；**②\"一人推车：因时而动之象\"**；**③\"一鹿一钱：才禄俱备，有回禄之灾，财有破损，忧心忡忡\"**；**④总注：\"不为财货，不畏时（势）之变，明知先成后破，仍走马上任——以'损上益下'之道，天下或事业亦能平治。\"** **\"明知先成后破，仍走马上任\"这一句极动人**：**知道了结局不完美（先成后破），还是去做**——**而理由不是\"求成\"，是\"以损上益下之道\"**。**须说明**：**这是讲义对益卦序与卦图的注解**；**\"回禄之灾\"（火灾）\"刘姓\"一类属象数取象**，本集只记不解。","o":"TJ-0461 · 天纪·人间道·益卦（PDF 第91页）"},{"t":"一百六十五、益卦：损上益下","h":"彖：\"损上益下，民说无疆\"与\"木道乃行\"","c":"方法——益卦\"彖\"有三层。**第一层\"益，损上益下，民说无疆，自上下下，其道大光\"**：\"**益之本义，其道在'损于上而益于下'——民必悦之且无尽无穷；从上而降、下之下亦受之，益道乃光显而大也。**\" **第二层\"利有攸往，中正有庆；利涉大川，木道乃行\"**：\"**以中正之道助益天下，天下受福，故往吉。万物中唯木助益人类最大——举凡药材、车船、筑室等皆不离木；木于平时尚未显其要，但于艰危困顿时，则助益乃大——益道亦如是。**\" **第三层\"益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行\"**：\"**益道之动乃在乎'顺'——动不顺乎理，必不成益。天道滋始、地道成物，而化育万物、各正性命，使益之道广大无边。圣人体天地之道，知能利乎天下之道，必须'顺乎时应乎理、因时制宜'，乃益之大道。**\" **第二层里\"木于平时尚未显其要，但于艰危困顿时，则助益乃大——益道亦如是\"这一句，是极好的比喻**：**木头平时不显眼（做桌椅门窗），到艰难时才显出它多重要（做车船、建屋、药材）**——**而\"益道\"也一样：平时看不出\"益\"的价值，难时才显。** **须说明**：**这是《易经》彖传原文加讲义之解**；**\"动不顺乎理，必不成益\"这一句是\"益\"的硬条件**（**即：动机再好，不顺理也成不了益**）；**其可用的核**：**\"顺乎时应乎理、因时制宜\"三句，是\"益\"的方法论**（**时、理、宜——三个都要顾**）。","o":"TJ-0462 · 天纪·人间道·益卦（PDF 第91页）"},{"t":"一百六十五、益卦：损上益下","h":"象：\"君子以见善则迁，有过则改\"","c":"方法——益卦\"象\"为\"**风雷，益；君子以见善则迁，有过则改**\"，其解：\"**风与雷二物相互助益；君子观其象，而知'益于己之道'，乃在'见善则迁'（则可尽天下之善）、'有过能改'（则无过矣）。**\" **\"见善则迁，有过则改\"八个字，是《易经》里最简的一条自我修养**：**两个动作——看到好的就\"迁\"（跟过去、照做）；有过错就\"改\"。** **而\"迁\"这个字用得极准**：**不是\"知道好\"，是\"迁过去\"（把自己挪到那个\"好\"上面）**——**即：从\"认可\"到\"实行\"，中间有一步\"迁\"。** **须说明**：**\"风雷，益；君子以见善则迁，有过则改\"是《易经》原文**；**这一条与\"损卦惩忿窒欲\"恰成一对**：**损卦讲\"减\"（惩忿窒欲），益卦讲\"加\"（见善则迁）**——**两卦合起来，就是\"该减什么、该加什么\"。** **其可用的核极准**：**判断一个人有没有在\"长\"，看这两条**——**\"见善则迁\"（还在学）与\"有过则改\"（还能改）**；**两条都停了，就停止成长了**（**而这两条都不需要\"天赋\"，只需要\"肯\"。**","o":"TJ-0463 · 天纪·人间道·益卦（PDF 第91~92页）"},{"t":"一百六十六、益卦前二爻","h":"初爻：\"利用为大作\"——下位而得上位支持","c":"风险——益卦初爻\"**利用为大作，元吉，无咎**\"。其解：\"**初九为阳刚之贤，如遇六四上位之顺时——亦即'居下位而有能力之贤才，能得上位之顺从支持'，必做大益于天下之事，此为'大作'。如不能持此原则，不但悔咎来临，且又累上位，此是上位之过也。如益众人，则必无过。今人多志得意满、狐假虎威、欺上瞒下，唯图利自己而已。**\"其\"象\"：\"**下位之人本就不可担重大之事；今得上位信赖而出任大事，必须能济世助人，方可使上位有'知人善任'之誉；如只会坏事、民怨四起，则上下皆有过失也。**\" **\"今人多志得意满、狐假虎威、欺上瞒下，唯图利自己而已\"这一句，是\"下位而得上位支持\"这种处境最常见的败坏**：**\"狐假虎威\"（借上面的势）、\"欺上瞒下\"（两头骗）、\"唯图利自己\"（目的错了）**——**三者都源于同一个前提：把\"上位支持\"当成了\"自己的权力\"。** **须说明**：**这是《易经》原文（益初九）**；**\"大作\"指\"大事业\"**；**其可用的核极准**：**\"下位而得上位支持\"的人，唯一的安全做法是\"做益众人之事\"**——**因为\"如益众人，则必无过\"**（**即：把事做在\"众人受益\"上，无论成不成，都不算错**）；**而\"只会坏事、民怨四起\"的后果是\"上下皆有过失\"**（**连支持你的上位也一起错**）。","o":"TJ-0464 · 天纪·人间道·益卦·初爻（PDF 第92页）"},{"t":"一百六十六、益卦前二爻","h":"第二爻：\"或益之，十朋之龟\"——中虚来求益","c":"方法——益卦第二爻爻辞与损卦第五爻相同（\"**或益之，十朋之龟，弗克违，永贞吉，王用享于帝，吉**\"），而解法不同：\"**人能处于中正之道，又知'中虚'来求益，且能顺从无私——天下何不能受？必不相违，日久更吉。如此则必能通上位、获吉，人皆相从矣。**\"其\"象\"：\"**能知益天下之道且坚守此道，必令众人自外而来归矣。**\" **\"中虚来求益\"这四个字，是全卦对\"如何得到帮助\"的回答**：**\"中虚\"（心里空着）＋\"求益\"（去求）**——**即：先空，再求**（**空着才装得进，装得进才叫\"益\"**）。** **须说明**：**这是《易经》原文（益六二）**；**同一句爻辞在损、益两卦出现（损六五、益六二），而两处的位置恰好相对**（**损卦在\"五\"（君位），益卦在\"二\"（臣位）**）——**即：同一句话，君说与臣说，分量不同**；**其可用的核**：**\"顺从无私\"是\"求益\"被允许的前提**——**因为\"求益\"若带着私心，就不是\"益\"了**（**这与\"损卦'损己之忿与欲'\"是同一条**）。","o":"TJ-0465 · 天纪·人间道·益卦·第二爻（PDF 第92页）  ---"},{"t":"一百六十七、益卦后四爻","h":"第三、四爻：\"益之用凶事\"与\"告公从\"","c":"方法——**第三爻\"益之用凶事，无咎。有孚中行，告公用圭\"**：\"**六三乃相位，居下民之上统管民事——如能居民上而刚决，其果为'益民而决'，即令是凶事，亦可无咎。但仍须以诚意通于上，使上能信任；如所为不合中道，即令上信，亦不可为也。**\"其\"象\"给了一条极实用的授权边界：\"**居下凡事当禀明于上，乃得诚信；但如遇危难救灾之事，可立以刚决，必能无咎。**\" **\"为益民而决，即令是凶事，亦可无咎\"这一句，是\"决断\"的免责条件**：**只要决断的目的是\"益民\"，即使这件事本身是\"凶事\"（不吉、得罪人、有风险），也不算错。** **而\"如遇危难救灾之事，可立以刚决\"则是\"先禀后行\"的唯一例外**：**平常必须请示，遇到危难救灾可以不请示**——**因为那时请示就误事了。** **须说明**：**这是《易经》原文（益六三）**；**\"告公用圭\"指\"用圭（信物）上报于公\"**——**即\"走正式渠道报告\"**；**其可用的核**：**\"如所为不合中道，即令上信，亦不可为也\"——即使领导批准了，若不合中道，也不能做**（**即：授权不等于正当**）。** **第四爻\"中行，告公从，利用为依迁国\"**：\"**居君侧，以柔顺从君，对下又顺应于初阳之刚贤——如此则能令民顺而从行。**\"其\"象\"给了极精的一句：\"**其动之志在益天下，上必信从——因其为公不为私。故古人不患上之不从，患己之不正。**\" **\"古人不患'上之不从'，患'己之不正'\"这一句，是\"向上做事\"的正心法**：**不担心上面不批准，只担心自己不正**——**因为\"为公不为私\"时，上面必从；怕的是自己的动机先歪了。**","o":"TJ-0466 · 天纪·人间道·益卦·第三、四爻（PDF 第92页）"},{"t":"一百六十七、益卦后四爻","h":"第五爻：\"有孚惠心，勿问元吉\"","c":"要点——益卦第五爻\"**有孚惠心，勿问元吉，有孚惠我德**\"。其解：\"**阳刚君王，居尊心中又诚正，必能益于天下——不问可知；天下之人必至诚爱戴，因君之能施恩德也。**\"其\"象\"：\"**人君有至诚增益天下之心，不须问——天下之民必怀德承恩，益道大行，人君志必行。**\" **\"勿问元吉\"（不必问，就是大吉）这一句，是\"以德服人\"的核心**：**如果\"惠心\"（施惠之心）是真的，那么结果（大吉）\"不问可知\"**——**即：不必去算，也不必去求，方向对了，结果自己会来。** **须说明**：**这是《易经》原文（益九五）**；**\"有孚惠心\"是\"有诚信的施惠之心\"**；**其可用的核**：**\"不问可知\"是一种\"不需要验证的信心\"**——**而它有前提（\"心中又诚正\"）**；**⚠ 须补一句**：**\"不问可知\"在现实里不能当\"不必评估\"用**——**政策、治疗、投入，凡涉及他人代价的，\"惠心\"再好也必须验证结果**（**讲义此句是\"德\"的层面，不是\"事\"的层面**）。","o":"TJ-0467 · 天纪·人间道·益卦·第五爻（PDF 第92页）"},{"t":"一百六十七、益卦后四爻","h":"上爻：\"莫益之，或击之\"——专欲利己者招怨","c":"风险——益卦上爻\"**莫益之，或击之，立心勿恒，凶**\"，是全卦的收束之戒。其解：\"**以刚处益之极，此'专欲利己、不与众同欲'，必招怨，或受攻击。圣人戒之在'人欲'——坚心不可有私欲，否则招凶；有则须速改。**\"其\"象\"：\"**若以私利增益自己，人必与争之，必不肯之——或言辞偏，或攻击之，皆自外来。起因皆因己心不合正理、私欲专利而成。**\" **\"专欲利己、不与众同欲，必招怨\"这一句，把\"益\"走到极处的败局讲尽了**：**益卦讲\"益人\"，而到了最上面（益之极），却变成\"益己\"**——**于是\"莫益之\"（没人再来益他）＋\"或击之\"（有人来打他）。** **而\"或言辞偏，或攻击之，皆自外来——起因皆因己心不合正理\"这一句，是\"外来的攻击\"的归因**：**攻击确实来自外面，但\"起因\"在里面**（**因为\"私欲专利\"）。** **须说明**：**这是《易经》原文（益上九）**；**\"立心勿恒\"指\"心不能坚持正道\"**；**其可用的核极准**：**\"莫益之，或击之\"是一条因果链的两端**——**因为\"专欲利己\"，所以\"没人益他\"；也因为\"专欲利己\"，所以\"有人击他\"**；**而讲义给出的解法是\"有则须速改\"**（**不是\"辩解\"，是\"改\"**）。","o":"TJ-0468 · 天纪·人间道·益卦·上爻（PDF 第92页）"},{"t":"一百六十八、夬卦：决而和","h":"卦序：\"益之至极，犹水之满溢\"与\"君子道长，小人道消\"","c":"定义——夬卦（泽天夬）为\"**神剑斩蛟之课，先损后益之象**\"，其卦序：\"**益之至极，犹水之满溢，必决出之——夬者，决也，必决而后止。以卦体而言，兑上乾下，有水之聚高至顶，则溃决也。如以爻而言，五阳在下，阳之长而阴将退，有'众阳决去一阴'之象——故于人间道，则此为'君子道长，小人道消'之时也。**\" **\"益之至极，犹水之满溢，必决出之\"这一句，是\"夬\"的来源**：**一直\"益\"（加水）到最后，水满了，必然要\"决\"（溃出）**——**即：夬不是\"主动去断\"，是\"满到必须断\"。** **而\"必决而后止\"四个字，给了\"断\"的必要性**：**不断，它不会自己停**。**卦图七物**：**①\"二人同行：相辅相成，可成事也\"**；**②\"前水后火：前险而后明，宜进取象\"**；**③\"虎蛇当道：虎，有权威之人；蛇，险奸之小人阻道\"**；**④\"一人斩蛇：勇士也，得名将也\"**；**⑤\"竿上有文字：扬竿而起，正名出师\"**；**⑥\"竿下有錢：行动有利也\"**；**⑦\"錢下有火：燒錢状，主喪服\"**。** 其中\"**正名出师**\"一物与卦辞\"扬于王庭\"同指**。** **占例\"汉高祖欲拜韩信为将，卜得之，知有王佐才也\"**。**须说明**：**这是讲义对夬卦序与卦图的注解**；**\"君子道长，小人道消\"是《易经》对夬卦的标准判语**——**而⚠ 须补一句**：**\"君子／小人\"在此是\"阳／阴\"的卦爻配属，现实里不能拿来给人贴标签**（**讲义全书用这一组词时，指的是\"行为\"不是\"身份\"**）。","o":"TJ-0469 · 天纪·人间道·夬卦（PDF 第93页）"},{"t":"一百六十八、夬卦：决而和","h":"卦辞：\"扬于王庭\"与\"不利即戎\"","c":"方法——夬卦辞为\"**夬：扬于王庭，孚号，有厉。告自邑，不利即戎，利有攸往**\"。**\"扬于王庭，孚号，有厉\"的解**：\"**夬之道，在小人式微、君子道长，必显于公堂，使人明善恶——故'扬于王庭'。于此时敬戒之以至诚以命下民，使民戒之，居安思危、随时生戒惧之心，必无后患。**\" **\"必显于公堂，使人明善恶\"这一句，是\"决\"的正确方式**：**要\"断\"一个人／一件事，必须\"公开\"（扬于王庭）**——**因为公开的作用是\"使人明善恶\"，不是\"让人看着解气\"。** **而\"告自邑，不利即戎，利有攸往\"的解更硬**：\"**夬之道能于至善，必不尚武力——从修己开始，齐家后能治国，以道服众，如此则可进而往。**\" **\"必不尚武力\"是夬卦的核心禁令**：**这一卦讲\"决\"，但它的\"决\"不是\"打\"**——**\"不利即戎\"（不宜动武）**；**而路径是\"修己→齐家→治国→以道服众\"**（**一个都不能跳）。** **须说明**：**这是《易经》原文加讲义之解**；**\"即戎\"是\"用兵\"**；**\"孚号\"是\"以诚信号令\"**；**其可用的核极准**：**\"决\"的正当性来自\"公开＋以道\"，不来自\"力量\"**——**而讲义把路径写成了\"从修己开始\"，即：先处理自己，再谈处理别人**（**这与\"损卦惩忿窒欲\"\"益卦见善则迁\"是同一组\"先己后人\"**）。","o":"TJ-0470 · 天纪·人间道·夬卦（PDF 第93页）"},{"t":"一百六十八、夬卦：决而和","h":"彖：\"健而说，决而和\"与\"其危乃光\"","c":"要点——夬卦\"彖\"有四句极重要。**\"夬，决也，刚决柔也。健而说，决而和\"**：\"**五阳去一阴，下健而上悦——乃因健而能悦、能和，此决道之至善。**\" **\"决而和\"三个字，给\"断\"立了标准**：**\"决\"（断开）本来容易\"裂\"；而\"和\"是说——决的结果要让剩下的仍然和。** **即：断得对，不是\"断得狠\"。** **\"扬于王庭，柔乘五刚也。孚号有厉，其危乃光也\"**：\"**阴居阳上，此不正也；君子去之，当扬其罪于公堂，使民众知善恶也。以衷心至诚带领民众，使知戒惧——防危之至，君子之道方可显其力大。**\" **\"其危乃光\"（正因为有危，才显其光）这一句，是\"居安思危\"的另一种表述**：**不是\"危\"让人受损，是\"危\"让\"道\"显出力量。** **\"告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也\"**：\"**夬之时，不可崇武以力取——必须从修治本身之地起，方可有利前进、光大君子阳刚之道。待正道至刚时，决不可留一邪吝之道，此'刚进至终'可吉也。**\" **须说明**：**这是《易经》彖传原文加讲义之解**；**\"决不可留一邪吝之道\"这一句值得单记**：**等到正道足够刚的时候，一丁点歪的都不能留**（**因为留下的那一点，会成为新的起点**）；**其可用的核**：**\"决而和\"＋\"不可崇武\"＋\"刚长乃终\"三句，构成\"断\"的三条件**：**方式要和（不裂）、手段不用武（不靠力）、时机在\"刚长\"（够强才动手）。**","o":"TJ-0471 · 天纪·人间道·夬卦（PDF 第93~94页）"},{"t":"一百六十八、夬卦：决而和","h":"象：\"施禄及下，居德则忌\"","c":"方法——夬卦\"象\"为\"**泽上于天，夬；君子以施禄及下，居德则忌**\"，其解：\"**（泽水积到天上，是即将溃决之象。）**\" **\"施禄及下\"（把好处分给下面）与\"居德则忌\"（不可把德留在自己身上）两个动作，是夬卦给\"盈满\"开的泄口**：**水积到天上会溃——所以要把水\"放下去\"（施禄及下）**；**而\"德\"若\"居\"（囤着不放），也是同样的危险（\"忌\"）。** **\"居德则忌\"四个字极精**：**积德不留，如积水不泄，必溃。** **须说明**：**\"泽上于天，夬；君子以施禄及下，居德则忌\"是《易经》原文**；**\"居德\"指\"把德守住不放（囤积）\"**；**其可用的核极准**：**这一条与\"损卦'损其多余，同志乃至'\"、\"益卦'损上益下'\"合成一组关于\"蓄与泄\"的判断**——**凡是\"积\"到一定程度的（水、财、德、功），都要有\"泄\"的通道**（**否则\"必决\"，而那个\"决\"不是你选的时机与方式——这与\"大畜上九何天之衢'积到最后不是存着是散之天下'\"是同一件事）。**","o":"TJ-0472 · 天纪·人间道·夬卦（PDF 第93页）  ---"},{"t":"一百六十九、夬卦六爻","h":"象的续解与初、二爻：\"施禄于天下\"与\"惕号\"","c":"方法——夬卦大象的续解值得单列：\"**水之聚而上于天，为夬象——其终必决于上，而灌溉于下。君子观象法天，故知必施禄于天下，则民皆向之；于安处之时，知须防禁，则无溃散之虞。**\" **\"其终必决于上，而灌溉于下\"八个字，是\"决\"的正确方向**：**水在天上（高位、集中的资源），最终要\"决\"下来\"灌溉于下\"**——**而这就是\"施禄于天下\"**；**而\"于安处之时，知须防禁\"是它的配套**（**在还安稳的时候，就要设\"防禁\"（规矩、堤防），才不会\"溃散\"**）。** **初爻\"壮于前趾，往不胜为咎\"**：\"**在下位刚健之人，于决之时，必强进执行——如执行中受阻而失败，必'决之过'。故凡事欲动之前，必戒之在躁，做最坏之打算，方可行进。**\"其\"象\"：\"**君子之行，必度量而进；知不可而力求，必招咎也。小人无此之戒，不量力而进，其果自取其辱。**\" **第二爻\"惕号，莫夜有戎，勿恤\"**：\"**君子去小人之时，必思怀戒备，不松懈一时——如此，即令夜有兵戎，亦不惊也。**\"其\"象\"给了一句方法论：\"**有戎不惊忧，乃因自处之善，能行中道、知所戒惧也——故学《易》之人必'知时识势'，不知如此，遑论精《易》。**\" **\"学《易》之人必知时识势，不知如此，遑论精《易》\"这一句，是讲义第二次给出读《易》的条件**（**第一次是解卦\"读《易》须体时之义\"**）——**两次都指向同一件事：离开了\"时\"与\"势\"，《易》只是一堆字。** **须说明**：**这是《易经》原文（夬初九、九二）加讲义之解**；**\"戒之在躁，做最坏之打算\"是极实用的行动准则**（**先想好最坏，再动**）；**其可用的核**：**\"知不可而力求，必招咎\"——明知做不到还要硬来，是\"自取其咎\"**（**不是\"命不好\"**）。","o":"TJ-0473 · 天纪·人间道·夬卦·初、二爻（PDF 第94页）"},{"t":"一百六十九、夬卦六爻","h":"第三爻：\"壮于頄，有凶\"与\"愚善\"","c":"风险——夬卦第三爻\"**壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎**\"。其解：\"**九三居相位，上有君王，却刚于果决——此'决'乃自任之决，必非合君意，果必招凶。故君子居夬之时，知己道之长、小人之道将消，必不独与小人合，且面现愠色，必可无咎。**\" **\"此决乃自任之决，必非合君意\"这一句，是\"越权的决\"**：**在相位（臣位）上却\"刚于果决\"，自己做主——即使方向对，也\"必招凶\"**（**因为\"决\"是君位的事（夬九五'君为决定之主'）**）。** 而接下来的一段批评极精：\"**今人皆自以为重要，见人之招凶，不论其因为何，一律给予支持——此'愚善之表现'，徒令小人得逞，不知反悔、反更盛其势，此祸之端，乃肇因于人之愚善。**\" **\"愚善\"二字，是全册极罕见的造词，而它指得很准**：**\"见人招凶，不问他为什么招凶，一律支持\"**——**这种\"善\"的作用不是救人，是\"令小人得逞、反更盛其势\"**（**因为\"不问原因的支持\"，等于给\"招凶的那条路\"发了通行证）。** **其\"象\"又给了两条极实用的规矩**：\"**决必合于正理；君子于当决之时果决之，终不至咎。常人须戒：在不明状况之前，不做决定就是良策——切不可凭己之所好而蒙决，必害及他人。**\" **须说明**：**这是《易经》原文（夬九三）**；**\"頄\"（qiú）是\"颧骨\"**，**\"壮于頄\"喻\"把强硬写在脸上\"**；**其可用的核极准**：**\"在不明状况之前，不做决定就是良策\"——这条与\"需卦等待\"、\"蒙卦'初筮告，再三渎则不告'\"是同一组**；**而\"不可凭己之所好而蒙决\"这一句，是\"愚善\"的准确解释**：**\"凭自己所好\"（而不是凭事实）去决定，就会害到别人。**","o":"TJ-0474 · 天纪·人间道·夬卦·第三爻（PDF 第94页）"},{"t":"一百六十九、夬卦六爻","h":"第四、五爻：\"臀无肤\"与\"中行无咎\"","c":"要点——**第四爻\"臀无肤，其行次且，牵羊悔亡，闻言不信\"**：\"**阳居阴位，乃示'刚决不足之人所犯之过'。阳刚正理已明极时，如己之果决不足，必招'居不安、行进又难'之状。若能法羊群之群行特性，可无悔；但刚决不足之人，令其以柔进，必不能也——故即令告之，本性如此，必不能信用。自古以来，'知过能改、知善能用、克己之欲'能如是之人，必'刚明者'方可做到。**\"其\"象\"：\"**此行为受阻、受难，乃居位之人不适其职位；正理之言不信，因其聪听不明也。**\" **\"刚决不足之人，令其以柔进，必不能也\"这一句，是\"性格与建议\"的根本矛盾**：**对一个\"决断不足\"的人，你告诉他\"你该柔顺一点、跟着大家一起走\"（牵羊），他\"必不能\"**——**因为\"柔进\"也需要一种能力（跟随的能力），而他缺的正是这个。** **而\"'知过能改、知善能用、克己之欲'能如是之人，必'刚明者'方可做到\"这一句更狠**：**这三件事（改过、用善、克欲）看起来是\"修养\"，而讲义说它们需要\"刚明\"**——**\"刚\"（有决断力）＋\"明\"（看得清）**；**缺一个，这三件事就做不到。** **第五爻\"苋陆夬夬，中行无咎\"**：\"**君为决定之主，居夬之时，必立决，以去小人之道，禀持中正之道，必无灾。**\"其\"象\"：\"**人能中心至诚，必决之无过也；但人心皆有私欲——一旦涉及私欲，必不能光大中道。**\" **须说明**：**这是《易经》原文（夬九四、九五）**；**\"次且\"（zī jū）是\"行走困难\"**；**\"苋陆\"是\"马齿苋一类的草\"（一说\"莧陸\"为\"山羊\"）**，**取\"柔脆易折之物\"义**；**其可用的核**：**\"一旦涉及私欲，必不能光大中道\"——\"中行\"的最大敌人不是\"外面的阻力\"，是\"里面的私欲\"**（**因为\"私欲\"会让\"中\"悄悄偏向自己**）。","o":"TJ-0475 · 天纪·人间道·夬卦·第四、五爻（PDF 第94页）"},{"t":"一百六十九、夬卦六爻","h":"上爻：\"无号，终有凶\"与\"非斩尽小人\"","c":"边界——夬卦上爻\"**无号，终有凶**\"。其解：\"**此阴将尽之时，君子道显、小人道必消之际——惟'比附于君子之道'方吉；否则即令不号咷畏惧，亦终获凶。**\"其\"象\"是全卦最要紧的一句，也是一条极重要的边界：\"**如示人号咷畏惧，仍招凶，此道必不久也——故'君子思去小人之道，非斩尽小人也'。**\" **\"君子思去小人之道，非斩尽小人也\"这十三个字，把夬卦整个\"决\"字的方向改了**：**要处理的是\"那条道\"（让歪路走不通），不是\"那些人\"（把人都除掉）。** **即：目标是\"断道\"，不是\"断人\"。** **须说明**：**这是《易经》原文（夬上六）加象辞之解**；**\"号\"在此指\"号咷（大声哭喊求饶）\"**；**⚠ 须补一句**：**讲义此句在\"君子去小人\"的语境里，仍以\"道\"为标准**——**而它给出的边界很明确：即使对方\"号咷畏惧\"（求饶），若其道不改，仍\"终有凶\"**（**即：宽赦的是\"人\"，不是\"道\"**）；**其可用的核极准**：**\"去小人之道\"≠\"斩尽小人\"——处理问题的正确对象是\"机制／路径\"，不是\"人格／人身\"**（**这一条与\"解卦赦过宥罪\"\"明夷用晦而明\"的边界同源**）。","o":"TJ-0476 · 天纪·人间道·夬卦·上爻（PDF 第94页）"},{"t":"一百七十、姤卦：或聚或散","h":"卦序：\"溃决之后必有遇\"","c":"定义——姤卦（天风姤）为\"**风云相济之课，或聚或散之象**\"，其卦序极简：\"**夬，决也——溃决之后必有遇，姤，遇也，故次夬卦。此卦乾上巽下，即'风行天下'——风行时必触及万物，故为'遇'之象。**\" **\"溃决之后必有遇\"这一句，是\"夬→姤\"的枢纽**：**决（断）之后，必然有\"遇\"（新的相遇）**——**即：断不是终点，断之后是\"重组\"。** **而\"风行天下，触及万物，故为遇之象\"给了\"遇\"的机制**：**风不是\"找到\"万物，是\"经过\"万物**——**而\"经过\"就是\"遇\"。** **（\"或聚或散\"四字则说明：这种\"遇\"是不稳定的——可能聚，也可能散。）** **占例\"汉吕后拟立吕氏谋汉社稷，卜得之果不利也\"**。**须说明**：**这是讲义对姤卦序的注解**；**姤（gòu）是\"遇\"**；**其可用的核**：**\"夬\"（决）与\"姤\"（遇）是连着的两卦**——**讲义把它们排在一起，说明\"断\"与\"遇\"是同一件事的两面**（**断掉旧的，才会有新的\"遇\"；而\"遇\"来的是好是坏，则看下一卦\"萃\"（聚）怎么走**）。","o":"TJ-0477 · 天纪·人间道·姤卦（PDF 第95页）  ---"},{"t":"一百七十一、姤之义","h":"卦辞\"女壮，勿用取女\"——须先标性别预设","c":"定义——姤卦卦辞为\"**姤：女壮，勿用取女**\"，讲义的原解是：\"**姤之道在'戒阴壮之始'。娶女本欲其柔且顺从，但初进为阴而渐进长盛，且有壮于阳者——古来以'女壮'为失男女之道、家道必败。戒之在初始。**\" **⚠ 此条须先说清**：**这段解的内核是\"阴（柔、依附的一方）不能让它长到压倒阳\"**；**而它把\"男女\"当作\"阴阳\"的现实对应物**——**\"娶女本欲其柔且顺从\"一句，是古代性别观念的直陈，不是可用的判断**。** 本集的处理是：**只取\"戒之在始\"这一条结构义**（**即：任何\"起初微弱、日后将盛\"的力量，都要在\"始\"处留意**），**不取原辞对女性或任何性别的评判**。**须说明**：**\"姤：女壮，勿用取女\"是《易经》原文**；**姤（gòu）为\"遇\"**；**其可用的核**：**\"戒之在初始\"是全卦真正的主题**——**而\"始\"的判断与\"性别\"无关**（**讲义用它讲\"小人之道始遇君子之阳刚，须戒之在始\"（彖辞），那一层是可以取的**）。","o":"TJ-0478 · 天纪·人间道·姤卦（PDF 第95页）"},{"t":"一百七十一、姤之义","h":"彖：\"天地相遇，品物咸章\"与\"遇之正则吉\"","c":"要点——姤卦\"彖\"有三层。**\"姤，遇也，柔遇刚也。勿用取女，不可与长也\"**：\"**姤，乃柔之遇刚——小人之道始遇君子之阳刚，须戒之在始；勿取如是之人，不可使小人之道长。**\" **\"天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉\"**，这一层的解极重要：\"**万物之生始于天阳地阴之交遇——不遇则不生。但须'刚遇中正'之道，犹人君之遇贤臣——刚与中正合德，其道必及于天下。姤之道即在'遇之始'——遇之正则吉，遇之不正，须始戒。**\" **\"不遇则不生\"四个字，是姤卦的正面价值**：**万物要\"生\"，必须有\"遇\"**——**而这里说的\"遇\"，指的是\"一种能生成新东西的接触\"，并不只是\"碰到\"。** **而\"遇之正则吉，遇之不正，须始戒\"这一句，是全卦的判据**：**同样是\"遇\"，正的吉，不正的要在\"始\"处就戒**（**因为\"不正之遇\"一旦长成，就难改了**）。**须说明**：**这是《易经》彖传原文加讲义之解**；**\"品物咸章\"指\"万物都显明成形\"**；**其可用的核**：**\"刚遇中正\"是\"遇\"的理想型**——**\"刚\"（有力量）＋\"中正\"（方向对）**；**而讲义把它比作\"人君之遇贤臣\"**（**即：\"遇\"这件事的价值，取决于两边是否\"合德\"**）。","o":"TJ-0479 · 天纪·人间道·姤卦（PDF 第95~96页）"},{"t":"一百七十一、姤之义","h":"象：\"后以施命诰四方\"","c":"方法——姤卦\"象\"为\"**天下有风，姤；后以施命诰四方**\"，其解：\"**君之道，能如风之及于万物，方可施政令而及于四方——故遇之道能行，天下必因中正之遇、上下配合，而政令能如风之遍及万物。**\" **\"施命诰四方\"（把命令发布到四方）取的是\"风行天下\"的象**：**风不是\"点对点\"地吹，是\"遍及\"**——**而政令要\"及于四方\"，也要这样：不遗漏、不停留、不只在中心打转。** **须说明**：**\"天下有风，姤；后以施命诰四方\"是《易经》原文**；**\"后\"在此指\"君主\"**；**其可用的核**：**\"遇之道能行\"的前提是\"上下配合\"**——**即：\"遇\"不是单向的\"上面发下去\"，是\"上下能对上\"**（**风要\"及于万物\"，前提是万物\"受得住风\"**）。","o":"TJ-0480 · 天纪·人间道·姤卦（PDF 第96页）"},{"t":"一百七十二、姤卦诸爻","h":"初爻：\"系于金柅\"与\"羸豕孚蹢躅\"","c":"风险——姤卦初爻\"**系于金柅，贞吉，有攸往，见凶，羸豕孚蹢躅**\"，是全卦最实用的一条。其解：\"**柅，止车之物；金，坚固意。因姤乃'阴始于初而将长盛'之卦——小人之道，于始初即应如止车之柅，且系之，使不进也，此吉。如令其渐盛、不知始戒，有凶——犹羸弱之豕，其虽不强，然为阴物，故知'其能跳跃之时，必消之'；故小人之道于始即消除，则必不能成大，而无有作为矣。**\"其\"象\"：\"**阴柔小人之道，始进则如车之受金柅而止——不使其进，正道必存，吉也。**\" **\"系于金柅\"（用坚固的木桩把车拴住）这个比喻极准**：**车还没动的时候，一根木桩就能拴住；等它跑起来，就拴不住了。** **而\"羸豕孚蹢躅\"（瘦弱的猪，其实能跳）的解更狠**：**瘦猪\"虽不强\"，但\"为阴物\"（会长的东西）——所以\"知它能跳跃之时，必消之\"**（**即：要在\"它还没跳\"的时候处理**；**等它跳了，成本就完全不同了**）。**须说明**：**这是《易经》原文（姤卦初爻）**；**\"柅\"（nǐ）是\"刹车木\"**；**\"羸豕\"（léi shǐ）是\"瘦猪\"，\"蹢躅\"（zhí zhú）是\"徘徊、跳跃\"**；**其可用的核极准**：**\"小恶在还没成气候时最容易处理\"**——**而\"不知始戒\"的代价是\"有凶\"**（**这与\"坤卦履霜坚冰\"\"大畜卦'在它还没有力量的时候先约束'\"是同一组判断**）。","o":"TJ-0481 · 天纪·人间道·姤卦·初爻（PDF 第96页）"},{"t":"一百七十二、姤卦诸爻","h":"第二、三爻：\"包有鱼\"与\"臀无肤\"","c":"要点——**第二爻\"包有鱼，无咎，不利宾\"**：\"**姤相遇之道在于专一——阳刚将位之人与君位相应，其志必专一，遇则无灾；如又遇于旁人、变其志，则有悔——其不利在不能专一。**\"其\"象\"：\"**二位乃初遇志同之时，因'不事二主'——当如苞苴之鱼，只能及于主人，无法及于客宾一样。**\" **\"不事二主\"是\"专一\"的古典表达**：**\"包有鱼\"（包里有鱼）——这条鱼\"只能及于主人，无法及于客宾\"**（**即：给了谁，就只给谁**）。** **第三爻\"臀无肤，其行次且，厉，无大咎\"**：\"**时义乃谓'初进之人与上位相遇而恰合'——此时居上位之人同志于初始进之人，如为求其助而亲密于下，此凶，乃行且困难、必令居不安也，如臀之无肤状。居此时如怀危惧、不妄动，可无咎也。**\"其\"象\"：\"**相位之人求姤遇于初进之人，中有将位阻隔，故行次且困顿——知危立改，必可未至大殃也。**\" **\"知危立改，必可未至大殃\"这一句，是\"越位求人\"的解法**：**\"相位之人在中间被隔开\"（上有将位），行路困难**——**而只要\"知危立改\"，就不会走到\"大殃\"**。**须说明**：**这是《易经》原文（姤卦第二、三爻）**；**\"苞苴\"（bāo jū）是\"包裹\"**；**其可用的核有两条**：**①\"遇\"的第一要求是\"专一\"**（**讲义此句带\"阴柔之人志易变\"的表述，本集只取\"志易变者不能专\"的结构义**）；**②\"知危立改\"是止损的唯一动作**（**不是\"硬撑\"，也不是\"等它变好\"**）。","o":"TJ-0482 · 天纪·人间道·姤卦·第二、三爻（PDF 第96页）"},{"t":"一百七十二、姤卦诸爻","h":"第四爻：\"包无鱼，起凶\"——下民远离","c":"风险——姤卦第四爻\"**包无鱼，起凶**\"。其解：\"**君侧之人始遇初进同志之相应，但因其已先遇第二爻位之人，此遇已失——此意味'臣位之人不中正，必失其民'，故凶。故遇之道，必'下不离散'——今如下位之人散，上必失道也。**\"其\"象\"归因极准：\"**下民远离，乃起因于己之不中正；或己中正而下民不相应也。**\" **\"包无鱼\"（包里没鱼了）的病因是\"这遇已失\"**：**不是\"没人可遇\"，是\"别人已经先遇上了\"**（**即：机会被人先占，原因是自己\"不中正\"**）。** **而象辞给了两种\"下民远离\"的归因，一句话说尽**：**①\"己之不中正\"（自己有问题）；②\"己中正而下民不相应\"（自己没问题，但对方不响应）**。** **须说明**：**这是《易经》原文（姤卦第四爻）**；**其可用的核极准**：**\"人离开你\"只有两种可能——你自己不正，或者你正而对面也不应**；**而讲义把前一个（\"己之不中正\"）放在前面**（**即：先查自己，再论对方**）；**\"遇之道必下不离散，今如下位之人散，上必失道也\"这一句，是\"上\"与\"下\"的依存**（**上面的人失去\"下\"，就失去了\"道\"**）。","o":"TJ-0483 · 天纪·人间道·姤卦·第四爻（PDF 第96页）"},{"t":"一百七十二、姤卦诸爻","h":"第五、上爻：\"以杞包瓜\"与\"姤其角\"","c":"方法——**第五爻\"以杞包瓜，含章，有陨自天\"**，是全卦最正的一条：\"**九五乃至尊之位，上位下求贤才——瓜乃美实但居于下；今上位之人能屈而求下，此乃'包含'之美德。人君能如此，则必有遇所求之人才——故能屈尊求下，内心至诚，如有陨石自天而下，此遇之善道也。**\"其\"象\"：\"**至尊之位能含有中正之德、求贤而屈下——此存志乃合于天理，必如陨石般天助而得良才，遇之大道。**\" **\"以杞包瓜\"的取象极妙**：**杞（杞木，高的）\"包\"住瓜（美实，低的）**——**即\"上面弯下来，把下面的好东西护住\"**；**而\"含章\"（内含美质）说明：这种\"屈\"不是丢脸，是\"把自己的好东西收在里面\"。** **上爻\"姤其角，吝，无咎\"**：\"**至刚而居上，莫过于角。人之遇，必由'降屈相求、巽顺相应'——此合之由来。如居高而刚极、持才自傲，人何将与（之）？此人之远离，乃肇因于己之过亢，非他人之罪也。**\"其\"象\"：\"**遇之如角之亢极，以刚而遇，必致穷极末路，人必散之。**\" **\"此人之远离，乃肇因于己之过亢，非他人之罪也\"这一句，是全卦最痛的一条**：**\"角\"（在最上面、最硬的地方）——到了这个位置还\"持才自傲\"，\"人何将与\"（谁还愿意跟你遇）**；**而\"人远离\"的责任不在别人**。** **须说明**：**这是《易经》原文（姤卦第五、上爻）**；**\"杞\"（qǐ）是杞木，\"瓜\"是瓜果，\"包\"是\"包覆\"**；**其可用的核极准**：**\"遇\"的两条路正好相反——\"降屈相求\"（弯下来求）能得人才；\"持才自傲\"（立起来等）会人散**；**而讲义把\"人之远离\"归到\"己之过亢\"**（**这与\"蹇卦'反身修德'\"\"大有'满而不溢'\"是同一组\"从自己身上找因\"）。**","o":"TJ-0484 · 天纪·人间道·姤卦·第五、上爻（PDF 第96页）  ---"},{"t":"一百七十三、萃之道","h":"卦序：\"同气相求，则生聚象\"","c":"定义——萃卦（泽地萃）为\"**鱼龙会聚之课，如水就下之象**\"，其卦序：\"**物相遇而后，同气相求，则生聚象——萃，聚也。物相聚成群，为萃，故次姤卦之后。此卦泽上地下，水之聚象——水之在地上，乃方聚之时也。**\" **\"同气相求，则生聚象\"这一句，是\"聚\"的机制**：**先有\"遇\"（姤），后有\"同气相求\"（同类互相寻找），才有\"聚\"**——**即：聚不是\"把人凑到一起\"，是\"同类自己找来\"。** **而\"如水就下\"（像水往低处流）给了\"聚\"的方向**：**水不是被\"推\"到一起的，是\"就下\"（自己往低处走）**——**即：聚的方向由\"势\"决定，不由\"命令\"决定。** **卦图六物**：**①\"贵人磨玉：进修也，专心一致也，免破损也\"**；**②\"一僧指：指引也，局外人也\"**；**③\"小儿山路：退引山林，以退为进象，示上坡也\"**；**④\"一人救火：救災祸也，犹行医济世救人之道也\"**；**⑤\"一鱼在火上：得救状，或餐饮业\"**；**⑥\"一凤啣书：喜讯至也\"**。** 其中\"**一人救火：犹行医济世救人之道也**\"一物极特别**：**讲义在萃卦的卦图里，直接点出了\"行医济世救人\"作为\"救灾祸\"的对应**——**这是四十四份材料里，\"医\"与\"卦\"少见的直接对位**（**而它出现的位置是\"聚\"卦，取的是\"人群中有人去救火\"这个场景**）。**须说明**：**这是讲义对萃卦序与卦图的注解**；**其余象数取象（\"倪姓\"\"曾姓\"）本集只记不解**。","o":"TJ-0485 · 天纪·人间道·萃卦（PDF 第97页）"},{"t":"一百七十三、萃之道","h":"卦辞：\"王假有庙\"与\"聚必以道\"","c":"要点——萃卦辞为\"**萃：亨，王假有庙。利见大人，亨，利贞。用大牲吉，利有攸往**\"，其解是全册论\"聚\"最完整的一段：\"**人之至诚专一莫过于宗庙祭祀之时——王者能令天下之人其心专一，莫过于利用宗庙，故圣人制祭祀之礼以养民之德，此'聚'之义大也。民聚之时，能得贤才，则必聚而正；如不正、治之不以正理，则乱之生亦由人之聚——故聚必以道。非正之道，即令有聚，亦不能安处也。于聚时祭礼用大牲厚礼，乃示慎重且富；是天下必同之（今人聚而人不能亨其丰盛，则必散也）。是故古今皆然：凡能与大功、立大业之人，第一必得其时，第二必聚而后能用，此动必吉。**\" **\"故聚必以道，非正之道，即令有聚，亦不能安处也\"这一句，是\"聚\"的硬条件**：**聚起来不等于聚得住**——**\"非正之道\"的聚，\"不能安处\"（坐不住）。** **而\"乱之生亦由人之聚\"这一句更狠**：**乱不一定来自\"散\"，也可以来自\"聚\"**（**人聚在一起，摩擦、私心、争利就都来了**）。** **而\"第一必得其时，第二必聚而后能用\"这两条，是\"立功立业的次序\"**：**先是\"时\"，再是\"聚\"，然后才谈\"用\"**——**即：没有人（聚），\"用\"无从谈起。** **须说明**：**这是《易经》原文加讲义之解**；**\"王假有庙\"的\"假\"读 gé，通\"格\"（到、至）**；**\"用大牲\"指\"用大的祭牲\"**；**其可用的核**：**\"圣人制祭祀之礼以养民之德\"——礼的功能是\"养德\"，不是\"求福\"**（**而\"至诚专一\"是它真正在训练的东西**）。","o":"TJ-0486 · 天纪·人间道·萃卦（PDF 第97页）"},{"t":"一百七十三、萃之道","h":"彖：\"顺以说，刚中而应\"与\"视其所聚\"","c":"方法——萃卦\"彖\"有四句。**\"萃，聚也，顺以说，刚中而应，故聚也\"**：\"**萃卦乃上悦下顺之象——上位以中道用民，合于民心；下又能顺从于上之政令，且又刚阳相应。坚心赤诚如此，必能聚天下之人才。**\" **\"王假有庙，致孝享也\"**：\"**王者要有聚民心之道，必立宗庙以示孝顺之至诚；能顺天下之人心，必以孝方成。**\" **\"利见大人亨，聚以正也\"**：\"**聚之以正道，必能得人才治之，乃因其正也。**\" **\"用大牲吉，利有攸往，顺天命也\"**：\"**祭祀时用厚礼祭天，必可有为，此顺天命也。**\" **而最后一句\"视其所聚，而天地万物之情可见矣\"是全册识人法的第三把尺**：\"**天地万物间皆有聚、有动、有散等——圣人观象，可见万物之情性也。**\" **\"视其所聚\"这一句，与\"咸卦'观其所感而天地万物之情可见矣'\"、\"恒卦'观其所恒而天地万物之情可见矣'\"合成一整套**：**看他被什么感动（所感）、看他坚持什么（所恒）、**看他聚拢什么人（所聚）**——三处都是同一句式、同一结论，而各看一面。** **须说明**：**这是《易经》彖传原文加讲义之解**；**其可用的核**：**\"视其所聚\"是极实用的一条**——**一个人的\"聚\"（他身边聚着什么样的人、他把什么聚到自己身边），比他说什么更能说明他**（**因为\"同气相求\"——聚来的一定是\"同气\"的**）。","o":"TJ-0487 · 天纪·人间道·萃卦（PDF 第97~98页）"},{"t":"一百七十三、萃之道","h":"象：\"君子以除戎器，戒不虞\"","c":"方法——萃卦\"象\"为\"**泽上于地，萃；君子以除戎器，戒不虞**\"，其解极精：\"**泽上于地，为集聚之象——君子知'始戒之慎'，故众民相聚之初，就也生戒：因众聚必有争、私心所成，故先除兵械，乃能戒而无虞。**\" **\"因众聚必有争\"这一句，是\"聚\"的反面常识**：**人一聚，争就来了**（**因为\"私心所成\"**）——**所以\"除戎器\"（先收掉兵器）、\"戒不虞\"（防备意料不到的事）要在\"相聚之初\"就做**。** **须说明**：**\"泽上于地，萃；君子以除戎器，戒不虞\"是《易经》原文**；**\"戎器\"是兵器，\"不虞\"是意料不到**；**其可用的核极准**：**\"聚\"的场合最需要\"先立防\"**——**这与\"家人卦闲有家'规矩要在还没人违反时立'\"、\"姤卦系于金柅'车还没动时一根木桩就能拴住'\"是同一条**：**防范的有效期，只在\"还没发生\"的那段。**","o":"TJ-0488 · 天纪·人间道·萃卦（PDF 第98页）"},{"t":"一百七十四、萃卦前四爻","h":"初爻：\"有孚不终，乃乱乃萃\"","c":"风险——萃卦初爻\"**有孚不终，乃乱乃萃，若号，一握为笑，勿恤，往无咎**\"。其解：\"**聚之始，柔居之——阴柔之人，必无法坚守正节，为求与人同而舍其正道；但为求同，此'不终'之戒。人心必乱，同气相求而生聚；或哀号作苦以求相应，其果必为众人之笑柄；若能坚心往从阳刚正道，必无过咎，否则成小人矣。**\"其\"象\"：\"**若人之心志受人惑而乱，必不能固守节志，乃失其正道也。**\" **\"为求与人同而舍其正道\"这一句，是\"合群\"最常见的代价**：**为了\"跟别人一样\"，把自己那条\"正的\"舍掉了**——**而结果是\"其果必为众人之笑柄\"**（**因为\"哀号作苦以求相应\"（用可怜换认同），换不来认同，只换来笑话）。** **须说明**：**这是《易经》原文（萃卦初爻）**；**\"一握为笑\"指\"一握手之间成了笑柄\"**；**其可用的核极准**：**\"有孚不终\"说的是\"诚而不久\"**——**开始是真的，后来为了\"合群\"变成假的**；**而解法只有一句\"坚心往从阳刚正道\"**（**即：宁可\"不被认同\"，也不改\"正\"**）。","o":"TJ-0489 · 天纪·人间道·萃卦·初爻（PDF 第98页）"},{"t":"一百七十四、萃卦前四爻","h":"第二、三爻：\"引吉\"与\"萃如磋如\"","c":"要点——**第二爻\"引吉，无咎，孚乃利用禴\"**：\"**二位与五位相对应，位虽有差距，此时乃'当聚而未及合'之时——如能相引聚，则可无咎，此因其中正之德未变；如德变，则必不相吸引。故于群小人聚时能独立其间，且与上位之德同，必能合，此其意也。即令不重外饰、专以至诚，则终必合矣。**\"其\"象\"：\"**萃之时，以能聚为吉；同志相求，平安；其位有差距，因中正诚心同德必能无咎。**\" **\"于群小人聚时能独立其间\"这一句，是\"聚\"的独立姿态**：**别人都在聚，你能\"独立其间\"（站在中间而不跟着走）**——**而\"与上位之德同\"（方向一致）**，**于是\"必能合\"**（**即：不跟着凑，也不反对，只是\"德同\"**）。** **\"即令不重外饰，专以至诚，则终必合矣\"这一句，是\"合\"的真正途径**：**不靠\"外饰\"（包装、应酬、礼物），靠\"至诚\"**。** **第三爻\"萃如磋如，无攸利，往无咎，小吝\"**：\"**不正之人，求能与人聚合，但人皆不应、为人弃绝，上下皆不应——唯退求事外之贤与之相应，如此则可无咎。人之动有求，即令得之，亦可羞也。**\" **\"人之动有求，即令得之，亦可羞也\"这一句极精**：**只要是\"为了求\"而动的，即使求到了，也\"可羞\"**（**因为\"求\"这个姿态本身，已经把自己放低了**）。** **须说明**：**这是《易经》原文（萃卦第二、三爻）**；**\"禴\"（yuè）是\"薄祭\"**——**取\"礼薄而诚厚\"义**；**其可用的核**：**\"萃\"的两条路——\"德同则合\"（靠同德）与\"求则羞\"（靠求）**；**而\"上巽也\"（象辞）说明：第三爻的\"无咎\"来自\"上能顺\"**（**即：对方肯给你一个\"事外\"的位置**）。","o":"TJ-0490 · 天纪·人间道·萃卦·第二、三爻（PDF 第98页）"},{"t":"一百七十四、萃卦前四爻","h":"第四爻：\"大吉无咎\"","c":"方法——萃卦第四爻\"**大吉无咎**\"是全卦唯一直接说\"大吉\"的一条。其解：\"**四位能以阳刚，与君位对应，得君臣之萃，下又得群阴之聚——此上下能因其阳刚而聚，此至善也。**\"其\"象\"：\"**能有吉且无灾之果，即令位不当，因上下与己合德，故也。**\" **\"上下与己合德\"这一句，是\"大吉\"的来历**：**这位的位置其实\"不当\"（象辞明说\"位不当也\"）**——**而它仍能\"大吉无咎\"，因为\"上下都与它合德\"。** **须说明**：**这是《易经》原文（萃卦第四爻）**；**其可用的核极准**：**位置\"当不当\"并不是决定成败的唯一一件**——**\"位不当\"仍可\"大吉\"，条件是\"上下与己合德\"**（**即：位置上有缺陷，方向补偿上了**）；**这一条与\"大有'居尊执柔物乃所归'\"、\"师卦'专权而内戒慎'\"构成一组关于\"位置与德行\"的判断。**","o":"TJ-0491 · 天纪·人间道·萃卦·第四爻（PDF 第98页）  ---"},{"t":"一百七十五、萃卦后二爻","h":"第五爻：\"萃有位\"与\"匪孚，元永贞\"","c":"方法——萃卦第五爻\"**萃有位，无咎。匪孚，元永贞，悔亡**\"。其解：\"**居天下之尊，有萃聚天下之力，则无災——此时必自修其德、正其位、处不以私，为得其位也。如有人不信而未能归从，当自省是否不正——坚固中正不变之德性，则无不归矣。**\"其\"象\"给了极精的一句：\"**为王者，必以诚信以示天下，如此方有感于民，则人莫不归矣。如仍有不从，乃己之志未能光显也。**\" **\"如仍有不从，乃己之志未能光显也\"这一句，是\"聚不住人\"的自查表**：**有人不来，不先怪他，先问\"己之志\"是否\"光显\"（是否让人看得见、看得清）。** **须说明**：**这是《易经》原文（萃卦第五爻）**；**\"匪孚\"是\"不信任\"**；**\"元永贞\"指\"以长久之正为元\"**；**其可用的核极准**：**\"聚\"的失败有两种归因**——**\"己之不正\"（德有问题）与\"己之志未光显\"（德没问题但没让人看见）**；**而讲义把两种都归在自己身上**（**这与\"姤卦'下民远离，乃起因于己之不中正'\"、\"蹇卦'反身修德'\"是同一组的第三处**）。","o":"TJ-0492 · 天纪·人间道·萃卦·第五爻（PDF 第98~99页）"},{"t":"一百七十五、萃卦后二爻","h":"上爻：\"赍咨涕洟\"——人之弃绝实出于己","c":"风险——萃卦上爻\"**赍咨涕洟，无咎**\"。其解：\"**小人居高位，求人与其聚，而人皆不与，此可叹也——人之弃绝，实出于己，怎可归咎他人？如再不知自省，反嗟叹而致涕泣，此小人状也。**\"其\"象\"归因更狠：\"**小人之对人皆因贪而失所宜，以致终穷困——此起因于不能安居其位也。**\" **\"人之弃绝，实出于己，怎可归咎他人\"这一句，是全卦最痛的一条**：**到了\"没人愿意跟我聚\"的地步，责任\"实出于己\"**——**而\"再不知自省，反嗟叹而致涕泣\"（哭、怨、诉苦），就正好是\"小人状\"**（**即：把\"结果\"当成了\"委屈\"）。** **须说明**：**这是《易经》原文（萃卦上爻）**；**\"赍咨\"（jī zī）是\"叹息\"，\"涕洟\"（tì yí）是\"眼泪鼻涕\"**；**其可用的核极准**：**\"贪而失所宜\"是病因**——**贪（想要的太多）＋失所宜（该在的位置站错了）→\"不能安居其位\"→\"终穷困\"**；**而\"涕洟\"是这个链条的最后一环，它不改变任何东西**（**所以象辞只给了三个字\"未安上也\"**）。","o":"TJ-0493 · 天纪·人间道·萃卦·上爻（PDF 第99页）"},{"t":"一百七十六、升卦：积小以高大","h":"卦序：\"万物咸因能聚方可升高\"","c":"定义——升卦（地风升）为\"**高山植木之课，积小成大之象**\"，其卦序：\"**萃者聚也——聚之后能上，即升也。万物咸因能聚方可升高，故升次萃也。此卦坤上巽下，乃'木在地下生于地中，长而愈高'，此升之象也。**\" **\"万物咸因能聚方可升高\"这一句，是\"萃→升\"的枢纽**：**先\"聚\"，才有\"升\"**——**没有聚起来的东西，\"升\"无从发生**（**即：升不是\"跳\"，是\"长\"。）** **而\"木在地下生于地中，长而愈高\"给了\"升\"的机制**：**树是从\"地里\"长出来的，不是从\"天上\"掉下来的**——**它的起点在\"下\"，而它的方向是\"上\"。** **卦图六物**：**①\"云中雨点下：沾衣恩泽之象，昏暗之时将过也\"**；**②\"木匠下墨解木：有尺度法则，有依据之象\"**；**③\"一人磨镜：可成始得之象\"**；**④\"一架子负大木：有不小之财也\"**；**⑤\"有镜：明镜高悬，于商事指有竞争也\"**；**⑥\"蓝：难也，百废待举之象\"**。** 其中\"**木匠下墨解木：有尺度法则，有依据之象**\"一物的取义特别实用**：**\"下墨\"（弹墨线）是\"先画好线再切\"**——**即\"有依据才动手\"。** **占例\"房玄龄去蓬莱采药未回，卜得知，主不在也\"**。**须说明**：**这是讲义对升卦序与卦图的注解**；**\"以武力去災也有改朝换代之象\"一句属象数引申**，本集只记\"有尺度法则\"这一层。","o":"TJ-0494 · 天纪·人间道·升卦（PDF 第99页）"},{"t":"一百七十六、升卦：积小以高大","h":"卦辞与彖：\"柔以时升\"与\"勿恤\"","c":"要点——升卦辞为\"**升：元亨，用见大人，勿恤，南征吉**\"，其解：\"**升之道，在于亨通——用此道来见大人，不靠体恤而能进，必吉。**\" **彖\"柔以时升，巽而顺，刚中而应，是以大亨\"**：\"**柔即顺也——顺时而升，以柔而进，此'升之得时'矣；二刚阳之位，得五柔顺之君应，则能大亨也。**\" **\"柔以时升\"四个字，是\"升\"的方式**：**\"柔\"（不硬顶）＋\"以时\"（按时候）**——**即：升不是\"冲上去\"，是\"顺着长上去\"。** **而\"用见大人，勿恤，有庆也。南征吉，志行也\"的解极精**：\"**用巽顺刚阳中正之道来见大人，必遂心志得升；从不去忧升之不遂，此吉庆也——前进则必升，必能遂行其志也。**\" **\"从不去忧'升之不遂'\"这一句，是\"升\"的心态**：**走对了道，就不必忧\"升不上去\"**（**因为\"忧\"本身不改变结果，只消耗力气**）。** **须说明**：**这是《易经》原文加讲义之解**；**\"勿恤\"是\"不必忧虑\"**；**其可用的核**：**\"用巽顺刚阳中正之道\"（用顺、用刚、用中正）→\"必遂心志得升\"**——**即：升的条件在\"道\"上，不在\"求\"上**。","o":"TJ-0495 · 天纪·人间道·升卦（PDF 第99页）"},{"t":"一百七十六、升卦：积小以高大","h":"象：\"地中生木，升；君子以顺德，积小以高大\"","c":"方法——升卦\"象\"是全书对\"成长\"最完整的一句：\"**地中生木，升；君子以顺德，积小以高大**\"，其解：\"**地中生木，木长而高，此升也。君子观升象，乃知修身之德，由积累微小，乃至高大——故'积不善，则不足以成名'（凡学问道德之高，皆由累积而成），升之义也。**\" **\"积小以高大\"五个字，把\"升\"从\"往上爬\"改成了\"往上长\"**：**\"高大\"不是\"跳上去\"的，是\"积\"（一点点累）出来的。** **而\"凡学问道德之高，皆由累积而成\"这一句，是讲义对\"学\"最直接的一句**：**学问与道德之\"高\"，没有例外，都是\"累积\"**——**而\"积不善，则不足以成名\"是它的反面**（**反过来说：想\"成名\"，也得靠\"积\"，没有一步登天这回事**）。** **须说明**：**\"地中生木，升；君子以顺德，积小以高大\"是《易经》原文**；**\"顺德\"指\"顺其德（依着本性去长）\"**；**其可用的核极准**：**\"升\"的两个前提是\"地\"（根基）与\"积\"（时间）**——**而这两样恰是最容易被忽略的**（**因为\"木在地下\"时，人看不见它在长；这与\"大畜'花在盆中有限'\"、\"需卦'等待是养身养心'\"是同一组的第四处**）。","o":"TJ-0496 · 天纪·人间道·升卦（PDF 第99页）"},{"t":"一百七十七、升卦前三爻","h":"初爻：\"允升，大吉\"","c":"要点——升卦初爻\"**允升，大吉**\"。其解：\"**初进时柔顺于第二爻之刚，因得信而升，此升吉也。**\"其\"象\"：\"**与上位之志合，得信而升——此因信于刚中之贤而能大吉也。**\" **\"允升\"的\"允\"是\"信\"**：**这一爻的\"大吉\"来自\"得信\"（被信任）**——**而\"得信\"的原因是\"柔顺于刚中之贤\"＋\"与上位之志合\"。** **须说明**：**这是《易经》原文（升卦初爻）**；**其可用的核**：**\"升\"的第一级台阶叫\"被信任\"**——**而\"被信任\"的路径是\"顺于能者\"＋\"志与上合\"**（**这与\"师卦'专权而内戒慎'\"、\"比卦'须待礼遇之至方出'\"是同一组**）。","o":"TJ-0497 · 天纪·人间道·升卦·初爻（PDF 第99页）"},{"t":"一百七十七、升卦前三爻","h":"第二爻：\"孚乃利用禴\"——绝不可矫求外饰","c":"方法——升卦第二爻\"**孚乃利用禴，无咎**\"。其解：\"**阳刚之臣，处升之时，因上位君柔——绝不可矫求外饰，必求以中心之至诚来感通于上，如此则可无咎。**\"其\"象\"：\"**君臣之道，臣之事君能中心至诚，不但为臣无祸，又可遂行其大志，此可喜也。**\" **\"绝不可矫求外饰\"这一句是极硬的禁令**：**\"矫\"（作假、装样子）、\"外饰\"（表面的修饰）**——**在上位\"柔\"（软、容易被表面打动）的时候，最容易犯的就是这一条**（**因为软的人会吃\"外饰\"这一套**）。** **而解法是\"必求以中心之至诚来感通于上\"**：**用\"中心之至诚\"，不用\"外饰\"。** **须说明**：**这是《易经》原文（升卦第二爻）**；**\"禴\"（yuè）是\"薄祭\"**——**取\"礼薄而诚厚\"义**（**与\"萃卦'孚乃利用禴'\"同一取象**）；**其可用的核极准**：**\"上位柔\"时，\"外饰\"最有效，也最危险**——**因为\"靠外饰上去\"的人，一旦上位换人，就再无可依**（**这与\"贲卦'今人但求外饰不求内实……此败亡之初始象也'\"是同一条**）。","o":"TJ-0498 · 天纪·人间道·升卦·第二爻（PDF 第100页）"},{"t":"一百七十七、升卦前三爻","h":"第三爻：\"升虚邑\"","c":"要点——升卦第三爻\"**升虚邑**\"。其解：\"**阳刚之相，能正而顺上——如此而升，就如入无（人）之巿，无人抵御。**\"其\"象\"：\"**升而如入无人之邑，则此进，必无可疑虑也。**\" **\"升虚邑\"（升进一座空城）这个象很妙**：**\"虚\"不是\"没有\"，是\"没有阻挡\"**——**而它之所以\"虚\"，是因为\"能正而顺上\"**（**即：走对了路，前方本来就空**）。** **须说明**：**这是《易经》原文（升卦第三爻）**；**其可用的核**：**\"如入无人之巿\"是\"顺利\"的古典形象**——**而它的成因不是\"运气好\"，是\"正而顺上\"**（**即：路走对了，阻力就少**）；**⚠ 须补一句**：**\"无人抵御\"在现实里不等于\"没有竞争\"**（**卦图\"有镜：于商事指有竞争也\"正好补了这一层**）。","o":"TJ-0499 · 天纪·人间道·升卦·第三爻（PDF 第100页）  ---"},{"t":"一百七十八、升卦后三爻","h":"第四爻：\"王用享于岐山\"——不可无事而升","c":"风险——升卦第四爻\"**王用享于岐山，吉，无咎**\"。其解：\"**居诸侯之位，能上柔顺于君王、下又顺天下之贤，举之升进；于己则柔顺谦恭，不求离本位——有德如是，必吉，且无災矣。人之戒，切记在'不可无事而升'，升又必量力而进，方合君子之道。今人已不复如此——无功而升，比比皆是；升之道如出私欲，必令国致穷困矣。**\"其\"象\"：\"**居君侧之人，因知顺时顺事，能顺处之，得坤之性，可以无咎也。**\" **\"不可无事而升\"＋\"无功而升，比比皆是\"＋\"升之道如出私欲，必令国致穷困\"这三句，是升卦唯一的反面**：**升卦通篇讲\"往上长\"，而它把\"无缘无故地升\"判成了病**——**因为\"升\"若\"出私欲\"（动机是\"我要上去\"），代价是\"令国致穷困\"**（**即：一个人往上走，代价落到整体上）。** **须说明**：**这是《易经》原文（升卦第四爻）**；**\"岐山\"是周之圣地**，**取\"祭祀（享）于根本之地\"义**；**其可用的核极准**：**\"升\"的合法性有三个条件**——**\"上柔顺于君王\"（方向对）、\"下顺天下之贤\"（下面服）、\"不求离本位\"（不离开自己的根基）**；**三者缺一，就是\"无事而升\"。**","o":"TJ-0500 · 天纪·人间道·升卦·第四爻（PDF 第100页）"},{"t":"一百七十八、升卦后三爻","h":"第五、上爻：\"升阶\"与\"冥升\"","c":"方法——**第五爻\"贞，吉，升阶\"**：\"**君位之人性柔，必得贞正且固守之德，则人皆信而贤至——能知人善用，必因用贤而能再升，泽及天下也。**\"其\"象\"是极精的一句：\"**君能任用贤才，如此可致天下大治——故'君王升之道在能用贤耳'，必遂其志。**\" **\"君王升之道在能用贤耳\"八个字，把\"升\"在最高位置上的定义改了**：**到了君位，\"升\"就不再是\"自己往上\"，而是\"用贤\"**——**即：最高处的\"升\"，表现为让下面的人上来。** **上爻\"冥升，利于不息之贞\"**：\"**升之极乃致昏昧于升，只知进不知止，此为不明。君子之人终日乾乾，无时不警惕自己、知所进退；小人贪求私欲之心盛，乃生不知进退之行为，凶也。**\"其\"象\"：\"**昏昧之人已至极上，犹求升之不已——其果唯消亡而已，无复增益也。**\" **\"只知进不知止\"这一句，与\"乾卦亢龙'知进不知退'\"是同一处毛病**——**而升卦把它叫做\"冥升\"（昏昧的升）**：**升到最后，人已经\"看不清\"了**（**因为\"升\"本身变成了目的）。** **须说明**：**这是《易经》原文（升卦第五、上爻）**；**\"升阶\"指\"一级一级上台阶\"**（**不是\"跳\"**）；**其可用的核极准**：**\"其果唯消亡而已，无复增益\"——到了极处还要\"升\"，结果是\"减\"**（**这与\"大有'满而不溢'\"、\"谦卦'天道亏盈而益谦'\"是同一条**）。","o":"TJ-0501 · 天纪·人间道·升卦·第五、上爻（PDF 第100页）"},{"t":"一百七十九、困卦：守己待时","h":"卦序：\"升至极，不知进退，私欲使然，终必至困\"","c":"定义——困卦（泽水困）为\"**河中无水之课，守己待时之象**\"，其卦序：\"**升至极，不知进退，私欲使然，终必至困，故困次升也。此卦「兑」上「坎」下——水在泽上乃有水也；今水在泽下，乃枯涸无水之象，此示人之困乏象。本卦所论，是君子受小人掩蔽、居穷困之时也。**\" **\"升至极，不知进退，私欲使然，终必至困\"这一句，是\"升→困\"的枢纽**：**困不是\"外面来的灾\"，是\"升到极处不知退\"的结果**——**而它的驱动是\"私欲\"。** **\"守己待时\"四字则是困卦的正面**：**困的时候能做、该做的，只有\"守己\"与\"待时\"。** **卦图五物**：**①\"一轮独在地下：独行也无依也，方向不明也\"**；**②\"一人卧病：招危难也\"**；**③\"药炉：有人来救，待时缓进也\"**；**④\"贵人倾水救旱池鱼：旱池，无财也，有贵人资援\"**；**⑤\"池中青草：仍有生气状\"**。** 其中\"**药炉：有人来救，待时缓进也**\"与\"**池中青草：仍有生气状**\"两物最要紧**：**困中有\"救\"（药炉）、也有\"生气\"（青草）——即：困不是\"死地\"。** **占例\"李德裕罢相时，卜得之，乃知身命无气也\"**。**须说明**：**这是讲义对困卦序与卦图的注解**；**\"一轮独在地下\"的\"独\"是困的核心意象**（**无依、方向不明**）。","o":"TJ-0502 · 天纪·人间道·困卦（PDF 第101页）"},{"t":"一百七十九、困卦：守己待时","h":"卦辞与彖：\"用困之道乃《易》之精神\"","c":"要点——困卦辞为\"**困：亨，贞，大人吉，无咎，有言不信**\"，其解是全书对《易》最重的一句定义：\"**困之时，如何用困之道，乃《易》之精神——大人居困时，以'乐天安命、随时善处'自得其乐，必吉。有愚顽之人，居困而力求（以）言，人必不信也。**\" **\"如何用困之道，乃《易》之精神\"这一句，把《易》的用处定在了\"困时\"**：**顺的时候谁都会走，难的是\"困\"的时候怎么走**。** **而彖\"困，刚揜也。险以说，困而不失其所亨，其唯君子乎\"的解**：\"**困之生乃因'刚为柔所掩蔽'——专言君子之道为小人所掩蔽。而困穷之时，君子知困之道：外悦内险，处困而能以'悦之度量'居之、不失正道，则其道必自然亨通——能如此之人，必为君子。**\" **\"困而不失其所亨\"六个字，是困卦的核心**：**困住了，但\"所亨\"（本来该通的那条）没丢**——**即：困可以困住\"事\"，困不住\"道\"。** **而\"贞，大人吉，以刚中也。有言不信，尚口乃穷也\"的解**：\"**处困时，君子能吉，乃因坚守刚中之道、不变节。于困之时，所言人必不信——如反求己之口才以脱困，必更致困，此即'尚口之戒'。**\" **\"反求己之口才以脱困，必更致困\"这一句，是极实用的一条**：**困中想靠\"说\"脱困，只会更困**（**因为困住你的正是\"事实\"，而\"说\"改变不了事实**）。**须说明**：**这是《易经》原文加讲义之解**；**\"揜\"（yǎn）是\"掩盖\"**；**其可用的核**：**\"尚口之戒\"——困中少说话**（**这与\"明夷用晦而明\"、\"艮卦'吉人之辞寡'\"是同一组**）。","o":"TJ-0503 · 天纪·人间道·困卦（PDF 第101~102页）"},{"t":"一百七十九、困卦：守己待时","h":"象：\"泽无水，困；君子以危重遂志\"","c":"方法——困卦\"象\"为\"**泽无水，困；君子以危重遂志**\"，其解：\"**泽中无水，困之象。居此时，君子以'力尽防患之法'——如仍难免，则'归之于命'，泰然处之，绝不因困穷而变其志节。小人遇困，志节必变，但求附于他人以求脱困，其终必凶。**\" **\"危重遂志\"（拼了命也要把自己的志完成）四字，配上讲义的\"两段式\"解法，次序极讲究**：**①\"力尽防患之法\"（先尽力防）→②\"如仍难免，则归之于命，泰然处之\"（再认命）**。** **即：认命可以，但必须在\"力尽\"之后。** **（反过来说，\"还没尽力就认命\"不叫\"安命\"，叫\"放弃\"。）** **须说明**：**\"泽无水，困；君子以危重遂志\"是《易经》原文**；**其可用的核极准**：**困中的人分两种**——**\"志节不变\"的（君子）与\"但求附于他人以求脱困\"的（小人）**；**而后者\"其终必凶\"**（**因为\"依附\"换来的\"脱困\"，代价是\"志节\"，而志节一旦换了，人就不再是原来那个人**）。","o":"TJ-0504 · 天纪·人间道·困卦（PDF 第102页）"},{"t":"一百八十、困卦前二爻","h":"初爻：\"臀困于株木，入于幽谷\"","c":"风险——困卦初爻\"**臀困于株木，入于幽谷，三岁不觌**\"。其解：\"**阴柔之人位居卑下，又无上位救助——犹如无叶之木，无法荫庇下物；因无庇荫，故不能安居于此，如进入幽暗之谷，无法自出，有三年的时间无法入亨。**\"其\"象\"归因极准：\"**自陷于深谷，乃出自己之不明也。**\" **\"自陷于深谷，乃出自己之不明也\"这一句，把\"绝境\"归到了\"不明\"**：**不是\"命不好\"，是\"看不明白\"**（**而\"不明\"又导致\"无庇荫\"（没人肯护着你），\"无庇荫\"又导致\"不能安居\"。）** **须说明**：**这是《易经》原文（困卦初爻）**；**\"株木\"是\"没有枝叶的树桩\"**；**\"觌\"（dí）是\"见\"**——**\"三岁不觌\"即\"三年不露面\"**；**其可用的核极准**：**困境的第一层不是\"外面难\"，是\"自己不明\"**（**这与\"蒙卦'蒙以养正'\"、\"明夷'内文明而外柔顺'\"是同一组的第三处**）。","o":"TJ-0505 · 天纪·人间道·困卦·初爻（PDF 第102页）"},{"t":"一百八十、困卦前二爻","h":"第二爻：\"困于酒食\"——宴无好宴","c":"要点——困卦第二爻\"**困于酒食，朱绂方来，利用享祀；征凶，无咎**\"。其解起于一句极精的观察：\"**常人无不为'酒食所困'——不知酒食之施，乃生于人有所欲；常言'宴无好宴'。君子之饮与小人不同，能困君子的，必是其刚正之道不足……**\" **\"常人无不为酒食所困\"这一句，把\"困\"从\"大难\"拉回了日常**：**不一定是灾祸才叫困，\"酒食\"就能困住人**——**而它的机制是\"生于人有所欲\"（因为人有欲望，才被\"给\"住）。** **而\"宴无好宴\"四字，是它的俗谚版**：**凡是\"白给的席\"，都有它的账。** **须说明**：**这是《易经》原文（困卦第二爻）**；**\"朱绂\"（zhū fú）是\"红色的蔽膝（官服）\"**——**取\"禄位将至\"义**；**其可用的核**：**\"困\"有两大类**——**一类是\"外来的难\"（无财、无援、无位），一类是\"自己招的困\"（欲望、酒食、应酬）**；**而第二类更常见，也更难自觉**（**因为它在\"享受\"的外形里**）。","o":"TJ-0506 · 天纪·人间道·困卦·第二爻（PDF 第102页）  ---"},{"t":"一百八十一、困卦后四爻","h":"第二爻续解：\"若不安居困，自往求之\"","c":"方法——困卦第二爻的续解，给\"困中该怎么办\"定了一条规矩：\"**居此时君子必求至诚以守、等待时机；可利用祭祀以示至诚，俟贵人至，求之方吉。若不安居困，自往求之，其招凶皆自取也。**\"其\"象\"：\"**居困时，虽未能施惠于人，如能守其刚中之德，必能亨，而有吉庆也。**\" **\"若不安居困，自往求之，其招凶皆自取也\"这一句，是困卦的行动准则**：**困的时候\"自己跑出去求\"，凶是\"自取\"**——**因为困时的\"求\"，往往是用\"降低自己\"去换\"一条路\"。** **须说明**：**这是《易经》原文（困卦第二爻）加讲义之解**；**\"利用享祀\"在此取\"以至诚示人\"义**；**其可用的核极准**：**困中的正确动作只有两个——\"守\"（守住自己）与\"待\"（等\"贵人至\"）**；**而\"贵人至\"是一个前提条件**（**即：要有人来，才谈\"求\"；没人来的时候\"求\"，只是自取其辱**）。","o":"TJ-0507 · 天纪·人间道·困卦·第二爻（PDF 第101~102页）"},{"t":"一百八十一、困卦后四爻","h":"第三爻：\"困于石，据于蒺藜\"——用外刚饰内险","c":"风险——困卦第三爻\"**困于石，据于蒺藜，入于其宫，不见其妻，凶**\"。其解：\"**处'困可羞'之时，却用'外刚'来饰'内险'——益增自困：必坚重如石，而不安之情如手握蒺藜之物（因刺多而不能握），进退不得状，必失所居，凶。**\"其\"象\"归因极准：\"**此言内之不安，欲求外刚来饰，乃'用刚之不正'，必终失所安，果必不祥也。**\" **\"用外刚来饰内险\"这一句，是\"硬撑\"的准确描述**：**里面明明不稳（内险），却用外面的\"刚\"（强硬、逞强、摆样子）去盖住它**——**结果是\"坚重如石\"（越撑越沉）、\"手握蒺藜\"（越抓越痛，进退不得）。** **须说明**：**这是《易经》原文（困卦第三爻）**；**\"蒺藜\"（jí lí）是\"带刺的野草\"**；**其可用的核极准**：**\"用刚之不正\"——\"刚\"（强硬）不是不能用，但用它来\"饰\"（遮盖）就不正了**；**而\"不见其妻\"（连最亲近的人也见不到）是它的代价**（**即：硬撑到最后，最亲的人也不在眼前了**）。","o":"TJ-0508 · 天纪·人间道·困卦·第三爻（PDF 第102页）"},{"t":"一百八十一、困卦后四爻","h":"第四、五爻：\"来徐徐\"与\"劓刖，困于赤绂\"","c":"要点——**第四爻\"来徐徐，困于金车，吝，有终\"**：\"**居君侧之人，不以中正之道处困时，而才能又不足济困——其来动必迟迟，困于金车之内，必不见容于世，可羞也；如知济困得中正之道，乃有归也。**\"其\"象\"：\"**居不适位，志在求下——其虽徐徐而来，即令未善，但因与正相应，必有果矣。**\" **\"才能又不足济困\"＋\"不以中正之道\"是\"来徐徐\"（慢慢磨）的两个原因**：**一是能力不够，二是路不对**——**而\"如知济困得中正之道，乃有归也\"给了它的出口**（**即：不是\"变快\"，是\"变正\"）。** **第五爻\"劓刖，困于赤绂，乃徐有说，利用祭祀\"**：\"**劓，乃上有伤；刖，乃下有伤——人君之困，乃'上下无应'、天下之民不来也。必起用刚正之贤才，以至诚待之，并利用祭祀，示道之至诚于天，则民必徐来。**\"其\"象\"：\"**上下不应，君王之困，其志不遂——于此必用祭祀以至诚，求得天下之贤，必能济天下之困，终享其福庆也。**\" **\"人君之困，乃上下无应\"这一句，把\"最高位置的困境\"说清了**：**君王的困不是\"没权\"，是\"上下不应\"（发下去没人应，下面没人上来）**——**而解法只有一条：\"起用刚正之贤才，以至诚待之\"。** **须说明**：**这是《易经》原文（困卦第四、五爻）**；**\"劓\"（yì）是\"割鼻\"，\"刖\"（yuè）是\"断足\"**——**取\"上伤下伤\"义**；**\"赤绂\"是\"红色的蔽膝\"，指\"君位之物\"**；**其可用的核**：**\"人君之困\"与\"常人困于酒食\"的区别在于**——**常人困于\"要不到\"，君位困于\"要不应\"**（**后者更无解，因为责任无法下推**）。","o":"TJ-0509 · 天纪·人间道·困卦·第四、五爻（PDF 第102页）"},{"t":"一百八十一、困卦后四爻","h":"上爻：\"困于葛藟\"——动、静皆困则必求进","c":"方法——困卦上爻\"**困于葛藟，于臲卼，曰动悔。有悔，征吉**\"。其解：\"**困至极，必生变——如物之缠束于身，动则有悔，无所不困（即动、静皆困），必求进，方有吉处。**\"其\"象\"：\"**为困缠身，无法求变，乃未知困之道；知动有悔，求悔而去，必可出困，其行必吉矣。**\" **\"动、静皆困，必求进，方有吉处\"这一句，是困到极处的唯一出口**：**动也困、静也困，\"两难\"的时候——出路只能是\"进\"**（**因为\"动\"至少还有\"变\"的可能，\"静\"只剩\"困\"的延续）。** **须说明**：**这是《易经》原文（困卦上爻）**；**\"葛藟\"（gé lěi）是\"缠人的藤蔓\"**；**\"臲卼\"（niè wù）是\"动摇不安\"**；**其可用的核极准**：**\"知动有悔，求悔而去\"——知道\"动会有悔\"，就\"求悔而去\"（把那个\"悔\"当目标，朝它去，反而出去了）**（**这与\"复卦'不远复、知不对立改'\"是同一判断**：**不是\"等不悔了再动\"，是\"动本身在解悔\"）。**","o":"TJ-0510 · 天纪·人间道·困卦·上爻（PDF 第102页）"},{"t":"一百八十二、井卦：守静安常","h":"卦序：\"物之居下者，莫如井\"","c":"定义——井卦（水风井）为\"**珠藏深渊之课，守静安常之象**\"，其卦序：\"**困之后，如至极，则缠身动弹不得，犹陷井中，故困之后为井。物之居下者，莫如井——此卦坎上巽下：坎为水，巽为木，木在水下，必上乎水，故有汲井之象。**\" **\"物之居下者，莫如井\"这一句，是\"井\"的位置**：**井在所有东西的最下面**——**而它恰恰是最有用的东西（因为所有人都在这里取水）**。** **即：\"最低\"与\"最重要\"可以是同一件事。** **而\"木在水下，必上乎水\"给了汲井的机制**：**木（桶）在水下，一定要\"上乎水\"（往上来）**——**即：\"从下面取东西上来\"这件事，方向天然是\"向上\"的。** **卦图六物**：**①\"金甲神执符：贵人在空中，祥瑞之兆也\"**；**②\"女子抱合：好也，但先成后破\"**；**③\"錢宝有光起：财不失，不露之象，不久有丧也\"**；**④\"人落井中：病重象，官司沉陷象，招陷害也\"**；**⑤\"官人用绳引出：贵人为官人，欲相救也\"**；**⑥\"符：符乃策略有傍人作对\"**。** 占例\"杨贵妃私与安禄山为事，卜得之，反受其害也\"**。**须说明**：**这是讲义对井卦序与卦图的注解**；**\"守静安常\"四字是井卦的正面**（**井不\"动\"，但一直在\"用\"**）——**这一条与\"升卦'动'\"恰成一对：升讲\"长上去\"，井讲\"守住不动的那个口\"。**","o":"TJ-0511 · 天纪·人间道·井卦（PDF 第103页）"},{"t":"一百八十二、井卦：守静安常","h":"卦辞：\"改邑不改井\"与\"汲之不竭，存之不盈\"","c":"方法——井卦辞为\"**井：改邑不改井，无丧无得，往来井井**\"，其解极精：\"**井，为不常改之处——常见都市已改，但井无法迁动。井之性，汲之不竭、存之不盈，故曰'无丧无得'；凡人至井侧，皆受其用，此不变之常德也，此为井之道。**\" **\"汲之不竭、存之不盈\"八个字，是一个极准的供给模型**：**取它，它不会枯；存着不用，它也不会满**——**它永远刚好。** **而\"无丧无得\"（不损失、也不增加）正是这个模型的结果**：**它的价值不在\"多少\"，在\"恒常\"**。** **须说明**：**这是《易经》原文加讲义之解**；**其可用的核极准**：**井的\"不变之常德\"与\"改邑不改井\"是一件事**：**城市可以迁，井不能迁**——**因为\"井\"是\"根\"，而\"根\"不跟着\"城\"走**；**这一条与\"升卦'不可无事而升、不求离本位'\"、\"萃卦'聚必以道'\"合成一组关于\"根基\"的判断。**","o":"TJ-0512 · 天纪·人间道·井卦（PDF 第103页）"},{"t":"一百八十二、井卦：守静安常","h":"卦辞后段：\"汔至，亦未繘井，赢其瓶\"——道不为用等于无","c":"要点——井卦辞后段\"**汔至，亦未繘井，赢其瓶，凶**\"，其解是全卦最重的一句：\"**井之道在乎供人用为善——如人至而未用井、仍饮泉，则有亦若无。君子之道，以'有成'为贵——如道即令正，但不为所用，亦等于无也，徒自招凶。**\" **\"如道即令正，但不为所用，亦等于无也\"这一句，把\"正\"与\"有用\"分开了**：**一条道再正，若\"不为所用\"（没人用它），就\"等于无\"**——**而\"徒自招凶\"说明：它不但无效，还会反过来伤人**（**因为\"守着正道却不用\"的人，会怨、会孤、会招祸**）。** **须说明**：**这是《易经》原文（井卦辞后段）**；**\"汔\"（qì）是\"几乎、将近\"，\"繘\"（jú）是\"井绳\"，\"赢\"通\"羸\"（损坏）**——**\"瓶快提上来了，绳却断了，瓶子破了\"**；**⚠ 须补一句**：**\"以'有成'为贵\"这里的\"成\"不是\"成功\"，是\"成了可用的东西\"**（**即：从\"有能力\"到\"能供给\"，中间还差一段**）；**其可用的核**：**井卦对\"学\"给了一条标准**——**学得再对，若\"汲\"不出来（不能给别人用），那口井就等于没打**。","o":"TJ-0513 · 天纪·人间道·井卦（PDF 第103页）"},{"t":"一百八十二、井卦：守静安常","h":"彖：\"井养而不穷也\"","c":"方法——井卦\"彖\"为\"**巽乎水而上水，井，井养而不穷也；改邑不改井，乃以刚中也**\"。\"**井养而不穷**\"五个字，是井卦的总结**：**井的功能就是\"养\"（供给），而它的特点是\"不穷\"（不会用完）**。** **须说明**：**这是《易经》彖传原文**；**其可用的核**：**\"养而不穷\"是\"可持续\"的古典表述**——**而它的条件是\"刚中\"（有刚性、守中道）**（**即：能长期供给的东西，靠的不是\"多\"，是\"稳\"**）。","o":"TJ-0514 · 天纪·人间道·井卦（PDF 第103页）  ---"},{"t":"一百八十三、井卦六爻","h":"彖续与象：\"井德之常\"与\"劳民劝相\"","c":"方法——井卦\"彖\"的续解：\"**木入水中，而又上于水，此井也——井能养物，不尽不竭，此'井德之常'也。城市可改，而井不能迁，犹君子刚中之德——即令再艰险，却永不改变其志。**\" **\"即令再艰险，却永不改变其志\"这一句，把\"井\"从\"物件\"变成了\"人格\"**：**井不能迁＝君子刚中之德不能改**（**而同一条理由，又用来解释\"改邑不改井\"**）。** **\"汔至亦未繘井，未有功也，羸其瓶，是以凶也\"的续解**：\"**井以供人使用为功——今人至井侧而不用井，则有井亦同于无井，无法发挥井之功用。瓶须盛水，今破坏，是以无用而致凶也。**\" **\"有井亦同于无井\"六个字，是上一段的强化版**：**存在不等于可用**（**而\"瓶破坏\"（工具坏了）是它的具体形态）。** **而大象\"木上有水，井；君子以劳民劝相\"的解**：\"**君子观井象，效法井之性——为助民而任劳，且教其互助之功，此效法井之布施无私也。**\" **\"劳民劝相\"（自己辛劳，劝人互助）是两个动作**：**\"劳民\"是\"自己出力\"，\"劝相\"是\"教大家互相帮\"**——**而井的\"布施无私\"正在于此**（**井不挑谁来取，也不收钱）。** **须说明**：**这是《易经》彖传、象传原文加讲义之解**；**其可用的核**：**\"井\"的德性有三层**——**不竭（可持续）、不迁（守根本）、不私（人人可取）**；**三层缺一，\"井\"就不成其为井**。","o":"TJ-0515 · 天纪·人间道·井卦（PDF 第103~104页）"},{"t":"一百八十三、井卦六爻","h":"初爻：\"井泥不食，旧井无禽\"——今之师须有旧井之戒","c":"风险——井卦初爻\"**井泥不食，旧井无禽**\"，其解是全卦最重的一条警告：\"**井之道，始为井之时，仍不适用也——井内初无水，其底为泥，不可食。井之德能养人，乃其有水也。今若为废弃之旧井，其无水，故必无禽至——犹人之无才、无法济物，必为时代淘汰。今之师即须有'旧井之戒'，故孟子曰：'人之患，莫莫过于为师'，即有旧井之戒。**\"其\"象\"：\"**初为阴柔而居井之底，乃泥象——无水之泥，人必不食；无水之井亦无禽聚，此必为时所舍之也。**\" **\"今之师即须有旧井之戒\"这一句，是讲义把\"为师\"直接对应到了\"废弃的旧井\"**：**一口井若\"无水\"（没有新东西出来），就\"无禽至\"（没人来了）**——**而\"师\"若\"无才、无法济物\"，也一样。** **而引孟子\"人之患，莫莫过于为师\"一句，是极重的话**：**\"为师\"本身之所以是\"患\"，是因为\"师\"必须持续\"出水\"**（**一旦\"井底是泥\"，它还挂着\"井\"的名，却已经不能养人了）。** **须说明**：**这是《易经》原文（井卦初爻）加讲义之解**；**\"旧井无禽\"的\"禽\"指\"来饮水的鸟兽\"**；**⚠ 须注明引文归属**：**讲义此处把\"人之患，莫莫过于为师\"系于孟子名下**——**而通行《孟子》原文作\"人之患在好为人师\"**（**即：毛病不在\"当老师\"这件事，在\"喜欢当老师\"这个心态**）；**两条一并保留**：**讲义取\"师须持续出水\"义，\"好为人师\"取\"以教人自居\"义，两者可互补**。**其可用的核**：**\"井泥不食\"是\"能力枯竭\"的古典形象**（**而\"旧井\"二字更准：**它的\"名\"还在，\"水\"已经没了）。","o":"TJ-0516 · 天纪·人间道·井卦·初爻（PDF 第104页）"},{"t":"一百八十三、井卦六爻","h":"第二、三爻：\"井谷射鲋\"与\"井渫不食\"","c":"要点——**第二爻\"井谷射鲋，瓮敝漏\"**：\"**阳刚居将位，居井之时，上不对应，因而趋下、失井之道——降下而趋泥，而成微不足道之物，如破漏之瓮也，终必无功。**\"其\"象\"归因极精：\"**井，能出水助人为功用，故以'能出'为成功——今阳刚之才，本可济用于世，因上不用故成无用。**\" **\"因上不用故成无用\"这一句，是\"人才闲置\"的准确描述**：**\"阳刚之才，本可济用于世\"，而\"上不用\"（上面不用他），于是\"趋下\"（往下走）、\"瓮敝漏\"（连装水的瓮也破了）**——**他的\"无用\"不是他自己造成的。** **第三爻\"井渫不食，为我心恻，可用汲，王明并受其福\"**：\"**九三之才居相位，阳刚又居高位，才必能济世——如井之清水升而上，可助人之力大也。今不见人食，乃谓'君明其贤、不用其才'，贤才之心必忧；如君能用其才、使其才能济民，乃上下之共福也。**\"其\"象\"：\"**井中水清澈而不食用，乃有才智之人不见用——其无法遂行其志而忧怀，但求得遇明君而天下受其福泽。**\" **\"井渫不食\"（井水已经淘清了、干净了，却没人来喝）这个象，比\"井泥不食\"更痛**：**井泥是\"水不行\"，井渫是\"水好了，还是没人来\"**——**而\"为我心恻\"（让我心里难过）是它唯一的反应。** **须说明**：**这是《易经》原文（井卦第二、三爻）**；**\"鲋\"（fù）是\"小鱼\"，\"渫\"（xiè）是\"淘去泥沙\"**；**其可用的核极准**：**\"君明其贤、不用其才\"是比\"君不明\"更难受的一种**（**因为\"明其贤\"说明他看得见，只是不用**）——**而\"并受其福\"（上下共福）是它的解法**（**不是\"贤才求用\"，是\"上下都受益\"。**","o":"TJ-0517 · 天纪·人间道·井卦·第二、三爻（PDF 第104页）"},{"t":"一百八十三、井卦六爻","h":"第四、五爻：\"井甃\"与\"井洌，寒泉食\"","c":"方法——**第四爻\"井甃，无咎\"**，是全卦对\"能力不足者\"最宽容的一条：\"**阴柔之人居君王身侧，才不足而任其位——若但求修治井口之砖砌，自守之，亦可无咎。**\"其\"象\"：\"**修治井口，即令无功于天下，亦因其能守而不致招废弃，亦可为功矣。**\" **\"才不足而任其位——若但求修治井口之砖砌，自守之，亦可无咎\"这一句，是极实在的一条**：**能力不够而位置已在，最好的做法不是\"硬要打水\"，是\"把井口修好、守住\"**——**即：做自己能做的那件小事，就\"无咎\"。** **第五爻\"井洌，寒泉食\"**：\"**君位之人，能如井中之泉，甘寒洁净，为民所喜用——此井道之至善也。**\"其\"象\"：\"**寒洌甘洁之泉水受人喜用，乃'中正之道得用'亦同。**\" **\"甘寒洁净\"四个字，是\"可用\"的标准**：**一口井要好，得\"甘\"（好喝）、\"寒\"（凉）、\"洁\"（干净）**——**而\"为民所喜用\"才是终点**。** **须说明**：**这是《易经》原文（井卦第四、五爻）**；**\"甃\"（zhòu）是\"砌井壁\"**；**\"洌\"（liè）是\"清\"**；**其可用的核有两条**：**①\"能守而不致招废弃，亦可为功\"——\"守\"本身是一种功，不必都是\"大功\"；②\"中正之道得用\"与\"寒泉受用\"同构**（**道之\"可用\"，恰如泉之\"可饮\"**）。","o":"TJ-0518 · 天纪·人间道·井卦·第四、五爻（PDF 第104页）"},{"t":"一百八十三、井卦六爻","h":"上爻：\"井收勿幕，有孚元吉\"","c":"要点——井卦上爻\"**井收勿幕，有孚元吉**\"，是全卦收得最好的一条。其解：\"**井以'水能上出、为人所用'为居功——使人汲取而不竭，其利必无穷无尽；其间之性为常，此不变、始终如一，广施其德于万民，此乃井道之成也。**\"其\"象\"：\"**能以至善而居卦终，乃大成也。**\" **\"勿幕\"（不要把井口盖住）三个字，是全卦的最后一课**：**井修好了、水也清了，若把口\"幕\"（盖上），就前功尽弃**——**而\"勿幕\"的意思是：让人一直能取。** **须说明**：**这是《易经》原文（井卦上爻）**；**\"收\"指\"井已修成\"，\"幕\"是\"覆盖\"**；**其可用的核极准**：**\"井道之成\"的最后一步不是\"修成\"，是\"不盖\"**——**即：能力修到最后，要\"开放\"才算完成**；**这一条与\"井卦辞'道不为用等于无'\"首尾相应**（**一个说\"没用等于无\"，一个说\"不用等于毁\"**）。","o":"TJ-0519 · 天纪·人间道·井卦·上爻（PDF 第104页）"},{"t":"一百八十四、革卦：泽火革","h":"卦序与卦图","c":"定义——革卦（泽火革）\"**此卦彭越战项王绝粮时，卜得之，遂能承恩改革也**\"，卦图为\"**一人把柿全、一人把柿不全、一兔虎、官人推车，车上一印，在大路上**\"。**须说明**：**革卦（泽火革）的卦序与卦辞解在下一段（PDF 第105页起）**，本集按 PDF 页序分章，此处只记卦名与占例；**革（gé）为\"变革\"**；**\"一人把柿全、一人把柿不全\"一物**，取\"有全有不全\"义（**一说\"柿\"谐\"事\"，指\"事有办得成、办不成\"**），**本集只记象，不作定解**；**占例\"彭越战项王绝粮时，卜得之，遂能承恩改革也\"**——**\"绝粮\"而\"改革\"**，说明\"革\"常生于\"断粮\"这种\"不得不变\"的处境。","o":"TJ-0520 · 天纪·人间道·革卦（PDF 第105页）  ---"},{"t":"一百八十五、革之义","h":"卦序：\"如中有秽物，任其存之必败\"","c":"定义——革卦（泽火革）为\"**豹变为虎之课，改旧从新之象**\"，其卦序：\"**井之为用，在甘洁寒洌——如中有秽物，任其存之必败，清之则必洁，此乃革之义，故井后，革为其序。此卦泽在上、火在下，乃'水能灭火、火亦能涸水'之象。人能外悦而内明，乃革之真义。**\" **\"如中有秽物，任其存之必败，清之则必洁\"这一句，是\"革\"的必要性**：**脏东西\"任其存之\"（放着不管），它不会自己变干净，只会\"必败\"**——**而\"清之则必洁\"（清掉它）就干净了。** **即：革不是\"想改\"，是\"不清就烂\"。** **而\"外悦而内明，乃革之真义\"八个字，给了\"革\"的正确姿态**：**\"外悦\"（外面不硬碰、不激化）＋\"内明\"（里面看得清）**——**即：变革要有\"明\"（方向清楚）与\"悦\"（手段不伤人）。** **卦图八物**：**①\"一人把柿全：乃人肺腑之言\"**；**②\"一人把柿不全：一人半真言也\"**；**③\"一兔：跃进之象\"**；**④\"一虎：威权之象，大人之象\"**；**⑤\"官人推车有一印：须力求变革，果必成\"**；**⑥\"虎兔向山行：贤良大人退，后继有人跃进同行\"**；**⑦\"山头四点：上位之人，黑暗不明之象\"**；**⑧\"大路：转变为新且顺之象\"**。** 其中\"**山头四点：上位之人，黑暗不明之象**\"与\"**大路：转变为新且顺之象**\"两物最要紧**：**\"革\"的动因常常是\"上位不明\"，而\"革\"的方向是\"转到新且顺\"。** **须说明**：**这是讲义对革卦序与卦图的注解**；**\"把柿全／不全\"一物取\"言有全有半\"义**（**与\"肺腑之言\"对举**）。","o":"TJ-0521 · 天纪·人间道·革卦（PDF 第105页）"},{"t":"一百八十五、革之义","h":"卦辞：\"巳日乃孚\"与\"革而当，其悔乃亡\"","c":"要点——革卦辞为\"**革：巳日乃孚，元亨利贞，悔亡**\"。其解：\"**革之道，在变其故旧——始初人必未能遽信，必俟至巳日乃人心信从。革之道在求变故后能亨通，但须'诚正利于天下'，乃能去故从新，不因有大变而生悔。**\" **\"始初人必未能遽信\"这一句，是\"改革\"的铁律**：**任何变革一开始，人\"必未能遽信\"（不会马上相信）**——**所以要\"俟至巳日\"（等到时候到了），人心才\"信从\"。** **即：变革的可信度不是\"宣布\"出来的，是\"时间\"长出来的。** **而彖\"巳日乃孚，革而信之。文明以说，大亨以正，革而当，其悔乃亡\"的解**：\"**革之虽变，始初不令人信，但如以正道，日久乃信。能'明且悦'，则能尽事之理，无事不察，人心和顺，必致大亨——此革之至当，必不生悔。**\" **\"革而当，其悔乃亡\"这一句，是\"变革后悔\"的解药**：**\"当\"（恰当）了，就不后悔**（**而\"当\"的标准是\"以正道\"＋\"明且悦\"）。** **须说明**：**这是《易经》原文加讲义之解**；**\"巳日\"（sì rì）取\"事已成之日\"义**（**一说为\"巳\"（十二支之一）所值之日**），**讲义取\"日久\"义**；**其可用的核极准**：**\"变革\"的两个条件**——**①\"诚正利于天下\"（动机与结果都对整体有利）；②\"明且悦\"（看得清、不伤人）**；**缺一个，\"悔\"就会来**。","o":"TJ-0522 · 天纪·人间道·革卦（PDF 第105页）"},{"t":"一百八十五、革之义","h":"彖：\"天地革而四时成\"与\"顺乎天而应乎人\"","c":"方法——革卦\"彖\"有两层极重。**\"革，水火相息，二女同居，其志不相得，曰革\"**：\"**水火互息互灭；次女少女同居一室，其志不同、其所归各异，如革也——有生变异之象。**\" **\"天地革而四时成，汤武革命，顺乎天而应乎人，革之时大矣哉\"**的解是：\"**天地有变革后，乃能生成四时寒暑——万物因其时节而生。王者之与，能上顺天命、下应人心，改旧去新，得《易》之神，此革之时义大也。**\" **\"天地革而四时成\"这一句，把\"革\"提到了自然的层面**：**四季本身就是\"革\"的结果**（**天地的\"变\"，才生出了\"四时\"**）——**即：没有\"革\"，就没有\"序\"。** **须说明**：**这是《易经》彖传原文加讲义之解**；**⚠ 须注明**：**\"汤武革命\"中的\"革命\"是古义，指\"改朝换代（革去前朝的天命）\"**，**与近代政治学意义上的\"revolution\"不同**；**本集只取\"顺乎天而应乎人\"这一层**（**即：改旧去新的正当性，来自\"上顺天理、下应人心\"两条，而非\"力量\"**）；**其可用的核**：**\"顺乎天\"是\"合规律\"，\"应乎人\"是\"得人心\"**——**两条都成立，变革才\"当\"。**","o":"TJ-0523 · 天纪·人间道·革卦（PDF 第105页）"},{"t":"一百八十五、革之义","h":"象：\"君子以治历明时\"","c":"方法——革卦\"象\"为\"**泽中有火，革；君子以治历明时**\"，其解：\"**水火相消灭，为革道，除旧布新——君子观革之象，乃知'推演历数'、知日月星辰之变，以明四时之序，则终能合于天地。**\" **\"治历明时\"四个字，是革卦最容易被忽略的一句**：**变革不只是\"改制度\"，还包括\"重新标定时间\"**——**\"历数\"（历法）是\"四时之序\"的刻度，而\"刻度\"必须跟着\"实际\"改。** **即：当事实变了，量它的尺子也得换。** **须说明**：**\"泽中有火，革；君子以治历明时\"是《易经》原文**；**\"治历\"是\"修订历法\"**；**其可用的核极准**：**\"革\"的最深一层是\"改尺度\"**——**制度变了，若衡量它的标准没变，变革就只是\"换了名字\"**（**这一条与\"贲卦'白贲无咎'（任何饰的体系须设归零端点）\"、\"井卦'改邑不改井'（根不能迁）\"正好构成三种不同的\"变与不变\"**）。","o":"TJ-0524 · 天纪·人间道·革卦（PDF 第105~106页）"},{"t":"一百八十六、革卦六爻","h":"初、二爻：\"巩用黄牛之革\"与\"巳日乃革之\"","c":"方法——**初爻\"巩用黄牛之革\"**：\"**变革之事为大事，必有时机、有人才、有其地位，谋虑而后动，则可无侮矣。犹如用黄牛之皮来'局束'（约束），但求自固而守，不求任意妄动之义。**\"其\"象\"：\"**初革之时，但求能自固守其位，不可妄求有功。**\" **\"必有时机、有人才、有其地位，谋虑而后动\"这三个条件，是\"变革\"的门槛**：**时机、人才、地位**——**三者不备，就不要动**（**而初爻的\"巩\"（捆紧）就是\"先捆住自己\"**）。** **第二爻\"巳日乃革之，征吉，无咎\"**：\"**阴居阴位，乃'得才适用'之时——此际足以去天下之弊、乃上辅于君，行其正道而革之，吉而无災也。**\"其\"象\"给了一个极准的时机判断：\"**时至人信乃革之，动则有喜庆。如时至而不动，则必无济世之心，必因失时而生悔矣。**\" **\"时至而不动，则必无济世之心\"这一句，是\"错过时机\"的定性**：**时候到了还不动，不是\"谨慎\"，是\"无济世之心\"**（**即：不想承担\"改变\"的责任）；而\"必因失时而生悔\"是它的代价。** **须说明**：**这是《易经》原文（革卦初、二爻）**；**\"巩\"（gǒng）是\"捆紧固牢\"**；**其可用的核**：**革卦前两爻正好相反**——**初爻\"不许动\"（条件不备），第二爻\"必须动\"（时至人信）**；**两者的分界不是\"胆量\"，是\"条件与时机的判断\"。**","o":"TJ-0525 · 天纪·人间道·革卦·初、二爻（PDF 第106页）"},{"t":"一百八十六、革卦六爻","h":"第三、四爻：\"革言三就\"与\"改命，吉\"","c":"风险——**第三爻\"征凶，贞厉。革言三就，有孚\"**：\"**九三居相位，居下卦之上，上有君——于此以阳刚之势而力革时，乃过于燥动，行之必有凶。但如慎戒敬惧、守贞正之道，知顺从公论，行革不为人疑出于私利，则吉——因众必孚服而顺。**\"其\"象\"：\"**革之道经再三察合，知顺乎天理，乃事之至当，何须再往呢？**\" **\"过于燥动\"＋\"行革不为人疑出于私利\"这两条，是\"相位变革\"的两个失败点**：**一是\"急\"（燥动），二是\"疑\"（别人怀疑你为自己谋利）**——**而\"革言三就\"（变革的主张要经三次察合）正是对前者。** **第四爻\"悔亡，有孚，改命，吉\"**：\"**此即以刚处柔位，近君侧之人，刚柔互济——于革之时，行以至诚，致令上信下顺，其吉必矣。**\"其\"象\"：\"**能改命致吉，必上下能顺从信服方成，因至诚感召也。**\" **须说明**：**这是《易经》原文（革卦第三、四爻）**；**\"革言三就\"指\"变革的主张要反复审察三次才算成熟\"**；**\"改命\"在此指\"更改命令／制度\"**（**不是\"改命运\"**）；**其可用的核极准**：**\"革言三就\"是\"变革\"的审慎标准**
