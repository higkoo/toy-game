章卦象详解·火天大有·人间道（PDF 第148页）  ---"},{"t":"三百五十三、第十三次验证：谦卦","h":"\"×××○××\"与\"二人分金\"","c":"数据——**谦卦的符号给了第十三个可核点**。**原文**：\"**地山谦卦：'×××○××'（二人分金）上平。**\" **本集核对卦体**：**地山谦＝坤上艮下；下艮（初六阴、六二阴、九三阳）、上坤（六四阴、六五阴、上六阴）**（**即自下而上：阴、阴、阳、阴、阴、阴**）。** **比对**：**自左向右得\"阴、阴、阴、阳、阴、阴\"——不符**（**第三爻才是阳**）；**自右向左得\"阴、阴、阳、阴、阴、阴\"——完全吻合** ✓。** **至此\"自右向左\"已十三次验证**（**屯、蒙、需、讼、师、比、小畜、履、泰、否、同人、大有、谦**）。** **而这一卦的\"阳\"落在**第三爻（自右数第三个）**——**它既不是首位、也不是第二位、也不是末尾，而是\"六爻里唯一的阳\"**。** **须说明**：**这是本集第十三次符号核验**；**其可用的核极准**；**⚠ 一并记一处对照**：**\"二人分金\"这个意象在本册出现了两次**——**同人卦为\"浮鱼从水之卦，二人分金之象\"（上中）**，**谦卦亦为\"二人分金\"（上平）**；**同一意象配两个不同卦，说明\"卦图意象\"与\"卦体\"并非一一对应**（**这一点须标，因为它削弱了\"象—卦\"的严格性**）。","o":"TJ-0836 · 天纪·紫微详解·第四章卦象详解·地山谦·文王金钱课（PDF 第151页）"},{"t":"三百五十四、\"贵人捧镜\"与\"地上有个公字\"","h":"谦卦取象的三个物件","c":"要点——**谦卦的卦图解得很干净，三样东西各管一层意思**：\"**'有乱丝，为牵连未解；又代表\"三人行必有我师\"，要有谦虚态度'。'**贵人捧镜，是遇清官之意——镜为\"静止\"，说明该止则止之意**'。'**地上有个公字，主公事得理；又代表没有私心**'。'谦卦为地上有山之卦，仰上就下之象'。'卦身为戌，未入卦，此卦**缺少妻财**'。'日月当空，为无私'。'有一人骑着鹿，主财禄俱来，又代表得道高人到来'。**\" **三样物件的读法（本集整理）**：**①乱丝＝\"牵连未解\"（事未了）＋\"三人行必有我师\"（谦）**；**②镜＝\"静止\"（该止则止）**——**这一层最见巧思**：**\"请教高人\"与\"停止前进\"被同一个物件同时承担**；**③\"公\"字＝\"公事得理\"＋\"没有私心\"**。** **须说明**：**这是讲义对谦卦图的著录**；**其可用的核**：**\"镜＝静止\"是取象的比喻**（**而\"该止则止\"这个意涵，与\"谦\"之义确有相通**）；**⚠ 须标**：**\"此卦缺少妻财\"是一条\"六亲缺项\"的说明**（**与前面否卦\"缺子孙\"、豫卦\"缺父母\"是同一类**，**可核其作为体系的固定注解**）。","o":"TJ-0837 · 天纪·紫微详解·第四章卦象详解·地山谦·人间道（PDF 第150页）"},{"t":"三百五十五、\"贤德之妇人，往往尽心尽力为家操心\"","h":"\"结果却无法挽回婚姻之善\"","c":"要点——**谦卦\"地脉道\"（母居东北角）的第一条，写出了全册最痛的一句现实观察，须完整照录**：\"**地山谦（母居东北角，65 岁以前住不吉）：'谦卦九三爻位——**劳谦，君子有终**，有劳谦之美。任劳任怨，居无所苦，谦以让人，妇之贤德，表现无遗，且始终不变'。**\" **而后是关键的一句**：\"**'一、必为贤妻良母之人无疑，**但夫卦为遁，主夫妻不利，感情退化**——所以常见有贤德之妇人，往往尽心尽力为家操心，**结果却无法挽回婚姻之善**'。**\" **本集复算\"夫卦为遁\"（可核）**：**谦卦＝坤（母）上艮（东北位）下**；**而\"夫\"＝乾**；**若乾居艮位（东北），则乾上艮下＝**天山遁** ✓**——**\"遁\"即\"退避、隐去\"**，**与原文\"感情退化\"直接呼应** ✓。** **即：这一局的名字（谦）与\"夫卦\"的名字（遁），一个是\"让\"，一个是\"退\"**（**两字合起来，恰好是那个结局**）。** **须说明（两层）**：**①\"夫卦为遁\"可复算** ✓（**人＋位→卦名，规则一贯**），**而\"遁\"的字义与\"感情退化\"的对应，也是一层可核的语义呼应**；**②⚠ 而\"贤德之妇尽心尽力却无法挽回婚姻\"这一句，是本册对**女性处境**写得最痛的一处**——**它说的不是\"她不好\"，而是\"她的好不足以维持婚姻\"**（**这一层脱开命理也成立：**\"付出\"与\"结果\"之间，从来没有等价兑换**）。** **⚠ 须重点标**：**同条后半\"六十五岁以后不成此局，母亲居住 10 年以上，眼睛会目带凶光\"**——**以\"居住年限\"断定一个人的眼神与心性，无任何依据**。","o":"TJ-0838 · 天纪·紫微详解·第四章卦象详解·地山谦·地脉道（PDF 第150页）"},{"t":"三百五十六、\"木克土，容易难产或流产\"","h":"一条必须最高级警告的孕产断言","c":"风险——**豫卦\"性格\"段，出现了一句全册最危险的孕产断言，须照录并明确否定**：\"**上震下坤、上木下土、木克土不利于母亲；坤为母，有包容之心，心地善良、乐于助人，易获贵人相助、逢凶化吉、做事容易成功。震为长子为木，木克土表示母子不和；坤为阴主财，被克而容易破财；**坤又代表有孕之人，被克容易难产或流产**；健康主腹、胃、肠有疾病。**\" **⚠ 本集处置（三层）**：**①照录**；**②⚠ 明确——\"木克土→容易难产或流产\"没有任何依据**：**流产与难产的成因是明确的**——**流产多与染色体异常、子宫结构异常、内分泌失调（如黄体功能不足、甲状腺疾病）、感染、免疫因素、母体全身性疾病有关**；**难产则与胎位、产力、产道、胎儿大小及母体状况有关**；**而这些都可以通过产检（B 超、胎心监护、糖耐、唐筛／无创、必要时羊穿）被**发现与处理**。** **③⚠ 而这句话的伤害极直接**：**它会让一个已经流产过的女性，把原因归到一个抽象符号（\"木克土\"）上**——**而\"归给卦\"的代价，是她不去查**真正可查的病因**（**而很多复发性流产的原因是可以查明并干预的**）。** **本集明确：**任何\"卦象／方位会导致流产难产\"的说法，都不可对孕产妇说出**——**孕产期最需要的是规范的产检与明确的风险沟通，而不是一句\"你这一局容易流产\"**。** **⚠ 另须标**：**\"坤代表有孕之人\"这一条，是把\"坤（地、母）\"与\"怀孕\"作比喻联结**（**而比喻再往前走一步，就变成了因果**——**这一步是全部问题的所在**）。","o":"TJ-0839 · 天纪·紫微详解·第四章卦象详解·雷地豫·性格（PDF 第151页）"},{"t":"三百五十七、\"用人在前，不用人在后\"","h":"一句极准的画像","c":"要点——**豫卦\"性格\"段末尾有一句极精的人物素描，须单独抄出**：\"**'**豫外善内狠，暗中较劲，用人在前，不用人在后，内外反差很大**'。**\" **这一句的四层**：**①\"外善内狠\"（表里不一）**；**②\"暗中较劲\"（不正面冲突，但一直用力）**；**③\"用人在前，不用人在后\"（关系的\"工具性\"—用得着时排前面，用不着时排后面）**；**④\"内外反差很大\"（总结）**。** **而\"用人在前，不用人在后\"这八个字，是全书对\"功利型人际\"最省笔墨的一次刻画**：**它不骂人，只是把一个动作描述出来**——**需要你时，你在最前；不需要你时，你连后面都排不上**。** **须说明**：**这是讲义对豫卦性格的论述**；**其可用的核**：**\"用人在前、不用人在后\"这一层，在任何职场与人际语境下都成立**（**而它的杀伤力不在\"狠\"，而在\"暖\"**——**因为前面是暖的，后面的冷才格外伤人**）；**⚠ 另标**：**\"木克土表示母子不和\"这一条，把\"母子关系\"读成\"五行相克\"**（**而真实的母子冲突，涉及养育方式、期待与边界，不是\"木土\"之争**）。","o":"TJ-0840 · 天纪·紫微详解·第四章卦象详解·雷地豫·性格（PDF 第151页）"},{"t":"三百五十八、\"长子居西南角\"与\"母有先丧之象\"","h":"一条断母寿的规则","c":"方法——**豫卦\"地脉道\"（长子居西南角卧房）给了三条，其中第二条指向母亲的寿命，须照录并警告**：\"**雷地豫卦（长子居西南角卧房）：'成此卦局之男人，必有**因禄远行**之象，'大利肖马之人'。**\" **本集复算卦名**：**雷地豫＝震上坤下；\"长子\"＝震（长男），\"西南角\"＝坤（母位）**——**长男居母位＝震上坤下＝雷地豫** ✓。** **三条（照录）**：**①\"居家中为母助，家事琐碎，巨细靡遗——**有男人能做一手好菜，即为此局之人**\"**；**②\"事业财官双美、平步青云，**惟与六亲远离，母有先丧之象**\"**；**③\"婚姻延后……\"**（**原文至此转入下页**）。** **须说明（两层）**：**①第①条\"男人能做一手好菜即为此局之人\"是一个难得的**生活化标识**（**它以\"谁在做饭\"这种可见的日常，来\"认\"一个局**，**比抽象吉凶更可核**）；**②⚠ 而第②条\"母有先丧之象\"是**断母亲的死**（**它把\"儿子事业好\"与\"母亲先走\"绑成一组**——**而这两者之间没有任何可核的联系**；**而这类话最伤人的地方在于：**它会让一个正在打拼的子女，在母亲生病时产生\"是不是我害的\"的念头**）。** **⚠ 本集明确：任何\"某人的母亲会先走\"这类断语，都不可对人说出**。","o":"TJ-0841 · 天纪·紫微详解·第四章卦象详解·雷地豫·地脉道（PDF 第152页）"},{"t":"三百五十九、豫卦的\"缺项\"与谦卦的\"缺项\"","h":"\"缺父母爻\"\"缺子孙爻\"\"缺妻财\"","c":"要点——**本册在卦解里反复出现\"六亲缺项\"的注解，三者连看，构成一条可核的结构线索**：\"**否卦：'此卦缺子孙爻'；谦卦：'卦身为戌，未入卦，**此卦缺少妻财**'；豫卦：'**此卦缺父母爻**'。**\" **本集整理（三条并列）**：**否卦缺子孙｜谦卦缺妻财｜豫卦缺父母。** **须说明**：**这是讲义对三卦\"六亲缺项\"的说明**；**其可用的核**：**三处注解在同一册内**互不冲突**（**可核其作为固定体例**），**而\"缺项\"这一层意思，与卦义也有可通的呼应**（**如否卦\"天地不交、生发之气不出\"→缺子孙，可核其语义相通**）；**⚠ 须重点标**：**\"六亲缺项\"是\"象数结构\"的说明，不是\"某人真的没有子女／父母／配偶\"的论断**——**而它在实用中最容易被误读为后者**（**而本册前面确实出现过\"子女宫空宫＝命中无子女\"这类**直接把缺项读成事实**的用法**，**须分开看**）。","o":"TJ-0842 · 天纪·紫微详解·第四章卦象详解·天地否、地山谦、雷地豫（PDF 第128、150、151页）"},{"t":"三百六十、谦卦的六条后果","h":"\"民选官之倾向\"与\"股东不合\"","c":"要点——**谦卦\"地脉道\"的后四条，是一个\"按身份分述\"的结构，照录**：**\"②身体小病痛不断，因劳成疾\"；\"③官家人逢之，主遇事公平处之，一丝不苟之人\"；\"④商家人得此局，必生财禄，但往往有**股东不合、因分利不均而破坏**\"；\"⑤同时生人，则有官带现——如命为公职人，但居谦卦者，**有民选官之倾向**；商家人亦有此倾向，**会居国会殿堂之中**\"。**\" **另有一句**总纲**：\"**'古人享祀遇此卦，礼为亨，君子之事有终。亨：通也'。**\" **须说明**：**这是讲义对谦卦地脉道按身份分述的后果**；**其可用的核**：**第④条\"因分利不均而股东不合\"这一层，在任何合伙生意里都成立**（**而它的价值不在\"卦\"，而在它点出了\"分利机制\"这个真问题**）；**⚠ 须重点标**：**\"有民选官之倾向\"\"会居国会殿堂之中\"是极具体的**政治前途断言**——**一个人的从政之路取决于选票、能力、机遇与制度，与住哪一屋无关**；**而这类\"你会当上什么\"的许诺，最容易让人把**位置**当成**凭据**。","o":"TJ-0843 · 天纪·紫微详解·第四章卦象详解·地山谦·地脉道（PDF 第150~151页）  ---"},{"t":"三百六十一、五行形人：一套完整的体貌分类","h":"木、火、土、水、金五形","c":"方法——**第八例开头，讲义给出了一套完整的\"五行形人\"分类，是全册最系统的一处体貌描述，须照录**。**原文五段（照录）**：**①木形人**——\"**瘦瘦干干的，越干越好。像猴子一样的是木形人；你又生肖是猴，为成格。头小脸长，脸色深沉有点黑，肩膀见骨无肉，手脚细长多青筋**\"；**②火形人**——\"**比较尖翘，头发尖尖的、头顶尖、鼻头尖、下颚尖；皮肤发红、发头有点红或黄，脸上没有肉，皮包骨，很亮，像关公一样。火形人，男人发武将、发武官；女人发餐饮业，发于火有关的东西（如餐饮业、饭等能吃的行业都属于火）。火形人办事容易一厢情愿、强人所难**\"；**③土形人**——\"**有三短的特征：身材短（体胖显短）、脖子短、手指短，像鲁智深。脸色偏黄，眼睛大而圆、眉毛粗而浓、嘴巴大、嘴唇厚、鼻子扁而鼻头肉多，脸上有横肉，眼皮比较厚且向下堆，耳朵偏小，发迹较低。喜欢安静，不喜欢吵闹，办事行动较慢**\"；**④水形人**——\"**皮肤微黑，头型较大，后腮呈现方形，耷拉脸，脸型下部宽大；耳朵大、眼大眉毛粗、鼻梁比较低、宽额头；手掌厚而软、指尖根粗。多忧多虑，遇事钻死牛角尖、想不开，不会变通，善恐**\"；**⑤金形人**——\"**头小、额头偏圆，脸型偏小、皮肤偏白，眼睛小、眼神不定，耳朵小而且白、位置较靠上，面有棱角；肩背部小、腹小、手足小，足跟部骨骼显露，骨轻。人都比较圆滑、聪明伶俐；清高气傲、刻板固执**\"。** **须说明**：**这是讲义对\"五行形人\"的完整分类**（**从外形（高矮胖瘦、头面手足）到性情（快慢、刚柔、忧虑）都给了**可观察的指标**）；**其可用的核**：**这五段在册内自洽**（**且\"木形＝瘦长、土形＝短厚、水形＝下部宽、金形＝小而白、火形＝尖而露骨\"这组外形特征，彼此可区分** ✓）；**⚠ 而须重点标**：**\"火形人男人发武官、女人发餐饮业\"这一条，把**性别与行业**都绑在\"形\"上**（**而一个人的职业选择，与他的颧骨高低无关**）；**⚠ 另标**：**\"木形人＋生肖属猴为成格\"这一条，与前面\"姓狄＋肖犬\"是同一路**（**形＋生肖的叠加，仍无依据**）。","o":"TJ-0844 · 天纪·紫微详解·第五章紫微十二宫详解·第八例·五行形人（PDF 第154~155页）"},{"t":"三百六十二、\"巨日格：女人主偏房，男人大富大贵\"","h":"一个明确的双重标准","c":"要点——**第八例开篇对\"巨日格\"的说明，直接写出了一个按性别分设的判词，须照录并标**：\"**'这个八字叫做巨日会命——巨门、太阳叫巨日格'。'一般来说：**女人拿到巨日格，主偏房，她是偏房命**；**男人拿到巨日格呢，大富大贵**——这不一样吆'。**\" **⚠ 本集处置（两层）**：**①照录**（**因为它是这套体系里性别差异最直白的一处**）；**②⚠ 须明确——同一个\"格\"，对男是\"大富大贵\"，对女是\"偏房命\"**（**这个差异不是\"推算\"出来的，是**立场**先定好的**）——**而\"偏房\"这个词本身，指的就是旧式婚姻中的妾室**（**即：这套体系把一个女性的位置，预设成\"给她一个已有妻室的男人\"**）。** **⚠ 另须标**：**同段续论把她\"权禄相逢格\"读成\"一定自己做事业、自己当老板、自己办企业、自己当经销商\"**（**这一条反而是**正面的**：**它承认一个女性可以自己当老板**）；**⚠ 而紧随其后的\"强女对弱男，先生比老婆差，那就是半吊子\"\"好的男人也不会喜欢这样的身材女为妻\"**——**这两句是以体貌与\"强弱\"贬损当事人**，**本集不采其义**。","o":"TJ-0845 · 天纪·紫微详解·第五章紫微十二宫详解·第八例·巨日格（PDF 第154页）"},{"t":"三百六十三、\"福德宫是女人的第二夫妻宫\"","h":"一条关于\"看哪一个宫\"的优先级","c":"方法——**第八例的夫妻宫段，给出了一条极明确的**判读优先级**，须完整照录**：\"**'夫妻宫有红鸾星，大限是 25–34，红鸾星动；对宫没有煞星，太阴入住伴随有天喜——她妈妈看上了，太阴化权，她的婚姻受妈妈左右；她妈妈同意了，她就结婚了'。**\" **而后是关键的一句**：\"**'**夫妻宫没有煞星、对宫没有煞星，不代表婚姻完美**——**福德宫是女人的第二夫妻宫，它说了才算**'。**\" **这一句的分量在于它**推翻了一个直觉**：**\"夫妻宫干净\"不等于\"婚姻好\"**（**因为\"夫妻宫\"看的是\"配偶的样子\"，而\"福德宫\"看的是\"她自己满不满意\"**）。** **而下一段立刻用实例验证了这条规定**：\"**'福德宫：她身在福德宫，**化忌是对婚姻表示不满意**……小限 28 岁在未宫，是福德宫化忌——**结婚两年后就化忌，他们离婚了**'。**\" **须说明**：**这是讲义对\"夫妻宫\"与\"福德宫\"关系的论述**；**其可用的核**：**\"配偶条件好≠当事人满意\"这一层，在任何婚姻议题上都成立**（**而\"福德宫\"在册内被多次说成\"女人的第二夫妻宫\"，可核其一致使用** ✓）；**⚠ 须重点标**：**\"化忌＝不满意→必离婚\"这个推论不可核**（**而\"结婚两年后就化忌，所以离婚\"这一句，仍是事后配象**）。","o":"TJ-0846 · 天纪·紫微详解·第五章紫微十二宫详解·第八例·福德宫（PDF 第156页）"},{"t":"三百六十四、\"经常发生家暴（伏兵）\"","h":"一条必须最高级警告的断语","c":"风险——**第八例的福德宫段，用一组星曜去\"断\"一场家暴，须照录并明确警告**：\"**'女性有禄存，表示为人小气、比较吝啬'。'在福德见到了**大耗**，说明丈夫手大、破费、乱花钱'；'**经常发生家暴（伏兵）**'；'甚至受伤做过手术（**天钺**）'；'最终走向诉讼（**天刑**）'。**\" **⚠ 本集处置（三层）**：**①照录**（**因为必须让人看清\"星→家暴\"的这条链条是怎么搭起来的**）；**②⚠ 明确——家庭暴力是**行为与权力问题**，不是星象问题**：**施暴者选择暴力，与其成长经历、控制欲、酒精与药物滥用、性别观念有关**，**而与\"福德宫里有没有伏兵\"无关**；**③⚠ 而这句话的实际危害极重**：**(a) 它让受害者把\"被打\"归到\"我的命里有这个星\"**——**于是她不离开、不报警、不求助，因为\"这是我命里该受的\"**；**(b) 它让施暴者获得一种免责的解释**——\"不是我要打，是命里有伏兵\"**。** **⚠ 本集明确：家暴不可以用命理解释，也不可用\"化解\"代替离开**——**而可行的动作是明确的：**保留证据（伤情照片、就医记录、聊天记录）、拨打 110、联系妇联 12338、或法律援助 12348；如有即时危险，先离开现场。** **⚠ 另须标**：**\"受伤做过手术（天钺）\"\"走向诉讼（天刑）\"这两条，把医疗与法律事件也归给了星曜**（**而就医与诉讼，都是人可以主动选择的行为**）。","o":"TJ-0847 · 天纪·紫微详解·第五章紫微十二宫详解·第八例·福德宫（PDF 第156页）"},{"t":"三百六十五、编者的第五次勘误","h":"\"37 年生，47 年来求测……她才十岁啊！\"","c":"要点——**第八例末尾，编者（署名\"紫易奇缘\"）发现了一处**文本内在的年龄矛盾**，须照录**：\"**'她民国 47 年（1958 年）来求测。**那这不对了——37 年生，47 年来求测，不对啊！她才十岁啊！**民国 47 年是 1958 年，那倪师年龄又是多少呢？**倪师可能说的是 47 岁来求测**'。'不管这些，我们继续研究流年，从巳到寅为 30、31、32、33 岁，各宫全是吉星，事业很旺，赚很多钱'。**\" **本集复算（可核）**：**民国 37 年＝1911＋37＝1948 ✓**（**与原文\"公元 1948 年 12 月 11 日\"吻合**）；**1958－1948＝10** ✓——**故\"1958 年来求测\"则当事人确实只有 10 岁**（**与后面\"25 岁结婚\"\"28 岁离婚\"的叙述**完全冲突**）。** **须说明（两层）**：**①这是编者的第五次公开纠正，也是**唯一一次针对\"原文前后矛盾\"**的纠正**（**前四次是排盘、宫位、结论，这一次是**文本自身的年份冲突**）；**②他的处理方式是\"标注＋推测＋继续\"**（**\"倪师可能说的是 47 岁来求测\"是一个合理推测**：**1948＋47＝1995 年，与\"28 岁离婚\"等叙述可以相合**；**而\"不管这些，我们继续研究流年\"，说明他选择了\"存疑而不中断\"**）。** **⚠ 须标**：**这一处矛盾是一个**内部证据**——**它说明这类由\"讲课录音转文字\"形成的文本，年份与年龄的错位是常态**（**而任何据此做的\"精准推算\"，其输入本身就未必可靠**）。","o":"TJ-0848 · 天纪·紫微详解·第五章紫微十二宫详解·第八例·流年（PDF 第157页）"},{"t":"三百六十六、\"地天泰卦\"与三个分支","h":"离婚后的女人该住哪一屋","c":"方法——**第八例的阳宅段，是全册**条件分支**写得最细的一处，须完整照录**：\"**'离婚后的女人住在西北角——西北为乾、为父。**母代父职，完了**——在此即是母亲又当父亲，为**终生不嫁**；所以 32 岁遇到红鸾星也没有用，她结不成婚，这就是命'。'住在西北角，为**地天泰卦**'。**\" **而后是三个分支**：\"**'**如果没有生孩子、没有人叫她妈妈，这卦就不是地天泰卦**'。'**生过孩子又离了婚，只有两个位置可住：一个乾、一个是坤**——**在乾终生不嫁**；**孩子同住一个家、不是同室，可再婚**。'**如果孩子在外面住，此女应该住到东南巽位，可以再婚**'。**\" **本集复算卦名（可核）**：**地天泰＝坤上乾下；\"母\"＝坤，\"西北角\"＝乾（父位）**——**母居父位＝坤上乾下＝地天泰** ✓。** **本集整理三支（照录）**：**①住乾（西北）→母代父职→终生不嫁**；**②住坤（西南）→名位相等→可再婚**（**前提：孩子同住一家但不同室**）；**③孩子在外住→住东南巽位→可再婚**。** **须说明**：**这是讲义对\"离婚女性住哪\"的规定**；**其可用的核**：**\"母居父位＝地天泰\"可复算** ✓；**⚠ 而须重点标**：**这一整套\"住哪一屋决定能否再婚\"的说法，无任何依据**（**而\"母代父职，完了\"这四个字，把\"一个女人独自承担双亲角色\"读成\"命已定死\"**——**这一句对单亲母亲的伤害，比任何吉凶断言都重**：**它把她的承担，说成\"所以你不该再婚\"**）。","o":"TJ-0849 · 天纪·紫微详解·第五章紫微十二宫详解·第八例·阳宅（PDF 第157页）"},{"t":"三百六十七、\"夫妻死别格\"","h":"一段必须最高级警告的自述","c":"风险——**第九例（紫微在巳、命在酉，1994 年 2 月 28 日，阳女）开头，讲义以第一人称自述了一类\"格\"，须照录并明确警告**：\"**'如果命宫在亥，兄弟宫（戌）、夫妻宫（酉）就变成了廉破，命宫（亥）是天府，对面是紫微七杀，然后夫妻宫是廉破——我刚才讲的那种把它换过来的格，就叫做**夫妻死别的格**'。'**我本人批过不止三十个**，现在还有一两个在我手上，让他赶快去化解掉。**那前面来找我批的都是已经死了**——来找我批的，**有的太太开刀死的，有的跳碧潭河死的**，反正都死掉了'。'夫妻宫遇到廉破，这种煞星进来的话，都是主夫妻死别；也都是主夫妻生离'。**\" **⚠ 本集处置（三层）**：**①照录**（**因为这一段是\"格\"如何被\"验证\"的最完整自述**）；**②⚠ 明确——\"夫妻宫遇廉破→配偶风险极高\"没有任何依据**：**一个人的配偶会不会早逝，取决于其自身的疾病、意外与医疗条件**；**③⚠ 而这一段的结构，正暴露了这套体系最危险的地方**：**\"批过三十个以上\"——这三十个人里，有配偶**还活着的**吗？讲义没有说**（**它只说了\"还有一两个在我手上，让他赶快去化解掉\"**）——**而\"已经死了的都来找我批\"，是**只数应验、不数不应验**（**这正是\"幸存者偏差\"的典型**）。** **⚠ 须重点标**：**\"有的跳碧潭河死的\"涉及具体地点与死法**——**本集只记\"讲义这样陈述\"，不重复案情，也不认可任何\"命理已预测\"的说法**；**而**\"某人会死\"这类话，绝不可对任何人说出**（**如有人因这类断言而陷入恐惧或轻生念头，应立即寻求帮助：心理援助热线 12356、北京心理危机研究与干预中心 010–82951332、或直接拨打 120／110**）。","o":"TJ-0850 · 天纪·紫微详解·第五章紫微十二宫详解·第九例（PDF 第158页）"},{"t":"三百六十八、第十四次验证：豫卦","h":"\"××○×××\"与\"青龙得位\"","c":"数据——**豫卦的符号给了第十四个可核点**。**原文**：\"**雷地豫卦：'××○×××'（青龙得位）上中。**\" **本集核对卦体**：**雷地豫＝震上坤下；下坤（初六阴、六二阴、六三阴）、上震（九四阳、六五阴、上六阴）**（**即自下而上：阴、阴、阴、阳、阴、阴**）。** **比对**：**自左向右得\"阴、阴、阳、阴、阴、阴\"——不符**（**第四爻才是阳**）；**自右向左得\"阴、阴、阴、阳、阴、阴\"——完全吻合** ✓。** **至此\"自右向左\"已十四次验证**（**屯、蒙、需、讼、师、比、小畜、履、泰、否、同人、大有、谦、豫**）。** **而这一卦的\"阳\"落在**第四爻**——**至此，那位\"唯一的阳\"已经分别落在第二爻（同人）、第三爻（谦）、第四爻（豫）、第五爻（大有）**（**四个连续位置都验过，每一个都只有\"自右向左\"能对上**）——**这是\"方向确定\"最强的一组证据**。** **须说明**：**这是本集第十四次符号核验**；**其可用的核极准**；**⚠ 一并记一处**内部矛盾**：**豫卦\"先天\"栏写\"五阴一阳数中定\"**（**与卦体\"五阴一阳\"**完全吻合 ✓**，**这一处反而是对的**）；**而同章第八例写\"寅午戌，戌为墓，小限从此宫起\"，而该命主为**戊子年生、属鼠**（**\"寅午戌\"为火局，与\"子\"不符**）——**属鼠应入\"申子辰\"水局**，**此处与\"起宫\"之说不能相合**（**本集照录原文，并标此矛盾**）。","o":"TJ-0851 · 天纪·紫微详解·第四章卦象详解·雷地豫·文王金钱课（PDF 第153页）  ---"},{"t":"三百六十九、五例反例样本","h":"\"后两位是我的邻居，没有发生廉破的灾难\"","c":"数据——**第九例末尾，编者（署名\"紫易奇缘\"）给出一组**反例样本**，这是全册最接近\"证伪\"的一段，须完整照录**：\"**'紫易奇缘：廉贞、七杀——半路死亡，或叫\"半路埋尸\"，在路上出现意外；廉贞、破军——**水中作塚**，在里面做坟墓，在河里或海里遇难；廉贞、贪狼——横夭，主先天疾病、自杀，多数有遗传疾病、先天疾病或抑郁症'。**\" **而后是关键的一段**：\"**'**下面举几个例子：紫微在巳、命宫在亥，我这里有五例**——黄宗羲是明末清初的名人，不了解他的家史；**徐熙娣是小 S，大家一查就知道**；**后两位是我的邻居，没有发生廉破的灾难**。中间这位命盘，我上传叫大家看看'。**\" **须说明（三层）**：**①这是一组\"同格五人\"的样本**（**\"紫微在巳、命宫在亥\"是同一个格，而五人之中：一位是古人（家史不明）、一位是公众人物（可查）、两位是编者的邻居（他亲眼知道）、一位是上传的命盘**）；**②其中\"后两位是我的邻居，没有发生廉破的灾难\"是**最有力的反例**——**它是**身边可验证的人**，而非\"查无实据\"（**而编者的做法，是把\"没有发生的\"也写进书里**）；**③⚠ 而须标**：**这是一种**朴素的证伪思维**（**\"同格的人里，有平安的\"→\"这个格不成立\"**），**它比\"举例证明\"高明得多**（**而它出现在一本命理书里，尤其值得记**）。** **⚠ 另须标**：**\"小 S\"是真实公众人物**（**本集只记\"编者把她列为反例样本\"，不复述任何个人情况**）。","o":"TJ-0852 · 天纪·紫微详解·第五章紫微十二宫详解·第九例·编者按（PDF 第159页）"},{"t":"三百七十、\"凶象全占，也没有发生生离死别\"","h":"一个多重凶象俱全的平安样本","c":"数据——**编者随后给出一个更硬的样本：所有凶象都占了，人却平安**。**原文**：\"**'某某命主，1979 年 6 月 23 日未时生人，阴女，职高毕业，老公是警哥，本人是个体商户，从事饮食有关的行业；1999 年结婚，2002 年生儿子，2009 年购买住宅，以后一切平安'。**\" **而后是这一段的核**：\"**'这位还有特点：**命宫在绝地**、**天府不能化煞**、**文曲在命宫化忌**、**夫妻是廉破**，并且**夫妻宫宫干是癸，四化\"癸破巨阴贪\"**，**贪狼在身宫＋福德宫化忌**（'福德是女人的第二夫妻宫'）——**也没有发生生离死别之象**'。'**我目前研究命例超过五千例**'。**\" **本集核其四化（可核）**：**\"夫妻宫宫干是癸，四化癸破巨阴贪\"**——**癸干为破军禄、巨门权、太阴科、贪狼忌**（**与本册十干四化表\"癸破巨阴贪\"**完全吻合** ✓）。** **须说明（两层）**：**①这是一个**\"凶象叠加\"却\"结果平安\"**的样本**——**绝地、不能化煞、命宫化忌、夫妻廉破、身宫与福德双化忌**（**按前文说法，这几条每一条都该出大事**），**而她的现实是：1999 年结婚、2002 年生子、2009 年买房、\"以后一切平安\"**；**②\"我目前研究命例超过五千例\"这一句，是**样本量的声明**（**它说明这个\"反例\"不是一个巧合的印象，而是在一个五千例的库里挑出来的**）。** **⚠ 而须重点标**：**这个样本恰好证明了**\"凶象叠加\"不产生\"必然结果\"**——**而它同时也说明：这类\"格\"若要成立，必须能\"排他\"**（**即：符合条件者**都**如此**）；**而一旦出现\"符合条件者平安\"，这个格就只能降格为\"倾向\"**（**而降格为\"倾向\"之后，它就无法再被验证**）。","o":"TJ-0853 · 天纪·紫微详解·第五章紫微十二宫详解·第九例·编者按（PDF 第160页）"},{"t":"三百七十一、\"倪师说的有点过了\"","h":"编者的第六次反驳，以及他自己的条件","c":"要点——**编者在这一段直接质疑原作者的断法，并给出了自己的\"断生死\"条件，须照录**：\"**'**我认为倪师在廉破、廉杀、廉贪上说的有点过了**——**有很多这样的例子，人都不是死离**'。'**要想（用命理）断生死，一是要注意伤使与大小限的关系，二是化三忌以上**'。'我用伤使断了无数人的，包括前面那位〇〇〇主持人'。**\" **须说明（三层）**：**①这是编者的**第六次公开反驳**，**而这一次反驳的层级最高**——**前五次是纠排盘、宫位、结论、年份，这一次是**直接说\"原作者的判断过头了\"**；**②他给的条件颇有分寸**：**\"伤使与大小限的关系\"＋\"化三忌以上\"**（**即：要有**多重条件同时成立**才敢断生死**，**而不是\"见廉破即断死\"**）；**③⚠ 须重点标**：**\"包括前面那位〇〇〇主持人\"涉及一位真实公众人物的死亡**——**本集只记\"编者这样陈述\"，**不重复其人其事，**也不认可任何\"命理已断准\"的说法**（**而对任何真实逝者，本集只作\"不作评述\"处理**）。","o":"TJ-0854 · 天纪·紫微详解·第五章紫微十二宫详解·第九例·编者按（PDF 第159页）"},{"t":"三百七十二、岳母的故事","h":"\"大家照了全家福照发给我，暗示我没有算对\"","c":"风险——**编者接着讲了全册最完整的一个\"应验故事\"，须完整照录，因为它恰好展示了这类叙述的力量与弱点**：\"**'举个例子：我岳母高寿到九十大几，从七十多到九十多，发生过三次病危。不知道她八字是多少，就从我爱人的父母宫和兄弟宫断'。'临终前四天，因我爱人的姐姐回辽宁看望老母亲，在返回北京的路上给我打了一个电话——那时因为什么外因，我感觉不好，看了一下我爱人的命盘，分析后得知**老人还有三天多时间**'。'我叫我爱人的姐姐马上返回，**她反而将我骂了一顿**'。'而后叫我妻子乘火车从内蒙西部赶回辽宁（那时还没有高铁）'。'**我妻子回家看到老母正在与人聊天，并且和大家照了全家福照发给我——暗示我没有算对**'。'大家共同吃过午饭，**老人午睡后再也没有醒过来**'。'**她姐没有最后见到老人一面而后悔**'。**\" **须说明（三层）**：**①这个故事的结构极完整**：**①算出期限（三天多）→②家人不信（用\"全家福照片\"来证明他错）→③结果应验（午睡后未醒）→④留下遗憾（姐姐没见到最后一面）**；**②它的**情感力量**极强**（**\"全家福照片\"这个细节，是\"不信\"的物证**；**而\"午睡后再也没有醒过来\"，是\"应验\"的物证**）——**而正是这种力量，让读者愿意相信前面那套推法**；**③⚠ 而它的**弱点同样明显**：**编者自己说\"具体详情想不起来了\"**（**即：**细节不可复核**）；**而\"三天多\"这个期限，**事后无法验证**（**老人确实在第四天离世，但\"三天多\"是否精确，已无从检验**）。** **⚠ 须重点标**：**这类\"应验故事\"的通病是——**细节记不清，结论记得牢**（**而读者记住的，是那个\"算准了\"的结论**）。** **⚠ 另须标**：**\"不知道她八字，就从我爱人的父母宫和兄弟宫断\"是一种\"代断\"手法**（**即：用子女的盘推父母的生死**）——**而它使这套推法**完全无法被证伪**（**因为被推的人（岳母）从未提供过任何数据，事后也无从核对**）。","o":"TJ-0855 · 天纪·紫微详解·第五章紫微十二宫详解·第九例·编者按（PDF 第159页）"},{"t":"三百七十三、\"144 局\"：一个坐标系","h":"\"紫微 12 宫 × 命宫 12 宫\"","c":"方法——**编者随后提出了一个极有价值的方法论，须完整照录**：\"**'大家要学好紫微，一定要多多收集八字或命盘，**以坐标方式整理出来**'。'我将所有命盘放到《命理玄微》里，再找出有价值的命例，**组成 144 局——紫微 12 宫 × 命宫 12 宫**，而后重点分析'。'**在别人求测时，排出盘后，能快速找到相同的命例供参考**'。**\" **本集复算**：**12 × 12 ＝ 144** ✓（**与\"144 局\"吻合**）。** **须说明（三层）**：**①这是全册**最接近科学方法**的一段**：**它要做的不是\"解释个案\"，而是**建立全集**（**紫微所在的 12 个宫 × 命宫所在的 12 个宫，共 144 种组合**）；**②\"以坐标方式整理\"这一步，是**分类**；**\"快速找到相同的命例\"这一步，是**对照**——**而一旦真的按\"相同命例\"去对照，就会**当场发现\"同格不同命\"**（**如前条的五例样本、以及那个凶象全占却平安的样本**）；**③因此这一段的价值是**双重的**：**它既是这套体系最认真的自我组织**，**也是它自我瓦解的起点**（**因为\"同格不同命\"一旦被系统收集，格就失效了**）。** **⚠ 须标**：**\"144 局\"只覆盖了\"紫微宫位＋命宫宫位\"两个变量**（**而完整的盘还涉及月份、时辰、年干等**）——**故\"同局\"者远不止 144 种情况**（**而这也是\"同格不同命\"极容易出现的结构性原因**）。","o":"TJ-0856 · 天纪·紫微详解·第五章紫微十二宫详解·第九例·编者按（PDF 第160页）"},{"t":"三百七十四、\"伤使抓错了人\"","h":"一段必须最高级警告的\"替死\"叙述","c":"风险——**第十例（紫微在丑、命在未，1965 年 11 月 20 日，阴男）的流年段，出现了全书最黑暗的一段叙述**：**\"**'流年太岁与大疾同宫，见陀罗、铃星、天使＋绝地——**这是死局**'。'从病上看是陈年老肺病、痨病或肺癌，**九死一生**'。'**看有没有顶替之人或化解之物**'。'太阳是家中的男人，伤使鬼索命。34 岁在寅为太岁，辰宫为流年福德宫——福德宫是命主的祖父、祖母的宫位……祖父的大小限被化忌，冲对宫的太阳，**祖父挂掉了**'。'34 岁流年是 1998 年为戊寅，戊天机化忌在子位，老人大脑有问题；子位为男性泌尿系，太阳失光看到了红鸾，**因尿血而死**——**也是伤使抓错了人**'。**\" **⚠ 本集处置（三层）**：**①照录**（**因为它是\"这套逻辑能推到多远\"的极端例证**）；**②⚠ 明确——它的结构是：先断\"命主自己该死\"（\"死局\"\"九死一生\"），再解释\"为什么没死\"（\"因为你祖父替你死了\"）**（**\"伤使抓错了人\"四个字，说尽了这套说法的运作方式：**任何结果都能被解释**——**命主死了，是\"应验\"；命主没死，是\"替死\"**）。**③⚠ 而这类话对当事人的伤害是**终身的**：**它让人永远活在\"我祖父因我而死\"的愧疚里**（**而事实上，一位老人的离世，与其孙辈的\"命盘\"没有关系**）。** **⚠ 本集明确：**\"顶替之人\"这个概念尤其危险**——**它暗示\"可以找人替死\"，一旦被当真，可能引出违规甚至违法的举动**（**任何形式的\"替身\"\"代受\"操作，本集一概不采、不述**）。** **⚠ 须标**：**\"陈年老肺病、痨病或肺癌，九死一生\"是对**具体疾病的死亡预判**（**而肺病的病程与预后，取决于病种、分期与治疗，不能由\"宫位双煞\"决定**）。","o":"TJ-0857 · 天纪·紫微详解·第五章紫微十二宫详解·第十例·流年（PDF 第164页）"},{"t":"三百七十五、小限起宫的第四种说法","h":"\"巳酉丑，丑的对宫起小限\"","c":"方法——**第十例给出了小限起宫的**第四种说法**，而它可以复算**：\"**'看流年：乙巳出生，属相为蛇，**巳酉丑，丑的对宫起小限**——**未 1、13、25**，大限 25–35，25 岁在未'。'顺行 26 在申、27 酉、28 在戌（遇到红鸾星）'。**\" **本集复算（两处）**：**①起宫**——**属蛇（巳）入三合局\"巳酉丑\"，其\"丑\"的对宫为**未**，故 1 岁起**未** ✓（**\"未 1、13、25\"即每 12 年一轮** ✓）；**②顺行**——**25 未 → 26 申 → 27 酉 → 28 戌** ✓（**与原文逐步吻合**）。** **须说明**：**这是本集对\"小限起宫\"的第四条记录**（**前三条为：男\"一岁从未宫起顺转\"、女\"一岁从丑宫起逆转\"、第八例\"寅午戌，戌为墓，小限从此宫起\"**）；**其可用的核**：**\"三合局→墓位／对宫→起宫\"这套逻辑，在本例中可逐项验算** ✓；**⚠ 而须重点标**：**四条说法之间**并不完全一致**——**本例（阴男、属蛇）从\"未\"起、**顺行**；而前文说\"男从未起顺转\"**恰好也是未、也是顺行**（**方向与起宫都对上了**），**但\"为何男必从未\"这一层，讲义从未给过理由**（**而本例给出的理由是\"巳酉丑的对宫\"**，**两者解释不同、结果偶合**）。** **⚠ 另标**：**第八例（阴女、属鼠）说\"寅午戌，戌为墓\"**——**属鼠入\"申子辰\"而非\"寅午戌\"**，**该处与三合局不符**（**见前章已标**）。","o":"TJ-0858 · 天纪·紫微详解·第五章紫微十二宫详解·第十例·流年（PDF 第162~163页）"},{"t":"三百七十六、三句可用的判断","h":"\"不能乱批，否则害别人一辈子\"","c":"要点——**第十例有三处判断写得极准，须单独抄出**。**其一（职业伦理）**：\"**'所以我们算命要看清此人可能扮演的角色是什么，**不能乱批，否则害别人一辈子**'。**\" **其二（房位比喻）**：\"**'**客厅是客人象**——在哪个方位，代表哪个家庭成员像客人一样，常年在外，在家停留短暂'。'**厨房是肉在刀上之象**——在哪个方位，代表哪个家庭成员像肉在刀上一样，有血光……'**\" **其三（量化定义）**：\"**'如果此人一出生命宫落武曲、七杀，为早年离家；如果 14–25 岁为此阶段离家到异乡——**50 公里以外为异乡**'。**\" **须说明**：**这是讲义（含编者）对断命伦理、房位取象与\"异乡\"定义的表述**；**其可用的核**：**①\"不能乱批，否则害别人一辈子\"是全册最好的一句自我约束**（**它承认\"一句话可以毁掉一个人\"**）——**而这句话与前面那些\"风险极高\"\"死局\"的断言，恰好构成**内部矛盾**（**可核其文本张力**）；**②\"客厅是客人象、厨房是肉在刀上之象\"是一组**极精的比喻**（**它以\"家的功能\"反推\"人的处境\"**：**客厅里的人＝过客；厨房里的人＝被宰**）——**而比喻的严密，并不能使因果成立**；**③\"50 公里以外为异乡\"是本册少见的**可量化定义** ✓（**可核其具体，比\"远方\"\"外地\"这类模糊词严谨**）。","o":"TJ-0859 · 天纪·紫微详解·第五章紫微十二宫详解·第十例·官禄宫、阳宅（PDF 第165~166页）  ---"},{"t":"三百七十七、\"合八字\"与\"八字合\"是两回事","h":"一段极反直觉的翻转","c":"方法——**第十例关于婚姻的分析，给出全册最反直觉、也最有内容的一段，须完整照录**：\"**'**合八字与八字合，是两回事**'。'如果说\"两人合八字才能结婚\"，这是对合八字的错误理解——\"错一步，十年乃字\"'。'**合八字的解释：一、合八字；二、不合八字。有的\"合\"才能结婚，有的\"不合\"才可以结婚**'。**\" **而后是关键的一段**：\"**'我们看八字，一定要看**先天的立命**。如果有一个人先天命就是**一世夫妻**，那找个八字与他\"合\"的就可以结婚了；**如果一个人他的先天命为\"二婚命\"，我们要找一个八字与他\"不合\"的人结婚才对**'。**\" **须说明（三层）**：**①这一段把\"合八字\"从\"挑一个吉利的配偶\"翻转为\"**按先天命选择该合还是该不合**\"**（**即：合与不合，本身无吉凶，要看当事人的命\"需要\"哪一种**）；**②\"二婚命要配不合的八字\"这个逻辑，是一种**\"以结构对冲结构\"**的做法**（**它的思路清楚：**如果注定要破，就让它在\"不那么痛\"的地方破**）；**③⚠ 而须明确**：**\"一世夫妻\"\"二婚命\"这两个前提，本身就不可核**（**一个人的婚姻会不会走到最后，取决于两个人的相处、沟通与选择**）——**而把\"该合还是该不合\"建在一个不可核的前提上，整套做法就失去了可检验性**。** **⚠ 另须标**：**\"错一步，十年乃字\"一语出自《易·屯》爻辞（\"十年乃字\"）**（**讲义借它说\"一步错、要等十年\"**，**可核其用典**）。","o":"TJ-0860 · 天纪·紫微详解·第五章紫微十二宫详解·第十例·合八字（PDF 第166页）"},{"t":"三百七十八、\"画个符、念个咒……这是迷信\"","h":"一本命理书里反对迷信的一段","c":"要点——**同段之后，讲义给出了对\"化解\"最清楚的一次界定，也明确否定了\"法术式\"的做法，须完整照录**：\"**'所以命上八字婚姻没问题的，**我们不改他的运，让他按命走**；命上八字婚姻有问题的，我们才去改他的运'。'**所以算命只是一个工具——知道哪里有缺点，我们把他补上去就好了**'。'**我们化解不是去买个鱼缸、画个符、念个咒——这样做于事无补，他的八字还是没变，这是迷信，没有根据的**'。**\" **须说明（三层）**：**①\"算命只是一个工具\"这一句，是一个极克制的**定位****（**它把命理降格为\"诊断工具\"，而不是\"命运本身\"**）；**②\"不以改运为名、行法术之实\"这一条，是对**同类行业**的公开划线**（**\"买个鱼缸、画符念咒\"都被点名否定，且判为\"迷信、没有根据\"**）；**③⚠ 而须标**：**这段话与册内其他部分存在明显张力**——**同书大量使用\"改阳宅\"\"换房间\"\"脚朝某方位\"作为化解手段**（**而\"换房间\"与\"买个鱼缸\"，在方法论上并无本质差别**：**都是\"改动外部物件以求改命\"**）。** **⚠ 本集据此把这一段记为**\"自我限定\"**（**它有价值，但它没有贯彻到底**）。","o":"TJ-0861 · 天纪·紫微详解·第五章紫微十二宫详解·第十例·化解（PDF 第167页）"},{"t":"三百七十九、\"世上妈妈很怪\"","h":"一句极准的观察，与\"四种合\"","c":"要点——**同段有一句极精彩的日常观察，须单独抄出，因为它说的是一件人人都见过、却少有人说破的事**：\"**'譬如我们给他找个先天命宫入天同、天梁星的妻子，而此男的父母宫入天同、天梁星——就表示我们给此男找的妻子，会**像父母对儿子一样**地对待这位先生'。'**世上妈妈很怪——自己先生犯桃花要严管，自己儿子犯桃花，笑笑了事**'。**\" **而围绕这一层，讲义给了\"四种合\"**：\"**'所以有的夫妻是**父女合**，有的是**母子合**，有的是**兄弟合**，有的是**朋友合**'**。** **\"四种合\"的配置（本集整理）**：**①妻子命宫＝丈夫的父母宫→母子合**（**妻子待夫如母待子**）；**②妻子命宫为天同、天梁→亦近\"母子合\"**；**③妻子命宫为巨门、文昌→兄弟合**；**④妻子命宫为天机、天魁→朋友合**（**\"如果朋友合、阳宅不介入，他们老是像朋友一样相处，不结婚也不好\"**）。** **须说明**：**这是讲义对夫妻\"相处模式\"的一组分类**；**其可用的核**：**\"世上妈妈很怪\"这一句，是本册对**双重标准**最省笔墨的揭示**（**同一件事（犯桃花），对丈夫与对儿子，用了两套标准**）——**而这一层脱开命理完全成立**（**它说的是\"位置决定评判\"**）。** **⚠ 须重点标**：**\"把妻子待夫如母\"当作\"最喜欢看到的八字\"，是一种**不对等的婚姻期望**（**它要求一方无限包容另一方的过错**，**而\"丈夫在外面犯了错，妻子像对待儿子一样\"——这句话把成年人的责任，转成了被原谅的资格**）。","o":"TJ-0862 · 天纪·紫微详解·第五章紫微十二宫详解·第十例·四种合（PDF 第167页）"},{"t":"三百八十、\"失去了算命的意义\"","h":"一次对算命本身的批评","c":"要点——**这一段里，讲义罕见地批评了\"算命\"这个行当本身，须完整照录**：\"**'如果只有\"生离、死别\"两种选择的话，**生离比死别好**'。'**如果没有人间道和阳宅介入，只是算命，只能叫此男 43 岁后才结婚**——但这样当事人很难以做到，**就失去了算命的意义**'。'**这就是过去算命的缺失**'。**\" **须说明（三层）**：**①\"生离比死别好\"这一句，是一个**务实的取舍**（**它承认\"两个都不好\"，但选一个较轻的**）；**②\"只能叫他等到 43 岁\"这个批评极准**：**一个让人\"等二十年\"的建议，等于没有建议**（**而讲义自己点出了这一点：\"当事人很难以做到，就失去了算命的意义\"**）；**③\"这就是过去算命的缺失\"这一句，是**对行业的自省****（**它承认旧法\"只会说不能做\"，而现代要\"给出可做的动作\"**）——**⚠ 而须标**：**它给出的\"可做的动作\"，仍是\"娶二婚妻\"\"娶大七岁\"这类**用婚姻结构去对冲婚姻风险**的办法**（**而\"为了对冲命里的婚凶，所以去找一个离过婚的人\"，这对那位再婚女性是不公平的**）。","o":"TJ-0863 · 天纪·紫微详解·第五章紫微十二宫详解·第十例·化解（PDF 第166页）"},{"t":"三百八十一、\"翻脸比翻书快\"","h":"随卦的两副面孔","c":"要点——**随卦（泽雷随）的\"性格\"段出现了**两段彼此矛盾的描述**，须并录并标**。**第一段**：\"**上兑下震、兑为金、震为木，震为长子，被金所克——'长子有难，表示在事业难以发挥才能，常常感觉英雄无用武之地；情绪多变，外强内虚，难合作、难相处，最终人财两败'。'事业上如获得长辈或贵人的帮助，可获得成功'。**随卦即是随心所欲，随时可能翻脸——翻脸比翻书快，使人不易靠得太近**'。**\" **第二段**：\"**'泽雷随卦为秋天雷藏在沼泽里，大地寒凝，万物蛰伏。卦中是震下兑上，震代表动、兑代表愉悦；上刚下柔，随时之义，改故鼎新，众美俱至'。'泽雷随卦代表随和、吉祥之含义——凡事遂心，吉无不利'。**\" **⚠ 须说明（三层）**：**①同一卦、同一栏目里，出现了**\"难合作、难相处、人财两败\"与\"随和、吉祥、凡事遂心、吉无不利\"**两种判断**（**这不可能是同一套规则推导出的结果**）；**②而第一段里\"翻脸比翻书快，使人不易靠得太近\"这一句，**极精**——**它描写的不是\"脾气坏\"，而是\"不可预测\"**（**而\"不可预测\"才是让人不敢靠近的真正原因**）；**③⚠ 本集据此把\"两段并存\"标为**体例问题**（**它说明\"性格\"栏可能是由不同来源拼合而成**）——**而\"随卦\"这个名字本身就有\"随时、跟从\"两义（**\"随和\"取其一，\"随时翻脸\"取另一**），**两段各取一义，遂成对立**。","o":"TJ-0864 · 天纪·紫微详解·第四章卦象详解·泽雷随·性格（PDF 第168页）"},{"t":"三百八十二、\"女有同性恋之倾向\"","h":"一条必须最高级警告的断言","c":"风险——**随卦\"地脉道\"（三女儿主正东卧房）的第一条，是全册第二处把性取向读成\"局\"的产物，须照录并明确否定**：\"**泽雷随卦（三女儿主正东卧房，长女和儿女均未婚）：'常见之卦象——街上有女孩，**女扮男装**或**粗壮过一般女人**之小姐，即是此局之人'。**\" **三条（照录）**：**①\"**女有同性恋之倾向**，其心念一直认为自己是男人，且不屑一顾周围之男人，喜与女孩同出同入\"**；**②\"全心于事业，为达目的不择手段，有时位高且居天子或董事长之身侧\"**；**③\"如同时生人，命中婚姻吉祥，再加此局，势必嫁入富贵人家，且比同时生人早婚四年；**如对方不富有，终必散**\"**。** **⚠ 本集处置（三层）**：**①先复算卦名（算法本身是对的）**：**泽雷随＝兑上震下；\"三女儿\"＝兑（少女），\"正东\"＝震（东方）**——**少女居东位＝兑上震下＝泽雷随** ✓；**②⚠ 但必须明确——**\"女扮男装\"\"粗壮\"与\"同性恋\"之间没有因果关系**：**一个人的性别表达（穿什么、怎么打扮、举止如何）与其性取向，是**两件独立的事**（**世界上有大量\"中性打扮\"的异性恋者，也有大量\"传统打扮\"的同性恋者**）；**③⚠ 而这一段最严重的问题在**把性取向当成\"局\"造成的\"倾向\"**（**\"其心念一直认为自己是男人\"这一句，更是把\"性别认同\"简化成了\"心念\"**）——**本集明确：性别认同与性取向都不是\"住哪一屋\"决定的，也都不是\"凶\"**。** **⚠ 另须标**：**\"为达目的不择手段，有时位高且居天子或董事长之身侧\"这一条，把\"在权力身边做事\"读成\"不择手段\"**（**而\"居董事长身侧\"这个意象，本身带着对女性职场位置的贬抑**）。","o":"TJ-0865 · 天纪·紫微详解·第四章卦象详解·泽雷随·地脉道（PDF 第168页）"},{"t":"三百八十三、\"西北角为厨房死夫\"","h":"一张\"房位—后果\"表，与一条最伤人的断言","c":"风险——**第十例的阳宅段，把\"房位\"与\"家人的生死\"一一对应，须照录并警告**：\"**'**西北角为厨房——死夫；西南角为厨房——死妻**'。'**客厅主生离**——如果东宫为客厅，\"夫妻未生子之前住此房，生不到儿子\"；\"如果已经生了儿子才住进去，儿子很少回家，像客人一样在家很少\"。'如果西北角为客厅，为**丈夫把家当旅馆**（如先生当船员、当飞行员、当兵、警察等两地生活）'。'**如果为厨房，主的是死别**'。**\" **而后是最重的一句**：\"**'比如太阴星化忌在子女宫，主无子；如果男命中无子、妻命中有子——**子像妈妈，如果像爸爸主夭折，像妈妈的不会**'。'如果正东位为厨房成格，改阳宅和中医介入可解之——立东宫、用中药'。**\" **⚠ 本集处置（三层）**：**①照录**；**②⚠ 明确——\"西北角厨房死夫、西南角厨房死妻\"没有任何依据**：**家人的疾病与死亡，取决于其自身的健康状况、年龄与医疗条件**（**而\"厨房在哪个角\"与任何人的生死无关**）；**③⚠ 而\"孩子像爸爸主夭折、像妈妈不会\"这一条，是全册对**父亲**最伤人的一句**——**它让一个父亲看着自己的孩子说\"这孩子长得像我\"，就想到\"会不会夭折\"**（**而真实的风险，来自遗传病筛查、产检与儿科随访，不来自\"像谁\"**）。** **⚠ 须重点标**：**这一整张表的结构，与前面\"缺角致祸\"是同一类**（**都把家人的病与死，归到一个可改动的家居细节上**）——**而它的代价是**双重**的：**家人病了，先想\"是不是我住错了\"，而不是\"该去查什么\"**。","o":"TJ-0866 · 天纪·紫微详解·第五章紫微十二宫详解·第十例·阳宅（PDF 第165~166页）"},{"t":"三百八十四、随卦的\"认局\"与\"没有担当\"","h":"\"遇事避开，没有担当\"","c":"要点——**随卦的取象与\"先天\"栏，有一处\"认局\"标识和一句极准的画像，须照录**。**其一（认局）**：\"**'街上有女孩，女扮男装或粗壮过一般女人之小姐，即是此局之人'**\"（**这是全册\"如何在街上认出某种局\"的少数几处之一**）。**其二（画像）**：\"**'云中雁来向南行。顺性、顺命，人随和'。'身在豪门，不重利'。**遇事避开，没有担当**'。'男女同数（兄弟姐妹二男二女，或三男三女等等），六亲先聚后散（兄弟姐妹各奔东西）'。'男得良妻，女得贵夫'。'测字：八牛人大吉（朱）'。**\" **须说明（两层）**：**①\"身在豪门、不重利、遇事避开、没有担当\"这四句，是一个**极完整的人格速写**（**它把\"随和\"与\"不担当\"连成一体**：**因为什么都不争，所以什么都不担**）；**②\"测字：八牛人大吉（朱）\"是一次拆字**（**\"朱\"字可拆作\"八\"＋\"牛\"？**——**而\"朱\"的字形为\"丿＋未\"，与\"八牛\"的拆法存疑**，**本集照录原文，标其待核**）；**⚠ 另标**：**\"六亲先聚后散\"与\"男得良妻、女得贵夫\"并置，说明这一栏是**吉凶混列****（**而非单一判断**）。","o":"TJ-0867 · 天纪·紫微详解·第四章卦象详解·泽雷随·先天（PDF 第168页）  ---"},{"t":"三百八十五、符号第十六次验证：随、蛊二卦","h":"两个完全不同的符号串，又一次都对上","c":"数据——**本轮新增两个卦的文王金钱课符号，并借此把\"符号约定\"彻底核准**。**随卦**：\"**泽雷随卦：×○○××○（推车靠崖）下吉**\"；**蛊卦**：\"**山风蛊卦：○××○○×（推磨岔道）中下**\"。**复核（本集逐步计算，全部可验）**：**①先定符号约定——\"○\"为阳爻、\"×\"为阴爻**；**②读向为**自右向左**（最右一位为初爻、最左一位为上爻）**；**③随卦**：符号 ×○○××○ 自右向左读＝○（阳）、×（阴）、×（阴）、○（阳）、○（阳）、×（阴）→**阳、阴、阴、阳、阳、阴**；**而泽雷随＝兑上震下，兑（阳、阳、阴）在上、震（阳、阴、阴）在下，六爻自下而上正为**阳、阴、阴、阳、阳、阴**——**完全吻合** ✓（**并与爻题初九、六二、六三、九四、九五、上六逐字对上**）；**④蛊卦**：符号 ○××○○× 自右向左读＝×（阴）、○（阳）、○（阳）、×（阴）、×（阴）、○（阳）→**阴、阳、阳、阴、阴、阳**；**而山风蛊＝艮上巽下，艮（阴、阴、阳）在上、巽（阴、阳、阳）在下，六爻自下而上正为**阴、阳、阳、阴、阴、阳**——**完全吻合** ✓（**与爻题初六、九二、九三、六四、六五、上九逐字对上**）。**须说明（三层）**：**①至此，\"自右向左\"已积累**十六次独立验证**（屯、蒙、需、讼、师、比、小畜、履、泰、否、同人、大有、谦、豫、随、蛊），**且无一反例**；**②而随卦\"×○○××○\"与蛊卦\"○××○○×\"是两个**几乎对称却不相同**的符号串**（**一个开头是 ×、一个开头是 ○**，**而两卦的吉凶断语也不同——\"下吉\"与\"中下\"**）——**它们各自都能对上自己的卦体，说明这不是\"套用一张表\"，而是逐卦算出来的**；**③⚠ 本集须同时收回一处此前的误记**：**早前把符号记作\"×＝阳、○＝阴\"是错的**（**按该约定去读，屯卦、随卦都会对不上**）——**正确约定为\"○＝阳、×＝阴\"**，**本集已据此重核全部十六卦，结论不变：自右向左读、○阳×阴**。","o":"TJ-0868 · 天纪·紫微详解·第四章卦象详解·泽雷随·文王金钱课（PDF 第169页）；山风蛊·文王金钱课（PDF 第171页）"},{"t":"三百八十六、\"风被山阻挡而不能流通，静止不动，滋生腐败\"","h":"全册对\"蛊\"字最好的一次解释","c":"定义——**蛊卦的\"性格\"第二段，把\"蛊\"这个字讲透了，是全册少见的**由物象推字义**的写法，须完整照录**：\"**'山风蛊卦是山下有风——风遇山而回，万物惑乱'。'山下有风，风被山阻挡而**不能流通**，**静止不动，滋生腐败**'。'此时需要**大刀阔斧，惩弊治乱，拨乱反正，政治革新**，永保太平'。'婚姻难成，求官二次方遂'。**\" **须说明（三层）**：**①\"风不流通→静止→腐败\"这条链，是极准的**机制描述****（**它把\"蛊\"从\"毒虫\"这个字形义，转成了\"停滞生腐\"这个过程义**）；**②而\"惩弊治乱、拨乱反正\"这一步，正是\"治蛊\"**（**它给出的不是\"驱邪\"，而是\"疏通\"**）；**③⚠ 但\"婚姻难成、求官二次方遂\"这类断语，仍是无据的吉凶判断**（**而它们与上面那条清楚的机制链，被并列在同一段里**——**读者很容易把\"有道理的半句\"与\"没依据的半句\"一起接受**）。** **本条可单独取用的一句**：**\"风被山阻挡而不能流通，静止不动，滋生腐败\"**（**它离开卦象独立成立**：**任何系统，只要信息与人不流动，就会内生腐败**）。","o":"TJ-0869 · 天纪·紫微详解·第四章卦象详解·山风蛊·性格（PDF 第170页）"},{"t":"三百八十七、\"阴一套、阳一套，心中设防、表面大度\"","h":"一个极准的人格画像","c":"要点——**蛊卦\"性格\"第一段，给了一组极精炼的画像，须照录**：\"**'上艮下巽，属于木克土；艮为三子、巽为长女，三子被克，主不利于小口，又为**刑夫克子之象**'。'个性有耐性、**无奋斗开创之心**、处事懦弱、忧虑不断，缺少助力、运势萎靡，多有痛苦'。**'蛊卦、蛊惑、嘀咕——**阴一套、阳一套**，**心中设防、表面大度，背后嘀咕，自寻烦恼**'。'健康方面多主风疾、脾胃之疾病，家丁不旺、缺少子嗣'。**\" **须说明（三层）**：**①\"心中设防、表面大度、背后嘀咕\"这十二个字，是一个**极完整的行为三联**（**防（心里）→笑（脸上）→嘀咕（背后）**）——**而\"自寻烦恼\"是它的代价**；**②\"有耐性、无奋斗开创之心\"这一对，抓住了\"耐性\"的**另一面****（**能忍，往往也意味着不动**）；**③⚠ 须标**：**\"刑夫克子之象\"\"家丁不旺、缺少子嗣\"是对具体家庭结果的断语**（**婚姻与生育的结局，不由\"少男住东南或西南\"决定**）——**而\"刑夫克子\"这四个字对一位女性读者的压力极大**（**它把\"命硬\"的标签贴在了人身上**）。","o":"TJ-0870 · 天纪·紫微详解·第四章卦象详解·山风蛊·性格（PDF 第170页）"},{"t":"三百八十八、\"女人之蛊，吾人可以立见\"","h":"一处极精的区分，与它背后的成见","c":"要点——**蛊卦\"地脉道\"开头有一段极精彩的辨析，须完整照录**：\"**'三虫聚一盘中，互相蛊食，此成蛊象'。'常见几位女性同居一桌，**东家长西家短**的议论他人——**此虽生是非之地，但并非成蛊卦**'。'**此卦在阳宅上惟见之于男人**，此又男女之不同——'**'女人之蛊，吾人可以立见；男人之蛊在心中，表面上不易看到**'。**\" **三条（照录）**：**①\"此局男人图利野心至大，为达目的，往往不择手段\"**；**②\"主发科甲，读书考试成绩必超人一等\"**；**③\"有早婚之象，比同时生人提前四年婚，且**二位兄长尚未娶妻，自己先娶**\"**。** **须说明（三层）**：**①这段最好的地方，是它**先排除了一种误认****（**\"几位女性聚在一起议论他人\"看起来像\"三虫聚一盆\"，但讲义说\"**并非成蛊卦**\"**）——**这是一次难得的自我约束：不把\"看起来像\"当作\"就是\"**；**②\"女人之蛊可以立见、男人之蛊在心中\"这一句，是极精的**观察**（**它区分了\"明处的恶意\"与\"暗处的恶意\"，且指出后者更难防**）；**③⚠ 但它同时把\"议论他人\"指派给了女性**（**\"东家长西家短\"这个说法，是一个性别化的成见**——**同类行为在男性身上通常只被读成\"消息灵通\"**）。** **⚠ 另须标**：**\"二位兄长尚未娶妻，自己先娶\"这一条，是\"早婚\"的一个**可核的判据****（**它把\"早婚\"落到了一件能在家里观察到的事实上**，**这也说明这套方法的\"应验\"，常常依赖**事后可观察的家事**）。","o":"TJ-0871 · 天纪·紫微详解·第四章卦象详解·山风蛊·地脉道（PDF 第170页）"},{"t":"三百八十九、\"人貌不同，善知人意，大人状。主夭折\"","h":"一条必须最高级警告的断言，与它自带的那道\"解\"","c":"风险——**蛊卦\"先天\"栏里，又一次出现\"孩子像大人即主夭折\"，而这一次它后面紧跟了一句\"可过\"，须完整照录**：\"**'五才大限（五岁有大限）。女孩子，更凶难防'。'须有天官（去找算命的高手！）人貌不同，善知人意，**大人状。主夭折**'。'**积善之家必有余庆，可过**；积不善之家必有余殃！'。'祖业有积。**机深必败！（不要心机太深，城府太深）**'。'早有功名。早有婚'。**\" **⚠ 本集处置（三层）**：**①照录**（**这是\"小儿像大人主夭折\"在全册的第二次出现**）；**②⚠ 明确——\"大人状\"没有任何病理学意义**：**一个孩子\"行为老成、懂事早\"，可能来自性格、家庭教育或成长环境**（**而\"懂事早\"有时确实提示孩子在承担过重的情绪负担，但这与\"夭折\"无关**，**也与\"要不要去看儿科\"无关**）；**③⚠ 而\"积善之家必有余庆，可过\"这一句，是这套说法里的一道**\"解\"****（**它的作用是：若孩子平安长大，则归功于\"积善\"；若出了事，则归咎于\"积不善\"**）——**这正是**不可证伪**的结构**（**任何结果都能被它解释**）。** **⚠ 另一句须单独标出，因为它极准**：**\"机深必败！（不要心机太深，城府太深）\"**——**这一句离开命理完全成立**（**城府越深，越难有人愿意与之共事，久之必败**）。","o":"TJ-0872 · 天纪·紫微详解·第四章卦象详解·山风蛊·先天（PDF 第170页）"},{"t":"三百九十、\"少男居西南角\"与\"艮上巽下\"不符","h":"一处可核的内部矛盾","c":"数据——**蛊卦\"地脉道\"作\"**山风蛊卦（少男居西南角）**\"，而这一配置与卦名本身对不上，须逐项核算并标为内部矛盾**。**核算（三步）**：**①山风蛊＝**艮上巽下****（**上卦艮、下卦巽**）；**②艮为**少男**（三子）、巽为**长女**——这一层讲义自己也说了（\"艮为三子、巽为长女\"）✓；**③而\"位\"的取法，按同书前文规则：**上卦取\"住的人\"、下卦取\"住的位\"****（**如\"父住正西＝天泽履\"：父＝乾为上卦、正西＝兑为下卦**）——**故\"少男居某位＝山风蛊\"要求下卦为**巽****，**而**巽位为东南****（**后天八卦：巽＝东南、坤＝西南**）；**④故正确表述应为\"**少男居东南角**\"；**\"少男居**西南**角\"应为**艮上坤下＝山地剥**，**而不是山风蛊**。** **须说明（三层）**：**①这是本册第一处**可以完全算清**的卦名与方位错配**（**它不需要任何命理知识，只需\"艮＝少男、巽＝东南、坤＝西南\"三条**）；**②它说明这套体系在**口诀流传与抄录**中会出现错位**（**而错位一旦发生，\"住哪个角出哪个卦\"的整套推论就断了一环**）；**③⚠ 本集保留原文并标错**（**因为读者若照\"西南角\"去摆，按同书自己的规则会得到另一个卦**）——**而这也正是\"必须每处复算\"的理由：错字与错卦，肉眼分不出来**。","o":"TJ-0873 · 天纪·紫微详解·第四章卦象详解·山风蛊·地脉道（PDF 第170页）"},{"t":"三百九十一、\"推车靠崖\"与\"推磨岔道\"","h":"两个极好的象：一个差最后一把力，一个原地转圈","c":"要点——**随、蛊两卦的文王金钱课各给了一个极形象的比喻，须并录**。**随卦（\"推车靠崖\"，下吉）**：\"**'泥中步踏这几年，**推车靠崖在眼前**，**目下就该再使力，爬上崖去**发财源'。'推车靠崖道路干，谋望求财不费难，婚姻出行无阻碍，疾病口舌得宁安'。'**苦极生荣**，喜气盈盈，一切做事，大不离形'。**\" **蛊卦（\"推磨岔道\"，中下）**：\"**'卦中爻相如**推磨**——**顺当为福反为祸**，心中有益且迟迟，**凡事尽从忙里错**'。'推磨岔道运不济，疾病口舌犯忧虑，婚姻和课心改变，谋望求财不作实'。'出行无益，行人未回，走失难见，**诸事莫为**'。**\" **须说明（三层）**：**①\"推车靠崖\"这个象极好——它描写的不是\"走不动\"，而是**\"只剩最后一段\"****（**\"目下就该再使力\"是这条签唯一的行动指令，而它是对的：上坡最后一段最需要发力**）；**②\"推磨岔道\"这个象更好——它描写的是**\"用力却在原地\"****（**\"顺当为福反为祸\"一句尤其锋利：**顺着惯性走下去，反而会出事**）；**③\"凡事尽从忙里错\"是全册最实用的一句**（**它把\"错\"的原因定在\"忙\"，而不是\"命\"**）——**而\"诸事莫为\"是它的反面建议：此刻什么都不做，比乱做要好**。** **⚠ 须标**：**这两条签的\"吉凶等级\"（下吉、中下）与其正文**并不完全对齐****（**\"推车靠崖\"通篇是\"就快成功\"，却只判\"下吉\"**；**\"苦极生荣\"更像中上之词**）——**说明这套签的分类与文字，可能各有来源**。","o":"TJ-0874 · 天纪·紫微详解·第四章卦象详解·泽雷随·文王金钱课（PDF 第169页）；山风蛊·文王金钱课（PDF 第171页）"},{"t":"三百九十二、\"机深必败\"与\"机多必败\"","h":"两种\"心机\"，两种败法","c":"要点——**蛊卦\"先天\"与\"后天\"两栏，各给了一句极近而不同的判语，须并置，因为它们说的不是一回事**：\"**先天**：'**机深必败**！（不要**心机太深、城府太深**）'；**后天**：'金榜题名自由人。不求名利，名利自来。财禄兴旺，无官带。男女合有利。**机多必败**（**舌尖，喜欢造谣生事**！）'；**流年**：'科甲高中婚事有成。从商合伙吉。**但须防，人言生害**！（**谣言会坏事**！）'。**\" **须说明（三层）**：**①\"机深\"与\"机多\"是两个不同的毛病——\"机深\"是**藏得深**（**城府**），\"机多\"是**露得多**（**话多、主意多、爱传话**）**；**②而两者的败法也不同**：\"**机深必败**\"是**没人敢与你共事**，\"**机多必败**\"是**话把你害了**（**讲义自己注明\"舌尖，喜欢造谣生事\"**）；**③三句合起来，其实是一套极实用的告诫**：**别把心思藏太深，也别把嘴放太开**（**而\"人言生害\"这一条，在\"从商合伙吉\"之后紧接着出现，是极准的风险提示**）。** **⚠ 须标**：**\"舌尖，喜欢造谣生事\"这一注，把\"机多\"具体化为\"造谣\"**（**而\"流年须防人言生害\"则是同一件事的被动面**：**你可能是造谣的人，也可能是被造谣的人**）——**两栏一正一反，恰好把\"口舌\"的两头都写全了**。","o":"TJ-0875 · 天纪·紫微详解·第四章卦象详解·山风蛊·先天／后天／流年（PDF 第170页）  ---"},{"t":"三百九十三、第十七次验证：母居正西＝地泽临","h":"同一个\"正西\"，父住与母住，卦名不同","c":"数据——**临卦给了一次极干净的\"变卦\"复算机会，而它与前面的\"父住正西＝天泽履\"恰好构成一对**。**原文**：\"**地泽临卦：（**母居正西卧室**）**\"；**文王金钱课**：\"**地泽临卦：××××○○（发政施仁）上平**\"。**复核（两步，全部可验）**：**①卦名——地泽临＝**坤上兑下****（**上卦坤、下卦兑**）；**按同书规则\"上卦取住的人、下卦取住的位\"**：**母＝**坤**（上卦）、**正西**＝**兑**（下卦）→ **坤上兑下＝地泽临 ✓**；**②符号——××××○○ 自右向左读（○阳×阴）＝○（阳）、○（阳）、×（阴）、×（阴）、×（阴）、×（阴）→ **阳、阳、阴、阴、阴、阴**；**而坤（阴、阴、阴）在上、兑（阳、阳、阴）在下，六爻自下而上正为**阳、阳、阴、阴、阴、阴**——**完全吻合 ✓（与爻题初九、九二、六三、六四、六五、上六逐字对上**）。**须说明（三层）**：**①至此\"自右向左\"已**十七次验证**（增临卦），**无一反例**；**②而这里有一个极漂亮的对照**：**同样是\"住正西\"，\"**父住正西＝天泽履**\"（乾上兑下）、\"**母住正西＝地泽临**\"（坤上兑下）**——**上卦随\"住的人\"变（父则乾、母则坤），下卦随\"住的位\"不变（正西恒为兑）**；**③这恰好把\"变卦＝人＋位\"这条规则**验得干干净净****（**一个变量换人、一个变量换位，卦名就跟着换**）。** **⚠ 而讲义自己也点出了这一层**：\"**'已婚妇人居此，由于夫宫必无力'**，**'请参考履卦'**\"（**\"参考履卦\"即\"同一个少女位，父住有父的问题、母住有母的问题\"，**这是一次**跨卦的交叉引用**）。","o":"TJ-0876 · 天纪·紫微详解·第四章卦象详解·地泽临·地脉道／文王金钱课（PDF 第172~173页）"},{"t":"三百九十四、\"乃因母亲无安全感，全心寄托在子女身上\"","h":"全册最好的一段家庭心理描述","c":"要点——**临卦\"地脉道\"的第三条，是一段**完全脱开命理也成立**的心理描述，须完整照录**：\"**'三、子女逢母如此——**任何事皆有母来做主**，以致母过烦忧，**发展权限过大**，终致**子女反弹，背逆其意行事**'。'其招致如此，**乃因母亲无安全感，全心寄托在子女身上**，而成此特殊之心理状况'。'**其结果大家痛苦，而无法解决**'。**\" **须说明（三层）**：**①这一条抓住了\"控制\"的**因果链****（**无安全感 → 事必亲临 → 权限过大 → 子女反弹 → 更加不安 → 控制更紧**）——**而\"任何事皆有母来做主\"是这条链的起点**；**②最精的是\"**乃因母亲无安全感**\"这一句**（**它没有把母亲写成\"恶人\"，而是写成了一个**害怕的人****）——**这也解释了她为什么停不下来**；**③\"**其结果大家痛苦，而无法解决**\"是全册最诚实的一句**（**它没有给出\"改阳宅就好\"的承诺，只说\"无法解决\"**）。** **本集按语**：**这一段的价值**不在命理**，而在它把一种极常见的家庭关系说清了**——**一个\"什么都要管\"的母亲，通常不是强势，而是不安**（**而这份不安，又常常是她自己被对待的方式传下来的**）。** **⚠ 若读者正是被这样对待的人**：**当\"反弹\"发生时，不必先争对错**——**\"**搬出去住一段时间**\"或\"**把某几件事交出去**\"这类具体动作，往往比讲道理有效**；**若长期处于被全面掌控、且情绪已明显受损的状态，可拨打**12338**（妇女维权）或**12356**（心理援助）**。** **⚠ 同理，若读者自认是\"什么都要管\"的那一位**：**这通常**不是性格问题，而是焦虑问题****——**而焦虑是可以被处理的**（**先从\"每天留一件不插手的事\"开始，比要求自己\"想开\"更可行**）。","o":"TJ-0877 · 天纪·紫微详解·第四章卦象详解·地泽临·地脉道（PDF 第172页）"},{"t":"三百九十五、\"临卦为凤入鸡群之卦\"","h":"一个极好的象，与一句极特殊的卦辞","c":"要点——**临卦的\"人间道\"栏给了一个极形象的定位，而它的卦辞里有一句在全册六十四卦中极罕见的话，须并录**。**其一（定位）**：\"**'临卦为**凤入鸡群**之卦，**以上临下**之象'**\"。**其二（图像）**：\"**'人在山顶，主有危道——说明要以**高尚的人格**号召他人'。'虎在山下坐，可防危险——虎为寅，代表东方震卦，说明**威严可以维持纪律**'。'一盒，主和合，利于婚姻。人射弓，为**贵人牵引**之象'**\"。**其三（卦辞，极特殊）**：\"**'临：元，亨，利，贞。**至于八月有凶**'。'象曰：泽上有地，临；君子以**教思无穷，容保民无疆**'**\"。**须说明（三层）**：**①\"**凤入鸡群**\"这个象极好**（**它把\"以上临下\"写成一幅画面：一群普通的鸡里，来了一只凤**）——**而它的难点也在这里：凤入鸡群，是\"被仰望\"还是\"被啄\"，取决于凤自己**；**②\"**至于八月有凶**\"是六十四卦卦辞里**极少见的\"指月断凶\"****（**它不说\"某爻凶\"，而说\"到了八月要出事\"**）——**本集按语：这一句最合理的读法，是\"**盛极必衰、日中则昃**\"**（**临卦是\"以上临下\"之势，势到了顶，就该回落**）；**③而\"**教思无穷，容保民无疆**\"这八个字，是全册**最好的一句\"上位者守则\"****（**\"教\"要有穷尽之心，\"容\"要无边界**）——**它离开卦象完全成立**。** **⚠ 须标**：**\"虎为寅、代表东方震卦\"这一句，混了两套系统**（**寅属十二地支、震属八卦，两者在后天方位上都指东方，但不能等同**）——**讲义把它们并置成一个\"虎＝东方＝震\"的等式，这在体系上不严**。","o":"TJ-0878 · 天纪·紫微详解·第四章卦象详解·地泽临·人间道（PDF 第172页）"},{"t":"三百九十六、\"克子伤女之象\"与\"对母亲不利\"","h":"两条须警告的家庭断语","c":"风险——**临、观两卦的\"性格\"栏，各有一条对家庭成员的负面断语，须照录并警告**。**临卦**：\"**'上坤下兑，土上金下，土金相生，**为纯阴之象**，主**女性当家、克子伤女之象**，为**旺财不旺丁，人丁稀少**'**\"。**观卦**：\"**'上巽下坤，为木克土，**坤为母，对母亲不利**，属**丁财两败**'**\"。**⚠ 本集处置（三层）**：**①照录**；**②⚠ 明确——\"克子伤女\"\"对母亲不利\"没有任何依据**：**\"克\"这个字在传统术数里指\"五行相制\"，而它被挪用到\"人\"身上之后，就变成了一张**贴在亲人身上的判决书****（**一个母亲若读到\"我住的这间屋子克我的孩子\"，她此后的每一次孩子生病，都会先怪自己**）；**③⚠ 而\"人丁稀少\"\"丁财两败\"这类断语，与**生育能力、家庭经济**没有因果关系**（**生育取决于双方的身体条件与年龄，经济取决于收入与支出结构**）。** **⚠ 须同时标出这两条里**可用**的部分**：**临卦\"个性谦和、心胸开阔、有才能，但**缺乏持久性**，**这山望着那山高**，没有定性，没有责任感'**——**这一段是全册少见地把\"优点\"与\"缺点\"写在一处的写法**（**\"有才能但坐不住\"是一个极常见、也极准确的组合**）；**而它后面那句\"**适合从事设计师工作**\"**，是全册**唯一一处给出具体职业方向**的判断**（**而\"设计师\"确实需要\"有才气＋能不断换题\"**，**这一条与前面的性格描述是自洽的**）。","o":"TJ-0879 · 天纪·紫微详解·第四章卦象详解·地泽临·性格（PDF 第172页）；风地观·性格（PDF 第174页）"},{"t":"三百九十七、\"宁做有钱人的偏房\"","h":"一条必须最高级警告、不能照录即采的主张","c":"风险——**观卦\"地脉道\"的第一条，是全册价值观上最需要警惕的一段，须照录并**最高级警告****：\"**'一、**以财富论定婚嫁**——**宁做有钱人的偏房，不婚，也不嫁无钱未婚男**'。'二、如逢命格婚姻有凶，则有**嫁二婚夫，且对方有子之人**，但须比同时生人再加六年方成正式婚姻'。'三、未婚前，女儿代母职，掌理一家大小之事——**有姊如母**，即此局之人'。'四、如遇僧道之命，则主**终身不嫁**'。**\" **⚠ 本集处置（三层）**：**①照录（因为它是\"这套体系能推出什么\"的极端样本，删掉反而失真）**；**②⚠ 明确否定——\"宁做有钱人的偏房\"这句话，把婚姻整个地降格为**阶层上升的工具****（**它不讨论感情、不讨论尊重、不讨论两个人是否合得来，只讨论\"对方有没有钱\"**）——**而\"偏房\"在历史上是一种**不平等的制度****（**它意味着名分、财产与人身关系的全面不对等**），**把它写成\"宁做\"的选择，是对当事人尊严的损害**；**③⚠ 而同条把\"钱\"设成**唯一标准****（**\"不嫁无钱未婚男\"——这一句在逻辑上等于\"未婚且无钱者一概不取\"**）**，**这已经不是\"择偶偏好\"，而是\"以财取人\"**。** **⚠ 须补一层**：**\"有姊如母\"这个观察（**未婚的女儿替母亲管家**）本身是**准确且动人**的**（**它写出了长女在家庭里的实际处境**）——**但讲义把它当成\"此局之人\"的标记**（**把一个真实的家庭负担，读成了一张命盘的特征**）。** **⚠ 本集态度**：**婚姻的取舍，第一位应是**两个人是否平等、是否愿意共同承担**；**把\"有钱\"设为唯一门槛，通常换来的是**长期的不对等关系**（**而这类关系里的伤害，往往要到多年后才显形**）。","o":"TJ-0880 · 天纪·紫微详解·第四章卦象详解·风地观·地脉道（PDF 第174页）"},{"t":"三百九十八、\"成就感高，快乐指数低\"","h":"八个字，一副极准的画像","c":"要点——**观卦\"性格\"第一段，用极少的字写出了一种极常见的人，须照录**：\"**'性格主感情丰富、待人谦和、为人诚实。得贵人相助、晚年安稳'。'遇事**争强好胜**，能够**高瞻远瞩**，善于**总揽全局**，**察言观色**'。'**人心累，喜欢操心，不知疲倦**'。'**成就感高，快乐指数低**'。**\" **须说明（三层）**：**①\"**成就感高，快乐指数低**\"这八个字，是**全册最精的一句人格判断****（**它抓住了一个悖论：一个人越能从\"完成\"里获得满足，就越会不停给自己派活**）——**而\"快乐\"因此被无限延期**；**②\"**人心累，喜欢操心，不知疲倦**\"是它的机制**（**\"不知疲倦\"不是真的不累，而是**停不下来****）；**③⚠ 而须标**：**这一段与后一段\"**春风浩荡、风调雨顺、万物滋生、国运兴昌**\"的吉断并列**（**一边是\"快乐指数低\"，一边是\"吉无不利\"**）——**两者的\"吉\"不在同一个层面：前者说\"人\"，后者说\"事\"**。** **本集按语**：**\"成就感高、快乐指数低\"这一组合，在现实中常出现在**特别可靠的人**身上**（**而他们往往也是最先被耗空的人**）——**若读者认出了自己，一件可做的事是**：**每周留出半天，只做\"没用\"的事**（**它的作用不是\"放松\"，而是提醒自己\"不产出也可以\"**）。","o":"TJ-0881 · 天纪·紫微详解·第四章卦象详解·风地观·性格（PDF 第174页）"},{"t":"三百九十九、\"防长弓\"与\"逢张生害\"","h":"一次难得的内部一致：拆字与正文对上了","c":"数据——**临卦的\"先天\"与\"后天\"两栏，把同一件事用两种写法说了两遍，而它们**互相对得上**，须并录**。**先天**：\"**'乔木有凤来仪。阴多，阳二。生在武官家主大贵。陈、连、单使发肖虎人'。'**防长弓**——**长弓之人暗渡陈仓！先成后破！**'**\"。**后天**：\"**'武将受困。**逢张生害**'。'**去武从商反为富人**，遇美人（美国人也算）。再任可出快，车行千里'。'**防张生害，遇张，人至北千里**'**\"。**流年**：\"**'婚事须防虎生暗害。武官外调。出使他国。强进生是非（**等待吉**）官司招人陷'**\"。**复核（一步，可验）**：**\"**长弓**\"即\"**张**\"字的拆解**——**张＝弓＋长 ✓**；**故\"防长弓\"＝\"防姓张的人\"，与后天的\"逢张生害\"\"遇张，人至北千里\"**完全同指** ✓。**须说明（三层）**：**①这是本册**少见的\"拆字与正文互相印证\"****（**大部分拆字都是孤例，无法自证**；**而这一组\"长弓→张\"，前后两栏都对上了**）；**②而\"**先成后破**\"这四个字，是极精的判语**（**它说的不是\"会失败\"，而是\"**成了之后才破**\"**——**这类失败最难防，因为它发生在你最放松的时候**）；**③\"**去武从商反为富人**\"是一条极具体的转向建议**（**它把\"武将受困\"给出了一个出路**）——**而这一条的可核之处在于：**它是可执行的（换一个行当），不是\"等\"**。** **⚠ 须标**：**\"遇美人（美国人也算）\"这一句，把\"美人\"与\"美国人\"并置成一个谐音的玩笑**（**它说明这一栏的文字带有**口语讲课的痕迹****）——**而\"人至北千里\"这类方位断语，仍是不可核的**。","o":"TJ-0882 · 天纪·紫微详解·第四章卦象详解·地泽临·先天／后天／流年（PDF 第172页）"},{"t":"四百、\"此卦唯长女可见，婚后局消\"","h":"一个\"局会消失\"的说法","c":"要点——**观卦\"地脉道\"开头，给出了本册一个罕见的**\"局会自行消解\"的条件****，须完整照录**：\"**风地观卦：（**长女居西南角**）：'**观卦之精义在以静观可以洞悉周围之事**——**此卦唯长女可见，婚后局消**'**\"。**并须核其卦名**：**风地观＝**巽上坤下****；**长女＝**巽**（上卦）、**西南**＝**坤**（下卦）→ **巽上坤下＝风地观 ✓**（**这一处方位是对的**——**可与前条\"山风蛊（少男居西南角）\"的错配对照**）。**须说明（三层）**：**①\"**婚后局消**\"这个说法，在本册里极少见**（**它承认了一条\"局\"的**有效期****：**人一结婚、住处一变，这个局就不成立了**）——**而这一条其实**削弱了整套地脉道的确定性**：**若一个局可以被一次搬家或一次婚嫁消掉，那它对\"命\"的解释力就很有限**；**②\"**观卦之精义在以静观可以洞悉周围之事**\"这一句，抓住了\"观\"的本义**（**观不是\"看热闹\"，而是\"看清楚\"**）；**③⚠ 而\"**此卦唯长女可见**\"这个限定，同样是一个**可被现实轻易推翻的断言**（**只要有一位非长女、住西南角的女性，其处境与描述不符，这句话就不成立**）。** **⚠ 另须标**：**同段\"**如遇僧道之命，则主终身不嫁**\"一条，把\"出家\"读成\"命该如此\"**（**而出家是一个人的**自主选择****，**把它写成\"命\"，等于抹掉了这个选择**）。","o":"TJ-0883 · 天纪·紫微详解·第四章卦象详解·风地观·地脉道（PDF 第174页）  ---"},{"t":"四百零一、\"所以这例分析只能停止\"","h":"编者第五次停手，而这一次是因为\"算不通\"","c":"要点——**第十一例的编者按，是一次**完整的证伪尝试**，须逐句照录，因为它把\"算不通\"的全过程都写了出来**：\"**'这一例讲的比较乱，各宫的主星与大限的时间错位'。'**倪师误将命宫在午、破军守命，讲成命宫在巳、太阳守命**——这样一来，**大限主星与大限时间段不符**'。'倪师所讲命例全部都在《天机道》中，上网一查便知。**破军在午有五六例，符合鸡年出生的只有这一例**'。'倪师讲座视频，大限为 4-13、14-24、34-43——**这是金四局的命盘，说明上面水二局命盘也不对**。我试图修改八字的日和时；**由于酉（鸡）年限制，只能排出火六局，无法排出视频所讲命盘的金四局**'。'**所以这例分析只能停止**'。**\" **须说明（四层）**：**①这是一个**四步链条**：**发现矛盾（讲义说\"水二局\"，视频是\"金四局\"）→ 提出假设（改日改时）→ 系统尝试（在各种可能里排）→ 到达边界（\"酉年限定只能出火六局\"）→ 停手**；**②最重的一句是\"**所以这例分析只能停止**\"**（**它不是\"讲得乱\"，而是\"**原文自己算不出原文的结论**\"**）——**这是全册编者按里唯一一次承认\"这一步我做不下去\"**；**③而\"**破军在午有五六例，符合鸡年出生的只有这一例**\"这一句，是一次**样本核对****（**它在\"同格五例\"里筛出\"同年\"的那一个**）——**这说明编者手里确实有可比的库**；**④⚠ 而须标**：**本集的处置是**忠实保留这段停手记录，不代为补算****（**因为一旦补出一个\"能对上\"的盘，就等于替这套体系圆了场**）——**而编者自己停手，恰恰是最诚实的处理**。** **本期可迁移的一层**：**这套方法真正的问题，不在\"灵不灵\"，而在\"**它连自己内部都对不齐**\"**（**同一份命，文字讲义、视频讲座、软件排盘给出三个不同的局**）。","o":"TJ-0884 · 天纪·紫微详解·第五章紫微十二宫详解·第十一例·编者按（PDF 第177~178页）"},{"t":"四百零二、\"宫干飞化\"：两层看六亲","h":"全书第一次给出可逐步操作的方法","c":"方法——**第十二例开头，讲义给出了本册**唯一一处把\"看六亲\"拆成可执行步骤**的方法，须完整照录**：\"**'六亲看兄弟、父母宫——**兄弟化忌、父母吉星落陷、对面疾厄廉破，这就叫六亲无靠**'。'**另一种看六亲方法**：**兄弟本身化忌，再看兄弟宫宫干是**丁**（四化：**丁阴同机巨**）**最后是化忌**——**巨门在命主的命宫化忌，兄弟如仇人**'。'看父母宫宫干**己**（**己武贪梁曲**）——**父母文曲在命宫化忌，父母如仇人**'。'这就是六亲无靠——白手起家的人，靠自己辛苦独自奋斗成家'。**\" **复核（两步，可验）**：**①兄弟宫宫干为**丁**——丁干四化按\"禄→权→科→忌\"读＝太阴禄、天同权、天机科、**巨门忌** ✓（**与十干四化表\"丁阴同机巨\"完全吻合**）；**②父母宫宫干为**己**——己干四化＝武曲禄、贪狼权、天梁科、**文曲忌** ✓（**与\"己武贪梁曲\"完全吻合**）。**须说明（三层）**：**①这是本册第一次把\"**宫干飞化**\"写成**可逐步操作**的流程**（**第一步看本宫有无化忌；第二步取本宫宫干，飞一次四化；第三步看那颗\"忌星\"落在哪一宫**）；**②而它推出的结论极重**：\"**巨门落进命宫 → 兄弟如仇人**\"、**\"文曲落进命宫 → 父母如仇人**\"**（**注意：判断的对象不是\"兄弟宫\"，而是\"那颗忌星有没有冲进你自己的命宫\"**）；**③⚠ 而须标**：**这套推法的每一步都可核算，但它推出的\"如仇人\"是一个**关系判断****（**而一个人与兄弟、父母的关系，取决于实际的相处与事件，不取决于哪颗星落进哪一宫**）。** **本集按语**：**\"宫干飞化\"是本册技术上**最讲究**的一层**（**它引入了\"宫位自带的干\"，使一张盘能飞出一百多次四化**）——**而这也正是它最危险的地方：**变量越多，\"总有一款能对上\"的概率就越高**。","o":"TJ-0885 · 天纪·紫微详解·第五章紫微十二宫详解·第十二例·六亲（PDF 第179页）"},{"t":"四百零三、\"发现对象是已婚之人，还没有离婚\"","h":"一个极具体的\"应验\"叙述","c":"要点——**第十二例的流年分析里，有一段对\"婚事不成\"的具体叙述，须完整照录，因为它是全册少见的**有情节的应验****：\"**'年支申子辰，辰为墓，从对宫戌宫起 1 岁，阳女逆转——25、26、27、28、29、30 岁到巳宫见天喜，会有婚姻动'。'**女人福德宫很重要**：如果不好的话就有第二次婚姻，福德很好的话**一定会结婚**的'。'如果她在**化忌之前**恋爱了——比如 25、26、27 会遇到太阳，可是没有过忌，**婚姻不会成的**'。'**遇到太阳，她准备领结婚证，发现对象是已婚之人、还没有离婚——想结婚，忌叫你结不了婚**'。'**如果过了忌、遇到喜星，就会结婚**'。**\" **复核（一步，可验）**：**属龙（辰）入三合局\"**申子辰**\"，其\"辰\"（墓）的对宫为**戌** ✓；**1 岁起戌、阳女逆转 → 25 岁回戌**（**25−1＝24，24 mod 12＝0**）→ **25 戌、26 酉、27 申、28 未、29 午、30 巳** ✓；**故\"30 岁到巳宫见天喜\"**——**与原文完全吻合** ✓。**须说明（三层）**：**①这条算术是干净的**（**属龙、起戌、逆行、30 落巳，四步全对**）——**可与前文的\"男从未起\"\"女从丑起\"\"巳酉丑对宫起未\"并列，作为**小限起宫的第五种说法**（**而它多了一条依据：**起于\"三合局墓库\"的对宫**）；**②而\"她准备领结婚证，发现对象是已婚之人\"这一段，是全册最像**真实故事**的一处**（**它的细节具体到\"还没有离婚\"**）——**⚠ 但须标**：**这类\"应验\"的通病是**事后补叙****（**\"婚事不成\"这件事已经发生了，然后才找到一颗\"忌\"来解释它**）——**而在这件事里，真正的原因是**对方已婚**，与任何星无关**；**③\"**女人福德宫很重要**\"这一句，与前文\"福德宫是女人的第二夫妻宫\"呼应**（**两处合起来，把\"婚姻好坏\"的判据从\"夫妻宫\"挪到了\"福德宫\"**）——**⚠ 而这是一个**可移动的判据**：**夫妻宫干净时看福德，福德好了再看别的，判断就总能找到落点**。","o":"TJ-0886 · 天纪·紫微详解·第五章紫微十二宫详解·第十二例·流年（PDF 第180页）"},{"t":"四百零四、\"没有这样的煞星，他做不了手术\"","h":"一句极有意思、也极可用的判断","c":"要点——**第十二例的官禄宫一段，对\"擎羊\"给了一个出乎意料的正向读法，须完整照录**：\"**'官禄宫：**擎羊进入职业宫，不会当公务员的，不会当官的**。命有化科，可以从事教育、当老师'。'看擎羊一定要看它**在哪一宫**——**进四墓宫，是好事：凶性被控制，人能够自律，有奋发图强的精神**'。'**如果是外科医生或屠夫——没有这样的煞星，他做不了手术**'。**\" **须说明（三层）**：**①\"进四墓宫则凶性被控制\"这一条，是本册**难得的\"约束条件\"****（**它说明同一颗星在不同宫位，吉凶可以相反**）——**而\"凶性被控制、人能自律\"这个说法，实际上是把\"煞\"读成了**能量**，而不是灾祸**；**②\"**没有这样的煞星，他做不了手术**\"是全书最出人意料的一句**（**它承认外科医生需要一种\"能下刀\"的心理素质**，**而这种素质，在命理语言里被叫作\"煞\"**）——**本集按语：这一层其实**有道理**（**外科、急诊、殡葬、屠宰这些行当，确实需要从业者对\"血与创口\"有异于常人的耐受**）——**⚠ 但它把这种素质归因于\"星\"，而不是**训练、性格与选择**；**③⚠ 而\"擎羊进职业宫就不会当官\"这一条，须标为无据**（**一个人能否进入公职，取决于考试、资格与任用程序**）。** **可用的一层**：**\"看一颗星，先看它落在哪一宫\"这个思路，作为**\"同一特质在不同位置上意义不同\"**的比喻是成立**的**（**同一个人，放在需要\"下刀\"的岗位上可能是长处，放在需要\"周旋\"的岗位上可能是短处**）。","o":"TJ-0887 · 天纪·紫微详解·第五章紫微十二宫详解·第十二例·官禄宫（PDF 第180页）"},{"t":"四百零五、\"比倪师大两岁，说明《天纪》命例是后期搜集和整理的\"","h":"一次极硬的文献学推断","c":"数据——**第十二例的编者按里有一处用**生年**做文献学判断**，极简洁也极硬，须照录**：\"**'民国四十一年出生，是公历 **1952 年**，属龙之阳女'。'**倪海厦 1954 年生于台北，祖籍浙江瑞安**'。'**比倪师大两岁，说明《天纪》命例是后期搜集和整理的**'。**\" **复核（一步，可验）**：**民国 41 年＝1911＋41−1＝**1951**？**——**须注意：民国 41 年对应 1952 年**（**民国元年为 1912 年，故民国 N 年＝1911＋N**；**1911＋41＝1952 ✓**）——**与原文\"1952 年\"一致 ✓**（**这也修正了本集此前一处口径：民国 N 年＝1911＋N，不是\"1911＋N−1\"**）；**而 1952 比 1954 大 2 岁 ✓**。**须说明（三层）**：**①这条推断的方法极干净——**用命主的出生年、与讲者的出生年做比较，就能判断这些命例是不是\"当场排的\"****（**若命例是讲课现场随手排的，命主多半与讲者同时代、甚至更年轻；而这里命主比讲者年长两岁**）；**②\"**后期搜集和整理**\"这个结论，对读整本书有实际意义**（**它意味着这些命例是**挑出来的**——**而\"挑出来的\"样本，天然带有**选择偏差****：**讲者会挑\"应验了\"的，不会挑\"没应验\"的**）；**③⚠ 而这一层与册内另一处**直接冲突**：**编者前文曾说他\"研究命例超过五千例\"，并列出\"五例同格\"来**证伪****（**那一段是**反选择偏差**的**）——**同一本书里，一处做\"挑应验的\"，一处做\"挑不应验的\"，恰好构成一组对照**。** **本集按语**：**\"命例是后期搜集的\"这六个字，比任何吉凶断语都重要**——**它把一本书的性质，从\"实录\"改成了\"选集\"**。","o":"TJ-0888 · 天纪·紫微详解·第五章紫微十二宫详解·第十二例·编者按（PDF 第180页）"},{"t":"四百零六、\"眉里藏珠之人，喜欢私藏\"","h":"一个极精的画像，与一句\"因果倒置\"","c":"要点——**第十二例的兄弟宫一段，把\"眉相\"讲得很细，其中有一句**方向恰好相反**的解释，须并录**：\"**'眉毛中间有个痣，相叫**草里藏珠**、佛胆——是兄弟大贵，但**藏珠也主兄弟夭折**'。'**断眉也主兄弟夭折**'。'眉乱七八糟，主牢狱之灾——**出于担心兄弟出事，才会生这样的眉**'。'**眉里藏珠之人，喜欢私藏，有私房钱——就是你发现了，也不会告诉你有多少钱**'。**\" **须说明（三层）**：**①\"**出于担心兄弟出事，才会生这样的眉**\"这一句，方向是**反的****（**它不是\"眉决定命运\"，而是\"**心决定眉**\"**）——**这在整册\"以相断命\"的框架里极罕见**（**它其实承认了：面相是**情绪与习惯的结果**，而不是命运的原因**）；**②而\"**眉里藏珠之人喜欢私藏、有私房钱、你发现了也不会告诉你有多少钱**\"是一个人**极精的画像****（**它把一颗痣，读成了一种**财务习惯**）——**若把它当作性格比喻，是成立的**（**小心守财的人，通常也不爱报账**）；**③⚠ 而\"**断眉也主兄弟夭折**\"\"**眉乱七八糟主牢狱之灾**\"须标为无据**（**眉形的成因是毛囊、修剪与外伤**，**而\"牢狱\"取决于行为与法律**）。** **⚠ 本集另须标**：**同段的\"可从命主左眉毛看出来\"——把\"兄弟夭折\"这样的事，建成\"看眉毛\"就能知道**（**而一位真的失去过兄弟的人，读到这句会反复照镜子**）。","o":"TJ-0889 · 天纪·紫微详解·第五章紫微十二宫详解·第十二例·兄弟宫（PDF 第179~180页）"},{"t":"四百零七、\"两个眼睛大小不一，这种就庶出命\"","h":"三条以相貌断出身与名分的断言，须最高级警告","c":"风险——**第十一、十二例里，出现了三条把\"相貌\"与\"出身\"\"婚姻名分\"直接挂钩的断言，须照录并**最高级警告****：\"**'日月角：**日角陷丧父，月角陷丧母**。**左眉高者丧父，右眉高者丧母**'。'**如果一个眉高、一个眉低，或两个眼睛大小不一、不相等——这种就庶出命**'。'**如果女人她的八字就是男人的命，她一辈子像男人一样去辛劳的工作，她就是偏房的命**'。'**此命是巨日格——靠自己白手起家的女孩，就是偏房命**'。**\" **⚠ 本集处置（四层）**：**①照录**；**②⚠ 明确否定第一条**：**\"日角陷丧父、月角陷丧母\"\"左眉高者丧父\"没有任何依据**（**父母的寿数，取决于他们的健康、年龄与医疗条件**）——**而\"两眼大小不一＝庶出\"这一条最重**：**两眼轻微不对称在人群中极常见**（**它由发育、用眼习惯甚至拍照角度造成**），**而\"庶出\"是一个**污名化的出身标签****（**它把一个孩子无法选择的出生，判成了他的\"命\"**）；**③⚠ 明确否定第二条**：**\"女人八字就是男人的命→偏房命\"，是把\"女性像男人一样辛劳工作\"读成\"她命该做妾\"**——**这是双重的不公：既贬低了她的劳动，又把她的婚姻名分判给了命**；**④⚠ 而\"靠自己白手起家的女孩就是偏房命\"是全册最需警惕的一句**（**它把一位女性的**自立与成就**，直接读成\"她该做偏房\"**）。** **本集态度（三层）**：**①一个人的出身不由相貌决定**（**也不应由\"庶出\"这样的词来评判**）；**②一个人的婚姻名分，不由\"她是否像男人一样工作\"决定**；**③而\"白手起家\"这件事，在任何标准下都是**能力强与承担重**的证明，不是\"命里缺名分\"的证据**。** **⚠ 若读者曾因\"相貌\"\"出身\"\"太能干\"被下过这类判语**：**请把它当作一句**没有依据的评价**，而不是一个关于你的结论**。","o":"TJ-0890 · 天纪·紫微详解·第五章紫微十二宫详解·第十一例·面相知识（PDF 第177页）；第十二例·命格（PDF 第179页）"},{"t":"四百零八、第十八次验证：观卦\"旱荷得水\"","h":"\"幸亏得逢水来灌，枝叶重鲜花更红\"","c":"数据——**观卦的文王金钱课符号，是本轮第十八次验证，须复核并记录其象**。\"**风地观卦：○○××××（**旱荷得水**）上吉**\"。**复核（一步，可验）**：**①风地观＝**巽上坤下****（**上卦巽、下卦坤**）；**②巽（阴、阳、阳）在上、坤（阴、阴、阴）在下 → 六爻自下而上＝**阴、阴、阴、阴、阳、阳****；**③符号 ○○×××× 自右向左读（○阳×阴）＝×（阴）、×（阴）、×（阴）、×（阴）、○（阳）、○（阳）→ **阴、阴、阴、阴、阳、阳**——**完全吻合 ✓**（**与爻题初六、六二、六三、六四、九五、上九逐字对上**——**观卦五爻为阳、其余五爻皆阴，正是\"九五之尊被四阴爻倾视\"的卦体**）。**须说明（两层）**：**①至此\"自右向左\"已**十八次验证**（**增观、临二卦**），**无一反例**；**②而\"**旱荷得水**\"这个象极好**：**\"事比荷花出水中，旱日不如往日同——幸亏得逢水来灌，枝叶重鲜花更红\"**（**它写的不是\"本来就好\"，而是**\"旱过之后又被浇活\"**）——**而\"上吉\"这个等级，恰好对应这个意思：**好，但不是从没好过**。** **⚠ 须标**：**同组签文的\"断曰\"（走失得见、口舌消散、疾病皆除、月令真善）是纯吉断**（**它与\"上吉\"一致，却与观卦\"九五被四阴倾视\"的紧张卦体**不完全相称****）——**本集照录，不作调和**。","o":"TJ-0891 · 天纪·紫微详解·第四章卦象详解·风地观·文王金钱课（PDF 第175页）  ---"},{"t":"四百零九、\"中限法\"：把十年切成四份，每份 2.5 年","h":"一个新的层次，与一处算不平的区间","c":"方法——**第十二例末尾，讲义首次引入\"中限\"这一层，把\"十年大限\"再切细，须完整照录并核算**。**规则**：\"**'中限分法：**十年大限分四份，一个中限管 2.5 年**'。'**第一中限在大限迁移宫，第二中限在大限宫，第三中限在大限财帛宫，第四中限在大限福德宫**'。**\" **用途**：\"**'上图：中限命宫或身宫有**红鸾、天喜**的；中限夫妻宫有**禄存**，能结成婚'。'小限命宫或身宫有红鸾天喜，或男命有太阴、女命太阳，小限夫妻见禄星，有结成婚'。**\" **声明（极强）**：\"**'通过这八张图，可心手并用，**快速算出此人何时谈过恋爱、谈过几次、何时结婚、何时离婚、一生要结几次婚**——此法了如指掌。中限也能快速断出何种疾病、何种意外、伤害、死亡等'。**\" **⚠ 复核（本集逐步计算，此处**对不上**）**：**①规则说\"十年分四份、每份 2.5 年\"**（**10÷4＝2.5 ✓**）；**②而例证的区间是**\"第一中限（15-16.5）\"、\"第二中限（16.5-19）\"、\"第三中限（20-21.5）\"、\"第四中限（21.5-24）\"**；**③逐段算长度**：**15→16.5＝1.5 年**、**16.5→19＝2.5 年**、**20→21.5＝1.5 年**、**21.5→24＝2.5 年**——**合计 1.5＋2.5＋1.5＋2.5＝**8 年**，**而大限是 10 年**（**差 2 年**）；**④且第二段终点 19 与第三段起点 20 之间，**整整缺了 1 年**（**19→20 没有任何中限覆盖**）；**⑤按\"每份 2.5 年\"的正确划法应为**：**15–17.5、17.5–20、20–22.5、22.5–25**。** **须说明（三层）**：**①这是本册**第一处\"区间不等长且不连续\"**的错误**（**它不像\"某年虚岁算错\"那样差一岁，而是四个区间加起来只有 8 年**——**这会直接导致\"某段恋爱落在哪个中限\"的判断错位**）；**②⚠ 而须标**：**\"中限\"这一层本身，是把\"十年\"再切到\"2.5 年\"**（**切得越细，可命中的机会越多**）——**而\"何时谈过几次恋爱\"这类断言，落到 2.5 年的格子里之后，几乎总能对上某一段经历**；**③⚠ 而\"**一生要结几次婚**\"这个声明，须明确不可采**（**婚姻的次数取决于人的选择与际遇**）。","o":"TJ-0892 · 天纪·紫微详解·第五章紫微十二宫详解·第十二例·中限分法（PDF 第183~184页）"},{"t":"四百一十、\"她换了这个房子，就不会结婚了\"","h":"全册对\"阳宅能改命\"最直接的一次演示","c":"要点——**第十二例的收尾，用一件极具体的事说明了\"改阳宅\"如何改变结果，须完整照录**：\"**'小限 38 岁换房住，**主卧室在西北乾**——这是**母代父职**的位置，**不会结婚**的位置'。'**如果不换房住，39、40、41、42 岁又遇到喜星，就会结婚**。'**'可是她换了这个房子，位置变了——**就不会动了、不会结婚了**'。'所以说这个人是个偏房命，**卦象是地天泰**——思想超越年龄、变成有责任感，**认为婚姻不重要**，'我就可以代替爸爸、母代父职，带孩子就好''。**\" **复核（一步，可验）**：**\"母代父职\"即\"母居父位\"**——**母＝坤（上卦）、西北＝乾（下卦）→ **坤上乾下＝地天泰** ✓**——**与原文自注的\"卦象是地天泰\"完全吻合** ✓（**这是\"变卦＝人＋位\"第十九次复算成功**）。**须说明（三层）**：**①这一段的逻辑极关键**：**它把\"命\"与\"宅\"分了先后——命里本来\"39 到 42 岁会结婚\"，但因为 38 岁搬进了西北角的主卧，**这件事就没发生****（**这是全册对\"阳宅能改命\"最直接的一次演示**）；**②而它同时给出了一个极准的心理描述**：\"**思想超越年龄、变成有责任感、认为婚姻不重要**\"**（**一个 38 岁搬进\"父位\"的女性，从此把自己活成了\"家里的父亲\"**）——**这一层脱开卦象也成立**（**当一个人在家里承担了\"父亲\"的功能，她往往就不再给自己留\"做妻子\"的位置**）；**③⚠ 而须标**：**\"换个房间就没结成婚\"这个因果，是可以被更简单的解释覆盖的**（**38 岁之后没结婚，可能是因为她把精力全放在了孩子和家事上**——**而这恰恰是同一件事的另一种说法**）。** **⚠ 而\"偏房命\"这个判定，仍须否定**（**一个人的婚姻名分，不由她住在哪个房间决定**）。","o":"TJ-0893 · 天纪·紫微详解·第五章紫微十二宫详解·第十二例·阳宅（PDF 第182~183页）"},{"t":"四百一十一、\"三个好卦\"与\"如果住南面，死的更快\"","h":"一份可执行的处方，与一句最伤人的话","c":"风险——**同一例给出了三条\"好卦\"的处方，而其中一句对病人极不友善，须并录并警告**：\"**'**破解方法：命中有三个好卦、可让她身体好——泰卦、坤为地、地风升**'。'**母亲住在泰卦位、坤为地或地风升——这三个位置上，身体就会好转**'。'**如果住在南面，地火明夷卦，那死的更快**'。'**所以改阳宅特别小心**'。**\" **须说明（三层）**：**①这是全册**最具体的一组\"处方\"****（**它给了**三个可执行的卦位**，而不是笼统地说\"改阳宅\"**）——**而\"改阳宅特别小心\"这一句，是讲义对**自己这套操作**的谨慎**（**\"改错了会更糟\"**）；**②⚠ 而\"**如果住在南面，地火明夷卦，那死的更快**\"必须最高级警告**：**这句话是对一位已经生病的人说的**（**而\"你会死得更快\"这种断言，会直接摧毁一个人对治疗的信心**）——**而信心是治疗的一部分**（**大量研究显示，严重消极预期与治疗依从性下降、预后恶化相关**）；**③⚠ 而\"三个好卦能让她身体好\"这一条，也不能当作医疗建议**（**疾病的转归取决于诊断、分期与治疗，不取决于卧室方位**）。** **本集处置（三层）**：**①保留原文**（**因为它展示了这套方法的\"处方形态\"**）；**②明确否弃\"住南面死得更快\"**（**这是全书对病人最不负责的一句**）；**③⚠ 若读者或家人正在治病**：**请把\"住哪\"与\"怎么治\"分开**——**前者可以调整以求心安，后者必须听主治医生**（**任何\"换个方位就不用治\"的说法，都不要听**）。","o":"TJ-0894 · 天纪·紫微详解·第五章紫微十二宫详解·第十二例·破解（PDF 第183页）"},{"t":"四百一十二、\"她相信这样的男人，因为她喜欢\"","h":"一段极准的心理描述，与一句很重的话","c":"要点——**第十三例对\"爱上已婚者\"这件事，写出了一段极准的心理过程，须完整照录**：\"**'运程逆行往**西北角**方向走——**西北为乾、为父**，**喜欢已婚的老男人**'。'**她相信这样的男人**——这男的说没有结过婚，**她也信、因为她喜欢**'。'**当订婚时才发现这男人已结婚，而且还没有离婚**'。'**恋爱中的女人，往往傻又蠢、不去思索，眼睛是看不清的**'。**\" **须说明（三层）**：**①\"**这男的说没有结过婚，她也信、因为她喜欢**\"这一句，是极准的心理刻画**（**它不是\"她笨\"，而是\"**她想信**\"**）——**而这一层比\"傻又蠢\"这个说法准确得多**：**人在强烈的情感里，不是失去了判断力，而是**把判断力用在了\"如何让这件事成立\"上**；**②\"**西北为乾、为父**→喜欢已婚的老男人\"这一层，其实触到了一个真实的心理机制**（**一个人在亲密关系里反复选择\"年长、有担当、已被别人选过\"的对象，常与**早年缺少一个可靠的父亲形象**有关**）——**⚠ 但讲义把它归给了\"方位\"，而不是**依恋的经验****；**③⚠ 而\"**恋爱中的女人，往往傻又蠢**\"这句话很重，须标为先看语境**（**它有一半是对的（恋爱中的人确实会自我说服），但\"傻又蠢\"这三个字，把责任压在了被骗的一方**）。** **本集按语**：**在一段\"对方说没结婚\"的关系里，可核的事实只有一件——**去查**（**婚姻登记信息、共同生活的痕迹、他是否愿意让你见他的家人与朋友**）。** **⚠ 若读者正处在这样的关系里**：**\"他愿意让你进他的生活\"，比任何誓言都更能说明问题**；**而一旦发现对方已婚，**这不是你的错，也不是\"你傻\"**（**被欺骗的人不需要为欺骗者的行为负责**）。","o":"TJ-0895 · 天纪·紫微详解·第五章紫微十二宫详解·第十三例·大限（PDF 第187页）"},{"t":"四百一十三、一份最完整的\"改运方案\"","h":"五步俱全，但它替当事人做的是人生决定","c":"要点——**第十三例末尾给出了一套五步俱全的\"改运\"方案，是全册最完整的一处，须照录**：\"**'改运：1、**叫她 32 岁前不要结婚，将第一次婚姻舍掉**'。'**舍掉后不要再住西北角了，去住东南角**'。'**32 岁红鸾星动**——先生是机巨化权、侧会禄存化禄，**这就是从商格**，先生做生意'。'**叫她嫁给做生意的，门当户对**'。'如果叫她 30 岁改、31 岁结婚，她嫁给紫相昌曲的，是个当官的——**那她大限走 33-42 就会聚少散多**，天马星就会变'。**\" **须说明（三层）**：**①这套方案的**结构非常清楚****：**①改时间（32 岁前不婚）→ ②改空间（搬离西北、住东南）→ ③定对象类型（做生意的）→ ④定匹配原则（门当户对）→ ⑤并给出\"改早了会怎样\"的对照**（**\"30 岁改、31 岁结婚\"会导致\"聚少散多\"**）——**这是全册方法论上最完整的一次演示**；**②其中\"**门当户对**\"这四个字，是全册**最实用的一句择偶建议**（**而它与\"宁做有钱人的偏房\"恰好相反：一个讲匹配，一个讲攀附**）；**③⚠ 而须标**：**\"叫她 32 岁前不要结婚\"\"嫁给做生意的\"——这两条是**替当事人做人生决定****（**而婚姻的对象、时机，最终必须由她自己定**）——**一个 27 岁来求测的女性，被建议\"把第一次婚姻舍掉\"，这个建议的重量，远超一次咨询**。** **⚠ 而更须标一层**：**第 5 步\"改早了会聚少散多\"，使这套方案**无法被证伪****（**按方案做，好则归功于方案；不按方案做而出了问题，则归因于\"没照做\"**）。","o":"TJ-0896 · 天纪·紫微详解·第五章紫微十二宫详解·第十三例·改运（PDF 第187页）"},{"t":"四百一十四、\"她的婚姻不会动的\"","h":"一句极简的判断，与它背后的\"父位\"","c":"要点——**第十三例有一句极简的断语，只有九个字，却把\"宅—命\"关系说得最直白**：\"**'**阳宅她一直住在西北角，她的婚姻不会动的**'。**\" **而同一例的\"年支\"与\"小限\"须一并核**：**①\"民国 55 年，**1966 年丙午**，属马之人，**小限起辰位，阳女逆转**\"**——**复核：民国 55＝1911＋55＝**1966** ✓；**1966 尾数 6→**丙** ✓；**丙午年、属马** ✓；**②\"小限起辰位\"**——**属马（午）入三合局\"**寅午戌**\"，其墓为**戌**，**戌的对宫为**辰** ✓**——**故 1 岁起辰、阳女逆转** ✓（**这是\"小限起宫\"的第六种说法，与前文\"三合局墓库的对宫\"同源**）；**③\"辰起 25、26、27 到寅宫逢化忌\"**——**25 辰、26 卯、27 寅** ✓（**逆转，逐宫退一位**）。**须说明（两层）**：**①\"婚姻不会动\"这四个字，是全册对\"阳宅锁死婚姻\"最直白的表述**（**而它的机制被归给了\"西北＝乾＝父位\"**：**住进父位，就不再有\"妻位\"**）；**②⚠ 而须标**：**\"不会动\"这种断言，最容易变成**自我实现的预言****（**一个人若认定\"我住这里就结不了婚\"，她可能在遇到合适的人时，也不会去争取**）——**而这不是\"命\"的作用，是**信念**的作用**。","o":"TJ-0897 · 天纪·紫微详解·第五章紫微十二宫详解·第十三例·阳宅（PDF 第187页）"},{"t":"四百一十五、\"方法来自于台湾省沈平山\"","h":"一次难得的来源交代","c":"数据——**\"中限法\"讲完之后，讲义明确交代了它的来源与书目，这是全册**少数几次\"说清出处\"**的地方，须完整照录**：\"**'以此类推找到结婚的时间点'。'**方法来自于台湾省沈平山大师所著**'。'他著有：**《中国神明概论》**、**《紫微斗数当代中国名人谱（秘册）》**、**《紫微斗数占病断诀实例》**、**《紫微斗数·近代名人命谱》**、**《紫微命谱》**等紫微和奇门之著'。**\" **须说明（三层）**：**①这是一次极罕见的**来源声明****（**全册大量口诀、断语都没有出处，而这一处明确说\"来自沈平山\"**）——**这一句的价值，在于它把\"这套方法\"从\"师传\"改成了**\"采集\"****；**②而书单本身是一份**可核的文献目录****（**五本书、两个领域（紫微、奇门）**）——**它说明这一层技术确实有**成文的来源**，不是口耳相传的即兴发挥**；**③⚠ 而须标**：**它与前文\"《天纪》命例是后期搜集和整理的\"合起来看，指向同一个结论**：**这本书的性质是**编纂**，不是**实录****（**一部分命例来自整理，一部分方法来自他人著作**）。** **本集按语**：**一本讲\"命\"的书，肯把自己的\"方法从哪来\"写清楚，本身就是一种**诚实**——**而它比\"某位高人秘传\"这类说法，可靠得多**。","o":"TJ-0898 · 天纪·紫微详解·第五章紫微十二宫详解·第十二例·中限来源（PDF 第184页）"},{"t":"四百一十六、\"56 岁结束\"与\"男贵女难\"","h":"三条须警告的断言","c":"风险——**这一章有三条断语须单列警告，因为它们分别涉及**寿数、败家、性别双重标准****。**其一（寿数）**：\"**'大限 55-64：这十年廉破主事，就是灾厄、疾厄，身体会变差、病疼；流年 56 年在卯宫逢廉破，**大小二限相逢，这就是死**——**水里做坟，56 岁结束**'。**\" **其二（败家）**：\"**'田宅宫化忌——**她看不出人的好坏、没有防人之心**，她会拿出祖业、帮助别人、担保等，**将祖业破掉**'。'她的相是：**两个大大的鼻孔对着人，破祖业**。她认为自己不会、她没有戒心'。**\" **其三（性别双重）**：\"**'**如果是男命贪狼逢天马，武官星逢到天马主贵**，非常好，在事业上很好，调动会升迁'。'**女人则困难重重，多表示在感情**——贪狼是桃花，结果对宫化双忌'。**\" **⚠ 本集处置（四层）**：**①第一条须明确**：**\"56 岁结束\"是一个**死亡预告****（**而一个人的寿数，取决于健康状况、遗传、生活方式与医疗条件**）——**而\"被算出死期\"这件事本身，会造成极重的心理负担**（**有人因此放弃体检、放弃治疗，或长期处于恐惧中**）；**②第二条须拆开看**：**\"看不出人的好坏、没有防人之心、会替人担保把祖业破掉\"这一段，其实是**极准的行为描述****（**而\"替人担保\"确实是现实中常见的致贫原因**）——**⚠ 但\"两个大大的鼻孔对着人＝破祖业\"这一句，是以鼻形断败家**（**鼻孔大小由软骨与遗传决定**）；**③第三条须明确否定**：**同一个配置（贪狼逢天马），男得\"主贵、升迁\"，女得\"困难重重、多表示在感情\"**——**这是**同一件事，因性别而一吉一凶****（**而\"女人困难重重，多表示在感情\"这一句，把女性的职业困境，直接改写成\"桃花问题\"**）**；**④⚠ 本集态度**：**一个配置不该因性别而结论相反**；**而\"女人的困难都在感情上\"这类说法，会遮住真实的结构性问题**（**如晋升通道、薪酬差距、育儿负担**）。","o":"TJ-0899 · 天纪·紫微详解·第五章紫微十二宫详解·第十二例·大限（PDF 第183页）；第十三例·田宅宫／大限（PDF 第187页）  ---"},{"t":"四百一十七、\"女孩喜欢的是才艺，但此情不能持久\"","h":"两处极准的择偶画像","c":"要点——**第十四例对\"为什么这个人会反复结婚\"的解释，落在\"才艺\"与\"择偶标准\"兩层，须并录**。**第一层**：\"**'破军星入命的男人**长得不一定帅**——对宫化科，**外刚内柔**，又得昌曲，才艺佳，**容易博得女孩欢心**；昌曲化科、有才艺、琴棋书画样样会'。'**因为女孩喜欢的是才艺，但此情不能持久**'。**\" **第二层**：\"**'夫妻宫是**廉贞、天钺**——是桃花星和才艺星'。'**不漂亮的我不追，无才的我也不追**'。**\" **须说明（三层）**：**①\"**女孩喜欢的是才艺，但此情不能持久**\"这一句，是全册**最准的一句关于\"吸引力\"的判断****（**它区分了两件不同的事：**才艺能让人一见倾心，但它撑不住一段长期关系**）——**而\"不能持久\"这四个字，正好解释了后面\"反复结婚又离婚\"**（**不是命在反复，是**吸引力与相处能力不匹配**）**；**②\"**不漂亮的我不追，无才的我也不追**\"这十个字，是一副极完整的择偶画像**（**两个硬条件，都指向\"可展示的优点\"**）——**而它恰恰漏掉了长期关系真正需要的东西**（**耐心、责任、沟通**）；**③⚠ 而讲义把这一层**归给了\"桃花星＋才艺星\"**（**\"廉贞天钺＝桃花星和才艺星\"**）**——**本集按语：这一段的**价值不在星，而在它把\"择偶标准的偏科\"写清了**。","o":"TJ-0900 · 天纪·紫微详解·第五章紫微十二宫详解·第十四例·命宫／夫妻宫（PDF 第189页）"},{"t":"四百一十八、\"男人的太阴，就是妈妈和太太\"","h":"一处极有意思的关联","c":"要点——**同例对\"为何反复离婚\"给了一个极具体的机制解释，须完整照录**：\"**'**为什么会不断结婚、离婚？**'。'**因为是太阴化忌——男人的太阴，就是妈妈和太太**'。'**太阴化忌，婆媳多矛盾**——结果一化忌就变成了灾，就毁掉一次'。'**这就是命**'。**\" **须说明（三层）**：**①\"**男人的太阴就是妈妈和太太**\"这一句，把两颗\"人\"叠在同一个符号上**（**太阴在男命，既主母亲、也主妻子**）——**于是\"太阴化忌\"就同时落在两个关系上**（**讲义说\"太阴化忌＝婆媳多矛盾\"，这个推导在**这套体系内部是自洽的**）；**②而这一层其实触到了**真实的结构****（**婆媳矛盾的实质，往往不是两个女人不合，而是**一个男人在两个女人之间的位置不清**）——**⚠ 但讲义把原因归给了\"化忌\"，而把\"这个男人该怎么办\"这一层**完全跳过了**；**③⚠ 须标**：**\"一化忌就变成了灾，就毁掉一次\"这个说法，把婚姻的破裂写成\"命里注定的一次次\"**（**而婚姻的破裂，通常由具体的相处方式、沟通与冲突处理能力累积而成**）——**⚠ 而\"这就是命\"这四个字，最容易让一个人在**第一次婚姻出问题时，就放弃修复**。** **本集按语**：**若读者正处在婆媳夹缝里**（**尤其是作为\"那个男人\"**）：**可做的一件具体事，不是\"讲道理\"，而是**把边界说清**（**如：谁的事谁决定、谁的家谁做主、节假日怎么分**）——**而这件事实在是需要\"那个男人\"来做，不是两个女人自己解决**。","o":"TJ-0901 · 天纪·紫微详解·第五章紫微十二宫详解·第十四例·流年（PDF 第189页）"},{"t":"四百一十九、\"戊辰年……文曲化忌\"？","h":"一处与十干四化表直接冲突的错误","c":"数据——**第十四例的流年里有一处四化，与本书自己的十干四化表**对不上**，须逐项核算并标错**。**原文**：\"**'流年太岁 **1945 年 + 43 岁 = 1988 年是戊辰**，**使命宫文曲化忌**，夫妻宫见廉贪，老婆半空折翅'。**\" **复核（三步，全部可验）**：**①**1945＋43＝**1988** ✓**（**按周岁计，与原文一致**）；**②1988 尾数 8 → 天干为**戊** ✓**、**地支**辰** ✓**——**故\"1988 年是戊辰年\"正确**；**③而**戊干四化**按本书自定的\"禄→权→科→忌\"读，是**贪狼禄、太阴权、右弼科、天机忌****（**即\"**戊贪阴右机**\"**）——**\"**文曲**\"**根本不在戊干四化之中**；**④若确要\"文曲化忌\"，应出现在**己干**（己武贪梁**曲**）或**辛干**（辛巨阳**曲**昌）——**而 1988 年不是己年、也不是辛年**。** ⚠ 须说明（三层）**：**①这是本册第一处**可以直接用\"自己的表\"推翻\"自己的例\"**的错误**（**不需要任何外部知识，只需十干四化表**）；**②而这一处恰好落在**关键的推论节点上****（**\"文曲化忌\"是用来解释\"老婆半空折翅\"的**）——**一旦这个\"忌\"不成立，后面那句解释就整段悬空**；**③本集据此判定**：**本例的\"43 岁丧妻\"这一链，至少有一环是**搭错的****（**本集保留原文并标错，不代为补算**）。** **⚠ 本集按语**：**这也从反面说明，为什么\"每处复算\"是必要的**——**十干四化表只有 40 个字，而全书要用上千次**（**一处记错，就会带出一整条错误的因果链**，**而它看起来和别处一模一样**）。","o":"TJ-0902 · 天纪·紫微详解·第五章紫微十二宫详解·第十四例·流年（PDF 第190页）"},{"t":"四百二十、\"将中间的物品咬碎，才能亨通\"","h":"全册对\"噬嗑\"二字最好的一次解释","c":"定义——**噬嗑卦的\"性格\"第二段，把\"噬嗑\"这个卦名的动作与道理讲透了，须完整照录**：\"**'火雷噬嗑卦为火雷交融，**激烈争斗**，**上下相合**，事事受阻'。'**噬嗑就是指上下颚咬合，将东西咬碎**——'**'**将中间的物品咬碎，才能亨通**'。'**同时噬嗑又主刑罚**——**要宽严结合，刚柔相济**'。**\" **须说明（三层）**：**①\"**将中间的物品咬碎才能亨通**\"这一句，是极准的**机制描述****（**它把\"噬嗑\"读成\"**中间有障碍，必须咬碎它，才能通**\"**）——**而这正是卦象\"颐中有物\"（口里有东西）的本义**；**②而这一层离开卦象完全成立**（**任何流程卡住，都要先把\"卡住的那样东西\"处理掉**，**绕过去只会越积越多**）；**③\"**同时噬嗑又主刑罚——要宽严结合，刚柔相济**\"这一句，把\"咬合\"与\"法度\"连成一件事**（**\"咬\"要有力，但不能乱咬**）——**⚠ 而它与本卦的另一面（\"看不惯就想咬谁一口\"）构成**张力**：**同一卦，一面是\"必须咬碎障碍\"，一面是\"见谁都想咬\"**（**前者是解决，后者是成瘾**）。","o":"TJ-0903 · 天纪·紫微详解·第四章卦象详解·火雷噬嗑·性格（PDF 第191页）"},{"t":"四百二十一、\"看不惯就想咬谁一口\"","h":"一个极准的画像，与\"名位不等\"的核","c":"要点——**噬嗑卦的\"性格\"第一段与\"地脉道\"，给了一组极生动的人格描写，须并录并核其卦**。**性格**：\"**'上离下震，离为火、震为木，木火相生，为**阴阳正配之象**。主聪明、富贵、吉祥'。'**噬嗑为咬合争斗，平时功利，遇事极端——看不惯就想咬谁一口**'。'自我要求高、有**坚忍不拔**的精神、**感情激烈而多波折**。口舌是非多、能做事、助力小，中晚后平顺'。**\" **地脉道**：\"**'火雷噬嗑卦（**二女居正东卧房**）：有的女孩**从小即喜欢咬人**，劝之不听，乃生噬嗑之象'。'一、此女性刚，报复手段常用咬人，**平日唠叨不停**'。'二、婚姻对象为**阴柔之男人**'。'三、本身想法动作一如男人，且主少年有成'。'四、**婚事延后六年**——故同时生人如为 26 岁婚，则此局人加六年，成为 **32 岁婚**'。**\" **复核（一步，可验）**：**\"二女\"＝**离**（中女）**、**\"正东\"＝**震**** → **离上震下＝**火雷噬嗑** ✓**（**与卦名完全吻合**）；**而同页\"名位不等\"栏亦注**：\"**二女居正东 → 名位不等**\" ✓**（**中女住长男之位，名与位不符**）。**须说明（两层）**：**①\"**看不惯就想咬谁一口**\"是全册最生动的一句人格描写**（**它写的不是\"脾气差\"，而是**控制不住的评判欲****）——**而\"自我要求高、坚忍不拔\"与它是同一件事的两面**；**②\"**婚事延后六年**\"这条极具体**（**\"同时生人 26 岁婚，此局人 32 岁\"**）——**⚠ 而\"延后六年\"这个数，与前面\"早婚提前四年\"、\"嫁二婚夫再加六年\"一样，都是一种**可核但不成立的定量****（**它让读者以为误差是可控的**）。** **⚠ 须标**：**\"报复手段常用咬人\"这一条，把\"攻击性\"写成了性格特征**——**而若真有一位成年人\"常用咬人\"来处理冲突，那不是命理问题，是**需要处理的情绪与行为问题**。","o":"TJ-0904 · 天纪·紫微详解·第四章卦象详解·火雷噬嗑·性格／地脉道（PDF 第191页）"},{"t":"四百二十二、\"但须与寡母同住一起，方成此局\"","h":"一个极具体的\"成局条件\"，与一句诚实的\"不知道\"","c":"要点——**噬嗑卦\"地脉道\"的第五条，给了一个极具体的附加条件，而后半句是全册**最诚实的一次\"不知道\"****：\"**'五、**事业非常顺利**，但如为**肖鸡之女性**逢之，其果必**坐吃山空**'。'吾人常见的有**未婚妾成此局**，也有**离婚之女成此局**——'**'**但须与寡母同住一起，方成此局**'。'**为何如此，学者须看录影带说明**'。**\" **须说明（三层）**：**①\"**须与寡母同住一起，方成此局**\"这一条，是极具体的**成局条件****（**它把\"住哪个房间\"加上了\"和谁一起住\"**）——**⚠ 而这一层其实说明了一件重要的事：**这套方法的\"应验\"，往往依赖**事后可观察的家庭结构****（**\"寡母同住\"是一个能查的事实，而不是一个能推的结论**）；**②而\"**为何如此，学者须看录影带说明**\"这一句，是**全册极少见的\"承认没讲清\"****（**它把\"为什么\"推给了一份外部材料**）——**本集按语：这一句比任何断语都诚实**（**它承认了\"这条规则我给不出理由\"**）；**③⚠ 而\"**未婚妾成此局**\"\"**离婚之女成此局**\"这两句，把两种**已经发生的处境**写成\"符合此局\"**（**而顺序是反的：先有她们的经历，才被归进这一局**）。** **⚠ 本集态度**：**\"坐吃山空\"这四个字，用在一个\"事业非常顺利\"的人身上，本就是矛盾的**（**同一条里，前句说\"事业非常顺利\"，后句说\"坐吃山空\"，两者的前提完全不同**）。","o":"TJ-0905 · 天纪·紫微详解·第四章卦象详解·火雷噬嗑·地脉道（PDF 第191页）"},{"t":"四百二十三、\"足踏七星，位至极品\"","h":"两条须警告的断言","c":"风险——**噬嗑卦的\"先天\"与\"后天\"两栏，各有须警告的句子，须并录**。**先天**：\"**'生为**尾胎在豪门**'。'**足踏七星发男儿**'。'如果不是脚踏七星，变成**多败多成，为从商**'。'**如果脚踏七星，从官从武，位至极品**'。**\" **后天**：\"**'**清香一柱为夫君**（**太太非常强，先生比不过太太**）'。'所求未果，**逢鸡忧财**（逢到鸡年或属鸡的，要担心你的钱财）'。'**女命逢之，枯坐到老**'。'**求财如镜中月，可遇不遇**'。**\" **⚠ 本集处置（三层）**：**①照录**；**②⚠ 明确——\"足踏七星（脚底七痣）→ 位至极品\"是民间帝王传说**（**\"脚踏七星\"在相术里被说成\"真命天子\"之相**）——**而一个人的仕途，取决于能力、机会与制度**（**痣的数量与位置，与仕途无关**）；**③⚠ 而\"**女命逢之，枯坐到老**\"须标为最伤人的一句**（**它把一位女性的一生，预先判成了\"枯坐\"**）——**而\"枯坐\"这个词本身，就带着对独身与安静的贬抑**。** **⚠ 须同时标出这两栏里**可用的**：**\"**太太非常强，先生比不过太太**\"是一句极准的家庭描述**（**它不评价谁对谁错，只描述力量对比**）；**而\"**求财如镜中月，可遇不遇**\"是一个极好的比喻**（**它写的不是\"没有财\"，而是**\"看得见、抓不住\"**）——**而\"可遇不遇\"这四个字，比\"破财\"更准确地写出了那种**接近而未得**的处境**。","o":"TJ-0906 · 天纪·紫微详解·第四章卦象详解·火雷噬嗑·先天／后天（PDF 第191页）"},{"t":"四百二十四、第十九次验证：噬嗑\"饥人遇食\"","h":"\"幸得送饭又遇食\"","c":"数据——**噬嗑卦的文王金钱课，是本轮第十九次验证，须复核并记录其象与一处极细的图像解读**。\"**火雷噬嗑：○×○××○（**饥人遇食**）中平**\"。**复核（一步，可验）**：**①火雷噬嗑＝**离上震下****；**②离（阳、阴、阳）在上、震（阳、阴、阴）在下 → 六爻自下而上＝**阳、阴、阴、阳、阴、阳****；**③符号 ○×○××○ 自右向左读（○阳×阴）＝○（阳）、×（阴）、×（阴）、○（阳）、×（阴）、○（阳）→ **阳、阴、阴、阳、阴、阳**——**完全吻合 ✓**（**与爻题初九、六二、六三、九四、六五、上九逐字对上**）。**须说明（两层）**：**①至此\"自右向左\"已**十九次验证**（**增噬嗑**），**无一反例**；**②而\"**饥人遇食**\"这个象极好**：**\"运拙如同身受饥，幸得送饭又遇食，适口充腹心欢喜，忧愁从此渐消移\"**（**它写的不是\"富贵\"，而是**\"饿的时候有人送饭\"**——**而\"中平\"这个等级，恰好对应这个意思：**不算大吉，但足够解眼前的急**）。** **⚠ 而本卦\"人间道\"栏里有一处极细的图像解读，须单独记出**：**\"**右侧忧字不全，为无忧之意；喜字全，主有喜庆**——说明**喜多忧少**\"**（**它把\"字写得全不全\"当成了吉凶的判据**）——**本集照录，标为**图像式的象征读法，不作因果**。** **⚠ 另须标**：**同栏\"卦身为戊土，未入卦\"一句，是**体例上的一个技术脚注****（**它说明本卦的\"卦身\"不参与判断**）——**而这一层在本册其他卦里都没有交代**（**可见各卦的注解详略不一**）。","o":"TJ-0907 · 天纪·紫微详解·第四章卦象详解·火雷噬嗑·文王金钱课（PDF 第192页）  ---"},{"t":"四百二十五、\"同时生人会考试成绩不同\"","h":"这套体系对\"同八字不同命\"的核心解释","c":"要点——**贲卦\"地脉道\"的第四条，用一句话交代了整套地脉道**为什么能成立**，须完整照录**：\"**'四、此局以科甲、声名，故利考试'。'**同时生人会考试成绩不同，有人名落孙山——地理之格局影响深远矣**'。**\" **须说明（四层）**：**①这句话正面回答了一个必然会碰到的问题**：**如果按八字推命，同年同月同日同时生的人，命该一样**（**而现实中他们成绩不同、有人落榜**）——**讲义的答案极干脆：**不是命不同，是\"地理之格局\"不同****；**②于是\"地脉道\"在整套体系里就承担了一个**关键功能****：**它是\"同八字不同命\"这件事的**解释缺口填塞物****（**没有它，\"八字决定命运\"这句话会被一个同班同学当场推翻**）；**③而这一层其实**离真相很近**：**同八字的人确实结果不同，而差异**确实来自\"环境\"****（**家庭、学校、同伴、资源**）——**不同的是，讲义把\"环境\"窄化成了\"住哪个方位\"**，**而真实的\"环境\"要宽得多**（**且其中很大一部分**是可以被改变的**：**换个学校、换个班级、找一位好老师**）；**④⚠ 而须标**：\"**地理之格局影响深远**\"这一句，同时是这套体系**最容易被误用的地方****（**孩子成绩不好，先怪\"住的方位\"，而不是\"我陪他做了什么\"**）。** **本集按语**：**这一段的价值，**不在它给出的答案，而在它提出的问题**——**\"同八字不同命\"是一个真问题**（**而承认它是真问题，比假装它不存在要诚实**）。** **⚠ 若读者家里有孩子读书**：**可动的东西里，**\"陪伴的时间\"\"睡眠的规律\"\"有没有一个能问问题的老师\"**，比\"房间朝哪个方向\"更能决定成绩**。","o":"TJ-0908 · 天纪·紫微详解·第四章卦象详解·山火贲·地脉道（PDF 第193页）"},{"t":"四百二十六、\"内心充实，必舍外饰之道\"","h":"一处极好的观察","c":"要点——**贲卦\"地脉道\"开头，有一段关于\"修饰\"的观察，是全册最好的一处**反向推理**，须完整照录**：\"**'贲卦为求外饰之道——其之于人事，**惟男人居此局中成格**'。'**男子喜欢外饰，为其内心充实，必舍外饰之道，不会花心思刻意去修饰**'。'**有钱或高智慧之人，其外观往往很零乱，甚至衣服反穿而不自知**——**其原因在他根本不想花心思在这方面**'。**\" **须说明（三层）**：**①\"**内心充实，必舍外饰之道**\"这一句，是一个**极准的观察****（**它把\"打扮\"读成一种**注意力的分配**：**一个人把心思放在哪里，外表就会剩下多少**）；**②而\"**衣服反穿而不自知**\"这个细节极好**（**它不是\"邋遢\"，而是**注意力完全在别处****）——**本集按语：这一层在现实中**确实成立**（**很多极专注的研究者、创作者、手艺人，衣着都近乎\"随手抓\"**）；**③⚠ 而\"**有钱或高智慧之人，其外观往往很零乱**\"须加限定**（**这句话的**反面同样常见****：**很多有钱人极重外表，很多普通人极爱整洁**）——**它成立的**条件**是\"**心思在别处**\"，而不是\"有钱\"**。** **⚠ 另须标**：**同段四条里的\"**一、男身女态之象，性喜夸张矫作之服饰**\"须先拆开**：**\"喜欢打扮\"本身不是问题**（**它只是一种表达**）——**而\"男身女态\"这个说法把它读成了\"性别气质错位\"**（**这一层须明确：穿着与气质，不构成对一个人性别的判断**）。","o":"TJ-0909 · 天纪·紫微详解·第四章卦象详解·山火贲·地脉道（PDF 第193页）"},{"t":"四百二十七、\"贲卦会装\"","h":"一个极完整的社会人格画像","c":"要点——**贲卦\"性格\"第一段，用极短的篇幅画出了一类**在人群里极常见、也极吃得开**的人，须完整照录**：\"**'**贲卦会装**——特别能装的人'。'**内外不一，深藏不露**；处事谨慎，讲究实际；**言表不一**；**左右逢源，内外通吃**；**得过且过**；**运气不错**'。'健康方面主呼吸系统、眼睛、心脏等容易患病'。**\" **而同页\"名位不等\"栏补了一条极具体的断语**：\"**'男身女态，性静不动，**内实过刚**之象'。'**身体烫伤较多**，婚姻不成，兴科甲，考试大利'。**\" **须说明（三层）**：**①\"**会装**\"这两个字统领了后面七个短语**（**\"内外不一、言表不一、左右逢源、内外通吃\"是\"装\"的技术，\"深藏不露、得过且过\"是\"装\"的收益**）——**而\"**运气不错**\"是它的结果**（**一个人若人人不得罪、处处不表态，确实常能\"运气不错\"**）；**②而这一段的**锋利之处**在于它不评价**（**它不骂这种人是\"虚伪\"，只说\"运气不错\"**）——**而这恰恰是最让人不舒服的地方**（**因为读者可能认得这样的人，且知道他们确实过得不错**）；**③⚠ 而\"**身体烫伤较多**\"这一条，是全书最具体、也最无法解释的断语之一**（**\"三子居正南、火位\"→\"烫伤\"**，**从\"火\"到\"烫\"的联想是成立的**，**但把\"烫伤\"归因于\"住哪个房间\"，则越过了因果**）——**本集照录，标为意象式联想**。** **本集按语**：**\"会装\"与\"运气不错\"并置，说出了一个不太好听的现实**——**在关系密集的环境里，\"不表态\"往往比\"说真话\"更安全**（**而代价是：没有人真正认识你**）。","o":"TJ-0910 · 天纪·紫微详解·第四章卦象详解·山火贲·性格（PDF 第193页）"},{"t":"四百二十八、\"雨中扬帆而受阻\"","h":"一个极精的机制，与一句\"距离产生美\"","c":"要点——**贲卦\"人间道\"栏的图像解读里，有两处极精的比喻，须并录**。**其一（过度修饰）**：\"**'舟张帆行于江中，象征顺风顺畅'。'**水——雨中扬帆而受阻，说明修饰过度会适得其反**'。**\" **其二（距离）**：\"**'上面仙女于云中执桂，此乃**嫦娥爱少年而赠之以丹桂**也——**距离产生美**'。**\" **其三（定名）**：\"**'此为**猛虎负隅**之卦，**光明通泰**之象'。'**此卦缺少父母、子孙爻**'。**\" **须说明（三层）**：**①\"**雨中扬帆而受阻**\"是一个**极精的机制比喻****（**帆的作用是\"借风\"，而在雨里，帆越大、受的阻力越大**）——**它把\"修饰过度\"写成了一个**动力学的失败****（**不是\"不够美\"，而是\"美成了负担\"**）；**②\"**距离产生美**\"这四个字，是讲义从\"嫦娥在云中赠桂\"这个画面里读出的**，**而它极准**（**人与人的好感，确实需要一段距离来维持想象**）——**⚠ 而这句话在亲密关系里**是一把双刃剑**：**适度的距离产生美，过度的距离产生陌生**；**③⚠ 而\"**此卦缺少父母、子孙爻**\"一条，与前面观卦、蛊卦的\"缺爻\"一样，属于**结构标注****（**它说明这一卦在判断六亲时\"没有位置可用\"**）——**而\"缺\"这件事，在体系上应被读成\"不可断\"，而不是\"不好\"**。** **⚠ 另须标**：**卦辞\"贲：亨。小利有攸往\"，而\"象曰：山下有火，贲；**君子以明庶政，无敢折狱**\"**——**\"无敢折狱\"这四个字，是本卦最硬的一句告诫**（**它说：**把政事理清可以，但不要轻易断人罪责****）。","o":"TJ-0911 · 天纪·紫微详解·第四章卦象详解·山火贲·人间道（PDF 第193页）"},{"t":"四百二十九、\"因风雨剥蚀而脱落\"","h":"剥卦的两副面孔：一个字的字义，与一类人的画像","c":"要点——**剥卦（山地剥）的\"性格\"两段，一面解释字义、一面画人，须并录**。**其一（字义）**：\"**'山地剥卦，上卦为艮为山，下卦为坤为地——**地上有山，因风雨剥蚀而脱落**'。'**高山附地，高附于卑**，**阴盛阳衰，小人得势**'。'**衰势已成，不可逆转**。人离财散，求官失爵'。**\" **其二（画像）**：\"**'上艮下坤、二土比和，为**母子悦和之象**——家庭和睦、事业兴旺'。'**剥伪装——外表欢笑，内藏心机**；**笑面虎，笑里藏刀**；**壮大自己，蚕食同行，心狠手辣**'。'主反映灵敏、个性保守，胸无大志、多败少成，一生穷困潦倒'。'**害人者必害己**，所以难免遭小人陷害'。**\" **须说明（三层）**：**①\"**地上有山，因风雨剥蚀而脱落**\"是极好的字义解释**（**它把\"剥\"从\"剥夺\"这个动作义，转成了\"**剥蚀**\"这个过程义**）——**而\"剥蚀\"的特点是：**没有外力猛击，只是日复一日地掉****；**②而\"**外表欢笑、内藏心机、笑面虎、笑里藏刀**\"这一段，与\"剥蚀\"在**方向上是反的**（**\"剥\"是被侵蚀，而\"笑面虎\"是主动侵蚀别人**）——**同一卦被读成了\"被害\"与\"害人\"两种处境**（**而\"害人者必害己\"这一句，恰好把两头接上了**）；**③⚠ 而须标**：**\"**蚕食同行**\"这四个字，极准**（**它写出了一种最常见、也最难防的竞争方式**：**不是正面击败你，而是一点一点吃掉你的客户、你的资源、你的名声**）。** **⚠ 本集按语**：**读者若在职场中认出这一段**（**尤其是\"壮大自己、蚕食同行\"**），**可核的动作只有两件**：**一是把自己的成果留痕（文档、邮件、署名），二是别把关键资源交到一个\"只会笑\"的人手里**。** **⚠ 另须标**：**\"求官失爵\"应为**\"失爵\"****（**原文排作\"矢爵\"，属讹字**；**本集照录原文，标其正字**）。","o":"TJ-0912 · 天纪·紫微详解·第四章卦象详解·山地剥·性格（PDF 第195页）"},{"t":"四百三十、\"冠巾挂在树枝上\"与\"蜡烛在风中摇曳\"","h":"两处极精的图像解读","c":"要点——**剥卦\"人间道\"栏的图像解读，是全册最像\"看图说话\"的一段，而其中两处极准，须照录**：\"**'山下有一官人独坐——**冠巾挂在树枝上**，说明他**已无职位，归隐山林**；又表明要去旧迎新'。'官人前面的空地上有**一束乱丝**，象征**事情繁难，难以收拾**'。'又有一个**药葫芦**，为盛药用具，说明有**弊病需要整治**'。'**剥卦为去旧生新之卦，群阳剥尽之象**。此卦缺兄弟爻'。**\" **而另一段**：\"**'图中有一**妇人坐于床边**，说明需防**女人或小人得势**、处于高位'。'**蜡烛在风中摇曳，明灭不定**，说明**局势一发千钧**'。**\" **须说明（三层）**：**①\"**冠巾挂在树枝上**\"这个细节极好**（**帽子是官位的符号，挂在树上＝不戴了**）——**而它被读出\"归隐山林\"**（**一层动作，两层意思**）；**②\"**一束乱丝**\"这个象更好**（**丝线乱了，越拉越紧、越扯越死**）——**而\"难以收拾\"这四个字，恰好是\"乱丝\"的**物理特性****（**不是\"事情多\"，而是\"**已经缠在一起了**\"**）**；**③\"**蜡烛在风中摇曳、明灭不定**\"这一句，把\"局势\"写成了一个**视觉画面****（**而\"一发千钧\"这四个字，与\"摇曳\"连起来，意思就更重了：**不是\"危险\"，而是\"随时可能熄\"**）。** **⚠ 须单独标出第二段的那一句**：\"**需防女人或小人得势**\"**——**把\"女人\"与\"小人\"并列，是一个极严重的语言问题**（**它把\"女性掌权\"本身，读成了一件需要防范的事**）——**本集明确：这句话里\"需防\"的对象，应当是\"**任何以不正当手段得势的人**\"，**与性别无关**。","o":"TJ-0913 · 天纪·紫微详解·第四章卦象详解·山地剥·人间道（PDF 第195页）"},{"t":"四百三十一、\"长弓之人在此，姓江的排第一\"","h":"一组拆字与姓氏的断法","c":"要点——**贲卦的\"先天／后天／流年\"三栏，给了一组极具体的\"拆字断姓\"法，须完整照录**。**先天**：\"**'天生英名为官带，出使四方为人重。前途有人助，不须去问津'。'**长弓之人**'。'**行巷道，排列第三**；不出江中，术中定'。'**逢到姓江，排列第一**'。**\" **后天**：\"**'**平步青云，位至三公**。禄命天上来。声名远播'。**\" **流年**：\"**'男女同心。升官迁动。待势而发，此行大利。逢科甲高中'。'**长弓行险路——终凶！**'**\"。** **复核（一步，可验）**：**\"**长弓**\"即\"**张**\"字的拆解**（**张＝弓＋长 ✓**）——**与前面临卦\"防长弓＝防姓张的人\"**同一手法** ✓。**须说明（三层）**：**①这是本册**第二次**用\"长弓→张\"，**而这一次的结论是\"终凶\"**（**临卦说\"防长弓、暗渡陈仓\"，贲卦说\"长弓行险路、终凶\"**）——**两处对\"张姓\"的判断，都是负面的**；**②而\"**姓江的排第一**\"这一条，把\"江\"字与\"第一\"连起来**（**字形的\"三点水＋工\"与\"第一\"没有明显关联**，**本集照录，标其不可解**）；**③⚠ 而须标**：**用姓氏断吉凶，是本册**最需要警惕的一类**——**因为它直接落在具体的人身上**（**一位姓张的读者读到\"终凶\"，会怎么想？**）——**本集态度**：**一个人的姓氏，不是关于他的任何判断**。** **⚠ 可用的一层**：**\"**行巷道，排列第三**\"这类句子，其实是**签诗式的谜语****（**它的乐趣在\"猜\"，而不在\"断\"**）——**若当作文字游戏来读，是有意思的；若当作预言来用，则有害**。","o":"TJ-0914 · 天纪·紫微详解·第四章卦象详解·山火贲·先天／后天／流年（PDF 第193页）"},{"t":"四百三十二、第二十次验证：贲卦\"喜气临门\"","h":"\"窈窕淑女君子求\"","c":"数据——**贲卦的文王金钱课符号，是本轮第二十次验证，须复核**。\"**山火贲卦：○××○×○（**喜气临门**）中上**\"。**复核（一步，可验）**：**①山火贲＝**艮上离下****；**②艮（阴、阴、阳）在上、离（阳、阴、阳）在下 → 六爻自下而上＝**阳、阴、阳、阴、阴、阳****；**③符号 ○××○×○ 自右向左读（○阳×阴）＝○（阳）、×（阴）、○（阳）、×（阴）、×（阴）、○（阳）→ **阳、阴、阳、阴、阴、阳**——**完全吻合 ✓**（**与爻题初九、六二、九三、六四、六五、上九逐字对上**）。**须说明（两层）**：**①至此\"自右向左\"已**二十次验证**（**增贲卦**），**无一反例**；**②而签文极有意思**：**\"**时来运转锐气周，窈窕淑女君子求**——钟鼓乐时大吉庆，占者逢之喜临头\"**（**\"窈窕淑女君子求\"直接引自《诗经·关雎》**，**可核其用典 ✓**）——**而\"中上\"这个等级，与\"喜气临门\"这个名字是一致的**（**不是\"大吉\"，而是\"喜事来了\"**）。** **⚠ 须标**：**同组\"诗曰：课逢吉神在运中，**纵有凶出不为凶**\"这一句，须加警惕**（**\"纵有凶出不为凶\"，等于取消了\"凶\"的意义**）——**而这正是这套签诗最需要被识破的地方**：**吉签说\"有凶也不怕\"，凶签说\"忍一忍就过\"，两头都兜住了**。","o":"TJ-0915 · 天纪·紫微详解·第四章卦象详解·山火贲·文王金钱课（PDF 第194页）  ---"},{"t":"四百三十三、\"与夫之对应局为无妄卦\"","h":"同一间房，夫住与妻住，是两卦","c":"方法——**复卦\"地脉道\"的第五条，提出一个全册未出现过的新概念——**\"夫妻对应局\"**，须完整照录并复算**：\"**'地雷复卦：（**母亲居正东卧房**）'。'**已婚之妇，婚事不佳，独立支撑家运，能文能武，属木兰型之人，必为复卦之局**'。'五、**与夫之对应局为无妄卦**——故**夫妻必不和**'。**\" **复核（两步，全部可验）**：**①妻住正东**——**母＝**坤**（上卦）、**正东**＝**震**（下卦）→ **坤上震下＝**地雷复** ✓**（**与卦名完全吻合**）；**②夫住正东**——**夫＝**乾**（上卦）、**正东**＝**震**（下卦）→ **乾上震下＝**天雷无妄** ✓**（**与原文\"对应局为无妄卦\"完全吻合**）。**须说明（三层）**：**①这是一个极干净的对照**：**同一间正东的屋子，**妻住出\"复\"、夫住出\"无妄\"****（**下卦恒为震，上卦随人变（坤／乾）**）——**这是\"变卦＝人＋位\"第二十次复算成功**；**②而\"**对应局**\"这个概念，把\"两个卦\"配成了**一对关系****（**它不是\"你是什么卦\"，而是\"**你和你丈夫各自是什么卦，合起来是什么\"**）——**这在体系上是**向上叠了一层****；**③而它推出的结论极重**：**\"**与夫的对应局为无妄，故夫妻必不和**\"**（**即：不是\"某一方有灾\"，而是**两个卦配不到一起**）。** **⚠ 须标**：**这一层其实是整套地脉道**最精巧**的地方，也是最容易滑向**宿命**的地方**（**因为它把\"两个人的关系\"，写成了\"两个卦象的配对\"**）——**而一旦这样写，婚姻的好坏就不再是\"两个人怎么相处\"，而是\"两个卦配不配\"**。","o":"TJ-0916 · 天纪·紫微详解·第四章卦象详解·地雷复·地脉道（PDF 第197页）"},{"t":"四百三十四、\"其因乃生于妻志过丈夫\"","h":"一句极准的判断，与一个须修正的推断","c":"要点——**同一条紧接着给了\"必不和\"的理由，而这个理由本身极值得细读，须完整照录**：\"**'其因乃生于**妻志过丈夫**，**丈夫无法与其匹配**'。'**屋漏偏逢连夜雨**——加上夫有官司是非缠身，所以对婚姻来说是**加凶**'。**\" **须说明（三层）**：**①\"**妻志过丈夫，丈夫无法与其匹配**\"这一句，是全册**最准确的一句关于婚姻矛盾的说法****（**它没有说\"妻太强不好\"，而是说**\"两个人不匹配\"****）——**而\"匹配\"这个词，比\"强弱\"公允得多**（**一个强妻子配一个自在的丈夫，可以过得很好；配一个需要\"压过对方\"的丈夫，就必然冲突**）；**②而\"**屋漏偏逢连夜雨**\"这个比喻极好**（**它说的不是\"一个原因\"，而是\"**几个不利条件叠在一起**\"**：**妻子比丈夫强 ＋ 丈夫有官司缠身**）；**③⚠ 而\"**故夫妻必不和**\"这个结论须否定其\"必\"字**（**\"妻志过丈夫\"本身不导致不和**）——**真正导致不和的，是**两个人都想在这段关系里做\"更强的那一个\"****。** **⚠ 本集按语**：**这一段最值得留下的是\"**匹配**\"这两个字**（**而不是\"复卦\"或\"无妄卦\"**）——**若读者正处在\"我比他强\"的关系里**，**可问自己一句**：**我要的是一个\"能被我照顾的人\"，还是一个\"能与我并肩的人\"**（**这两个愿望都合理，但它们要求不同的伴侣**）。","o":"TJ-0917 · 天纪·紫微详解·第四章卦象详解·地雷复·地脉道（PDF 第197页）"},{"t":"四百三十五、\"只可守株待兔，不可缘木求鱼\"","h":"全册最好的一条\"止损\"建议","c":"要点——**剥卦\"先天\"栏的末尾，给了一条极短、极实用的行动建议，须完整照录**：\"**'家人离，财禄散。生不逢时，天注定；父母失和，人丁少'。'性情孤僻。**志善变，行事取巧**。**事倍功半**！'。'**化解方法：只可守株待兔，不可缘木求鱼**'。**\" **须说明（三层）**：**①这一条把两种动作对举，而两个成语都用得极准**：**\"**守株待兔**\"＝待在原地等**（**它承认此刻\"主动出击\"没有胜算**）；**\"**缘木求鱼**\"＝爬到树上去抓鱼**（**它不是\"努力不够\"，而是**方向根本错了****）；**②而它出现在\"剥\"卦里，是极合理的**（**\"剥\"是流失之象**，**在流失中乱动，只会失得更快**）；**③⚠ 而\"**守株待兔**\"须加一层限定**（**等待不等于放弃**）——**本集按语：在\"剥\"的局面里，可做的是**三件\"不亏\"的事**：**不再加码、不再借出、把已经有的守住**（**而\"什么都不做\"与\"只做不亏的事\"，是两回事**）。** **⚠ 而\"**事倍功半**\"这四个字，是\"志善变、行事取巧\"的直接后果**（**心志常变，所以每件事都要重来；行事取巧，所以每件事都欠一层根基**）——**这一层脱开命理完全成立**。","o":"TJ-0918 · 天纪·紫微详解·第四章卦象详解·山地剥·先天（PDF 第195页）"},{"t":"四百三十六、\"富不过三代\"与\"性毒暗生\"","h":"一个极精的概括，与一条须警告的断言","c":"要点——**剥卦\"地脉道\"的开头与五条，须并录，其中一条极重**。**开头**：\"**'**剥有耗尽之象**——有人**家财万贯，但出一子耗尽家财**，所谓**富不过三代**'。'如三人结拜兄弟后，长幼有序分列，此时如剥卦现，则其中一人**必散尽三人之财**，**终至引发自杀或仇杀事件**，其因皆为财'。**\" **五条**：\"**'一、主**耗破家业，伦理丧失，伤风败俗**。二、**性毒暗生，害人而人不知**。三、婚事不成。四、科甲不顺，考试必败。五、**身体灾病多，折损阳寿**'。**\" **须说明（三层）**：**①\"**富不过三代**\"是一个极精的概括**（**而它脱开命理成立**：**家族财富的耗散，通常来自\"继承人能力与所掌资源不匹配\"**）——**而\"出一子耗尽家财\"这一句，把长期的结构问题，压到了**一个人**身上**；**②\"**性毒暗生，害人而人不知**\"是全册最准的一句关于\"恶\"的描写**（**它写的不是\"明着坏\"，而是**\"坏在没人看见的地方\"**）——**而\"害人而人不知\"这五个字，正是这类伤害最难防的原因**；**③⚠ 而\"**终至引发自杀或仇杀事件**\"须最高级警告**（**它把\"家庭财务纠纷\"预写成\"血案\"**）——**而这句话对当事人是**极重的暗示****（**本集按语：家庭财务冲突的真实解方是**早点说清、写下书面、必要时走法律程序**，不是\"等它变成血案\"**）。** **⚠ 若读者正处在家产纠纷中**：**可做的事是**留证据、走流程、找律师**——**而\"自杀或仇杀\"这样的叙事，只会让所有人更绝望**；**如情绪已到危险边缘，请拨**12356**（心理援助）或**110****。","o":"TJ-0919 · 天纪·紫微详解·第四章卦象详解·山地剥·地脉道（PDF 第195页）"},{"t":"四百三十七、\"即令流年红鸾星动，亦无法成婚\"","h":"一处极重要的\"层级声明\"","c":"要点——**剥卦\"地脉道\"的第三条，是一句关于**体系内部优先级**的声明，须单独抄出**：\"**'三、婚事不成——**同时生人即令流年红鸾星动，亦无法成婚**'。**\" **须说明（三层）**：**①这句话的意思是**清楚**的：**\"地脉道\"的效力，**高于\"流年星曜\"****（**即：即使今年的星象指向\"该结婚\"，只要住错了方位，就结不成**）；**②而这一条在本册的方法论上**极关键**：**它把\"地脉道\"放在了**第一顺位****（**前面\"38 岁换房就不结婚\"那一段，正是这条规则的实例**）——**⚠ 而这也说明，为什么全册反复讲\"改阳宅\"：**在这套体系里，改房子比等流年更有用**；**③⚠ 而须标**：**这一层同时使整套体系**更难被证伪****（**因为任何\"没应验\"，都可以归给\"住错了方位\"**）——**而\"住错了\"这件事，事后总是能找出来的**。** **本集按语**：**这一段最值得记的，不是\"哪个优先\"，而是它**暴露了这套体系的一个结构性弱点****：**当一个解释可以无限吸收\"失败\"，它就无法再从失败中学到任何东西**。","o":"TJ-0920 · 天纪·紫微详解·第四章卦象详解·山地剥·地脉道（PDF 第195页）"},{"t":"四百三十八、\"不知林内先有莺\"","h":"一个极好的象，与一句极准的关系反转","c":"要点——**剥卦的文王金钱课签文，写了一个极生动的场景，须完整照录**：\"**山地剥卦：○×××××（**鹰雀同林**）下中**\"。**象曰**：\"**'**雀遇天晚宿林中，不知林内先有莺**——**莺见小雀生恶意**，卦若逢之**事非轻**'。**\" **诗曰**：\"**'**莺雀同林不相合**，占者逢之琐碎多——**恩人无义反为怨，是非平地起风波**'。**\" **断曰**：\"**'**先难后易**，谋事不利；**交过节令，忧愁变喜**'。**\" **须说明（三层）**：**①\"**雀遇天晚宿林中，不知林内先有莺**\"是一个极好的象**（**它写的是\"投宿\"这件事里最危险的一种**：**你以为找到的是落脚处，其实你是闯进了别人的地盘**）——**而\"不知\"两个字，正是危险所在**；**②\"**恩人无义反为怨**\"这一句，极准**（**它写的是关系里最常见的反转**：**帮过你的人，后来成了怨你的人**——**而这在现实中确实常见**：**帮过一次，第二次没帮，就成了\"不是好人\"**）；**③\"**先难后易、交过节令，忧愁变喜**\"这一句，与\"下中\"这个等级是配的**（**它说的不是\"大凶\"，而是\"**先难，过了节令会好**\"**）。** **⚠ 须标**：**\"莺见小雀生恶意\"这一句，把\"主人\"预设成了\"必然敌意\"**（**而现实中，投宿者也可能遇到善意的主人**）——**这一条签文的底色，是**防备**，而不是**判断**。","o":"TJ-0921 · 天纪·紫微详解·第四章卦象详解·山地剥·文王金钱课（PDF 第196页）"},{"t":"四百三十九、\"不是极左，就是极右\"","h":"一个极准的画像，与一句可核的卦象","c":"要点——**复卦的\"性格\"两段，一面画人、一面解象，须并录**。**其一（画像）**：\"**'上坤下震、木克土。个性**思想细致、做事谨慎、精于计划**、有辅佐之才；**性格急，容易冒进**，一生不得志'。'**复卦为反复，反反复复**——**遇到麻烦事不取中庸之道，不是极左、就是极右，从一个极端走向另一个极端**'。'**争强好胜，外强中干、内心柔弱**，常常受情绪左右，萎靡消极，易患肠胃消化之疾'。**\" **其二（解象）**：\"**'震在下为雷、为动；坤在上为地、为顺——**动则顺，顺其自然**，进退自如，反复徘徊，内悦外顺，出入无咎'。'迁官益财，**失而复得，往而复来**'。'**一阳复起，阳刚始生，万物亨通**'。**\" **复核（一步，可验）**：**地雷复＝**坤上震下****（**上卦坤、下卦震**）；**震（阳、阴、阴）在下 → 六爻自下而上＝**阳、阴、阴、阴、阴、阴****（**初爻为阳、其余五爻皆阴**）——**正是\"**一阳复起**\"** ✓（**与爻题初九、六二、六三、六四、六五、上六完全吻合**）。**须说明（三层）**：**①\"**遇到麻烦事不取中庸之道，不是极左就是极右**\"是极准的一句人格描写**（**它写的不是\"偏激\"，而是**\"无法停在中间\"**\"**）——**而\"反复\"这个卦名，恰好就是这种状态的写照**；**②\"**一阳复起，阳刚始生，万物亨通**\"这十二个字，是全册对\"复\"最正面的解释**（**它把\"一阳\"读成\"**希望刚起头**\"**）——**而这也正是\"复\"的本义：**不是\"回去\"，而是**\"重新开始\"**；**③⚠ 而须标**：**\"复卦为唐太宗归天，卜得后七日复苏\"这个典故，与卦辞\"**七日来复**\"呼应**（**而\"七日\"在中国术数里是一个特殊周期**，**本集照录其说，不作实指**）。","o":"TJ-0922 · 天纪·紫微详解·第四章卦象详解·地雷复·性格（PDF 第197页）"},{"t":"四百四十、\"乃因女子害\"与\"女命防夫\"","h":"三条须警告的性别归罪","c":"风险——**剥卦的\"后天\"与\"流年\"两栏，把\"事情不顺\"归给\"女人\"，须照录并警告**。**其一**：\"**'退早无功，仍缠讼。**阴人生害不自知**。**尤以富阴更可怕**。**知人知面不知心**。守成不逾距。**一动贪念必遭凶**！'**\"。**其二**：\"**'婚事不成，科甲不中。**愈理愈乱（不要理他）**——**乃因女子害**。**女命防夫（克夫）**，闭门造车，自食其果！'。'爽字，测字为，**凶多吉少**！'**\"。** **⚠ 本集处置（四层）**：**①照录**；**②⚠ 明确否定\"乃因女子害\"\"女命防夫（克夫）\"**：**这句话把一段时期内的不顺，归因于\"女人\"**（**而\"克夫\"这两个字，是传统术数里对女性最重的一种指控**）——**⚠ 而它的实际伤害极具体**：**一个读到\"我克夫\"的女性，可能在丈夫生病时，先怪自己**（**而疾病的原因，是病理，不是她**）；**③⚠ 须标\"**阴人**\"这个词的歧义**（**在术数里，\"阴人\"可指\"女人\"，也可指\"阴险之人\"**）——**而\"尤以富阴更可怕\"这一句，无论取哪一义，都带着对\"有钱的女性\"的敌意**；**④⚠ 本集态度**：**\"事情不顺\"的原因，通常具体且可查**（**是流程错了、是人选错了、是时机不对**）——**而\"归给某一类人\"，是最省力、也最有害的一种解释**。** **⚠ 而这两栏里有一句极实用，须单独留下**：**\"**愈理愈乱（不要理他）**\"**（**有些事情，越处理越糟**，**而\"暂时不处理\"是一个正当的选择**）——**这一句与前面\"只可守株待兔\"是同一种智慧**。","o":"TJ-0923 · 天纪·紫微详解·第四章卦象详解·山地剥·后天／流年（PDF 第195页）  ---"},{"t":"四百四十一、小六壬：三步可复算的完整算法","h":"一个新的占法系统，而它的算术是干净的","c":"方法——**第六章首次引入\"六壬法\"（又称\"小六壬\"\"诸葛马前课\"），并给出了一套**三步俱全、可逐步复算**的操作**，须完整照录并逐步核算**。**原文例**：\"**'例如：我预测明天去旅游情况如何？——先给出一时间，如明天上午 8 点（8 点为**辰时**），明天是**阴历十月二十日辰时**'。'① 先从**大安起月**开始，顺时针从一数到十（十月）：大安 1 月－留连 2 月－速喜 3 月－赤口 4 月－小吉 5 月－空亡 6 月－大安 7 月－留连 8 月－速喜 9 月－**赤口 10 月**，十月是赤口'。'② 然后再从赤口上起日期顺数：赤口初 1－小吉初 2－……－小吉 14－空亡初 15－……－赤口 19－**小吉 20**'。'③ 再从小吉起子时数到辰时：小吉子－空亡丑－大安寅－留连卯－**速喜辰**，辰时是速喜'。'**所以此次旅游非常顺利**'。**\" **复核（三步，本集逐步算，全部吻合 ✓）**：**①月：**六格循环、大安起 1**——**10 mod 6＝4 → 第 4 位＝**赤口** ✓；**②日：**赤口起 1**——**20 mod 6＝2 → 第 2 位＝**小吉** ✓；**③时：**小吉起子（第 1 位）**——**辰为第 5 位（子丑寅卯辰）→ 第 5 位＝**速喜** ✓。**须说明（三层）**：**①这套算法**极其简洁**：**六格循环，起于大安，落于某格**（**三步\"月→日→时\"，每一步都\"从上一结果起、数到位\"**）——**而它的**每一步都能被独立验算****（**这与前面那些\"讲过就算\"的断语完全不同**）；**②而它给出了**时机的量化**：\"**大安大概一个礼拜左右**\"、\"**小吉大概两个礼拜以后会看到**\"**（**这是全册少见地把\"多久\"写出来的地方**）；**③⚠ 而须标**：**\"结果只有六种\"这件事本身就是它的局限**（**人生的问题无穷，而答案被压缩成六类**，**于是\"吉凶\"必然是**粗粒度的****）——**而\"速喜＝见效较快\"\"空亡＝不用找了\"这类判语，仍是**无据的断言**。** **⚠ 附其\"用阳历也行\"的说明**：**'时间尽量用阴历为好，用阳历也行，准确度低一些罢了；默选时辰既可以是当时预测的时辰（比较精确），第二种是随便指认一个时辰'**——**这一句其实承认了：**同一件事，换一个\"时辰\"起算，结果就会变**。","o":"TJ-0924 · 天纪·紫微详解·第七章六壬法·指算法（PDF 第202~203页）"},{"t":"四百四十二、六神的配置：五行与六兽","h":"一套可核的对应，与一处替换","c":"数据——**六壬法给出六个\"神\"的完整配置（五行、六兽、数字、方位、象征），须列表照录并核其一致性**。**六神表（原文照录）**：**①**大安**——\"身不动时，**属木青龙**，凡谋事一五七（属四肢），贵人西南，冲犯东方\"**；**②**留连**——\"人未归时，**属水玄武**，凡谋事二八十（属肾胃），贵人南方，冲犯北方\"**；**③**速喜**——\"人便至时，**属火朱雀**，凡谋事三六九（属心脑），贵人西南，冲犯南方\"**；**④**赤口**——\"官事凶时，**属金白虎**，凡谋事四七十（属肺胃），贵人东方，冲犯西方\"**；**⑤**小吉**——\"人来喜时，**属木六合**，凡谋事一五七（属肝肠），贵人西南，冲犯东方\"**；**⑥**空亡**——\"音信殊时，**属土勾陈**，凡事谋三六九（属脾脑），贵人北方，冲犯南地\"**。**须说明（三层）**：**①五行分布**：**木×2（大安、小吉）、水×1、火×1、金×1、土×1**——**五行齐全，但\"木\"多一个**（**而\"大安\"与\"小吉\"共用\"一五七\"这组数**，**说明这两神在**数字层面是同一组****）；**②**六兽**用的是**青龙、朱雀、勾陈、白虎、玄武、六合**——**⚠ 而传统\"六兽\"为青龙、朱雀、勾陈、**腾蛇**、白虎、玄武**（**这里以\"**六合**\"替换了\"**腾蛇**\"**）——**\"六合\"本是**地支相合**的概念（子丑、寅亥……），**不是六兽之一**（**本集照录其配置，并标此替换**）；**③\"贵人某方、冲犯某方\"这一组，构成**六个方位**（**西南×3、南方、东方、北方**）——**⚠ 而\"冲犯\"的方位与\"贵人\"的方位，在六神里并不总是相对**（**如速喜\"贵人西南、冲犯南方\"**，**两者不是对冲**），**故这一组更像**口诀式的罗列**，而非可推的方位系统**。** **⚠ 须标**：**\"小孩婆姐六畜惊\"\"大人青面阴神\"这类句子，属于**民俗意象**（**\"婆姐\"是民间信仰里的**护幼神**，\"阴神\"\"土压夫人\"亦是）——**本集照录，标其为民间信仰层，不作因果**。","o":"TJ-0925 · 天纪·紫微详解·第七章六壬法·六神口诀（PDF 第203~204页）"},{"t":"四百四十三、西南主卧室：男人住凶，女人住吉","h":"\"变卦＝人＋位\"第二十一次复算，且是最直白的一例","c":"数据——**第十五例的阳宅分析，给出了全册**最直白的一次\"同一间房、不同人住、结果相反\"**，须完整照录并复算**：\"**'**西北角是厨房**，边上是厕所——**男人不利**'。'**西南角是主卧室**——**男人住是天地否**，**对男主不利**'。'**但是是女主人的正位，是家中妻子的位置——太太会正她的名，她就会做事业当老板**'。**\" **复核（一步，可验）**：**\"男人住西南是一个天地否\"**——**男（夫）＝**乾**（上卦）、**西南**＝**坤**（下卦）→ **乾上坤下＝**天地否** ✓**（**与原文自注的\"天地否\"完全吻合**）。**须说明（四层）**：**①这是\"变卦＝人＋位\"**第二十一次复算成功****（**也是全册最直白的一例：**同一个西南主卧，男人住出\"否\"（闭塞），女人住则\"正她的名\"**）；**②而\"否\"这个卦名的意思，正是\"不通\"**（**天地否＝乾上坤下，天在上、地在下，二者**不相交****）——**而\"名位不相等\"正是\"不相交\"的另一种说法**；**③所以这一段的真正内容**不是\"西南克男人\"，而是\"**一个男人住进了妻子的正位**\"**（**他的角色被放错了地方**）——**⚠ 而这一层其实**脱开命理成立**：**一个男人在家庭里站到了\"妻子该站的位置\"，家里的秩序就会拧**（**而这个\"拧\"的表现，往往是**他不舒服、她也不舒服**）；**④而\"**太太会正她的名，她就会做事业当老板**\"这一句，把\"正名\"与\"能做事业\"连起来**（**\"名位相等\"这个概念的前文多次出现**，**\"正名\"是它的另一个说法**）——**这一层也成立**：**一个人在家里被确认为\"这一个位置的主人\"，她在外面做事也会更有底气**。** **⚠ 须标**：**\"西北角是厨房、边上厕所，男人不利\"一条，仍是无据的**（**本集不采其因果**，**但\"厨房贴着厕所\"在居住体验上确实不佳**——**这一层是可讨论的实用问题，与\"克谁\"无关**）。","o":"TJ-0926 · 天纪·紫微详解·第五章紫微十二宫详解·第十五例·阳宅（PDF 第199页）"},{"t":"四百四十四、\"杀星独守一宫，凶；与吉星同会，凶大减\"","h":"一条难得的\"条件化\"规则","c":"要点——**第十五例对\"孤星独守\"给了一条**带条件、不带绝对化**的判法，须完整照录**：\"**'父母宫：是空宫，表示**无祖业**。地劫陷，**孤星独守**在丑宫——**本宫凶、对宫更凶**'。'比如：流年走到孤杀星的**对宫**，就表示这一年是凶。**为什么凶？要看八字来决定**'。'**杀星独守一宫，一定要引起高度重视**；**如果杀星与吉星同会一宫，凶大减，无问题不大**'。**\" **须说明（三层）**：**①\"**杀星独守 → 重视；杀星与吉星同会 → 凶大减**\"这一条，是全册少见的**条件化表述****（**它没有说\"见杀星必凶\"，而是说\"要看有没有吉星同宫\"**）——**⚠ 而这恰恰暴露了这套方法的**弹性**：**同一个\"杀星\"（七杀、破军、擎羊、陀罗、火星、铃星），**独自一宫是\"高度重视\"，与吉星同宫就\"问题不大\"**——**于是无论结果如何，都能找到对应的说法**；**②\"**本宫凶、对宫更凶**\"这一层，把\"对宫\"也纳入了判断**（**即：一个凶位的影响，会通过\"对宫\"放大**）——**而在紫微斗数里，\"对宫\"确实是被反复引用的关系**（**这一层属于体系内部的规则，本集照录**）；**③\"**为什么凶？要看八字来决定**\"这一句，是**跨系统调用****（**盘与八字互相印证**）——**而这一层使判断的**变量进一步增加****（**前面\"宫干飞化\"已引入上百次四化，这里再叠加八字**）。** **⚠ 本集按语**：**这一段最值得记的是它**暴露的机制**——**当\"凶\"与\"吉\"都能被条件吸收，判断就无法被推翻**（**而这，正是这类体系能长期存活的真正原因**）。","o":"TJ-0927 · 天纪·紫微详解·第五章紫微十二宫详解·第十五例·父母宫（PDF 第200页）"},{"t":"四百四十五、\"命好不代表婚姻也好\"","h":"一句极重要的区分，与\"三奇嘉会\"","c":"要点——**第十六例同时给出了\"最好的命\"与\"最难的婚姻\"，而讲义自己把这两件事分开了，须并录**。**其一（好命）**：\"**'此命**科权禄三会**，也叫**三奇嘉会**——财化科、官化禄、迁化权，身在官禄宫'。'**他一定是一方之主**——科权禄的命很厉害'。'这位太太是一位**学校的校长**；**他不会干、又不屈居人下**，是**一个地方的老大**，**是诸侯的命**'。**\" **其二（难婚）**：\"**'**命好不代表婚姻也好**——**太阳化忌，婚姻就不好**；**女人太阳是陷地，生活的好累啊**'。'**太阳星在丑宫子女宫化忌、又遇到陷地**——①她本身**不会生到儿子**；②这段时间她**根本没有丈夫**'。'原因：**天喜宫化忌、红鸾星被冲**——所以**前面没有婚姻、中间没有婚姻、现在也没有婚姻**'。**\" **须说明（三层）**：**①\"**命好不代表婚姻也好**\"这一句，是全册**最有用的一句区分****（**它把\"事业\"与\"婚姻\"拆成了两条独立的线**）——**而这一层**完全成立**：**一个极能做事的人，常常在亲密关系里投入不足**（**不是因为命，是因为时间与精力只有一份**）；**②\"**三奇嘉会**\"（化科、化禄、化权三星会照）是紫微里的**顶级格局之一**，**而讲义对它的描述极准**：\"**不会干、又不屈居人下**\"**（**这八个字写出了一个\"天生的负责人\"**）；**③⚠ 而\"**前面没有婚姻、中间没有婚姻、现在也没有婚姻**\"这三重否定，读起来极重**（**它把一个人一生的情感史，压缩成了一句判决**）——**⚠ 而\"她不会生到儿子\"这一条，须明确**：**生育能力取决于双方的身体条件与年龄**，**不取决于哪颗星落哪一宫**。** **本集按语**：**这一段最值得留下的是那八个字**——**\"不会干、又不屈居人下\"**（**它说的是：**一个不肯居于人下的人，往往也不肯在关系里\"让一步\"****）——**而这一层，才是\"事业极好、婚姻极难\"最常见的真实原因**。","o":"TJ-0928 · 天纪·紫微详解·第五章紫微十二宫详解·第十六例·命格／夫妻宫（PDF 第201~202页）"},{"t":"四百四十六、\"1983 年（癸亥）已经 51 岁\"？","h":"一处可核的年份与岁数冲突","c":"数据——**第十六例有一处\"生年—求测年—岁数\"三者对不上，须逐步核算并标错**。**原文**：\"**'此命是 **1944 年生甲申**，女戌宫起小限逆转，**她来时是 1983 年（癸亥）已经 51 岁了**'。**\" **复核（三步，全部可验）**：**①生年——民国 33 年＝1911＋33＝**1944** ✓**（**与原文一致**；**1944 尾数 4 → 天干**甲** ✓**，**故\"1944 年生甲申\"正确**）；**②若求测年为 **1983**，则虚岁＝1983−1944＋1＝**40 岁****（**不是 51 岁**）；**③若岁数为 **51**，则求测年＝1944＋51−1＝**1994 年****（**而 1994 正是\"民国 83 年\"**——**与本册第十五例\"民国八十三年求测是 1994 年\"完全对应**）；**④干支核对——**1983 年尾数 3 → 天干**癸** ✓，**1983 确为**癸亥年** ✓（**干支本身是对的**）。** **须说明（三层）**：**①故这一句里，\"1983 年（癸亥）\"与\"51 岁\"**只能有一个成立****（**或应为\"**1994 年**\"，或应为\"**40 岁**\"**）——**二者相差整整 11 年**；**②这是本册**第三处\"年份与岁数冲突\"**（**前两处：第八例\"1958 年来求测＝她才十岁\"、第五例\"民国 83 年虚岁 38 应 37\"**）——**而三处都出在**同一类位置**：**\"她来时是某年、已经某岁\"这种叙事句**；**③⚠ 本集据此判定**：**这类句子里的\"年份\"和\"岁数\"，**通常一个是原始记录、一个是事后推算****（**而推算的人没有再回头核一次**）——**⚠ 这也提醒读者：**书中所有\"某年来测、某人几岁\"的句子，都值得自己再算一遍**。","o":"TJ-0929 · 天纪·紫微详解·第五章紫微十二宫详解·第十六例·流年（PDF 第201~202页）"},{"t":"四百四十七、\"此文摘自于网上\"","h":"一句极直白、也极不完整的来源声明","c":"数据——**第六章开篇第一行，就交代了这一章的来源，而这是全册**最直白、也最粗糙**的一次**：\"**'第七章 六壬法'。'（**此文摘自于网上**）'。**\" **而章内还有两句关于其来历的说法**：\"**'**诸葛马前课**，**据说是**诸葛亮行军出行时，随时占算吉凶福祸的简便方法——由于方法简单，十几秒内便可知道凶吉祸福，**可以在马上立算**，故称诸葛马前课'。'**诸葛马前课也叫小六壬，其实是从奇门遁甲中简化出来的**'。**\" **须说明（四层）**：**①\"**此文摘自于网上**\"这七个字，是一个**极诚实、也极不完整**的交代**（**它承认\"不是我写的\"，但没说是谁写的、从哪个网站、什么时候**）——**本集据此判定：这一章是**全书来源最不明**的一章****（**可与前文\"方法来自沈平山（含五本书目）\"的规格作对照**）；**②\"**据说**是诸葛亮\"这个说法，本身就标了它属于**传说**（**\"据说\"两个字，是讲义自己对这一层的降级**）；**③而\"**从奇门遁甲中简化出来的**\"这一句，是一句**技术溯源****（**它把\"小六壬\"归入奇门体系的一个简化分支**）——**而这一层**是可以查的**（**小六壬确实与奇门、六壬、太乙等系统有渊源关系**）；**④⚠ 本集态度**：**对\"来自网上、据说诸葛亮\"这类内容，只能当**民俗与口诀**处理**（**它有文献价值（可看出这一套在民间如何流传），但没有**可验证的预测效力****）。** **⚠ 本集按语**：**这一章的存在本身，就是一则**极好的材料****：**它说明一本\"天纪\"讲稿里，也会直接插入一段**从网络复制来的**内容**（**而讲义并不掩饰这一点**）——**这比任何\"秘传\"的说法，都更能说明这类知识的**流传方式**。","o":"TJ-0930 · 天纪·紫微详解·第七章六壬法·章首（PDF 第202页）"},{"t":"四百四十八、\"人老珠黄\"与\"玩命的干\"","h":"一段极生动的编者按，与一个不友善的词","c":"要点——**第十六例的大限分析里，编者以\"紫易奇缘\"署名插入了一段极生动的评论，须完整照录**：\"**'大限（63-72）在迁移宫破军化权。如果化禄在财，她可能会去做生意；她的十大限在官禄，化禄在官禄——她就会走官运，去当官'。'**紫易奇缘：我认为这个岁数了，人老珠黄**——**化权是老年劳碌**，**为了那点钱**（三方见禄存，为固定收入），**东奔西跑**（禄马交驰），**玩命的干**（杀破狼）'。**\" **须说明（三层）**：**①这一段的价值，在于它**把\"吉断\"翻成了\"实况\"****（**前文说\"三奇嘉会、诸侯之命\"，而到了 63 岁以后，同样的\"化权\"被读成\"老年劳碌\"**）——**⚠ 而这一层其实**极真实**：**同一个\"能干\"的特质，在年轻时是资本，在老年时是**负担****（**因为停不下来**）；**②而它用的三个术语，都化成了**画面**：\"**禄马交驰**\"＝东奔西跑**、\"**杀破狼**\"＝玩命地干**、\"**禄存**\"＝固定收入**（**这些术语在这里被当作**动词**用了**，**而这正是讲课式语言的生动处**）；**③⚠ 而\"**人老珠黄**\"这个词须标为**不友善****（**它用一个贬抑女性年龄的词，来形容一位 63-72 岁的职业女性**）——**而这位女性恰恰是\"不会干、又不屈居人下\"的那一位**（**她一生的成就，被这四个字一笔抹平了**）。** **⚠ 本集按语**：**若去掉那四个字，这一段是**全册最好的一段\"吉凶同源\"的解读****：**一个人的长处，会在她老的时候变成她的劳碌**（**而\"为了那点钱\"这四个字，把\"化权\"从荣耀改回了生计**）——**这一层，比任何\"诸侯之命\"的说法都更接近现实**。","o":"TJ-0931 · 天纪·紫微详解·第五章紫微十二宫详解·第十六例·大限（PDF 第201页）  ---"},{"t":"四百四十九、\"南斗天府不能解厄制化\"","h":"一条与传统相反的关键判定","c":"要点——**第十七例两次强调\"天府不能解厄\"，而这一条与传统紫微的说法**方向相反**，须照录并标**。\"**'大限 54-63，十年大运是**疾厄**——代表这十年当中是疾病，最凶的就是身体、就是健康'。'**南斗天府不能解厄制化**——都**暗藏凶灾**，**往往发生事情时无法逃掉**'。**\" **又**：\"**'天府、天相会命，**天生佐才**。'。'**南斗星君天府星在宫时，一定要注意吉处藏凶、防不胜防——因为天府星没有解厄制化的功能**'。**\" **须说明（四层）**：**①在传统紫微斗数里，**天府、天相、天梁**常被合称\"**解厄三星**\"**（**天府尤其被视为\"库\"与\"稳\"的象征**）——**而本册此处明说\"**不能解厄制化**\"，**与传统说法**方向相反****（**本集照录，并标此差异**）；**②而它给出的理由，其实极有价值**：**\"**吉处藏凶、防不胜防**\"**（**一个看起来\"什么都不缺\"的命局，最容易**没有准备****）——*
