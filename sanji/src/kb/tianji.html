<script>const D=[{"t":"一、天纪的定位","h":"《天纪》在倪海厦学术版图中的位置","c":"要点——据倪海厦传记所载：\"倪师于 **1994 年左右**拍摄制作完成《**天纪**》，内容包含**八字、紫微斗数、阳宅风水、地理、面相、测字**等。这是一套**运用中国千年以来流传的易经原理来解释宇宙之间、天地万物的物性方面**的著作。\"其 DVD 编号为 01—24，另有\"人间道、地脉道、天机道、紫微详解\"四部讲义。**它与人纪的关系需要辨明**：人纪（针灸、内经、本草、伤寒、金匮）治**人**，天纪治**命**——前者论\"病怎么来、怎么去\"，后者论\"运怎么定、怎么改\"。两者共用同一套底层符号（阴阳、五行、天干地支、八卦），但**推论对象不同、验证方式不同**：医学的结论可由疗效检验，术数的结论不可。因此本全集将天纪**单列为附录**，不与中医诸章混排——这既是尊重其独立地位，也是提示读者：**它的性质是术数文化，不是医学知识，不作现实决策依据**。","o":"TJ-0001 · 倪海厦传记（神农本草经·PDF 第12页）／视频课程汇总（PDF 第1~3页）"},{"t":"一、天纪的定位","h":"三种命理方法的取舍","c":"要点——《天机道》开篇即对三种算命方法作出排序：\"**算命方法：铁板神算（核对六亲比较好）、子平法、紫微斗数（最精妙、易学难精通）**。\"这一句包含三层判断：**①铁板神算**的长处在\"核对六亲\"——即验证父母、配偶、子女等亲属关系是否吻合，功能偏\"校核\"而不偏\"断事\"；**②子平法**（即八字）为基础方法，未作特别褒贬；**③紫微斗数**被评为\"最精妙\"却也\"易学难精通\"——入门不难，精通极难。倪海厦在《天纪》中实际讲授的重心是**紫微斗数**，八字则用于\"批八字：先看总格\"等辅助判断，这一取舍与其个人偏好有关，也与紫微斗数以十二宫对应人生各面向（财、官、婚、疾）的体系化程度较高有关。","o":"TJ-0002 · 天机道 01-02 听课笔记"},{"t":"二、紫微斗数的框架","h":"十二宫与\"三方四正\"","c":"定义——紫微斗数以**十二宫**定位人生诸面向，其排列以**地支**为盘：**命宫**（本人的先天）、**财帛宫**（己）、**子女宫**（午）、**夫妻宫**（未）、**兄弟宫**（申）、**疾厄宫**（辰）、**迁移宫**（卯）、**父母宫**（戊）、**仆役宫**（寅）、**官禄宫**（丑）、**田宅宫**（子，\"祖业、置产吉凶\"）、**福德宫**（亥）。**\"三方四正\"**是判断的基本单位：以命宫为核心，取其**对宫（迁移）**与**三合宫（财帛、官禄）**共四宫同看，构成一个人的\"总体格局\"。**另有\"身宫\"**，代表后天走向：\"身宫在财帛会去私人企业工作或自己做老板；在官禄会去做官；在迁移会去外地发展；身命同宫先天和后天都一样；在夫妻宫后天被婚姻影响很大\"。这一体系的实用意义在于：**它把\"命运\"拆成了十二个可分别观察的格子**，而非笼统的\"命好命坏\"——故有\"**官星进入官禄宫最好、财星进入财帛宫最好，适得其所**\"之说。","o":"TJ-0003 · 天机道 01-02、05 听课笔记"},{"t":"二、紫微斗数的框架","h":"四化星：化科、化权、化禄、化忌","c":"定义——四化星是紫微斗数中\"使静态星盘动起来\"的关键，其星性为：\"**化科星性：科名，名气很大**；**化权星性：性刚，官印**；**化禄星性：财，性守（守财奴）**；**化忌星性：劫杀、想不开**。\"在实务判断中，四化比主星更能落实吉凶：**化科**主名声与专业技术（\"化科：1、专业技术专长；2、科甲，在官禄宫代表去考公家单位\"）；**化权**主权柄与刚断；**化禄**主财源与守成；**化忌**则是一切阻滞的来源——\"**福德宫化忌一辈子都不顺**\"\"**官禄宫遇到化忌不利于当官**\"\"**化忌入父母宫＋日月反背格代表父母不在身边或父母双亡**\"。**判断顺序**（笔记所载）为：\"**1、看：化权、化科、化禄、化忌；2、看命宫三方四正**（有天魁、天钺、化科等科甲星代表天生才艺很好）；**3、看命宫的左右**（父母宫和兄弟宫）\"——先看四化落宫，再看三方四正，最后看邻宫，这是一个由动态到静态、由核心到外围的读盘次序。","o":"TJ-0004 · 天机道 03、05 听课笔记"},{"t":"二、紫微斗数的框架","h":"十四主星的分组与星性","c":"定义——主星分南北二斗：**南斗星：天府、太阴、天梁、天相、七杀、破军、贪狼**；**北斗星：紫微、天机、太阳、武曲、天同、廉贞**。各自的星性可归为四类：**①帝座与辅佐**——**紫微**为\"帝星，代表文武官带、解厄、代表正财\"，但\"**一定要有左辅右弼来汇才吉**\"，单星则\"为人很厚道、性情孤独\"；**天府**\"南斗君主，代表个性温和……心眼比较多\"；**天相**\"佐才星（适合秘书、助理），长相瘦高，为人厚道、脾气温和\"。**②文武官带**——**天机**\"代表文官带（公务人员、教师、银行工作人员），代表正财\"；**太阳**\"代表武官带（军人、警察、外交官、法官），解厄、代表财禄（横财），代表父亲、丈夫、儿子\"（故女命\"太阳代表先生、丈夫、儿子\"）；**武曲**\"代表武官带、解厄、代表财星王，个性火爆过得快，但是身材五短且壮（属富贵）\"。**③人和与食神**——**天同**\"代表人和、解厄\"；**天梁**\"食神，代表文武双全官带\"。**④杀伐与桃花**——**七杀**\"入命宫——目大、性急、多疑\"；**破军**\"比较孤僻、瘦、不重利益\"；**贪狼**\"主桃花星、代表酒色财气赌……身材魁梧，毛发比较多\"；**廉贞**\"代表次桃花，代表武官带……迷迷眼，见到美女未言先笑，长相清秀\"。这套星性还配有**\"相\"**（形貌特征），即所谓\"天机星位于命宫的时候会有相：皮肤黑、个子矮、体格精壮、反应很快\"——**星性与相貌被绑定**，是紫微斗数判读的一个特色。","o":"TJ-0005 · 天机道 02-04 听课笔记"},{"t":"二、紫微斗数的框架","h":"六杀星与\"庙旺利陷\"","c":"定义——**六杀星**为\"**擎羊、陀罗、火星、铃星、天空、地劫**\"。**星辰的亮度**分四级：\"**庙、旺、利、陷**\"——同一颗星因落宫不同而吉凶迥异，这是紫微斗数\"同星不同命\"的技术基础。其判断规则可归纳为两条：**①杀星庙旺则减凶**——\"**如果这些杀星庙旺，代表凶处藏吉；杀星落陷，在劫难逃**\"；**②杀星在对宫更强**——\"**杀星在本宫的杀性没有对宫强**\"。另有一条组合规则：\"**七杀、破军、贪狼三方会，均为刚愎自用的人，比较被人利用**\"，其中\"**七杀、破军主劳、耗；贪狼主财、桃花**\"。以及\"**贪狼、七杀、破军最希望遇到火星、铃星**\"——即成\"火贪格\"（\"火贵格，武贵\"）。这些规则的意义是：**星的名号只提供倾向，落宫与亮度才决定强弱**，故不可只凭\"命带七杀\"一类说法断吉凶。","o":"TJ-0006 · 天机道 04、05 听课笔记"},{"t":"二、紫微斗数的框架","h":"吉凶的两条核心原则","c":"要点——《天机道》中有几句判断原则，比具体格局更具方法论价值。**①\"吉处藏凶，必凶；凶处藏吉，平安\"**，并附一句箴言\"**戒之初、戒之盛**\"——即最危险处不在困顿之时，而在顺遂之初与极盛之际。**②\"命好不如限好\"**——先天格局再佳，不如所行大限顺遂；相对应的操作规则是\"**未来十年无大运，大限在今年；未来一年无大运，大限在前一年**\"，即衰运的显现会比通常认为的更早。**③\"命上有灾，再加上运上有灾，才会呈现\"**——先天之灾须与流年之灾叠加方成事实，这一条实际上给出了\"灾可避\"的理论空间：**若无运的叠加，先天之凶未必兑现**。**④\"十年大运（看三方四正）为主，小流年（只要看本宫和对宫）为辅**\"——不同时间尺度的判读精度不同：大限须四宫合看，流年只需本宫与对宫。这四条合起来，构成了一个\"先天定倾向、大限定兑现、流年定触发\"的三层时间结构。","o":"TJ-0007 · 天机道 04、06 听课笔记"},{"t":"三、面相","h":"面部与六亲、十二宫的对应","c":"定义——《天纪》的面相学有两套并行的对应系统。**①面部与六亲**：\"**左边的额头代表父亲，右边的额头代表母亲；左边眉毛代表兄弟，右边眉毛代表姐妹；左边眼袋代表儿子，右边眼袋代表女子（女儿）**\"；并据形貌断亲属状况——\"眉毛太粗就是独子，眉毛断掉自己兄弟姐妹受创，眼睛一大一小且不在一个水平线上代表是庶出或被领养\"。**②十二宫在面部的落点**：\"**命宫：印堂（眉毛之间）；财帛宫：鼻子中间一段；夫妻宫：眼角（奸门）；子女宫：泪堂（眼睛下方）；田宅宫：眉眼之间；迁移宫：天仓；官禄宫：中正（上前额）；仆役宫：下巴的地方**\"；另\"**命门：观生死（鬓角下方）**，讲话时命门处有骨凸起为反骨，不能用，会背叛\"。这两套系统共用一张脸，故同一部位可读出\"六亲关系\"与\"人生面向\"两重信息——**左主男、右主女，是其基本约定**。","o":"TJ-0008 · 天机道 01-02、05 听课笔记"},{"t":"三、面相","h":"气色与时间的换算","c":"方法——气色判断是面相中最\"可操作\"的一部分，其核心是把颜色译为**时间与事件**：\"**气色枯焦代表已经发生；气色枯黄代表刚发生两个星期；暗黑色将于近期发生**（气色主两个星期）。\"**时间刻度**：\"**一年有 24 个节气，（每一节气）主两个星期；看到气色后第一个节气就是发生的日期。**\"**颜色与吉凶**：\"**黄润主喜事；黑暗如有灰尘一般主劫杀或想不开；枯萎色或青蓝色主死色**\"；\"**印堂枯白，戴丧**\"。这套换算的价值在于它**给出了明确的时间分辨率（两周／一个节气）**，使\"看气色\"从模糊的印象变成可对照历法的判断。须说明：此为传统相术的经验体系，无生理学依据——面色的变化确可反映健康与情绪（如黄疸之黄、贫血之白、缺氧之青），但将其精确对应到\"两周内必发生某事\"，已超出可验证范围。","o":"TJ-0009 · 天机道 02-03 听课笔记"},{"t":"四、与中医的接口","h":"疾厄宫与十二经纳地支的合用","c":"要点——天纪与中医在同一份笔记里出现过一次直接衔接：先列出**十二经纳地支歌**\"**肺寅大卯胃辰宫，脾巳心午小未中，申胱酉肾心包戌，亥焦子胆丑肝通**\"（寅肺、卯大肠、辰胃、巳脾、午心、未小肠、申膀胱、酉肾、戌心包、亥三焦、子胆、丑肝），紧接着一句用法：\"**凶星多在那个宫，就相对知道那方面的疾病**。\"即：**紫微盘中某宫凶星聚集，可据其地支对应的脏腑，推断该方面的疾病倾向**。这是全书唯一把术数盘与脏腑辨证直接挂钩的地方，也是理解\"天纪—人纪\"如何互通的关键：**两者共享地支这一套坐标**——十二地支既是时辰（气血流注），也是盘位（宫位）。**须说明**：这种\"以盘推病\"的方法不可用于诊断，真正的疾病判断仍须依四诊；此处记录的是其体系内部的连接逻辑，而非可行的医疗方法。","o":"TJ-0010 · 天机道 01-02 听课笔记"},{"t":"五、阳宅","h":"阳宅与命运的关联规则","c":"要点——《天机道》笔记中散见若干阳宅（住宅格局）与人事的对应规则，可与《地脉道》对读。**①与疾病、丧偶相关**：\"**夫妻死别的阳宅：1、厕所在房子的中间，死于心脏病；2、西北角是厨房，刀象**。\"**②与子嗣相关**：\"**无子宅：1、正东是客厅或餐厅，缺东宫；2、东边的房子里床头也靠着东边的墙，负负得正（床头靠北边或西边为吉）**。\"**③与婚姻相关**：\"女子福德遇到武曲＋七杀，代表一辈子孤独；**面大骨粗、住西北角的卧房，一辈子不结婚**。\"**④与灾祸成立的条件**（见前）：\"命上有灾，再加上运上有灾，才会呈现。\"**其内在逻辑**是：住宅的方位与功能分区（东为震、西北为乾等）对应家庭成员的位序，故某方位被厕、厨、空缺所占，即象征该成员的位置被\"污\"或\"缺\"。**须说明**：这些规则属传统堪舆学的内容，无科学依据；本节仅记录其说，不作居住决策参考。","o":"TJ-0011 · 天机道 05、06 听课笔记  ---"},{"t":"六、易的三义与天纪的结构","h":"简易、变易、不易：易的三层含义","c":"定义——倪海厦自序开宗明义即以三义解\"易\"：\"**易，變易也，隨時變易以從道也。不易也，事物之外象皆變，而其理不變也。簡易也，萬法皆不同，然其神只有一也。**故易廣大皆備，順性命之理，通陰符，盡事物之情，而示吾人開物成務之道。**得此易道之神，則天下萬事皆能化繁為簡矣。**\"郭序则以三义说明易为何能\"垂教万世\"：\"稱之為易，蓋取其〔簡易、變易、不易〕。**因其簡易，當為常人所了解；因其變易，當可用於事事；復因不易，當能垂教萬世。**\"两处合看，三义各有所指：**简易**——易的道理本不繁难，故人可懂（\"所謂易者，易也，不然何名『易經』？\"）；**变易**——万象随时而变，故可用于一切事；**不易**——外象虽变而其理不变，故能垂教万世。这三义构成一个\"**可学、可用、可传**\"的闭环，也是倪海厦反复强调\"易经本身并不难\"的理论依据。","o":"TJ-0012 · 倪海厦《人间道》自序（PDF 第4页）／郭序（PDF 第5页）"},{"t":"六、易的三义与天纪的结构","h":"天纪的两部分：演易与人间道","c":"要点——前言明确交代全书结构：\"**本書的內容，共分二部份。〔一〕從圖來談易經**，即古人所謂「**無字天書**」，**占卜、問卦，也可以應用於易經推命來批流年行運，也可以運用於陽宅來推易**，這是學**如何演易**。〔二〕**從易辭部份來研究「人間道」**。從第一卦「**乾為天**」開始，**天地定位後，人的一生即進入此一輪迴**，舉凡天地間所有的任何事物，全部包羅在內，**不但是醒世哲言，更可將世間所有的學問理論簡化之**。\"这一划分极重要：**天纪不是一门术，而是两层**——**上层是\"演易\"**（以图与数推演，落于占卜、命理、阳宅，属技术层）；**下层是\"人间道\"**（以卦辞爻辞论人生进退，属义理层）。倪海厦并批评时人只重后者：\"今人讀易越讀越複雜，或是講易經講半天，而無人懂，這都是未得易之道。\"","o":"TJ-0013 · 倪海厦《人间道》前言（PDF 第6页）"},{"t":"六、易的三义与天纪的结构","h":"圣人之道有四：辞、变、象、占","c":"定义——自序引《易》之四道：\"**易中聖人之道有四：以言者，尚其辭。以動者，尚其變。制器者，尚其象。卜筮者，尚其占。其間藴含吉凶消長之理，進退存亡之道。君子靜則觀象以悟其辭，動則觀變以玩其占。**\"这四道对应四种用法：**重言辞者**取其辞（义理）；**重行动者**取其变（时机）；**造器物者**取其象（形制）；**行卜筮者**取其占（吉凶）。而\"**静则观象以悟其辞，动则观变以玩其占**\"一句，给出了**动静两套读易法**：静时（无事时）由象入辞，以悟其理；动时（有事时）由变入占，以决其行。**其自评的着力点**正在\"象\"上：\"今世之人，大都得其辭，而未達其意，**此著作以悟象之角度申其義**，此其目的也。\"即他认为历代注易偏于文辞训诂，而失落了\"观象\"这一路径，故本书补此一偏。","o":"TJ-0014 · 倪海厦《人间道》自序（PDF 第4页）"},{"t":"七、读易的方法","h":"读易前的心理准备：先成一张白纸","c":"方法——倪海厦对如何读《易》给出了一条近乎\"心法\"的要求：\"**易經本身並不難**，故讀者先要有一概念，在讀易之前，**平心静氣，捨去一切雜念，千萬不可在讀易之前，先對易經有所認定**——那尚未開始，您已經錯了，**一步錯，步步錯**，一旦離開了易經的神，運氣好的要「**十年乃字**」（十年乃數之終，有倦怠的象），運氣不好，又自以為是的話，**可能終其一世，仍未窺得易之全貌**。\"这段话的实质是**排除预设立场**：若先存\"这是迷信\"或\"这不过是算命\"之见，则读者的注意力会全部用于验证成见，而非理解体系本身。他要求\"如一張白紙，心中無任何擔心會看不懂、或看了無益、或是迷信等等任何想法，都不存於心中\"。这一要求对读任何体系性文本（含医经）皆适用——**先入其体系，再作判断**。","o":"TJ-0015 · 倪海厦《人间道》前言·读易的心理准备（PDF 第6页）"},{"t":"七、读易的方法","h":"\"学而后思则悟\"与三段逻辑","c":"方法——倪海厦引《孟子·学而》\"**學而不思則罔，思而不學則殆**\"，并翻出一句自己的话：\"**學而後思則悟**。\"他批评当代教育\"莘莘學子們苦背書籍，為考試而讀書……造成人們都**學而不思則罔**。**罔者，迷惘也**\"，其后果是\"人心失落，不知孰是孰非，謡言滿天\"。**他提出的求学方法**是：\"**吾人的邏輯（求學的方法）如下：假設 → 驗證 → 結果。凡天下任何事都無法離開這個科學精神，是非應辨，真理即現。**\"这一\"假设—验证—结果\"的三段，被他用来同时反对两种态度：**不学而信**（迷信）与**不学而疑**（武断）。其自陈的用法即是以此检验\"我不相信命\"一说。","o":"TJ-0016 · 倪海厦《人间道》前言（PDF 第6页）"},{"t":"七、读易的方法","h":"对\"我不相信命\"的两点驳论","c":"要点——前言中有一段完整的驳论示范，可作为其\"验证\"方法的应用例。\"有人說：「**我不相信命，命都是自己努力來的。**」聽起來好像是對的，但諸君深入一想，真偽立判。\"**第一错**：\"**他從未研究過命，也就是完全不懂命學**，卻從一不知的角度，來認定古聖先賢智慧的結晶，就是「**不知而説**」，這是一無知的人。\"**第二错（反证法）**：\"**吾人假設他的話是對的話，既然命完全靠努力可得，那農業博士必是第一志願**，因為如拿到農業博士，一定可以做到總統的。**試問這可能嗎？**\"这一驳论的逻辑结构值得记录：**先指出对方缺乏研究资格（不知而说），再假设对方命题成立并推至荒谬**。其方法本身是有效的论辩术；但须注意，反证成功只能说明\"努力非充分条件\"，并不能直接证明\"命定\"为真——**这是其论证的跳跃处**，读者宜分辨。","o":"TJ-0017 · 倪海厦《人间道》前言（PDF 第6页）"},{"t":"八、天纪的方法论","h":"阳宅学：九宫八卦为内卦，居位之人为外卦","c":"方法——徐序中有一段对倪海厦阳宅学的精确概括，是天纪方法论的枢纽：\"**倪師之陽宅學，以九宮八卦圖為內卦，居於其位之人為外卦；卦既成，則觀該卦之象以斷其人之吉凶禍福。此實深合易之道也。**\"这一构造的巧妙处在于**把\"宅\"与\"人\"组合成一个六十四卦**：宅的方位格局提供**内卦**（下卦），所居之人（依其身份、排行、命卦）提供**外卦**（上卦），**内卦定环境，外卦定主体，两卦相合而成一卦，再以此卦之象断吉凶**。这与《天纪》其他部分（紫微、八字）以\"人\"为唯一变量的方式不同——**阳宅是两个变量的合成**，故同一间房子对不同人吉凶不同，同一人对不同房子亦然。理解这一点，才能解释为何其阳宅规则总是\"某方位＋某类人\"成对出现（如\"女子住西北角卧房一辈子不结婚\"）。","o":"TJ-0018 · 徐光佑序（PDF 第5页）"},{"t":"八、天纪的方法论","h":"三才分合：天纪的总体框架","c":"定义——徐序对《天纪》的整体定位：\"**「天紀」一書，以易經為軸，以天文、地理及人間道為輔；發前人之所未發，言前人之所未言。復道盡天、人、地三才之關係，良以三才能分，能合；名異而實為一體也。又豈天人合一之境所能比擬？**\"这段话说出了天纪的三层结构：**轴**是易经（共同的符号系统）；**辅**有三——**天文**（天机道：星辰运转与命盘）、**地理**（地脉道：山川形势与阳宅）、**人间道**（人事进退之理）。三才\"**能分能合**\"是理解全书的关键：**分**则各成一套技术（紫微看天、堪舆看地、易辞看人）；**合**则同一事件须三面同参——天定其时、地定其位、人定其行。另有一句纠正学术史的话：\"**吾國易經博大精深，漢、唐以前，重象、數而輕辭，自宋以降，則重辭而輕象、數。倪師則並重之。**\"即他认为汉唐重象数、宋以后重文辞，各得一偏，而《天纪》的方法是**象数与辞并重**。","o":"TJ-0019 · 徐光佑序（PDF 第5页）"},{"t":"九、成书与题署","h":"版本信息与三家序","c":"要点——《人间道》的成书信息完整可考：**自序**署\"**梵宇龍 八十三年九月十日**\"（另有一篇自序署\"**作者倪海廈 甲戍年正月廿四日**\"）——两个年号分别对应 1994 年（民国八十三年）与 1994 年（甲戌年），可证其成书在 **1994 年前后**，与传记所载\"1994 年左右拍摄制作完成《天纪》\"吻合。**书名题署**：\"**本書之書名，是由我父親倪志凌先生親手寫的**，我父親飽讀詩書，現旅居美國，一手好字……**他一直以中國人為榮，時時教誨他的孫子，不可忘本**。\"**三家序**：郭学廉序（\"中華民國八十三年十一月九日……序於**台灣板橋地方法院檢察署**\"）、徐光佑序（\"**甲戍年孟冬**序於**台北景美**\"）、以及民间校勘者的《校堪序》（\"**2010-10-22**\"，说明\"本電子版不收取任何費用，亦不得將本書內容用於商業行為\"）。**另有一条身世线索**（自序自陈）：\"**我從事算命有十幾年**，看盡人間百態有感而發，希望藉由此著作，能寓教於人。\"——即他在写此书时，命理实践已逾十年。","o":"TJ-0020 · 自序、郭序、徐序、校堪序（PDF 第4~5页）  ---"},{"t":"十、基本对应","h":"八卦—方位—家人：天地定位，长幼有序","c":"定义——《地脉道》的基础是一张八人八卦的对应表，其口诀是\"**天地定位，长幼有序**\"：**巽、风、长女（东南角）**；**离、火、二女（正南）**；**坤、地、母亲（西南角）**；**震、雷、长子（正东）**；**兑、泽、少女（正西）**；**艮、山、三子（东北角）**；**坎、水、二子（正北）**；**乾、天、父亲（西北角）**。这张表的意义在于：它把**八个方位、八个卦、八类家庭成员**三者固定绑定，从而使\"某人住在某方位\"可以被翻译成一个具体的卦——**乾为天是父亲居父位（正位），天地否是父亲占母位（错位）**。据此，全部吉凶判断都归结为一个问题：**这个人有没有住在\"自己的位\"上**。居其位者为\"正\"，为吉；越位、失位、为他位所据者，为凶。","o":"TJ-0021 · 地脉道 01-05 听课笔记"},{"t":"十、基本对应","h":"\"名\"与\"位\"：家和与万事兴","c":"方法——《地脉道》有一组极简的操作口诀：\"**名＝位**（例如：叫母亲住在西南角卧房）——**家和**；**位＝名**（如主卧住在正东卧房，用长子的名字注册公司）——**万事兴**。\"两者的区别在\"谁是主体\"：**\"名＝位\"** 指**让人的身份与其所居方位相合**（母亲之名配西南坤位），其效在\"家和\"——家庭内部关系顺；**\"位＝名\"** 指**让方位的属性挂上相应的名分**（把正东震位（长子位）用长子的名义去运作，如注册公司），其效在\"万事兴\"——事业与外部事务顺。这一对概念的实用价值在于：它给出了**两条可反向操作的路径**——**人动**（调整谁住哪里）以求家和；**名动**（调整名义归属）以求事顺。这也是《天纪》阳宅学区别于一般风水之处：**其抓手是\"位序\"而非\"器物摆放\"**。","o":"TJ-0022 · 地脉道 07 听课笔记"},{"t":"十、基本对应","h":"象的取义：厨房、客厅、卫生间","c":"定义——《地脉道》对房内功能区的取象有三：\"**象（名＝位）：厨房（刀象）；客厅（如客）；卫生间（是非、口舌、官司）。**\"三个取象各有其逻辑：**厨房取\"刀\"**——因有刀刃之火、切割之象，故落在某人的方位上即主\"伤该人\"；**客厅取\"客\"**——客厅是待客之所，故落某人位即主\"该人成为家中的客人\"（在家时间少、如过客）；**卫生间取\"污\"**——污秽之所，故主是非口舌官司。**由此推出的方位宜忌**：\"**客厅放在坤位最好**\"（坤为母亲位，客厅为\"客\"，母亲本非一家之主事者，故\"客\"落坤位无伤）；\"**厨房在房子的正北方或正西方最佳**\"（正北为坎（二子）、正西为兑（少女），二者皆非关键位）；\"**一般正北卧室不住人，可以放祖先牌位**\"（正北坎位被视为不宜居人之位）。这套取象法的实质是**用功能象征替代实体器物**——判断吉凶不看摆什么，而看**这块地方承担什么功能**。","o":"TJ-0023 · 地脉道 01-05、08-09 听课笔记"},{"t":"十一、位错乱的后果","h":"四句断语：厨房与客厅的方位禁忌","c":"风险——《地脉道》中最具冲击力的四条断语，句式整齐，指向明确：**\"西北角是厨房死先生、西南角是厨房死太太、西北角是客厅主夫妻生离、正东边是厨房主长子夭折\"**；并给出解法：\"（正东边是厨房的解决方法：**将正东边改为卧房**）\"。四条可归为两类机制：**①厨房（刀象）落在关键人物的本位上**——西北为父亲位、西南为母亲位、正东为长子位，刀落其位即伤其人，故分别应\"死先生\"\"死太太\"\"长子夭折\"；**②客厅（客象）落在父亲本位**——西北为乾，父亲若成为家中的\"客\"，即为\"丈夫把家当旅馆\"（\"西北角是客厅，丈夫把家当旅馆，**主夫妻生离**\"）；相对地，\"正东是客厅，**生不到儿子**；如果已经有儿子的，**儿子如同家里的客人，呆在家里时间很少**\"。另有一条与\"夫妻死别\"相关的：\"**厕所在房子的中间，死于心脏病**。\" **须明确说明**：此类断语属传统堪舆学，无科学依据，且其表述（以\"死\"字相威胁）极具心理冲击，不应作为居住安排或健康判断的依据。","o":"TJ-0024 · 地脉道 06、01-05 听课笔记"},{"t":"十一、位错乱的后果","h":"无子宅与求子：两条具体规则","c":"方法——《地脉道》对\"无子\"给出两条可检可改的规则：\"**无子宅：1、正东是客厅或餐厅，缺东宫；2、东边的房子里床头也靠着东边的墙，负负得正（床头靠北边或西边为吉）。**\"两条的逻辑不同：**第一条是\"缺位\"**——正东为震（长子位），若被客厅或餐厅占据，则\"长子位\"不存，故无子（与前条\"正东是客厅，生不到儿子\"同源）；**第二条是\"叠加\"**——东边的房间本已属震位，若床头又靠东墙，则东气重叠，\"负负得正\"（此处\"负负得正\"意为**同类相叠反而抵消其吉**），故须把床头改靠北或西，使方位之气不至于纯一。**可操作的建议由此得出**：若要保住长子位，须**让正东保持为卧室**，且**床头不朝东**。这一组规则的表述方式是《地脉道》的典型——**先指认一个具体可见的物象（客厅、床头朝向），再给出一个可立即执行的改动**。","o":"TJ-0025 · 地脉道 01-05、06 听课笔记"},{"t":"十二、六十四卦格局","h":"格局的生成：以\"某人住某方\"成卦","c":"方法——《地脉道》把六十四卦逐一对应到\"某类人住在某个不属于自己的方位\"这一具体情形，其命名格式统一为\"**卦名（某人住某方——）**\"，例如**乾为天（父亲住在西北角）**、**坤为地（母亲住在西南角）**、**天地否（父亲住母亲的位置——西南角）**、**地天泰（母亲住父亲位置——西北角，夫妻同住…吉）**。**其成卦原理**即前述徐序所概括者：**方位提供内卦（下卦）、居住者提供外卦（上卦）**——父（乾）居西北（乾）则成\"乾为天\"（正位，纯卦）；父（乾）居西南（坤）则成\"天地否\"（乾上坤下）。**故六十四卦在此不是抽象的哲学符号，而是一张\"人事—空间\"的组合表**：正位得纯卦（乾为天、坤为地、震为雷等八纯卦），错位得合卦（天（乾）在上、地（坤）在下，即\"否\"）。理解这一生成机制，才能读懂后续所有格局条目。","o":"TJ-0026 · 地脉道 01-14 听课笔记"},{"t":"十二、六十四卦格局","h":"吉格举例：乾为天、地天泰、天火同人","c":"要点——《地脉道》所标为吉的格局，其共同特征是**居者得位或得其所宜**。**①乾为天（父亲住在西北角）**：\"1、**做官的人平步青云，心想事成，容易越级晋升**；2、**商人财多禄丰，成就不可限量**；3、父亲居此为**对家人有责任心，是好丈夫**。\"**②地天泰（母亲住父亲位置——西北角，夫妻同住，最好是结婚那天晚上就住最好，吉）**：\"1、**主夫妻感情非常好，一世夫妻，白首到老**；2、在家相夫教子亦为事业，在公事上进退有据，受人重用，心想事成；3、**于健康主平安到老，一生无大病**。\"**③天火同人（父亲住在二女儿的位置——正南卧房）**：\"1、**发科甲**：**已婚的男人唯一出现科甲的卦就是天火同人卦**，父亲住正南卧房**考试金榜题名**，睡觉的时候**脚朝文昌、文曲、天钺、天魁、化科所在宫位置的方位**；2、财禄非常平稳；3、文官或武官升迁。\"三者分别代表**事业（乾为天）、婚姻（地天泰）、考试（天火同人）**三类吉应。**注意地天泰的附带条件**：须\"夫妻同住\"，且\"最好是结婚那天晚上就住最好\"——即**吉应的成立依赖居住方式**，非单看方位。","o":"TJ-0027 · 地脉道 01-05、08-09 听课笔记"},{"t":"十二、六十四卦格局","h":"凶格举例：天地否、天水讼、山地剥","c":"要点——凶格的共同特征是**居者失位而致事逆**，程度由轻至重可分三级。**①轻度不顺——天地否（父亲住母亲的位置——西南角）**：\"1、**诸事不顺**；2、升迁不成；3、**妻盛夫衰、主婚事凶**；4、得女；5、个性刚强得罪人，容易自以为是。\"（父失其位则母权盛，故\"妻盛夫衰\"。）**②纠纷缠身——天水讼（父亲居二子的位置——正北的卧房）**：\"1、**官司不断，成为好讼之徒**；2、**对于律师法官之人吉**；3、**官人居此局，升官慢五年，诸事不顺**；4、商人财禄不进；5、有贪念行事容易行险；6、如果命里婚姻不好，婚姻主破，诉讼离婚。\"（\"讼\"之名直取其义：占人子之位则争，故主讼；而对本就以诉讼为业者反吉，是\"以凶应凶\"的逻辑。）**③大凶——山地剥（三儿子居西南角卧房，长子和二子未婚）**：\"1、**破耗家业，伦理丧失，伤风败俗**；2、性毒暗生；3、婚不成；4、**科甲不顺，考试必败**；5、**身体灾病多——大凶**。\"（三子越过长幼之序而占母亲之位，\"剥\"为剥落之义，故最重。）**须说明**：这些断语均为传统堪舆学的推演，无实证依据，仅记录其体系内的逻辑。","o":"TJ-0028 · 地脉道 11-13、01-05 听课笔记"},{"t":"十二、六十四卦格局","h":"\"越位\"：次子居长子位、长子居父位","c":"要点——《地脉道》对\"越位\"有一组专门的判断，其逻辑是**位序的僭越会同时改变能力与关系两项**。**①次子越位——水雷屯（二儿子住在长子的位置——两个儿子一起住正东方卧房；长子已婚、或本人已婚、或两个儿子不住在同一屋檐下均不成格）**：\"1、二子居次格，**比长子早婚，比同时生人早两年婚**；2、肖狗或狄姓之人主夭折，大凶，又逢狗年加凶；3、肖牛人，必任妻摆布，背离家庭，不顾父母；4、**次子越位，事业、才智均超越长子很多**。\"**②长子越位——雷天大壮（长子住西北角，未婚）**：\"1、**性刚强，一家之主，越居父位**；2、**家庭责任感重**；3、**不婚为吉**，如婚配为属兔、猴、羊，不出三个月婚破；4、事业独立自主，自由业利。**不要住超过三个月以上**。\"两条的共同点：**越位者会获得超出其身份的能力或责任**（次子才智超长子、长子担一家之主之责），但**代价落在婚姻与关系上**（次子主夭折或受妻摆布、长子主婚姻破）。\"不要住超过三个月\"一句尤须注意：**它承认越位之利可短用而不可长居**，这是全书少见的\"限时\"规则。","o":"TJ-0029 · 地脉道 01-05、15 听课笔记"},{"t":"十三、操作","h":"转运的时限与两代同住的安排","c":"方法——《地脉道》给出两条操作层面的时限与原则。**①改位的生效时间**：\"**阳宅位置改变一般一个季度转运（三个月）。**\"即调整住所安排后，须经约三个月方见效应，这与其\"气色主两个星期\"\"节气主两周\"的时间尺度形成对照——**人事（阳宅）之变慢于气色之变**。**②两代同住的原则**（笔记原文）：\"**如果两代人同住一个屋檐下，年轻夫妻应住西北角坤卦、父母应住东北角艮卦——家和万事兴**。\"此处须提示：**原文表述有笔误**——西北为乾（父位）而非坤，东北为艮（三子位）而非父母本位；若依其\"长幼有序\"的体系本意，应是**年轻夫妻（新的一家之主）居父位（西北乾）、退居的父母居东北（艮，养老之位）**，即\"**家权移交、长幼易位**\"——这与\"名＝位\"的口诀一致。读者宜按体系逻辑理解，不必拘于字面。","o":"TJ-0030 · 地脉道 01-05、09 听课笔记  ---"},{"t":"十四、盘的结构","h":"十二宫的排列与三方四正","c":"定义——紫微斗数的盘面由十二宫构成，其**顺时针排列顺序**为：**命宫、父母宫、福德宫、田宅宫、官禄宫、朋友宫（仆役宫）、迁移宫、疾厄宫、财帛宫、子女宫、夫妻宫、兄弟宫**。此顺序不可随意调换，因为**宫与宫的相对位置本身即参与判断**（如命宫与迁移宫相对、财帛宫与福德宫相对）。**\"三方四正\"**指一组固定联动的宫位：**命宫—财帛宫—迁移宫—官禄宫**，即看一个人的命，须同时看其财（财力）、迁（外出）、官（事业）三面，四者互参。另有一条用法：\"**宫性：批流年，例如流年在财帛，主这一年重要事在财上**\"——即**流年落在哪一宫，该年之事即以该宫为主题**。**须说明**：此为紫微斗数的排盘与判读规则，属术数体系，**十二宫与人生的对应关系无实证依据**；此处记录的是\"其体系如何运作\"，不是\"人生如何被决定\"。","o":"TJ-0031 · 天纪·紫微详解·第一章（PDF 第6页）"},{"t":"十四、盘的结构","h":"先天命与后天命的分野","c":"要点——倪海厦在十二宫之上又加了一层\"先后天\"的分野，这是其讲法中最有条理的一处：**先天命格看命宫**——\"先天命格（长相、个性、行为模式、一生成败）\"；**先天之财**看两处——\"命宫里会到财星（家财丰厚的先天命：命宫全是财星或财帛宫全是财星）\"以及\"财帛宫也是会到财星\"，其所列财星为\"**武曲、太阴、天府、禄存、化禄**\"。**后天命格看三宫**——\"**财帛宫：私企，从商；官禄宫：公家，从政；迁移宫：外出发展**\"，三者代表三条出路；**后天之财**则看\"如果财星会到官禄宫、迁移宫，为后天自己赚到的财\"。**这一分法的意义**在于：它把\"命里有的\"与\"自己挣的\"分成两组宫位——**命宫与财帛宫的财星主\"继承与固有\"，官禄宫与迁移宫的财星主\"经营与外求\"**。**这一结构与其人间道\"努力与命分属两个层面\"的立场一致**，可视为该立场在术数层面的落实。","o":"TJ-0032 · 天纪·紫微详解·第一章（PDF 第6页）"},{"t":"十五、宫位的判读","h":"夫妻宫必看福德宫：最反直觉的一条","c":"要点——这是全书讲得最明确的一条判读纪律，原文：\"**指婚姻、光看夫妻宫大错特错，批夫妻宫时一定要看福德宫。很多人不会批福德宫。福德为人一辈子的福禄。祸福无门，咎由自取。**\"并举例：\"**夫妻宫很好，但福德宫很不好，那夫妻关系也会不好。**\"**其逻辑**是：夫妻宫所主为\"婚姻这件事的形态\"（如配偶的条件、相处的样貌），而福德宫所主为\"一个人一生的福禄与心境\"——**若心境不平，再好的婚姻形态也会过成苦**。故他主张**福德宫是夫妻宫的底子**。**另一条同类的纪律**是关于\"说不说\"的：\"在算到有人是庶出命时，**要保留，不要说出来**，可能他本人还不知道自己的真实身份\"；\"批的时候**不要全部说出来，要有所保留**；有的**不讲还可避祸，讲了反而不能避祸**。\"**这两条合起来，构成其术数伦理的轮廓**：**一是不以单一宫位断人事（必看关联宫），二是不把断语说尽（留余地）**。**须说明**：此种\"伦理\"虽有其分寸感，但**\"说了反而不能避祸\"这一理由本身仍属术数逻辑**，不构成对\"是否该说\"的真正约束——真正的约束应当是\"断语无据，故不应据以指导他人生活\"。","o":"TJ-0033 · 天纪·紫微详解·第一章（PDF 第8页）"},{"t":"十五、宫位的判读","h":"疾厄宫：经络歌诀与体像方位","c":"方法——疾厄宫是紫微与中医相接最紧的一处，其判读依赖两套坐标。**①十二经流注歌诀**（原文录\"中医歌绝\"）：\"**肺寅大卯胃辰宫，脾巳心午小未中，申胱酉肾心包戌，亥焦子胆丑肝通**\"——即以**十二地支对应十二经脉当令之时**：寅时（3—5 点）肺经、卯时（5—7 点）大肠经、辰时（7—9 点）胃经、巳时（9—11 点）脾经、午时（11—13 点）心经、未时（13—15 点）小肠经、申时（15—17 点）膀胱经、酉时（17—19 点）肾经、戌时（19—21 点）心包经、亥时（21—23 点）三焦经、子时（23—1 点）胆经、丑时（1—3 点）肝经。**此歌诀是中医子午流注的基础，属医学内容，与术数无关**，可用。**②体像方位**——\"以十二宫方位的象论人体：**中宫肚脐，午、未宫为头，巳宫为右肩，申宫为左肩，辰、酉宫为右、左胸，卯、戌宫为右、左胁，寅、亥宫为右、左足，子、丑宫为男人精宫、妇人子宫**\"。**③其自陈的限度**——\"哪个宫杀星最多、最差，相对的器官，**只作参考用，批的时候没用**。比如七杀星在疾厄宫，表有痔疮。**有病、什么时候发看流年。**\"**这条自陈很重要**：他明确承认疾厄宫的星曜对应\"只作参考\"，真正判断发病要看流年——**即连他自己也不把宫星对应当作诊断依据**。","o":"TJ-0034 · 天纪·紫微详解·第一章（PDF 第9~10页）"},{"t":"十五、宫位的判读","h":"朋友宫与观人术：三条可用的判据","c":"要点——朋友宫（仆役宫）的三条用法都很直白：\"**①如果朋友宫杀星太多，合伙做事业必败；②朋友宫吉星多，合伙大吉；③什么时候合伙，看流年，流年财星入住大吉。**\"其中第三条把\"时机\"与\"人\"分开判断，是术数里少见的务实之处。**更有价值的是附在其后的\"观人术\"**——三条判据与星曜无关，纯是识人经验：**①\"小人定义：能够害到你的是小人。可能是你最亲的人。因为亲情或友情或爱情心甘情愿地被他人害。只要是害得到你的人都是小人。\"** **②\"君子（人才）难进易出；庸才易进易出；小人易进难出。\"** **③望神：\"眼神要正。眼睛越细越长越好，只见黑珠子。笑起来眼睛一条缝，大智慧。\"** **第②条尤可玩味**：它把\"进\"（与你结交的难易）与\"出\"（与你断绝的难易）交叉组合，得出三种人——**难进易出者为君子**（不轻易结交，也不纠缠）、**易进易出者为庸才**（无所谓）、**易进难出者为小人**（凑上来容易，甩掉极难）。**这一判据与术数无关，是纯粹的社会经验，可直接使用**；而它之所以出现在紫微讲义里，恰说明**倪海厦讲术数时大量掺入的是人情经验，而非星命推演**。","o":"TJ-0035 · 天纪·紫微详解·第一章（PDF 第11页）"},{"t":"十五、宫位的判读","h":"田宅宫与六亲宫的面相旁证","c":"要点——田宅宫所主为\"**祖业、制产吉凶、官司是非**\"，并特别注明\"**房屋的坐向也是从田宅宫看**\"（这与其地脉道以阳宅方位断吉凶的做法相接）。其余六亲宫（父母、兄弟、子女、夫妻）在讲义中**几乎都以面相作为旁证**，形成\"宫—相\"互参的体例，其例：**父母宫**——\"如果黯淡无光，庶出或螟蛉子\"；相上\"**额上日角、月角，左为日表父，右为月表母，下陷表亡，黑黑暗暗的表重病**\"；\"如果一个人眼睛一上一下，日月下陷，表示此人为领养，且身生父母已亡\"。**兄弟宫**——\"兄弟宫化忌有凶星\"可解为三种：兄弟不和（\"眉毛左叉右叉，很乱\"）、兄弟夭折（\"左眉断掉\"）、合伙破财。**子女宫**——\"眼袋左小右大，表有女无子；眼袋有黑点，表为子女担忧\"。**夫妻宫**——\"一条纹向下，主妻不贤，生离；有二、三条上翘，主妻贤，夫妻和睦\"。**须说明**：这类\"某处皱纹／眼袋／眉形对应某亲属吉凶\"的说法，**既无解剖学依据，也无统计验证**，属传统相术；**读其讲义时，可将宫位当作组织信息的框架，但不可用相说判断任何具体的人**。","o":"TJ-0036 · 天纪·紫微详解·第一章（PDF 第7~9页）"},{"t":"十六、星性","h":"紫微：帝星与其\"孤\"","c":"定义——紫微星的基本性质：\"**（阳）星性：北斗星君，帝星，代表文武官带、贵人、正财（固定收入），解厄、制化（凶星遇到紫微，逢凶化吉）；配合星：左辅、右弼。**\"其判读有两个特例：**①\"命宫有紫微星，没有辅星，为僧道或代表人厚道、性情孤独\"**——即**帝星无辅，则成孤君**（有君无臣），故其象转向清高孤寂；**②\"女命紫微独守福德宫，主一世孤单\"**——同一逻辑用在福德宫，则主心境之孤。**这两条是紫微斗数的典型思路**：**星性本身无吉凶，吉凶生于\"配置\"**——同为一颗帝星，得左辅右弼则为众望所归，失辅则孤。**此思路与中医的\"配伍\"观同构**（同一味药，配伍不同则功效不同），可视为其术数与医学共享的思维习惯。**须说明**：此为术数星性之说，不作人生判断依据。","o":"TJ-0037 · 天纪·紫微详解·第二章（PDF 第14页）"},{"t":"十六、星性","h":"官星与财星：归位原则","c":"要点——讲义提出一条极简的判读原则：\"**官星进入官禄宫最好，财星进入财帛宫最好**\"；\"**官带星进入官禄宫越大，做的官越大**\"。而两处\"错位\"的判断更见其思路：**①\"财星进入官禄宫为贪官或手握财权的官\"**——即财星不该在官位，落在官位则\"以官取财\"；**②\"鼻子很大、颧骨很小，自己有钱；鼻子小、颧骨很大，是贸易公司的财务经理，为他人管财\"**——即以\"鼻（财）\"与\"颧（权）\"的大小配比判断\"钱权是否在己\"。**其共同逻辑**是：**星与宫须\"各归其位\"，错位即为偏**。**这一原则与中医的\"归经\"同构**——药入其经则效，入非其经则为偏。**故其术数体系的价值，或许不在预测，而在此类\"结构类比\"所提供的思考方式**：**看一个人，先看他所拥有的与他所处的位是否相称**。**须说明**：此为术数之说，不可据以判断他人的品行（\"贪官\"之说尤不可对具体人使用）。","o":"TJ-0038 · 天纪·紫微详解·第一章、第二章（PDF 第8、第14页）"},{"t":"十七、相法","h":"面相：财权的三种配比","c":"要点——面相部分虽杂，其中\"财—权\"配比的一组讲得最清楚，可独立成说：**①\"鼻大颧小，只有财\"**——鼻主财（\"男人的鼻子为财帛宫\"\"男人的鼻子主事业\"），颧主权（\"颧同权\"），**财大权小，则有钱而无势**；**②\"鼻大颧大，两相呼应，主财权很大\"**——财与权相配；**③\"颧大鼻小，主掌小财权，如贸易公司财务经理\"**——权大财小，则**替人管钱**。另有三条与之相关的：**\"一狮鼻（肉肉的），大富；二悬胆鼻，大富\"**；**\"男人的手绵绵的，大富；女人的手，干干的，旺夫\"**；**\"山林突出，表祖业很大\"**。**另有一组\"气色\"之说**：\"黄润主喜事；女人鼻子黄润主婚喜；印堂、颧黄润主升官；眼眯眯主赚大钱\"；\"**化忌的色：非常黑暗，如有灰尘（像没有洗脸）**\"；\"**将死色：枯萎色，青蓝色（头发无油蓬起来，脸无反光，主肾脏衰竭）**\"。**⚠ 最后一条须特别提醒**：\"脸无反光、头发无油\"作为\"肾衰竭\"的征象，**在医学上不可靠**——肾衰竭的表现是水肿、贫血（面色苍白）、尿素霜（罕见）、乏力等，**任何以面相判断脏器衰竭的做法都可能延误就医**，凡有不适须查肾功能（肌酐、尿素氮、尿常规）。**相说可作民俗了解，不可作健康判断。**","o":"TJ-0039 · 天纪·紫微详解·第一章（PDF 第12~13页）"},{"t":"十七、相法","h":"手相九宫：一张掌上的\"风水图\"","c":"要点——手相部分最成体系的是**掌上九宫**，其布局与后天八卦完全对应，可视为\"把阳宅的方位图复制到手掌上\"：**明堂**（掌心）——\"要平广，凹下去能留住水为最吉，绝不能突出，突则财外流\"；**乾**（父母、祖宗）——\"饱满丰隆、凸起来，祖上风水好；平或凹陷，代表与父母相克\"；**坎**（祖业）——\"饱满，祖业兴旺；凹陷，白手起家\"；**艮**（田宅、兄弟）——\"饱满，田宅、兄弟多；扁平，兄弟稀少\"；**震**（妻）——\"饱满，妻贤；凹陷，妻不贤或妻身体不好或过世\"；**巽**（财禄）——\"饱满，财禄兴盛；凹陷、横纹很多，破财\"；**离**（官禄）——\"饱满，官星大\"；**坤**（子媳）——\"饱满，子媳贵；扁平，无子媳；暗黑，损夫\"；**兑**（朋友下属）——\"饱满，朋友下属贵；扁平，所交朋友不好\"。**另有一条纹路的判法**：\"**手掌中有一条贯穿整个掌指向中指，为天柱纹，发科甲**\"；\"手纹很细、清秀为心性正；手纹多、横纹多，心狠手辣；手纹深而复杂，心机很深；手纹很少，憨厚；**手纹透到手背，破祖业**\"。**须说明**：九宫与八卦方位的对应本身是**传统术数的构造**（把空间图式套到掌上），**并无解剖学或统计学依据**；其价值在于展示**同一套符号如何在不同载体间迁移**——这正是天纪与人纪共享底层符号的又一证据。","o":"TJ-0040 · 天纪·紫微详解·第一章（PDF 第13页）  ---"},{"t":"十八、体例","h":"人间道的讲法：卦名＋占例＋图象＋爻辞＋注","c":"要点——《人间道》讲六十四卦，每一卦都按固定五段展开，这与常见的\"译注体\"很不同：**①卦名与卦象**（如\"坤为地\"）；**②占例**——标明此卦对应的历史典故，如坤卦\"**此卦汉高祖与项羽交争卜得之，乃知身霸天下**\"；**③图象**——描述卦图中所绘之物（如坤卦\"**十一个口，一官人，坐看二串钱**\"），每一物皆有取义；**④卦辞与爻辞原文**（大字）；**⑤注解**（小字，逐句解）。**这一体例的用意**在于：**先给一个\"这卦曾应于何事\"的实例，再解其理**——使抽象的卦辞落在具体人事上。故其讲义的性质是**\"以人事解易\"**，而非\"以易测天\"。**须说明**：占例（\"高祖卜得之\"一类）属传说，无史料依据；图象取义亦属传统术数的\"象数\"手法，如\"十一口\"对应\"吉\"字之形（十一口合为\"吉\"），**是字形游戏而非事实推断**。**读此类内容，可取其\"卦理如何用于处世\"的部分，不必信其\"某卦应某事\"的占验。**","o":"TJ-0041 · 天纪·人间道（PDF 第4~7页）"},{"t":"十九、乾卦","h":"元亨利贞：乾之四德","c":"定义——乾卦的卦辞\"元、亨、利、贞\"，讲义逐字作解，构成一套\"成事四条件\"：**元**——\"**合于理之生长，为美之至嘉也**\"，即万物生长须合乎法则（\"万般事物皆有一定之法则，吾人须体理之治，则发展合于天道自然\"）；**亨**——通达；**利**——\"**合于义，则能利于万物之遂行**\"，并有一个极现代的批评：\"**而今人类制造之物，无法完全回收，造成自然界之失衡，此不合于义之道也，不合于利物之理**\"；**贞**——\"**因坚定不移之意志，则定以成事**\"（\"贞固，足以干事\"）。末句总收：\"**君子行此四德者，故曰：乾，元，亨，利，贞。能行此四德，则合乎乾天之道。**\"**其可取处**在于\"利\"字的解释——把\"利\"从\"获利\"转为\"**利物**\"（利于万物之遂行），并由此推出一条判准：**凡不能回收、破坏自然平衡的制造，皆\"不合于利物之理\"**。**这一条与其批判现代文明病的立场一脉相承**，且比其医论更为稳健——**因为它不依赖任何医学主张，只依赖\"取用须能归还\"这一常识**。","o":"TJ-0042 · 天纪·人间道·乾卦（PDF 第3~4页）"},{"t":"十九、乾卦","h":"六爻：一条地位与心法的对应表","c":"要点——乾卦六爻，讲义逐爻给出\"位\"与\"心法\"的对应，构成一张从潜伏到极盛的处境表：**初九「潜龙勿用」**——\"**阳刚之微现，如龙之潜隐**\"，其心法为\"**时不至，隐其行，不求为人知也；自信自乐，见可而动，知灾而避，守正道之心坚而不移**\"；**九二「见龙在田」**——\"**因非为君位，但有中正之德，谨言慎行，但求处于无过之地**\"，故\"虽不为君，但为君之德\"；**九三「终日乾乾」**——\"**位居下卦之上者，已近君位**\"，故须\"**进德修业，终日谨慎言行，知进退之机**\"，\"不予人有野心之戒，故虽处危地但无灾至\"；**九四「或跃在渊」**——\"**或即进退须待时之意，时行时止，不可恒久不变**\"，\"君子之顺时而动，犹影之随形\"；**九五「飞龙在天」**——\"**有中正之德的人，居于君王之位，天下人皆归仰其德**\"；**上九「亢龙有悔」**——\"**有阳刚之正德而居不适位，则动而必悔，因无民无辅，独力难成也**\"。**这张表的价值不在占卜，而在它给出了六种处境的应对**：**位卑时守（潜）、有位无君时谨（见龙）、近君位时惕（乾乾）、可进可退时待时（或跃）、居尊位时以德服人（飞龙）、过盛时知退（亢）。** 其中\"**九三最险**\"的提示尤有见地——**已近权力中心而德望又显，正是最易招忌之位**，故其法为\"进德修业、不使人觉其有野心\"。","o":"TJ-0043 · 天纪·人间道·乾卦（PDF 第3~5页）"},{"t":"十九、乾卦","h":"\"知进而不知退\"：亢龙之悔的本义","c":"要点——乾卦最要紧的一句注解，落在\"亢\"字的定义上：\"**亢之为言也，知进而不知退，知存而不知亡，知得而不知丧**；其唯圣人乎！**知进退存亡，而不失其正者，其唯圣人乎！**\"即\"亢\"不是\"高\"，而是**单向**——只知进、只知存、只知得，而不知其反面。故\"悔\"不生于位高，而生于**失去回旋的能力**。**另一句与之相辅**：\"**贵而无位，高而无民，贤人在下位而无辅，是以动而有悔也**\"——即高位而失其实（无位、无民、无辅），则任何动作皆成悔。**这两句合起来，是《人间道》全书的骨干**：**判断一个人是否危险，不看他站得多高，看他还退不退得下来、还有没有人可用。** **其现实意义**远超术数——**任何权力、财富、关系的经营，若已到\"只能进不能退\"的地步，即是亢。**","o":"TJ-0044 · 天纪·人间道·乾卦（PDF 第4~5页）"},{"t":"十九、乾卦","h":"用九：乾卦之用","c":"要点——讲义开宗明义指出：\"**乾卦之用，即用九之道。**\"而\"用九\"的落实方式是\"**因天与圣人同知且同用，天下因治**\"；另有一句解释：\"**用九，乃天之则也，天之法则即为天道，圣人禀道而行，得失吉凶立知于事之初，此为天则。**\"**其可解处**在于\"**得失吉凶立知于事之初**\"——即**在事情刚开始时就看出走向**，这与其人间道\"观象、观变\"的方法一致：**不是事后追悔，而是起点处看得失**。**另有一段对\"大人\"的描述，也是全书境界最高处**：\"**夫大人者，与天地合其德，与日月合其明，与四时合其序，与鬼神合其吉凶；先天而天弗为，后天而奉天时。**\"——即\"大人\"不是能改变天，而是**先于天时则天不违之，后于天时则顺之**。**须说明**：\"鬼神\"在此训为\"造化之迹\"，非人格神；这一段是《易传》原文的注解，属哲学而非术数。","o":"TJ-0045 · 天纪·人间道·乾卦（PDF 第4~5页）"},{"t":"十九、乾卦","h":"三爻位之险：重刚而不中","c":"要点——讲义对九三、九四两爻的处境有一段专门的辨析，可与其\"位置决定风险\"的思路合看：**九三**——\"**重刚而不中，上不在天，下不在田**\"，注：\"因九三位为过中而又居下卦之上，属相位，上又未至君位，又为阳刚之性，故属危惧之地；**圣人知戒，竞竞惕惕以防危，故虽处此时而无咎也**\"；**九四**——\"**重刚而不中，上不在天，下不在田，中不在人**\"，注：\"九四为近君位，亦属危地，**或进或退，但求平安耳，故可无咎。君子能曲能伸。**\"**两爻的差别值得留意**：九三\"**但求无过**\"（守），九四\"**能曲能伸**\"（活）——**同在危地，一守一活，因为九三已居下卦之上（名分已显），九四尚未入上卦（进退未定）**。**这与其\"亢龙\"之说构成完整的一套风险观**：**位卑则守，位显则谨，位未定则活，位过盛则退。**","o":"TJ-0046 · 天纪·人间道·乾卦（PDF 第5页）  ---"},{"t":"二十、说明（天机道星象）","h":"五宫与二十八宿：一张天上的地图","c":"定义——《天机道》开篇按古代天官体系把天区划分为**五宫**，其原文：\"天上布列的星辰，古来共分五大部，亦为『五宫』，其列宿于天，共有**二十八宿，分列东南西北**。\"其中——**中宫**：\"其主要的星为『**天极星**』，在天顶正中央偏北；其中最亮的一颗星即为『**天帝**』，旁有三星连串，代表**三公**；向北有四颗星成状，其最后的一大星为**正妃**，三小星即**嫔妃**\"；**东宫**：\"为『**青龙宫**』，主星为『**房**』、『**心**』二宿\"——\"心宿……为天帝施政的殿堂\"；其余南宫（朱鸟）、西宫（咸池）、北宫（玄武）各领七宿。**二十八宿的分配**为东方青龙七宿（角、亢、氐、房、心、尾、箕）、北方玄武七宿（斗、牛、女、虚、危、室、壁）、西方白虎七宿（奎、娄、胃、昴、毕、觜、参）、南方朱雀七宿（井、鬼、柳、星、张、翼、轸）。**这一体系的实质**是**以\"帝廷—藩臣\"的政治结构映射星空**：把最亮的极星称\"天帝\"，环其外的星称\"藩臣\"，于是天上的星图成了人间朝廷的镜像。**其现代对应**：二十八宿是中国古代的**赤道坐标分区**，确有其天文观测价值（可用于定节气、定时令），**但\"某星主某事\"的推论属占星，不是天文学**。","o":"TJ-0047 · 天纪·天机道（PDF 第5~6页）"},{"t":"二十、说明（天机道星象）","h":"北斗：天帝之车","c":"要点——北斗在《天机道》中的地位极高，其功能被概括为六项：\"北斗七星外观上看起来似车子，为**天帝所专用，在中央转，可节制四方，分别阴阳，建立四时，协调五行，推移节气，蕃定星纪**。\"并注明其指向：\"**斗柄的部分连接东方青龙七宿的『角宿』……斗头的部分正下方枕着『参宿』的上头部**。\"**附于北斗的几组星，各有其政治喻义**：**文昌宫**（斗魁上方六星，名\"上将、次将、贵相、司令、司中、司禄\"）；**三能**（斗下方六星，两两为一组）——\"如三能颜色相同，表示**君臣协合**；如颜色不同，表示**君臣互相冲突**\"；**辅星**（北斗第六星旁）——\"如其明亮接近，表示**辅臣亲和且强盛**；如远去黯淡，表示疏远衰弱\"；**贯索**（圆形八星）——\"为**贵人的牢狱**，如其中充满星星，示贵人落陷、君子道消之时\"。**这一整套\"观星以观政\"的思路**，其核心是把**星的位置、明暗、颜色**解读为**人间的秩序状态**——**君臣是否协合、辅臣是否亲附、贤人是否在野**。**其可玩味处**在于\"三能同色则君臣协合\"这类判据的**结构性**（同色＝同心），但**其推论仍不可检验**：星的颜色差异源于恒星温度与星际介质，与人间君臣无关。","o":"TJ-0048 · 天纪·天机道（PDF 第5~6页）"},{"t":"二十一、天运","h":"三十年一小变、百年一中变、五百年一大变","c":"要点——这是《天机道》给出的\"时间尺度\"框架：\"**天运古有记载，三十年一小变，一百年一中变，五百年为一大变，三大为一纪，经三纪而成一完整之循环，共为四千五百年。**\"由此推出一条治理原则：\"**治国者一定要看三十年的小变，视察前之一千年，然后整个天地与人的关系，才能随着天运而趋于完备——顺天而治者昌，逆天而治者亡。**\"**这一框架的意义**在于：它主张**观察周期必须长于人的一生**——三十年为一代人，一百年为一世，五百年为一运；若只以眼前数年判断得失，则必然误判。**其合理内核**（抛开星象）：**凡社会、气候、产业、人口的变化，皆有其超出个体生命尺度的节律**，以短期数据判断长期趋势，是常见的错误。**其不成立处**是\"四千五百年一循环\"这一具体数值——**无任何依据**，属古代术数的整数化构造。**故这条的正确用法是**：取其\"须以更长尺度看变化\"的提醒，弃其具体年限。","o":"TJ-0049 · 天纪·天机道（PDF 第5页）"},{"t":"二十二、易理","h":"易之三义：简易、变易、不易","c":"定义——《天机道》对\"易\"给出三个层面的界说，这是全书最精炼处：**①简易**——\"**简易也；万法皆不同，然其神只有一也**\"（即方法千差万别，而其中的\"神\"只有一个）；**②不易**——\"**不易也；事物之外象皆变，而其理不变也**\"（现象皆变，而其理不变）；**③变易**——\"**易，变易也，随时变易以道也**\"（随时而变，以合于道）。**这三义的结构很完整**：**变易**讲现象层（一切都在变）；**不易**讲规律层（变之中有不变者）；**简易**讲方法层（把握住那个\"一\"，则万法可统）。**三者缺一不可**——只讲变易则流于相对主义，只讲不易则僵化，只讲简易则空疏。**这一组界说与其医学主张同构**：他屡言\"辨证论治\"（变易）、\"万病一理\"（不易）、\"简化到 E=mc²\"（简易），可见**其术数与医学共享同一套思维骨架**——这在天纪与人纪之间提供了方法论上的连接点。","o":"TJ-0050 · 天纪·天机道（PDF 第1~3页）"},{"t":"二十二、易理","h":"圣人之道四：辞、变、象、占","c":"要点——《天机道》承《易传》之说，列\"圣人之道四\"：\"**易中圣人之道有四：以言者尚其辞，以动者尚其变，制器者尚其象，卜筮者尚其占。**\"并对应两种用法：\"**君子静则观象以悟其辞，动则观变以玩其占。**\"**这四项的分工**是：**辞**（卦爻辞）——用于**言说、论理**；**变**（爻变、卦变）——用于**行动、决策**；**象**（卦象、物象）——用于**制器、造物**；**占**（筮法）——用于**问吉凶**。**后一句\"静／动\"之分更实用**：**静时看象、由象悟辞**（即从具体形态中读出道理，属\"理解\"）；**动时看变、由变玩占**（即从变化的趋势中判断进退，属\"决策\"）。**其可采处**在于：它把\"读易\"分成**两种场合、两种方法**——**不是任何时候都要占，静时以象悟理，动时才问吉凶**。**须说明**：《天机道》全书的占法（含皇极经世、铁版神数、六壬等）皆属术数，本章不展开其操作，只记其框架。","o":"TJ-0051 · 天纪·天机道（PDF 第1~3页）"},{"t":"二十二、易理","h":"前贤与\"神\"的传承","c":"要点——《天机道》序言中列了一串\"得易道之神\"的人物：\"**姜太公、范蠡、鬼谷子、张良、诸葛亮、李淳风、程颐、邵康节、刘伯温之用易**\"，并称\"得此易道之神，则**天下万事皆能化繁为简矣**\"。同时它对传承有一个悲观的判断：\"**前贤失其义而只能传其言，后学者言而忘其味，自秦以后无传矣**\"；\"今世之人，大都得其辞而未达其意，此著作以悟象之角度申其义，此其目的也。\"**这一段的意义**在于说明其写作动机：**他认为后世只继承了\"辞\"（文字），而丢失了\"象\"（图象）与\"意\"（精神）**，故他要\"以悟象之角度\"重新申说。**这也解释了《人间道》为何每卦先给图象、再给爻辞**——**图象不是装饰，而是他认定被丢失的那一半**。**须说明**：所列人物自姜太公至刘伯温，跨度千余年，多为传说与史实混杂（如李淳风、邵康节确有著述，姜太公之《六韬》则成书较晚）；**\"自秦以后无传\"这一判断亦属其个人史观**，不可作为学术结论。","o":"TJ-0052 · 天纪·天机道（PDF 第1~3页）"},{"t":"二十三、性质","h":"天官之学与天文学的分界","c":"要点——读《天机道》须分清两件事，否则易把占星当作科学。**①属于天文学的部分**：二十八宿的分区、北斗的指向（斗柄指东则天下皆春）、日月五星的运行轨道、节气的推定——**这些是古代观测的成果，有实用价值**（中国农历即由此而来）。**②属于占星术的部分**：\"五星入某宿必有事发生\"\"三柱不全世间即有争\"\"月与五星犯帝座则群臣有谋\"\"箕宿光亮则小人得势\"\"井宿主水利\"\"尾宿九星颜色不同则君臣不和\"——**这些推论以\"天人感应\"为前提，无任何可检验的机制**。**③其间的过渡地带**：\"日食、彗星、五星逆行\"等异常天象**确与人事无因果**，但古人对\"异常\"的警觉本身有心理价值。**故本章的定位是**：**记录一套以星空为镜看人间的思想体系**，其中天文观测的部分可用，占断的部分不可用。**这一处理方式与其医论的整理原则一致**——**分其可采与不可采，而不是整体接受或整体否定**。","o":"TJ-0053 · 天纪·天机道（PDF 第4~6页）  ---"},{"t":"二十四、卦象（坤卦）","h":"卦图的七个物象","c":"方法——《人间道》每卦先给\"卦图象解\"，坤卦所绘七物及其取义为：**①\"十一口：吉也，陈姓人也\"**——十一口合为\"吉\"字之形，故取\"吉\"；\"陈姓人\"则以字形（\"陈\"含\"东\"）附会。**②\"一官人：倌人，丈夫也，公务员也\"**。**③\"坐看二串钱：欲拿不得，忧心忡忡状\"**——此物取\"有财在前而不可取\"之象。**④\"一马者：肖马人；指官贵；指调动也\"**——一物三义（属相、官位、调动）。**⑤\"金甲神：示民心也\"**。**⑥\"授文书与官：授官封侯\"**。**⑦\"土堆上有四点：黑也，背有阴谋也\"**。**这套\"图象取义\"的方法**是《人间道》的骨架（见乾卦章），其特点是**一物可有多解**（如\"马\"既是属相、又是官职、又是调动），**由读者依所问之事择一而取**。**须说明**：此类取义属**象数附会**（字形、物象的联想），**无逻辑必然性**；\"十一口为吉\"即拆字游戏，\"陈姓人\"更是把字形与姓氏相连。**其价值在文化层面**（可见古人如何以图像组织对处境的判断），**不在预测层面**。","o":"TJ-0054 · 天纪·人间道·坤卦（PDF 第17页）"},{"t":"二十四、卦象（坤卦）","h":"\"身霸天下\"：坤卦的占例","c":"要点——坤卦所附占例为：\"**此卦汉高祖与项羽交争卜得之，乃知身霸天下。**\"**此例的用意**与其体例一致：**先给一个\"此卦曾应于何事\"的著名案例，使抽象的卦辞有具体的落点**。**但须留意其内在的紧张**：**坤卦全卦讲的是\"柔顺、为臣、不居功\"之道**，而其占例却应于\"**身霸天下**\"（即成为君主）——**由\"臣道\"之卦而得\"君位\"之验，这一反差恰恰是坤卦深意所在**：**坤不是\"永远为臣\"，而是\"以臣之道得君之位\"**——**守柔顺、不居功、含章养晦，反能终成大业**。六三\"含章可贞，或从王事，无成有终\"、六五\"黄裳元吉\"（\"臣居尊位，或妇人居尊位，须有黄裳之戒\"）**皆在说这一层**：**坤卦给的是\"处下位而不失其正\"的法度，其最高成就反而是\"居尊位\"**。**这一读法比\"坤＝柔顺服从\"要深一层**。","o":"TJ-0055 · 天纪·人间道·坤卦（PDF 第17页）"},{"t":"二十五、卦辞（坤卦）","h":"牝马之贞：柔顺而健行","c":"定义——坤卦辞\"**元、亨、利牝马之贞**\"，其解：\"**坤乃地之厚德，示人效地之性，如牝马之柔顺而健行也；贞示坚心，但与乾不同——乃坚心于柔顺之念也。**\"**这一句的关键在\"牝马\"二字**：**马本健行之物，而\"牝马\"（母马）兼有柔顺与健行两性**——**故坤之德不是\"软弱\"，而是\"以柔顺的方式持久地行进\"**。**\"贞\"字的分别更精**：**乾之贞是\"坚心于刚健\"，坤之贞是\"坚心于柔顺\"**——**同是\"坚定不移\"，所坚者不同**。**这一区分解决了\"柔顺是否等于没原则\"这一常见误解**：**坤的柔顺本身即是其所守之原则，故\"坚心于柔顺\"一点也不软**。**其后\"君子有攸往\"的解**也顺此：\"**君子因行柔顺，且表里一致，合乎坤地之德性**\"——**\"表里一致\"是对\"柔顺\"的限定**：**若外顺而内不服，则非坤德，而是伪装**。","o":"TJ-0056 · 天纪·人间道·坤卦（PDF 第17页）"},{"t":"二十五、卦辞（坤卦）","h":"先迷后得：阴从阳的分寸","c":"要点——\"**先迷后得，主利**\"一句，其解为：\"**阴从阳也。即不了解但知须从阳刚之中正；如不知而欲进，则迷错，损失在己；须居于后，则利。如君臣之道，柔顺乃臣之职也。**\"**这段解出了三层意思**：**①不知则从**——\"不了解但知须从阳刚之中正\"，即**在自己尚未明理时，先依从正确的一方，不必急于自专**；**②抢先则迷**——\"如不知而欲进，则迷错，损失在己\"，**即不明白却抢在前面，错误与损失由自己承担**；**③居后则利**——\"须居于后，则利\"。**这三层合起来是一条处境判据：当你的判断力尚不足以主导时，\"居后而从\"优于\"居前而迷\"**。**其后\"西南得朋，东北丧朋，安贞吉\"**的解为：\"**西南为阴位，东北为阳位，阴必从于阳；阳之正而阴亦正，由阳刚之中正，去芜存菁，故能成化育之功也。**\"——**即\"得朋\"是与同类相聚（安于本位），\"丧朋\"是离开同类而从阳（上进）**；**两者皆吉，因为各当其位**。**这一条的现代读法可作**：**在团队中，先确认\"谁是那个中正的阳\"（即正确的方向），然后决定\"从\"还是\"主导\"**——**不明而争，是最坏的选择**。","o":"TJ-0057 · 天纪·人间道·坤卦（PDF 第17页）"},{"t":"二十六、六爻（坤卦）","h":"履霜坚冰：戒小人于初","c":"要点——坤卦初六\"**履霜，坚冰至**\"，是全书中最著名的预警之爻，其解与引申极为精彩：\"**圣人于阴之始生，知其将长，此时戒之**——犹人之履及霜，则知后必有坚冰；**故小人始虽甚微，但绝不可使其长，长盛则凶也**。\"**其后有一段议论，是全章最锋利处**：\"**故圣人戒小人于初——如任小人因循不阻止，则终至凶。故吾人须戒之于初。小人表面常有可怜，博人同情，示弱以求悯恤，实则内心有所图。今人不知'济弱扶倾'与'姑息养奸'乃一线之差，一味以济弱扶倾为自傲，殊不知其姑息养奸，而至今小人才盛。**\"**这段议论的价值在于它提出了一个真实的判断难题**：**\"济弱扶倾\"（帮弱者）与\"姑息养奸\"（纵容恶人）在表面上常常一样**——**都是\"对一个显得可怜的人施以援手\"**；**其分野不在行为，而在\"是否任其渐长\"**——**助其一时之急是济，容其长期之恶是纵**。**\"履霜坚冰\"之义即在此：见霜而知冰将至，不是\"等冰来了再处理\"，而是在\"霜\"的阶段就辨明**。","o":"TJ-0058 · 天纪·人间道·坤卦（PDF 第18页）"},{"t":"二十六、六爻（坤卦）","h":"直方大：三德","c":"定义——坤卦六二\"**直、方、大，不习，无不利**\"，其解为三德：**\"直者，直来直往，不迂迴作假；方者，原则不因局势而改变，且正；大者，容载万物之胸襟乃大也。\"**再解\"不习\"：\"**不习，谓顺其自然，则无往不利；亦可云，因又直且方，气势乃大也。**\"**三德的次序很讲究**：**先\"直\"（对事不绕弯）、再\"方\"（对原则不改易）、后\"大\"（对人有容量）**——**由内而外、由己及人**。**\"不习\"的解尤其值得记**：**它不是\"不学习\"，而是\"不必刻意造作\"**——**因为直、方、大三德俱备，则\"顺其自然\"即无往不利**（\"地道之光显，由其直且方大，人人顺其自然，则奸人何所遁形\"）。**这一层与其医论中的\"读图之法\"相通**：**功夫在\"立标准\"，标准立定后，判断自然而成，不必临事造作**。","o":"TJ-0059 · 天纪·人间道·坤卦（PDF 第18页）"},{"t":"二十六、六爻（坤卦）","h":"含章可贞：不居其功","c":"要点——六三\"**含章可贞，或从王事，无成有终**\"，其解：\"**六三居相位，为臣之道：如有含章之美，即不居其功，将善归于君王，乃可因王无忌恶之心，终必吉。**\"**其补充极重要**：\"**处臣下之道，不当有功，免招君忌；但义之当为时，须立行之——此因不有其功，不失其宜，皆因时也。今人含而不为，皆不忠之人。**\"**这段话把\"藏\"与\"为\"的分寸讲清了**：**①不居功**（免招忌）与**②当为则立行**（不失其宜）**两者并存**——**不是\"藏起来什么都不做\"，而是\"做了而不认功\"**。**其批评\"今人含而不为，皆不忠之人\"更是一记重话**：**把\"不做事\"伪装成\"含章养晦\"，是另一种不忠**。**另一句\"圣人知含章之光大，故能养晦；小人有善唯恐人不知，此君子小人之分野\"**——**给出了一个可用的识人标准：有善而急于人知者，小人；有善而能藏者，君子**。**这一条与其紫微章\"观人术\"（\"君子难进易出\"）属同一套识人经验，可并看**。","o":"TJ-0060 · 天纪·人间道·坤卦（PDF 第18页）"},{"t":"二十六、六爻（坤卦）","h":"括囊与黄裳：两种守位","c":"要点——坤卦后两爻讲的是**\"如何待在自己不该越界的位置上\"**，两爻各给一法。**六四\"括囊，无咎，无誉\"**：\"**六四为居近君之侧位，藏口而不露，则平安无灾，此沉默之功也**\"；其象解：\"**能随时谨言，不妄言，此无害之因慎也**。\"**要点在\"无咎、无誉\"四字**：**括囊（像扎紧袋口一样不开口）所得的不是\"有功\"，而是\"无过\"**——**在近君之侧位，无过即是最大的功**。**六五\"黄裳，元吉\"**：\"**坤本论为臣之道，今臣居尊位，或妇人居尊位，须有黄裳之戒：应守中而居下，不可扬溢无节制，否则必有非常之变**\"；其象解：\"**因黄裳之美，乃内积至美，执中不过，位高但谦居下，故吉**。\"**两爻的差别很清楚**：**六四是\"位近而未尊\"——故以\"藏\"自处（括囊）；六五是\"已居尊位\"——故以\"谦下\"自处（黄裳）**。**\"位高但谦居下\"这一句，是全卦的收束**：**坤之道不是\"永远在下\"，而是\"无论多高，都保持在下者的姿态\"**——这与乾卦\"亢龙有悔\"恰成一对：**乾戒\"不知退\"，坤戒\"不知下\"**。","o":"TJ-0061 · 天纪·人间道·坤卦（PDF 第18页）  ---"},{"t":"二十七、说明（八字排盘）","h":"年干支：两个进位制与一个基准点","c":"方法——年干支的速算依赖两个事实：**天干十进位、地支十二进位**，以及一个可记的基准年。其原文给出的推法：**①年干**——\"从食指根部起排十天干，数字代表公元后年的尾数，如 1984 年、2004 年、2024 年\"；以案例示范：\"张三，男，1968 年 2 月 16 日 15 时 30 分\"——\"**查年干 8 在中指尖，天干是戊，1968 年天干是戊**\"（即**年干只由年份末位数决定：末位 4 = 甲、5 = 乙、6 = 丙、7 = 丁、8 = 戊、9 = 己、0 = 庚、1 = 辛、2 = 壬、3 = 癸**）。**②年支**——以 **1960 年（庚子）为基准**：\"左手排 1968 年的地支，已知 1960 年的地支是鼠，左拇指开始从子位按顺时针方向：**1960 子、1961 丑、1962 寅、1963 卯、1964 辰、1965 巳、1966 午、1967 未、1968 申**\"——故\"1968 是属猴的，**已知上面的天干是戊，1968 年干支为戊申**\"。**③跨十年以上的推法**（其补充）：因\"天干是 10 进位、地支是 12 进位\"，故每过十年，地支**逆行**两位（\"因为地支少两年，形成隔位退后，相当于逆行\"）——\"**戌位是 1970 年、申位是 1980 年、午位是 1990 年、辰位是 2000 年**\"；且\"**从 1960 年到 2020 年为 60 年，六十甲子一个循环，2020 年又回到子位为庚子年**\"。**这套方法的实质**是**模运算**：**年干 = (年份 − 4) mod 10、年支 = (年份 − 4) mod 12**，二者组合即得干支，六十年一循环。**读者若记不住手掌图，直接算余数亦可，结果相同**——**这正是\"可验算\"的好处**：**排盘的对错可以随时复核，不必依赖师传**。","o":"TJ-0062 · 天纪·紫微详解·第三章（PDF 第31~34页）"},{"t":"二十七、说明（八字排盘）","h":"五虎遁：由年找月","c":"方法——**月干支不能由公历月份直接得，须由年干推出**，其法名\"**五虎遁**\"（\"五虎遁是年找月的方法，五鼠遁是日找时的方法\"）。**口诀**（原文）：\"**甲己之年丙作首，乙庚之岁戊为头，丙辛之年寻庚起，丁壬壬位顺行流，若言戊癸何方发，甲寅之上好追求。**\"**其用法**：**先看年干属哪一组，即知正月的月干**——年干为**甲或己**→正月为**丙寅**；**乙或庚**→**戊寅**；**丙或辛**→**庚寅**；**丁或壬**→**壬寅**；**戊或癸**→**甲寅**；**二月起依次顺推**（\"戊申年正月起甲寅，二月乙卯、三月丙辰，余仿此\"）。**其所以称\"五虎\"**，因正月建寅（寅为虎），五组年干各得一个正月之干，故五虎。**须注意的关键一点**：**月干支以\"节气\"为界，不以农历月份为界**——案例中特别标出\"**立春：1968 年 02 月 05 日 02 时 08 分；惊蛰：1968 年 03 月 05 日 20 时 18 分**\"，即**2 月 16 日已在立春之后，故属正月（寅月）而非上年十二月**。**这一条最易出错**：**生日在节气交界前后者，月柱常差一位**，而月柱一错，整个盘即错。","o":"TJ-0063 · 天纪·紫微详解·第三章（PDF 第34~36页）"},{"t":"二十七、说明（八字排盘）","h":"一个完整的排盘案例","c":"要点——书中所给案例可作范本，其全过程为：**出生资料**——\"张三，男，1968 年 2 月 16 日 15 时 30 分；农历：戊申年正月十八日申时\"；**节气**——立春 1968-02-05 02:08、惊蛰 1968-03-05 20:18（故 2 月 16 日在寅月内）；**所排四柱**——\"**干支：戊申年、甲寅月、丙辰日、丙申时（日空：子丑）**\"。**逐柱的来源可核对**：**年柱戊申**——由年份末位与 1960 基准推得（见前条）；**月柱甲寅**——年干为戊，\"若言戊癸何方发，甲寅之上好追求\"，故正月即甲寅（生日在立春后、惊蛰前，属正月）；**日柱丙辰**——由日干支口诀推得（原文另给\"农历日干支推算口诀：大小月卦记心间，正一干支起根源；大后干同地支冲，小后干支退一天；初一十三二十五，支同隔干一位算\"，并说明\"正月小 29 天，正月初一干支是己亥日\"，逐日推至十八日得丙辰）；**时柱丙申**——15 时 30 分属申时（15—17 时），时干由日干按\"五鼠遁\"推得（日干为丙，故申时为丙申）。**这个案例的价值**在于它把四柱的**每一步都可验算地摆了出来**——**读者可以拿自己的生日，按同法复核一遍**，以检验是否真正掌握。","o":"TJ-0064 · 天纪·紫微详解·第三章（PDF 第34~37页）"},{"t":"二十七、说明（八字排盘）","h":"日柱与时柱：两句口诀","c":"方法——**①日干支**——其口诀为：\"**大小月卦记心间，正一干支起根源；大后干同地支冲，小后干支退一天；初一十三二十五，支同隔干一位算。**\"其用法（原文解）：\"**农历的大月为 30 天、小月为 29 天，固定不变**；要推农历日干支，先要按《农历大小月卦口诀》将推算之年编上两卦；除此之外，还要记住**农历正月初一日的干支**，因为它是推算一年逐日的基础\"；其递推规律：\"**知道某月初一日干支，如果这个月是小月，则应在干同支冲的情况下，干支各减一位，则是小月后下月初一日干支**\"。**②时干支**——用\"**五鼠遁**\"，其原理与五虎遁同：**由日干定子时之干，再顺推至所求时辰**（口诀未在本段全录，但其名与用法明确：\"五鼠遁是日找时的方法，时辰的干支是根据日子干支而来的\"）。**须说明**：**现代排盘已不必手推**——**万年历、排盘软件、在线工具皆可直接给出四柱**，其原书亦自陈\"**排八字手工太繁琐，建议使用《万年历》查找；从八字取数开始使用手工**\"。**这一自陈很务实**：**工具可信，手推易错；手推的价值在于理解原理，不在于替代工具**。","o":"TJ-0065 · 天纪·紫微详解·第三章（PDF 第37~39页）"},{"t":"二十七、说明（八字排盘）","h":"取数：天干配数与地支取数","c":"要点——四柱既定，其下一步是\"**八字取数**\"，即把天干、地支各配以数字，用以起卦（故章名\"用八字排终身卦\"）。其目录列有\"**（一）天干配数：（二）地支取数**\"两节（PDF 第40~41页），**其具体数值表本段未全录**，故此处只能记其**方法与位置**，不补数值。**须说明三点**：**①取数法是\"由干支到卦\"的桥梁**——**八字的干支本身只是历法符号，须经取数方能转为卦象**，这是\"排终身卦\"（即以八字起卦）的关键一步；**②不同体系的取数规则不同**——**河洛数、五行生成数、先天卦数各有其表，混用即错**，故其书专列两节以明之；**③取数之后的推演属术数**——**与前面的历法换算是两回事**：**前者可验算，后者不可验**。**这一分界在本章开篇已立，此处再申一遍，因为读者最容易在两处之间滑过去**——**干支排得再准，也不能使后面的断语变得可检验**。","o":"TJ-0066 · 天纪·紫微详解·第三章（PDF 第40~41页）"},{"t":"二十七、说明（八字排盘）","h":"这套技术的用处","c":"要点——剥离术数外壳，本章所记的历法换算有**若干可直接使用的用处**：**①干支纪年的换算**——**凡读中医古籍（其讲义大量以干支纪年、纪日）、读史书、看碑刻题记，皆需此技**；**②节气与月建的关系**——**\"月以节气为界\"这一条，是中医\"因时制宜\"（如\"春宜升补、冬宜温补\"）与五运六气推算的基础**；**③时辰与经络当令**——**十二时辰配十二经（见紫微章\"肺寅大卯胃辰宫\"歌诀），其换算即以地支定时**；**④六十甲子与周期**——**\"六十年一循环\"这一结构，可用于理解古人对长周期的表述**。**故本章宜作\"工具\"读**：**四柱怎么排、节气怎么查、时辰怎么定，这些是硬知识**；**而\"排出来之后如何断\"，则是另一回事**。**这一分法的好处是**：**读者不必为\"信不信算命\"而纠结，也能从这批材料里取走可用的部分。**","o":"TJ-0067 · 天纪·紫微详解·第三章（综合）  ---"},{"t":"二十八、屯卦","h":"龙困浅水：屯卦的卦图九物","c":"方法——屯卦所绘九物及其取义，是\"图象取义\"体例中最复杂的一例：**①\"人在望竿头上立：此不明局势之屯难时也，不可妄动也\"**；**②\"犬上回字：乃肖狗之人、狗年、狄姓之人，果为哭之象\"**；**③\"车在泥中：进退两难之象\"**；**④\"刀在牛上：解也，牛为贵人象\"**；**⑤\"人射文书：张姓，小人阻碍也；射，同音'色'也，绯闻\"**；**⑥\"牛不顺道：背道而驰，反其道而为之，吉\"**；**⑦\"人望：人亡也\"；⑧\"人立：在位也\"**；**⑨\"盒：先成后破\"**；**⑩\"牛回头视犬：计无所出，待也\"**。其总断：\"**卜得此卦：动于险中，先成后破也**\"；其卦名解：\"**龙困浅水之课，万物如生之象**\"。**这一卦的取义里，最可见其方法的两面**：**一面是象的联想**（\"犬上回字为哭\"、\"人望为人亡\"——字形与谐音）；**另一面是处境的判断**（\"人在望竿头上立＝不明局势不可妄动\"、\"车在泥中＝进退两难\"、\"牛回头视犬＝计无所出，待也\"）——**后者是可用的处世提示**（**局势不明先观望、进退两难时停住、无计可出时等待**）。","o":"TJ-0068 · 天纪·人间道·屯卦（PDF 第21页）"},{"t":"二十八、屯卦","h":"\"勿用有攸往，利建侯\"：屯时的处置","c":"要点——屯卦辞\"**元、亨、利、贞，勿用有攸往，利建侯**\"，其解极简而极实用：\"**此义处屯之时必贞固（坚心），须明非独力能成，必广资助——此'利建侯'之义。不可往，唯利建侯。**\"**这段解出两条处置原则**：**①\"非独力能成，必广资助\"**——**在开局艰难之时，首要之事不是自己冲，而是建立支援网络**（\"侯\"即辅助之力量）；**②\"勿用有攸往\"**——**不可贸然前往（出击）**。**其\"彖\"的补充**：\"**刚柔始交而未通畅，则难生；于此之时，如动即往，乃取险之道**\"——**即\"此际任何主动出击都是自找麻烦\"**。**而\"天造草昧，宜建侯而不宁\"**——\"**天时造出地上之草，乱而无序，此暗昧不明时，须建立辅助，可以有助矣，此圣人之戒**\"；其\"象\"则给出正面的建树之道：\"**云雷，屯；君子以经纶**\"——\"**水未能成雨为云象，君子观屯象，知须立法规范来经营此时**\"。**\"经纶\"二字最可注意**：**屯难之时不是空等，而是\"立法定规\"**——**即在乱局中建立秩序，这才是\"建侯\"的实质**。","o":"TJ-0069 · 天纪·人间道·屯卦（PDF 第21~22页）"},{"t":"二十九、文言","h":"\"辨之不早辨\"：易经里的\"渐\"","c":"定义——《坤卦·文言传》中最著名的一段，其解紧承\"履霜坚冰\"：\"**积善之家，必有余庆；积不善之家，必有余殃。臣弑其君，子弑其父，非一朝一夕之故；其所由来者渐矣，由辨之不早辨也。易曰：履霜坚冰至，盖言顺也。**\"其批注只有一句，却极重：\"**学者读此段，必可自悟矣。故圣人戒小人于初，其道大也。**\"**这一段的核心概念是\"渐\"**——**一切大变皆由小恶累积而成**（\"非一朝一夕之故，其所由来者渐矣\"）；**而其关键动作是\"辨\"**——**\"由辨之不早辨也\"，即问题不在\"事后来不及\"，而在\"当初没有早辨\"**。**\"盖言顺也\"四字尤须细味**：**\"顺\"在此不是\"顺利\"，而是\"顺着发展下去\"**——**霜顺着下去必成冰，恶顺着下去必成弑**。**这一\"渐\"的观念，与其医论中的\"阴实之渐\"（病从小积）、与其\"戒小人于初\"（坤初六）完全同构**——**同一套\"早辨\"的思维，用国事、用家事、用病情，皆通**。**这大概是全部材料中最经得起推敲的一段：它不涉预测，只讲因果的累积与时机的先后。**","o":"TJ-0070 · 天纪·人间道·坤卦文言（PDF 第19页）"},{"t":"二十九、文言","h":"\"阳大阴小，阴乃从阳\"：易理与医理的接点","c":"要点——这是**全批材料中一处极关键的\"跨域映射\"**：在解《文言传》末段\"**阴疑于阳必战，为其嫌于无阳也，故称龙焉；犹未离其类也，故称血焉；夫玄黄者，天地之杂也，天玄而地黄**\"时，其批注写道：\"**中医之至道在此！阳大阴小，阴乃从阳，故经方派乃用阳药。如人间亦然：如令阴到极盛，阳受阴盛而外走，此不相从必战，伤而见血，天地之色变，亦言伤之大也。**\"**这段批注的价值在于它自我披露了其医学主张的\"形上根据\"**：**他之所以\"用阳药\"、之所以处处\"护阳\"、之所以把\"阴实\"看作大病之根，其源头不在《伤寒论》的方证，而在《易经》的\"阳主阴从\"这一宇宙论**——**\"阳大阴小、阴乃从阳\"是秩序，\"阴盛阳走、不相从必战\"是失序的后果**。**理解这一层，其许多主张的内在一致性就显现了**：**\"阴实\"何以是最重的病（阴盛而阳不入）、\"护心阳\"何以是治病第一义（阳为主）、\"用阳药\"何以是经方本色（从阳）**——**皆由此推出**。**须说明**：**这是一条\"由宇宙论推出医学\"的路径**，**与\"由临床证据推出医学\"的路径相反**；**它能解释其体系为何自洽，不能证明其结论为真**。**读者可由此获得两样东西**：**一是读懂其论证的方向（凡见\"阳主阴从\"，即知下文必归于温阳）**；**二是明白\"自洽\"与\"正确\"是两件事。**","o":"TJ-0071 · 天纪·人间道·坤卦文言（PDF 第19页）"},{"t":"二十九、文言","h":"\"敬以直内，义以方外\"","c":"方法——《文言传》释六二\"直方大\"的一段，其解为可操作的两条：\"**直其正也，方其义也；君子敬以直内，义以方外，敬义立而德不孤**\"；批注：\"**君子外敬内直，坚守义以方其外，故内敬直、外义方；其德之盛，顺其自然，不须装饰，无人会疑其所行也。**\"**这一句把\"直方大\"从卦德转为修身之法，且给出了\"内外分工\"**：**\"敬以直内\"——对内以\"敬\"（郑重、不轻慢）来保持\"直\"（不迂曲）；\"义以方外\"——对外以\"义\"（原则）来保持\"方\"（不改易）**。**其结论\"敬义立而德不孤\"可译为**：**内有敬则直不流于粗率，外有义则方不流于固执，两者俱立，其德便不孤**（\"不孤\"即不孤立、有呼应）。**这与前章\"直方大\"的三德恰成一组**：**三德是\"是什么\"，敬义是\"如何做到\"**。**其后\"今之妻如何，吾人试自问之\"一句**（出现在释\"地道也，妻道也，臣道也\"处）——**把\"不表其功、含晦以为王行事\"的古义，转成一记自问**，**这一笔颇见其讲书的本色：不替听众结论，只让听众自省**。","o":"TJ-0072 · 天纪·人间道·坤卦文言（PDF 第19页）  ---"},{"t":"三十、一卦四层","h":"一卦的四层信息","c":"方法——《紫微详解》自中途起，对六十余卦各给一张\"四层表\"，其固定结构为：**①性格**——以卦象的上下卦、五行生克推出人的性情与命运倾向；**②地脉道**——以同一卦给出**阳宅的房间分配方案**；**③先天／后天／流年**——三段命理断语（出身、婚姻与对外、逐年的吉凶）；**④名位不等**——一段总括（\"利于求财、不利于学业／官调他乡／婚事延后七年\"）；**⑤文王金钱课**——以六个阴阳符号（×○）配一句卦辞、一首诗、一句断语，并标出上中下等（如\"**水山蹇卦：×○×○××（雨雪载途）下下**\"）；**⑥六爻**——逐爻录爻辞，并以\"过／君／宰／将／相\"等位阶标注（如蹇卦上六、六五、九四、六三、九二、初六）。**这套表格的设计意图很明显**：**把《易经》一卦，拆成\"看人（性格）、看屋（地脉）、看运（先后天流年）、看事（金钱课）、看时位（六爻）\"五个用途**。**须说明**：**这五者共用同一卦象，却给出互不相干的结论**——**这正是术数\"一象多解\"的典型**：**卦象是符号，表是空的，填什么取决于问什么**。","o":"TJ-0073 · 天纪·紫微详解·卦解（PDF 第273~275页）"},{"t":"三十、一卦四层","h":"性格如何由卦推出","c":"定义——以\"水山蹇\"为例，可见其\"性格\"的推法：**\"上坎下艮，土克水，两男纯阳无阴之象；坎为险、艮为止、为目标不明确、停止不前；坎被克不利中男，纯阳不利于女人。\"** 随后列出一串性情：**\"主兄弟或夫妻离异；坎主险、主水、主陷、主溺水身亡；水主智、聪明好学；个性保守、生活多变、好高骛远、气运不佳、举步艰难、孤独失败之象。\"** 而正面的一面也一并给出：**\"蹇卦喜欢团队生活和集体利益，重朋友和感情，观察入微，尽力尽责；遇到怕麻烦、胆小怕事、处处谨慎、容易退守、知足常乐、自知之明，很好的佐才。\"** **这段推法的结构**是：**由\"卦象的物性\"推\"人的性情\"**——**坎＝险／水／智，艮＝止／山；土克水＝受阻**——**组合起来就是\"聪明而受阻、谨慎而退守\"**。**其可取处**：**它提供了一套\"性格描述的语言\"**（**保守、好高骛远、举步艰难、知足常乐、佐才**），**用于自我描述颇为贴切**。**其不可取处**：**这些描述是\"两头堵\"的**——**既说\"好高骛远\"，又说\"知足常乐\"；既说\"保守\"，又说\"生活多变\"**——**任何人读之，都能对上其中的几条**（**这正是\"巴纳姆效应\"的典型样式**）。**故这一层宜作\"性格词汇表\"读，不作\"性格鉴定\"用**。","o":"TJ-0074 · 天纪·紫微详解·卦解·水山蹇（PDF 第273页）"},{"t":"三十、一卦四层","h":"\"四大难卦\"：坎、困、屯、蹇","c":"要点——书中给出一条明确归类：\"**水山蹇卦，为四大难卦之一（坎、困、屯、蹇）。**\" **这四卦的共性**：**坎（重险）、困（受困）、屯（初生之难）、蹇（举步维艰）**——**皆为\"险阻\"之卦**，**其象或为水，或为山石，或为草木初生被压**。**这一归类的好处**：**它把六十四卦按\"处境类型\"分组**（**难卦、通卦、需待之卦等**），**便于按\"当前处境\"检索相应的卦**——**这正是\"占\"的实际用法**：**不是问\"我将来如何\"，而是先归类\"我现在的处境属于哪一类\"，再取该类之卦的处置之道**。**所以其\"难卦\"的处置并非\"凶\"，而是\"** 蹇利西南、不利东北，背明向暗，多有壅塞，求财未遂，尚多疑惑，**进退维谷，容忍待时**\"**——**\"容忍待时\"四字即是解**。**须说明**：**同一卦的结论却相互矛盾**——**\"名位不等\"一栏写\"利于求财、不利于学业\"，而\"金钱课\"标\"下下\"、诗曰\"谋望求财是不成\"**——**两处对\"财\"的判断相反**。**这一矛盾在书中未作调和**，**读者由此可直观看到：这套表格的各栏是并置的，不是整合的**。","o":"TJ-0075 · 天纪·紫微详解·卦解·水山蹇（PDF 第273~274页）"},{"t":"三十一、地脉","h":"卦与房间：一种布局法","c":"方法——\"地脉道\"一栏把卦与**阳宅的房间分配（住哪个方位、哪个房间）** 对应起来，蹇卦的例子为：**\"水山蹇卦（二子住在少子之位）——此局利从于武官之人，如军人、警察、外交、司法人员等，也可以刻意佈出此局，如果你想儿子从此类公职的话。\"** 其后四句为其\"应验\"：**\"一、求财亨通，且无功利之心；二、官调他乡，与六亲远离；三、婚姻较同时生人延后七年；四、科甲吉，故考试资格必顺心；五、独自发展亦特立独行也。\"** **这一栏的用法**：**它把\"卦\"变成了\"住法\"**——**该住哪个房间，便得该卦之运**。**须说明三点**：**①这是\"以居住方位决定命运\"的主张**，**无任何可验证的机制**；**②\"刻意佈出此局\"这一句更须警惕**——**它把阳宅从\"观察\"变为\"施加\"，即主动安排子女的住处以求特定前程**；**③\"婚姻延后七年\"这类精确到年的断言，最不可信**——**任何人的婚龄都受社会、经济、个人选择影响，\"延后七年\"无法预测**。**读者若记得前章\"地脉道\"的一般原则（形势、采光、通风），须知这一栏已进入\"卦配房\"的推演，两者性质不同。**","o":"TJ-0076 · 天纪·紫微详解·卦解·水山蹇·地脉道（PDF 第273页）"},{"t":"三十一、地脉","h":"先天、后天、流年：三段命理","c":"要点——各卦另有三段断语，以蹇卦为例：**\"先天：生于官家，日头正旺！两人一大口。六亲数在无人！但出一卜，一商人。外地封候，一方之主。不为使节，为儒林（很有名的老师！）\"**；**\"后天：夫妻同出外地，五人相从。夫来从官，妻生财。三子去一，发二房。女命逢之，千里单骑，出外求财岛中居。\"**；**\"流年：夫当外出，求禄财禄必兴盛！官人逢之出外使节。女命逢之须防子劫。偷天换日（小孩子被抱走，还有儿子盗窃）。\"** **这三段的体例**很值得注意：**它们不是\"论吉凶\"，而是\"讲一个故事\"**——**\"两人一大口\"\"五人相从\"\"三子去一\"**这类**数字谜式的句子**（**似以数字拆解文字，如\"两人一大口\"或为某字的拆法**），**以及\"官家之子、儒林、封侯、岛中居\"这类具体的身份场景**。**须说明**：**（1）\"先天／后天／流年\"是命理学的标准分层**（**先天指出身与禀赋，后天指成家立业，流年指逐年**）；**（2）这三段的语言极为含混**——**\"六亲数在无人\"\"但出一卜\"\"发二房\"皆无法确定所指**，**故其\"应验\"只能是事后附会**；**（3）\"须防子劫\"一类警示，易造成无端恐惧**。**本条的记录意义**：**示明此体系的语言特征——以诗句、数字、身份场景编织，使读者自行对号入座**。","o":"TJ-0077 · 天纪·紫微详解·卦解·水山蹇·先天后天流年（PDF 第273页）"},{"t":"三十二、用法","h":"\"从那一爻往上走\"：一条动态解读法","c":"要点——全书在\"雷水解\"卦处插入一句**极关键的方法说明**：\"**当来人求测时，将他变成卦、要观察他处在第几爻，然后从那个爻往上走，进行解读。**\" **这一句揭示了其占法的核心操作**：**①\"将他变成卦\"**——**即由所问之事（或生辰）起卦**；**②\"看他在第几爻\"**——**即定\"时位\"**（**同一卦的六个爻，代表同一处境的不同阶段**）；**③\"从那一爻往上走\"**——**即不以整卦断吉凶，而以所处方为起点，向上推演其发展**。**这与乾卦章\"六爻地位表\"（初爻为民、二为士、三为大夫、四为公卿、五为君、上为太上皇）的读法完全一致**，**也与\"用九\"\"用六\"之例相合**。**其可取的方法论**：**它承认\"同一件事处在不同阶段，处置不同\"**——**这不是预测，而是\"分期\"**：**初爻＝事之始（宜潜）、三爻＝事之中（多凶）、五爻＝事之成（宜守中）**。**这一\"分期思维\"如脱离吉凶断语，其实颇为可用**——**它提示读者：判断一件事，先问\"我在第几步\"，再问\"此步该做什么\"**。**须说明**：**但\"从哪一爻起\"如何确定，书中未给可核的规则**（**起卦、定爻皆有多种流派**），**故其操作仍是不可复现的**。","o":"TJ-0078 · 天纪·紫微详解·卦解·雷水解（PDF 第274页）"},{"t":"三十二、用法","h":"文王金钱课：六个符号与一句断语","c":"定义——每卦末附\"**文王金钱课**\"，其格式为：**六个符号（○与×）＋一句四字卦辞＋一个等第＋\"象曰\"两句＋\"诗曰\"两句＋\"断曰\"四句**。以蹇卦为例：**\"水山蹇卦：×○×○××（雨雪载途）下下\"**；**\"象曰：大雨倾地雪满天，路上行人苦又寒，拖泥带水费尽力，事不遂心且耐烦\"**；**\"诗曰：雨雪载涂甚泥泞，交易不定难出行，疾病拖拉婚姻慢，谋望求财是不成\"**；**\"断曰：行人未至，投向不稳，南自缠绵，求名不准\"**。**这套格式的用途**：**以六次掷钱（或摇卦）所得阴阳，配成卦象，再查此卦的现成断语**——**即\"查表式占卜\"**。**须说明**：**（1）\"○×\"符号对应\"阳／阴\"，六个符号即六爻**；**（2）等第分\"上上、上、中、下、下下\"**，**断语则按\"行人、交易、婚姻、求财、疾病、谋望\"等事项分列**——**这是一种\"分类占断表\"**；**（3）其断语的文学性很强**（**\"雨雪载途\"\"拖泥带水费尽力\"**），**与卦象（坎水、艮山、山石嶙峋）确有形象上的呼应**——**这是它可读的地方**；**（4）其\"应验\"不可验**。**故本条的定位**：**可作文献与文学读，不可作决策依据**。","o":"TJ-0079 · 天纪·紫微详解·卦解·水山蹇·文王金钱课（PDF 第274页）"},{"t":"三十二、用法","h":"这一部分的性质","c":"风险——综合本章所记，须明确交代其性质，以免读者误用。**（1）可取的**——**卦名的象征义与\"处境归类\"**（**\"四大难卦\"把险阻分为四种，各给一句处置**，如\"容忍待时\"）；**\"从第几爻往上走\"的分期意识**；**卦象与卦辞本身的文学与哲学价值**。**（2）不可取的**——**\"居住方位决定命运\"（地脉配卦）**；**\"婚姻延后七年\"\"须防子劫\"一类精确断言**；**\"刻意佈局以求子成某业\"的施加性做法**；**以\"金钱课\"查表定吉凶**。**（3）须警惕的方法缺陷**——**同一卦的各栏结论相互矛盾**（**蹇卦\"利于求财\"与\"求财是不成\"并存**）；**同一象有多解而无判据**；**断语含混、可事后对号**。**（4）本集的记录原则**——**记其结构与说法，标明其不可验，不作任何行动建议**。**这一条是本册与前册（中医）共同的立场**：**凡有可核查依据者，如实记并注明边界；凡不可核查者，记录其形态并标明其性质。**","o":"TJ-0080 · 天纪·紫微详解·卦解（综合）  ---"},{"t":"三十三、六神","h":"六神与五行的对应","c":"定义——《紫微详解》第九章\"六神占断法\"所立六神为：\"**青龙、白虎、朱雀、玄武、腾蛇、勾陈**\"；其五行归属为：**青龙属木、朱雀属火、勾陈属（阳）土、白虎属金、玄武属水、腾蛇属（无专配，多归火或土）**。其用途被概括为一句话：\"**看来龙、看面相、看手纹、看动作、看脸上纹路、测字取笔画等**\"——**即六神是一套\"判形\"的符号系统，可用在风水、面相、手相、笔迹（测字）四类对象上**。**须先说明其技术基础**：\"**倪师使用的是三元、三合罗盘；书是《周天罗经用法正解》**\"——**紧接着一句自注：\"不为重点略过\"**，**故本册所据为简化版，罗盘的完整用法未展开**。**这一条的价值在于\"归类\"**：**六神不是一个独立体系，而是\"五行—方位—形状—颜色\"四套符号的一个交叉索引**——**同一个对象（一处地形、一种笔形、一块面色），可被归入六神之一，再依六神的五行属性推出吉凶**。","o":"TJ-0081 · 天纪·紫微详解·第九章六神占断法（PDF 第264页）"},{"t":"三十三、六神","h":"《袁天罡论六神气法》：六种气色的比喻","c":"方法——书中引一段唐人所传的\"气法\"，以六个比喻状六神的\"气\"：**\"青龙之气，如祥云衬月；朱雀之气，如朝霞映水；勾陈之气，如黑风吹云；螣蛇之气，如草木将灰；白虎之气，如凝脂涂油；玄武之气，如腻烟和雾。\"** **这六个比喻的构造极有讲究**：**青龙（祥云衬月）取其明润、舒展；朱雀（朝霞映水）取其灿然、浮动；勾陈（黑风吹云）取其沉滞、堆积；螣蛇（草木将灰）取其枯索、卷曲；白虎（凝脂涂油）取其光硬、板结；玄武（腻烟和雾）取其蒙晦、黏浊**。**其用途是\"望气\"**——**即看一处地形、一个人的气色属于哪一种\"气象\"**，**由此定其属何神、主何事**。**须说明**：**这是一种以\"视觉印象\"为判据的方法**，**其分类的依据是\"感觉的相似\"，而非可测的指标**；**六个比喻的文学价值高于其判读价值**——**读之可体会古人对\"气象\"的敏感，但无法据此判定吉凶**。**本集的记录原则照旧：记其形态，标明其不可验。**","o":"TJ-0082 · 天纪·紫微详解·第九章·袁天罡论六神气法（PDF 第264页）"},{"t":"三十四、配色","h":"颜色主事表：一处明显的错位","c":"风险——书中有一张\"颜色主事\"表，逐条为：**\"青：主担忧、惊吓、烦怒、疲惫、筋骨、脾脏病症\"**；**\"赤：主破财、火厄、官司、血光、灾离、心脏、血液循环病症\"**；**\"黄：主进财、增福、升迁、肝脏病症\"**；**\"白：主丧服、刑克、破耗、肺脏病症\"**；**\"黑：主失窃、水厄、灾病、破败、肾脏病症\"**；**\"红：主喜庆、进财、创业、情欲\"**；**\"紫：主进贵\"**；**\"朦：主停滞、耗损\"**。**⚠ 须指出一处明显的内在错位**：**按中医五行配属，青属木应主肝、赤属火应主心、黄属土应主脾、白属金应主肺、黑属水应主肾**——**而此表中\"赤→心脏\"\"白→肺脏\"\"黑→肾脏\"三条正确，\"青→脾脏\"\"黄→肝脏\"两条却与配属相反**（**青当主肝而写成脾，黄当主脾而写成肝**）。**这一错位可能是原书笔误，也可能是整理者的误抄，但在文本上确实如此**，**故本集如实记录并标出**——**读者若按此表推病，会把\"面青\"当脾病、\"面黄\"当肝病，恰与中医望诊的常规相反**（**面青主肝、面黄主脾**）。**另须说明**：**面色诊察（望色）在中医学中确有其地位**，**但现代医学对\"面色与脏器疾病\"的对应持谨慎态度**——**黄疸（面黄）可提示肝胆或血液病，面色苍白提示贫血，面青紫提示缺氧或循环障碍**——**这些是可解释的体征，而非\"青主脾\"之类**。","o":"TJ-0083 · 天纪·紫微详解·第九章·颜色主事（PDF 第264~265页）"},{"t":"三十四、配色","h":"定六神歌诀：六种形态","c":"方法——\"定六神\"另有一首歌诀，以\"形态\"判属，内容为：\"**左上右下是腾蛇，右上左下勾陈；蚕头燕额是青龙；尖短交加朱雀神；弯弓斜月勾陈象；腾蛇长曲势如行；尾尖口阔为白虎；体态方尖玄武行。**\" **这首歌诀的用法**：**它给出六种可辨认的\"形状特征\"**——**青龙：蚕头燕额（头圆额宽）**；**朱雀：尖短交加（尖而交叉）**；**勾陈：弯弓斜月（弧形）**；**腾蛇：长曲如行（长而蜿蜒）**；**白虎：尾尖口阔（末端尖、开口大）**；**玄武：体态方尖（方而带尖）**。**其应用对象**是**\"来龙（山势走向）\"与\"笔画（字形）\"**两类——**即把地形与文字的形状，按此六型归类**。**须说明**：**这是一套\"形状分类法\"**，**其判据是\"像哪一型\"，而没有量化标准**（**多长为\"长曲\"？多阔为\"口阔\"？皆未定**）；**故不同人看同一地形、同一字，可能归入不同六神**——**这与前章\"图象取义\"的多解性同源**。**其可读者**：**歌诀本身整齐好记，可见古人以\"形\"统\"类\"的思路**。","o":"TJ-0084 · 天纪·紫微详解·第九章·定六神歌诀（PDF 第265页）"},{"t":"三十五、形法","h":"风水：六神与地形","c":"方法——六神在风水上的用法，书中逐条给出：**①青龙**——\"**山势形下来要完整的一条，主百事亨通**\"；**②朱雀**——\"**地形为交叉，如十字形住宅为朱雀**\"；**③白虎**——\"**形似'几'字，不能藏风纳气，逢之带孝、病危、是非口舌、官司、牢狱之灾；山势形为白虎，山势或房屋右侧为白虎，不能高于左侧，也包括室内家具**\"；**④玄武**——\"**来龙不够圆润就是玄武，因为出现死角就是……阴宅：案山后藏着一个小头，人一蹲下去就看不到小山头，人站起来就看到了，下一代一定出窃贼**\"；**⑤勾陈**——\"**风水（来龙）上山势一节一节地断掉，主停滞不前**\"；**⑥腾蛇**——\"**形状扭扭曲曲的或 S 型的阳宅也是腾蛇**\"；**另有**\"**人鼻子弯曲像蛇，也为腾蛇**\"（面相之用）。**这一栏里最可注意的一条是\"白虎不能高于左侧\"**——**此即\"左青龙、右白虎\"的方位原则：** 右侧（白虎）不宜高于左侧（青龙）**；**这一观念在中国建筑与住宅布局中流传极广**（**如\"宁可青龙高万丈，不可白虎抬头望\"的俗谚**），**其实际含义可与\"采光、通风、视觉压迫\"联系起来解释**（**若右后方建筑过高，会遮挡日照与视线**），**这是它可被理解的部分**。**须说明**：\"案山后藏小山头→下一代出窃贼\"一类断言，**是把地形与人的行为直接挂钩，无任何机制可言**，**读者须视为术数语，不作判断**。","o":"TJ-0085 · 天纪·紫微详解·第九章·六神风水（PDF 第265~267页）"},{"t":"三十五、形法","h":"笔法：以字形取六神","c":"方法——六神另有一套\"笔法\"对应，用于**测字**：**青龙——\"撇或者一捺，没有段落，如'八、入'等字\"**；**朱雀——\"笔画为交叉，如'乂、又'等\"**；**白虎——\"'几'，白虎属金，主凶灾横祸或来势凶猛之事\"**；**玄武——\"笔画'厶、么、纟、厷、口'这种尖的都是玄武；主盗贼，口字是玄武招小偷；玄武属水，主暧昧、隐私、盗窃之事\"**；**勾陈——\"笔画'乙、乞、勹、勾、成、风'，勾陈属阳土，主田土不动产、文章的事情；谋事中间事事差，结果停在原地\"**。**其总原则**：**\"六神风水与笔法——'八'：青龙木；'乂'：朱雀火；'勹'：勾陈土\"**。**这套方法的实质**：**把汉字笔画按形状归入六神，再以六神的属性断所问之事**。**须说明**：**（1）\"测字\"是中国传统术数之一**，**其依据是笔画形状的联想，无语言学或逻辑依据**；**（2）\"口字形招小偷\"\"厶字形主暧昧\"一类，纯属附会**；**（3）但这套分类本身有一定的一致性**——**尖、曲、交叉、方，是笔画的客观形态特征**，**故其\"归类\"是清楚的，\"结论\"不可信**。**本集只录其归类法，不录其断语。**","o":"TJ-0086 · 天纪·紫微详解·第九章·六神笔法（PDF 第265~267页）"},{"t":"三十五、形法","h":"这一章的性质与地位","c":"要点——把第九章放回全书，可见三点：**（1）它是\"判形\"的一章**——**前八章讲的是\"排盘\"（紫微十二宫、八字四柱、卦象），这一章讲的是\"直接看\"**（**看地形、看面色、看手纹、看动作、看字形**）；**即从\"算\"转向\"望\"**。**（2）它自成一套\"索引\"**——**六神是索引键，地形／面色／笔形是待索引的对象，五行是推出的属性**；**三者构成一个\"形→类→性\"的三段推演**。**（3）其可靠性在三者中最低**——**排盘至少可验算（干支、宫位有定法），卦解尚有卦辞可依，而六神判形全凭\"像什么\"**；**且本章内部已有一处明显错位（青黄与脏腑的配属颠倒）**，**可见其文本经传抄而不够自洽**。**故本册对第九章的处理是**：**记其符号系统与歌诀（这是它的\"技术面\"），标出其中的错位与不可验处（这是它的\"边界\"），不给任何操作建议**——**与前两章（八字、卦解）一致。**","o":"TJ-0087 · 天纪·紫微详解·第九章（综合）  ---"},{"t":"三十六、对应法","h":"卦、房位、人：地脉道的基本结构","c":"方法——\"地脉道\"一栏的做法，可概括为一个三段对应：**①先定\"谁\"**（家中何人、排行第几、男或女）；**②再定\"位\"**（此人住在哪个方位、哪个房间）；**③由\"卦\"给出一整套断语**（性格、财官、婚姻、健康、子嗣）。以四卦为例可见其格式：**山天大畜——\"三儿子住西北角，长子和二子未婚\"**；**火泽睽——\"中女住在小女的正西兑位\"**；**水山蹇——\"二子住在少子之位\"**；**山雷颐**另有其位。**其\"逻辑\"是：住哪个方位 → 得哪个卦 → 应哪套命**。**须说明其性质**：**这是一种\"以居住位置决定人生轨迹\"的主张**，**其断语极为具体**（**\"婚姻较同时生人延后七年\"\"婚不足三月而破\"\"科甲不兴\"**），**而具体的断言恰恰是最不可靠的**——**因为任何人的婚龄、学业、职业都受社会条件与个人选择影响，不可能由床的位置决定**。**本集记录其结构，是为了让读者看懂这套体系如何运作，而非提供任何居住建议。**","o":"TJ-0088 · 天纪·紫微详解·卦解·各卦地脉道（PDF 第218~273页）"},{"t":"三十六、对应法","h":"大畜：一段真正可读的观察","c":"要点——\"山天大畜\"（三子住西北角）这一条里，有一段**脱离了术数语言、直接讲人性的议论**，值得完整记录：其断语为\"**顾家、工作狂、处处为家着想，甚至影响到婚事**\"；\"**一、代父之职守，负担一家之生计；二、节俭至矣，绝不花钱买奢侈品，故颇有积蓄；三、有婚也短暂，必不足三月而破，比同时生人提前二年结婚；四、此局不利公职发展，必困于工作、堆积公文如山**\"。**紧随其后是其自注，也是全章最好的一段**：\"**许多人言'有积乃大'，诚不欺人也。许多人在婚前极尽节俭，往往婚后无法忍受妻子之奢侈浪费，终致离婚——故'积'的观念产生在自己身上而不自觉，乃致婚后硬要加诸于对方身上，终于破裂。吾人当于始时即已察觉知晓，方不愧为习易之人。**\"**这段话的可取处在于它的机制描述是成立的**：**一个人的\"节俭\"在婚前是美德，在婚后若变成对配偶的强制要求，就会成为冲突源**——**这是\"人格特质在关系中的转化\"**，**现代婚姻研究中有对应的概念**（**如\"价值观冲突\"\"控制行为\"**）。**其\"当于始时即已察觉\"一句，也与前章\"辨之不早辨\"的\"渐\"完全同调**。**须说明**：**这段议论之所以动人，恰因为它不依赖卦象**——**它讲的是一个普遍的人际机制；而把它与\"三子住西北角\"绑定，则是术数的附会部分**。**读者可取前者，弃后者。**","o":"TJ-0089 · 天纪·紫微详解·卦解·山天大畜·地脉道（PDF 第218页）"},{"t":"三十六、对应法","h":"蹇与睽：两种\"布局\"的说法","c":"要点——另两卦的\"地脉道\"示范了其\"布局\"的两种用法。**水山蹇（二子住少子之位）**——\"**此局利从于武官之人，如军人、警察、外交、司法人员等；也可以刻意佈出此局，如果你想儿子从此类公职的话**\"；其断语为\"求财亨通且无功利之心、官调他乡与六亲远离、婚姻较同时生人延后七年、科甲吉、独自发展亦特立独行\"。**火泽睽（中女住小女的正西兑位）**——\"**我们常见有小女孩背离家人、自顾自私，使父母深为苦恼，而无法改变，只有任其任性而为，终致一生皆凶、坎坷**\"；其断语为\"**性刚僻倔强、任性胡闹，以致家无法容；肖牛肖鼠人见之更凶；科甲不兴；婚姻不成；招凶事、官司、灾祸连连**\"。**须指出两处性质不同的问题**：**（1）\"刻意佈出此局\"是把居住安排当作\"教育手段\"**——**为求子女从事某职业而安排其住处**，**这已从\"观察\"跨到\"施加\"，且以\"方位\"替代理性与兴趣**；**（2）睽卦那条把\"性格倔强\"\"婚姻不成\"归因于住位**，**更把它写成\"终致一生皆凶\"**——**这类断言对一个正在成长的孩子而言，是一种\"预设的判决\"**。**本集对这类内容只作记录，不作推荐**；**其\"可取\"之处仅在于提示一个常识：** 家庭关系与沟通方式确有长期影响；**但\"方位决定性格\"不是。** **另须单列一条：该卦断语中含有以性取向作为\"凶兆\"的表述，属偏见性归类，本集不采，理由见下条。**","o":"TJ-0090 · 天纪·紫微详解·卦解·水山蹇、火泽睽·地脉道（PDF 第271~273页）"},{"t":"三十七、须辨","h":"一处必须剔除的偏见","c":"风险——\"火泽睽\"的断语中，把\"**有同性恋倾向**\"与\"科甲不兴、婚姻不成、招凶事、官司、灾祸连连\"并列，作为该局所\"招\"的凶果之一。**⚠ 这条内容本集不采，理由如下**：**（1）性取向不是\"凶兆\"**——**同性恋在 1990 年已被世界卫生组织从疾病分类中移除，中国亦于 2001 年将其从精神疾病名录中删除**；**把它列为\"灾祸\"是旧时代的偏见，与今日的医学与伦理共识相悖**。**（2）把性取向归因于\"住哪个房间\"，既无依据，也构成对性少数群体的污名化**——**性取向的形成涉及生物、环境等多因素，非居住安排所能决定**。**（3）在本书的编例上，这属于\"须剔除的歧视性表述\"**——**与前册对\"拒收中国患者\"\"诅咒具体人物\"的处理一致：保留其学术主张，剔除其侮辱与偏见**。**故本集在转录这一卦时，略去该项断语，并在此明确说明略去的理由**——**读者若见原书有此条，当知这是原书的时代局限，不是可用的判断。**","o":"TJ-0091 · 天纪·紫微详解·卦解·火泽睽·地脉道（PDF 第271页）"},{"t":"三十七、须辨","h":"先天、后天、流年、名位：四栏并置的问题","c":"风险——各卦表格的四栏（先天、后天、流年、名位不等）在体例上是**并置的**，但它们之间常有矛盾，且各自都极具体。以\"火泽睽\"为例：**先天**——\"生逢家道衰，父母不和，有牢灾，与母无缘，求财不择手段，逢鼠逢牛避之吉\"；**后天**——\"一事无成，家人背离，牢狱之灾，唯鼠牛人可避，平安，其余多凶，南迁吉\"；**流年**——（另卦）\"大限数已终，不逢血光也有火厄\"；**名位不等**——\"官运不前，科甲高中；婚姻延后五年，家人和睦，妇人病多\"；**文王金钱课**——\"**风火家人：○○×○×○（镜里观花）下下**\"（另一卦）。**问题有四**：**（1）同一人的\"先天\"与\"后天\"互相否定**（**先天\"家道衰、有牢灾\"，后天\"一事无成\"，而名位却\"科甲高中、家人和睦\"**）；**（2）\"灾\"的断言密集且具体**（**牢灾、火厄、血光、官司**），**对读者构成心理压力**；**（3）\"逢鼠逢牛避之吉\"这类\"择人而交\"的建议，是把生肖当作人际判据**；**（4）四栏未整合成一体，读者自取所需**。**本集的处理**：**记录其体例与语言特征，标明其不可验与内部矛盾，不作任何建议**——**这也是本册贯穿全书的一条编例**。","o":"TJ-0092 · 天纪·紫微详解·卦解·各卦四栏（PDF 第218~273页）"},{"t":"三十七、须辨","h":"地脉道与前册\"阳宅\"的分界","c":"要点——须分清\"地脉道\"里的两种内容：**（1）可讲得通的**——**房屋的采光、通风、朝向、格局对居住者的实际影响**（**如\"白虎不宜高于青龙\"可与遮挡日照、视觉压迫联系起来**）；**以及\"家庭关系与沟通方式影响人的状态\"这类常识**（**大畜卦那段议论即是**）。**（2）不可讲的**——**\"住哪个房间决定婚姻早晚几年\"\"决定子女从事何业\"\"决定是否出窃贼\"**。**本册（天纪）在\"地脉道\"一章（nT03）已记录其一般原则（形势、明堂、采光、水路），这一处（nT12）记录的是\"卦配房位\"的推演层**——**两者在书中混在一起，须由读者分开**。**分开的方法很简单**：**凡涉及\"房子怎么建、怎么摆、光从哪来、水往哪去\"的，可取；凡涉及\"住哪个方位会有什么命运\"的，不可取**。**这一条也是本册最后要交代的总纲之一。**","o":"TJ-0093 · 天纪·紫微详解·卦解·地脉道（综合）  ---"},{"t":"三十八、总纲（屯卦六爻难局六位）","h":"屯难之时，\"守正\"与\"待时\"","c":"要点——屯卦六爻串起来，是一条完整的\"困境应对\"序列，其总纲在前面几爻与\"象\"里已定：\"**此卦动于险中，乃屯之义**\"；**\"圣人处屯时，虽有济屯之志，仍盘桓不动，因时未至也\"**——**\"时未至\"三字是全卦的眼**。**其批注中有一句直指现实**：\"**此即示人处屯难时，须守正方是——现今之人，鲜少人于屯难之时守正。**\" **这句话的分量在于**：**困境中最常见的反应是\"急于摆脱\"**（**或乱动、或投机、或依附**），**而\"守正\"恰是最不显眼、最费力的一种**。**其\"以贵下贱，大得民也\"一句**则给了另一条路径：\"**初阳之刚健，居阴之下，此易以'贵下贱'之象；即处屯之时，阴柔不能存，唯一阳刚之才，则众所归从也；更加此人能自处卑下，所以大得民心。**\" **即：有才而肯居下，反能得众。** **须说明**：**这是屯卦的传统义理（《彖》《象》原义），并非其独创**；**其讲法的价值在于把六爻连成了一条可对照自身的序列**——**读者可自问\"我现处第几位\"**。","o":"TJ-0094 · 天纪·人间道·屯卦（PDF 第21~22页）"},{"t":"三十九、六位","h":"初爻：盘桓","c":"方法——初爻爻辞\"**盘桓，利居贞，利建侯**\"。其解：\"**初而阳爻居下，意乃刚明之才，当屯难之时而居下位，此时未便往济，故盘桓；如遽进，则犯险遇难。**\" 其\"象\"补充：\"**圣人处屯时，虽有济屯之志，仍盘桓不动，因时未至也——此居下位之念。**\" **这一爻给的是\"有才而位卑\"者的处置**：**才具已备、心志已立，但位置在下、时机未到，此时的正解是\"盘桓\"（徘徊蓄势），不是\"遽进\"（骤然冲出去）**。**其\"利建侯\"与卦辞\"利建侯\"同义**（**建立辅助、广结支援，见前章**）。**须说明**：**\"盘桓\"易被误读为\"拖延\"**——**其区别在于：盘桓是\"志行正\"的等待（\"虽盘桓，志行正也\"），拖延是无志的空耗**；**前者在等时机，后者在等借口**。**这一分辨，是这一爻最实用的地方。**","o":"TJ-0095 · 天纪·人间道·屯卦·初爻（PDF 第22页）"},{"t":"三十九、六位","h":"第二爻：十年乃字","c":"要点——第二爻爻辞\"**屯如邅如，乘马班如；匪寇，婚媾；女子贞不字，十年乃字**\"。其解：\"**此阴爻之柔居屯世，受逼于初刚健之人，故柔处屯时无法自济，又受下之阳刚所逼，为难为也。非理而至者为寇；柔守中正不苟合于初刚之意，须十年久久乃通。**\" 其\"象\"再补：\"**此患难因柔，又居屯时，又有下之阳刚所逼，此患难乃因柔而生；须十年，难久必过。如反其柔之常性而与阳刚合，则省十年——十为数之终也。**\" **这一爻讲的是\"被强力者逼近时的自守\"**：**\"匪寇，婚媾\"四字最有意思**——**来者究竟是强盗还是求婚者，一时难辨**；**而\"女子贞不字（不嫁）\"是一种\"以守待辨\"的选择**——**不因压力而仓促应允，宁可等到看清**。**其\"如反其柔之常性而与阳刚合，则省十年\"一句，是难得的\"另一条路\"**：**若肯改变本性、与强者相合，可省十年之困**——**但其前提是\"反其常性\"，即要付出改变自己的代价**。**这两条并列而不偏断，是本书少见的\"给出选项\"而非\"给出命令\"。**","o":"TJ-0096 · 天纪·人间道·屯卦·第二爻（PDF 第22页）"},{"t":"三十九、六位","h":"第三爻：即鹿无虞","c":"方法——第三爻爻辞\"**即鹿无虞，惟入于林中；君子几，不如舍，往吝**\"。其解：\"**此阴爻居三之阳位，此意柔居刚而不中正，则必妄动、贪于所求、必不足自济，此不安之源。如入山林射鹿，又无向导，此不安也。君子见事于微，舍而勿逐；如往取，徒取其咎也。**\" 其\"象\"：\"**事因欲而妄动，此贪禽也；处屯之时，不可动而动，凶也。君子舍之不从，则无咎；如往必困穷也。**\" **\"即鹿无虞\"是全卦最生动的一个比喻**：**追鹿而无向导（虞人），一味深入林中**——**目标明确、欲望强烈、条件不足**。**其处置只有两个字：\"舍\"**。**这一爻的可取处在于它给出了\"停止\"的判断标准**：**不是\"目标不好\"，而是\"没有向导\"**——**即\"缺少抵达目标所必需的条件\"时，追逐本身就是错误**。**其\"君子见事于微\"一句，又与\"履霜坚冰\"的\"早辨\"相呼应**：**要在\"入林之前\"看出无向导，而不是在林子里迷路之后。**","o":"TJ-0097 · 天纪·人间道·屯卦·第三爻（PDF 第22页）"},{"t":"三十九、六位","h":"第四爻：求贤自辅","c":"要点——第四爻爻辞\"**乘马班如，求婚媾，往吉，无不利**\"。其解：\"**此以柔顺居近于君位，此得之于上者，而才不足以济屯时，须求贤自辅，则往而利矣。此即居公卿之位，己之才不足以济屯难之时，若能求在下之贤人，亲而用之，则必平安有利。**\" 其\"象\"只一句，却极精：\"**知己才之不足，往而求贤，以济己之不足——此乃真明也。**\" **\"此乃真明也\"五字是全卦的转折点**：**前面几爻讲的是\"如何自守\"，这一爻讲的是\"如何借助他人\"**；**而其前提是\"知己才之不足\"**——**承认不足，才谈得上求贤**。**这与第三爻恰成对照**：**第三爻是\"不知不足而妄进\"，这一爻是\"知不足而求助\"**——**同一困境，成败之别就在这一念**。**这一爻对今人尤有意味**：**居高位者最易犯的错，正是\"以己之才济难局\"，而不肯\"求在下之贤\"**。","o":"TJ-0098 · 天纪·人间道·屯卦·第四爻（PDF 第22页）"},{"t":"三十九、六位","h":"第五爻：屯其膏，以渐正之","c":"要点——第五爻爻辞\"**屯其膏，小贞吉，大贞凶**\"。其解：\"**五居尊位得正；当屯时，若有刚明之才为佐，则利；如无，则'屯其膏'——此因无良臣，而施为有所不下于民，民未得其德泽，乃因威权不在己之故也。此屯因威权已去而妄想瞬间正回，此求凶之道；须以渐正之，方吉。如不，会因当屯时不改，以至于亡矣。**\" 其\"象\"：\"**膏泽不下及，此人君之屯也，乃因威权不在之象。**\" **这一爻讲的是\"权威已失而欲速复\"的陷阱**：**\"膏\"（恩泽）下不去，因为\"威权不在己\"**；**此时若\"妄想瞬间正回\"，就是\"求凶之道\"**；**正解是\"以渐正之\"**——**一点一点地把秩序重建起来**。**\"以渐正之\"四字，与\"履霜坚冰\"的\"渐\"、\"辨之不早辨\"是同一条思路的反面用法**：**前者讲\"恶之渐\"要早断，此处讲\"善之复\"要慢来**。**须说明**：**这是屯卦的传统义理**；**其现实对应极清楚**——**权力、信任、秩序一旦崩坏，恢复需要时间，急则更坏**。","o":"TJ-0099 · 天纪·人间道·屯卦·第五爻（PDF 第22页）"},{"t":"三十九、六位","h":"上爻：泣血涟如","c":"风险——上爻爻辞\"**乘马班如，泣血涟如**\"。其解：\"**此以阴柔居屯之终，此险之极而无援，居之不安，动无所向，此穷厄之象。**\" 其\"象\"：\"**如于屯难穷极而莫知所为，则至泣血颠沛，则必不长久。**\" **这一爻是六位的终点：险到极处而无援**。**其可取处在于\"预警\"**：**\"泣血涟如\"不是一个结果，而是前面各爻全部误判之后的必然**——**该候而不候、该舍而不舍、该求助而不求助、该渐进而急求**，走到这里便无路可走。**其\"必不长久\"一句，反而留了一线**：**穷极之局不会长久，因为要么崩解、要么转机**。**另本页末另有一句（原文断句较乱），大意为\"若阳刚而有助，即屯至极亦可平安互济\"**——**即：即便到了上爻，若得阳刚之助，仍可转安**。**这一句把上爻从绝境拉回：** **绝境之所以绝，往往是因为\"无援\"，而不是因为\"无路\"。**","o":"TJ-0100 · 天纪·人间道·屯卦·上爻（PDF 第22页）"},{"t":"四十、体例","h":"\"卦图取象\"与\"六爻序列\"：两种读法","c":"要点——屯卦给出两种读法，其分工很清楚：**（1）卦图取象**——**读\"图象\"（人在望竿头、车在泥中、犬上回字、刀在牛上、盒等）**，**给出的是\"总断\"**（\"动于险中，先成后破\"）；**（2）六爻序列**——**读\"位\"（初至上）**，**给出的是\"分期处置\"**。**这两种读法在书中并用，且不互相校准**——**卦图说\"先成后破\"，六爻却给出\"可省十年\"\"往吉无不利\"\"平安互济\"等可能的转机**。**须指出这一结构的意义**：**它实际上承认了\"同一处境有多种可能\"**——**总断给的是\"大概率\"，六爻给的是\"每一步的选择余地\"**。**这比\"一卦定生死\"要宽容，也更接近《易经》原文的精神**（**爻辞本就讲\"在此位如何\"，不讲\"必定如何\"**）。**本册记录屯卦，正是为了示范这一读法**：**读者若只记\"凶\"或\"吉\"，便丢掉了六爻的全部内容。**","o":"TJ-0101 · 天纪·人间道·屯卦（PDF 第21~22页）  ---"},{"t":"四十一、卦象（蒙卦启蒙）","h":"满船珍宝：蒙卦的六物与\"先成后破\"","c":"方法——蒙卦（山水蒙）所绘六物，各有所指，其\"卦图象解\"为：**①\"满船珍宝：暗示人图财之象\"**；**②\"船在水上：乃离国他去象\"**；**③\"鹿在地上：示仍有小禄于内，鹿——禄也\"**；**④\"两串钱：乃忧心忡忡象，即意虽有禄，但仍令人忧心\"**；**⑤\"图中一碗：示此蒙蔽手段必先成后破，因其乃不正之财，必不久远也\"**；**⑥\"李树子折：示人李姓人氏，且有子夭折之象\"**。其总断为\"**人藏禄宝之课，万物发生之象**\"。**这一卦的取象有一个特点：六物几乎全部围绕\"财\"**（**满船珍宝、鹿（禄）、两串钱、一碗**）——**故其指向的处境是\"因财而蒙\"**：**有人以财富为饵，诱人离乡（\"船在水上，离国他去\"），受者虽有\"小禄\"在握，仍\"忧心忡忡\"，其结局是\"先成后破\"**。**须说明**：**\"鹿＝禄\"是谐音取象，\"李树子折＝李姓、子夭折\"是字形与物象的双重附会**——**这类取义无逻辑必然性**（**见前章\"图象取义\"的讨论**）；**但其\"以财为饵、先成后破\"的整体叙事，读起来是通顺的**。","o":"TJ-0102 · 天纪·人间道·蒙卦（PDF 第23页）"},{"t":"四十一、卦象（蒙卦启蒙）","h":"正反两读：启蒙与识破蒙蔽","c":"定义——蒙卦有一句**方法论上极重要**的提示，短短两行，把\"占\"与\"防\"合在一起：\"**蒙卦有示吾人去蒙之道。反观之：如人以蒙蔽之法示人，势必有所图也。**\" **这句话的意思是**：**同一卦，有两种用法**——**①正面：我处于\"蒙\"（不明白）时，如何被启发（\"去蒙之道\"）**；**②反面：他人以\"蒙\"的方式对我时，如何识破（\"势必有所图也\"）**。**\"反观\"二字是全书的枢纽**：**它要求读者把每一个\"象\"都翻转过来看一遍**——**图中那些珍宝、那艘船、那两串钱，既可以是\"我所求之禄\"，也可以是\"他人设下的饵\"**；**其分界在于\"谁在图什么\"**。**这一读法的实用价值极高**：**凡遇\"看似有利可图而需离乡背井、需先投入\"的局面，正可照此反观——\"人藏禄宝\"的另一面，往往是\"人以禄宝藏其图\"**。**本册认为这是《人间道》中最经得起推敲的方法之一**：**它不预言结果，只教人换一个方向看。**","o":"TJ-0103 · 天纪·人间道·蒙卦（PDF 第23页）"},{"t":"四十二、卦辞（蒙卦启蒙）","h":"\"匪我求童蒙，童蒙求我\"","c":"要点——蒙卦辞\"**蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告，利贞**\"，其解分三层。**①\"童蒙\"之义**——\"**儿童之蒙，其未发蒙，而志则专一，此为童蒙；因有童蒙，则告之；因其童蒙，故必至诚一意以求必中。而发蒙之道，必以贞正方吉**\"；**②\"匪我求童蒙，童蒙求我\"**——**\"此因刚贤之才居第二位、处于下位，而居君位者为童蒙……贤能之人处下，而自求为进、主动告以君，则必无被信用之理\"**；**\"故如方法正确，非下求于君位，实为君之志应于下也，此为'时中'也\"**；**③\"初筮告，再三渎，渎则不告\"**——**\"如诚一而来求决其蒙，当以刚中之道开发之；如烦数不能诚一，则乃渎蒙，此时不当告——因告之必不能信受，徒以烦渎，无益矣\"**。**这三层合起来是一条\"教与学\"的分寸**：**（1）求教者须\"志专一\"**（**不诚则不必答**）；**（2）教者不可\"自求为进\"**（**主动去说服一个不求你的人，必不被信**）；**（3）问得太多太杂即是\"渎\"**（**反复摇摆的提问，答案给了也无用**）。**这三条对今人极适用：既不轻教，也不轻学。**","o":"TJ-0104 · 天纪·人间道·蒙卦（PDF 第23页）"},{"t":"四十二、卦辞（蒙卦启蒙）","h":"\"蒙以养正\"与\"教而后禁\"","c":"要点——\"彖\"中有一句被其引申为对当世的批评：\"**蒙以养正，圣功也**\"；其解：\"**此申'利贞'之义：养蒙之法必以正道——此时乃纯一未发之童蒙时，故养正于蒙，乃学之至善也。现今人类皆'教而后禁'，故难以教胜，故时风日下。**\" **\"蒙以养正\"四字，是中国教育思想中最古老的一条原则**：**在蒙昧未开之时，以正道养成之**——**其要在\"早\"与\"正\"**（**与\"履霜坚冰\"的\"辨之不早辨\"是同一逻辑**）。**\"教而后禁\"这一批评尤值得记**：**它的意思是——现在的做法是\"先让他做错、再立规矩去禁止\"，而不是\"在开端就以正道养成\"**；**故\"难以教胜\"**（**规矩总在事后，而人的习惯已先成形**）。**这一判断的现实对应很清楚**：**无论是家庭教育还是公共治理，\"事后设禁\"总比\"事先养成\"费力，且效果差**——**这与\"屯卦\"的\"以渐正之\"、与\"坤文言\"的\"渐\"是同一套思路的第三个侧面**。","o":"TJ-0105 · 天纪·人间道·蒙卦（PDF 第23~24页）"},{"t":"四十三、爻（蒙卦启蒙）","h":"初爻：立法居先，不教而诛","c":"方法——初爻\"**发蒙，利用刑人，用说桎梏，以往吝**\"。其解是全书论\"刑与教\"最集中的一段：\"**初爻属最下位，此言发下民之蒙，须明刑禁以示之，使之知惧，从而教之。是故为政之始，立法居先；治蒙之初，威以刑者，是以使民去其昏蒙之桎梏。不设法去其蒙之桎梏，即善教亦无法改变其蒙——故圣人使下民畏威以从，不敢任意其昏蒙之欲，然后才能渐知善道，此为移风易俗之唯一法门。但只有初爻之始可用之：如专用刑以为治，则蒙虽畏，终不能发。**\" 其\"象\"再补一句极重的话：\"**此即用立法制刑，以教人之意，万不可不教而诛。后世之论刑者，不复知教化孕其中，只一味地论刑。**\" **这一爻给的是\"秩序与教化\"的次序**：**①先立规矩（立法居先）**，**使人知所畏惧，从而\"去其桎梏\"**；**②再施教化**，**使人渐知善道**；**③但刑只能用于\"开端\"**，**若\"专用刑以为治\"，则人只是畏，不能真正开蒙**。**其\"万不可不教而诛\"一句，是对\"只论刑、不知教化\"的明确批评**——**这一句的普遍价值，远超其对《易》的注解**。**须说明**：**这是《易经》蒙卦的传统义理**，**其\"刑以辅教\"的立场在今日仍可讨论**（**如少年司法中的\"教育为主、惩罚为辅\"原则**）。","o":"TJ-0106 · 天纪·人间道·蒙卦·初爻（PDF 第24页）"},{"t":"四十三、爻（蒙卦启蒙）","h":"第二爻：包蒙与\"专持其明\"","c":"要点——第二爻\"**包蒙吉，纳妇吉，子克家**\"。其解极好：\"**此爻有刚明之才，与居君位之童蒙相对应，其志又一同，当其时必广其包容——老人妇孺之见，皆包容，则能启天下之蒙，功大矣。今人专持其明、漫用自任，致凶之道。是故古之尧舜，其圣功天下莫及，尚能请教下民、取合理之言，天下之民归之——就如儿子能治其家一样。**\" 其\"象\"补：\"**儿子之能治家，其因父之信任专一也；是故此爻能成启蒙之功，乃由君之信任专一也。此刚柔相接之义也。**\" **\"包蒙\"是全卦的正面方法**：**有才者不以才自恃，而能包容\"老人妇孺之见\"**——**因其\"蒙\"中包含未经雕琢的常识**。**而\"今人专持其明、漫用自任，致凶之道\"一句，是对\"有才者的通病\"最简洁的诊断**：**自以为明，于是不必听人；随意自任，于是无人可信**。**其以尧舜\"尚能请教下民\"作反证，力量很大**——**连圣功天下莫及者都要向下请教，何况常人**。**这一条与上一爻恰成互补**：**初爻讲\"如何管教下民\"，第二爻讲\"如何向下求言\"**；**一刚一柔，缺一不可**。","o":"TJ-0107 · 天纪·人间道·蒙卦·第二爻（PDF 第24页）"},{"t":"四十三、爻（蒙卦启蒙）","h":"第三爻：见金夫，不有躬","c":"风险——第三爻\"**勿用，取女见金夫，不有躬，无攸利**\"。其解（本段未完，据文意）：\"**三爻之位阴居之，此时机正应上位不能远……**\" **此爻的取象是\"女子见'金夫'（有钱有势的男子）而失其身\"**——**\"不有躬\"即不能保有自身（失身、失节、失自主）**。**其警示极清楚：因贪图对方的财富与地位而放弃自主，则\"无攸利\"（一无所得）**。**这一爻与卦图的\"满船珍宝\"\"鹿（禄）\"\"两串钱\"完全呼应**——**整卦讲的都是\"财与蒙\"的关系**：**受人以财相诱者，失其自主；以财诱人者，先成后破**。**须说明**：**其字面取象带有古代性别观的色彩**（**以\"女见金夫\"为喻**）；**但若抽去性别，其义理是普适的**——**任何人为外物所诱而放弃自主判断，结局都是\"不有躬\"**。**本集的读法：取其\"勿因贪而失自主\"之意，弃其字面的性别附会。**","o":"TJ-0108 · 天纪·人间道·蒙卦·第三爻（PDF 第24页）"},{"t":"四十三、爻（蒙卦启蒙）","h":"蒙卦的四层意思","c":"要点——把蒙卦的几层合看，可见其结构完整：**①去蒙之道（正面）**——**我蒙昧时，须\"志专一\"以求教，\"初筮告，再三渎，渎则不告\"**；**②识破蒙蔽（反面）**——**\"如人以蒙蔽之法示人，势必有所图也\"**（**\"反观\"之法**）；**③教化之序**——**立法居先，刑以辅教，\"万不可不教而诛\"；但专用刑则\"终不能发\"**；**④居上者之德**——**\"包蒙\"，广其包容，\"今人专持其明、漫用自任，致凶之道\"**。**这四层恰好对应四种位置**：**求教者、被诱者、施教者、居上位者**——**读者可按自己的处境取一层**。**故蒙卦在《人间道》中属于\"结构最完整\"的几卦之一**（**与乾、坤、屯并列**）。**本册收录它的理由，也正是这一点：它示范了\"一卦如何被拆成几种可用的处境\"**。","o":"TJ-0109 · 天纪·人间道·蒙卦（综合）  ---"},{"t":"四十四、卦象（需卦密云不雨）","h":"密云不雨：需卦的五物","c":"方法——需卦（水天需）所绘五物及其取义为：**①\"月当天：阴人居上位象，无担当也；清明无灾\"**；**②\"一门：豪斗也，官府也\"**；**③\"一人攀龙尾：附于贵人，想进据其位也\"**；**④\"一僧接引：光头之人，柔而无欲之象；入空门可解\"**；**⑤\"墓：藏棺之地，有官与财象；置之死地而后生之象\"**。其总断为\"**云霭中天之课，密云不雨之象**\"；其要旨在最后一段：\"**即使如龙之力大，但动不以时，则有入墓之险——此动为求官与财。佛理亦同：'生死一线，无死焉大生'。**\" **这一卦的取象与前几卦不同**：**它画的全是\"人\"（阴人、攀龙尾者、僧）与\"物\"（门、墓）**，**而\"墓\"是全图的落点**——**\"动不以时则有入墓之险\"**。**其意是：有\"攀龙尾\"之力（想依附贵人、进据其位）而时机不对，结局就是\"入墓\"**。**卦序上的位置也须记**：\"**蒙之后须养，此需之时也，饮食之道也**\"——**蒙卦（启蒙）之后是需卦（养育）**，**其序为\"先开其蒙，再养其身\"**。**须说明**：\"月当天＝阴人居上位、无担当\"一类的取义属象数附会；**但\"动不以时则入墓\"这一判断，与屯卦的\"时未至\"、蒙卦的\"时中\"构成同一主题的第三次出现**——**可见\"时机\"是这一体系反复强调的核心。**","o":"TJ-0110 · 天纪·人间道·需卦（PDF 第25页）"},{"t":"四十五、卦辞（需卦密云不雨）","h":"\"有孚\"：中实而后可涉险","c":"定义——需卦辞\"**需：有孚，光亨，贞吉，利涉大川**\"，其解分三层。**①\"需\"之义**——**\"以二卦体而言，乾以刚健，如上进而遇险，此未可进也，需待之\"**；**②\"孚\"之义**——**\"孚，中实之义。五位因刚实居中，此孚之象；此居天位而能正中，光明而亨通，且须贞正（坚心），吉也\"**；**③\"利涉大川\"之义**——**\"因中实（内之学问、操守）而贞正（坚心向道），即涉险阻，亦可有功也。故需之道在以乾刚之性而知待之道，何所不利\"**。**这三层的结构很值得注意**：**\"孚\"（中实）是内里的充实——学问与操守**；**\"贞\"（坚心）是方向的不移**；**两者合起来，才\"利涉大川\"**——**即：真正的\"敢冒险\"不是胆大，而是\"内里有东西撑着\"**。**这一句把\"等待\"与\"进取\"统一了**：**需卦不是教人一味等待，而是教人\"以待蓄实，以实涉险\"**。**须说明**：**这是需卦的传统义理**；**其结构（内实＋坚心＝能涉险）在任何领域都说得通**——**准备不足而冒进，与准备充足而敢于出手，是两种完全不同的\"动\"。**","o":"TJ-0111 · 天纪·人间道·需卦（PDF 第25页）"},{"t":"四十五、卦辞（需卦密云不雨）","h":"\"刚健而不陷\"：一句对\"躁进者\"的诊断","c":"要点——\"彖\"中有一段，其批评极为直白：\"**需，须也，险在前也，刚健而不陷，其义不困穷矣**\"；其解：\"**因险在前，未可遽进，须待而进；以乾之刚健，能待而不轻动，则不陷险中，则必不至困穷。时下刚健之人颇多，其动必躁——如能待时而动，则为至善之道。**\" **\"时下刚健之人颇多，其动必躁\"这十二个字，是全书对\"有能力者\"最精准的一句诊断**：**问题不在\"能力不足\"，而在\"能力足而躁\"**——**有乾之刚健者（有能力、有冲劲），最容易犯的错就是\"遽进\"（立刻出手）**；**而\"能待而不轻动\"恰恰是刚健者最难做到的事**。**这一判断与屯卦\"初爻盘桓\"、蒙卦\"匪我求童蒙\"完全同调**：**三卦都在讲\"有能力时的自我节制\"**。**须说明**：**这也是《易经》的原义（\"刚健而不陷\"）**；**其现实的解释力很强**——**许多失败不在能力不够，而在时机不对、出手太早**。","o":"TJ-0112 · 天纪·人间道·需卦（PDF 第25页）"},{"t":"四十五、卦辞（需卦密云不雨）","h":"\"君子以饮食宴乐\"","c":"方法——需卦\"象\"只有一句，却是全书最从容的一句：\"**云上于天，需；君子以饮食宴乐。**\"其解：\"**此自然之象：水上于天未成雨，为云——犹君子积蓄其才德，而未施于用也。怀其大才，安以待时；饮食以养身体，宴乐和其心志也。**\" **这一句的分量在于它对\"等待\"给出了完全正面的处置**：**不是焦虑地等，也不是空耗地等，而是\"饮食以养身体，宴乐和其心志\"**——**把等待期用在\"养身\"与\"和心\"上**。**这与前几卦的做法形成对照**：**屯卦的等待是\"盘桓\"（蓄势），蒙卦的等待是\"志专一\"（守诚），需卦的等待是\"养\"（养身养心）**——**三种等待，恰好对应三种状态**。**其现实意义**：**人在\"才德已具而未得其用\"的阶段，最容易耗在焦躁上**；**而\"饮食宴乐\"四字提示：把这段时间用来把身体与心志养好，本身就是正事**。**须说明**：**这是《易经》原文（需卦大象）**；**\"密云不雨\"的意象——云已满天而雨未落——正是这种状态的最好比喻。**","o":"TJ-0113 · 天纪·人间道·需卦（PDF 第26页）"},{"t":"四十六、爻（需卦密云不雨）","h":"初爻：需于郊，利用恒","c":"方法——初爻\"**需于郊，利用恒，无咎**\"。其解：\"**初爻因最远于险，故于郊（旷远之地）；故君子处于旷远之地，仍安守其常，则无咎灾也。如躁进犯难，则必灾至矣。**\" 其\"象\"：\"**君子处下野，不冒犯险难而行，复宜安处……**\" **这一爻给的是\"离危险还远\"时的处置**：**其要点不在\"等待\"，而在\"守常\"（利用恒）**——**即：身处安全地带，最该做的不是\"提前冲进去\"，而是\"把日常守住\"**。**\"利用恒\"三字最可味**：**恒＝常＝一贯的做法**；**即在\"尚未涉险\"的阶段，价值在于\"维持稳定的节奏\"**，**而不是\"为将来的冒险做戏剧性的准备\"**。**须说明**：**这一爻与其后的几爻构成\"离险由远及近\"的序列**（**郊→沙→泥→血→酒食→穴**，见下条），**故初爻的\"守常\"是整条序列的起点**——**先能守常，才谈得上后面\"涉险\"**。","o":"TJ-0114 · 天纪·人间道·需卦·初爻（PDF 第26页）"},{"t":"四十六、爻（需卦密云不雨）","h":"六爻的\"离险距离\"","c":"要点——需卦六爻在《易经》原文中构成一条鲜明的\"离险远近\"序列，可作读法示范：**初爻\"需于郊\"（旷远之地，离险最远）**；**第二爻\"需于沙\"（沙地，近水而未入）**；**第三爻\"需于泥\"（泥泞，已近险）**；**第四爻\"需于血\"（已入险而见伤）**；**第五爻\"需于酒食\"（以酒食自养，居尊位而安）**；**上爻\"入于穴\"（险之极）**。**这一序列的方法论意义极大**：**同一卦的六爻，画的是\"同一个人与危险之间距离的六个刻度\"**——**从郊（最远）到穴（最深）**。**故读需卦的正确方式**：**不是\"问吉凶\"，而是\"先定位自己在哪一个刻度\"**——**在郊则守常，在沙则谨慎，在泥则须备，在血则须救，在酒食则安养，在穴则待援**。**这一读法与前章\"从第几爻往上走\"（紫微章）完全一致**。**须说明**：**本册所据的讲义仅详注至初爻**（**其后各爻的注解在扫描件中未逐条呈现**），**故此处只据《易经》原文列出序列，标注为\"原文序列\"而非\"其解\"**——**这是本集处理材料不全时的通则：不代为补注，只标明所据。**","o":"TJ-0115 · 天纪·人间道·需卦（PDF 第26页，参《易经》原文）"},{"t":"四十六、爻（需卦密云不雨）","h":"需卦在卦序中的位置","c":"要点——需卦处在\"蒙之后\"，其讲义开篇即点明：\"**蒙之后须养，此需之时也，饮食之道也。**\" **这一句揭示了《序卦》的逻辑**：**蒙（启蒙）→ 需（养育）**——**开了蒙，还得养得住**；**\"饮食之道\"四字更具体：养育的第一义是\"吃饭\"**。**其后接讼卦（争讼）**——**养之不足则争**。**读卦序的好处**：**六十四卦不是六十四张孤立的签，而是一条\"事态发展的链\"**——**前一卦的结局，往往是后一卦的开端**。**这与前章\"四大难卦\"的分类法正好互补**：**分类法按\"处境类型\"检索，卦序按\"发展阶段\"检索**。**故本册在两处都作了记录**：**读者若要\"找自己现在像哪一卦\"，用分类；若要\"知道下一步会是什么\"，用卦序。** 而**其共同的前提仍是**：**这两者都只是框架，不是预言。**","o":"TJ-0116 · 天纪·人间道·需卦（PDF 第25页）  ---"},{"t":"四十七、卦象（讼卦天水相违）","h":"苍鹰逐兔：讼卦的五物","c":"方法——讼卦（天水讼）所绘为\"**苍鹰逐兔之课，天水相违之象**\"，其五物取义：**①\"口舌二字：官司，纠纷，灾也\"**；**②\"山下有睡虎：入危地而不知象\"**；**③\"虎：王姓，肖虎之人\"**；**④\"文书在云中：心想事不成，幻想也\"**；**⑤\"人立虎下：近险也——近险为脱险之道\"**；**⑥\"柳树：随风而动，虽大风而不折，此柳之性也（韩信之辱，即柳性）\"**。**这六条里，有三条值得单独记**：**\"山下有睡虎＝入危地而不知\"**——**危险就在近处而人未觉**，**这是讼端最常见的处境**（**争讼往往起于当事人不觉得自己已入险**）；**\"文书在云中＝心想事不成，幻想也\"**——**文书（证据、契约、判词）飘在云里，即所恃者虚幻**；**\"近险为脱险之道\"**——**这一句最反直觉**：**靠近危险反而是脱险的办法**（**因知险而慎，因慎而不陷**），**与\"需于血\"之义相通**；**\"柳树\"以韩信胯下之辱作解**——**能受大辱而不折，是\"讼\"这一卦给出的另一种应对**（**不争**）。**须说明**：\"虎者王姓、肖虎之人\"一类的取象是象数附会；**其开篇的占例（汉高祖斩丁公，卜得之后果遭戮）亦属事后附会**——**但它记录的\"疑惑—卜—应验\"这种叙事模式，正是需要读者警觉的地方**（见后条）。","o":"TJ-0117 · 天纪·人间道·讼卦（PDF 第27页）"},{"t":"四十七、卦象（讼卦天水相违）","h":"从\"需\"到\"讼\"：因有所需而起争","c":"要点——讼卦接在需卦之后，其讲义把这层因果写得极明白：\"**人之所需饮食也，因有所须，争讼之所由起**\"；\"**天阳上行，水性就下，其行相违，所以成讼也**\"；\"**卦义：外健内险之象，必有讼**\"。**这三句合起来，是一个关于\"争讼从何而来\"的完整判断**：**（1）争讼的源头是\"需\"**——**人有需要，需要有限而人欲无穷，故起争**；**（2）争讼的结构是\"相违\"**——**天性上升、水性下降，两者方向相反**（**不是一方有错，而是两方本就走不到一处**）；**（3）争讼的外观是\"外健内险\"**——**外面强硬、内里藏着算计**。**这一卦的位置因此很重要**：**它排在\"需\"（养育）之后，说明\"养之不足则争\"是被当成规律来处理的**——**《序卦》的逻辑不是\"善恶\"，而是\"发展的连锁\"**。**其现实解释力很强**：**多数争讼不是因\"坏人作恶\"，而是因\"需要相冲\"**——**故解决之道不在\"辨谁更坏\"，而在\"分其所需\"**。","o":"TJ-0118 · 天纪·人间道·讼卦（PDF 第27页）"},{"t":"四十八、卦辞（讼卦天水相违）","h":"\"有孚，窒惕，中吉，终凶\"","c":"定义——讼卦辞\"**讼：有孚，窒惕，中吉，终凶**\"，其解分四层。**①\"有孚\"**——**\"讼之道，必中实；如中无有实，乃诬妄，凶之道也\"**（**即：打官司须有理有据；内里空虚而强辩，是\"诬妄\"**）；**②\"窒惕\"**——**\"讼乃与人争辩而待决于他人，虽有孚，仍会窒塞\"**（**故须\"惕\"——心存戒惧**）；**③\"中吉\"**——**\"故有得中实则吉\"**（**得中而止则吉**）；**④\"终凶\"**——**\"但终极其事则凶也\"**；彖中更直白：\"**终凶，讼不可成也**\"——\"**因讼本非善事，乃不得已也；终极其事，则凶矣**\"。**这四层的意思可归结为一句**：**有理也要懂得停**——**\"中吉\"的\"中\"不是\"中间\"，而是\"适可而止\"**。**这是《易经》对争讼最核心的处置**：**它不否认\"必要时须争\"（\"乃不得已也\"），但明确说\"把官司打到底则凶\"**。**须说明**：**这一判断是经验性的**——**争讼拖长，双方的损耗（时间、金钱、关系、心力）确实持续累积，且结果常不如早和**；**但不宜绝对化**：**有些权利若不在法律程序中主张到底，就等于放弃**——**故\"中吉终凶\"应读作\"先评估成本，再决定争到哪一步\"，而不是\"凡讼皆早和\"**。","o":"TJ-0119 · 天纪·人间道·讼卦（PDF 第27页）"},{"t":"四十八、卦辞（讼卦天水相违）","h":"\"险而健\"：什么人最容易讼","c":"要点——彖中有一句对\"讼者\"的人格分析，极精：\"**讼，上刚下险，险而健，讼**\"；其解：\"**此内险外健，讼之所起。若健而不险，不生讼也；险而不健，不能讼也。犹如一人，只重外饰，内无真实材料，此为讼之源也。**\" **这三句构成一个完整的\"能讼者画像\"**：**\"健而不险\"不生讼**——**有能力而心思坦荡者，不必讼**；**\"险而不健\"不能讼**——**心怀算计而无实力者，闹不起来**；**只有\"险而健\"**——**既有实力、又怀着算计（内险）者，才会成讼**。**而末句更狠**：\"**只重外饰，内无真实材料**\"——**外表撑得很足、里子却是空的，这种人最易起讼**（**因须靠争讼来撑住外表**）。**这一处的观察价值很高**：**它把\"争讼\"从\"事件\"读成了\"人格与结构的产物\"**——**凡长期好讼者，多半不是\"权益受损\"，而是\"内里空虚，须以外争来补\"**。**须说明**：**这是义理性的判断，不能作诊断用**；**但作为一面镜子，它比\"谁对谁错\"更能解释很多纠纷为何久拖不决。**","o":"TJ-0120 · 天纪·人间道·讼卦（PDF 第27页）"},{"t":"四十八、卦辞（讼卦天水相违）","h":"\"利见大人，不利涉大川\"","c":"方法——讼卦辞下半\"**利见大人，不利涉大川**\"，其解为两条具体指引。**①\"利见大人\"**——**\"因讼者求辩曲直，故利见大人；如大人能以刚明中正决其讼，吉\"**——**即：争讼要找\"能公正裁决的人\"**（**这在今天读来，就是\"找有裁判权的第三方\"，而不是私下互斗**）；**②\"不利涉大川\"**——**\"因讼非吉事，须择安地而居，不可陷于险难，故不利涉大川也\"**——**即：争讼期间不要再去冒险、扩张、远行**（**因讼已耗其力，再涉险则两败**）。**这两条合起来是一套\"争讼期间的行为纪律\"**：**向内求裁决（见大人），向外守安稳（不涉大川）**。**其现实意义明确**：**诉讼期最忌\"一边打官司一边开新战场\"**——**精力、资源、注意力都是有限的，双线作战往往两线皆失**。**须说明**：**\"大人\"在原义中指\"刚明中正\"的执政者**；**今天对应的是法院、仲裁、调解机构与专业律师**——**故这一条的现代读法很直接：把争议交给有裁决权的正当程序，而不是自己解决。**","o":"TJ-0121 · 天纪·人间道·讼卦（PDF 第27页）"},{"t":"四十九、前后（讼卦天水相违）","h":"需卦上爻：\"不速之客三人来，敬之终吉\"","c":"要点——需卦的上爻，其辞为\"**入于穴，有不速之客三人来，敬之终吉**\"，解为：\"**阴柔于六位，乃需之极限，须安其处，此入于穴之义。安而止居，则下之三阳必来——不速，不促之而自来也。此时须以至诚尽敬之心以待之，虽再刚暴，必无欺凌之理也。**\" **这一条的价值在于它给了一个姿态**：**身处最深的险（\"入于穴\"）时，来的不是援手而是\"不速之客\"（不请自来的强者，三阳）**；**应对之法只有一条——\"敬之\"**（**以至诚尽敬待之**），**其理由**：\"**此因六位阴位，非三阳乾体之人，志在必夺，故敬之则吉**\"。**换言之**：**你无力抵抗，对方志在必得，唯一可行的是\"以敬自处\"，反而不被欺凌**。**\"不速之客\"这个成语即出于此爻**。**须说明**：**这是《易经》的处世智慧，不是操作指南**；**而它给出的判断有现实依据**：**在力量悬殊的处境里，\"姿态\"确实影响结果**——**但须与\"屈服\"区分**：**\"敬\"是礼数与自持，不是放弃主张**；**故这一条宜读作\"弱势时的自我保全\"，而非\"放弃抵抗\"。**","o":"TJ-0122 · 天纪·人间道·需卦·上爻（PDF 第26页）"},{"t":"四十九、前后（讼卦天水相违）","h":"占例的功能：为何要警觉","c":"要点——讼卦开篇的占例是\"**汉高祖斩丁公，疑惑，卜得之后，果遭戮也**\"。**这类叙事在本册中反复出现**（**屯卦的\"孔子筮得屯\"、需卦的\"蔡顺遇赤眉贼\"、讼卦的\"高祖斩丁公\"**），**其结构固定**：**遇事疑惑 → 卜 → 得某卦 → 事情果然如此**。**须说明它的性质**：**这是\"事后叙述\"，不是\"事前预测记录\"**——**因为只有\"应验\"的才会被写下来，没有应验的不入书**；**这种只收录命中的记录方式，在任何预言系统中都会制造\"极其灵验\"的印象**（**这就是前章所称的\"只有成功、没有失败分母\"**）。**故本集对这些占例一律标注为\"卦书的例证叙事\"，不作预测依据。** **而它们的另一重价值是\"史料\"**：**这些例子把卦与具体的历史处境（斩降将、遇乱兵、被围困）对应起来，读者可借此看出古人如何用卦来整理处境**——**这比\"灵不灵\"更有意思**。","o":"TJ-0123 · 天纪·人间道·讼卦（PDF 第27页）  ---"},{"t":"五十、总纲（讼卦六爻作事谋始）","h":"\"君子以作事谋始\"","c":"方法——讼卦\"象\"只有一句，却是全卦最实用的一条：\"**天与水违行，讼；君子以作事谋始。**\"其解：\"**此因天上水下，二卦体相违，讼之由也。君子观象，知人有争讼之道，故行事必'慎始'，绝讼端于事之始，则讼不生矣。**\" **这一句把\"讼\"的解法从\"事后争胜\"整个挪到了\"事前设计\"**：**讼之所以起，是因为两方的方向本相违（天上升、水下降）**；**而人不能等到起了讼再想办法，要在\"作事\"的时候就先把\"会引起争的地方\"设计掉**。**\"谋始\"二字可拆成三问**：**①这件事若出问题，凭据在哪里（书面约定、留痕、交割标准）；②利益怎么分，边界在哪里；③最坏的情况下，剩下的路是什么。** **这三问在事前问清，绝大多数的讼就不会发生。** **须说明**：**这是《易经》原文，也是其中最具现代意义的一条**；**它与\"契约、流程、留痕\"这些现代治理手段完全同指**——**故本集把它列为讼卦的第一条，而不是六爻中的任何一爻。**","o":"TJ-0124 · 天纪·人间道·讼卦（PDF 第28页）"},{"t":"五十一、六爻（讼卦六爻作事谋始）","h":"初爻：\"不永所事\"——讼不可长","c":"要点——初爻\"**不永所事，小有言，终吉**\"。其解：\"**此阴柔居下位，必不可终极其讼也。若不终极其讼，虽小有言伤，而终得吉。**\"其\"象\"：\"**不永所事，讼不可长也；虽小有言，其辩明也**\"——\"**此即于讼之初，即戒讼：因柔弱而居下，不可长久；因既讼必有小灾，应辩理之明，终得其吉。**\" **这一爻给的是\"地位弱、实力薄\"者的处置**：**不要把事情拖长（\"不永所事\"）**，**宁可吃一点口舌上的小亏（\"小有言\"）**，**把道理讲清楚就收手**。**\"讼不可长\"四字是全卦的基调**——**争讼最大的成本是时间，而不是输赢**。**须说明**：**这一条的现实依据很强**——**小额争议拖过一两年，无论胜负，双方都已付出远超争议标的的成本**；**但\"不永\"不等于\"不争\"**——**该主张的先主张清楚（\"其辩明也\"），再收**。","o":"TJ-0125 · 天纪·人间道·讼卦·初爻（PDF 第28页）"},{"t":"五十一、六爻（讼卦六爻作事谋始）","h":"第二爻：\"不克讼，归而逋\"——以弱讼上的结局","c":"风险——第二爻\"**不克讼，归而逋，其邑人三百户，无眚**\"。其解：\"**二爻与五爻为相应之地，九二乃将位，以刚处险，与五之君位为敌——知不可敌，归而避之，俭朴自处，则无过矣。三百户，乃邑之至小者；如处强大，此竞也，则必过也。**\"其\"象\"更直白：\"**不克讼，归逋窜也。自下讼上，患至掇也**\"——\"**因义不敌，故不能讼，须避去其所。自下讼上，义不正，且气势不足，此招祸患之至易也。**\" **这一爻讲的是\"下位者对上位者兴讼\"**：**其判词是\"义不正 + 气势不足 → 招祸最易\"**（**\"掇\"是\"拾取\"，即祸患像俯身就能捡到一样容易到来**）；**其出路是\"归而逋\"（退回去、避开）并\"俭朴自处\"**。**须说明其分寸**：**这一爻是古代的等级秩序下的判断，不宜直接搬到今天**——**现代有劳动争议、行政复议、诉讼等制度化的\"下对上\"渠道，其正当性由法律保障，而非由\"义\"决定**；**但这一爻有一层仍成立**：**在实力悬殊、程序不明的处境里硬碰，往往先伤自己**——**故正确的读法是\"先走正当程序与专业代理，而不是以己之力硬抗\"，不是\"下位者不该争\"**。**本集据此标注：此条为古代义理记录，涉维权请循法律途径。**","o":"TJ-0126 · 天纪·人间道·讼卦·第二爻（PDF 第28页）"},{"t":"五十一、六爻（讼卦六爻作事谋始）","h":"第三爻：\"食旧德\"——守本分则不生讼","c":"要点——第三爻\"**食旧德，贞厉，终吉；或从王事，无成**\"。其解：\"**阴爻居三阳刚位，乃阴柔居二刚之间，须知虽处危地，能知危惧，终必获吉。守原之本分而无所求，则不生讼矣。或从上而成，因从王事，故不在己也。**\"其\"象\"：\"**食旧德，从上吉也**\"——\"**守其本分，顺从上之所为，非由己意，终也吉。**\" **这一爻给的是\"夹在两强之间\"者的处置**：**守住原有的位置与本分（\"食旧德\"），不多求，则不起讼**；**若参与更大的事（\"从王事\"），则\"无成\"**——**即不必以\"我\"为主，成事归上，不成亦不争**。**这与前章坤卦\"含章可贞\"\"无成有终\"完全同调**：**同一个\"无成\"的处置，在坤卦第三爻与讼卦第三爻重复出现**。**须说明**：**\"守本分而无求\"在当代读来须小心**——**它可以解为\"守住已有的合法权益、不额外扩张\"，这很有用**；**但若解为\"受了侵害也不主张\"，则错**——**故本集取其\"不贪求\"之义，不取其\"不主张\"之义。**","o":"TJ-0127 · 天纪·人间道·讼卦·第三爻（PDF 第28页）"},{"t":"五十一、六爻（讼卦六爻作事谋始）","h":"第四爻：\"渝安贞\"——好讼的根源是\"不安不贞\"","c":"要点——第四爻\"**不克讼，复即命，渝安贞，吉**\"。其解：\"**此阳刚居乾下，因不得中正，本必讼。故四爻刚位阳居之，虽刚健欲讼，而无与对敌，则讼无由而兴。此即若能克制刚忿欲讼之心，就于命，革其心，平其气，而变为安贞，吉矣。**\" 其后引孟子一句，是全书对\"好讼\"最深的诊断：\"**方命虐民——夫刚健而不中正，则躁动，故不安；处非中正，故不贞；不安贞，所以好讼也。**\"（**\"方\"＝不顺**）。**这句话把\"好讼\"的病因说成了两条**：**\"不安\"（躁动，坐不住）与\"不贞\"（不平正，立不稳）**——**人之所以动不动就要争，不是因为\"权益受损\"，而是因为内心躁动、立场不平**。**这与前条\"险而健\"\"只重外饰、内无真实材料\"互为表里**：**一个说\"结构\"，一个说\"心气\"**。**其处置则是\"复即命，渝安贞\"**——**回到本分（复即命）、改变心气（渝）、使安且贞**。**须说明**：**这是义理层面的诊断，不能替代心理或法律评估**；**但它对人极有用**：**\"我现在是想解决问题，还是坐不住？\"是争执之前最该问自己的一句。**","o":"TJ-0128 · 天纪·人间道·讼卦·第四爻（PDF 第28页）"},{"t":"五十一、六爻（讼卦六爻作事谋始）","h":"第五爻与上爻：裁决者的吉，争胜者的凶","c":"要点——讼卦最后两爻恰好构成对照。**第五爻\"讼，元吉\"**——\"**九五居尊位，治讼得中正，则大吉而尽善**\"；其\"象\"：\"**讼元吉，以中正也**\"——\"**此云中正之道，施必吉也**\"。**注意这一爻的吉不属于\"讼者\"，而属于\"治讼者\"**——**即：居尊位而能中正地裁断争讼，是大吉**。**上爻\"或锡之鞶带，终朝三褫之\"**——\"**刚健之极，处讼之终极，人因其刚强，穷极于讼，取祸丧身；即使善讼能胜，即赏，亦来自与人仇争所得，其能保乎？终一日而见三次褫夺也。**\"其\"象\"：\"**以讼受服，亦不足敬也**\"——\"**穷极讼事，即有受命之宠，亦不足以敬，而可贱恶，祸患随至也。**\" **这两爻合读，是全卦的判决书**：**能裁断者吉（第五爻），争到底者凶（上爻）**；**而\"终朝三褫之\"这个意象极狠**——**靠争讼赢来的赏赐（鞶带，古代命服的带饰），一个早上就被剥夺三次**。**须说明**：**这与现代诉讼的现实有对应**——**赢了判决而执行不到、或赢了官司而失去客户与关系，都是\"终朝三褫\"的现代版**；**但也不宜推到\"凡讼必凶\"**——**第五爻明说\"治讼得中正\"是吉，说明这套体系认可\"有中正的裁断\"这件事本身**。","o":"TJ-0129 · 天纪·人间道·讼卦·第五爻、上爻（PDF 第28页）  ---"},{"t":"五十二、总纲（师卦正名）","h":"师之兴，因有争议","c":"要点——师卦（地水师）居讼卦之后，其讲义开篇即点明因果：\"**师之兴，因有争议也**\"。**这一句把\"讼\"与\"师\"接上了**：**争讼不解，则动众**（**\"师\"即军队，引申为组织起来的众人**）。其结构为：\"**此卦本体上顺下险之象，亦即地下有水，内外分即内险外顺，有'行险之道如何顺行之'义**\"；\"**水在地下必聚，如部队之集结**\"；爻位上\"**九五为一阳，余为诸阴，则为天子之象；今九二为将位，统帅诸阴，则为将帅之象**\"。**其对\"处师之时\"的总结极精**：\"**内须戒慎警惕，不可掉以轻心；外须统一专权，命令如一，方能行顺之义。**\" **\"内戒慎、外专权\"六个字，是这一卦的纲领**：**对内不能松懈（戒慎），对外不能多头（专权）**。**须说明**：**这是《易经》的义理，其适用远不止军事**——**任何需要\"众人协同去做一件有风险的事\"的场合（工程、项目、危机处置、创业），这两条都是成败关键**；**而\"外顺\"不是\"对外软弱\"，而是\"内部的纪律使外部看来顺服可用\"**（**兵家所谓\"其疾如风、其徐如林\"，正是此义，见后条**）。","o":"TJ-0130 · 天纪·人间道·师卦（PDF 第29页）"},{"t":"五十二、总纲（师卦正名）","h":"兴师必有二道：正名与主将","c":"定义——师卦辞\"**师：贞，丈人吉，无咎**\"，其解给出两条必要条件：\"**此言，师之道必有正名，因师之与，天下万民必伤；如不以正，则民心不从，致凶之道。丈人，即尊贵有众望之人，故出师必立帅将，此人必民所听从顺同——不能服众人，安得民心？如此则无灾。故兴师必有二道：正名与主将。**\" **\"正名与主将\"这四个字，是所有组织行动的底层条件**：**①正名**——**为什么要做这件事，必须说得清、立得住**（**\"民必伤\"三字极重：任何大规模行动都会有代价，若理由不正，代价一来人心就散**）；**②主将**——**必须有一个\"众人所听从而顺同\"的人来担**（**\"不能服众人，安得民心\"**）。**这两条缺一即败**：**有名无将则乱，有将无名则散**。**须说明**：**这是《易经》原文的义理（\"贞，丈人吉\"）**；**其现代对应极直接**——**任何需要动员众人的事，先问\"理由站不站得住\"，再问\"谁来担、众人服不服他\"**。**这两问不过，后面的资源、方案、执行都是空的。**","o":"TJ-0131 · 天纪·人间道·师卦（PDF 第29页）"},{"t":"五十二、总纲（师卦正名）","h":"\"容民畜众\"与卦图的三个警示","c":"方法——师卦的\"象\"为\"**地中有水，师；君子以容民畜众**\"，其解：\"**水在地下相聚，为众聚之象；君子之人须以包容民众，为使民顺从之法。**\" **这一句给的是\"聚众之后如何待众\"**：**以\"容\"（包容）来\"畜\"（蓄养）**——**不是靠威压把人聚住，而是靠容纳**。**卦图另有三个警示性取义**：**①\"人立棋盘上：围棋愈下愈多，但须有谋略方可成事\"**——**局面越往后越复杂，取胜靠谋略而非蛮力**；**②\"文武二官绶印：得万人服之帅\"**——**统众者须文武兼备（能理事、能服人）**；**③\"羊回首：回阳也，病危之人卜之，有自阴间回阳间之象\"**——**这一条属占断吉凶之用，与\"领军\"无关，本集照录并标明其为占例**。**须说明**：\"生杀之专权、武职大利\"一类的断语是古代军政语境；**现代组织里对应的不是\"专权\"，而是\"授权清晰、责任到人\"**——**故本集取\"容民畜众\"与\"须有谋略\"二义，不取\"生杀专权\"的字面。**","o":"TJ-0132 · 天纪·人间道·师卦（PDF 第29页）"},{"t":"五十三、爻","h":"初爻：\"师出以律\"——即胜亦凶","c":"风险——初爻\"**师出以律，否臧凶**\"。其解：\"**师之出，必以诛乱制暴而动；行师之道，须以律法，合于义理——如不按此法，即致胜亦凶。**\"其\"象\"：\"**师出以律，失律凶也**\"——\"**师出必有律法；失律法，致凶之道。**\" **这一爻的判断极严厉**：**\"即致胜亦凶\"**——**赢了，若不合律法与义理，仍然是凶**。**\"否臧\"二字（不善）即指\"不合律\"**。**这一条的分量在于它把\"成败\"与\"正当\"分开了**：**通常的评价只看结果（赢了就是好），这一爻明确说，手段不合规的胜利，在更长的尺度上是负的**——**因为\"失律\"这件事会留在组织里，成为下一轮的隐患**。**须说明**：**这是《易经》原文，也是所有组织的通则**；**现代的对应很直接**：**合规、程序、授权边界，不是\"限制\"，而是\"使胜利可保住\"的条件**——**这也是上章讼卦上爻\"终朝三褫之\"的另一面**（**靠争讼赢来的东西保不住，靠失律赢来的胜利同样保不住**）。**故本集将这一爻列为「风险」类**：**\"先合规，再求胜\"是它的现代读法。**","o":"TJ-0133 · 天纪·人间道·师卦·初爻（PDF 第30页）"},{"t":"五十三、爻","h":"第二爻：\"王三锡命\"——授权与专任","c":"方法——第二爻\"**在师中，吉，无咎，王三锡命**\"。其解极有意思：\"**此言九二之道，为为将之道：君之事为人臣绝无敢专权，但出师作战之时，则将在外，君命有所不从，君王须顺从其命，以专信任之。**\"其\"象\"：\"**在师中吉，承天宠也；王三锡命，怀万邦也**\"——\"**人臣如无君之专宠，则不得专制之权，更何论成功。**\" **这一爻讲的是\"授权\"的逻辑**：**平时人臣不敢专权，但到了\"出师\"（承担一线成败）之时，必须给出完整授权**——**\"将在外，君命有所不从\"**（**这是\"将在外君命有所不受\"的出处脉络**）；**而\"王三锡命\"（三次赐命）是以仪式反复确认这份信任**。**其判断极硬**：\"**人臣如无君之专宠，则不得专制之权，更何论成功**\"——**没有完整授权，就谈不上成功**。**须说明**：**这是古代军政的授权逻辑，但其原理在当代完全成立**：**一线负责人若无\"在其职权内可自主决定\"的空间，任何方案都做不成**；**而\"三锡命\"这一层也值得学**——**授权不是\"我口头说了\"，而是要有可见、可记、可复述的确认**（**否则一线不敢用，后方随时收回**）。","o":"TJ-0134 · 天纪·人间道·师卦·第二爻（PDF 第30页）"},{"t":"五十三、爻","h":"第三爻：\"师或舆尸\"——以众意为主则凶","c":"风险——第三爻\"**师或舆尸，凶**\"，是全卦最凶的一爻。其解：\"**舆尸，众人为主也。此言师旅之事，任当专一，须以刚中之才居上为信，乃得成功；如不这样，而以众之意见为主，凶之道也。**\"其\"象\"：\"**师或舆尸，大无功也**\"——\"**如倚二三人以上，必误之时也；不但无功，凶祸至矣。**\" **\"舆尸\"（车载尸体）被解为\"众人为主\"**——**即：多头决策，无人真正负责**，**其结局是\"大无功\"以至于\"凶祸\"**。**这一爻与第二爻构成正反一对**：**第二爻说\"授权要专、要完整\"，第三爻说\"多头必败\"**——**两者其实是一件事的两面**：**专任与分权不是矛盾，而是\"决策权必须清楚归一个人，而不是归一群人\"**。**须说明**：**\"以众意为主必凶\"不宜读成\"不要听取意见\"**——**听取意见（众议）与决策归属（专断）是两件事**；**这一爻反对的是\"决策权分散、无人担责\"**（**\"倚二三人以上，必误之时\"**），**不是反对\"开会讨论\"**。**其现实对应**：**委员会式的决策、双负责人、以及\"谁都可以否决\"的机制，最容易出现这一爻的处境。**","o":"TJ-0135 · 天纪·人间道·师卦·第三爻（PDF 第30页）"},{"t":"五十三、爻","h":"第四爻：\"师左次\"——知难而退","c":"方法——第四爻\"**师左次，无咎**\"。其解：\"**左次，乃知不可进而退。此言师之常法：见可而进，知难而退，进退有据，平安无灾。六四为阴爻，主阴柔，而师必以强勇，中有阴柔，即兵家之'风、林、火、山'同义。**\"其\"象\"：\"**左次，无咎，未失常也**\"——\"**言师之道，退亦未必为失道；退须得宜，无灾。**\" **这一爻给的是\"退\"的正当性**：**\"退亦未必为失道\"**——**退不是失败，退得宜就是常态**；**而\"见可而进，知难而退，进退有据\"八字，是全书对\"进退\"最完整的一句**。**其解末句尤精**：\"**师必以强勇，中有阴柔，即兵家之'风、林、火、山'同义**\"——**引的是《孙子兵法》\"其疾如风、其徐如林、侵掠如火、不动如山\"**：**强勇之中须有一段\"阴柔\"（能静、能守、能退），这才是完整的\"师\"**。**须说明**：**这一条对现代项目管理的意义很直接**——**\"知难而退\"常被当成失败，实际上\"退得宜\"是能力**；**其判断标准是\"进退有据\"**（**据＝依据，即退要有理由、有交代、有后续**），**而不是\"退到底对不对\"**。","o":"TJ-0136 · 天纪·人间道·师卦·第四爻（PDF 第30页）"},{"t":"五十三、爻","h":"第五爻与\"长子帅师\"","c":"要点——第五爻\"**田有禽，利执言，无咎；长子帅师，弟子舆尸，贞凶**\"。其解（据前文）：\"**五为君之位，此为兴师之主，此君主兴师任将之道。师之兴，必以生民受灾、蛮夷贼寇，此正名以诛之；如禽兽之入于田中，害五谷……**\"。**其取象为\"田中有禽兽害庄稼\"**——**即：兴师的前提是\"确有害者、确有受害\"**（**这与\"正名\"一条完全对应**）；**\"利执言\"即\"可以正当地声讨\"**。**其后半\"长子帅师，弟子舆尸\"是全卦最实用的对照**：**用\"长子\"（可托付的正任者）率师则成，用\"弟子\"（次一等、或众多之人）则\"舆尸\"**——**同一个任务，交给对的人就成，交给不对的人或分给众人就败**。**须说明**：**这一爻与其说是\"占断\"，不如说是\"任命原则\"**；**它把前几爻的意思收在一处**：**正名（确有害）、专任（长子）、勿多头（弟子舆尸）**——**三件事齐了，才谈得上\"贞吉\"**。","o":"TJ-0137 · 天纪·人间道·师卦·第五爻（PDF 第30页）  ---"},{"t":"五十四、卦象（比卦同欲相憎）","h":"众星拱比：比卦的七物","c":"方法——比卦（水地比）为\"**众星拱比之课，水行地上之象**\"，其七物取义：**①\"月圆当空：政治清明象\"**；**②\"三星拱照：得贤能刚直之人辅助\"**；**③\"秀才望月饮酒：示才智之人无忧也（亦示：作秀之人，于政治清明时无法出头）\"**；**④\"自酌自斟：无欲则刚象，孤独之象\"**；**⑤\"药炉在高处：无病无灾，故不需用药也\"**；**⑥\"枯树开花：晚发也——示心有诚，制度立，事必成\"**；**⑦\"酒：忘忧之物\"**。其总断：\"**全卦：上位清明，三台辅佐，人将无忧，即使枯树亦能开花。**\" **这一卦的取象与讼、师二卦的最大不同，是它整体是\"吉\"的**（**讼为\"天水相违\"、师为\"行险\"，此处则是\"清明—辅佐—无忧\"三层递进**）。**其中三条最可味**：**\"自酌自斟＝无欲则刚\"**——**孤独在此不是坏事，而是\"无所求于人\"的自持**；**\"药炉在高处＝无病无灾，故不需用药\"**——**卦象以\"没有用到的药炉\"表示平安**，**这个取象极巧**；**\"枯树开花＝晚发\"**——**其条件写得清楚：\"心有诚、制度立，事必成\"**，**即\"晚发\"不是白等，而须有诚与制度**。**须说明**：**\"政治清明\"\"作秀之人无法出头\"一类的断语属古代政论**；**本集取其\"清明—辅佐—无忧\"的结构义（一个好的上位＋几个刚直的辅佐＝多数人的安稳），不取其对具体政治的评断。**","o":"TJ-0138 · 天纪·人间道·比卦（PDF 第31页）"},{"t":"五十四、卦象（比卦同欲相憎）","h":"师到比：众聚之后必有亲比","c":"要点——比卦居师卦之后，其讲义点明：\"**师之后，师者众也；众聚有相比亲也。比，相亲也——有众则必有比，故次师也。**\" **这一句把\"聚集\"与\"亲近\"接上了**：**人一旦聚在一处，就必然产生\"谁与谁更近\"的问题**——**故\"比\"（亲附）是\"师\"（聚众）的必然后果**。**其卦体解极精**：\"**物之相近莫如水与地，永远相比附，故卦体为水在地上，地上有水象。水为险，地为顺，故外险内顺为比卦。**\"而\"**外险内顺**\"的人格化解法是全卦最好的一句：\"**险犹战战兢兢，恐得罪人象；内心又持顺之地道，有坤厚之德性——此比之道也。**\" **即：与人亲附时的正确姿态是\"外则战战兢兢（怕得罪人），内则厚德持顺\"**。**这与通常理解的\"搞好关系\"完全相反**——**它不是靠打点与讨好，而是靠\"谨慎自持＋内里厚道\"**。**须说明**：**这是《易经》的义理（比卦为\"外险内顺\"）**；**其现实判断很扎实**：**真心长久的关系，靠的是\"不轻慢\"与\"厚道\"，而不是手段。**","o":"TJ-0139 · 天纪·人间道·比卦（PDF 第31页）"},{"t":"五十五、卦辞（比卦同欲相憎）","h":"\"不可比而比，凶\"","c":"风险——比卦辞\"**比：吉，原筮，元永贞，无咎；不宁方来，后夫凶**\"。其解的第一层讲\"择所比\"：\"**比为吉之道。人相亲比，必有其道，须视可比而决定比之——不可比而比，凶。**\" **这一句是\"亲附\"的第一原则**：**要看清\"这个人／这个团体值不值得亲附\"，才决定亲附**；**\"不可比而比\"（不该亲附的偏去亲附）则凶**。**其第二层讲\"及时\"**：\"**如果等到不能自保安宁之时，方开始求亲比，幸运的得所亲比，可得平安；但如仍独立自持，求亲比之想法不前反后，即使是丈夫之亲人，亦招凶矣。**\" **这一层是\"不宁方来，后夫凶\"的解法**：**等到自己已不能自保才去求人，运气好的能得平安；而若此时还端着架子（\"独立自持\"\"不前反后\"），则连最亲近的人也救不了**。**其总断更彻底**：\"**天地之间，没有不相亲比而能独立生存的。**\" **须说明**：**这一条的现实意义很直**——**\"平时不往来，出事才求人\"是最常见的失败模式**；**而\"端着\"（不肯低头）会把最后的机会也失掉**。**\"后夫凶\"三字（后到者凶）说的就是\"迟\"与\"倨\"。**","o":"TJ-0140 · 天纪·人间道·比卦（PDF 第31页）"},{"t":"五十五、卦辞（比卦同欲相憎）","h":"\"同欲相憎，同忧相亲\"","c":"要点——比卦辞解中引《战国策·中山策》一句，是全书对人际关系最精的判断之一：\"**相比之道，须两志相求；如互不相求，则为睽卦。故战国策〈中山策〉有'同欲相憎，同忧相亲'之理。所以好的制度，能使人有所依从，故能互相亲和也。**\" **这三句各是一层**：**①\"两志相求\"**——**亲比的前提是双方都想，单方面求则不成**；**②\"互不相求则为睽卦\"**——**睽卦（火泽睽）正是\"相背\"之象，与比卦（亲附）恰好相反**（**前章已记睽卦**）；**③\"同欲相憎，同忧相亲\"**——**欲望相同的人互相憎恨（因所争者同一物），忧患相同的人互相亲近（因所惧者同一事）**。**这一句的解释力极强**：**同行相轻、同僚相忌，是\"同欲\"**；**同病相怜、同难相助，是\"同忧\"**。**而末句把制度拉了进来**：\"**好的制度，能使人有所依从，故能互相亲和**\"——**即：亲和不只是人心的事，制度若使人有所依托，人自然相亲**。**须说明**：**这是《易经》与《战国策》的义理**；**\"同忧相亲\"这一条尤其值得记住**：**若想让一群人真的亲近，与其给他们同一个目标（易生争），不如让他们面对同一个难题**（**这也解释了为何共同经历难关的团队更牢固**）。","o":"TJ-0141 · 天纪·人间道·比卦（PDF 第31页）"},{"t":"五十五、卦辞（比卦同欲相憎）","h":"\"下顺从也\"：可比高低，不可忘顺","c":"要点——比卦\"彖\"为\"**比，吉也。比，辅也，下顺从也**\"，其解：\"**因相亲比为吉之道，有相辅相成之意。但求比之道，须如臣下顺从君上一样——即使地位相同，或上下有别，决不可因持于己之高位，而忘顺从之道，此乃真比之道。**\" **这一句的关节在\"即使地位相同\"**：**通常以为\"顺从\"是下位者的事，此处的判断却是\"地位相同者之间，也不可因自己位高而忘顺从之道\"**。**其理由是\"比\"的本义是\"辅\"（相辅相成）**——**若一方只受不辅，就不是比**。**而\"元、永、贞为相比之道\"**：\"**元为君长之道，永为可以长久，贞谓得正道且坚其心志；人有此三德性，再以阳刚当君主之位，此为君之德也。**\" **即：能长久维持亲附关系者，须有\"元（能为主）、永（能持久）、贞（守正而坚心）\"三德**。**须说明**：**\"顺从\"在此不是\"屈从\"**——**它是\"在关系中愿意让渡一部分自我\"**（**故\"地位相同亦不可忘\"**）；**这一点对平级合作、朋友、伴侣关系都成立**：**只争不让的关系，很快就走到睽卦去了。**","o":"TJ-0142 · 天纪·人间道·比卦（PDF 第31~32页）"},{"t":"五十六、前后（比卦同欲相憎）","h":"师卦上爻：赏功而不用小人","c":"风险——师卦上爻\"**大君有命，开国承家，小人勿用**\"（其解所据），讲义的处理极果断：\"**师之终极，言功之成也。此时君主以爵位财禄赏赐有功之人，并任用之。但于军旅征战中察觉出之小人，不能因其有功而任用之——致凶之道。**\" 其\"象\"：\"**大君有命，以正功也；小人勿用，必乱邦也**\"——\"**君王有持恩赏之权柄，来表扬军旅之功；小人虽亦有赏，用之必乱邦。史上小人持功而乱邦，有太多案例了。**\" **这一条给出了\"论功行赏\"与\"任用\"之间必须分开的原则**：**功劳要给（赏不能少），但职位不能给**——**\"小人虽亦有赏，用之必乱邦\"**。**其理由很实**：**战时的\"能\"与平时的\"德\"不是一回事**（**战时需要敢拼，平时需要守规**）；**而\"持功而乱邦\"之所以多，是因为有功者往往自以为\"该得更多\"**。**须说明**：**\"小人\"是古代的道德判断，今天的对应是\"能力与操守不匹配\"**——**故这一条的现代读法是**：**奖励与授权分开处理；对\"业绩好但行为不端\"者，给报酬可以，给位置须慎**。","o":"TJ-0143 · 天纪·人间道·师卦·上爻（PDF 第30页）"},{"t":"五十六、前后（比卦同欲相憎）","h":"比与睽：一对相反的卦","c":"要点——比卦（亲附）与睽卦（相背）是一对，其判据就在\"两志相求\"四字上：**相求则比，不相求则睽**。**此二者的对读，可给出一份\"关系诊断表\"**：**①看是否有\"相求\"**（**双方是否都想靠近**）——**单方求者为睽**；**②看是否有\"辅\"**（**是否彼此有用**）——**只取不予者为睽**；**③看\"同欲\"还是\"同忧\"**（**争同一物则相憎，患同一难则相亲**）；**④看制度**（**有无使人\"有所依从\"的安排**）。**这四项与前章睽卦所记的\"四栏并置互相矛盾\"形成对照**：**睽卦的断语彼此打架，而比卦的这一组判据是连贯的**——**这也说明，同一套体系内，材料质量并不一致，须逐条判断。** **须说明**：**这四项是编者据原文推得的\"读法\"，不是原书所立**；**其用处在于把\"关系好不好\"这种模糊感受，换成四个可回答的问题。**","o":"TJ-0144 · 天纪·人间道·比卦（PDF 第31页）  ---"},{"t":"五十七、六爻上","h":"初爻：有孚盈缶——诚信是唯一门槛","c":"方法——初爻\"**有孚，比之无咎；有孚盈缶，终来有它，吉**\"。其解：\"**此为比之始。孚为中信，故相比之道，以诚信为本——表里不一致，人谁近之？诚信充实于内，如于缶中之满，且外不加修饰（'它'，外也），至诚以待之，则无不信。**\"其\"象\"：\"**比之初六，有它吉也**\"——\"**此即比之道在乎始也：始即能中实诚信，终吉；始无诚信，终凶。**\" **\"有孚盈缶\"这个取象极妙**：**诚信像装在瓦罐里的水，满到罐口**（**\"盈缶\"**），**而\"外不加修饰\"**——**不打蜡、不装饰、不包装**。**即：让人看到的是里面的实有多少，而不是外面的花纹**。**\"表里不一致，人谁近之\"这一句，把所有\"人设\"\"包装\"\"人脉经营\"都否掉了**。**而\"在乎始\"这一层更狠**：**关系的第一刻若不以诚，后面再补也补不回来**（**\"始无诚信，终凶\"**）。**须说明**：**这是《易经》原文（比卦初六）**；**其判断在现实中很常见**——**凡关系始于一时的场面与包装，通常也止于场面。**","o":"TJ-0145 · 天纪·人间道·比卦·初爻（PDF 第32页）"},{"t":"五十七、六爻上","h":"第二爻：\"比之自内\"——自重而后人比","c":"要点——第二爻\"**比之自内，贞吉**\"。其解有两层，第二层最锋利：\"**自内，言主之在己也；得正道而與君道相合，此吉也。即以中正之道，合于上位之所求，乃曰自内。今人汲汲以求比者，非君子自重之道，乃自失之道也。**\"其\"象\"补了一句更完整的说法：\"**坚守己中正之道，以待上求，乃不自失也。此易之戒——故士人修己，方求上进之道；降志辱身，此绝非自重之道。吾人救天下之心，并非不急切，乃因须待礼遇之至方出也。**\" **这一爻给出的是\"亲附\"的反面做法**：**\"汲汲以求比\"（急着去攀附）不是\"自重\"，而是\"自失\"**——*
