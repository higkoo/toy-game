*因为你在攀附的那一刻，已经把自己降成了\"求人者\"**。**而\"救天下之心并非不急切，乃因须待礼遇之至方出\"这一句，把\"待\"与\"不急\"分开了**：**不是不想做事，而是不肯以\"降志辱身\"的方式去做**。**须说明**：**这是《易经》的义理（\"比之自内\"）**；**其现代对应很直接**——**主动结交与攀附的区别，在于\"我带着什么去\"与\"我失去什么\"**；**\"待礼遇之至方出\"是否可行，取决于你手里有没有别人真需要的东西**（**若无，则\"待\"会变成\"等\"，这是须自行分辨之处**）。","o":"TJ-0146 · 天纪·人间道·比卦·第二爻（PDF 第32页）"},{"t":"五十七、六爻上","h":"第三、四爻：\"匪人\"与\"不可盲从\"","c":"风险——第三爻仅一句\"**比之匪人**\"，其解：\"**相亲比之人，如为不正当之人，即为匪人，招凶也。**\"其\"象\"：\"**比之匪人，不亦伤乎**\"——\"**相亲于匪人，必将得悔咎，伤之大矣；君子须深戒所亲比之人。**\" **这一爻没有给\"补救办法\"，只有一个结论：所亲非人，必伤。** **第四爻\"外比之，贞吉\"**，其解：\"**六四之位，为近君之位。居此位之人，以柔性坤德向君主亲比，且坚心顺从，吉也。**\"其\"象\"补一警示：\"**六四之位从于五君之位，为外比；因五位刚明之贤为中正，故附从之——此从上之道，绝不可盲从。**\" **这两爻合读，是一份\"择所亲\"的双向检查**：**向下看——所亲者是否\"匪人\"（不正当）；向上看——所从者是否\"刚明中正\"**。**\"绝不可盲从\"五个字，正是给\"外比\"（依附于上）加的条件**：**依附的是\"贤\"，才叫\"外比\"；依附的是\"势\"，就叫盲从**。**须说明**：**\"匪人\"是古代的道德判断，现代读法宜落在\"行为\"而非\"身份\"**——**看对方是否以不正当的方式行事，而不是看其出身；而\"不可盲从\"的判断标准，是其主张是否经得起检验。**","o":"TJ-0147 · 天纪·人间道·比卦·第三、四爻（PDF 第32页）"},{"t":"五十八、六爻下","h":"第五爻：\"王用三驱，失前禽\"——全书最好的一条人际原则","c":"方法——第五爻\"**显比，王用三驱，失前禽，邑人不诫，吉**\"，是比卦最长、也最完整的一条，其解可分四段。**①正面**：\"**人君亲比天下之道，须诚意以待物，恕己以及人，发政施仁；民之所好好之，民之所恶恶之，为民图利，使天下蒙其泽，此尽善也。**\"**②反面**：\"**如表彰己之小功，展示自己的权力，违反道德人心，强力施为，致人心不信，社会浮华……如此而求天下亲比是不可能的。**\"**③取象**：\"**就好比君王出猎，只围三面、开一面，禽兽前去者免矣——此曰'失前禽'，只取来者，此王道也。**\"（**象曰\"舍逆取顺，失前禽也\"**）。**④落地**（此段最可直接用）：\"**臣之效于君，竭尽忠诚、用尽才能，以彰显亲君之道，此为正道；至于用之与否，决定在君，万不可阿谀奉承，妄求君之亲比。朋友亦然——须修身诚意待人；至于是否愿意与己相亲，在人而已；千万不可巧言令色、曲从苟合，以求人之相比。此'显比'之道。**\" **其象辞又引孟子一句作结**：\"**孟子收徒之道：往者不追，来者不拒也。**\" **这一条给出的原则可概括为一句话**：**我尽我的诚意与才能，来去由你**——**\"往者不追，来者不拒\"**。**这是全书关于人际关系最完整的一个立场**：**既不经营（\"不可巧言令色以求相比\"），也不强留（\"失前禽\"），也不拒绝（\"只取来者\"）**。**须说明**：**\"王用三驱\"（围三面留一面）在历史上确有\"网开一面\"的仁德之义**；**而\"失前禽\"的现代读法是\"放走那部分本就不属于你的人，这是设计的一部分，不是损失\"**。","o":"TJ-0148 · 天纪·人间道·比卦·第五爻（PDF 第32页）"},{"t":"五十八、六爻下","h":"上爻：\"比之无首\"——始不以道，终必有隙","c":"风险——上爻\"**比之无首，凶**\"。其解：\"**上六乃比之终极处。凡比之首，其始善，终亦必善矣。多数人皆有其始，而无其终；但从未有人没有开始，而有终善也。故此言'比之无首'（首，始也），至终必凶矣。今天下之人，始亲和比之时不以正道，至终必有隔阂——此类人居多数。**\"其\"象\"：\"**比之无首，无所终也**\"——\"**此即始不以道，则至终必凶矣。是故交友之道，你来我往；你不来，我何往？如我往，必有求，须以正；否则终将隔隙，互相仇视也。**\" **这一爻判的是\"关系没有正经开头\"**：**\"无首\"即无始、无正当的开端**——**其结局必然是\"隔阂\"与\"仇视\"**。**\"多数人皆有其始，而无其终；但从未有人没有开始而有终善也\"这两句，是全卦最耐读的地方**：**它承认\"有始无终\"是常态，同时坚持\"没有开端就不可能有好的结局\"**——**故问题不在\"能不能长久\"，而在\"开头正不正\"**。**而\"你来我往；你不来，我何往？如我往，必有求，须以正\"这一段，把\"往来\"讲成了一门精算**：**每一次主动都有\"求\"，求必须\"以正\"，否则就是埋下仇视的种子**。**须说明**：**这一条与第五爻\"往者不追\"看似矛盾**（**一说不追，一说往来**）；**实为互补**——**第五爻讲\"不强求\"，此爻讲\"开头须正、往来须有据\"。**","o":"TJ-0149 · 天纪·人间道·比卦·上爻（PDF 第33页）"},{"t":"五十九、象","h":"\"先王以建万国，亲诸侯\"","c":"要点——比卦\"象\"为\"**地上有水，比；先王以建万国，亲诸侯**\"，其解：\"**天地之间，物相亲比，莫如水在地上；圣人观比之象，以此建万国、亲诸侯、亲近人民，此比之极道。**\" **这一句把\"亲比\"从个人关系放大到了制度层面**：**\"建万国\"（分封）与\"亲诸侯\"（维持联系）是同一件事的两面**——**先分立，再亲近**。**这与前章\"好的制度能使人有所依从，故能互相亲和\"完全一致**：**亲和不靠感情，靠结构**（**有清晰的分立，才有稳定的亲近**）。**须说明**：**\"建万国、亲诸侯\"是周代封建制的表述**；**其现代对应不是\"分封\"，而是\"清晰的组织边界＋稳定的联络机制\"**——**边界不清的组织，亲和只存在于表面，一旦利益相冲立刻成睽。** **本集把这一条与师卦\"容民畜众\"并置，作为这一组卦（讼—师—比）的收束**：**争讼起于相违（讼）→ 不得已而动众（师）→ 动众之后须有亲比（比）→ 亲比须以诚信与制度为基（初爻与象）**。**这四卦连起来，恰好是一套\"从冲突到秩序\"的完整路径。**","o":"TJ-0150 · 天纪·人间道·比卦（PDF 第32页）  ---"},{"t":"六十、卦象（小畜密云不雨）","h":"匣藏宝剑：小畜卦的五物","c":"方法——小畜卦（风天小畜）为\"**匣藏宝剑之课，密云不雨之象**\"，其五物取义：**①\"两重山：知有险阻于前，不妄动之象（亦为'出'字象）\"**；**②\"一人山顶：孤立独行象；已至巅峰，将走下坡之意\"**；**③\"舟横岸上：准备出发，水未至而不行也\"**；**④\"望竿在草里：等待消息象（草头姓人为贵人；'望'，亡也）\"**；**⑤\"上有羊马：马引羊过河——马为贵人，肖马人、姓马人也，马亦为午时\"**。其总断：\"**一人在顶颠，但有疑，前有二山所阻，只有等待消息；午年、或午月、午日、午时，或马人引羊至，不由水路而来也。**\" **这一卦的五物几乎全是\"未动\"的状态**：**山阻于前、舟横在岸、竿在草里等消息、人立在顶上却有疑**。**其中两句最可味**：**\"舟横岸上＝准备出发，水未至而不行\"**——**一切都备好了，只差条件**（**这不是拖延，是\"水未至\"**）；**\"一人山顶＝已至巅峰，将走下坡\"**——**这是全书少见的\"提醒你正处在高点\"的取象**（**处在顶上的人，最该想的是\"下来时怎么办\"**）。**须说明**：\"马为贵人、肖马人、姓马人、午时\"一类的断法属象数附会；**其开篇占例（韩信击散关不破，卜得之后再击果破）仍是\"事后叙事\"**（**见讼卦末条**）。**但\"水未至而不行\"\"已至巅峰将走下坡\"这两条，是可独立成立的观察。**","o":"TJ-0151 · 天纪·人间道·小畜卦（PDF 第35页）"},{"t":"六十、卦象（小畜密云不雨）","h":"亲和之后必有所畜","c":"要点——小畜卦居比卦之后，其讲义把这层因果写成了\"聚\"的道理：\"**比乃亲和，亲和之后必有所畜——因物相比亲则附于一处，为畜；此畜者，聚之来源也。同相亲和之人，其志必同畜。畜亦止也，止然后有聚。**\" **这三句合起来是一个\"聚集如何发生\"的解释**：**①亲和产生依附**（**关系近了，就会往一处靠**）；**②依附形成聚集**（**\"畜\"的原义是蓄聚**）；**③而\"畜\"同时是\"止\"**——**\"止然后有聚\"**（**聚的前提是先停下来**）。**\"止\"这一层很关键**：**聚不是\"越多越好\"，而是\"先有一个能停住的地方\"**；**没有\"止\"，人到一处也只是散沙**。**须说明**：**这是《易经》的义理（《序卦》\"比必有所畜，故受之以小畜\"）**；**其现实对应很直接**：**一群人之所以成\"组织\"，不在于人多，而在于有一个能停住他们的\"止\"**（**共同的目标、规矩、场所或利益**）——**若无此\"止\"，亲和也聚不久。**","o":"TJ-0152 · 天纪·人间道·小畜卦（PDF 第35页）"},{"t":"六十、卦象（小畜密云不雨）","h":"\"再刚健之事与人，必为巽顺所止\"","c":"定义——小畜卦的卦体解释，是全书对\"柔能制刚\"最完整的一段：\"**此体本乾为天，乃在上之体，今居风之下，示意吾人如要聚止刚健之人，唯有巽顺为大——故世间再刚健之事与人，必为巽顺所止也。本卦一阴居第四位，为五阳所包，此得位乃因柔巽之道也。卦象'外柔内刚'，乃能以小畜大。**\" **这段话有三层，每层都可独立成立**：**①\"乾居风下\"**——**天（最刚健者）在风（最柔顺者）之下**，**这是卦体的安排，也是全卦的立义**；**②\"世间再刚健之事与人，必为巽顺所止\"**——**再强的人与事，最终都是被\"柔顺\"止住的**（**不是被更强的力量压倒，而是被持续的迂回消解**）；**③\"一阴居第四位，为五阳所包……外柔内刚，乃能以小畜大\"**——**一个柔顺的位置，包在五个刚健者之中，反而能\"以小畜大\"**。**须说明**：**这是《易经》原文的义理（\"柔得位而上下应之\"）**；**其解释力在现实中反复出现**——**硬碰硬时两败，而以柔韧持久的姿态，往往能耗过刚强的一方**；**但须分清\"巽顺\"与\"软弱\"**：**巽顺是\"外柔内刚\"（内有主张，外不强争）**，**软弱是\"内外皆无\"**——**前者能\"畜大\"，后者只会被吞。**","o":"TJ-0153 · 天纪·人间道·小畜卦（PDF 第35页）"},{"t":"六十一、卦辞（小畜密云不雨）","h":"\"密云不雨，自我西郊\"","c":"风险——小畜卦辞\"**小畜，亨。密云不雨，自我西郊**\"，其解有两层，都是\"不满\"之意。**①直解**：\"**此言云之畜聚虽密，却不能成雨——犹人虽聚，却不能和之义。**\" **②机理**：\"**此言密云不能成雨，犹小畜无法成大也，其因下阳往上、上阳往下，二气不和。**\" **而彖中又补了一层\"只能维系\"**：\"**小畜之卦，因第四爻阴，居近君主之位，以巽之柔顺本性，使上下之阳刚相互沟通——但只能维系，却不能强固，故曰小畜。**\" **这三处合起来，是小畜卦的核心判断**：**云聚得很密（人聚得很齐），但下不成雨（成不了事）**；**原因是\"二气不和\"（上下背向而行）**；**而\"柔顺\"在这里的作用只是\"维系\"（把上下勉强沟通着），\"不能强固\"**。**须说明**：**\"密云不雨\"是本册第二次遇到这个意象**（**需卦为\"密云不雨之象\"，此处亦然**）——**两卦同为\"密云不雨\"，但义不同**：**需卦是\"才德已具而未得其用，故须养\"**（**等待是对的**）；**小畜是\"人虽聚而不能和，故只能维系\"**（**聚而无效**）。**这一对照说明：同一个意象，在不同卦位上是两种处境——读者不宜按\"象\"直接套结论。**","o":"TJ-0154 · 天纪·人间道·小畜卦（PDF 第35页）"},{"t":"六十二、象与爻","h":"\"君子以懿文德\"：蓄什么","c":"方法——小畜卦\"象\"为\"**风行天上，小畜，君子以懿文德**\"，其解：\"**以乾之刚健，风仍能在上而行，故刚健之性，唯柔顺能畜止之。君子以小则文章才艺，大则道德经纶之圣才，以此二道为所畜之才义。**\" **这一句回答了\"小畜该蓄什么\"**：**不是钱粮、不是人脉，而是\"文德\"**——**小则文章才艺，大则道德经纶**。**其理由在于\"小畜\"的处境**：**当你力量尚小、只能\"维系\"时，唯一能真正蓄起来的是\"自身的才与德\"**（**因为这是不会被外力夺走的东西**）。**这与需卦\"君子以饮食宴乐\"（养身养心）、坤卦\"厚德载物\"构成一组**：**三卦都在讲\"未得志时该做什么\"**——**需卦养身，小畜蓄文德，坤卦厚德**。**须说明**：**这是《易经》原文（小畜大象）**；**其现代对应是\"在不能做大事的阶段，把可积累的东西积累起来\"**——**技能与声誉是这一阶段唯一复利的东西**。**而\"懿\"字（美、修）提示它是个主动动作**：**不是\"自然就有\"，是\"修\"出来的。**","o":"TJ-0155 · 天纪·人间道·小畜卦（PDF 第35~36页）"},{"t":"六十二、象与爻","h":"初、二爻：\"复自道\"与\"牵复\"","c":"要点——小畜前两爻皆吉，其解都落在\"同气相应\"上。**初爻\"复自道，何其咎，吉\"**：\"**初入之地为初爻，以其刚健之性，又得上位之同性，进必上，何来灾也？故初之阳刚，乃因上位之阳刚性同，故无灾也。**\"其\"象\"：\"**初爻与第四爻本为对应之位，故在畜时，阴在四、阳在初，阴阳相应，故吉。**\" **第二爻\"牵复，吉\"**：\"**九二居将位，因与第五爻阳爻相对应，同为刚健；虽中有四爻，但因同为阳刚，自古'同患相忧'（同欲相憎），吉之道，此时为将时。**\"其\"象\"：\"**初爻为阳刚，复二爻亦阳刚，其势乃强；但因此时乃居中位、将位，故即强亦不会过刚。**\" **这两爻的方法意义在于\"相应\"与\"不过刚\"**：**初爻因\"上位同性\"而无灾**（**即：处在有同类支撑的位置，进而不险**）；**第二爻因\"居中位\"而\"即强亦不会过刚\"**（**即：位置本身能约束力量**）。**而第二爻解中\"自古'同患相忧'（同欲相憎）\"一句，与比卦所引《战国策》\"同欲相憎，同忧相亲\"完全同源**——**同一句话在两卦中被用来解释\"为何阳与阳能相牵\"**（**因同为刚健者，处境相同，故能相忧相助**）。**须说明**：**这是《易经》的爻位义理，\"相应\"\"得中\"是其核心概念**；**其现代读法可简化为两条**：**有同类支撑则敢进；身处中位则力量自受约束**——**这两条不必信卦，也能用。**","o":"TJ-0156 · 天纪·人间道·小畜卦·初、二爻（PDF 第36页）  ---"},{"t":"六十三、反制","h":"第三爻：\"夫妻反目\"——被反制者必先自失其道","c":"要点——第三爻\"**舆说辐，夫妻反目**\"（说＝脱）。其解：\"**九三为下卦之上爻，最亲密于四爻阴位，故乃阴阳之情相处也，犹如夫妻。阴本受制于阳，今居四位、居阳之上，即反制阳——如夫妻之反目，故如车舆脱去轮轴，不能行也。妻为夫所惑，反制于夫，乃因夫不正道。未有夫不失道，而妻能制之也。**\"其\"象\"：\"**因阳刚位之夫，过刚而失自处之道，不能顾家室，以致夫妻反目。故为夫之道，须正室其家，方为正道。**\" **这一爻最锋利的一句是\"未有夫不失道，而妻能制之也\"**——**即：被反制的一方，必先自己\"失道\"**。**这个判断可以整个地从\"夫妻\"抽出来**：**任何\"下克上\"\"弱制强\"的局面，其成因几乎都在上面那一方的\"失道\"**（**过刚、失自处之道、不顾全局**）——**而不是下面的\"野心\"**。**\"舆脱去轮轴，不能行\"这个取象也准**：**车轴一脱，整辆车（关系）就走不动了**——**反目不是\"感情问题\"，是\"结构已经无法运转\"**。**须说明**：**这是《易经》的义理（小畜九三）**；**其对\"家庭\"的表述是古代纲常语境，\"妻制夫\"的说法今天不宜照搬**——**但\"被反制者必先自失其道\"这一条，在家庭、组织、上下级关系中都成立，且是自我检视的利器**：**遇到\"管不住\"的局面，先问自己哪里失了道。**","o":"TJ-0157 · 天纪·人间道·小畜卦·第三爻（PDF 第36页）"},{"t":"六十三、反制","h":"第四爻：\"血去惕出\"——以诚信与外柔化解上位之欲","c":"方法——第四爻\"**有孚，血去惕出，无咎**\"。其解：\"**六四乃处近君之位；其能畜君，使五位君之威严能因之而止其欲，皆因六四有孚信（孚，乃内有诚信也）而受其感也。**\"其\"象\"：\"**因四位有诚信且外柔，使五之君位信任之，乃合同志；五因四位之人能与之合，众阳从之，故惕出则血去，不见兵祸矣。**\" **这一爻讲的是\"在强势者身边如何起作用\"**：**其办法不是对抗，而是\"内有诚信＋外柔\"**——**因被信任，故能\"止其欲\"（使上位者收敛）**；**而结果是\"血去惕出\"**（**血＝伤害，惕＝戒惧；即伤害消解、戒惧解除**）。**这与比卦\"外险内顺\"、小畜\"外柔内刚\"是同一套方法的三次出现**：**在不占优势的位置上，起作用的方式是\"被信任\"而非\"被服从\"**。**须说明**：**这是《易经》的爻位义理**；**其现代的对应很实用**：**在强势的领导或强势的合作方身边，唯一能真正影响决策的，是\"他信你\"**——**而\"信\"的来源是\"内有诚信、外不强争\"，不是能力展示。** **这一条的限度也须说清**：**\"止其欲\"只在上位者愿意被劝时才有效**（**若对方根本不听，则此爻之法失效，须另作打算**）。","o":"TJ-0158 · 天纪·人间道·小畜卦·第四爻（PDF 第36页）"},{"t":"六十三、反制","h":"第五爻：\"富以其邻\"——艰危时唯至诚能得众力","c":"方法——第五爻\"**有孚挛如，富以其邻**\"。其解先定位处境：\"**小畜之时，乃众阳皆为其中一阴所畜之时；犹如一国之君，与臣下皆刚而不容（密云不雨），但近君侧之人，适得柔顺之人，而此人为上下沟通之管道——此时乃即小畜之时也。**\" 再解\"富以其邻\"：\"**九五为君位，如以中正居至尊之位，又内有诚信，则所有皆附应之——就好像富人出其财力与邻共享之也。**\" **而其\"用\"写在最后，也最重**：\"**从此爻则知：当君子为小人所困、正人为艰邪所逼，此时如无上下正阳之互援，则独力难助——须有互助方可去小人也。**\"其\"象\"：\"**是故君子处之艰危，唯其至诚，能得众力之助，则平安矣（挛如即牵连使相从）。**\" **这一条把\"共享\"讲成了一种能力**：**\"富以其邻\"不是慈善，是\"把自己的资源与邻共享，从而在艰危时得到互援\"**——**其判词是\"独力难助\"**（**孤立者，再强也救不了自己**）。**\"唯其至诚，能得众力之助\"一句，把\"至诚\"与\"得助\"直接连上**：**不是靠交换、不是靠许诺，而是靠\"至诚\"让人愿意来援**。**须说明**：**这是《易经》的义理（小畜九五）**；**其判断在现代同样成立**——**危机时刻真正能动员的，是长期\"共享\"积累下的关系，而不是临时求助**（**这与比卦\"平时不往来、出事才求人\"正反相照**）。","o":"TJ-0159 · 天纪·人间道·小畜卦·第五爻（PDF 第36页）"},{"t":"六十四、限度","h":"上爻：\"妇贞厉……君子征凶\"——柔不可过","c":"风险——上爻\"**既雨既处，尚德载，妇贞厉；月几望，君子征凶**\"。其解是全书对\"柔制刚\"最关键的限度说明：\"**上九为此卦之终极，乃处畜之终。和而能止，乃畜之道；阴柔之能畜刚，由累积而成，非朝夕可得，此戒之在平时。如专任以柔制刚，不知止，如妇之坚守此道，则乃凶矣——天下无妇制其夫、臣制其君，尚能安稳者乎？月满之时为月望，与日相敌状；若君子待妇将成敌时，动之必凶，不须戒也，故须戒之于月未满时。**\" 其\"象\"再补：\"**此小畜之道积满而成，其象为阴将盛样，君子动则有凶也。小人抗君子，必有害于君子；制阴极盛之道，则为君子有疑而知警惕，不妄动，求其所以制君子之因，则不至凶也。**\" **这一爻是整个小畜卦的收口，也修正了本章前面的说法**：**\"再刚健之事与人必为巽顺所止\"是对的，但\"止\"有其限度**——**\"专任以柔制刚、不知止\"，其结局是凶**。**其判词\"天下无妇制其夫、臣制其君，尚能安稳者乎\"，说的就是\"柔可以维系、可以制约，但不能真正取代刚的位置\"**。**而\"须戒之于月未满时\"这一句极妙**：**要防的是\"柔将成敌\"的那一刻，而不是已经成敌之后**——**即：在力量对比尚未倒转时就要处置，等到\"月望\"（势均力敌）就晚了**。**须说明**：**\"妇制夫、臣制君\"的表述是古代纲常语境，本集不取其性别与等级判断**；**但抽出来的机制是可用的**：**任何\"以柔控刚\"的安排，都须预设退出与让渡的时点**——**否则柔的一方一旦习惯了控制，就会走到\"月望\"而两败。** **这也解释了上爻为何是\"凶\"而不是\"吉\"：不是柔顺不好，是\"过\"了。**","o":"TJ-0160 · 天纪·人间道·小畜卦·上爻（PDF 第36页）"},{"t":"六十五、转向","h":"履卦的出现：从\"蓄\"到\"履\"","c":"要点——小畜之后是履卦（天泽履），讲义开篇即记其占例：\"**此卦子路出行，卜得之，遇虎拔其尾也。**\" 并列出卦图：**\"笠子下一女，文书破，手中有伞，军旗，官人边坐，堠上有千里字，地上两点足印。\"** **这两卦的接续关系，从卦名即可看出**：**小畜是\"蓄止\"（把力量聚住、止住），履是\"践行\"（踏上去、走出去）**——**蓄够了才谈得上去走**；**而\"履\"的核心意象就是\"履虎尾\"**（**踩到老虎尾巴上**）：**即：以柔顺之道去接触最凶险的对象**。**这与小畜的\"以柔畜刚\"是同一套方法的下一步**：**从\"止住刚强\"到\"与刚强同行\"**。**须说明**：**此处只作两卦衔接的交代**（**履卦的完整注解在扫描件下一段，本集另章处理**）；**而\"子路出行遇虎拔其尾\"这一占例，仍属\"事后叙事\"**（**见讼卦末条**）——**其价值是让人看到古人是如何把\"出行遇险\"这样的事装进卦里的**。**本集在小畜这一章收在此处，是为了提示读者：六十四卦是一条链，\"蓄\"之后必是\"行\"，\"行\"之后又必是\"通\"（泰）或\"塞\"（否）**——**单看一卦，只看得到一半。**","o":"TJ-0161 · 天纪·人间道·小畜卦（PDF 第36~37页）；履卦（PDF 第37页）  ---"},{"t":"六十六、卦象（履卦履虎尾）","h":"履虎尾：从\"畜\"到\"礼\"","c":"定义——履卦（天泽履）为\"**如履虎尾之课，安中防危之象**\"，其卦序之义：\"**天地间万物由畜道而止之后，有礼生焉；履者，礼也，故畜之后为履。所有物之聚大小不同、高下不等、有美恶之分，是故物聚后必有礼。人到何处，必有礼也。**\" **这两句给出了\"礼\"的起源**：**不是圣人设计的，而是\"聚\"的必然结果**——**物一聚，就有大小、高下、美恶之分；有差别，就需要一套\"怎么相处\"的规矩，这就是礼**。**其卦体之解更精**：\"**卦体天在上，泽在下，上下区分，尊卑立见，此理所当然也。此以柔藉刚，谦卑而顺，说礼之道也。泽有卑顺之意，卦象'外健内卑'，礼之本也。**\" **\"外健内卑\"四字，是这一卦的立义**：**在外能立得住（健），在内不踞高（卑）**——**这与通常理解的\"礼\"（等级压人）正好相反**：**礼的本义是\"以柔藉刚\"（用柔顺去承接刚强），不是\"以强凌弱\"**。**须说明**：**\"天在上、泽在下\"是古代等级秩序的自然化表述**；**本集取其\"外健内卑＝礼之本\"\"有差别才需礼\"的结构义**，**不取其尊卑贵贱的具体内容**（**见后条对其\"辩上下\"的辨析**）。","o":"TJ-0162 · 天纪·人间道·履卦（PDF 第37页）"},{"t":"六十六、卦象（履卦履虎尾）","h":"卦辞\"不咥人\"与卦图的六个取义","c":"方法——履卦辞\"**履虎尾，不咥人，亨**\"，其解极简而妙：\"**有礼之道即入险中，如践虎尾，不见其反食人，乃因有礼也，所以亨也。故常言'伸手不打笑脸人'，同此。**\" **即：踩到老虎尾巴（身处极险）而不被咬，唯一的原因是\"礼\"**——**而它给了一句民间话作注：\"伸手不打笑脸人\"**。**卦图六物各有取义**：**①\"女人在笠下：妾也\"**；**②\"千里堠：远离外出封侯象\"**；**③\"文书破在地：凭证承诺无效象\"**；**④\"伞下：有庇荫也\"**；**⑤\"军旗下官人坐：主有官司、诉讼、牢狱之灾象\"**；**⑥\"二点在地：践踏之足印也——示人处危之时，有礼之道，乃能行危而无殃也\"**。**其中第六物与卦辞互为注解**：**地上两点足印，正是\"践\"（踩踏）的痕迹**——**即：危险的痕迹就在脚下，而人仍能走过去**。**而第三物\"文书破在地＝凭证承诺无效\"值得单记**：**这是履卦（礼）的负面条件**——**若凭据已毁，则\"礼\"所依赖的秩序就断了**。**须说明**：\"妾\"\"封侯\"\"牢狱之灾\"一类的断法属象数附会；**\"二点在地\"\"文书破\"这两个取象则是可理解的象征**。","o":"TJ-0163 · 天纪·人间道·履卦（PDF 第37页）"},{"t":"六十七、象","h":"\"辩上下，定民志\"：法治的简与繁","c":"风险——履卦\"象\"为\"**上天下泽，履；君子以辩上下，定民志**\"，其解是全书最长的一段政论，其中一句今日读来仍极锋利：\"**君子观履象，以辨上下之区分，来立民志；民因上下区分明显而志定，自此乃可言治。立法复杂，民无所从，治世将不再。**\" **\"立法复杂，民无所从，治世将不再\"这十三字，是对\"多法而难治\"最简洁的判断**——**即：治理的成败不在\"法条多少\"，而在\"百姓能不能照着做\"**；**规矩若复杂到无人能懂，它就失去了治理的功能**。**其后是对\"安其位\"的具体论**：\"**是故人各安其位，此得其分内也；如占位又不进德，除之，由君子进任；士人进修学识，到一定程度而君子求之。士农工商各行业之人，因所享有限，而能有定志，则天下之心也。**\" **其中\"如占位又不进德，除之\"一句极硬**：**占着位置而不长进，就该撤换**——**这是把\"位\"与\"德\"绑定，而不是与\"资历\"绑定**。**须说明**：**\"辩上下、定民志\"在现代不宜读作\"等级固化\"**——**其可取的核是\"规则要清楚、人要各得其所\"，而不是\"上下不可越\"**；**而\"占位不进德，除之\"这一条，恰恰是对\"固化\"的反制**。","o":"TJ-0164 · 天纪·人间道·履卦（PDF 第37页）"},{"t":"六十七、象","h":"\"亿兆之心交相为利\"","c":"要点——承接上条，其对\"当下\"的批评写得极狠：\"**今人自下至公卿，日所志为尊荣；农工商人，日思于富侈；亿兆之心交相为利，天下皆如此，心如何一致？要它不乱也难矣！皆因上下无定其志也。**\" **这一段的结构很清晰**：**自上而下，所有人追的是同一种东西**——**上位者求\"尊荣\"，下位者求\"富侈\"**，**而两者其实是同一件事（都是\"比别人高\"）**；**\"亿兆之心交相为利\"，即所有人的心都朝\"利\"这一个方向**。**其判断极准**：**\"心如何一致？\"**——**当所有人争的是同一物，就不可能有共同的方向**；**而\"要它不乱也难矣\"是结论**。**而\"皆因上下无定其志也\"把它归到了\"志\"上**：**不是法不够、不是资源不足，而是\"志\"没有定**。**须说明**：**这是古代的政论，其批评的对象是他所处的时代**；**但它与本章前条\"定民志\"构成一组因果**：**\"志定\"的前提是\"位分清楚且各得其分\"**；**若所有人都被引向同一个\"尊荣／富侈\"，则\"志\"必乱**。**本集记录它，是因为这一观察的解释力跨越时代**——**它说的不是\"人心不古\"，而是\"激励结构单一，则众人争一物，秩序必坏\"。**","o":"TJ-0165 · 天纪·人间道·履卦（PDF 第37~38页）"},{"t":"六十八、爻（履卦履虎尾）","h":"第三爻：\"眇能视，跛能履\"——才不足而志刚","c":"风险——第三爻\"**眇能视，跛能履，履虎尾，咥人凶；武人为于大君**\"，是全卦最凶的一爻。其解：\"**三为阳位，柔居之，乃志欲刚而体本柔，不能坚心为履道。就如盲人之视而不见、跛人行路而不远——意乃才能不足，又处时之不顺遂，则礼道非正，乃履于危地；因不善履道，入危地召凶，祸患立至，故'咥人凶'。就如武暴之人却居人上，又任意为之，不知礼，乃凶之道。**\" 其\"象\"：\"**眇能视，不足以明也；跛能履，不足以与行也**\"；\"**咥人之凶，位不当也；武人为于大君，志刚也**\"——\"**此凶之致，乃因才不足；以武人为喻，其居阳刚之位，但才不足，又强出之，则所履不由本道，属于志刚又妄动。**\" **这一爻给出了一个精确的\"失败画像\"**：**\"志欲刚而体本柔\"**——**心里想硬，身板是软的**；**而\"眇能视、跛能履\"两个比喻的意思是\"看得见却看不清、走得动却走不远\"**——**即：有一点能力，但不够**。**其结论是\"才不足，又强出之\"**——**问题不在\"没能力\"，而在\"能力不足却偏要出头\"**。**这与师卦\"舆尸\"、讼卦\"险而健\"合成一组**：**三卦都在讲\"错配\"**——**位置超过了能力**。**须说明**：**\"武人为于大君\"是古代的比喻**；**其现代对应极直接**：**升到不该升的位置、接了接不住的项目、摆出撑不住的姿态，都会走到这一爻。**","o":"TJ-0166 · 天纪·人间道·履卦·第三爻（PDF 第38页）"},{"t":"六十八、爻（履卦履虎尾）","h":"第四爻：\"愬愬终吉\"——伴君如伴虎","c":"方法——第四爻\"**履虎尾，愬愬，终吉**\"。其解：\"**在近君之侧，知伴君如伴虎；愬愬，畏惧之貌——意如能畏惧，则终必吉。上位之阳刚，虽近处，能敬慎畏惧，即入危地终亦必吉也。**\" **\"伴君如伴虎\"一语的出处脉络，正在这一爻**：**位置离权力最近（近君之侧），而权力本身如虎**；**其解法只有一个字——\"愬愬\"（畏惧之貌）**。**即：身处极近的危险，唯一安全的态度是\"知道自己随时可能被咬\"**。**这是全卦最实用的一条**：**它不是教人\"如何讨好上级\"，而是教人\"保持畏惧\"**——**因为危险的来源不是\"对方会不会咬\"，而是\"你忘了它在\"。** **须说明**：**\"上位之阳刚\"是爻位术语，现代可读作\"掌握你命运的力量\"**；**其适用不限君臣**——**与大客户、与强势合作方、与不可控的风险共处，都同此理**：**敬慎畏慎，反而能久**。","o":"TJ-0167 · 天纪·人间道·履卦·第四爻（PDF 第38页）"},{"t":"六十八、爻（履卦履虎尾）","h":"初、二爻：素履与幽人","c":"要点——履卦前两爻讲的是\"内在条件\"，与第三爻恰成对照。**初爻\"素履往，无咎\"**：\"**初处于下，阳刚之才可以进，但外则表现其卑下之位的素养，无咎。**\"其\"象\"：\"**素履之往，独行愿也**\"——\"**安于有礼之往，因非为利也，乃各有其志也。如人有行道之心，又有名利之心，交战于中，岂能安履？**\" **第二爻\"履道坦坦，幽人贞吉\"**：\"**二为阴位，阳居，即意其待人之礼坦荡荡、平易之道也……是以安幽清静之心情处此时，则吉。**\"其\"象\"：\"**履之道（礼之道）在于安静：其因正则所履安也；心中躁动，则不能安于礼道——此即有礼于人，必以心中安静；如以利欲交争于心中，必自乱。**\" **这两爻合起来，给\"能行礼\"提了两个前提**：**①\"非为利\"**——**若行道之心与名利之心交战，则\"不能安履\"**；**②\"心中安静\"**——**\"礼之道在于安静\"，躁动之人连礼都行不实**。**这与前条\"亿兆之心交相为利\"恰好呼应**：**当所有人以利为志，礼就只剩形式**。**须说明**：**\"素履\"（素＝质朴、无饰）与\"幽人\"（幽静之人）都不是\"低调做人\"的技巧，而是\"心不争利\"的状态**；**本集把它列为方法，是因为它给出了一个可自查的标准**：**行礼之时，我在求什么？**","o":"TJ-0168 · 天纪·人间道·履卦·初、二爻（PDF 第38页）  ---"},{"t":"六十九、履之终","h":"九五：\"夬履贞厉\"——即行正亦危","c":"风险——履卦九五\"**夬履，贞厉**\"。其解：\"**夬乃刚决之意。九五虽示君位之人，居此位，任意刚决而行之，即得正，仍危厉也。古之圣人，居天下之尊，仍纳众言，明足以照，刚足以决，必以明而动，动则志刚，此之所以为圣也——若自以为刚明、决行不顾，即使行正，亦属危道也。**\"其\"象\"：\"**居正当之尊位，须戒刚决自任，否则招凶。**\" **这一爻的判断极难**：**\"即使行正，亦属危道\"**——**即：独断这件事本身是危险的，与决定对不对无关**。**而其给出的\"圣人样本\"也极准**：**\"明足以照，刚足以决，必以明而动\"**——**看得清（明）、下得了决心（刚），但必须\"以明而动\"（先看清再动，且要纳众言）**；**\"若自以为刚明\"则是另一回事**——**自以为看得清，就不再看、不再听，此时即使方向正确，也已在危道上**。**这一条与师卦\"师或舆尸\"（多头则凶）看似冲突，其实互补**：**决策权要归一人（师卦），但那一人不可\"刚决自任\"（履卦）**——**即：权归一人，而信息与意见必须开放**。**须说明**：**这是《易经》的义理（履九五）**；**其现实对应极明确**：**\"独断\"的错不在果断，而在\"不再接收信息\"**。","o":"TJ-0169 · 天纪·人间道·履卦·第五爻（PDF 第38页）"},{"t":"六十九、履之终","h":"上九：\"视履考祥\"——始终如一才是礼","c":"要点——履卦上九\"**视履考祥，其旋元吉**\"。其解：\"**人之礼，须视其终；若始终完备，善之至也。今人浅视人之表面礼遇，而不考证其始终——礼之至善，其'始终如一'方是。**\"其\"象\"：\"**人之所以履善终能吉，贵乎有终，始终如一，礼之至极也。**\" **这一爻给了\"怎么评价一个人\"的标准**：**\"视其终\"\"考其始终\"**——**看表面礼遇不算，要看从头到尾是否一致**。**\"今人浅视人之表面礼遇，而不考证其始终\"这一句批评极准**：**人们常被\"当下的态度好\"打动，却不问\"他在别处、在从前、在利益变化之后，是不是也这样\"**。**须说明**：**这是《易经》原文（履上九）**；**其方法可直用**：**判断人品的有效指标不是\"此刻对我多好\"，而是\"在时间与境遇变化中是否一致\"**——**这也是本集反复出现的读法**（**比卦\"比之道在乎始\"、讼卦\"作事谋始\"、此爻\"考其始终\"，三处合起来是\"始—中—终\"的完整考察**）。","o":"TJ-0170 · 天纪·人间道·履卦·上爻（PDF 第38页）"},{"t":"七十、泰之象","h":"履之后则有泰：外柔内健","c":"定义——泰卦（地天泰）为\"**天地交泰之课，小往大来之象**\"，其卦序之义：\"**履之后（有礼而始终如一）则有泰——即履得其所，则舒泰而安也，故泰所以次履也。**\" **这一句把\"礼\"与\"安\"接上了**：**礼行得其所（各得其分、始终如一），结果就是泰（舒泰而安）**。**其卦体：\"坤柔在上，乾阳居下，乃天地阴阳之气相交合，万物生成，故表通泰状。卦象外柔内健，此为致泰之道。\"** **这里有一个极妙的对照**：**履卦是\"外健内卑\"，泰卦是\"外柔内健\"**——**两卦的\"外\"与\"内\"恰好互换**：**履是\"对外立得住、内心谦卑\"**，**泰是\"对外柔顺、内心刚健\"**。**而讲义明确说\"外柔内健\"是\"致泰之道\"**——**即：通泰的局面，来自\"外面不争、内里有骨\"**。**须说明**：**\"坤在上、乾在下\"是泰卦的爻位安排（阴在上、阳在下），其义为\"二气相交\"**——**这与通常\"阳上阴下\"的直觉相反，而正是《易经》\"交则通、不交则塞\"的核心**（**见后否卦条**）。**故泰卦的吉，不在\"阳在上\"，而在\"上下能交\"**。","o":"TJ-0171 · 天纪·人间道·泰卦（PDF 第39页）"},{"t":"七十、泰之象","h":"卦辞：天地之泰与人间之泰","c":"要点——泰卦辞\"**泰，小往大来，吉亨**\"，其解分两层。**①天地之泰**：\"**阳气下降，阴气上升，阴阳和畅，万物生焉，此天地之泰。**\" **②人间之泰**：\"**大则居上，小则臣下；君王推诚任下，臣尽诚以事君，上下同志，朝廷之泰。君子、小人亦如是——君子处君位，小人居下位，天下之泰也。**\" **这两层的结构完全相同：都是\"上下相交\"**——**天气下降、地气上升（自然），君推诚、臣尽诚（人事）**。**而\"推诚任下\"与\"尽诚事君\"这一对尤须注意**：**它不是单向的\"臣服从君\"，而是双向的\"各自尽诚\"**——**上要\"推诚\"（把信任交出去），下要\"尽诚\"（把心力用尽）**。**须说明**：**\"君子处君位、小人居下位\"是古代的德位观，今天不宜照搬**（**\"小人\"在此是道德判断，非身份**）；**但其可取的结构是\"德位相称则泰\"**——**这与前章履卦\"占位又不进德，除之\"是同一条原则的两面。**","o":"TJ-0172 · 天纪·人间道·泰卦（PDF 第39页）"},{"t":"七十、泰之象","h":"彖：\"上下交而其志同\"","c":"要点——泰卦\"彖\"中最要紧的一句是\"**则是天地交而万物通也，上下交而其志同也**\"。其解：\"**阴往而阳来，天地气相交，万物通泰；人则上下之志相同，互相交通，人之泰也。**\" 其后接\"**内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也**\"——\"**阳进阴退之时，故内健外顺，君子之道也；君子在内，小人在外，此所以为泰。**\" **\"上下交而其志同\"这七个字，正好回答了上一章留下的问题**：**履卦的象辞批评\"今人自下至公卿，日所志为尊荣；农工商人，日思于富侈；亿兆之心交相为利，心如何一致\"——那一问的答案是\"上下交\"**：**不是靠统一口号让人\"志同\"，而是靠\"交\"（上下真正沟通、各尽其诚）使志自然趋同**。**须说明**：**这一处对读是编者的读法**（**两章相隔，原书未明言此呼应**）；**但其逻辑成立**：**\"志同\"在泰卦里是\"交\"的结果，不是\"交\"的前提**——**先有畅通的上下沟通，才可能有共同的志向**；**这与\"以口号求一致\"正好相反。** **另须说明**：\"内君子而外小人\"一句在古代有\"远小人\"的治术义，本集取其\"亲贤远佞\"的一般义，不取其人身贬斥。","o":"TJ-0173 · 天纪·人间道·泰卦（PDF 第39页）"},{"t":"七十一、泰之始","h":"象：\"财成天地之道，辅相天地之宜\"","c":"方法——泰卦\"象\"为\"**天地交，泰；后以财成天地之道，辅相天地之宜，以左右民**\"，其解：\"**此示人君须体会交泰之道而为法制，使民用天时之宜；辅助教育人民之功，使民有财，辅助于民。民则必赖君上之法制，因法治之宜也，得其生养。**\" **这一句给出了\"泰\"的具体做法，且落点在\"法制\"与\"生养\"上**：**君主（或治理者）该做的不是\"发号施令\"，而是\"体会交泰之道而为法制\"**——**即：把\"上下相通\"这件事制度化，使百姓能\"用天时之宜\"（按节律做事）、\"有财\"（有生计）、\"得生养\"（能活下去）**。**这与前章\"立法复杂，民无所从\"正好接上**：**法制之\"宜\"，在于使人能照着做并有所得**。**须说明**：**\"财成\"\"辅相\"是古语（裁成、辅助），其现代对应是\"制度设计与公共服务\"**；**本集取其为\"治理者应与民以时、与民以财、与民以教\"的一般义**——**而这一条与泰卦整体的\"交\"是一致的**：**治理的本质是\"通\"，不是\"控\"**。","o":"TJ-0174 · 天纪·人间道·泰卦（PDF 第39页）"},{"t":"七十一、泰之始","h":"初爻：\"拔茅茹，以其汇\"","c":"方法——泰卦初爻\"**拔茅茹，以其汇，征吉**\"。其解：\"**刚明之才，居于下位，遇泰之时，志而上进，遇同志而行同道，因同类而进，吉。凡君子、小人都须赖同类以助——未有人能独立而不须朋类之助。**\"其\"象\"：\"**同类相聚，如拔茅之根相牵连，同欲上进。**\" **\"拔茅茹，以其汇\"这个取象极准**：**拔起一根茅草，根须牵连着一片一起被带起来**——**即：同类相牵而进**。**而其判断有一句极坦率**：\"**未有人能独立而不须朋类之助**\"——**这在强调\"自重\"\"不攀附\"的前几章之后，是一个重要的平衡**：**比卦说\"汲汲以求比者乃自失之道\"，此处说\"未有人能独立而不须朋类之助\"**——**两者并不矛盾**：**前者反对\"攀附\"（借他人之力以自抬），后者承认\"同志相助\"（因同道而相牵）**；**分界线在于\"因同志而行同道\"（**所赖者是同道人），还是\"因利而附\"（所赖者是权势）。** **须说明**：**这是《易经》原文（泰初九）**；**其现实经验很扎实**：**任何事要做成，都需要一批同道的人**——**而这与\"不攀附\"是可以并存的，只要\"聚\"的理由是同道，而不是同利**（**回看泰卦彖辞\"上下交而其志同\"，其\"志同\"正是这个意思**）。","o":"TJ-0175 · 天纪·人间道·泰卦·初爻（PDF 第39页）  ---"},{"t":"七十二、治泰","h":"第二爻：\"包荒，用冯河\"——治泰之难在人情","c":"方法——第二爻\"**包荒，用冯河，不遐遗，朋亡，得尚于中行**\"，是泰卦最长的一条，讲的是\"怎么治理一个正在好的局面\"。其解：\"**九二为将位，以刚明之才；五为柔顺而得君位，上下之专信建立，此位乃治泰者。故治泰之道，主将位而能包荒——如人情放肆所为，则政令缓、法度废弛；治此之道，必有包含荒秽之量，详密施政，去其弊端，则人安之。**\" **其后三段层层推进**：**①\"处泰之道，人之常情习于久安，惰于因循，不敢变更\"**——**好日子里，人自然懒、自然守旧**；**②\"用冯河，乃奋发改革之意；虽至小至微之事亦不可遗漏\"**——**故须有\"冯河\"（徒步渡河般的决断）去改革**；**③\"自古立法治事，牵于人情，卒不能行者多矣——如禁奢侈则害近戚，限田宅则妨碍贵族之家，此治泰之难\"**。**这第三段是全卦最实的一句**：**立法之难，从来不在\"道理不通\"，而在\"牵于人情\"**——**禁奢侈会伤到近亲，限田宅会碰到权贵**；**故\"治泰\"须\"秉持公正之态度，即中行意\"**。**须说明**：**这是《易经》的义理（泰九二）**；**其结构在今天的治理中完全重复**：**任何\"改掉既得利益\"的规则，都会遇到\"人情\"的阻力**——**故\"包荒\"（能容）与\"中行\"（公正）必须同时具备**：**只有\"包荒\"则和稀泥，只有\"中行\"则推不动。**","o":"TJ-0176 · 天纪·人间道·泰卦·第二爻（PDF 第39页）"},{"t":"七十二、治泰","h":"第三爻：\"无平不陂，无往不复\"","c":"要点——第三爻\"**无平不陂，无往不复，艰贞无咎；勿恤其孚，于食有福**\"。其解：\"**三居诸阳之上，乃泰之盛时。圣人为之戒：在下者必升，居上者必降，泰久而必否，故戒之。故当此时，不敢安逸，居安思危，则无灾。故处泰之道须能坚贞，可常保泰。自古以來，隆盛皆因内失道而丧败下来。**\"其\"象\"：\"**阳降于下，必复上；阴升于上，必复下——此示人明天地交泰之道不常存之理也，圣人戒之。**\" **\"无平不陂，无往不复\"八字，是关于\"盛极\"最经典的一句**：**没有永远的平（必有坡），没有只去不回（必有返）**。**而\"泰久而必否\"四字，把泰卦与下一卦（否）直接连了起来**——**泰卦的第三爻已经在讲\"否\"**。**其给出的处置只有一条**：**\"不敢安逸，居安思危\"**；**而\"自古以來，隆盛皆因内失道而丧败下来\"这一句，是全卦对\"衰败原因\"的判断**——**不是外敌、不是时运，而是\"内失道\"**。**须说明**：**这是《易经》原文（泰九三）**；**其现实意义很直**：**处顺境时最重要的工作，不是扩大战果，而是\"检查内部有没有失道\"**——**这与前章\"立法复杂则民无所从\"\"占位不进德则除之\"是同一套自查。**","o":"TJ-0177 · 天纪·人间道·泰卦·第三爻（PDF 第39页）"},{"t":"七十二、治泰","h":"第四爻：\"翩翩不富\"——为利而从与志同而从","c":"要点——第四爻\"**翩翩不富，以其邻，不戒以孚**\"。其解：\"**翩翩，疾飞之貌。人富而从其类，为利也；不富而从其者，志同也。上三爻皆为阴，阴在上而失其中实之道，皆欲下从，故为不富而从——此诚意相合也。**\"其\"象\"：\"**因三阴在上，失其实才，欲行往下；不待其人富而邻从，皆因失实故也。此已失乃方知戒之意；此时不待告诫而诚意相待，乃出于中心所愿也。**\" **这一条给了一组极实用的对照**：**\"人富而从其类，为利也；不富而从其者，志同也\"**——**跟着有钱有势的人走，是因为利；跟着没什么可给的人走，才是因为志同**。**\"不戒以孚\"四字更妙**：**不用别人告戒、不用约定，就自然以诚相待**。**而讲义另有一处时点判断值得记**：\"**如至六四位方戒已晚；居三为适中，知戒可保；四位则已过，必生变化。**\" **这一句说的是\"察觉的时点\"**：**在第三爻（盛时之末）戒备，还保得住；到第四爻（已入衰象）才戒，就晚了**。**须说明**：**这是《易经》的爻位义理**；**其对照可用作识人标准**（**愿与你共事的人是因利还是因志，看\"你没那么富/没那么强时，他还在不在\"**）——**这也正与前章\"同欲相憎，同忧相亲\"互为注脚。**","o":"TJ-0178 · 天纪·人间道·泰卦·第四爻（PDF 第39页）"},{"t":"七十二、治泰","h":"第五爻：\"帝乙归妹\"——降尊以任贤","c":"方法——第五爻\"**帝乙归妹，以祉元吉**\"。其解：\"**为居君位。古之帝女皆向下嫁，帝乙制礼法，须降其尊贵，以顺从其夫也。今六五以阴柔居君位，对应之九二为阳刚，乃能信之，而任用其贤且顺从之——犹帝女之下嫁亦然，此成治泰之功也。**\" 其\"象\"：\"**其能任用刚中之贤，乃因已有中道与之合，志同相交也。**\" **这一爻讲的是\"上位者如何用比自己更刚强的人\"**：**办法是\"降其尊贵\"（放下身段）＋\"信之\"\"顺从之\"（真信、真顺）**；**其条件是\"已有中道与之合\"**——**即：不是因为\"没办法才用他\"，而是因为\"所持的中道与他相合\"**。**这与师卦\"王三锡命\"（授权）不同**：**师卦讲\"给出权力\"，此爻讲\"放下位分\"**——**两者合起来，才是完整的\"用贤\"**。**须说明**：**\"帝女下嫁\"是古代的礼制取象**；**其现代读法不是\"领导要谦卑\"，而是\"上位者若不能放下位分，就请不动真正刚强的人\"**——**这一条在任何组织里都成立**（**能人来不来、留不留，往往取决于上位者肯不肯\"降尊\"**）。","o":"TJ-0179 · 天纪·人间道·泰卦·第五爻（PDF 第39~40页）"},{"t":"七十三、泰终","h":"上爻：\"城复于隍\"","c":"风险——上爻\"**城复于隍，勿用师，自邑告命，贞吝**\"。其解：\"**此致泰之终也，小人处之，行必否矣。掘隍土累积成城，如治道累积以成泰；今城土颓圮，又复返于隍也。**\" 其\"勿用师\"一解极准：\"**夫用师之道，必得民心；今民心不从，用师必乱——此时即自有天命任之，亦逢羞而凶矣。**\"其\"象\"：\"**城倾圮，又回归隍土，即令命为正，但乱已不可止矣。**\" **\"城复于隍\"这个取象是全卦的收尾，也是最有意象力的一笔**：**城墙是用护城壕挖出的土堆成的；城塌了，土又回到壕里**——**即：一切\"累积而成\"的东西，最终都回到它原来的地方**。**其判断也很实**：**到了这一步，\"用师\"（动武、强推）已无意义**（**\"民心不从，用师必乱\"**），**即便\"命为正\"（名义上你还有正当性），\"乱已不可止\"**。**须说明**：**这是《易经》原文（泰上六）**；**其现实对应是\"系统性的衰败\"**——**当信任基础已经流失，再正确的手段也无效**；**故这一爻的真正含义是\"要防的是走到这一步\"**，**而非\"如何在这一步补救\"**（**补救之法在前几条：九二的\"包荒\"、九三的\"艰贞\"、六五的\"任贤\"**）。","o":"TJ-0180 · 天纪·人间道·泰卦·上爻（PDF 第40页）"},{"t":"七十四、转否","h":"否卦的出现","c":"要点——泰卦之后是否卦（天地否），讲义开篇记其占例：\"**此卦苏秦将游说六国，卜得之，果为相矣。**\"并列出卦图：\"**男人卧病，镜破，人路上坐……**\"。**两卦的关系从卦体即可看出**：**泰是坤上乾下（阴上阳下→相交），否是乾上坤下（阳上阴下→不交）**——**同一对卦，只是上下颠倒，就成了正反两面**。**讲义于否卦开篇必有\"天地不交\"之义（见下章），而泰卦诸爻已经把\"为什么会否\"讲完了**：**盛时惰于因循（九二）、泰久而必否（九三）、知戒已晚（六四）、城复于隍（上六）**——**四层递进，恰好是一条\"由盛入衰\"的路径**。**须说明**：**\"苏秦游说六国果为相\"仍是\"事后叙事\"**（**见讼卦末条**）；**而\"镜破\"\"男人卧病\"这两个取象，正与\"否\"（不通、不交）之意相合**：**镜破则不能照，卧病则不能行**——**都是\"功能断绝\"之象**。**本集把否卦的完整注解留给下一章，此条只作衔接**：**读《易经》最忌只看吉卦（泰）而不看凶卦（否），因为两者是同一件事的两面，且转折点就写在泰卦的第三爻里。**","o":"TJ-0181 · 天纪·人间道·泰卦（PDF 第40页）；否卦（PDF 第41页）  ---"},{"t":"七十五、卦象（否卦俭德避难）","h":"天地不交：否卦的七物","c":"方法——否卦（天地否）为\"**天地不交之课，人口不实之象**\"，其卦体与卦序：\"**上泰之终，六爻以阴柔（小人）处之，则为否之初。天地相交、阴阳相通，则为泰；今天在上、地在下，是天地隔绝、不相往来，故成否卦。**\"（**泰为坤上乾下，否为乾上坤下，同一对卦上下颠倒即成两面**）。其七物取义：**①\"男子卧病：男子为阳，'阳'同'佯'，装病之象也\"**；**②\"镜破：不可赴也，破镜难圆之象\"**；**③\"人路上坐：小人阻路，不让进也\"**；**④\"张弓箭头落地：鸟尽弓藏也\"**；**⑤\"人拍掌笑：幸灾乐祸之小人，做假攻讦两人感情得逞状（夫妻凶）\"**；**⑥\"舌：主口舌、官司、谣言生害\"**；**⑦\"口上有四点：四点为黑，暗中诬陷之谣言——古人谓'三口成虎'，即意此\"**。**这七物合起来，画的是一幅\"世道已坏\"的图景**：**有人装病避事（佯）、有人阻路、有人幸灾乐祸、有鸟尽弓藏的卸磨杀驴、有暗中诬陷的谣言**。**其中\"男子卧病＝阳同佯（装病）\"这一条最妙**——**它用谐音把\"阳\"读成\"佯\"**：**阳气不振，在卦象上就如同\"装病\"**。**须说明**：**\"三口成虎\"（三人成虎）的取义是古代对\"谣言杀人\"的经典表述**；**这些取象不涉吉凶判断，可独立理解**（**前章已说明占例叙事的性质**）。","o":"TJ-0182 · 天纪·人间道·否卦（PDF 第41页）"},{"t":"七十五、卦象（否卦俭德避难）","h":"卦辞与彖：\"上下不交，而天下无邦\"","c":"定义——否卦辞\"**否之匪人，不利君子贞，大往小来**\"。其解：\"**举凡天地之间皆为人道；今天地不交、不生万物，是无人道，故曰匪人。处此之时，君子不可坚心——因正道不行、小人道长之时。**\" 彖中两句最重：\"**上下不交，而天下无邦也**\"；\"**治世乃上位施政来治民，人民拥戴君王而愿从命，上下相交，此治国之道。今君子居于外野，小人处于朝内，故为小人道长、君子道消之时也。**\" **\"上下不交，而天下无邦\"六个字，是否卦的定性**：**\"无邦\"不是\"国亡\"，而是\"虽有邦而无邦之实\"**——**因为国家之为国家，靠的是\"上下相交\"（上位施政、下民拥戴）**；**这条线一断，形式还在，实质已无**。**这与泰卦\"上下交而其志同\"恰好互文**：**一个是\"交则万物通\"，一个是\"不交则天下无邦\"**——**《易经》对\"治\"的理解，核心就是\"通\"这一个字**。**须说明**：**\"匪人\"（非人）是古语，指\"人道不行\"**，**非现代意义上的骂人**；**其现代对应是\"上下信息断绝、互不信任的状态\"**——**此时任何施政都落不了地，任何拥护也都不是真的。**","o":"TJ-0183 · 天纪·人间道·否卦（PDF 第41页）"},{"t":"七十六、处否","h":"象：\"俭德辟难，不可荣以禄\"","c":"风险——否卦\"象\"为\"**天地不交，否；君子以俭德辟难，不可荣以禄**\"，其解是全书最不留情的一段：\"**君子观否塞之象为外健内顺（柔）。处否之时，损俭自己，避开祸乱；千万不可荣居禄位、恋栈不去。因小人得志之时，君子仍居显位，则祸必及己身——反之，仍居显位不放，乃真小人也，即'内小人外君子'之意。**\" **这一段有三层，一层比一层狠**：**①\"损俭自己，避开祸乱\"**——**在坏世道里，第一件事是减损自己（少露头、少攫取）**；**②\"千万不可荣居禄位、恋栈不去\"**——**不要舍不得位置**；**③\"仍居显位不放，乃真小人也\"**——**这一句最狠：不肯放位的人，其实是小人**。**其逻辑在于\"内小人而外君子\"这一卦象**：**外面还占着\"君子\"的名分，内里已经是\"小人\"的算计（为自己保位）**——**故\"显位不放\"这件事本身，就把人从君子行列里剔了出去**。**须说明**：**这一条在当代须谨慎使用**：**它不是说\"遇到不正之风就该辞职\"**（**那是把\"避\"读成了\"退\"**）；**其可用的核是\"不要在坏世道里靠位置获利、恋栈\"**——**即在失序的环境里，宁可减损自己，不要靠\"占着\"来保全**（**这与前章\"泰卦九二\"的\"试改革\"恰成一对：能改则改，不能改则俭德**）。","o":"TJ-0184 · 天纪·人间道·否卦（PDF 第41页）"},{"t":"七十六、处否","h":"初、二爻：拔茅与包承","c":"要点——否卦前两爻给出两种人的对照。**初六\"拔茅如，以其汇，贞吉，亨\"**：\"**否之在最下者，为君子也。因否而不能进者，君子也；处否而能进者，小人也。因在下位，又贞固其节志，同类而聚，虽不进升，但亦吉矣。**\"其\"象\"：\"**君子处否时而居下位，冀得同类而进；如遇小人，则坚守其节，但心仍在天下。**\" **第二爻\"包承，小人吉，大人否，亨\"**：\"**六二本阴爻位，今阴柔居之；以小人而言，其心所包容的，皆承顺上位之意，以求本身之利——此小人之吉。大人处否，则以道之阳刚自勉，绝不枉屈正道、奉承上位；虽身处否，但道仍亨也。**\"其\"象\"：\"**处否而守其正节，乃为大人；不与小人同乱为群体，形虽否，但其道吉，此道必大。**\" **这两爻的分野极清楚**：**\"因否而不能进者，君子也；处否而能进者，小人也\"**——**在坏世道里升不上去的，是君子；能升上去的，是小人**（**这个判断很直接，也很沉痛**）。**而\"包承\"二字是\"小人之吉\"的准确写照**：**所\"包\"所\"承\"的，全是\"承顺上位之意\"，目的是\"本身之利\"**。**须说明**：**\"能进而为小人\"是一个结构性判断，不是对个人的定性**；**其可用的部分是\"看一个人靠什么上升\"**——**若其上升全赖\"承顺上位之意\"而无所守，则此爻已经说清了**。**而\"心仍在天下\"五字，是给\"不能进\"者的安慰，也是给其定性的关键**：**虽退而心未退，这才叫君子。**","o":"TJ-0185 · 天纪·人间道·否卦·初、二爻（PDF 第41~42页）"},{"t":"七十六、处否","h":"第三爻：\"包羞\"","c":"风险——第三爻仅二字：\"**包羞**\"。其解：\"**不中不正之人居否之时，位居相位，不能守道安命，极尽小人之能事，每日谋虑邪事，无所不包，此羞耻之大也。**\"其\"象\"：\"**居否时，所为邪吝，羞于公正，居此相位而不适，此不可以为正道。**\" **\"包承\"（第二爻）与\"包羞\"（第三爻）是一组递进**：**第二爻的\"包\"是\"承顺上位以求利\"，尚可称之为\"小人之吉\"；第三爻的\"包\"则\"每日谋虑邪事，无所不包\"，成了\"羞耻之大\"**。**即：同一个\"包\"字，从\"会做人\"走到了\"无耻\"**。**须说明**：**这一爻的\"位不当\"（处相位而不适）指向\"德不配位\"**——**德不配位而恋栈，正是前条\"仍居显位不放乃真小人\"的具体化**；**故这一组三爻（象、初二、三）是连贯的**：**象辞给出了\"该怎么办\"（俭德辟难），初二爻给出了\"什么人进了、什么人退了\"，第三爻给出了\"留下来的成了什么\"。**","o":"TJ-0186 · 天纪·人间道·否卦·第三爻（PDF 第42页）"},{"t":"七十七、转机","h":"第四爻：\"有命，无咎\"——使事事出于君令","c":"方法——第四爻\"**有命，无咎，畴离祉**\"。其解：\"**居君侧之人，最忌有居功招忌之事；因否时君道不正，即令有济世之大才，亦不堪用。如能使事事出于君令、威柄皆归于上，则无灾而可实现大志。当君子道行，同类必同进同出，为天下黎民福祉着想；小人亦同进退也。**\"其\"象\"：\"**凡事皆由君命而出，则无灾，且大志得行。**\" **这一条讲的是\"在坏世道里的做事方式\"**：**位置在权力身边，最有才也\"不堪用\"**；**其解法不是\"争\"，而是把功劳与权柄都归到\"君令\"（名义上的正当来源）**——**即：让事情以正当名义推进，而不以个人名义推进**。**\"则无灾而可实现大志\"这一句是这一条的价值所在**：**它没有说\"别做事\"，而是说\"这样做，事还能做成\"**。**这与前章\"俭德辟难\"构成一对**：**无力改局者退（俭德），仍在局中者以\"出于君令\"的方式行其志**——**两条路径，视位置而定**。**须说明**：**\"威柄皆归于上\"在当代不宜读作\"把功劳让给领导\"这种权术**；**其可取的核是\"程序正当\"**——**在制度不确定的环境里，让每一步都有可追溯的正当依据，既能自保，也能把事做成**。","o":"TJ-0187 · 天纪·人间道·否卦·第四爻（PDF 第42页）"},{"t":"七十七、转机","h":"第五爻：\"其亡其亡，系于苞桑\"","c":"方法——第五爻\"**休否，大人吉；其亡，其亡，系于苞桑**\"。其解：\"**处否之时，惟有阳刚中正之人居君位，能去天下之否，即大人吉。如循环至泰，亦须戒盛警惕否之复来——此'其亡其亡'之意。此戒须如同苞桑：桑为根深蒂固之物，苞乃丛生之物，其固更强，此为安固之道。此为圣人之深戒也。**\" **这一爻给出了否卦的出路，也给出了最著名的警示**：**\"其亡其亡\"是反复念叨\"要亡了、要亡了\"**——**不是悲观，而是\"警惕\"**；**而\"系于苞桑\"是说这份警惕要像桑树那样根深、像丛生的苞那样互相缠结**（**单个的根不牢，丛生才牢**）。**\"其亡其亡，系于苞桑\"八字，后被历代当作\"居安思危\"的经典表述**（**唐太宗与魏征的对话中即引此语**）。**须说明**：**\"大人吉\"的条件是\"阳刚中正之人居君位\"**——**即：否局可解，但须有\"中正\"的力量来接**；**而\"循环至泰亦须戒否之复来\"这一层，把泰否的往复讲成了常态**：**不是\"解了一次就永远好了\"，而是\"每一次好转都带着下一次否的可能\"**。**故这一爻的真正内容，不是\"如何转泰\"，而是\"转泰之后如何不再入否\"**——**答案就是那八个字：其亡其亡，系于苞桑。**","o":"TJ-0188 · 天纪·人间道·否卦·第五爻（PDF 第42页）  ---"},{"t":"七十八、否之终","h":"九五引《系辞》：\"危者安其位者也\"","c":"要点——否卦九五\"**休否，大人吉**\"之后，讲义引《系辞》一段作注，是全书最重的一段引文：\"**危者安其位者也，亡者保其存者也，乱者有其治者也。是故君子安而不忘危，存而不忘亡，治而不忘乱，是以身安而国家可保也。**\" **这三句的逻辑极反直觉，也极深刻**：**\"危\"来自\"安其位\"**（**正因为你安坐其位，危险才生**）；**\"亡\"来自\"保其存\"**（**正因为你一心保有自己的存在，灭亡才来**）；**\"乱\"来自\"有其治\"**（**正因为在你的治理之下，祸乱才起**）。**即：危、亡、乱都不是\"从外面来\"的，而是从\"自认为稳\"这件事里长出来的。** **而\"安而不忘危，存而不忘亡，治而不忘乱\"三句，正是对上三句的解法**；**其结论是\"身安而国家可保\"**——**不是靠更强的防护，而是靠\"不忘\"。** **须说明**：**这是《系辞》原文，也是中国政治思想中最著名的一段**（**\"居安思危\"即由此出**）；**本集把它放在否卦的九五，位置极准**：**因为\"否\"（闭塞不通）恰恰是从\"泰\"（通泰安稳）里长出来的**——**前章泰卦九三\"无平不陂，无往不复\"\"泰久而必否\"，说的正是这件事。** **三卦（泰、否、《系辞》）在此合成一条完整的道理：安稳本身会生产危险，故唯一的解是\"不忘\"。**","o":"TJ-0189 · 天纪·人间道·否卦·第五爻（PDF 第42页）"},{"t":"七十八、否之终","h":"上爻：\"倾否，先否后喜\"","c":"要点——否卦上爻\"**倾否，先否后喜**\"。其解：\"**物极必反：泰极则否，否极则泰。故否之极，即否道将覆，则泰矣，故曰后喜。**\"其\"象\"：\"**否之终必倾危，绝无永否之理；但反危为安、易乱而治，必有阳刚之才，乃能做也——故否卦之上九能倾否，如屯之上六则不能去屯，同意也。**\" **这一爻给了两个判断**：**①\"绝无永否之理\"**——**坏局面不会永远持续**（**物极必反**）；**②但\"倾否\"须有条件**：**\"必有阳刚之才，乃能做也\"**——**即：转机不会自动发生，须有人来做**。**而讲义末句的对照极精**：**\"否卦之上九能倾否，如屯之上六则不能去屯\"**——**同样是\"上爻\"（一卦之终），否卦能\"倾否\"，屯卦却不能\"去屯\"**。**其别在于\"才\"**：**否之上九是阳爻（有阳刚之才），屯之上六是阴爻（无力）**——**故两卦同处终局，一个能反转，一个只能\"泣血涟如\"**（**见前章屯卦上爻**）。**须说明**：**这是《易经》的爻位义理**；**其现实判断很硬：局面的转机，最终取决于\"有没有人能担\"**——**同一处境，有人可转，无人则沉**。","o":"TJ-0190 · 天纪·人间道·否卦·上爻（PDF 第42页）"},{"t":"七十九、同人之始","h":"\"遇否之世，必与人同力方能渡过\"","c":"定义——同人卦（天火同人）为\"**游鱼从水之课，二人分金之象**\"，其卦序之义一句话说透了来历：\"**天地不交则否，上下相同则同。遇否之世，必与人同力方能渡过，故次否也。**\" **这一句把\"同人\"从\"交朋友\"提升为一种\"解否之道\"**：**否（闭塞不通）的处境里，单打独斗过不去，必须\"与人同力\"**。**其卦体之解极精**：\"**天之性在上，火之性炎上与天同，故为同人。……天性刚健，火性明耀，即外健内明之象——吾人外刚健、内明道，则成天火同人，此为大同之道。**\" **注意与前几卦的对照**：**履卦是\"外健内卑\"，泰卦是\"外柔内健\"，此卦是\"外健内明\"**——**三卦各自给出了\"外\"与\"内\"的一种组合**，**而\"外健内明\"是\"大同之道\"的条件**：**外面立得住（健），内里看得清（明）**。**须说明**：**\"火性炎上与天同\"是卦象的取义（离火在上、乾天在下，火性向上与天相合）**；**其可取的核是\"同\"的来源**：**不是利益相同，而是\"性同\"（方向一致）**——**这与其后\"朋党\"之\"同\"形成对照**（见下条）。","o":"TJ-0191 · 天纪·人间道·同人卦（PDF 第43页）"},{"t":"七十九、同人之始","h":"卦辞：\"于野\"——大同与朋党之辨","c":"风险——同人卦辞\"**同人：于野，亨，利涉大川，利君子贞**\"。其解是全卦最重要的一段，直指\"同\"的两种性质：\"**野即远与外之意。以天下大同之道、圣贤大公之心，使之无远不同。常人之同，以私意所合，此暱亲之情——故必于野，方可谓大同。天下皆同时，何险阻能阻碍？何艰困能致危？故利涉大川，君子须坚心于此。小人唯用私意，所亲比者亦为小人，朋党之始，其心不正也。**\" **这段给出了\"同\"的分界线**：**①\"于野\"之同**——**远而广，以\"大公之心\"合，虽素不相识也能同**（**\"使之无远不同\"**）；**②\"暱亲\"之同**——**\"以私意所合\"，即因亲近、因私交而合**。**而\"小人唯用私意，所亲比者亦为小人，朋党之始，其心不正也\"这一句，把\"同人\"的反面直接点成了\"朋党\"**——**同人卦讲的\"同\"，与朋党的\"同\"是两回事，且互为反面**。**须说明**：**这是《易经》原文（同人卦辞）**；**其判据可提炼为两条**：**一是范围（能否\"无远不同\"，还是只在小圈子里）**；**二是依据（因\"公\"而合，还是因\"私意\"而合）**。**其现实对应极实用**：**任何\"圈子\"\"同盟\"\"团队\"，都可用这两条自检**——**圈子越小、越靠私交，越接近\"朋党\"；越能容纳陌生人、越靠共同的原则，越接近\"同人\"。**","o":"TJ-0192 · 天纪·人间道·同人卦（PDF 第43页）"},{"t":"七十九、同人之始","h":"彖：\"无私，天德也\"","c":"要点——同人\"彖\"中有一句极简：\"**同人于野，亨，利涉大川，乾行也**\"，其解：\"**乾之行，必至诚无私，故可以涉险难，而吉。无私，天德也。**\" **\"无私，天德也\"五个字，是同人卦的根基**：**能\"涉大川\"（渡过大险）的条件不是人多，而是\"无私\"**。**这与卦辞\"于野\"完全一致**：**\"于野\"之所以能\"利涉大川\"，正因为它是\"无私\"之同**——**若\"同\"是为了各自的私利，一遇险难就散**（**\"以私意所合\"者，利尽则疏**）。**须说明**：**这是《易经》的义理**；**其判断在现实中反复验证**：**因利而聚的团体，在危机中最先崩解**；**而\"无私\"之同——即以共同的原则而非共同的所得为纽带——反而能承担风险**。**这与前章比卦\"人富而从其类，为利也；不富而从其者，志同也\"是同一判断的两种表述。**","o":"TJ-0193 · 天纪·人间道·同人卦（PDF 第43页）"},{"t":"七十九、同人之始","h":"\"唯君子为能通天下之志\"","c":"要点——同人\"彖\"末段是全书最精微的一处：\"**文明以健，中正而应，君子正也；唯君子为能通天下之志。**\"其解：\"**下体为有文明之德，上卦为刚健之性，此君子之正道。天下之志万殊且异，但理则一也——君子因明理，故能通天下之志。圣人视亿万人之心为一心，因只一理而已。文明能使人更明理，故能明大同之真义；刚健必能克己，则必能致大同之道。**\" **这段话有两个要点**：**①\"天下之志万殊且异，但理则一也\"**——**每个人想要的东西千差万别，但\"理\"只有一个**；**②\"圣人视亿万人之心为一心，因只一理而已\"**——**故\"通天下之志\"不是\"满足所有人的愿望\"（那不可能），而是\"在同一个理上把人接通\"**。**而它对\"文明\"与\"刚健\"的用法也精准**：**\"文明能使人更明理\"（文化的作用是让人看清理）**；**\"刚健必能克己，则必能致大同\"（力量的作用是克制自己，不是压服别人）**。**须说明**：**这是《易经》原文（同人彖传）**；**其\"理一而志万殊\"的判断极深**——**它解释了为什么\"共同目标\"常失效（因目标是\"志\"，各不相同），而\"共同原则\"能生效（因原则是\"理\"，可以只有一条）**。**这一条与本集前几章\"同欲相憎，同忧相亲\"\"上下交而其志同\"恰好串成一条线。**","o":"TJ-0194 · 天纪·人间道·同人卦（PDF 第43页）"},{"t":"八十、卦图与象","h":"\"世间但闻虎食人，未闻鹿食人\"","c":"方法——同人卦图有五物：\"**①人捧文书上有心字：得民心之象，同心协力之象（宁姓）**\"；\"**②人张弓射山上：高中金榜（张姓人氏）**\"；\"**③一鹿饮水：财禄滚滚而来；亦在野之贤人**\"；\"**④一溪：平和安静状**\"；**⑤其末一句最妙**：\"**鹿之性，动则敏，静则顺，此刚健人之性——世间但闻虎食人，未闻鹿食人。**\" **\"鹿之性，动则敏，静则顺\"是对\"刚健\"的另一种定义**：**刚健不在\"凶\"，而在\"动则敏（反应快）、静则顺（守规矩）\"**；**而\"世間但聞虎食人，未聞鹿食人\"这一句，把\"有力量而不伤人\"讲成了最高的德性**——**有角有力，却不吃人**。**这与前章师卦\"师必以强勇，中有阴柔\"、履卦\"外健内卑\"是同一条线的第三次出现**：**真正的强，是\"能伤人而不伤人\"。** **须说明**：\"宁姓\"\"张姓\"\"高中金榜\"\"财禄滚滚\"一类的断法属象数附会；**而\"鹿之性\"这一条的义理可独立成立**——**它给\"刚健\"下了一个不带攻击性的定义。**","o":"TJ-0195 · 天纪·人间道·同人卦（PDF 第43页）"},{"t":"八十、卦图与象","h":"象：\"类族辨物\"","c":"方法——同人卦\"象\"为\"**天与火，同人；君子以类族辨物**\"，其解（据前文）：\"**君子观同人之象，以分类群族，各以其性同来区分。**\" **这一句极易被误读**：**\"同人\"讲的是\"同\"，而大象讲的却是\"分类辨识\"（类族辨物）**——**看似矛盾，实则互补**。**其义在于**：**\"同\"不是\"混同\"**；**先\"辨物\"（看清各自是什么），才能\"类族\"（把性同的归在一起）**——**即：真正的\"同\"，建立在\"辨\"之上，而不是建立在\"不辨\"之上。** **这与前文\"天下之志万殊且异，但理则一也\"完全一致**：**承认\"万殊\"（差别），才谈得上\"理一\"（共通）**。**须说明**：**\"类族辨物\"是《易经》原文（同人大象）**；**其现代对应极实用**：**任何\"求同\"的努力，都须先做\"辨\"的工作**——**不辨而求同，得到的是混同与朋党；辨而后求同，才可能得到真正的协作。**","o":"TJ-0196 · 天纪·人间道·同人卦（PDF 第43~44页）  ---"},{"t":"八十一、同人之六爻","h":"初二爻：\"于门\"与\"于宗\"","c":"风险——同人卦前两爻正是一对反例，把\"同\"的范围问题讲透了。**初九\"同人于门，无咎\"**：\"**初进为刚健，此因无所偏私；出门在外，因无私，而无咎也。**\"其\"象\"：\"**出门在外，因同人之道而无私；同此道之人又广，无厚此薄彼之异，则无人归咎也。**\" **第二爻\"同人于宗，吝\"**：\"**宗为宗党也；同于所派系，此有所偏，故可吝。故只用宗党之人，则有偏私——此为鄙吝之人。**\"其\"象\"：\"**同人之道用于宗亲，乃有所私；因私比，非人君之道，故此為吝道。今人皆如是，莫若太宗之用人。**\" **这两爻的分界只有一条：有没有\"偏私\"**。**\"于门\"是\"出门\"——范围开放，无厚此薄彼**；**\"于宗\"是\"宗党\"——只用自己人**。**而核心判词是\"故只用宗党之人则有偏私\"**——**即：凡以\"是不是自己人\"为先的，都归入\"吝\"。** **而\"今人皆如是\"四个字，是讲义对当世的直接批评**（**它拿唐太宗用人作正面例子**）。**须说明**：**这是《易经》的义理（同人初、二爻）**；**其现实对应极准**：**任何组织一旦按\"圈子\"分配机会，就进入\"于宗\"的状态**——**此时的\"同\"已经不是同人，而是朋党**（**与前章\"朋党之始，其心不正\"完全一致**）。","o":"TJ-0197 · 天纪·人间道·同人卦·初、二爻（PDF 第44页）"},{"t":"八十一、同人之六爻","h":"第三爻：\"伏戎于莽\"——理不直则不敢发","c":"要点——第三爻\"**伏戎于莽，升其高陵，三岁不兴**\"。其解：\"**二以中正之道与君五位相同志；三以刚暴之人居二五之间，欲夺，然理不直、义不胜，不敢发动——故只能藏兵戎于莽林间，时升高陵顾望，至三年之久，仍无机可乘，此小人之情状。**\"其\"象\"：\"**因三爻乃刚暴之人，其五君位为刚且正，故畏忌而不敢与，即三年亦不与。**\" **这一爻写的是\"想夺而不敢夺\"的一种状态**：**\"欲夺\"是真的，\"不敢发动\"也是真的**；**原因不是\"没有力量\"，而是\"理不直、义不胜\"**。**而\"伏戎于莽（藏兵在草丛里）、升其高陵（时不时爬上高处观望）\"两个动作，把这种状态画得很准**：**藏起来，又忍不住看**；**\"三岁不兴\"则是它的结局——三年也动不了。** **须说明**：**这一爻对\"识人\"有用**：**遇到\"理不直\"的人，他的表现往往不是收手，而是\"伏戎于莽\"——藏起来观望、蓄势、等机会**；**故\"暂时不动\"不等于\"放弃\"**。**而讲义称其为\"小人之情状\"**，**其判断的标准是\"理\"与\"义\"，不是\"野心\"**（**有野心而理直者，此爻不适用**）。","o":"TJ-0198 · 天纪·人间道·同人卦·第三爻（PDF 第44页）"},{"t":"八十一、同人之六爻","h":"第四爻：\"乘其墉\"——畏义能改则终吉","c":"方法——第四爻\"**乘其墉，弗克攻，吉**\"。其解：\"**九四乃阴位，阳刚居之，故以刚居柔位；其近君位，知义不直而能复返正道，亦吉也。三以刚居刚，故终其强而不可能反——此示人畏义能改则终吉。**\"其\"象\"：\"**因同人乃一阴，而众阳所同欲也；今独三、四爻有争夺之意，乃邪不胜义；其困穷乃因反于法则，故吉。**\" **这一爻与第三爻恰成对照，而且对照得极精确**：**第三爻\"以刚居刚\"（强硬到底），故\"终其强而不可能反\"**；**第四爻\"以刚居柔位\"（硬中有柔），故\"知义不直而能复返正道\"**。**讲义由此提炼出一句可作通则的话**：**\"畏义能改则终吉\"**——**关键在于\"畏义\"（怕的是道义）与\"能改\"（肯回头）**。**\"乘其墉\"（爬上城墙，已准备进攻）而\"弗克攻\"（终究没攻）**，**这个画面正好是\"已经走到边缘，又退回来\"**。**须说明**：**这是《易经》的爻位义理**；**其现实判断很硬**：**同样一次的\"收手\"，第三爻与第四爻的结局相反**（**一个困三年，一个吉**）——**区别不在\"收没收\"，在\"为什么收\"**：**因畏义而收，是吉；因无机可乘而收，只是暂时的\"伏戎\"。**","o":"TJ-0199 · 天纪·人间道·同人卦·第四爻（PDF 第44页）"},{"t":"八十一、同人之六爻","h":"第五爻：\"先号咷而后笑\"","c":"要点——第五爻\"**同人，先号咷而后笑，大师克相遇**\"。其解前半极正：\"**人君当与天下大同，如独私一人，则非君道也。**\"后半写\"同志难遇\"：\"**其同志为二爻，间隔有三四之刚，故未遇之前愤怒而号咷，即遇则大笑。**\" **而末段是全卦最有名的一句**：\"**故二人同心，其利断金；中诚所同，无所不同，天下莫能离间，则无所不入——故圣人赞之曰：'同心之言，其臭如兰'。**\" **\"二人同心，其利断金\"\"同心之言，其臭如兰\"两句皆出于此**（**前句言其力，后句言其气味相投**）。**这一爻把\"遇合\"讲得极实**：**中间隔着\"三四之刚\"（阻碍），故未遇时\"号咷\"（愤怒、焦躁），既遇则\"笑\"**——**即：真正的同志往往不是一开始就遇到的，而是穿过阻碍之后才遇上的。** **须说明**：**\"大师克相遇\"（以大军相会）的取象是古代的**；**其可取的核是\"中诚所同\"**——**能\"断金\"的不是\"关系好\"，而是\"中诚\"（内心的诚相同）**；**而\"天下莫能离间\"一句，也给出了\"稳固关系\"的判据：不是靠经营，是靠\"无所不同\"。**","o":"TJ-0200 · 天纪·人间道·同人卦·第五爻（PDF 第44页）"},{"t":"八十一、同人之六爻","h":"上爻：\"同人于郊，无悔\"","c":"要点——上爻\"**同人于郊，无悔**\"。其解：\"**求大同之道，必相亲相与；即在外又远之地不同，但亦永无悔矣。**\"其\"象\"：\"**此申明同人之道：在外及远之地求同之志不成，即无悔，但非最善之道。**\" **这一爻给\"没能求到同\"的人一个评价**：**\"无悔\"——不后悔，也不自责**；**但同时明说\"非最善之道\"**——**即：做到了这一步不错，但还有更高的可能**。**把初、二、上三爻连起来读，同人卦给出了\"同\"的三种范围**：**\"于门\"（开放，无咎）→\"于宗\"（宗党，吝）→\"于郊\"（在远地而难同，无悔）**。**三种的排序很清楚**：**最好的是\"开门\"（无偏私），最差的是\"宗党\"（偏私），中间是\"在郊\"（想同而不得，不后悔但也未达成）**。**须说明**：**这是《易经》的爻位义理**；**其现实对应是\"一个人能同的范围有多大\"**：**能同于门者（对陌生人也不偏），格局最大；只能同于宗者（只认自己人），最受限；而同于郊者（想同而隔得远），其志可敬但成不了事。**","o":"TJ-0201 · 天纪·人间道·同人卦·上爻（PDF 第44页）"},{"t":"八十二、大有之始","h":"\"与人同者，物必归\"","c":"定义——大有卦（火天大有）为\"**金玉满堂之课，日丽中天之象**\"，其卦序之义一句话说得很妙：\"**同人之序卦，与'人同者'物必归，此天纪也；故大有为同人之序——物归之后，乃大有也。**\" **这一句是《序卦》的逻辑**：**人若能与人相同（同人），则\"物必归\"（该来的都会来）**；**物归之后，才是\"大有\"**。**即：丰盛是\"同人\"的结果，不是追求的目标。** **其卦体之解**：\"**此卦火在天上，火之处高，其明及远，能照万物，此为大有之象；一柔居尊位，众阳应和——此居尊执柔，物乃所归，上下相应，为天子之道。**\" **\"居尊执柔\"四字是大有卦的关键**：**位置至高（居尊），态度至柔（执柔）**——**正因如此，\"物乃所归\"（人与物都往这里来）**。**这与前章\"泰卦九五帝乙归妹\"（降尊以任贤）同调**：**两卦都用\"柔\"来处理\"尊位\"**。**须说明**：**\"火在天上，其明及远\"是卦象取义（离火在乾天之上）**；**其可取的核是**：**\"大有\"（拥有很多）的前提是\"明\"（照得远）与\"柔\"（容得下）**——**而不是\"占得多\"**。","o":"TJ-0202 · 天纪·人间道·大有卦（PDF 第45页）"},{"t":"八十二、大有之始","h":"占例：完璧归赵","c":"要点——大有卦开篇所记占例是\"**蔺相如送赵璧往秦，卜得之，果还璧归赵也**\"。**这是全书诸卦占例中最著名的一个**（**\"完璧归赵\"是《史记》中的名段**：**蔺相如奉璧入秦，见秦王无意偿城，以智勇将璧送回赵国**）。**这一占例与大有卦义的呼应极巧**：**大有是\"物归\"（金玉满堂）**；**而占例讲的是\"璧归赵\"——一件至宝最终回到了它该归的地方**。**须说明**：**这是\"事后叙事\"**（**见讼卦末条：只有应验的才被写下来**）；**而本集记录它，是因为它恰好展示了古人如何理解\"大有\"**：**\"物归\"不是\"抢到手\"，而是\"归其所属\"**。**这一层意思与卦体的\"居尊执柔，物乃所归\"是一致的**：**真正聚拢财物的方式，不是夺取，而是使物自然来归**；**而\"完璧归赵\"的故事，正是一例\"夺不走、终须归\"**。","o":"TJ-0203 · 天纪·人间道·大有卦（PDF 第45页）  ---"},{"t":"八十三、卦义","h":"\"元亨\"与\"大善之初\"","c":"定义——大有卦辞只有两字：\"**大有：元亨**\"。其解说明了为何只讲两字：\"**此乃以卦才而言，不言元、亨、利、贞四德，乃恐与乾、坤二卦相混淆，只言'元亨'，乃尽元之义。元乃物之始，万物生成之初皆为'大善'，因必有功用。此为'大善之初'——易经唯四卦（大有、蛊、升、鼎）有'元亨'。其不与乾坤同：在乾为'首出万物、元始之象'，在此四卦唯'至善为大'而已。**\" **这一段的意义在于\"分等\"**：**六十四卦中，\"元亨利贞\"四德俱全的只有乾、坤二卦**；**而\"元亨\"（缺\"利贞\"）的只有四卦**——**大有、蛊、升、鼎**。**即：大有虽为\"金玉满堂\"，在《易经》的德性谱系里仍不是最高一等**（**因为\"元\"（创始之善）它有，\"利贞\"（利物而守正）它未全**）。**须说明**：**这是《易经》的体例（卦辞用字的差别本身就是判断）**；**其可取的核是\"丰盛不等于圆满\"**——**\"大有\"是\"大善之初\"，不是\"至善之极\"**。**这一层分寸感，与后几爻\"须谦损\"\"满而不溢\"的告诫完全一致**：**作者在讲\"拥有很多\"时，始终留着\"这还不够\"的余地。**","o":"TJ-0204 · 天纪·人间道·大有卦（PDF 第45页）"},{"t":"八十三、卦义","h":"\"居尊执柔\"与一句关于成败的判断","c":"要点——大有\"彖\"为\"**大有，柔得尊位，大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨**\"，其解：\"**此卦之所以为大有，乃因五以阴柔居尊位，又处以中庸大中之道，为诸阳所依归，上下相应——此'居尊执柔'，有虚中之象；卦德内刚健而外明理，处事顺乎天、应乎人，此所以元亨。**\" **而其后忽然接了一句与卦义无直接关系、却极深的判断**：\"**事于成后，方可见成败——败非先现于事前也。故有得后乃有所失；非得，则何言有失乎？**\" **这一句的逻辑是**：**\"失\"必须以\"得\"为前提**——**没有\"得\"过的人，谈不\"失\"**；**而\"败\"也只在\"成\"之后才显现**（**事前谈\"败\"是无对象的**）。**其现实意义很直**：**\"失败\"这个评价，只对\"已经做成过什么\"的人成立**；**故不必在未成之时先惧失败**——**这也正是后文\"无交害\"（未盛之时反无害）的哲学依据。** **须说明**：**这是讲义中的一段议论，非《易经》原文**；**本集照录，因为它与\"大有\"的主题（拥有与丧失）刚好扣上**：**\"大有\"者，先有\"得\"，才有\"失\"的可能**。","o":"TJ-0205 · 天纪·人间道·大有卦（PDF 第45页）"},{"t":"八十三、卦义","h":"\"遏恶扬善，顺天休命\"","c":"方法——大有\"象\"为\"**火在天上，大有；君子以遏恶扬善，顺天休命**\"，其解：\"**火因在天上，故能照见万物；君子观大有之象，故知治众之道，唯'遏恶扬善'——此能顺天命而安众民心，天子之道即如是。**\" **这一条把\"大有\"（拥有极多）与\"治众\"接上了**：**火在天上，其明及远，故能\"照见万物\"**；**而\"照见\"之后该做的唯一一件事，是\"遏恶扬善\"**（**抑止恶的，表彰善的**）。**其逻辑是**：**你有\"明\"（照见的能力）与\"势\"（居尊的地位），则你的首要责任不是\"分配财富\"，而是\"定是非\"**——**因为众人真正依赖的，是一个\"善恶有辨\"的环境**。**须说明**：**\"遏恶扬善\"是《易经》原文（大有象传）**；**其现代对应是\"规则与评价体系\"**：**一个组织或社会的\"大有\"，最终要靠\"什么被鼓励、什么被抑止\"来维持**——**若善恶不辨，则\"大有\"只是\"多\"，而不是\"治\"**。**这一条与前一章的\"遏恶扬善\"式判断（如履卦\"占位不进德者除之\"）是同一思路。**","o":"TJ-0206 · 天纪·人间道·大有卦（PDF 第45页）"},{"t":"八十四、六爻（大有遏恶扬善）","h":"初爻：\"无交害\"——富有本无罪","c":"风险——初爻\"**无交害，匪咎，艰则无咎**\"。其解是全卦最好的几句之一：\"**以阳刚之性处卑下之位，因未至于盛，故不有骄盈之虑；因无交往，故无害。人之富有于财或才，鲜不有害——富有本无罪，但人却皆因富有而招害，乃因处富有而不知思艰戒盛，则生骄侈之心，此所以生害也。**\"其\"象\"：\"**此即在大有之初始，即生戒心，须时思念艰难之时——此'居安思危'之来源，故能如此，则交亦无害也。故与人交往，持富有而骄，必生害也。**\" **\"富有本无罪，但人却皆因富有而招害\"这一句，把\"财与才\"的两面说透了**：**富与才本身没有问题，问题在\"处富有而不知思艰戒盛，则生骄侈之心\"**——**即：害不是从财富来的，是从\"有了之后忘形\"来的。** **而\"艰则无咎\"三字给了药方**：**\"艰\"是\"时思念艰难之时\"**（**记得难的时候**）。**须说明**：**这是《易经》原文（大有初九）**；**其判断可直接用**：**\"持富有而骄，必生害\"**——**这条对\"财\"成立，对\"才\"更成立**（**有才而骄，比有钱而骄伤人更深**）。","o":"TJ-0207 · 天纪·人间道·大有卦·初爻（PDF 第45页）"},{"t":"八十四、六爻（大有遏恶扬善）","h":"第二、三爻：大车以载与小人弗克","c":"要点——第二爻\"**大车以载，有攸往，无咎**\"：\"**此位以刚健之才，居于阴柔之位，而为六五君位所信任，故无灾。就如大车之材，强壮能载重物，可以任重行远，往而无灾。**\"其\"象\"：\"**大车能载重物，重物集中而不损败——言九二才力之强，能胜大有之重任。**\" **第三爻\"公用亨于天子，小人弗克\"**：\"**九三居下卦之上位，为诸侯之位；诸侯虽享有土地之富、人民之众，但仍属天子所有——此人臣之义。但小人居此位，则专其富有以为私，不知奉上以公之道。**\"其\"象\"：\"**诸侯能守臣节，忠顺奉上，慎养其众，为王之所征用；若小人处此位，则不知奉上之道，以所有为私有，故小人居此位则有大害也。**\" **这两爻对照得很清楚**：**第二爻是\"能载\"（有力量承担重任）**；**第三爻是\"能公\"（有富而不据为私有）**。**而\"小人弗克\"三字是全卦的关节点**：**\"弗克\"不是\"不能\"，是\"不肯\"**——**小人不是没有能力守臣节，而是不肯**（**\"专其富有以为私\"**）。**须说明**：**\"诸侯之富仍属天子\"是古代的封建伦理**；**其可抽出的原则是\"受托之权不得据为私有\"**——**这在任何代理、托管、职务场景中都成立**。**\"大车以载\"则给出另一条**：**才力强的人，其价值在\"能载重、能行远\"，而不在\"载得动就归自己\"。**","o":"TJ-0208 · 天纪·人间道·大有卦·第二、三爻（PDF 第46页）"},{"t":"八十四、六爻（大有遏恶扬善）","h":"第四爻：\"匪其彭\"——须谦损","c":"方法——第四爻\"**匪其彭，无咎**\"。其解：\"**九四阳刚居大有之时，因近君位，如处之太盛，则致凶；'彭'为盛大之义，须谦损，方为吉道。**\"其\"象\"：\"**明智之人，处此大有盛大之时，戒在咎之将至，以谦损态度应之，不敢至于极满招凶之道也。故无灾。**\" **这一爻讲的是\"离权力最近又拥有很多\"时的处置**：**\"如处之太盛，则致凶\"**——**问题不在\"多\"，在\"太\"**（**\"彭\"＝盛大**）；**而其解法只有两个字：\"谦损\"**（**主动减少、主动退让**）。**\"戒在咎之将至\"一句尤准**：**它的动作发生在\"咎未至\"之时**——**即：不是等出事了才收敛，而是在最盛的时候提前减损**。**须说明**：**这是《易经》的爻位义理**；**其现实对应极明确**：**位置越近核心、资源越多，\"太盛\"的风险越大**；**而\"谦损\"不是姿态，是实减**（**减权、减利、减曝光**）。**这一条与初爻\"艰则无咎\"、上爻\"满而不溢\"构成全卦的一条主线：**大有的正确姿势，是\"有而若不足\"**。**","o":"TJ-0209 · 天纪·人间道·大有卦·第四爻（PDF 第46页）"},{"t":"八十四、六爻（大有遏恶扬善）","h":"第五爻：\"厥孚交如，威如\"——柔中须有威","c":"风险——第五爻\"**厥孚交如，威如，吉**\"。其解是对\"柔\"的一次重要修正：\"**人君之位，以阴柔守之，以诚信待于下，下亦诚信待上，上下相交，此人心易安；但若专以柔顺，则必生侮慢之心，故以威信——故君子柔中有威，使下属有畏，其吉可知也。**\"其\"象\"：\"**上下相交以诚信，互相呼应；上位如无威严，则下属易生毁谩，故君须戒无威。**\" **这一条修正了本册前面反复出现的\"柔顺\"说法**：**\"若专以柔顺，则必生侮慢之心\"**——**柔顺不能是全部**；**它须有\"威\"作为底**（**\"柔中有威，使下属有畏\"**）。**这与师卦\"内须戒慎、外须统一专权\"、履卦九五\"夬履贞厉\"（即行正亦危）合起来，构成一组关于\"掌权\"的完整判断**：**太柔则人人轻慢，太刚则招凶**。**须说明**：**这是《易经》原文（大有六五）**；**其分寸是\"诚信为表、威严为底\"**——**不是\"凶\"，而是\"使人知有界\"**；**本集特别标出这一条，是因为前文多讲\"以柔畜刚\"，若只读那些，会误以为\"柔到底\"是对的**（**小畜上爻\"专任以柔制刚则凶\"已经否定了这一点，此爻再补一层**）。","o":"TJ-0210 · 天纪·人间道·大有卦·第五爻（PDF 第46页）"},{"t":"八十四、六爻（大有遏恶扬善）","h":"上爻：\"自天祐之\"——有极大之位而不为己有","c":"要点——上爻\"**自天祐之，吉，无不利**\"。其解：\"**此位乃大有卦之终极，仍明之极意。人唯至明，故不居于已有——有极大之位，而不为己有，则无盈满之灾；君能至此，则合于天道，得天之祐，则无往不吉。大同之世来矣。**\"其\"象\"：\"**大有至极处本有变化，但由所为皆顺天合道，此君子'满而不溢'，故天祐之。**\" **这一爻给出了\"大有\"的最高形态**：**\"有极大之位，而不为己有\"**——**手里有，心里不据为私**。**而\"不居于已有\"四字是它的机理**：**\"居\"是\"据守\"，\"已有\"是\"已经拥有的\"**——**一旦\"居\"于已有，就有了\"盈满之灾\"**；**故\"不居\"才是长久之道**。**\"满而不溢\"四字，是这一爻的准确概括**（**满，但不满到流出来**）。**须说明**：**这是《易经》原文（大有上九）**；**\"自天祐之\"在后世被解为\"天道助顺\"**，**其核心不是\"神助\"，而是\"顺天合道则无往不吉\"**——**即：祐来自\"所为皆顺天合道\"，而非来自某个超自然的力量**。**本集在全章末标一条**：**这一句与前章否卦\"其亡其亡，系于苞桑\"、泰卦\"艰贞无咎\"合成《易经》三处\"居安思危\"的经典表述**——**而三处的解法竟然一致：不是\"加固防线\"，而是\"不据为私有、不过盛、不忘危\"。**","o":"TJ-0211 · 天纪·人间道·大有卦·上爻（PDF 第46页）  ---"},{"t":"八十五、卦象（谦卦山居地下）","h":"山居地下：谦的本义","c":"定义——谦卦（地山谦）为\"**地中有山之课，仰高就下之象**\"，其卦序与卦体：\"**大有至终必不可盈满，故圣人次序卦为谦。**\" **其卦体之解极准**：\"**外卦为地，内卦为山，即山居地下——山乃至高大之物，而今居地下；此'处卑'乃谦之象，亦示人有崇高之至德而处卑下，乃尽谦之义。**\" **\"山居地下\"这四个字，是\"谦\"最准确的取象**：**山是\"至高大之物\"，却被放在地下**。**故谦不是\"没有本事\"（那是\"地\"），而是\"很有本事而甘居其下\"（那是\"地中有山\"）**。**这一点区分极重要**：**世人常把\"谦\"误解为\"自贬\"**，**而卦象明说\"内实高大\"**（**见象辞条**）。**须说明**：**《易经》六十四卦中，谦卦是唯一六爻皆吉的卦**（**本集此章的六爻亦无一句凶辞**）——**这一现象历来被视为\"谦\"的分量所在**；**其\"吉\"的共同点不是\"运气好\"，而是\"不招忌\"**（**见卦图条\"不知谦下自晦，果必招讼\"**）。","o":"TJ-0212 · 天纪·人间道·谦卦（PDF 第47页）"},{"t":"八十五、卦象（谦卦山居地下）","h":"卦图：\"三人脚下乱丝\"与假谦","c":"风险——谦卦图有四物，其中一处是全册对\"假谦\"最生动的一次刻画。**①\"月当天：清明之政，中秋时也\"**；**②\"一人骑鹿：才禄俱备\"**；**③\"三人脚下乱丝，隐于山后：小人不敢正面示人，惟隐'谦'之后（即外饰谦为幌子），实则乱如麻、计无所出\"**；**④\"贵人捧镜：明镜高悬，执法公正光大\"**；**⑤\"文字上有公字：处事以公，得理也\"**。**其总断极狠**：\"**不知谦下自晦，果必招讼也。**\" **第三物\"三人脚下乱丝，隐于山后\"是全章最值得记的一条**：**\"隐于山后\"——山正是谦卦的象**，**故\"隐于谦之后\"就是\"拿谦作幌子\"**；**而\"脚下乱丝\"是真相——里面乱得一团麻，\"计无所出\"**。**即：有一种人，姿态极谦，内里极乱**；**其\"谦\"不是修养，是遮盖。** **而\"不知谦下自晦，果必招讼\"这一句，把谦与讼（争讼）连了起来**：**不知收敛（\"自晦\"）者，最终必招来争讼**（**这正好接上前章的讼卦**）。**须说明**：\"月当天＝清明之政\"\"一人骑鹿＝才禄俱备\"一类的断法属象数附会；**而\"隐于山后、脚下乱丝\"这一取象，是义理性的、可直接理解的**——**它给\"谦\"立了一个反面**：**真谦是\"内实而外卑\"，假谦是\"内乱而外饰\"。**","o":"TJ-0213 · 天纪·人间道·谦卦（PDF 第47页）"},{"t":"八十六、卦辞（谦卦山居地下）","h":"\"君子有终\"：小人不能有终","c":"要点——谦卦辞\"**谦：亨，君子有终**\"，其解把\"君子\"与\"小人\"在\"谦\"这件事上彻底分开：\"**有德而不居，为谦；人能以谦逊自处，无往不利。君子之志在达理，乐天命而无竞之心，但求内充，退让而不矜持——能安于谦，终身不易。小人则有欲必竞，此种人见有德之人必攻之；即令有人告之谦逊，但终不能宽行固守。故小人必不能有终也。**\" **这段的关键在\"有德而不居\"五字**：**谦的前提是\"有德\"**——**无德而谦，只是\"无力\"**；**有德而不居（不把德当资本），才是谦**。**而\"君子\"与\"小人\"的分界也在此**：**君子\"乐天命而无竞之心\"\"但求内充\"**（**向内充实**）；**小人\"有欲必竞\"\"见有德之人必攻之\"**（**向外争胜，且妒忌有德者**）。**\"即令有人告之谦逊，但终不能宽行固守\"一句极实**：**小人也知道谦好，但守不住**——**故\"有终\"（能坚持到底）才是\"君子\"的标记**。**须说明**：**这是《易经》原文（谦卦辞）**；**其判断可作自检**：**我的\"谦\"是\"不居\"（有而不据），还是\"不能居\"（想要而没得到）？** **这一问，正是\"君子有终\"与\"小人不能有终\"的分界。**","o":"TJ-0214 · 天纪·人间道·谦卦（PDF 第47页）"},{"t":"八十七、彖之四句","h":"天道、地道、鬼神、人道","c":"定义——谦卦\"彖\"中有四句并列，是全卦的骨架：**\"天道亏盈而益谦\"**（**天之道有日月五星，其随时盈晦，故能降气于地，生养万物**）；**\"地道变盈而流谦\"**（**地势如盈满，则必倾变而下陷**）；**\"鬼神害盈而福谦\"**；**\"人道恶盈而好谦\"**（**\"人情必恶人之盈满，好人之谦损，故圣人戒盈而劝人为谦也\"**）。**这四句的共同结构是\"盈／谦\"的对立**：**天、地、鬼神、人，四个层面都\"损盈而益谦\"**——**即：整个体系的法则是\"满者受损、谦者得益\"。** **而其总解一句极概括**：\"**凡盈满者，必有祸害，能谦损者，必有福祐之。**\" **须说明两处**：**（1）\"天道亏盈而益谦\"是《易经》原文，\"亏盈\"即\"减损盈满者\"**——**\"月满则亏\"是其最直观的例子**（**\"天道\"在此不是道德律，而是\"循环律\"**）；**（2）\"鬼神害盈而福谦\"一句，讲义以\"形而上／形而下\"分论，认为\"天地之道可推理求之，鬼神人道可亲而见之\"**——**此说属其个人理解，本集照录，不作评价**；**而\"人道恶盈而好谦\"一句则纯是经验判断：人情厌满喜谦**——**这一条最容易验证**（**\"凡盈满者必有祸害\"在社会层面的对应，就是\"招忌\"**）。","o":"TJ-0215 · 天纪·人间道·谦卦（PDF 第47~48页）"},{"t":"八十七、彖之四句","h":"插入的医学批评（须单列）","c":"风险——\"鬼神害盈而福谦\"一段之后，讲义忽然插入一句与卦义无关的批评：\"**犹今之西医，其但知能如何除瘤用毒，不知损害之大，故后遗症之多，而自不见之。**\" **⚠ 本集把这一处单列，理由有三**：**（1）它不属于\"谦\"的义理**——**前一句还在讲\"凡盈满者必有祸害\"，此句却转向\"西医除瘤用毒\"，属硬插入，逻辑上并不衔接**；**（2）其批评失之笼统**——**现代肿瘤治疗有一套明确的疗效与不良反应评估体系**（**如实体瘤疗效评价标准、不良事件通用术语标准，以及以生存期与生活质量为核心终点的临床试验设计**）；**\"只知除瘤、不知损害\"这一概括，与这套体系不符**；**（3）但其担忧有真实的一面**——**过度治疗（如对晚期患者施以无获益的强化治疗）在各国都被承认是问题**，**近年\"缓和医疗\"\"去强化治疗\"的倡导，正是对这一问题的回应**。**故本集的处置是**：**保留原文（因为它是理解其思想的一处线索——他常把\"盈满必损\"的易理直接推为医学结论），同时标明三点：与卦义无关、概括过度、但其所指的\"过度治疗\"问题真实存在且已被主流医学认真对待。** **读者若据此对治疗产生疑虑，正确的做法是与主诊医师讨论治疗目标与不良反应管理，而不是放弃治疗**（**参本册\"全库导航\"章的安全声明**）。","o":"TJ-0216 · 天纪·人间道·谦卦（PDF 第48页）；对照：主流肿瘤治疗的疗效评价与不良反应管理体系"},{"t":"八十八、象与爻","h":"\"裒多益寡，称物平施\"","c":"方法——谦卦\"象\"为\"**地中有山，谦；君子以裒多益寡，称物平施**\"，其解：\"**高大之山在地下，故示人外卑下、内实高大，乃谦象。君子有过则损之，不足则益之，以之用于事，使万物皆平衡也。**\" **这一句给出了\"谦\"的两重内容**：**①状态**——**\"外卑下、内实高大\"**（**外与内的反差，正是\"地中有山\"**）；**②动作**——**\"裒多益寡\"（取多补少）、\"称物平施\"（衡量事物而平均给予）**。**即：谦不是\"把自己压低\"，而是\"把不平的东西调平\"**——**这是\"谦\"从\"个人修养\"走向\"公共作为\"的一步**。**须说明**：**\"裒多益寡，称物平施\"是《易经》原文（谦卦大象）**；**其现代对应是\"再分配与平衡\"**——**而\"称物\"（衡量）二字尤其重要**：**不是\"平均分配\"，而是\"按事物本身的分量来衡量\"**（**这与\"公正\"同义，与\"一刀切\"不同**）。**故这一条与前一章\"大有\"的\"遏恶扬善\"正好配成一组**：**一个定是非（遏恶扬善），一个调多寡（裒多益寡）**——**两者合起来，才是\"治众之道\"的完整内容。**","o":"TJ-0217 · 天纪·人间道·谦卦（PDF 第48页）"},{"t":"八十八、象与爻","h":"初爻与第二爻：\"卑以自牧\"与\"鸣谦\"","c":"方法——谦卦前两爻讲的是\"谦\"的两个阶段。**初六\"谦谦君子，用涉大川，吉\"**：\"**最卑下之位以柔态处之，又谦让也。能如是，君子也——即涉险难，必无凶也。**\"其\"象\"：\"**谦谦君子，卑以自牧也**\"——\"**君子以谦卑之道，于初入世间而自处之。**\" **第二爻（原文作\"六三\"，当是六二）\"鸣谦，贞吉\"**：\"**二位以柔顺居中，谦之德至此，则须明倡于外、见诸声色——坚心如此，吉也。**\"其\"象\"：\"**因中心能自得，山至大又能知谦，故吾人……**\"。**这两爻的递进很清楚**：**初爻是\"卑以自牧\"**——**入门之时，以谦卑自处（\"自牧\"＝自己管养自己）**；**第二爻是\"鸣谦\"**——**谦德到了这个位置，就要\"明倡于外、见诸声色\"**（**把谦的道理讲出来、做出来，让人看见**）。**这一递进极重要**：**谦不等于\"默默无闻\"**；**到了能影响他人的位置，\"谦\"须被说出来**——**因为不说出来，别人学不到，而\"盈满\"的风气就无人纠正。** **须说明**：**\"卑以自牧\"是《易经》原文（谦初六象）**；**\"鸣谦\"也是原文（谦六二）**——**两者合起来否定了\"谦＝不吭声\"的误解**：**先自牧，再鸣谦；先管住自己，再把道理讲出去。**","o":"TJ-0218 · 天纪·人间道·谦卦·初、二爻（PDF 第48页）  ---"},{"t":"八十九、劳谦","h":"第三爻：\"劳谦，君子有终\"","c":"方法——第三爻\"**劳谦，君子有终，吉**\"，是谦卦最著名的一爻。其解：\"**三为相位，以阳刚居之，上为君所任、下为民所从；能知劳而不居功，谦下待人——君子能行之至终，故吉。**\"其\"象\"：\"**劳谦君子，万民服也。**\" **\"劳谦\"二字的构造极准**：**\"劳\"是\"出力\"（上为君所任、下为民所从，是实打实地干活），\"谦\"是\"不居功\"**——**两者合起来才是\"劳谦\"**：**只劳不谦则骄，只谦不劳则空**（**回看前章\"谦\"的前提是\"有德\"：无德而谦只是无力**）。**而其后半段的批评极犀利**：\"**今上位掌权之人，尽皆示民其功勋为何，不知劳谦之美——此为小人之道长之时也。反之，能尽劳谦之道，必为君子。**\" **\"尽皆示民其功勋为何\"这一句，把\"邀功\"的形态写得很具体**：**不是\"我有功\"，而是\"把我的功勋展示给民众看\"**。**须说明**：**\"劳谦\"是《易经》原文（谦九三）**；**其判断可直接用**：**有实功而不表功，是这一爻的核心**；**而\"万民服也\"给出了它的结果**——**人服的不是\"功劳\"，是\"有功劳而不拿来压人\"。**","o":"TJ-0219 · 天纪·人间道·谦卦·第三爻（PDF 第48页）"},{"t":"八十九、劳谦","h":"第四爻：\"撝谦\"——让功于劳谦之臣","c":"方法——第四爻\"**无不利，撝谦**\"。其解：\"**四体居近君主之位；此时因六五之君以谦柔自处、九三之相位又因大功德为上所用——此当恭畏侍君，卑谦以让劳谦之臣；所有布施，均为谦也，切不可不利于谦。**\"其\"象\"：\"**六四因近君之位，又居劳谦臣之上，绝不可不利谦道，此得宜之法也。**\" **这一爻的位置很特殊：它\"近君\"（离权力最近），却\"居劳谦臣之上\"（下面有一个功勋卓著的人）**——**即：自己在高位，而真正的功劳在别人身上。** **其解法是\"撝谦\"（施予、推让之谦）：\"卑谦以让劳谦之臣\"**——**主动把位置与荣誉让给那个真出力的人。** **这与第三爻恰成一对**：**第三爻讲\"出力者不居功\"，第四爻讲\"居上位者让功\"**——**两边都退一步，中间就不生争**。**须说明**：**这是《易经》的爻位义理（谦六四）**；**其现实对应极明确**：**一个组织里最易生怨的结构，就是\"居上位者据功、出力者无名\"**——**此爻给的解法是\"让\"**（**不是\"分\"，是\"让\"**）；**而\"切不可不利于谦\"五字，是给高位者的警语**：**在这个位置上，任何一点\"不利谦\"的举动，都会立刻伤到那个真出力的人。**","o":"TJ-0220 · 天纪·人间道·谦卦·第四爻（PDF 第48页）"},{"t":"九十、谦之度","h":"第五爻：\"利用侵伐\"——谦不可专尚","c":"风险——第五爻\"**不富以其邻，利用侵伐，无不利**\"。其解极为关键：\"**富贵，众人所向往，以财来聚人；今五以居尊之君王，不以富而能得人亲，皆因知谦顺，乃能得天下。然须戒君道：切不可专尚谦顺，必须威柔并济，才能服天下——故易曰'利用侵伐'。威德并重，方为君道。**\"其\"象\"：\"**君王之道，须用征伐，其用谦德所不能服者；否则不能治天下，则为谦之过也。**\" **这一爻是谦卦的\"度\"，也是全章最重要的一处修正**：**\"切不可专尚谦顺\"\"必须威柔并济\"**——**谦不能是全部**；**而\"其用谦德所不能服者\"一句，划出了谦的边界**：**有些事，谦服不了，必须用\"征伐\"（强制）**。**而末句\"则为谦之过也\"五个字最重**：**谦过头，也是一种过错**。**这与前一章大有六五\"厥孚交如，威如\"（柔中须有威）是同一判断**：**两卦都在\"柔顺\"系列的末尾补上\"威\"**——**合起来是一句完整的话：柔顺可以服人，但不能服所有人、不能服所有时候。** **须说明**：**这是《易经》原文（谦六五）**；**\"侵伐\"在此不必照字面读作\"出兵\"**——**其现代对应是\"必要的强制手段\"**（**规则、处罚、边界**）；**而\"威柔并济\"不是\"既凶又软\"，而是\"该软时软、该硬时硬，且分得清何时该哪样\"。**","o":"TJ-0221 · 天纪·人间道·谦卦·第五爻（PDF 第48页）"},{"t":"九十、谦之度","h":"上爻：\"鸣谦，利用行师\"——极谦反成过","c":"风险——上爻\"**鸣谦，利用行师，征邑国**\"。其解：\"**上六处谦之极也。因极谦反居高位，为太过于谦；为倡明其谦，只有用刚武之道，于己之私有地征之——此因谦之太过而致如此。**\"其\"象\"：\"**因极谦又居上，其不适谦，故志不得伸，则鸣；唯宜以刚武自治其国内。**\" **这一爻是谦卦的\"反例\"**：**\"极谦\"而居高位，结果是\"不适谦\"（谦在这里不合适）**；**\"志不得伸，则鸣\"**（**志向施展不开，于是只好\"鸣\"——喊出来、表现出来**）；**而\"鸣\"的方式竟是\"利用行师，征邑国\"（对自家领地用武）**。**即：谦到了极处，反而必须以\"刚武\"来补**——**这不是\"谦的胜利\"，是\"谦的破产\"。** **须说明**：**这一爻历来解说不一**（**有解为\"上六以谦居极，故可用武以自治\"，亦有解为\"谦极则须以刚济之\"**）；**本集取其一致处**：**谦有它的适用边界，越过边界，\"谦\"这种姿态本身会成为问题的来源**。**而它与第五爻合成谦卦的完整判断**：**谦是好东西，但\"专尚谦顺\"是大问题（第五爻），\"极谦\"也是问题（上爻）**——**两爻合看，谦卦六爻虽无凶辞（此为六十四卦中唯一六爻皆吉者），却并不主张\"一味谦到底\"。** **这一点极重要**：**读《易经》的人常把谦卦读成\"越谦越好\"，而此二爻明确反对**。","o":"TJ-0222 · 天纪·人间道·谦卦·上爻（PDF 第48页）"},{"t":"九十一、转豫","h":"\"人有大量而又能谦，必豫\"","c":"定义——豫卦（雷地豫）为\"**凤凰生雏之课，万物发生之象**\"，其卦序之义一句说透了：\"**人有大量而又能谦，必豫；豫者，悦也。豫卦承大有及谦之序也。**\" **这一句把\"大有→谦→豫\"三卦连成了一条链**：**先\"大有\"（拥有很多）→再\"谦\"（不据为私有）→然后\"豫\"（悦）**。**即：真正的\"悦\"不是\"得到更多\"，而是\"有了很多而不被它压住\"**（**故\"大量而又能谦，必豫\"**）。**其卦体：\"上动而下又顺；以象言，阳之始，潜伏地下，及出于地，乃因动，即为雷，故雷出地上，有通畅和顺象。\"** **\"雷出地上\"这个意象极好**：**阳气在地下蓄了一冬，一旦破土而出，就是\"通畅和顺\"**——**这与前章\"屯卦\"（初生之难）恰成对照**：**屯是\"刚出生而难\"，豫是\"已出地而畅\"**。**须说明**：**\"豫\"在此读作\"悦\"（《尔雅》\"豫，乐也\"），与之常被误解的\"犹豫\"\"豫备\"不同**（**《易经》卦名中此义须分清**）。","o":"TJ-0223 · 天纪·人间道·豫卦（PDF 第49页）"},{"t":"九十一、转豫","h":"彖：\"圣人以顺动，则刑罚清而民服\"","c":"要点——豫卦辞\"**豫：利建侯，行师**\"，其解：\"**圣人体豫悦之道，知兵师之兴、诸侯之封，必众心和悦方成；故能君临万邦、能群聚大众，唯和悦可也。**\" **彖中几句层层递进**：\"**豫，刚应而志行，顺以动，豫**\"（**动之顺理，众顺而回应，其志乃行**）；\"**豫顺以动，故天地如之，而况建侯行师乎**\"；\"**天地以顺动，故日月不为过，而四时不忒；圣人以顺动，则刑罚清而民服**\"——\"**天地之顺而动，吾人可视四季之行、日月运转永不为过；圣人禀此，而知'因正而民相争于行善'，刑清罚简，万民皆服。**\" **末句的机理极精**：**\"刑罚清而民服\"不是因为法轻，而是因为\"因正而民相争于行善\"**——**当正道行得通，人们忙着做好事，刑罚自然用得少**。**\"争于行善\"四字尤妙**：**它把\"竞争\"从\"争利\"转成了\"争善\"**（**回看前章履卦\"亿兆之心交相为利\"，其反面正是此处的\"相争于行善\"**）。**须说明**：**这是《易经》原文（豫彖）**；**其判断可作治理的判准**：**看一个环境好不好，不看它的罚则多不多，而看\"人们在争什么\"**——**争于行善，刑可清；争于逐利，法则必繁**（**这与前章\"立法复杂，民无所从\"正相呼应**）。","o":"TJ-0224 · 天纪·人间道·豫卦（PDF 第49页）  ---"},{"t":"九十二、时之分类","h":"十一卦的三种\"时\"","c":"定义——豫卦彖传之后，讲义插入一段关于\"时\"的分类，是全书对六十四卦结构最有用的一处说明：\"**圣人知豫而体用豫之道，故于时机之掌握大矣。此卦之下有十一卦：豫、遯、姤、旅，皆言'时'之义；坎、睽、蹇，皆言'时'之用；颐、大过、解、革，皆言'时'之大也。**\" **这三组的分法极清楚**：**①\"时之义\"**——**豫、遯、姤、旅**（**讲\"时机本身是什么\"：悦而顺动、退避、相遇、旅居，四种\"因时而行\"的状态**）；**②\"时之用\"**——**坎、睽、蹇**（**讲\"在不好的时势里怎么用\"：险、背、难，三种困境中的处置**）；**③\"时之大\"**——**颐、大过、解、革**（**讲\"时势的重大转折\"：养、过、解、变，四件大事**）。**这一分类的价值在于**：**它给六十四卦加了一个\"横切面\"**——**原来六十四卦不只是\"六十四种处境\"，其中十一卦是专门讲\"时\"的**（**而其内部又有\"义／用／大\"三个层次**）。**须说明**：**这一处分类是讲义作者的整理，非《易经》原文**（**但其所举十一卦，确多与\"时\"相关**）；**本集把它单列，是因为它提供了一条\"检索路径\"**：**遇事先问\"这是'时之义'（该不该动）、'时之用'（在难中怎么处置），还是'时之大'（面临转折）\"**——**三问一定位，卦就好找了。**","o":"TJ-0225 · 天纪·人间道·豫卦（PDF 第50页）"},{"t":"九十二、时之分类","h":"象：\"作乐崇德\"","c":"方法——豫卦\"象\"为\"**雷出地奋，豫；先王以作乐崇德，殷荐之上帝，以配祖考**\"，其解：\"**雷动出于地而奋震，悦之象也。先王作声乐以褒扬功德，归之上帝、祖先——此言豫之道：能知、能体，则盛而至大也。**\" **这一句把\"豫\"（悦）与\"乐\"接上了**：**雷出于地而奋震，是\"悦\"的自然之象**；**而人间的对应是\"作乐\"——用声乐来\"褒扬功德\"**（**\"崇德\"**），**并把它献给上帝与祖先**（**\"殷荐\"\"以配祖考\"**）。**即：乐的正当用途，是\"表彰功德、追念来源\"，而不是\"纵情娱乐\"**——**这一点与后文六五\"耽于酒色\"的批评正好构成一对**（**同是\"乐\"，一个\"崇德\"，一个\"沉溺\"**）。**须说明**：**\"作乐崇德，殷荐之上帝，以配祖考\"是《易经》原文（豫卦大象）**；**其现代对应是\"仪式与表彰\"**——**一个群体需要\"共同喜悦的时刻\"，但这个时刻应当指向\"值得表彰的东西\"，而不是纯粹的消遣**。**这一条的分寸，恰是整卦的题眼。**","o":"TJ-0226 · 天纪·人间道·豫卦（PDF 第50页）"},{"t":"九十三、六爻（豫卦介于石）","h":"初爻：\"鸣豫，凶\"——与\"鸣谦\"正相反","c":"风险——初爻\"**鸣豫，凶**\"。其解：\"**初六乃下位，阴柔处之，是意不中正之小人；处豫时，为上所宠，志得意满，乃至发声——小人之轻浅如是，必至凶也。**\"其\"象\"：\"**初六处下而骄鸣，虽外饰喜悦，实乃穷极而凶。**\" **这一爻与谦卦第二爻\"鸣谦，贞吉\"恰成一对**：**同样是\"鸣\"（发声、张扬），一个\"贞吉\"，一个\"凶\"**。**其别在于内容**：**\"鸣谦\"是\"鸣其谦\"（把谦德讲出来，使风气得以纠正）；\"鸣豫\"是\"鸣其悦\"（把得意表现出来，使人看见自己受宠）**。**而\"为上所宠，志得意满，乃至发声\"这一句，把\"鸣豫\"的起因说得很准**：**不是自己有成就，而是\"受宠\"之后忍不住**。**须说明**：**这是《易经》原文（豫初六）**；**其判断可作识人**：**身处低位而急于一鸣者，其\"鸣\"的依据若只是\"上宠\"，则此爻已言其结局**（**\"实乃穷极而凶\"——外饰喜悦，内里已空**）。","o":"TJ-0227 · 天纪·人间道·豫卦·初爻（PDF 第50页）"},{"t":"九十三、六爻（豫卦介于石）","h":"第二爻：\"介于石，不终日\"——全卦最好的一条","c":"方法——第二爻\"**介于石，不终日，贞吉**\"，是豫卦最好的一条。其解：\"**豫悦之道，易流放纵，过则失正道，乃不合于时。此六二本阴位，今阴爻居位，乃处中正，为自守之象；君子处豫之时，独其能以中正自守，示出其'节介如石之坚'也，故吉。能见事于几微者，谓之神妙——君子之人'上交不谄，下交不渎'，因能知微，吉凶之始，可先见于始也；守坚如石，则能不惑而明。**\"其\"象\"：\"**人能中正且守坚，故能辨之于早——此君子处豫之道。**\" **这一爻有三层，层层都可用**：**①\"介于石\"**——**在欢乐的氛围里，操守硬如石头**（**\"豫悦之道易流放纵\"，故此时最需要\"硬\"**）；**②\"不终日\"**——**不用一天就能辨明**（**\"能辨之于早\"**，即在事情刚露苗头时就看出来）；**③\"上交不谄，下交不渎\"**——**对上不谄媚、对下不轻慢**。**这三层合起来，是\"在顺境中保持清醒\"的完整方法**。**须说明**：**\"介于石，不终日，贞吉\"是《易经》原文（豫六二）**，**也是《系辞》中被孔子赞赏的一爻**（**\"知几其神乎\"即由此出**）；**其核心是\"知微\"**——**在欢愉之时，最需要的不是\"享受\"，而是\"看见刚开始的那个兆头\"。** **这一条与前章\"坤卦履霜坚冰\"（辨之不早辨）是同一条线的两端**：**一个讲\"不早辨则至于坚冰\"，一个讲\"辨之于早则吉\"。**","o":"TJ-0228 · 天纪·人间道·豫卦·第二爻（PDF 第50页）"},{"t":"九十三、六爻（豫卦介于石）","h":"第三爻：\"盱豫\"——眼睛一直往上瞟","c":"风险——第三爻\"**盱豫，悔；迟有悔**\"。其解：\"**六三乃以阴而居阳位，为不中不正之人居相位也；如此动则有悔。盱为上视也——其动竟上视君侧之人，故不中不正，悔之始也。是故君子明处身不正，进退皆有悔矣。处己之道，在正本身而已；以礼制心，即处豫却不失中正，则无悔矣。**\"其\"象\"：\"**因自处不当，失却中正，造成进退有悔——处不当位也。**\" **\"盱\"（仰视）这个动作，是全册对\"攀附\"最形象的一次刻画**：**身处相位，眼睛却一直往上看（看上头的人）**——**\"其动竟上视君侧之人\"**。**而其结果写作\"悔；迟有悔\"**：**已经悔了，而\"迟\"（再拖下去）还有悔**——**即：越晚改，悔越重。** **而它给的解法是\"以礼制心\"**：**不是\"不要往上爬\"，而是\"用礼来约束心里的那个念头\"**。**须说明**：**这是《易经》原文（豫六三）**；**其对\"攀附\"的判词很直接**：**\"处身不正\"者\"进退皆有悔\"**——**上不去、也退不下，两头都是悔**。","o":"TJ-0229 · 天纪·人间道·豫卦·第三爻（PDF 第50页）"},{"t":"九十三、六爻（豫卦介于石）","h":"第四爻：\"由豫，朋盍簪\"——至诚则无疑","c":"方法——第四爻\"**由豫，大有得；勿疑，朋盍簪**\"。其解：\"**九四乃君侧之位，动则众阴悦顺，此豫之义。豫悦之由，以阳刚而任此位，大行其志，而天下皆悦。人能尽诚则无疑；上下因至诚而信，合而聚之——簪，乃聚发之物。**\"其\"象\"：\"**志得大行于天下，乃皆由聚所悦也。**\" **\"朋盍簪\"这个比喻极妙**：**簪是\"聚发之物\"（把散乱的头发拢在一处的那个东西）**——**即：真正的聚合，不是靠绳子捆，而是靠\"一个东西把散的东西自然拢起来\"**；**而这个东西就是\"至诚\"**（**\"人能尽诚则无疑；上下因至诚而信，合而聚之\"**）。**须说明**：**\"由豫，大有得；勿疑，朋盍簪\"是《易经》原文（豫九四）**；**其判断与\"比卦\"\"同人\"一脉相承**：**能聚人的不是利益，是\"无疑\"（彼此不猜）**——**而\"无疑\"的来源是\"尽诚\"**。**这一条可与前章\"王用三驱，失前禽\"\"往者不追，来者不拒\"合读**：**三条给出了聚人的三种方式：不强求（三驱）、不攀附（自内）、不猜疑（尽诚）。**","o":"TJ-0230 · 天纪·人间道·豫卦·第四爻（PDF 第50页）"},{"t":"九十三、六爻（豫卦介于石）","h":"第五爻：\"贞疾，恒不死\"——纵情于乐者的下场","c":"风险——第五爻\"**贞疾，恒不死**\"。其解是豫卦对\"沉溺\"最重的一次批评：\"**六五为君位，当豫悦之时，阴柔有沉溺之象，故乃柔弱不能自立、且耽于酒色之豫道，受制于专权之臣；因受制于下，故有疾苦。古今人君致危之道很多，但以纵情于乐居多，岂有不死乎？**\"其\"象\"：\"**君位有疾，乃因侧位专权之人压制也；如能不死，乃因侧位之刚为中正，方不致于亡。**\" **这一爻的判断分两层**：**①\"疾\"的来源**——**\"耽于酒色\"\"柔弱不能自立\"→\"受制于专权之臣\"→\"有疾苦\"**（**即：沉溺导致失权，失权导致受制，受制就是病**）；**②\"恒不死\"的原因**——**\"因侧位之刚为中正，方不致于亡\"**（**即：还能活着，靠的是旁边那个掌权的人还算中正**）。**而\"古今人君致危之道很多，但以纵情于乐居多，岂有不死乎\"这一句，是全书对\"亡国之道\"最直接的一次统计式判断。** **须说明**：**这是《易经》的义理（豫六五）**；**其可用的核是\"沉溺的结构\"**：**享乐本身不是问题，\"柔弱不能自立\"才是**——**一旦\"不能自立\"，权柄必然旁落，而\"是否还能活\"就取决于接手者的品性**（**此即\"恒不死\"的真正含义：命在别人手里**）。**这一条与\"象辞作乐崇德\"形成全卦的收口**：**同是\"乐\"，\"崇德\"则盛，\"纵情\"则亡。**","o":"TJ-0231 · 天纪·人间道·豫卦·第五爻（PDF 第50页）"},{"t":"九十三、六爻（豫卦介于石）","h":"上爻：\"冥豫，成有渝，无咎\"","c":"方法——上爻\"**冥豫，成有渝，无咎**\"。其解：\"**豫之极，而以阴柔居之——乃圣人示意：凡人之失，苟能自变，则亦可以无咎，此为君子；如昏迷不知反省，必招凶。**\"其\"象\"：\"**昏冥于豫悦，乃至于终极，灾难至矣，不可长久，君子当速变。**\" **\"冥豫\"（昏冥于享乐）是豫卦的最坏状态**，**但这一爻给了一条出路**：**\"苟能自变，则亦可以无咎\"**——**只要肯自己改，还能无咎**。**而\"成有渝\"三字是关键**：\"**渝\"＝变**（**\"成\"＝已成之局**）；**即：已成之局，仍可变。** **须说明**：**这是《易经》原文（豫上六）**；**其分寸须讲清**：**\"无咎\"不等于\"无代价\"**（**\"灾难至矣，不可长久\"已经写在前头**）——**它说的是\"还来得及\"，不是\"不受损\"**；**故\"君子当速变\"五字须落实在\"速\"上**。**这一条可作为整卦的收尾**：**豫（悦）本身不俗**（**\"雷出地奋\"\"作乐崇德\"都是正面的**）；**问题全在\"度\"与\"自立\"**——**二爻\"介于石\"是正面的极端，五爻\"耽于酒色\"、上爻\"冥豫\"是反面的极端，而\"能自变\"是唯一的退路。**","o":"TJ-0232 · 天纪·人间道·豫卦·上爻（PDF 第50页）  ---"},{"t":"九十四、卦象（随卦随时之义）","h":"如水推车：豫之后必有随","c":"定义——随卦（泽雷随）为\"**良士琢玉之课，如水推车之象**\"，其卦序与卦体：\"**豫悦之道，人必皆随之，故豫之后有随。震为雷，兑为泽，雷震于泽中，泽随雷而动，此随之义。以阳而下阴，阴乃随阳，此阴阳不易之理。**\"（**其象又标为\"外悦内动\"\"下动上悦\"**）。**这几句把\"随\"的两个方向都讲到了**：**①\"泽随雷而动\"**——**下位者随上位者**；**②\"以阳而下阴，阴乃随阳\"**——**而阳（刚）反过来\"下\"于阴，即尊贵者对下随**。**即：\"随\"不是单向的\"下从上\"，而是\"上下互相随\"**（**故卦辞能得四德**）。**\"如水推车\"这个比喻也妙**：**水推车走，不是强推，是顺势**。**卦图六物**：**①\"云中雁传书：飞来喜讯象\"**；**②\"一堆钱：财聚也\"**；**③\"朱门内有人坐：君王之象，必见君面也\"**；**④\"一人在门外立：乃士人求仕，受尊重之象\"**；**⑤\"串钱在地：有用利不行之象\"**；**⑥\"乱珠聚盆：先聚后散之象\"**。**其总断：\"礼仪得体，有见速喜之象。\"** **须说明**：\"一堆钱\"\"朱门有人坐\"\"见速喜\"一类的断法属象数附会；**\"串钱在地＝有用利不行\"\"乱珠聚盆＝先聚后散\"两个取象则可独立理解**（**钱串在地上（串着但没用）、珠子先聚在盆里而后散**）。","o":"TJ-0233 · 天纪·人间道·随卦（PDF 第51页）"},{"t":"九十四、卦象（随卦随时之义）","h":"卦辞：\"元亨利贞\"——四德俱全的少数之一","c":"要点——随卦辞为\"**随：元，亨，利，贞，无咎**\"。**\"元亨利贞\"四德俱全的卦极少**（**乾坤之外，随卦是其中一例**），**故其解须细看**：\"**随之道，可以致大亨通。君子之道，众人所随；又遇事择所随——随能得道，必致大亨。今人君之从民意、臣下之从君意，人人随从义，利在坚守随义；随因能正，其道必亨。小人群聚，此随失正，岂不招凶乎？**\" **这段给了\"随\"的两件事**：**①\"众人所随\"**——**你有可随之德，故人来随你**；**②\"遇事择所随\"**——**你在事上选择跟随谁**。**两件事都做对了，才叫\"随能得道\"。** **而\"利在坚守随义\"与\"随因能正\"两句是关键词**：**\"随\"的\"利\"不在\"跟对了人\"，而在\"守住随的义\"**（**即：跟的是\"义\"，不是\"人\"**）。**末句\"小人群聚，此随失正，岂不招凶乎\"则是它的反面**：**小人聚在一处\"互相随\"，因为没有\"义\"作轴，只是\"失正的随\"**。**须说明**：**这是《易经》原文（随卦辞）**；**其判据可提炼为一句**：**看一个\"随\"是正还是邪，看它随的是\"义\"还是\"人\"**——**随义者，虽换人亦不亂；随人者，人一变则全变。**","o":"TJ-0234 · 天纪·人间道·随卦（PDF 第51页）"},{"t":"九十五、随时","h":"\"随时之义大矣哉\"","c":"要点——随卦彖中有一句被单独提出：\"**随时之义大矣哉**\"。其解是全书对\"当世\"最锐利的一次批评：\"**君子之道，随时而变，因时制宜。今世昏蒙不明，凡事皆表明里暗，是故民之所随，未能适中，常受谣言、外饰所惑，随而必枉，受奸人利用。**\" **这一段的结构极清楚**：**①正面的\"随时\"**——**\"随时而变，因时制宜\"**（**注意：这不是\"随波逐流\"，而是\"因时\"而\"制宜\"——制的是\"宜\"，即恰当的做法**）；**②当下的病**——**\"凡事皆表明里暗\"**（**表面亮堂、内里昏暗**）；**③后果**——**\"民之所随未能适中，常受谣言、外饰所惑，随而必枉，受奸人利用\"**。**\"受谣言、外饰所惑\"七个字，几乎是对信息时代的一句预言**：**人们所\"随\"的对象，往往是被\"外饰\"（包装）与\"谣言\"塑造出来的**。**须说明**：**这是《易经》彖传原文加讲义之解**；**\"随时\"与\"随人\"的分界正在此处**：**\"随时\"是\"因时制宜\"（看清形势而后定做法），\"随人\"是\"受惑而随\"（被人牵着走）**——**前者主动，后者被动**。**本集取此条为随卦的核心，因为它把\"随\"从\"服从\"提升成了\"判断\"。**","o":"TJ-0235 · 天纪·人间道·随卦（PDF 第51页）"},{"t":"九十五、随时","h":"象：\"向晦入宴息\"","c":"方法——随卦\"象\"为\"**泽中有雷，随；君子以向晦入宴息**\"，其解：\"**泽随雷震而动；君子昼则自强不息，夜则入居内安其身——起居作息随天时，乃宜也。**\"并引《礼》：\"**君子昼不居内，夜不居外，此随时之道。**\" **这一条是\"随时\"最日常、也最可执行的一层**：**天时是\"昼／夜\"，人的对应是\"自强不息／入宴息\"**。**\"向晦入宴息\"（天暗了就进屋休息）五字，讲的是一件极朴素的事：该动的时候动，该停的时候停。** **而\"昼不居内，夜不居外\"两句更具体**：**白天不该窝在里屋（该出去做事），夜里不该留在外面（该回家歇着）**。**须说明**：**这是《易经》原文（随卦大象）**；**其价值在于把\"顺应天时\"落到了具体的作息上**——**这一条与本书医学部分\"六准则\"里的睡眠主张（\"每天睡时一觉到天亮\"）是同一套身体观的两面**：**一面讲\"顺时作息\"，一面讲\"以此判断身体状态\"**。**本集把它列为方法，因为它不需要信卦也能照做**，**而且它的依据（昼夜节律）在现代时间生物学中是明确的**（**昼夜节律紊乱与代谢、免疫、情绪问题相关，已有大量研究**）。","o":"TJ-0236 · 天纪·人间道·随卦（PDF 第51页）"},{"t":"九十六、六爻（随卦随时之义）","h":"初爻：\"出门交有功\"——爱之所见皆对","c":"风险——初爻\"**官有渝，贞吉；出门交有功**\"。其解：\"**官为守也；因所从随为正，故吉。出门交往多所亲爱者，因人心所从随也。常人之情：爱之所见皆对，恶之所见皆非——小人皆以私情而随从之，不合正理；君子出门交不以私，故所随皆有功也。**\" 其\"象\"：\"**所随从之道，须从正则吉；随从不正，招悔咎也。因交非因本身之私，其交必正，故不失。**\" **\"爱之所见皆对，恶之所见皆非\"这十二字，是全书对\"私情遮蔽判断\"最精的一句**：**喜欢的人做什么都对，讨厌的人做什么都错**——**这不是判断，是情绪的投射。** **而它的解法是\"出门交不以私\"**：**交往不带私情，则\"所随皆有功\"**。**须说明**：**这是《易经》原文加讲义之解**；**其判断在任何\"圈子\"里都适用**：**当一个人的评价随\"亲疏\"而变（同一件事，对自己人就\"有苦衷\"，对外人就\"不可恕\"），此爻已经说清了他在\"随\"什么**——**他随的是\"私情\"，不是\"正理\"。**","o":"TJ-0237 · 天纪·人间道·随卦·初爻（PDF 第51~52页）"},{"t":"九十六、六爻（随卦随时之义）","h":"第二、三爻：系小子与系丈夫","c":"方法——随卦的第三、四爻（原文标为六二、六三）构成一组正反对照。**第二爻\"系小子，失丈夫\"**：\"**六二为阴柔位，阴乃顺从、柔顺之意；但如顺随的对象为小人，则必失却君子之人——此因不能固守，圣人戒之。**\"其\"象\"：\"**人因所顺随为正道，邪恶必远也；但须戒：人若从于正，须专一，不可兼与。**\" **第三爻\"系丈夫，失小子；随有求得，利居贞\"**：\"**六三居相位，所固守本身之正，求上之随，有求必得，乃'上上随'也；如背是求非、舍君子从小人，为'下下之随'也。故君子之随，首先固守本身之正。**\"其\"象\"：\"**随之至善即在此：舍小人而从君子，人人如此，小人无所遁也；常自省而人之性乃从善如流，故将无小人矣。**\" **这两爻的关键在\"失\"字**：**\"系小子则失丈夫\"\"系丈夫则失小子\"**——**即：你跟随什么，就必然失去与之相反的东西**；**而这正是\"随\"的代价结构**（**\"不可兼与\"四字明说了这一点**）。**而\"上上随\"与\"下下之随\"的分级也很干脆**：**舍小人从君子为上上，舍君子从小人为下下**。**须说明**：**这是《易经》原文（随六二、六三）**；**其判断可作一次自查**：**我\"系\"的是什么？因此\"失\"了什么？**——**这两问比\"我该跟谁\"更能看清自己的位置。**","o":"TJ-0238 · 天纪·人间道·随卦·第二、三爻（PDF 第52页）"},{"t":"九十六、六爻（随卦随时之义）","h":"第四爻：\"随有获，贞凶\"","c":"风险——第四爻\"**随有获，贞凶；有孚在道以明，何咎**\"。其解：\"**因四位乃臣之极位，如随而有获，即正亦易招凶——皆因天下之心随于己。为臣之道，应使恩威出于上，众心能随于君；如让人心从己……**\"（**其后文在扫描件中未续，但其判断已完整**）。**这一爻的判断与\"乾卦\"\"坤卦\"的臣道一脉相承**：**位置到了\"臣之极\"（人臣的最高处），最危险的事不是\"做错\"，而是\"太得人心\"**——**\"如随而有获，即正亦易招凶\"**：**即使做得正当，只要\"获\"（得人心、得声望）过了界，也易招凶**。**其理由极准**：\"**皆因天下之心随于己**\"——**人心归你，就是君权的威胁**。**而其解法是\"有孚在道以明\"（以诚守道、以明自处）**，**以及\"使恩威出于上，众心能随于君\"**——**把恩与威都归于上位，让人心随君而不是随己**。**⚠ 须说明**：**\"恩威出于上\"在古代是君臣伦理，本集不作\"权术\"解**；**其可抽出的原则是\"代理者不经营个人声望\"**——**在受托的位置上，把成果与威信归于委托方，是自保与尽职的统一**。**这一条与乾卦\"亢龙有悔\"、坤卦\"含章可贞\"是同一判断的第三次出现。**","o":"TJ-0239 · 天纪·人间道·随卦·第四爻（PDF 第52页）  ---"},{"t":"九十七、成蛊","h":"山下有风：坏乱之象","c":"定义——蛊卦（山风蛊）为\"**三蛊食血之课，以恶害义之象**\"，其卦序：\"**因喜而随人者，必有事——无事何喜何随？故蛊以次随也。**\" **其卦体之解极准**：\"**山下有风，风在山下，遇山而回，使物乱，是为蛊象——蛊者，坏乱也。长女下于少男，长幼无序也，其乱可知。此卦象言成蛊之因，卦才专言治蛊之道。**\" **\"风在山下，遇山而回，使物乱\"这个取象，是全书对\"系统坏乱\"最好的比喻**：**风本来是流动的、清的，一旦被山挡住而回旋，就会\"使物乱\"**——**即：坏乱不是因为\"有风\"，而是因为\"风被挡住了\"**。**而\"长女下于少男，长幼无序\"是它的第二层**：**秩序错位（该在上的在下），也是\"蛊\"。** **最要紧的是末句：\"象言成蛊之因，卦才专言治蛊之道。\"**——**这一句说明了卦的结构**：**卦象告诉你\"怎么坏的\"，卦才（卦辞、爻辞）告诉你\"怎么治\"**。**须说明**：**\"蛊\"字本义为器中食物腐败生虫**（**卦名取此**）；**其现代对应是\"组织或制度的积弊\"**——**而\"遇山而回、使物乱\"正说明：积弊多生于\"流通被打断\"**（**信息不流通、权责不流通、人事不流通**）。","o":"TJ-0240 · 天纪·人间道·蛊卦（PDF 第53页）"},{"t":"九十七、成蛊","h":"卦图：\"钱在空中\"与\"男女相拜\"","c":"风险——蛊卦图有五物：**①\"孩儿在云中：有天官促成也，不求名利之人\"**；**②\"雁啣书：有消息至\"**；**③\"一鹿：有大利也\"**；**④\"钱在空中：此心中图利之象也\"**；**⑤\"男女相拜：男女相合，此为利而结合，非正婚也\"**。**其中两物是\"蛊\"的具体成因**：**\"钱在空中\"——钱悬在空中，够不着却看得见，正是\"心中图利\"的形状**；**\"男女相拜\"——\"为利而结合，非正婚也\"**。**这两物合起来，把\"蛊\"（坏乱）的人事根源点明了**：**图利之心与\"以利相合\"的关系**——**这与其前卦\"随\"的\"受谣言、外饰所惑，随而必枉，受奸人利用\"完全接得上**（**随之失正，即成蛊**）。**须说明**：**\"孩儿在云中＝不求名利之人\"是其中的正面取象**（**与\"钱在空中\"恰成一对**）；**\"一鹿＝有大利\"属象数附会**。**本集把\"钱在空中\"\"男女相拜\"两物单列，是因为它们给出的是\"成因\"（而非吉凶断语）**——**而蛊卦的结构正需要先看清成因**（**见前条\"象言成蛊之因\"**）。","o":"TJ-0241 · 天纪·人间道·蛊卦（PDF 第53页）"},{"t":"九十八、治蛊","h":"\"先甲三日，后甲三日\"","c":"方法——蛊卦辞\"**蛊：元亨，利涉大川；先甲三日，后甲三日**\"，是全卦最实用的一条。其解极完整：\"**甲为十干之首，意言事之始也。'先甲三日'，乃言治蛊之道：应先思其事之原，再思其事之后，乃知救弊之道——亦强调虑之深、推之远也。能善于救者，则前之弊可革；能善亲备者，则后利长久。此圣人之治蛊道。今人不明圣人先甲后甲之诫，虑浅而事近——故劳于救乱，乱不革；功未及成，弊已生矣。**\" **\"先甲三日，后甲三日\"这八个字，被解成了两件事**：**①\"先甲三日\"＝往前看（\"思其事之原\"）**——**这个弊端是从哪里长出来的**；**②\"后甲三日\"＝往后看（\"思其事之后\"）**——**改了之后会长出什么**。**两者合起来，才\"知救弊之道\"**。**而它对\"当代治法\"的批评极准**：**\"虑浅而事近——故劳于救乱，乱不革；功未及成，弊已生矣\"**——**想得浅、只顾眼前，结果是\"忙着救乱而乱不止，功还没成新弊又生\"**。**须说明**：**\"先甲三日，后甲三日\"是《易经》原文（蛊卦辞）**；**其现代对应就是\"治理积弊必须先溯因、后预后果\"**——**只改表症（虑浅）必反复（弊已生）**。**这一条与本书\"六准则\"式的判据思维相通**：**先弄清\"什么是正常\"，再判断\"哪里不正常\"**——**同理，先弄清\"这个弊端是怎么形成的\"，再动手**。","o":"TJ-0242 · 天纪·人间道·蛊卦（PDF 第53页）"},{"t":"九十八、治蛊","h":"\"终则有始，天行也\"","c":"要点——蛊卦\"彖\"中有一句极深：\"**先甲三日、后甲三日，终则有始，天行也。**\"其解：\"**有始必有终，终之后必有始，此天道也。圣人体始终之道，故能于事之始而探究其所以然，能于事之终而备其将然——此'先甲后甲'之虑，故能治蛊而天下亨。**\" **这一句把\"先甲后甲\"从\"方法\"提升到了\"天道\"**：**因为\"有始必有终、终之后必有始\"是循环的**，**故\"治蛊\"不是\"一次修好\"**——**每一轮\"治\"之后，新的\"始\"又会出现新的\"蛊\"**；**所以圣人的做法是\"于事之始探究其所以然\"\"于事之终备其将然\"**（**在开始时弄清成因，在结束时预备下一步**）。**须说明**：**这是《易经》原文（蛊彖）**；**其判断与\"泰否循环\"（泰久而必否）、\"其亡其亡系于苞桑\"（好转之后防再坏）完全同调**——**《易经》对\"治理\"的基本态度是\"这不是一次性工程\"**。**这一点极重要**：**它解释了为什么\"一改就好\"的方案往往不可靠**——**因为\"终则有始\"，改完必有新的问题。**","o":"TJ-0243 · 天纪·人间道·蛊卦（PDF 第53页）"},{"t":"九十八、治蛊","h":"彖：\"巽而止\"与\"天下治\"","c":"方法——蛊卦\"彖\"为\"**蛊，刚上而柔下，巽而止，蛊**\"，其解：\"**以卦而言，男虽少但居上，女虽长而在下，尊卑得正、上下顺理，治蛊之道也；故以巽顺之道治蛊，是以元亨。**\" 又：\"**蛊，元亨，而天下治也；利涉大川，往有事也**\"——\"**自古治乱者，能使尊卑上下之义正：在下为巽顺，在上有才能安定万事，如此则天下大治。如正遇天下坏乱之时，持治蛊之道而往济之，利也。**\" **这一处给出了\"治蛊\"的两个条件**：**①\"尊卑上下之义正\"**——**即：先恢复秩序（各在其位）**；**②\"在下为巽顺，在上有才能安定万事\"**——**下能顺（配合），上能定（有本事）**。**而其手段是\"巽顺之道\"**（**柔顺、渐进、不硬碰**）——**这与前章\"小畜\"\"比\"的\"以柔畜刚\"一脉相承**。**须说明**：**\"尊卑上下\"是古代等级语汇，本集不取其等级内容**；**其可抽出的核是\"权责各归其位\"**——**治理积弊的第一步不是\"换人\"，而是\"让每一层清楚自己该做什么\"，然后\"上能定、下能顺\"**。**\"往有事也\"（前往而有事可做）这一句则给了态度：遇到坏乱不是退，是\"往济之\"。**","o":"TJ-0244 · 天纪·人间道·蛊卦（PDF 第53页）"},{"t":"九十九、随卦之终","h":"九五：\"孚于嘉\"——随道之吉，唯随善耳","c":"要点——随卦九五\"**孚于嘉，吉**\"。其解极简而准：\"**此君位之人，得中正而固守，动随于善，大吉也。故此，从人君到平民，随道之吉，唯随善耳。**\"其\"象\"：\"**处中正之位，又中诚所随，必吉矣。**\" **\"随道之吉，唯随善耳\"八个字，是随卦全部六爻的总结**：**从君王到平民，\"随\"的吉只有一个来源——随的是\"善\"**。**这与卦辞\"利在坚守随义\"、六三\"上上随\"（舍小人从君子）完全一致**——**即：随卦不问你\"跟了谁\"，只问你\"跟的是不是善\"**。**须说明**：**这是《易经》原文（随九五）**；**其判断可作一句自问**：**我所随的，是\"人\"还是\"善\"？** **若答案是\"人\"，则人一变，我的\"随\"就无处安放。**","o":"TJ-0245 · 天纪·人间道·随卦·第五爻（PDF 第52页）"},{"t":"九十九、随卦之终","h":"上爻与九四：得民心者得天下，与位极逼上","c":"风险——随卦上爻\"**拘系之，乃从维之，王用亨于西山**\"。其解：\"**此柔顺而居随之极也。柔顺之随至极，虽有'过'之失，但如人心皆随，因有得民之随，仍有王道王业之成也——故能得民心者，得天下也。**\"其\"象\"：\"**随之道至此，乃穷尽也。**\" **而九四\"随有获，贞凶\"的后半段，讲义说得更明白**：\"**故君子居此，唯诚正于心、所动皆合于道，则可无悔。小人位极，用君王权，遂行其志，得民心又不归功于上——位极而逼上，势强而专权，随之过大矣。君子虽功大震主，但由于其正而心诚，故主随从而信之，何有灾？**\"其\"象\"：\"**近君之位，因追随而有得，虽有凶戒，但有中正之诚，则无灾，明哲保身也。**\" **这两爻合起来，给出了同一位置上的两种结局**：**同样是\"位极而得民心\"**——**小人\"不归功于上\"，结果\"位极而逼上，势强而专权\"，凶**；**君子\"其正而心诚\"，结果\"主随从而信之，何有灾\"**。**即：占凶与否，不在\"功大\"，在\"归不归功于上、心诚不诚\"。** **须说明**：**这是《易经》的义理（随九四、上六）**；**\"上六\"的解（\"得民心者得天下\"）与\"九四\"（\"位极逼上则凶\"）看似矛盾，实为一体两面**：**得民心是好事，但\"得民心而不归功于上\"就成了\"逼上\"**——**分界正在\"是否把功劳归于上面的授权者\"**（**这一条在当代的读法是\"代理者不经营个人声望\"，见前章**）。","o":"TJ-0246 · 天纪·人间道·随卦·第四、上爻（PDF 第52页）  ---"},{"t":"一百、总纲（蛊卦六爻）","h":"象：\"振民育德\"","c":"方法——蛊卦\"象\"为\"**山下有风，蛊；君子以振民育德**\"，其解：\"**风遇山而回，致物皆散乱，故为有事之象。君子观'有事'之象：在己则养德，在天下则济民——君子所事，此二者为最大。**\" **这一句把\"乱世该做什么\"压成了两件事**：**在己（对自己）——养德；在天下（对他人）——济民。** **注意它没有第三件**：**不是\"夺权\"、不是\"清算\"、不是\"恢复秩序\"（治理秩序是手段，不是目的）**。**\"君子所事，此二者为最大\"这九个字，是蛊卦全章的总纲。** **须说明**：**这是《易经》原文（蛊卦大象）**；**其现代可用的核是\"方向\"**：**在坏乱之中，先修自己（养德），再帮别人（济民）**——**这两件事都不依赖\"先拿回控制权\"**。**这一点与\"上九不事王侯\"（见本章末条）恰好呼应**：**即使不能做事，也仍有\"养德\"这条可走。**","o":"TJ-0247 · 天纪·人间道·蛊卦（PDF 第53~54页）"},{"t":"一百零一、干蛊","h":"初爻：\"干父之蛊\"——承担前任之弊","c":"方法——初爻\"**干父之蛊，有子，考无咎，厉终吉**\"。其解：\"**庶民之道，即'子干父蛊'之道。子能居其位而知正，则无灾；不然，则为父之累。故必惕厉为戒，终吉。初六为最下之道，故言子与父之关系。**\"其\"象\"：\"**子干父蛊之道，意在能承担父事；常怀惕厉，只敬其事，尽诚于父，则终吉。**\" **\"干父之蛊\"是蛊卦最核心的一个意象**：**\"干\"是\"整治\"，\"父之蛊\"是\"上一代留下的坏乱\"**——**即：你接手的是一个已经坏了的东西。** **而它给了两条**：**①\"居其位而知正\"**——**在其位、守其正**（**\"不然，则为父之累\"：做不好就是在连累上一代**）；**②\"常怀惕厉，只敬其事，尽诚于父\"**——**敬畏、专注、尽诚**。**须说明**：**这是《易经》原文（蛊初六）**；**其判断对\"接手烂摊子\"的人最直接**：**\"厉终吉\"——开始是\"厉\"（危险、艰难），结局才可能是\"吉\"**；**而\"意承考也\"（意在承接父事）四字是它的态度核心**：**你接的是\"事\"，不是\"位置\"。**","o":"TJ-0248 · 天纪·人间道·蛊卦·初爻（PDF 第54页）"},{"t":"一百零一、干蛊","h":"第二爻：\"干母之蛊，不可贞\"——对柔弱者的刚法不可用","c":"风险——第二爻\"**干母之蛊，不可贞**\"，是全卦最细的一条。其解：\"**妇人本阴柔，若子只顾强伸己阳刚之道，反逆之，则伤恩，所害大也；唯有屈下己意、柔顺将成，使之身正而事乃治，故曰'不可贞'。如同以阳刚之道辅柔弱之君，须尽诚竭忠，致使其于中道即可，不会有大做为的。**\"其\"象\"：\"**居臣位，不过刚，乃得干母蛊之道完整者。**\" **这一爻把\"同一件事、两种对象、两种方法\"讲清了**：**\"干父之蛊\"可以刚断（父为阳刚），\"干母之蛊\"不可刚断（母为阴柔）**。**理由极准**：**\"若子只顾强伸己阳刚之道，反逆之，则伤恩，所害大也\"**——**对柔弱者用刚法，伤的不是\"事\"，是\"恩\"（关系）**；**而\"恩\"一伤，事就再也办不成了。** **其解法是\"屈下己意、柔顺将成\"**：**把自己的主张放低，顺着对方的性子把事情拢过来**。**须说明**：**这是《易经》原文（蛊九二）**；**\"妇人本阴柔\"是古代的性别预设，本集只取其\"对象属性\"义**（**即：面对\"柔顺型\"的上级或合作者，硬来则伤恩**），**不取其性别判断**。**其现代对应很实用**：**同在\"整治积弊\"，对上位\"强势型\"者可以直陈利弊，对上位\"柔顺型\"者必须先护其体面**——**否则\"事\"未治，\"恩\"先断。**","o":"TJ-0249 · 天纪·人间道·蛊卦·第二爻（PDF 第54页）"},{"t":"一百零一、干蛊","h":"第三爻：\"小有悔，无大咎\"","c":"要点——第三爻\"**干父之蛊，小有悔，无大咎**\"。其解：\"**九三乃以阳刚之才居相位，克尽所事；虽以刚过而小有悔，但终无大灾。但如以事亲之道，则并非善事亲之人也。**\"其\"象\"：\"**此因刚而明断之才，虽刚因不失正，故终无灾。**\" **这一爻描写的是一种人**：**\"刚而明断\"的能臣**——**事情能办成（\"克尽所事\"），但因为太刚，会\"小有悔\"**。**而讲义的补充很值得记**：\"**如以事亲之道，则并非善事亲之人也**\"——**即：这种人适合\"办事\"，不适合\"侍亲\"**；**同样是\"干蛊\"，对外（办事）合格，对内（关系）不合格。** **须说明**：**这是《易经》原文（蛊九三）**；**\"小有悔，无大咎\"这个分寸很可参考**：**刚而能成事者，容许有\"小悔\"——不要为求\"无一丝摩擦\"而放弃\"明断\"**；**但\"无大咎\"的前提是\"不失正\"**（**\"虽刚因不失正，故终无灾\"**）。","o":"TJ-0250 · 天纪·人间道·蛊卦·第三爻（PDF 第54页）"},{"t":"一百零一、干蛊","h":"第四爻：\"裕父之蛊，往见吝\"——柔顺之才只可守成","c":"风险——第四爻\"**裕父之蛊，往见吝**\"，是蛊卦对\"用错人\"最清楚的一条。其解：\"**此柔顺之才而以正道处事，只能自守其道而已；若遇非正之事，因柔顺之本质，而无法矫正，故不能而招罢斥。**\"其\"象\"给出判断：\"**柔顺之才，守于宽裕之时可以；如要前行，则不可得也；再加其任务，必不能胜任之。圣人知柔顺之才可以守成，但不可用于发展——委之重任，必不成也。**\" **\"柔顺之才可以守成，但不可用于发展\"这十六字，是全册对\"用人\"最实用的一条**：**同样是\"好人才\"，放在\"守成\"的位置上绰绰有余（\"守于宽裕之时可以\"），放在\"开拓、纠偏、攻坚\"的位置上就\"必不能胜任\"**。**而其判断依据也很明确**：**\"若遇非正之事，因柔顺之本质，而无法矫正\"**——**柔顺的人遇到\"不正\"，会顺着走，不会顶回去**；**故\"裕\"（宽缓、包容）在平时是美德，在需要纠偏时就成了失职。** **须说明**：**这是《易经》原文（蛊六四）**；**其可用之处是做\"人—位\"匹配的一次核对**：**这个位置需要的是\"守\"还是\"开\"？** **若答\"开\"，则柔顺之才不可派**——**这不是贬低其能力，而是\"位\"的性质不同**。","o":"TJ-0251 · 天纪·人间道·蛊卦·第四爻（PDF 第54页）"},{"t":"一百零一、干蛊","h":"第五爻：\"干父之蛊，用誉\"——质柔之君只能承旧业","c":"要点——第五爻\"**干父之蛊，用誉**\"。其解：\"**此君位之人但质柔，但下应九二阳刚之位，意其能用阳刚之才为臣；但因本实阴柔，故可为承其旧业，而不能为开创事业之才。自古创业之事，非刚明之才不足以成事。不能用刚贤之人，只可以守旧祖业而已。**\"其\"象\"：\"**阴柔之君主，能承下阳刚之才；以在下位之贤而能用之，乃因此而声誉显。**\" **这一爻与第四爻构成一对**：**第四爻讲\"柔顺之人用在开创之位则败\"，第五爻讲\"柔顺之人居开创之位则只能守\"**——**两者的结论一致：柔顺可守、不可创。** **而其解法给了\"用誉\"**：**质柔者自己不能开创，但可以\"用阳刚之才为臣\"，且\"因能用之而声誉显\"**——**即：承认自己不能创，转而\"用能创的人\"，这也是一种\"治蛊\"。** **须说明**：**这是《易经》原文（蛊六五）**；**\"自古创业之事，非刚明之才不足以成事\"这一句是判据**（**\"刚\"是有决断，\"明\"是能看清**），**两者缺一不可**。**其现代读法很直接**：**若自知\"非开创型\"，正解不是\"硬撑\"，而是\"找到并把权交给开创型的人\"**——**\"用誉\"就是这个意思：名声来自\"用了对的人\"，不来自\"自己什么都行\"。**","o":"TJ-0252 · 天纪·人间道·蛊卦·第五爻（PDF 第54页）"},{"t":"一百零一、干蛊","h":"上爻：\"不事王侯，高尚其事\"","c":"方法——上爻\"**不事王侯，高尚其事**\"。其解：\"**上九乃居蛊之终，乃无事之地，处事之外。此应贤人君子不遇于时，应高洁自守，不可曲道以遁时——此进退合于道者也。**\"其\"象\"更重：\"**不臣事于王侯，因知无法施其志；此乃贤能之人，此可以为法则也。小人皆可曲道而顺行，背己逆天，只图权力名位，此不可法也。**\" **这一爻是蛊卦的出口**：**当\"治蛊\"已经没有位置可做（\"无事之地，处事之外\"），正解不是\"委曲求全\"，而是\"高洁自守\"**。**而\"不可曲道以遁时\"七字，分寸极准**：**不是\"消极避世\"，而是\"不肯弯道\"**——**\"进退合于道者也\"（退也是合道的）。** **而其\"象\"给了一个对照，很锋利**：**\"小人皆可曲道而顺行，背己逆天，只图权力名位，此不可法也。\"**——**即：能不能\"曲道顺行\"，恰好是分\"贤\"与\"小人\"的地方**；**贤者因为\"知无法施其志\"而不就，小人则\"曲道\"也要挤进去。** **须说明**：**这是《易经》原文（蛊上九）**；**它与\"初爻\"构成首尾**：**初一爻讲\"接手做事\"（承担），上爻讲\"不做也合道\"（自守）**——**即：治蛊有\"做\"的时机，也有\"不做\"的时机，两者都算\"干蛊\"。**","o":"TJ-0253 · 天纪·人间道·蛊卦·上爻（PDF 第54页）  ---"},{"t":"一百零二、卦象（临卦戒盛）","h":"以上临下：天下之事最近临者","c":"定义——临卦（地泽临）为\"**凤入鸡群之课，以上临下之象**\"，其卦序：\"**有事之后乃有可大之心——临者，大也，故序卦为临。为卦泽上有地，乃岸也，因与水相近，故曰临。天下之事最近临者，唯水与地。**\" **这一句把\"临\"字讲清了**：**\"临\"不是\"统治\"，而是\"靠近\"**——**\"泽上有地\"即岸与水相接，而\"天下之事最近临者，唯水与地\"（世间万物中彼此最贴近的，就是水与地）**。**故\"临民\"的核心是\"亲临\"（靠近），不是\"高踞其上\"。** **其\"图\"又点出\"临事\"义**：\"**临事——凡所面临的，皆有临之道。**\" **须说明**：\"临\"字在《易经》中兼有\"莅临（上对下）\"与\"面对（临事）\"二义；**本集取其\"靠近\"义为主**（**因大象\"教思无穷，容保民无疆\"讲的正是\"亲\"**）。**卦图六物中\"妇人乘风\"\"一车上有使旗\"（\"出使之象，以谋略可解灾\"）\"人射弓\"（外族入侵象）属象数取象**，**而\"人在山顶头\"\"一合\"两物与\"戒盛\"直接相关**（**见后条**）。","o":"TJ-0254 · 天纪·人间道·临卦（PDF 第54~55页）"},{"t":"一百零三、戒盛","h":"\"至于八月有凶\"——盛时即虑衰","c":"要点——临卦辞为\"**临：元，亨，利，贞。至于八月有凶。**\"，其中最要紧的正是末四字。其解：\"**二阳才刚生于下，圣人戒之于方盛——方盛而虑衰，则可以防自满、图其永久；衰而后戒，无及也。此乃'戒盛'之道。今人富而多骄，为安乐而坏纲纪，忘祸乱而任小人奸邪，皆因不知戒盛。**\"而彖的补充：\"**至于八月有凶，消不久也**\"——\"**此乃圣人知戒于盛时，不以自满，则凶不至也。**\" **\"戒盛\"二字，是临卦全部的重心**：**\"二阳才刚生于下\"——阳气刚开始长，此时正是\"盛\"的起点；而圣人就在这里给出警告**（**不是等到衰了才说）。** **理由极清楚**：\"**方盛而虑衰，则可以防自满、图其永久；衰而后戒，无及也**\"——**在盛时想到衰，还能防；衰了才想到戒，已经来不及。** **而它对\"今人\"的诊断也极准**：\"**富而多骄，为安乐而坏纲纪，忘祸乱而任小人奸邪，皆因不知戒盛**\"——**三个后果（坏纲纪、任小人、忘祸乱）都出自同一个原因：不觉得会衰。** **须说明**：**\"至于八月有凶\"是《易经》原文（临卦辞）**；**其\"八月\"为古历之数（一说指阳气消退之时）**，**本集不推其具体月份**；**其可用的核是\"时点\"**：**戒，必须戒在\"最盛\"的时候**。**这一条与\"泰卦\"\"大有\"\"谦卦\"的居安思危三条完全同调**（**已是第四次出现同一判断**）。","o":"TJ-0255 · 天纪·人间道·临卦（PDF 第55页）"},{"t":"一百零三、戒盛","h":"卦图：\"人在山顶\"与\"一合先成后破\"","c":"风险——临卦图中两物与\"戒盛\"直接对应：**③\"人在山顶头：盛极将衰，招困也，即将下坡也\"**；**⑤\"一合：先成后破象\"**。而其总断是全册对\"治乱循环\"最直的一句：\"**故自古天下安治，未有久而不乱者，皆因不能戒盛而已。**\" **\"人在山顶头\"这个取象极形象**：**山顶是\"最高处\"，也是\"再往前只能下坡\"的地方**——**\"盛极将衰\"不是\"快要衰\"，而是\"已经站在只能下坡的位置上了\"。** **而\"一合先成后破\"则给了\"过程\"**：**先成（合起来），后破（又分开）**——**即：合与成本身不含\"持久\"的保证。** **须说明**：\"自古天下安治，未有久而不乱者\"这一句是讲义作者的史观（**属概括判断，非史实统计**）；**但其指向的机制可独立理解**：**长期安定会使人失去\"戒\"的能力，而\"不戒\"正是乱的起点**。**本集把它列为风险条，是因为它给出的是\"最危险的位置\"**——**不是低谷，是山顶。**","o":"TJ-0256 · 天纪·人间道·临卦（PDF 第55页）"},{"t":"一百零四、临之道","h":"象：\"教思无穷，容保民无疆\"","c":"方法——临卦\"象\"为\"**泽上有地，临；君子以教思无穷，容保民无疆**\"，其解：\"**地与水之临近为至近；君子以此知临之道乃亲民如此，才能教导人民。有宽容保民之心，才能广大无穷的包容。**\" **这一句给了\"临\"的两件事，且都带\"无穷\"\"无疆\"**：**①\"教思无穷\"**——**教导之心没有尽头**；**②\"容保民无疆\"**——**包容与保全之心没有边界**。**注意两者的共同结构**：**都是\"没有上限\"**——**这恰好与\"戒盛\"相反**（**\"盛\"有限而必衰，\"教\"与\"容\"則无穷**）。**即：真正可以\"无穷\"的东西，不是权力与财富，而是\"教\"与\"容\"。** **须说明**：**这是《易经》原文（临卦大象）**；**其现代可用的核是\"投入对象\"**：**把精力投向\"教\"（使人有能力）和\"容\"（使人有余地）这两件事，它们不随\"盛衰\"而失效**。**这一条与\"蛊卦振民育德\"（在己养德、在天下济民）前后相接**：**蛊之后为临，讲的正是\"治完事之后该做什么\"**。","o":"TJ-0257 · 天纪·人间道·临卦（PDF 第55页）"},{"t":"一百零四、临之道","h":"初、二爻：\"咸临\"——至诚相感，非顺命而得","c":"方法——临卦初、二两爻皆为\"**咸临**\"。**初爻\"咸临，贞吉\"**：\"**初为卑下之位，而以正道与四位感应，为所信任而得行其志，故吉。**\"其\"象\"：\"**阳刚之志在于行正，志正也。**\" **第二爻\"咸临，吉无不利\"**：\"**九二居将位，能以阳刚之心临人、临事，不愧于人，吉无不利。**\"而其\"象\"极重要：\"**九二乃应于五之尊位，因以刚德之长，又得中道——此至诚相感而得吉，并非因顺上之命而得吉也。**\" **\"咸\"是\"感\"（感应），故\"咸临\"＝以\"感应\"的方式临下，而不是以\"权势\"的方式临下。** **而九二象辞的\"未顺命也\"四字是全卦最锋利处**：**\"并非因顺上之命而得吉\"**——**即：它的\"吉\"来自\"至诚相感\"（凭本事与诚意与人相感），不是来自\"听上级的话\"。** **须说明**：**这是《易经》原文（临初九、九二）**；**其判断可提炼为\"信任的两种来源\"**：**一种是\"上级任命的授权\"（顺命），一种是\"对方感到的诚意\"（相感）**——**前者会随人事变动而消失，后者不会。** **\"不愧于人\"四字也值得单记**：**临人临事，\"不愧\"是底线**（**不是\"让人满意\"，而是\"自己无可愧\"**）。","o":"TJ-0258 · 天纪·人间道·临卦·初、二爻（PDF 第56页）"},{"t":"一百零四、临之道","h":"第三爻：\"甘临\"——以甜言临下，失德","c":"风险——第三爻\"**甘临，无攸利；既忧之，无咎**\"。其解：\"**三居相位，柔阴居之，此居上位又不以中正临下——此失德也，不利。如能忧于此而立改之，则无灾也。**\"其\"象\"：\"**阴柔之人，处临人事不以中正，又居下之上，乃不适其位；如能知惧而忧之，则必自改，其灾不长也。**\" **\"甘临\"二字极准**：**\"甘\"是甜**——**以甜言蜜语、以讨好来\"临下\"**。**而其判词是\"无攸利\"（没有任何好处）**：**因为\"甘\"不是\"正\"**（**\"不以中正临下\"**）。**须说明**：**这是《易经》原文（临六三）**；**\"甘临\"在当代极常见**（**用许诺、用示好、用\"大家都是自己人\"来换取配合**），**而此爻给的判断是\"无攸利\"**——**它换来的配合不牢，且失掉了\"正\"。** **而其解法\"既忧之，无咎\"很宽**：**能\"忧\"（意识到这是问题）并立刻改，则\"咎不长\"**——**即：此爻不判死，只判\"早改为安\"。**","o":"TJ-0259 · 天纪·人间道·临卦·第三爻（PDF 第56页）"},{"t":"一百零四、临之道","h":"第四爻：\"至临\"——临道由近而生","c":"方法——第四爻\"**至临，无咎**\"。其解：\"**此临之至也——临道乃由近而生。此位居上之下，又切临于下，乃处近君之臣位；守正任贤，如亲临于下，则无咎。**\"其\"象\"：\"**居近君之臣，阴柔对之，为得正道，与下之刚贤相应，故能无咎。**\" **\"临道乃由近而生\"六字，是临卦对\"关系\"最关键的一句**：**\"临\"（靠近、面对）这件事，是从\"近\"开始的**——**不是从\"远\"（制度、命令、口号）开始的。** **而\"至临\"的位置很有意思**：**\"位居上之下，又切临于下\"**——**夹在中间（上面有君、下面有民）**；**其做法是\"守正任贤，如亲临于下\"**：**自己不越位（守正），用对人（任贤），然后亲自靠近下面（亲临于下）**。**须说明**：**这是《易经》原文（临六四）**；**其可用的核是\"中间层的方法\"**——**中层管理者既不能代表上面，也不能脱离下面；\"守正＋任贤＋亲临\"是它唯一稳妥的三件事**。","o":"TJ-0260 · 天纪·人间道·临卦·第四爻（PDF 第56页）"},{"t":"一百零四、临之道","h":"第五爻：\"知临\"——自认皆知者，正示其不知","c":"要点——第五爻\"**知临，大君之宜，吉**\"，是全卦最好的一条。其解：\"**以一人之身，君临天下之广，若皆以自任，必不能周于万事；如自认为皆知者，正明示其不知也。唯有能得天下之善、用天下之智者，则无所不周——这就是不以自认皆知，故其知乃可大。**\"其\"象\"：\"**君臣合道，皆因同气相求；君能倚任刚中之贤，则能成临之功，此'知临'之意。**\" **\"如自认为皆知者，正明示其不知也\"这一句，是全书对\"无知\"最漂亮的定义**：**一个人自称什么都知道，恰恰是他\"不知道\"的证据**。**而\"知临\"的\"知\"，指的正是知道自己的限度**：\"**唯有能得天下之善、用天下之智者，则无所不周**\"——**用别人的\"善\"与\"智\"来补自己的\"不周\"，这才叫\"知\"。** **须说明**：**这是《易经》原文（临六五）**；**它与苏格拉底\"我知道我一无所知\"属同一判断**（**中西方在此处完全相通**）；**其方法可操作**：**\"知临\"不是\"谦虚\"，是\"用天下之善、天下之智\"**——**即：把\"不知道\"变成\"找人\"的动力。** **这一条与\"蛊卦六五用誉\"（质柔者用阳刚之才而声誉显）是同一判断的两面。**","o":"TJ-0261 · 天纪·人间道·临卦·第五爻（PDF 第56页）"},{"t":"一百零四、临之道","h":"上爻：\"敦临\"——尊而应卑，高而从下","c":"方法——上爻\"**敦临，吉，无咎**\"。其解：\"**此位乃临之极位，以坤顺而居此位，乃'意尊而应卑，高而从下，尊贤取善'——此为敦厚之极也。皆因其能敦厚于顺刚，是以吉而无灾。**\"其\"象\"：\"**内心敦厚笃实，志顺于阳刚，其吉可知。**\" **\"意尊而应卑，高而从下\"八个字，是临卦的最高形态**：**位置最尊（\"意尊\"），却对下\"应\"（回应）；位置最高（\"高\"），却\"从下\"（听从下面）**。**而\"尊贤取善\"则是它的具体做法**：**尊重贤者、取用善者**——**不是\"我说了算\"，而是\"谁说得对就听谁的\"。** **须说明**：**这是《易经》原文（临上六）**；**\"敦\"＝厚**（**敦厚不是\"态度好\"，而是\"把自己放低而不失其厚\"**）。**这一条与\"谦卦山居地下\"完全同构**：**位越高而越能\"从下\"，才是\"厚\"**；**而\"敦临\"能\"吉无咎\"，正因为它把\"盛\"（极位）转成了\"从下\"（不盛）**——**即：它以\"降低自己\"化解了\"戒盛\"的难题**（**这一条把\"戒盛\"从\"警告\"变成了\"方法\"**）。","o":"TJ-0262 · 天纪·人间道·临卦·上爻（PDF 第56页）  ---"},{"t":"一百零五、观之义","h":"临之后有观：观看与\"被仰视\"","c":"定义——观卦（风地观）为\"**云卷晴空之课，春花竞发之象**\"，其卦序：\"**临者，大也；万物之成大，乃有可观，故观所以次临也。**\"（**临是\"大\"，事物长大了才\"值得看\"，故临之后为观**）。而其义分两向：\"**凡观视于物，即为观也。人君上观天道，下观民俗，为观之道。风行地上，遍触万物，乃周观之象。以阳刚在上，为群下所观，故观亦有'仰'之义。**\" **\"观\"这个字在卦中同时是两件事**：**①\"观\"——看别人（\"上观天道，下观民俗\"）**；**②\"被观\"——被别人仰望（\"以阳刚在上，为群下所观\"）**。**这一双重性正是观卦的题眼**：**居上位者既是\"观看者\"，也是\"被观看者\"**——**而讲义的重心在后一层**（**你做什么，下面都在看**）。**卦图五物**：**①\"日月当天：政治清明，普照大地，父母双全\"**；**②\"官人香案边立\"**；**③\"鹿在山上：得高禄之象\"**；**④\"金甲人：君侧之人也，护卫也\"**；**⑤\"执印秤：提印信而来授权也\"**。**须说明**：\"父母双全\"\"得高禄\"属象数附会；**而\"日月当天＝政治清明，普照大地\"可独立取义**（**\"普照\"即\"无所不照\"——正当观卦\"周观\"之义**）。","o":"TJ-0263 · 天纪·人间道·观卦（PDF 第57页）"},{"t":"一百零五、观之义","h":"卦辞：\"盥而不荐，有孚颙若\"","c":"要点——观卦辞为\"**观：盥而不荐，有孚颙若**\"，其解是全书对\"诚意\"最精确的一段：\"**人于祭祀之始、求神之时，心念最专精之时也。居上位者，正其仪表以为下民之观，当始与终皆能令民之观如初始之专精，则尽观之道也。今人至君位后，礼数繁多，致令人心散，精一不如初始也。**\" **\"盥而不荐\"须解**：**\"盥\"是洗手（祭祀开始），\"荐\"是献祭（后续程序）**——**\"盥而不荐\"指\"只看洗手那一段\"**，**因为那是\"心念最专精\"的一刻**。**而其引申极准**：**上位者让下面\"看\"的，应当是\"开始那一刻的专精\"，并且\"始与终\"都要保持它**——**即：不要让它在下半程散掉。** **而\"今人至君位后，礼数繁多，致令人心散，精一不如初始也\"这一句，是对\"仪式繁复导致诚意消散\"的直接诊断**：**礼数越多，人心越散**。**须说明**：**\"盥而不荐，有孚颙若\"是《易经》原文（观卦辞）**；**\"有孚颙若\"（诚敬而庄重）正是\"诚意\"的状态**；**其现代可用的核是\"一致\"**：**一个人被\"看\"的，不是他最好的一刻，而是他\"始终是否如一\"**。","o":"TJ-0264 · 天纪·人间道·观卦（PDF 第57页）"},{"t":"一百零五、观之义","h":"\"观天之神道，而四时不忒\"","c":"要点——观卦彖中有\"**观天之神道，而四时不忒；圣人以神道设教，而天下服矣**\"，其解：\"**天之道至神，故曰'神道'。圣人观天之运行四时，从无差错，其神妙如此；圣人体神之道而以设教，故天下服也。**\" **这一段讲的其实是\"可预期性\"**：**\"四时不忒\"（四季不失其序）之所以\"神\"，是因为\"从无差错\"**——**天不出错，人便信它。** **而\"圣人以神道设教\"的意思是**：**圣人模仿天的\"不出错\"，以此建立教化，天下便服。** **须说明**：**\"观天之神道，而四时不忒，圣人以神道设教而天下服矣\"是《易经》原文（观彖）**；**\"神道设教\"在后世被用作\"借神道以治民\"的权术解说**，**本集不取此解**——**此处\"神道\"明指\"天道运行之无差\"，其可用的核是\"以稳定取信\"**：**之所以\"服\"，不是因为说得好，是因为\"从无差错\"。** **这一条与\"临卦知临\"（用天下之智）、\"蛊卦先甲后甲\"（虑深推远）构成一组治理判断**：**取信于人，靠的是\"不出错\"与\"想得远\"，不是靠\"讲得漂亮\"。**","o":"TJ-0265 · 天纪·人间道·观卦（PDF 第57页）"},{"t":"一百零五、观之义","h":"象：\"省方、观民、设教\"","c":"方法——观卦\"象\"为\"**风行地上，观；先王以省方、观民、设教**\"，其解：\"**风行地上，能触万物；圣人体之，知巡省四方、观视民俗、设为政教——例如见奢则约之以俭，见奸则矫之以正，则民将观之。**\" **这一句给出了\"观\"的完整闭环**：**①\"省方\"（巡视四方）→②\"观民\"（看民俗）→③\"设教\"（据此立教）**。**而\"见奢则约之以俭，见奸则矫之以正\"两个例子极实用**：**教化不是\"讲道理\"，是\"针对性地纠偏\"**——**看到奢靡，就用俭来约束它；看到奸邪，就用正来矫正它**。**而末句\"则民将观之\"把方向又转回来了**：**你纠了偏，下面就会\"看\"（并跟着改）。** **须说明**：**这是《易经》原文（观卦大象）**；**其可用的核是\"顺序\"**：**先看（省方观民），再改（设教），而不是先改再看**——**这一条与\"蛊卦先甲后甲\"（先溯因）完全一致**：**两卦都把\"先看清\"放在\"动手\"之前。**","o":"TJ-0266 · 天纪·人间道·观卦（PDF 第57页）"},{"t":"一百零六、六爻（观卦盥而不荐）","h":"初爻：\"童观\"——看得浅，如童稚","c":"风险——初爻\"**童观，小人无咎，君子吝**\"。其解：\"**处最下之位，又为阴柔之本质，离阳刚过远，是故其观浅如童稚，故曰'童观'。小人观阳刚之道，不识君子之道，于观之初，反而无灾；如见君子亦昏浅如是，则可羞也。**\"其\"象\"：\"**此所观不明如童稚，此实小人也，故言小人之道。**\" **\"童观\"是对\"认知浅\"最客气的一种说法**：**\"其观浅如童稚\"**——**位置太低、离得（阳刚之道）太远，所以只能看个大概。** **而\"小人无咎，君子吝\"这个分寸极准**：**认知浅，对\"小人\"（本就不以此为目标的人）不算过错；但对\"君子\"（自称要明道的人）就是耻辱**——**因为标准不同。** **须说明**：**这是《易经》原文（观初六）**；**其判断可作一次自查**：**我在某件事上的认知\"如童稚\"，这本身不算错；但我若以\"懂\"自居，则此爻已给了判词。**","o":"TJ-0267 · 天纪·人间道·观卦·初爻（PDF 第57~58页）"},{"t":"一百零六、六爻（观卦盥而不荐）","h":"第二爻：\"窥观\"——从门缝里看","c":"风险——第二爻\"**窥观，利女贞**\"。其解：\"**观，乃少见而无甚明也。二居将位，而不能明见阳刚中正之道，则如女子之道——即见之不甚明，又能顺从者。将位之人，能如女子之顺从，则不失其正，故利。**\"其\"象\"则更重：\"**此即君子之人不能观见阳刚中正之大德，虽能顺从，乃同女子也，亦可羞也。**\" **\"窥观\"比\"童观\"又进一步**：**\"童观\"是\"看得浅\"，\"窥观\"是\"从门缝里看\"**——**看到一部分，而以为看到了全部**（**\"少见而无甚明也\"**）。**而其位置是\"将位\"**——**有职权、有资源，却\"不能明见\"**；**其表现为\"虽能顺从\"（听话、不越界），所以\"利\"**（**不出错**）。**须说明**：**这是《易经》原文（观六二）**；**\"虽能顺从，乃同女子也，亦可羞也\"一句含古代的性别预设**，**本集只取\"只知顺从、不知明辨\"之义**（**即：把\"听话\"当作\"看懂了\"，是\"窥观\"**）。**其现代读法很直接**：**在一个组织里，最危险的不是\"不懂\"，而是\"懂一半却以为懂了\"**——**因为前者会问，后者不会。**","o":"TJ-0268 · 天纪·人间道·观卦·第二爻（PDF 第58页）"},{"t":"一百零六、六爻（观卦盥而不荐）","h":"第三爻：\"观我生，进退\"","c":"方法——第三爻\"**观我生，进退**\"。其解：\"**柔质居相位，处观之时，其进退之道，乃为己者；虽非正，亦不为过也。**\"其\"象\"：\"**观己知生存之道，而以之进退，此未失道也。**\" **\"观我生\"三字是全卦的核心词，此处第一次出现**：**\"观\"的对象从\"外物\"转成了\"我生\"（我何以生存、我凭什么立身）**。**而此爻的判断很宽容**：\"**其进退之道，乃为己者；虽非正，亦不为过也**\"——**即：在这个阶段，\"为自己打算\"（考虑自己的进退）不算过错，因为\"观己知生存之道，而以之进退\"本身\"未失道\"。** **须说明**：**这是《易经》原文（观六三）**；**其分寸须讲清**：**它许可的是\"以自我认知决定进退\"，不是\"自私\"**——**区别在于：前者是先看清自己能做什么，再决定进退；后者是先保住自己，再谈别的事。** **这一条与后文九五\"观我生\"构成一对**（**一个观\"己之生存\"，一个观\"己之施政\"**）。","o":"TJ-0269 · 天纪·人间道·观卦·第三爻（PDF 第58页）"},{"t":"一百零六、六爻（观卦盥而不荐）","h":"第四爻：\"观国之光\"——怀才自守，因无明主","c":"方法——第四爻\"**观国之光，利用宾于王**\"。其解：\"**四虽阴柔居君侧之位，能观见国之光辉盛大，可见人君之道德也。此因九五君位为圣明之人，致令才德之士皆愿进朝廷辅佐，以济天下；反之，圣君因能用敬才德之人，则人才聚之。**\"其\"象\"最精：\"**君子怀才自守，乃因无明主也。既观见国之盛德光华，则志愿登进王朝，以行其道。**\" **\"君子怀才自守，乃因无明主也\"这十个字，是全书对\"人才何以不仕\"最准的一句**：**有才而不出，不是清高，是\"没有值得效力的人\"。** **而\"观国之光\"给出了\"值得效力\"的判据**：**不是看这个国家的\"强弱\"，而是看它的\"光\"（盛德光华）**——**即：看它是否\"明亮\"。** **须说明**：**这是《易经》原文（观六四）**；**其判断双向都成立**：**对个人，是\"无明主则自守，有明主则出\"；对组织，是\"能敬才德之人，则人才聚之\"**——**两边互为因果。** **这一条与\"蛊卦上九不事王侯\"（不遇时则高洁自守）应合读**：**两处都在讲\"出与不出\"的判断，而判据都是\"有没有可施其志的地方\"。**","o":"TJ-0270 · 天纪·人间道·观卦·第四爻（PDF 第58页）"},{"t":"一百零六、六爻（观卦盥而不荐）","h":"第五爻：\"观我生\"——视天下之俗而知己","c":"要点——第五爻\"**观我生，君子无咎**\"，是观卦最重要的一条。其解：\"**九五君位之人，体观之道，其视天下之俗而知己——若天下之俗不合乎君子之道，则是己之所为、政治必不佳，不可不怪自己。**\"其\"象\"：\"**人君欲观己之施政良否，当观于民；民俗善，则政化必善——此意即王弼云'观民以察己之道'。**\" **\"视天下之俗而知己\"七个字，是全书对\"责任\"最直接的一次表述**：**看到民风不好，不是怪民风，是\"知己\"——知道自己哪里没做好**。**而\"不可不怪自己\"更狠**：**不是\"可以自责\"，是\"不能不怪自己\"。** **须说明**：**这是《易经》原文（观九五）**；**王弼\"观民以察己之道\"一句被引在此处，其方向极清**：**民是\"镜\"，不是\"对象\"**——**用民来看自己，而不是用民来证明自己。** **这一条与\"临卦知临\"（自认皆知者正示其不知）、\"蛊卦振民育德\"（在天下则济民）构成一组**：**三处都把\"上位者\"的责任指向\"自己的不足\"，而不是\"下面的问题\"。** **本集认为这是《易经》人间道一脉最可取的部分。**","o":"TJ-0271 · 天纪·人间道·观卦·第五爻（PDF 第58页）  ---"},{"t":"一百零七、去间","h":"口中有物：噬嗑之所以为\"合\"","c":"定义——噬嗑卦（火雷噬嗑）为\"**日中为喜之课，顺中有物之象**\"，其卦序与卦体：\"**观之后而有来合者，所合者，噬嗑也。卦才中有一刚居，意为口中有物隔其上下，不得嗑状，必咬之则得嗑，故称'噬嗑'。以此理推而天下事：如天下有强梗或谗邪阻隔其间，使天下事不得合，当用刑法——小则惩戒，大则诛戮以除去，使天下得治。古今万物皆合而后遂成，如未合必有间阻；若君臣、父子、亲人、朋友有怨隙者，因谗言在其间也，除之则合。是故间隔为天下之大害。圣人体噬嗑之道，知此为天下之大用——能去天下之阻间，唯刑与罚。此卦二体明照而威镇，乃用刑之象。**\" **\"口中有物隔其上下，必咬之则得嗑\"这个比喻，把\"合\"的机制说透了**：**上下本来要合的，中间夹了个东西，就合不上；而\"咬\"（噬嗑）就是把那个东西去掉。** **而它把\"间隔\"扩大到了所有关系**：\"**君臣、父子、亲人、朋友有怨隙者，因谗言在其间也，除之则合**\"——**怨隙不是关系本身的问题，是\"中间有东西\"**。**故其结论是\"间隔为天下之大害\"。** **⚠ 须说明**：**原文\"大则诛戮以除去\"是古代刑罚语境，本集不取其\"诛戮\"义**（**现代法治下，去除阻隔靠法定程序与司法裁判，不靠私刑**）；**其可用的核是\"识别间隔\"**：**当一件事\"合不上\"，先找\"中间夹着的是什么\"**（**是谗言、是误解、是某个不该在此的人或制度**），**而不是先怪\"上下不合\"。**","o":"TJ-0272 · 天纪·人间道·噬嗑卦（PDF 第59页）"},{"t":"一百零七、去间","h":"卦辞：\"利用狱\"","c":"要点——噬嗑卦辞为\"**噬嗑：亨，利用狱**\"，其解：\"**此即天下之事不能亨通，乃因有间阻——非刑狱何以除之。**\" **这一句很直白**：**事不通，是有东西挡着；而\"刑狱\"（司法）是去除它的手段**。**须说明**：**\"利用狱\"是《易经》原文（噬嗑卦辞）**；**\"狱\"在此指\"诉讼、裁断\"，不是\"监狱\"**；**其现代对应是\"用规则与裁判解决纠纷\"**——**这与\"蛊卦\"的\"整治积弊\"不同**：**蛊是\"内部的坏\"，噬嗑是\"中间挡着的东西\"**；**前者靠\"干\"（整治），后者靠\"嗑\"（咬断）**。**两卦相接，正好覆盖了\"治理\"的两类问题。**","o":"TJ-0273 · 天纪·人间道·噬嗑卦（PDF 第59页）"},{"t":"一百零七、去间","h":"\"察情伪，得其情\"——先查清，再设防","c":"方法——噬嗑\"彖\"为\"**颐中有物，曰噬嗑，噬嗑而亨**\"，其解：\"**如口中有物阻，必用力嗑之，乃能亨通象。用狱之道，所以察情伪、得其情——则知为间之道，而后可以设防与致刑。知噬嗑之道，乃知去间之道，而天下亨通。**\" **这一段给出了司法的完整次序，且次序极重要**：**①\"察情伪\"（查清哪是真的、哪是假的）→②\"得其情\"（掌握实情）→③\"知为间之道\"（知道是什么在中间阻隔）→④\"设防与致刑\"（预防与裁断）**。**即：先\"查明\"，后\"处置\"**——**而\"设防\"排在\"致刑\"之前**（**先想怎么不再发生，再想怎么处罚这一次**）。**须说明**：**这是《易经》彖传原文加讲义之解**；**其可用的核是\"次序不可颠倒\"**：**没有\"察情伪\"就直接\"致刑\"，就是冤；没有\"设防\"就只有\"致刑\"，就会反复。** **这一条与\"蛊卦先甲后甲\"（先溯因）完全同构**：**两卦都把\"查清原因\"放在\"动手\"之前。**","o":"TJ-0274 · 天纪·人间道·噬嗑卦（PDF 第59页）"},{"t":"一百零八、明威","h":"\"照与威并行\"","c":"方法——噬嗑\"彖\"又云\"**刚柔分，动而明，雷电合而章**\"，其解：\"**此卦才有刚有柔，分而不杂，为明辨之象。察狱之本即明辨。以明而动，上震下离，其动因明也。照与威并行，为用狱之道——人能照，则无隐情；有威，则无人不畏，故照与明并用也。**\" **\"察狱之本即明辨\"六字，是全卦的根基**：**裁断的前提是\"看清\"**（**不是\"有权\"，是\"看得清\"**）。**而\"照与威并行\"是它的执行结构**：**\"照\"（明察——使隐情无所遁形）＋\"威\"（威严——使人不敢轻犯）**；**两者缺一不可**。**须说明**：**这是《易经》原文加讲义之解**（**\"雷电合而章\"：雷为威，电为明**）；**其判断可作一条自检**：**只有\"威\"而无\"照\"，是压制（看不见真相，只剩恐惧）；只有\"照\"而无\"威\"，是放纵（看得清却无人当回事）。** **这一条与\"临卦知临\"（用天下之智）方向相反却互补**：**临是\"以柔取人\"，噬嗑是\"以明威正人\"**——**《易经》不主张只用一种。**","o":"TJ-0275 · 天纪·人间道·噬嗑卦（PDF 第59页）"},{"t":"一百零八、明威","h":"\"全刚则伤于严暴，过柔则失于宽纵\"","c":"要点——噬嗑\"彖\"末句为\"**柔得中而上行，虽不当位，利用狱也**\"。其解是全册对\"执法分寸\"最平衡的一段：\"**此言治狱之道：如全刚则伤于严暴，过柔则失于宽纵。以仁而居刚得中正，则得用狱之道。**\" **\"全刚则伤于严暴，过柔则失于宽纵\"两句，把两种失败对称地写出来了**：**太刚——变成暴虐；太柔——变成放纵。**
