 **而它的解法是\"以仁而居刚得中正\"**：**\"仁\"是心（不忍），\"刚\"是手段（有决断），\"中正\"是度**——**三者合起来，才是\"用狱之道\"。** **须说明**：**这是《易经》原文（噬嗑彖）**；**\"仁\"与\"刚\"并提这一点极重要**：**它不是\"折中\"（一半刚一半柔），而是\"以仁为心而行刚之事\"**——**即：手段可以硬，心不可以狠。** **这一条可与本书医学部分\"六准则\"式的判据思维合看**：**两者都不主张\"单项走到极端\"，而是\"在两端之间找到可校验的点\"**（**此处是\"中正\"，彼处是\"正常\"**）。","o":"TJ-0276 · 天纪·人间道·噬嗑卦（PDF 第59页）"},{"t":"一百零八、明威","h":"象：\"明罚敕法\"——法的精神在设防","c":"要点——噬嗑\"象\"为\"**雷电，噬嗑；先王以明罚敕法**\"，其解：\"**雷威而电明；圣人观雷电之象，效法其明与威，而立刑罚法令。法之精神乃在教明事理而设防也。**\" **\"法之精神乃在教明事理而设防也\"这一句，是全册对\"法\"最正的一句**：**法的目的有两层**——**①\"教明事理\"（让人明白道理）**；**②\"设防\"（使事不再发生）**。**注意它没有把\"惩罚\"列为目的**。**须说明**：**\"明罚敕法\"是《易经》原文（噬嗑大象）**；**\"明\"是\"使其明白\"，\"敕\"是\"整饬、申明\"**——**即：\"明罚\"不是\"把刑罚公布出来吓人\"，是\"让人明白何者为非\"**。**这一条与当代法学中的\"一般预防\"（通过明确规则使人不犯）相通**，**也与\"蛊卦先甲后甲\"（治弊须溯因预后果）一路**。","o":"TJ-0277 · 天纪·人间道·噬嗑卦（PDF 第59~60页）"},{"t":"一百零九、用刑三例","h":"初爻：\"屦校灭趾\"——小惩大戒","c":"方法——初爻\"**屦校灭趾，无咎**\"。其解：\"**最下位，下民之象，为受刑之人。用刑之始，罪小刑轻，以木械伤其趾，则不敢进恶矣——此即'因小惩而有大戒'。小人之福，即在此。**\"其\"象\"：\"**因小罪而小用木械伤其趾，则因惩而不再进为恶也。**\" **\"因小惩而有大戒\"六字，是噬嗑对\"早干预\"最清楚的表述**：**在罪还小的时候，用小刑（\"伤其趾\"）使他\"不敢进恶\"**——**而结果写作\"无咎\"。** **最耐人寻味的是末句\"小人之福，即在此\"**：**对小恶之人，\"早被小惩\"反而是他的福**——**因为它拦住了\"进为大恶\"。** **须说明**：**这是《易经》原文（噬嗑初九）**；**其可用的核是\"时点\"**：**干预越早，代价越小、效果越好**——**这与\"坤卦履霜坚冰\"（辨之不早辨则至于坚冰）是同一判断的两面**（**一个讲\"不早辨的后果\"，一个讲\"早小惩的效用\"**）。","o":"TJ-0278 · 天纪·人间道·噬嗑卦·初爻（PDF 第60页）"},{"t":"一百零九、用刑三例","h":"第二爻：\"噬肤灭鼻\"——对刚强者不得不深痛","c":"方法——第二爻\"**噬肤灭鼻，无咎也**\"。其解：\"**二居中而得正，是用刑得中正象；如此罪恶易服。然遇刚强之人，刑之必须深痛，故致灭鼻而无灾。**\"其\"象\"：\"**此用刑于刚强之人，不得不深痛，乃有戒也。**\" **这一爻讲的是\"因对象而调力度\"**：**对\"易服\"者，刑轻即可（\"噬肤\"——咬到皮肉）；对\"刚强\"者，\"必须深痛\"（\"灭鼻\"——咬到鼻子）**——**而两者都\"无咎\"，因为\"得中正\"。** **须说明**：**这是《易经》原文（噬嗑六二）**；**\"刑之必须深痛\"的分寸须讲清**：**它不是\"加重处罚\"，而是\"对不认的必须让他认\"**（**\"乃有戒也\"——目的是\"使其有戒\"**）。**这一条与\"初爻\"构成\"轻—重\"的两端**，**其共同原则是\"中正\"（合度）**，**而\"度\"来自\"对象\"**（**同一件事，对不同的人，力度不同**）。","o":"TJ-0279 · 天纪·人间道·噬嗑卦·第二爻（PDF 第60页）"},{"t":"一百零九、用刑三例","h":"第三爻：\"噬腊肉遇毒\"——自己不正，刑必反噬","c":"风险——第三爻\"**噬腊肉遇毒，小吝，无咎**\"。其解：\"**本身不正，又用刑于人，则人不服而怨对反驳，如食腊肉遇毒，反伤于口。此虽有小议，但无大灾也。**\"其\"象\"：\"**遇毒，位不当也。**\" **\"本身不正，又用刑于人，则人不服而怨对反驳，如食腊肉遇毒，反伤于口\"这一段，是全书对\"执法者自身不正\"最好的比喻**：**腊肉本是好东西（刑本是正事），但吃到有毒的（用刑者自己不正），就\"反伤于口\"**——**伤的是执法者自己。** **\"人不服而怨对反驳\"是它的因果链**：**自己不正→判得不服→对方抗辩→自己受损**。**须说明**：**这是《易经》原文（噬嗑六三）**；**\"位不当也\"指出了根源**：**不是\"方法不对\"，是\"位置不对（自己不在正位）\"**。**其现代对应极直接**：**一个自身有问题的裁判者，越用力越伤自己**——**\"怨对反驳\"不是因为对方强，是因为自己站不住。**","o":"TJ-0280 · 天纪·人间道·噬嗑卦·第三爻（PDF 第60页）"},{"t":"一百一十、观卦之终","h":"上爻：\"观其生\"——不在其位而道德为天下所观","c":"方法——观卦上爻\"**观其生，君子无咎**\"。其解：\"**上九为不当位之人，以阳刚处之，如同贤人君子不在其位，而道德为天下所观仰——能如此，皆君子也。**\"其\"象\"：\"**吾人观其生存之道，常不失于君子；虽不在位，则亦不失人所望之教化也。**\" **这一爻给了\"观\"的第三种形态**：**卦中\"观我生\"出现两次（第三爻\"观己知生存之道\"、第五爻\"视天下之俗而知己\"）；而上爻改为\"观其生\"**——**\"其\"字把主语从\"我\"移到了\"他\"（天下人观他）**。**即：当一个人\"不在其位\"，他仍然是\"被观\"的对象**——**而\"道德为天下所观仰\"，就是他的\"位\"。** **须说明**：**这是《易经》原文（观上九）**；**其判断极宽**：**\"虽不在位，则亦不失人所望之教化也\"**——**即：教化不必靠职位**。**这一条与\"蛊卦上九不事王侯\"（不遇时则高洁自守）应合读**：**两处都在讲\"没有位置时怎么办\"，而两处给的答案一致**：**把\"自己\"做好，位置之外仍有作用。**","o":"TJ-0281 · 天纪·人间道·观卦·上爻（PDF 第58页）  ---"},{"t":"一百一十一、噬嗑后三爻","h":"上爻：\"何校灭耳\"——聪而不明","c":"风险——噬嗑上爻\"**何校灭耳，凶**\"。其解：\"**受刑之极，乃起因于恶之积也，其凶可知。小恶不惩，必成大恶。**\"其\"象\"是全卦最锋利的一句：\"**人为恶不悟，积其恶以致极大，至此何教之？今之人聪而不明，不知止恶于初，教正以刑，乃至大恶。**\" **\"小恶不惩，必成大恶\"这八个字，与初爻\"因小惩而有大戒\"恰成首尾**：**初爻是\"惩得早，所以无咎\"；上爻是\"惩得不早，所以凶\"**——**同一件事的两个方向，把\"时点\"的重要性说尽了。** **而\"聪而不明\"四字，是我在这一卦里最看重的一个判语**：**\"聪\"是听觉灵、信息快（反应快、会来事）；\"明\"是看得清、辨得明**——**\"聪而不明\"就是\"什么都知道，但什么也没看清\"**。**须说明**：**这是《易经》原文（噬嗑上九）**；**\"聪而不明\"在当代尤其常见**（**信息获取极便利，判断力却未同步**）；**此爻把它与\"不止恶于初\"连在一起**：**正因为\"聪\"（知道得多），反而容易觉得\"这点小事没关系\"，于是\"积其恶以致极大\"。**","o":"TJ-0282 · 天纪·人间道·噬嗑卦·上爻（PDF 第60页）"},{"t":"一百一十一、噬嗑后三爻","h":"第五爻：\"噬干肉，得黄金\"——得中而刚，心怀危惧","c":"方法——第五爻\"**噬干肉，得黄金，贞厉，无咎**\"。其解：\"**因五乃居君位，至尊故势大，以此刑下，较易如吃干肉；故为君之道：时天下之间阻物大，须得中而刚，心怀危惧，持续下去，方吉。**\"其\"象\"：\"**当正位，以刚而能守正又虑危，故无灾。**\" **这一爻讲的是\"势大者的用刑\"**：**位置最高（\"至尊故势大\"），所以\"较易如吃干肉\"（容易办到）**——**而正因容易，才更需要三样**：**①\"得中\"（不过分）**；**②\"刚\"（不退缩）**；**③\"心怀危惧\"（怕自己办错）**。**须说明**：**这是《易经》原文（噬嗑六五）**；**\"心怀危惧\"四字与\"戒盛\"同源**（**临卦\"方盛而虑衰\"、大有\"艰则无咎\"**）：**位置越稳、越容易，越要\"怕\"**——**而这里的\"怕\"不是怯，是\"不失敬畏\"。**","o":"TJ-0283 · 天纪·人间道·噬嗑卦·第五爻（PDF 第60页）"},{"t":"一百一十一、噬嗑后三爻","h":"第四爻：\"噬干胏，得金矢\"——意愈大则刑必重","c":"要点——第四爻\"**噬干胏，得金矢，利艰贞，吉**\"。其解：\"**九四乃居近君之位，乃意愈大，则用刑必重。至此得刚直之道，可克艰其事；又因贞固本身操守，且执意行之，则无咎。**\"其\"象\"则留了一分余地：\"**此时乃有不足，故虽坚心，但仍未光大也——此贞亦艰也。**\" **\"意愈大，则用刑必重\"这一句，是噬嗑对\"权力与责任\"关系的表述**：**位置越接近核心，你做的判断影响越大，故\"用刑必重\"——不重不行。** **而其条件是\"利艰贞\"**：**\"艰\"（知道难）＋\"贞\"（守得住）**——**两者合起来才\"吉\"。** **须说明**：**这是《易经》原文（噬嗑九四）**；**\"仍未光大也\"这个补充值得注意**：**即使做得对，也只是\"未光\"（还不够圆满）**——**即：这个位置上没有\"完美\"，只有\"勉强及格\"**（**\"此贞亦艰也\"**）。","o":"TJ-0284 · 天纪·人间道·噬嗑卦·第四爻（PDF 第60页）"},{"t":"一百一十一、噬嗑后三爻","h":"第三爻之象：位不当，则刑不服","c":"要点——噬嗑第三爻\"**噬腊肉遇毒**\"的\"象\"补了一句极具体的例证：\"**受刑之人难服，乃因其用刑之人位不当也。今之他国人在本国犯罪，即见之。**\" **\"今之他国人在本国犯罪，即见之\"这十一字，是讲义中极少见的\"当代举例\"**：**它说的是\"执法者的'位'不被认可时，被判者不会服\"**。**而\"位不当\"在此不是\"职位不正\"，而是\"资格、立场、正当性不足\"**——**同样的裁断，出自\"正当的人\"则服，出自\"不正当的人\"则不服。** **须说明**：**这是讲义之解（非《易经》原文）**；**其可用的核是\"正当性先于正确性\"**：**一个判断即使内容正确，若做出它的人\"位不当\"，也不会被接受**——**这一条与本章第三爻的\"本身不正，又用刑于人，则人不服\"互为表里。**","o":"TJ-0285 · 天纪·人间道·噬嗑卦·第三爻（PDF 第60页）"},{"t":"一百一十二、贲卦之序","h":"\"物之合后则必立文\"","c":"定义——贲卦（山火贲）为\"**猛虎靠岩之课，光明通泰之象**\"，其卦序：\"**物之合后则必立文，文乃饰之意。贲者，饰也，故为之序。人因合聚则有威仪上下，物之合聚则必有次序行列。**\" **这一句给出了\"文饰（贲）\"的起源，讲得很实**：**\"合\"之后必然\"立文\"**——**因为人一合聚，就需要\"威仪上下\"（谁在前谁在后）；物一合聚，就需要\"次序行列\"（怎么摆放）**。**即：秩序产生形式，形式就是\"饰\"。** **这与噬嗑卦正好接上**：**噬嗑讲\"去间\"（把挡着的东西去掉，使事能合）；贲讲\"合了之后怎么排\"（把合起来的东西排出次序与光彩）**。**须说明**：**这是讲义之解；\"贲\"（bì）义为\"装饰、文饰\"**；**其现代可用的核是\"形式生于秩序\"**——**形式不是\"多余的包装\"，而是\"合聚之后的必然产物\"**。**而这一条也为本章后面的\"文与质\"问题埋了伏笔**（**形式既必要，又易过度**）。","o":"TJ-0286 · 天纪·人间道·贲卦（PDF 第61页）"},{"t":"一百一十二、贲卦之序","h":"卦体：\"山下有火，增益其光彩\"","c":"要点——贲卦卦体之解极美：\"**此卦山下有火，草木百物聚于山处；下有火，则能照见草木百物，且增益其光彩——有贲饰之象。**\" **这一处把\"饰\"的机制说清了，且分两层**：**①\"照见\"**——**火使草木\"被看见\"**（**本来在暗处，看不见；有火才看得见**）；**②\"增益其光彩\"**——**火不只使人看见，还使草木\"更好看\"**。**即：好的\"文饰\"是\"照亮\"（使本质显现）＋\"增色\"（使本质更好看）**——**而不是\"遮盖\"。** **须说明**：**这是讲义之解（贲卦象为\"山下有火\"）**；**这一层分寸极重要**：**\"饰\"若只增色而不照亮，就是\"掩盖\"（欺）；若照亮而不增色，就是\"素\"（质）**——**贲卦要的是\"照亮＋增色\"，即\"文质相称\"**。**其现代对应**：**包装、表述、呈现的价值，在于\"让好的东西被看见、显得更好\"，而不在于\"让不好的东西看不出来\"。**","o":"TJ-0287 · 天纪·人间道·贲卦（PDF 第61页）"},{"t":"一百一十二、贲卦之序","h":"卦图：顺风、升迁与受提携","c":"要点——贲卦图六物：**①\"雨下：满也，润泽也，成也\"**；**②\"车行路：前往任官象，行走四方也\"**；**③\"舟张帆在江中：此行顺风大利也\"**；**④\"官人著公服登梯：升迁在外地象，任公职主官外调象，丈夫从公职升官也\"**；**⑤\"仙女云中执珪：受阴人提携象\"**。**其总象标为\"光明通泰\"。** **这六物几乎全是\"顺\"的意象**（**润泽、顺风、升迁、提携**）——**与卦名\"贲\"（文饰、光彩）相合**：**\"光明通泰\"正是\"火照草木\"的延伸。** **须说明**：**这些属象数取象（如\"受阴人提携\"指得女性贵人相助）**，**本集不作断语采信**；**但其\"整体基调\"可参照**：**贲卦所象的是\"向好、向明、向顺\"的一面**——**正因为\"向好\"，后文对\"过饰\"的警告才更有分量**（**好的一面最容易走向\"虚饰\"**）。","o":"TJ-0288 · 天纪·人间道·贲卦（PDF 第61页）  ---"},{"t":"一百一十三、文与质","h":"卦辞：\"小利有攸往\"——须有内实而加外饰","c":"要点——贲卦辞为\"**贲：亨，小利有攸往**\"，其解：\"**物有外饰而后有立；但须有内实而加外饰，则可以亨。因文饰之道可以增加光彩，故必利于小进。**\" **这一句把\"文饰\"的资格条件写得很清楚**：**\"物有外饰而后有立\"——没有外在形式，事物立不起来**（**与卦序\"合后必立文\"一致**）；**但紧接着一句\"须有内实而加外饰\"**——**外饰必须加在\"内实\"之上**。**而\"小利有攸往\"的\"小\"字，正是它的限度**：**文饰只能\"小进\"（增加光彩、助益一点点），不能\"大进\"（不能凭空生出实质）。** **须说明**：**这是《易经》原文（贲卦辞）**；**其判断可提炼为\"文饰是乘数，不是加数\"**：**有内实，饰可使它更亮；无内实，饰只是空壳**——**\"小\"字就是这个乘数的上限。**","o":"TJ-0289 · 天纪·人间道·贲卦（PDF 第61~62页）"},{"t":"一百一十三、文与质","h":"彖：\"并非能增其内实\"——败亡之初始象","c":"风险——贲卦彖的解说里有一段极重的批评：\"**贲之道能亨，实由饰而来；饰之道，须来往以柔、求文饰以刚，名须正，故利小吉。贲饰之道，并非能增其内实，只外加文彩而已。今人但求外饰，不求内实——富侈表面，内无实才，比比皆是；上位者所用皆富有之人，此败亡之初始象也。**\" **\"贲饰之道，并非能增其内实，只外加文彩而已\"这一句，是全卦最硬的一句实话**：**饰，改变的是\"看起来\"，不是\"是什么\"。** **而\"此败亡之初始象也\"这个判语极狠**：**\"上位者所用皆富有之人\"**——**选人看\"富有\"（外在条件），不看\"实才\"（内在能力），就是\"败亡之初始\"。** **须说明**：**这是讲义之解（非《易经》原文）**；**\"富侈表面，内无实才，比比皆是\"是对当时风气的批评**，**但其机制可独立理解**：**当\"外饰\"的成本低于\"内实\"的成本，系统必然选拔\"会修饰的人\"而非\"有实质的人\"**——**而这不是道德问题，是激励结构问题。** **本集把它列为风险条，因为它是全册对\"形式主义\"最直接的诊断。**","o":"TJ-0290 · 天纪·人间道·贲卦（PDF 第62页）"},{"t":"一百一十三、文与质","h":"\"观乎天文以察时变，观乎人文以化成天下\"","c":"方法——贲卦彖中有\"**观乎天文以察时变，观乎人文以化成天下**\"，其解：\"**天文，为日月星辰之错列、四时寒暑之变化；人文，为人理之伦序。观人文以教化天下，此圣人用贲之道也。**\" **这一句把\"观\"分成了两种对象、两种用途**：**①观天文——用以\"察时变\"（看清时势的变化）**；**②观人文——用以\"化成天下\"（教化天下）**。**即：\"观\"不是为了\"欣赏\"，是为了\"用\"**（**察变、化成**）。**\"人理之伦序\"四字，则点出\"人文\"的本义**：**不是\"文艺\"，是\"人伦的次序\"**——**即：人与人之间的秩序与分寸。** **须说明**：**这是《易经》原文（贲彖）**；**\"化成天下\"的\"化\"是\"感化、渐化\"，不是\"改变\"**——**即：教化是慢的、顺着来的。** **这一条与\"观卦\"的\"省方、观民、设教\"是同一方法的两次表述**：**都主张\"先看，再化\"。**","o":"TJ-0291 · 天纪·人间道·贲卦（PDF 第62页）"},{"t":"一百一十三、文与质","h":"象：\"明庶政，无敢折狱\"——不敢用文饰断案","c":"方法——贲卦\"象\"为\"**山下有火，贲；君子以明庶政，无敢折狱**\"，其解：\"**山下有火，草木为其明照而有光彩，此贲饰也。圣人观此明照之象，以修明庶政、成文明之治——无敢于用文饰、掩饰实情、枉法不顾，故君子以用明为戒。**\" **\"无敢折狱\"四字，是贲卦最实用的一个禁令**：**\"折狱\"是断案；\"无敢\"是不敢**——**即：不敢用\"文饰\"（漂亮的说法、体面的包装）来断案。** **而其理由也写明**：**\"无敢于用文饰、掩饰实情、枉法不顾\"**——**文饰一旦进入裁断，就会\"掩饰实情\"。** **须说明**：**这是《易经》原文（贲卦大象）**；**其可用的核是\"文饰的禁区\"**：**凡涉及\"判定事实\"的场合（司法、审计、诊断、考核），文饰一律不得进入**——**\"明\"才是那里的唯一要求。** **这一条与\"噬嗑卦照与威并行\"正相接**：**噬嗑讲\"裁断要明\"，贲卦讲\"裁断不可饰\"**——**一正一反，把\"明\"守住了。**","o":"TJ-0292 · 天纪·人间道·贲卦（PDF 第62页）"},{"t":"一百一十四、六爻（贲卦文饰）","h":"初爻：\"贲其趾，舍车而徒\"","c":"方法——初爻\"**贲其趾，舍车而徒**\"。其解：\"**初九乃君子有刚明之德，居于下也。因其无位，无法施济天下，唯求贲饰自己而已。君子修饰之道，在正其所行、守节处义——凡不正，则宁不与之同行。**\"其\"象\"：\"**于义不可同行，宁舍车而步行。**\" **\"舍车而徒\"这个动作极有画面**：**有车不坐，宁可走路**——**因为那辆车\"于义不可同行\"（坐上去就要跟某些东西同行）。** **而\"因其无位，无法施济天下，唯求贲饰自己而已\"这一句，把\"自我修养\"的定位说清了**：**没有位置时，能修的只有自己**（**这与\"蛊卦上九\"\"观卦上九\"完全一致**）。**须说明**：**这是《易经》原文（贲初九）**；**\"君子修饰之道，在正其所行、守节处义\"两句是它的内容**：**修饰的重点不是\"外表\"，是\"所行\"（做什么）与\"节义\"（守什么）**。**其现代读法**：**在无法\"做事\"的阶段，\"把自己做正\"就是唯一可做的事**——**而\"舍车而徒\"提示：有些便利是\"有代价的\"，宁可慢，也不搭那趟车。**","o":"TJ-0293 · 天纪·人间道·贲卦·初爻（PDF 第62页）"},{"t":"一百一十四、六爻（贲卦文饰）","h":"第二、三爻：\"贲其须\"与\"永贞\"","c":"方法——**第二爻\"贲其须\"**：\"**外饰于物，无法改变其本质；须因其本质如何加饰，乃贲之道。**\"其\"象\"：\"**须贲之道，须与上随，随上而动，动静归依于所主。**\" **第三爻\"贲如濡如，永贞，吉\"**：\"**贲之盛，须戒永正，则吉——因永正之心及行，很难维持。**\"其\"象\"：\"**如饰之变化多且非正，人所陵侮也，故戒之永正则吉。**\" **第二爻讲的是\"饰的依据\"**：**\"须\"（胡须）是\"依附于脸而生的\"**——**故\"饰\"必须\"因其本质如何\"来加**（**脸长什么样，须就怎么长；不能反客为主**）。**第三爻讲的是\"饰的持续\"**：**\"贲如濡如\"（饰得光润鲜艳）是\"盛\"，而盛则难持**——**\"永正之心及行，很难维持\"这一句极诚实**：**问题不在\"知道该正\"，而在\"一直正下去\"。** **须说明**：**这是《易经》原文（贲六二、九三）**；**两爻合起来，是\"文饰\"的两个条件**：**①依据本质（不反客为主）**；**②守得久（不因繁盛而失正）**。","o":"TJ-0294 · 天纪·人间道·贲卦·第二、三爻（PDF 第62页）"},{"t":"一百一十四、六爻（贲卦文饰）","h":"第五爻：\"贲于丘园，束帛戋戋\"","c":"要点——第五爻\"**贲于丘园，束帛戋戋，吝，终吉**\"。其解：\"**此虽君位，但本质阴柔，不足自守，但求外贲于设险守国——田园近城，山丘在外，据险而守；即令阴柔之质，受人裁制其外，虽君子吝之，但终平安。**\"其\"象\"：\"**君能从人以成贲之功，此吉有喜也。**\" **这一爻的意象是\"俭朴的装点\"**：**\"贲于丘园\"（在乡野田园里作修饰）＋\"束帛戋戋\"（一束帛少得可怜）**——**即：所用以\"饰\"的东西极少、极朴。** **而它的结果很奇妙**：**\"吝\"（寒酸、不好看）却\"终吉\"**——**因为\"虽君子吝之，但终平安\"**（**只有面子上的遗憾，没有实质的危险**）。**而象辞的解释\"君能从人以成贲之功\"则给了原因**：**这个位置的人（本质阴柔，不足自守）能\"从人\"（听人、用人），故能\"成贲之功\"。** **须说明**：**这是《易经》原文（贲六五）**；**其可用的核是\"俭而能守\"**：**在实力不足时，宁可\"戋戋\"（寒酸）也不虚张声势**——**因为\"据险而守\"（守住已有的）比\"装点门面\"更重要。** **这一条与\"蛊卦六五用誉\"同一思路**：**自知不足，则\"从人\"（用对的人）以成事。**","o":"TJ-0295 · 天纪·人间道·贲卦·第五爻（PDF 第62页）"},{"t":"一百一十四、六爻（贲卦文饰）","h":"上爻：\"白贲，无咎\"——饰不可过","c":"要点——上爻\"**白贲，无咎**\"，是贲卦的收口，也是全卦最重要的判断。其解：\"**贲饰之极，则失于外伪；唯能质白于贲，则无过饰之灾。故尚质素，不失其本真——千万不可外饰过于华美而失其本质，此戒贲也。**\"其\"象\"：\"**处贲之极，则有过华伪失实之虑，故戒之：以质素则可无灾，饰不可过也。**\" **\"白贲\"二字极妙**：**\"白\"是\"无色\"——即以\"无色\"为饰**。**而其理由也写明了**：**\"贲饰之极，则失于外伪\"**——**饰到极点，必然变成\"外伪\"（外表的假）**；**故唯一的解法是\"质白于贲\"（以本质的素白作为装饰）**。**须说明**：**这是《易经》原文（贲上九）**；**\"白贲\"的美学意义不小**（**中国艺术中\"素\"高于\"华\"，此为源头之一**）；**其可用的核是\"上限\"**：**任何\"饰\"的体系，都必须给自己设一个\"归零\"的端点**——**否则会一直加到\"外伪\"。** **这一条与本章\"败亡之初始象\"恰成闭环**：**彖说\"但求外饰必致败亡\"，上爻给出\"唯一出路是以质为饰\"**——**即：不是\"少饰一点\"，是\"换一种饰\"**（**以\"真\"为饰**）。","o":"TJ-0296 · 天纪·人间道·贲卦·上爻（PDF 第62页）  ---"},{"t":"一百一十五、剥之象","h":"贲之后必剥：山附于地","c":"定义——剥卦（山地剥）为\"**去旧生新之课，群阴剥尽之象**\"，其卦序与卦体：\"**尽贲饰之道，而后可亨；但饰之终，不戒，则必剥，故为之序。卦体为五阴一阳，乃意阴始自下生，渐长至极盛，群阴皆受剥于阳也。天地之间，山乃高大，但仍附于地上，此为颓剥之象也。外止内顺，招剥之象也；而顺且止，为处剥之道。**\" **这一段给了三层**：**①卦序**——**\"饰之终，不戒，则必剥\"**（**贲（修饰）走到尽头而不自戒，接下来就是剥落**）；**②卦体**——**五阴一阳，阴自下生、渐长至极盛**（**阳气被逐层剥去**）；**③取象**——**\"山乃高大，但仍附于地上\"**（**再高的山也附在地上，这就是\"颓剥\"之象**）。**最要紧的是末句\"外止内顺，招剥之象也；而顺且止，为处剥之道\"**：**同一个卦体，既是\"招剥之因\"（外止内顺——外面不动、内里顺服），也是\"处剥之道\"（顺且止——顺着时势停下来）**，**即：致剥与处剥，用的是同一组字，差别在\"主动\"还是\"被动\"。** **须说明**：**\"剥\"义为\"剥落\"，卦中五阴在下、一阳在上，是\"阴盛阳衰\"之象**；**其现代对应是\"系统的衰退期\"**——**而\"顺而止\"正是衰退期的正确姿势**（**与\"逆势硬撑\"相对**）。","o":"TJ-0297 · 天纪·人间道·剥卦（PDF 第63页）"},{"t":"一百一十五、剥之象","h":"卦图：阴人得势与风中之烛","c":"风险——剥卦图六物：**①\"妇人床上坐：必有暗灾，阴人得势，阳道衰弱，小人为主官\"**；**②\"烛在风中：险也\"**；**③\"葫芦：医药无救也；有暗计也\"**；**④\"缫丝：事务繁冗\"**；**⑤\"山下官人坐：有靠山，但阴人为祸\"**；**⑥\"冠巾挂木上：求去之象；又有乐之象\"**。**这六物合起来，正是\"衰退期\"的完整图景**：**主位者失其位（妇人床上坐）、局势危（风中之烛）、救无可救（葫芦\"医药无救\"）、事务繁冗（缫丝）、有靠山而仍为祸（山下官人坐）、想走又想留（冠巾挂木上\"求去之象；又有乐之象\"）。** **其中\"烛在风中\"四字最省净**：**烛本来亮着，但风一吹就灭**——**这就是\"衰退期\"的本质：不是\"没有光\"，是\"光守不住\"。** **须说明**：**\"妇人床上坐＝阴人得势\"\"葫芦＝医药无救\"属象数取象，本集不作断语采信**；**而\"烛在风中＝险也\"\"缫丝＝事务繁冗\"可独立取义**。**另，\"冠巾挂木上：求去之象；又有乐之象\"这一个取象很值得注意**：**它同时给出了两种相反的意向（想走／安于其中）**——**而衰退期的人事，往往就是这两种心态并存。**","o":"TJ-0298 · 天纪·人间道·剥卦（PDF 第63页）"},{"t":"一百一十六、处剥之道","h":"卦辞：\"不利有攸往\"","c":"要点——剥卦辞为\"**剥：不利有攸往**\"。其解：\"**剥乃群阴长盛、剥削阳时，同众小人剥丧君子，故君子不利往。**\" **这一句很干脆**：**在\"阴长阳消\"的时候，\"往\"（前进、作为）是不利的。** **而\"同众小人剥丧君子\"一句，点明了机制**：**不是\"一个人害你\"，是\"一群人在剥\"**——**即：这是一种\"势\"，不是一个\"敌\"。** **须说明**：**\"不利有攸往\"是《易经》原文（剥卦辞）**；**其判断可作一条\"时势识别\"**：**当你发现\"做什么都被削\"（努力越多，成果越少），先不要加大投入**——**因为此爻说的正是\"此时不宜往\"。** **这一点与\"剥极必复\"（上九\"硕果不食\"）并不矛盾**：**\"不利往\"是\"此刻\"，\"必复\"是\"终局\"**——**即：先停下来，等\"复\"的时机**（**而\"停下来\"本身是\"等待时机\"的一种作为**）。","o":"TJ-0299 · 天纪·人间道·剥卦（PDF 第63页）"},{"t":"一百一十六、处剥之道","h":"\"顺而止之\"与\"君子事天，小人事人\"","c":"方法——剥卦彖中有\"**顺而止之，观象也；君子尚消息盈虚，天行也**\"。其解是全卦最重要的一段：\"**君子处剥之时，知不可往，顺时而止，乃因能观剥也。故此卦有顺止之象，为处剥之道。君子之人见事于始，凡事之始皆有理；君子视其盈亏消息，而知处之道。顺时则吉，逆时则凶，故君子事天。小人反之，不见事始之作为如何，不论事理之盈亏如何，一昧迎随奉承，故小人事人。**\" **\"顺而止之\"四个字，是\"处剥\"的方法**：**不是\"抵抗\"，不是\"硬撑\"，是\"顺着（时势）停下来\"**。**而它的依据是\"观象\"**：**能\"观\"（看清），才敢\"止\"。** **而\"君子事天，小人事人\"这八个字，是全卦的题眼，也是整册最精的一句对照**：**君子\"尚消息盈虚\"（看事情的消长盛衰）——所以他\"事天\"（跟随的是\"势\"与\"理\"）**；**小人\"不见事始之作为如何，不论事理之盈亏如何，一昧迎随奉承\"——所以他\"事人\"（跟随的是\"人\"）。** **须说明**：**这是《易经》原文（剥彖）加讲义之解**；**\"消息盈虚\"是《易经》的核心语汇**（**消＝退，息＝生，盈＝满，虚＝空**）；**其可用的核是\"依据不同\"**：**\"事天\"者依据\"势\"，\"事人\"者依据\"脸色\"**——**在剥（衰退）之时，\"事人\"者会随人而倒，\"事天\"者不随人而倒**（**因为\"势\"仍在，只是暂时）。**","o":"TJ-0300 · 天纪·人间道·剥卦（PDF 第63页）"},{"t":"一百一十六、处剥之道","h":"象：\"厚下安宅\"——上如有剥，必自下","c":"要点——剥卦\"象\"为\"**山附于地，剥；上以厚下安宅**\"，其解极重：\"**山再高大，仍依附于地；圣人体此，知人君与上位者，视剥而知厚固其下位之人，以安居也。下者为上之本——从未有基本固而能剥者也。故上如有剥，必自下。故安养人民以厚国本。书曰'民惟邦本，本固邦宁'。**\" **\"下者为上之本，从未有基本固而能剥者也\"这一句，是全册对\"根基与衰败\"最直白的判断**：**基础牢固，就\"剥不动\"**——**而\"上如有剥，必自下\"则说明：上面看见\"剥\"，根子一定在下面。** **须说明**：**这是《易经》原文（剥卦大象）**（**\"厚下安宅\"：使下位者厚，则上位者安**）；**所引\"民惟邦本，本固邦宁\"出自《尚书》**；**其可用的核是\"归因方向\"**：**当组织出现剥落（人才流失、士气下滑、业绩衰退），先看\"下\"（基层、基础、根基），不要先看\"上\"**——**因为\"上如有剥，必自下\"。** **这一条与\"观卦观民以察己\"（民是镜）、\"蛊卦振民育德\"（在天下则济民）构成一组**：**三处都把\"上面看见的问题\"归到\"下面与自身\"。**","o":"TJ-0301 · 天纪·人间道·剥卦（PDF 第63页）"},{"t":"一百一十七、六爻（剥卦顺而止之）","h":"初、二爻：剥床以足、以辨——剥必自下起","c":"风险——**初爻\"剥床以足，蔑贞，凶\"**：\"**因剥之始皆自下，故曰'剥足'；阴自下进，渐消亡正道，凶之至也。**\"其\"象\"：\"**正道之侵灭，必由下而上渐进——用剥之道即在此。**\" **第二爻\"剥床以辨，蔑贞凶\"**：\"**此阴渐进，为将者已受剥也，凶益甚也。**\"其\"象\"极重要：\"**小人之侵剥君子，若君子有对应，则小人不能为害；如无对应，则有被灭之凶。**\" **\"剥床\"这个比喻极准**：**剥的是\"床\"（人赖以安身的东西），而且从\"足\"（床脚）开始**——**人还睡着，床脚已经被剥了**。**而\"必由下而上渐进\"六字，是剥的规律**：**从最底层、最不被注意的地方开始，一层层往上。** **第二爻的\"未有与也\"则给出了\"能否挡住\"的条件**：**\"若君子有对应，则小人不能为害\"**——**\"与\"是\"同盟、呼应、支持\"**；**\"如无对应，则有被灭之凶\"**——**没有呼应，就会被灭。** **须说明**：**这是《易经》原文（剥初六、六二）**；**其判断可作一条自查**：**我赖以安身的那张\"床\"，脚还在吗？**——**以及：我有\"与\"（有呼应的人）吗？** **这两问比\"敌人是谁\"更有用。**","o":"TJ-0302 · 天纪·人间道·剥卦·初、二爻（PDF 第64页）"},{"t":"一百一十七、六爻（剥卦顺而止之）","h":"第三、四爻：势孤无咎，及身则凶","c":"风险——**第三爻\"剥之，无咎\"**：\"**众阴在下剥阳之时，三之相位独刚应之，则可无灾；但因势孤弱，虽可无灾，但未必能大亨。**\"其\"象\"：\"**为相之人居剥之时，无灾之因乃同类而相失，不与同道，故也。**\" **第四爻\"剥床以肤，凶\"**：\"**剥之及身时也，其凶可知。乃因不知始剥于下，以致进盛至此。**\"其\"象\"：\"**象为剥及皮肤；因四为君侧之人，如君之肤，示灾祸之近身也。**\" **这两爻合起来，是\"剥\"的两个阶段**：**第三爻是\"独刚应之\"——一个人在挡，所以\"无咎\"，但\"势孤弱\"\"未必能大亨\"**（**即：能保住，但保不住大局**）；**第四爻是\"剥及皮肤\"——已经剥到身上了**，**而其原因写得极明白**：\"**乃因不知始剥于下，以致进盛至此**\"。**须说明**：**这是《易经》原文（剥六三、六四）**；**\"不知始剥于下\"这一句与本章初爻\"剥之始皆自下\"恰成因果**：**同一个规律，早看见则能挡，晚看见则已及身。** **这一条与\"坤卦履霜坚冰\"\"噬嗑上九小恶不惩必成大恶\"是同一判断的第三次出现**——**《易经》反复在讲\"早看见\"。**","o":"TJ-0303 · 天纪·人间道·剥卦·第三、四爻（PDF 第64页）"},{"t":"一百一十七、六爻（剥卦顺而止之）","h":"第五爻：\"贯鱼\"——以序待群阴","c":"方法——第五爻\"**贯鱼，以宫人宠，无不利**\"。其解：\"**剥本及于君，凶可知；但圣人于此，知人性之从善如流，以示宠方式，使群阴如鱼之贯序，则可无所不利。此宠如对妻妾之同态也。**\"其\"象\"：\"**于剥之及身时，能以宠妻妾之方式对待，则终无灾。**\" **\"贯鱼\"的意象是\"鱼贯而入\"——排成有序的一串**：**面对一群正在剥你的\"阴\"（也指一群小人或一群对立者），解法的关键不是\"打击\"，是\"给它们排个次序\"。** **即：**\"以宫人宠\"的核心是\"分位定序\"**——**让一群人各有其位、各有其序，则\"无不利\"**。**须说明**：**这是《易经》原文（剥六五）**；**\"以宫人宠\"是古代的宫闱语境（宠幸妻妾的方式），本集取其\"分位定序\"义，不取其性别内容**；**其可用的核是\"用序代替斗\"**：**当一群人挤在一处、彼此剥蚀，往往不是\"坏人太多\"，而是\"位序不清\"**——**给了次序，剥力自消。**","o":"TJ-0304 · 天纪·人间道·剥卦·第五爻（PDF 第64页）"},{"t":"一百一十七、六爻（剥卦顺而止之）","h":"上爻：\"硕果不食\"——剥极必复","c":"要点——上爻\"**硕果不食，君子得舆，小人剥庐**\"，是剥卦的出口。其解极好：\"**果之大者，如不食，则有复生之理。阴道盛极，天下大乱，但乱极则必思治，故众人之心，必愿载君子，故如得舆——此阴极生阳也。若为小人于此，则必无安身之地。**\"其\"象\"：\"**因正道消剥至极，则人必思治；上九为阳刚之君子，为民所载也。小人处剥之极，终不可用也。**\" **\"硕果不食\"是全卦最美的意象**：**满树都被剥光了，只剩一颗大果子没被吃掉**——**而\"如不食，则有复生之理\"**：**只要这颗果子还在，就有再生的可能。** **而\"君子得舆，小人剥庐\"是同一位置上的两种结局**：**君子被众人\"载\"（抬上车——众人拥护）；小人连\"庐\"（自己的屋）都被剥掉（无处安身）**。**须说明**：**这是《易经》原文（剥上九）**；**\"阴极生阳\"是它的易理依据**（**剥卦五阴一阳，那一阳就是\"硕果\"**）；**其可用的核是\"留一颗种子\"**：**在任何\"全面衰退\"的局面里，都要留住\"未被剥尽的那一点\"**——**因为它就是\"复\"的起点。** **这一条与\"蛊卦上九不事王侯\"（不遇时则自守）可合读**：**两处都在讲\"最坏的时局里的唯一资产\"——一个留\"身\"，一个留\"果\"。**","o":"TJ-0305 · 天纪·人间道·剥卦·上爻（PDF 第64页）  ---"},{"t":"一百一十八、剥极必复","h":"一阳生于五阴之下","c":"定义——复卦（地雷复）为\"**淘沙见金之课，反复往来之象**\"，其卦序与卦体：\"**万物无剥尽之理，故剥极必复来——复为之序卦。此卦一阳生于五阴之下，有阴极生阳象，如同冬至极寒，则必生阳，亦同。雷在地下，有复生之象，外顺内动，此为复之始。**\" **\"万物无剥尽之理\"这七个字，是剥卦之后最重要的一个判断**：**没有东西会被\"剥尽\"**——**因为\"剥极必复\"。** **而它的取象很美**：**\"一阳生于五阴之下\"（最底下那一点阳气已经生出来了）＋\"雷在地下\"（雷还在地下，没有响，但已经在动）＋\"冬至极寒则必生阳\"**。**即：复的时点，是\"最冷的时候\"。** **须说明**：**\"复\"义为\"回归、复生\"**；**其现代可用的核是\"衰退的底部即再生的起点\"**——**而\"雷在地下\"这个取象给出了\"复\"的形态**：**不是\"响\"，是\"藏在地下的动\"。** **这一条与\"剥卦硕果不食\"（留一颗种子）正好相接**：**剥卦留住的那点\"未被剥尽\"，就是复卦\"一阳生于下\"的那一阳。**","o":"TJ-0306 · 天纪·人间道·复卦（PDF 第65页）"},{"t":"一百一十八、剥极必复","h":"卦辞：\"朋来无咎\"——始复不能立胜小人","c":"要点——复卦辞为\"**复：亨，出入无疾，朋来无咎**\"，其解是全书对\"复兴初期\"最实用的一段：\"**万物既复则必亨；如君子之道将复，虽微，但同类将渐进，故亨且盛矣。故复之时至，并无法立胜小人——必待其同朋相继，则协力能胜也。**\"而卦图总断也说得很明白：\"**君子之道，既消而复，始复必不能力胜小人，必待其朋类渐盛，协力致胜可也。**\" **\"始复必不能力胜小人\"这一句，是复卦最要紧的判断**：**刚\"复\"的时候，力量还很小，绝不能硬碰**；**而解法是\"朋来\"**——**\"必待其同朋相继，则协力能胜\"。** **须说明**：**这是《易经》原文（复卦辞）加讲义之解**；**\"朋\"在此指\"同类的支持者\"（非\"朋友\"之泛义）**；**其可用的核是\"节奏\"**：**复的第一步不是\"决战\"，是\"聚人\"**——**而\"无咎\"（不会出错）的前提正是\"朋来\"**（**没有人来，就不要动**）。","o":"TJ-0307 · 天纪·人间道·复卦（PDF 第65页）"},{"t":"一百一十八、剥极必复","h":"\"七日来复\"——小有七日，大有七年","c":"要点——复卦辞又有\"**反复其道，七日来复，利有攸往**\"，其解给出了一套\"数\"：\"**此为消长之道，《易》之论数，以立准则：小有七日乃复，大有七年方复，此复之道也。**\" **这一句把\"复\"的时间尺度说得很干脆**：**小的（小问题、小失利）七日可复；大的（大局面、大失）七年方复。** **须说明**：**\"七日来复\"是《易经》原文（复卦辞）**；**\"七日\"在易学中有多种解释（一说为卦气循环之数、一说为古历之周）**，**本集不推其具体依据**；**\"大有七年方复\"则是讲义给出的引申尺度**（**属经验概括，非定律**）。**其可用的核是\"期待管理\"**：**\"复\"是有周期的，且周期与\"损失的量级\"相关**——**故\"三日就想复原\"是不切实际的期待**。**这一条与\"蛊卦终则有始\"（治理非一次性工程）相通**：**两处都在提醒\"时间是变量\"。**","o":"TJ-0308 · 天纪·人间道·复卦（PDF 第65页）"},{"t":"一百一十九、\"天地之心\"","h":"\"复其见天地之心乎\"","c":"要点——复卦\"彖\"末句为\"**复其见天地之心乎**\"，其解极美：\"**复之返来，顺天之运行，故言七日；因君子道长，故利前往；阳复生于下，乃是天地生物之心，以为动之始也——故外见动，而始生于内也。**\" **\"天地生物之心\"六字，是全书对\"复\"最高的解释**：**天地之所以\"复\"（让万物再生），是因为它\"要生\"**——**即：宇宙的本性是\"生\"，不是\"灭\"。** **而\"外见动，而始生于内也\"这一句，把\"复\"的动力学说清了**：**外面看起来是\"动\"（事情在发生），而\"始\"（起点）在\"内\"**——**即：真正的\"复\"是从内部开始的。** **须说明**：**\"复其见天地之心乎\"是《易经》原文（复彖）**，**宋儒（如邵雍、程颐）对此句发挥极多**；**本集只取讲义此处的两个判断**：**①\"复\"的本性是\"生\"**；**②\"复\"始于内**。**其可用的核是\"内向修复\"**：**当外部一片萧条时，真正的转机往往先在\"内部\"发生**（**人的状态、组织的根基、技术的积累**）——**而它\"外面还看不出来\"**（**\"雷在地下\"\"阳生于五阴之下\"**）。","o":"TJ-0309 · 天纪·人间道·复卦（PDF 第65页）"},{"t":"一百一十九、\"天地之心\"","h":"象：\"至日闭关，商旅不行，后不省方\"","c":"方法——复卦\"象\"为\"**雷在地中，复；先王以至日闭关，商旅不行，后不省方**\"，其解是全卦最有实用价值的一段：\"**以卦象而言，如雷乃阴阳相搏而成声，时阳之微，未能发也。如圣人顺天之道，于日阳之始生，安静养之以闭关——使商旅不得行、人君不视四方，此顺天也；于人亦以此安养其阳，为复原之道。**\" **\"至日闭关\"讲的是\"在最需要恢复的那一刻，把一切都停下来\"**：**\"闭关\"（关起门）、\"商旅不行\"（不往来）、\"后不省方\"（君主不巡视四方）**——**三件事都是\"停\"。** **而其理由极准**：\"**时阳之微，未能发也**\"——**阳气还太微弱，发不出来**；**故此时的正解是\"安静养之\"，不是\"使劲推动\"。** **须说明**：**\"至日闭关\"是《易经》原文（复卦大象）**（**\"至日\"指冬至，因冬至为阳气始生之时**）；**\"于人亦以此安养其阳，为复原之道\"这一句是讲义的关键引申**——**它把\"节气\"转成了\"养生\"**。**这一条与本书医学部分的养生主张（\"冬季早卧晚起\"\"不可动阳\"一类）完全同源**：**同一套\"顺时保养\"的身体观，在卦上叫\"闭关\"，在医上叫\"藏精\"。** **本集认为这是《易经》与中医真正相通的一处**（**不是概念比附，是同一种\"时间—身体\"观**）。","o":"TJ-0310 · 天纪·人间道·复卦（PDF 第65~66页）"},{"t":"一百二十、六爻（复卦七日来复）","h":"初爻：\"不远复\"——知不对立改","c":"方法——初爻\"**不远复，无祇悔，元吉**\"。其解：\"**有失而后有复；此复之始时，因失之不远，故复必不至于悔，故吉。**\"其\"象\"是全卦最实用的一句：\"**此即知不善而速改，为君子修身之道。学问之道即在此——知不对立改，为君子也。**\" **\"知不对立改\"六个字，是复卦对\"改过\"最锋利的一次表述**：**\"知不对\"（知道错了）→\"立改\"（立刻改）**——**\"立\"字极重，因为它排除了\"等等再说\"。** **而\"失之不远\"是\"元吉\"（大吉）的原因**：**错得还不远，回头就快**——**这与\"剥卦剥床以足\"（从床脚开始）同理**：**早改，代价小。** **须说明**：**这是《易经》原文（复初九）**；**\"无祇悔\"（不至于有悔）正是\"早复\"的结果**；**其现代可用的核是\"速度\"**：**修身、学问、修正错误，共同的要点都是\"知不对就立刻改\"**——**而\"立改\"这件事本身就是\"复\"（回归）的第一爻。**","o":"TJ-0311 · 天纪·人间道·复卦·初爻（PDF 第66页）"},{"t":"一百二十、六爻（复卦七日来复）","h":"第二、三爻：\"休复\"与\"频复\"","c":"方法——**第二爻\"休复，吉\"**：\"**二为切近初阳之位；君子道始生于下，若二位志向于阳，今阳在下从之，故能下之道为仁，吉。**\"其\"象\"：\"**仁者天下之公、善之本源；能体会而近于下之仁，乃休复之美。**\" **第三爻\"频复，厉，无咎\"**：\"**从复之道，又频复履失，致危之道也；故须厉，即戒此可无咎。频失致危，其过乃在失而不复也。今人迷途不知返，比之皆是；又知返而不戒又入迷，凶也。**\"其\"象\"：\"**戒之在屡复——复而又失；失之过，故坚心于复不失，无灾殃也。**\" **第二爻的\"休复\"是\"往下靠\"**：**阳刚初生在下（微弱），第二爻主动\"下从之\"——\"能下之道为仁\"**（**即：肯向\"还在下面的那点新东西\"低头，这叫仁**）。**第三爻的\"频复\"则是\"反复改、反复犯\"**：**\"频失致危，其过乃在失而不复也\"**——**它的过错不在\"失\"，在\"失了不复\"（不去改）**；**而\"知返而不戒又入迷，凶也\"更进一层**：**改了又犯，也是凶。** **须说明**：**这是《易经》原文（复六二、六三）**；**\"休复\"的\"休\"为\"美善、安和\"**；**两爻合起来，是\"复\"的两种态度**：**一种是\"肯往下就\"（仁），一种是\"改了又犯\"（厉而无咎，但未吉）**——**而\"厉\"字说明：能改就不算错，但要一直警惕。**","o":"TJ-0312 · 天纪·人间道·复卦·第二、三爻（PDF 第66页）"},{"t":"一百二十、六爻（复卦七日来复）","h":"第四、五爻：\"中行独复\"与\"敦复\"","c":"风险——**第四爻\"中行独复\"**：\"**四于众阴之间，能自处于正，但因力弱，不足克济——此言独复，不一定无灾。**\"其\"象\"：\"**以独复于小人间，如从阳刚，君子之道也。**\" **第五爻\"敦复，无悔\"**：\"**君王于复之道，能敦笃而行之，但臣下均阴柔之辈，因无助——但能无悔而不能无灾，君子戒之。**\"其\"象\"：\"**五以阴居尊位，能敦笃善道，以中道自成，此可无悔也。**\" **这两爻的共同点是\"孤\"**：**第四爻\"独复\"（一个人往正道上走），\"力弱，不足克济\"**；**第五爻\"敦复\"（敦厚笃实地做），但\"臣下均阴柔之辈，因无助\"**。**而两爻的断语都留了余地**：**\"不一定无灾\"\"能无悔而不能无灾\"**——**即：独善其身，可以\"无悔\"，但不能保证\"无灾\"。** **须说明**：**这是《易经》原文（复六四、六五）**；**其判断与\"剥卦六三独刚应之\"（势孤弱，未必能大亨）完全同构**：**《易经》对\"孤军\"的态度一贯**：**承认它的价值（无悔、无咎），但明确它救不了大局**（**\"不足克济\"**）。","o":"TJ-0313 · 天纪·人间道·复卦·第四、五爻（PDF 第66页）"},{"t":"一百二十、六爻（复卦七日来复）","h":"上爻：\"迷复\"——十年不克征","c":"风险——上爻\"**迷复，凶，有灾眚；用行师，终有大败；以其国君凶，至于十年不克征**\"。其解：\"**阴柔居复之终，乃意终迷不复者，大凶。招凶，皆因己之迷而不返，动则必有过失——以之出师必大败，以之为国君，大凶。迷于道，而终不可行也。**\"其\"象\"：\"**人君居上而治天下，当从天下之善；如迷……**\"（**后文在扫描件中未续，但其判断已完整**）。**这一爻是复卦的唯一\"大凶\"，也是最重的一爻**：**\"终迷不复\"（到最后仍然迷着、不肯回来）**——**而后果写得极具体**：**\"用行师，终有大败\"\"以其国君凶\"\"至于十年不克征\"**。**\"十年不克征\"这个后果的分量极重**：**不是\"这一次失败\"，是\"十年都缓不过来\"。** **须说明**：**这是《易经》原文（复上六）**；**\"灾眚\"（天灾与人祸）连用，说明后果是全面的**；**其可用的核是\"不肯回头的代价\"**：**复卦六爻里，前五爻都有出路（元吉、吉、无咎、无悔），唯上爻\"凶\"**——**分界正是\"肯不肯回来\"。** **而它与初爻\"不远复\"恰成首尾**：**初爻\"失之不远就回来\"，元吉；上爻\"迷而不返\"，凶，十年不克征**——**同一卦中，\"回头的早晚\"决定了结果的全部差别。**","o":"TJ-0314 · 天纪·人间道·复卦·上爻（PDF 第66页）  ---"},{"t":"一百二十一、无妄之义","h":"动以天，动以人欲","c":"定义——无妄卦（天雷无妄）为\"**石中蕴玉之课，守旧安常之象**\"，其卦序与卦体：\"**因复于道、合于正理，则无妄，故复之后受以无妄。卦乾上震下，此言'动以天则为无妄，如动以人欲则生妄矣'——故无妄之义大也。**\" **\"动以天则无妄，动以人欲则生妄\"这十四个字，是无妄卦的全部纲领**：**同一件\"动\"，动机的来源决定它的性质**——**依\"天\"（自然之理）而动，就\"无妄\"；依\"人欲\"而动，就\"妄\"。** **而卦象也标得准**：\"**石中蕴玉**\"（玉藏在石头里，外面看不见）＋\"**守旧安常**\"（守住旧的、安于常的）。**须说明**：**\"无妄\"的\"妄\"义为\"虚妄、妄动\"**；**其现代可用的核是\"问动机的来源\"**：**不是\"这件事好不好\"，而是\"我为什么做它\"**——**此卦的判据在\"动\"的起点，不在\"动\"的结果。**","o":"TJ-0315 · 天纪·人间道·无妄卦（PDF 第67页）"},{"t":"一百二十一、无妄之义","h":"卦辞：\"无妄即至诚也\"","c":"要点——无妄卦辞为\"**无妄：元，亨，利，贞，其匪正有眚，不利有攸往**\"，其解：\"**无妄即至诚也。至诚为天道——天能化育万物，生生不息，且各正其性，此无妄也。人如能合于无妄之道，则能与天地合德，故大吉。君子行无妄之道，能致大吉，须戒在坚心；如失贞，则致灾。今人本无邪心，但如不合正理，则妄亦邪心也。**\" **这一段里最值得记的是末句**：\"**今人本无邪心，但如不合正理，则妄亦邪心也。**\"——**它把\"妄\"的门槛降低了：不需要\"有坏心\"，只要\"不合正理\"，就已经是\"妄\"。** **即：\"我是好意\"不能免责**——**好意而不合正理，仍是\"妄\"**（**因为结果上它一样会生乱**）。**须说明**：**\"无妄即至诚\"是讲义之解**（**《易经》原文只作\"元亨利贞\"**）；**其\"四德俱全\"与\"随卦\"同**；**而\"须戒在坚心；如失贞，则致灾\"一句，把\"四德\"的落点放在了\"守得住\"上**（**与贲卦\"永正之心及行，很难维持\"同一判断**）。","o":"TJ-0316 · 天纪·人间道·无妄卦（PDF 第67页）"},{"t":"一百二十一、无妄之义","h":"彖：\"内不实，此致妄矣\"","c":"风险——无妄\"彖\"为\"**无妄，刚自外来而为主于内；动而健，刚中而应，大亨以正，天之命也**\"，其解：\"**动以天则无妄，今人动以人欲。刚自外而入主于内，乃以正去妄之象。上健而下动，内动而外健，其动乃刚、理正气壮，道乃大亨，此天道也。今人动之以欲，而无法示诚于外——不够刚明，乃因内不实，此致妄矣。**\" **\"不够刚明，乃因内不实，此致妄矣\"这一句，把\"妄\"的机制说透了**：**外面看起来不够\"刚明\"（不含糊、不虚张），根子在于\"内不实\"**（**里面是空的**）。**即：妄，是\"内虚\"的外显**。**须说明**：**这是《易经》彖传原文加讲义之解**；**\"刚自外来而为主于内\"是卦体（乾在外、震在内）的义理**；**其可用的核是\"向内找\"**：**当一个人或一件事显得\"浮\"（话说得漂亮但立不住），不要在外表上改，去看\"内实\"**——**因为\"内不实\"才是源头。**","o":"TJ-0317 · 天纪·人间道·无妄卦（PDF 第67页）"},{"t":"一百二十一、无妄之义","h":"\"天命不祐，行矣哉\"——入妄不知复","c":"风险——无妄\"彖\"末段为\"**其匪正有眚，不利有攸往；无妄之往，何之矣？天命不祐，行矣哉？**\"，其解：\"**无妄，即正也；小失于正，乃妄。入于妄，不知复，乃更往——则必悖天理，为天道所不容，不可行也。**\" **这一句给出了\"妄\"的恶化路径，三步**：**①\"小失于正\"（一开始只是小偏）→②\"乃妄\"（变成妄）→③\"不知复，乃更往\"（不知道回头，还继续往前走）**。**即：危险的不是\"第一步偏了\"，是\"偏了之后不停\"。** **须说明**：**这是《易经》原文（无妄彖）**；**\"无妄之往，何之矣\"（妄动而往前，能到哪里去呢）是《易经》的反问句式**；**其判断与\"复卦上六迷复\"（终迷不复者大凶）正好接上**：**复卦讲\"回头\"的价值，无妄卦讲\"不回头\"的后果**——**两卦相邻，讲的是一件事的两面。**","o":"TJ-0318 · 天纪·人间道·无妄卦（PDF 第67页）"},{"t":"一百二十一、无妄之义","h":"象：\"各正性命\"——对时育万物","c":"方法——无妄\"象\"为\"**天下雷行，物与无妄，先王以茂对时育万物**\"，其解：\"**雷行天下，阴阳和而成声，生发万物，各正性命，其发而无妄。先王观此象，体天之道，养育人民，使各正性命——乃'对时育物'之道也。**\" **\"各正性命\"四字，是全卦最高的一个目标**：**不是\"都一样\"，是\"各自正其本性\"**——**雷生发万物，不是把万物长成一个样，是让每一样长成它该有的样子。** **而\"茂对时育万物\"的\"对时\"二字更关键**：**\"对\"是\"应合\"，\"时\"是\"时令\"**——**即：养育要\"合于时\"，不是\"随时都用力\"。** **须说明**：**这是《易经》原文（无妄大象）**；**其现代可用的核是\"两件事\"**：**①目标——使人\"各正性命\"（各自成为他该成为的样子，不是一律）**；**②节奏——\"对时\"（合于时机）**。**这一条与\"复卦至日闭关\"（顺时保养）是同一套时间观**，**也与\"临卦教思无穷、容保民无疆\"相通**：**三处都在讲\"养育\"这件事，而\"养育\"的关键是\"顺其时、成其性\"。**","o":"TJ-0319 · 天纪·人间道·无妄卦（PDF 第67页）"},{"t":"一百二十二、六爻（无妄卦动以天）","h":"初爻：\"无妄，往吉\"——至诚无往不利","c":"方法——初爻\"**无妄，往吉**\"。其解：\"**初进阳刚在内，以无妄之天理行之于外，故往吉。**\"其\"象\"是全卦最开阔的一条：\"**无妄乃诚也。人之至诚，物无不感动——君子以之修身则身正，以之治事则得理，以之待人则人化，无往不利也。**\" **\"以之修身则身正，以之治事则得理，以之待人则人化\"三句，是\"至诚\"在三个领域的效用**：**对内（修身）→身正；对事（治事）→得理；对人（待人）→人化**。**而\"物无不感动\"是它的总纲**——**诚能\"感\"，故\"无往不利\"。** **须说明**：**这是《易经》原文（无妄初九）**加讲义之解；**\"人化\"的\"化\"是\"感化、渐化\"**（**与贲卦\"化成天下\"同义**）；**其可用的核是\"一个方法通三处\"**：**不必为\"修身\"\"做事\"\"待人\"分别找方法——\"至诚\"是三者的公分母。**","o":"TJ-0320 · 天纪·人间道·无妄卦·初爻（PDF 第68页）"},{"t":"一百二十二、六爻（无妄卦动以天）","h":"第二爻：\"不耕获，不菑畬\"——能胜己之欲为大勇","c":"要点——第二爻\"**不耕获，不菑畬，则利有攸往**\"，是全卦最精的一条。其解：\"**人之欲即妄，理之自然者非妄。今以耕获喻之：农耕后之获，乃理之自然也。田一岁为'菑'，三岁曰'畬'；有耕而有获，有菑而有畬。圣人顺时而作，乃为圣也——读《易》之人，能知时顺势，得《易》之道矣。**\"其\"象\"更狠：\"**心念于始耕菑之时，乃为求畬，此所以为富；心有欲而为，则妄。故《易》言人之行但求合于自然，不为人欲所动——故能胜己之欲为大勇也。**\" **\"不耕获，不菑畬\"要解**：**\"耕\"了才有\"获\"、\"菑\"（开垦一年）才有\"畬\"（熟田三年）——这些是\"理之自然\"（该来的时候自然会来）**；**而\"妄\"是\"在耕的时候心里想着获\"**（**\"心念于始耕菑之时，乃为求畬\"**）。**即：问题不在\"求收获\"，在\"刚开始就盯着结果\"。** **而末句\"能胜己之欲为大勇也\"是我在这一卦里最看重的一句**：**\"勇\"通常指\"敢对外\"，此处指\"敢对内\"**——**\"胜己之欲\"比\"胜人\"更难，故为\"大勇\"。** **须说明**：**这是《易经》原文（无妄六二）**；**\"菑畬\"是古代农事术语**；**其可用的核是\"做事时不想结果\"**——**不是\"不要结果\"，是\"不要在做的当下被结果牵着\"。**","o":"TJ-0321 · 天纪·人间道·无妄卦·第二爻（PDF 第68页）"},{"t":"一百二十二、六爻（无妄卦动以天）","h":"第三爻：\"无妄之灾\"——妄得之得，皆非真得","c":"风险——第三爻\"**无妄之灾，或系之牛，行人之得，邑人之灾**\"，是\"无妄之灾\"这个成语的出处。其解：\"**人之妄动，由己之欲也；妄动有得，亦必有失。阴柔居相位，动乃因妄，失之大在欲——故妄得之福，灾亦随之；妄得之得，失亦来之，皆非真得也。**\"其\"象\"：\"**有得有失，不足言得。圣人之得，乃无欲而得，不言有失。**\" **这一爻的判断极干净**：**\"妄得之福，灾亦随之；妄得之得，失亦来之，皆非真得也\"**——**凡是以\"妄\"（不合正理）得来的东西，都\"不是真得\"**（**因为它带着对应的失**）。**须说明**：**\"无妄之灾\"的原义与讲义的解释有出入**：**原义是\"有人把牛系在路边，路人顺手牵走，同邑的人却因此被牵连怀疑\"**（**即：无辜受累**）；**而讲义的解偏向\"妄动必有失\"**（**即：妄的代价**）。**本集两条都记**：**\"无辜受累\"是该成语的通行义**（**遇到这种事，属\"非己之过\"，不必自责**）；**\"妄得之得皆非真得\"是讲义给出的义理**（**可独立成立，且极有价值**）。**这一条我认为须特别标明，因为二者的用法不同**（**混用会把\"被牵连\"错解成\"自己有错\"**）。","o":"TJ-0322 · 天纪·人间道·无妄卦·第三爻（PDF 第68页）"},{"t":"一百二十二、六爻（无妄卦动以天）","h":"第四、五爻：\"可贞\"与\"勿药有喜\"","c":"方法——**第四爻\"可贞，无咎\"**：\"**四位刚而居之，刚则必无私，永不生妄。**\"其\"象\"：\"**坚心守无妄之道，刚而无欲，则无灾。**\" **第五爻\"无亡之疾，勿药有喜\"**（**\"无亡\"即\"无妄\"**）：\"**九五为尊位，以阳刚应之，下又以阳刚中正顺应，则致善也。即令有小疵，不须去治而自愈——如持之以恒，则平安无灾。戒之在动——一动生妄，故人君之无妄道即在此。**\" **第四爻的核是\"刚则无私，永不生妄\"**：**\"刚\"在此指\"有原则、不含糊\"**——**而\"无私\"是因为\"刚\"（不因人而改），所以\"永不生妄\"。** **第五爻的\"勿药有喜\"极好**：**\"即令有小疵，不须去治而自愈\"**——**小毛病不用治，自己会好**；**而其条件写得很清楚**：**\"戒之在动——一动生妄\"**（**别去折腾它**）。**须说明**：**这是《易经》原文（无妄九四、九五）**；**\"勿药有喜\"在后世成为中医的名言**（**\"小病不药而愈\"的意思**）；**⚠ 但本集须加一句限定**：**\"勿药有喜\"只适用于\"小疵\"（轻微、自限的问题），不可推广成\"什么病都不用治\"**——**本书医学部分对\"讳疾忌医\"有多处批评，与此并不冲突**（**此爻的前提明确是\"即令有小疵\"**）。","o":"TJ-0323 · 天纪·人间道·无妄卦·第四、五爻（PDF 第68页）  ---"},{"t":"一百二十三、无妄之极","h":"上爻：\"无妄，行有眚\"——连\"无妄\"过头也是妄","c":"风险——无妄上爻\"**无妄，行有眚，无攸利**\"，是全卦最微妙的一条。其解：\"**此位为卦之极，无妄已至善；人至无妄，又复行，理必过也——过于理，则生妄。**\"其\"象\"：\"**无妄已为极点，今又复加进，乃生妄矣，故穷极而生灾也。**\" **这一爻给出了\"无妄\"自身的限度**：**\"无妄\"（不妄动）本身是至善，但\"到了极点还要再往前\"就成了\"过\"**——**而\"过于理，则生妄\"**。**即：连\"不妄\"这件事，做过头也变成\"妄\"。** **须说明**：**这是《易经》原文（无妄上九）**；**它与\"谦卦上六鸣谦\"（\"极谦反居高位为太过于谦\"）是同一结构**：**任何德性推到极端都会反转**；**其可用的核是\"德性也有上限\"**：**\"正确\"不意味着\"越正确越好\"**——**当一个人\"以正确自居\"而不肯停，那个\"正确\"本身就成了新的\"妄\"。**","o":"TJ-0324 · 天纪·人间道·无妄卦·上爻（PDF 第68~69页）"},{"t":"一百二十三、无妄之极","h":"第五爻之象：\"无妄之药，不可试也\"","c":"要点——无妄第五爻\"无妄之疾，勿药有喜\"的\"象\"补了一句极妙的话：\"**无妄之药，不可试也**\"，其解：\"**人有妄必改，则致无妄；今反以药治之，反成妄矣。故不可试。**\" **这一句可以做两层读**：**①字面（医学）**：**\"无妄之疾\"（本来就会自愈的小毛病）不可以用药去\"试\"**（**一试就成\"妄\"**）；**②义理（修养）**：**\"妄\"这个东西只能靠\"改\"来治，不能靠\"外力\"来治**——**用外力去治\"妄\"，那个\"外力\"本身就是新的妄。** **须说明**：**\"无妄之药，不可试也\"是《易经》原文（无妄九五象）**；**⚠ 医学层面的\"不可试\"须严格限定**：**原爻的前提是\"无妄之疾\"（轻微、自限之疾），不是\"任何病都不用药\"**——**本集在此重申**：**诊断不明、症状持续、指标异常的情况，须就医评估，不可援引此句拒诊。**","o":"TJ-0325 · 天纪·人间道·无妄卦·第五爻（PDF 第68页）"},{"t":"一百二十四、大畜之义","h":"\"止而后聚\"——外止内健","c":"定义——大畜卦（山天大畜）为\"**龙潜大壑之课，积小成大之象**\"，其卦序与卦体：\"**无妄则至善，可以积畜，故大畜为序卦。畜为止，又为聚——止而后聚。此卦天至大，而在山中，有所畜至大之象。外止内健为畜象；吾人视万物，外则无欲即止也，内则运行不断，必有大积畜于其中。**\" **\"畜为止，又为聚——止而后聚\"这一句，把\"积累\"的机制说清了**：**先\"止\"（停下来、不散），才能\"聚\"（积起来）**——**即：积累的前提是\"先不流失\"。** **而\"外止内健\"四字更准**：**外面\"止\"（无欲、不动摇），内里\"健\"（运行不断）**——**两者合起来才是\"畜\"。** **卦图四物**：**①\"一鹿一马：禄马交驰，大富之象\"**；**②\"月下有文书：明而有往，中秋时节，文书在空中尚未到手\"**；**③\"官人凭栏：无事状，遥望所失之国度。又栏为木，人靠木，休也，棺也\"**；**④\"花在盆中：有限也\"**。**其中\"花在盆中：有限也\"一物极值一提**：**花长在盆里，好看但\"有限\"**——**这正是\"畜\"的反面**（**装得下的，就长不大**）。**其总断为\"求官不利，求财大利\"**（**属象数断语，本集不作采信**）。","o":"TJ-0326 · 天纪·人间道·大畜卦（PDF 第69页）"},{"t":"一百二十四、大畜之义","h":"卦辞：\"不家食吉\"——畜在学术道德，不在钱财","c":"要点——大畜卦辞为\"**大畜：利贞，不家食，吉，利涉大川**\"。其解是全书对\"什么是真正的积累\"最正的一段：\"**大畜于人亦同。人之畜在学术道德，充积于内，乃至大之畜。若为邪端异说，畜又何用？今人重大畜于钱财，不重视学术修养，所畜何用？不为大畜。**\" **\"人之畜在学术道德\"六个字，把这个卦从\"财富\"彻底拉到了\"修养\"**：**同样是\"积累\"，积钱与积学，前者不叫\"大畜\"。** **而\"若为邪端异说，畜又何用\"一句则更进一层**：**积累本身不是价值**——**积累什么才是**（**积错了方向，再多也无用**）。**须说明**：**\"不家食吉\"是《易经》原文**（**\"不家食\"＝不在家里吃饭，即出而食禄于朝、施其所学于天下**）；**\"今人重大畜于钱财\"是讲义的时代批评**，**但其机制可独立理解**：**一个社会若把\"积累钱财\"当作唯一的\"大畜\"，则\"学术道德\"这一类无法快速变现的积累必然被放弃**。**这一条与\"贲卦但求外饰不求内实\"（败亡之初始象）是同一诊断的另一面。**","o":"TJ-0327 · 天纪·人间道·大畜卦（PDF 第69页）"},{"t":"一百二十四、大畜之义","h":"彖：\"刚健笃实辉光，日新其德\"","c":"方法——大畜\"彖\"为\"**大畜刚健，笃实辉光，日新其德**\"，其解：\"**人须能刚健笃实，其畜乃大；又因充实而光辉，德必日新。**\" **\"刚健、笃实、辉光、日新\"四个词，构成了一条完整的因果链**：**\"刚健\"（有力量不停滞）→\"笃实\"（扎实不虚浮）→\"辉光\"（因充实而外显）→\"日新\"（每天都是新的）**。**注意\"辉光\"的位置**：**它不是\"装饰\"，是\"充实\"之后自然发出来的光**——**这与\"贲卦山下有火、增益其光彩\"是同一逻辑**（**光来自\"实\"，不来自\"饰\"**）。**须说明**：**这是《易经》原文（大畜彖）**；**\"日新其德\"四字后来成为中国文化中\"日新\"观念的源头之一**（**《大学》\"苟日新，日日新\"、商汤\"盘铭\"皆与此呼应**）；**其可用的核是\"积累的方向与结果\"**：**真正的积累，结果是\"每天的自己都是新的\"**——**而不是\"越来越旧\"。**","o":"TJ-0328 · 天纪·人间道·大畜卦（PDF 第69页）"},{"t":"一百二十四、大畜之义","h":"\"刚上而尚贤，能止健\"——刚而不明者，非大正","c":"风险——大畜\"彖\"又有\"**刚上而尚贤，能止健，大正也**\"，其解：\"**居尊位能刚明用贤，又能持之永恒，此大正之道。今之君王刚而不明，用人乃因私欲，而不以贤能为基准，故非大正之道。**\" **这一处给了\"大正之道\"的三个条件**：**①\"刚明\"（有决断且看得清）**；**②\"用贤\"（以贤能为基准）**；**③\"持之永恒\"（守得住）**。**而它对\"今之君王\"的判断是\"刚而不明\"**：**有决断，但看不清**——**于是\"用人乃因私欲，而不以贤能为基准\"**。**须说明**：**这是《易经》彖传原文加讲义之解**；**\"刚而不明\"这个组合很值得记**：**\"刚\"（敢做）与\"明\"（看清）本是两件事**——**只有\"刚\"而无\"明\"，决断越快，偏得越远**（**这与\"噬嗑卦全刚则伤于严暴\"同一判断**）。**其可用的核是\"用人的基准\"**：**看一个人\"以什么为标准选人\"——以\"贤能\"为标准是\"大正\"，以\"私欲\"为标准则\"非大正\"**（**而后者往往披着\"刚\"的外衣**）。","o":"TJ-0329 · 天纪·人间道·大畜卦（PDF 第69页）"},{"t":"一百二十四、大畜之义","h":"象：\"多识前言往行，以畜其德\"","c":"方法——大畜\"象\"为\"**天在山中，大畜；君子以多识前言往行，以畜其德**\"，其解极完整：\"**君子观天之至大而畜山中，故知人之能畜大，乃由学而大——学之道在多闻古圣贤之言行，取长为己用、察言以求其内心，乃大畜之真义。**\" **\"多识前言往行，以畜其德\"八个字，是《易经》对\"学习\"最精确的一次表述**：**\"前言往行\"（前人的话与前人的事）**——**不是\"知识\"，是\"言行\"**（**值得学的，是\"他们怎么说话、怎么做人做事\"**）；**\"多识\"（多知道）**——**强调量与广度**；**\"以畜其德\"**——**目的是\"积德\"，不是\"积信息\"。** **而讲义的解法更具体，给了三步**：**①\"多闻古圣贤之言行\"（多看）**；**②\"取长为己用\"（拿来用）**；**③\"察言以求其内心\"（从他的言论里看他的内心）**。**须说明**：**\"多识前言往行，以畜其德\"是《易经》原文（大畜大象）**；**其判断在当代尤其有价值**：**信息极多，但\"前言往行\"（经过时间检验的言行）与\"资讯\"（当下流通的消息）是两类东西**；**而\"畜其德\"是判据**——**凡读了之后能\"积德\"（使自己更稳、更正）的，才是\"大畜\"；读完只觉得\"知道更多\"的，只是\"多识\"而无\"畜\"。**","o":"TJ-0330 · 天纪·人间道·大畜卦（PDF 第69页）"},{"t":"一百二十五、畜止","h":"初、二、三爻：有厉利己、舆说輹、良马逐","c":"方法——大畜前三爻讲\"什么时候该停、什么时候该动\"。**初爻\"有厉，利己\"**：\"**初爻为阳刚，必上进不已，则有危厉；此时利在己之畜而不进，待与上合志乃动。**\"其\"象\"：\"**此即不度局势而进——不利己，乃灾至。戒不可犯危而行。**\" **第二爻\"舆说輹\"**：\"**二为六五位所对应，虽阳刚但亦不可力进——进则如车轮脱轴，不得行也。**\"其\"象\"：\"**至善为刚中；柔不可过柔，因位居下，仍不足以进。《易》之道，乃知所进退也。**\" **第三爻\"良马逐，利艰贞，曰闲舆卫，利有攸往\"**：\"**三为相位，以刚健之才，能与上位合志而同进，就如良马之驰，速也。唯虽速，但须切忌不可持才之健，而忘戒备与谨慎也。**\"其\"象\"：\"**因能与上合志，故往而利也。**\" **三爻的次序极清**：**初爻\"利己\"（停）→第二爻\"舆说輹\"（停下，因为动不了）→第三爻\"良马逐\"（终于可以快）**。**而三者共同的判据是\"与上合志\"**：**能停，是因为\"还没到合的时机\"；能快，是因为\"已经合了志\"。** **须说明**：**这是《易经》原文（大畜初九、九二、九三）**；**⚠ 第三爻\"切忌不可持才之健，而忘戒备与谨慎\"这一句最值得单记**：**\"快\"的时候最容易出事**（**\"良马之驰\"越顺，越容易忽略\"舆卫\"（车马的保护）**）；**\"曰闲舆卫\"的\"闲\"是\"习\"（反复演练护卫之事）**。","o":"TJ-0331 · 天纪·人间道·大畜卦·初、二、三爻（PDF 第70页）"},{"t":"一百二十五、畜止","h":"第四、五爻：\"童牛之牿\"与\"豮豕之牙\"——止恶于初","c":"方法——第四爻\"**童牛之牿，元吉**\"，是全卦最实用的一条。其解：\"**此言近君位之人，须上畜止人君之邪心，下畜止天下之恶。凡人之恶能止于初始，则易如童牛加桎梏；俟恶盛而后禁，必相隔而难胜。故圣人止恶于初。**\"其\"象\"：\"**大畜之道在止恶于初，此大善而吉，必能不劳而易治。**\" **第五爻\"豮豕之牙，吉\"**：\"**猪之去势，则虽有牙，而刚躁必自止。**\" **\"童牛之牿\"的比喻极准**：**小牛还没长角，先给它加个横木（牿）**——**不是\"等它长出角再去绑\"，而是\"在它还没有力量的时候就先约束\"。** **而\"俟恶盛而后禁，必相隔而难胜\"这一句，说明了\"晚治\"的代价**：**等到恶已盛大再去禁，中间隔得远，就\"难胜\"了。** **第五爻\"豮豕之牙\"则是另一种手法**：**\"去势\"（从根源上去掉它的躁性）**，**而不是\"拔牙\"（去掉它的表现）**——**牙还在，但因\"刚躁自止\"，牙已无害。** **须说明**：**这是《易经》原文（大畜六四、六五）**；**两爻合起来，给了\"止恶\"的两种方法**：**①\"牿\"——在早期用外部的约束**（**趁力量未成**）；**②\"豮\"——从根源上去掉它的动力**（**不与其表象纠缠**）。**而两者都指向同一原则**：\"**止恶于初**\"（**与\"噬嗑初九因小惩而有大戒\"\"剥卦剥床以足\"是同一判断的第四次出现**）。","o":"TJ-0332 · 天纪·人间道·大畜卦·第四、五爻（PDF 第70页）  ---"},{"t":"一百二十六、大畜之终","h":"六五之后：止恶须查其根本","c":"方法——大畜第五爻\"豮豕之牙\"的解说后文，有一段极重要的推论：\"**君子体之，知天下之恶，不可力制之——须查其根本，不靠刑法严峻而能止恶。圣人教修政教，使人人足用、知廉耻之心，方为至善。**\"其\"象\"：\"**在上者止恶有道，乃天下福庆也。反用强力严刑与民为敌，伤又无功矣。**\" **这一段把\"止恶\"的层次说清了**：**\"恶\"不能\"力制\"（硬压），因为它是\"果\"，不是\"因\"**——**故须\"查其根本\"。** **而\"根本\"是什么，它也给了答案**：**\"使人人足用，知廉耻之心\"**——**先让人\"够用\"（有基本保障），再让人\"知廉耻\"。** **须说明**：**这是讲义之解（非《易经》原文）**；**\"反用强力严刑与民为敌，伤又无功矣\"一句，是全册对\"严刑峻法\"最直接的一次否定**（**\"伤\"（伤害）与\"无功\"（无效）并列，说明它两头都不占**）；**这一条与\"噬嗑卦\"并不矛盾**：**噬嗑讲\"刑罚不可废\"，此爻讲\"刑罚不可独用\"**——**一个讲\"要用\"，一个讲\"不能只用\"。** **其现代对应即\"治标与治本\"**：**强力可止一时之恶，但若不查根本（不足用、不知耻），恶必复生。**","o":"TJ-0333 · 天纪·人间道·大畜卦·第五爻（PDF 第70~71页）"},{"t":"一百二十六、大畜之终","h":"上爻：\"何天之衢\"——大畜之极","c":"要点——大畜上爻\"**何天之衢，亨**\"。其解：\"**大畜之道，能如行空中，横行无阻，必散之天下，吉也。**\"其\"象\"：\"**道路空旷，而能大行，乃大畜之极也。**\" **\"何天之衢\"（何等通畅的天路）这个意象，是大畜卦的收口**：**积到最后，不是\"存着\"，是\"散之天下\"**——**\"道路空旷，而能大行\"。** **须说明**：**这是《易经》原文（大畜上九）**；**其判断与\"卦辞不家食吉\"（施其所畜，利于天下）完全一致**：**\"畜\"的目的不是\"守\"，是\"用\"**——**而\"能大行\"才是\"畜\"的完成**。**这一条与\"蛊卦振民育德\"\"临卦教思无穷\"一路**：**三者都指向\"所学所积终须流向外面\"。**","o":"TJ-0334 · 天纪·人间道·大畜卦·上九（PDF 第71页）"},{"t":"一百二十七、颐养之道","h":"大畜之后必有所养","c":"定义——颐卦（山雷颐）为\"**龙隐清潭之课，迁善远恶之象**\"，其卦序与卦体：\"**万物畜聚之后，必有所养，无养不成，故颐者，养也，次大畜之序卦。上艮下震，乃上止而下动，外实中虚象，如人颔颐物于口中象。人之口所以饮食，乃能养人之身，此为颐。此论颐养之道：大至于天地养万物、圣人养贤，人之养生、养形、养德、养人、养才，皆属颐养之道。**\" **\"万物畜聚之后，必有所养，无养不成\"这一句，给了\"畜\"与\"养\"的关系**：**积累之后必须\"养\"**——**否则\"不成\"（积了也用不上）。** **而\"颐\"的取象是\"口\"**：**\"上止下动，外实中虚，如人颔颐物于口中\"**（**上下颚含着一口食物**）。**而其范围被讲义列得极宽**：**天地养万物、圣人养贤、人之养生／养形／养德／养人／养才**——**六种\"养\"，都是\"颐\"。** **须说明**：**\"颐\"本义为\"面颊、下颌\"，引申为\"养\"**；**其现代可用的核是\"养的范围比'吃'大得多\"**：**\"养生\"只是六分之一**——**还有\"养德\"\"养人\"\"养才\"**。**这一点是《易经》与中医在概念上最直接交叠的一处**（**同一个\"颐\"字，卦上讲六种养，医上讲\"养生\"。**）","o":"TJ-0335 · 天纪·人间道·颐卦（PDF 第71页）"},{"t":"一百二十七、颐养之道","h":"卦辞：\"观颐，自求口实\"","c":"要点——颐卦辞为\"**颐：贞吉，观颐，自求口实**\"，其解：\"**颐之养人，君子观之；'自求口实'之道，乃养君子。口不实又不知养，小人。**\" **\"自求口实\"三字，是颐卦的核心**：**\"口实\"是\"口中之实\"（吃的东西），引申为\"自己养活自己的凭据\"**；**\"自求\"则是\"自己去求\"**——**即：不靠别人给。** **而\"口不实又不知养，小人\"一句，把判据给了**：**\"口不实\"（没有真本事、没有可立身的凭据）＋\"不知养\"（还不去学去养），就是\"小人\"。** **须说明**：**\"观颐，自求口实\"是《易经》原文（颐卦辞）**；**彖中给出的两个\"观\"更清楚**：\"**观颐，观其所养也；自求口实，观其自养也**\"——**即：一看\"你养的是谁\"（所养），二看\"你怎么养自己\"（自养）**。**这两问可以作一次自查**：**我把资源投在谁身上？我靠什么养活自己？**","o":"TJ-0336 · 天纪·人间道·颐卦（PDF 第71页）"},{"t":"一百二十七、颐养之道","h":"\"养正则吉\"与\"圣人养贤以及万民\"","c":"方法——颐卦\"彖\"为\"**颐，贞吉，养正则吉也；观颐，观其所养也；自求口实，观其自养也。天地养万物，圣人养贤以及万民，颐之时大矣哉**\"，其解：\"**吾人所养之人及养生之道，皆不外'自求口实'，皆以正则吉。圣人养贤，使之食天禄，为求贤才施惠于天下——此养贤即养万民也。**\" **\"养正则吉\"四字，是颐卦的判据**：**\"养\"本身不判吉凶，看\"正不正\"**——**养对了（正）则吉，养错了（不正）则凶。** **而\"圣人养贤以及万民\"这一句，把\"养\"的路径说清了**：**不是\"圣人直接养万民\"，是\"圣人养贤→贤施惠于天下→万民得养\"**——**即：养万民要经过\"养贤\"这一道**。**须说明**：**这是《易经》彖传原文加讲义之解**；**\"此养贤即养万民也\"一句是讲义的关键推论**：**养贤不是\"厚待少数人\"，而是\"通过他们惠及所有人\"**。**其可用的核是\"投资对象\"**：**资源有限时，投给\"能把它变成更多人的福利\"的人，比\"平均分发\"更有效**——**而\"正\"字是限制条件**（**养的必须是\"贤\"，不是\"亲近的人\"**）。","o":"TJ-0337 · 天纪·人间道·颐卦（PDF 第71页）"},{"t":"一百二十七、颐养之道","h":"象：\"慎言语，节饮食\"","c":"方法——颐卦\"象\"为\"**山下有雷，颐；君子以慎言语，节饮食**\"，其解是全书最著名的一条养生主张：\"**以象言，雷震于山下，万物根动而萌芽，此天地养之象。君子知口所以养身，故慎言语以养其德，节饮食以养身。**\" **\"慎言语，节饮食\"六个字，把\"口\"的两项功能分别归了属**：**口用来\"说话\"——故\"慎言语\"（养德）；口用来\"饮食\"——故\"节饮食\"（养身）**。**即：同一个\"口\"，一正一反，两个方向都要\"节\"。** **须说明**：**\"君子以慎言语，节饮食\"是《易经》原文（颐卦大象）**；**这一条与本书医学部分的养生主张完全一致**（**倪氏医论中对\"饮食过量\"\"寒凉生冷\"\"不节制\"有大量批评**）；**其可用的核极简单**：**养生不必玄，先把\"嘴\"管住**——**少说伤德的话，少吃伤身的东西。** **⚠ 但须限定\"节\"字**：**\"节饮食\"是\"有节制\"，不是\"越少越好\"或\"不吃\"**——**本书医学部分反对的是\"过量、精细、寒凉、不规律\"，不是\"少吃\"；营养不足同样是病**（**这一点须讲清，以免被读成\"节食养生\"**）。","o":"TJ-0338 · 天纪·人间道·颐卦（PDF 第71页）"},{"t":"一百二十七、颐养之道","h":"初爻：\"舍尔灵龟，观我朵颐，凶\"","c":"风险——初爻\"**舍尔灵龟，观我朵颐，凶**\"。其解极妙：\"**龟之性，能咽息不食，可以不求养于外，故为灵，即明智；而人口腹之欲既动，则必失所养，故凶。**\"其\"象\"：\"**人之动为欲，即使有刚健之才、再明智，终亦必失，故不足贵也。**\" **\"灵龟\"的比喻极准**：**龟能\"咽息不食\"（吞咽气息而不进食），故\"可以不求养于外\"**——**这就是\"明智\"（能自立）。** **而\"舍尔灵龟，观我朵颐\"则是：**放弃了自己那份\"能自立的本事\"，转去看别人\"大快朵颐\"（吃得满口）**——**即：本来是能自己活的，却盯着别人的口粮。\"朵颐\"这个动作（腮帮子鼓动着吃）极形象。** **须说明**：**这是《易经》原文（颐初九）**；**\"即使有刚健之才、再明智，终亦必失\"这一句是把\"欲\"的破坏力说到了底**：**才能不是护身符，一旦\"动为欲\"，再强也保不住。** **其现代对应**：**明明能自立，却去比较别人碗里的东西**——**而这一比较，丢的是自己那份\"灵\"。**","o":"TJ-0339 · 天纪·人间道·颐卦·初爻（PDF 第71页）"},{"t":"一百二十七、颐养之道","h":"第二爻：\"颠颐拂经\"——不能自养而妄求","c":"风险——第二爻\"**颠颐，拂经，于丘颐，征凶**\"。其解：\"**养之道正，在'以上养下'——天子养天下、养臣子，臣食君禄，皆以上养下。今女不能自处必从男，阴不能独立必从于阳——此二爻不能自养，反求下之阳刚，故为颠倒，拂违常理，故不可行。丘即上九，为在外而高之物，故往而必凶。此即意示：人之才不足以自养，见在上位势足养人，即非同类的君子，妄往求之，取辱必矣。**\"其\"象\"：\"**征而从之，又非其类，故人求非同类……**\"（**后文在扫描件中未续，其判断已完整**）。**\"颠颐\"（颠倒的养）是什么意思，这里说清了**：**养的正道是\"以上养下\"**——**即：位高者养位下者。而此爻\"反求下之阳刚\"（往上求人养自己），是\"颠倒\"。** **而\"拂经\"（违背常理）与\"于丘颐\"（向高处求食）都指向同一件事**：**自己不能养自己，便去攀附\"位高势足\"的人**——**而其结果写作\"取辱必矣\"**。**须说明**：**这是《易经》原文（颐六二）**；**\"女不能自处必从男，阴不能独立必从于阳\"是古代的性别与阴阳预设**，**本集只取\"才不足以自养而妄求于人\"之义**，**不取其性别内容**；**其可用的核是\"求人的前提\"**：**\"非同类的君子\"（不是一路人），\"妄往求之\"，结果只有\"取辱\"**——**即：攀附与自己不同类的人，代价是尊严。**","o":"TJ-0340 · 天纪·人间道·颐卦·第二爻（PDF 第72页）  ---"},{"t":"一百二十八、颐卦后四爻","h":"第三爻：\"拂颐，贞凶\"——终不可用","c":"风险——第三爻\"**拂颐，贞凶，十年勿用，无攸利**\"。其解：\"**邪柔又动之不正，违反颐之正道，故凶。'十'为数之终，故终不可用，无所往而利。**\"其\"象\"：\"**此戒之终不可用——凡人邪而柔，又欲动，反正道大也。**\" **\"拂颐\"（违背颐养之道）的构成，讲义给了三样**：**\"邪\"（方向偏）＋\"柔\"（无力）＋\"动之不正\"（还在乱动）**——**三者叠加，故断为\"终不可用\"。** **而\"十为数之终\"是一个用字的讲究**：**\"十年勿用\"不是\"十年之后可以用\"，是\"到数之终都不能用\"**（**即：一直不可用**）。**须说明**：**这是《易经》原文（颐六三）**；**此爻是全卦最重的一条断语**（**\"无所往而利\"**）；**其可用的核是\"三者叠加最危险\"**：**方向不对、能力不足、还在乱动**——**此时任何\"往\"都无利**。","o":"TJ-0341 · 天纪·人间道·颐卦·第三爻（PDF 第72~73页）"},{"t":"一百二十八、颐卦后四爻","h":"第四爻：\"颠颐，吉；虎视眈眈\"——才不足而用贤","c":"方法——第四爻\"**颠颐，吉；虎视眈眈，其欲逐逐，无咎**\"，是全卦最实用的一条。其解：\"**阴柔居大臣之位，阴柔不足以自养，如何养天下？今如与初阳刚相应，而柔顺于初阳之贤正，吉。故如己之才不足以养天下，但知求在下之贤而顺从之，亦可吉也。但须养其威严，眈眈如虎视，以免因己才之阴柔不足养，而受人轻视，造成犯上。但亦须注意所须用者，必逐逐相继而不缺——若唯取于人又不能继，困穷至矣。**\"其\"象\"：\"**吾人能颠倒求养而又吉者，皆得自阳刚以济应其事，故能施光明于天下。**\" **这一爻给了\"才不足者居高位\"的完整方案，且有三条**：**①\"求在下之贤而顺从之\"**（**承认不足，用下面的人**）；**②\"养其威严，眈眈如虎视\"**（**但威严不能丢，否则被轻视而成\"犯上\"**）；**③\"所须用者，必逐逐相继而不缺\"**（**用的人要能持续供给，不能断档**——**\"若唯取于人又不能继，困穷至矣\"**）。**须说明**：**这是《易经》原文（颐六四）**；**\"虎视眈眈\"在此不是贬义**（**后世成语义为\"心怀不善地盯视\"，此处是\"保持威严如虎之注视\"**）；**这一条与\"蛊卦六五用誉\"（质柔者用刚贤而声誉显）同一思路**，**但多了一层警告**：**靠人办的事，最怕\"继不上\"。**","o":"TJ-0342 · 天纪·人间道·颐卦·第四爻（PDF 第73页）"},{"t":"一百二十八、颐卦后四爻","h":"第五爻：\"拂经，居贞吉，不可涉大川\"","c":"风险——第五爻\"**拂经，居贞吉，不可涉大川**\"。其解：\"**君位乃养人者，但其质如阴柔，即才不足以养天下——而能顺从于阳刚（师）之贤，赖其以济天下，必须有居安笃信之心、全般信赖，则可辅其身、德泽天下，故吉。但此种状况可依赖贤能之人于平时，不可于有困艰生变故之时——否则招凶。**\"其\"象\"：\"**居上位之吉处，乃因能笃信委任刚贤之人，来养天下。**\" **这一爻与第四爻的区别极清楚**：**第四爻（大臣）\"才不足\"仍可\"颠颐而吉\"；第五爻（君位）\"才不足\"则\"不可涉大川\"**——**即：同样的\"用贤\"，位置越高，风险越大**。**理由写在\"可依赖贤能之人于平时，不可于有困艰生变故之时\"**：**平时可以靠人，变故之时不能靠人**（**因为危机中需要\"决断\"，而决断不能代劳**）。**须说明**：**这是《易经》原文（颐六五）**；**\"全般信赖\"四字是它的条件**（**既用贤，就要真信，不能半信半疑**）；**而其限度也明确**：**\"不可涉大川\"（不能过大河、不能冒大险）**——**这一条对\"创业者／继承人\"一类处境极适用**：**守成可以托人，闯关必须自己上。**","o":"TJ-0343 · 天纪·人间道·颐卦·第五爻（PDF 第73页）"},{"t":"一百二十八、颐卦后四爻","h":"上爻：\"由颐，厉吉\"——夕惕若厉","c":"方法——上爻\"**由颐，厉吉，利涉大川**\"。其解：\"**此以阳刚之德，任师之职，君位从而笃信，天下得养也；但须夕惕若厉、戒慎恐惧，方能济天下之危，故利涉大川。**\"其\"象\"：\"**若上九之大任能谨言慎行、安居己位、不妄图权利，则必福庆至矣。**\" **这一爻是\"受托养天下\"的那个人的位置**：**\"以阳刚之德，任师之职\"（有本事、担重任）＋\"君位从而笃信\"（上面真信任他）**——**故\"天下得养\"。** **而其条件写作\"厉吉\"**：**\"夕惕若厉、戒慎恐惧\"**（**\"夕惕若厉\"出自乾卦第三爻，此处复用**）——**即：位置越重，越要\"怕\"。** **而象辞给的三条更具体**：**\"谨言慎行、安居己位、不妄图权利\"**——**三条都指向\"不越界\"**。**须说明**：**这是《易经》原文（颐上九）**；**\"由颐\"（天下由他而养）与\"何天之衢\"（大畜上九）是同类位置**：**都是\"极位而能大成\"**；**而两者的共同条件是\"不妄图\"**（**一者\"散之天下\"，一者\"安居己位\"**）。","o":"TJ-0344 · 天纪·人间道·颐卦·上爻（PDF 第73页）"},{"t":"一百二十九、大过之义","h":"\"动则有过\"——大过的两义","c":"定义——大过卦（泽风大过）为\"**寒木生花之课，本末俱弱之象**\"，其卦序：\"**颐者，养也；万物养而后能成，成而后动，动则有过，故大过次颐也。**\" **而\"大过\"这个名字，讲义给了两义，且都成一家言**：\"**大过乃论'过失之大'与'过人之大事'也。举凡世间事之大过于常者，皆是也。古圣人尽人道，非过于理之正——如今之行过乎恭、丧过乎哀、用过乎俭，皆过之也。过人之大事，本不常见，故非常人能为，如尧舜之禅让、汤武之放伐，即立不世之功，乃过人之大事。**\" **第一义是\"过失之大\"**：**凡事\"大过于常\"（超过常度），就是\"大过\"**——**包括\"行过乎恭、丧过乎哀、用过乎俭\"三种**（**恭、哀、俭本是美德，但\"过\"了也是\"过\"**）。**第二义是\"过人之大事\"**：**只有\"非常人\"能做的、立不世之功的事**（**禅让、放伐**）。**须说明**：**这是讲义之解（非《易经》原文）**；**\"行过乎恭、丧过乎哀、用过乎俭\"三句出自《礼记·檀弓》一类（孔子论\"过犹不及\"）**；**其可用的核是\"过犹不及\"的具体化**：**连\"恭、哀、俭\"这类公认的美德，做过头也属于\"大过\"**——**这一条极重要，因为它把\"过度\"从\"坏事\"扩展到了\"好事\"。**","o":"TJ-0345 · 天纪·人间道·大过卦（PDF 第73页）"},{"t":"一百二十九、大过之义","h":"卦辞：\"栋桡\"——本末弱而中重","c":"要点——大过卦辞为\"**大过：栋桡，利有攸往，亨**\"。其解给出\"大过／小过\"的分界：\"**小过与大过之分，乃小过为阴过于上下，大过乃阳过于中、上下皆弱，故有栋桡之象。此卦四阳居中，乃栋象，能任重也——即君子盛而小人衰，故利有攸往可亨。**\"而\"彖\"的补充极清楚：\"**栋桡，本末弱也**\"——\"**本末为阴而中为重阳，故为栋桡。**\" **\"栋桡\"（栋梁弯曲）这个取象，是全卦的形**：**四阳在中间（重），两端是阴（弱）**——**\"本末弱\"（两头弱）而\"中重\"（中间压得重），栋梁就弯了。** **即：\"大过\"的危机不是\"中间太强\"，是\"两头撑不住\"。** **须说明**：**\"栋桡\"是《易经》原文（大过卦辞）**；**其现代可用的核极准**：**当一个系统\"中间承载过重、两端支撑不足\"（中坚层压力过大、基层与顶层都弱），\"栋桡\"（结构性弯折）是必然的**——**而\"利有攸往\"的解法是\"君子盛而小人衰\"**（**即：把支撑的部分换成人）。**","o":"TJ-0346 · 天纪·人间道·大过卦（PDF 第73页）"},{"t":"一百二十九、大过之义","h":"彖：\"刚过而中，巽而说行\"","c":"方法——大过\"彖\"有\"**刚过而中，巽而说行，利有攸往，乃亨**\"，其解：\"**虽因阳刚有过，但处不失中道，巽顺和悦，无以私心，必利攸往，所以亨。**\" **这一句承认\"过\"的存在（\"阳刚有过\"），但给出了\"过而能亨\"的条件**：**①\"处不失中道\"（位置、分寸不失）**；**②\"巽顺和悦\"（柔顺、和悦）**；**③\"无以私心\"（不掺私）**。**即：有\"过\"不可怕，怕的是\"过而不中、过而不顺、过而有私\"。** **须说明**：**这是《易经》原文（大过彖）**；**与\"彖\"另一句\"**大过之时大矣哉**\"合看，意思更完整**：\"**人能立非常之大事、立不世之大功，乃真大过；处之时得宜，乃大哉。**\"——**\"大过\"要成\"大事\"，关键是\"处之时得宜\"**（**该大的时候大，不该大的时候不大**）。","o":"TJ-0347 · 天纪·人间道·大过卦（PDF 第73页）"},{"t":"一百二十九、大过之义","h":"象：\"独立不惧，遯世无闷\"","c":"方法——大过\"象\"为\"**泽灭木，大过；君子以独立不惧，遯世无闷**\"，其解是全册最有分量的一段之一：\"**泽本润养于木，今至灭没于木，此过之甚矣，为天地之象。君子（人才）观大过之象，以立其'大过于人'之行——其所以能大过于人者，乃其能独立不惧：天下诽之，亦无动其心；举世不见……**\"（**后文在扫描件中未续，但两个判断已完整**）。**\"泽灭木\"这个取象**：**泽本来是\"润养\"木的，现在反而\"灭没\"了木**——**水多到把树淹死，这就是\"过之甚\"。** **而\"独立不惧，遯世无闷\"八个字，是《易经》对\"独立人格\"最著名的一次表述**：**\"独立不惧\"——一个人站着，不怕**；**\"遯世无闷\"——被世所弃（遯世），心里不闷**。**而其理由写明**：\"**天下诽之，亦无动其心**\"——**天下人都说你不对，你的心也不动。** **须说明**：**\"君子以独立不惧，遯世无闷\"是《易经》原文（大过大象）**；**\"遯世无闷\"后来成为中国文化中\"隐逸人格\"的经典表述**（**与\"蛊卦上九不事王侯\"\"观卦上九不在其位而道德为天下所观\"一脉**）；**本集认为这一条是人间道部分最耐读的一句**——**因为它给出的不是\"如何成功\"，是\"如何在被否定时仍站得住\"。**","o":"TJ-0348 · 天纪·人间道·大过卦（PDF 第73页）  ---"},{"t":"一百三十、大过六爻","h":"初爻：\"藉用白茅\"——敬慎之至","c":"方法——初爻\"**藉用白茅，无咎**\"。其解：\"**此以阴柔而处卑下；'藉用茅'为至薄之物，但用之亦很慎重——此为敬慎之至也，故可以无灾。**\"其\"象\"：\"**此示意阴柔而居卑下，过于敬慎之意，此至慎之道。**\" **\"藉用白茅\"须解**：**\"藉\"是垫（把东西垫在下面），\"白茅\"是最薄最普通的垫物**——**即：本来随便垫垫就够了，却用最讲究的方式去垫。** **这就是\"敬慎之至\"**：**不是\"大事上谨慎\"，是\"在最不起眼的小事上也谨慎\"。** **须说明**：**这是《易经》原文（大过初六）**（**\"藉用白茅\"后来成为\"过分谨慎\"的典故**）；**其可用的核是\"位置低时的正解\"**：**才不足以当大任时，\"过度谨慎\"不是缺点，是\"无咎\"的唯一路径**（**与\"蛊卦初六厉终吉\"\"乾卦初九潜龙勿用\"一脉**）。","o":"TJ-0349 · 天纪·人间道·大过卦·初爻（PDF 第74页）"},{"t":"一百三十、大过六爻","h":"第二、五爻：枯杨生稊与枯杨生华","c":"要点——大过卦的**第二爻\"枯杨生稊，老夫得其女妻，无不利\"**与**第五爻\"枯杨生华，老妇得其士夫，无咎无誉\"**，是同一件事的两个方向，也是全卦最精确的一组对照。**第二爻之解**：\"**二为柔位，阳刚居柔，是过刚之人而能以中自处、与柔相济；其功如老夫之得女妻，则亦能成生育之功。**\"其\"象\"：\"**老夫少妻之配，虽过于常份，但老夫能悦少女、而少女能顺老夫，亦无灾。**\" **第五爻之解**：\"**君位处大过之时，下无助援，就如枯杨不生根而生外表——其表秀虽可见，但却无益于枯也。犹如老妇之与士夫，此虽无咎，但非美也，其可丑乎。**\"其\"象\"：\"**枯杨不生根而生华秀之外表，必不能长久；老妇得士夫，必不能成生育之功也。**\" **两爻的差别全在**\"**稊**\"**与**\"**华**\"**：**\"稊\"是从根部生出的新芽（\"生稊\"——根还活着）；\"华\"是开在枝上的花（\"生华\"——只有花，根已枯）。** **即：一个是\"从根上复活\"，一个是\"在表面上开花\"**——**前者\"无不利\"，后者\"无咎无誉\"（不算错，但也不值得称赞）。** **须说明**：**这是《易经》原文（大过九二、九五）**；**原文的\"老夫女妻\"\"老妇士夫\"是古代的婚配喻象**，**本集取其\"结构\"义**（**\"以刚处柔、阴阳相济\"与\"下无助援、只有外表\"**），**不取其年龄与性别内容**；**而\"枯杨生华\"这个判断在当代极有用**：**当一件事\"只有面子上的热闹，没有根上的生长\"，它\"必不能长久\"**——**这与\"贲卦贲饰之极则失于外伪\"是同一判断。**","o":"TJ-0350 · 天纪·人间道·大过卦·第二、五爻（PDF 第74页）"},{"t":"一百三十、大过六爻","h":"第三爻：\"栋桡，凶\"——栋梁之才而无人辅","c":"风险——第三爻\"**栋桡，凶**\"。其解是全卦对\"刚过之甚\"最完整的一次批评：\"**九三以'太过之阳刚'自居，又不得中道——此刚过之甚，其动必违和于中、拂逆众心。故即以栋梁之才，而无人自辅，安能当大过之任乎？故凶。君子居大过之时、立大过之功，非刚柔适中、得人之辅，则不能也。**\"其\"象\"：\"**此即刚强之过，必不能取于人，人亦无法辅之，此其凶也。**\" **\"即以栋梁之才，而无人自辅，安能当大过之任乎\"这一句，是全卦最要紧的判断**：**\"才\"大不等于\"任\"能当**——**因为\"大过之任\"（栋梁之重）需要\"辅\"，而刚过之甚者\"必不能取于人\"（没人肯来辅他）。** **而其因果链极清楚**：**\"刚过之甚\"→\"其动必违和于中、拂逆众心\"→\"必不能取于人\"→\"人亦无法辅之\"→\"凶\"。** **须说明**：**这是《易经》原文（大过九三）**；**\"非刚柔适中、得人之辅，则不能也\"是它的结论**，**而这正与\"大过彖\"的\"刚过而中，巽而说行\"（过而能亨的条件）恰好相反**——**即：同样是\"刚过\"，\"中\"则亨，\"不中\"则凶。**","o":"TJ-0351 · 天纪·人间道·大过卦·第三爻（PDF 第74页）"},{"t":"一百三十、大过六爻","h":"第四爻：\"栋隆，吉\"——以刚处柔则相济","c":"方法——第四爻\"**栋隆，吉，有它吝**\"。其解：\"**此近君之位，又当大过之任——'以刚处柔则能相济'，是吉也。但如有异志，则刚必失中，此加累于阳刚——虽不致有大害，但亦可吝也。**\"其\"象\"：\"**栋能隆起则吉，不可曲桡就下。**\" **第三爻与第四爻恰成一对**：**第三爻\"栋桡\"（弯曲、塌下）；第四爻\"栋隆\"（隆起、撑住）**——**同样在\"栋梁\"的位置，一个塌了，一个撑住了。** **差别在\"以刚处柔\"**：**第四爻是柔位（阴位）而刚爻居之，\"刚\"放在\"柔\"的位置上，就\"能相济\"**——**即：硬的东西放在软的位置上，才不会折断。** **而其警告是\"有它吝\"**：**\"如有异志，则刚必失中\"**——**只要心一偏（有别的打算），那个\"刚\"就失去了\"中\"，即\"虽不致有大害，但亦可吝\"**。**须说明**：**这是《易经》原文（大过九四）**；**\"不可曲桡就下\"一句是它的行为要求**：**该撑住的时候不能往低处让**——**这一条与\"蛊卦\"的\"柔顺之才可以守成不可用于发展\"是同一分寸的两面**（**一个讲\"柔不可用于开\"，一个讲\"刚不可失其中\"**）。","o":"TJ-0352 · 天纪·人间道·大过卦·第四爻（PDF 第74页）"},{"t":"一百三十、大过六爻","h":"上爻：\"过涉灭顶\"——小人之大过","c":"风险——上爻\"**过涉灭顶，凶，无咎**\"。其解对\"小人的大过\"下了一个极准的定义：\"**此阴柔又处过之极者，乃小人过之极也。小人之大过，并非能做大过于人之事也，而是'过越常理、不体恤危亡、犯险闯祸'而已——如涉水而至灭顶，必凶。此自取其辱，无所怨尤。**\"其\"象\"：\"**过涉水以至于溺水，皆咎由自取，无可抱怨也。**\" **\"小人之大过，并非能做大过于人之事\"这一句，把\"大过\"的两义在此收束了**：**第五爻以上讲的是\"过人之大事\"（非常人之功）；而上爻的\"大过\"是\"过越常理\"（只是犯险闯祸）**——**两者同名而实反。** **而\"涉水而至灭顶\"的形象也极准**：**不是\"渡河失败\"，是\"水没过头顶\"**——**即：明知水深，还要涉。** **须说明**：**这是《易经》原文（大过上六）**；**\"咎由自取\"四字是此爻的定论**（**故\"无咎\"在此不是\"没有过错\"，而是\"不必归咎于人\"**——**即：责任在自己）；**这一条与\"无妄卦\"的\"妄动\"可合读**：**两者都在讲\"不必要的冒险\"**——**而无妄讲\"动机\"，大过讲\"越常理\"。**","o":"TJ-0353 · 天纪·人间道·大过卦·上爻（PDF 第74页）"},{"t":"一百三十一、坎卦之险","h":"大过之后必陷：重坎即重险","c":"定义——坎卦（坎为水）为\"**船涉重滩之课，外虚中实之象**\"，其卦序：\"**大过之后，过至极必陷——坎者，陷也。重坎即重险，险中有险。此卦专论处险之道、如何用险等。**\" **\"过至极必陷\"五个字，把\"大过\"与\"坎\"的因果说清了**：**\"过\"到极点，必然\"陷\"（掉进去）**——**而\"坎\"就是\"陷\"。** **\"重坎\"（上下皆坎）则\"重险\"（险中有险）**——**即：这不是\"一次危险\"，是\"危险叠着危险\"。** **卦图五物**：**①\"人在井中：官司，牢狱，陷入险地象\"**；**②\"人用绳引出：责人出手相救状\"**；**③\"一牛：劳苦也\"**；**④\"一鼠：肖鼠人，阴谋暗害者，暗藏也\"**；**⑤\"人身虎头：有权威之人，贵人也\"**。**其中\"人在井中\"\"人用绳引出\"两物是一对**：**先\"陷\"，后\"被人拉出来\"**——**这正是\"坎\"的全过程。** **须说明**：\"肖鼠人\"\"春夏凶秋冬吉\"一类属象数取象；**而\"人在井中＝陷入险地\"\"人用绳引出＝有人出手相救\"可独立取义**。","o":"TJ-0354 · 天纪·人间道·坎卦（PDF 第75页）"},{"t":"一百三十一、坎卦之险","h":"卦辞：\"有孚，维心亨\"——至诚可以通金石","c":"要点——坎卦辞为\"**习坎：有孚，维心亨，行有尚**\"，其解是全卦的核心：\"**阳实在中，乃中有孚信；惟心诚正一，则能亨通。俗谓：'至诚可以通金石、入水火'，有何险难不可亨？故出险之道在于诚一而行——否则常居险中也。**\" **\"至诚可以通金石、入水火\"这句俗谚被引来解\"有孚\"**：**\"孚\"是\"信\"（诚），而\"诚\"能\"通\"（穿透）**——**故\"有何险难不可亨\"。** **而\"出险之道在于诚一而行\"给出了\"出险\"的唯一方法**：**\"诚一\"（心诚而专一）＋\"行\"（行动）**——**两者都要；\"否则常居险中\"（不这样，就永远待在险里）。** **须说明**：**\"习坎，有孚，维心亨，行有尚\"是《易经》原文（坎卦辞）**；**\"习\"在此为\"重\"（上下皆坎）**；**其可用的核是\"险中的作为\"**：**在危险里，能靠的不是\"聪明\"，是\"心定而专一、并且真的去做\"**——**而\"常居险中\"这个后果，说明\"不行动\"也是一种选择（并且是坏的那种）。**","o":"TJ-0355 · 天纪·人间道·坎卦（PDF 第75页）"},{"t":"一百三十一、坎卦之险","h":"彖：\"水流而不盈，行险而不失其信\"","c":"方法——坎卦\"彖\"为\"**习坎，重险也；水流而不盈，行险而不失其信**\"，其解：\"**'习'有重复之意，上下皆坎，即险中有险。'水流而不盈'，即动于险中仍未出险之时……**\"（**后文在扫描件中续于下页，但两个判断已完整**）。**\"水流而不盈\"这个意象极准**：**水在流，但\"不盈\"（没有积满）**——**即：在动，但还没脱困**；**而\"行险而不失其信\"则是它的正面**：**一边走在险里，一边\"不失其信\"（不丢掉那份信）。** **须说明**：**这是《易经》原文（坎彖）**；**\"水流而不盈\"后来成为一句常被引用的判断**（**形容\"处境在变动但尚未解脱\"**）；**其可用的核是\"险中的常态\"**：**\"未出险\"不是失败，是\"坎\"的正常阶段**——**而真正的判据在\"不失其信\"**（**即：还没出来的时候，有没有变**）。","o":"TJ-0356 · 天纪·人间道·坎卦（PDF 第75页）  ---"},{"t":"一百三十二、险之用","h":"\"坎险以能行为功\"","c":"要点——坎卦\"彖\"中有\"**维心亨，乃以刚中也；行有尚，往有功也**\"，其解：\"**以刚中之道、抱持至诚之内实，天下何所不通？若止而不行，则常居险中也——故坎险以能行为功。**\" **\"坎险以能行为功\"六个字，把坎卦的方法论定死了**：**在险中，\"功\"不在\"等\"，在\"行\"**——**而\"止而不行，则常居险中\"一句，是它的反面。** **须说明**：**这是《易经》彖传原文加讲义之解**；**其可用的核极直接**：**遇到危险时，\"不动\"看起来最安全，但\"常居险中\"（永远待在险里）就是它的代价**——**而\"行有尚\"（行动有值得称许之处）说明：动，即使没立刻脱困，也是\"有功\"的。**","o":"TJ-0357 · 天纪·人间道·坎卦（PDF 第75~76页）"},{"t":"一百三十二、险之用","h":"\"王公设险以守其国\"——险之用","c":"方法——坎卦\"彖\"末段为\"**天险不可升也，地险山川丘陵也，王公设险以守其国，险之时用大矣哉**\"，其解是全书对\"险\"最正面的一段：\"**天之险乃因高不可升；地之险为山川丘陵。诸王公观坎之象，知险不可陵越，故设高墙深地为险，以守其国、保其人民——此'用险'之时也。人间亦然：凡知人之学，分尊卑、分贵贱、区分小人与君子，皆为用于杜绝灾殃、限隔上下——此都是体悟了险之用也。**\" **\"险\"在这里不只有负面义**：**\"天险\"（高不可升）、\"地险\"（山川丘陵）都是自然形成的\"限隔\"**；**而人可以\"设险\"（造城墙壕沟）来\"守其国、保其人民\"**——**即：险可以被\"用\"，用来保护。** **而讲义把它引申到了\"知人之学\"**：**\"分尊卑、分贵贱、区分小人与君子\"这些\"区分\"，也是一种\"设险\"**——**其目的是\"杜绝灾殃、限隔上下\"。** **须说明**：**这是《易经》彖传原文加讲义之解**；**\"分尊卑、分贵贱\"是古代的等级语汇**，**本集只取\"必须有界限\"这一层**（**不取其等级内容**）；**其可用的核是\"边界也是一种保护\"**：**完全没有界限的关系（组织、合作、亲密关系）看似自由，实则无防**——**而\"设险\"的意思是\"事先定好边界\"，不是\"事后设防\"**（**\"知险不可陵越\"——先承认界线不可越，再去设它**）。","o":"TJ-0358 · 天纪·人间道·坎卦（PDF 第76页）"},{"t":"一百三十二、险之用","h":"象：\"常德行，习教事\"","c":"方法——坎卦\"象\"为\"**水洊至，习坎；君子以常德行，习教事**\"，其解：\"**水势就下，由小而大，历久不变；君子观坎水之象，取其有常、不变其德性为真——如人之德行常变，则伪也。政治上发令行教，必使民熟于闻、人人皆从之，故有谓'三令五申'，即此意。**\" **\"如人之德行常变，则伪也\"这一句，是全卦对\"德行\"最硬的一个判据**：**德行的真伪，不在\"好的时候多好\"，在\"变不变\"**——**常变的，就是伪。** **而\"习教事\"被解成\"三令五申\"**：**\"使民熟于闻\"（让大家听熟）**——**即：教化不是\"说一次\"，是\"反复说，直到成为习惯\"。** **须说明**：**\"水洊至，习坎；君子以常德行，习教事\"是《易经》原文（坎卦大象）**；**\"洊\"（jiàn）为\"重、再\"（水一波接一波地来）**；**其现代可用的核是\"重复的价值\"**：**水\"历久不变\"才能穿石；德行\"历久不变\"才是真；教化\"反复讲\"才有效**——**三者同理。**","o":"TJ-0359 · 天纪·人间道·坎卦（PDF 第76页）"},{"t":"一百三十三、六爻（坎卦六爻）","h":"初、二、三爻：入于坎窞、求小得、来之坎坎","c":"风险——坎卦前三爻讲\"陷在险里\"的三种状态。**初爻\"习坎，入于坎窞，凶\"**：\"**初以阴柔居坎险之下，因无援、处不当，不能出险，唯益陷深而已，故凶。**\"其\"象\"：\"**由险中而加陷入险，乃失正道，加凶。**\"（**\"坎窞\"是坎中之坎（坑里的坑）**）。**第二爻\"坎有险，求小得\"**：\"**二爻位，乃阳陷二阴之中，即至险而有险状；但其本为刚中之才，故虽未出险，亦可自救，不至于愈险——故君子处艰险而能自得，皆因刚中而已。能刚则有才，能执中则动不失所宜。**\"其\"象\"：\"**虽有小得，虽不至于陷险，然亦未能出险状。**\" **第三爻\"来之坎坎，险且枕，入于坎窞，勿用\"**：\"**六三位在坎险之时，以阴柔居而处不正——走下则入险，向上则重险，故有进与退皆遇险，居又有险；枕乃处不安状，此时唯戒'勿用'方是。**\"其\"象\"：\"**以阴柔又处不正，动则唯益险；人出险须有道，如失道，但为能求去，只益增困穷而已。**\" **三爻的递进极清**：**初爻\"无援而陷深\"（凶）→第二爻\"刚中而自救\"（求小得，未出险）→第三爻\"进退皆险、居亦不安\"（勿用）。** **须说明**：**这是《易经》原文（坎初六、九二、六三）**；**\"能刚则有才，能执中则动不失所宜\"一句是这一段的精华**：**\"刚\"（有决断）与\"中\"（有分寸）各管一头**——**只有\"刚\"会莽，只有\"中\"会软。**","o":"TJ-0360 · 天纪·人间道·坎卦·初、二、三爻（PDF 第76页）"},{"t":"一百三十三、六爻（坎卦六爻）","h":"第四爻：\"纳约自牖\"——如何说动一个听不进话的人","c":"方法——第四爻\"**樽酒，簋贰，用缶，纳约自牖，终无咎**\"，是全卦最实用的一条。其解：\"**此言大臣当险难之时，唯有至诚于君，不可停交往，而又能打开使君能明之心，则可保无灾。人欲求上之笃信，只有求质实而已——如多礼仪而尚服饰，反凶。一樽之酒、二簋之饭，以瓦缶为器，乃'求质实'之意；再处明之地以明君之心，如此方能入君心——即令艰险，亦可无咎。自古以来，只求刚直攻讦、直言不讳之人，多忤逆君心；而属温厚明辨者，反而能入君心、改变君主。**\"其\"象\"：\"**但求实质，又刚中有柔，必平安；君臣之交能长久，不外乎诚实而已。**\" **这一爻的四个动作，都是\"减法\"**：**①\"樽酒\"（一樽酒）②\"簋贰\"（两簋饭）③\"用缶\"（用瓦器，不用铜器）④\"纳约自牖\"（从窗户递进去，不走正门）**——**即：东西少、器皿朴、通道简。** **而其目的是\"求质实\"**：**\"多礼仪而尚服饰，反凶\"**——**越讲究排场，越进不去。** **最要紧的是末句**：\"**只求刚直攻讦、直言不讳之人，多忤逆君心；而属温厚明辨者，反而能入君心、改变君主。**\" **须说明**：**这是《易经》原文（坎六四）**；**\"纳约自牖\"的\"牖\"是窗户**（**\"自牖\"＝从窗，即绕过正式的朝仪，走一条\"私下的、直接的\"通道**）；**其可用的核是\"改变一个人，靠的不是'敢说'\"**：**\"刚直攻讦\"的人说的是真话，但\"多忤逆君心\"（让对方听不进去）；而\"温厚明辨\"的人，能\"入君心\"并\"改变君主\"**——**两者目标相同（都是为了好），但一个让人关门，一个让人开门。** **这是本集认为最值得单记的一条\"沟通方法\"。**","o":"TJ-0361 · 天纪·人间道·坎卦·第四爻（PDF 第76页）"},{"t":"一百三十三、六爻（坎卦六爻）","h":"第五、上爻：\"坎不盈\"与\"系用徽纆\"","c":"风险——第五爻\"**坎不盈，祇；既平，无咎**\"。其解：\"**此即九五之尊，有刚中之才，可以济险；但下无助——独依君之力无法济天下之险，则有咎；必待盈平，方可无咎。**\"其\"象\"：\"**刚中之才得居君位，时天下险难，但未至全险；其未能平险，乃因君臣无法协力相济之故——故此君道未能救济天下，乃因无臣，故曰'不称其位'。**\" **上爻\"系用徽纆，寘于丛棘，三岁不得，凶\"**：\"**此意阴柔而深陷险中；圣人以牢狱比喻：缚以徽缠、囚置于丛棘之中，其不能出，至少三年不可免，其凶如此。**\"其\"象\"：\"**上六以阴柔而处险地，乃因其失道而成；其灾延三年不得免，意久也。**\" **第五爻的判断与\"大过九三\"惊人地相似**：**\"有刚中之才\"却\"下无助\"**——**故\"独依君之力无法济天下之险\"**；**而\"不称其位\"四字，是它的定评**（**不是\"无能\"，是\"无臣\"**）。**而上爻是\"失道\"的代价：\"三岁不得\"**（**三年出不来**），**\"其灾延三年不得免，意久也\"**。**须说明**：**这是《易经》原文（坎九五、上六）**；**\"徽纆\"（mò）是捆绑用的绳索，\"丛棘\"是囚禁处的荆棘**；**两爻合起来给了\"陷险\"的两个原因**：**第五爻是\"无人相助\"（外部条件），上爻是\"失道\"（自身原因）**——**而两者都\"不能出\"。**","o":"TJ-0362 · 天纪·人间道·坎卦·第五、上爻（PDF 第76页）  ---"},{"t":"一百三十四、附丽","h":"\"陷于险难之中，必有所附丽\"","c":"定义——离卦（离为火）为\"**飞禽在网之课，大明当天之象**\"，其卦序与卦体：\"**陷于险难之中，必有所附丽，理之自然。离者，丽也。离为火，火体中虚而能明照，故能丽于物而明也。人之明，必经险难——大风大浪过后，其经验之累积，而后能明，此犹可人。今人虽历灾险，但仍不能明——吾人教授《易经》，其目的即希望世人，不须付出血的代价，亦能明，此'中虚'之广义。**\" **这一段的层次极清楚**：**①\"丽\"（附丽）是\"理之自然\"**——**陷在险难里，人必然要找东西依附**（**这与\"坎卦\"正好相接：坎讲\"陷\"，离讲\"附\"**）；**②火\"中虚而能明照\"**——**火之所以能照亮，是因为它\"中间是空的\"**（**这是\"离\"的核心取象**）；**③\"人之明，必经险难而后能明\"**——**人的明白，是从大风大浪里攒出来的**；**④但末句一转**——**\"今人虽历灾险，但仍不能明\"**。**而最珍贵的是最后一句自述**：\"**吾人教授《易经》，其目的即希望世人，不须付出血的代价，亦能明。**\" **须说明**：**这是讲义作者的自我说明（非《易经》原文）**，**但它恰好说明了\"读古书\"的意义**：**前人付了代价换来的明白，后人可以\"不付代价\"地拿到**；**而\"不须付出血的代价\"这一句，也说明了《易经》之所以能\"占\"的一部分心理机制**（**人在险中，最需要\"有人已经走过这条路\"的证据**）。**⚠ 但须补一句**：**\"不须付代价亦能明\"是\"读到的明白\"，不是\"亲历的明白\"**——**前者能省血，但不能代替体验**（**这一点讲义没有说，本集补上**）。","o":"TJ-0363 · 天纪·人间道·离卦（PDF 第77页）"},{"t":"一百三十四、附丽","h":"卦辞：\"畜牝牛，吉\"——顺德由养而成","c":"要点——离卦辞为\"**离：利贞，亨，畜牝牛，吉**\"，其解：\"**天下万物莫不有所丽，其形即丽。人之所丽，必得贞正；得正可以亨通。人能附丽于正，必能顺于正道。从善如流为人之性，如牝牛之吉——牛之顺道，由养而成；人之顺德亦同：既附丽于正道，当有养以成其德也。**\" **\"畜牝牛，吉\"这个取象的意思是**：**母牛之所以\"顺\"，不是天生的，是\"由养而成\"**（**从小养、驯出来的）。** **而\"人之顺德亦同\"**：**人的\"顺于正道\"，也不是天生的，是\"养\"出来的。** **须说明**：**\"畜牝牛，吉\"是《易经》原文（离卦辞）**；**\"养\"这个字是它的关键**——**注意它说的不是\"人本来顺\"，而是\"既附丽于正道，当有养以成其德\"**：**先\"附\"（选对依附的对象），再\"养\"（长期养成）**——**两步都要。** **其可用的核是\"品德是被养出来的\"**：**一个人\"顺于正道\"这件事，靠的不是意志，是长期的\"养\"**（**环境、习惯、反复）——**而这与\"坎卦常德行习教事\"（德行要\"历久不变\"才是真）是同一判断。","o":"TJ-0364 · 天纪·人间道·离卦（PDF 第77页）"},{"t":"一百三十四、附丽","h":"\"日月丽乎天，百穀草木丽乎土\"","c":"方法——离卦\"彖\"为\"**离，丽也。日月丽乎天，百穀草木丽乎土**\"，其解：\"**附丽状，如日月丽于天、百谷草木丽于土——天下万物必有所丽。无丽之物，人必视何丽方正，则能亨通也。**\" **这一句给出了\"附丽\"的自然样本**：**日月附于天，草木附于土**——**即：任何东西都有一个\"它所依附的\"**。**而\"无丽之物，人必视何丽方正\"这一句最要紧**：**\"无丽之物\"（没有依附的东西）是危险的**——**故要\"视何丽方正\"（看它附在什么上，正不正）。** **须说明**：**这是《易经》原文（离彖）**；**其判断可作一条识人／择业的方法**：**不问\"你有多强\"，问\"你附在什么上\"**——**因为\"所丽\"决定了\"所明\"**（**依附于正的，明得正；依附于邪的，也照样\"明\"，只是明的方向错了**）。**这一条与\"随卦择所随\"\"比卦比之匪人\"是同一判断的第三次出现**：**《易经》反复在讲\"你靠什么\"。**","o":"TJ-0365 · 天纪·人间道·离卦（PDF 第77页）"},{"t":"一百三十五、继明","h":"象：\"继明照于四方\"——选择承继者","c":"方法——离卦\"象\"为\"**明两作离，大人以继明照于四方**\"，其解是全卦最重要的一条：\"**此卦若云'两离'，则只见'明'，而不知'继明'之德。君子观离明相继之象，知本身之明德能济天下——为使以明德中正永传后世，则须有进一步'继明'之能：能明于选择何人能承继，乃'继明'之义。如尧之择舜、汉之萧规曹随等，即是继明之用。**\" **\"继明\"这个解释极精彩**：**\"两离\"（两个火）只是\"更亮\"（明上加明），而\"继明\"是\"一火接一火\"（前一个熄了，后一个已经点着）。** **而\"继明\"的具体内容，被解成了\"能明于选择何人能承继\"**：**即：真正的\"明\"，是\"看得清谁能接得住\"。** **须说明**：**\"明两作离，大人以继明照于四方\"是《易经》原文（离卦大象）**；**讲义所举两例极准**：**尧之择舜（选对了人）、萧规曹随（继承而不另搞一套）**——**一个是\"选对承继者\"，一个是\"继任者不折腾\"**。**这一条与\"大畜卦多识前言往行\"（学的过程）、\"蛊卦干父之蛊\"（接手的姿态）合起来看**：**三处说的都是\"人与前人／后人的关系\"**——**而\"继明\"是其中唯一\"面向未来\"的一处**（**即：你不仅要把事做完，还要把它交出去）。","o":"TJ-0366 · 天纪·人间道·离卦（PDF 第77页）"},{"t":"一百三十五、继明","h":"初爻：\"履错然，敬之\"——能刚不能明，则妄动生灾","c":"风险——初爻\"**履错然，敬之，无咎**\"。其解：\"**初爻阳居之，乃言初进有阳刚之才而进又躁动——却因动之非宜，已失居下位之分而得咎；但因为人才，只须知守义而戒慎之，则不至于有咎。**\"其\"象\"是全卦的一条判语：\"**能知履动之躁进为错而敬慎之，因居下位，但求避之可也，不致有灾。吾人有阳刚之才，仍须有'明'之能——能刚不能明，则因妄动生灾也。**\" **\"能刚不能明，则因妄动生灾\"十个字，是离卦给\"有才者\"最直接的警告**：**\"刚\"（有力量、敢动）不等于\"明\"（看得清时机）**——**有刚无明，动得越快，灾来得越快。** **而\"履错然\"（脚步杂沓、踩错了）就是它的形态**：**不是\"不走\"，是\"走得乱\"。** **须说明**：**这是《易经》原文（离初九）**；**\"但因为人才，只须知守义而戒慎之，则不至于有咎\"这一句很宽厚**：**有才而躁，不算危重**——**只要\"敬\"（戒慎），就可以\"无咎\"**（**\"敬之\"这个动作本身就是解法**）。**其可用的核是\"给躁动的人一条路\"**：**不是\"改掉躁动\"（那改不掉），是\"在躁动之上加一个'敬'\"**。","o":"TJ-0367 · 天纪·人间道·离卦·初爻（PDF 第78页）"},{"t":"一百三十五、继明","h":"第二、三爻：\"黄离\"与\"日昃之离\"","c":"要点——**第二爻\"黄离，元吉\"**：\"**以柔居中乃得正位；'黄'为中色；人能文明而中正，则美之至极也。又有六五文明之君以顺其德——其能明如此，乃大善之吉也。**\"其\"象\"：\"**能成文明乃由'中之虚明'，故元吉之因，是由其得中之道也。**\" **第三爻\"日昃之离，不鼓缶而歌，则大耋之嗟，凶\"**，是全卦最深的一条，讲义说\"《易》有八纯卦，**唯离为火于人事之义陈述最细**\"：\"**今九三吾人居下卦之终，乃意'前明将尽、后明当继'之时。人之有始必有其终，此常道也。智虑通达之人，以顺理为乐且常持之——如不能如此，则有'将尽之悲'，而日夜恐于死亡，故君子乐天，小人终日恐惧。此处《易》论生死之道也。**\"其\"象\"：\"**日已倾，不可久也；能明之人，能求人以继其事、知退而修其身，则可长久。**\" **第三爻讲的是\"太阳偏西\"那一刻**：**\"前明将尽、后明当继\"**——**即：一个人的\"明\"（能力、影响力）总有将尽的时候。** **而它给了两种应对**：**①\"鼓缶而歌\"（敲着瓦盆唱歌——自得其乐，接受它）**；**②\"大耋之嗟\"（老头子的哀叹——不肯接受，故\"凶\"）。** **而其结论是\"君子乐天，小人终日恐惧\"**。**须说明**：**这是《易经》原文（离六二、九三）**；**\"鼓缶而歌\"这个意象，出自《诗经·陈风·宛丘》一类（击缶而歌是古人自娱的方式）**；**其可用的核是\"交接的姿势\"**：**\"能求人以继其事、知退而修其身\"**——**即：在\"日昃\"之时做两件事：找人接班、退而修身**（**而不是\"死撑着不退\"或\"哀叹不已\"**）。","o":"TJ-0368 · 天纪·人间道·离卦·第二、三爻（PDF 第78页）"},{"t":"一百三十五、继明","h":"第四爻：\"突如、焚如、死如、弃如\"——不善继者","c":"风险——第四爻\"**突如、其来如、焚如、死如、弃如**\"，是全卦最重的一条，也是\"继明\"的反面教材。其解：\"**九四位，乃言'继明之初'、承继之意；但阳爻居之，有刚躁但不失中正之意——此非'善继'者。能知善继之人，始继必有谦让之诚，知顺承前贤之道。今'突如其来'，已失善继；又刚势凌主、气焰高张，故'焚如'，必招祸害致死，故'死如'；以众所弃之，故果为'弃如'。**\"其\"象\"：\"**人之凌其君，而不顺所承继之前贤，必众弃，天下不容也。**\" **这一爻的五个\"如\"，是一条完整的败亡链**：**\"突如\"（突然闯进来）→\"其来如\"（来得急）→\"焚如\"（气焰高张，烧起来）→\"死如\"（招祸致死）→\"弃如\"（被众人所弃）**。**而它的病因只有一条**：\"**此非善继者**\"——**\"善继\"的人\"始继必有谦让之诚，知顺承前贤之道\"**；**而此爻\"突如其来\"，\"已失善继\"，又\"刚势凌主、气焰高张\"。** **须说明**：**这是《易经》原文（离九四）**；**\"突如\"（突然）、\"焚如\"（焚烧）等五个\"如\"，是《易经》中节奏最急促的一段文字**（**五字连下，几乎喘不过气**）；**其可用的核是\"接手者的姿态\"**：**接手一份已经成形的局面，\"突然\"与\"气焰\"是两个危重伤**——**因为\"不顺所承继之前贤\"，就\"必众弃\"**（**\"天下不容也\"**）。**这一条与\"蛊卦上九不事王侯\"（不接手也合道）正好构成两端**：**要么\"谦让顺承\"地接，要么\"高洁自守\"地不接**——**唯独\"突如而来、凌主而上\"是最坏的一种。**","o":"TJ-0369 · 天纪·人间道·离卦·第四爻（PDF 第78页）"},{"t":"一百三十五、继明","h":"第五、上爻：\"出涕沱若\"与\"王用出征\"","c":"方法——第五爻\"**出涕沱若，戚嗟若，吉**\"（**\"出涕\"\"戚嗟\"都是形容人忧惧至极**）。其解：\"**君位以阴柔之才居之，又受于阳刚之在左右——此居尊位之明，能知忧且畏，故能吉。今若自持己才之不足，全然不知惧，必不能得其吉也。**\"其\"象\"：\"**居上位之吉，乃在明察事理，且以畏惧忧虑之心以持之，可以为吉也。**\" **\"能知忧且畏，故能吉\"这一句极妙**：**流泪、悲叹本是\"凶\"之象，此处却判\"吉\"**——**因为\"涕泣\"说明他\"知道怕\"**（**而\"全然不知惧\"才是真的凶**）。**上爻\"王用出征，有嘉；折首，获匪其丑，无咎\"**：\"**阳刚之才居离之终，有刚明至极之状。此方式乃适用之于君王出征时：明则足以察邪恶，刚则能断事，施以威行，如此则能去天下之邪恶，此有功也。世上事至刑不足以阻时，必用征伐方法解决，此之时也。去天下之邪恶，如明断之极，则必无所宽宥——此时必取其魁首、始作俑者方是；赶尽诛灭，必有暴残之后悔也。**\"其\"象\"：\"**君王用此德，则能治其邦国，此刚明至上之道也。**\" **⚠ 须说明**：**\"王用出征\"\"赶尽诛灭\"是古代的征伐语境，本集不取其字面内容**（**现代法治下，处置邪恶靠法定程序与司法裁判，不靠征伐**）；**其可用的核有两条**：**①\"明则足以察邪恶，刚则能断事\"**（**明与刚各司其职，缺一不可**）；**②\"必取其魁首、始作俑者方是\"**（**即：追究责任要有范围，不能无限扩大**）——**而末句\"赶尽诛灭，必有暴残之后悔也\"是一条警告**：**超出范围的清算，后果是\"暴残\"与\"后悔\"。**","o":"TJ-0370 · 天纪·人间道·离卦·第五、上爻（PDF 第78页）  ---"},{"t":"一百三十六、感之道","h":"下经之始：少男少女之感","c":"定义——咸卦（泽山咸）为\"**山泽通气之课，至诚感神之象**\"，起手先给了一个分经的大判断：\"**《易经》上经乃论天地万物之本——有天地后有万物，圣人观其间象，以巨视之角度来体察出天道。咸卦之始，为《易经》下经，其论夫妇人伦之始，较重于人道。**\" **而\"咸\"的核心取象，讲义定在\"少男少女\"**：\"**咸之为卦，兑上艮下，乃少女少男之意——表示世上男女相感之深，莫过于少男少女：童稚之间无隔阂，人人皆以平常心处之；男女相悦又无所求，互相以诚及悦相处对应——此时之感，即'咸'之深意。**\" **\"童稚之间无隔阂\"\"相悦又无所求\"这两句，是\"感\"之所以深的原因**：**深不在\"投入多\"，在\"没有所求\"**——**一旦有所求，感就变了性质。** **须说明**：**\"上经论天道、下经论人道\"是《易经》分篇的通行说法**；**而\"少男少女\"是卦象（兑为少女、艮为少男）的取义**，**本集取其结构义**（**无隔阂、无所求**），**不取其性别与年龄内容**；**其可用的核是\"最深的关系是没有算计的关系\"**——**这与\"比卦两志相求\"\"随卦择所随\"构成一组关于\"关系\"的判断**（**比卦讲\"互求\"，随卦讲\"跟谁\"，咸卦讲\"怎么感\"**）。","o":"TJ-0371 · 天纪·人间道·咸卦（PDF 第69页）"},{"t":"一百三十六、感之道","h":"卦辞：\"取女吉\"与\"外悦内止\"","c":"要点——咸卦辞为\"**咸：亨，利，贞，取女吉**\"，其解：\"**咸，感也。举凡君臣上下、夫妇、父子等皆有感之道——人人能以少男少女之童悦相感、以诚悦，即以平常心相待，则必有亨通之理。今人皆以媚说，上下之位处以邪僻，皆感之不正也。艮为止，泽为悦，乃'外悦内止'之意——以此之意近女，乃得正而吉也。**\" **\"今人皆以媚说，上下之位处以邪僻，皆感之不正也\"这一句，是咸卦对\"当代关系\"最直接的一次批评**：**\"媚说\"（讨好、说好话）代替了\"感\"**；**而\"上下之位处以邪僻\"（上下之间靠歪门邪道来相处）**——**两者都是\"感之不正\"。** **而正解在卦体**：**兑（泽）为悦在上，艮（山）为止在下，\"外悦内止\"**——**即：外面和气，里面守得住。** **须说明**：**\"咸：亨，利，贞，取女吉\"是《易经》原文**；**\"取女吉\"的\"取\"通\"娶\"**（**本集只取\"关系之始\"的象征义**）；**\"外悦内止\"这个组合很值得记**：**只有\"悦\"没有\"止\"，就是\"媚\"（一味讨好）；只有\"止\"没有\"悦\"，就是\"冷\"**——**而\"感\"要两者同时在。**","o":"TJ-0372 · 天纪·人间道·咸卦（PDF 第69页）"},{"t":"一百三十六、感之道","h":"\"天地感而万物化生，圣人感人心而天下和平\"","c":"方法——咸卦\"彖\"的末段为\"**天地感而万物化生，圣人感人心而天下和平，观其所感，而天地万物之情可见矣**\"，其解：\"**感之道到极限时，圣人能以至诚之心感亿兆人之心，使天下和平，其情之伟大可见；但须知感通之理：须以默而观之，不可道破，此感方可久矣。**\" **\"须以默而观之，不可道破，此感方可久矣\"这一句，是全卦最精的一条**：**感通这件事，是\"看见了但不说明\"才长久**——**一旦\"道破\"（说穿、点明），那份感就断了。** **须说明**：**这是《易经》彖传原文加讲义之解**；**其可用的核极准**：**对一个人好、对一个群体有影响，最有效的方式往往是\"不说破\"**——**因为\"道破\"会把\"感\"变成\"账\"**（**即：从\"我对你好\"变成\"我为你做了这些，你该回报\"**）。**而\"观其所感，而天地万物之情可见矣\"给了它的观察方法**：**看一个人\"被什么感动\"，就知道他\"是什么人\"**——**这比看他\"说什么\"准得多。**","o":"TJ-0373 · 天纪·人间道·咸卦（PDF 第69页）"},{"t":"一百三十六、感之道","h":"象：\"君子以虚受人\"——心实则不能入","c":"方法——咸卦\"象\"为\"**山上有泽，咸；君子以虚受人**\"，其解：\"**泽在山上有渐润通澈状，此感之道。君子观山泽通气，知须虚其中方能受人——凡人之心能中虚必可受，实则不能入矣。**\" **\"凡人之心能中虚必可受，实则不能入矣\"两句，把\"受人\"（接纳别人）的条件说尽了**：**心里\"虚\"（空着），才装得进别人；心里\"实\"（塞满了），就进不去了。** **\"实\"在这里是什么？** **是\"已经装满的自己\"**——**成见、定论、已有的答案。** **须说明**：**\"山上有泽，咸；君子以虚受人\"是《易经》原文**；**其取象也准**：**\"泽在山上有渐润通澈状\"**——**水在高处，慢慢渗下来，通透明澈**（**即：不是\"灌进去\"，是\"渗进去\"**）。**这一条与\"大畜卦虚己\"\"谦卦裒多益寡\"是同一判断**：**能不能\"受人\"，取决于\"有没有空位\"**——**而这与\"咸卦九四憧憧往来、所感狭小\"正好相反**。","o":"TJ-0374 · 天纪·人间道·咸卦（PDF 第69页）"},{"t":"一百三十七、诚感与物感","h":"卦图\"合子\"：因诚感方吉，物感必凶","c":"要点——咸卦卦图中的\"合子\"（盒子）一物，讲义只给了极短的一句评注，却是全卦的钥匙：\"**合子：先成后破，因'诚感'方吉，'物感'必凶。**\" **\"诚感\"与\"物感\"这两个词，是《易经》里很少出现的一对对照**：**\"诚感\"＝用真诚去感动人；\"物感\"＝用东西（钱、礼、好处）去感动人。** **而判语是两个方向**：**\"诚感方吉\"、\"物感必凶\"**。 **须说明**：**这是讲义对卦图的注解（非《易经》原文）**；**它之所以值得单记，是因为它给出了\"感\"的两种手段及其后果**——**\"物感\"不是没用，是\"先成后破\"**（**\"先成\"：东西确实能换来关系；\"后破\"：关系随东西而去**）。**这一条与全卦其余几处可互相印证**：**卦图\"空中有一拳\"＝\"贵人提拔，凭空而得\"**（**即：靠别人给的，来得容易**）；**\"钱宝一堆\"＝\"求财得财\"**；**而\"贵人在山顶\"＝\"孤立状，即将下坡，退休状\"**——**\"凭空而得\"与\"孤立即将下坡\"连在一起看，意思就清了。**","o":"TJ-0375 · 天纪·人间道·咸卦（PDF 第69页）"},{"t":"一百三十七、诚感与物感","h":"初、二、三爻：\"咸其拇\"\"咸其腓\"\"咸其股\"","c":"风险——咸卦前三爻，用身体部位（**拇、腓、股**）讲\"感\"的三个阶段。**初爻\"咸其拇\"**：\"**初与四相感，初之时感必未深，不能动人——如拇指之动，不可进也，须识势而为。**\"其\"象\"：\"**感应之志虽动，但未大，不足以进。**\" **第二爻\"咸其腓，凶，居吉\"**：\"**腓，足肚也；人之动，足必先行，足肚自动也。二位无法守道而妄求于上，故凶。进退之道乃安居其位、以待上求，此吉也。**\"其\"象\"：\"**阴居二位，其得位中正；在咸之时，因质本柔，必戒以先动——求之必凶，守居不动吉。**\" **第三爻\"咸其股，执其随，往吝\"**：\"**股在身之下、足之上，不能自主，随身而动。九三阳刚之才，感于所动而随其动——如此已失其正道，其动必羞也。**\"其\"象\"是全卦对\"随人而动\"最重的一句：\"**人有阳刚之质，却又不能自主、反随于人而动，此所执者必卑贱甚也。**\" **三爻的递进是\"位置越来越高、自主越来越少\"**：**拇指（末梢，只动一点，不足以进）→腓（腿肚，人一动它先动，故\"妄求\"而凶）→股（大腿，完全\"不能自主、随身而动\"）**——**而\"所执者必卑贱甚\"这个判断极狠**：**有本事却跟着别人动，你抓住的东西就已经很低了。** **须说明**：**这是《易经》原文（咸初六、六二、九三）**；**\"拇\"\"腓\"\"股\"是取象，不是解剖学论述**；**其可用的核是\"感的三级\"**：**感而未深（不可进）→感而先动（必凶，应\"居以待上求\"）→感而随人（所执已卑）**——**三级里唯一\"吉\"的是\"居\"（不动）。**","o":"TJ-0376 · 天纪·人间道·咸卦·初、二、三爻（PDF 第70页）"},{"t":"一百三十七、诚感与物感","h":"第四爻：\"憧憧往来，朋从尔思\"","c":"要点——第四爻\"**贞吉，悔亡，憧憧往来，朋从尔思**\"，讲义把它放在全卦的核心位置：\"**人之所动皆因感也。九四在中，乃当心脏之位，为'心感'之主——感之正则吉，不正则凶。今人以私心感人，所感狭小也。天地万物各有不同，事亦变化万千，能殊途同归，此感之极至，必以公正无私方可行。人之向往，必有屈求；人之来至，必因有信——此'屈信相感'，利之所生处。**\"其\"象\"：\"**贞吉悔亡，未感害也；憧憧往来，未光大也。**\" **\"憧憧往来\"（心神不定、来来去去）是本爻的形态**：**\"所感狭小\"——用私心去感动人，感到的范围就只有那么大。** **而\"必以公正无私方可行\"是它的解法**。**须说明**：**这是《易经》原文（咸九四）**；**\"朋从尔思\"（朋友跟着你的想法走）在原文中带有\"只感得动身边人\"的局限义**；**而\"屈信相感\"（\"屈\"是\"来\"、'信'通'伸'）是讲义引入的《系辞》语汇**——**\"人之向往，必有屈求；人之来至，必因有信\"**：**来的人必有所求，留下的人必因有信**——**两句话把\"关系为什么会形成\"说完了。** **其可用的核**：**判断一段关系（上下、合作、亲密）能不能大，看它\"感\"的半径**——**私心感得动的只有\"朋\"（身边人），公正无私才感得动\"天下\"。**","o":"TJ-0377 · 天纪·人间道·咸卦·第四爻（PDF 第70页）  ---"},{"t":"一百三十八、咸卦余论：感于所见与口舌","h":"第五爻：\"咸其脢\"——感于所见而悦，所不见而仇视","c":"风险——咸卦第五爻\"**咸其脢，无悔**\"。其解：\"**居尊位之人，必以至诚感于天下。'脢'，背肉也——其与心相背、目所不见状。此意能背其私心、感于'非所见'而能悦者，以人君可以无悔。今人不知，皆感于所见而悦、所不见而仇视之——此感不正，招自凶亡也。**\"其\"象\"：\"**人感于所不见而生戒，其必浅也，此私心之用也。**\" **\"感于所见而悦、所不见而仇视之\"这一句，是咸卦对人性最准的一次诊断**：**人对\"看得见的\"容易喜欢，对\"看不见的\"容易敌视**——**而\"看不见\"的东西（远方的人、后来的事、沉默的多数）一旦被\"仇视\"，就是\"感不正\"，后果是\"自凶亡\"。** **须说明**：**这是《易经》原文（咸九五）**；**\"脢\"（méi）是脊背上的肉**——**取\"背于心\"（在心的背面）\"目所不见\"**；**其可用的核是\"公正的难处\"**：**\"感于所见\"是本能，\"感于所不见\"才是修养**（**而\"居尊位之人\"最需要它，因为他的\"所不见\"影响最大**）。**⚠ 须补一句**：**\"所不见\"与\"看不见的风险\"不同**——**前者是\"尚未进入视野的对象\"，后者是\"需要看见却不愿看见的\"；此爻讲的是前者。**","o":"TJ-0378 · 天纪·人间道·咸卦·第五爻（PDF 第80页）"},{"t":"一百三十八、咸卦余论：感于所见与口舌","h":"上爻：\"咸其辅、颊、舌\"——唯至诚能感人","c":"风险——咸卦上爻\"**咸其辅、颊、舌**\"（**\"辅\"是脸颊，\"颊\"是腮**）。其解：\"**上为感之极位，阴柔居之——此即不能以至诚感物，唯求于'口舌之间'感人，乃小人之常态，必不能动于人，故云颊。**\"其\"象\"是全卦的收尾判语：\"**世间唯至诚能感人，如靠口舌说话之才，感人必不能长久。**\" **\"唯至诚能感人\"五个字，把全卦合上了**：**咸卦从\"诚感方吉、物感必凶\"开头（卦图合子），到\"唯至诚能感人\"收尾**——**中间六爻讲的全是\"感\"的各种错法（拇、腓、股、憧憧、脢、辅颊舌）。** **而\"口舌之才\"被放在最后一爻**，是它的位置讲究：**越到后面越要靠\"说\"，说明前面该做的已经没做**。**须说明**：**这是《易经》原文（咸上六）**；**\"滕口说也\"（象辞）的\"滕\"是\"腾\"（口舌翻动）**；**本集不取原文\"小人女子之常态\"中的性别内容**；**其可用的核极直接**：**\"靠口舌说话之才感人，感人必不能长久\"**——**话能打动人一时，但撑不住时间**（**这与\"坎卦纳约自牖求质实\"\"贲卦白贲无咎\"是同一判断的第三次出现**）。","o":"TJ-0379 · 天纪·人间道·咸卦·上爻（PDF 第80页）"},{"t":"一百三十九、恒之道","h":"卦序：咸与恒，感与久","c":"定义——恒卦（雷风恒）为\"**日月常明之课，四时不没之象**\"，其卦序讲义作了极清楚的一对说明：\"**恒，乃论夫妻之道、终身不变者。前'咸'为少女少男之感，今'恒'乃长男长女之往**——男尊在上、女卑在下，此夫妇居室之道；男动于外、女顺于内，此人伦之常，此恒久之道。\" **\"咸\"与\"恒\"的分工，讲得极准**：**\"咸\"是\"感\"（少男少女——一时的相悦）；\"恒\"是\"久\"（长男长女——终身的相处）。** **而\"咸\"讲\"如何开始\"，\"恒\"讲\"如何不散\"**——**两卦相接，正好是一段关系的全过程。** **其卦图六物**：**①\"日在云中：昏暗之象，君主不明象\"**；**②\"凤衔书：喜讯至，金榜题名也\"**；**③\"官人行路：将至也，贵人至\"**；**④\"道士手指门：入空门也，闪也\"**；**⑤\"鼠下两口：阴谋在后之象\"**；**⑥\"时机：在春末\"**——**而总断是\"此即持之以恒，则有拨云见日之喜也\"**。**须说明**：**这是讲义对恒卦卦序与卦图的注解**；**\"男尊在上、女卑在下\"\"男动于外、女顺于内\"是古代的性别分工语汇**，**本集只取\"分工\"这一层结构义**（**即：一段长期关系需要\"一外一内\"的职能分工**），**不取其尊卑内容**；**\"持之以恒，则有拨云见日之喜\"是它的正面结论。**","o":"TJ-0380 · 天纪·人间道·恒卦（PDF 第81页）"},{"t":"一百三十九、恒之道","h":"卦辞：所恒为正，所恒不正则反招辱","c":"要点——恒卦辞为\"**恒：亨，无咎，利贞，利有攸往**\"，其解：\"**恒为常久之道。人能恒之于善，此道可恒，君子之道；小人之道，乃恒于恶——已失可恒之道。故恒之道能常久，乃因'所恒为正'；恒不正，招凶也。**\"其彖又申一遍：\"**恒之道，可以令亨通，且无灾，但须注意'所恒为正'——吉也；所恒不正，则反招辱。**\" **\"所恒为正\"这四个字，是恒卦区别于\"固执\"的分界线**：**\"恒\"（坚持）本身不是美德，要看\"恒的是什么\"**——**\"恒于善\"是可恒之道；\"恒于恶\"则\"已失可恒之道\"。** **须说明**：**\"恒：亨，无咎，利贞，利有攸往\"是《易经》原文**；**这一条最可用的地方是它反驳了\"坚持就是好的\"这个流行观念**：**恒卦的第一句判断不是\"要坚持\"，是\"看你坚持什么\"**——**而\"所恒不正，则反招辱\"是它的代价**（**\"辱\"不是\"失败\"，是\"羞耻\"**）。**这一条与\"大过卦过涉灭顶\"\"坎卦上六三岁不得\"合起来**：**三者都是\"方向错了还在坚持\"，而恒卦给出了最直接的判据。**","o":"TJ-0381 · 天纪·人间道·恒卦（PDF 第81页）"},{"t":"一百三十九、恒之道","h":"彖：\"随时变易其外，神在内不变\"","c":"方法——恒卦\"彖\"中\"**利有攸往，终则有始也**\"一句，讲义给了全书最要紧的一条方法论：\"**万物之动，必有始终。今动而能恒，其间变化必多——能知'随时变易其外、神在内不变'，此得《易》之神也。**\" **\"随时变易其外，神在内不变\"十二个字，是\"恒\"与\"变\"的统一**：**外面要随时变（方法、形态、应对），里面不能变（那个\"神\"——立身的东西）**——**两者同时成立，才是\"得《易》之神\"。** **须说明**：**这是《易经》彖传原文（\"终则有始\"）加讲义之解**；**它解决了一个长期困扰**：**\"坚持\"与\"改变\"看似矛盾，其实是两个层次**——**不变的是\"为什么\"，变的是\"怎么做\"。** **而这一条与本集的其余判断可以对上**：**\"坎卦常德行习教事\"（德行不变、教化要反复）**、**\"贲卦白贲无咎\"（饰可变、质不可变）**、**\"咸卦外悦内止\"（外悦、内止）**——**四处都在讲\"内与外两手\"**。**其可用的核是\"判断一个人／一个组织的'恒'，看它变的是什么\"**：**如果连\"神\"都变了，那不是\"适应性\"，是\"换了一个东西\"。**","o":"TJ-0382 · 天纪·人间道·恒卦（PDF 第81页）"},{"t":"一百三十九、恒之道","h":"\"日月得天而能久照，四时变化而能久成\"","c":"要点——恒卦\"彖\"末段为\"**日月得天而能久照，四时变化而能久成，圣人久于其道而天下化成，观其所恒，而天地万物之情可见矣**\"，其解：\"**日月得天之道，能久照不已；四时往来生成万物，也因得天，故常久不已；圣人用恒之道，行之不已，能化成天下、成其美俗。观天地之恒常，得天下常久之理——此圣人之道所以能常久也。常人孰能知。**\" **\"日月得天而能久照\"与\"四时变化而能久成\"是对举的两句**：**日月\"久照\"靠的是\"得天\"（依附于天）；四时\"久成\"靠的是\"变化\"（往来生成）**——**即：一个靠\"不变的依附\"，一个靠\"有规律的变化\"。** **而\"变化而能久成\"这五个字最反常识**：**\"变化\"不但不破坏\"久\"，它正是\"久\"的原因。** **须说明**：**这是《易经》彖传原文加讲义之解**；**\"观其所恒，而天地万物之情可见矣\"与咸卦\"观其所感\"恰成一对**：**咸卦看\"被什么感动\"（看人的心动），恒卦看\"坚持什么\"（看人的定力）**——**两者合起来，就是识人的两把尺**。**而\"常人孰能知\"这句收尾，讲义是叹的**（**即：这两句道理人人能背，但少有人做到**）。","o":"TJ-0383 · 天纪·人间道·恒卦（PDF 第81~82页）"},{"t":"一百四十、恒卦六爻","h":"象：\"君子以立不易方\"","c":"方法——恒卦\"象\"为\"**雷风，恒；君子以立不易方**\"，其解：\"**人才君子观恒之象，以恒久之德性，持立于中道，永不易其立足之道。**\" **\"立不易方\"三个字，是恒卦的行为准则**：**\"立\"（站住的位置）不能\"易\"（改）\"方\"（方向／地方）。** **须说明**：**\"雷风，恒；君子以立不易方\"是《易经》原文**；**其取象值得说一句**：**雷与风都是\"动的东西\"（雷动、风行），而上下的雷风却是\"恒\"卦**——**即：最\"动\"的两个东西叠在一起，反而成了\"恒\"**（**因为\"雷风相与\"（互相助长）形成了稳定的关系**）。**这一条与\"随卦随时\"\"坎卦常德行\"合起来**：**《易经》对\"动与静\"的处理从不走极端**——**\"立不易方\"是内核不动，而\"随时变易其外\"是外壳在动。**","o":"TJ-0384 · 天纪·人间道·恒卦（PDF 第82页）"},{"t":"一百四十、恒卦六爻","h":"初爻：\"浚恒，贞凶\"——只知守常却不度势","c":"风险——恒卦初爻\"**浚恒，贞凶，无攸利**\"。其解：\"**初六以柔暗之人初进，只知守常却不度势而为，但求上之眷顾，又坚守此向——致凶之道也。因其心志在求上眷顾，必不能安居其位……**\" **\"浚恒\"（\"浚\"是深挖）的意思是\"深求其恒\"**：**一上来就要求\"恒久\"**——**而它被判\"凶\"，理由是\"只知守常却不度势\"。** **须说明**：**这是《易经》原文（恒初六）**；**这一爻与\"恒卦总纲\"恰成对照**：**总纲说\"所恒为正\"才可恒，初爻则是\"恒\"本身用错了地方**——**\"求上之眷顾\"而\"坚守此向\"**（**即：把\"恒\"用在\"求人青睐\"上，还坚持不改**）。**其可用的核极实用**：**\"恒\"是一种能力，但它不能被\"要求\"出来**——**尤其在关系刚开始时，\"求恒\"（急着让对方长久地看重自己）恰恰是\"致凶\"的路**；**而\"必不能安居其位\"是它的后果**（**心一在求，位就坐不住**）。","o":"TJ-0385 · 天纪·人间道·恒卦·初爻（PDF 第82页）  ---"},{"t":"一百四十一、恒卦六爻：恒的四重限定","h":"第二、三爻：\"悔亡\"与\"不恒其德\"","c":"风险——恒卦第二爻\"**悔亡**\"。其解：\"**恒能居其正位，常道也。今阳居阴位，处非其位——虽中正之才，不知轻重之势，造成有悔。人能知所轻重，《易》之义即此。**\"其\"象\"：\"**人能知恒久于中道、知所轻重，必可常久。**\" **第三爻\"不恒其德，或承之羞，贞吝\"**：\"**得位乃可久；但于须持久时不知持之以恒，朝令夕改，人无所适从，反招羞辱矣。**\"其\"象\"：\"**不知恒之道的人，终至无处容身也。**\" **两爻合起来，是\"恒\"的第一、二重限定**：**第二爻说\"恒要知轻重\"**——**\"虽中正之才\"，但\"不知轻重之势\"，照样\"有悔\"**（**即：坚持得对不对，先要看轻重的份量**）；**第三爻说\"须持久时要持久\"**——**它的反面是\"朝令夕改\"，后果是\"人无所适从，反招羞辱\"，最终\"无处容身\"。** **须说明**：**这是《易经》原文（恒九二、九三）**；**\"不恒其德，或承之羞\"是《易经》里被引用最多的一句之一**（**《论语·子路》引\"不恒其德，或承之羞\"，孔子接以\"不占而已矣\"**）；**其可用的核极实用**：**\"朝令夕改\"的代价不是\"效率低\"，是\"无处容身\"**——**因为人一旦无所适从，就不再把你当坐标。**","o":"TJ-0386 · 天纪·人间道·恒卦·第二、三爻（PDF 第82~83页）"},{"t":"一百四十一、恒卦六爻：恒的四重限定","h":"第四爻：\"田无禽\"——不得道，即久亦无功","c":"要点——第四爻\"**田无禽**\"（打猎没打到猎物）。其解：\"**田猎又无获禽，徒劳无功也。九四阴位而阳居之，处非其所——恒又何益？人之动必有道：持之以恒则有功；不得道，即久亦无功也。**\"其\"象\"：\"**处不适位，虽久何益，犹徒猎而无功。**\" **\"不得道，即久亦无功也\"这一句，是\"恒\"的第三重限定，也是最狠的一重**：**前面说\"要恒\"（要有常），这里说\"恒\"本身不值钱**——**\"持之以恒则有功\"，前提是\"动必有道\"**；**\"不得道，即久亦无功\"。** **须说明**：**这是《易经》原文（恒九四）**；**\"田无禽\"的形象极准**：**天天去打猎（很勤），但一只也没打到（无功）**——**即：勤在\"打猎\"这个动作上，错在\"这片田里没有禽\"。** **这一条与\"大过九三栋桡\"（有才无辅）、\"坎九五不称其位\"（有才无臣）并列**：**三者都在讲\"条件不对时，努力无效\"**——**而恒卦这一条最直接：它把\"无效\"归到了\"位置\"（\"处非其所\"）上。** **其可用的核**：**先问\"这片田里有禽吗\"，再问\"我够不够勤\"。**","o":"TJ-0387 · 天纪·人间道·恒卦·第四爻（PDF 第83页）"},{"t":"一百四十一、恒卦六爻：恒的四重限定","h":"第五爻：\"妇人吉，夫子凶\"——君道不以柔顺为恒","c":"要点——第五爻\"**恒其德，贞，妇人吉，夫子凶**\"。其解：\"**柔居刚位，又得九二之阳刚助应——此即居中正又有应乎中正，恒此以久，吉之道。'妇人之道以顺从为恒'——此顺从于妇人则吉；丈夫为刚阳，如以顺从之道持恒，反致凶也。更何况人君之道：君道切不以柔顺为恒也。**\"其\"象\"：\"**柔而顺从事妇人则吉，乃从一而终也；君王之义，从妇人之顺从，招凶。**\" **\"君道切不以柔顺为恒也\"这一句，是\"恒\"的第四重限定**：**\"以顺从为恒\"对某一种角色（原文作\"妇人\"）是吉；但对另一种角色（\"丈夫\"\"人君\"）就是凶**——**因为角色不同，\"该恒的东西\"也不同。** **须说明**：**这是《易经》原文（恒六五）**，**其\"妇人／夫子\"的分判是古代的性别角色语汇**，**本集只取\"角色不同、所恒不同\"这一层结构义**（**不取其性别内容**）；**其可用的核极准**：**同一个品质（顺从、坚持、忍耐），放在这个位置上是美德，放在那个位置上就是失职**——**而\"人君\"这个位置的\"恒\"不是\"顺\"，是\"制义\"（作出决断、定下规矩）**。","o":"TJ-0388 · 天纪·人间道·恒卦·第五爻（PDF 第83页）"},{"t":"一百四十一、恒卦六爻：恒的四重限定","h":"上爻：\"振恒，凶\"——把躁动当恒","c":"风险——恒卦上爻\"**振恒，凶**\"。其解：\"**此恒之极位，乃'振恒'，即守之不常也。居上而动无节宜，再以此为恒，凶至也。故吾人动之必以正理、不逾矩——动如失正、又不及复，反'持恒'下去，果致凶矣。**\"其\"象\"：\"**居上之道，躁动不安，必无所成。此言'持恒、知恒、用恒'之重要性——人不知此，即令再大之劳亦无功也。**\" **\"振恒\"的意思是\"以振动为恒\"**：**把\"不停地动\"当成了\"恒\"**——**而讲义说\"守之不常\"：这恰恰是\"不常\"（没有常态）。** **而\"动如失正、又不及复，反持恒下去，果致凶矣\"这一句极精**：**动了、发现不对（失正）、又来不及回头（不及复）、却还\"坚持\"下去**——**这才是\"凶\"的完整过程。** **须说明**：**这是《易经》原文（恒上六）**；**象辞把\"持恒、知恒、用恒\"三件事并列，是全卦最要紧的一句方法论**：**\"持恒\"（坚持）只是第一层，\"知恒\"（知道什么该恒）是第二层，\"用恒\"（在对的地方用）是第三层**——**而\"即令再大之劳亦无功\"是缺了后两层的代价。**","o":"TJ-0389 · 天纪·人间道·恒卦·上爻（PDF 第83页）"},{"t":"一百四十二、遯卦：守道去恶","h":"卦序：久不动则有去意","c":"定义——遯卦（天山遯）为\"**豹隐南山之课，守道去恶之象**\"，其卦序讲义说了极简一句：\"**恒者，久也，久不动则有去意；遯乃退也，故遯所以继恒也。**\" **\"久不动则有去意\"六个字，解释了\"恒\"之后为什么是\"遯\"**：**在一个地方待久了，\"离开\"的念头自己就会生出来**——**这不是\"不忠\"，是\"恒\"的自然尽头。** **而卦体给了它更硬的理由**：\"**此卦天下有山，天阳向上，物虽上陵但止而不进；以阴阳之道论，二阴居下有上进之势，阳将消退——故此时乃论'小人渐盛，君子退避之时'，此遯之义也。**\" **卦图八物**：**①\"一山：阻也\"**；**②\"一水：险也\"**；**③\"酒旗上文字：酒为忘忧之物，文在旗上，受人提携也\"**；**④\"官人踏龟：归，鬼也；玄武自来，水上求财\"**；**⑤\"幞头上树：求去辞官也\"**；**⑥\"月在云中：主半清半浊象，事未明晰\"**；**⑦\"人在水边：等待平安状，莅临也\"**；**⑧\"树下人独酌：休也，无事也，萌生退意状\"**。**其中\"幞头上树\"（求去辞官）与\"树下人独酌\"（萌生退意）是同一件事的两个阶段**：**一个已经决定走，一个还在犹豫。** **须说明**：**这是讲义对遯卦卦序与卦图的注解**；**\"小人渐盛，君子退避\"是《易经》的时代语境（君子／小人之辨）**，**本集取其结构义**（**环境不利于守道者时，\"退\"是一种选择**）；**\"月在云中＝半清半浊、事未明晰\"一物，极适合用于\"看不清局势时\"的判断。**","o":"TJ-0390 · 天纪·人间道·遯卦（PDF 第83页）"},{"t":"一百四十二、遯卦：守道去恶","h":"卦辞：\"人退道不屈\"","c":"要点——遯卦辞为\"**遯：亨，小利贞**\"，其解：\"**遯，乃君子潜藏之时。君子退而伸其道——'人退道不屈'，则可亨；虽无大力，但仍有小吉，因知时避退，此善之道也。**\" **\"人退道不屈\"五个字，是遯卦的核心**：**退的只是\"人\"（位置、身份、参与的资格），\"道\"不跟着退**——**两者分开，才\"可亨\"。** **须说明**：**\"遯：亨，小利贞\"是《易经》原文**；**\"遯\"（dùn）通\"遁\"**（**\"遯\"字本义为\"逃、退\"，但《易经》的\"遯\"不是\"逃跑\"，是\"退避\"**）；**\"小利贞\"的\"小\"很讲究**：**退避之时\"不可求大功，但利于小功\"**（**见彖辞之解**）——**即：退的时候目标要小，否则\"退\"就变成了\"败\"**。**这一条与\"蛊卦上九不事王侯\"\"大过上六过涉灭顶\"合起来**：**《易经》对\"退\"的态度是正面的，但条件是\"道不屈\"与\"求小功\"。**","o":"TJ-0391 · 天纪·人间道·遯卦（PDF 第83~84页）"},{"t":"一百四十二、遯卦：守道去恶","h":"彖：\"未必真遯\"——退不是藏而不为","c":"方法——遯卦\"彖\"为\"**遯亨，遯而亨也。刚当位而应，与时行也**\"，其解极重要：\"**君子处遯之道，知退生吉，退所以为伸道。故虽退之时，君子处之，未必真遯——当随时消息：有可以致力，当不避之，以扶持其道；并非于遯时，藏而不为也。**\" **\"未必真遯\"这四个字，是《易经》对\"退\"最精细的修正**：**\"退\"不是\"什么都不做\"，是\"换一种方式做\"**——**\"有可以致力，当不避之\"（还能使上劲的地方，不要躲）；\"以扶持其道\"（目的在于让道不倒）。** **而\"并非于遯时，藏而不为也\"直接把\"隐遁\"排除了**：**真的\"藏起来不做事\"，不是遯卦要的。** **须说明**：**这是《易经》彖传原文加讲义之解**；**\"当随时消息\"的\"消息\"是\"消长\"（一消一长）**——**即：退的深浅要随时间调整**（**不是一退到底**）。**其可用的核极实用**：**\"退\"的正确姿势是\"减参与、不减责任\"**——**而\"藏而不为\"是另一种失职。**","o":"TJ-0392 · 天纪·人间道·遯卦（PDF 第84页）"},{"t":"一百四十二、遯卦：守道去恶","h":"\"小利贞，浸而长也\"与象\"不恶而严\"","c":"方法——遯卦\"彖\"末段：\"**小利贞，浸而长也，遯之时义大矣哉**\"，其解：\"**小人之道长时，不可求大功，但利于小功。君子之人能察于其微，始即深以戒之，退而伸道、不使道消——此处遯之时意义之大处也。**\" **而大象\"天下有山，遯；君子以远小人，不恶而严\"是全卦最精的一条**，其解：\"**山在天下，由下起而上止；天上进分之相违，此遯之象——因违和而须遯。君子远小人之道：若以恶声厉色，只增其怨忿而已；唯用庄严威色，使其敬畏，小人自然远矣。**\" **\"不恶而严\"四个字，把\"如何远离一个人\"说尽了**：**\"不恶\"（不表露厌恶）＋\"严\"（保持庄重威严）**——**两者缺一不可。** **而它的机制写得极准**：**\"若以恶声厉色，只增其怨忿而已\"**（**厌恶一旦表现出来，对方不会远离，只会记恨**）；**\"唯用庄严威色，使其敬畏，小人自然远矣\"**（**不表达情绪，只保持分量——对方自己就退了**）。**须说明**：**这是《易经》原文（遯彖末段、遯大象）**；**\"君子远小人\"是《易经》的君子／小人语境**，**本集取其结构义**（**\"如何与不想深交的人保持距离\"**）——**这一点在现代职场、社交、家庭关系中同样适用**；**而\"察于其微，始即深以戒之\"是它的时机要求**：**在还很小的时候就戒，而不是等它长大。**","o":"TJ-0393 · 天纪·人间道·遯卦（PDF 第84页）  ---"},{"t":"一百四十三、遯卦六爻：六种退法","h":"初、二爻：\"遯尾\"与\"执之用黄牛之革\"","c":"方法——**初爻\"遯尾，厉，勿用有攸往\"**：\"**因遯本即退去，故初爻为往退之初，反为其尾——此时以柔处遯，不可往，往则有灾。**\"其\"象\"：\"**退处之时，居于尾者，此危也；唯晦藏于下或末端，可得吉——因往有晦，不若不往，故晦藏可免灾也。**\" **第二爻\"执之用黄牛之革，莫之胜说\"**：\"**二与五位相应，居正而相亲合——其交之坚，若牛革之系，不可言语。**\"其\"象\"：\"**二与五位用中正之道相结，且坚心其志，犹牛革之坚也。**\" **初爻讲的是\"退得最晚的人\"**：**\"遯尾\"（退在尾巴上）**——**已经该走了，他还在后面**；**而其解法不是\"赶紧往前赶\"，是\"晦藏于下\"**（**即：藏到低处、末端去，不引人注意**）。**\"因往有晦，不若不往\"这个判断很实在**：**往前赶反而会撞上麻烦，不动更安全。** **第二爻则是\"退不掉的关系\"**——**\"黄牛之革\"（坚韧的牛皮）** 比喻**\"用中正之道相结\"的关系**（**即：因为正道而结合的关系，牢固到解不开**）。**须说明**：**这是《易经》原文（遯初六、六二）**；**\"莫之胜说\"的\"说\"通\"脱\"（解不开）**；**两爻合起来给了\"退\"的第一层分寸**：**关系是\"因义\"结的，就退不掉（也不必退）；只是\"位置\"在退，人还在**（**这与\"人退道不屈\"正好接上**）。","o":"TJ-0394 · 天纪·人间道·遯卦·初、二爻（PDF 第84页）"},{"t":"一百四十三、遯卦六爻：六种退法","h":"第三爻：\"系遯\"——退时最怕有事累","c":"风险——第三爻\"**系遯，有疾厉，畜臣妾，吉**\"。其解的第一句是全卦最实用的一条判断：\"**遯退之道，其贵在'速及远'——如有事累，则不速，于遯时则有危也。**\" **\"其贵在速及远\"五个字，是\"退\"的技术要求**：**退要快、要远**——**而\"如有事累，则不速\"**（**有牵挂就快不了**）。** 而其后半段则给了\"牵挂\"的两种性质**：\"**人之亲，若以女子小人而言，其皆怀恩而不知义——亲爱之则忠，犯错而严厉时，则生暗害，此小人之道。然君子之道非如是：待之以正，即令有拖累亦不有灾——如君王有危而不弃黎民，虽危亦可无咎，古之前例多矣。**\"其\"象\"：\"**系遯之道，于养臣妾亲昵人时可吉，但不可以担当大事；待人取中正之道、不以私心而生偏、取诸于公，则可行大事矣。**\" **须说明**：**这是《易经》原文（遯九三）**；**\"女子小人\"\"臣妾\"是古代的等级与性别语汇**，**本集只取两层结构义**：**①\"怀恩而不知义\"的关系（靠恩情维系，一严厉就生怨）**；**②\"待之以正\"的关系（即使有拖累，也不会成灾）**；**不取其身份内容**。**而其最要紧的判断是\"君王有危而不弃黎民\"**：**该带走的拖累（责任）不能丢**——**\"虽危亦可无咎\"**。**这与\"彖辞未必真遯、藏而不为\"是同一条**：**退出的是\"位置\"，不是\"责任\"。**","o":"TJ-0395 · 天纪·人间道·遯卦·第三爻（PDF 第84页）"},{"t":"一百四十三、遯卦六爻：六种退法","h":"第四爻：\"好遯\"——君子易出难进，小人易进难出","c":"要点——第四爻\"**好遯，君子吉，小人否**\"，是全卦最锋利的一爻。其解：\"**君子之人亦有所好——处退之时，必去而不疑，'以道来制欲'，故为吉。而小人反之：其不能以义处之，唯私欲之所好，即令身陷亦不能自制，故于小人则否。故君子必易出难进，小人则易进难出。**\"其\"象\"：\"**君子知时而退不疑，小人则无法克制私欲，以至于凶也。**\" **\"君子必易出难进，小人则易进难出\"这一组对照，是遯卦最有用的判断**：**\"出\"（离开）容易、\"进\"（进入）谨慎——这是君子；反过来，\"进\"容易、\"出\"难——这是小人。** **即：判断一个人的品格，可以看他\"进去容易还是出来容易\"。** **须说明**：**这是《易经》原文（遯九四）**；**注意\"好遯\"的\"好\"（hào）是\"有所爱好\"**——**即：连\"自己所喜欢的\"也能放下，才叫\"好遯\"**；**而它的机制是\"以道来制欲\"**（**用\"道\"来管住\"欲\"**）——**不是\"没有欲望\"，是\"欲望之上有东西压着\"。** **其可用的核极准**：**\"难出\"的人不是\"忠诚\"，是\"自制力不足\"**（**\"即令身陷亦不能自制\"**）；**而\"易出\"也不是\"薄情\"，是\"知时\"**（**\"知时而退不疑\"**）。","o":"TJ-0396 · 天纪·人间道·遯卦·第四爻（PDF 第84页）"},{"t":"一百四十三、遯卦六爻：六种退法","h":"第五、上爻：\"嘉遯\"与\"肥遯\"","c":"方法——**第五爻\"嘉遯，贞吉\"**：\"**君王处得中道，动静间必以时，故嘉美，终吉。今人却动静皆以私欲、表里不一、不以中正之道处、知进不知退，此凶也。**\"其\"象\"：\"**内心正则动必正，此退之美也；今人不以退为美，只动之以欲，因志不正也。**\" **上爻\"肥遯，无不利\"**：\"**此退之极致：退求远，且无累于他人——此退之有余，无往不利矣。今人即令退，亦追求有所牵累他人；其动不正，唯自苦而已，小人自招之累也。**\"其\"象\"：\"**退之求其远，且无所拖累，此退之道至极，必无不利。且刚决而不疑——君子之遯道，虽退，因得道，却能无往不利。**\" **两爻的递进是\"退的质量\"**：**第五爻\"嘉遯\"（退得美——\"动静间必以时\"）；上爻\"肥遯\"（退得宽裕——\"退求远，且无累于他人\"）。** **而\"肥\"（宽绰有余）这个字用得极妙**：**退得干净、不拖累别人，所以\"有余\"**——**反之，\"即令退，亦追求有所牵累他人\"，就\"唯自苦而已\"。** **须说明**：**这是《易经》原文（遯九五、上九）**；**\"肥遯\"后来成为\"功成身退、退得漂亮\"的典故**（**范蠡泛舟五湖、张良从赤松子游，都属此类**）；**\"今人不以退为美，只动之以欲，因志不正也\"这一句，是讲义对\"只进不退\"的直接批评**——**而它把原因归到了\"志\"（方向）上，不是\"能力\"上。**","o":"TJ-0397 · 天纪·人间道·遯卦·第五、上爻（PDF 第84~85页）"},{"t":"一百四十四、大壮：刚以动","h":"卦序：君子之退且聚合","c":"定义——大壮卦（雷天大壮）为\"**羝羊触藩之课，先曲后顺之象**\"，其卦序是全册极精彩的一处转折：\"**君子之退而伸道——多数君子之退且聚合，而成大壮之势。壮有'进且盛'义；阳刚而震动，此以刚而动，乃大壮之象，犹雷威震在天上也。**\" **\"多数君子之退且聚合，而成大壮之势\"这一句，把\"遯\"与\"大壮\"接上了**：**\"退\"不是\"散\"，退的人\"聚合\"起来，反而成了\"大壮\"（大的力量）。** **即：从\"个体退避\"到\"群体成形\"**——**这是\"退\"之后的一条出路。** **其卦图**：**①\"北斗星：帝君，老板，主事之人\"**；**②\"天神执剑：民意归向，人心也\"**；**③\"一官人烧香拜：拜求于天，而不求人，凶\"**；**④\"一猴、一兔、一犬：侯，刘，狄姓，在野之人\"**；**⑤\"猴回头：回吼\"⑥\"兔回头：回吐\"⑦\"羊回头：回阳\"**——**而总断是\"此卦示意过刚必招凶，而猴、羊、兔为三贵人，'和中近易'为处之道\"。** **须说明**：**这是讲义对大壮卦序与卦图的注解**；**\"侯、刘、狄姓\"一类属象数取象（谐音），\"回吼\"\"回吐\"\"回阳\"也是谐音取义**；**而\"拜求于天，而不求人，凶\"一物可独立取义**：**把希望全押在\"天\"（运气、上位者）而不去求\"人\"（实际做事的人），是凶**——**这与\"大壮卦'利贞'（理正而势正）\"正好相反。**","o":"TJ-0398 · 天纪·人间道·大壮卦（PDF 第85页）"},{"t":"一百四十四、大壮：刚以动","h":"卦辞：\"利，贞\"——不得正而壮，只强猛无理","c":"要点——大壮卦辞极简，只有\"**大壮：利，贞**\"三字，而其解下了全卦最重的一句断语：\"**大壮之道利在正——理正而势正；如不得正而壮，只强猛无理而已，非君子之壮。**\" **\"理正而势正\"四个字，把\"壮\"的合法性说清了**：**\"壮\"（强大、有力）必须\"理正\"（道理站得住）**——**\"势\"（力量）才有依托。** **而\"不得正而壮，只强猛无理而已\"这一句是它的反面**：**没有\"正\"的\"壮\"，不是\"强\"，是\"野蛮\"。** **须说明**：**\"大壮：利，贞\"是《易经》原文**；**\"非君子之壮\"这个提法很重要**——**即：\"壮\"有两种，一种是\"君子之壮\"（有正），一种是\"只强猛\"（无正）**；**而\"羝羊触藩\"（公羊顶篱笆，角被卡住）这个卦名，正是\"无正之壮\"的下场**——**力气使得很大，方向错了，角卡住了。** **其可用的核**：**判断\"力量\"该不该服，看它有没有\"理\"**——**而\"理正而势正\"的顺序也讲究：先理正，后势正**（**不是\"有了势再找理\"**）。","o":"TJ-0399 · 天纪·人间道·大壮卦（PDF 第85页）  ---"},{"t":"一百四十五、大壮：壮之正","h":"象：\"非礼弗履\"——能自胜者为最壮","c":"方法——大壮卦\"象\"为\"**雷在天上，大壮；君子以非礼弗履**\"，其解是全册对\"强\"最反直觉的一段：\"**君子观雷震威在天，此之壮大，而行大壮之道，知唯'克己复礼'最大。能自胜之人为天地之最壮者——能赴汤蹈火，此唯武夫之勇也。君子能和而不流，大立而不倚。**\" **\"能自胜之人为天地之最壮者\"这一句，把\"壮\"从\"对外\"转到了\"对内\"**：**\"壮\"不是\"能打得过别人\"，是\"能管得住自己\"**；**而\"赴汤蹈火\"被降了一级——\"此唯武夫之勇也\"**（**那是\"勇\"，不是\"壮\"**）。** 而\"和而不流，大立而不倚\"两句，是\"自胜\"之后的样子**：**\"和\"（与人相和）但\"不流\"（不随波逐流）；\"大立\"（站得大）但\"不倚\"（不倚靠、不偏斜）。** **须说明**：**\"雷在天上，大壮；君子以非礼弗履\"是《易经》原文**（**\"非礼弗履\"＝不合礼的不做**——**《论语·颜渊》\"克己复礼\"正为此处所引**）；**而\"非礼弗履\"这个做法，恰好与\"大壮\"的名字相反**：**名字叫\"大壮\"（强力），内容却是\"不做\"（约束）**——**这一反差正是它的深意：真正的强大，表现为\"能不做\"。** **其可用的核**：**衡量一个人的\"强\"，看他能管住自己到什么程度**——**而\"赴汤蹈火\"只是力气**（**力气谁都有，克制不是谁都有**）。","o":"TJ-0400 · 天纪·人间道·大壮卦（PDF 第85页）"},{"t":"一百四十五、大壮：壮之正","h":"初、二爻：\"壮于趾\"与\"贞吉\"","c":"风险——**初爻\"壮于趾，征凶，有孚\"**：\"**初爻在下，而阳刚居之，乃初进而用壮，必凶。吾人居上用壮，犹须正方可行；初进而刚壮，必招凶辱。**\"其\"象\"：\"**在下位而用壮，即令行可信，亦必招穷困阻滞也。**\" **第二爻\"贞吉\"**：\"**二位属阴位，阳刚居之，乃示人刚柔得中也——人能识得时义之轻重，则必吉。**\"其\"象\"是极狠的一句批评：\"**能得中正而坚持守之，此意中而不失正。今人中立而为己，已失正道，犹墙头之草，可叹也。**\" **\"即令行可信，亦必招穷困阻滞\"这一句，是\"位置\"的又一次发言**：**\"行可信\"（做得对）不等于\"能做成\"**——**在下位而用壮，对也没用**（**这与\"恒卦九四田无禽\"\"大过九三栋桡\"是同一组**）。**而\"今人中立而为己，已失正道，犹墙头之草\"这一句，是\"墙头草\"的古典出处**：**\"中立\"若目的是\"为己\"（自保），就不是\"中\"，是\"无正\"**——**而\"墙头草\"的判语极狠：它两边都不站，所以两边都不靠。** **须说明**：**这是《易经》原文（大壮初九、九二）**；**\"有孚\"在此指\"有诚信、做得可信\"**；**第二爻的\"贞吉\"是全卦唯一无条件的\"吉\"**——**因为它是\"刚柔得中\"（刚放在柔位上）。**","o":"TJ-0401 · 天纪·人间道·大壮卦·初、二爻（PDF 第85~86页）"},{"t":"一百四十五、大壮：壮之正","h":"第三爻：\"小人用壮，君子用罔\"","c":"要点——第三爻\"**小人用壮，君子用罔。贞厉，羝羊触藩，羸其角**\"，是全卦最难解也最重要的一爻。其解：\"**小人尚力，只用其壮勇；而君子用罔——因其志刚，无视于非正之事，无所忌惮也。万物莫不用其壮，犹羊之壮于首角，一遇藩篱，亦受困也。故用壮，不可强力进，须持之正道、无忌惮于邪吝，方为'真罔'。**\"其\"象\"：\"**小人用其强壮之武力，终困；君子志气刚强，无视邪恶，无所忌惮。**\" **\"用罔\"这两个字，讲义给了极精确的界定**：**\"罔\"不是\"不用力\"，是\"无视\"**——**\"因其志刚，无视于非正之事\"**（**即：志气刚强到\"根本不去理会那些不正的东西\"**）。** 而\"方为真罔\"这个提法说明：**\"罔\"有真假——真的\"罔\"是\"无忌惮于邪吝\"（对歪门邪道毫无忌惮地不理），假的\"罔\"是\"什么都不在乎\"。** **而\"羝羊触藩，羸其角\"（公羊顶篱笆、角被卡住）是\"用壮\"的下场**：**\"万物莫不用其壮，犹羊之壮于首角，一遇藩篱，亦受困也\"**——**即：力气用在\"角\"上（最硬的地方），一遇\"藩篱\"（比它更有韧性的东西），就卡住了。** **须说明**：**这是《易经》原文（大壮九三）**；**\"罔\"（wǎng）在此不作\"没有\"解，而作\"无／不\"解（\"无视\"）**——**这一处解法与通行注家有出入，本集按讲义记录并标明**；**其可用的核是\"用壮\"与\"用罔\"的分野**：**对\"事\"用力，对\"非正之事\"不用力**——**前者是\"壮\"，后者才是\"罔\"。**","o":"TJ-0402 · 天纪·人间道·大壮卦·第三爻（PDF 第86页）"},{"t":"一百四十五、大壮：壮之正","h":"第四、五、上爻：\"藩决不羸\"\"丧羊于易\"\"不能退不能遂\"","c":"风险——**第四爻\"贞吉，悔亡，藩决不羸，壮于大舆之輹\"**：\"**时方道之长盛时，如有小失，则必害进之势——犹大车其轮轴必壮，乃利于行；如轮轴不强，以致大车之不行也；有如藩篱之决开而不复其困也。**\"其\"象\"：\"**四位未至极，以当盛之阳，又用壮以进，无能阻之——即令藩篱隔而不困其力也。**\" **第五爻\"丧羊于易，无悔\"**：\"**羊性喜群行又互触其角，犹诸阳并行。如以力制，则必难胜有悔；唯其平和得之，则无所用其刚——使其壮失于'和易'之道，可以无悔。**\"其\"象\"给了全卦最实用的一条治理原则：\"**柔居尊位，位不当也——犹人君之势不足，下又壮进，才有所谓'治壮之道'。治壮之道不可用刚，须以平易近人待之，可化壮也。**\" **上爻\"羝羊触藩，不能退，不能遂，无攸利，艰则吉\"**：\"**阴柔又处壮极，犹羊角之触藩——进退不得，必无所往也。阴柔处壮时，一遇艰困，必不能守，往即凶也。吾人须居艰困时而处柔，必吉。此壮之极，须变义也。**\"其\"象\"：\"**此因自处不详不慎，以致进退不能也；以柔处艰时，即有咎，亦不长久。**\" **\"治壮之道不可用刚，须以平易近人待之，可化壮也\"这一句，是全卦最实用的一条**：**面对\"下面的人正在壮大\"这种局面，用强硬手段压不住（\"如以力制，则必难胜有悔\"），只能\"以平易近人待之\"——而\"可化壮\"（能把它化掉）。** **须说明**：**这是《易经》原文（大壮九四、六五、上六）**；**\"輹\"（fù）是车厢下承轴的部件**；**而\"艰则吉\"是全卦最反直觉的收尾**：**\"不能退、不能遂\"（进退不得）之时，判语却是\"艰则吉\"**——**即：在进退不得的困境里，\"守艰\"（熬住、处柔）才是吉，而\"往即凶\"（硬走）。** **这与\"坎卦'险以能行为功'\"看似相反，其实互补**：**能行时行，不能行时守**。","o":"TJ-0403 · 天纪·人间道·大壮卦·第四、五、上爻（PDF 第86页）"},{"t":"一百四十六、晋卦：明出地上","h":"卦图与卦体","c":"定义——晋卦（火地晋）占例为\"**昔司马进策，卜得之，后果为丞相**\"，其卦图为\"**文字破、官人掩面、毬在泥上、鸡衔秤、枯木生花、鹿衔书、一堆金宝**\"。**晋卦之名与卦体**：**火（离）在地上（坤），即\"明出地上\"**——**\"晋\"是\"进\"（前进、晋升）**。**须说明**：**此段在源文本中续于下页，本集只录已完整读到的部分**；**卦图七物的象义（如\"文字破＝文书有损\"\"官人掩面＝不欲见人\"\"毬在泥上＝停滞\"\"枯木生花＝衰而复苏\"\"鹿衔书＝征召之信\"\"一堆金宝＝财聚\"）须待下页正文对照后方可确定**，**此处不作推断**——**这是本集的处理原则：象义未读到原文对应解说时，宁可不注。**","o":"TJ-0404 · 天纪·人间道·晋卦（PDF 第87页）  ---"},{"t":"一百四十七、进之道","h":"卦序与卦辞：\"明出地上\"与康侯之宠","c":"定义——晋卦（火地晋）为\"**龙剑入匣之课，以臣遇君之象**\"，其卦序：\"**继壮盛之后，则必进——晋，进也。明出于地，升而明，故晋。此论进之道：离，中虚为明，乃明出于地上也。**\" **卦辞为\"晋：康侯用锡马蕃庶，昼日三接\"**，其解：\"**有能治安之诸侯，名'康侯'——其因能明、下体顺附、承王之象，则见众多之马驾、有重赐，乃宠遇之至也。此上明下顺，乃进盛之时。**\" **须说明**：**这是《易经》原文（晋卦辞）**；**\"康侯\"是\"能使国家安康的诸侯\"，\"锡马蕃庶\"是\"赐马众多\"，\"昼日三接\"是\"一天之内三次接见\"**——**即：极高的礼遇**；**其可用的核是它的条件**：\"**上明下顺**\"——**\"进盛\"不是单方面的上升，是\"上面清明、下面顺从\"两头同时对**（**这与\"泰卦上下交而其志同\"是同一判断**）。**卦图九物**：**①\"文字破：官事不成，退位象\"**；**②\"官人掩面：无颜见人，悲象\"**；**③\"毬在泥上：所求必陷险也\"**；**④\"鸡衔秤：鸡，酉也；秤示公平，称心也\"**；**⑤\"枯木生花：晚发也\"**；**⑥\"鹿衔书：禄与命到也\"**；**⑦\"一堆金宝：财禄丰收之象；占疾厄，则有焚金纸之象，主丧服\"**；**⑧\"人立水边：恐泣之象，主丧服\"**；**⑨\"三点在石上：心象，示人心在石上，不动念，坚心也\"**。**其中\"三点在石上\"一物最有意思**：**以\"石\"喻\"不动\"，以\"三点\"喻\"心\"，合起来是\"心坚如石\"**。","o":"TJ-0405 · 天纪·人间道·晋卦（PDF 第87页）"},{"t":"一百四十七、进之道","h":"象：\"君子以自昭明德\"","c":"方法——晋卦\"象\"为\"**明出地上，晋；君子以自昭明德**\"，其解：\"**君子观明出地上，近明为晋，故知惟'昭明德于己'——求己之明且有德，为晋之道。**\" **\"自昭明德\"三个字，是晋卦的方法论核心**：**\"昭\"（显明）的方向是\"自\"（向内、对自己）**——**不是\"向外证明我有德\"，是\"把自己里面的明德显出来\"。** **须说明**：**\"明出地上，晋；君子以自昭明德\"是《易经》原文**；**注意它与\"离卦继明照于四方\"的分工**：**\"照于四方\"是\"照亮外面\"，\"自昭明德\"是\"照见自己\"**——**一个对外，一个对内**；**而《大学》\"自昭明德\"的思路正与此同源**（**\"自昭\"后来成为\"自我修养\"的经典表述**）。**其可用的核极直接**：**\"进步\"的第一件事不是\"让更多人看见我\"，是\"让自己看得见自己\"**——**而这与\"咸卦虚受人\"（先空出位置）、\"大壮非礼弗履\"（先约束自己）构成一组\"向内\"的判断。**","o":"TJ-0406 · 天纪·人间道·晋卦（PDF 第87~88页）"},{"t":"一百四十八、晋卦六爻","h":"初、二爻：\"晋如摧如\"与\"晋如愁如\"","c":"方法——**初爻\"晋如摧如，贞吉，罔孚，裕无咎\"**。其解是全卦最实用的一条\"新人守则\"：\"**初爻乃晋之始时——始进而求快升，必不遂其意，因上位未能遽信；必当'自守安位、宽裕不求'，以待上位之信方可。小人始进而求上信，则必伤于义，皆招咎悔。此君子方知进退之道。**\"其\"象\"更狠：\"**进退之间，惟君子能独行正道，唯义之所趋，方可出仕；未受命时，皆宽裕无求。若能信于上、忠职守，却反失去职务，则君子一日不居，必退而远之。**\" **第二爻\"晋如愁如，贞吉。受兹介福，于其王母\"**：\"**进退之间守正道，当吉。二爻之位虽无援，因能守正，日久彰显，自得上六五君位之人相应——上位自当求之，因德同也。**\"其\"象
