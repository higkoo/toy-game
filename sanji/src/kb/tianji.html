——**而\"三就\"之后，\"又何之矣\"（还往哪儿去）说明：审到三次，这个方案就是\"至当\"了**（**再改就变成\"改着改着没了方向\"**）。","o":"TJ-0526 · 天纪·人间道·革卦·第三、四爻（PDF 第106页）"},{"t":"一百八十六、革卦六爻","h":"第五、上爻：\"大人虎变\"与\"君子豹变，小人革面\"","c":"要点——**第五爻\"大人虎变，未占有孚\"**：\"**至尊之君，能以中正之道，居革之时，乃能力革之——其必昭著天下，不须占决，知其行为之至当，天下必信。**\"其\"象\"：\"**事理之明如虎纹之明盛，则天下无不信服。**\" **\"未占有孚\"（不必占卜，就已经被信）这一句，是\"变革\"的最高状态**：**\"虎变\"（像虎纹那样鲜明）——它的\"明\"本身就让人信**（**不需要额外的解释与证明）。** **上爻\"君子豹变，小人革面，征凶，居贞吉\"**，是全卦收得最实的一条：\"**革之终时，君子必从革后而大变，至于至善；小人昏愚难变，即令心智未化，但其面已改，从上之教导。天下之事于始革必艰难，至革成，则患'无法自守'——故于此须戒之'守贞坚志'，则果必吉。**\"其\"象\"：\"**君子变革后，其更精进，如文采之蔚盛；小人因于革，不敢为恶，唯外饰臣服，以从君道，此革道成功矣。**\" **\"至革成，则患'无法自守'\"这一句，是\"变革\"的第二阶段问题**：**难不在\"改\"，在\"改完之后守不住\"**（**因为\"革\"的动能一旦消失，旧的东西就会回来）。** **而\"小人革面\"（只改脸面不改心）则是\"革\"的常见结局**——**\"唯外饰臣服\"，看起来成了，其实只是\"不敢为恶\"。** **须说明**：**这是《易经》原文（革卦第五、上爻）**；**\"虎变\"\"豹变\"取\"变化之显著\"义**（**虎纹更明、豹纹更密**）；**其可用的核极准**：**判断一场\"革\"是否真成，看的是\"君子豹变\"（内在精进）还是\"小人革面\"（只有脸面）**——**而讲义把\"革道成功\"定在\"不敢为恶\"，这一句本身也说明了它的限度**。","o":"TJ-0527 · 天纪·人间道·革卦·第五、上爻（PDF 第106页）  ---"},{"t":"一百八十七、鼎之义","h":"卦序：\"鼎之用在能革物\"","c":"定义——鼎卦（火风鼎）为\"**调和鼎鼐之课，去故取新之象**\"，其卦序：\"**能使物分隔，为鼎——故鼎之用在'能革物'：能使水火不同之物相合，易生为熟，易坚为柔，使相合而不相害，此'革物'之功也，故鼎为革之序卦。此卦上火下风，乃木入火中、烹饪之象，鼎之象即此，为器之大用。**\" **\"易生为熟，易坚为柔，使相合而不相害\"这十四个字，是\"调和\"最准的定义**：**鼎做的事，是把\"生的、硬的\"变成\"熟的、软的\"，并且让\"本来不合的东西\"（水与火、不同的食材）在一起而不互相伤害。** **即：调和不是\"折中\"，是\"转化之后能共存\"。** **而\"鼎为革之序卦\"说明：革是\"去故\"，鼎是\"取新\"**——**前者破，后者立**。** **卦图六物**：**①\"云中月现：显象，拨云见月之象，清明也\"**；**②\"鹊南飞：冬至来临\"**；**③\"一子裹席帽：不明之人，无知之人\"**；**④\"一人执刀：武官也，护卫将军\"**；**⑤\"贵人端坐无畏：君王、老板等人，至公无私\"**；**⑥\"一鼠：子年，暗谋之人，内有阴谋\"**。** 其中\"**云中月现：拨云见月之象，清明也**\"一物与\"贵人端坐无畏：至公无私\"一物正好一对**：**\"清明\"与\"至公\"是鼎卦要的两个品质。** **占例\"秦君卜得之，乃知得九鼎以象九州也\"**。**须说明**：**这是讲义对鼎卦序与卦图的注解**；**\"九鼎\"是古代王权的象征**（**\"问鼎\"之\"鼎\"即此**）；**\"三九一\"一行属排版残迹**，本集不录。","o":"TJ-0528 · 天纪·人间道·鼎卦（PDF 第107页）"},{"t":"一百八十七、鼎之义","h":"卦辞与彖：\"鼎，象也\"与\"大亨以养圣贤\"","c":"要点——鼎卦辞只有四个字：\"**鼎：元吉、亨**\"，其解：\"**鼎之道，能使不合之物相合，故必吉亨。**\" **彖\"鼎，象也\"的解，是全书对\"器\"最完整的一段**：\"**鼎之为器，法自象也。古人以方代表'实且正'之象——两耳对峙在上，三足分峙于下，周圆内外，皆有法而正，成'安重'之象。**\" **\"两耳对峙在上，三足分峙于下，周圆内外，皆有法而正\"这一句，是\"鼎\"为什么能\"调和\"的答案**：**它的\"形\"本身就是\"法\"（规矩）**——**两耳对称（受力的平衡）、三足分立（支撑的稳定）、周圆内外（容量的合度）**——**而\"安重\"（稳而重）是它的结果。** **即：能\"调和\"别人的东西，自己得先\"有法而正\"。** **而\"以木巽火，烹饪也。圣人亨以享上帝，而大亨以养圣贤\"的解**：\"**用木就火，烹饪之象——鼎器人赖以生，故圣人以鼎享上帝，用大亨以享圣人。**\" **\"大亨以养圣贤\"这一句，把\"鼎\"的用途从\"祭祀\"扩到了\"养人\"**：**鼎不只是礼器，是\"养\"的器具**（**而\"养圣贤\"是它最高级的用法）。** **须说明**：**这是《易经》原文加讲义之解**；**\"亨\"在此读\"烹\"**（**与\"享\"通假**）；**其可用的核**：**\"鼎\"的三个功能——\"合不合\"（调和）、\"养\"（供养）、\"法\"（有规矩）**；**而三者都来自它\"安重\"的形制**。","o":"TJ-0529 · 天纪·人间道·鼎卦（PDF 第107页）"},{"t":"一百八十七、鼎之义","h":"彖续与象：\"中虚为明\"与\"正位凝命\"","c":"方法——鼎卦\"彖\"的续解\"**巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨**\"：\"**人能如卦才：外明内顺，上之头面能'中虚为明'，乃耳聪目明之象；柔乃在下之物，能进上位，以明居尊，得乎中道，而阳刚之道相应——此乃元亨之因也。**\" **\"中虚为明\"四个字，是\"聪明\"的机制**：**\"虚\"（空着）才能\"明\"（看得清）**——**而\"耳聪目明\"不是\"感官好\"，是\"心里没塞满\"。** **而大象\"木上有火，鼎；君子以正位凝命\"的解**：\"**木之上有火，生火烹饪之象为鼎——君子观象，知'法象器'：形体端正且安重，以正其位也。**\" **\"正位凝命\"（把自己的位置摆正、把使命凝聚住）四个字，是鼎卦给\"人\"的要求**：**\"正位\"（位置要正）＋\"凝命\"（命要聚、不要散）**——**而它的取象是\"形体端正且安重\"**（**即：像鼎那样，站得正、压得稳**）。** **须说明**：**这是《易经》原文加讲义之解**；**\"凝命\"的\"凝\"是\"凝聚、凝固\"**；**其可用的核极准**：**\"鼎\"之所以能\"调和\"，是因为它自己\"安重\"**——**一个自己都晃的东西，\"调和\"不了别的**（**这一条与\"咸卦'虚受人'\"、\"损卦'惩忿窒欲'\"、\"大壮'非礼弗履'\"是同一组的第四处：先处理自己**）。","o":"TJ-0530 · 天纪·人间道·鼎卦（PDF 第107页）"},{"t":"一百八十八、鼎卦前四爻","h":"初爻：\"鼎颠趾，利出否\"","c":"风险——鼎卦初爻\"**鼎颠趾，利出否。得妾以其子，无咎**\"。其解：\"**初六乃最下之位，与四爻相应；今居鼎时，有如趾之向上，颠也。鼎覆则趾颠，此非顺道——'反道而行'之理，利于天下败坏之时，乃可为也。居卑下而从阳如妾，妾之从夫，则可无咎。**\"其\"象\"：\"**鼎颠覆趾在上时，背道而行——只利天下败坏之际，弃恶而从贵也。**\" **\"鼎覆则趾颠，此非顺道\"这一句极重要**：**鼎翻过来、脚朝上——这是\"反道而行\"，平时\"不可为\"**；**而它\"只利天下败坏之际\"**（**即：只有在\"脏东西必须倒掉\"的时候，翻鼎才是对的）。** **而\"利出否\"的\"否\"（pǐ）是\"脏东西\"**：**翻鼎的目的不是\"反着来\"，是\"把脏的倒出去\"**（**而\"弃恶而从贵\"正是这个意思）。** **须说明**：**这是《易经》原文（鼎卦初爻）**；**\"颠趾\"是\"脚朝天\"，\"出否\"是\"倒出秽物\"**；**\"得妾以其子\"一句涉古代嫡庶制度**，**本集只记\"从贵\"这一层结构义，不取身份等级内容**；**其可用的核极准**：**\"反道而行\"有它唯一合法的场合**——**\"天下败坏之际\"**（**即：在\"正常秩序本身已经坏了\"的时候，\"翻过来\"才是对的**）；**而平时这么做，就是\"悖\"**。","o":"TJ-0531 · 天纪·人间道·鼎卦·初爻（PDF 第108页）"},{"t":"一百八十八、鼎卦前四爻","h":"第二、三爻：\"鼎有实\"与\"鼎耳革\"","c":"要点——**第二爻\"鼎有实，我仇有疾，不我能即，吉\"**：\"**二位为中位，以刚居中，乃'鼎中有物之实'象；但于阴位，有'能才而密比于阴'之意——居此当求'己之守正、不求于人'，使之能求于我，则不正亦终就之，此吉也。**\"其\"象\"：\"**鼎之有实，犹人之有才——必慎择趋向；如往之不慎，必有对立之事；于此能自求守正，则彼必不能影响我，亦可无过矣。**\" **\"鼎有实，犹人之有才，必慎择趋向\"这一句，把\"有才\"和\"有物\"放在一起**：**鼎里装了东西（有才），就要\"慎择趋向\"（谨慎选择往哪儿用）**——**因为\"如往之不慎，必有对立之事\"**（**才用错了地方，就会招来对立）。** **而\"使之能求于我，则不正亦终就之\"是一个极精的姿态**：**不去求人，而是\"让人来求你\"**——**于是\"不正\"的人也会\"终就之\"（最后靠近你）。** **第三爻\"鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉\"**：\"**九三居相位，阳刚居之，乃正位；然五位之柔君不能与合、不信用之，其行必阻塞、道必不行。有才而不能得君禄命任用之时，君子必内其德、守其正道，终必吉。**\"其\"象\"：\"**有才居相位，与君之念不合，乃'失其义'也；但上能明时，下之才必有能用，故吉。**\" **\"鼎耳革\"（鼎的耳坏了）的取象极妙**：**鼎要靠\"耳\"（两边的把手）才能被抬起——耳一坏，\"其行塞\"（搬不动了）**；**而\"雉膏不食\"（里面的好东西吃不到）**——**即：有才而\"不被举\"，好东西就烂在锅里。** **须说明**：**这是《易经》原文（鼎卦第二、三爻）**；**\"雉膏\"指\"肥美的野鸡肉\"**；**\"我仇\"的\"仇\"在此指\"对偶、匹敌者\"**（**不是\"仇人\"**）；**其可用的核极准**：**\"有才而不能得君禄命任用之时，君子必内其德、守其正道\"**——**这是\"有才而不被用\"的正确姿势**（**不是\"抱怨\"，也不是\"改道\"，是\"内其德\"（把德养在里面））。**","o":"TJ-0532 · 天纪·人间道：鼎卦·第二、三爻（PDF 第108页）"},{"t":"一百八十八、鼎卦前四爻","h":"第四爻：\"鼎折足，覆公餗，其形渥，凶\"","c":"风险——鼎卦第四爻\"**鼎折足，覆公餗，其形渥，凶**\"，是全卦最凶的一条。**讲义原文在此页未完（起于\"四为君侧之位，与初下爻相应——乃示初阴……\"），下一段续解**。**而从爻辞与象义可读出它的结构**：**\"折足\"（鼎的一足断了）→\"覆公餗\"（把给公家的那锅饭全倒了）→\"其形渥\"（汤水淋漓、狼狈不堪）→\"凶\"**。** **须说明**：**这是《易经》原文（鼎卦第四爻）**；**\"餗\"（sù）是\"鼎中的食物\"，\"渥\"（wò）是\"沾湿、淋漓\"**；**其可用的核极准**：**鼎有三足，\"折足\"就是\"支撑的一条腿断了\"**——**而它一断，整锅\"公餗\"（要分给很多人的东西）就全倒掉**（**即：一个人的\"支撑\"出问题，代价由所有等着吃饭的人承担**）；**这一条与\"大过九三栋桡'无辅则不可当大任'\"、\"井卦九二瓮敝漏'\"合成一组\"承重结构失效\"的判断**。","o":"TJ-0533 · 天纪·人间道·鼎卦·第四爻（PDF 第108页）  ---"},{"t":"一百八十九、鼎卦后二爻","h":"第四爻续解：\"任不适之才\"与\"招不信\"","c":"风险——鼎卦第四爻\"**鼎折足，覆公餗，其形渥，凶**\"的续解，把\"折足\"的病因说尽了：\"**初阴柔之小人不可用——其不胜任而败事，犹鼎足折也。居大臣之位、所用非人，至于覆败，此不胜任，其凶可知。成因在于'任不适之才'，必来自私心作用。**\"其\"象\"：\"**当大臣之人，须成天下之治——如任人之不当，以招不信，乃误也。**\" **\"成因在于'任不适之才'，必来自私心作用\"这一句，是\"用错人\"的归因**：**用错人不是\"眼光差\"，是\"私心\"**（**因为\"任不适之才\"往往不是\"看不出他不合适\"，是\"因为某种私人的理由还是用了他\"）。** **而\"任人之不当，以招不信\"这一句，是它的后果**：**用错人的直接代价不是\"事没办成\"，是\"招不信\"（失信）**——**而\"失信\"恰恰是\"大臣\"最不能有的。** **须说明**：**这是《易经》原文（鼎卦第四爻）加讲义之解**；**其可用的核极准**：**\"鼎折足\"的三步**：**任不适之才（用人错）→不胜任而败事（事败）→覆公餗（公家的东西全倒）**；**而第一步的根子是\"私心\"**（**讲义说\"必来自私心作用\"——\"必\"字是断言**）。","o":"TJ-0534 · 天纪·人间道·鼎卦·第四爻（PDF 第108~109页）"},{"t":"一百八十九、鼎卦后二爻","h":"第五、上爻：\"鼎黄耳，金铉\"与\"鼎玉铉\"","c":"方法——**第五爻\"鼎黄耳，金铉，利贞\"**：\"**鼎之主在'耳'——执耳之意：有阳刚之体，又得其位，才必充实，乃能为大用，至善矣。**\"其\"象\"：\"**能执鼎耳之才，乃由其得中道也。**\" **\"鼎之主在耳\"四个字，取象极妙**：**鼎的\"主\"（关键部位）不是\"足\"（承重）、不是\"腹\"（装物），是\"耳\"（被人抬起的地方）**——**即：一个器物真正\"主事\"的，是\"它被人握住的那一处\"。** **上爻\"鼎玉铉，大吉，无不利\"**：\"**鼎之终，功成也——玉为'刚而温'；居成功之顶，唯'小心善处、刚柔适用、动静不可过'，乃生大吉，无所不利也。**\"其\"象\"：\"**鼎以'能终'为功成——致成功之地，以刚柔之并用、有法度之，无不利也。**\" **\"玉为刚而温\"四个字，是\"成功者\"的品质**：**\"刚\"（有硬度）＋\"温\"（不伤人）**——**而\"金铉\"（第五爻的提梁是金属的，硬的）到\"玉铉\"（上爻的提梁是玉的，刚而温）的转变，正是\"从做事到收成\"的转变。** **须说明**：**这是《易经》原文（鼎卦第五、上爻）**；**\"铉\"（xuàn）是\"提鼎的横杠\"**；**其可用的核极准**：**\"鼎以'能终'为功成\"——鼎卦的\"成\"，不在\"煮好了\"，在\"能端到最后\"**（**而\"动静不可过\"是它的操作要点**）。","o":"TJ-0535 · 天纪·人间道·鼎卦·第五、上爻（PDF 第109页）"},{"t":"一百九十、震卦：恐惧修省","h":"卦序：\"能主器者，必赖长子\"","c":"定义——震卦（震为雷）为\"**震惊百里之课，有声无形之象**\"，其卦序：\"**鼎，器也；能主器者，必赖长子——震为长男，取其'主器'之义，故次鼎为震也。此卦二震相重，有'奋发震惊'之象；二雷相继，重雷也。长子继位为君也。**\" **\"能主器者，必赖长子\"这一句，是\"鼎→震\"的枢纽**：**鼎是\"器\"，而\"器\"要有人\"主\"（掌管）**——**而\"主器\"靠的是\"长子\"（继承者）。** **即：器物做得再好，也要有人接。** **而\"二震相重\"（重雷）给了震卦的力度**：**一声雷已惊人，两声相继，就是\"奋发震惊\"。** **卦图六物**：**①\"人立岩上：特立独行，摇摇欲坠也，危险也\"**；**②\"一树开花：有果也，惜乎过于短暂，少部分之人\"**；**③\"一文书：消息至，公文至\"**；**④\"一人推车：转变之象，执行命令象\"**；**⑤\"上有文字：得官令也\"**；**⑥\"一堆钱财者：钱财散于地状，忧心也，丧事也，求财不利，占疾病凶\"**。** 其中\"**人立岩上：摇摇欲坠也，危险也**\"与\"**一树开花：有果也，惜乎过于短暂**\"两物最要紧**：**\"特立独行\"是危险的（站不稳），而\"开花\"是短暂的**——**即：震卦的\"动\"，本身带着\"不稳\"与\"不久\"。** **占例\"李静天师遇龙母借宿、替龙行雨，卜得之，官至仆射\"**。**须说明**：**这是讲义对震卦序与卦图的注解**；**\"震惊百里\"取\"雷声传播之远\"义**。","o":"TJ-0536 · 天纪·人间道·震卦（PDF 第109页）"},{"t":"一百九十、震卦：恐惧修省","h":"卦辞：\"震来虩虩，笑言哑哑\"与\"不丧匕鬯\"","c":"要点——震卦辞为\"**震：亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯**\"，其解是全卦最完整的一段：\"**震之道，能奋发、动而进、知惧而进修，皆足以亨。当震动之来，恐惧不宁不安状——知所戒惧，则可保安，故'笑言和适'貌。震声远及百里，人无不惧而丧失；唯'执宗庙祭祀之器者'，不丧失、不惧也。人间之至诚，莫如于祭祀时之坚心守正。**\" **\"知惧而进修\"四个字，是震卦的正面**：**\"惧\"不是终点，是\"进修\"的起点**（**因为怕，才去学、去见固）。** **而\"唯执宗庙祭祀之器者，不丧失、不惧\"这一句，是极精的取象**：**雷声一来，所有人都跑了、手里的东西都掉了——只有一个\"执祭器的人\"，还站着、还握着**（**因为他手里那件东西\"不能放\"）。** **即：真正稳住一个人的，不是\"胆量\"，是\"手里有一件不能放的东西\"。** **而讲义的定性是\"人间之至诚，莫如于祭祀时之坚心守正\"**——**\"坚心守正\"就是那件\"不能放的东西\"。** **须说明**：**这是《易经》原文加讲义之解**；**\"虩虩\"（xì xì）是\"恐惧的样子\"，\"哑哑\"（è è）是\"笑声\"**；**\"匕鬯\"（bǐ chàng）是\"祭祀用的勺与香酒\"**；**其可用的核极准**：**\"震\"考验的是\"手松没松\"**（**慌张本身并不是关键**）——**而这与\"井卦'勿幕'（不盖）\"、\"革卦'守贞坚志'\"是同一条**：**难的从来都是\"事到临头还握得住\"**。","o":"TJ-0537 · 天纪·人间道·震卦（PDF 第109页）"},{"t":"一百九十、震卦：恐惧修省","h":"彖：\"恐致福也\"与\"因震而生法度\"","c":"方法——震卦\"彖\"为\"**震亨，震来虩虩，恐致福也。笑言哑哑，后有则也**\"，其解极反直觉：\"**震来时能知恐惧，则无患而能亨矣——此因'能有戒惧反为福'也。必恐而知自修、不敢违于常理法规，因震而生法度，必能致福安，故可笑言无忧。**\" **\"恐致福也\"四个字，把\"恐惧\"的价值翻了过来**：**恐惧本身会产生\"福\"**——**因为它让人\"自修\"、\"不敢违于常理法规\"**；而\"因震而生法度\"这一句更精**：**震动的真正作用，是\"生法度\"**（**即：一场震动之后，规矩才立得住**）。** **\"后有则也\"（事后才有法则）这一句，是它的次序**：**先震，后则**——**没有那场\"震\"，谁也不会同意立规矩。** **须说明**：**这是《易经》彖传原文加讲义之解**；**其可用的核极准**：**\"震\"的用处不是\"破坏\"，是\"建立\"**——**而它建立的方式是\"让人怕\"**（**因为\"怕\"才会\"自修\"，\"自修\"才\"生法度\"**）；**⚠ 须补一句**：**这层义不能反过来用**——**有人故意制造\"震\"（恐惧）来\"立法度\"，那是另一回事，不在《易》的本义里**（**震卦讲的是\"天威\"（自然发生的震动），不是\"人为制造恐慌\"**）。","o":"TJ-0538 · 天纪·人间道·震卦（PDF 第109页）"},{"t":"一百九十、震卦：恐惧修省","h":"象：\"洊雷，震；君子以恐惧修省\"","c":"方法——震卦\"象\"为\"**洊雷，震；君子以恐惧修省**\"，其解：\"**洊为重意，上下同卦故为洊雷——形容威震之大也。君子观之，乃知'恐惧自修'：畏天威、省思己过而改之，唯君子能如是。**\" **\"恐惧修省\"四个字，与\"坤卦'履霜坚冰'\"、\"复卦'不远复'\"、\"益卦'见善则迁，有过则改'\"构成一组\"自我校正\"**：**震卦给的是\"由外而内\"的那一路**——**外面来了震动，里面才\"省思己过而改之\"。** **须说明**：**\"洊雷，震；君子以恐惧修省\"是《易经》原文**；**\"洊\"（jiàn）是\"重复、接连\"**；**其可用的核**：**\"畏天威\"是\"承认有比自己大的规律\"**（**而\"省思己过而改之\"是它唯一的正确反应**）；**\"唯君子能如是\"这一句则说明：这个反应不是自动的**（**有人遇到震动只会\"怨\"，不会\"省\"**）。","o":"TJ-0539 · 天纪·人间道·震卦（PDF 第109~110页）  ---"},{"t":"一百九十一、震卦六爻","h":"初、二爻：\"震来虩虩\"与\"亿丧贝，勿逐七日得\"","c":"方法——**初爻\"震来虩虩，后笑言哑哑，吉\"**：\"**居震之始，知震之来，能于始即知戒惧恐慎，不敢掉以轻心，终必安吉。**\"其\"象\"：\"**雷震之来知惧进修，此因知恐而终有福吉。不违于常法，则可保平安也。**\" **\"能于始即知戒惧\"这一句，是震卦的入门**：**\"震\"刚来的时候（\"始\"）是最容易觉察的**——**而\"不敢掉以轻心\"是唯一正确的反应**。** **第二爻\"震来厉，亿丧贝，跻于九陵，勿逐，七日得\"**，是全卦最实用的一条：\"**第二爻乃柔居正位，善处震时之道也——雷震乃刚动而上，无人能御其威猛。度量知其必丧全数之资，故能'远避以自守其中正'——以不追随而得；虽不能立、即防御，但时过后，必可得。**\"其\"象\"：\"**震之至刚而来，如欲驾乘，乃自招危厄。**\" **\"度量知其必丧全数之资\"这一句，是\"止损\"的判断**：**先算清\"这一震会让我损失多少（'全数之资'）\"，然后不是\"去抢回来\"，是\"远避\"。** **而\"勿逐，七日得\"（不要去追，七天后自然回来）是它的结论**——**这与\"睽卦'丧马勿逐自复'\"是同一判断**（**慌的时候去追，追不到；不追，它自己回来**）。** **须说明**：**这是《易经》原文（震卦初、二爻）**；**\"亿\"在此作\"度、料\"解**（**\"亿丧贝\"即\"料想会损失财货\"**）；**\"九陵\"取\"高处\"义**；**其可用的核极准**：**\"震\"来时的三种反应**——**①戒惧（初爻，吉）；②远避自守（第二爻，七日得）；③\"欲驾乘\"（象辞所戒，自招危厄）**；**第三种最常见，因为人本能地想\"控制\"那件正在失控的事。**","o":"TJ-0540 · 天纪·人间道·震卦·初、二爻（PDF 第110页）"},{"t":"一百九十一、震卦六爻","h":"第三、四爻：\"震苏苏\"与\"震遂泥\"","c":"要点——**第三爻\"震苏苏，震行无眚\"**：\"**三位为阳位，阴居之，乃不正位也——不正位之人于平日尚且不安，更何况处于震时？居此如能'知己力之不足而求去'，亦可无咎。**\"其\"象\"：\"**处不当位，即震来而不知戒、不知恐惧也。**\" **\"知己力之不足而求去\"这一句，是\"能力与位置不匹配\"时的正确动作**：**不是\"硬撑\"，是\"求去\"（退出来）**——**而\"于平日尚且不安\"说明：这个不安不是震带来的，是位置本身带来的**（**震只是把它放大了）。** **第四爻\"震遂泥\"**：\"**以刚居柔，不适位而失去刚健之道，无法震奋也，如泥之滞也。**\"其\"象\"：\"**震之动必以刚为本；今动如滞泥，已失刚道——震之义必无法光大也。**\" **\"震遂泥\"（震动却陷进泥里）这个象极准**：**\"震\"本来是\"动\"，而\"泥\"让它\"动不了\"**——**即：有\"动\"的意愿，没有\"动\"的条件。** **而原因是\"以刚居柔\"（刚的东西放在柔的位置）**：**\"不适位\"→\"失去刚健之道\"**（**位置放错了，连本性都发挥不出来）。** **须说明**：**这是《易经》原文（震卦第三、四爻）**；**\"苏苏\"是\"畏惧不安的样子\"，\"眚\"（shěng）是\"灾祸\"**；**其可用的核有两条**：**①\"不正位\"的人，遇震更危险**（**因为\"平日尚且不安\"，震来就没有余力了**）；**②\"以刚居柔\"会让\"刚\"失效**（**这一条与\"大壮'以刚居柔位'与'以刚居刚'的对照\"是同一组**）。","o":"TJ-0541 · 天纪·人间道·震卦·第三、四爻（PDF 第110页）"},{"t":"一百九十一、震卦六爻","h":"第五爻：\"中道胜于正道\"","c":"要点——震卦第五爻\"**震往来厉，亿无丧有事**\"，其解里有一句极重要的辨析：\"**君位之人居震动之时，必不失中道——即令危，亦不为凶矣。'中道'胜于'正道'：有中道之人必不违于正道，正道却不必一定为中道。此其差异所在也。**\"其\"象\"：\"**震之动不以中，往来皆有危；其危之生，乃因失中之道——居此时，以'无丧失'为至善。**\" **\"中道胜于正道\"这一句，是全册对\"中\"与\"正\"关系最清楚的一处**：**\"有中道之人必不违于正道，正道却不必一定为中道。\"** **即：中道是\"更高的那一层\"**——**守\"正道\"只保证了\"方向对\"，守\"中道\"才兼顾了\"时机与程度\"**（**而\"正道\"若在错误的时间以错误的程度施行，就\"不必一定为中道\"了）。** **须说明**：**这是《易经》原文（震卦第五爻）加讲义之解**；**其可用的核极准**：**\"危\"的来源有两个**——**一是震动本身（\"往来皆危\"），二是\"失中之道\"（这个危是自己加的）**；**而\"以无丧失为至善\"是它的目标**（**不是\"赢\"，是\"不丢\"**）——**这与\"损卦'酌损之'\"、\"解卦'小利贞'\"是同一种\"保存优先\"的判断**。","o":"TJ-0542 · 天纪·人间道·震卦·第五爻（PDF 第110页）"},{"t":"一百九十一、震卦六爻","h":"上爻：\"震不于其躬，于其邻\"","c":"风险——震卦上爻\"**震索索，视矍矍，征凶。震不于其躬，于其邻，无咎，婚媾有言**\"。其解：\"**阴柔之人居震之极，惊惧至甚、无志抖索状，其视瞻亦不能安定而明——其于此时，若动必招凶，乃'不明而动'之戒。震之戒在'不及身而及于邻'时己生戒心，则终无咎——如婚事之初有争言，则己生戒心，莫俟及于身，已不及矣。**\" **\"震之戒在'不及身而及于邻'时己生戒心\"这一句，是极准的时机判断**：**震还没打到自己身上，只打到了\"邻\"（旁边的人）——这时候就该\"生戒心\"。** **而\"莫俟及于身，已不及矣\"是它的理由**：**等到打到自己身上再戒，就来不及了**（**这与\"坤卦履霜坚冰'由辨之不早辨也'\"、\"姤卦'系于金柅'\"是同一组**：**最好的时机永远是\"还没发生\"的那一段）。** **须说明**：**这是《易经》原文（震卦上爻）**；**\"索索\"是\"抖索\"，\"矍矍\"（jué jué）是\"惊视\"**；**\"婚媾有言\"取\"婚事之初已有争言（兆头已现）\"义**；**其可用的核极准**：**\"邻\"就是\"别人的教训\"**（**而\"从别人的教训里生戒心\"，正是\"震不于其躬\"的意思**）。","o":"TJ-0543 · 天纪·人间道·震卦·上爻（PDF 第110页）"},{"t":"一百九十二、艮卦：思不出其位","h":"卦序：\"物之动其终必止\"","c":"定义——艮卦（艮为山）\"**此卦是汉高祖困荥阳时，卜得知，只宜守旧**\"，其卦序：\"**震乃动也，物之动其终必止——艮，止也，故为震之序卦。此卦上下皆艮，艮为山，故有'安重坚实'之象；外内皆止、皆静，此'止于其所'也。人能知'安于止'，则得艮之道也。**\" **\"物之动其终必止\"六个字，是\"震→艮\"的枢纽**：**任何\"动\"，最终都会\"止\"**——**而艮卦讲的就是\"止\"这件事本身。** **而\"外内皆止、皆静，此'止于其所'也\"给了\"止\"的正确形态**：**不是\"被迫停\"，是\"止于其所\"（停在它该停的那个位置）。** **卦图四物**：**①\"猴上东北字：候也，停滞等候也\"**；**②\"猴执文书：候其时，待公文命令至也\"**；**③\"官吏执镜：清明之法官，政治清明\"**；**④\"三人绳相系缚：三人相牵连招讼事也\"**。** 其中\"**候其时，待公文命令至也**\"与\"**停滞等候也**\"两物同指一件**：**\"艮\"的\"止\"不是\"不作为\"，是\"候\"（等时机）。** **占例\"汉高祖困荥阳时，卜得知，只宜守旧\"**——**\"只宜守旧\"四字正是\"艮\"的用法**（**困住的时候，能做的只有\"守\"。**）**须说明**：**这是讲义对艮卦序与卦图的注解**；**注意讲义此处作\"积小成高之象\"**（**与升卦\"积小成大\"近而不同**），**本集按原文照录，不强行统一**。","o":"TJ-0544 · 天纪·人间道·艮卦（PDF 第111页）"},{"t":"一百九十二、艮卦：思不出其位","h":"卦辞：\"艮其背，不获其身\"","c":"要点——艮卦辞为\"**艮其背，不获其身，行其庭，不见其人，无咎**\"，其解是全书对\"止\"最透的一段：\"**艮为'止'之道。人之不知止，乃私欲作为——背为不见之处，如不能见，则无欲以乱其心志；人能忘我，则止矣。今人见利则欲据为己有，失止之道。知止之道，则可无咎也。**\" **\"人之不知止，乃私欲作为\"这一句，把\"停不下来\"的病因说清了**：**不是\"没能力停\"，是\"有私欲在动\"**（**因为\"见利则欲据为己有\"，所以停不下来）。** **而\"背为不见之处\"的取象极妙**：**\"背\"是自己看不见的地方**——**\"如不能见，则无欲以乱其心志\"**（**即：看不见的地方，欲望就起不来）。** **而\"人能忘我，则止矣\"是它的结论**——**\"忘我\"是\"止\"的前提**（**因为\"我\"是欲望的载体；\"忘我\"了，\"欲\"无处附着，自然就\"止\"了）。** **须说明**：**这是《易经》原文加讲义之解**；**\"艮其背\"的\"背\"取\"身后不可见处\"义**；**其可用的核极准**：**\"止\"不是\"忍住\"，是\"看不见\"**——**而\"看不见\"的办法不是\"闭眼\"，是\"忘我\"**（**这与\"艮卦'思不出其位'\"、\"咸卦'虚受人'\"、\"损卦'惩忿窒欲'\"合成一组\"从内部断源\"的判断**）。","o":"TJ-0545 · 天纪·人间道·艮卦（PDF 第111页）"},{"t":"一百九十二、艮卦：思不出其位","h":"彖：\"时止则止，时行则行\"与\"止于适止之所\"","c":"方法——艮卦\"彖\"有三层。**\"艮，止也，时止则止，时行则行，动静不失其时，其道光明\"**：\"**艮之道，言'止'也——动静之间不以时，失'止'之义也。君子贵乎时：时可行则行；'时'之义于君子，则重视之。人能不失时、知所进退，道乃光明。**\" **\"时止则止，时行则行\"这八个字，是\"止\"的完整定义**：**该停就停，该走就走**——**即：艮卦讲的\"止\"，不是\"一直停\"，是\"该停的时候停\"。** **而\"动静不失其时，其道光明\"是它的判据**：**判断一个人\"止\"得对不对，看的不是\"他停了多久\"，是\"他停的时机对不对\"。** **\"艮其止，止其所也。上下敌应，不相与也\"**：\"**艮止之道，其功在'能止于适止之所'，此唯圣人能成之。此卦上下二体皆为山，有'因同而相敌应'也——互相背而不相与也。**\" **\"能止于适止之所\"（停在该停的那个位置）是它的要求**——**而\"上下敌应、不相与\"（两边互相背对、不来往）给了它的形态**（**即：\"止\"也可以是\"彼此不往来\"，而这不算坏事**）。** **须说明**：**这是《易经》彖传原文加讲义之解**；**其可用的核极准**：**\"唯圣人能成之\"这一句很重要**——**\"止于适止之所\"这件事很难，因为\"适止之所\"不是固定的，得随时判断**（**这与\"恒卦'所恒为正'\"、\"革卦'治历明时'\"是同一组的第三处：难的都是\"标准随情况变\"的那一类**）。","o":"TJ-0546 · 天纪·人间道·艮卦（PDF 第111页）"},{"t":"一百九十二、艮卦：思不出其位","h":"象与初爻：\"思不出其位\"与\"艮其趾\"","c":"方法——艮卦\"象\"为\"**兼山，艮；君子以思不出其位**\"，其解：\"**上下皆山，故为兼山，乃重艮之象——君子观艮止之道，知'思安于所止，不越其本位'。**\" **\"思不出其位\"四个字，把\"止\"从\"动作\"扩展到了\"念头\"**：**不只是\"手不乱动\"，连\"想\"也不越出自己那个位置**——**即：\"止\"的最内一层，是\"想什么\"也有边界。** **初爻\"艮其趾，无咎，利永贞\"**：\"**初六居最下，乃足趾之象——趾乃人动之最先，于'始动即知止'，必可无咎；且须患己之性阴柔，故戒之在'坚心守道'。**\"其\"象\"：\"**艮其趾，未失正也。**\" **\"趾乃人动之最先，于始动即知止\"这一句，是\"止\"的最佳时点**：**脚步还没有迈出去的时候**——**而这时\"止\"，成本最低（因为\"动\"还没发生）。** **须说明**：**这是《易经》象传原文加讲义之解**；**其可用的核极准**：**\"思不出其位\"与\"艮其趾\"是一内一外**——**\"趾\"管\"动作的起点\"，\"思\"管\"念头的起点\"**；**而两处抓的都是\"最先的那一下\"**（**这与\"姤卦'系于金柅'\"、\"萃卦'除戎器，戒不虞'\"是同一条**：**防范只能在\"还没动\"的时候有效**）。","o":"TJ-0547 · 天纪·人间道·艮卦（PDF 第111页）  ---"},{"t":"一百九十三、艮卦后五爻","h":"第二爻：\"艮其腓，不拯其随\"","c":"要点——艮卦第二爻\"**艮其腓，不拯其随，其心不快**\"，其解：\"**阴居阴位，得止之正道；然居二位为犹人之腿肌位——股动则肌动。二虽正道，然受三爻之影响：即中正之道，无法救助于上位时，唯勉而随之——因'言不听、道不随'，故其心不快。**\"其\"象\"：\"**上位之人，未能从下意，不须救助之，唯随之可也。**\" **\"股动则肌动\"这个取象极准**：**\"腓\"（小腿肚）自己不动，是\"股\"（大腿）动了它才跟着动**——**即：位置在\"从属\"处的人，自己没有主动权。** **而\"即中正之道，无法救助于上位时，唯勉而随之\"是这一爻的真意**：**自己是对的（\"中正之道\"），但\"救助不了上位\"（说话没用）**——**于是只能\"勉而随之\"（勉强跟着）。** **而\"其心不快\"四个字，是讲义对这种处境的定性**：**不是\"愤怒\"，是\"不快\"**（**因为\"言不听、道不随\"——意见不被采纳、主张不被执行**）。** **须说明**：**这是《易经》原文（艮卦第二爻）加讲义之解**；**\"腓\"（féi）是\"小腿肚\"，\"拯\"是\"救\"**；**其可用的核极准**：**\"不须救助之，唯随之可也\"是象辞给的答案**——**上位不听，就不必强救，跟着就行**（**而这不是\"放弃\"，是\"承认这个位置上能做的事有限\"**）。","o":"TJ-0548 · 天纪·人间道·艮卦·第二爻（PDF 第112页）"},{"t":"一百九十三、艮卦后五爻","h":"第三、四爻：\"艮其限\"与\"艮其身\"","c":"风险——**第三爻\"艮其限，列其夤，厉薰心\"**：\"**九三阳刚居阳位，乃'意其刚极'而使上下分隔，不复进退——其坚强如此，则必造成'独限一隅'，而世人不相与，故无法安定其心。故止之道，贵在时宜——行止之间必以时，则吉。**\"其\"象\"：\"**坚固己之刚性，不能因时知进退，必有危惧生其心内也。**\" **\"意其刚极而使上下分隔\"这一句，是\"止\"走偏的样子**：**\"刚\"到\"上下不通\"、\"不复进退\"**——**而结果是\"独限一隅\"（把自己圈在一个角落里）、\"世人不相与\"（没人愿意跟他来往）。** **\"厉薰心\"（危险熏心）这个象极准**：**不是外面的火，是里面的焦——\"必有危惧生其心内也\"**。** **第四爻\"艮其身，无咎\"**：\"**居君侧之人，位高权重；然于艮止之时，当止而不能止，乃因君位过阳刚、不能信孚于臣位之人——居此际，惟'自止其身'，可无咎；但如临施政，则生咎矣。意即：在上位之人只能'独善其身'，必无可取也。**\"其\"象\"：\"**居大臣之位，却只能独善其身、不能行止之道，乃不适其位也。**\" **\"只能独善其身，必无可取也\"这一句，是全卦最严厉的判断**：**\"独善其身\"在别处是褒义，在这里是\"不合格\"**——**因为\"大臣\"这个位置的要求是\"行止之道\"（让整个体系动起来或停下来），而\"自止其身\"（只把自己管好）满足不了它。** **须说明**：**这是《易经》原文（艮卦第三、四爻）**；**\"限\"是\"界限、腰际\"，\"夤\"（yín）是\"脊肉\"**；**其可用的核极准**：**\"无咎\"不等于\"合格\"**——**第四爻得了\"无咎\"，却被判\"不适其位\"**（**即：及格和称职是两件事**）；**这一条与\"蛊卦'柔顺之才可以守成但不可用于发展'\"、\"井卦'井甃无咎'\"是同一条**（**\"守得住\"只能保命，不能成事**）。","o":"TJ-0549 · 天纪·人间道·艮卦·第三、四爻（PDF 第112页）"},{"t":"一百九十三、艮卦后五爻","h":"第五、上爻：\"艮其辅，言有序\"与\"敦艮吉\"","c":"方法——**第五爻\"艮其辅，言有序，悔亡\"**：\"**人之所当止者，唯言与行——今阴柔居君位，于止之时，其才不足任此位；如此则须'言行一致、不可脱序'。古言'君无戏言'即此——故虽己之才不足任此位，但谨言慎行，亦可无虑于败亡。**\"其\"象\"：\"**君位之人能止于中道、言行不脱序于中正之道，即令无足之才能，亦可免祸——故《易》示人之'言行之重要'如是。**\" **\"人之所当止者，唯言与行\"这一句，把\"止\"的对象缩小到了两个**：**该止的不是\"所有事\"，是\"言\"与\"行\"**——**而\"辅\"（牙床、嘴）这个取象正在\"言\"上。** **而\"即令无足之才能，亦可免祸\"是极实在的一句**：**才能不够，但\"言行不脱序\"，就\"可免祸\"**（**即：谨言慎行能替代一部分才能**）；**反过来说，\"才不足而言行脱序\"，就是\"败亡\"的入口。** **上爻\"敦艮，吉\"**：\"**以刚阳之性居艮之终极，可见其止之道、性之坚实如此。常人于止之时，难于持久、'晚节不保'等事常见——人能敦厚知止、如此坚心，此所以吉也。**\"其\"象\"：\"**人常于始能行止之道，至终则无法坚持到底——'始终如一'是《易》之神（即《易》的精髓）；艮致终能吉，乃因其能'终守不变'。**\" **\"晚节不保\"四个字，是上爻要防的那件事**：**\"常人于止之时，难于持久\"**——**即：\"止\"不难，难的是\"一直止得住\"。** **须说明**：**这是《易经》原文（艮卦第五、上爻）**；**\"辅\"（fǔ）是\"面颊、牙床\"**；**其可用的核极准**：**\"始终如一是《易》之神\"**——**讲义把\"始终如一\"提到\"《易》的精髓\"这个高度**；**而其落点是\"能终守不变\"**（**注意是\"守\"不变，不是\"不变\"——它守的是那个\"止\"的原则**）。","o":"TJ-0550 · 天纪·人间道·艮卦·第五、上爻（PDF 第112页）"},{"t":"一百九十四、渐卦：积小成大","h":"卦序：\"良止之后，必有所生\"","c":"定义——渐卦（风山渐）\"**此卦齐晏子应举，卜得之，后果为丞相也**\"，卦题为\"**高山植木之课，积小成大之象**\"，其卦序：\"**艮止之后，必有所生；其生乃因前之有止，故此'生'必渐进——故渐为艮之序。渐，有'渐进、缓进'之意；其进能缓，必有序，而不逾越。此卦上巽下艮，巽为木，而生於山上——此木之高，乃因在山之上；故渐之道，在'知高之因'，在'知进退消息之理据'。**\" **这段话极精，我分三层记**：**①\"艮止之后，必有所生\"**——**\"止\"不是终点，是\"生\"的前置**（**因为\"前面有止\"，后面的\"生\"才不急、才\"渐进\"**）。** **②\"其进能缓，必有序，而不逾越\"**——**\"渐\"的三个条件**：**能缓（不急）、有序（有次第）、不逾越（不跳级）。** **③\"此木之高，乃因在山之上\"**——**这是渐卦最要紧的一句**：**树长得高，不是因为它长得快，是因为它\"生在山之上\"**（**即：它的\"高\"有一半来自\"所在之处\"）。** **由此才有\"渐之道，在'知高之因'\"**——**\"知高之因\"（知道你为什么高），比\"高\"本身重要**（**因为不知道因，就会以为\"高\"是自己挣来的，从此不再\"渐进\"**）。** **须说明**：**这是讲义对渐卦序的注解**；**其可用的核极准**：**\"渐\"讲的是\"有根基、有次第的增长\"，不是\"慢\"**——**而\"知高之因\"是对\"成功者\"的提醒**。","o":"TJ-0551 · 天纪·人间道·渐卦（PDF 第113页）"},{"t":"一百九十四、渐卦：积小成大","h":"卦图与\"渐进\"之戒","c":"要点——渐卦卦图四物：**①\"一望竿在爽高处：家人望归象\"**（**原文\"爽\"字疑为\"高\"字之讹，本集照录**）；**②\"一药炉在地：平安，无灾也\"**；**③\"一官人登梯：升官之象，衣锦还乡也，棺也\"**；**④\"一枝花在地上\"**。** 其中\"**一官人登梯**\"一物最要紧：**\"登梯\"正是\"渐\"的取象**（**一步一步上，而不是\"飞上去\"**）；**而\"棺也\"二字则点出它的另一端**——**\"升\"的尽头也是\"归\"**（**这一层与\"大有'满而不溢'\"、\"晋卦'晋其角'\"同一组：凡\"升\"都要想到\"顶\"）。** **\"一药炉在地：平安，无灾也\"**一物，是全书少见的**直接以\"药炉\"作吉象**（**与\"萃卦'一人救火：救災祸也，犹行医济世救人之道也'\"同属一类**）。** **须说明**：**这是讲义对渐卦卦图的注解**；**其可用的核**：**卦图四物分别给了\"渐\"的四面**：**望归（有方向）、平安（无灾）、登梯（有次第）、花在地上（已落地）**；**而\"知进退消息之理据\"是它对人的要求**（**\"消息\"是\"消长\"——即\"进\"与\"退\"的消长之理，要有根据，不能凭感觉**）。","o":"TJ-0552 · 天纪·人间道·渐卦（PDF 第113页）  ---"},{"t":"一百九十五、渐卦六爻","h":"卦辞与彖：\"女归吉\"与\"进以正\"","c":"要点——渐卦辞为\"**渐：女归吉，利贞**\"，其解：\"**渐之道，其有序、且缓进——吾人可于'女之出嫁'而见之：女归时，以渐进有序，必吉，且始终如一，更吉。犹'臣之入朝侍奉天子'亦同——必当有序；如失序，则为欺陵主上，必生祸害。**\" **\"女归\"在此只取\"出嫁有六礼次第\"这一层结构义**（**古代婚礼是一步一步来的**），**正合\"有序\"**；**⚠ 本集不取任何对女性的角色预设**。** **而\"臣之入朝\"这一比更直接**：**\"如失序，则为欺陵主上\"**（**次序一乱，\"进\"就变成\"冒犯\"）。** **彖\"渐之进也，女归吉也。进得位，往有功也\"**：\"**渐乃论'进'之道：知进必有序，犹如女之归夫，必吉。进时能刚柔并济、适得其位，此进必'有功'也。**\" **彖续\"进以正，可以正邦也。其位，刚得中也。止而巽，动不穷也\"**，其解极精：\"**以正道而进，可以兴邦正德也——故凡'进'皆须秉持以正道则吉。'正得其位'之定义，必以'刚中'而得，方可谓得位。内止外顺，其人之进如此，方可得吉——如进之以欲，乃生燥，必失渐道，阻力乃生；故能做到'内无欲而外和顺'，此进方可无穷无尽矣。**\" **\"如进之以欲，乃生燥，必失渐道，阻力乃生\"这一句，是\"急\"的病因**：**\"急\"不是\"性急\"，是\"有欲\"**（**因为想快点拿到，才急；而\"急\"一生，\"阻力\"就来了。**）** **而\"内无欲而外和顺\"是它的解**：**里面没有欲（不急），外面和顺（不冲）**——**\"此进方可无穷无尽\"。** **须说明**：**这是《易经》原文加讲义之解**；**其可用的核极准**：**\"进\"的两个失败方式是\"以欲进\"（燥）与\"失序\"（欺陵）**；**而\"止而巽\"（内止外顺）是唯一的正途**。","o":"TJ-0553 · 天纪·人间道·渐卦（PDF 第113页）"},{"t":"一百九十五、渐卦六爻","h":"象：\"居贤德善俗\"与\"人之错习，遽改生反\"","c":"方法——渐卦\"象\"为\"**山上有木，渐；君子以居贤德善俗**\"，其解：\"**木在山上，其高有自——故君子观渐象，乃知'居贤能、正德、美化风俗'，其能成功，皆归之在'渐'。人之错习，遽改生反——教化之于人，势必以渐进方可入于人心，此渐之道也。**\" **\"人之错习，遽改生反\"六个字，是对\"改人\"最实在的判断**：**人的错误习惯，你\"遽改\"（突然改），会\"生反\"（产生反弹）**——**因为\"教化之于人，势必以渐进方可入于人心\"。** **而\"其高有自\"（它的高是有来处的）与卦序\"此木之高，乃因在山之上\"正好接上**：**\"高\"有来源，所以\"成功\"也有来源**（**而那个来源是\"渐\"——一步一步积累的**）。** **须说明**：**这是《易经》象传原文加讲义之解**；**\"善俗\"取\"改善风俗\"义**；**其可用的核极准**：**\"教化\"与\"施政\"不同**——**施政可以\"令行禁止\"（一次到位），教化只能\"渐进\"（因为要\"入于人心\"）**；**而\"遽改生反\"这一条，适用于\"改人\"的一切场合**（**包括改自己**）。","o":"TJ-0554 · 天纪·人间道·渐卦（PDF 第113页）"},{"t":"一百九十五、渐卦六爻","h":"初、二爻：\"鸿渐于干\"与\"饮食衎衎\"","c":"要点——**初爻\"鸿渐于干，小子厉，有言，无咎\"**：\"**鸿鸟之以时而迁动，又群聚而生且有序，此渐也。初阴居卑下，上又无援助——'君子知时'，故处之不疑；但'小人及无知之人只能见眼前之事、不知患于未来、洞察事理'，唯以刚而求进——失渐矣：进则生咎，不进无灾。**\"其\"象\"：\"**初始时，虽有小人之危惧不安之心，但因于义理仍合，故有无咎。**\" **\"君子知时，故处之不疑\"与\"小人只能见眼前之事，不知患于未来\"这一对照，是渐卦的分界线**：**同样处在\"卑下无援助\"的位置，君子\"不疑\"，小人\"求进\"**——**而结果是\"进则生咎，不进无灾\"。** **\"鸿\"（大雁）这个取象极准**：**鸿雁\"以时而迁动\"（按季节迁移）、\"群聚而生且有序\"（成群而有次序）**——**即：它的一切\"动\"都有\"时\"与\"序\"。** **第二爻\"鸿渐于磐，饮食衎衎，吉\"**：\"**柔居柔位，得中位得当——居渐之时，进必不速、稳若磐石状；其能安居如此，故可饮食和乐，其吉必然。**\"其\"象\"：\"**中正之人得正位、适居之状，能饮食安乐、心志愉快——不光是饱食而已。**\" **\"稳若磐石\"四个字，是\"渐\"的中间态**：**不急着进，也不退，就稳在那儿**（**而\"饮食衎衎\"（和乐地吃喝）是它的外显——\"不光是饱食而已\"，是\"心志愉快\"**）。** **须说明**：**这是《易经》原文（渐卦初、二爻）**；**\"干\"（gān）是\"水边\"，\"磐\"是\"大石\"，\"衎衎\"（kàn kàn）是\"和乐\"**；**其可用的核极准**：**\"不进无灾\"这一句，是\"渐\"的保守面**——**它承认\"有时候不动就是对的\"**。","o":"TJ-0555 · 天纪·人间道·渐卦·初、二爻（PDF 第113~114页）"},{"t":"一百九十五、渐卦六爻","h":"第三、四爻：\"夫征不复\"与\"或得其桷\"","c":"风险——**第三爻\"鸿渐于陆，夫征不复，妇孕不育，凶，利御寇\"**：\"**九三阳刚居下卦之上，即将进入上卦——意言：人之将上进之时，理应守正道以得时至，万不可以'欲'而进、以遂私志——此已失渐道，犹'为求进而不顾于道'之夫；妇人受孕不以正，亦不可育同义。此凶即致矣。惟可坚守正道、摒除邪念，可得吉。**\"其\"象\"：\"**夫但知征而不知复，乃因欲而失正道、叛离群类，可丑也；妇人之孕乃不正，故不可育也——皆因失其正道。唯利在坚守正道、弃绝邪恶，可因顺正道而保平安也。**\" **\"万不可以'欲'而进、以遂私志\"这一句，与彖的\"进之以欲乃生燥\"是同一判断的两面**：**前者说\"为什么不能\"，后者说\"会怎样\"。** **而\"夫但知征而不知复\"（只知道往前冲，不知道回来）是它的形态**：**\"叛离群类\"（脱离了队伍）——\"可丑也\"。** **第四爻\"鸿渐于木，或得其桷，无咎\"**：\"**此阴柔在高位，下有阳刚欲进之人，必不得安处——犹鸿鸟近于木、立木高处，必不安也；如能立在横枝上、自处安宁，则可无灾。**\"其\"象\"：\"**此意求平安自宁之道，惟有'顺于义、行乎正'——能如此者，何处会不安呢？**\" **\"立木高处，必不安\"这个取象极准**：**鸿雁的脚是蹼，抓不住高处的树枝**——**所以它\"立木高处\"就\"必不安\"，而\"得其桷\"（找到一根横枝）才站得稳。** **即：位置高不一定安稳，要看\"这根枝接不接得住你\"。** **须说明**：**这是《易经》原文（渐卦第三、四爻）**；**\"桷\"（jué）是\"方椽、横枝\"**；**其可用的核极准**：**\"顺于义、行乎正——能如此者，何处会不安呢？\"**——**这是象辞对\"不安\"的最终答案**（**不安的根子不在环境，在\"义\"与\"正\"是否顺）。**","o":"TJ-0556 · 天纪·人间道·渐卦·第三、四爻（PDF 第114页）"},{"t":"一百九十五、渐卦六爻","h":"第五、上爻：\"终莫之胜\"与\"其羽可用为仪\"","c":"方法——**第五爻\"鸿渐于陵，妇三岁不孕，终莫之胜，吉\"**：\"**鸿鸟所止于至高之地，象君之尊位——此渐之时至，乃知惟下二爻位可与同心同德；居中（第五与第二）之间被三、四位相隔——犹即令妇人三年不孕，亦无用于事；相隔正道之不正，其终必消；正道必合，惟时较久而已。终吉。**\"其\"象\"：\"**君臣以中正之道相交，其终必合，所愿必遂也。**\" **\"正道必合，惟时较久而已\"这一句，是\"渐\"的信心**：**该合的终会合，只是\"时间会久一点\"**（**而\"三岁不孕\"就是那个\"久\"——它不是\"失败\"，是\"还没到\"。**）** **上爻\"鸿渐于陆，其羽可用为仪，吉\"**：\"**鸿能飞于天上、毫无阻碍——人之贤能如此，进至终极，又不失渐之道，其贤能通达之能可以为表率，犹鸿之羽可以用礼仪一样，必吉。**\"其\"象\"：\"**君子之进，必有以渐、有序渐循之，乃可以为吉——此进因不失序，故吉；序乱招凶。故可以为礼法而遵循之。**\" **\"其羽可用为仪\"这个取象是渐卦的收尾**：**鸿雁的羽毛可以拿去做\"仪\"（礼仪上的饰物）**——**即：一个人\"进到终极\"之后，他不只是\"到了\"，他成了\"标准\"**（**别人可以照着做）。** **须说明**：**这是《易经》原文（渐卦第五、上爻）**；**其可用的核极准**：**\"序乱招凶\"是反向的判断**——**\"渐\"的价值不在\"慢\"，在\"有序\"**；**而\"可以为礼法而遵循之\"是它的最高评价**（**\"成了可以照着做的规矩\"**）。","o":"TJ-0557 · 天纪·人间道·渐卦·第五、上爻（PDF 第114页）  ---"},{"t":"一百九十六、归妹之义","h":"卦序：\"因悦而动，必有所不正\"","c":"定义——归妹卦（雷泽归妹）卦题为\"**浮云蔽日之课，阴阳不交之象**\"，其卦序：\"**渐乃进也，人进必有所归，所以归妹次渐也——少女，人所悦也；雷为动，今如人之动以悦，此'因悦而动'，必有所不正。此卦泽上有雷，雷震而泽动，相从之象；男动在外而女从之在内，有'女嫁归男'之象。'人之动须以明——明而后动，方不失正。'**\" **\"因悦而动，必有所不正\"这一句，是归妹卦的定性**：**\"悦\"（喜欢、高兴）本身不是错，但\"因悦而动\"（因为喜欢就动）就\"必有所不正\"**——**因为\"悦\"不是\"明\"。** **而\"人之动须以明，明而后动，方不失正\"是它的解**：**动之前要先\"明\"（看清楚），\"明\"了再动**（**而\"因悦而动\"是\"先动后想\"，所以\"不正\"）。** **卦图六物**：**①\"官人骑鹿指云：浮云蔽日，乘乱而欲进\"**；**②\"小鹿在后：生意人，随从状\"**；**③\"望竿上有文字：旦夕而亡，揭竿而起，正名也\"**；**④\"人落刺中：如鲠在喉，去之不得\"**；**⑤\"一人拔出：一人相救示宠状\"**；**⑥\"此卦问病凶，问财吉，问政凶\"**。** 其中\"**人落刺中：如鲠在喉，去之不得**\"一物极准**：**\"刺\"（扎进肉里的东西）——\"如鲠在喉\"，\"去之不得\"（拿不掉）**（**即：归妹卦说的是\"卡住\"的状态**）。** **占例\"舜娶尧二女，卜得之，乃知卑幼不宁也\"**——**\"卑幼不宁\"四字正是它的判断**。**须说明**：**这是讲义对归妹卦序与卦图的注解**；**\"归妹\"取\"少女出嫁\"义**；**\"问病凶、问财吉、问政凶\"是讲义给的占断口径**（**本集照录，不作引申**）。","o":"TJ-0558 · 天纪·人间道·归妹卦（PDF 第115页）"},{"t":"一百九十六、归妹之义","h":"卦辞与彖：\"征凶，无攸利\"与\"天地不交而万物不兴\"","c":"风险——归妹卦辞为\"**归妹，征凶，无攸利**\"，其解：\"**此动之以悦，必有不当——如动反招凶，所往必不利。**\" **彖有三层。第一层\"归妹，天地之大义也\"**：\"**此言阴阳之道、男女之配，乃天地间之常理也。有男居上女在下，阴从阳动。**\" **⚠ 须标**：**这是古代性别等级观念的直接表述**（**\"男居上女在下\"\"阴从阳动\"**），**本集只取\"阴阳相配是常理\"这一层，不取等级预设**。** **第二层\"天地不交而万物不兴，归妹，人之终始也\"**：\"**天地如不交则万物必不生——女之从男，为'生生之道'；人类从男女之交而生，其终必不穷。**\" **\"天地不交而万物不兴\"这八个字极精**：**\"不交\"就是\"不生\"**——**而这一条不只适用于\"男女\"，适用于一切\"该交而不交\"的场合。** **第三层\"说以动，所归妹也，征凶，位不当也。无攸利，柔乘刚也\"**：\"**此动之因'喜悦对方为少女'——人如只因悦而动，必失明之道，动必凶至。此不以正道、而以悦道，故'位不当'也。男女尊卑、夫唱妇随，人之常理——如不以常道，惟私欲作与、柔胜于刚，所以凶也，往必不利矣。**\" **\"只因悦而动，必失明之道\"与卦序\"因悦而动必有所不正\"是同一判断**；**而\"柔乘刚\"（柔骑在刚的头上）是它给出的结构**：**\"位不当\"不是\"位置排错了\"，是\"该刚的变柔、该柔的变刚\"。** **须说明**：**这是《易经》原文加讲义之解**；**其中\"男女尊卑、夫唱妇随\"属古代性别观念**，**本集只取\"关系要有常道、不能只凭私欲\"这一层**，**不取性别尊卑内容**。","o":"TJ-0559 · 天纪·人间道·归妹卦（PDF 第115页）"},{"t":"一百九十六、归妹之义","h":"象：\"永终知敝\"","c":"方法——归妹卦\"象\"为\"**泽上有雷，归妹；君子以永终知敝**\"，其解：\"**君子观雷震于泽上、泽随雷而动，犹男女相配、生生不息之象。其有'永终'之戒：因物久后必生敝坏——君子于始初乃知'戒敝坏'之理。故凡事之长久而吉，必于初始即生戒，故谓'永终之戒'。**\" **\"永终知敝\"四个字，是全书对\"长久\"最要紧的一句**：**要\"永终\"（长久），就得\"知敝\"（知道它会坏）。** **而\"物久后必生敝坏\"是它的前提**：**任何东西用久了都会坏**（**这不是\"可能性\"，是\"必然\"**）；**而\"君子于始初乃知'戒敝坏'之理\"是它的动作**：**在开始的时候，就知道它会坏。** **即：凡事之长久而吉，必于初始即生戒。** **须说明**：**这是《易经》象传原文加讲义之解**；**其可用的核极准**：**\"永终\"与\"知敝\"是一件事的两面**——**不知道会坏的人，保不住长久**；**而\"于初始即生戒\"是唯一能做的事**（**因为\"敝坏\"是必然的，\"防\"只能在\"还没坏\"的时候做**）。** **这一条与\"坤卦'履霜坚冰'（由辨之不早辨也）\"、\"萃卦'除戎器，戒不虞'\"、\"姤卦'系于金柅'\"是同一组的第四处**：**四处的落点都是\"在开始时\"。**","o":"TJ-0560 · 天纪·人间道·归妹卦（PDF 第115页）"},{"t":"一百九十七、归妹四爻：才与位","h":"初、二爻：\"归妹以娣\"与\"眇能视，利幽人之贞\"","c":"要点——**初爻\"归妹以娣，跛能履，征吉\"**：\"**娣，有'贤良正德'之义；女之嫁归能如此、又知处卑顺，然因其位卑，即令有贤才亦只能助夫而已，'独善其身'——犹跛之能行，必无法及远，但往乃得吉。**\"其\"象\"：\"**女嫁归男，能自处卑顺、且悦于内、持之以恒，即令跛者行路，亦可以有吉——其因乃其能相承相助也。**\" **\"犹跛之能行，必无法及远\"这个比喻极准**：**跛子能走，但走不远**——**而\"位卑\"的人有才也是这样：能\"助\"，不能\"及远\"。** **第二爻\"眇能视，利幽人之贞\"**：\"**九二乃阳刚之贤居正位——于归妹之时，乃意'女之贤能所配不良之人'，犹如目眇之人，其视必不能及远；此时惟'隐藏其贤'，且坚心以正礼，可利也。**\"其\"象\"：\"**守其隐于内之才，坚心不变，此不失夫妇常久之道也。**\" **\"眇能视\"（独眼也能看见）这个取象，比初爻的\"跛能履\"更进一层**：**\"跛\"是\"行不远\"，\"眇\"是\"看不远\"**——**而\"看不远\"的原因是\"所配不良\"（环境不行），不是\"能力不行\"。** **而\"惟隐藏其贤，且坚心以正礼\"是它的答案**：**\"隐藏其贤\"（不显摆自己的本事）＋\"坚心以正礼\"（守住规矩）**——**而这就是\"幽人之贞\"（隐者的坚守）。** **须说明**：**这是《易经》原文（归妹卦初、二爻）**；**\"娣\"（dì）是\"陪嫁的女子\"，\"眇\"（miǎo）是\"一眼失明\"，\"幽人\"是\"隐处之人\"**；**\"女嫁归男\"的框架属古代婚制**，**本集只取\"位卑者如何自处\"、\"才不为用如何自守\"两层结构义，不取性别与婚制内容**；**其可用的核极准**：**\"守其隐于内之才，坚心不变\"**——**这八个字是\"有才而不被用\"的第四种姿势**（**前三种见\"蛊卦'干父之蛊'（意承考也）'\"、\"井卦'井渫不食'（行恻也）'\"、\"鼎卦'鼎耳革'（内其德守正道）'\"——四处说的是同一件事**）。","o":"TJ-0561 · 天纪·人间道·归妹卦·初、二爻（PDF 第116页）"},{"t":"一百九十七、归妹四爻：才与位","h":"第三、四爻：\"归妹以须\"与\"归妹愆期，迟归有时\"","c":"要点——**第三爻\"归妹以须，反归以娣\"**：\"**六三乃相位居阴柔之人，于归妹时，以'悦'而求上应、不以正道——故必不得其归、无所适从。必当'反归求处卑下'，则可吉矣。**\"其\"象\"：\"**女归嫁男，如求己之须，无法求外应合，必不当也。**\" **\"以悦而求上应\"是这一爻的病**：**因为\"喜欢\"就去\"求上位者认可\"，而\"不以正道\"**——**结果是\"不得其归、无所适从\"**（**即：没求到，也回不去了）。** **而\"必当反归求处卑下\"是它的解**：**退回\"卑下\"的位置，先把位置放对。** **第四爻\"归妹愆期，迟归有时\"**，是全卦最从容的一条：\"**四柔阳刚居之——即意处柔乃妇人之常道，但内有刚明之贤：处归妹之时，因贤明又居高位，人所愿娶，但却有'迟嫁'之象——非不嫁也，乃'待时而动'，有佳配而后行也，此'迟归有时'。**\"其\"象\"：\"**此之延期所由皆己，不由他人——因己之有贤，故能如是。**\" **\"非不嫁也，乃待时而动，有佳配而后行\"这一句，把\"迟\"重新定义了一遍**：**\"迟\"不是\"嫁不出去\"，是\"在等那个对的\"**——**即：同样的\"没有动作\"，可以读成\"不行\"，也可以读成\"在等\"。** **而\"此之延期所由皆己，不由他人\"是极精的一句**：**\"迟\"的原因在\"自己\"（因为自己有贤、有标准），不在\"别人\"**（**而这一句与\"蹇卦'反身修德'\"、\"姤卦'姤其角'（远离乃肇因于己）\"是同一判断）。** **须说明**：**这是《易经》原文（归妹卦第三、四爻）**；**\"愆期\"（qiān qī）是\"误期、过期\"**；**\"婚嫁\"是原文的框架**，**本集只取\"求上位不得则退处卑下\"、\"迟而不失其时\"两层结构义**；**其可用的核极准**：**\"待时而动，有佳配而后行\"**——**这是\"高标准\"与\"拖延\"的分界线**（**\"拖延\"是没有标准，\"待时\"是有标准而时机未到**）。","o":"TJ-0562 · 天纪·人间道·归妹卦·第三、四爻（PDF 第116页）"},{"t":"一百九十七、归妹四爻：才与位","h":"第五爻：\"帝乙归妹\"与\"谦降为美德\"","c":"方法——归妹卦第五爻\"**帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉**\"。讲义原文在此页未完（起于\"六五居尊位之人，柔性象女、示女之高贵者——今居归妹之期，虽为帝女，于归时，乃得'屈而谦降'。故女之归以'能谦降'为美德，但求于……\"），下一段续解。**而从已读到的部分可提炼它的核心**：**\"虽为帝女，于归时，乃得'屈而谦降'\"**——**\"帝女\"（最高身份的人），出嫁时\"屈而谦降\"（把自己放低）。** **而\"其君之袂，不如其娣之袂良\"这一句的取象极准**：**\"袂\"（mèi）是\"衣袖\"（在这里指\"嫁衣的装饰\"）**——**\"君\"（帝女本人）的衣袖，不如\"娣\"（陪嫁女子）的衣袖华美**（**即：身份最高的那个人，穿得反而最朴素）。** **而讲义给它的定性是\"女之归以'能谦降'为美德\"**——**这\"谦降\"二字，与\"谦卦'山居地下'（有本事而甘居其下）\"是同一个动作**（**只是谦卦讲\"有德而不显\"，归妹讲\"有位而降\"。**）** **须说明**：**这是《易经》原文（归妹卦第五爻）**；**\"月几望\"（月将圆）取\"将满未满\"义**；**其可用的核极准**：**\"月几望\"（快要圆满）是最好的状态**——**因为\"满\"之后就是\"亏\"**（**这与\"大有'满而不溢'\"、\"谦卦'天道亏盈而益谦'\"是同一条**）。","o":"TJ-0563 · 天纪·人间道·归妹卦·第五爻（PDF 第116页）  ---"},{"t":"一百九十八、归妹卦后二爻","h":"第五爻续解：\"尚礼而不尚外饰\"","c":"要点——归妹卦第五爻\"**帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉**\"的续解：\"**故犹月阴之盛，而不至于盈满，此乃能为吉。女子尊贵之道即此。**\"其\"象\"：\"**此'尚礼而不尚外饰'，为帝乙归妹之道——五为柔而居尊位，乃有尊贵而又知能'行中道'之人也。**\" **\"尚礼而不尚外饰\"七个字，是这一爻的定性**：**\"礼\"（对关系的尊重）是\"内\"的，\"外饰\"（衣饰的华美）是\"外\"的**——**而\"帝女\"反而\"袂不如娣之袂良\"，正是\"内重于外\"的实证。** **而\"犹月阴之盛，而不至于盈满\"是\"月几望\"的解法**：**\"盛\"但\"不盈满\"——这就是\"吉\"的位置**（**因为\"满\"之后就\"亏\"，而\"几望\"（将圆未圆）还在上升）。** **⚠ 须标**：**\"女子尊贵之道即此\"是古代性别语境下的表述**，**本集只取\"有位而降、重内不重外\"这一层结构义**，**不取对女性的角色规定**；**其可用的核极准**：**\"尚礼而不尚外饰\"这一条，与\"贲卦'今人但求外饰不求内实'\"是同一组**（**两处都在说\"饰不能代替实\"**）。","o":"TJ-0564 · 天纪·人间道·归妹卦·第五爻（PDF 第116页）"},{"t":"一百九十八、归妹卦后二爻","h":"上爻：\"女承筐无实，士刲羊无血\"","c":"风险——归妹卦上爻\"**女承筐无实，士刲羊无血，无攸利**\"。其解：\"**女归之终至极时，乃承继祖先祭祀之职——但至极则'无实可祭'，犹士人之割取羊血以祭礼：如割羊无血、无以祭，必不利继往也。**\"其\"象\"：\"**女归嫁之极处，以柔居之，犹空筐之无实，必不可以承祭祀——女终不可承继也，必主人人离绝也。**\" **\"女承筐无实，士刲羊无血\"这个取象极冷，也极准**：**筐还在，但是空的；羊还在，但是割不出血**——**即：形式还在，内容没了。** **而\"必不可以承祭祀\"是它的后果**：**\"祭祀\"要的是\"实\"（真的祭品），\"空筐\"承不了**——**即：一个只剩形式的体系，接不住\"传承\"这件事。** **而\"必主人人离绝也\"是最重的一句**：**\"空筐\"的尽头不是\"衰败\"，是\"人人离绝\"（人都走光）。** **须说明**：**这是《易经》原文（归妹卦上爻）加讲义之解**；**\"刲\"（kuī）是\"割\"，\"筐\"是\"盛祭品的竹器\"**；**\"女\"\"士\"属古代祭祀职分的表述**，**本集只取\"形式与内容的关系\"这一层**；**其可用的核极准**：**\"无实\"是最难察觉的一种\"坏\"**——**因为\"筐还在\"（形式都在），而\"血没有了\"（内容没了）**（**这与\"鼎卦'鼎有实'（犹人之有才）\"正好成对：一个说有实才叫有才，一个说无实则承不了事**）。","o":"TJ-0565 · 天纪·人间道·归妹卦·上爻（PDF 第116页）"},{"t":"一百九十九、丰卦：日丽中天与戒盛","h":"卦序：\"内明外动\"","c":"定义——丰卦（雷火丰）卦题为\"**日丽中天之课，藏暗向明之象**\"，其卦序：\"**万物与人能适得所归，必能成大——故归妹之后，受之以丰。丰有盛大之义。此卦上震下离，有'内明外动'之象——'能以明而动、动而能明'，此为致丰之道；是故'明而能照、动而能亨'，可以致丰大也。**\" **这段话把\"丰\"的机制说清了：\"内明外动\"**——**里面是\"明\"（离为火、为明），外面是\"动\"（震为雷、为动）**；**而顺序极重要：是\"以明而动\"（先明后动），不是\"动而明\"（先动后明）。** **而\"明而能照、动而能亨\"是它的两层作用**：**\"明\"要能\"照\"（照到别人），\"动\"要能\"亨\"（通得过去）**——**两个都做到，才\"可以致丰大\"。** **卦图九物**：**①\"竹简灰起：竹有顺象、坚节不变之象；灰起，中空之象\"**；**②\"龙蛇交错：辰巳之年，正邪相争，蛇虺乃毒谋暗算也\"**；**③\"官人著衣裳立：藏于内也\"**；**④\"一合子：先成后破\"**；**⑤\"人吹笙竿：闲情逸志，主喜事临门\"**；**⑥\"脚踏虎：临危不乱也，险在下也\"**；**⑦\"旱沼之旁：心力交瘁也\"**；**⑧\"池中无水：旱象，破财也\"**；**⑨\"珠落盘中：先聚后散也\"**。** 九物中\"**一合子：先成后破**\"与\"**珠落盘中：先聚后散也**\"两物同指一件**：**\"丰\"本身带着\"散\"**（**这与彖的\"日中则昃\"是同一判断）。** **占例\"庄周说剑，临行卜得之，果得剑也\"**。**须说明**：**这是讲义对丰卦序与卦图的注解**；**丰卦图九物是全书最多的一卦**（**因\"丰\"本身含\"多\"义**）。","o":"TJ-0566 · 天纪·人间道·丰卦（PDF 第117页）"},{"t":"一百九十九、丰卦：日丽中天与戒盛","h":"卦辞与彖：\"宜日中\"与\"日中则昃\"","c":"要点——丰卦辞为\"**丰：亨，王假之，勿忧，宜日中**\"，其解：\"**丰之道，在能致亨通——能令天下百姓致丰，唯王者能。丰之道在令人民繁盛、事物丰发，有如日中之明、无所不照，则可以无忧。**\" **\"宜日中\"三个字，是丰卦的核心意象**：**像正午的太阳——\"无所不照\"**（**而\"无忧\"是这个状态的结果）。** **彖\"丰，大也，明以动，故丰。王假之，尚大也\"**：\"**丰之道，在论如何盛大——能明而动，必能成丰盛且大也。王者所追求之，为能及天下之大、致人民以丰，必可永保其治世之道。**\" **彖续\"勿忧宜日中，宜照天下也\"**：\"**致丰之道，能如日中之盛明、普照天下、无所不及，如此则可无忧，而能保其丰大及永久也。**\" **而彖的最后一段，是全卦最要紧的**：\"**日中则昃，月盈则食，天地盈虚，与时消息，而况于人乎？况于鬼神乎？**\"其解：\"**日正当中，也有暗时；月满之后，亦有缺亏——天地之盈虚，靠'时'为消息，更何况乎人？更何况乎鬼神？此'君子戒之在盛'——知盛时须戒，方可长久。**\" **\"日中则昃\"（太阳到了正中，就要偏西）这一句，把\"宜日中\"翻了过来**：**卦辞要\"宜日中\"（像正午那样照），彖却提醒\"日中则昃\"（正午之后就是斜阳）**——**即：丰卦要的是\"正午的光\"，同时要记住\"正午只有一瞬\"。** **而\"君子戒之在盛，知盛时须戒，方可长久\"是它的结论**。**须说明**：**这是《易经》原文加讲义之解**；**\"昃\"（zè）是\"日西斜\"，\"食\"是\"日食月食\"（此指\"亏\"）**；**其可用的核极准**：**\"天地盈虚，与时消息\"——\"盈\"与\"虚\"都由\"时\"决定**（**而人能做的只有一件事：在\"盛\"的时候\"戒\"**）。","o":"TJ-0567 · 天纪·人间道·丰卦（PDF 第117~118页）"},{"t":"一百九十九、丰卦：日丽中天与戒盛","h":"象：\"折狱致刑\"与\"明威并行\"","c":"方法——丰卦\"象\"为\"**雷电皆至，丰；君子以折狱致刑**\"，其解：\"**电雷并行，乃'明动相济'，成丰之象——君子观明动之象，知用刑制法，在求'明与威并行'：君子能明则'无折狱'（没有冤案）、慎于用刑；能立威则民服无怨。**\" **\"明与威并行\"五个字，是本集认为治事最关键的一条**：**只有\"威\"没有\"明\"，是压制；只有\"明\"没有\"威\"，是放纵。** **而\"能明则无折狱，慎于用刑\"与\"能立威则民服无怨\"是它的两个结果**：**\"明\"换来的是\"没有冤案\"（对内），\"威\"换来的是\"民服无怨\"（对外）**——**即：两个都不是为了\"让人怕\"，是为了\"让人服\"。** **须说明**：**这是《易经》象传原文加讲义之解**；**其可用的核极准**：**这一条与\"噬嗑卦'明罚敕法'\"是同一条的另一面**（**噬嗑讲\"法要明\"，丰卦讲\"明要配威\"**）；**⚠ 须补一句**：**\"折狱致刑\"是古代治狱语境**，**其可用的核只在\"明与威要并行\"这一层**，**不涉及任何具体司法主张**。","o":"TJ-0568 · 天纪·人间道·丰卦（PDF 第118页）"},{"t":"一百九十九、丰卦：日丽中天与戒盛","h":"初爻：\"遇其配主\"与\"降己以相求\"","c":"方法——丰卦初爻\"**遇其配主，虽旬无咎，往有尚**\"：\"**初进之阳刚，居丰之时，知往有丰——虽非有君之对应，但有其左右高位之人能与同志，此往可吉也，所谓'同舟能共济也'。此于丰之时，可得无咎也。**\"其\"象\"：\"**圣人知时之所至、顺时而为，能知'降己以相求'——若怀己之私意，必招患至。**\" **\"同舟能共济\"五个字，是\"丰\"的人际条件**：**\"虽非有君之对应\"（没有最高层的支持），但\"有其左右高位之人能与同志\"（身边有人愿意一起干）**——**而这就够了。** **而\"降己以相求\"是它的方法**：**放下自己的身段去求人**（**而\"若怀己之私意，必招患至\"是它的警戒**）。** **须说明**：**这是《易经》原文（丰卦初爻）加讲义之解**；**\"旬\"在此取\"十日、一周\"义（一说\"均\"）**；**其可用的核极准**：**\"降己以相求\"与\"谦卦'鸣谦'\"、\"归妹'屈而谦降'\"是同一动作**（**而\"若怀己之私意\"这个限定很重要**：**\"降己\"是为了\"相求\"（求共同做成事），不是为了\"讨好\"**）。","o":"TJ-0569 · 天纪·人间道·丰卦·初爻（PDF 第118页）  ---"},{"t":"二百、丰卦六爻","h":"第二、三爻：\"有孚发若\"与\"折其右肱\"","c":"要点——**第二爻\"丰其蔀，日中见斗，往得疑疾，有孚发若，吉\"**：\"**六二乃柔将其位，又居明卦之中，为'至明之才'，但因'所遇之君不明'，而无法下求于己——若居丰时，意往而求其君能明己才，必招致猜妒疑惑。惟有'尽己之至诚'，以求其感而能发，则君之昏蒙可开，如此则吉矣。**\"其\"象\"：\"**用己之至诚孚实，以求发上之知信，如可成，则吉必至矣。**\" **\"往得疑疾\"（去求反而招来猜疑）这一句极准**：**\"意往而求其君能明己才\"——主动去让上位者承认你的才能，结果\"必招致猜妒疑惑\"**（**因为你越证明自己，他越疑你）。** **而\"有孚发若\"是它的解**：**不\"求\"，而\"尽己之至诚\"——让\"诚\"自己去\"发\"（感通）**（**而结果是\"君之昏蒙可开\"（那个不明白的人自己开了）。** **即：想让人承认你，不能去\"要\"，只能去\"做\"。** **第三爻\"丰其沛，日中见沫，折其右肱，无咎\"**：\"**九三乃居相位有贤才之人，于丰时，却不见明主之相应——其日之晦更甚于六二将位，故有如人之折肱无法于行。贤能之人有才，但无法发挥，乃因君之不明，故无可归咎也。**\"其\"象\"：\"**丰之时，不见上用，无法成大事——犹人折其肱，终无法受重用。**\" **\"折其右肱\"（右臂断了）这个取象极准**：**右臂是\"做事的那只手\"**——**断了就等于\"什么也做不成\"**（**而\"无咎\"的意思是\"这不算你的错\"）。** **须说明**：**这是《易经》原文（丰卦第二、三爻）**；**\"蔀\"（bù）是\"遮蔽\"，\"斗\"是\"北斗\"，\"沫\"是\"微暗\"**；**其可用的核极准**：**\"君之不明，故无可归咎\"**——**这是对\"有才而不得用\"最克制的定性**（**不怨人，也不怨己**）。","o":"TJ-0570 · 天纪·人间道·丰卦·第二、三爻（PDF 第118页）"},{"t":"二百、丰卦六爻","h":"第四、五爻：\"遇其夷主\"与\"来章\"","c":"要点——**第四爻\"丰其蔀，日中见斗，遇其夷主，吉\"**：\"**九四为阳刚之人居君侧大臣之位，遇君不明，其贤能阳刚受围，如日中有缺晦，不得其用，亦无用也——'故君子之才须得遇明主'，方可有用、能成济世之功。**\"其\"象\"：\"**有才能却受围困、无法致丰，乃位不适当也。丰之时，又有幽暗之处，必因'君不明'、臣位又'不适当'而造成。惟求遇明主，吉乃可行。**\" **\"君子之才须得遇明主，方可有用\"这一句，是丰卦的实情**：**才本身不等于\"有用\"**——**\"有用\"还得\"遇\"**（**而\"遇\"不是自己能决定的）。** **第五爻\"来章，有庆誉，吉\"**，是全卦最通达的一条：\"**阴柔居君之尊位，己之才不足，但知'用下位章美之才'，必有福庆、且有美誉，故吉。**\"其\"象\"：\"**君位能吉，于丰之时，必可有吉庆及于天下——此因君能用才也。**\" **\"己之才不足，但知用下位章美之才，必有福庆\"这一句，是\"上位者\"的正解**：**不必自己有才，只要\"知道用下面那些有才的人\"**——**而\"有庆誉\"（有福庆、有美誉）是它的回报。** **须说明**：**这是《易经》原文（丰卦第四、五爻）**；**\"夷主\"取\"等类之主（同德之人）\"义**；**其可用的核极准**：**这一条与\"临卦'知临'（如自认为皆知者正明示其不知）、'得天下之善用天下之智者则无所不周'\"是同一条**（**两处都说：上位者的\"能\"，是\"用人\"的能力，不是\"自己会\"的能力**）。","o":"TJ-0571 · 天纪·人间道·丰卦·第四、五爻（PDF 第118页）"},{"t":"二百、丰卦六爻","h":"上爻：\"窥其户，阒其无人\"","c":"风险——丰卦上爻\"**丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶**\"，是全卦最重的一条。其解：\"**上六居丰极之时，因处动之终，必燥动——'人于丰盛之时，必假谦虚方吉'。如不知戒盛：外丰其居、内不明、暗藏其家，又目中无人，三年又不知变、一意孤行，终自招凶。**\"其\"象\"：\"**人处丰之极，不知谦卑、目中无人，犹鸟之翔于天际、不知己才之不足，居高自傲，必招人弃绝——其致如此，乃'不知自藏'也。**\" **\"窥其户，阒其无人\"（从门缝看进去，里面空无一人）这个取象极冷**：**房子\"丰其屋\"（造得极大），家里\"蔀其家\"（遮得极严），而从门缝看进去——\"阒其无人\"（空无一人）。** **即：房子越大、遮得越严，里面越空。** **而\"三岁不觌\"（三年不见人影）是它的时间刻度**：**不是\"没人来\"，是\"三年都没人来\"**（**而\"三年又不知变、一意孤行\"说明：问题不是\"别人不来\"，是\"自己不放\"。** **而\"不知自藏\"四个字，是象辞给它的定性**：**不是\"不会藏\"，是\"不知道要藏\"**（**而\"必招人弃绝\"是它的结果）。** **须说明**：**这是《易经》原文（丰卦上爻）**；**\"阒\"（qù）是\"寂静无人\"，\"觌\"（dí）是\"见\"**；**其可用的核极准**：**\"人于丰盛之时，必假谦虚方吉\"**——**\"假\"在此是\"借\"义（借谦虚来保盛）**；**而\"不知自藏\"与\"明夷卦'用晦而明'\"正相反**（**明夷是\"藏明\"，丰上是\"藏空\"**——**一个里面是明的，一个里面本来就空**）。","o":"TJ-0572 · 天纪·人间道·丰卦·上爻（PDF 第118页）"},{"t":"二百零一、旅卦：欢极哀生","h":"卦序：\"不知戒盛，乃失其居\"","c":"定义——旅卦（火山旅）卦题为\"**始鸟焚巢之课，欢极哀生之象**\"，其卦序：\"**丰至极时，不知戒盛，乃失其居——故序卦为旅。此卦离上艮下，乃'外明内止'之象：山为'止而不动'，火为'行而不居'，有'不与同流'之意，故为旅象；又人之旅必外丽，亦旅象。**\" **\"丰至极时，不知戒盛，乃失其居\"这一句，把\"丰→旅\"的因果说清了**：**不是\"想旅行\"，是\"失其居\"（没了住处）**——**而\"失其居\"的原因是\"不知戒盛\"。** **而\"火行而不居，有不与同流之意\"是旅卦的取象**：**火\"行而不居\"（烧过去就走，不留下）**——**而\"不与同流\"（不同流合污）是它的品格**。** **卦图五物**：**①\"三星者：三台贵人，相位之人\"**；**②\"贵人台上垂钓：君主相求、老板相求人才\"**；**③\"牵水畔人：贤能之人，离野入朝封侯；或慕权势而变志\"**；**④\"一猴一羊：肖猴、肖羊，候、杨姓人，未申年应之\"**；**⑤\"大溪：脱险也，港口也，水侧也\"**。** 其中\"**牵水畔人：贤能之人，离野入朝封侯；或慕权势而变志**\"一物，讲义给了\"两种读法\"**：**同一个\"入朝\"，可以是\"贤能出山\"，也可以是\"慕权势而变志\"**（**而这两义的分别，正是旅卦要人辨的**）。**须说明**：**这是讲义对旅卦序与卦图的注解**；**\"鸟焚巢\"取\"巢被烧了，只能飞走\"义**。","o":"TJ-0573 · 天纪·人间道·旅卦（PDF 第119页）"},{"t":"二百零一、旅卦：欢极哀生","h":"卦辞与彖：\"小亨\"与\"当旅不旅，乃自求咎\"","c":"要点——旅卦辞为\"**旅：小亨、旅贞吉**\"，其解：\"**旅之时，此因'不同流而旅'，故有'小亨'——且得之坚心，必吉。切不可假旅之道而有私欲其中。**\" **\"因不同流而旅，故有小亨\"这一句极准**：**\"旅\"的\"亨\"是\"小亨\"（小小的通），**因为\"旅\"本身不是\"大事\"**；**而\"不同流\"才是它的价值**（**即：宁可\"小亨\"，也不\"同流\"。**）** **而\"切不可假旅之道而有私欲其中\"是它的警戒**：**\"假\"（借）\"旅\"这个名义去谋私**（**而这一条正好解释了卦图\"或慕权势而变志\"那一读法**）。** **彖\"旅，小亨，柔得中乎外而顺乎刚，止而丽乎明，是以小亨，旅贞吉也。旅之时义大矣哉\"**：\"**旅之时至而旅，乃有亨——人能知所进退，内有中道、外又知顺于刚，止之在能'外丽而内明'，是故有'小亨'；旅而坚贞其志，是故吉也。'当旅不旅，乃自求咎'。故天下之事，当有时宜，因时而动，其义大也。**\" **\"当旅不旅，乃自求咎\"七个字，是旅卦最重的一句**：**该走的时候不走，不是\"稳\"，是\"自己给自己找咎\"**——**而\"因时而动，其义大也\"是它的正面。** **须说明**：**这是《易经》原文加讲义之解**；**其可用的核极准**：**\"外丽而内明\"是\"旅\"的姿态**（**外面随和、随俗，里面明白、不失**）——**这与\"明夷卦'内文明而外柔顺'\"是同一个结构**（**而旅卦多了一层\"动\"：它一直在走**）。","o":"TJ-0574 · 天纪·人间道·旅卦（PDF 第119页）"},{"t":"二百零一、旅卦：欢极哀生","h":"象与初爻：\"明慎用刑，而不留狱\"","c":"方法——旅卦\"象\"为\"**山上有火，旅；君子以明慎用刑，而不留狱**\"，其解：\"**火在山高处，其明及远，旅之道也——君子观此明照之象，知'明慎以用刑'：绝不依持己之明，必有戒慎恐惧之心而施于用刑。因'火行不留'，故有'不留狱'之志——狱乃不得已而设，故不求留狱，此观火之行而体悟之。**\" **\"明慎用刑，而不留狱\"这一句，是旅卦给\"执法者\"的一条**：**\"明\"是\"看得清\"，\"慎\"是\"不敢轻\"，\"不留狱\"是\"不积压、不拖着\"**——**三者是从\"火\"的两面来的：火\"明及远\"（所以\"明\"）、火\"行不留\"（所以\"不留狱\"）。** **而\"绝不依持己之明\"这一句最要紧**：**越是\"明\"的人，越容易\"依持己之明\"（凭自己的判断硬办）**——**而讲义说\"必有戒慎恐惧之心\"。** **须说明**：**这是《易经》象传原文加讲义之解**；**其可用的核极准**：**\"狱乃不得已而设\"**——**\"狱\"（司法）本身是\"不得已\"，不是\"首选\"**；**⚠ 须标**：**这是古代治狱语境**，**其可用的核在\"明、慎、不积压\"这三层**，**不涉及任何具体司法主张**。** **初爻\"旅琐琐，斯其所取灾\"**：\"**阴柔无才之人，居卑下；居旅之时，因才质如此，故必畏畏琐琐，其必终自取其辱。**\"其\"象\"：\"**意志因困穷时而生变，乃自取其灾也。**\" **\"旅琐琐\"（在旅途中畏畏琐琐、斤斤计较）是\"旅\"的最低形态**：**\"意志因困穷时而变\"→\"自取其灾\"**（**即：困的时候人容易变，而一变就自己招灾）。** **须说明**：**这是《易经》原文（旅卦初爻）**；**\"琐琐\"是\"细碎、猥琐\"**；**其可用的核**：**\"旅\"的第一关是\"困穷时不改志\"**（**而这一条与\"困卦'君子以危重遂志'\"是同一判断**）。","o":"TJ-0575 · 天纪·人间道·旅卦（PDF 第119页）  ---"},{"t":"二百零二、旅卦后五爻","h":"第二、三爻：\"得童仆贞\"与\"旅焚其次\"","c":"要点——**第二爻\"旅即次，怀其资，得童仆贞\"**：\"**六二乃得适位之将才居旅时，因知中正处不失当，必能怀蓄财资，又能得仆人之忠心，故吉。**\"其\"象\"：\"**旅行之人，所赖者为童仆——能得其忠心，必可无灾。**\" **\"旅行之人，所赖者为童仆\"这一句，是\"旅\"最实在的一面**：**在外面走的人，身边能靠的只有\"跟着你的人\"**——**而\"得其忠心\"是\"无灾\"的前提。** **第三爻\"旅焚其次，丧其童仆，贞厉\"**：\"**旅之时，必以'柔顺谦下'为吉——如今自处过刚、又居高，乃招致灾困，必失仆人之忠，终有危厉来临。**\"其\"象\"：\"**居旅时以过刚自高，手下必丧失忠心，危之至矣。**\" **\"旅之时，必以柔顺谦下为吉\"这一句，是旅卦的总纲**：**在\"旅\"（无依托）的状态里，\"柔顺谦下\"不是\"姿态\"，是\"生存条件\"。** **而\"自处过刚、又居高\"是它的反面**——**\"必失仆人之忠\"（手下先走）→\"终有危厉来临\"**。** **须说明**：**这是《易经》原文（旅卦第二、三爻）**；**\"次\"是\"旅舍\"，\"童仆\"是\"僮仆\"**；**其可用的核极准**：**\"焚其次\"（自己的住处烧了）与\"丧其童仆\"（人走了）是同一件事的两面**（**即：一个在外的人，\"过刚自高\"的代价是\"同时失去住处和人心\"**）。","o":"TJ-0576 · 天纪·人间道·旅卦·第二、三爻（PDF 第120页）"},{"t":"二百零二、旅卦后五爻","h":"第四、五爻：\"得其资斧，我心不快\"与\"射雉一矢亡\"","c":"要点——**第四爻\"旅于处，得其资斧，我心不快\"**：\"**阳刚又居柔位，有用柔之象——人居旅时，能柔、得旅之道，必吉。此法居旅时可得财货之资助，但不能伸其大志，其心必不快。**\"其\"象\"：\"**以刚居柔，合于旅之道，故旅时为善；但欲得行其志，却不能也，心必不快。**\" **\"得其资斧，我心不快\"这一条极准**：**\"资斧\"（钱财与工具）拿到了，\"旅之道\"也对（以刚居柔、柔顺应世）**——**但\"不能伸其大志\"，所以\"心不快\"。** **即：这条路能活，但不能伸展**（**而\"心不快\"三个字，与\"艮卦'艮其腓，其心不快'\"是同一个词、同一种处境**：**都对，但都不舒展。**）** **第五爻\"射雉，一矢亡，终以誉命\"**：\"**人于旅时，不可有错——一旦犯之，灾祸立至。就如射雉：能一箭而中、不虚发，即无过失；能如此，则于旅时必可立名扬誉。**\"其\"象\"：\"**旅之时，能令上下皆应，则可吉——其因'旅之时乃困而未得其安之时'为旅。**\" **\"一箭而中，不虚发即无过失\"这一句，是\"旅\"的容错率**：**在\"旅\"的状态里没有第二次机会**（**因为\"困而未得其安\"——没有资源、没有依托**）。** **须说明**：**这是《易经》原文（旅卦第四、五爻）**；**\"雉\"是野鸡，\"一矢亡\"取\"一箭即中、箭不再用\"义**；**其可用的核极准**：**\"旅之时乃困而未得其安之时\"是讲义对\"旅\"的定义**（**不是\"出门在外\"，是\"困而未安\"**）——**而在这状态下，\"没有过失\"本身就是最大的能力**。","o":"TJ-0577 · 天纪·人间道·旅卦·第四、五爻（PDF 第120页）"},{"t":"二百零二、旅卦后五爻","h":"上爻：\"鸟焚其巢，先笑后号咷\"","c":"风险——旅卦上爻\"**鸟焚其巢，旅人先笑后号咷，丧牛于易，凶**\"。其解：\"**旅时以过阳刚自处、以高，不知谦卑——就如鸟高飞而自焚其巢，故终居无所安处。自负过刚，居旅时：始则可快意尽情，故生'笑'；继而失安、无居所，故后'号咷'。牛为顺性之物，但也易于丧失，只一疏忽而已，故凶。**\"其\"象\"：\"**旅时以居高自处，必不能保安——犹鸟之焚巢；丧失顺德极易，待凶至，乃不知自闻知也。**\" **\"鸟高飞而自焚其巢\"这个取象，是旅卦的收尾**：**鸟飞得越高，越把自己的巢烧了**——**而\"高\"与\"巢\"是对立的：飞得越高，离\"能住的地方\"越远。** **而\"先笑后号咷\"（先笑后哭）是它的时间线**：**\"始则可快意尽情\"（笑）→\"继而失安、无居所\"（号咷）**。** **而\"丧牛于易\"的解法极准**：**\"牛为顺性之物，但也易于丧失，只一疏忽而已\"**——**即：\"顺\"这种德性最容易丢，而且只丢在\"一疏忽\"上**（**不是\"大错\"，是\"没在意\"）。** **须说明**：**这是《易经》原文（旅卦上爻）**；**\"号咷\"（háo táo）是\"放声大哭\"，\"易\"（yì）是\"平易、忽慢\"**；**其可用的核极准**：**\"终莫之闻也\"（到最后他自己都不知道）**——**这一句比\"凶\"更重**（**因为\"凶\"是结果，\"不知\"是心理上的盲**）。","o":"TJ-0578 · 天纪·人间道·旅卦·上爻（PDF 第120页）"},{"t":"二百零三、巽卦：风行草偃","h":"卦序：\"惟能巽顺，方可平安\"","c":"定义——巽卦（巽为风）卦题为\"**风行草偃之课，上行下放之象**\"，其卦序：\"**巽者，入也。处旅时，亲人不在，惟能巽顺，方可平安，无所不入——故巽次旅也。此卦一阴居二阳之下，乃有'阴顺于阳'象。**\" **\"处旅时，亲人不在，惟能巽顺，方可平安\"这一句，是\"旅→巽\"的枢纽**：**在外面没有亲人，唯一能靠的是\"顺\"**——**而\"顺\"能\"无所不入\"（到哪里都进得去）。** **\"风行草偃\"（风吹过，草就伏下去）这个卦题极准**：**风没有形状，但它经过的地方都\"偃\"（伏倒）**——**即：真正的\"入\"不是\"挤进去\"，是\"让那里自己响应\"。** **卦图六物**：**①\"贵人赐衣：先破后成象\"**；**②\"一人跪受：贵绶也；如占疾病，则主寿衣，凶象\"**；**③\"云中雁传书：意外喜讯\"**；**④\"人在虎下坐：身处险而不知\"**；**⑤\"一人射虎中箭：贵人相救\"**；**⑥\"虎走：脱险，寅年也\"**。** **而讲义对\"虎\"给了一段极重要的引申**：\"**虎乃有威望之人，利武官，主人在'虎边进退不得'之时；亦言'虎将须知功成身退'，否则暗箭难防，以明哲保身为吉。**\" **\"虎将须知功成身退\"这一句，与旅卦上爻\"鸟焚其巢\"是同一判断的两面**：**\"虎\"（有威望、有力量）在\"进退不得\"的位置上，唯一的解是\"退\"**（**而\"否则暗箭难防\"是它的代价）。** **须说明**：**这是讲义对巽卦序与卦图的注解**；**\"偃\"（yǎn）是\"倒伏\"**；**其可用的核极准**：**\"上行下放\"（上面动，下面就跟着动）是对\"风行草偃\"的解释**（**而\"放\"在此取\"仿效、效法\"义**）。","o":"TJ-0579 · 天纪·人间道·巽卦（PDF 第121页）"},{"t":"二百零三、巽卦：风行草偃","h":"卦辞与彖：\"重巽以申命\"","c":"方法——巽卦辞为\"**巽：小亨。利有攸往，利见大人**\"，其解：\"**巽顺之道，得之可以'小亨'——故论'柔之顺性'：能如此，利往进，可见贵人，必助。**\" **彖\"重巽以申命。刚巽乎中正而志行，柔皆顺乎刚，是以小亨。利有攸往，利见大人\"**，其解是全卦最要紧的一段：\"**巽之重卦，有'上顺下亦顺'象——苟能'上顺中道以出命，下顺命而服从'，则必吉。故君子申复命令，乃知巽也。能知顺乎刚且中正，即令才不足亦可以小亨。能得巽顺之道，必无往不入，可出世见大人也。**\" **\"上顺中道以出命，下顺命而服从\"这一句，把\"巽\"分成了两层**：**上位者\"顺中道\"（按中道发布命令），下位者\"顺命\"（服从）**——**而两层都做到，才\"必吉\"。** **而\"申复命令\"（反复申明命令）是\"重巽\"的用法**：**不是\"说一次就够\"，是\"一遍一遍地说\"**（**因为\"风\"要吹过很多次，草才会全伏下去）。** **而\"即令才不足亦可以小亨\"这一句很宽**：**才能不够，但\"顺\"对了，也能\"小亨\"**（**这与\"艮卦'即令无足之才能，亦可免祸'\"是同一判断）。** **须说明**：**这是《易经》原文加讲义之解**；**其可用的核极准**：**\"巽\"的\"小亨\"是\"靠顺得来的通\"，不是\"靠力量得来的通\"**（**而\"利见大人\"说明：这条路要\"有人带\"**）。","o":"TJ-0580 · 天纪·人间道·巽卦（PDF 第121页）"},{"t":"二百零三、巽卦：风行草偃","h":"象：\"申命行事\"","c":"方法——巽卦\"象\"为\"**随风，巽；君子以申命行事**\"。**其可用的核**：**\"申命\"（反复申明命令）＋\"行事\"（落到具体的事上）**——**即：光\"说\"不够，\"说\"要\"落到事上\"**；**而\"随风\"的取象给了\"申命\"的方式**：**像风一样\"一遍一遍过去\"，而不是\"一次喊完\"。** **须说明**：**\"随风，巽；君子以申命行事\"是《易经》象传原文**，**讲义对其解在下一页（本集未完，待续）**；**其可用的核与彖的\"重巽以申命\"互证**：**\"重\"（重复）是\"巽\"的方法论**（**因为\"入\"这件事，靠的是\"次数\"，不是\"力度\"**）。** **⚠ 须标**：**\"申命行事\"是古代政令语境**；**其可用的核在\"反复申明＋落地执行\"这一层**，**不涉任何具体政令主张**。","o":"TJ-0581 · 天纪·人间道·巽卦（PDF 第121页）  ---"},{"t":"二百零四、巽卦六爻","h":"初、二爻：\"利武人之贞\"与\"巽在床下\"","c":"要点——**初爻\"进退，利武人之贞\"**：\"**居巽顺之时，又处卑下，以阴柔之质，必畏而不安、无所适从——故此时惟利于武官、从武职之人，其巽顺必吉也。**\"其\"象\"：\"**进退不知所安，其志必疑且惧——故坚心服从，利于武职之人，不生贰心。**\" **\"进退不知所安，其志必疑且惧\"这一句，是\"顺\"的最低形态**：**既不敢进，也不甘退——\"疑\"与\"惧\"同时来**（**而讲义给的解是\"坚心服从\"、\"不生贰心\"——即：要么定下心归顺，要么就不要在中间摇**）。** **第二爻\"巽在床下，用史巫纷若，吉，无咎\"**：\"**九二乃示刚居阴位，外又有巽顺之象——意即人有'过于卑顺'之时：不是恐惧，就是谄媚，皆非正也。但其虽非正礼，亦可'远耻辱、去怨隙'，亦可为吉——就如同用诚意来通于神明之史巫：其诚意能通，亦可无过。**\"其\"象\"：\"**人能得中道、亦以至诚，则人必信之，吉而无咎。**\" **\"过于卑顺之时：不是恐惧，就是谄媚\"这一句，把\"过度顺从\"的两种来源分尽了**：**怕，或者讨好**——**而\"皆非正也\"是讲义的定性。** **而\"虽非正礼，亦可远耻辱、去怨隙\"是很宽的一句**：**这种姿态不合\"正礼\"，但它\"能远耻辱、去怨隙\"，所以\"亦可为吉\"**（**而\"用诚意来通于神明之史巫\"这个比喻，给了它一个底线：**\"诚意\"必须是真的**）。** **须说明**：**这是《易经》原文（巽卦初、二爻）**；**\"史巫\"是\"祭祀时通神的人\"，\"纷若\"是\"纷纷（多次）\"**；**其可用的核极准**：**\"卑顺\"本身不是问题，\"过度\"才是**——**而\"过度\"的判据是\"里面是怕还是求\"**。","o":"TJ-0582 · 天纪·人间道·巽卦·初、二爻（PDF 第122页）"},{"t":"二百零四、巽卦六爻","h":"第三、四爻：\"频巽，吝\"与\"田获三品\"","c":"要点——**第三爻\"频巽，吝\"**：\"**九三为下卦之上极，刚居之、有刚亢之质——居巽顺之时，非真能顺，乃出于勉强为之，必有所失；失后又频顺，频顺又再失，亦可卑吝也。**\"其\"象\"：\"**阳刚之才本非能顺巽，今处重巽之时，因势不能遂志、又必须以顺——故必有所失，其志必困穷。**\" **\"频巽\"（反复地顺）这个诊断极准**：**\"非真能顺，乃出于勉强为之\"→\"必有所失\"→\"失后又频顺\"→\"频顺又再失\"**——**而这是一个循环**（**即：勉强出来的\"顺\"会反复失败，而每次失败后又\"更用力地顺\"，于是更失败）。** **而\"其志必困穷\"是它的根**：**\"因势不能遂志、又必须以顺\"**——**想做的事做不成，还必须装顺**（**这个状态本身就会\"困穷\"）。** **第四爻\"悔亡，田获三品\"**，是全卦最顺的一条：\"**六四仅乃阴柔居阴，此位居下之上——乃'居上位而知顺下'。人能如此善处，必可不虑亡——犹田之收获能遍及上下；能如此，何虑悔亡？更且有功。**\"其\"象\"：\"**巽能通于上下，如田之获，上下受惠——此巽顺之功。**\" **\"居上位而知顺下\"这一句，是\"顺\"的最高形态**：**位置在上，却\"顺下\"（对下面顺着）**——**而这与\"谦卦'山居地下'\"、\"归妹'屈而谦降'\"是同一个动作。** **而\"田获三品\"（打猎的收获分给上下三等的人）给了它的结果**：**\"上下受惠\"**（**即：真正的\"顺\"不是\"单方面服低\"，是\"让两边的都拿到东西\"）。** **须说明**：**这是《易经》原文（巽卦第三、四爻）**；**\"三品\"取\"上中下三等（一说三类猎物）\"义**；**其可用的核极准**：**\"频巽\"与\"田获三品\"是\"顺\"的两极**——**一个越顺越糟，一个越顺越有功**（**分界在\"真顺还是勉强\"**）。","o":"TJ-0583 · 天纪·人间道·巽卦·第三、四爻（PDF 第122页）"},{"t":"二百零四、巽卦六爻","h":"第五、上爻：\"先庚后庚\"与\"巽在床下，丧其资斧\"","c":"方法——**第五爻\"贞吉，悔亡无不利，无初有终，先庚三日，后庚三日，吉\"**：\"**阳居阳位又处君位，此为巽之主——其命令必合于中正之道，天下黎民莫不顺从。能始终如此，必无往不利。如命令之出、有须变更时：'改始之不善，成终之善'，则可变更——其中道，必始终如一方可。**\"其\"象\"：\"**九五之尊，能处之吉，乃因能得中正之道——过与不及皆不善。**\" **\"先庚三日，后庚三日\"在这里的用法是\"变更命令前后要留缓冲\"**（**\"庚\"取\"更\"义，即\"变更\"**）——**而\"改始之不善，成终之善\"是变更的标准**：**改掉的目的是\"成终之善\"，不是\"改着试试\"。** **而\"过与不及皆不善\"六个字，是\"中道\"的判据**（**而这一句与\"震卦'中道胜于正道'\"正好互证**）。** **上爻\"巽在床下，丧其资斧，贞凶\"**，是全卦最重的一条：\"**床，人之所安处也；今在床下，有'过于安'之义。九为巽极，乃过于柔顺、乃丧失刚断——必失居所，乃自失也，对正道而言为凶。**\"其\"象\"：\"**居上之极本为阳刚，今却过于巽顺，必失正道，为凶道。**\" **\"床，人之所安处也；今在床下，有'过于安'之义\"这个取象极准**：**\"床\"是\"能安的地方\"，跑到\"床下\"就是\"过度地安\"**——**而\"过度地安\"的结果是\"丧失刚断\"（该断的断不了）**。** **\"必失居所，乃自失也\"是它的代价**：**因为\"想太安\"，所以\"没了能安的地方\"**（**这与\"旅卦'鸟焚其巢'\"是同一条：两处都是\"求安而失安\"**）。** **须说明**：**这是《易经》原文（巽卦第五、上爻）**；**\"资斧\"是\"钱财与工具\"**；**其可用的核极准**：**\"过与不及皆不善\"**——**顺得太少是\"频巽\"（勉强），顺得太多是\"丧其资斧\"（没了刚断）**；**而正确的量在\"中\"**。","o":"TJ-0584 · 天纪·人间道·巽卦·第五、上爻（PDF 第122页）"},{"t":"二百零五、兑卦之序","h":"卦序：\"江湖养物之课，天峰雨泽之象\"","c":"定义——兑卦（兑为泽）卦题为\"**江湖养物之课，天峰雨泽之象**\"。其卦图四物：**①\"人坐看一堆担\"**；**②\"月在天边\"**；**③\"秀才登梯\"**；**④\"一女在合边立，文字上箭\"**（**原文\"合\"字疑为\"阁\"字之讹，本集照录**）。** 占例\"唐三藏去西天取经，卜得之，乃知必归唐国\"**——**\"必归唐国\"四字与卦题\"江湖养物\"呼应**：**\"泽\"是\"养\"的地方**（**而\"必归\"是\"总得回去\"）。** **须说明**：**兑卦的卦辞、彖、象与六爻讲义在后续页**（**本集尚未读入**），**本章只记其卦题与卦图，不作引申**；**从卦题\"江湖养物\"可读出一层**：**\"泽\"的价值在\"能养物\"**（**而\"天峰雨泽\"（天上的雨落到峰上成泽）说明：它的\"养\"是有来源的**）。","o":"TJ-0585 · 天纪·人间道·兑卦（PDF 第123页）  ---"},{"t":"二百零六、兑卦：说以先民","h":"卦序与卦辞：\"物能相入，必有相悦方成\"","c":"定义——兑卦（兑为泽）卦题为\"**江湖养物之课，天峰雨泽之象**\"，其卦序：\"**巽者，入也，物能相入，必有相悦方成，故兑为巽之序。**\" **\"物能相入，必有相悦方成\"这一句，是\"巽→兑\"的枢纽**：**\"入\"（进得去）之后，还要\"相悦\"（彼此喜欢），事情才\"成\"**——**即：光是\"进得去\"不够，得\"处得好\"。** **卦辞\"兑：亨，利、贞\"**，其解：\"**兑之道，可以致亨——人能悦于物，物亦相悦，必足以亨。然兑之道在'贞正'：求悦不以正道，必成邪吝，终致悔咎。**\" **\"求悦不以正道，必成邪吝\"这一句，是兑卦的总戒**：**\"悦\"本身不是坏东西，\"求悦\"（刻意去讨人喜欢）才是**（**而\"不以正道\"的\"求悦\"，最后是\"悔咎\"。**）** **卦图五物**：**①\"人坐看一担：任务完成状，有人相助象，助人为乐之贵人\"**；**②\"月在天边：清明之治\"**；**③\"秀才登梯：金榜登科象\"**；**④\"一女在合边立：女人介入，先成后破\"**；**⑤\"文字上箭：得机而发，射；发象\"**（**原文\"合\"字疑为\"阁\"之讹，本集照录**）。** 其中\"**文字上箭：得机而发**\"一物最要紧**：**\"箭\"要\"上弦\"才能\"发\"，而\"发\"要\"得机\"**（**即：兑卦的\"悦\"是\"该发的时候发\"，不是\"一直笑\"。**）** **须说明**：**这是讲义对兑卦序与卦图的注解**；**\"丽泽\"（两泽相连）是兑卦的卦体象**。","o":"TJ-0586 · 天纪·人间道·兑卦（PDF 第123页）"},{"t":"二百零六、兑卦：说以先民","h":"彖：\"刚中而柔外\"与\"说以先民\"","c":"要点——兑卦\"彖\"为\"**兑，说也，刚中而柔外，说以利贞，是以顺乎天而应乎人，说以先民，民忘其劳，说以犯难，民忘其死，说之大，民劝矣哉**\"，其解：\"**兑，悦也——'外柔内刚'、中心诚实之象；悦之道可亨，乃因其能'贞正'。上顺天理、下应人心，能使民以悦，则民忘劳苦，且欣然为国犯难、忘其生死——此悦之道至极矣，民莫不信之。**\" **\"刚中而柔外\"四个字，是\"悦\"的正确结构**：**\"刚中\"（里面有原则、有硬度）＋\"柔外\"（外面柔和）**——**而讲义解作\"外柔内刚、中心诚实\"**（**即：真正的\"讨人喜欢\"，是\"里面对得住，外面不扎人\"）。** **而\"说以先民，民忘其劳；说以犯难，民忘其死\"这两句，是\"悦\"的力量**：**用\"悦\"来带领人，人就会\"忘其劳\"（不觉得累）；用\"悦\"来面对危难，人就会\"忘其死\"（不怕死）。** **而\"说之大，民劝矣哉\"是它的总结**：**\"民劝\"（老百姓自己愿意干）——这才是\"悦\"的效果**（**不是\"被驱使\"，是\"自己想干\"）。** **须说明**：**这是《易经》彖传原文加讲义之解**；**\"说\"读\"悦\"**；**其可用的核极准**：**\"悦\"的正当性来自\"顺乎天而应乎人\"**（**两个条件缺一不可：上合天理、下应人心**）；**⚠ 须标**：**这是\"治国御众\"语境**，**其可用的核在\"用令人愉快的方式带动人\"这一层**，**不涉及任何具体政治主张**。","o":"TJ-0587 · 天纪·人间道·兑卦（PDF 第123页）"},{"t":"二百零六、兑卦：说以先民","h":"象：\"丽泽，兑；君子以朋友讲习\"","c":"方法——兑卦\"象\"为\"**丽泽，兑；君子以朋友讲习**\"，其解：\"**两兑相重，即两泽互丽，交相浸润、互有滋益之象——君子观之，乃知'朋友讲习、互相增益'，为天下之大悦，有互相明益之象。**\" **\"两泽互丽，交相浸润\"这个取象极准**：**两个湖挨着，水在彼此之间\"浸润\"（渗过去、渗回来）**——**而\"互有滋益\"（两边都变得更多）是它的结果。** **而\"朋友讲习\"是它的落点**：**朋友之间互相讲、互相学**——**而讲义定性为\"天下之大悦\"**（**即：最大的\"悦\"不是\"被人喜欢\"，是\"和别人一起长进\"）。** **须说明**：**这是《易经》象传原文加讲义之解**；**\"丽\"（lì）是\"附着、相连\"**；**其可用的核极准**：**这一条与\"咸卦'虚受人'\"、\"兑卦'刚中柔外'\"合起来是一组\"关系\"的判断**——**\"虚受\"是\"能进来\"，\"讲习\"是\"互相增益\"，\"刚中柔外\"是\"不扎人\"**。","o":"TJ-0588 · 天纪·人间道·兑卦（PDF 第123页）"},{"t":"二百零七、兑卦六爻：悦的六种形态","h":"初、二爻：\"和兑\"与\"孚兑\"","c":"要点——**初爻\"和兑，吉\"**：\"**初虽阳刚，但因居卑下，乃知卑下和顺——此悦必无所偏私，此兑之正道，故吉。**\"其\"象\"：\"**初位必随时顺处，心无所欲，惟求能和而已，是以吉也。其行必未有可疑。**\" **\"心无所欲，惟求能和而已\"这一句，是\"悦\"的第一种形态**：**\"和\"（跟谁都和气）而不\"求\"**——**因为\"心无所欲\"，所以\"无所偏私\"**（**即：不图什么，就自然和气。**）** **第二爻\"孚兑，吉，悔亡\"**：\"**二位有刚中之德，内实孚信——虽近小人，但不失君子之道；悦而不失刚中之德，所以能吉而不虑亡矣。**\"其\"象\"：\"**君子之悦，自心中之至诚，故必不失道；小人之悦，必忘形而自失不知。**\" **\"虽近小人，但不失君子之道\"这一句很实在**：**\"近\"（在身边）不等于\"同\"**（**即：身边有小人，也可以不为所动）。** **而\"君子之悦，自心中之至诚，故必不失道；小人之悦，必忘形而自失不知\"这一组对照极精**：**君子的\"悦\"从\"诚\"里出来（所以不失道），小人的\"悦\"从\"忘形\"里出来（所以自己失了都不知道）。** **须说明**：**这是《易经》原文（兑卦初、二爻）加上讲义之解**；**\"孚\"是\"诚信\"**；**其可用的核极准**：**\"悦\"的两种源头**——**\"和\"（无所求的和气）与\"孚\"（里面诚实）是正的；\"忘形\"（放开自己）是偏的**。","o":"TJ-0589 · 天纪·人间道·兑卦·初、二爻（PDF 第123页）"},{"t":"二百零七、兑卦六爻：悦的六种形态","h":"第三、四爻：\"来兑，凶\"与\"商兑未宁，介疾有喜\"","c":"风险——**第三爻\"来兑，凶\"**：\"**阴弃居阳刚之位，不适也——比得兑之道，不以中正；'为悦而求悦'，'人之有求必因私欲'，己离正道，故凶。**\"其\"象\"：\"**柔居阳刚，自处必不中正，和欲而求悦，必招凶。**\" **\"为悦而求悦\"四个字，是兑卦最重的诊断**：**不是为了\"事\"去让人喜欢，是为了\"被人喜欢\"而去让人喜欢**——**而\"人之有求必因私欲\"这一句，把它归了因**：**一个人主动去\"求\"，一定是因为\"有想要的东西\"。** **第四爻\"商兑未宁，介疾有喜\"**：\"**阳刚处阴位，居不中正，故有未决、未能定也。居兑之时，不为悦所惑，能知命守刚正、疾恶去仇，必能得君之信，而有喜也。**\"其\"象\"：\"**九四君侧之人能有喜庆，必来自君之信孚，得遂行其阳刚之志也。**\" **\"商兑未宁\"（反复权衡、心里不安）这个状态，讲义的处理很准**：**\"居不中正\"所以\"有未决\"**——**而解不是\"快点决定\"，是\"不为悦所惑\"＋\"知命守刚正\"＋\"疾恶去仇\"。** **而\"介疾有喜\"（把\"疾\"隔开，就有喜）是它的结果**：**\"疾\"在此指\"恶\"——把\"恶\"隔在外面，喜才进得来。** **须说明**：**这是《易经》原文（兑卦第三、四爻）**；**\"介\"是\"隔、界限\"，\"疾\"是\"恶、病\"**；**其可用的核极准**：**\"介疾有喜\"这一句，与\"遯卦'不恶而严'（用庄严让人自己走远）\"是同一组**（**两处都在说\"要有界限\"，而不是\"毫无界限地好\"**）。","o":"TJ-0590 · 天纪·人间道·兑卦·第三、四爻（PDF 第123~124页）"},{"t":"二百零七、兑卦六爻：悦的六种形态","h":"第五、上爻：\"孚于剥，有厉\"与\"引兑\"","c":"方法——**第五爻\"孚于剥，有厉\"**：\"**九五君位得中正之道，居悦时，乃可尽善——但圣人复设戒于'有厉'：即虽中正圣贤在上，天下仍有小人，'为免惑于悦，小人之入而不自知'，故于此设戒。**\"其\"象\"：\"**居悦知剥之戒，人于事始知戒，可以无灾咎也。**\" **\"虽中正圣贤在上，天下仍有小人\"这一句，破了一种幻想**：**\"我做得对，就不该有小人\"**——**而讲义的判断是：即使都对，小人还是会有**（**所以\"设戒\"不是\"防不测\"，是\"承认常态\"）。** **而\"为免惑于悦，小人之入而不自知\"是\"厉\"的来源**：**小人不是\"打进来\"的，是\"惑于悦\"（被让你高兴的方式进来的）**——**而\"不自知\"（你自己不知道他进来了）。** **上爻\"引兑\"**：\"**悦之至极则愈悦，故言'引兑'——天下万事过之皆不宜，有凶至。**\"其\"象\"：\"**悦之至极，已太过于事理，其果必不能更光也。**\" **\"引兑\"（牵引着继续悦）这个象极准**：**\"悦之至极则愈悦\"——越高兴越想更高兴**（**而\"过之皆不宜\"是它的判据）。** **须说明**：**这是《易经》原文（兑卦第五、上爻）**；**\"剥\"取\"剥落、侵蚀\"义**；**其可用的核极准**：**\"引兑\"与\"丰卦'窥其户，阒其无人'\"、\"豫卦'冥豫'\"是同一组**（**三处都说：让\"乐\"自己往下滑，滑到底就是凶**）。","o":"TJ-0591 · 天纪·人间道·兑卦·第五、上爻（PDF 第124页）  ---"},{"t":"二百零八、涣卦：王假有庙","h":"卦序：\"人之性忧则结聚，悦则舒散\"","c":"定义——涣卦（风水涣）卦题为\"**顺水行舟之课，大风吹物之象**\"（**占例：汉武帝卜得之，乃知李夫人还魂也**），其卦序：\"**兑，悦也；人悦时，则必舒散——涣，散也，故涣为兑之序。'人之性忧则结聚，悦则舒散。'此卦上巽下水，乃'风行水上'——水遇风则涣散，故涣为散也。**\" **\"人之性忧则结聚，悦则舒散\"十个字，把\"聚\"与\"散\"的心理机制说尽了**：**忧虑使人心聚拢（因为要互相依靠），喜悦使人心散开（因为各有所适）。** **即：\"涣\"（散）不是\"坏事\"，是\"悦\"的必然**——**而这也是\"兑→涣\"的卦序所在**（**\"悦\"到极处，人就散了**）。** **而\"风行水上，水遇风则涣散\"给了它的物理象**：**水面本来是平的，风一吹就散了**（**而\"散\"之后，水还在，只是\"形\"散了**）。** **卦图六物**：**①\"山上有寺：出家状，对峙状，寸土寸金象\"**；**②\"僧：化外之人，光头人\"**；**③\"一人随后：逃避，求助化外之人\"**；**④\"一鬼在后：为祸追缉之象，内心有鬼，处事不明象\"**；**⑤\"金甲人：正义之师，得民心也\"**；**⑥\"寺，土头人作对：等待时机也\"**。** 其中\"**一鬼在后：内心有鬼，处事不明象**\"一物最要紧**：**\"鬼\"不是外面来的，是\"内心有鬼\"**（**即：涣卦的\"散\"，先散在心里）。** **须说明**：**这是讲义对涣卦序与卦图的注解**；**其可用的核极准**：**\"忧则聚、悦则散\"是一条可验的规律**（**而\"治散\"要顺着它，不能逆着它**）。","o":"TJ-0592 · 天纪·人间道·涣卦（PDF 第125页）"},{"t":"二百零八、涣卦：王假有庙","h":"卦辞与彖：\"本于中心一念\"与\"不可致极刚\"","c":"要点——涣卦辞为\"**涣：亨。王假有庙，利涉大川，利贞**\"，其解是全卦最关键的一段：\"**涣，散也——'人会离散，本于中心一念'：心离则散矣。故'能治散，必从中入手'——有能收拾人心，散可聚矣。故散之道论'如何用散'，故可以亨。君王能知立宗庙收人心，则必可前进无阻，故须坚心到底。**\" **\"人会离散，本于中心一念\"这一句，是涣卦的根本**：**人散不是\"因为没有利益\"，是\"心离了\"**（**而\"心离\"是从\"一念\"开始的）。** **由此推出方法：\"能治散，必从中入手\"**——**\"治散\"要治\"心\"，不能只治\"形\"**。** **而\"故散之道论'如何用散'\"这一句，把\"散\"翻了过来**：**\"散\"不只是\"要治的病\"，还是\"可用的法\"**（**即：有时候\"聚\"太紧，\"散\"一散反而通了）。** **彖\"涣，亨。刚来而不穷，柔得位乎外而上同\"**：\"**涣之道所以可致亨：以卦来言，用阳刚之法，'不可致极刚'——以居下位，又得中道；柔位而得五君位之相应——故居涣时，能守其中，必不至于离散，所以能亨。**\" **\"用阳刚之法，不可致极刚\"这一句极准**：**\"刚\"要用，但不能\"极\"**（**因为\"极刚\"就会\"折断\"，而\"折断\"就是最大的\"散\"）。** **\"王假有庙，王乃在中也。利涉大川，乘木有功也\"**：\"**君王能利用宗庙收拾人心，乃知'用中道之妙'——能如此，可往天下，无处不阻也。自古以来，能得民者，必得其心，方可谓得民矣。**\" **\"能得民者，必得其心，方可谓得民矣\"这一句，是全书对\"得民\"最直白的一句**：**\"得民\"不是\"人归你管\"，是\"心得你\"。** **须说明**：**这是《易经》原文加讲义之解**；**\"假\"（gé）通\"格\"，取\"至、感通\"义**；**其可用的核极准**：**\"坚心到底\"与\"能守其中\"是两个条件**（**前者是\"不放弃\"，后者是\"不偏激\"**）。","o":"TJ-0593 · 天纪·人间道·涣卦（PDF 第125页）"},{"t":"二百零八、涣卦：王假有庙","h":"象：\"享于帝立庙\"与\"合心之道\"","c":"方法——涣卦\"象\"为\"**风行水上，涣；先王以享于帝立庙**\"，其解：\"**风行水上，涣散之象——先王观涣之象，知'救天下之散，惟有祭祀宗庙、收合人心'——'合心之道，莫大于此'。**\" **\"救天下之散，惟有祭祀宗庙、收合人心\"这一句，是涣卦的正面**：**面对\"散\"，办法不是\"抓回来\"，是\"找一个共同的中心\"**（**而\"宗庙\"就是那个中心——它让散开的人有个\"共同的来处\"）。** **而\"合心之道，莫大于此\"是它的定性**：**在\"合心\"这件事上，没有比\"共同祭祀\"更有效的**（**因为它是\"共同记得同一件事\"）。** **须说明**：**这是《易经》象传原文加讲义之解**；**其可用的核极准**：**\"收合人心\"的机制是\"共同的意义\"，不是\"共同的利益\"**（**利益会变，意义不变**）；**⚠ 须标**：**\"享于帝立庙\"是古代祭祀制度语境**，**其可用的核在\"用共同的意义把人聚起来\"这一层**，**不涉及任何具体宗教或制度主张**。","o":"TJ-0594 · 天纪·人间道·涣卦（PDF 第125页）"},{"t":"二百零九、涣卦六爻：治散的六种处境","h":"初、二爻：\"用拯马壮\"与\"涣奔其机\"","c":"要点——**初爻\"用拯马壮，吉\"**：\"**初爻为涣之始——阴柔居不正，又处卑下，故于'始时即察知而拯'，只须'托于阳刚之人'，即可整涣，故吉。**\"其\"象\"：\"**初六之能吉，乃因于涣始即察知、始而拯——'此得时也'，故吉。**\" **\"于始时即察知而拯\"这一句，是\"治散\"的最佳时点**：**散刚开始的时候**（**而\"只须托于阳刚之人\"是它的方法：不需要自己有力气，只需要找对人。**）** **第二爻\"涣奔其机，悔亡\"**：\"**外饰顺，内实险忧——'心已散'。九二居坎险中位，乃意于涣散时，又居险中，其险可知——'如能知机而奔往不犹豫'，方可不虑亡也。**\"其\"象\"：\"**涣之时居险，必以'知机而亲近之'，乃可得愿矣。**\" **\"外饰顺，内实险忧——心已散\"这九个字，是\"散\"的隐蔽形态**：**外面看着还顺，里面已经散了**（**而\"心已散\"这三个字，正是\"散\"的真正位置）。** **而\"知机而奔往不犹豫\"是它的解**：**\"机\"是\"时机\"，也是\"关键处\"**——**\"奔\"过去，不犹豫**（**这与\"震卦'亿丧贝，勿逐'\"正相反：那里是\"不要追\"，这里是\"快点去\"——分别在于\"是失去的\"还是\"该抓住的\"**）。** **须说明**：**这是《易经》原文（涣卦初、二爻）**；**\"机\"（jī）在此通\"几\"，取\"时机、关键\"义**；**其可用的核极准**：**\"心已散\"是最难察觉的一种散**（**因为\"外饰顺\"还在**）。","o":"TJ-0595 · 天纪·人间道·涣卦·初、二爻（PDF 第126页）"},{"t":"二百零九、涣卦六爻：治散的六种处境","h":"第三、四爻：\"涣其躬\"与\"涣其群，元吉\"","c":"要点——**第三爻\"涣其躬，无悔\"**：\"**六三相位，今才为阴质、不适居位——于涣散之时，必无法拯救他人，'只能止于其身'，可以无悔矣。**\"其\"象\"：\"**涣时，以躬顺求上同，可免己之灾。**\" **\"只能止于其身\"这一句，是\"能力不足时的正解\"**：**救不了别人，就先\"止于其身\"（把自己管好）**（**而\"无悔\"是它的结果——不是\"有功\"，但\"无悔\"）。** **第四爻\"涣其群，元吉。涣有丘，匪夷所思\"**，是全卦最重的一条：\"**六四乃大臣之位，今有九五君来同应——有君臣合力，以济天下之涣散；能如此则有大功。方涣散之时：'用刚则必不能使之怀附，用柔又不足使其依归'——故如能使大聚，此事必难，'用必非常法'；能成此大功，非圣贤何能如是乎？**\"其\"象\"：\"**元吉谓大功德也——君臣合力于涣时，能群聚民众，其功可光大也。**\" **\"用刚则必不能使之怀附，用柔又不足使其依归\"这一句，把\"治散\"的两难说尽了**：**用硬的，人不亲近；用软的，人无所依托**——**两条路都走不通。** **而\"用必非常法\"是它的答案**：**\"使大聚\"（把散了的重新聚成大群）\"此事必难\"，所以\"必用非常之法\"**（**而\"非圣贤何能如是乎\"说明：这不是\"技术\"，是\"人\"的问题）。** **须说明**：**这是《易经》原文（涣卦第三、四爻）**；**\"丘\"取\"聚而成丘\"义，\"匪夷所思\"即\"不是常人能想到的\"**；**其可用的核极准**：**\"涣其群\"（把原来的小圈子打散）与\"涣有丘\"（重新聚成更大的）是同一件事的两步**（**即：先散小群，才能聚大群**）。","o":"TJ-0596 · 天纪·人间道·涣卦·第三、四爻（PDF 第126页）"},{"t":"二百零九、涣卦六爻：治散的六种处境","h":"第五、上爻：\"涣汗其大号\"与\"涣其血\"","c":"方法——**第五爻\"涣汗其大号，涣王居，无咎\"**：\"**九五君位，居涣之时，以阳刚正德又得巽之外顺——此深得处涣之道，必能号令人民，民心信服而从矣。'如汗之于体外，息息相关'——民与君之关系能如此，则必能居王位而无咎。**\"其\"象\"：\"**君位尊，而其才德又适其位，称王可无咎，因合于正位。**\" **\"如汗之于体外，息息相关\"这个取象极精**：**汗是从皮肤里出来的，它和身体\"息息相关\"（不能分离）**——**即：号令与民心要像\"汗与身体\"那样，是一体的，不是外加的。** **而\"民心信服而从\"是它的前提**：**号令之所以有效，是因为\"信服\"在前**（**这与\"革卦'巳日乃孚'（可信度是时间长出来的）\"是同一条）。** **上爻\"涣其血，去逖出，无咎\"**：\"**涣至极时，仍能守巽顺之道，即令有伤，亦仍可出险、远离灾害而无灾矣。**\"其\"象\"：\"**涣散至极，即令血出伤害——以坚守巽顺之道，必远离祸害也。**\" **\"即令血出伤害，以坚守巽顺之道，必远离祸害\"这一句，是涣卦的收尾**：**散到极点，已经\"出血\"了，但只要\"守巽顺之道\"，还能\"去逖出\"（远远走开）**（**即：\"散到底\"不等于\"完了\"，\"守顺\"还能出去）。** **须说明**：**这是《易经》原文（涣卦第五、上爻）**；**\"逖\"（tì）是\"远\"**；**其可用的核极准**：**涣卦的六爻是\"治散\"的六个层次**——**初爻\"早救\"、第二爻\"知机\"、第三爻\"自守\"、第四爻\"非常法\"、第五爻\"号令与心一体\"、上爻\"守顺远害\"**。","o":"TJ-0597 · 天纪·人间道·涣卦·第五、上爻（PDF 第126页）  ---"},{"t":"二百一十、节卦：节之贵在中庸","h":"卦序：\"物不可以终散，必当节止\"","c":"定义——节卦（水泽节）卦题为\"**船行风黄之课，寒暑有节之象**\"（**占例：孟姜女送寒衣，卜得之，知夫落亡，不吉之兆**），其卦序：\"**涣者散也，物不可以终散，必当节止——故涣之后以节卦为序。此卦泽上有水：泽为'有限之水地'，如再置水，当满不容，故有'节制'之象。**\" **\"物不可以终散，必当节止\"这一句，是\"涣→节\"的枢纽**：**东西不能一直散下去，总得有个\"止\"**——**而\"节\"就是那个\"止\"。** **而\"泽为有限之水地，如再置水，当满不容\"这个取象极准**：**湖是有容量的，再往里倒水，就\"满不容\"（装不下了）**——**即：\"节\"不是\"人为的限制\"，是\"容量的真相\"**（**因为任何容器都有限，不由人是否承认而改变）**。** **卦图五物**：**①\"大雨下：阴暗不明，凶象\"**；**②\"火中鱼跃：飞腾而徒劳无功，又餐饮业\"**；**③\"鸡在屋上：酉年肖鸡人，解救之时与人\"**；**④\"犬在井中：招陷，动弹不得，不知节制而招如此\"**；**⑤\"屋门开着：仍可开张\"**。** 其中\"**犬在井中：招陷，动弹不得，不知节制而招如此**\"一物最要紧**：**\"不知节制\"的结果不是\"少拿一点\"，是\"掉进井里动不了\"**（**而\"火中鱼跃：飞腾而徒劳无功\"是另一半：在错的地方用力，一样没有结果。** **须说明**：**这是讲义对节卦序与卦图的注解**；**\"船行风黄\"取\"船在风里走\"义**（**而\"寒暑有节\"正说明\"节\"是自然律**）。","o":"TJ-0598 · 天纪·人间道·节卦（PDF 第127页）"},{"t":"二百一十、节卦：节之贵在中庸","h":"卦辞与彖：\"苦节不可贞\"与\"常人于悦时不知止\"","c":"要点——节卦辞为\"**节：亨，苦节，不可贞**\"，其解：\"**节之道，在有制——万事如知节，必可亨。'节之贵在中庸'：如限制太过则苦，如节至于苦，必不可常久也。人事如此。**\" **\"节之贵在中庸\"这一句，是节卦最要紧的判断**：**\"节\"不是\"越省越好\"，是\"恰到好处\"**（**而\"如节至于苦，必不可常久\"是它的反证——过度的节制撑不住）。** **彖\"节亨，刚柔分，而刚得中\"**：\"**节之道能致亨通，乃因'知刚柔并济'——能刚又且能适中，此节之能亨。**\" **彖续\"苦节不可贞，其道穷也\"**：\"**如节之致于苦极，必无法坚固守志——则节道必招困穷也。**\" **\"如节之致于苦极，必无法坚固守志\"这一句极准**：**\"苦节\"不是\"更自律\"，是\"守不住\"**——**因为人扛不住长期的苦，而扛不住就会崩**（**即：过度的节制不是\"提前崩\"，是\"崩得更彻底\"）。** **彖续\"说以行险，当位以节，中正以通\"**：\"**此以卦才言：外险内悦——'以能悦且又知止'，此为节之大义。'常人于悦时不知止，遇艰险方思止'。当位居尊之人如明节之道，必能中正且亨通矣。'今人之权力欲望无尽，居尊不思止，悦而无限，终必至凶'——乃不知节之道，明矣。**\" **\"常人于悦时不知止，遇艰险方思止\"这一句极精**：**人在高兴的时候不会停，非要撞到危险才想起停**——**而\"遇艰险方思止\"往往已经晚了**（**而\"悦而无限，终必至凶\"是它的结论）。** **须说明**：**这是《易经》原文加讲义之解**；**其可用的核极准**：**\"节\"的两个失败态是\"苦节\"（过度）与\"不节\"（不足）**——**而\"节之贵在中庸\"是唯一正解**。","o":"TJ-0599 · 天纪·人间道·节卦（PDF 第127页）"},{"t":"二百一十、节卦：节之贵在中庸","h":"彖续与象：\"天地节而四时成\"与\"制数度，议德行\"","c":"方法——节卦\"彖\"的最后一段，是全书对\"制度\"来源讲得最透的一处：\"**天地节而四时成，节以制度，不伤财，不害民**\"，其解：\"**天地之间有节道，故四季分明——圣人观之，知'立制度以为节道'，所以必不伤财害民，'此法治观念之始'。圣人立此道，即因'知人之欲望无限'，故以节制之，'免流于人治'——必因私欲，而终致劳民伤财。**\" **这段话有三层，我逐层记**：**①\"天地之间有节道，故四季分明\"**——**\"节\"不是人发明的，是自然本有的**（**四季就是\"节\"的实证**）。** **②\"圣人观之，知立制度以为节道\"**——**\"制度\"是对\"节\"的模仿**（**而\"此法治观念之始\"这一句，是讲义给\"制度\"的定性）。** **③\"圣人立此道，即因'知人之欲望无限'，故以节制之，'免流于人治'\"**——**这一句最要紧**：**制度的目的是\"限量\"，而不是\"约束人\"**（**因为\"人治\"的根据是\"某个人的判断\"，而\"某个人\"的欲望是\"无限\"的。**）** **\"免流于人治——必因私欲，而终致劳民伤财\"这一句，是讲义对\"人治\"的判断**：**人治必然滑向\"私欲\"，而私欲必然\"劳民伤财\"**。** **而\"象\"为\"泽上有水，节；君子以制数度，议德行\"**，其解：\"**泽之容水有限，故节——君子观之，知'节以制度来限制'、'下定义来区分君子小人之行为'。**\" **\"泽之容水有限，故节\"与卦序的\"当满不容\"是同一取象**；**而\"制数度，议德行\"两件事**：**\"数度\"是\"量\"（可数的规矩），\"德行\"是\"质\"（可议的品格）**——**即：一个社会要\"有尺度\"，也要\"有是非\"。** **须说明**：**这是《易经》彖传与象传原文加讲义之解**；**其可用的核极准**：**\"知人之欲望无限，故以节制之\"**——**这是\"制度\"的全部理由**；**⚠ 须标**：**讲义此处的\"法治\"是古典语境下的\"制度之治\"**，**与近代法学的\"法治（rule of law）\"不是同一概念**，**本集只取其\"以制度限欲\"这一层，不作引申**。","o":"TJ-0600 · 天纪·人间道·节卦（PDF 第127页）"},{"t":"二百一十一、节卦六爻：节的六种程度","h":"初、二爻：\"不出户庭\"与\"不出门庭，凶\"","c":"要点——**初爻\"不出户庭，无咎\"**：\"**阳刚之性居节之初，'必不能节'——如居门庭之内，则可无咎。**\"其\"象\"：\"**不出户庭可以无咎，但须'知外之言与行，必以时来定进退之机'。**\" **第二爻\"不出门庭，凶\"**，是全卦最反直觉的一条：\"**刚阳之性，居阴柔之位——爻义为：处阴且不正之人居当节之时，'不知节必合于中道'——'过与不及皆非节'。如此即令不出门庭，亦会招凶。**\"其\"象\"：\"**时之义在《易》中最为重要——不知节之义，又居节之时，失其时，因不合中道之节（过与不及皆不对），即令不出门庭，亦有凶矣。**\" **这两爻对照极狠**：**初爻\"不出户庭\"是\"无咎\"，第二爻\"不出门庭\"是\"凶\"**——**同样是\"不出\"，一个对，一个错。** **而分别在于\"时\"**：**初爻在\"节之初\"，此时该守（所以\"不出\"对）；第二爻在\"当节之时\"，此时该动（所以\"不出\"就是错**）。** **即：同样是\"不出\"，关键在于\"是不是该出的时候不出\"。** **而\"过与不及皆非节\"这一句，把\"节\"的判据说清了**：**\"节\"不是\"少\"，是\"合于中道\"**（**太少也是\"不节\"**）。** **须说明**：**这是《易经》原文（节卦初、二爻）**；**\"户庭\"是\"内室的门庭\"，\"门庭\"是\"外门\"**（**一内一外，正是\"程度\"之别**）；**其可用的核极准**：**\"时之义在《易》中最为重要\"**——**讲义把\"时\"提到了《易》的第一位**（**而这一条与\"艮卦'时止则止，时行则行'\"、\"丰卦'与时消息'\"是同一组的第三处**）。","o":"TJ-0601 · 天纪·人间道·节卦·初、二爻（PDF 第128页）"},{"t":"二百一十一、节卦六爻：节的六种程度","h":"第三、四爻：\"不节之嗟\"与\"安节，亨\"","c":"风险——**第三爻\"不节若，则嗟若，无咎\"**：\"**三爻本刚，今阴柔居之——须'刚断而柔性之人'居其位：因其柔顺，且知自节，乃可顺于义行，亦可以无过。**\"其\"象\"：\"**知节可以免过失——故不知自节而招祸，又能怪谁呢？**\" **\"不节之嗟，又谁咎也？\"这一句极狠**：**\"嗟\"（叹息）是\"不节\"的后果，而\"又谁咎也\"是它的定论**——**自己没有节制，怪不了别人。** **第四爻\"安节，亨\"**：\"**阴居阴位，其正位——于节时，即居高位且有节之象；能安于此，则亨通。**\"其\"象\"：\"**能行节之中道、且安居于此，必亨通义。**\" **\"安节\"（安心于节制）这个状态，是\"节\"的最高形态**：**不是\"忍着\"，是\"安于\"**（**因为\"忍着\"会反弹，\"安于\"才持久**）。** **须说明**：**这是《易经》原文（节卦第三、四爻）**；**\"安节\"的\"安\"是\"以之为安\"**；**其可用的核极准**：**\"安节\"与\"苦节\"正好是一对**——**\"安节\"能亨（第四爻），\"苦节\"必凶（上爻）**（**两处的分别不在\"节多少\"，在\"心里是安还是苦\"**）。","o":"TJ-0602 · 天纪·人间道·节卦·第三、四爻（PDF 第128页）"},{"t":"二百一十一、节卦六爻：节的六种程度","h":"第五、上爻：\"甘之如饴\"与\"苦节，贞凶\"","c":"方法——**第五爻\"节，吉，往有尚\"**：\"**九五尊位，乃居节时之主位——'能甘之如饴、尽节之道'，必吉，功大矣。**\"其\"象\"：\"**君王能知节道，用节且甘如饴，必成大功，因其居尊位故也。**\" **\"能甘之如饴、尽节之道\"这一句，是\"节\"的最好状态**：**\"甘之如饴\"（觉得它是甜的）**——**而位置越高越要紧**（**因为\"居尊位\"的人最容易\"不思止\"，而他能\"甘之如饴\"，就成了\"节\"的示范）。** **上爻\"苦节，贞凶，悔亡\"**：\"**上六乃居节之极——其必因节致苦；如坚守不改，则必凶，终致亡而悔。'《易》之节卦悔亡，与他卦之悔亡，辞同但意不同也'。**\"其\"象\"：\"**因节致苦、不知变——失《易》之神，其凶乃因道之穷尽。**\" **\"'辞同但意不同'这一句，是讲义给读经者的提醒**：**同样的\"悔亡\"两个字，在节卦里意思不一样**（**因为这里的\"悔亡\"是\"悔之晚矣\"——\"终致亡而悔\"**）。** **而\"因节致苦，不知变，失《易》之神\"是上爻的定性**：**\"苦节\"的错不在\"节\"，在\"不知变\"**（**而\"失《易》之神\"这个评价极重——因为《易》的精髓就是\"变\"**）。** **须说明**：**这是《易经》原文（节卦第五、上爻）**；**\"苦节\"的\"苦\"是\"以为苦\"**；**其可用的核极准**：**节卦六爻给了\"节\"的六个程度**——**初爻\"该守则守\"、第二爻\"该出不出则凶\"、第三爻\"不节必自招\"、第四爻\"安节\"、第五爻\"甘节\"、上爻\"苦节则凶\"**；**而总纲是一条：节之贵在中庸**。","o":"TJ-0603 · 天纪·人间道·节卦·第五、上爻（PDF 第128页）  ---"},{"t":"二百一十二、中孚：信及豚鱼","h":"卦序：\"人有节，而后有信\"","c":"定义——中孚卦（风泽中孚）卦题为\"**鹤鸣子和之课，事有定期之象**\"（**占例：辛君屯边，卜得之，遂果得梅妃之信也**），其卦序：\"**人有节，而后有信，故中孚次之。节本有节制、不可过越之意——人能信而后行之：上位知信守，下位知信从。此卦泽上有风，风行于泽上、能感于水，为中孚之象；此因一、二爻位与五、六爻位皆实阳，而三、四爻位为'中虚'之象——全卦有'外实中虚'之义，此中孚之象。**\" **\"人有节，而后有信\"这一句，是\"节→中孚\"的枢纽**：**先有\"节制\"（知道边界），才有\"信\"**——**因为一个\"什么都答应\"的人，他的\"答应\"没有分量**（**即：\"信\"的价值来自\"有限度\"，不是\"无限\"。**）** **而\"上位知信守，下位知信从\"两句，把\"信\"分成了两个方向**：**上面守（不随便改），下面从（不随便疑）**。** **而\"外实中虚\"是\"中孚\"的卦体象**：**外面是实阳（有实在的东西），中间是\"虚\"（空着）**——**而这正是\"诚\"的形态**（**因为\"虚\"才装得进别人，\"实\"才立得住自己）。** **卦图五物**：**①\"望子上文书：科甲高中，刑法更吉\"**；**②\"人击柝：预警也\"**；**③\"贵人用绳牵鹿：守成，不可攻也\"**；**④\"雁衔书：喜事将至，有南徙之象\"**；**⑤\"人立庭中：莅庭也，防官司或打官司保身也\"**。** 其中\"**贵人用绳牵鹿：守成，不可攻也**\"一物最要紧**：**\"鹿\"是\"禄\"，而\"用绳牵\"是\"牵得住\"——即：能守住已有的，不要再去攻取。** **须说明**：**这是讲义对中孚卦序与卦图的注解**；**\"中孚\"取\"心中诚信\"义**（**\"孚\"是\"信\"**）。","o":"TJ-0604 · 天纪·人间道·中孚卦（PDF 第129页）"},{"t":"二百一十二、中孚：信及豚鱼","h":"卦辞与彖：\"豚鱼吉\"与\"乘木舟虚\"","c":"要点——中孚卦辞为\"**中孚：豚鱼吉，利涉大川，利贞**\"，其解：\"**中孚之道，其中心之诚信，能使豚鱼都有感，则无所不至矣——故'利涉大川'，周行无限也。**\" **\"能使豚鱼都有感，则无所不至\"这一句，是\"信\"的极致**：**\"豚鱼\"（猪与鱼）是最迟钝、最无知觉的一类**——**而\"信\"能到\"连它们都感受到\"，就\"无所不至\"。** **即：\"诚信\"的深浅不看\"说了什么\"，看\"最迟钝的那一方有没有感受到\"。** **彖\"中孚，柔在内而刚得中\"**：\"**中孚之中虚乃至诚之象——此示意'刚之道能得中正'，故吉。**\" **彖续\"说而巽，孚乃化邦也。豚鱼吉，信及豚鱼也\"**：\"**上位以至诚而顺从于下，下位以至诚以求上悦——由其中孚之至诚，必教化邦国；此信能令豚鱼皆感，此道之至善也。**\" **\"上位以至诚而顺从于下，下位以至诚以求上悦\"这一句，是\"信\"的双向结构**：**上面的\"诚\"表现为\"顺下\"，下面的\"诚\"表现为\"求上悦\"**（**两边都不是\"要求对方\"，是\"从自己这头做\"。**）** **彖续\"利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也\"**：\"**中孚道之吉，犹乘舟渡川——'内无实物，不虞覆船'：即处艰困，能以中孚则必可亨通。能坚守中孚之道，此天道之极至也。**\" **\"内无实物，不虞覆船\"这个取象极精**：**船里没装东西，就不会翻**——**即：\"空\"本身是一种保护**（**而\"中虚\"的卦体象，正在这一层上）。** **须说明**：**这是《易经》原文加讲义之解**；**\"豚鱼\"取\"最无知觉之物\"义（一说\"豚鱼\"是\"江豚\"，能感知风）**；**其可用的核极准**：**\"信\"要\"及豚鱼\"——即\"到最不敏感的那一端\"**；**而\"乘木舟虚\"给了它方法：先\"空\"自己，才渡得过大川**。","o":"TJ-0605 · 天纪·人间道·中孚卦（PDF 第129页）"},{"t":"二百一十二、中孚：信及豚鱼","h":"象：\"议狱缓死\"与\"人心虚，则物必感之\"","c":"方法——中孚卦\"象\"为\"**泽上有风，中孚；君子以议狱缓死**\"，其解：\"**风在泽上，泽有感于风——因水体本虚，故风能入。君子观之，知'人心虚，则物必感之'，此中孚之象。君子于议狱，本为尽忠而已；于决死之际，但求'缓之、宽之'。**\" **\"水体本虚，故风能入\"这一句，是\"感通\"的机制**：**水面是空的，所以风进得去**——**而\"人心虚，则物必感之\"是它的推广**：**心里空的人，别的东西才进得来。** **而\"于决死之际，但求缓之、宽之\"是它的落点**：**\"议狱\"（审议案件）的目的是\"尽忠\"（把事查清），而\"决死\"（定生死）的时候，只求\"缓\"与\"宽\"。** **须说明**：**这是《易经》象传原文加讲义之解**；**其可用的核极准**：**\"缓\"与\"宽\"是两个具体动作**——**\"缓\"是\"多给一点时间\"（因为时间是查清事实的条件），\"宽\"是\"在边界上留一点余地\"**；**⚠ 须标**：**\"议狱缓死\"是古代司法语境**，**其可用的核在\"定夺生死这类不可逆的事要多给时间、多留余地\"这一层**，**不涉及任何具体司法主张**；**而这一条与\"旅卦'明慎用刑，而不留狱'\"、\"丰卦'明与威并行'\"合成一组\"慎断\"的判断**。","o":"TJ-0606 · 天纪·人间道·中孚卦（PDF 第129页）"},{"t":"二百一十三、中孚六爻：信的六种成色","h":"初、二爻：\"虞吉\"与\"鸣鹤在阴\"","c":"要点——**初爻\"虞吉。有它，不燕\"**：\"**阳刚居始进，于中孚之道并非了解——人初志必不定，故如能以'愚诚信之'、且专一之志，若生异志，必不得安矣。**\"其\"象\"：\"**始信之时，志未能从——但能'愚诚专一至信'，则吉矣。故吾人初始，必'求能为己所信之道'，方以愚诚——如此方不致迷。**\" **\"必求能为己所信之道，方以愚诚\"这一句，是\"信\"的起点**：**先找到\"自己能信的东西\"，再用\"愚诚\"（笨拙的、不耍聪明的诚）对它**（**即：诚不能乱给，得先\"择其所信\"。**）** **而\"若生异志，必不得安\"是它的警戒**：**\"异志\"（另外的打算）一出来，就\"不得安\"**（**因为\"诚\"一旦分散，就不再是\"诚\"。**）** **第二爻\"鸣鹤在阴，其子和之，我有好爵，吾与尔靡之\"**，是全卦最美的取象：\"**内刚外柔，阳居阴位——中孚之感，因外柔必能感通：犹鹤鸣于幽谷，人不闻也，而其子必应和，乃心感通也。故能'中心孚诚，千里能感之，能化邦国'。**\"其\"象\"：\"**子能与合，乃中心诚意能通故也。**\" **\"鹤鸣于幽谷，人不闻也，而其子必应和\"这一句极准**：**鹤在深谷里叫，外面的人听不见——而它的孩子一定回应**（**因为\"心感通\"不需要\"声音传得到\"）。** **即：真正的\"感通\"不看\"传得多远\"，看\"是不是同一个频\"。** **须说明**：**这是《易经》原文（中孚卦初、二爻）**；**\"虞\"取\"安、度\"义，\"燕\"通\"宴\"（安）**；**\"好爵\"是\"好的酒器\"（引申为\"好东西\"），\"靡\"是\"共、系\"**；**其可用的核极准**：\"**中心孚诚，千里能感之**\"——**这与\"咸卦'须以默而观之'\"、\"兑卦'刚中柔外'\"是同一组的第三处**（**三处都在说\"诚\"的传播方式：不靠声音，靠同频**）。","o":"TJ-0607 · 天纪·人间道·中孚卦·初、二爻（PDF 第129~130页）"},{"t":"二百一十三、中孚六爻：信的六种成色","h":"第三、四爻：\"或鼓或罢，或泣或歌\"与\"马匹亡\"","c":"风险——**第三爻\"得敌，或鼓或罢，或泣或歌\"**：\"**柔居阳刚之位，居位高但才不能济——故势必唯所信而从：其外在之'鼓张、罢废、悲泣、欢歌'皆因导于内心之所信。因才不足，故'只有信，而不知吉凶'——此非长才之君。**\"其\"象\"：\"**居不适位，无所心主，惟能从于所信而已。**\" **\"其外在之鼓张、罢废、悲泣、欢歌皆因导于内心之所信\"这一句极精**：**一个人的\"兴高采烈\"与\"垂头丧气\"，都是被\"他所信的东西\"牵着走的**——**而\"才不足\"的时候，\"信\"就代替了\"判断\"。** **而\"因才不足，故只有信，而不知吉凶\"是它的病**：**他有\"信\"，但\"不知吉凶\"（分不出好坏）**（**即：诚不解决问题，诚只保证\"不虚\"。**）** **第四爻\"月几望，马匹亡，无咎\"**：\"**近君之位，以柔顺得信——其盛必如月之满盈；即同类同属亡失，亦可无咎。**\"其\"象\"：\"**求上之孚信，即令同类亡，亦不顾而求——此所以吉也。**\" **\"马匹亡\"（同伴都走了）这个代价很实在**：**为了\"求上之孚信\"（得到上面的信任），\"同类\"（同级别的人）会走光**——**而讲义判它\"无咎\"。** **须说明**：**这是《易经》原文（中孚卦第三、四爻）**；**\"罢\"（bà）是\"停止、废\"**；**其可用的核极准**：**\"诚\"不能替代\"才\"**（**第三爻有诚而无才，所以\"不知吉凶\"**）；**而\"信\"也有代价**（**第四爻\"马匹亡\"：**得了上面的信，就失了同伴**）——**这一条与\"萃卦'有孚不终'\"、\"比卦'比之无首'\"合成一组\"信的代价\"**。","o":"TJ-0608 · 天纪·人间道·中孚卦·第三、四爻（PDF 第130页）"},{"t":"二百一十三、中孚六爻：信的六种成色","h":"第五、上爻：\"有孚挛如\"与\"翰音登于天\"","c":"方法——**第五爻\"有孚挛如，无咎\"**：\"**君位之人，以中孚至诚之道，感通天下——民心之信服，'固结如抽掣也'。**\"其\"象\"：\"**五居君位以阳刚，用中正之道，天下民心固结信服——其称位如此，君之道乃能致极矣。**\" **\"固结如抽掣\"（像被抽紧的绳子那样结实）这个比喻很实在**：**\"挛\"（luán）是\"牵连、蜷曲\"**——**即：民心与上位者的关系，是\"缠在一起、抽紧了\"的**（**而\"抽掣\"（chè）是\"拉紧\"。**）** **上爻\"翰音登于天，贞凶\"**，是全卦最重的一条：\"**中诚孚信致于极——'有信终则衰'：华美其外，内无忠笃，犹'翰音登天'；不知止之、贞固如此、不知变，乃自招凶。孔子曰'好信不好学，此敝也贼'——意即固守而不通也。**\"其\"象\"：\"**守诚信至穷极而不知变，必不能长久——此固守不知变之戒，招凶至矣。**\" **\"翰音登于天\"（鸡的叫声传到天上）这个取象极冷**：**\"翰音\"是\"鸡鸣\"——鸡不会飞，但它的\"叫声\"能上到天**（**即：\"声音上去了，东西还在原地\"。**）** **而讲义解作\"华美其外，内无忠笃\"**：**外面越来越漂亮，里面越来越空**（**这与\"贲卦'今人但求外饰不求内实'\"、\"归妹'女承筐无实'\"是同一组**）。** **而\"有信终则衰\"这四个字，是\"诚\"的限度**：**\"信\"到极点，也会\"衰\"**（**因为\"极\"就是\"不能再往上了\"。**）** **须说明**：**这是《易经》原文（中孚卦第五、上爻）**；**\"翰音\"是\"鸡鸣\"（《礼记》\"翰音\"即\"鸡\"）**；**其可用的核极准**：**\"好信不好学，此敝也贼\"这一句**——**\"好信\"（喜欢守信）而\"不好学\"（不肯学习、不肯分辨），结果是\"敝\"（蔽塞）与\"贼\"（害）**（**即：诚而不学，诚就变成\"固执\"。** **这一句与\"第三爻'只有信而不知吉凶'\"正好接上**）。","o":"TJ-0609 · 天纪·人间道·中孚卦·第五、上爻（PDF 第130页）  ---"},{"t":"二百一十四、小过：以过养正","h":"卦序与卦辞：\"过之意在过其正常\"","c":"定义——小过卦（雷山小过）卦题为\"**飞鸟遗音之课，上逆下顺之象**\"（**占例：汉君有难，卜得之，后果脱险也**），其卦序：\"**人之有信后必行，行则生过——故小过所以为中孚序也。此卦山上有雷，雷震于高处，其声必过，故为小过。小过者，可说为'小事过'，亦可说为'过之小'也。**\" **\"人之有信后必行，行则生过\"这一句，是\"中孚→小过\"的枢纽**：**有\"信\"就会去\"行\"，而一\"行\"就会\"生过\"**（**即：错不是\"诚\"的反面，是\"诚\"的产物**——**因为不做事的人不会错，做事的人一定会错）。** **卦辞\"小过：亨，利，贞\"**，其解是全书对\"过\"最精的一段：\"**过之意在'过其正常'也——如'矫枉过正'，此过为'就正'意。'时不正，用过之道使正'，此过之吉处。吾人须知'过之道'、'知用过之时机'方如是。**\" **\"矫枉过正，此过为'就正'意\"这一句极精**：**把弯的东西扳正，一定会扳过头**——**而\"扳过头\"这个\"过\"，目的是\"就正\"（朝正的方向）。** **即：有一种\"过\"不是错，是\"把不正的弄正\"。** **而\"时不正，用过之道使正\"是它的前提**：**只有在\"时不正\"（环境本身是歪的）的时候，\"用过\"才是对的**（**而\"知用过之时机\"是它的条件）。** **卦图六物**：**①\"明月当空：政清状，入法庭，刑堂\"**；**②\"林下一人：林姓人\"**；**③\"人陷网中：不得脱身，受束缚\"**；**④\"一人弹冠：求去之象，但求去为形，束缚为神，合则有表里不一状\"**；**⑤\"一人割网：贵人解救，脱困状\"**；**⑥\"猴子在山头：重新开始之课（候再出山）\"**。** 其中\"**一人弹冠**\"一物的解法极精**：**\"求去为形，束缚为神，合则有表里不一状\"**——**即：嘴上说要走（形），心里还系着（神）**（**而这就是\"过\"的常见状态：动作做了，心里没走）。** **须说明**：**这是讲义对小过卦序与卦图的注解**；**\"小过\"的两读是\"'小事上的过'\"与\"'过得很小'\"**。","o":"TJ-0610 · 天纪·人间道·小过卦（PDF 第131页）"},{"t":"二百一十四、小过：以过养正","h":"卦辞续与彖：\"宜下\"与\"以过养正\"","c":"要点——小过卦辞的续句\"**可小事，不可大事，飞鸟遗之音，不宜上，宜下，大吉**\"，其解：\"**用过之道，乃为求'中正'——其过之限：可用'小事'，于'大事'不可用过。故曰'不宜上，宜下'——顺之则吉，乃过能顺理，吉反更大也。**\" **\"用过之道，乃为求中正\"这一句，是\"过\"的定位**：**\"过\"的目的是\"回到中正\"，不是\"走得更远\"**——**所以\"其过之限\"很清楚：小事可用，大事不可用。** **而\"不宜上，宜下\"是方向**：**\"过\"要往下（更谦、更退、更俭），不要往上（更强、更争、更显）**（**因为往下的\"过\"伤不到人，往上的\"过\"会）。** **而\"过能顺理，吉反更大也\"这一句很有意思**：**同样是\"过\"，顺理的那个\"吉\"反而比\"不过\"更大**（**即：该\"过\"而\"过\"，比\"不敢过\"更吉）。** **彖\"小过，小者过而亨也。过以利贞，与时行也\"**：\"**小过之道，在'过之小'——有时当过，过而能致亨，过之能吉矣。但用过之道，须配合时机：乃意'当过则过'——此非真过矣，此'以过养正'也。**\" **\"此非真过矣，此以过养正也\"这一句极精**：**\"当过则过\"不叫\"过错\"，叫\"以过养正\"**（**即：用一点点\"过头\"，把\"不正\"养回\"正\"。**）** **须说明**：**这是《易经》原文加讲义之解**；**其可用的核极准**：**\"以过养正\"成立的条件有三**——**①\"时不正\"（环境确实歪了）；②\"过在事小\"（不涉大是大非）；③\"顺理\"（方向是往下的、收敛的）**；**三条缺一，\"过\"就变回\"过\"。**","o":"TJ-0611 · 天纪·人间道·小过卦（PDF 第131页）"},{"t":"二百一十四、小过：以过养正","h":"彖续与象：\"飞鸟遗之音\"与\"当过而过\"","c":"方法——小过\"彖\"的续段\"**柔得中，是以小事吉也；刚失位而不中，是以不可大事也。有飞鸟之象焉**\"：\"**小过之道，处小事之过，可得吉；但不可做大事——因'刚失位又不得中'，故不可用在大事上。故有飞鸟之象：鸟飞之事小，过而余音，但无灾也。**\" **\"飞鸟遗之音，不宜上宜下，大吉，上逆而下顺也\"**，其解极美：\"**事之有过，当从其宜——如人之'过恭、过哀、过俭'，其太过则不可。其过当如'飞鸟之遗音'：其声出，而身已过——事之过当如是，则吉宜。此'顺道之过'故也。**\" **\"其声出，而身已过\"这七个字，是\"过\"的最佳形态**：**鸟飞过去了，声音才留下**——**即：人已经\"过去\"了，只留下一点痕迹**（**而不是\"停在那里喊\"）。** **而\"过恭、过哀、过俭\"三种\"过\"，正是\"往下的过\"**（**它们是\"礼\"上的过，不是\"权\"上的过**）。** **而象\"山上有雷，小过；君子以行过乎恭，丧过乎哀，用过乎俭\"**：\"**雷震于山上，其声至，而雷已过，故为小过——君子观象，知'天下事有时当过，但不可过甚'——故为小过，'当过而过，乃其宜也'。**\" **\"其声至，而雷已过\"与\"其声出，而身已过\"是同一取象**：**雷响的时候，雷已经走了**——**即：真正\"该过\"的那个\"过\"，是\"做过就过\"，不是\"停在那里过\"。** **须说明**：**这是《易经》彖传与象传原文加讲义之解**；**其可用的核极准**：**\"过恭、过哀、过俭\"这三条，是\"过\"的三个安全区**（**而\"过甚\"是它的边界**）；**注意\"当过而过，乃其宜也\"一句**——**它承认\"有时就该过头一点\"**（**这与\"节卦'过与不及皆非节'\"不是矛盾，而是\"节\"讲\"量\"，\"小过\"讲\"该偏的时候偏\"**）。","o":"TJ-0612 · 天纪·人间道·小过卦（PDF 第131~132页）"},{"t":"二百一十五、小过六爻：过的三种形态","h":"初、二爻：\"飞鸟以凶\"与\"过其祖，遇其妣\"","c":"风险——**初爻\"飞鸟以凶\"**：\"**阴柔居下位，为小人之象——小人本躁易动；今逢小过时，乃'得理不饶人'，其行为之过必速且远，救之莫及也，故凶。**\"其\"象\"：\"**过之疾，如鸟之速，必救之不及，无有作为也。**\" **\"得理不饶人\"四个字，是\"过\"的第一种恶形态**：**不是\"没理\"，是\"有理而过度\"**——**而\"其行为之过必速且远\"，一发作就\"救之莫及\"。** **第二爻\"过其祖，遇其妣，不及其君，遇其臣，无咎\"**，讲义给了一个极细的\"越位\"刻度：\"**二与五爻位，其犹'祖'之象——今阴柔居其位，越过三、四位，直与五相应，有'越位'之戒。今逢该过之时：如过越位，'仍不失臣道'，亦可无咎。于其他之卦，越过本位凶；但今于小过，乃意'当过之时'，可过，无灾——切忌失君臣之道、及过之太过，反凶。**\"其\"象\"：\"**下臣遇须过之时，可过越其上位，但不可至君位——至君前则太过，'过一爻可无咎'。**\" **\"过一爻可无咎\"这一句，是\"过\"的量化**：**\"过\"可以过\"一爻\"（一级），不能过到\"君位\"（最高处）。** **即：在\"当过之时\"，可以越一级，但不能越到最后一级。** **须说明**：**这是《易经》原文（小过卦初、二爻）**；**\"妣\"（bǐ）是\"祖母\"**；**其可用的核极准**：**\"过\"有\"刻度\"**——**小过卦在\"其他之卦\"里是\"越位即凶\"，在这里是\"过一爻可无咎\"**（**而\"至君前则太过\"就是它的红线**）。","o":"TJ-0613 · 天纪·人间道·小过卦·初、二爻（PDF 第132页）"},{"t":"二百一十五、小过六爻：过的三种形态","h":"第三、四爻：\"弗过防之\"与\"弗过遇之\"","c":"方法——**第三爻\"弗过防之，从或戕之，凶\"**：\"**阳居正位，于小过之时，意味'手下无能，又为阴之小人蒙蔽'——此时须'过防之'。如不加强防范，必招害。'君子防小人之道，以正己为先'，坚守正道也。**\"其\"象\"：\"**小人道盛，必害于君子——当防而不防，必伤矣。**\" **\"过防之\"（在防备上\"过头一点\"）这一句，与\"行过乎恭\"同一类型**：**\"过\"在\"防备\"上是安全的**（**因为\"防过头\"最坏是\"多疑\"，而\"防不足\"最坏是\"被害\"）。** **而\"君子防小人之道，以正己为先\"这一句极准**：**防人的第一步不是\"盯着别人\"，是\"把自己弄正\"**（**因为\"自己不正\"，就\"防不住\"——别人一挑就动）。** **第四爻\"无咎，弗过遇之，往厉必戒，勿用永贞\"**（**讲义原文在此页未完，下一段续解**）。**从爻辞可读出三层**：**\"弗过遇之\"（不过分，遇到就好）→\"往厉必戒\"（往前有危险，必须警戒）→\"勿用永贞\"（不要一直固守不变）**。** **须说明**：**这是《易经》原文（小过卦第三、四爻）**；**\"戕\"（qiāng）是\"伤害\"**；**其可用的核极准**：**\"过防之\"与\"过恭\"一样，是\"过\"的安全方向——往\"更谨慎\"那边偏**；**而\"以正己为先\"是它的前提**（**这与\"蹇卦'反身修德'\"、\"姤卦'姤其角'（远离乃肇因于己）\"是同一判断**）。","o":"TJ-0614 · 天纪·人间道·小过卦·第三、四爻（PDF 第132页）  ---"},{"t":"二百一十六、小过后三爻：过之三种结局","h":"第四爻：\"以刚而用柔\"与\"终不可成长至盛\"","c":"要点——**第四爻\"无咎，弗过遇之，往厉必戒，勿用永贞\"**：\"**刚居柔位，以刚而用柔，其刚必不过也，故无灾咎。刚阳之道居小过时，须戒之随宜，不可固守不变——故君子随时顺处，不固守其常也。**\"其\"象\"：\"**阳刚居柔位，不当位——于当过之时，能'不过刚反柔'，乃得其宜，于自保可也；但终不可成长至盛，故往则有危，须戒之。**\" **\"以刚而用柔，其刚必不过也\"这一句，是\"过\"的安全阀**：**刚的东西放在柔的位置上，它自己就\"不过\"了**（**即：位置本身在替你刹车）。** **而\"君子随时顺处，不固守其常也\"是它的心法**：**\"随时\"（跟着时候改），\"不固守其常\"（不把老规矩死抱着）**——**这与\"小过\"卦名正相反：这一卦专门讲\"该过则过\"，所以\"固守常态\"本身就成了毛病。** **而象辞的三个判断要分开记**：**①\"于自保可也\"（能自保）；②\"终不可成长至盛\"（但长不成大事）；③\"往则有危，须戒之\"（往前就危险）。** **即：这一爻\"无咎\"是有上限的——自保可以，进取不行。** **须说明**：**这是《易经》原文（小过卦第四爻）**；**其可用的核极准**：**\"位置\"可以替代\"自律\"**（**放在合适的位置上，缺点会自动被压住一半**）——**但\"压住\"不等于\"没有\"**（**所以\"终不可成长至盛\"**）。","o":"TJ-0615 · 天纪·人间道·小过卦·第四爻（PDF 第142页）"},{"t":"二百一十六、小过后三爻：过之三种结局","h":"第五爻：\"密云不雨\"与\"无阳而不成雨\"","c":"风险——**第五爻\"密云不雨，自我西郊，公弋取彼在穴\"**，讲义给了一个极准的机制解释：\"**此阴柔居君位，居当过之时，乃'不够阳刚'——故虽欲过，但不能成功。故犹如密云而不成雨；其不成功：即令越过其位向二爻相应，三、四爻位不应，亦如同密云集中，而无法成雨。**\"其\"象\"：\"**阳下阴上，合则成雨——今阴已在上，即令云再密，无阳而不成雨，终无功也。**\" **\"阳下阴上，合则成雨\"这一句，是\"成事\"的物理条件**：**阳气在下（往上升），阴气在上（往下降），两下相遇才下雨**（**而现在\"阴已在上\"——位置挡住了，所以\"云再密也不成雨\"）。** **即：不是\"材料不够\"，是\"位置错了\"。** **而\"虽欲过，但不能成功\"这一句很实在**：**\"想'过'（想做点过头的事）\"的意愿有了，但\"不够阳刚\"——所以做不成**（**即：有些事\"想做\"和\"做得成\"之间，差的是\"质地\"，不是\"努力\"。**）** **须说明**：**这是《易经》原文（小过卦第五爻）**；**\"弋\"（yì）是\"用带绳的箭射\"**；**其可用的核极准**：**\"密云不雨\"是一个极好的\"未成\"意象**——**条件看起来都齐了（云密），但缺一个关键（阳）**；**而\"缺的那一个\"往往是\"位置\"或\"质地\"，不是\"数量\"**。","o":"TJ-0616 · 天纪·人间道·小过卦·第五爻（PDF 第142页）"},{"t":"二百一十六、小过后三爻：过之三种结局","h":"上爻：\"弗遇过之，飞鸟离之\"与\"过至亢极\"","c":"风险——**上爻\"弗遇过之，飞鸟离之，凶，是谓灾眚\"**：\"**六居小过之极——居过之极，不顾正理，必违常道，远矣，故凶，必招人为灾害也。'此于天理人事皆同'。**\"其\"象\"：\"**居过之终，失正理之甚，乃过至亢极，故招凶致。**\" **\"不顾正理，必违常道\"这八个字，是\"过\"的最后一步**：**不是\"过了一点点\"，是\"完全不看正理\"**——**而\"必违常道，远矣\"（离常道已经很远了）。** **而\"必招人为灾害也\"这个定性极准**：**灾不是天降的，是\"人\"招的**（**因为它写的是\"人为灾害\"。**）** **而\"此于天理人事皆同\"这一句，把《易》与\"人事\"接上了**：**天理与人事，在这一层上是同一条**（**即：没有\"天上另有一套规矩\"。**）** **须说明**：**这是《易经》原文（小过卦上爻）**；**\"灾眚\"（shěng）是\"天灾与人为的过失\"**；**其可用的核极准**：**\"过\"的三个结局在这一卦里齐了**——**初爻\"飞鸟以凶\"（过得太快）、第五爻\"密云不雨\"（过不成）、上爻\"过至亢极\"（过到顶）**；**而三条共用一个判断：过之极必招灾**（**这与\"乾卦'亢龙有悔'\"是同一处毛病**）。","o":"TJ-0617 · 天纪·人间道·小过卦·上爻（PDF 第142页）"},{"t":"二百一十七、既济卦：思患而豫防之","h":"卦序：\"能过于物，必能相济\"","c":"定义——既济卦（水火既济）卦题为\"**舟楫济川之课，阴阳配合之象**\"（**占例：季布在周家潜藏，卜得之，遂遇高皇帝**），其卦序：\"**小过乃过于物，能过于物，必能相济——故受之以既济。此卦，水在上、火在下，火水相交，则能为用；能互为用，即为既济。此卦言：天下万事，己互济之时也。**\" **\"能过于物，必能相济\"这一句，是\"小过→既济\"的枢纽**：**\"过\"了那个\"物\"（越过了障碍），才能\"相济\"（两边接上）**（**即：先要\"过得去\"，才能\"合得上\"。**）** **而\"水在上、火在下，火水相交，则能为用\"是既济的卦体象**：**水在上往下走，火在下往上走，两者在中相遇，所以\"能为用\"**（**而\"能互为用，即为既济\"——注意是\"互为用\"，不是\"各有其用\"。**）** **而\"天下万事，己互济之时也\"这一句，是它的范围**：**既济讲的是\"所有事都接上了\"的那个时刻**（**而这个时刻，恰恰是最危险的时刻——见下条。**）** **卦图六物**：**①\"人在岸上：泣也，等待也，无目的也\"**；**②\"一船来：接引至也\"**；**③\"一堆钱：财禄无用也，忧心忡忡也，有窃象，抄家之象\"**；**④\"云中雨下：阴中有果也，夜间至凌晨时\"**；**⑤\"二小儿：主喜也，二人也，二人雨中行也\"**；**⑥\"文书一策：证件，命令也，资料也\"**。** 其中\"**一堆钱：财禄无用也……有窃象，抄家之象**\"一物最反常**：**\"钱\"在这里不是\"富\"，是\"无用\"与\"抄家\"**（**即：到了\"既济\"的时候，\"财\"反而不解决问题。**）** **须说明**：**这是讲义对既济卦序与卦图的注解**；**\"既济\"的\"既\"是\"已经\"，\"济\"是\"渡过\"**。","o":"TJ-0618 · 天纪·人间道·既济卦（PDF 第133页）"},{"t":"二百一十七、既济卦：思患而豫防之","h":"卦辞与彖：\"初吉，终乱\"与\"其道穷也\"","c":"风险——既济卦辞为\"**既济：亨小，利贞，初吉，终乱**\"，其解：\"**既济之时，大事必能亨通——然须知'小事亦须亨通'，方可为吉；必须'所有事皆吉'，否则'济至极时，终乱'。**\" **\"必须所有事皆吉，否则济至极时，终乱\"这一句，把\"初吉终乱\"讲透了**：**\"既济\"不是\"一件大事办成了\"，是\"连小事也都顺了\"**（**而只要还有一件不顺，那个\"不顺\"就会在\"济至极时\"长成\"乱\"。**）** **即：\"乱\"不是从\"坏\"里长出来的，是从\"没处理干净的那一点\"里长出来的。** **彖\"既济亨，小者亨也。利贞，刚柔正而位当也\"**：\"**阴阳能皆得位，故为既济——但须'无所不亨'，乃可也；且贞固守之。**\" **彖续\"初吉，柔得中也。终止则乱，其道穷也\"**：\"**其以'柔顺文明之中道'，故可成既济之功；至既济之极，若不知变通，必生乱——其乱之生乃'因道至尽穷'。**\" **\"至既济之极，若不知变通，必生乱\"这一句，是\"终乱\"的机理解释**：**不是\"事情坏了\"，是\"路走到头了还不改\"**（**而\"其乱之生乃因道至尽穷\"——\"道\"穷了，\"乱\"才来。**）** **须说明**：**这是《易经》原文加讲义之解**；**其可用的核极准**：**\"初吉，终乱\"是\"完成\"这件事自带的属性**（**因为\"完成\"就是\"不能再往前走\"，而\"不能往前走\"就会开始\"往回走\"**）；**而\"若不知变通\"是唯一的解法**——**这与\"革卦'治历明时'\"、\"井卦'改邑不改井'\"构成一组\"变与不变\"**。","o":"TJ-0619 · 天纪·人间道·既济卦（PDF 第133页）"},{"t":"二百一十七、既济卦：思患而豫防之","h":"象与初爻：\"思患而豫防之\"与\"曳其轮\"","c":"方法——既济\"象\"为\"**水在火上，既济；君子以思患而豫防之**\"，其解：\"**水火既交，各有其用，为互济——时当既济，君子观象知'于既济之时，必先思虑患害之生'，使不至成祸患也。'自古以来，天下由治而乱，乃皆因居治不思乱时之戒'。**\" **\"自古以来，天下由治而乱，乃皆因居治不思乱时之戒\"这一句极狠**：**乱不是从\"乱\"里来的，是从\"治的时候不想乱\"里来的**（**即：\"治\"本身在养\"乱\"的种子——因为治的人不再看远处。**）** **\"思患而豫防之\"两个动作要分开**：**\"思患\"（想得到患在哪里）、\"豫防\"（提前防）**（**而\"豫\"（预）这个字要紧：防要在\"还没发生\"的时候。**）** **初爻\"曳其轮，濡其尾，无咎\"**：\"**倒曳轮，使不再进——兽之涉水，必举高其尾，使尾不湿方可进，无灾至。**\"其\"象\"：\"**于既济大吉之时，能知止进，则必不至极时，故必无咎也。**\" **\"倒曳轮，使不再进\"是一个主动的\"刹车\"动作**：**把车轮往后拖，让它走不动**（**而\"兽之涉水，必举高其尾\"是另一个比喻：尾巴翘起来，才不会湿——即：要害护住了才敢过。**）** **\"于既济大吉之时，能知止进，则必不至极时\"这一句，是既济卦唯一的\"防乱\"手段**：**在最顺的时候主动停一下**（**因为\"极时\"就是\"终乱\"那个点，而\"止进\"就是不去那个点。**）** **须说明**：**这是《易经》象传、初爻原文加讲义之解**；**其可用的核极准**：**\"思患而豫防之\"与\"曳其轮\"是一对**——**一个在\"想\"，一个在\"动\"**（**而\"曳其轮\"的可贵在于：它是\"自己给自己减速\"，不是\"等别人来刹\"。**）","o":"TJ-0620 · 天纪·人间道·既济卦·象、初爻（PDF 第133页）  ---"},{"t":"二百一十八、既济后五爻：守成时代的五种病","h":"第二爻：\"妇丧其茀\"与\"时之未至\"","c":"要点——**第二爻\"妇丧其茀，勿逐，七日得\"**：\"**阴居正位，得五君位应，其志必得遂行——但中正之道，不可废也：犹妇人出门用茀遮己，今丧其茀，则不行。能自守不失，道必复也，待时之至。**\"其\"象\"：\"**因中正之道非不可用，乃'时之未至'——于此时自守其中，俟时至必能行矣。**\" **\"中正之道非不可用，乃时之未至\"这一句极精**：**\"道\"没有问题，是\"时候\"没到**（**而人最容易在这里误判——把\"时未至\"读成\"道不行\"，然后就把道改了）。** **而\"能自守不失，道必复也\"是它的解法**：**守住，道自己会回来**（**而\"待时之至\"是唯一要做的动作。**）** **须说明**：**这是《易经》原文（既济卦第二爻）**；**\"茀\"（fú）是古代妇女车上的遮蔽物**；**其可用的核极准**：**\"勿逐\"（不要去追）与\"七日得\"（过一段时间自己回来）是一对**——**而\"七日\"是《易》里的常用周期（复卦\"七日来复\"同此）**。","o":"TJ-0621 · 天纪·人间道·既济卦·第二爻（PDF 第134页）"},{"t":"二百一十八、既济后五爻：守成时代的五种病","h":"第三爻：\"高宗伐鬼方\"与\"小人勿用\"","c":"风险——**第三爻\"高宗伐鬼方，三年克之，小人勿用\"**：\"**以刚居刚位，居既济时，其君主威武必令民心服——但若'专肆威武'，必令民心忿而不服，残害人民，贪人民之富，故有'小人勿用'之戒：因'惟小人其威武必为满足其私欲'，君子戒之。**\"其\"象\"：\"**既济之时，必济天下——于高宗可也，乃因其'心为民'，道必正；如为'己之私欲'，则三年民必疲惫而终忿矣。**\" **\"若专肆威武，必令民心忿而不服\"这一句，是\"武力\"的边界**：**\"威武\"能让人\"服\"，但\"专肆威武\"就变成\"忿而不服\"**（**而分别就在\"为什么用\"。**）** **而\"惟小人其威武必为满足其私欲\"是它的定性**：**同样的\"威武\"，君子用它\"济天下\"，小人用它\"满足私欲\"**（**而讲义给了一个极简的判别：看这三年里\"民\"是\"济\"了还是\"疲惫\"了。**）** **\"三年克之，惫也\"这个评语极冷**：**\"克\"（打赢了）——而代价是\"惫\"（疲惫）**（**即：赢了，但赢的方式把家底耗空了。**）** **须说明**：**这是《易经》原文（既济卦第三爻）**；**\"鬼方\"是商周时期的西北部族**；**其可用的核极准**：**\"三年\"这个时间尺度本身是个提醒**——**有些胜利要\"三年\"才能拿到，而\"三年\"的代价必须算进去**（**这与\"师卦'师出以律，即胜亦凶'\"是同一判断**）。","o":"TJ-0622 · 天纪·人间道·既济卦·第三爻（PDF 第134页）"},{"t":"二百一十八、既济后五爻：守成时代的五种病","h":"第四、五爻：\"终日戒\"与\"禴祭\"","c":"方法——**第四爻\"繻有衣袽，终日戒\"**：\"**四近君位，阴柔居之，乃适其任。当既济之时，'须如行舟，戒之渗漏——始漏则塞以衣物'，且终日戒惧不怠，则必可免患。**\"其\"象\"：\"**当既济之时，必疑其患之将至——其戒惧之心如此，谨慎如此。**\" **\"须如行舟，戒之渗漏——始漏则塞以衣物\"这一句，是全书对\"防微\"最好的比喻**：**船漏水，一发现就用衣物去塞**（**而\"始漏\"两个字最要紧：要在\"刚开始漏\"的时候塞，等漏大了，衣物就塞不住了）。** **而\"必疑其患之将至\"这个\"疑\"字用得极准**：**不是\"确定有患\"，是\"疑它有\"**（**而正是这种\"疑\"，让人\"终日戒惧不怠\"。**）** **第五爻\"东邻杀牛，不如西邻之禴祭，实受其福\"**，是全书对\"读《易》\"最重要的一次自述：\"**九五至尊君位，阳刚人居此，当既济之时，必以至诚信孚如祭祀之诚——则即令薄礼之祭，也可胜于丰厚之祭，由其至诚之心使然也。'易之不重形，而重神'，此明而显矣。故'论易须知时，方可得易之神明矣'。**\" **\"易之不重形，而重神\"这一句，是\"杀牛不如禴祭\"的全部理由**：**东邻杀牛（丰厚的祭品）不如西邻禴祭（薄礼）**——**因为\"重\"的是\"神\"（诚），不是\"形\"（物）。** **而\"论易须知时，方可得易之神明\"是它的方法**：**\"神\"不在卦辞里，在\"时\"里**（**即：同一个卦，在不同的\"时\"里，意思不一样。**）** **须说明**：**这是《易经》原文（既济卦第四、五爻）**；**\"繻\"（rú）是细密的丝织品，\"袽\"（rú）是破旧衣物（塞漏用）**；**\"禴\"（yuè）是\"薄祭\"**；**其可用的核极准**：**\"始漏则塞以衣物\"与\"必疑其患之将至\"是一对**——**一个讲\"动作要早\"，一个讲\"心态要疑\"**；**而\"重神不重形\"给了\"礼\"的判据**（**这与\"损卦'二簋可用享'\"、\"贲卦'白贲无咎'\"是同一判断**）。","o":"TJ-0623 · 天纪·人间道·既济卦·第四、五爻（PDF 第134页）"},{"t":"二百一十八、既济后五爻：守成时代的五种病","h":"上爻：\"濡其首，厉\"","c":"风险——**上爻\"濡其首，厉\"**：\"**既济至极时，必不安而危——今阴柔居之，居坎险之上，即既济之终，小人居之，其败坏必立可见矣。**\"其\"象\"：\"**穷尽之须以水淋其首，其必不可长久也。**\" **\"既济至极时，必不安而危\"这一句，与卦辞\"初吉终乱\"首尾相应**：**\"既济\"到\"极\"，就是\"不安而危\"**（**而这正是\"曳其轮\"（第一爻）要防的那个点——防住了，就到不了这里。**）** **而\"濡其首\"（头都湿了）这个意象，比初爻的\"濡其尾\"（尾巴湿了）重得多**：**初爻只是\"尾\"湿（还能退），上爻是\"首\"湿（连头都进去了）**。** **即：同样一条河，湿\"尾\"是\"进不去\"，湿\"首\"是\"出不来了\"。** **须说明**：**这是《易经》原文（既济卦上爻）**；**其可用的核极准**：**既济卦六爻给了\"守成\"时代的五种病**——**第二爻\"茀丢了却想追\"（不肯等时）、第三爻\"专肆威武\"（用力过度）、第四爻\"不戒渗漏\"（不管小漏）、第五爻\"重形而轻神\"（只看排场）、上爻\"濡其首\"（退不出来）**；**而药方只有一条：思患而豫防之**。","o":"TJ-0624 · 天纪·人间道·既济卦·上爻（PDF 第134页）"},{"t":"二百一十九、未济卦：物必不会终尽","h":"卦序：\"易为变易而不尽，有生生之意\"","c":"定义——未济卦（火水未济）是六十四卦的**终卦**，卦题为\"**碣火求珠之课，忧中望喜之象**\"（**占例：孔子穿九曲明珠未彻，卜得之，乃遇二女方始得穿也**——**即：孔子穿不成\"九曲明珠\"（珠孔曲曲折折的珠子），占到这一卦，遇到两位女子才穿成**）。其卦序：\"**物必不会终尽，故以未济为《易》卦之终。既济为物之终；《易》为变易而不尽，有'生生之意'，故未济为其序。未济为'未穷尽'也。此卦，上离下坎，火在水上，互不为用，为未济之时义。**\" **\"物必不会终尽\"这一句，是《易》放\"未济\"在最后的理由**：**六十四卦不能以\"既济\"（完成）收尾**（**因为\"完成\"就是\"死\"，而《易》讲的是\"生生\"**）。** **而\"《易》为变易而不尽，有生生之意\"是全书的自我定位**：**《易》不是\"一套答案\"，是\"一套一直在变的道理\"**（**所以它必须以\"没完成\"结尾。**）** **而\"火在水上，互不为用\"是未济的卦体象**：**火往上走，水往下走，两者越走越远**（**而\"既济\"是水在上、火在下，两者在中相遇——两卦正好相反。**）** **卦图五物**：**①\"一人提刀斧：刘姓，武官，手有生杀之权\"**；**②\"一虎坐：肖虎人，王姓，虎坐乃无威之象\"**；**③\"一旗卓在山上：揭竿而起，正义之师\"**；**④\"一人取旗：代替也，高姓、宋姓，其人取代之象\"**；**⑤\"梯子有至字：无刀日至，桎梏受困象\"**。** 其中\"**一虎坐：虎坐乃无威之象**\"一物极精**：**老虎坐着（不动），就没有威了**（**即：威是靠\"动\"存在的，一\"坐\"就散。**）** **须说明**：**这是讲义对未济卦序与卦图的注解**；**\"汔\"（qì）是\"接近\"**；**其可用的核极准**：**\"物必不会终尽\"给了全书一个开放的结尾**（**即：读完了六十四卦，事情还没完**）。","o":"TJ-0625 · 天纪·人间道·未济卦（PDF 第135页）"},{"t":"二百一十九、未济卦：物必不会终尽","h":"卦辞与彖：\"小狐汔济\"与\"虽不当位，刚柔应也\"","c":"要点——未济卦辞为\"**未济：亨。小狐汔济，濡其尾，无攸利**\"，其解：\"**未济之时，亦有亨通之道——假如小狐不知慎，逞其壮勇，渡河不知慎，其终必不能济，故无所利矣。**\" **\"小狐汔济\"（小狐狸快渡过河了）这个取象极准**：**它已经走到\"快到了\"（汔），然后\"濡其尾\"（尾巴湿了）**——**即：败在\"最后一步\"。** **彖\"未济亨，柔得中也。小狐汔济，未出中也\"**：\"**未济之时，能亨通，乃因其柔居中得其时——'慎处之于未济时，可以亨通也'。如小狐之果敢于渡河、如不忧其尾湿，必不可脱险也。**\" **\"慎处之于未济时，可以亨通\"这一句，是\"未济\"的药**：**不是\"更用力\"，是\"更慎重\"**（**而\"如不忧其尾湿，必不可脱险\"是它的反证：不担心尾巴湿，就出不来。**）** **彖续\"濡其尾，无攸利，不续终也。虽不当位，刚柔应也\"**：\"**其进虽勇，因'尾濡'而不能进，故不利往也。若能慎重处之、刚柔并济，则'虽不当位，亦有可济之理处'。**\" **\"虽不当位，亦有可济之理处\"这一句，是全卦最要紧的宽解**：**位置不对（\"不当位\"），不等于\"过不去\"**（**因为\"刚柔应\"（两边能配合）就还有\"可济之理\"。**）** **须说明**：**这是《易经》原文加讲义之解**；**其可用的核极准**：**\"小狐汔济\"是\"差一点\"的经典模型**——**差一点的原因不是\"能力不够\"，是\"不知慎\"（不谨慎）**；**而\"虽不当位，刚柔应也\"给了\"条件不好也能成\"的可能**（**条件是\"刚柔并济\"。**）。","o":"TJ-0626 · 天纪·人间道·未济卦（PDF 第135页）"},{"t":"二百一十九、未济卦：物必不会终尽","h":"象：\"慎辨物居方\"与\"止于其所\"","c":"方法——未济\"象\"为\"**火在水上，未济；君子以慎辨物居方**\"，其解：\"**火在水上，互不相交，此为未济——君子观象知，乃'处不当之象'，应'慎处事物，辨其所当，各居其位，止于其所'。**\" **\"慎辨物居方\"六个字，是未济卦给的方法**：**\"辨物\"（分清每样东西是什么）、\"居方\"（把每样东西放到该在的位置）**（**而\"慎\"字冠在最前——因为\"辨错\"与\"放错\"的代价最大）。** **而\"各居其位，止于其所\"是它的落点**：**每样东西在\"该在的位置\"上，并且\"停在它该在的地方\"**（**而\"未济\"的病，正是\"火在水上\"——两个东西都在，位置全错。**）** **须说明**：**这是《易经》象传原文加讲义之解**；**其可用的核极准**：**\"未济\"不是\"没东西\"，是\"东西放错了地方\"**（**而解法不是\"再加东西\"，是\"重新归位\"**）；**而\"止于其所\"与\"艮卦'思不出其位'\"、\"家人卦'各适其位'\"是同一组判断**（**三处都在说\"位置\"这件事**）。","o":"TJ-0627 · 天纪·人间道·未济卦·象（PDF 第135页）"},{"t":"二百一十九、未济卦：物必不会终尽","h":"初、二、三爻：\"濡其尾，吝\"与\"曳其轮，贞吉\"","c":"风险——**初爻\"濡其尾，吝\"**：\"**阴柔居下位，居未济之时，求力进——犹兽之渡河，必揭其尾方可渡。此言'人不度量其才而进，终必不济'，终招吝鄙也。**\"其\"象\"：\"**不度其才而力进，乃'不知至极点也'。**\" **\"不度量其才而进，终必不济\"这一句，是未济卦的第一条病**：**不问自己有多少本事，只管往前冲**（**而\"不知至极点\"（不知道最高处在哪里）是它的病根。**）** **第二爻\"曳其轮，贞吉\"**：\"**阳刚居将位，有'欲动'之象——今居未济之时，有'以刚凌柔、水来胜火'之象，故须知止：如曳车之轮使其止进，如此可吉。'戒之在刚过'——如此则犯上，其终必凶。**\"其\"象\"：\"**能吉，乃因其能得中道、行之正，不过刚、犯上，故也。**\" **\"戒之在刚过\"这一句，是未济卦的第二条病**：**刚本身没有错，错在\"过刚\"**（**而\"过刚\"的表现就是\"犯上\"（冲到上面去）。**）** **第三爻\"未济，征凶，利涉大川\"**：\"**居未济之时，柔居相位，在下卦之上，有'领导'之象——但'才不足济'，居险而无才足以出险；如此而行，其必招凶致。惟'俟时至，俟上位之才相应'，再涉险而出，乃可出险。**\"其\"象\"：\"**阴柔无能之才居领导之相位，处未济时，动必有凶——仍因其位不适。**\" **\"才不足济\"（本事不够用）这四个字，是未济卦的第三条病**：**位置给了（相位），本事没给**（**而\"俟上位之才相应\"是它的解法：等上面有本事的人来接。**）** **须说明**：**这是《易经》原文（未济卦初、二、三爻）**；**其可用的核极准**：**未济三爻给了三条病**——**初爻\"不度其才\"（不自量）、第二爻\"过刚犯上\"（用力错）、第三爻\"才不足济\"（本事不够）**；**三条的共同点是不清楚自己的位置和分量**。","o":"TJ-0628 · 天纪·人间道·未济卦·初、二、三爻（PDF 第136页）  ---"},{"t":"二百二十、未济后三爻：无可济之时怎么办","h":"第四爻：\"震用伐鬼方\"与\"能与时合\"","c":"要点——**第四爻\"贞吉，悔亡，震用伐鬼方，三年有赏于大国\"**：\"**阳刚之贤才，居于君侧，上为'中虚明顺'之君——故能济天下之艰困，能伐鬼方示其力之大，三年后乃有大功受国封赏。**\"其\"象\"：\"**贤相之才，能'与时合'，且贞固心志，必能吉而不虑悔亡也。**\" **这一爻与既济卦第三爻（\"高宗伐鬼方，三年克之\"）是同一件事的两个位置**：**既济那条讲的是\"君主\"用武（\"专肆威武\"则民忿）；未济这条讲的是\"贤才\"在\"君侧\"用武**（**而结果不同：一个\"惫也\"，一个\"有赏于大国\"。**）** **而分别在于\"上为中虚明顺之君\"**：**上面那个君主是\"中虚\"（心里空着、能容人）与\"明顺\"（明白且肯顺）**——**所以下面的贤才才\"能济天下之艰困\"。** **即：同一个人，在\"能容人的上面\"与\"
