*这一层**脱开命理成立**：**一个人若一辈子顺，他就没学会应对逆境**；**③\"**暗藏凶灾**\"这个说法，把\"稳\"读成了\"**危险被盖住了****（**而\"发生事情时无法逃掉\"，正是\"没有准备\"的后果**）——**⚠ 而这一层的**问题**在于：**它把\"后果\"写成了\"注定\"**（**\"无法逃掉\"四个字，取消了\"可以准备\"这一层**）；**④⚠ 须标**：**\"不能解厄制化\"这个判语，**与前一章\"科权禄三会＝诸侯之命\"的吉断，**出自同一套系统**——**一个说\"很厉害\"，一个说\"防不胜防\"**，**而两者都成立**（**这正是\"吉凶同源\"的又一处**）。** **⚠ 本集按语**：**这一段最值得留下的是\"**吉处藏凶**\"这四个字**（**它是全册对\"顺境\"最清醒的一句提醒**）——**而\"天府坐命\"的人该做的事，**不是\"防凶\"，而是\"**趁顺的时候把底子铺厚**\"**（**存钱、留退路、别把\"稳\"当成\"永远会稳\"**）。","o":"TJ-0932 · 天纪·紫微详解·第五章紫微十二宫详解·第十七例·大限（PDF 第209页）"},{"t":"四百五十、\"有一雷没有爆\"","h":"一个极精的\"凶应\"机制：三忌会聚才引爆","c":"要点——**第十七例给出了全册**最完整的一次\"凶如何应\"的机制说明**，须逐句照录并核算其中可核的部分**：\"**'他在 **53 岁出事了**，那年是 **1991 年辛未**，流年在未，为杀破狼格，命运起伏较大'。'从流年三方四正来看，**就一个铃星**，**没有太大问题**'。'**44-53 十年大限，有一雷没有爆**——大命陀罗、大官 + 本命化忌，**十年大运马上就结束**'。'**在此时被什么引爆的呢？**——**53 岁小限，大小限重叠**；**1991 年年干辛使文昌化忌**；**大小限命宫又使文曲化忌**——**三方形成三忌**，**爆雷了**'。'大脑中风，半痴半傻、行动语言不便'。**\" **复核（两步）**：**①**1991 年尾数 1 → 天干**辛****（**1991 确为**辛未年** ✓**）；**②**辛干四化＝巨门禄、太阳权、文曲科、文昌忌****（**按本册十干四化表\"辛：巨阳曲昌\"读，禄→权→科→忌**）——**故\"**辛使文昌化忌**\"**正确 ✓**（**而\"**文曲化忌**\"不是辛干所化，辛干化的是**文曲科****）——**⚠ 故\"大小限命宫又使文曲化忌\"这一句，**必是\"宫干\"所化**（**原文未给那一宫的宫干，**无法核****）。**须说明（三层）**：**①\"**有一雷没有爆**\"这个比喻，是全册讲\"凶如何应\"最精确的一处**（**它说的不是\"没有凶\"，而是**\"凶已经在了，只差一根引线\"****）——**而\"引线\"是什么？**三个化忌同时落在三方**；**②这一层其实**有可操作的意义**：**一个\"雷\"埋了十年，**只要不叠加，就不会炸****（**⚠ 而\"不叠加\"这件事，在体系上无法预先判断**）；**③⚠ 而须标**：**这是全册最典型的\"事后解释\"**——**\"爆雷\"之后，回头找\"三忌会聚\"总能找到**（**而事前，谁也不知道哪一年会凑齐**）。** **⚠ 本集按语**：**这一段真正有用的，是\"**有一雷没有爆**\"这个观察本身**——**它承认了：**很多人的困境，是**长期积累、某一天突然爆发****（**而\"积累\"这一段，通常是**自己知道、但没有处理****）——**这一层，比\"三忌\"更能指导人。","o":"TJ-0933 · 天纪·紫微详解·第五章紫微十二宫详解·第十七例·流年（PDF 第208~209页）"},{"t":"四百五十一、宅相的两条轴：南北看健康，东西看男女","h":"一套完整的规则，也是一处最易伤人的断言","c":"方法——**第十七例末尾给出了一套**极完整的\"宅相\"判法**，用\"两条轴\"分工，须完整照录**：\"**'**半瘫的宅相**：以**南北为轴**、**一侧住人、一侧生活区**'。'如果南北有卧室、东西单侧有卧室，**那不算**；**南北单侧有卧室，叫\"一侧住人\"**'——**看身体健康**。'**东西两侧看生男生女**——**住南生女、住北生男**'。'**以南北为轴，论住人，看夫妻健康；以东西为轴，论生男女**'。'**一侧住人的房子，不能住人**'。**\" **须说明（三层）**：**①这套规则在形式上**极整齐****（**两条轴、两个用途、一句口诀**）——**而\"住南生女、住北生男\"这一条，**把\"生男生女\"写成了一件可由\"住哪一侧\"决定的事****；**②⚠ 而这一条须明确**：**胎儿的性别由父方的精子（Y 或 X 染色体）决定**，**与住哪一侧**无关**（**这是可核的生物学事实**）——**⚠ 而它的实际伤害**极具体**：**一对想生男孩的父母，可能因为\"住了南侧\"而自责，或为了\"住北侧\"而搬家**；**③⚠ 而\"**一侧住人的房子，不能住人**\"这一句，语气最重**（**它把\"住宅格局\"直接判成\"不能住\"**）——**⚠ 而须标**：**一个家庭若因\"住了单侧\"而忧虑，**这个忧虑本身就比格局更伤健康**（**本集按语**：**住宅的实用问题（通风、采光、噪音、动线），是真问题，**且可改**；**而\"住哪一侧决定谁病\"不是**）。** **⚠ 关于\"半瘫\"这一段的**触发情境**：**它是对一个**已经发生中风**的案例做的**事后归因****（**而\"以南北为轴\"的规则，是在**事后**才被拿来解释的**）——**⚠ 这一点极重要**：**若\"宅相\"能预知中风，它就该在**事前**被验证**（**而本册从未给出过\"事前预测、事后应验\"的案例**）。","o":"TJ-0934 · 天纪·紫微详解·第五章紫微十二宫详解·第十七例·宅相（PDF 第209页）"},{"t":"四百五十二、\"日丽中天\"的四种遇法","h":"同一个格局，落在哪个位置、什么年龄，价值不同","c":"数据——**第十八例对\"日丽中天\"（太阳在午宫入庙）给出了**四种不同的遇法**，并逐一说明其价值差，须完整照录**。**①流年**：\"**'27 岁小限在申、**流年（1978 年戊午）在午**——午宫见到太阳，午时为 11-13 时，为中午时间，**这叫日丽中天**，**这一年为日丽中天格**'。**\" **②小限不算**：\"**'小限 28 岁在未、29 岁在午见到太阳——**这是小限不是流年，不是日丽中天**'。**\" **③大限**：\"**'大限 **35-44**，这叫日丽中天——大限为十年，**十年的日丽中天**；**命宫或者是大限遇到，这叫成格**，**正好是在人生精华年龄时期**'。**\" **④命宫**：\"**'如果**命宫在未宫**，午宫是 **15-25**，也是日丽中天——**代表学习很好，考试很棒，当过好多班长、委员的，是小成格**'。'**不如在成年后遇到要好一些**'。**\" **复核（一步）**：**1978 年尾数 8 → 天干**戊** ✓**（**1978 确为**戊午年** ✓）；**而\"午时 11-13 时\"的换算也正确 ✓**。**须说明（四层）**：**①四种遇法里，**只有\"流年、大限、命宫\"三种算成格，\"小限\"不算****（**\"这是小限不是流年\"这一句，说明这套系统内部对\"哪一层才算数\"有**明确分级**）——**⚠ 而这一层也说明：**同一颗太阳、同一个午宫，**换个层级就不算**（**而这恰恰是\"结果可调\"的来源**）；**②\"**小成格**\"与\"**成格**\"的差别，讲义说得很直白**：**15-25 岁遇到，是\"读书好、当班长\"；35-44 岁遇到，是\"人生精华\"**——**而它自己加了一句评语**：\"**不如在成年后遇到要好一些**\"**（**这一句极精**：**同一个\"吉格\"，在童年只是\"会考试\"，在中年才是\"能成事\"**）；**③\"**日丽中天**\"这个名字本身极好**（**太阳在午＝正午当空**）——**而\"**巨日会命**\"（巨门在戌、太阳在午入庙、命宫在寅）被读成\"**主大财，财禄很大**\"**（**\"会命是先天命带财，大运会到是十年中有大财\"**——**这里又把\"先天\"与\"运\"分开了**）；**④⚠ 而\"**如果命宫在午宫，太阳入命——这种日丽中天，就不是商人，而是武职人员，**武职大利，最少干到参谋总长**\"这一句，须标为**过度具体****（**\"最少干到参谋总长\"是一个**不可能被普遍验证**的断言**）。** **本集按语**：**这一段最值得留下的是那句\"**不如在成年后遇到要好一些**\"**——**它承认了：**同一件事，**在什么年龄发生，意义完全不同****（**而这一层，与前面\"人老珠黄、化权是老年劳碌\"是同一个道理**）。","o":"TJ-0935 · 天纪·紫微详解·第五章紫微十二宫详解·第十八例·夫妻宫／大限（PDF 第210~211页）"},{"t":"四百五十三、\"这种男人婚前一样、婚后一样\"","h":"全册最准的一句关于\"选人\"的判断","c":"要点——**第十七例在讲\"佐才\"格局时，插入了一段关于\"择偶\"的判断，须完整照录**：\"**'重点：看夫妻宫，太太**权禄同逢**，**太太能力非常强**'。'**很多女孩大都喜欢\"弱力佐才\"的男人**——**因为觉得有安全感、容易被自己掌控**；'**自己漂亮、老公丑、先生很差，无人夺爱**'。'**其实不然——这种男人婚前一样、婚后一样**'。**\" **须说明（三层）**：**①\"**这种男人婚前一样、婚后一样**\"这十个字，是全册**最准的一句关于\"选人\"的判断****（**它说的不是\"他会变\"，而是\"**他一直就是那样**\"**）——**⚠ 而这一层**极其成立**：**一个\"温顺\"的人，**婚后不会突然变得有担当****（**因为温顺与有担当，是**两种不同的能力****）；**②而\"**因为觉得有安全感、容易被自己掌控**\"这一句，写出了一个**极常见的择偶动机****（**\"我能掌控他\"**）——**⚠ 而\"能掌控\"带来的安全感，**代价是\"他不能替你扛事\"****；**③\"**自己漂亮、老公丑、先生很差，无人夺爱**\"这一句，是全册**最冷的一句**（**它把婚姻当成了\"防止被夺\"的策略**）——**⚠ 而须标**：**婚姻不是\"占有\"的保险**（**一个\"无人夺爱\"的伴侣，也未必是\"愿意与你共度难关\"的伴侣**）。** **本集按语**：**这一段若只留一句，留\"**婚前一样、婚后一样**\"**——**它给出的择偶方法也极实用**：**别看\"他现在对我多好\"，看他\"对别人、对事情\"一贯怎么做**（**因为\"对你好\"是这一段的特殊状态，\"怎么做人\"才是他的一贯状态**）。","o":"TJ-0936 · 天纪·紫微详解·第五章紫微十二宫详解·第十七例·夫妻宫（PDF 第208页）"},{"t":"四百五十四、\"注：坤是南方\"","h":"一处可核的方位错误","c":"数据——**六壬法的第二版口诀，在\"大安\"条下加了一条注释，而这条注释与全册其他地方的方位配属**直接冲突**，须照录并核**：\"**'**大安**：大安事事昌，**求财在坤方**，失物去不远，宅舍保安康'。'**注：坤是南方**'。'行人身未动，病者主无妨，将军回田野，仔细更推详'。**\" **复核（两步，全部可验）**：**①在**后天八卦**里，**坤＝西南**（**乾西北、坎北、艮东北、震东、巽东南、离南、坤西南、兑西**）——**而\"南方\"是**离****；**②本册自己的用法也印证了这一点**：**前面第十七例讲\"**西南角是主卧室**\"时，**明写\"西南＝坤\"**（**\"男住西南是天地否\"＝乾上坤下，**上卦男为乾、下卦西南为坤** ✓**）——**故\"坤＝西南\"在本册内部是**一致的**，**而\"坤是南方\"这一条注，是**孤例、且错****。** **须说明（三层）**：**①这是一处**干净的错误**（**不是异文，是错**）——**而它的影响**不小**：**\"求财在坤方\"若按\"坤＝南方\"去求，**方向就偏了 45°****；**②而这类错在**口诀类文献**里极常见**（**因为口诀口耳相传，\"坤\"与\"南\"在背诵时容易脱钩**，**而抄录者会自己补一个解释**）——**⚠ 这恰好说明：**这些口诀的**解释层**是后人加的，**不是原生的****；**③本集处理**：**照录\"求财在坤方\"，**标\"坤＝西南\"为正**，**并注明\"注：坤是南方\"是错的**。** **⚠ 附一处同类的**内部不一致**：**同一册第 203-204 页与第 206-207 页，**把这段六神口诀**抄了两遍**（详见本章第八条），**而两版文字有六处不同**——**这两件事放在一起，说明这一章（\"此文摘自于网上\"）的**编校是全书最松的****。","o":"TJ-0937 · 天纪·紫微详解·第七章六壬法·六神解说（PDF 第206页）"},{"t":"四百五十五、同一段口诀，两个版本","h":"\"同文异录\"的一处干净证据","c":"数据——**六神的六首断语，在同一册里出现了**两次**（第 203-204 页与第 206-207 页），而**文字不同**，须并置对照**。**异文对照（六处）**：**①留连**——前版\"求谋**曰**未明\"，后版\"求谋**日**未明\"**；**②小吉**——前版\"**交易**甚是强\"\"病者**褥上苍**\"，后版\"**交关**甚是强\"\"病者**叩穷苍**\"**；**③空亡**——前版\"**囊**解保安康\"，后版\"**解禳**保安康\"**；**④赤口**——前版\"更需防**咒诅**，恐怕染**瘟疫**\"，后版\"更须防**咀咒**，诚恐染**瘟皇**\"**；**⑤大安**——后版多一条注\"**坤是南方**\"（**而此注错**，见本章第六条）**；**⑥速喜**——前版\"行人有**喜音**\"，后版\"行人有**信音**\"。** **须说明（三层）**：**①这些差异，**都不是\"版本演化\"意义上的大改**，而是**同一段口诀的两种抄录****（**音近、形近、义近**：**\"曰/日\"是形近；\"褥上苍/叩穷苍\"是音近义变；\"囊解/解禳\"是义近**）——**⚠ 而这正是**口头传承**的指纹**；**②\"**瘟皇**\"（后版）与\"**瘟疫**\"（前版）这一处最有意思**：**\"瘟皇\"是民间对瘟神的称呼**（**\"诚恐染瘟皇\"＝怕染上瘟神**），**而\"瘟疫\"是现代词**——**故后版更\"古\"、前版更\"顺\"**，**说明两版来自**不同的抄录者****；**③本集处理**：**两版**都收**，**标其主要差异**，**不擅自合并**（**因为\"哪一版是原貌\"无法判定**）。** **⚠ 本集按语**：**这一处\"同文异录\"，是这一章**最诚实的一处证据****——**它不需要任何外部材料，**就能证明：**这一章的内容，是**从不同来源拼起来的****（**而拼的人**没有再校一遍**）——**这与章首\"**此文摘自于网上**\"那句话，**完全对得上**。","o":"TJ-0938 · 天纪·紫微详解·第七章六壬法·六神解说（PDF 第203~207页）"},{"t":"四百五十六、\"全残之人，等于没有了\"","h":"一句须明确否定的话，与一个不友善的词","c":"风险——**第十七、十八例各有一处，须照录并警告**。**其一（第十七例）**：\"**'对太太来说并不是好事——从命理来看，她太太嫁给他，是为了**安全听话**，没有问题'。'可是这个男人 **54 岁，是全残之人，等于没有了**'。**\" **其二（第十八例）**：\"**'命主因为**男人婆**，丈夫离家出走'。'遇到日丽中天格，**她的眼睛都会发光，发的是凶光**，看什么人都不顺眼，**特别是对男人更凶，好像谁欠了她 500 万元**'。**\" **⚠ 本集处置（三层）**：**①\"**等于没有了**\"这四个字，须**明确否定****：**一个脑中风后半身不遂的人，**不是\"没有了\"****（**他的身体功能受限，**但他的存在、他的感受、他与家人的关系，都还在****）——**⚠ 而这句话的实际伤害极重**：**它会让照护者**在心里先\"送走\"病人****（**而照护关系里最要紧的，恰恰是\"他还在这里\"**）；**②\"**男人婆**\"这个词，须标为**不友善****：**它把一位\"紫贪坐命、武官星\"的女性，读成**\"性别错位\"****（**而\"能干、果决、不肯居于人下\"，**不是\"男人的特质\"****）；**③而\"**眼睛都会发光，发的是凶光**\"\"**好像谁欠了她 500 万元**\"这两句，是**极生动的画像****（**它写出了\"带着怨气生活\"的样子**）——**⚠ 但须标**：**这份怨气的来源，是\"丈夫离家出走\"这件**具体的事****（**而不是\"日丽中天\"这个格**）——**⚠ 归因归错了，就把一个**可安慰的人**，写成了一个**命定的凶人****。** **⚠ 而这两例里有一条**极有价值**的话，须留下**：\"**'**命是天，一般在事前无法预知，只有看了命才知道这未来如何**'**\"——**这一句其实是这套体系的**自我定位****（**它承认\"事前无法预知\"，而又说\"看了命就知道\"**）——**⚠ 而这两句是**互相矛盾**的（**\"无法预知\"与\"看了就知道\"，只能有一个成立**）——**而\"看了命才知道\"这一句，**恰恰是这套体系**最需要被追问**的地方**：**如果它真能\"事前\"知道，**为什么这册里的每一个案例，都是**事后**解释的**？","o":"TJ-0939 · 天纪·紫微详解·第五章紫微十二宫详解·第十七／十八例（PDF 第209、211页）  ---"},{"t":"四百五十七、一次三卦：姤、归妹、中孚","h":"\"变卦＝人＋位\"的第二十二至二十四次复算","c":"数据——**第十九例的阳宅分析，在一个案例里连续给出三处\"人＋位\"的卦名，须逐条复算**。**①夫住东南**：\"**'**主卧房在东南角，表示婚姻凶**'。'**东南为巽为风、丈夫为天——丈夫住此为天风姤卦**；**姤是男女交合的象**，**男人就会犯桃花，到外面找女人**'。**\" **②子住西**：\"**'**儿子住西厢房，为雷泽归妹卦**——**鼓励儿子去同性恋、去得性病**'。**\" **③长女住西**：\"**'**西边叫长女睡，长女住在这卦叫风泽中孚卦**——**主科甲、主读书学习优秀**，**女儿就会高中榜首、就会考上大学**'。**\" **复核（三处，全部吻合 ✓）**：**①夫住东南**——**夫＝**乾**（上卦）、**东南**＝**巽**（下卦）→ **乾上巽下＝**天风姤** ✓**；**②子住西**——**子（长男）＝**震**（上卦）、**西**＝**兑**（下卦）→ **震上兑下＝**雷泽归妹** ✓**；**③长女住西**——**长女＝**巽**（上卦）、**西**＝**兑**（下卦）→ **巽上兑下＝**风泽中孚** ✓。** **须说明（四层）**：**①这是\"**变卦＝人＋位**\"的**第二十二、二十三、二十四次**复算**（**且是**同一页内连续三卦**）——**至此这条规则已经被验证了二十四次，**无一反例****；**②而三处的关系极清楚**：**同一个\"西\"（兑），**儿子住出\"归妹\"（长男＋少女）、长女住出\"中孚\"（长女＋少女）**——**上卦随人变，下卦恒为兑**（**与前面\"同一个正东，妻住出复、夫住出无妄\"是**完全同一套机制****）；**③而三卦的断语**方向相反**：\"**姤**\"是\"**男女交合、犯桃花**\"，\"**归妹**\"是\"**嫁娶不当**\"，而\"**中孚**\"是\"**科甲、读书优秀**\"——**同一间西屋，**给儿子是凶、给长女是吉****；**④⚠ 而\"**东南为巽为风、丈夫为天**\"这一句，**把\"下卦＝方位\"说得极直白**（**东南恒为巽、西恒为兑**）——**这是理解全套地脉道的**总钥匙****（**位置决定下卦，人决定上卦**）。** **⚠ 本集按语**：**这二十四次复算的说服力在于：**它不是随机命名的**（**泰/否、随/蛊、剥/复这些\"符号近似而卦义相反\"的卦，**都能对上**）——**而它的**说服力也就到此为止****（**因为一个**自洽的符号系统**，与一个**有效的预测系统**，是两件事**）。","o":"TJ-0940 · 天纪·紫微详解·第五章紫微十二宫详解·第十九例·阳宅（PDF 第212~214页）"},{"t":"四百五十八、\"鼓励儿子去同性恋、去得性病\"","h":"一处须最高级警告的断言","c":"风险——**第十九例的阳宅分析里，对\"子女住错方位\"给出了两条极重的断言，须照录并明确否定**：\"**'三口人住在同一个家——**她叫女儿住在西南坤位，叫儿子住在西方兑位**——**这样住把子女都给害了**'。'**女儿没有结婚，叫她住在西南母亲的位置，是鼓励她女儿做偏房**'。'**儿子住西厢房，为雷泽归妹卦——鼓励儿子去同性恋、去得性病**'。**\" **⚠ 本集处置（四层）**：**①照录**；**②⚠ 明确否定\"住西厢房 → 同性恋\"**：**性取向**不是由\"住哪个方位\"决定的****（**它不是\"被鼓励出来的\"，也不是\"选择\"，**更不是\"凶\"****）；**③⚠ 明确否定\"同性恋 → 得性病\"这个等式**：**性传播疾病的传播途径是**具体的性行为方式与防护**，**与性取向**无关****（**把\"同性恋\"与\"性病\"捆在一起，是一处**极严重的污名****）；**④⚠ 而\"女儿住西南＝鼓励做偏房\"须否定**：**婚姻不是阶层交易**（**\"住哪个房间\"不决定一个人嫁给谁，**更不决定她是\"正室还是偏房\"****）。** **⚠ 须说明这一条的**实际伤害**：**一个家庭若真按此搬房**（**把儿子从西屋挪走、把女儿从西南挪走**），**它传递给孩子的话是**：\"**你现在的样子，是住错了房间造成的**\"**——**⚠ 而对一个正在认识自己性取向的少年，这句话的**杀伤力**极直接****（**它把\"我是谁\"变成了\"家里摆错了\"**）。** **⚠ 本集按语**：**这一段是全册**最需要被剥离的一处****（**而它恰好也是\"人＋位\"这套机制**推导得最整齐的一处****）——**这正说明：**一个系统**内部自洽**，**与它**对人有帮助**，是两件不相干的事**。","o":"TJ-0941 · 天纪·紫微详解·第五章紫微十二宫详解·第十九例·阳宅（PDF 第214页）"},{"t":"四百五十九、\"这叫名＝位\"","h":"一次完整的改运操作，与一处极实用的退让","c":"方法——**第十九例给出了全册**最具体的一次\"改阳宅\"操作**，含\"应该谁睡哪、没有那个房间怎么办\"，须完整照录**：\"**'**解决方法**：**命主从东南主卧室搬出来**；**命主太太是家中的母亲，要睡到坤位西南、原女儿住的房间**——**这叫\"名＝位\"**'。'这样改的**目的**是：**她的事业很好**，因为她 **46-55 是化权**；**在睡到这个正位上，她的位置会爬得更高、做得更好**'。'**此房没有\"正位东宫\"**，只能叫儿子住在东南那个卧室——**叫他尽量靠正东那个角、尽量靠东边睡**'。**\" **须说明（三层）**：**①\"**这叫\"名＝位\"**\"这五个字，是\"名位相等\"这个概念**第三次被明示****（**前两次在\"紫微排盘设定\"与\"西南主卧\"**）——**而它在这里被当成了**操作的总纲****（**母亲睡母亲的位置，才叫\"名位相等\"**）；**②而\"**此房没有正位东宫，只能……尽量靠正东那个角**\"这一句，**极实用****（**它承认\"房子不可改\"**，**于是把\"改房子\"降级成了\"改睡姿\"**）——**⚠ 而这一层其实**很诚实**：**它没有要求人\"必须换房\"，而是说\"**在现有条件下尽量靠**\"**；**③⚠ 而它的**因果链**仍须标**：**\"**睡到正位 → 位置爬得更高**\"**（**而真实成立的一层是：**一个人在家里被确认了位置，**她做事的底气确实会变****——**⚠ 而\"位置\"这件事，**是家人给的，**不是房间给的****）。** **本集按语**：**这一段若去掉卦名，**它其实是一条**极好的家庭建议****：**\"**谁该在什么位置，就让他/她在那**\"**——**而\"母亲睡到女儿的房间\"这件事，**真正的问题是：**它把女儿的位置**挪走了****（**⚠ 而讲义在后一句，正好又把女儿挪去了西边**，**于是女儿的位置**换了一个**，**而不是**被\"补上\"了**）。","o":"TJ-0942 · 天纪·紫微详解·第五章紫微十二宫详解·第十九例·阳宅（PDF 第214页）"},{"t":"四百六十、\"大脑里没有感情的问题\"","h":"全册最好的一句\"能力与情感的不对称\"","c":"要点——**第十九例讲\"武曲化忌\"时，给出了一段极准的人格描写，须完整照录**：\"**'**事业宫：武曲化忌**——**这个女孩很厉害、一级的棒**，为什么？**因为（化忌）办起事来非常优秀，甚至比男人强**'。'她在处理事情和业务时，**大脑里没有感情的问题**，**像机器人一样、没有进退取舍**——也就是说**没有人情味**'。'**但在处理感情问题时，笨的跟猪一样，进退拿捏不好**'。**\" **须说明（三层）**：**①\"**大脑里没有感情的问题**\"\"**像机器人一样**\"这两句，是**对\"能干\"最锋利的描述****（**它说的不是\"冷血\"，而是**\"在做事时，情绪不进入决策\"****）——**而这一层**极准确**：**很多极擅长做事的人，**正是靠\"把事情与感受分开\"才做得快**；**②而\"**但在处理感情问题时，笨的跟猪一样，进退拿捏不好**\"这一句，是全册**最好的一句\"能力与情感的不对称\"****（**同一个人，**在业务上是\"一级的棒\"，在亲密关系里是\"进退拿捏不好\"**）——**⚠ 而这一层**完全成立**：**处理事情靠\"取舍\"，处理感情靠\"分寸\"**，**而这是**两种不同的能力****；**③⚠ 而\"**武曲化忌**\"在这里被读成**优点****（**\"化忌\"本是煞星，**这里却成了\"办事优秀\"的来源**）——**⚠ 这是全册\"**凶星吉用**\"最典型的一例**（**同一个化忌，在事业上是\"专注\"，在感情上是\"笨\"**）——**而这一层使**任何星都可以被读成吉或凶**（**取决于它在哪个宫**）。** **本集按语**：**这一段最值得留下的是**\"没有进退取舍\"这五个字**（**它写出了\"能干\"的另一面**：**一个不做取舍的人，效率极高，**但也**不会为别人留余地****）——**而\"没有人情味\"这个评价，**其实是对**\"不会留余地\"**的另一种说法**。","o":"TJ-0943 · 天纪·紫微详解·第五章紫微十二宫详解·第十九例·事业宫（PDF 第213~214页）"},{"t":"四百六十一、\"只要象存在，其局不变\"","h":"\"局\"的存续条件，与全套体系的最后一道防线","c":"要点——**无妄卦\"地脉道\"的开头，给了一句关于\"局\"何时失效的话，须完整照录**：\"**'**天雷无妄（父住正东卧房）**：此名\"无妄\"，**猶\"无妄之灾\"意**——**居此局之丈夫成此格**。'。'**即令已离婚，但有子女同住——只要\"象\"存在，其局不变。须注意此点**'。**\" **复核（一步）**：**父＝**乾**（上卦）、**正东**＝**震**（下卦）→ **乾上震下＝**天雷无妄** ✓**（**与卦名完全吻合，第二十次复算已核**）。**须说明（三层）**：**①\"**只要象存在，其局不变**\"这一句，是**全套地脉道的最后一道防线****（**因为前面反复说过\"夫妻必不和\"\"与夫之对应局为无妄\"**，**而\"离婚了\"就是最直接的反例**）——**⚠ 讲义的处置方式是：**把\"局\"的成立条件，从\"关系\"改成了\"象\"**（**父亲在场 ＋ 子女同住 ＋ 正东房**）；**②于是\"离婚\"不再能推翻它**（**因为\"象\"还在**）——**⚠ 而这一层的**问题**极明显：**它把一个\"可被反例推翻\"的论断，**改成了一个\"不能被反例推翻\"的论断****（**而一个不能被推翻的论断，**就不再是知识****）；**③⚠ 而它同时暴露了这套体系的**真实关切**：**它关心的不是\"这个丈夫过得好不好\"，**而是\"这个局有没有应验\"**——**⚠ 若一个人的不幸被用来证明\"局准\"，**那这套体系就已经**站到了人的对面****。** **本集按语**：**若读者正在这样的处境里**（**离婚了，仍与孩子同住**），**这一段最该听见的话是**：\"**局不变\"这句话，**不是判决，是一个**不肯认输的说法****——**而你**和你的孩子**过得好不好，**与\"父亲住哪个方向\"**无关**。","o":"TJ-0944 · 天纪·紫微详解·第四章卦象详解·天雷无妄·地脉道（PDF 第216页）"},{"t":"四百六十二、\"因强住长子位，致令长子无宫位\"","h":"一处极\"结构性\"的解释","c":"要点——**无妄卦\"地脉道\"的第五条，用\"位置被占\"来解释\"子有灾\"，而这一层比\"克子\"精确得多，须完整照录**：\"**'五、**须防子有灾**——**故同时生人，有人无子，有人有子，但主夭折或叛逆，此其真因也**'。'**因强住长子位，致令长子无宫位，故生祸害**'。**\" **须说明（三层）**：**①\"**因强住长子位，致令长子无宫位**\"这一句，是这套体系里**最\"结构性\"的一处****（**它没有说\"父亲克儿子\"，而是说**\"父亲占了儿子的位置，于是儿子没有位置\"****）——**⚠ 而这个机制**脱开命理极有说服力**：**一个家里，**如果父亲站在了\"该由孩子站的位置\"**（**事事替孩子做主、替孩子决定、替孩子承担**），**孩子就\"没有位置\"了****；**②而\"**长子无宫位**\"的后果，讲义写的是\"**夭折或叛逆**\"**（**⚠ \"夭折\"须警告**）——**而\"**叛逆**\"这一半，**其实**准确**：**一个\"没有位置\"的孩子，**最常做的两件事，**要么彻底顺从（消失），**要么彻底对抗（叛逆）****；**③⚠ 而\"**须防子有灾**\"这一条，**对父母是**极重的暗示****（**它会让一个孩子生病或出事的父亲，**先怪自己\"住错了\"**）——**本集按语：**孩子的\"位置\"，**不是由房间给的，**是由父母**让出来的****。** **⚠ 附同卦\"先天\"栏一句极好的话**：\"**'**商人行伙防陷**。**有大禄至须戒盛**！'**\"**——**\"**有大禄至须戒盛**\"这六个字，是**全册最好的\"顺境提醒\"之一****（**与前面\"吉处藏凶\"是同一个道理**）。","o":"TJ-0945 · 天纪·紫微详解·第四章卦象详解·天雷无妄·地脉道（PDF 第216页）"},{"t":"四百六十三、\"天下打雷，万物不敢妄为\"","h":"无妄卦的字义，与四处极精的象","c":"要点——**无妄卦的\"人间道\"段与\"性格\"第二段，给了这个卦**最完整的一次字义解释**，须并录**。**其一（解象）**：\"**'天雷无妄卦，外卦为乾，代表天；内卦为震，代表雷'。'**天下打雷，万物不敢妄为——象征不妄为，则不会发生祸患**'。'无妄卦有**欲望过多、心存妄念**的意思'。'**无妄者，天灾也**——**事与愿违**，因此多有不利'。'**凡事不利，不做痴心妄想的事，坚守正道不乱为**'。**\" **其二（象）**：\"**'**此卦为李广卜得，凡事不利**'。'**无妄之灾、居安虑危**'。'右上角有**一堆钱在水中**——寓意\"钱塘得禄\"；**另意：妄动会使钱财打水漂**'。'左下有一**鼠一猪**，代表**亥子时间**，说明将于**亥子日上应验**；**亥子位于北方，属于坎卦**，说明**有险有难**'。'此为**石中蕴玉之卦、守旧安常之象**。**卦身为卯，不入卦**'。**\" **须说明（四层）**：**①\"**天下打雷，万物不敢妄为**\"这一句，是《象辞》\"**天下雷行，物与无妄**\"的**白话**（**雷在天上响，万物**不敢乱动****）——**而这个解释**极准**：**\"无妄\"的本义**不是\"没有妄念\"，而是**\"不敢妄动\"****；**②\"**一堆钱在水中**\"这个象**极妙**（**钱在水里＝看得见、拿不到**）——**而\"**妄动会使钱财打水漂**\"这一句，**把\"水中之钱\"的后果写出来了**（**⚠ 而\"打水漂\"这个说法，**恰好就是水漂的物理**：**扔出去，弹几下，沉了**）；**③\"**李广卜得，凡事不利**\"这个典故用得**极准****（**李广一生**战功赫赫而不封侯**，**正是\"事与愿违\"的最佳例证**）——**⚠ 而\"无妄者，天灾也\"这一句，**把\"无妄\"的另一义**（**意外的灾祸**）也说清了**；**④\"**卦身为卯，不入卦**\"这一条，**回到前面\"名词解释\"**（**\"月卦身有的卦有、有的没有，没有的叫\"身不入卦\"**）——**⚠ 而\"卦身\"这个概念，本册只在此处解释了一次**（**\"世身每卦必有、月卦身有的没\"，**而\"无妄的卦身是卯、不入卦\"**，**即：无妄这一卦**\"没有身体\"****）——**⚠ 这一层在体系内的意思**（**\"无主\"\"无着落\"**）**与\"无妄之灾\"是**相配的****。** **⚠ 附\"性格\"第一段里一段极准的画像**：\"**'求知欲强、有企划才能**，**但性格抗上、纵容下属、语言思想激进、不考虑后果、不知进退**'。'**得一天和尚撞一天钟，怕麻烦**，**生活越简越好、无责任感**'**\"**——**⚠ 这两段**其实是**两种人****（**前一段是\"激进\"，后一段是\"消极\"**）——**而同被归给\"无妄\"，**正说明这套体系**一人多面、面面可套****。","o":"TJ-0946 · 天纪·紫微详解·第四章卦象详解·天雷无妄·人间道／性格（PDF 第216页）"},{"t":"四百六十四、\"2013 年癸巳……流年干己\"","h":"一处干支不符，与三处须警告的面相断语","c":"风险——**第十九例的末尾有几处须核、须警的内容，逐条照录并核**。**其一（干支）**：\"**'**十年红鸾星只有 62 岁，2013 年癸巳有机会**——流年太岁在巳遇到天喜；小限入酉宫，太阳、天梁权禄交驰，**二男争妇，势必结婚**'。'**流年干己在流年夫妻宫（卯）化忌——克夫，人没了**'。**\" **复核（两步）**：**①**2013 年尾数 3 → 天干**癸** ✓**（**2013 确为**癸巳年** ✓**）——**与原文\"2013 年癸巳\"一致**；**②而原文紧接着说\"**流年干己**\"**——**⚠ **2013 年的年干是\"癸\"，不是\"己\"****（**若为\"己\"，则应是 **2009 年（己丑）**）——**⚠ 故\"2013 年癸巳\"与\"流年干己\"**两者不能同时成立****。** **其二（数字）**：\"**'**男人是九、为老阳；女人是六、为老阴**——**生病逢此数易亡**'。**\" **⚠ 本集处置**：**九为老阳、六为老阴，出自《易经》的筮数**（**九、六为变爻，七、八为不变爻**）——**这一层可核**；**而\"**生病逢此数易亡**\"**须明确否定****（**数字不决定生死**，**且这句话对病人是**极重的暗示****）。** **其三（面相）**：\"**'在面部流年上有**黑点、黑痣，表凶**'。'女人面相：**颧大压鼻，表有权**；**皮骨相连、皮肤亮亮的，孤坐到老**；**手见筋见骨，贤妻良母**'。**\" **⚠ 本集处置**：**照录，标为**以貌断人，无据**（**一个人的骨相、皮肤、手形，**与她的品格、婚姻、寿命**没有因果关系**）——**⚠ 而\"**孤坐到老**\"这四个字，对一位未婚女性是**最直接的一种诅咒**（**而本册第十九例的命主，**恰是一位\"由妈妈做主结婚、38 岁离婚\"的女性**）——**⚠ 把\"未婚\"读成\"孤坐到老\"，**正是这类面相学**最伤人的地方****。** **⚠ 本集按语**：**这一段（第十九例末尾）是全册**信息密度最高、也最需剥离**的一处**（**干支错、数字断生死、面相断婚姻**，**三层叠在一起**）——**而它的前文（\"名＝位\"、三卦复算）**却是全册**最整齐的部分****（**这正说明：**同一段讲义里，**可核的与不可核的**是混在一起的****，**读者必须**逐句分辨**）。","o":"TJ-0947 · 天纪·紫微详解·第五章紫微十二宫详解·第十九例·流年／面相（PDF 第214页）  ---"},{"t":"四百六十五、六十四卦·人位对照总表（上，乾至无妄 25 卦）","h":"25 卦的\"人＋位\"清单","c":"数据——**本册\"地脉道\"共 64 段，与六十四卦**一一对应**（本集以\"地、脉、道\"三个竖排字为标记，全文检索得 **64 处**，无一缺漏）**。**每段的格式都是\"卦名（某人住某位）\"**，**故可把全书 64 段拼成一张完整对照表**。**上篇 25 卦（原文所给\"人＋位\"，及本集复算）**：\n\n| 卦 | 原文\"人＋位\" | 上卦 | 下卦 | 复算 |\n|---|---|---|---|---|\n| 乾为天 | 父住西北 | 乾 | 乾 | ✓ |\n| 坤为地 | 母住西南 | 坤 | 坤 | ✓ |\n| 水雷屯 | 二子住正东 | 坎 | 震 | ✓ |\n| 山水蒙 | 三子住正北 | 艮 | 坎 | ✓ |\n| 水天需 | 二子住西北 | 坎 | 乾 | ✓ |\n| 天水讼 | 父住正北 | 乾 | 坎 | ✓ |\n| 地水师 | 母住正北 | 坤 | 坎 | ✓ |\n| 水地比 | 二子住西南 | 坎 | 坤 | ✓ |\n| 风天小畜 | 长女住西北 | 巽 | 乾 | ✓ |\n| 天泽履 | 父住正西 | 乾 | 兑 | ✓ |\n| 地天泰 | 妻（母）住西北 | 坤 | 乾 | ✓ |\n| 天地否 | 父住西南 | 乾 | 坤 | ✓ |\n| 天火同人 | 父住正南 | 乾 | 离 | ✓ |\n| 火天大有 | 次女住西北 | 离 | 乾 | ✓ |\n| 地山谦 | 母住东北 | 坤 | 艮 | ✓ |\n| 雷地豫 | 长子住西南 | 震 | 坤 | ✓ |\n| 泽雷随 | 三女住正东 | 兑 | 震 | ✓ |\n| 山风蛊 | 少男住**西南** | 艮 | 坤 | **✗ 见第四条** |\n| 地泽临 | 母住正西 | 坤 | 兑 | ✓ |\n| 风地观 | 长女住西南 | 巽 | 坤 | ✓ |\n| 火雷噬嗑 | 二女住正东 | 离 | 震 | ✓ |\n| 山火贲 | 三子住正南 | 艮 | 离 | ✓ |\n| 山地剥 | 三子住西南 | 艮 | 坤 | ✓ |\n| 地雷复 | 母住正东 | 坤 | 震 | ✓ |\n| 天雷无妄 | 父住正东 | 乾 | 震 | ✓ |\n\n**须说明（两层）**：**①本表\"人\"一律取八卦的**家庭象征**：**父＝乾、母＝坤、长子＝震、二子（中男）＝坎、三子（少男）＝艮、长女＝巽、二女（中女）＝离、三女（少女）＝兑**；**②本表\"位\"一律取**后天八卦的方位**：**西北＝乾、西南＝坤、正东＝震、东南＝巽、正南＝离、东北＝艮、正西＝兑、正北＝坎**——**而这两张对应表，在本册别处（临卦\"西南＝坤\"、复卦\"正东＝震\"、第十九例\"东南＝巽\"）已反复出现，**内部一致****。","o":"TJ-0948 · 天纪·紫微详解·第四章卦象详解·地脉道·乾至无妄（PDF 第152~216页）"},{"t":"四百六十六、六十四卦·人位对照总表（下，大畜至未济 39 卦）","h":"39 卦的\"人＋位\"清单","c":"数据——**续上表，下篇 39 卦**：\n\n| 卦 | 原文\"人＋位\" | 上卦 | 下卦 | 复算 |\n|---|---|---|---|---|\n| 山天大畜 | 三子住西北 | 艮 | 乾 | ✓ |\n| 山雷颐 | 三子住正东 | 艮 | 震 | ✓ |\n| 泽风大过 | 三女住东南 | 兑 | 巽 | ✓ |\n| 坎为水 | 二子住正北 | 坎 | 坎 | ✓ |\n| 离为火 | 二女住正南 | 离 | 离 | ✓ |\n| 泽山咸 | 三女住东北 | 兑 | 艮 | ✓ |\n| 雷风恒 | 长子住东南 | 震 | 巽 | ✓ |\n| 天山遯 | 父住东北 | 乾 | 艮 | ✓ |\n| 雷天大壮 | 长子住西北 | 震 | 乾 | ✓ |\n| 火地晋 | 二女住西南 | 离 | 坤 | ✓ |\n| 地火明夷 | 母住正南 | 坤 | 离 | ✓ |\n| 风火家人 | 长女住正南 | 巽 | 离 | ✓ |\n| 火泽睽 | 中女住正西 | 离 | 兑 | ✓ |\n| 水山蹇 | 二子住少子位（东北） | 坎 | 艮 | ✓ |\n| 雷水解 | 长子住二子位（正北） | 震 | 坎 | ✓ |\n| 山泽损 | 三子住少女位（正西） | 艮 | 兑 | ✓ |\n| 风雷益 | 长女住长子位（正东） | 巽 | 震 | ✓ |\n| 泽天夬 | 少女住父位（西北） | 兑 | 乾 | ✓ |\n| 天风姤 | 父住长女位（东南） | 乾 | 巽 | ✓ |\n| 泽地萃 | 少女住母位（西南） | 兑 | 坤 | ✓ |\n| 地风升 | 长女住母位（西南） | 坤 | 巽 | **✗ 见第五条** |\n| 泽水困 | 少女住二子位（正北） | 兑 | 坎 | ✓ |\n| 水风井 | 二子住长女位（东南） | 坎 | 巽 | ✓ |\n| 泽火革 | 三女住二女位（正南） | 兑 | 离 | ✓ |\n| 火风鼎 | 二女住长女位（东南） | 离 | 巽 | ✓ |\n| 震为雷 | 长子住东宫（正东） | 震 | 震 | ✓ |\n| 艮为山 | 三子住东北 | 艮 | 艮 | ✓ |\n| 风山渐 | **未给房位** | 巽 | 艮 | **无法核** |\n| 雷泽归妹 | 长子住正西 | 震 | 兑 | ✓ |\n| 雷火丰 | 长子住正南 | 震 | 离 | ✓ |\n| 火山旅 | 二女住东北 | 离 | 艮 | ✓ |\n| 巽为风 | 长子住**东南** | 震 | 巽 | **✗ 见第五条** |\n| 兑为泽 | 三女住正西 | 兑 | 兑 | ✓ |\n| 风水涣 | 长女住正北 | 巽 | 坎 | ✓ |\n| 水泽节 | 二子住正西 | 坎 | 兑 | ✓ |\n| 风泽中孚 | 长女住正西 | 巽 | 兑 | ✓ |\n| 雷山小过 | 长子住东北 | 震 | 艮 | ✓ |\n| 水火既济 | 次子住正南 | 坎 | 离 | ✓ |\n| 火水未济 | 次女住正北 | 离 | 坎 | ✓ |\n\n**须说明（两层）**：**①下篇 39 卦中，**36 卦复算吻合、1 卦房位缺失（渐）、2 卦有误（升、巽）**——**与上篇合计：**60 卦吻合 / 1 卦缺房位 / 3 卦有误**（详见第四、五条）；**②而\"丰\"卦原文作\"雷火**风**卦\"**（**应为\"雷火**丰**\"**，**形近错字**）——**本集照录其房位（长子住正南 → 震上离下＝雷火丰 ✓），并标其卦名之误**。","o":"TJ-0949 · 天纪·紫微详解·第四章卦象详解·地脉道·大畜至未济（PDF 第217~343页）"},{"t":"四百六十七、8×8＝64：这套体系的\"完整性\"来自一个矩阵","h":"\"变卦＝人＋位\"已有 62 次验证，而它的数学结构是满的","c":"要点——**把上面两表合起来看，可以发现这套地脉道**不是\"随手配卦\"，而是填满了一个 8×8 的矩阵**，须说明其结构**。**两组各八个**：**人（上卦）**——**父乾、母坤、长子震、二子坎、三子艮、长女巽、二女离、三女兑**（**8 个**）；**位（下卦）**——**西北乾、西南坤、正东震、东南巽、正南离、东北艮、正西兑、正北坎**（**8 个**）。**而 **8 × 8 ＝ 64**，**恰好等于六十四卦的总数**——**本册\"地脉道\"64 段与 64 卦**一一对应、无一重复、无一遗漏****（**本集全文检索\"地、脉、道\"三竖排字，得**64 处**，**与卦数完全相等**）。**复核结果**：**60 卦完全吻合、1 卦缺房位（渐）、3 卦有误（蛊、升、巽）**——**吻合率约 **95.2%**（60/63）**。**须说明（三层）**：**①这是\"变卦＝人＋位\"这套规则**最强的证据****（**因为它不是\"抽几条对上\"，而是**64 条全部对上，只有 3 条内部自相矛盾****）——**而这 3 条，**恰好都是\"有两个不同的卦都被同一个组合占用\"导致的**（**见下两条**）；**②而这个矩阵的**完整性**极重要**：**它说明\"64 卦\"在这套体系里不是\"占卜的结果集合\"，而是**\"8 种人与 8 种位置的组合清单\"****（**一个有限、可穷举、可核对的表**）；**③⚠ 而\"完整\"这件事，**也恰恰是它的问题所在**：**一个**闭合的系统**，**只能用自己解释自己**（**它无法被\"外部事实\"推翻，因为每一个可能的结果，**都已经在表里预先有了说法**）。** **⚠ 本集按语**：**这一段最值得留下的**不是\"配得整不整齐\"，而是那个 **8×8** 本身**——**它是一个**设计得很好的符号系统**（**好到让人相信它必然有效**）**——**而\"设计得好\"与\"真的有效\"，**是两件事**。","o":"TJ-0950 · 天纪·紫微详解·第四章卦象详解·地脉道（全 64 段）"},{"t":"四百六十八、第一处内部矛盾：蛊卦\"少男居西南\"","h":"同一个组合被两个卦名占用","c":"数据——**本册\"蛊\"与\"剥\"两段，把\"少男住西南\"这**同一个组合**，配给了**两个不同的卦名**，须并置核对**。**原文其一**：\"**'**山风蛊卦（少男居西南角）**——三虫聚一盘中，互相蛊食，此成蛊象'。**\" **原文其二**：\"**'**山地剥卦（三儿子居西南角卧房，长子和二子未婚）**——剥有耗尽之象'。**\" **复核（两步，全部可验）**：**①\"少男\"＝**艮**（上卦）、\"西南\"＝**坤**（下卦）→ **艮上坤下＝**山地剥**（**故\"少男居西南\"实际出的是\"剥\"**）；**②**山风蛊**＝**艮上巽下****（**上艮下巽**）——**故\"蛊\"对应的位应是**东南（巽）**，**不是西南**。** **须说明（三层）**：**①\"三儿子\"与\"少男\"是**同一个人**（**艮＝少男＝第三子**）——**故这两段写的是**同一个组合**，**却给了两个卦名**，**其中必有一错**；**②按八卦推算，\"**少男居西南**\"正确对应的卦名是\"**山地剥**\"**（**而\"剥\"那一段的房位是对的**）——**故出错的是\"蛊\"那一段的**房位**，**应为\"东南\"**；**③⚠ 而这一处错，**恰好落在最讲\"蛊\"的一段上**（**\"风被山阻挡而不能流通，静止不动，滋生腐败\"——这是本册对\"蛊\"最好的字义解释**，**而它出现在一段房位写错的段落里**）——**⚠ 本集据此建议：读\"蛊\"这一条时，**取其字义与人事，弃其房位**（**房位应作\"少男居东南\"**）。** **⚠ 附一处旁证**：\"**'坎为水卦（二子居正北卧房，长子未婚）'**\"——**二子＝坎、正北＝坎 → 坎上坎下＝坎为水 ✓**（**这一条**完全正确**，**可作\"人位配卦\"体系的标杆**）。","o":"TJ-0951 · 天纪·紫微详解·第四章卦象详解·地脉道·山风蛊（PDF 第190页）"},{"t":"四百六十九、第二／第三处矛盾：巽为风与地风升","h":"同一组合配两卦，且破坏\"八纯卦\"的完整","c":"数据——**本册\"巽\"与\"恒\"两段，把\"长子住东南\"这**同一个组合**，也配给了两个卦名**，须并置核对**。**原文其一**：\"**'**雷风恒卦（长子居东南角卧房）**——今人最常见此局'。**\" **原文其二**：\"**'**巽为风卦：（长子居于东南位）**——此局大利未婚女'。**\" **复核（两步，全部可验）**：**①\"长子\"＝**震**（上卦）、\"东南\"＝**巽**（下卦）→ **震上巽下＝**雷风恒** ✓**（**故\"恒\"那一段是对的**）；**②**巽为风**＝**巽上巽下****（**上巽下巽**）——**故\"巽\"对应的应是\"**长女住东南**\"**（**不是长子**）**。** **须说明（四层）**：**①故出错的是\"巽\"那一段的**人**（**\"长子\"应作\"长女\"**）——**而它的**位（东南）是对的**；**②⚠ 这一处错**后果更明显**：**\"巽为风\"\"兑为泽\"\"坎为水\"\"离为火\"\"震为雷\"\"艮为山\"这六个，再加上\"乾为天\"\"坤为地\"，正是**八纯卦**——**即\"人住自己的本位\"的八种情形**（**也就是本册反复说的\"**名位相等**\"**）；**③而八纯卦里，**七个的房位都写对了****（**乾：父住西北 ✓、坤：母住西南 ✓、坎：二子住正北 ✓、离：二女住正南 ✓、震：长子住东宫 ✓、艮：三子住东北 ✓、兑：三女住正西 ✓**）——**只有\"巽为风\"写成了\"长子居于东南\"**（**应为\"长女\"**），**于是\"八纯卦\"这一组**缺了一个角****；**④⚠ 而\"巽\"那一段的断语（\"**此局大利未婚女**\"）**恰恰说明它本意是给**未婚女性**用的**——**与\"长子\"完全对不上**（**这一处错，是**抄录时改错了人**）。** **本集按语**：**两处矛盾有一个共同的形态**：**\"同一个人位组合，被两个卦名占用\"**——**而解决的方式也一致**（**按八卦推算，改掉错的那一处的\"人\"或\"位\"**）。**⚠ 而它们**同时说明一件事**：**这 64 段是**编出来的**，**不是算出来的****（**因为算的话，**8×8 的取值**不会重复**）。","o":"TJ-0952 · 天纪·紫微详解·第四章卦象详解·地脉道·巽为风（PDF 第275页）"},{"t":"四百七十、\"名位相等\"的八个位置","h":"八纯卦＝八卦各自的本位，也是这套体系的\"原点\"","c":"要点——**把\"人住自己的本位\"这八种情形单列出来，可得\"名位相等\"的**完整清单**，须照录并核**。**八个本位**：**①**乾为天**——\"**爸爸是乾卦，住到**西北角乾位**，叫乾为天卦，**名位相等**\"**（**原文自注\"名位相等\"** ✓）；**②**坤为地**——\"**母居母位为坤为地卦**\"（**妈妈住**西南卧室坤位**）✓**；**③**震为雷**——\"（**长子居住东宫、东宫太子位**）\"✓**；**④**坎为水**——\"（**二子居**正北**卧房**）\"✓**；**⑤**艮为山**——\"（**三子居**东北位**）\"✓**；**⑥**离为火**——\"（**二女居**正南**卧房**）\"✓**；**⑦**兑为泽**——\"（**三女住在**正西**卧室**）\"✓**；**⑧**巽为风**——**原文作\"（长子居于东南位）\"**，**应作\"长女\"（见第五条）**。** **须说明（四层）**：**①\"**名位相等**\"这四个字，是全册**最核心的一个判据****（**它的意思极简单：**人站在自己的位置上**）——**而\"八个本位\"就是它的**全部情形****（**因为八卦只有八个**）；**②而这八个里，**七个写对、一个写错**（**巽**）——**⚠ 故\"八纯卦\"在本册里**并不完整成立****；**③而\"**名位相等**\"的**对立面**，就是本册反复出现的\"**名位不等**\"**（**64 段里几乎每一段末尾都印着\"名位不等\"三个字**）——**⚠ 而\"名位不等\"是**绝大多数情形****（**8×8＝64 里，只有 8 个是\"相等\"**，**其余 56 个都\"不等\"**）；**④⚠ 而这个**比例**本身值得注意**：**一套以\"名位相等\"为吉、以\"名位不等\"为凶的体系里，**吉的比例是 8/64＝12.5%****（**⚠ 而这意味着：**按这套规则，**绝大多数人的住法都是\"错\"的****（**而\"改\"的需求，**也就永远存在**）。** **本集按语**：**这一段最值得留意的是那个 **12.5%****——**一个系统如果**默认绝大多数人是错的**，**它就有了**无限的改运生意****（**而\"名位相等\"这个说法本身极好**：**它说的是\"人在自己的位置上\"**，**这一层**与方位无关**）。","o":"TJ-0953 · 天纪·紫微详解·第四章卦象详解·地脉道·八纯卦（PDF 第152~343页）"},{"t":"四百七十一、两处\"对应卦\"：泰与姤的对偶","h":"这套体系里少见的成对关系","c":"数据——**64 段里有两处明确使用\"对应\"这个概念，须照录并核**。**其一（夫妻同住）**：\"**'**坤为地卦：**婚后的妈妈，**要和自己的丈夫住在一起为泰卦**——**二人同住西北卧室，气运最佳**'。'母居母位为坤为地卦'。**\" **其二（卦与卦的对偶）**：\"**'**地风升卦**：**其为姤卦之对应卦**——在地脉道之屡见不鲜'。**\" **复核（两步，全部可验）**：**①母（坤）＋西北（乾）→ **坤上乾下＝**地天泰** ✓**（**故\"妈妈与丈夫同住西北为泰卦\"完全吻合**）——**而这一条极重要**：**同一间西北房，**母亲单独住是\"坤为地\"（母居母位），**与丈夫同住则成\"泰\"**（**\"位\"没变，人变了**）；**②\"姤\"＝父（乾）＋东南（巽）→ 乾上巽下＝**天风姤** ✓**；**而原文给\"升\"写的是\"长女住母位（西南）\"——按卦体\"地风升\"＝**坤上巽下**推算，房位应为\"**母（坤）住东南（巽）**\"**（**⚠ 故\"升\"那一段的房位写颠倒了：若真是\"长女住西南\"，出的应是\"**风地观**\"——而\"观\"已被占用**）；**故\"升为姤之对应卦\"的正确读法是：**姤＝父（乾）住东南（巽）、升＝母（坤）住东南（巽）**——**同一个东南位、不同的人，出两卦**（**这又是\"同一间房、不同人住、两卦\"的一例**）**（**⚠ 而这两个卦在卦序上**并不相邻**，**\"对应\"是讲义的用法，不是《周易》的卦序关系**）。** **须说明（三层）**：**①\"**二人同住西北为泰**\"这一条，是全册**最温暖的一条规则****（**泰卦＝\"上下交而其志同\"**，**而\"同住一室\"恰好是\"相交\"**）——**⚠ 而它其实**脱开命理成立**：**夫妻住在一间屋里，**彼此能商量，**这就是\"泰\"****；**②而\"**母居母位**\"与\"**与夫同住**\"这两个选择，**在体系内部**是有冲突的****（**一个说\"名位相等\"最好，一个说\"同住西北气运最佳\"**）——**⚠ 而讲义没有解决这个冲突，**只是把两种说法都写了下来**；**③\"**姤与升互为对应**\"这一层，**说明这套体系有\"对偶\"的意识**（**它能看出\"父住东南\"与\"母住东南\"是一种对称**）——**⚠ 而这个意识**极好**，**与它\"8×8 矩阵\"的想法是一致的**（**只是矩阵里填的东西，有三处填错了**）。","o":"TJ-0954 · 天纪·紫微详解·第四章卦象详解·地脉道·坤为地／地风升（PDF 第155、313页）"},{"t":"四百七十二、房位的\"婚姻状态\"条件","h":"这套体系默认的家庭，是一个\"未婚子女同住\"的结构","c":"要点——**64 段的卦名行里，反复出现\"未婚\"的限定，而这一层是整套地脉道的**隐含前提**，须集中列出**。**原文标注（举例）**：\"**'山地剥卦（三儿子居西南角卧房，**长子和二子未婚**）'**\"；**\"'山天大畜卦（三儿子住西北角，**长子和二子未婚**）'**\"；**\"'山火贲卦（三子居正南卧房，**长子和二子未婚**）'**\"；**\"'泽风大过卦（三女住东南角卧房，**长女和二女未婚**）'**\"；**\"'火天大有（次女住父位，**自己未婚、姐姐未嫁**）'**\"；**\"'泽雷随卦（三女儿主正东卧房，**长女和儿女均未婚**）'**\"。** **须说明（四层）**：**①这些\"未婚\"标注，说明\"第几子/第几女\"这个身份是**按\"未婚子女的排行\"算的****（**一旦结婚，排行就变了**）——**⚠ 故这套体系的**家庭模型**是：**一对夫妻，加上若干未婚子女**；**②而\"**长子和二子未婚**\"这类标注，**实际是在说\"这个位现在空着\"**（**因为长子和二子都还没搬出去、也还没自己的家**）——**⚠ 故\"**三子住西南**\"的意思是：**在长子和二子都未婚的前提下，三子住了西南**（**⚠ 若长子已婚搬走，**这个\"三子\"就变成了\"次子\"**，**卦名随之改变**）；**③⚠ 而这一层使整套体系**极难验证**：**一个家庭的\"排行\"随婚嫁、生育、迁出**不断变化****，**而\"谁住哪间\"也随之变化**——**⚠ 于是\"当年是什么卦\"**可以事后按现状重新算**（**而重算出来的，**总能对上一个说法**）；**④本集按语**：**这一段最值得记的是\"**未婚**\"这两个字**（**它是这套体系的**前提**，**却被写成了括号里的附注**）——**⚠ 而\"**前提**\"如果没被说清，**结论就会看起来比它实际更可靠**。","o":"TJ-0955 · 天纪·紫微详解·第四章卦象详解·地脉道·各卦（PDF 第190~343页）  ---"},{"t":"四百七十三、八门配八卦：全册少见的一处完全正确","h":"\"乾开、坎休、艮生、震伤、巽杜、离景、坤死、兑惊\"","c":"数据——**第八章\"手掌论后天八卦\"在讲八个方位时，给每一卦配了一个\"门\"，而这一组配置与奇门遁甲的\"八门\"**完全吻合**，须照录并核**。**原文八条**：**'**乾位又为**开门**……利于求财、求官大吉**'；**'**坎位又为**休门**，代表不急不躁，**吉门**，宜休息聚会、经商、嫁娶、参谒贵人**'；**'**艮又为**生门**——**生为三吉门之一**，如果被困、不知走何方，**可走生门方向**'；**'**震也为**伤门**……主破耗、破财、伤身、被窃等**'；**'**巽为**杜门**……主破耗、破财、伤身、被窃等**'；**'**离为**景门**……主破耗、破财、伤身、被窃等**'；**'**坤为**死门**……主破耗、破财、伤身、被窃等**'；**'**兑为**惊门**，皮肤青色和暗色，主破耗、破财、伤身、被窃等**'。**复核（两步，全部可验）**：**①奇门\"八门\"为**开、休、生、伤、杜、景、死、惊**（**共八门，**\"开、休、生\"为三吉门**）——**而本册\"生为三吉门之一\"一句，**恰好对上了这个内部结构 ✓**；**②八门配后天八卦的标准对应为**乾开、坎休、艮生、震伤、巽杜、离景、坤死、兑惊**——**与本册八条**逐一吻合 ✓（8/8）**。** **须说明（三层）**：**①这是本册**极少见的\"完全正确\"的配置****（**与第七章\"**坤是南方**\"那一处错，**形成鲜明对照**）——**⚠ 而两处相隔仅数十页，**说明这一册的编校**是逐段抄录、**没有统一校过****；**②而\"**八门**\"这一组，**在本册其他地方（六壬法、六神占断）也反复出现**（**它与\"六壬\"\"六神\"合起来，构成一套**民间术数的工具包****）；**③⚠ 而\"**震、巽、离、坤、兑**\"五条的门后都跟着**同一句判语**（\"皮肤青色和暗色，主破耗、破财、伤身、被窃等\"）——**⚠ 这种\"一句话通吃五门\"的写法，**说明这一段的**实用部分**很薄****（**真正的信息只有\"看颜色\"一条**）。** **⚠ 本集按语**：**\"**不知走何方，可走生门方向**\"这一句，**是全册少有的\"可操作\"建议****（**它给出的是一个**方向**，**而不是一个判断**）——**⚠ 而\"走生门\"若要真用，**得先知道\"哪边是生门\"****（**而这需要起局，**本册没有讲**）。","o":"TJ-0956 · 天纪·紫微详解·第八章手掌论后天八卦（PDF 第255~256页）"},{"t":"四百七十四、手掌上的八个方位","h":"一张可以随时摊开的\"后天八卦图\"","c":"方法——**第八章把后天八卦的八个方位，**逐一对应到手掌的八个区域**，并给出每个区域的\"看什么、主什么\"，须完整照录**。**原文八条（方位—地支—五行—身体区—主事）**：**①**乾（西北）**——\"为**祖位，为父**，居**戌亥**，属**金**，**内分泌区**；**陷落、扁平代表与父母有克**；乾位又为**开门**，应为**红润**，利于求财、求官大吉\"**；**②**坎（正北）**——\"为**祖业**，居**子丑**，属**水**；**肥满有人管，陷凹白起家靠自己**；属于**生殖和泌尿区**；**陷落为没有祖业，饱满来龙大、祖业风水旺**\"**；**③**艮（东北）**——\"为**田宅**，居**丑寅**，属**土**；**横纹飞针兄弟稀**；**心脏与小肠区**；**丰隆资产多、兄弟旺**；**扁平兄弟少、钱财不旺**\"**；**④**震（正东）**——\"为**贤妻**、为自居，居**卯**，属**木**；**隆起得妻贤**；**低陷或色暗妻子有折损**；**胃部不好**\"**；**⑤**巽（东南）**——\"为**财禄**，居**辰巳**，属**木**；**丰满财禄丰盛，凹陷破财**；**乱纹子女守不住财**；**十字纹有信仰或者是易学人士**；为**胆区**\"**；**⑥**离（正南）**——\"为**官禄**，居**午**，属**火**；**丰隆官位高而稳，低陷事业难**；**心肺区**\"**；**⑦**坤（西南）**——\"为**福德、为子息子女**，居**未申**，属**土**；**凹陷、扁平、无肉为无子嗣**；**蓬起子息贵**；**纹深有克伤，泌尿与生殖有病人**\"**；**⑧**兑（正西，原文作\"正酉\"）**——\"为**员工**、为子息，居**酉**，属**金**；**肥润员工（仆役）性格温顺，家人兴旺、朋友多**；**陷纹奴欺主，朋友少、子嗣不旺**；**大肠区不太好**\"。** **须说明（四层）**：**①这张表的**结构极整齐**：**方位—地支—五行—身体区—主事**（**五列一一对应**）——**而\"地支\"这一列（戌亥、子丑、丑寅、卯、辰巳、午、未申、酉）**恰好把**十二地支分给了八方**（**每方 1–2 个**），**共 12 个** ✓；**②而\"身体区\"这一列（内分泌、生殖泌尿、心小肠、胃、胆、心肺、泌尿生殖、大肠）**，**与中医的\"脏腑—方位\"配属**大体一致**（**⚠ 但\"胃\"配震、\"胆\"配巽、\"心肺\"配离、\"大肠\"配兑，**与《内经》的\"东方肝木、南方心火、西方肺金、北方肾水、中央脾土\"**不同**）；**③⚠ 而\"**男孩手黑色妻损，女孩手黑色夫损**\"这一条，**须标为**以肤色断人，无据**（**手色的深浅，**与配偶的健康**没有因果关系**）；**④⚠ 而\"**横纹飞针兄弟稀**\"\"**乱纹子女守不住财**\"\"**纹深有克伤**\"这一类，**属于**掌纹断事**（**本集照录，标其为民间相法**）。** **⚠ 附一段极实在的\"明堂\"说明**：\"**'**明堂要平缓，不能凸起——放点水能存住为好**'**\"**——**\"**放点水能存住**\"这个检验方法，**极具体、可操作****（**它把\"平缓\"变成了一个**能当场试的动作**）——**⚠ 而这一层**其实与\"地势\"的常识相通**（**掌心凹一点，**确实更像\"能存住东西\"**）。","o":"TJ-0957 · 天纪·紫微详解·第八章手掌论后天八卦（PDF 第255~256页）"},{"t":"四百七十五、\"陷凹白起家靠自己\"","h":"掌相里几条极精的对照句，与四条须警告的断语","c":"要点——**第八章里的判语，有一批是**成对出现**的（\"饱满 vs 陷落\"），而其中最精的几句须照录**。**成对判语（照录）**：\"**'**坎在正北**：**肥满有人管，陷凹白起家靠自己**'。'**陷落为没有祖业；饱满来龙大、祖业风水旺**'**\"；**\"'**艮在东北**：**丰隆资产多、兄弟旺；扁平兄弟少、钱财不旺**'**\"；**\"'**巽在东南**：**丰满财禄丰盛；凹陷破财**'**\"；**\"'**离在正南**：**丰隆官位高而稳；低陷事业难**'**\"；**\"'**坤在西南**：**凹陷、扁平、无肉为无子嗣；蓬起子息贵**'**\"。** **另附手掌与指形的四条（照录）**：\"**'**玉柱纹，又称天柱纹，主发科甲**——**纹路越细越好，表示人正直**'。'**手掌横纹多、纹路深、心机重，破祖之象，破财破的很凶**'。'**手掌纹路太少、又浅、润泽，表示无城府、憨厚、略蠢**'。'**指甲无月牙为懦弱**'。'**指肚如锤，代表辛劳、愚顽**'。'**手指秘而不漏水，为人小气、不漏财**'。'**手指漏水，存不住钱，漏财**'。**\" **须说明（三层）**：**①\"**陷凹白起家靠自己**\"这一句**极精****（**\"白\"是\"白手\"的意思**）——**而它与\"肥满有人管\"构成一对**（**一个说\"有人靠\"，一个说\"靠自己\"**）——**⚠ 这一层**脱开掌相，极有道理**：**一个人的手若\"厚而实\"，**多半有人托着；**若\"薄而凹\"，**多半是自己在撑**；**②而\"**指肚如锤**\"这一条**极准****（**指肚饱满如小锤的人，**多是长年用手的人**——**劳动者、手艺人**）——**而讲义把它读成\"辛劳、愚顽\"，**前者对、后者是贬****；**③⚠ 而\"**指甲无月牙为懦弱**\"\"**手掌横纹多、心机重**\"\"**纹路太少、略蠢**\"这三条，**须标为**以形断性，无据****（**一个人的性情，**不由掌纹的多少决定**）——**⚠ 而\"**略蠢**\"这两个字，**是**对一个具体人的贬抑**（**而读到它的孩子，**可能真会信**）。** **⚠ 本集按语**：**这一段最值得留下的，是\"**手指秘而不漏水 / 手指漏水**\"这一对**（**它是全章唯一**可以用一个动作当场验证**的说法**）——**⚠ 而\"漏财\"与\"不漏财\"的真正区别，**在于**习惯**（**记账、预算、把钱分开**），**不在于指缝**。","o":"TJ-0958 · 天纪·紫微详解·第八章手掌论后天八卦（PDF 第256页）"},{"t":"四百七十六、二十八星宿全录","h":"天机道的\"天象\"部分，四组七宿与七曜","c":"数据——**第八章末尾，突然插入了一段\"天机道\"的总纲，把\"天象\"的构成讲清了，并**完整列出二十八星宿**，须全部照录**。**总纲**：\"**'**天机道包括：**天象**和**天文**'。'**天象**：**天罡二十八星宿 + 日月（太阳、月亮）+ 五星（木星、火星、土星、金星、水星）**'。**\" **四方七宿（原文照录，含七曜与动物）**：**'**东方苍龙七宿（**青色**）：角木蛟、亢金龙、氐土貉、房日兔、心月狐、尾火虎、箕水豹**'；**'**南方朱雀七宿（**红色**）：井木犴、鬼金羊、柳土獐、星日马、张月鹿、翼火蛇、轸水蚓**'；**'**西方白虎七宿（**白色**）：奎木狼、娄金狗、胃土雉、昴日鸡、毕月乌、觜火猴、参水猿**'；**'**北方玄武七宿（**黑色**）：斗木獬、牛金牛、女土蝠、虚日鼠、危月燕、室火猪、壁水獐**'。** **复核（三步，全部可验）**：**①四组各**七宿**，**4 × 7 ＝ 28** ✓（**东方角亢氐房心尾箕、南方井鬼柳星张翼轸、西方奎娄胃昴毕觜参、北方斗牛女虚危室壁**——**这四组名字，**与中国古代天文的二十八宿**完全一致 ✓**）；**②每宿的**第二个字（七曜）**：**角木、亢金、氐土、房日、心月、尾火、箕水**——**木、金、土、日、月、火、水**（**七曜，且顺序固定**）✓；**③四方配四色**：**东青、南赤、西白、北黑** ✓（**与\"四象\"（苍龙、朱雀、白虎、玄武）完全对应**）。** **须说明（三层）**：**①这一段是全册**最\"硬\"的一处知识****（**因为二十八宿是**可查、可核、有确定答案的古代天文体系****）——**⚠ 而它出现在一本讲紫微斗数的讲义里，**说明\"天纪\"的**知识范围**确实很宽**；**②⚠ 而\"**壁水獐**\"应为\"**壁水貐**\"**（**貐 yǔ**，**一种传说中的兽**；**\"獐\"是形近错字**）——**这是本组唯一的一处错字**；**③而\"**天文**\"那一段只有一句话**（**\"天文学是观察和研究宇宙间天体的学科；古代人对星象观察后，而后用易经进行推演，得出最后的结论\"**）——**⚠ 这句话**其实是全册方法论的一次自述**：**它承认\"**先观察、后用易经推演**\"**（**即：易经是被**用来解释**观察结果的**，不是**用来**预言**的**）。** **⚠ 本集按语**：**这一段\"**先观察，后推演**\"的顺序**极重要****——**如果认真对待这个顺序，**那\"天纪\"就该以**观察**为主、**推演**为辅**；**而全册的实际做法，**恰恰是**先有结论、再找现象**。","o":"TJ-0959 · 天纪·紫微详解·第八章手掌论后天八卦·天机道总纲（PDF 第256~257页）"},{"t":"四百七十七、\"先天卦为体，后天卦为用\"","h":"一句最简的方法论，与它在本册的三种用法","c":"要点——**第八章开篇两句，是这套体系里**最简的方法论表述**，须照录**：\"**'**第八章 手掌论后天八卦'。'**后天八卦也叫**文王八卦**'。'**先天卦为体、后天卦为用**'。**\" **须说明（三层）**：**①\"**先天为体、后天为用**\"这八个字，是**宋明易学的标准说法****（**先天八卦（伏羲）讲\"对待\"——阴阳相对；后天八卦（文王）讲\"流行\"——四时八方运转**）——**而\"体/用\"的意思是：**先天是\"本体、结构\"，后天是\"应用、变化\"**；**②而本册对这句话的**三种用法**都可核**：**①**手掌**——**排的是\"后天八卦\"**（**因为要\"用\"**）；**②**地脉道**——**用的是\"后天八卦的方位\"**（**西北乾、西南坤……**）；**③**紫微斗数**——**用的是\"宫位\"**（**与后天八卦的九宫有对应**）——**故全册\"用\"的部分，**一律是后天**；**③⚠ 而\"**体/用**\"这一层，**也是本册最容易被忽略的一句**：**它意味着\"先天八卦\"在本册里**几乎没被用过****（**除了\"乾为天\"\"坤为地\"这类卦名**）——**⚠ 故读到\"先天\"二字时，**要分清它是\"卦名\"还是\"体系\"****。** **⚠ 附一处\"文王八卦\"的说明**：**后天八卦之所以叫\"文王八卦\"，**是因为传说它由周文王推演**（**而\"先天八卦\"归给伏羲**）——**这一层是传说，**本集照录其名，不作考据**。","o":"TJ-0960 · 天纪·紫微详解·第八章手掌论后天八卦·开篇（PDF 第255页）"},{"t":"四百七十八、\"一头撞南墙，哪怕头破血流\"","h":"大壮卦的画像，是全册最好的一段","c":"要点——**大壮卦（第三十四卦）的\"性格\"段，写出了一类极具体的人，须完整照录**：\"**'上震下乾，**金克木**、不利于长男，为**纯阳无阴之象**——**孤阳不长、不利妇女儿孙**'。'个性急燥、遇事不稳；**不善理财、花销不节制**；虽有困难之日，但**财运可佳**；**能言善变、谋事不遂，婚姻不美**；**宜守不宜进、须防小人使坏**'。'**大壮是认死理的人**——**总觉得自己干什么都是对的**，**往往不讲情面**，**面对亲朋好友也是如此**；**一头撞南墙，哪怕头破血流也不含糊**；**一辈子为了名声**，**总以为自己很壮，天不怕、地不怕**'。**\" **须说明（三层）**：**①\"**认死理**\"\"**不讲情面**\"\"**一头撞南墙，哪怕头破血流也不含糊**\"这三句，是**全册最好的一段人物画像****（**它写的不是\"刚强\"，而是**\"用刚强来证明自己刚强\"****）——**⚠ 而\"**一辈子为了名声**\"这六个字，**点中了这类人的要害**：**他们要的不是赢，是**被人看见赢了**；**②而讲义给的\"解药\"极准**：\"**'**得此卦要**凭实力说话**，**非利勿贪**'。'要善于**制造声势**——有了名气、名声**可以直接成就事业**，**但是不能刚愎自用**，**应反复检讨自己**才能走得更远'**\"**——**⚠ 而\"**制造声势**\"与\"**反复检讨**\"这两句，**恰好是\"大壮\"的两面**（**一面是\"扬\"，一面是\"省\"**）；**③⚠ 而\"**孤阳不长、不利妇女儿孙**\"这一句，**须标**：**大壮的卦体（震上乾下）为\"四阳二阴\"**（**不是\"纯阳\"**）——**\"纯阳无阴\"这个说法，**与卦体不符****（**六爻中九四、九二、初九为阳，六五、上六为阴**——**故是\"四阳二阴\"**）。** **⚠ 附卦辞**：\"**'大壮：利贞。象曰：**雷在天上，大壮；君子以非礼勿履**'**\"**——**\"**非礼勿履**\"这四个字，**是《周易》对大壮最硬的一句告诫****（**\"强\"不是问题，**\"强而不守礼\"才是**）——**⚠ 而这一句，**比\"认死理\"那段更值得记**。","o":"TJ-0961 · 天纪·紫微详解·第四章卦象详解·雷天大壮·性格（PDF 第258~259页）"},{"t":"四百七十九、\"申卯暗合、卯戌明合\"","h":"一处六合关系的核对","c":"数据——**大壮卦的图解里有一组\"猴兔犬\"的判语，涉及地支六合，须核**：\"**'一猴一兔一犬，主逢**申卯戌**则吉利**——**申卯暗合、卯戌明合**，**说明内部有危机**'。**\" **复核（两步）**：**①生肖对应——猴＝**申**、兔＝**卯**、犬＝**戌** ✓**（**与\"子鼠、丑牛、寅虎、卯兔、辰龙、巳蛇、午马、未羊、申猴、酉鸡、戌狗、亥猪\"完全一致**）；**②地支**六合**为：**子丑、寅亥、卯戌、辰酉、巳申、午未**——**故\"**卯戌**\"是**明合** ✓**（**原文说对**）——**⚠ 而\"**申卯**\"**不在六合之列****（**申所合的是**巳**，**不是卯**）。** **须说明（三层）**：**①\"**卯戌明合**\"这一句可核且正确**（**卯戌合火**）——**而\"**申卯暗合**\"这一句，**在标准六合体系里**不成立****（**\"暗合\"通常指\"子巳、寅未\"这类\"隔位相合\"，**也与申卯无关**）；**②⚠ 而这一处的**用意**，其实是把\"**申卯戌**\"三个生肖连起来**（**因为图中画了猴、兔、犬**）——**⚠ 故\"暗合\"二字，**是**为了把三个生肖串成一个故事**而临时加的**（**它服务于\"内部有危机\"这个结论**）；**③而\"**说明内部有危机**\"这一句，**是全卦最好的一层**（**外部声势浩大（天神腾云驾雾），而内部有暗合**）——**⚠ 这一层**脱开术数成立**：**一个\"大壮\"的局面里，**最危险的不是外面的对手，是**里面已经私下串通的人**。** **⚠ 附同卦另一句极好的告诫**：\"**'一位官人烧香拜谢，主**祈福消灾**——**遇事不可刚猛**'**\"**——**\"**遇事不可刚猛**\"这六个字，**是对\"大壮\"最直接的修正**。","o":"TJ-0962 · 天纪·紫微详解·第四章卦象详解·雷天大壮·人间道（PDF 第258页）"},{"t":"四百八十、\"何时可用大壮为最利？何时须离开此局？\"","h":"全册第一次正面提出\"局的时效\"","c":"要点——**大壮卦\"地脉道\"的开头，用**四个问句**提出了一件事：**局不是永久有效的**，须完整照录**：\"**'**雷天大壮卦（**长子住西北角，未婚**）**：此卦局（未婚长子住西北角）**也常见不鲜**——**吾人须知**：**何局为大壮局？如何利用大壮局？**'。'**何时可用大壮为最利？何时须离开此局？**'。**\" **须说明（三层）**：**①这四个问句里，后两个是**全册第一次正面承认\"局有期限\"****（**前面\"观卦婚后局消\"是**顺带说的**，**而这里是**当作方法提出的**）——**⚠ 而\"**何时须离开**\"这个问法，**其实承认了\"局会害人\"**；**②而\"**如何利用**\"与\"**何时须离开**\"并列**，**说明这套体系的**自我定位**是\"**可以用、也可以停用**\"**（**⚠ 而\"停用\"的标准是什么？**讲义在这一段**没有给**——**它给的是**四个问句，**不是一个答案**）；**③⚠ 而这一层极重要**：**如果\"局\"真能决定一个孩子的学业、婚姻、健康，**那\"何时须离开\"就该有一个**可判断的界限****（**而全册**从未给出过**）——**⚠ 故\"何时须离开此局\"这七个字，**是全册一个**未被回答的关键问题****。** **⚠ 本集按语**：**这一段最值得记的，**是它**把问题提出来了****——**一个**敢问\"何时该停\"**的体系，**比一个只说\"必须一直照着做\"的体系，**要诚实一些**（**而\"诚实一些\"不等于\"有效\"**）。","o":"TJ-0963 · 天纪·紫微详解·第四章卦象详解·雷天大壮·地脉道（PDF 第259页）  ---"},{"t":"四百八十一、六兽配五行：这一章是对的，第七章是错的","h":"同一册里两套六兽，一套用\"腾蛇\"、一套用\"六合\"","c":"数据——**第九章开篇即给出六兽的完整名单，并逐条配了五行，而这一组与第七章（六壬法）的六神**不一致**，须并置核对**。**第九章原文**：\"**'**六神占断法**：六神是指**神兽**，即**青龙、白虎、朱雀、玄武、腾蛇、勾陈**'。'看来龙、看面相、看手纹、看动作、看脸上纹路、**测字取笔画**等'。**\" **而各兽的五行（原文分散于各处）**：**青龙属**木**、朱雀属**火**、白虎属**金**、玄武属**水**、勾陈属**阳土**、螣蛇属**阴土**。** **复核（三步，全部可验）**：**①传统\"六兽\"为**青龙、朱雀、勾陈、腾蛇、白虎、玄武**——**第九章六条**逐一吻合 ✓（6/6）**；**②六兽配五行为**青龙木、朱雀火、勾陈阳土、螣蛇阴土、白虎金、玄武水**——**五行齐全、且\"土\"分阴阳（勾陈阳土、螣蛇阴土）** ✓（**这一层是标准配置，**极精确**）；**③⚠ 而第七章（六壬法）的六神是**大安（木青龙）、留连（水玄武）、速喜（火朱雀）、赤口（金白虎）、小吉（木六合）、空亡（土勾陈）**——**用了\"**六合**\"，**缺了\"**腾蛇**\"****（**而\"六合\"本是十二地支相合的概念，**不是六兽**）。** **须说明（三层）**：**①故同一册里**有两套六兽**：**第九章**用对了（青龙、白虎、朱雀、玄武、腾蛇、勾陈），**第七章**用错了一个（以\"六合\"代\"腾蛇\"）**——**⚠ 而这不是\"版本差异\"，**是**两段内容来自不同来源**（**第七章自己说\"此文摘自于网上\"，**第九章则给了书目（见下条）**）；**②而\"六兽\"这一套，**在术数里是**共通的底层符号****（**它同时用于风水（青龙白虎）、相法（气色）、测字（笔画）、六壬（占课）**）——**故\"六兽\"是这一册里**贯穿性最强的一个概念**；**③⚠ 而本集据此建议**：**引用\"六兽\"时，**一律采用第九章的六条**（**青龙、白虎、朱雀、玄武、腾蛇、勾陈**），**并为\"腾蛇/六合\"这一差别加上标注**。** **⚠ 附本章的**唯一书目**：\"**'**倪师使用的是**三元、三合罗盘**；书是**《周天罗经用法正解》**'。'**不为重点略过**……'**\"**——**这是全册第二处给出具体书名的段落**（**第一处是\"方法来自沈平山\"的五本书**）——**⚠ 而\"不为重点略过\"这六个字，**说明讲义**自己知道这一块讲得少****（**而\"罗盘\"这一支，**本册确实没有展开**）。","o":"TJ-0964 · 天纪·紫微详解·第九章六神占断法·开篇（PDF 第264页）"},{"t":"四百八十二、\"青主脾脏、黄主肝脏\"","h":"一处可核的五色配脏腑错位","c":"数据——**第九章列了八种气色所主的吉凶与病症，其中两处与中医\"五色主病\"**恰好互换**，须照录并核**。**原文八条**：\"**'**青**：主担忧、惊吓、烦怒、疲惫、**筋骨、脾脏病症**'。'**赤**：主破财、火厄、官司、血光、灾离，**心脏、血液循环病症**'。'**黄**：主进财、增福、升迁，**肝脏病症**'。'**白**：主丧服、刑克、破耗，**肺脏病症**'。'**黑**：主失窃、水厄、灾病、破败，**肾脏病症**'。'**红**：主喜庆、进财、创业、情欲'。'**紫**：主进贵'。'**朦**：主停滞、耗损'。**\" **复核（两步，全部可验）**：**①中医\"五色主病\"的标准配属为**青—肝、赤—心、黄—脾、白—肺、黑—肾**（**《灵枢·五色》一系**）——**而原文的**赤—心脏、白—肺、黑—肾**三条**全部正确 ✓**；**②⚠ 而**青—脾脏、黄—肝脏**这两条，**与标准配属**恰好互换****（**应为**青—肝、黄—脾**）**——**⚠ 且\"青\"这一条里**同时写了\"**筋骨**\"**（**\"肝主筋\"——**原文自己知道\"青→肝→筋\"这条链**，**却把脏腑写成了\"脾\"**）。** **须说明（三层）**：**①故本段是**三条对、两条错**（**而错的两条**恰好是**互换了位置**，像抄录时串行**）**；**②这一层**极重要**：**它说明\"五色—五脏\"这套**有明确答案的配属**，在本册里**没有被校过**（**而这类错**在\"望诊\"上会误导**——**\"面黄\"若被读成\"肝病\"，**方向就错了**）；**③⚠ 而\"**赤**\"与\"**红**\"在中文里常同义，**这里却**分判吉凶**（**赤主破财血光、红主喜庆进财**）——**⚠ 这一层**须标**：**\"赤、红\"分列，**是这一套体系的内部约定**（**而不是颜色的客观区别**）。** **本集按语**：**这一段最值得记的是它**把\"看气色\"当成一门**有确定配属的知识****——**而配属一旦写错，**整套判断就**从根上偏了**（**⚠ 故本集按语一律采用**青—肝、赤—心、黄—脾、白—肺、黑—肾**）。**","o":"TJ-0965 · 天纪·紫微详解·第九章六神占断法·气色（PDF 第264~265页）"},{"t":"四百八十三、六气的六个比喻","h":"把\"气\"变成看得见的画面","c":"要点——**第九章引\"袁天罡论六神气法\"，用六个比喻描写六兽之气，须完整照录**：\"**'**青龙之气，**如祥云衬月**；**朱雀之气，**如朝霞映水**；**勾陈之气，**如黑风吹云**；**螣蛇之气，**如草木将灰**；**白虎之气，**如凝脂涂油**；**玄武之气，**如腻烟和雾**'。**\" **须说明（三层）**：**①这六个比喻，是**全册最好的六句\"描写\"****（**它们不判断吉凶，只让人**看见一种气**）——**而\"**气**\"这种东西本无法定义，**只能靠比喻传递**；**②六个比喻各有一个**共同结构**：**\"某种东西 ＋ 某种状态\"**（**祥云衬月（明净）、朝霞映水（绚烂）、黑风吹云（阴沉）、草木将灰（枯败）、凝脂涂油（油亮冷白）、腻烟和雾（浑浊**）——**⚠ 而它们对应的**吉凶**，**恰好与画面的\"明/暗\"一致**（**青龙（明）吉、白虎（油亮）凶、玄武（浑浊）凶**）；**③⚠ 而\"**草木将灰**\"（腾蛇）与\"**腻烟和雾**\"（玄武）这两句最准**（**\"将灰\"是\"还没烧完、但已注定成灰\"**；**\"腻\"是\"黏住、不清爽\"**）——**⚠ 这两句**读起来像**对某种人的描述**（**一个是\"将尽未尽\"，一个是\"黏糊不清\"**）。** **⚠ 本集按语**：**这六句的价值，**不在\"论气\"，**而在**汉语怎么形容不可言说之物****——**⚠ 而它们也提醒读者**：**一个人\"气色不好\"，**最直接的读法是\"他累了/他病了\"，**而不是\"他要破财了\"**。","o":"TJ-0966 · 天纪·紫微详解·第九章六神占断法·袁天罡论六神气法（PDF 第264页）"},{"t":"四百八十四、六神的笔法：一个\"字形—吉凶\"的映射","h":"测字的六条笔诀，与六个符号","c":"方法——**第九章把六兽一一对应到**汉字的笔画形状**，并给了歌诀与例字，须完整照录**。**歌诀（原文）**：\"**'**左上右下是**腾蛇**，右上左下**勾陈**'。'**蚕头燕额是青龙，尖短交加朱雀神，弯弓斜月勾陈象，腾蛇长曲势如行，尾尖口阔为白虎，体态方尖玄武行**'。**\" **笔法与例字（原文）**：\"**'**六神风水与笔法**：'**八**'：**青龙木**。'**乂**'：**朱雀火**。'**勹**'：**勾陈土**'。**\" **分述六条**：**①**青龙**——\"**撇或者一捺，没有段落**，如'**八、入**'等字；**属木，主吉利喜庆**\"；**②**朱雀**——\"**笔画为交叉**，如'**乂、又**'；**属火，主是非口舌、火灾和文书消息**\"；**③**白虎**——\"**笔画'几'**；**属金，主凶灾横祸或来势凶猛之事**\"；**④**玄武**——\"**'厶、么、纟、厷、口'这种尖的都是玄武**；**主盗贼**——'口'字是玄武招小偷；**属水，主暧昧、隐私、盗窃之事**\"；**⑤**勾陈**——\"**'乙、乞、勹、勾、成、风'**；**属阳土，主田土不动产、文章的事情**；谋事**中间事事差，结果停在原地**\"；**⑥**腾蛇**——\"**'e、㔾、已'**；**属阴土**；螣蛇遇者**主惊虚，家宅逢之不安宁，主惊忧怪异之事**\"。** **须说明（三层）**：**①这是一套**完整的\"字形—六兽—吉凶\"映射**（**六兽 × 五类例字，条条可对上**）——**而它在本册是**独立于卦、宫、星之外的第四套系统**（**前三是卦象、紫微、六壬**）；**②⚠ 而这一套的**前提**是\"**写字的人，**在写字那一刻的状态，会落在字形上**\"**——**⚠ 这个前提**在\"笔迹学\"上有部分支持**（**笔迹确实反映习惯与情绪**），**但\"某个笔画像'几'就主牢狱\"，**则**越过了因果**；**③⚠ 而\"**'口'字是玄武招小偷**\"这一条最典型**（**\"口\"是**最常用的汉字部件之一**，**按此规则，**几乎每封信都在\"招小偷\"**）——**⚠ 故本集按语：**这套笔诀可当**文字游戏**读**（**它有文化趣味**），**不可当**判断依据**用**。** **⚠ 附一处**极具体的风水对应**：\"**'**山势形为白虎，山势或房屋，**右侧为白虎，不能高于左侧**，也包括**室内家具**'**\"**——**\"**左青龙、右白虎**\"这一组**是风水里最常见的说法**（**左侧（东）宜高、右侧（西）宜低**）——**⚠ 而它**有一点实用面**：**若屋子朝南，**右侧过高**确实容易挡光**（**但这是采光问题，**与\"带孝、病危\"无关**）。","o":"TJ-0967 · 天纪·紫微详解·第九章六神占断法·定六神歌诀／笔法（PDF 第265~268页）"},{"t":"四百八十五、\"蹲下去看不到，站起来就看到了\"","h":"全册最具体的一个\"检验动作\"","c":"要点——**第九章讲\"玄武\"时，给出了一则**可以当场做的检验**，须完整照录**：\"**'**玄武**：**来龙不够圆润就是玄武——因为出现死角**；**阴宅**：**案山后藏着一个小山头**——**人一蹲下去就看不到小山头，人站起来就看到了**——**下一代一定出窃贼**'。**\" **须说明（三层）**：**①\"**人一蹲下去就看不到、人站起来就看到了**\"这一句，**是全册**最具体、最可操作的一个\"检验\"****（**它不是\"你觉得像不像\"，而是**一个能反复试的动作**）——**⚠ 这与前面\"**明堂放点水能存住**\"是**同一种思路**（**把\"看风水\"变成一个**可验证的观察**）；**②⚠ 而\"**下一代一定出窃贼**\"这一句，**须明确否定**（**一个山头的可见与否，**与一个人的行为**没有因果关系**）——**⚠ 而这句话的**实际伤害极重**：**一个家族里若真出了盗窃案，**这句话会把\"教子无方\"变成\"祖坟选错了\"****（**而\"祖坟\"是不可改的**，**于是责任被永久卸掉**）；**③⚠ 而\"**出现死角就是盗贼**\"这一层，**把\"形\"直接连到\"人事\"**（**\"死角\"是空间形状，**\"盗贼\"是人的行为**）——**⚠ 而两者之间，**只有\"联想\"，**没有\"路径\"**。** **⚠ 本集按语**：**这一段最值得留下的，**是那个**检验动作本身**（**\"蹲下、站起\"**）——**它说明**讲风水的人**也在寻找**能说清、能复核的东西****（**⚠ 而一旦要说清，**\"下一代会出窃贼\"这种话就**站不住了**）——**⚠ 故本集建议：**看风水时，**把它当成**\"观察空间\"的方法**（**采光、通风、视野、动线**），**而不是**\"观察人的命运\"的捷径**。","o":"TJ-0968 · 天纪·紫微详解·第九章六神占断法·玄武（PDF 第266页）"},{"t":"四百八十六、\"来看气色\"之前，先看这四条","h":"一处极好的\"六神总纲\"，与它覆盖的六个对象","c":"要点——**第九章开篇那句话，其实给出了这套方法的**六个观察对象**，须抄出并说明**：\"**'**六神占断法**：六神是指神兽，即青龙、白虎、朱雀、玄武、腾蛇、勾陈'。'**看来龙、看面相、看手纹、看动作、看脸上纹路、测字取笔画**等'。**\" **须说明（四层）**：**①这六个对象，**恰好覆盖了这一册的全部\"看相\"手段****：**来龙（地理）、面相（脸）、手纹（掌）、动作（行为）、脸上纹路（细部）、笔画（字）**——**⚠ 而它们是**同一种判断法的六个入口**（**都用\"六兽\"这套符号去读**）；**②而**\"看动作\"这一条最值得注意**（**它把\"行为\"也纳入了判断**）——**⚠ 而\"看动作\"其实是**六个对象里唯一可能\"准\"的一个**（**一个人的动作，**确实反映他的状态、习惯、底气**）；**③⚠ 而\"看手纹\"\"看脸上纹路\"这两条，**与前面第八章的掌相、第十九例的面相断语**（**\"颧大压鼻表有权\"\"孤坐到老\"**）**属于同一类**——**本集一律标为**无据**；**④⚠ 而\"**测字取笔画**\"这一条，**须单独标**：**它把\"人写的字\"当成\"人本身\"**——**⚠ 而一个人写\"几\"字，**可能是他**在写\"茶几\"**（**而\"茶几\"与\"牢狱\"无关**）。** **⚠ 本集按语**：**这一段最值得记的，**是那**六个对象的排列**——**从\"来龙\"（最远）到\"笔画\"（最近）**，**恰好是一套\"由远及近\"的观察法**（**而\"越近的东西，**越能反映一个人\"**）——**⚠ 若按这个顺序读，**\"看动作\"这一条，**才是六个里最该重视的**。","o":"TJ-0969 · 天纪·紫微详解·第九章六神占断法·开篇（PDF 第264页）"},{"t":"四百八十七、家人卦：\"主妇正则全家正\"","h":"治家之道的一段白话，与一句极好的象辞","c":"要点——**家人卦（第三十七卦）的\"人间道\"解象段，把这一卦的**家庭伦理**讲得极清楚，须完整照录**：\"**'风火家人卦，外卦为巽，巽为风；内卦为离，离为火——**内火外风，风助火势，火助风威，相辅相成**，这是家人卦的卦象'。'家人卦实际上强调的是**家庭伦理关系**，是**治家之道**——**在家主妇是核心，主妇正则全家正**'。'在家**每个人要有自己的角色和意识——父是父、子是子**，**治家要有明确的分工**'。'**男子齐家的目的是治国平天下**——**事业成功与否，与家庭支持有关密切的关系**'。**\" **又象辞**：\"**'家人：**利女贞**。象曰：**风自火出，家人；君子以言有物，而行有恒**'。**\" **须说明（四层）**：**①\"**主妇正则全家正**\"这一句，是全册**最直接的一句家庭论断****（**它把\"家\"的重心，放在了**那个管日常的人**身上**）——**⚠ 而这一层**脱开卦象成立**：**一个家里，**谁在管吃穿、管作息、管情绪，**谁就在定这个家的调子**；**②\"**父是父、子是子**\"这四个字，**是《论语》\"君君臣臣父父子子\"的白话**（**而它在本册这里的用法**是对的**：**各在其位**）；**③\"**君子以言有物，而行有恒**\"这八个字，**是全册**最好的一句修身话****（**\"言有物\"＝说话有内容；\"行有恒\"＝做事有恒心**）——**⚠ 而\"**有恒**\"这两个字，**恰好是\"**改运**\"这件事最难的部分**（**因为\"改\"需要的不是\"知道\"，**是\"一直做\"**）；**④⚠ 而\"**纯阴之象**\"这一条，**与卦体不符**（**家人为四阳二阴**：**初九、九三、九五、上九为阳，六二、六四为阴**）——**⚠ 这与大壮卦\"纯阳无阴\"是**同一类错**（**看见阳多就说纯阳、看见阴多就说纯阴**）。** **⚠ 附**\"**此卦为董永丧父，卖身葬父卜得之卦，后感动仙女下凡为妻**\"**——**二十四孝的典故（董永）**，**与\"家人\"这一卦的\"家\"相配**——**⚠ 而\"感动仙女\"这一层，**须标为**传说**。（**而同卦\"此卦缺少官鬼爻\"一句，**属结构标注**：**\"缺\"应读作\"不可断\"，**而非\"不好\"**。）","o":"TJ-0970 · 天纪·紫微详解·第四章卦象详解·风火家人·性格／人间道（PDF 第269页）"},{"t":"四百八十八、家人卦的地脉道与金钱课","h":"一处\"五条\"清单，与第二十五次符号验证","c":"数据——**家人卦（第三十七卦）的\"地脉道\"与\"金钱课\"，须并录并核**。**地脉道原文**：\"**'**风火家人卦（**长女居正南卧房**）：**今日常见之卦局**——①**从官职必无法升职**；②**科甲功名无虑**；③**婚延后五年，与同时生人不同**；④**与家人相处和睦，且非常顾家**；⑤**多妇人病**'。'**名位不等**：**官运不前，科甲高中；婚姻延后五年，家人和睦，妇人病多**'。**\" **复核（一步，可验）**：**长女＝**巽**（上卦）、**正南**＝**离**（下卦）→ **巽上离下＝**风火家人** ✓**（**与卦名完全吻合**，**是 8×8 矩阵里填得对的那些之一**）。** **金钱课原文**：\"**'**风火家人：**○○×○×○（**镜里观花**）下下**'。**\" **复核（一步，可验）**：**家人卦六爻自下而上为**阳（初九）、阴（六二）、阳（九三）、阴（六四）、阳（九五）、阳（上九）**；**符号 ○○×○×○ 自右向左（○阳、×阴）＝○阳、×阴、○阳、×阴、○阳、○阳 → **阳、阴、阳、阴、阳、阳** ✓**（**与爻题完全吻合**，**这是本册第二十五次符号验证，仍无一反例**）。** **须说明（三层）**：**①\"**镜里观花**\"这个签名极准**（**镜子里的花：看得见、拿不到**）——**而\"**下下**\"这个等级，与\"家和人睦\"的内容**并不相称****（**⚠ 这正说明\"签名\"与\"断语\"是**两套东西**，**彼此不必一致**）；**②⚠ 而\"**多妇人病**\"这一条，**与前面第十九例\"**此房西南主卧男人住天地否、女人住则当老板**\"是**同一类\"房位—身体\"断言**——**本集照录，**标其为无据**（**住在哪间房，**不决定谁生病**）；**③⚠ 而\"**婚延后五年**\"这个\"五年\"**极具体**（**而全册没有给出\"五年\"的推算依据**）——**⚠ 本集建议：**凡看到\"延后五年\"\"必不足三月\"\"住满第二年必见\"这类**精确到年月的断言**，**都当作**叙述细节**，**而不是**可检验的预测**。** **⚠ 附\"先天／后天／流年\"三栏里一句极具体的**\"严母持家\"**（**先天栏**）——**⚠ 这四个字**与本卦\"主妇是核心\"呼应**，**是这一册里**少数前后自洽的地方**。","o":"TJ-0971 · 天纪·紫微详解·第四章卦象详解·风火家人·地脉道／文王金钱课（PDF 第269~270页）  ---"},{"t":"四百八十九、起卦的操作法：约定第一次被明说","h":"\"国徽朝上为阳爻画○，字面朝上为阴爻画×，从右到左画完六次\"","c":"方法——**第十章开篇给出了\"文王六十四卦金钱课\"的**完整操作法**，而这是全册**第一次明说**这套符号的约定**，须完整照录**：\"**'操作法：用**一枚一元人民币（硬币）**，随意向空中抛出，看其落地后是**国徽朝上、还是字面朝上**'。'如果是**国徽朝上，为阳爻**，在纸上画一**圆圈（○）**；如果是**字面朝上，为阴爻**，在纸上画一**叉（×）**'。'这样**连续抛出六次**，或圈或叉**从右到左画完六次为止，为一卦**。对应着下面的六十四个卦，自己找\"吉凶祸福\"就可以了'。'**国徽为○，文字为×**'。**\" **须说明（四层）**：**①这一条把本集前文一直用\"反推\"方式确认的三件事，**全部正面写明了****：**（一）**○为阳爻、×为阴爻**；（二）**符号从右到左画，即最右为初爻**；（三）**六次成卦**（**每次一爻，自下而上定爻位**）——**⚠ 而这三条，本集此前已用**25 次卦形比对**验证过，**结论**与原文完全一致 ✓**；**②而\"**连续抛出六次**\"这一句，**说明这套金钱课用的是**\"六爻一次成卦\"**（**不是\"一爻一爻问\"**）——**而每一次投币是**独立**的（**所以六爻的概率各为 1/2**）；**③⚠ 而\"**一枚一元人民币**\"这个说法，**说明这一章是**现代编写**的**（**\"一元人民币\"硬币是 1991 年以后的事**）——**⚠ 这与前面\"紫易奇缘 2023 年重写本\"的判断**互为印证**；**④⚠ 而\"**国徽朝上为阳**\"这个约定本身，**是**人为规定**（**国徽面与字面并无阴阳之别**）——**⚠ 故\"哪面算阳\"完全取决于起卦人的约定**（**换一个约定，同样的投币结果，**就是一个相反的卦**）。** **⚠ 本集按语**：**这一段最大的价值，不在\"怎么起卦\"，而在**它终于把\"约定\"说清楚了**——**一门术数如果能说清自己的\"编码规则\"，**至少是可以被核对、被复现的**（**而\"说清了\"与\"有效\"，仍是两件事**）。","o":"TJ-0972 · 天纪·紫微详解·第十章文王六十四卦金钱课·操作法（PDF 第340页）"},{"t":"四百九十、六十四卦符号总表（上，1~32）","h":"原文目录所给，逐条复算","c":"数据——**第十章目录给出了**全部 64 卦的符号串**，本集用\"卦体推六爻、再按'上爻到初爻'排成字符串\"的方法逐条复算，**结果 63 条吻合、1 条有误**（详见第四条）。**上篇 1~32（符号串**从左到右＝上爻到初爻**）**：\n\n| # | 卦 | 目录符号 | 核对 |\n|---|---|---|---|\n| 1 | 乾为天 | ○○○○○○ | ✓ |\n| 2 | 坤为地 | ×××××× | ✓ |\n| 3 | 水雷屯 | ×○×××○ | ✓ |\n| 4 | 山水蒙 | ○×××○× | ✓ |\n| 5 | 水天需 | ×○×○○○ | ✓ |\n| 6 | 天水讼 | ○○○×○× | ✓ |\n| 7 | 地水师 | ××××○× | ✓ |\n| 8 | 水地比 | ×○×××× | ✓ |\n| 9 | 风天小畜 | ○○×○○○ | ✓ |\n| 10 | 天泽履 | ○○○×○○ | ✓ |\n| 11 | 地天泰 | ×××○○○ | ✓ |\n| 12 | 天地否 | ×××○○○ | **⚠ 见第四条** |\n| 13 | 天火同人 | ○○○○×○ | ✓ |\n| 14 | 火天大有 | ○×○○○○ | ✓ |\n| 15 | 地山谦 | ×××○×× | ✓ |\n| 16 | 雷地豫 | ××○××× | ✓ |\n| 17 | 泽雷随 | ×○○××○ | ✓ |\n| 18 | 山风蛊 | ○××○○× | ✓ |\n| 19 | 地泽临 | ××××○○ | ✓ |\n| 20 | 风地观 | ○○×××× | ✓ |\n| 21 | 火雷噬嗑 | ○×○××○ | ✓ |\n| 22 | 山火贲 | ○××○×○ | ✓ |\n| 23 | 山地剥 | ○××××× | ✓ |\n| 24 | 地雷复 | ×××××○ | ✓ |\n| 25 | 天雷无妄 | ○○○××○ | ✓ |\n| 26 | 山天大畜 | ○××○○○ | ✓ |\n| 27 | 山雷颐 | ○××××○ | ✓ |\n| 28 | 泽风大过 | ×○○○○× | ✓ |\n| 29 | 坎为水 | ×○××○× | ✓ |\n| 30 | 离为火 | ○×○○×○ | ✓ |\n| 31 | 泽山咸 | ×○○○×× | ✓ |\n| 32 | 雷风恒 | ××○○○× | ✓ |\n\n**须说明（两层）**：**①\"✓\"的判据只有一条**：**由卦体（上卦、下卦）推出六爻，自下而上排成\"初→上\"，再倒序排成\"上→初\"的符号串**（**○对阳、×对阴**）——**与本集前面 25 次单卦验证，用的是**同一个判据****；**②\"**地天泰**\"与\"**天地否**\"这两条，**是本表里唯一一对\"看起来该相反、却写成一样\"的**（**而它们恰好是《易经》里最有名的一对**，**见第四条**）。","o":"TJ-0973 · 天纪·紫微详解·第十章文王六十四卦金钱课·目录（PDF 第341页）"},{"t":"四百九十一、六十四卦符号总表（下，33~64）","h":"后半 32 卦，全部吻合","c":"数据——**续上表，33~64**：\n\n| # | 卦 | 目录符号 | 核对 |\n|---|---|---|---|\n| 33 | 天山遯 | ○○○○×× | ✓ |\n| 34 | 雷天大壮 | ××○○○○ | ✓ |\n| 35 | 火地晋 | ○×○××× | ✓ |\n| 36 | 地火明夷 | ×××○×○ | ✓ |\n| 37 | 风火家人 | ○○×○×○ | ✓ |\n| 38 | 火泽睽 | ○×○×○○ | ✓ |\n| 39 | 水山蹇 | ×○×○×× | ✓ |\n| 40 | 雷水解 | ××○×○× | ✓ |\n| 41 | 山泽损 | ○×××○○ | ✓ |\n| 42 | 风雷益 | ○○×××○ | ✓ |\n| 43 | 泽天夬 | ×○○○○○ | ✓ |\n| 44 | 天风姤 | ○○○○○× | ✓ |\n| 45 | 泽地萃 | ×○○××× | ✓ |\n| 46 | 地风升 | ×××○○× | ✓ |\n| 47 | 泽水困 | ×○○×○× | ✓ |\n| 48 | 水风井 | ×○×○○× | ✓ |\n| 49 | 泽火革 | ×○○○×○ | ✓ |\n| 50 | 火风鼎 | ○×○○○× | ✓ |\n| 51 | 震为雷 | ××○××○ | ✓ |\n| 52 | 艮为山 | ○××○×× | ✓ |\n| 53 | 风山渐 | ○○×○×× | ✓ |\n| 54 | 雷泽归妹 | ××○×○○ | ✓ |\n| 55 | 雷火丰 | ××○○×○ | ✓ |\n| 56 | 火山旅 | ○×○○×× | ✓ |\n| 57 | 巽为风 | ○○×○○× | ✓ |\n| 58 | 兑为泽 | ×○○×○○ | ✓ |\n| 59 | 风水涣 | ○○××○× | ✓ |\n| 60 | 水泽节 | ×○××○○ | ✓ |\n| 61 | 风泽中孚 | ○○××○○ | ✓ |\n| 62 | 雷山小过 | ××○○×× | ✓ |\n| 63 | 水火既济 | ×○×○×○ | ✓ |\n| 64 | 火水未济 | ○×○×○× | ✓ |\n\n**须说明（三层）**：**①后半 32 卦**全部吻合**（**32/32**）——**而其中\"**既济（×○×○×○）\"与\"**未济（○×○×○×）\"恰为**互倒**（**而\"既济/未济\"本是一对**，**符号互倒，正合卦序**）；**②而\"**泽天夬（×○○○○○）\"与\"**天风姤（○○○○○×）\"也是**互倒**（**夬是一阴在上、姤是一阴在下**）——**⚠ 这一对极重要**：**它与本集前面\"泰/否、随/蛊符号近似而卦义不同\"是**同一类例子****（**说明这些符号**不是随手写的**）；**③\"**风山渐（○○×○××）\"**这一条**恰好补上了本册地脉道里\"**渐卦缺房位**\"的那个缺口**——**虽房位未给，**但符号是对的**（**巽上艮下** ✓）。** **⚠ 附一处**极有意思的对照**：**\"**山风蛊（○××○○×）\"与\"**地风升（×××○○×）\"**在符号上**后三位相同**（**都为\"○○×\"的变体**）——**⚠ 而这两个卦，**恰好是本集在前文核出**房位有误的两个（**蛊与升**）——**⚠ 故\"符号对、房位错\"这一层，**说明错的是**后世编者的注**，**不是**原卦。","o":"TJ-0974 · 天纪·紫微详解·第十章文王六十四卦金钱课·目录（PDF 第342页）"},{"t":"四百九十二、\"天地否\"抄成了\"地天泰\"的符号","h":"64 条里唯一的一处抄录重复","c":"数据——**上表第 11、12 两条，符号完全相同（都是 **×××○○○**），而\"泰\"与\"否\"在卦体上**恰好相反**，须核**。**复核（两步，全部可验）**：**①**地天泰**＝**坤上乾下****——**下卦乾（阳阳阳）为初、二、三，上卦坤（阴阴阴）为四、五、上**——**六爻自下而上＝阳、阳、阳、阴、阴、阴**——**符号串（上→初）＝×、×、×、○、○、○＝**×××○○○** ✓（**与目录一致**）；**②**天地否**＝**乾上坤下****——**下卦坤（阴阴阴）为初、二、三，上卦乾（阳阳阳）为四、五、上**——**六爻自下而上＝阴、阴、阴、阳、阳、阳**——**符号串（上→初）＝○、○、○、×、×、×＝**○○○×××****（**⚠ 而目录写成了**×××○○○**）。** **须说明（三层）**：**①故\"**天地否**\"这一条，**是把上一行\"地天泰\"的符号**原样重复了一次**（**典型的抄录串行**）——**⚠ 而\"泰/否\"是《易经》里**最有名的一对**（**\"泰者通也、否者塞也\"**），**却恰好在这一对上演了这处错**；**②⚠ 而这一处错的**后果**很具体**：**若有人照此表起卦，**掷出\"○○○×××\"（真否卦）**，**在目录里**找不到对应**（**而它可能被当成\"泰\"**）——**⚠ 于是\"否\"这一个卦，**在这套\"查表法\"里**是失效的**；**③⚠ 而本集据此判定**：**这不是\"约定\"的问题**（**因为另外 63 条全对**），**而是**抄录者的一次疏忽****（**而它恰好证明：**这 64 条符号，**是**一条一条排出来的**，**不是**算出来的**）。** **⚠ 本集按语**：**这一处错，**恰好是全册**最好的一处\"证据\"****——**因为它**同时说明了两件事****：**（一）**这套符号系统**内部是自洽的**（**63/64**）；**（二）**编书的人**是照着抄的，**每一条都得手对一遍**（**而抄错一条，**就有一个卦失效**）。","o":"TJ-0975 · 天纪·紫微详解·第十章文王六十四卦金钱课·目录（PDF 第341页）"},{"t":"四百九十三、63/64：约定的最大规模验证","h":"从 25 次到 63 次，而结论没变","c":"要点——**本集此前用 25 个单卦，验证了\"○为阳爻、×为阴爻、符号自右向左（最右为初爻）\"这条约定；而第十章这张 64 卦总表，把验证规模一次扩到 63 条（第 64 条为抄误），**结论完全一致**，须说明其意义**。**统计**：**64 条中 **63 条吻合、1 条抄误（天地否）**——**吻合率 **98.4%****；**而若只看\"符号与卦体是否一致\"，**63 条里**无一例外**。**须说明（四层）**：**①这是**本册内部可核对程度最高的一处****（**因为符号串与卦体，**都是确定的、可算的**）——**⚠ 而它同时**反证了另一件事**：**前面那些\"房位配卦\"的错（蛊、升、巽），**不是\"我算错了\"**，**而是原文**在那一处写错了**（**因为符号这一套，**同一批人做对了 63/64**）；**②而这条约定的**方向极重要**：**\"从右到左\"**意味着**最右边的符号是\"初爻\"（最下面那一爻）**——**⚠ 这与\"写字从右往左\"的古法一致**（**而不是\"从上到下\"**）——**⚠ 若有人按\"从左到右＝初爻\"去读，**同一个符号串，**会读成一个**上下颠倒的卦****（**而颠倒之后，**卦义往往相反**，**如泰/否、既济/未济**）；**③而这条约定的**另一面**（\"国徽为阳\"）**是人为的**（**见第一条**）——**⚠ 故\"符号的可靠性\"（63/64）与\"起卦的可靠性\"（取决于约定）**是两件事**；**④⚠ 本集据此建议**：**引用这套金钱课时，**一律注明\"○阳×阴、自右向左\"**——**因为**缺了这八个字，**整张表就无法读**（**而本册**直到第十章**才写明**，**前九章**一直在用它**）。** **⚠ 本集按语**：**这 63 次验证，**是这份材料里**最\"干净\"的一件事****——**它不需要相信任何东西，**只需要**数爻、画符号**（**而能被这样核对的东西，**才谈得上\"可核\"**）。","o":"TJ-0976 · 天纪·紫微详解·第十章文王六十四卦金钱课·目录（PDF 第341~342页）"},{"t":"四百九十四、一本\"查表用\"的书","h":"64 卦各带页码，说明它的用法是\"查\"而不是\"推\"","c":"数据——**目录每一条后面都带一个页码（\"……47\"\"……49\"直至\"……336\"），须说明这一层的含义**。**目录样例（照录）**：\"**'1、乾为天卦：○○○○○○……**47**'。'2、坤为地卦：××××××……**49**'。'11、地天泰卦：×××○○○……**112**'。'12、天地否卦：×××○○○……**126**'。'64、火水未济卦：○×○×○×……**336**'。**\" **须说明（三层）**：**①这些页码（**47 至 336**）说明：**每一卦都有一段**独立的解说**（**而\"金钱课\"的用法是**先起卦、再查页**）——**⚠ 故这不是\"推演\"，**是**\"查阅\"**；**②而页码的**跨度**也说明篇幅**：**64 卦占了 289 页**（**47→336**），**平均每卦 4.5 页**——**⚠ 而这 289 页**没有被本册完整收录**（**本册只收了每卦的\"象曰/诗曰/断曰\"三句，**附在各卦的\"文王金钱课\"小段里**）；**③⚠ 而\"**查表**\"这个形态本身**极重要**：**它把\"占卜\"变成了一件**不需要理解、只需要对照**的事**——**⚠ 这与前面那些需要\"盘、星、宫、卦\"推演的章节**完全不同**（**前者需要技术，**后者只需要一枚硬币**）。** **⚠ 本集按语**：**一本\"查表用\"的书，**最容易流传、也最容易被误用****（**因为它**门槛最低**——**任何人掷六次硬币，**就能得到一个\"答案\"**）——**⚠ 而\"门槛低\"**恰恰是它的**风险所在**（**一个\"下下\"的签，**可能改变一个人一天的决定**）。","o":"TJ-0977 · 天纪·紫微详解·第十章文王六十四卦金钱课·目录（PDF 第341~342页）"},{"t":"四百九十五、这套符号与\"紫微/八字/六壬\"的关系","h":"四套系统，四种\"可核程度\"","c":"要点——**把本册的四套系统并列来看，它们的\"可核程度\"差得极远，须列清**。**四套与各自的判据**：**①**紫微斗数**——**可核的是\"盘\"**（**星曜位置、四化、大小限、宫干飞化**）：**本集已核出**十余处**（**含 3 处错误：第十一例三盘对不上、第十二例戊辰误用文曲忌、第十六例年份与岁数不符**）；**②**八字/取数成卦**——**可核的是\"算式\"**（**年月日时→干支→数→卦**）：**本集核出**十余处算式**（**民国年换算、虚岁、小限起宫**），**绝大多数吻合**；**③**地脉道（人＋位）**——**可核的是\"卦名\"**（**8×8 矩阵**）：**63 条可比对，60 吻合、3 不符**；**④**金钱课（符号）**——**可核的是\"符号串\"**：**64 条，63 吻合、1 抄误**。** **须说明（三层）**：**①四套里，**\"符号\"和\"算式\"的可核度最高**（**因为它们是**纯机械的**：**数爻、画符号、算干支**）——**⚠ 而\"盘\"的可核度居中**（**因为要读盘、要认星、要算四化**，**容易出错**）——**⚠ 而\"房位配卦\"的可核度**反而最低**（**因为**\"人\"与\"位\"的取法**本身就有歧义**：**\"长子\"还是\"三子\"，**要看排行；**\"西南\"还是\"正西\"，**要看怎么量**）；**②⚠ 而这一层**极重要**：**一套体系**越\"机械\"，越容易核对**；**越\"需要理解\"，越容易出错****（**而\"出错\"在**占卜里**恰恰是**最危险的事**）——**⚠ 因为**一个错卦，**会得到一个**错的答案**；**③⚠ 而四套系统的**共同点**是：**它们都能被\"核对内部一致性\"**，**但都不能被\"核对预测效力\"**（**本册**没有一个案例**是\"先预测、后应验\"的**）——**⚠ 故本集对四套系统的态度**一致**：**记其规则，**不认其效力**。** **⚠ 本集按语**：**这张表**其实是一份**\"如何读这本书\"的指南****——**若读者只想学\"技术\"，**可读①③④**（**盘、卦、符号**）；**若想判断\"它准不准\"，**则四套都**给不出证据**。","o":"TJ-0978 · 天纪·紫微详解·第十章文王六十四卦金钱课（PDF 第340~342页）"},{"t":"四百九十六、\"六次投币\"与\"一套完整的概率\"","h":"64 种结果、每种 1/64","c":"要点——**这套金钱课的结果空间，是一个**干净的 64 格**，须说明其概率结构**。**原文条件**：\"**'这样**连续抛出六次**，或圈或叉从右到左画完六次为止，为一卦'**\"**。**须说明（三层）**：**①每次投币有**两个等可能结果**（**国徽/字面**），**六次独立**——**故全部组合为 **2⁶ ＝ 64****，**恰好对应六十四卦**（**每卦概率 **1/64 ≈ 1.56%****）——**⚠ 而这个\"64\"与本册地脉道的\"**8×8＝64**\"**是**同一个数**（**一个来自\"六爻各二值\"，一个来自\"八卦各八位\"**）；**②⚠ 而\"**六十四卦**\"这个数目，**本来就来自\"6 个二值\"**（**这是《周易》筮法的数学基础**）——**⚠ 故\"64\"不是巧合，**是**两套不同的编码**（**符号编码与方位编码**）**指向同一个空间**；**③⚠ 而这一层**最需要标出**：**64 种结果、每种 1/64，**这意味着**每一种\"人生处境\"**都只分到 1.56%**（**而\"吉/凶\"的等级只有\"上上、上中、中上、中下、下下\"等几档**）——**⚠ 故\"卦与卦之间的差别\"，**比\"人的处境之间的差别\"**要粗得多**（**这是**任何\"查表式\"占卜**共同的局限**）。** **⚠ 本集按语**：**这一段最值得记的是那个**1/64****——**它把\"命运\"的精度**说清了**：**六十四格，**每格 1.56%**——**⚠ 而一个真实的人，**有远比 64 种更细的处境**（**故\"查表\"这件事，**从数学上就不可能精确**）。","o":"TJ-0979 · 天纪·紫微详解·第十章文王六十四卦金钱课·操作法（PDF 第340页）  ---"},{"t":"四百九十七、\"若以卜筮之流者视之，吾不与焉\"","h":"全书序言里的一句自我定位，与正文之间的距离","c":"要点——**《天纪》的序言里有一句话，把这部书的自我定位说得极清楚，而它与全书实际内容（64 卦金钱课、紫微排盘、八字起运）**形成强烈反差**，须照录并说明**。**原文**：\"**'前有天官姜太公、范蠡、鬼谷子、张良、诸葛亮、李淳风、程颐、邵康节、刘伯温之用易——**其用易之神，后学者膛乎其后者，而实无来者再传其神矣**'。'**前贤失其义而只能传其言；后学者言而忘其味；自秦以后，无传矣**'。'若以**卜筮之流**者视之，**吾不与焉！**'**\" **须说明（四层）**：**①\"**吾不与焉**\"这四个字，**等于说**\"若你们把我当算命的，我不认同\"**——**⚠ 而这是**一位写了 64 卦金钱课、紫微排盘、铁版神数、易经推命的人**说的话**（**⚠ 这个反差极大，**须原样保留**）；**②而它给出的**依据**是那个\"**传**\"字**：**\"**前贤失其义，只能传其言；后学者言而忘其味**\"**——**⚠ 即：**真正的东西（义、味）在秦以后就断了，**留下来的只是\"言\"**（**而\"言\"是可以背、可以抄、可以卖的东西**）；**③⚠ 而这一层**极重要**：**它说明作者自己**知道**\"形式还在、内容已失\"**——**⚠ 而全书 300 多页的排盘、断语、64 卦签文，**正是那个\"言\"**（**故按他自己的标准，**这部书属于\"言\"，**不属于\"义\"**）；**④⚠ 而\"**姜太公、范蠡、鬼谷子、张良、诸葛亮、李淳风、程颐、邵康节、刘伯温**\"这份名单**极有意思**（**从周初到明初，**九个人，**都是\"用易\"而非\"讲易\"的人**）——**⚠ 而名单里**程颐与邵康节并列**（**一个是义理派、一个是象数派**，**两家在宋代是争得很凶的**）——**⚠ 故这份名单**是按\"用易\"的标准拉的，**不是按学派**。** **⚠ 本集按语**：**这一句\"吾不与焉\"，**是这部书最值得记的一句话**——**它说明作者**想要的位置，**比他实际写下的内容**要高**（**⚠ 而\"想要的位置\"与\"写下的内容\"之间的这段距离，**就是这部书**全部的张力所在**）。","o":"TJ-0980 · 天纪·天机道·序（PDF 第1~3页）"},{"t":"四百九十八、\"简易、变易、不易\"","h":"三易的定义，与\"其神只有一也\"","c":"定义——**序言与正文中都给了\"易\"的三层含义，且三处说法可以互相补齐，须照录**：\"**'**易，变易也，随时变易以道也**'。'**不易也；事物之外象皆变，而其理不变也**'。'**简易也；万法皆不同，然其神只有一也**'。'之谓易，盖取其**简易、变易、不易**'。'**因其简易，当为常人所了解；因其不易，当能垂教万世**'。**\" **须说明（三层）**：**①三易是《易》学的标准三分**：**变易（随时而变）、不易（理不变）、简易（万法归一）**——**⚠ 而原文给了每一层的**理由**（**\"简易\"是为了\"让人懂\"**；**\"不易\"是为了\"能传久\"**）；**②⚠ 而这三层里，**最要紧的是\"不易\"那一层**（**\"外象皆变，而其理不变\"**）——**⚠ 而这一层**与全书的实际做法**恰好相反**：**全书做的事是\"**由固定的理，推可变的外象**\"**（**即：**先有\"理\"，再看\"象\"**）；**③⚠ 而\"**其神只有一也**\"这一句**极精**（**\"万法皆不同，而神只有一\"**）——**它承认**各家术数（紫微、八字、六壬、金钱课）**只是\"不同的法\"，**而\"神\"是一个**——**⚠ 而这一句**恰好可以用来**回答\"为什么四套系统互不一致\"**：**按它自己的说法，**不一致的是\"法\"，**一致的是\"神\"**（**⚠ 而\"神\"无法核，\"法\"可以核**）。** **⚠ 附序言的另一句**\"**君子静则观象以悟其辞，动则观变以玩其占**\"**——**⚠ 这一句**把\"静/动\"分开了**：**静的时候读辞（义理），**动的时候玩占（卜筮）**——**⚠ 而\"玩\"这个字用得极准**（**\"玩其占\"＝把占卜当玩，**而不是当命**）。","o":"TJ-0981 · 天纪·天机道·序／正文（PDF 第1~3页）"},{"t":"四百九十九、\"易中圣人之道有四\"","h":"辞、变、象、占：一份标准的四分法","c":"定义——**序言引《系辞》的四分法，把\"易\"的四种用法列清了**：\"**'**易中圣人之道有四**：**以言者，尚其辞；以动者，尚其变；制器者，尚其象；卜筮者，尚其占**'。**\" **须说明（三层）**：**①这四句出自《系辞上》**（**原文为\"以言者尚其辞，以动者尚其变，以制器者尚其象，以卜筮者尚其占\"**）——**⚠ 而它是**《易》学里最干净的\"四种用法\"分类****（**辞＝义理、变＝变化规律、象＝模型、占＝预测**）；**②⚠ 而这一条**极重要**：**它把\"卜筮\"**放在了第四位，**并且与前三者并列**（**不是\"唯一用法\"，**也不是\"最高用法\"**）——**⚠ 故\"易\"本有四种用法，**卜筮只占其一**（**而全书 340 页里，**九成以上是第四种**）；**③⚠ 而\"**制器者尚其象**\"这一条**最被忽略**（**\"象\"＝模型：**古代造器物（车、耒耜、宫室）**也取象于卦**）——**⚠ 而\"象\"这一路，**本可以是\"工程/设计\"的思路**（**而不是\"算命\"**）——**⚠ 本集按语**：**若真要\"不与卜筮之流\"，**这一条才是出路**（**把\"卦\"当模型看，**而不是当签**）。","o":"TJ-0982 · 天纪·天机道·序（PDF 第1~3页）"},{"t":"五百、\"汉唐重象数，宋以降重辞\"","h":"一句极准的易学史判断","c":"要点——**序言里有一句对易学史的概括，极简、极准，须照录并核**：\"**'吾国易经博大精深：**汉、唐以前，重象、数而轻辞；自宋以降，则重辞而轻象、数**'。**\" **须说明（三层）**：**①这一句**基本正确****（**汉代易学以象数为主**（**孟喜、京房、郑玄**）；**宋代以后以义理为主**（**程颐《易传》、朱熹《本义》**））——**⚠ 而\"重辞\"与\"重象数\"，**正是易学史上最大的一条分界线**（**即\"义理派\"与\"象数派\"之争**）；**②⚠ 而这一条**对本集极有用**：**它说明\"天纪\"这一路（象数、排盘、占断）**属于汉唐那一支**（**而不是宋代那一支**）——**⚠ 故它自称\"发扬固有文化\"时，**其实是\"复兴汉唐象数\"**（**而不是\"宋明义理\"**）；**③⚠ 而这也解释了**为什么全书对\"义理\"讲得少**（**而\"讲道理\"的段落，**多是抄自《系辞》《彖传》**）——**⚠ 故这部书的**定位**是清楚的**：**它是一本\"象数\"书，**不是一本\"义理\"书**（**⚠ 而它序言里那句\"吾不与焉\"，**说的正是\"义理\"的立场**）。** **⚠ 附序言另一句**\"**天有日月，地有阴阳；天有五星（木、火、土、金、水），地有五行；天有列宿（二十八），地有疆界**\"**——**⚠ 这是一个**整齐的\"天—地\"对应结构****（**天有 X，地有 Y**）：**日月/阴阳、五星/五行、列宿/疆界**（**⚠ 而这三组里，**最\"硬\"的只有第一组**（**日月与阴阳**）——**后两组是**比附**）。","o":"TJ-0983 · 天纪·天机道·序（PDF 第1~3页）"},{"t":"五百零一、\"天官即今日之气象台\"","h":"一段对\"天象—人事\"的自我设限","c":"要点——**序言里有一段话，把\"观测天象\"与\"推人事\"的界限说得比正文清楚得多，须完整照录**：\"**'古代传授天数的有多位圣贤，名之曰**天官**——**天官即今日之气象台**；但形同神不同**'。'**今之气象台所报只是天象的变化、气候的分析，且多于事后发现不正确；于事前即有所知，但无法预防及长远之推测**'。'**历代术家太多又杂，常以当时的术来牵合时势，故吾人不可以之为则**'。'**自孔子以后编六经，但记载天象，而不传授；因授之匪人，亦无用于世**'。**\" **须说明（四层）**：**①\"**天官即今日之气象台**\"这个比喻**极精**（**它把\"观星\"定位为**观测，**而不是预言**）——**⚠ 而紧接着\"**但形同神不同**\"这五个字，**承认了两者的区别**（**形＝都在观测；**神＝一个用来断人事、一个只报天气**）；**②⚠ 而\"**气象台……多于事后发现不正确**\"这一句**极重**（**它在**拿现代气象预报的错误率**，**给\"天官\"留位置**）——**⚠ 而这一层**须标**：**气象台有数值模型、有观测网、**并且公开承认误差**（**而\"天官\"没有这些**）；**③⚠ 而\"**历代术家太多又杂，常以当时的术来牵合时势，故吾人不可以之为则**\"这一句，**是**全序言里最清醒的一句话****（**它承认\"术\"会被\"时势\"牵着走**，**故\"不可以之为则\"**）——**⚠ 而\"**不可以之为则**\"＝**不可当准则**（**⚠ 这与\"吾不与焉\"是同一个态度**）；**④⚠ 而\"**授之匪人，亦无用于世**\"这一句，**说明了\"为什么不传\"**（**传给不对的人，**等于没用**）——**⚠ 而全书**仍然出版了**（**这是\"传\"与\"不传\"之间的一个矛盾**）。** **⚠ 本集按语**：**这一段的价值，**在于它**自己划了界****——**\"观测可以，**推断要慎；**术会被时势牵走，**不可当准则\"**（**⚠ 而这三句话，**若被认真执行，**这部书会薄很多**）。","o":"TJ-0984 · 天纪·天机道·序（PDF 第4页）"},{"t":"五百零二、\"三十年一小变，一百年一中变，五百年为一大变\"","h":"一份\"四千五百年\"的大循环，与它凭什么成立","c":"数据——**序言给出了一个明确的历史周期算式，须照录并核**：\"**'**天运古有记载：**三十年一小变，一百年一中变，五百年为一大变；三大为一大纪，经三纪而成一完整之循环，共为四千五百年**'。'**治国者一定要看三十年的小变，视察前之一千年；然后整个天地与人的关系，才能随着天运而趋于完备**'。'**顺天而治者昌，逆天而治者亡**'。**\" **复核（两步）**：**①\"**三十年一小变、一百年一中变、五百年一大变**\"这三个数字**不自洽**（**三十年 ×3＝九十年 ≠ 一百年；**一百年 ×5＝五百年 ✓**）——**⚠ 即\"小变→中变→大变\"**不是等倍递进**（**3 倍、5 倍**）；**②\"**三大为一大纪**\"＝**三 × 五百＝**一千五百年****（**✓ 可算**）；**\"**经三纪而成一完整之循环**\"＝**三 × 一千五＝**四千五百年****（**✓ 与原文一致**）**。** **须说明（三层）**：**①故\"**四千五百年**\"这个数**算得对**（**3×500×3＝4500**）——**⚠ 而它成立的前提，**是\"五百年一大变\"这个数**（**而这个数，**全篇没有给出依据**）；**②⚠ 而\"**三大为一大纪**\"这一句，**在《孟子》里有原型**（**\"五百年必有王者兴\"**）——**⚠ 故\"五百年\"这个数，**来源是\"五百年必有王者兴\"这句旧话**，**不是观测**；**③⚠ 而\"**视察前之一千年**\"这一句，**与\"四千五百年\"之间**又对不上**（**\"看前之一千年\"＝只看 1000 年，**而循环是 4500 年**）——**⚠ 故这一段**三个数字（30/100/500）与两个总数（1500/4500）**，**彼此只有算术关系，没有观测关系**。** **⚠ 本集按语**：**这类\"大周期\"的说法，**最容易被误用**（**因为它一给就是几百、几千年**，**任何事件都能\"套进去\"**）——**⚠ 而\"**顺天者昌、逆天者亡**\"这一句，**脱开数字完全成立**（**顺应规律的事容易成，**违背规律的事容易败**），**而它一旦绑上\"4500 年\"，**就变成了\"预言\"**。","o":"TJ-0985 · 天纪·天机道·序（PDF 第4页）"},{"t":"五百零三、北斗：\"为天帝所专用，在中央转\"","h":"一份古代星官体系的核心结构","c":"数据——**天机道正文的主体，是《史记·天官书》一系的星官与占断，其中\"北斗\"与\"斗魁\"的结构最完整，须照录**：\"**'**北斗七星外观上看起来似车子；为天帝所专用，在中央转，可**节制四方，分别阴阳，建立四时，协调五行，推移节气，蕃定星纪**'。'**斗头的部分正下方枕着『参宿』的上头部**'。'**斗柄的部分连接东方青龙七宿的『角宿』……为东位**'。'**斗魁部分像戴着帽子顶着六星，即古『文昌宫』——六星名『上将』、『次将』、『贵相』、『司令』、『司中』、『司禄』**'。'**斗中……斗之下方有六星，两两为一组，为『三能』**'。**\" **复核（一步，可核）**：《史记·天官书》的原文为\"**斗魁戴匡六星曰文昌宫：一曰上将，二曰次将，三曰贵相，四曰司命，五曰司中，六曰司禄**\"——**⚠ 而原文第四星写作\"**司令**\"，**应为\"**司命**\"**（**可核的错字**）。** **须说明（三层）**：**①北斗的六项职能**（**节制四方、分别阴阳、建立四时、协调五行、推移节气、蕃定星纪**）**与《天官书》一致 ✓**——**⚠ 而这一组**极重要**：**它说明\"北斗\"在古代天官体系里**是\"时间的标尺\"**（**而不是\"命运的开关\"**）；**②⚠ 而\"**斗魁戴匡六星**\"这个结构**也对**（**六星环抱如\"戴匡\"**）——**⚠ 故这一段的**星官名**是可信的**（**只有\"司命/司令\"一个字错**）；**③⚠ 而这一段**恰好说明\"天机道\"的性质**：**它是**古代星官体系的编译**（**而不是\"发明\"**）——**⚠ 而\"编译\"这一层**极有价值**（**因为《天官书》原文难读，**这一份是白话整理**）——**⚠ 而它**同时掺进了占断**（**如\"三星成一线表示国君施政有偏失，主凶\"**），**那一层要另标**。** **⚠ 附一处**可核的漏字**：**原文列\"西宫四周共布七宿，名奎、娄、胃、昴、觜、参、觜\"**——**⚠ 而西宫七宿应为**奎、娄、胃、昴、毕、觜、参****（**漏了\"毕\"、把\"觜\"写了两遍**）——**⚠ 这与前面第十章\"天地否\"抄成\"地天泰\"、第八章\"青主脾黄主肝\"**是**同一类错**（**抄录串行**）。","o":"TJ-0986 · 天纪·天机道·正文（PDF 第5~6页）"},{"t":"五百零四、星占的读法：\"房宿为天之牢\"","h":"几则最典型的占断，与它们共同的逻辑","c":"要点——**天机道正文里，逐宿给了占断，其中最典型的几则须照录，以见其\"逻辑\"**：\"**'**房宿即为**天之牢**——牢中如充满星星，表示**犯人多多**'。'**箕宿**代表**调弄是非的客卿**，主**小人口舌是非**——其光亮如大，则**小人得势**'。'**尾宿**有九星，代表**君臣**——如果互相颜色不同，且星芒互反，则示**君臣不和**'。'**井宿**主管**水利的官**——它的西面连成……'。'**中宫其主要星为『天极星』，在天顶正中央偏北，其中最亮的一颗星即『天帝』**'。'**如果已侵犯『帝座』，则必定群臣有阴谋不轨之企图**'。**\" **须说明（四层）**：**①这几则占断共有一个**结构**：**\"某宿＝某个官职／某类人\" ＋ \"星的状态（明暗、多少、颜色）＝某件事\"**——**⚠ 即：**先把天上的星，**对应到人间的一个\"位置\"**，**再把\"星的状态\"**读成\"那个位置的状况\"**；**②⚠ 而这一层**极重要**：**它是**一套\"投射\"系统**（**而不是\"因果\"系统**）——**⚠ 天上的\"房宿\"多星，**与地上的\"犯人\"多，**没有物理联系**（**⚠ 而\"房宿即天之牢\"这个说法，**本身就是**把\"星群的形状\"（像牢房）**投射成了\"牢房\"**）；**③⚠ 而\"**尾宿有九星，代表君臣**\"这一条**最典型**（**九颗星＝九个人**，**星的颜色不同＝君臣不和**）——**⚠ 这**完全是**把\"人间的结构\"，**套到\"星的数量\"上**；**④⚠ 故本集对\"天机道\"的处理**一律是**：**记其\"星官名\"（可核）、**记其\"对应关系\"（旧说）、**不认其\"占断效力\"（无据）**。** **⚠ 本集按语**：**星占最值得记的，**不是\"哪颗星主什么\"**，**而是\"人怎么把天上的东西，**读成人间的事\"**——**⚠ 这一层**有文化史的价值**（**它记录了古人怎么\"看天\"**），**而它**没有预测的价值**（**因为\"看天\"与\"人事\"之间，**没有一条可验证的路**）。","o":"TJ-0987 · 天纪·天机道·正文（PDF 第5~6页）"},{"t":"五百零五、\"五宫\"与\"二十八宿\"的分组","h":"一份可以逐条核对的星官分区","c":"数据——**天机道正文给了\"五宫\"与二十八宿的分组，须照录并核**：\"**'天上布列的星辰，古来共分**五大部**，亦为『**五宫**』；其列宿于天，**共有二十八宿，分列东南西北**'。'**东宫为『青龙宫』，主星为『房』、『心』二宿**——在右制心宿，『为天帝施政的殿堂』'。'**西宫四周共布七宿，名奎、娄、胃、昴、觜、参、觜**'。'**中宫其主要星为『天极星』……即『天帝』**'。'**环天极星外围的有十二主星**，如同藩臣一样，全部合在一起，即为**紫宫**'。'**太微**——日月五星之宫廷，环十二星是藩臣；向东为『文相』、『执法』；执法中的空间是『端门』'。**\" **复核（两步）**：**①\"**五宫**\"这个说法**对**（**中宫（紫宫）、东宫（青龙）、南宫（朱鸟）、西宫（白虎）、北宫（玄武）**）——**⚠ 而原文列出了**中、东、西**三宫，**南、北两宫未在本段展开**（**在后文各宿处散见**）；**②\"**东宫主星为房、心二宿**\"**对**（**《天官书》：\"东宫苍龙，房、心。**\"**）✓**。** **须说明（三层）**：**①\"**紫宫（紫微宫）**\"＝**环天极星的十二星**（**⚠ 而这一层与\"紫微斗数\"的\"紫微星\"**不是一回事**：**紫宫是\"天区\"，**紫微星是\"一颗星\"**）——**⚠ 而全书把两者**混着用**（**见本集第 nT91 条**）；**②\"**太微**\"与\"**天市**\"是另外两个大天区**（**太微＝朝廷，天市＝市场**）——**⚠ 而原文对\"太微\"的描述极准**（**十二星为藩臣，东为文相、执法，中为端门**）；**③⚠ 而这一段的**价值**是：**它把\"中国古代的天空\"**分成了可数的区块**（**五宫、二十八宿、紫宫、太微、天市**）——**⚠ 故\"天机道\"这一份**可以当作**\"古代星官体系的通俗读本\"**读**（**⚠ 而它的占断部分，**另当别论**）。","o":"TJ-0988 · 天纪·天机道·正文（PDF 第5~6页）"},{"t":"五百零六、这部书的目录：七门课与一条主脉","h":"从\"皇极经世\"到\"紫微斗数\"，看它自认的谱系","c":"数据——**序言后的目录列了全书（天纪）的科目，须照录并说明它自认的谱系**：\"**'**皇极经世之易数推算法**'。'**六十四卦之世应列法**'。'**铁版神数坤集的秘诀**'。'**铁版神数之排列法**'。'**易经推命起大运法**'。'**易经推命与铁版神数**'。'**紫微斗数**'。'**八卦之性悟天地之道**'。**\" **须说明（四层）**：**①八门课里，**有六门是\"推算方法\"**（**皇极经世、世应、铁版神数 ×2、起大运、推命**）——**⚠ 而只有一门是\"理\"**（**\"八卦之性悟天地之道\"**）——**⚠ 故这部书的**重心**是**\"技术\"，**不是\"道理\"**（**与序言\"吾不与焉\"的立场，**正好相反**）；**②⚠ 而\"**皇极经世**\"是**邵雍（邵康节）**的体系**（**以\"元会运世\"推历史**）——**⚠ 它与前面第六条\"四千五百年\"**是**同一路**（**故那一段数字，**来源可追到邵雍**）；**③⚠ 而\"**铁版神数**\"占了两门**（**坤集秘诀、排列法**）——**⚠ 这是一个**极复杂的\"考刻推命\"体系**（**以出生时刻的\"刻\"分推六亲**）——**⚠ 而它在序言里**被列为\"重点\"**，**却在正文里**几乎没有展开**（**本集在紫微详解里也没有见到\"铁版神数\"的实操页**）；**④⚠ 而\"**六十四卦之世应列法**\"这一门**极值得注意**（**\"世应\"是六爻纳甲的术语**：**一卦六爻，分\"世爻\"与\"应爻\"**）——**⚠ 而全书对\"纳甲\"（京房体系）**讲得极少**（**只用了\"卦象\"与\"爻位\"**）——**⚠ 故这条目录**说明：**\"天纪\"的原本，**可能比现在的整理本**要完整得多**（**而\"整理本\"丢了不少实操**）。** **⚠ 本集按语**：**这份目录是\"天纪\"的骨架**（**七门技术 ＋ 一门理**）——**⚠ 而它同时说明：**这一路学问的\"自我定位\"，**是\"技术书\"**（**⚠ 而序言那句\"吾不与焉\"，**是作者**想给自己的技术**留一个更高的说法**）。","o":"TJ-0989 · 天纪·天机道·目录（PDF 第3页）  ---"},{"t":"五百零七、\"命上有灾，再加上运上有灾，才会呈现\"","h":"一句把\"命\"与\"运\"接起来的话，与它不可反驳的结构","c":"要点——**地脉道听课笔记里有一句话，把\"命\"（八字）与\"运\"（阳宅）的关系说得极简，而它是全册**最需要拆解的一句**，须照录**：\"**'**命上有灾，再加上运上有灾，才会呈现**'。**\" **须说明（四层）**：**①这一句把\"出事\"的条件设成了**两个**（**命里有 ＋ 运里有**）——**⚠ 故\"我住了凶房却没事\"，**可以解释成\"**命里没有**\"；**\"我命里不好、住了吉房也没好\"，**可以解释成\"**运没改过来**\"；**②⚠ 而这一层**极重要**：**它是一个**双向免责的结构****（**出事→命里有；**没出事→命里没有；**改了没用→命里有**）——**⚠ 故无论发生什么，**这套说法都**不会被推翻**（**⚠ 而\"不会被推翻\"恰恰是它**不能被验证**的原因**）；**③⚠ 而这一句里还藏着**一个善意的部分**：**它承认\"命\"与\"运\"**各占一半**（**不是\"住错房就一定死\"**）——**⚠ 故它比那些\"住这就死\"的绝对断言**要温和一些**（**⚠ 而\"温和\"不等于\"有据\"**）；**④⚠ 而\"命\"这一层**须单独标**：**八字的\"命\"**本身**没有被验证过**（**见本集第 nT95~nT97 条**）——**⚠ 故这一句是**\"两个未被验证的东西相加\"**（**而不是\"两个证据相加\"**）。** **⚠ 本集按语**：**这句话最值得记的，**是它**承认\"不是住哪就决定一切\"**——**⚠ 而一个人若真信这套，**最该从这句话里拿走的**是\"**命与运各一半**\"这个分寸**（**而不是\"我住错了就完了\"**）。","o":"TJ-0990 · 天纪·地脉道·听课笔记（地脉道06）"},{"t":"五百零八、\"一个季度转运\"与\"不要住超过三个月\"","h":"一套体系的\"时间单位\"，与它凭什么定这个数","c":"数据——**笔记里两次出现\"三个月\"，而这两处恰好构成本册的\"最小时间单位\"，须照录并置**：\"**'**阳宅位置改变，一般**一个季度转运（三个月）**'。**\" **又**：\"**'**雷天大壮（长子住西北角，未婚）……**不要住超过三个月以上**'。**\" **须说明（四层）**：**①两条一合，\"三个月\"成了这套体系的**关键数**：**改运**三个月生效；**凶局**三个月必须搬走**——**⚠ 故\"三个月\"既是\"起效期\"，**又是\"危险期\"**；**②⚠ 而**\"三个月\"这个数**在全册**没有给出任何依据**（**不是一天、不是一年，**为什么是三个月？**）——**⚠ 唯一能想到的解释是\"一个季度\"**（**季节轮换**），**而\"季节轮换\"与\"人的运势\"**之间**没有因果**；**③⚠ 而这一层**极重要**：**它恰好补上了本集前文（第 nT136 条）提出的那个\"**未回答的问题**\"**——**\"何时须离开此局？\"**在紫微详解里**只有问句、没有答案**，**而这份笔记给了：**三个月**；**④⚠ 而\"**三个月**\"这个答案**其实是**对自己体系的一个保护**（**若住三个月没灵，**可以说\"还没到\"；**若住了三年出事，**可以说\"早该搬了\"**）——**⚠ 故它把\"没效果\"和\"出问题\"，**都推给了\"时间\"**。** **⚠ 本集按语**：**\"三个月\"这个数，**最好当作**\"一个用来讲故事的刻度\"**读**（**它有节奏感、好记**），**而不是**\"一个可检验的期限\"**（**⚠ 因为**换房这件事本身，**就会让人心情变好**——**而\"心情变好\"确实会让人觉得\"运变了\"**）。","o":"TJ-0991 · 天纪·地脉道·听课笔记（地脉道09／地脉道15）"},{"t":"五百零九、\"成格\"：不是住进去就算","h":"一份\"这个局成立的前提\"，列得比正文细","c":"要点——**笔记在某几卦的条目下，附了\"**这个局什么时候才算成立**\"的条件，而这一层在紫微详解正文里**没有**，须照录**：\"**'**水雷屯（二儿子住在长子的位置——**两个儿子一起住正东方卧房**）：**长子已婚，或本人已婚，或两个儿子不住在同一屋檐下**——**均不成格**'。**\" **同类（笔记中反复出现的括注）**：\"**'**山水蒙**：三个儿子都住在家中，且均未婚，三儿子住在二儿子的位置**'。'**风天小畜**：未婚长女住在父亲的位置**'。'**火天大有**：次女住父位，**自己未婚、姐姐未嫁**'。'**泽雷随**：三女儿主正东卧房，**长女和二女均未婚**'。'**山天大畜**：三儿子住西北角，**长子和二子未婚**'。**\" **须说明（四层）**：**①这些括注，**说明\"这一卦成立\"需要**几个条件同时满足**（**排行、婚否、同住**）——**⚠ 故\"占到这个卦\"**不是\"住进这间房\"**，**而是\"住进这间房、**并且排行与婚否**都对上**；**②⚠ 而\"**均不成格**\"这四个字**极重要**——**它承认\"不算\"**（**即：**条件不对，**就不该用这一卦断**）——**⚠ 故这套体系**自己也知道\"要严格对上\"**；**③⚠ 而这一层**同时也暴露了一个漏洞**：**\"未婚\"这个条件是**会变的**（**一旦结婚，**排行就变了，**卦名也变了**）——**⚠ 故\"**我住这里十年了，**是什么卦？\"这个问题**有**多个答案**（**取决于你哪一年、**结没结婚**去算**）；**④⚠ 而\"**成格**\"这一层**反过来**给了本集一个**判据**：**若读者要\"照着做\"，**就必须**先把\"排行、婚否、同住\"三项对上**——**⚠ 而这三项**只要有一项不对，**这一卦**就不该被引用**（**⚠ 故本集前文所有\"房位—卦名\"的对照，**都默认\"成格\"**，**而实际情况**多半\"不成格\"**）。** **⚠ 本集按语**：**\"成格\"这两个字，**是这套体系里**最讲道理的一处****（**因为**它说清了\"前提\"**）——**⚠ 而\"前提这么严\"**恰好说明**：**绝大多数人**并不真的\"在某个卦里\"**。","o":"TJ-0992 · 天纪·地脉道·听课笔记（地脉道11）"},{"t":"五百一十、\"名＝位\"与\"位＝名\"","h":"两个方向的\"对齐\"，与一个意外的用法","c":"方法——**笔记把\"名位相等\"拆成了**两个方向**，而第二个方向**极意外**（**它不靠住，靠注册**），须照录**：\"**'名＝位（例如：**叫母亲住在西南角卧房**）——**家和**'。'位＝名（如**主卧住在正东卧房，用长子的名字注册公司**）——**万事兴**'。**\" **又一句（同一个意思的正面表述）**：\"**'**名＝位（例如：叫母亲住在西南角卧房）**——家和；**位＝名**（如主卧住在正东卧房，用长子的名字注册公司）——万事兴'。**\" **须说明（四层）**：**①方向一\"**名＝位**\"：**人**去到**他的位**（**母亲 → 西南（坤）**）——**⚠ 这是**最常听到的那种**（**\"住在自己的本位\"**）；**②方向二\"**位＝名**\"：**位**去担**他的名**（**正东（震＝长子）的卧室，**用长子的名字注册公司**）——**⚠ 这个方向**极意外**（**它把\"风水\"用到了**公司注册上****）；**③⚠ 而这一层**极重要**：**它说明\"名位相等\"**不只是\"住哪\"**，**还可以是\"用谁的名字办事\"**——**⚠ 故\"改运\"在这里变成了**\"改一个名字的归属\"**（**⚠ 而\"公司注册用谁的名字\"，**是一件**有法律后果的事**（**法人、股东、责任**），**不是\"风水\"**）；**④⚠ 而\"**名＝位**\"这四个字，**其实是一个**逻辑等式**（**名字 ＝ 位置**）——**⚠ 而\"**母亲住在西南**\"之所以\"家和\"，**是因为**\"母＝坤＝西南\"**（**卦象上对上了**）；**⚠ 而\"**用长子的名字注册公司**\"之所以\"万事兴\"，**是因为**\"正东＝震＝长子\"**（**而\"公司的名字\"与\"房间的位置\"**之间**没有关系**）——**⚠ 故方向二**把\"象征\"直接变成了\"操作\"**（**这是全书**最容易误导的一处**）。** **⚠ 本集按语**：**要提醒的是**：**公司注册用谁的名字，**取决于出资、责任、税务、债务**（**与\"卧室在正东\"无关**）——**⚠ 而这四个字若被当真，**可能让人**把一家公司挂在一个不该担责的人名下**。","o":"TJ-0993 · 天纪·地脉道·听课笔记（地脉道07／地脉道10）"},{"t":"五百一十一、\"厨房是刀象，客厅是如客，卫生间是是非\"","h":"三个\"象\"，把这套体系的思路说清了","c":"要点——**笔记开篇用三个\"象\"来给三种房间定性，这一组**最能说明\"象\"的思维方式**，须照录**：\"**'**象（名＝位）：**厨房（刀象）；客厅（如客）；卫生间（是非、口舌、官司）**'。'**客厅放在坤位最好**'。**\" **须说明（四层）**：**①三个\"象\"的推理链**是**同一个形状**：**\"这个房间里有什么（刀 / 客人 / 水与污）\" → \"它像什么（血光 / 不常在家 / 是非）\" → \"它主什么\"**——**⚠ 故\"象\"**不是\"象征\"，**是\"由物推意\"**；**②⚠ 而这三个里，**\"**厨房＝刀象**\"**最要紧**（**因为**全书所有\"厨房在西北死夫、在西南死妻、在正东长子夭折\"的断言，**都建立在\"刀象\"这一个比喻上**）——**⚠ 而\"厨房有刀\"这件事，**与\"人会不会死\"**之间**只有\"联想\"**；**③⚠ 而\"**客厅＝如客**\"这一条**极精**（**\"客\"＝不常在家**）——**⚠ 它与前面\"**正东是客厅，生不到儿子；已经有儿子的，儿子如同家里的客人**\"是**同一条**（**而这一条**其实是**\"一个人呆在家里的时间\"**这个可观察的量**）；**④⚠ 而\"**卫生间＝是非、口舌、官司**\"这一条**最牵强**（**\"卫生间\"与\"口舌官司\"**只有\"污\"这一层联想**）——**⚠ 而\"**客厅放在坤位最好**\"这一条**又与本集前面\"**坤位主孤寡**\"矛盾**（**同一个位，**一个说\"最好\"，**一个说\"孤\"**）。** **⚠ 本集按语**：**\"象\"这一层**有它的道理**（**它逼人去想\"这个空间在做什么用\"**）——**⚠ 而\"由物推意\"这一步若走得太远，**就会**从\"厨房有刀\"走到\"厨房死人\"**（**⚠ 故\"象\"可以当**\"比喻\"读**，**不可当**\"因果\"用**）。","o":"TJ-0994 · 天纪·地脉道·听课笔记（地脉道01~05）"},{"t":"五百一十二、两代人同住的那条\"安排\"，与\"名位相等\"相反","h":"一份与全书原则冲突的具体建议","c":"要点——**笔记里有一条针对\"两代人同住\"的具体建议，而它**与全书\"名位相等最好\"的原则完全相反**，须照录并指出**：\"**'如果两代人同住一个屋檐下，**年轻夫妻应住西北角坤卦、父母应住东北角艮卦**——**家和万事兴**'。**\" **须说明（四层）**：**①按全书的地脉道矩阵，**西北＝乾＝父位、东北＝艮＝三子位**——**⚠ 故这条建议**让\"年轻夫妻住父位、父母住三子位\"**（**两个人的\"名位\"**都错**）；**②⚠ 而全书的原则是\"**名位相等**\"最好**（**父住西北、母住西南**）——**⚠ 故这条建议**与原则直接冲突**（**⚠ 而它偏偏**被挂在\"家和万事兴\"这五个字上**）；**③⚠ 而\"**西北角坤卦**\"这五个字**本身就错**（**西北是**乾**，**坤是西南**）——**⚠ 故这句话**连卦名都写错了**（**与前面第七章\"坤是南方\"是**同一类错**）；**④⚠ 而这一条**极重要**：**它说明\"地脉道\"在**真实家庭（两代人）**里，**根本无法按\"名位相等\"安排**（**因为**\"父位\"只有一个，\"母位\"只有一个**，**而两代人**至少四个成年人**）——**⚠ 故这条建议**其实是**对现实的一个让步**（**⚠ 而\"让步\"又破坏了原则**，**于是**原则与建议**各自成立、彼此拆台**）。** **⚠ 本集按语**：**这一条最好当作**\"这套体系在现实里的一次妥协\"**来读**——**⚠ 而它同时说明：**一个\"按名位排座\"的模型，**一旦遇到真实家庭，**就必须打补丁**（**⚠ 而补丁一多，**这套体系**就不再是一个系统了**）。","o":"TJ-0995 · 天纪·地脉道·听课笔记（地脉道05）"},{"t":"五百一十三、厨房那四条：一处必须最高级警告的断言","h":"\"西北角厨房死先生、西南角厨房死太太、正东厨房长子夭折\"","c":"风险——**笔记（及前面紫微详解）里有一组**极重的断言**，把\"厨房的位置\"直接连到\"具体家人的死亡\"，须照录并附最高级警告**。**原文**：\"**'**西北角是厨房死先生、西南角是厨房死太太、西北角是客厅主夫妻生离、正东边是厨房主长子夭折**'。'（**解决方法**：将正东边改为**卧房**）'。**\" **须说明（四层）**：**①这四条的共同结构**是：**\"某方位 ＋ 某功能房间 ＝ 某人 死 / 夭折 / 生离\"**——**⚠ 而它**同时给了\"解决方法\"**（**\"将正东边改为卧房\"**）——**⚠ 故这一套**自称\"可改\"**（**而\"可改\"比\"不可改\"更危险**：**因为**它承诺了一个**做不到的结果**）；**②⚠ 而它的**实际伤害**极具体**：**一个家里若有人**得了重病、或不幸去世**，**这四条会把\"**该做的筛查、该改的饮食、该看的医生**\"**换成\"该改的厨房\"**（**⚠ 而厨房改完，**病照旧**）；**③⚠ 而\"**西北角是客厅主夫妻生离**\"这一条**更重**（**它把\"婚姻\"**也挂到了\"客厅位置\"上**）——**⚠ 而\"生离\"这件事，**取决于两个人的关系，**不取决于客厅在哪**；**④⚠ 故本集的处置是**：**原文照录**（**以存其说**），**并明确否定**：**任何\"某方位某房间 → 某人风险极高\"的说法，**都没有依据**；**⚠ 家中有人生病，**唯一该做的是**及时就医**（**⚠ 而\"改厨房\"**不能替代**任何一项医学措施**）。** **⚠ 本集按语（最高级）**：**这四条最需要被指出的是**它的\"责任转移\"**——**一个人去世后，**家属本已自责**，**这套说法会让他们**再加一层\"是我把厨房放错了\"**（**⚠ 而这种自责**不会带来任何改变**，**只会让人**在悲伤里多背一个不该背的东西**。","o":"TJ-0996 · 天纪·地脉道·听课笔记（地脉道06）"},{"t":"五百一十四、\"脚朝文昌文曲天钺天魁化科\"","h":"一个极具体的操作，与它对应的星","c":"方法——**笔记在\"天火同人\"条下给了一个**极具体的\"助考\"操作**，而它涉及的星名**全部可核**，须照录**：\"**'**天火同人（父亲住在二女儿的位置——正南卧房）**：1、**发科甲**：已婚的男人唯一出现科甲的卦就是天火同人卦——**父亲住正南卧房，考试金榜题名**；**睡觉的时候，脚朝文昌、文曲、天钺、天魁、化科所在宫位置的方位**'。**\" **须说明（四层）**：**①这里列的五个名目**（**文昌、文曲、天钺、天魁、化科**），**在紫微斗数里**全都属\"科甲／贵人\"一类**（**⚠ 而\"化科\"是**四化之一**，**不是一颗星**；**\"天钺\"\"天魁\"是**一对贵人星**；**\"文昌\"\"文曲\"是**一对文星**）——**⚠ 故\"五者\"其实是**\"四星 ＋ 一化\"**；**②⚠ 而\"**脚朝某宫的方位**\"这个操作**极具体**（**它把\"睡觉的朝向\"变成了一个变量**）——**⚠ 而这一层**与前面\"**床头靠北边或西边为吉**\"（**无子宅的解法**）**是**同一类**（**都用\"朝向\"来操作**）；**③⚠ 而这一条**须标**：**紫微盘上的\"文昌、文曲\"位置**是**按出生时辰推出来的**（**本集第 nT92 条已录\"文昌安星：子时戌起逆推\"**）——**⚠ 故\"脚朝那个方位\"**要求**先排一张盘**（**而\"排盘\"本身**没有被验证过**）；**④⚠ 而\"**已婚的男人唯一出现科甲的卦就是天火同人**\"这一句**极绝对**（**\"唯一\"这两个字，**在全册里出现过很多次**）——**⚠ 而\"唯一\"这类话，**最容易在事后被\"对上\"**（**因为**只要有一个反例，**就可以说\"他不成格\"**）。** **⚠ 本集按语**：**\"脚朝文昌\"这件事，**若真有人照做**，**它至少有一个可测的效果**：**换个方向睡，**可能睡得更沉**（**而\"睡得好\"确实有助于考试**）——**⚠ 故这一条**可以当\"改善睡眠的小办法\"读**，**而不要当\"考试必中\"的保证**（**⚠ 考试的结果，**取决于复习，**不取决于脚朝哪**）。","o":"TJ-0997 · 天纪·地脉道·听课笔记（地脉道09）"},{"t":"五百一十五、这份笔记缺\"地风升\"，而紫微详解把它插错了位置","h":"一处文献学发现：两个版本对不上，而错的那一处正是房位写颠倒的那一段","c":"数据——**把\"地脉道听课笔记\"与\"紫微详解\"的地脉道部分**逐卦对照**，发现一处**结构性差异**，须报告**。**笔记的卦序（照录关键处）**：\"**'【地脉道二八页】风地观（长女居西南角）……'。'【地脉道二九页】火雷噬嗑（二女居正东卧房）……'。'【地脉道三十页】山火贲……'。'【地脉道三一页】山地剥……'。'【地脉道三三页】地雷复……'**\"**——**⚠ 即\"观\"（第 20 卦）之后**直接是\"噬嗑\"（第 21 卦）**，**中间没有\"地风升\"（第 46 卦）**；**而紫微详解的顺序**：\"**'观 → **地风升** → 噬嗑'**\"**（**⚠ 即把第 46 卦\"升\"**插进了第 20、21 卦之间**）。** **须说明（四层）**：**①两版一对照，**结论很清楚**：**\"升\"这一段**在笔记里没有、**在紫微详解里**被插在了**卦序不对的位置**（**⚠ 而\"地风升\"是第 46 卦，**正常应在\"姤（44）、萃（45）\"之后、\"困（47）\"之前**）；**②⚠ 而**这正是本集前文核出\"房位写颠倒\"的那一段**（**紫微详解：\"升——长女住母位（西南）\"，**而按卦体应为\"母（坤）住东南（巽）\"**）——**⚠ 故\"位置插错\"与\"房位写颠倒\"是**同一处错的两面**（**⚠ 而笔记里**没有这一段，**说明它是**后加的**）；**③⚠ 而\"**地脉道三二页**\"在笔记里**是空的**（**三一页剥 → 三三页复**，**跳过三二**）——**⚠ 故原本这一页**可能正是\"升\"，**而抄笔记的人**跳过了它**（**或它**本来就缺**）；**④⚠ 而这一层**极重要**：**它说明\"地脉道\"这一套的**流传本**至少有两个版本**，**而两版在\"升\"这一卦上**不一致**（**⚠ 故本集对\"升\"的处置是**：**照录其房位（\"长女住西南\"），**并标注\"应为母住东南\"**，**同时注明\"此段在听课笔记中缺\"**）。** **⚠ 本集按语**：**\"升\"这一卦的三个问题（插错位置、房位颠倒、笔记缺失），**其实是一个问题的三个表现**：**这一段**不是原稿**（**⚠ 而\"不是原稿\"的段落，**最容易出错**（**也因为**它是后加的，**没有经过前面的编号与校核**）。","o":"TJ-0998 · 天纪·地脉道·听课笔记（地脉道12~13）／紫微详解·地风升·地脉道"},{"t":"五百一十六、\"一般正北卧室不住人\"","h":"一条\"留空\"的建议，与它背后的空间逻辑","c":"要点——**笔记里有一条**与\"名位相等\"无关、而极实用**的建议，须照录并说明**：\"**'**一般正北卧室不住人，可以放**祖先牌位**'。'**厨房在房子的正北方或正西方最佳**'。'**不管未婚或已婚的女子，住在西南角代表孤独**'。**\" **须说明（三层）**：**①\"**正北卧室不住人**\"这一条**有意思**（**正北＝坎＝二子位**，**而\"二子位\"**在多数家庭里**往往没有第二个儿子**）——**⚠ 故这条建议**其实是对\"**家里没有那个排行的人**\"的一次现实处理**（**而\"放祖先牌位\"**是给这个空位一个用途**）；**②⚠ 而\"**厨房在正北或正西最佳**\"这一条**与前面\"**西北角厨房死先生**\"**不矛盾**（**西北是乾、**正北是坎、**正西是兑**）——**⚠ 但它**仍然是一个\"位置决定吉凶\"的断言**（**故本集一并不采**）；**③⚠ 而\"**女子住西南角代表孤独**\"这一条**极重**（**它把\"西南＝母位\"**读成了\"**未婚或已婚女子住母位＝孤独**\"**）——**⚠ 而这条与\"**母亲住西南＝家和**\"（**见第四条**）**直接冲突**（**同一个位，**男人住是\"坤为地\"，**女人住是\"孤独\"**）——**⚠ 而这一层的**性别差异**须标**（**⚠ 同一间房，**按性别给出相反的断语，**是这套体系里最需要被指出的偏向**）。** **⚠ 本集按语**：**这条笔记最值得记的，**是\"**正北留空**\"这种**把\"没人用的位\"处理掉**的务实**（**⚠ 而它一转到\"女子住西南＝孤独\"，**就又回到了\"用房间判人\"**的老路**（**⚠ 故这一份笔记里，**务实与武断是**混在一起的**）。","o":"TJ-0999 · 天纪·地脉道·听课笔记（地脉道11／地脉道14）"}];</script>
