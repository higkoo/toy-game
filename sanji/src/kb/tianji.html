专肆威武的上面\"，做出的事完全不同。** **须说明**：**这是《易经》原文（未济卦第四爻）**；**其可用的核极准**：**\"能与时合\"是这一爻的判据**（**\"时\"不对的时候，贤才也只是\"贤才\"；\"时\"对了，才\"有赏于大国\"**）。","o":"TJ-0629 · 天纪·人间道·未济卦·第四爻（PDF 第136页）"},{"t":"二百二十、未济后三爻：无可济之时怎么办","h":"第五爻：\"君子之光，有孚\"与\"虚其心\"","c":"方法——**第五爻\"贞吉，无悔，君子之光，有孚，吉\"**，是全书对\"用人\"讲得最好的一条：\"**中虚而明之才居君之尊位——能'虚其心'任刚贤之相为辅佐，且信任之而不悔，此'处之至善'；即令己才不足，但亦由中心孚诚，终必大吉。**\"其\"象\"：\"**君子之能如是，则其功之光必明且亮，其光盛而吉也。**\" **这段有三层，我逐层记**：**①\"能虚其心，任刚贤之相为辅佐\"**——**\"虚其心\"是\"把自己腾空\"（不占着位置、不塞满主意）**；**②\"且信任之而不悔\"**——**\"不悔\"这两个字最要紧**：**用了人之后不再反复（一反复，被用的人就废了）**；**③\"即令己才不足，但亦由中心孚诚，终必大吉\"**——**这一句是给\"才不足的领导者\"的唯一出路**：**自己本事不够，就靠\"诚\"去用有本事的人**（**这与\"鼎卦'任不适之才'\"、\"井卦'井渫不食'\"正好是一组**）。** **须说明**：**这是《易经》原文（未济卦第五爻）**；**\"君子之光\"是\"德之光\"（不是\"权势之光\"）**；**其可用的核极准**：**\"虚其心\"＋\"信任之而不悔\"＝\"用人\"的全部技术**（**而\"即令己才不足，但亦由中心孚诚\"是这个技术的适用范围——它专门为\"才不足者\"而设。**","o":"TJ-0630 · 天纪·人间道·未济卦·第五爻（PDF 第136页）"},{"t":"二百二十、未济后三爻：无可济之时怎么办","h":"上爻：\"有孚于饮酒\"与\"人能安处劣势\"","c":"风险——**上爻\"有孚于饮酒，无咎，濡其首，有孚失是\"**，是《人间道》全书的最后一爻：\"**阳刚居极，在中虚卦之上，乃示其'刚且明'——能如此，则必不生躁。'决之以明'：明能洞察事理，刚能行事。然居未济之时，因'无可济之理'，故成'乐天顺命'而已，可以无灾。如过于礼法，'濡其首'，乱如是，其必不知反省，则示'不安于所居也'。**\"其\"象\"：\"**饮酒而至于弄湿其首，乃'过乐'也——必不能安于命，此不知命节制，必失其常理。'人能安处劣势，必能守其心志'——此理之至然。**\" **这一段是全书的落点**：**\"因无可济之理，故成乐天顺命而已\"**——**当\"确实没有办法\"的时候，\"乐天顺命\"（接受它）本身就可以\"无灾\"**（**而这不是\"放弃\"，是\"认清了再放下\"）。** **而\"如过于礼法，濡其首\"是它的边界**：**\"乐天顺命\"过了头，就变成\"过乐\"（沉溺）**（**而\"过乐\"的表现是\"不知反省\"与\"不安于所居\"。**）** **而最后那句\"人能安处劣势，必能守其心志。此理之至然\"**，是《人间道》的收束——**\"劣势\"里能\"安处\"，才\"守得住心志\"**（**而\"此理之至然\"（这个道理是至极的），是讲义给它的最高评价。**）** **须说明**：**这是《易经》原文（未济卦上爻）**；**\"失是\"是\"失其正\"**；**其可用的核极准**：**\"安处劣势\"与\"守其心志\"是一对**——**不是\"劣势里还能奋斗\"，是\"劣势里还能不散\"**；**而\"濡其首\"提醒：**\"安\"不等于\"放纵\"**。","o":"TJ-0631 · 天纪·人间道·未济卦·上爻（PDF 第136页）"},{"t":"二百二十一、《人间道》全书之纲","h":"全书之纲：\"天行健君子以自强不息\"与\"地势坤君子以厚德载物\"","c":"定义——**《天纪·人间道》共 146 页，从乾卦讲到未济卦（六十四卦全录），而其每一页的页眉都印着同样两句**：\"**天行健，君子以自强不息**\"与\"**地势坤，君子以厚德载物**\"（**见 PDF 第 1~136 页各页页眉，为全书唯一反复出现的固定题语**）。** 这两句的来历是清楚的：《易》乾卦象辞\"**天行健，君子以自强不息**\"、坤卦象辞\"**地势坤，君子以厚德载物**\"——**即：全书以\"乾\"与\"坤\"两卦的象辞作纲**。** **而这两句放在一起，正好是《人间道》的两个方向**：**\"自强不息\"是对自己的（向内的、向上的、不肯停的）；\"厚德载物\"是对别人的（向外的、能容的、承得住的）。** **即：一个人要\"立得住\"，靠前一句；要\"容得下\"，靠后一句**（**而两缺一个都不成：只有自强不息，则刚而无容；只有厚德载物，则厚而无骨。**）** **须说明**：**这一点是从 PDF 页眉的实物观察得出的**（**不是讲义的正文论述**）；**而全书的内容确实按这两条展开**——**乾卦讲\"自强不息\"（\"知进不知退\"是它的失）、坤卦讲\"厚德载物\"（\"含而不为皆不忠之人\"是它的失）**；**其可用的核**：**这两句可作为整册的\"读法提要\"**（**即：读任何一卦，都可以问\"这一卦讲的是'自强'还是'载物'\"**）。","o":"TJ-0632 · 天纪·人间道·全书页眉（PDF 第1~136页）"},{"t":"二百二十一、《人间道》全书之纲","h":"六十四卦读毕：全册的方法与限度","c":"要点——**《人间道》六十四卦至此通读完毕**（**PDF 全 146 页，正文至未济卦上爻止**）。**全册的固定体例已可归纳为五段**：**①卦名与卦体（如\"雷山小过\"\"水火既济\"）；②占例（如\"季布在周家潜藏，卜得之，遂遇高皇帝\"）；③卦题与提要（如\"舟楫济川之课，阴阳配合之象\"）；④卦图象解（逐物解象，通常五至六物）；⑤\"人间道\"（卦辞、彖、象、六爻的逐条讲义，是全书主体）。** **而全册的讲义方法也有三条一贯的**：**①以\"象\"起（每卦先解图物）；②以\"时\"断（\"时之义在《易》中最为重要\"、\"论易须知时，方可得易之神明\"）；③以\"人事\"落（\"此于天理人事皆同\"、\"君子观象知……\"）。** **而全册的限度，须一并记明**：**①\"人间道\"多引古代君臣、男女、尊卑的语汇**（**如\"妇人本阴柔\"\"男尊在上女卑在下\"\"女壮勿用取女\"等**）——**讲义本身多处是古代社会结构的直陈，本册只取其\"结构义\"（如\"柔顺\"\"守位\"\"渐进\"），不取其性别与等级判断**；**②\"占例\"部分（某古人卜得之如何）属传说性质的引证**，**既不可验证，也不能作为\"占卜有效\"的证据**；**③讲义对个别卦的引申与通行注家有出入**（**如\"无妄之灾\"、\"虎视眈眈\"、\"井泥不食\"处的《孟子》引文等**）——**本册已逐处标明两条并存**。** **须说明**：**这是对本册 146 页内容的体例归纳**（**依据为已逐页读过的正文，非推测**）；**其可用的核极准**：**这一册的价值在\"以象说理、以时说事\"的方法**，**而其风险在\"把古代结构当成永恒道理\"**（**所以本册逐处标了\"只取结构义\"。**）**","o":"TJ-0633 · 天纪·人间道·全册体例归纳（PDF 第1~146页）  ---"},{"t":"二百二十二、十四主星的性质","h":"紫微星：帝星与\"官星入官禄、财星入财帛\"","c":"定义——**紫微星（阳）**：\"**北斗星君，帝星，代表文武官带、贵人、正财（固定收入），解厄、制化（凶星遇紫微，逢凶化吉）；配合星：左辅、右弼。**\" **而\"命宫有紫微星，没有辅星，为僧道或代表人厚道性情孤独；女命紫微独守福德宫，主一世孤单**\"——**即：帝星\"独坐\"不是\"最贵\"，是\"孤\"**（**因为没有\"左辅右弼\"来配合，帝星就只是一个人。**）** **而\"官星进入官禄宫最好，财星进入财帛宫最好\"是全书对\"星落宫\"最要紧的一条原则**：**\"官带星进入官禄宫，越大做的官越大\"**（**即：官星要在\"官\"的位置上才发挥**）；**\"财星进入官禄宫，为贪官或手握财权的官\"**（**即：同一颗财星，落到官禄宫就变成\"贪\"或\"掌财权的官\"——不是\"发财\"，是\"在官位上管钱\"。**）** **紫微面相三型极精**：\"**鼻子很大颧骨很高三个相呼应，握有财权；鼻子很大、颧骨很小，自己有钱；鼻子小颧骨很大，是贸易公司的财务经理，为他人管财。**\" **三型的分别是\"鼻\"（自己的财）与\"颧\"（权）的配比**：**两者都大＝有钱有权；鼻大颧小＝只有钱；鼻小颧大＝替别人管钱。** **须说明**：**这是讲义对紫微星的定性**；**其可用的核是\"星的落宫决定它发挥什么\"**（**而\"面相三型\"属讲义的个人体相断言**，**无解剖学或统计学依据，本集只记其\"结构\"，不作实断言**）。","o":"TJ-0634 · 天纪·紫微详解·第二章星曜·紫微星（PDF 第14页）"},{"t":"二百二十二、十四主星的性质","h":"太阳、武曲、天同：武官带、五短与\"治天下/平天下\"","c":"要点——**太阳星**：\"**代表武官带（军人、警察、外交官、法官），代表贵人，解厄，代表财禄（在财帛宫主横财——非固定收入，官禄宫主官），代表父亲、丈夫、儿子。**\" **注意\"横财\"与\"正财\"的分野**：**太阳在财帛宫是\"横财\"（非固定收入），在官禄宫是\"官\"**（**而\"紫微、天机、太阴\"在财位是\"正财\"——即：**同一颗星在不同宫位，财的性质完全不同**）。** 面相：\"**红光满面、双目圆大、圆脸、皮肤白皙、中等身材、精壮。**\" **武曲星**：\"**性格暴烈，少倾即去。代表武官带；解厄、代表财星；代表贵人。**\"面相：\"**个性火爆过得快，但是身材五短且壮，五短身材，五短成格。'五短主富、主贵。五长主贵。'**\" **天同星**：\"**代表人和（如合伙做生意成）、解厄。**\" **而讲义在这里给了一句极重的话**：\"**治天下：天时大于地利、地利大于人和；平天下：人和大于地利、地利大于天时。孟子说'王无罪岁，斯天下之民至焉'（罪己不罪天，民心自然向）——这就是天纪不会改变的。**\" **\"治天下\"与\"平天下\"是两个阶段，权重正好相反**：**打天下（治天下）靠\"天时\"（时机）；守天下（平天下）靠\"人和\"（人心）。** **即：起事靠势，守成靠人。** **而\"王无罪岁\"（君王不把责任推给年成）是\"人和\"的具体做法**：**\"罪己不罪天\"——把责任往自己身上揽，民心自然向。** **须说明**：**这是讲义对各星的定性**；**其可用的核极准**：**\"天时—地利—人和\"的权重随阶段翻转**（**而\"这就是天纪不会改变的\"是讲义自己给这条的最高定性**）。","o":"TJ-0635 · 天纪·紫微详解·第二章星曜·太阳、武曲、天同（PDF 第14~15页）"},{"t":"二百二十二、十四主星的性质","h":"天府、太阴、天梁、天相：能解厄的只有哪几颗","c":"方法——**天府星**：\"**为南斗星君，文官带，教（官）星，统领南方星系。'没有解厄制化的功能'——只有大贵星才能解厄，如太阳星、武曲星、天同星。**\" **\"只有大贵星才能解厄\"这一句，把十四主星分成了两类**：**能\"解厄制化\"的（紫微、太阳、武曲、天同）与不能的（天府等）**（**而天府虽为\"南斗星君\"，却没有这个功能——即：**位高不等于能救厄**）。** **而\"指温和，不代表善\"这一句极准**：**温和是一种\"态度\"，不是一种\"德性\"**（**而讲义立刻给出判据：\"真正的良臣、贤臣能举谏贤才——不能举荐人才为不忠，不能发现人才为不贤。\"** **即：评价一个\"温和的人\"，不看他的态度，看他\"有没有举荐过人\"。**）** 面相：\"**眉毛很浓。我们处事不要跟三角眼人、四白眼人、浓眉人来往。**\" **太阴星**：\"**指月亮，指女人。在子丑亥最好，女子太阴坐命很漂亮，代表文官带；为正财（收入固定）星。太阴星在亥宫、子宫、丑宫出现最好。**\" **天梁星**：\"**食神（口福）；代表文武双全官带；天梁星坐命为男相：英俊潇洒，长得精壮。比如天梁星在官禄宫，表示当官应酬多。如果大限遇到了，天梁星很亮，说明有意外横灾。**\" **\"所有星斗中，只有天梁星是能文能武的星\"**——**这是十四主星里唯一的\"双全\"**（**而\"大限遇天梁很亮＝有意外横灾\"是它的另一面：能文能武的星，也主\"横事\"。**）** **天相星**：\"**佐才星（秘书、助理、参谋），天相入命：长相瘦高，为人厚道、脾气温和。和天相星命的人结婚太好了，尤能娶个天相星入命的太太最好——无怨无悔的做佐才，任劳任怨的妻子。**\" **须说明**：**这是讲义对各星的定性**；**其可用的核极准**：**\"温和不代表善\"与\"举荐人才\"的判据**（**这是把\"性格\"翻译成\"可观察的行为\"**）；**⚠ 须标**：**\"娶个天相星入命的太太最好\"这类婚配建议属讲义的个人主张**（**本集只记其\"佐才\"的结构义，不作婚配推荐**）。","o":"TJ-0636 · 天纪·紫微详解·第二章星曜·天府、太阴、天梁、天相（PDF 第15~16页）"},{"t":"二百二十二、十四主星的性质","h":"巨门与杀破狼：庙旺与落陷的两副面孔","c":"风险——**巨门星**：\"**凶星，代表口舌、是非、官司、牢狱，也代表豪宅大院；'落陷代表牢狱，庙旺代表口才好'。入命：形小、音高、音量大，或长绒毛（毛发旺盛）的肥胖。化权为人师表，声名远扬。**\" **\"如果巨门星为庙旺，灾要减一大半，会变成能言善辩；如果巨门星为陷，巨门就是门很大，如监狱里；如果为庙旺，可能就是校长\"**——**这一段是全书对\"庙旺/落陷\"讲得最直观的一处**：**同一颗\"巨门\"（大门），落陷就是\"牢门\"，庙旺就是\"校门\"**（**即：星的性质不由星定，由\"亮度\"定。**）** **杀破狼**：\"**七杀星、破军星、贪狼星是一组，为武官星。个性刚强固直，容易被人利用。**\"三颗各记：**\"七杀星：性急、多疑、性刚\"**；**\"破军星：孤僻、瘦，再吃不胖、不重利\"**；**\"贪狼星：圆滑，八面玲珑，诗酒烟赌，修仙、性情心狠手辣\"**（**\"为桃花星，主桃花星，还主酒、色、财、气、赌。面相：魁梧，毛发多。武官拿到最好。如张飞。\"**）** **\"七杀星和破军星主耗、辛劳\"**：\"**如果流年逢到七杀星和破军星，主辛劳无获，钱财不聚。贪狼星主财，但很难过桃花这关。**\" **须说明**：**这是讲义对巨门与杀破狼的定性**；**其可用的核极准**：**\"庙旺/落陷\"是\"同一颗星的两种表现\"**（**这不是\"好星坏星\"的二分，是\"亮度\"的连续**）；**⚠ 须标**：**\"三角眼、四白眼、浓眉人不要来往\"属讲义的个人体相偏见**，**本集不收**（**只记\"天府主温和不代表善\"这一结构义**）。","o":"TJ-0637 · 天纪·紫微详解·第二章星曜·巨门、杀破狼（PDF 第16~17页）"},{"t":"二百二十二、十四主星的性质","h":"禄存、六杀与亮度：庙旺利陷的四个等级","c":"要点——**禄存星**：\"**为财星，指小气。如果流年在财帛宫主财旺，会大赚钱。'禄马交驰'同化禄。为自己辛苦赚来的大财，这已经很不得了了。如果禄存星会巨门星庙旺在同宫更为巨富；再加上巨门星入庙，更佳是豪门宅地的巨富。如果生下来就是禄存星、天马星、巨门星入命宫，先天就是豪门宅地。**\" **\"禄马交驰\"（禄存＋天马）与\"禄存＋巨门庙旺\"是两个\"巨富\"组合**（**而讲义说\"为自己辛苦赚来的大财，这已经很不得了\"——即：**禄存的财是\"挣来的\"，不是\"掉下来的\"**）。** **六杀**：\"**擎羊、陀罗、火星、铃星、天空、地劫**\"——\"**有人之宫与无人之宫解释不一样，但都逃不了一个'杀'字，凶也。**\" **而\"庙、旺、利、陷\"四个等级，是全书判断星曜吉凶的刻度**：\"**所有的星在庙、旺都好；在为平，陷时很不好，为最差。**\" **须说明**：**这是讲义对禄存、六杀与亮度等级的定性**；**其可用的核极准**：**\"庙旺利陷\"是\"连续刻度\"而不是\"二分\"**（**所以同一颗星要看\"亮度\"，不能只看\"星名\"**）；**⚠ 须标**：**\"禄存指小气\"属讲义的性格断言**，**本集只记\"禄存是财星、财来自辛苦\"这一结构义**。","o":"TJ-0638 · 天纪·紫微详解·第二章星曜·禄存、六杀（PDF 第17页）"},{"t":"二百二十三、命相学的自述限度","h":"\"学了命相学后，人的个性会变\"","c":"风险——**讲义在论\"杀破狼\"性格之后，自己加了一句极重要的注解**：\"**批所有星座八字时，遇到有人的性格有中庸之德，我们批时就看不准——因为他懂，已经内敛；学了命相学后，人的个性会变。**\" **这句话是讲义对\"命相学\"限度的自述，我认为是全册最该单列的一条**：**\"批不准\"的原因不是\"技术不够\"，是\"那个人已经变了\"**（**即：被批的对象不是\"固定的\"，是\"会变的\"。**）** **而\"因为他懂，已经内敛\"这一句点了机制**：**懂的人会\"收\"（把脾气收起来），所以\"看不出来\"**（**即：**\"性格\"在变成\"能力\"之后，就不再是\"可读的标签\"**）。** **而\"学了命相学后，人的个性会变\"这后半句更彻底**：**这一门学问本身就会改人**（**所以\"用命相学预测一个学了命相学的人\"，方法上自相矛盾。**）** **须说明**：**这是讲义原文的自我限定**（**不是我的引申**）；**其可用的核极准**：**任何\"以性格/命盘预测行为\"的体系，都有一个\"被测者会变\"的漏洞**（**而讲义自己承认了这个漏洞**）；**⚠ 本集须一并标明**：**紫微斗数、八字、六神占断等属传统命理体系，**本身缺乏可重复验证的证据基础**，**本节记录的是\"讲义说了什么\"与\"讲义自己承认的限度\"，不构成对其预测效力的认可**。","o":"TJ-0639 · 天纪·紫微详解·第二章星曜·杀破狼（PDF 第17页）  ---"},{"t":"二百二十四、星曜的吉凶反转","h":"\"吉处藏凶，必凶；凶处藏吉，平安\"","c":"要点——讲义在论\"庙旺利陷\"时给出一句极重的判断：\"**杀星遇庙，杀可变为吉星。因为'吉处藏凶，必凶；凶处藏吉，平安'。所有处事之道要有所戒——戒有'戒之初'和'戒之盛之时机'之分。**\" **\"吉处藏凶，必凶；凶处藏吉，平安\"这十二个字，是全书对\"吉凶\"最反直觉的一条**：**看起来好的地方藏着坏，那个坏一定发作；看起来坏的地方藏着好，反而平安**（**而理由不难理解：**\"吉处\"让人放松，所以藏的凶没人防；\"凶处\"让人警惕，所以藏的吉长得出来）。** **而\"戒有'戒之初'和'戒之盛之时机之分'\"这一句，把\"戒\"分成了两个时点**：**\"戒之初\"（在开头就戒）、\"戒之盛\"（在最盛的时候戒）**（**而\"盛\"是最难戒的时点——这与\"节卦'常人于悦时不知止'\"、\"乾卦'亢龙有悔'\"是同一组）。** **须说明**：**这是讲义对\"杀星遇庙\"的注解**；**其可用的核极准**：**\"凶处藏吉\"是\"警惕\"的副产品**（**即：让人警惕的处境反而安全，让人放松的处境反而危险**）——**这一条脱开命理也成立**，**而\"命理\"只是它的载体**。","o":"TJ-0640 · 天纪·紫微详解·第二章星曜·六杀亮度（PDF 第17~18页）"},{"t":"二百二十四、星曜的吉凶反转","h":"六杀的落宫与\"身边的小人\"","c":"风险——**讲义把\"六杀\"落宫的效应讲得很具体**：\"**如果生意人流年逢到天空、地劫星，肯定赔钱。如果逢到火星：在迁移宫为外面有火劫；在朋友宫，合伙会大打出手；在夫妻宫，会家暴，再会巨门星，打架后上法院有官司。**\" **同一颗火星，在三个宫是三种灾**：**出门（迁移）遇火、合伙（朋友）打架、婚姻（夫妻）家暴**（**而\"再会巨门星\"（巨门主口舌官司）就升级为\"上法院\"——**即：星与星的组合决定\"灾的形态\"**）。** **而擎羊、陀罗的解释，是全书对\"小人\"讲得最深的一处**：\"**指身边有小人（一种是爱你的亲人、一种是了解你的人），且有病灾（体内看不到的肿瘤、癌症），流年逢到此二星往往病灾多。擎羊、陀罗二星遇到落陷更可怕，因为阴凶看不到；即使是入庙也要提高警惕。**\" **\"一种是爱你的亲人、一种是了解你的人\"这一句极狠**：**\"小人\"不一定是敌人**——**\"爱你的亲人\"（因为爱而干涉你）、\"了解你的人\"（因为知道你的弱点）**（**而这两种都\"不是坏人\"，却都会误你。**）** **而\"阴凶看不到\"这一句，是\"落陷更可怕\"的理由**：**看得见的凶还能防，看不见的凶防不了**（**所以\"即使是入庙也要提高警惕\"）。** **须说明**：**这是讲义对六杀的定性**；**其可用的核极准**：**\"小人＝爱你的人＋了解你的人\"**（**这是一个可观察的标准：**看谁在\"以爱之名\"与\"知你之短\"的位置上干涉你的判断**）；**⚠ 须标**：**\"擎羊陀罗有病灾（肿瘤、癌症）\"属命理与疾病的直接对应**，**无医学依据，不可据以判断自身健康**（**有不适须就医检查，不以命盘替代**）。","o":"TJ-0641 · 天纪·紫微详解·第二章星曜·六杀（PDF 第18页）"},{"t":"二百二十四、星曜的吉凶反转","h":"文昌文曲与\"书呆子\"","c":"要点——**文曲、文昌二星**：\"**文曲星：才艺、博学、斯文。文昌星：科甲、考试。流年逢到文昌星或化科，主考试高中；如果文昌逢到化忌，主考试不中。'文昌星没有会到文曲星，为书呆子，学而不思；文曲、文昌同时会到，文采风流。'**\" **\"文昌星没有会到文曲星，为书呆子，学而不思\"这一句极精**：**文昌主\"考试\"（读得进、考得出），文曲主\"才艺\"（用得出、变得活）**——**只有文昌没有文曲，就是\"学而不思\"**（**而\"文采风流\"是两星同时会到的结果）。** **须说明**：**这是讲义对文昌文曲的定性**；**其可用的核极准**：**\"考试能力\"与\"运用能力\"是两颗星**（**这一条脱开命理也成立：**会考试不等于会做事，会做事不等于会考试**）；**同节另记**：**天魁、天钺\"主科甲、读书\"，面相\"手上有天柱纹\"**——\"**如果当事人天魁、天钺、文曲、文昌四星同会，此人长得再粗鲁、壮硕，考试、文采、才艺样样通**\"（**即：四星同会是\"全通\"，与面相无关。**）**","o":"TJ-0642 · 天纪·紫微详解·第二章星曜·文曲文昌、天魁天钺（PDF 第18页）"},{"t":"二百二十四、星曜的吉凶反转","h":"红鸾天喜与\"不一定非要相会才结婚\"","c":"方法——**红鸾、天喜**：\"**主喜庆；男命宫入红鸾必招美妻，女命宫入红鸾必有贵夫。'不一定非要红鸾、天喜相会才结婚'——有的流年走到夫妻宫会结婚；有的走到父母宫会结婚（因为父母之令、媒妁之言）；有的走到财帛宫会结婚（因生意往来相互趋慕）。这完全看流年、命运和批天文地理综合评判。'斗数讲象、数'。**\" **这一段是这一册里少见的\"体系自限\"声明**：**同一件事（结婚），可以落在三个不同的宫位上，而解释各不相同**（**夫妻宫＝自己遇到；父母宫＝长辈促成；财帛宫＝经济往来）**——**即：**单星不能定论，必须\"看流年、看宫位、综合评判\"**。** **而\"斗数讲象、数\"这一句，是讲义给自己方法论的定位**：**\"象\"（取象）与\"数\"（排盘推演）两件事**（**而不是\"一条断语\"。**）** **须说明**：**这是讲义对红鸾天喜的注解**；**其可用的核不是\"红鸾招美妻\"这类断言**（**属传统命理套语，无验证基础**），**而是它自己承认的\"单星不能定论、须看宫位与流年\"**（**这一点对理解整个命理体系的\"内部逻辑\"有用：**它是一套\"组合解释系统\"，不是\"单点预测\"**）；**⚠ 本集一并标明：命理推断不构成对具体人生事件的可靠预测。**","o":"TJ-0643 · 天纪·紫微详解·第二章星曜·红鸾天喜（PDF 第18页）"},{"t":"二百二十四、星曜的吉凶反转","h":"辅星与四化：左辅右弼、三台八座与科权禄忌","c":"定义——**辅星两组，各有专属**：\"**左辅星、右弼星是辅助紫微星的——紫微星独星就可解厄自化。三台、八座星是辅助天府星的——天府星必须会到三台、八座星才有解厄自化的功能。**\" **这两句合起来，修正了\"天府不能解厄\"的说法**：**天府\"没有解厄制化的功能\"（第二章前段），但\"会到三台、八座\"就有**（**即：**能不能解厄，取决于\"它的辅星到没到\"**）。** **四化（科、权、禄、忌）**：**①化科**：\"**主科名（金榜题名、文笔优秀、才艺超群、为人师表）；声名远播**\"；**②化权**：\"**官印；性情刚直。不同位置意义不同：夫妻宫化权，配偶性刚、主见很强；命宫化权，先天是领导之才。'命中有科无权，代表有技术专长，适合佐才、参谋、顾问'**\"；**③化禄**：\"**钱财；悭吝（守财奴）。在父母宫，父母从商、很会做生意赚钱；财帛宫，自己会做生意；命宫，天生祖业丰厚**\"；**④化忌**：\"**劫杀（官司、横祸、意外等等）；自身想不开。'杀、破、廉、贪落陷为恶煞'**\" **其中\"命中有科无权，代表有技术专长，适合佐才、参谋、顾问\"这一条极精**：**\"科\"（名声、专业）有了而\"权\"（决断、领导）没有，就适合\"当参谋\"而不是\"当主官\"**（**而这一条与\"天相星为佐才星\"、\"未济卦'虚其心任刚贤之相'\"是同一组的第三处）。** **须说明**：**这是讲义对辅星与四化的定性**；**其可用的核极准**：**\"有科无权＝技术专长型\"**（**这是一个\"自我定位\"的框架**，脱开命理也能用：**会做事但不会拍板的人，适合做佐才**）。","o":"TJ-0644 · 天纪·紫微详解·第二章星曜·辅星、四化（PDF 第18~19页）"},{"t":"二百二十五、须剔除与须警告的两处","h":"\"化解灾戒在戒慎\"一段：必须剔除","c":"风险——**讲义第二十二节标题为\"化解灾戒在戒慎\"，其内容须整段剔除，理由如下**。**原文大意**：作者称在一次群聊中看到某公众人物的命盘，\"断言他将会出现意外事故\"，\"没想到第二天他宣布辞去公司一切职务（离职可化解灾难）\"，于是推断\"他身边一定有一位易学大师在为他指点化解\"；随后自述\"我多次用倪师的方法来化解，灵验而简单\"，并说\"给自己本人化解生死大灾必须借力，自己准备好后，再请法师或出马仙等人，帮你清场扫除房间邪气；**其实就是给他们点钱，让他们教一下实施方法，整个费用三百左右，转嫁一下因果关系，否则会祸及家人**……求来方法家人来实施就行……这事不能再详细说明了，有些术数在于理解，不能言明\"。** **剔除理由有四条，须逐条记明**：**①\"断言意外→次日辞职→判定有大师化解\"是典型的\"事后归因\"**（**辞职与\"意外\"无因果关系，而\"化解了所以没出意外\"无法被反驳——**即：不可证伪**）；**②\"交钱转嫁因果\"属不可核查的付费承诺**（**且\"三百左右\"这种定价话术，是服务推销的常见形态**）；**③\"否则会祸及家人\"是恐吓性话术**（**以\"家人安危\"施压，正是利用恐惧促成付费**）；**④\"不能再详细说明、有些术数不能言明\"是封闭话术**（**把\"无法说明\"包装成\"高深\"**）。** **须说明**：**本集据此把此段整段剔除**，**只保留其标题中\"戒慎\"二字可用的部分**——**即\"化解\"之说不可信，但\"谨慎\"本身是对的**；**⚠ 另须标**：**若有\"化解灾厄\"的服务要求付费，或声称\"不付费会祸及家人\"，属典型的高风险迷信付费话术，读者应直接拒绝，不必考虑\"灵不灵\"**。","o":"TJ-0645 · 天纪·紫微详解·第二章星曜·第22节（PDF 第19页）"},{"t":"二百二十五、须剔除与须警告的两处","h":"气色判断：\"青蓝色主死\"须加医学警告","c":"风险——**讲义第二十三节\"气色\"给出**：\"**黄润主喜事；黑暗，如有灰尘，犹如没有洗脸，一般主劫杀或想不开；枯萎色（头发干枯蓬松，脸色发枯，无反光）、青蓝色主死。看到气色后第一个节气通常就是劫杀发生的日期。**\" **其中\"枯萎色、青蓝色主死\"这一条，须加明确的医学警告**：**\"面色青蓝\"在医学上是\"发绀\"的表现**，**通常提示血氧饱和度下降（缺氧），可能见于心力衰竭、严重肺部疾病、气道梗阻、休克等急症**——**这是需要立即就医的信号，而不是\"等第一个节气\"的信号**。** **\"等第一个节气\"这一说法尤其危险**：**一个节气约 15 天**，**而发绀若为急性缺氧，数分钟到数小时就可能危及生命**（**即：按此说法等待，可能错过抢救窗口**）。** **须说明**：**本节记录的是讲义原文，并同时对\"气色断生死\"作明确否定**；**其可用的核极窄**：**\"黄润／枯暗\"作为一般的精神状态观察（气色好＝休息与营养尚可）是常识层面可用的**，**但\"据此推断劫杀日期\"\"面色青蓝即主死\"不成立**；**⚠ 医学提示（须与正文同读）**：**若出现口唇、指甲或面色青紫（发绀）、呼吸困难、意识改变，请立即拨打急救电话或前往急诊，不要依据任何命理说法判断或等待。**","o":"TJ-0646 · 天纪·紫微详解·第二章星曜·第23节气色（PDF 第19页）"},{"t":"二百二十六、总格与大限","h":"四种\"夹格\"与\"羊陀夹杀\"","c":"方法——**讲义列了四种\"夹\"的格局**：**①\"日月夹财：太阳星、太阴星夹命宫，为有财禄——不管是先天的祖业，还是后天的财富都很大，即使命宫里没有主星、财星也没有关系\"**；**②\"紫府夹权：紫微星、天府星夹命宫，为掌权\"**；**③\"魁钺夹贵：为科甲星——天魁星和天钺星夹命宫，为贵\"**；**④\"羊陀夹杀：擎羊星和陀罗星夹命宫，为杀\"**。** **第四种\"夹\"的注解，是全节最有价值的一段**：\"**周围有很多小人，一定要会识哪些是小人；羊陀夹之人很容易被人影响，所以一定要坚心。给当事人说明，当事人领悟后就会平安无事。**\" **\"很容易被人影响，所以一定要坚心\"这一句极准**：**\"夹\"的意思不是\"有坏人\"，是\"两边都在推你\"**（**而\"被推\"的人自己不一定知道）。** **而\"给当事人说明，当事人领悟后就会平安无事\"这一句，是讲义对\"批命\"功能的定位**：**批命的作用不是\"预测\"，是\"让人知道自己容易被影响，然后坚心\"**（**即：**把\"宿命\"翻译成\"提醒\"**）。** **须说明**：**这是讲义对总格四种夹的定性**；**其可用的核极准**：**\"羊陀夹\"的解法是\"会识小人＋坚心\"**（**而这两个都是可执行的动作，不是\"改命\"**）——**这也是这一册里\"命理\"最接近\"可用\"的一处**。","o":"TJ-0647 · 天纪·紫微详解·第二章星曜·第24节总格（PDF 第20页）"},{"t":"二百二十六、总格与大限","h":"大限：\"命好不如限好\"与\"凶事往往发生在不经意时\"","c":"要点——**讲义对\"十年大运\"的论述，有一句总纲**：\"**看十年大运时，'命好不如限好'。十年大运就叫'限'。有的人命宫很多吉星，但流年很多凶星；有的命宫和三方四正都很差，但流年很好。**\" **\"命好不如限好\"这一句，把\"先天\"与\"阶段\"的权重定了**：**命盘再好，走到坏限也是坏；命盘再差，走到好限也是好**（**即：**\"命\"是底子，\"限\"是当下**）。** **而\"批流年以十年大运为主，小流年为辅；批小流年只需看对宫和本宫\"给了操作次序**：**先看十年（大势），再看一年（细节）**（**而\"一年\"只看\"对宫与本宫\"两处——即：**范围明确，不无限扩大**）。** **而\"当十年大运都是财星，但其中有一小流年会到天空星、地劫星，这表示十年中有一年不赚钱，但十年总的来看是赚钱的\"这一句，是\"尺度\"的示范**：**一年的坏不改变十年的好**（**而\"遇到小流年有凶星时要有戒心\"是它的用法）。** **而最后那句\"凶事往往发生在不经意时\"，是全书对\"戒\"最实在的注解**：**凶事不是在你盯着它的时候来的**（**所以\"戒\"要常态，不是\"临事才戒\"**）。** **须说明**：**这是讲义对大限的论述**；**其可用的核极准**：**\"命好不如限好\"可脱开命理读作\"底子不如阶段\"**；**而\"凶事往往发生在不经意时\"与\"吉处藏凶，必凶\"是同一条**（**两处相隔一章，说的是同一件事**）；**⚠ 本集一并标明：紫微斗数的\"限\"与\"流年\"推断属传统命理，无验证基础，不可据以决定医疗、投资、婚姻等重大事项。**","o":"TJ-0648 · 天纪·紫微详解·第二章星曜·第25节大限（PDF 第20页）  ---"},{"t":"二百二十七、排盘的技术设定","h":"润月与早晚子时：两个最易错的边界","c":"定义——**讲义\"盘的设定\"两条，都是排盘时的具体边界规则**：**①\"润月生人作下月论\"**（**即：闰月出生的人，按\"下一个月\"计算**）；**②\"子时生人：晚上 11 点到 12 点叫晚子时，晚上 12 点到 1 点为早子时。早子时和晚子时在同一天，过了晚上 12:00 换日子。\"** **第二条最要紧**：**子时横跨两日，\"晚子时\"（23:00–24:00）与\"早子时\"（00:00–01:00）虽然都叫\"子时\"，但\"日子\"不同**——**\"过了晚上 12:00 换日子\"**（**即：23:40 出生与 00:20 出生，差 40 分钟，但\"日柱\"不同）。** **这一条与第三册\"八字排盘\"里\"月以节气为界，最易错\"是同一类问题**：**两者都是\"边界时刻决定整盘\"**（**而这类边界正是手工排盘与软件排盘最容易出分歧的地方**）。** **须说明**：**这是讲义对盘设定的技术规定**；**其可用的核极准**：**凡是\"以时间为唯一输入\"的推算系统，边界规则必须写死**（**否则同一个出生时刻会排出两个盘**）——**而\"润月作下月论\"与\"子时跨日\"这两条，正是这类规则里最关键的两个**。","o":"TJ-0649 · 天纪·紫微详解·第二章星曜·第26节盘的设定（PDF 第22页）"},{"t":"二百二十七、排盘的技术设定","h":"五形人与\"越纯越好\"","c":"要点——**讲义把人的\"形局\"分作五行五类**：**①\"木形人：瘦瘦高高的，从头到脚瘦得很均匀，瘦的要纯\"**；**②\"火形人：干干的，瘦瘦的，红红的，红的像火焰山\"**；**③\"土形人：厚重，脚方方的，手肥肥的厚厚的，头圆圆的大大的，肚子左看右看都圆圆的大大的——这才是纯土形人\"**；**④\"金形人：方方的，白白的，手也是方方的\"**；**⑤\"水形人：圆圆的，头圆圆，颧骨圆圆的，手也是圆圆；不同角度都看起来圆圆的——到处都是圆圆\"**。** **其总断极精**：\"**在形局上越纯的人越好，非富即贵。南人北相，北人南相，非富即贵。**\" **\"越纯越好\"这一句，是五形人的判据**：**关键不在\"属于哪一种\"，在\"纯不纯\"**（**而\"南人北相、北人南相\"（南方人长得高大壮实、北方人长得清秀）被讲义判为\"非富即贵\"——**即：**\"混\"得出来的人，也是\"纯\"的另一种形式**）。** **同节另记\"火贪格\"**：\"**贪狼星在水宫（亥宫、子宫）时为正格桃花星，在午宫为武官星，最希望遇到火星、铃星——火贪相聚，火贵格，出武贵，武官。**\" 而\"**晚上的贪狼星，男女都要长得魁梧、高大、肥厚实；在午出现，人长得越瘦越小越好**\"（**即：同一颗星，落宫不同，\"形\"的要求正好相反**）。** **须说明**：**这是讲义对形局的分类**；**其可用的核不是\"看形断富贵\"**（**属体相断言，无统计依据**），**而是\"越纯越好\"这个\"一致性\"原则**（**即：一个东西的特点集中在同一个方向上，比\"每样都有一点\"更成形**）——**这一条脱开体相，在审美、产品、风格上同样成立**。","o":"TJ-0650 · 天纪·紫微详解·第二章星曜·第30节五形人（PDF 第23~24页）"},{"t":"二百二十七、排盘的技术设定","h":"三易：简易、变易、不易","c":"定义——**讲义\"易经与八卦\"一节，给了\"三易\"的定义，是全册对《易》讲得最凝练的一处**：\"**三易：第一个是简易，第二个是变易，第三个是不易。简易：了解他的神、如何用神，把复杂的事情简化。变易：随时在变，永无休止。不易：所有的事情它都会变，但是它的真理永远不会变。**\" **三易三层，各管一件事**：**\"简易\"是对方法的（把复杂的事简化，抓住\"神\"——即抓住那个\"要害\"）；\"变易\"是对现象的（一切都在变，永无休止）；\"不易\"是对\"理\"的（现象全都变，但\"真理\"不变）。** **而\"简易\"里\"了解他的神、如何用神\"这一句，与第三册\"恒卦'随时变易其外，神在内不变'\"是同一组**：**\"神\"是\"里面不变的那个东西\"**——**\"简易\"就是把它找出来**（**而\"不易\"讲的是同一个\"神\"在时间上的恒常）。** **须说明**：**这是讲义对\"三易\"的定义**；**其可用的核极准**：**\"变易（现象变）＋不易（理不变）＋简易（抓要害）\"三层，正好是\"读任何复杂系统\"的三个动作**（**而这三层与\"系辞'易简而天下之理得'\"、\"乾卦'乾以易知'\"是同一源**）。","o":"TJ-0651 · 天纪·紫微详解·第二章星曜·第31节易经与八卦（PDF 第24页）"},{"t":"二百二十八、地脉道的核心方法：\"名位相等\"","h":"\"上卦为人、下卦为卧室\"","c":"方法——**讲义在\"先后天八卦\"与\"卦与爻\"两节，给出了《天纪》地脉道（阳宅）的核心推法**：\"**上卦为人、下卦为卧室，得出不同的卦。如：父亲睡在西南卧室，为天地否卦，名位不相等。**\" **即：把一个\"人\"的本命卦放在上卦，把他\"住的方位\"的卦放在下卦，两卦相叠即得一卦。** **而\"名位相等\"的判定，讲义给了四个例子，全部以\"父亲（乾）\"为例**：**①\"父亲住到乾卦，叫乾为天，名位相等\"**（**乾＋乾＝乾为天**）；**②\"父亲住到正东为雷的位置，天住在长男位置，叫天雷卦、名位不相等\"**（**乾＋震＝天雷无妄**）；**③\"父亲住到东南角为巽的位置，天住在长女的位置，叫天风卦、名位不相等\"**（**乾＋巽＝天风姤**）；**④\"父亲住到西南角为坤的位置，天住在母亲的位置，叫天地否、名位不相等\"**（**乾＋坤＝天地否**）。** **四个例子的规则是一致的**：**上卦（人）不变，下卦（位）变了，就\"名位不相等\"**（**只有\"位\"与\"人\"同卦时才\"相等\"）。** **而其总断极简**：\"**长幼有序、各安其位。兄弟和睦、夫妻相敬如宾。**\" **须说明**：**这是讲义对地脉道推法的说明**；**其可用的核极准**：**这是一套\"自洽的符号系统\"**——**输入（人＋方位）与规则（两卦相叠）与输出（名位等或不等）都清楚**（**所以它可以被\"照着做\"，也可以被\"照着检验\"**）；**⚠ 但须一并标明**：**\"名位不相等会致凶\"这一因果断言，没有可重复验证的证据支持**——**本集记录的是\"这套系统怎么运作\"，不是\"它是否真实有效\"**（**此点与第一册\"地脉道与前册阳宅的分界\"、以及\"睽卦以住位断凶\"处的处理一致**）。","o":"TJ-0652 · 天纪·紫微详解·第二章星曜·第33~34节（PDF 第26~27页）"},{"t":"二百二十九、著述来源与两处必须剔除的内容","h":"文献学发现：本书不是倪海厦原著","c":"风险——**讲义第三十五节留有一段极重要的\"著述来源说明\"，我认为是全册最该单列的一条**：\"**注：易经以《断易天机》读图、混元天师《断易天机》读图、《天机地脉人间》读图（本书六十四图摘自于此书）。参阅了倪师《天纪紫微》上下。以前写的《天纪紫微》（下），因电脑遭遇病毒、重装系统没有备份，已遗失。2023 年 3 月，开始重写《天纪紫微详解全集》，部分内容进行了修改和删除，尽量做到完整实用，'其文体以超出原著范围'。**\" **这段话把这本书的性质说清楚了，我逐层记**：**①本书的六十四卦图摘自《断易天机》《天机地脉人间》等书**（**不是倪海厦自绘**）；**②本书\"参阅了\"倪师《天纪紫微》上下——注意是\"参阅\"，不是\"转录\"**；**③原本的《天纪紫微》（下）已因病毒遗失，此本是 2023 年 3 月起\"重写\"的**；**④最关键一句：\"其文体以超出原著范围\"**——**即：作者自己承认，本书的文体与内容已超出倪海厦原著的范围。** **须说明**：**这一条对整册的\"出处\"判定是决定性的**：**《天纪-紫微详解》应视为\"后人依据倪海厦《天纪紫微》所写的重写／整理本\"，而非倪海厦原话**（**所以本集在这一册的所有条目里，出处一律写\"天纪·紫微详解\"，而不写\"倪海厦曰\"**）；**⚠ 这一条也解释了本册为何夹有大量\"现代作者的个人主张\"**（**如\"出马仙\"\"交钱转嫁因果\"\"气色断死\"等，见下两条与本册第92章**）——**这些都不属于倪海厦的原始讲义，读者不应把它们当作\"倪师原意\"。**","o":"TJ-0653 · 天纪·紫微详解·第二章星曜·第35节易经的八个卦（PDF 第28页）"},{"t":"二百二十九、著述来源与两处必须剔除的内容","h":"作者自述与\"脑梗\"案例：须加医学警告","c":"风险——**紧接上文，作者写了一段自述，其中两句须分别处理**。**原文**：\"**我以前一直以奇门和紫微为主，有时也二者合参。曾经在 2016 年 5 月，用紫微预测过自己将有大病发生，提前两天住进了医院，而后连续五次进行抢救，在医院无法确诊时，用奇门找到病因，不是心脏病而是发生脑梗，并在吉方买药看好了自己的病。因为是自己的病灾，化解起来比较麻烦，就像医生无法给自己看病一样，稍有不慎会连累家人。'此处有迷信成分'，不再详说。**\" **须分两层处理**：**①作者自己写的\"此处有迷信成分\"——这一句应当如实保留并强调**（**它说明连作者本人也不认为这部分可用**）；**②\"用奇门找到病因，不是心脏病而是发生脑梗，并在吉方买药看好了自己的病\"这一段，须加明确的医学警告**：**脑梗死是急症，静脉溶栓的时间窗通常为发病后 4.5 小时内，越早治疗预后越好；而\"用占卜找到病因\"\"在吉方买药改善\"没有任何医学依据**（**若有人据此推迟就医或自行服药，后果可能是永久残疾或死亡**）。** **须说明**：**本集保留\"作者自述其局限\"这一层**（**因为它诚实**），**同时否定\"占卜可诊断、吉方买药可治病\"这一层**（**因为它危险**）；**⚠ 医学提示（须与正文同读）**：**突发一侧肢体无力或麻木、口角歪斜、言语不清、视物障碍、剧烈头痛——请立即拨打急救电话（卒中识别口诀\"中风 120\"：1 张脸、2 只胳膊、0（聆）听语言），不要等待、不要自行用药、不要依赖任何占卜判断。**","o":"TJ-0654 · 天纪·紫微详解·第二章星曜·第35节（PDF 第28页）"},{"t":"二百二十九、著述来源与两处必须剔除的内容","h":"两处\"断死\"的说法：必须剔除","c":"风险——**本册有两处\"据象断人死亡\"的文字，须整段剔除，理由如下**。**第一处\"判断小儿夭的方法\"**：\"**小儿善知人意主夭折：小人有大人像主夭折，没有小孩子的天真、童蒙，发生在七岁以前。**\" **第二处\"死绝日\"的举例**：\"**12 月 25 日立冬，在 17 日见到面部枯老，再看流年有诸多杀星相会且落陷，再一看下个节气前一天为绝日，'此人死定了'。**\" **剔除理由三条**：**①\"小儿像大人就会夭折\"没有任何医学或统计依据**，**而这句断语对家长的伤害是直接的**——**一个孩子\"懂事早\"本是常见现象（家庭环境、性格、发育节奏都能解释），被说成\"夭折之相\"，会造成严重的家庭焦虑**；**②\"此人死定了\"是对具体（可识别的）个人的死亡断言**，**既无法验证、也无法申诉，且极易造成当事人及其家属的心理创伤**（**这已不是\"推演\"，是\"宣判\"。**）**③两处都属\"不可证伪\"**：**孩子活过七岁→\"躲过去了\"；人死了→\"断得准\"；人没死→\"化解了\"**——**任何结果都能被吸收，所以它无法被检验，也无法被推翻。** **须说明**：**本集把这两段整段剔除**，**只保留第一处后半句可用的部分**：\"**小孩尽量让他玩，父母应该教学校没有的东西，让孩子的天真、童蒙的象出现，这样的小孩长大后，敢想敢做。**\"——**这一段是好的教育观，与\"断夭折\"无关，可独立成立**（**而\"敢想敢做\"来自\"被允许天真\"，这个因果是通的**）。** **⚠ 另须标**：**凡遇\"你有死相／你家人有死期\"一类断言，一律不必采信；若因此产生持续焦虑或失眠，可向精神心理科求助。**","o":"TJ-0655 · 天纪·紫微详解·第二章星曜·第27、28节（PDF 第22~23页）  ---"},{"t":"二百三十、干支推算口诀","h":"\"支同干隔一位算\"与\"申子辰年年为闰\"","c":"方法——**农历日干支的推算口诀为**：\"**初一十三二十五，支同干隔一位算。**\"其法：\"**在确定某月初一干支后，将这个月分成三个阶段：初一至十二、十三至二十四、二十五以后。初一、十三、二十五日在干支上也是有规律的——知道初一干支，只要将该日'天干隔一位顺推'，而'地支不变'。如初一日干支为甲子，则十三日干支为丙子，二十五日干支为戊子。掌握这个方法，就可以根据所推之日属于哪一段，很快知道这天的干支了。**\" **\"天干隔一位、地支不变\"这六个字，就是整条口诀的机要**：**相隔 12 天的两个日期，天干进两位（甲→丙），地支不动（子→子）**（**而理由是：12 天不是 10 天的整数倍——天干走 2 位；12 天正好是 12 地支的整一圈——地支回到原处）。** **而公历日干支的口诀为**：\"**元旦干支为根源，大小二月记心间。小月干同地支冲，大月上句加一天。申子辰年年为闰，干同支冲退一天。余年二月二十八，干同支冲退一天。月首十三二十五，支同隔干一位算。**\" **其中\"申子辰年年为闰\"一条极精**：\"**经过研究，发现凡地支为申、子、辰的年为公历闰年，二月为 29 天。**\" **即：公历\"闰年\"的判定，在这套口诀里被表达为\"年支属申、子、辰\"**（**其原理是：公历闰年的周期（4 年）与年支的周期（12 年）的最小公倍数是 12，所以每 12 年里固定有 3 个闰年，正好落在申、子、辰三个位置）。** **须说明**：**这是讲义的干支推算口诀**；**其可用的核极准**：**这是一套\"模运算\"的速算规则**（**而\"天干隔一位\"\"年支申子辰\"这两条，都能被独立验算**）；**⚠ 但须与下一条同读**：**这套口诀是\"手工速算\"的工具**，**而它的结果与\"查万年历\"是否一致，取决于使用者有没有算错——所以它不构成\"唯一解\"。**","o":"TJ-0656 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第37~39页）"},{"t":"二百三十、干支推算口诀","h":"日上起时歌诀与\"丙申时\"的完整推演","c":"方法——**时干支的推法，讲义给的口诀是**：\"**甲己还加甲，乙庚丙作初，丙辛生戊子，丁壬庚子头，戊癸起壬子，周而复始求。**\"其展开：\"**甲己起甲子：甲日、己日夜半的子时起于甲子时，顺推乙丑等。乙庚起丙子：乙日、庚日……丙辛起戊子：丙日、辛日……丁壬起庚子：丁日、壬日……戊癸起壬子：戊日、癸日……**\"（**即：看\"日天干\"是哪一组，就决定了\"子时\"的天干起点**）。** **而讲义给了一个完整推演的案例**：\"**张三，男，1968 年 2 月 16 日 15 时 30 分，农历戊申年正月十八日申时。干支：戊申年、甲寅月、丙辰日、丙申时（日空：子丑）。**\"其推演过程：\"**张三是十八日为丙辰日、申时——从戊子起：戊子、己丑、庚寅、辛卯、壬辰、癸巳、甲午、乙未、丙申。张三为丙申时。**\" **这十二个时辰的完整排列，把一个极容易漏的点显示出来了**：**\"丙辛起戊子\"（丙日的子时是戊子），而申时排在第九位**（**子→丑→寅→卯→辰→巳→午→未→申，共九步**），**所以是\"丙申时\"。** **\"日空：子丑\"这一注也须记**：**\"空亡\"是八字里的一个概念，指\"该旬里缺的两个地支\"**（**而\"丙辰日\"属\"甲寅旬\"，甲寅旬缺子、丑，故\"日空子丑\"**）。** **须说明**：**这是讲义对时干支推法的说明与实例**；**其可用的核极准**：**\"日上起时\"是一条可以完整验算的规则**（**从\"日天干\"到\"十二时辰的天干\"是可复现的**）；**而\"日空\"的推法同样可复现**（**它是\"旬\"的算术结果，不是断言**）。","o":"TJ-0657 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第39~40页）"},{"t":"二百三十一、八字取数成卦","h":"天干配数：洛书数与八卦","c":"定义——**\"八字取数\"的第一步，是\"天干配数\"**，讲义说明其来源：\"**古人以天干纳于八卦的后天数，亦即洛书来配取的。**\"其歌诀：**\"壬甲从乾数，乙癸向坤求；庚在震上立，辛在巽方游；丙于艮门立，己以离为头；戊须坎处出，丁向兑家流。\"**其对应的具体数为：**乾 6（壬、甲）；坤 2（乙、癸）；震 3（庚）；巽 4（辛）；艮 8（丙）；离 9（己）；坎 1（戊）；兑 7（丁）。** **这十个数，就是\"洛书\"（后天八卦数）**：**坎 1、坤 2、震 3、巽 4、中 5、乾 6、兑 7、艮 8、离 9**（**而\"天干配数\"就是把十个天干两两一组，挂到这八个卦（八个位置）上——**注意乾与坤各挂两个天干（壬甲、乙癸），其余六卦各挂一个）。** **须说明**：**这是讲义对\"天干配数\"的说明**；**其可用的核极准**：**这是一张\"明确的对应表\"**（**十个天干→八个卦→九个数，每一项都能逐条核对**）——**而它的作用是\"把八字转成数字，再用数字起卦\"**（**即：这一步是\"取数\"，不是\"断语\"。**）** **⚠ 须一并标明**：**\"天干配洛书数\"是这套体系内部的约定**，**它不来自可观测的自然规律**（**所以\"为什么是乾 6、坤 2\"这个问题，只能回答\"因为洛书的排法如此\"，不能回答\"因为天象如此\"**）。","o":"TJ-0658 · 天纪·紫微详解·第三章用八字排终身卦·八字取数（PDF 第40~41页）"},{"t":"二百三十二、一处决定性的自述","h":"\"千家千种结果，同一出生时间公历与农历所得结果都不同\"","c":"风险——**讲义在讲完排八字之法后，作者自己加了一段极重要的说明**：\"**排八字手工太繁琐，建议使用《万年历》查找。从八字取数开始使用手工——'我在线取过卦，千家千种结果，甚至同一出生时间，公历与农历所得结果都不同'。**\" **这段话是这一册里对\"命理可重复性\"最直接的一次否定，我逐层记**：**①\"排八字手工太繁琐，建议使用《万年历》查找\"**——**即：连作者自己也不建议手工排**（**因为步骤多、易错，而每一步错都会传导到最后的卦**）。** **②\"'我在线取过卦，千家千种结果'\"**——**同一个时辰、同一个求测者，不同的在线工具给出不同的卦**（**即：**这套体系在\"工具层面\"就没有唯一解**）。** **③\"甚至同一出生时间，公历与农历所得结果都不同\"**——**同一时刻，按公历排一套、按农历排另一套，结果不一样**（**即：**连\"输入口径\"都没有统一**）。** **这三层合起来，指向一个方法论上的结论**：**一套\"以时间为唯一输入\"的推演系统，若连\"输入口径\"与\"排盘算法\"都不能统一，那么它的输出就不具备\"可重复性\"**——**而\"不可重复\"意味着\"不可验证\"。** **须说明**：**这是作者原文的自述**（**不是我的引申**）；**其可用的核极重要**：**这段话应作为阅读整册（乃至全部命理内容）的\"前置提醒\"**：**当你看到某一条断语很准，须先问\"这个盘是怎么排出来的、换一个工具还会不会一样\"**；**⚠ 本集据此在\"紫微详解\"各章一律只记录\"这套系统的规则与说法\"，不对其预测效力作任何认可。**","o":"TJ-0659 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第40页）  ---"},{"t":"二百三十三、地支取数：河图数与一处表文不符","h":"\"亥子一六水，寅卯三八真\"","c":"定义——**\"八字取数\"的第二步是\"地支取数\"，讲义说明其来源**：\"**十二地支与河图相对应。**\"其歌诀：\"**亥子一六水，寅卯三八真；己午二七火，申酉四九金；辰戌丑未土，五十总生成。**\"其对应表为：**北方水 1、6（亥、子）；东方木 3、8（寅、卯）；南方火 2、7（巳、午）；西方金 4、9（申、酉）；中央土 5、10（辰、戌、丑、未）。** **即：每一个地支按\"五行方位\"取一对河图数（一奇一偶）**——**水 1/6、木 3/8、火 2/7、金 4/9、土 5/10**（**而\"五十总生成\"的\"生成\"是指土数为\"生数 5 + 成数 10\"）。** **须说明（本集做了一次逐项校验）**：**讲义随后给出了一张\"逐支阴阳配数表\"（子丑寅卯…亥 十二支，各配\"阳数／阴数\"两栏），我用上面的歌诀去核对这张表，发现十一支全部吻合、只有一处不符**：**表列\"寅（阳 3／阴 8）、卯（阳 3／阴 5）\"——按歌诀\"寅卯三八\"，卯的阴数应为 8，而表上作 5**（**其余：子 1/6、丑 5/10、辰 5/10、巳 2/7、午 2/7、未 5/10、申 4/9、酉 4/9、戌 5/10、亥 1/6，均与歌诀一致）。** **⚠ 据此判定**：**\"卯\"的阴数应作 8，\"表上的 5\"为原文（或转录）之误**；**本集两存并标：以歌诀\"寅卯三八真\"为准，表列\"5\"不采**。** **其可用的核极准**：**这一处恰好说明——这套体系内部是\"可以自我校验\"的**（**歌诀与表互校，就能发现错**）——**而\"能校验\"与\"能预测\"是两件事**：前者是算术，后者是断言。","o":"TJ-0660 · 天纪·紫微详解·第三章用八字排终身卦·地支取数（PDF 第41~42页）"},{"t":"二百三十四、天数与地数：取数的总规则","h":"\"天干布洛书之数，地支布河图之数\"","c":"要点——**讲义用一句话把\"取数\"的全部规则说清了**：\"**天干布洛书之数，地支布河图之数；奇数相加为天数，偶数相加为地数。**\" **三个动作，逐一记**：**①\"天干布洛书之数\"**（**天干用 1–9 的洛书数**：戊 1、乙癸 2、庚 3、辛 4、壬甲 6、丁 7、丙 8、己 9）；**②\"地支布河图之数\"**（**地支用 1–10 的河图数，见上条**）；**③\"奇数相加为天数，偶数相加为地数\"**（**把四柱里取到的数，按\"奇／偶\"分两堆相加——奇数之和是\"天数\"，偶数之和是\"地数\"）。** **而\"河图之数 25＋30＝55\"与\"洛书数 45\"是这套算法的两个常数**：**天数 1+3+5+7+9＝25；地数 2+4+6+8+10＝30**（**而\"洛书数 45\"是 1+2+…+9 的和）。** **须说明**：**这是讲义对取数规则的说明**；**其可用的核极准**：**\"奇偶分堆\"这个设计，等于把\"阳／阴\"从\"属性\"变成了\"可加的数\"**（**而这一步之后，整个算法就只剩下\"加法、取余、对表\"三件事**——**即：它可以被完整复现**）。","o":"TJ-0661 · 天纪·紫微详解·第三章用八字排终身卦·八字取数（PDF 第42页）"},{"t":"二百三十四、天数与地数：取数的总规则","h":"实例：1968 年那个命例的四柱取数","c":"方法——**讲义用同一命例走完了取材全程**：\"**张三，男，1968 年 2 月 16 日 15 时 30 分，农历戊申年正月十八日申时。四柱如下：年 1 戊申 4、9；月 6 甲寅 3、8；日 8 丙辰 5、10；时 8 丙申 4、9。**\" **逐项核对（本集已复算）**：**年柱\"戊申\"——戊的天干数＝1（洛书数，戊一）、申的地支数＝4 与 9（河图数，申酉四九）；月柱\"甲寅\"——甲＝6（洛书数，壬甲从六）、寅＝3 与 8（河图数，寅卯三八）；日柱\"丙辰\"——丙＝8（洛书数，丙八）、辰＝5 与 10（河图数，辰戌丑未土五十）；时柱\"丙申\"——丙＝8、申＝4 与 9。** **四柱取数与上一条的配数表完全吻合**（**即：这套\"取数\"步骤是可复现、可验算的**）。** **须说明**：**这是讲义给出的实例**；**其可用的核极准**：**这一例把\"干支→数\"的映射走了一遍，而每一步都能被独立核对**（**而这正是这套体系里\"最靠得住\"的一段**——**因为它只涉及\"对照表\"，不涉及\"断言\"**）；**⚠ 一并标明**：**\"取数\"正确，并不等于\"起卦后断语正确\"**（**那是两个环节**）。","o":"TJ-0662 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第42页）"},{"t":"二百三十五、天数与地数如何\"取余成卦\"","h":"天数求卦数：对二十五取余","c":"方法——**\"天数求卦数\"的规则，讲义给了九条例，其总纲是一句话**：\"**看天数是多少，除去天数二十五，以其余数为卦。**\"其细则（照录）：**\"如只有二十五，则除二十，用余数五；如不足二十五数，则以十位数作余数——如天数十八，则除十，用余数八。天数二十三，则除二十，用三数。天数二十五，则除二十，用五数。天数二十八，则除二十五，用三数。天数三十一，则除二十五，用六数。天数三十九，则除二十五，余十四，再除十，用四数。天数二十，则以十位数作余数，用二数。余则以此类之。\"** **把九条归并，实际是一条\"两次取余\"的算法**：**①先对\"二十五\"（或\"二十\"）取余；②若余数仍 ≥10，再\"遇十不用\"（去掉十位），只取个位；③最终必须落在 1–9（因为要对应洛书九宫）。** **验算三例（本集复算）**：**天数 28 → 28−25＝3 ✓；天数 31 → 31−25＝6 ✓；天数 39 → 39−25＝14 → 去十取个位＝4 ✓**（**三条均与讲义所给一致）。** **须说明**：**这是讲义的取余规则**；**其可用的核极准**：**这是一段\"可以完全跑通\"的算法**（**输入一个正整数，输出一个 1–9 的卦数**）；**而\"为什么要对 25 取余\"，讲义没有给出理由**——**它属\"约定\"，不属\"推导\"**（**本集照录而不解释**）。","o":"TJ-0663 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第42~43页）"},{"t":"二百三十五、天数与地数如何\"取余成卦\"","h":"地数求卦数：对三十取余","c":"方法——**\"地数求卦数\"的规则**：\"**将天干地支所有偶数相加，看地数所得之数，除地数三十，以其余数为卦。**\"其细则（照录）：**\"地数十五，则除十，用五数。地数二十六，则除二十，用六数。地数二十九，则除二十，用九数。地数三十，则遇十不用，只用三数。如果超过三十，除了三十不用，只用零数——地数四十二，则除三十，余十二，再遇十不用，用二数。地数五十，则除三十，余二十，以十位数作余数，用二数。地数五十六，则除三十，余二十六，遇十位数不用，只用个位数，用六数。\"** **与天数的规则对照，两条是\"同构\"的**：**天数对\"二十五\"取余、地数对\"三十\"取余**（**而\"二十五\"与\"三十\"正是\"天数总和\"与\"地数总和\"——**即：用\"该类的总数\"去取余，余数代表\"它在这一圈里的位置\"**）。** **验算三例（本集复算）**：**地数 42 → 42−30＝12 → 去十取个位＝2 ✓；地数 50 → 50−30＝20 → 去十取个位＝2 ✓；地数 56 → 56−30＝26 → 去十取个位＝6 ✓**（**三条均与讲义一致）。** **须说明**：**这是讲义的取余规则**；**其可用的核极准**：**\"两次取余\"的写法很粗，但\"结果落在 1–9\"这个约束是一致的**（**而\"地数 30 → 只用 3\"这一条是个例外，说明规则在整十处有特判**）；**⚠ 这一处正是\"手工易错\"的来源**（**与作者\"建议使用《万年历》\"\"千家千种结果\"的自述相呼应**）。","o":"TJ-0664 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第43页）"},{"t":"二百三十五、天数与地数如何\"取余成卦\"","h":"五数寄宫：余数为 5 时怎么办","c":"定义——**这套算法的最后一环，是\"五数寄宫\"**：\"**五数寄宫诀：凡天数或地数，所余之数如求得五数，因'五'寄中、无卦——上元（1864 年—1923 年）出生者，男寄艮卦、女寄坤卦；中元（1924 年—1983 年）出生者，阳男阴女寄艮卦、阴男阳女寄坤卦；下元（1984 年—2043 年）出生者，男寄离卦、女寄兑卦。余数为 5，阳男寄于艮，为下卦。**\" **这一条把\"五\"这个\"无卦之数\"的处理，交给了一张\"元运 × 性别 × 阴阳\"的表**：**上元（1864–1923）：男→艮、女→坤；中元（1924–1983）：阳男阴女→艮、阴男阳女→坤；下元（1984–2043）：男→离、女→兑。** **即：同一个\"余数为 5\"，在不同年代、不同性别、不同阴阳的人身上，会落到四个不同的卦（艮、坤、离、兑）。** **须说明**：**这是讲义对\"五数寄宫\"的规定**；**其可用的核极准**：**这是一条\"必须写死\"的分支规则**（**否则\"余数为 5\"就无法成卦**）——**而它同时也说明：这套体系里\"同一个输入\"可以有多解，只要规则允许**；**⚠ 须一并标明**：**\"上元／中元／下元\"的三元划分（1864–1923／1924–1983／1984–2043）属\"三元九运\"的历法约定**，**本集照录其数值，不认同其\"元运决定吉凶\"的断言**。","o":"TJ-0665 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第43页）  ---"},{"t":"二百三十六、终身卦的完整推演","h":"天数与地数的实算：27→2 坤、48→8 艮","c":"方法——**讲义用同一命例把\"取数→取余→成卦\"走完了全程，其算式为**：\"**上面八字单数相加为天数：1+9+3+5+9=27÷25=1…2，余数是 2，2 为坤卦。双数相加为地数得：4+6+8+8+10+8+4=48÷30=1…18÷10=1…8，余数为艮卦。**\" **本集逐项复算（全部吻合）**：**①天数**——取四柱中的奇数：**戊 1、申 9、寅 3、辰 5、申 9**，和＝**27**；**27÷25＝1 余 2**；**余 2 → 坤**（洛书数坤 2）。**②地数**——取四柱中的偶数：**申 4、甲 6、丙 8、丙 8、辰 10、寅 8、申 4**，和＝**48**；**48÷30＝1 余 18**；**18 再\"遇十不用\"取个位＝8**；**余 8 → 艮**（洛书数艮 8）。** **两处余数都落到了\"无特判\"的位置（2 与 8），所以不必走\"五数寄宫\"**（**而这也说明\"特判规则\"只在余数为 5 时才触发）。** **须说明**：**这是讲义所给的实例算式**；**其可用的核极准**：**这一段是整套算法里\"最硬\"的一段——每一步都能被独立复算，且结果唯一**（**本集复算与讲义完全一致**）；**⚠ 一并标明**：**\"算得对\"只证明\"算术无误\"，不证明\"卦所断之事为真\"**。","o":"TJ-0666 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第43~44页）"},{"t":"二百三十六、终身卦的完整推演","h":"阳命阴命与\"天数在上、地数在下\"","c":"定义——**两堆数（天、地）算出来之后，谁在上、谁在下，由\"命之阴阳\"决定**。**先定\"阳命／阴命\"**：\"**阳命：子、寅、辰、午、申、戌年生之男女，谓之阳男、阳女。阴命：丑、卯、巳、未、酉、亥年生之男女，谓之阴男、阴女。**\" **即：只看\"年支\"——阳支（子寅辰午申戌）为阳命，阴支（丑卯巳未酉亥）为阴命**（**而实例\"戊申年\"的申为阳支，故为\"阳男\"**）。** **再定上下**：\"**阳男、阴女：天数在上，地数在下。阴男、阳女：天数在下，地数在上。**\" **这两条合起来，是一个\"四格表\"**：**阳男／阴女→天在上、地在下；阴男／阳女→天在下、地在上**（**而两组正好互补——即：男与女、阳与阴，只要\"阴阳相配\"就归到同一格）。** **须说明**：**这是讲义对\"命之阴阳\"与\"上下之位\"的规定**；**其可用的核极准**：**这条规则把\"性别\"与\"年支阴阳\"配成了\"上下\"二值**（**即：整个成卦过程只有\"两堆数 + 一次排序\"，没有第三种输入**）；**⚠ 须标**：**\"阳男阴女\"\"阴男阳女\"是这套体系内的术语**（**其\"男女\"之分属古代体系设定，本集只记其作为\"二值开关\"的结构作用**）。","o":"TJ-0667 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第44页）"},{"t":"二百三十六、终身卦的完整推演","h":"成卦：\"地山谦\"","c":"要点——**实例的成卦结果**：\"**张三，阳男，天数 2、坤卦；地数 8、艮卦——为地山谦卦。**\" **本集复算**：**阳男 → 天数在上（坤）、地数在下（艮）**；**坤上艮下 → 地山谦** ✓（**谦卦的卦体正是\"坤上艮下\"，即\"地在上、山在下\"**）。** **而这里有一个值得指出的闭合**：**《天纪·人间道》讲谦卦时，其核心取象正是\"山居地下\"**（**\"谦不是没本事，而是有本事而甘居其下\"**）——**而这套\"终身卦\"的推演，最后落到的那一卦，恰好就是\"谦\"。** **即：一个人被\"算\"出来的本命卦，是\"该谦\"的那个卦。** **须说明**：**这是讲义实例的成卦结果加本集复算**；**其可用的核极准**：**\"坤上艮下＝地山谦\"是可核的（卦体与卦名一一对应）**；**而\"谦\"这一卦在《人间道》里的主旨是\"有本事而甘居其下\"**——**这恰好给\"算命\"这件事本身一个反讽**：**若一个人算出的卦是\"谦\"，该做的不是\"等吉凶\"，而是\"把自己放低\"**（**这与\"谦卦六爻无凶辞\"的设计是一致的**）。","o":"TJ-0668 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第44页）"},{"t":"二百三十七、元堂爻位：从先天卦到后天卦的那一爻","h":"\"阴时取阴爻，从午时数起\"","c":"定义——**\"元堂\"是全套推法里最关键的一步，讲义的定义极清楚**：\"**所谓元堂者，就如命宫一样，亦名为'动爻'，由先天卦变为后天卦的关键所在。求法专以人之生时为主：一日有十二时；上六时属阳：子、丑、寅、卯、辰、巳也；下六时属阴：午、未、申、酉、戌、亥也。凡阳时生人，则取本卦阳爻，从子时数起；阴时生人，则取本卦阴爻，从午时数起。**\" **其实例推演（本集已复现）**：\"**张三，阳男，下六时生人，属阴——阴时生人则取本卦阴爻，从午时数起。申时生的人，命卦得地山谦卦：最下的阴爻为初爻，那么从初六爻数午，六二爻是未，九三爻为阳爻跳过，六四爻数申——张三是申时生人，因此元堂爻在六四爻上。**\" **复现过程**：**谦卦六爻自下而上为——初六（阴）、六二（阴）、九三（阳）、六四（阴）、六五（阴）、上六（阴）**；**因\"阴时生人取本卦阴爻\"，故\"九三\"（阳爻）被跳过**；**从午时起数：午→初六、未→六二、（九三跳）、申→六四**（**所以\"申时\"落在六四** ✓ **与讲义一致**）。** **这个设计的精巧在于两处\"筛选\"**：**①按时辰的阴阳，先决定\"只看阳爻还是只看阴爻\"；②按十二时辰顺数，数到\"自己的时辰\"停下**（**而\"跳过另一性的爻\"正是它的机关**）。** **须说明**：**这是讲义对元堂的说明与实例**；**其可用的核极准**：**\"元堂\"的求法是一段完全可复现的算法**（**给定\"卦＋时辰＋性别\"，结果唯一**）；**⚠ 须标**：**\"元堂由先天卦变为后天卦的关键\"这一断言属体系内部说法**，**本集只记其\"算法\"，不认同其\"先天转后天\"的形上解释**。","o":"TJ-0669 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第44页）"},{"t":"二百三十八、另一种起卦法（大众法）","h":"\"年干支＋月数\"取余起上卦","c":"方法——**讲义另给了\"另一种快速起卦法（大众法）\"**：\"**以农历年干支加月数之和除以 8，余数起为上卦；上卦之数再加时辰数之和除以 8，余数起为下卦；以总和数除以 6，余数为动爻——余数为 0 时，用除数。**\" **三步，逐一记**：**①上卦**＝（年干支数＋月数）÷8 取余；**②下卦**＝（上卦之数＋时辰数）÷8 取余；**③动爻**＝（总和）÷6 取余（**余 0 则用除数，即 6**）。** **而\"大众法\"用的数表，与前面\"洛书／河图\"那套**完全不同**，须分清**：**天干表有两行——\"年干数\"：甲 4、乙 5、丙 6、丁 7、戊 8、己 9、庚 0、辛 1、壬 2、癸 3；\"配数\"：甲 1、乙 2、丙 3、丁 4、戊 5、己 6、庚 7、辛 8、壬 9、癸 10**；**地支表——子 1、丑 2、寅 3、卯 4、辰 5、巳 6、午 7、未 8、申 9、酉 10、戌 11、亥 12。** **须说明（这一处最易混）**：**同一册书里存在两套完全不同的\"取数表\"**——**终身卦用\"天干配洛书数、地支配河图数\"**（**戊1、甲6、丙8…**）；**大众法用\"年干数／配数＋地支 1–12 顺序号\"**（**甲4或甲1、子1…**）**——两套数表不能通用**，**混用会导致同一生辰排出两个不同的卦**。** **⚠ 本集据此提示**：**这正是前章作者自述\"千家千种结果\"的技术根源所在**（**不是\"工具不准\"，而是\"多套算法并存、且未统一口径\"**）；**其可用的核**：**\"大众法\"三步都只是除法取余，可以被完整复现**（**而\"哪一套算法才对\"，讲义没有给出裁决标准**）。","o":"TJ-0670 · 天纪·紫微详解·第三章用八字排终身卦·大众法（PDF 第44~45页）"},{"t":"二百三十八、另一种起卦法（大众法）","h":"八卦符号表的一处疑误","c":"风险——**讲义在\"大众法\"之后附了\"八卦表\"，列出八卦与其符号**（**乾 ☰、兑、离 ☲、震 ☳、巽 ☴、坎 ☵、艮、坤**）。**本集核对发现，表中\"兑\"的符号被写作\"☷\"**——**而\"☷\"是\"坤\"的卦象（三阴爻）**；**\"兑\"的正确卦象应为\"☱\"（上阴、下二阳）**。** **而\"艮\"的正确卦象应为\"☶\"（上一阳、下二阴）**，**该表在\"艮\"一处未列出可辨符号**。** **据此判定**：**八卦符号表存在转录（或排版）之误**，**\"兑＝☷\"与\"艮＝☶ 缺\"两处不采**，**以标准卦象为准**：**乾 ☰、兑 ☱、离 ☲、震 ☳、巽 ☴、坎 ☵、艮 ☶、坤 ☷。** **须说明**：**这是本集对讲义附表的逐项核对**；**其可用的核极准**：**八卦符号是\"固定字形\"，可逐字比对**（**所以这一处能被明确判定为\"表错\"，不是\"观点不同\"**）；**⚠ 这类错误对读者的实际影响是**：**若照错表起卦，卦体就会错**（**而卦体一错，后面所有推断全部作废**）——**这也是\"手工排盘易错\"的又一实证**。","o":"TJ-0671 · 天纪·紫微详解·第三章用八字排终身卦·八卦表（PDF 第45页）  ---"},{"t":"二百三十九、大众法实例：同一个张三，两个卦","h":"地天泰之临：另一次完整推演","c":"方法——**讲义用同一命例把\"大众法\"也走了一遍**：\"**张三，男，1968 年，公元年尾数 8 天干是戊，查对应配数是 5；正月 1、18 日，申时 9。① 5+1+18=24÷8=3，余数为 0，余数为 0 时用除数（注：'手工算除法，不能用计算器，手工与计算器余数不一样'）。8 为坤，是上卦。② 上卦之数再加时辰数除以 8：24+9=33÷8=4…1，余数为 1，1 为乾。得卦为地天泰卦。③ 以总和数除以 6：33÷6=5…3，余数为 3，九三爻为动爻，得泰之临卦，地泽临卦。**\" **本集复算（全部吻合）**：**①（5+1+18）＝24；24÷8＝3 余 0，余 0 用除数 8 → 坤（上卦）**；**②24+9＝33；33÷8＝4 余 1 → 乾（下卦）**；**坤上乾下＝地天泰 ✓**；**③33÷6＝5 余 3 → 第三爻动 → 泰卦九三变六三，下卦乾变兑 → 兑下坤上＝地泽临 ✓**。** **而\"手工算除法不能用计算器\"这一注极重要**：**作者明确说\"手工与计算器余数不一样\"**（**即：同一道除法，不同的计算方式会给出不同的余数——**这在数学上不该发生，但它被写进了教程**）。** **须说明**：**这是讲义所给的实例**；**其可用的核极准**：**三步都是\"加法＋除法取余＋对表\"，完全可复现**（**本集复算与讲义一致**）；**⚠ 而\"手工与计算器余数不一样\"这句话须单列**：**它说明这套算法的\"执行环节\"本身不稳定**（**而算法不稳定，输出就不可能唯一**）。","o":"TJ-0672 · 天纪·紫微详解·第三章用八字排终身卦·大众法实例（PDF 第45页）"},{"t":"二百三十九、大众法实例：同一个张三，两个卦","h":"同一个生辰，两个卦：这就是\"千家千种结果\"","c":"风险——**把这一章的两个实例并排看，会得出一个极重的结论**：**同一个张三（1968 年 2 月 16 日 15 时 30 分，戊申年正月十八日申时）**——**用\"终身卦法\"（天干配洛书、地支配河图、奇偶分堆、取余成卦）得到的先天命卦是\"地山谦\"**；**用\"大众法\"（年干支数＋月数＋日数＋时辰数取余）得到的卦是\"地天泰之临\"**。** **即：同一个人、同一个出生时刻，两套算法给出两个完全不同的卦**——**而讲义把两套算法并列写在同一章里，且没有给出\"该用哪一套\"的裁决标准。** **须说明**：**这不是本集的推测，而是讲义自身文本的并置结果**（**\"地山谦\"见第 44 页，\"地天泰之临\"见第 45 页，同一例**）；**其可用的核极准**：**这一处并置，是前章作者自述\"我在线取过卦，千家千种结果\"最直接的实证**——**不是\"别人算错\"，而是\"体系本身允许两套不兼容的算法\"**；**⚠ 本集据此提示**：**凡遇到\"某命理断言很准\"的说法，须先问\"用的是哪一套算法、换一套还会不会是这个卦\"**——**若答案是\"会变\"，那么这条断言的可信度就不取决于\"准不准\"，而取决于\"它用了哪套\"**。","o":"TJ-0673 · 天纪·紫微详解·第三章用八字排终身卦（PDF 第44~45页）"},{"t":"二百四十、先天卦换后天卦与起运","h":"\"元堂之爻变，移外卦入内\"","c":"方法——**\"先天卦换后天卦\"的三步规则，讲义写得极简**：\"**先天之卦即成，元堂既定，却以元堂之爻——阳爻变阴爻，阴爻变阳爻；乃移外卦入内，内卦出外，看得何卦。'乃天旋地转、更革之象'，是为后天之卦。**\" **三步逐一记**：**①\"以元堂之爻，阳爻变阴爻，阴爻变阳爻\"**（**只变那一爻**）；**②\"移外卦入内，内卦出外\"**（**上下卦对调**）；**③所得之卦即\"后天卦\"**。** **本集用张三的实例复算了一遍（这一步讲义未写完，本集补算）**：**先天卦＝地山谦（坤上艮下），元堂在六四（阴爻）**；**①变六四为九四 → 上卦（坤：六四、六五、上六）变为震（九四、六五、上六）→ 得\"雷山小过\"（震上艮下）**；**②移外卦入内、内卦出外（震入内、艮出外）→ 艮上震下＝山雷颐**。** **即：张三的后天卦应为\"山雷颐\"。** **而\"山雷颐\"的爻性为 2 阳（初九、上九）＋4 阴（六二、六三、六四、六五）**——**这正好与下条\"后天卦共管四十二年\"吻合**（**2×9＋4×6＝18＋24＝42** ✓）。** **须说明**：**这是本集据讲义所给三步规则的补算**（**讲义图中\"后天卦\"一处仍标\"地山谦卦\"，与三步规则不符，本集存疑并标出**）；**其可用的核极准**：**\"变一爻＋翻内外\"是一条可复现的变换**（**而它算出的年数（42）又与讲义所给数字吻合——**这说明\"三步规则\"与\"年数表\"是自洽的，而图上的卦名标错了）。","o":"TJ-0674 · 天纪·紫微详解·第三章用八字排终身卦·先天卦换后天卦（PDF 第46~47页）"},{"t":"二百四十、先天卦换后天卦与起运","h":"起大限：阳爻九年、阴爻六年","c":"要点——**起运的规则，讲义只有一句**：\"**不论先天卦，还是后天卦，都从元堂上起运，阳爻九年一过运，阴爻六年一过运。**\" **而两级年数由此可算**：**先天卦\"共管三十八年\"**——**谦卦有 5 阴爻、1 阳爻（5×6＋1×9＝39）**，**而讲义作\"三十八年\"**（**差 1，因起于\"1 岁\"、实占 38 个年份**）；**后天卦\"共管四十二年\"**——**颐卦 2 阳 4 阴（2×9＋4×6＝42）** ✓（**与本集上条补算完全吻合**）。** **而\"从元堂上起运\"这一句是关键**：**元年（1 岁）落在\"元堂\"那一爻，然后按\"阳 9 年、阴 6 年\"逐爻推进**（**而推进的方向与次序，由图上的岁段读出的（1–6、7–12、13–17、18–23、24–29、30–38）**）。** **须说明**：**这是讲义对起大限的规定**；**其可用的核极准**：**\"阳 9 阴 6\"这条规则与\"38／42\"这两个总数能互相验算**（**而验算通过，说明这套\"年数\"是从\"爻性\"算出来的，不是随便定的**）；**⚠ 须标**：**\"大限\"在此仍是\"以卦爻推年段\"的体系内构造**，**本集记录其算法，不认同其\"某爻主某岁吉凶\"的断言**。","o":"TJ-0675 · 天纪·紫微详解·第三章用八字排终身卦·起大限（PDF 第46~47页）"},{"t":"二百四十、先天卦换后天卦与起运","h":"变爻法则与一处前后不一致","c":"风险——**\"起流年小限\"的变法，讲义给了一条极明确的法则**：\"**凡阳爻遇阳年不变，阳爻遇阴年则变；阴爻不分阳年、阴年皆变——这是法则。**\" **即：变与不变，取决于\"爻性 × 年性\"**：**阳爻遇阳年→不变；阳爻遇阴年→变；阴爻（无论年之阴阳）→变。** **而这一节有一处前后不一致，须标出**：**同一段里写\"先天命卦为地山谦卦，元堂在九四爻位\"**——**而前文（第 44 页）明确推出\"元堂在六四爻上\"**（**且\"谦卦第四爻\"依爻性应为\"六四\"（阴），不是\"九四\"（阳）**）。** **据此判定**：**\"元堂在九四\"为讲义笔误，应以\"六四\"为准**（**因为谦卦第四爻是阴爻，且前文推演用的是\"取本卦阴爻\"**）。** **须说明**：**这是本集对讲义前后文的核对**；**其可用的核极准**：**\"谦卦六四为阴\"是固定的卦体事实**（**所以\"九四\"这一写必错**）；**⚠ 这一处再次印证前章的判断**：**这套体系\"算法本身\"可以复现，但\"抄写与执行\"极易出错**（**而\"一处爻位标错，全年段推断全错\"**）——**这与作者自述\"排八字手工太繁琐\"\"千家千种结果\"是一致的。","o":"TJ-0676 · 天纪·紫微详解·第三章用八字排终身卦·起流年小限（PDF 第47页）"},{"t":"二百四十一、第四章\"卦象详解\"：八卦方位与家庭成员","h":"后天八卦配\"父母子女\"","c":"定义——**第四章\"卦象详解\"开篇，给的是一张\"八卦—家庭成员—方位\"的对应表**（**本集按原文逐项照录**）：**巽（☴）长女、东南**；**离（☲）中女、正南**；**坤（☷）母亲、西南**；**震（☳）长男、正东**；**中（中宫）**；**兑（☱）少女、正西**；**艮（☶）少男、东北**；**坎（☵）中男、正北**；**乾（☰）父亲、西北。** **这张表把三样东西绑在一起**：**卦象（符号）＋家庭角色（父母与三男三女）＋方位（后天八卦的九宫位）**——**而\"中\"独为一格（无卦）**，**这正与前面\"五数寄宫\"处\"五寄中、无卦\"同构**。** **须说明**：**这是讲义第四章的方位表**；**其可用的核极准**：**\"乾父、坤母、震长男、坎中男、艮少男、巽长女、离中女、兑少女\"这套配属，与《说卦》一致**（**即：它不是本书自创，而是《易》的旧说**）；**⚠ 而\"方位配吉凶\"（如\"父亲睡西南为天地否、名位不相等\"）才是本书的引申**——**本集在记录时把\"配属\"与\"吉凶断言\"分开：前者是旧说，后者是本书主张**。","o":"TJ-0677 · 天纪·紫微详解·第四章卦象详解·八卦方位（PDF 第47~48页）"},{"t":"二百四十一、第四章\"卦象详解\"：八卦方位与家庭成员","h":"\"卦象详解\"的体例：逐爻要旨","c":"要点——**第四章的写法与《人间道》不同，须分清**。**《人间道》是\"五段体例\"**（**卦名卦体／占例／卦题／卦图象解／逐句讲义**）；**而\"卦象详解\"是\"逐爻列要旨\"**——**每卦按六爻（含用九用六）自上而下排列，每一爻给两行：上一行是\"爻辞要旨\"（如\"亢龙有悔、无民无辅\"），下一行是\"讲义解\"（如\"知进能退、物极则反、以免败亡\"）**。** **以\"乾为天卦\"为例（原文）**：**上九——\"亢龙有悔、无民无辅\"／\"知进能退、物极则反、以免败亡\"**；**九五——\"飞龙在天\"／\"九五至尊、顺天而行、励精图治\"**。** **即：这一章的功能是\"速查表\"**——**一卦六爻，一眼看清\"每爻讲什么、要防什么\"**（**而它不展开论证，也不引经据典）。** **须说明**：**这是本集对第四章体例的观察**（**依据为已读的乾卦开头**）；**其可用的核极准**：**\"逐爻要旨表\"对\"查用\"极方便**（**而它省略了论证，所以不能替代《人间道》的逐句讲义**）——**两章合用才完整：先读《人间道》知其理，再查\"卦象详解\"记其要。","o":"TJ-0678 · 天纪·紫微详解·第四章卦象详解·体例（PDF 第48页）  ---"},{"t":"二百四十二、断卦的操作方法","h":"\"将他变成卦、观察他处在第几爻，然后从那个爻往上走\"","c":"方法——**讲义在每一卦的爻位表之后，都加了同一句操作说明**：\"**当来人求测时，将他变成卦、要观察他处在第几爻，然后'从那个爻往上走'，进行解读。**\" **这一句是整套\"断卦\"的操作要旨，四个动作**：**①\"将他变成卦\"（先把人转成一个卦）；②\"观察他处在第几爻\"（定位到具体的一爻）；③\"从那个爻往上走\"（只读该爻及其以上）；④\"进行解读\"。** **关键在第三动**：**不是\"整卦全读\"，是\"定位后往上走\"**（**即：一个人\"在哪一爻\"，决定\"他能看见什么、还够不着什么\"）。** **而这一条与《天纪·人间道》里的\"从那一爻往上走\"的分期意识是同一说法**（**人间道讲\"六爻是'与危险距离的六个刻度'\"、\"六爻地位表\"；此处讲\"求测者定位到某一爻，再往上读\"——两处合起来，\"爻位\"既是\"处境\"，也是\"读法的起点\"）。** **须说明**：**这是讲义每卦通用的体例说明**；**其可用的核极准**：**\"从那一爻往上走\"是一个\"限制读法\"的规则**（**它排除了\"拿全卦套人\"的常见误用**）——**而它同时把\"读卦\"变成了一件有条件的事：先定位，再解读**。","o":"TJ-0679 · 天纪·紫微详解·第四章卦象详解·通例（PDF 第48~50页）"},{"t":"二百四十三、乾卦：全录","h":"六爻要旨表与\"君宰／将相\"位阶","c":"要点——**\"卦象详解\"的第一卦是乾为天，其六爻要旨如下（本集照录，每爻两行：上为爻辞要旨、下为讲义解）**：**上九——\"亢龙有悔、无民无辅\"／\"知进能退、物极则反、以免败亡\"**；**九五——\"飞龙在天\"／\"九五至尊、顺天而行、励精图治\"**；**九四——\"或跃在渊\"／\"择时而动，一定要坚心勿忘初衷\"**；**九三——\"终日乾乾、敬业修业\"／\"承上起下，严于律己、顺时而动\"**；**九二——\"见龙在田\"／\"当主管时、利见大人，广结朋友\"**；**初九——\"潜龙勿用\"／\"在野没有为官之前、闲云野鹤\"。** **而表旁另标了两个位阶词**：**\"君 宰\"（标在九五、上九之上）与\"将 相 下\"（标在九四之下）**——**即：上两爻属\"君宰\"（决策层），下四爻属\"将相\"（执行层）。** **两句最要紧的注解**：**九四\"择时而动，一定要坚心勿忘初衷\"**（**\"择时\"与\"坚心\"并列——即：等时机，但不忘初衷**）；**九三\"承上起下，严于律己、顺时而动\"**（**\"顺时而动\"再出现一次，与《人间道》\"君子随时顺处\"同调**）。** **须说明**：**这是讲义第四章乾卦的爻位表**；**其可用的核极准**：**\"君宰／将相\"这个位阶划分，把六爻变成了\"两层组织\"**（**而上两爻的\"亢龙有悔\"与\"飞龙在天\"正是\"决策层\"的两极**）；**⚠ 一并标明**：**这一章的爻辞要旨是对《易》原文的\"压缩改写\"**（**如\"亢龙有悔、无民无辅\"把爻辞与象辞并作一行**）——**读时应与《人间道》的逐句讲义对看**。","o":"TJ-0680 · 天纪·紫微详解·第四章卦象详解·乾为天（PDF 第48页）"},{"t":"二百四十三、乾卦：全录","h":"\"性格\"段：孤阳不生与\"失运时克子伤妻\"","c":"要点——**乾卦的\"性格\"段，是这一章最见功力的一段**：\"**上乾下乾，乾为金、二金为比和，纯阳之象。乾主刚健，不知疲惫；'孤阳不生，不利于女性，男得此卦意味着寿短'。阳主正大光明、正直、心底无私、心胸宽阔，正人正己，说话做事直来直去，绝无私情，有管理才能和领导能力；'但对家人和朋友来说：不重情意，不讲情面，只顾自己，洁身自好，往往费力不讨好'。'得运时大利财名，失运时克子伤妻'。**\" **这段话把\"纯阳\"的两面写透了**：**正面——正大光明、正直、无私、心胸宽、有管理才能、说话直来直去**；**负面——孤阳不生、不利于女性、男命寿短；对家人朋友\"不重情意、不讲情面、只顾自己\"，\"费力不讨好\"；失运时\"克子伤妻\"。** **即：同一种\"刚\"，对外是\"正直\"，对内是\"无情\"。** **而\"得运时大利财名，失运时克子伤妻\"这一句，把\"运\"的两头也点明了**（**同一副性格，好时是资本，坏时是刀**）。** 后段续论：\"**乾为天，其行刚健，其象伟大，覆盖万物无偏无私。上卦下卦都是天，象征着太阳刚刚升起，光芒四射，普照大地，包容万物之象。乾为天，在家为尊长，单位为领导，国家为执政者，居上位而不骄，要刚健无私。'得乾卦者，具备刚健不息，缺乏柔顺美德，适宜创业，守成欠佳，谨防太强'。女人得此卦，则有过于刚直之谦。**\" **\"适宜创业，守成欠佳，谨防太强\"这十二个字，是全书对\"纯阳性格\"最实用的一句判语**（**即：这种人适合\"从无到有\"，不适合\"守住已有\"**）。** **须说明**：**这是讲义对乾卦性格的论述**；**其可用的核是\"同一特质在不同场合的两面\"**（**\"对外正直／对内无情\"、\"得运是资本／失运是刀\"、\"适宜创业／守成欠佳\"三组对照**）——**这一层脱开命理也成立**；**⚠ 须标**：**\"孤阳不生，不利于女性\"\"男得此卦意味着寿短\"\"克子伤妻\"属命理断言**，**无验证基础，不可据以判断寿命或家庭吉凶**。","o":"TJ-0681 · 天纪·紫微详解·第四章卦象详解·乾为天·性格（PDF 第48页）"},{"t":"二百四十三、乾卦：全录","h":"\"地脉道\"段：位对了念就对了","c":"方法——**乾卦\"地脉道\"段，是《天纪》阳宅部分讲得最完整的一条**：\"**乾为天卦：爸爸是乾卦、住到西北角乾位，叫乾为天卦、名位相等——是指结了婚的男士一定要住到乾上。'位对了念就对了'，就会养成乾为天的个性：坚守原则、认清自己实力、知道自己要追求什么？生命的意义是什么？摆脱名利之欲、'无欲则刚'，加之深谋远虑、知所进退、必有所成就。'未婚男不可住在此乾位'。**\" **这一段的核心是六个字：\"位对了念就对了\"**——**即：位置对了，\"念头\"就会跟着对**（**而\"念\"对，性格才会养成**）。** **而\"就会养成乾为天的个性\"这一句，把地脉道的机制说清了**：**不是\"住对了就发\"，是\"住对了会慢慢长成那种性格\"**（**而性格长对了，才\"必有所成就\"）。** **而\"未婚男不可住在此乾位\"是一条明确的限制**（**即：乾位属\"已婚之父\"，未婚者不住**——与\"名位相等\"的判定一致）。** **表旁另标三个要旨：\"名位相等／无欲则刚／位对了念才会对\"。** **须说明**：**这是讲义对乾位阳宅的论述**；**其可用的核极窄**：**\"位对了念就对了\"是一个可理解的机制假设**（**环境塑造习惯、习惯塑造性格**），**但\"住某方位就能长出某性格\"没有可重复验证的因果证据**；**⚠ 须标**：**本集记录其\"说法与规则\"（谁该住哪、名位是否相等），不认同\"方位决定性格与成就\"的因果断言**。","o":"TJ-0682 · 天纪·紫微详解·第四章卦象详解·乾为天·地脉道（PDF 第49页）"},{"t":"二百四十三、乾卦：全录","h":"先天、后天、流年与文王金钱课","c":"要点——**乾卦这一节还给了四层\"断语\"，本集照录并标其性质**。**①\"先天\"**：\"**生带禄，智慧高，不见生父，命为定数**\"；**②\"后天\"**：\"**官带加升、名气大，声闻四海。父母全：年龄很大父母还都在。财禄丰盛！**\"；**③\"流年\"**：\"**流年逢之，连跳三级（连换三个工作），好事多磨；六甲得子（今年还会得子），偏房生。女命逢之，先天卦后天卦一样：性过刚，事业亨通，'婚姻多磨总成空'。真正丈夫在上位！**\"；**④\"文王金钱课\"**：\"**乾为天卦：○○○○○○（困龙得水）上上。象曰：困龙得水好运交，不由喜气上眉梢。一切谋望皆如意，此后时运渐渐高。诗曰：龙游浅水闲沙滩，曾受虾戏在人间，已到雷声风雨至，五湖四海都平安。断曰：大吉之课，无不欢乐，上人见喜，诸事不错。**\" **其中两处须单记**：**①\"女命逢之……性过刚，事业亨通，婚姻多磨总成空\"**——**这一句是讲义对\"女性得纯阳卦\"的判断**（**而\"真正丈夫在上位\"是它的解法：需要一个更强的伴侣，否则\"总成空\"**）；**②\"文王金钱课\"的编码方式**：**六爻全记\"○\"即纯阳＝乾卦**（**即：这一课是用\"六个符号\"直接表示卦体，而\"困龙得水\"是它的\"课名\"，\"上上\"是等级**）。** **须说明**：**这四层是讲义的标准格式**（**每卦都按\"先天／后天／流年／文王金钱课\"四段来写**）；**其可用的核极窄**：**\"文王金钱课\"的\"○○○○○○＝乾\"是可核的编码**（**六个阳爻就是乾**），**而\"困龙得水、上上、大吉\"属课名与断语**，**不构成可验证的预测**；**⚠ 须标**：**\"生带禄\"\"官带加升\"\"连跳三级\"\"六甲得子\"\"婚姻多磨总成空\"等均属命理断言，无验证基础**。","o":"TJ-0683 · 天纪·紫微详解·第四章卦象详解·乾为天·先后天流年（PDF 第49页）"},{"t":"二百四十四、坤卦：爻位表与两处错字","h":"\"履霜坚冰至\"与\"黄裳元吉\"","c":"风险——**\"卦象详解\"第二卦是坤为地，其六爻要旨为（照录）**：**上六——\"龙战于野，其血玄黄\"／\"阴气盛极、天地相争、必然凶险\"**；**六五——\"黄桑元吉\"／\"阴居阳位、中庸谦逊、中规中矩\"**；**六四——\"括囊（闭口）\"／\"谨言慎行、免遭祸患\"**；**六三——\"含章可贞\"／\"蕴涵美德、坚守正道、无成有终\"**；**六二——\"直方大，不习无不利\"／\"中正、辽阔，地德广大，包容万物\"**；**初六——\"履霜怪冰至\"／\"阴盛阳衰、冷气凝聚、寒冰将到\"。** **本集核对，发现两处与《易》原文不符**：**①六五\"黄桑元吉\"应为\"黄裳元吉\"**（**\"裳\"是下衣，\"黄裳\"取\"居中而谦下\"义；\"桑\"字无据**）；**②初六\"履霜怪冰至\"应为\"履霜坚冰至\"**（**\"坚冰\"取\"由霜而至坚冰、由微而至盛\"义；\"怪冰\"无据**）。** **据此判定**：**两处为转录（或排版）之误，本集以《易》原文为准——\"黄裳元吉\"\"履霜坚冰至\"**，**而讲义的下行注解（\"阴居阳位、中庸谦逊、中规中矩\"／\"阴盛阳衰、冷气凝聚、寒冰将到\"）与原文义相符，可采**。** **须说明**：**这是本集对坤卦六爻表的逐字核对**；**其可用的核极准**：**\"黄裳\"与\"履霜坚冰\"都是《易》的固定原文**（**所以这两处能被明确判为\"字错\"**）；**⚠ 而这类字错的影响是直接的**：**\"黄裳\"错成\"黄桑\"，读者就取不到\"谦下\"的义**（**\"履霜坚冰\"错成\"怪冰\"，读者就取不到\"由微至盛\"的义**）——**而这两处义，恰恰是坤卦最要紧的两处**（**\"履霜坚冰\"是《人间道》里\"济弱扶倾与姑息养奸一线之差\"的出处**）。","o":"TJ-0684 · 天纪·紫微详解·第四章卦象详解·坤为地（PDF 第50页）  ---"},{"t":"二百四十五、坤卦与乾卦的对称","h":"孤阴不生：阴为资产与\"母性的两面\"","c":"要点——**坤卦\"性格\"段与乾卦恰成一对，逐句照录**：\"**上坤下坤、坤为土、二土比和，无有阳气，'孤阴不生'，意为着无子嗣，男得此卦表示寿短。'阴为资产，资产丰足'。坤为柔、为大地，有包容性、始终如一，厚德载物，助人为乐，慈悲而严厉。阴又主保守、不善管理、喜按部就班、有始有终、终获成就。坤为母，母有护子之心，'有时不讲道理，只懂弱肉强食——只有个人强大，才能保护万物'。**\" **与乾卦对照，可得四组对称**：**①乾\"孤阳不生，不利于女性\"／坤\"孤阴不生，无子嗣，男得此卦寿短\"**（**两卦各\"不生\"，而受伤的一方正是异性的那一半**）；**②乾主\"刚健、管理才能\"／坤主\"保守、不善管理、按部就班、有始有终\"**（**一个\"开创\"，一个\"守成\"——正与乾卦\"适宜创业、守成欠佳\"互补**）；**③乾的负面是\"对家人不重情意\"／坤的负面是\"护子时不讲道理\"**（**一个\"无情\"，一个\"护短\"**）；**④乾\"得运大利财名\"／坤\"阴为资产，资产丰足\"**（**乾主名，坤主财**）。** **而\"母有护子之心，有时不讲道理，只懂弱肉强食——只有个人强大，才能保护万物\"这一句，是全书很少见的\"为护短辩护\"的写法**：**它没有把\"护短\"当缺点，而是当作\"在弱肉强食的世界里保护弱小\"的手段**（**而这恰好与《人间道》坤卦\"履霜坚冰\"处\"济弱扶倾与姑息养奸一线之差\"构成同一组张力：护，是对的；护到不讲道理，就变成了另一回事）。** **须说明**：**这是讲义对坤卦性格的论述**；**其可用的核是\"乾／坤四组对称\"这一层**（**脱开命理也成立：开创者与守成者、重名者与重财者、无情者与护短者**）；**⚠ 须标**：**\"无子嗣\"\"男得此卦寿短\"属命理断言，无验证基础**。","o":"TJ-0685 · 天纪·紫微详解·第四章卦象详解·坤为地·性格（PDF 第50页）"},{"t":"二百四十五、坤卦与乾卦的对称","h":"地脉道：\"已婚或寡居带子女\"与\"婚破后不再有二次婚姻\"","c":"方法——**坤卦\"地脉道\"给了\"成格条件\"与\"后果清单\"两段**。**条件**：\"**坤为地卦：婚后的妈妈，要和自己的丈夫住在一起为泰卦——二人同住西北卧室气运最佳。母居母位为坤为地卦：妈妈住到西南卧室坤的位置上，叫坤为地。'条件是已婚、或寡居带子女同住此局，方为成格'。**\" **后果**：\"**婚姻主破散、孤军奋战、肩负一家之重任。婚破后，有同居不再有二次婚姻；公司名称必须正妻正名，女人当家，财禄无缺、到老平安、行善于人、近于宗教、趋于孤僻、终无所助。**\" **这一段的读法有三层**：**①\"成格\"是有条件的**（**已婚或寡居带子女才成，不是随便一个母亲住西南就算**）；**②\"后果\"是一条链**（**婚姻破散 → 独自承担 → 女人当家 → 财禄无缺 → 但趋于孤僻、终无所助**）；**③而\"解法\"也在里面**：**\"要和自己的丈夫住在一起为泰卦\"**（**即：同一个母亲，若与丈夫同住西北卧室，就是\"泰卦\"而不是\"坤为地\"**——**同一个\"位\"，换一个\"同住者\"，卦就变了）。** **须说明**：**这是讲义对坤位的论述**；**其可用的核极窄**：**\"已婚／寡居带子女\"这一条\"成格条件\"是可核的规则**（**能判断\"符不符合\"**），**而\"婚姻主破散、不再有二次婚姻\"不可核**；**⚠ 须标**：**\"婚破后不再有二次婚姻\"\"趋于孤僻、终无所助\"属命理断言**，**且这类断言对处于婚姻困境中的人有实际的心理影响——不可据以决定婚姻去留**。","o":"TJ-0686 · 天纪·紫微详解·第四章卦象详解·坤为地·地脉道（PDF 第51页）"},{"t":"二百四十五、坤卦与乾卦的对称","h":"流年：\"破财因己不守\"与\"司法官处贵\"","c":"要点——**坤卦\"流年\"段有两句极见分寸**：\"**女命逢之忌口舌，诬陷他人总不成，逢马相克事不成（马有属马人或马年），'破财因己不守'。官人逢之，司法官处贵（军人、警察、法官、外交官）。**\" **\"破财因己不守\"这五个字，是这一册里少见的\"把因归到自己身上\"的写法**（**即：破财不是\"逢了什么煞\"，而是\"自己没有守住\"**）——**它与《人间道》\"蹇卦反身修德\"\"姤卦上爻此人之远离乃肇因于己之过亢非他人之罪\"\"萃卦上爻人之弃绝实出于己怎可归咎他人\"属同一路**（**而这套书里\"从自己身上找因\"的话，往往出现在最要紧的位置）。** **而\"诬陷他人总不成\"这一句，是\"卦断\"里少见的\"道德判语\"**（**即：这一卦下，诬陷不成——而它把\"不诬陷\"当作默认前提写进去了）。** **而\"司法官处贵（军人、警察、法官、外交官）\"给了\"官人逢之\"的具体行业清单**（**即：这一卦与\"执法／涉外\"类职业相合）。** **须说明**：**这是讲义对坤卦流年的论述**；**其可用的核极窄**：**\"破财因己不守\"与\"诬陷不成\"两句可脱开命理读**（**前者是\"归因于己\"，后者是\"诬告无效\"**）；**⚠ 须标**：**\"逢马相克\"\"司法官处贵\"属命理断言**，**不可据以择业或判断诉讼结果**。","o":"TJ-0687 · 天纪·紫微详解·第四章卦象详解·坤为地·流年（PDF 第51页）"},{"t":"二百四十五、坤卦与乾卦的对称","h":"文王金钱课：六个\"×\"即纯阴","c":"定义——**坤卦的\"文王金钱课\"与乾卦恰成一对**：\"**坤为地卦：××××××（饿虎得食）上中。象曰：肥羊失群入山岗，饿虎逢之把口张，适口充饥心欢喜，卦若占之大吉昌。诗曰：饿虎得食喜气欢，求名应试主高迁，出门吉利行人到，是非口舌不相干。断曰：寻人得见，走失有信，疾病渐好，凡事皆顺。**\" **而\"编码规则\"至此完全清楚**：**乾＝\"○○○○○○\"（六爻全\"○\"），坤＝\"××××××\"（六爻全\"×\"）**——**即：以\"○\"记阳爻、\"×\"记阴爻，六个符号自下而上成一卦**（**而\"课名\"（困龙得水／饿虎得食）与\"等级\"（上上／上中）是另加的标签）。** **而两卦的等级有差**：**乾\"上上\"、坤\"上中\"**（**而乾的断语是\"大吉之课，无不欢乐\"，坤的是\"寻人得见，走失有信，疾病渐好，凡事皆顺\"——一虚一实**）。** **须说明**：**这是讲义对坤卦金钱课的著录**；**其可用的核极准**：**\"○＝阳、×＝阴\"的编码是可核的**（**六个符号读出来的就是卦体**）；**⚠ 须标**：**\"饿虎得食、上中、大吉昌\"属课名与断语**，**而\"疾病渐好\"这类涉及健康的断语尤须警告：不可据以停医停药**。","o":"TJ-0688 · 天纪·紫微详解·第四章卦象详解·坤为地·文王金钱课（PDF 第51页）"},{"t":"二百四十六、第五章开篇：\"算命分两个部分\"","h":"\"指点迷津\"与\"批流年\"","c":"定义——**第五章\"紫微十二宫详解\"开篇，先给了\"算命\"的分类**：\"**算命分两个部份：1、'（指点）迷津'。2、'批流年'。这两部分都属于算命。**\" **即：算命只有两件事**——**一是\"指点迷津\"（回答\"我该怎么办\"）；二是\"批流年\"（回答\"我这一年会怎样\"）。** **而这一句在全书有\"定界\"作用**：**它说明\"命理\"在作者看来不是\"知识体系\"，而是\"两项服务\"**（**一项给方向，一项给年表**）——**而这正好解释了《天纪》全书的结构：前半（易理、人间道）偏\"指点迷津\"，后半（紫微、八字、流年）偏\"批流年\"。** **须说明**：**这是讲义对算命的分类**；**其可用的核极窄**：**这个二分法本身是可观察的**（**任何算命谈话，几乎都能归到\"该怎么办\"或\"今年怎样\"两类**）——**而它的价值恰恰在于\"划定范围\"**：**凡不能归入这两类的，就不是算命（比如\"这套算法的原理\"属知识，不属服务**）。","o":"TJ-0689 · 天纪·紫微详解·第五章紫微十二宫详解·开篇（PDF 第52页）"},{"t":"二百四十六、第五章开篇：\"算命分两个部分\"","h":"武官星四组与\"杀破贪必在三方四正\"","c":"定义——**第五章第一例（紫微在子、命宫在午，1961 年 4 月 18 日戌时生，阴女），给出了几个关键的星曜定义**。**①\"武官星\"的成员**：\"**贪狼在午为武官星，'武官星有贪狼、破军、七杀和紫微＋七杀'。**\" **②\"杀破贪\"的必然共现**：\"**七杀、破军、贪狼为'杀破贪'组合，'一定会在一起（指三方四正之内）'。**\" **③\"桃花\"须有条件**：\"**贪狼是个桃花星，'它入住水宫才是桃花'——水宫是亥子宫，亥是晚上 9–11 时，子是 11–1 时，'才显现桃花特性'。**\" **④\"火贪格\"**：\"**贪狼喜欢火星和铃星，就会形成火贪格（火贵格）。**\" **⑤\"权星\"的两种来源**：\"**官禄宫最喜欢权星入住——权的星有：四化星里面的化权星；紫微星＋七杀星同宫也为权星，官权加重。**\" **这一组定义里最要紧的是第③条**：**\"桃花\"不是\"贪狼一出现就是桃花\"，而是\"贪狼落在水宫（亥子）才显现桃花特性\"**——**即：同一颗星，位置不同，性质不同**（**这与《人间道》\"名位相等\"\"位不当\"的思路完全一致：星性不是固定的，是\"星 × 宫\"的合成）。** **须说明**：**这是讲义对紫微星曜的定义**；**其可用的核极窄**：**\"武官星四组\"\"杀破贪共现\"\"权星两种来源\"都是\"规则\"，可核其是否被遵守**（**而\"规则是否成立\"另说**）；**⚠ 须标**：**紫微斗数的星性配属属传统命理体系，缺乏可重复验证的证据基础**，**本集只记其规则，不对其预测效力作任何认可**。","o":"TJ-0690 · 天纪·紫微详解·第五章紫微十二宫详解·第一例（PDF 第52页）"},{"t":"二百四十六、第五章开篇：\"算命分两个部分\"","h":"\"武官星在巳午未则个小黑瘦\"：一条须单标的身体断言","c":"风险——**第五章第一例里有一条\"以宫位断体型\"的说法**：\"**武官星在巳午未宫——中午的宫位，'人的个子都比较小，又黑又瘦'；而亥子丑宫的，'往往高大、魁梧，女孩也像男孩一样肥厚'。**\" **这一条须单独标出，理由有三**：**①它把\"体型\"直接绑到\"星曜落宫\"上**（**而体型由遗传与营养决定，与出生时刻的星位无关**）；**②它带明确的\"评判色彩\"**（**\"又黑又瘦\"与\"女孩也像男孩一样肥厚\"都不是中性描述**）；**③它最容易被用来对号入座**（**而一旦\"对上了\"，就会强化\"命定\"的错觉**）。** **而同一例中另有一条同类说法**：\"**两星同入一宫主此命为文武双全之人。男人这种命好，女人这种命为'男命女身'，其时活的很累。**\" **这一条带有性别预设**（**\"男人这种命好，女人这种命累\"——同一个格局，按性别给出不同评价**）。** **本集处置**：**照录其\"规则\"（武官星落宫与体型的对应说法、\"男命女身\"的说法），但明确不采其评判义**——**即：不认同\"某宫位决定体型\"，不认同\"同一格局按性别分好坏\"**。** **须说明**：**这是本集对讲义身体断语的边界声明**；**其可用的核极窄**：**\"体型由遗传与营养决定\"是可核的常识**（**而\"星位决定体型\"不可核**）；**⚠ 而这类断语的实际风险是**：**当一个\"又黑又瘦\"的孩子被告知\"你的命就是这样\"，他/她可能从此接受一个本可改变的自我认知**——**这是本集必须标出的理由。","o":"TJ-0691 · 天纪·紫微详解·第五章紫微十二宫详解·第一例（PDF 第52页）  ---"},{"t":"二百四十七、十二宫的断法基础","h":"四化星\"科权禄忌最大\"与\"科\"的两义","c":"定义——**断宫之前先看什么，讲义给了一个次序**：\"**看星首先看四化星：'科、权、禄、忌，最大'。**\" **而\"科\"的用法讲得最细**：\"**科：一指科甲、考试、金榜；二指专长、才艺、专业技术——比如音乐家、画家有化科。如果化科在官禄，此人自然会去考公务员或到公家单位。此人命宫有天魁、财帛宫有天钺星又化科，那此人先天才艺一定很好。**\" **即\"科\"有两个义项**：**①科甲（考试、功名）；②专长（才艺、技术）**——**而落到不同宫，就取不同义**（**化科在官禄→取①；化科在财帛／命宫→取②）。** **而\"权\"的义与\"科\"不同**：\"**财帛宫如果是很多权星又化权，此人自然会去做生意自己当老板**\"（**\"权\"取\"掌权、作主\"**）；**\"官禄宫最喜欢权星入住，代表有权\"**（**同前章）。** **须说明**：**这是讲义对四化星的规定**；**其可用的核极窄**：**\"科\"的两义（科甲／专长）是可以分辨的语言现象**（**同一个字在两种语境里指两件事**）——**而\"哪个宫取哪个义\"，讲义给了明确判据（看所落之宫），这一点是可核的规则**；**⚠ 须标**：**四化星的效应属传统命理体系，无可重复验证的证据基础**。","o":"TJ-0692 · 天纪·紫微详解·第五章紫微十二宫详解·第一例（PDF 第53~54页）"},{"t":"二百四十七、十二宫的断法基础","h":"\"身宫\"：后天命，落在哪一宫就\"自然会去做那件事\"","c":"定义——**\"身宫\"的用法，讲义讲得极简而清晰**：\"**身宫指'后天命'。如身宫在财帛宫，此人自然会去赚钱——如果是女人，应劝其做职业妇女；身宫在迁移宫，此人自然会迁往外地；身宫在官禄宫，此人自然会做官；身宫在夫妻宫，表示后天对他的婚姻影响很大。身宫、命宫同宫又化禄，表示生下来就很富有，继承祖业。**\" **这条规则的形状很统一**：**\"身宫落在哪一宫，此人'自然会'去做那件事\"**——**落在财帛→去赚钱；落在迁移→往外走；落在官禄→去做官；落在夫妻→婚姻影响大。** **而\"如果是女人，应劝其做职业妇女\"这一句，须分两层读**：**从体系内部看，它是\"身宫在财帛、自然想赚钱\"这一规则的**应用**（**即：既然她的后天趋向是赚钱，就让她去赚钱，而不是拦着她）；**从时代语境看，它带\"男主外女主内\"的预设**。** **本集取前者、不取后者**：**这条建议的实质是\"顺着人的趋向给建议\"，而不是\"按性别分工\"**（**而它在当时语境下说出，反而是一种\"劝其自立\"的表述）。** **⚠ 须标**：**身宫落宫与\"自然会做某事\"之间没有可验证的因果关系**，**本集只记其规则形状**。","o":"TJ-0693 · 天纪·紫微详解·第五章紫微十二宫详解·第一例（PDF 第53页）"},{"t":"二百四十七、十二宫的断法基础","h":"孤星落陷为大凶，杀星逢吉星则力降","c":"定义——**这一条是紫微斗数里最硬的一条\"组合规则\"，讲义写得极清楚**：\"**如果一个宫只有一颗星落陷、又没有吉星同会时，'为大凶'。当只有一颗孤星落陷、或只有一颗杀星，那怕是一颗小小的杀星孤立于某宫，'其杀的威力都是很大的'。看一个宫，如果杀星和吉星同会，'杀星的力量会大大降低'；如果只有杀星没有吉星，'即使是一颗小小的杀星也可能会要人性命'。**\" **规则的实质是对称的两句话**：**①孤（无吉星相伴）→ 凶的力量被放大**；**②众（吉星同会）→ 凶的力量被稀释**。** **即：在这套体系里，'凶'不是\"星本身恶\"，而是\"缺少与之相制的星\"**（**所以\"一颗小小的杀星\"在孤宫里可以\"要人性命\"，在众吉宫里就\"大大降低\"）。** **而这个形状，与《天纪·人间道》里几处讲法同构**：**\"孤阳不生\"\"孤阴不生\"（乾、坤两卦）都是\"孤则凶\"**；**而\"杀破贪必在三方四正之内\"也是\"组合决定性质\"**。** **须说明**：**这是讲义对宫位吉凶的规定**；**其可用的核极窄**：**\"孤则力强、众则力弱\"是一套可核的判定规则**（**能判断\"这一宫算不算孤\"**）；**⚠ 须标**：**\"大凶\"\"要人性命\"属命理断言**，**且这类断语对听者心理冲击极大——本集记录规则，不认同其\"可断生死\"的说法**。","o":"TJ-0694 · 天纪·紫微详解·第五章紫微十二宫详解·第一例（PDF 第54~55页）"},{"t":"二百四十八、命理能做什么：两处极要紧的自述","h":"\"知道结果，以果决其行，去化解不幸\"","c":"要点——**这一章有两句话，把\"命理的功能\"讲透了，须并列记**。**第一句在\"七杀临身\"之后**：\"**七杀临身终不美，一身多败少成，很累——'但可用人间道与地脉道改正'。**\" **第二句在\"看总格\"之后**：\"**算命的功能就是：'知道结果，以果决其行，去化解不幸'。这是我们看总格的方法。**\" **两句话合起来，是一套完整的功能定义**：**①\"知道结果\"（先看清）→ ②\"以果决其行\"（拿这个\"果\"去决定\"行\"）→ ③\"去化解不幸\"（改掉它）。** **而\"但可用人间道与地脉道改正\"这一句，是全册关于\"命可不可改\"最直接的宣言**：**\"命理断出的凶，可以用'人间道'（明理、正行为）与'地脉道'（住位、名位相等）来改正\"。** **须说明**：**这是讲义对自身功能的定位**；**其可用的核**：**\"以果决其行\"这四个字，其实是一种\"预演\"**——**先知道可能的果，再决定当下的行**（**而这在决策论上是成立的：预测的价值在于改变行为**）；**⚠ 而须同时标**：**\"可以改正\"与\"命理断得准\"是两件不同的事**——**前者是一句劝善的话，后者需要证据**；**这两句合在一起容易被读成\"我算得准、你照我说的改就好\"，而实际能站住的只是前半句的\"劝\"**。","o":"TJ-0695 · 天纪·紫微详解·第五章紫微十二宫详解·第一例（PDF 第54~56页）"},{"t":"二百四十八、命理能做什么：两处极要紧的自述","h":"\"克\"的重新定义：\"感情好才克得到\"","c":"定义——**讲义对\"克\"给了三个\"反常识\"的解释，本集认为这是全书最有价值的一处辨析**。**①\"日月反背之人克父母……'所谓克是感情好才克得到：愿意心甘情愿地付出，但对方并没有好结果'。**\" **②\"旺夫命：妻子让丈夫没有后顾之忧，'旺夫不一定嫁好先生，旺夫的女人很辛苦'。**\" **③\"克夫命：'就是丈夫心甘情愿为妻子做牛做马'。**\" **三条合起来，\"克\"被重新定义了**：**不是\"一方害一方\"，而是\"一方心甘情愿地付出，而对方并没得到好结果\"**——**即：'克'的实质是\"付出而无效\"，不是\"加害\"**（**而\"感情好才克得到\"正是这个意思：没有感情，就不会有那份\"心甘情愿的付出\"，也就无所谓\"克\"）。** **而这一解，把\"克夫／克子\"从\"诅咒\"变成了\"提醒\"**：**它提醒的不是\"你会害他\"，而是\"你的付出可能不换来好结果\"**（**而\"旺夫的女人很辛苦\"这一句，更是把\"旺夫\"从\"福气\"翻成了\"代价\"）。** **须说明**：**这是讲义对\"克\"的释义**；**其可用的核是\"语义层\"**：**民间所谓\"克\"常被理解为\"相害\"，而讲义明确把它解为\"付出无果\"**——**这一层是可以站住的**（**因为\"克\"的原义里确有\"制约、胜过\"的一面，但\"付出而对方无好结果\"更接近它的实际用法**）；**⚠ 而\"日月反背\"\"旺夫\"\"克夫\"作为命理格局仍是体系内说法**，**本集取其对\"克\"字的解释，不取其对具体人命格的断言**。","o":"TJ-0696 · 天纪·紫微详解·第五章紫微十二宫详解·第一例（PDF 第54~56页）"},{"t":"二百四十八、命理能做什么：两处极要紧的自述","h":"讲义自己标出的一处\"讲法有误\"","c":"风险——**这一处极珍贵：讲义在讲\"子女宫\"时，自己标出了错误**。**原文**：\"**子女宫为空宫时，要看对面宫，对宫是太阳、天梁，是能借主星，阳梁都为男星，主生男孩。'这块讲法有误'——对宫有化忌表无子，他说酉宫文昌化忌，'这个时间文昌星是不会出现在酉宫的，只有同年（1961 年）7 月 17 丑时，文昌星才会出现在酉宫'。**\" **这一处的价值有三**：**①讲义作者主动标出\"这块讲法有误\"**（**而不是把错误留下来**）；**②他给出了出错的具体理由**——**\"文昌星在酉宫\"不是随时成立的，只有 1961 年 7 月 17 日丑时那一特定时刻才成立**（**即：星曜的位置是\"时点函数\"，不能脱离具体时间引用**）；**③这个理由是可核的**（**因为星位由时点算出，任何\"某星在某宫\"的说法都必须带上\"何时\"）。** **须说明**：**这是讲义内部的自我校对**（**本集照录其\"自标有误\"这一行为本身**）；**其可用的核极准**：**\"星位依时点而定\"是可核的规则**（**所以\"某星在某宫\"若不注明时间，就是错的说法**）；**⚠ 一并标明**：**同一段落里另有\"儿子像妻子，就要小心了……动作像大人易夭折\"一句**——**这一条属对儿童行为的负面断言，本集不采**（**理由见前章：以\"像不像大人\"断儿童夭折，无可验证基础，且对家长有实际心理伤害**）。","o":"TJ-0697 · 天纪·紫微详解·第五章紫微十二宫详解·第一例（PDF 第55页）"},{"t":"二百四十九、十二宫逐宫要义","h":"交友宫：朋友变仇人的清单","c":"要点——**交友宫（即奴仆宫）的断法，讲义给了一份\"清单\"**：\"**交友宫就是奴仆宫，天机、天马。'天马星落在朋友宫，为朋友奔波劳累'。天机星是很平和的星。如果有财星、权星落到朋友宫，那她和朋友合伙做生意很好。'如果很多空耗的星落入朋友宫（如羊、陀、火、铃、空、劫、化忌），代表她跟朋友合伙，朋友会变仇人'。**\" **这份清单是\"空耗类星曜的六个（加化忌共七项）**：**擎羊、陀罗、火星、铃星、地空、地劫、化忌**——**即：凡\"耗\"性之星聚于交友宫，合伙就会从\"合\"转\"仇\"。** **而正面的条件也对称**：**\"财星、权星人交友宫→合伙好\"**（**即：能带来资源与主导权的星，才让合作成立）。** **须说明**：**这是讲义对交友宫的论述**；**其可用的核极窄**：**\"合伙需要资源与主导权\"这一层脱开命理可读**（**即：合伙若只是一方\"为朋友奔波\"（天马），而没有实际的财与权，就难以长久**）；**⚠ 须标**：**\"羊陀火铃空劫化忌→朋友变仇人\"属命理断言**。","o":"TJ-0698 · 天纪·紫微详解·第五章紫微十二宫详解·第一例·交友宫（PDF 第55页）"},{"t":"二百四十九、十二宫逐宫要义","h":"面相十二宫定位与两条须处理的断言","c":"方法／风险——**讲义在讲\"面相\"时，给了一套\"面部位—宫位\"的对应**：\"**印堂为官禄宫，'印越大越好'。眉下方为田宅宫。天仓为迁移宫。鼻头为财帛宫。眼角为夫妻宫。地阁、下巴为仆役宫。耳发处为命门。**\" **而同一段里另有两句，本集须分别处置**。**①\"人病重时命门黑黑的，风险极高\"**——**此条加医学警告**：**面部色泽变化可能与黄疸、发绀、肾上腺功能不全（如 Addison 病的色素沉着）等真实病症相关，而\"风险极高\"的断言毫无依据**；**若有人据此放弃就医，后果是直接的**（**故本集改为：面色异常应就医查明原因，不可据\"命门色黑\"判定生死**）。**②\"人讲话命门处有突骨跳动，此为反骨，此人必反，汉奸\"**——**此条不采，理由三条**：**①\"必反、汉奸\"是对人格与忠诚的绝对断定**（**而人格不能由解剖形态判定**）；**②\"突骨跳动\"多为正常的肌腱／血管搏动**（**解剖学上并无\"反骨\"这一结构**）；**③这类断语在历史上曾用于构陷**（**以\"骨相\"定人罪，是相术最危险的一种用法**）。** **须说明**：**这是本集对面相段的分层处置**；**其可用的核**：**\"印堂—官禄、眉下—田宅、天仓—迁移、鼻头—财帛、眼角—夫妻、地阁—仆役\"是一套固定的对应**（**可核其是否被一致使用**），**而附着其上的吉凶断言不可核**；**⚠ 一并标明**：**\"印越大越好\"属相术判断，本集只记录，不采其决定义**。","o":"TJ-0699 · 天纪·紫微详解·第五章紫微十二宫详解·第一例·面相（PDF 第55页）"},{"t":"二百四十九、十二宫逐宫要义","h":"\"百岁流年图\"：面相部位配年龄的歌诀","c":"要点——**第五章附有一长篇\"百岁流年图\"歌诀，把\"面部部位\"与\"年龄\"逐岁对应，本集择要照录**：\"**欲识流年运气行，男左女右各分明；天轮一二初行运，三四周流至天城；天廓垂珠五六七，八九天轮之上停；人轮十岁及十一，'轮飞廓反必相刑'；十二十三并十四，地轮朝口寿康宁；十五火星居正额，十六天中骨格成；十七十八日月角，运逢十九应天庭；辅角二十二十一，二十二岁至司空；二十三四边城地，二十五岁逢中正；二十六上至丘陵，二十七年看冢墓；二十八遇印堂平，二九三十山林部；三十一岁凌云程，三十二遇紫气生；三十三行繁霞上，三十四有彩霞明；三十五上太阳位，三十六上会太阴；中阳正位三十七，中阴三十八主亨；少阳当年三十九，少阴四十看须真；山根路远四十一，四十二造精舍宫；四十三岁登光殿，四十有四年上增；寿上又逢四十五，四十六七两颧宫；准头喜居四十八，四十九入兰台中；廷尉相逢正五十，人中五十一人惊；五十二三居仙库，五十有四食仓盈；五五得请禄仓米……**\" **这段歌诀的实质，是一张\"年龄→面部部位\"的映射表**（**从 1 岁的\"天轮\"一路推到 50 岁后的\"廷尉、人中、仙库、食仓、禄仓\"等**）——**而\"男左女右各分明\"是它的起算规则**（**男性从左侧起、女性从右侧起**）。** **须说明**：**这是讲义所附\"百岁流年图\"的歌诀**；**其可用的核极窄**：**这套\"部位—年龄\"对应是一份固定的口诀**（**可核其内部一致性**），**而\"某岁看某部位即可断吉凶\"不可核**；**⚠ 须标**：**\"轮飞廓反必相刑\"一句**（**\"轮\"\"廓\"指耳轮耳廓，以耳形定\"相刑\"，无可验证基础**）——**本集因它是歌诀的原文而照录，但不认同其决定义**。","o":"TJ-0700 · 天纪·紫微详解·第五章紫微十二宫详解·百岁流年图（PDF 第56~57页）  ---"},{"t":"二百五十、十干四化表与\"以果决其行\"","h":"十天干四化表全文","c":"数据——**讲义在讲第一例流年时，附了一张完整的\"十天干四化表\"，本集照录并还原其读法**（**原表为十二字歌诀，四字一组，依次为禄、权、科、忌**）：**甲——廉破武阳**（**廉贞禄、破军权、武曲科、太阳忌**）；**乙——机梁紫阴**（**天机禄、天梁权、紫微科、太阴忌**）；**丙——同机昌廉**（**天同禄、天机权、文昌科、廉贞忌**）；**丁——阴同机巨**（**太阴禄、天同权、天机科、巨门忌**）；**戊——贪阴右机**（**贪狼禄、太阴权、右弼科、天机忌**）；**己——武贪梁曲**（**武曲禄、贪狼权、天梁科、文曲忌**）；**庚——阳武阴同**（**太阳禄、武曲权、太阴科、天同忌**）；**辛——巨阳曲昌**（**巨门禄、太阳权、文曲科、文昌忌**）；**壬——梁紫左武**（**天梁禄、紫微权、左辅科、武曲忌**）；**癸——破巨阴贪**（**破军禄、巨门权、太阴科、贪狼忌**）。** **读法须先明**：**口诀按\"禄→权→科→忌\"四字顺序排列**（**如\"甲廉破武阳\"读作\"廉贞化禄、破军化权、武曲化科、太阳化忌\"**）——**而糊里糊涂按\"禄权科忌\"看不出来时，最容易错的是\"哪个字对应哪个化\"**。** **此表在全书的位置极关键**：**前章\"看流年大限\"时，\"甲年太阳化忌\"这一判断就是靠它得出的**（**而编者据它纠正了一处\"十年化忌\"的误判**，详见下条）。** **须说明**：**这是讲义所附十干四化表**；**其可用的核极准**：**\"某干某星化某\"是一份固定对照表**（**可逐项核对**）——**而这张表本身，是紫微斗数里\"最像表\"的一块：它不含判断，只有对应**；**⚠ 须标**：**\"化禄／化权／化科／化忌\"的效应属传统命理体系**，**本集照录其\"表\"，不对其\"效\"作任何认可**。","o":"TJ-0701 · 天纪·紫微详解·第五章紫微十二宫详解·第一例·流年大限（PDF 第59页）"},{"t":"二百五十、十干四化表与\"以果决其行\"","h":"\"算命是以果决其行\"——第三次自述","c":"要点——**\"以果决其行\"这一句，在第五章里第二次出现，且这次是段首**：\"**算命是以果决其行。如果此女的面相：'女人面大，声沙，骨粗为孤独一身'——'那 100% 会发生'。相书：眼角纹一条向下走表示夫妻不好，在上有十字纹表示夫妻十年不好，很多鱼尾纹表示有桃花。'鱼尾纹有二、三条最好，三条最多，表夫妻和睦'。**\" **先记其\"方法论\"**：**\"算命是以果决其行\"——即：算命的用途是\"由果去定行\"，不是\"知道就好\"**（**这与前章\"知道结果，以果决其行，去化解不幸\"完全一致，是同一主张的第三次表述**）。** **再记其\"须标的两处\"**：**①\"女人面大，声沙，骨粗为孤独一身——那 100% 会发生\"**：**\"100% 会发生\"是全册最绝对的断言之一**（**而\"面大、声沙、骨粗\"这三项体征与\"孤独\"之间，没有任何可验证的因果**）；**②\"鱼尾纹有二、三条最好，三条最多，表夫妻和睦\"**：**这一条与前一条（\"很多鱼尾纹表示有桃花\"）自相矛盾**（**\"多条\"既表示桃花，又\"三条最多表和睦\"——而\"多\"与\"三条\"的界在哪，没有给**）。** **须说明**：**这是讲义对面相与\"以果决其行\"的论述**；**其可用的核**：**\"以果决其行\"这一层是\"用预测改变行为\"的思路**（**可站住**），**而\"面大声沙骨粗→孤独\"与\"鱼尾纹→夫妻好或桃花\"两组都不可核**；**⚠ 须标**：**\"100% 会发生\"这类绝对化表述，在实际使用中会给人\"命定\"的心理暗示**——**而过早认定\"我必然孤独\"，本身就会改变一个人的行为**（**这是\"自我实现预言\"，不是命理应验**）。","o":"TJ-0702 · 天纪·紫微详解·第五章紫微十二宫详解·第一例·面相（PDF 第60页）"},{"t":"二百五十一、编者的两次更正","h":"\"这一块倪师讲错了\"","c":"风险——**这一处是文献学上的硬证据：编者在讲第一例的流年大限时，直接写了\"这一块倪师讲错了\"**。**原文**：\"**再看流年大限（田宅宫）34–43，'这一块倪师讲错了'——他错将文昌放到酉宫，文昌在酉宫关系十年大运都在化忌，'正确的只有流年 1994 年甲戌有问题'：这个大限甲年太阳化忌（甲年、廉禄、破权、武科、阳忌），'不是十年化忌，而是一年化忌'。**\" **这一处的价值有四**：**①它明确证实了本书是\"编者整理本\"，而编者会直接指出原讲者的错误**（**\"倪师讲错了\"五个字，是编辑判断的明证**）；**②错误的内容是可指认的**——**把\"文昌在酉宫\"当成\"十年大运都在化忌\"，而按十干四化表，甲年是\"太阳化忌\"，与文昌无关**；**③更正后的结论是可验算的**——**\"只有 1994 年（甲戌）一年有问题\"**（**因为甲年太阳化忌，一年一换**）；**④它把\"十年凶\"缩成了\"一年凶\"，量级差十倍。** **须说明**：**这是本书编者（署名\"紫易奇缘\"）对原讲的更正**；**其可用的核极准**：**\"甲年太阳化忌\"可由上条四化表直接查出**（**而\"文昌化忌\"属\"辛年\"，不属甲年**）——**所以这一处\"讲错了\"是可核的，不是口味之争**；**⚠ 一并标明**：**这一处与前章\"这块讲法有误\"合起来，说明本册至少有两次\"编者自标错误\"**——**而这恰好是它比\"纯转录本\"更可信的地方**（**它留下了校正的痕迹**）。","o":"TJ-0703 · 天纪·紫微详解·第五章紫微十二宫详解·第一例·流年大限（PDF 第59页）"},{"t":"二百五十一、编者的两次更正","h":"\"紫易奇缘认为有点言过了\"：一次用基础率作的反驳","c":"风险——**这一处是全册最漂亮的一次自我反驳，须完整记**。**先记被反驳的原文**：\"**阳宅解大限方法：死丈夫有两种——①'厕所在房子中间，主凶'，如中风死、心脏病死、气喘痰哽到死；②'厨房在西北角，乾为天、为丈夫，厨房为刀象，主夫妻死'。'命有灾加上运上也有灾就会发生'。**\" **再记编者的反驳**：\"**以上两条，'紫易奇缘认为有点言过了'——'大陆北方住宅 40% 是这种格局'，由于屋相大多偏向西南，'所以很多事情不会发生'。**\" **这次反驳的方法极值得记，它用的不是\"另有解释\"，而是\"基础率\"**：**若\"厨在西北\"真的\"主夫妻死\"，而北方住宅有 40% 是这个格局，那么北方应有近四成的家庭出现\"夫妻死\"——**这与实际不符**（**所以这个断言不成立）。** **即：它破的是\"以个案验证普遍断言\"的谬误**——**一个断言越普遍（越容易满足条件），就越容易被\"某个符合条件的人出了事\"所'证实'**（**而正确的检验是反过来问：'符合条件的绝大多数人，是不是都出了事？'**）。** **须说明**：**这是本书编者的实质性反驳**（**而非\"照录\"**）；**其可用的核极强**：**\"40% 的住宅是这个格局\"与\"并非 40% 的家庭都死了丈夫\"两个事实并置，就足以否证\"厨在西北主夫妻死\"**——**而这一步推理，脱开命理、脱开风水，在任何领域都成立**；**⚠ 一并标明**：**本集采编者的这一反驳，而把\"厕所在中间\"\"厨房在西北\"两条保留为\"风水说法\"记录**——**因为它们作为\"居住格局的描述\"仍是可观察的**（**只是\"主凶\"的因果不成立**）。","o":"TJ-0704 · 天纪·紫微详解·第五章紫微十二宫详解·第一例·阳宅解大限（PDF 第60页）"},{"t":"二百五十二、看配偶与看时辰","h":"看配偶：看\"他\"的三方四正","c":"方法——**第一例里有一段\"怎么看配偶\"的示范，方法很明确**：\"**下面看第一例的福德宫：福德宫是武曲、天相、陀罗陷地、右弼、铃星等；夫妻宫是天府、廉贞；迁移宫上紫微独坐、文昌化忌。'这三个宫位是她丈夫的三方四正'——没有科权禄，'就叫正财、正官'，意思是一生是打工的命，一辈子帮人打工领取固定薪水。从这来看她丈夫才能方面不好；她有化科还能靠一技之长，出外漂泊。**\" **方法有三步**：**①取\"这个人\"对应的三个宫**（**此例：福德宫、夫妻宫、迁移宫**）；**②看这三宫的三方四正里有没有\"科权禄\"**；**③没有，则判为\"正财、正官\"**（**即：一生打工、领固定薪水**）。** **而\"正财/正官\"在这里的定义须记清**：**不是\"正当的财/官\"，而是\"普通、无特殊才能与权位\"**（**与\"有科权禄\"相对**）。** **须说明**：**这是讲义\"看配偶\"的示范**；**其可用的核极窄**：**\"通过三宫三方四正是否见科权禄来判断\"是一套可核的操作**（**而它判出的\"打工命\"不可核**）；**⚠ 须标**：**\"她丈夫才能方面不好\"这类对第三人的才能评判**，**是\"当面断人配偶\"的典型用法，本集在记录其\"方法\"的同时，不认同其\"断语\"**。","o":"TJ-0705 · 天纪·紫微详解·第五章紫微十二宫详解·第一例·福德宫（PDF 第59页）"},{"t":"二百五十二、看配偶与看时辰","h":"发旋定生时与罗盘\"二十四分金只用十二\"","c":"方法——**讲义给了一套\"补时辰\"的办法，用的是发旋**：\"**当求测人不知道生的时辰时，可用发旋来判断：'子午卯酉偏左居中，寅申巳亥偏右，辰戌丑未双旋以上，从后面看'。四正向：子为正北，卯为正东，午为正南，酉为正西。'罗盘有二十四个分金煞，阳宅方位只用十二个'，其它十二个用在风水上——看山川河流、阴宅位置、和房子在大自然的布局用。'室内为阳宅地理'。**\" **这套办法的构造**：**把十二地支分成三组**（**子午卯酉／寅申巳亥／辰戌丑未**），**每组对应一种发旋形态**（**偏左居中／偏右／双旋以上**）——**而\"从后面看\"是观察位置的规定**。** **而\"二十四分金只用十二\"这一条，是全书对\"罗盘\"最清楚的一次分工说明**：**二十四山分两套用途**——**阳宅（室内）只用十二个；另十二个用于\"山川河流、阴宅、房子的大自然布局\"**（**即：一套管\"屋里\"，一套管\"屋外\"）。** **须说明**：**这是讲义\"补时辰\"与\"罗盘分工\"的说法**；**其可用的核极窄**：**\"发旋有三型、可与地支三组对应\"是一个可观察的说法**（**而\"发旋形态决定出生时辰\"没有生理学依据**——**发旋由胎儿期头发生长方向决定，与出生时刻无关**）；**⚠ 而\"二十四分金只用十二\"这一条，是\"工具使用范围\"的规定**（**可核其是否被一致遵守**），**本集照录，不认同其\"分金决定吉凶\"的预设**。","o":"TJ-0706 · 天纪·紫微详解·第五章紫微十二宫详解·第一例·发旋（PDF 第60~61页）"},{"t":"二百五十三、两处必须剔除的断言","h":"\"以鼻形断处女\"与\"看眉毛断出轨\"","c":"风险——**第一例中夹着两条断言，本集明确剔除，理由逐条写清**。**第一条**：\"**女人鼻子头如果成两片骨，表示不是处女（用手轻按鼻尖）。**\" **剔除理由四条**：**①生理学上无据**——**鼻尖由软骨与脂肪构成，与处女膜毫无关系，\"两片骨\"不指示任何性经历**；**②它要求\"用手轻按鼻尖\"来\"检验\"**——**这是一种对身体的擅自接触，在今日任何场合都属不当**；**③它把\"是否处女\"当作可以\"验看\"的属性**——**这本身就是对人的尊严的否定**；**④它的后果是具体的**：**被这样\"验看\"的女性，会承受无法自证的污名**。**第二条**：\"**女人晚上看先生回来，他眉毛如果是立着冲着你的，表示刚刚干了坏事，是对不起你的风流事。**\" **剔除理由三条**：**①\"眉毛立着\"与\"出轨\"之间无任何可验证的关联**（**眉形属解剖特征，情绪引起的眉部动作也只在当下数秒**）；**②它把\"丈夫晚归时的表情\"读成\"罪证\"**——**而这恰好是猜疑最容易生根的地方**；**③其后果是关系层面的**：**以这种\"读法\"审视伴侣，只会把正常情绪读成背叛**。** **须说明**：**这两条属本集主动剔除的内容**（**而非\"照录后加警告\"**）；**其理由的核是\"生理无据＋侵犯尊严＋后果可达\"**；**⚠ 一并标明**：**本集保留\"讲义里有这类说法\"这一事实的记录**（**因为读者若在原书里遇到，需要知道它被判定为不可采**），**但不转录其内容细节与操作方式**。","o":"TJ-0707 · 天纪·紫微详解·第五章紫微十二宫详解·第一例·面相（PDF 第60页）  ---"},{"t":"二百五十四、屯卦：卦象详解本的写法","h":"\"屯为存储\"：一个字的训释带出的性格","c":"要点——**屯卦\"性格\"段有一个训释，非常值得记**：\"**上坎下震、上水下木，属于水生，上险下震，属于难卦，主'旺财不旺丁'；'屯主理想高，判断力差'；善于人际结交，'喜欢拉帮结派'，'个性极端，意志薄弱，组织能力差'，遇到麻烦事往往'情绪化、极端化，处理起来不留余地'；'屯为存储'——喜欢收藏、有积蓄、'有私房钱'，有资源、积累囤储、留在将来用，属于'大器晚成'之人。**\" **这一段最要紧的是\"屯为存储\"四个字**：**它把卦名\"屯\"直接训为\"囤积、储存\"**——**而由这个字义，推出了整串性格**（**喜欢收藏、有积蓄、有私房钱、积累囤储、留将来用**）。** **即：这一段的逻辑是\"字义→性格\"**（**而\"屯\"在《易》里确有\"屯聚\"义，与本卦\"初生艰难\"义并存——**讲义取的是\"聚\"这一路）。** **而负面那一组（理想高、判断力差、爱拉帮结派、个性极端、意志薄弱、组织能力差、遇事情绪化不留余地）**，**与正面那一组（善结交、有资源、能积累、大器晚成）是同一副性格的两面**（**\"能聚人\"与\"拉帮结派\"、\"有资源\"与\"私房钱\"、\"大器晚成\"与\"组织能力差\"**）。** **须说明**：**这是讲义对屯卦性格的论述**；**其可用的核是\"字义训释\"这一层**（**\"屯\"有\"聚\"义，可核**）——**而\"由字义推性格\"这一步是跳跃的**（**一个字有某义，不等于\"得此卦者\"就有某性格**）；**⚠ 须标**：**\"主旺财不旺丁\"\"个性极端\"\"意志薄弱\"等属命理断言**。","o":"TJ-0708 · 天纪·紫微详解·第四章卦象详解·水雷屯·性格（PDF 第62页）"},{"t":"二百五十四、屯卦：卦象详解本的写法","h":"一个可核的发现：金钱课符号的读向","c":"数据——**屯卦的\"文王金钱课\"给了六个符号，本集据此判定了一个此前无法判定的问题**。**原文**：\"**水雷屯卦：'×○×××○'（乱丝无头）下下。**\" **问题的由来**：**前章乾卦\"○○○○○○\"、坤卦\"××××××\"——六个符号全同，无法判断\"从哪一端开始读\"**；**而屯卦的符号是混排，可以判**。** **本集核对屯卦卦体**：**水雷屯＝坎上震下；下卦震（初九阳、六二阴、六三阴）、上卦坎（六四阴、九五阳、上六阴）**（**即自下而上：阳、阴、阴、阴、阳、阴**）。** **再比对符号\"×○×××○\"**：**若自左向右（初→上）读，得\"阴、阳、阴、阴、阴、阳\"——与屯卦不符**（**初爻应是阳，此处却是阴**）；**若自右向左读，得\"阳、阴、阴、阴、阳、阴\"——与屯卦完全吻合** ✓。** **据此判定**：**这套符号是\"自右向左\"书写的（或转写时顺序颠倒）**，**即：最右一个符号是初爻，最左一个是上爻**——**而乾、坤两卦因六爻全同，掩盖了这个问题**。** **须说明**：**这是本集通过一个\"混排卦\"反推出的编码方向**；**其可用的核极准**：**屯卦卦体是固定的，六个爻性是\"阳阴阴阴阳阴\"**（**所以\"×○×××○\"只有一种读法与它吻合**）；**⚠ 一并标明**：**这不影响乾、坤两卦（全同之卦怎么读都对）**，**但会影响一切\"混排之卦\"的读取——若按错方向读，整个卦体就反了**。","o":"TJ-0709 · 天纪·紫微详解·第四章卦象详解·水雷屯·文王金钱课（PDF 第63页）"},{"t":"二百五十四、屯卦：卦象详解本的写法","h":"\"名位不等\"的动态调整：长子结婚要搬离震位","c":"方法——**屯卦\"名位不等\"段，是全书对\"名位\"讲得最动态的一处**：\"**像妈妈肚子里的胎儿。'长子结婚后叫丈夫，结婚要搬离震位，留给二儿子住'。长子不搬家，可以住乾位，父母住艮位为遁卦。'此时二子在住震位，就不是屯卦了，二子变长子了'。**\" **这一段的价值在于它承认\"名位是会变的\"**：**①\"长子结婚后叫丈夫\"**（**即：同一个人，结婚前后\"名\"不同**）；**②\"结婚要搬离震位，留给二儿子住\"**（**即：长子一结婚，他占的\"震位\"（长男位）就该让出来**）；**③\"长子不搬家，可以住乾位，父母住艮位为遁卦\"**（**即：长子若不搬，全家要重新排位——长子住乾、父母住艮，成\"遁卦\"**）；**④\"此时二子在住震位，就不是屯卦了，二子变长子了\"**（**即：二子占了长子的位，他的\"名\"就变成了\"长子\"，原来的\"水雷屯\"也就不成立**）。** **即：在这套体系里，\"一个人是什么\"由\"他住哪个位\"决定，而不是由\"他排行第几\"决定**（**而\"位\"会随婚姻、搬迁而变，所以\"命\"也会变**）。** **须说明**：**这是讲义对\"名位\"动态性的说明**；**其可用的核极窄**：**\"位变则名变\"是一条自洽的规则**（**可核其是否被一致应用**）；**⚠ 须标**：**\"住某位就成某卦、就有某命\"的因果缺乏验证**；**⚠ 另须标**：**同段\"属肖狗或姓狄姓之人主夭折大凶\"\"属肖牛之人任妻子摆布、背离家庭\"两句**——**前者是\"断人夭折\"，后者是\"以生肖断品格\"，本集均不采（理由见后章）。**","o":"TJ-0710 · 天纪·紫微详解·第四章卦象详解·水雷屯·名位不等（PDF 第63页）"},{"t":"二百五十五、第二例：半空折翅与\"预警\"","h":"\"半空折翅\"的得名与廉贞三组合","c":"定义——**第二例（紫微在丑、命在未，1965 年 11 月 20 日辰时，阴男）里，给了\"半空折翅\"格的完整定义**。**先记得名的由来**：\"**大限 23–32，命在巳为夫妻宫，这十天重点是婚姻方面的事，有'半空折翅'格——中年限、30 岁左右，'古人的岁数也就六十岁左右，三十岁为半'，所以叫'半空折翅格'。此时有夭折之象，这个格碰到非常不好。**\" **而\"半空折翅\"的构成条件，也给了**：\"**如果命宫在亥宫时为空宫、对宫为廉贞星、贪狼星二星落陷，或此二星在命宫，'这叫半空折翅'。**\" **而与之配套的，是一组\"廉贞组合\"的凶象（照录）**：**廉贞＋七杀——\"半路死亡\"，或叫\"半路埋尸\"，在路上出现意外**；**廉贞＋破军——\"水中作塚\"，在里面做坟墓，在河里或海里遇难**；**廉贞＋贪狼——\"横夭\"，主先天疾病、自杀，多数有遗传疾病、先天疾病或忧郁症**。** **须说明**：**这是讲义对半空折翅与廉贞组合的规定**；**其可用的核极窄**：**\"三十岁为半（古人寿约六十）\"这个得名逻辑是可核的**（**可核其是否自洽**），**而\"某组合必出某类意外\"不可核**；**⚠ 须重点标出**：**\"廉贞＋贪狼……主先天疾病、自杀……或忧郁症\"这一条**——**抑郁症是真实的精神疾病，需要专业诊断与治疗，不能被\"命理格局\"替代**；**这条断言的实际风险是**：**有人可能因此不去就医，或把\"情绪低落\"当作\"命格使然\"**。","o":"TJ-0711 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·夫妻宫（PDF 第64~65页）"},{"t":"二百五十五、第二例：半空折翅与\"预警\"","h":"\"入庙则有预警\"：一个极精的机制描述","c":"要点——**这一处是全书对\"庙旺落陷\"讲得最清楚的一段，值得单独记**：\"**如果这些星为'入庙'，则自己能提前预警：'如邻居家着火了，他看见了火；他可以不去，就没有危险和伤亡；如果去救，很可能回不来'。如果星为'平、闲、陷'，则人没有预警：'如商场着火了，人就在里面，无法脱险；或者看见小偷作案，他大喊一声，结果被小偷杀了'。**\" **这段话的实质，是把\"庙旺／落陷\"翻译成一个可理解的机制**：**\"入庙\"＝有预警（**能看见危险，且能选择不去**）；\"落陷\"＝无预警（**危险到了眼前才知道，而且一反应就招祸**）。** **而\"邻居家着火\"这个比喻极精**：**火是别人的，但他看见了；\"他可以不去\"——**即：**预警的价值不在于\"知道\"，而在于\"知道之后能不动\"**。** **而\"看见小偷作案，他大喊一声，结果被小偷杀了\"这一句，更是把\"无预警\"的实质说透了**：**不是\"不知道有危险\"，而是\"知道有危险，但第一反应就把自己送进去\"**（**即：缺的不是信息，是\"反应方式\"**）。** **须说明**：**这是讲义对庙旺落陷的比喻式说明**；**其可用的核是\"这一层翻译\"**——**\"有预警＝能看见＋能不动；无预警＝看见了也只会本能反应\"**，**这一层脱开命理，是一句很硬的话**（**风险管理的核心，正是\"看见之后不动\"**）；**⚠ 须标**：**\"某星入庙／落陷决定有无预警\"仍属命理配属，无验证基础**。","o":"TJ-0712 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·夫妻宫（PDF 第65页）"},{"t":"二百五十六、两处对\"算命\"本身的批评","h":"\"只是算命，就失去了算命的意义\"","c":"要点——**第二例里有一段自我批评，极重要，须完整记**：\"**不是生离就是死别。如果只有生离、死别两种选择的话，'生离比死别好'。'如果没有人间道和阳宅介入，只是算命，只能叫此男 43 岁后才结婚——但这样当事人很难做到，就失去了算命的意义。这就是过去算命的缺失在这里'。**\" **这段话的分量在于，它承认了\"纯算命\"的失败**：**①若只断\"43 岁后才能结婚\"，当事人做不到**（**因为\"等到 43 岁\"这件事，对一个二十几岁的人是不可能的**）；**②做不到，则\"算命\"就成了空话**（**\"就失去了算命的意义\"**）；**③所以\"过去的算命\"在这里是\"缺失\"的**（**即：只给结论、不给办法，是缺陷**）。** **而它给出的\"办法\"是什么**：**\"人间道\"与\"阳宅\"**（**前者明理、正行为；后者调位、改名位**）——**即：算命必须配上\"能做的事\"，才算完整**。** **须说明**：**这是讲义对自身局限的承认**；**其可用的核**：**\"只给结论不给办法的建议是无效的\"这一层，在任何领域都成立**（**医学上叫\"不可执行的医嘱\"，管理学上叫\"没有 action item 的诊断\"**）；**⚠ 而须同时标**：**讲义给出的\"办法\"（人间道、阳宅）本身也不可核**——**所以这段话的价值在\"它承认了缺口\"，而不在\"它补上了缺口\"**。","o":"TJ-0713 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·夫妻宫（PDF 第66页）"},{"t":"二百五十六、两处对\"算命\"本身的批评","h":"\"婚凶\"的两种解法：\"娶二婚\"与\"大七岁\"","c":"方法——**紧接上条，讲义给了\"命里婚凶\"的两条\"解法\"**：\"**这是可以化解的。'六数为阴数之极，九为阳数之极'。如果此男命中婚凶，命的解法有两种：**1、'娶二婚妻子（离过婚的）'；2、'娶大七岁以上妻子（或比自己小七岁的妻子）'。**所以有的夫妻是'父女合'、有的是'母子合'、有的是'兄弟合'、有的是'朋友合'。**\" **而\"解法的逻辑\"须记清**：**它靠的是\"错位\"**（**不去改\"婚凶\"这件事，而是改\"对象\"**——**换一个\"已经经历过婚姻\"或\"年龄差很大\"的人，让原本的\"凶\"落不到实处**）。** **而\"父女合／母子合／兄弟合／朋友合\"这四种，是对\"年龄差组合\"的分类**：**男大女小很多→父女合；女大男小很多→母子合；年龄相近→兄弟合；同龄同志→朋友合**（**即：它把\"年龄差\"当成一种可调的参数**）。** **须说明**：**这是讲义对\"婚凶化解\"的规定**；**其可用的核极窄**：**\"解法是换对象\"这一层是可观察的**（**它至少给出了\"可做的事\"，而不是只给结论**）；**⚠ 须标**：**\"娶二婚／大七岁就能化解婚凶\"无可验证基础**，**且\"以对方的人生经历作为化解自己命格的手段\"这一思路，须谨慎看待**（**因为它把\"那个人\"变成了\"一个参数\"**）——**这也是本集在此处必须标出的理由**。","o":"TJ-0714 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·夫妻宫（PDF 第66页）"},{"t":"二百五十六、两处对\"算命\"本身的批评","h":"一条必须加最高级警告的断言","c":"风险——**第二例的夫妻宫段里，有一句本集须以最高等级标出的断言**：\"**大限 23–32，夫妻为半空折翅，十年为煞，没有好的大运，也叫无大运，婚姻不好，无子女，双方战斗不止……'流年 32 岁，妻子感觉活着没有意义，人生乏味，就会选择自杀'。**\" **这条断言的危险在于三点**：**①它具体到了\"某岁\"**（**32 岁**）——**而\"某岁会发生某事\"是最容易被记住、也最容易被自我实现的**；**②它指向\"自杀\"**（**而自杀是后果最不可逆的行为**）；**③它以\"命格如此\"给出解释**（**而一个正在痛苦中的人，若被告知\"这是你的命，32 岁会走到那一步\"，这句话本身可能就是风险因素）。** **本集处置：整段照录为\"讲义原文的说法\"，但在此处加最高级警告，并给出可执行的替代**：**①任何人在任何年龄出现\"活着没有意义\"\"人生乏味\"的持续感受，应视为需要专业帮助的信号**（**这不是\"命格\"，是可能可治的状态**）；**②中国大陆心理援助热线：12356（24 小时）；北京心理危机研究与干预中心热线：010-82951332；③若身边人已表达自杀意念，应直接询问、陪伴、协助其联系专业机构，不要独自处理，也不要用\"命\"来解释。** **须说明**：**这是本集对\"断人自杀\"这类断言的标准处置**；**其理由的核是\"后果不可逆\"**（**一切可逆的错误都可以事后修正，而\"因信命而放弃求助\"不可逆**）。","o":"TJ-0715 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·夫妻宫（PDF 第65页）  ---"},{"t":"二百五十七、看命的顺序与\"二库\"","h":"一看星君、二看日月、三看财","c":"方法——**编者（署名\"紫易奇缘\"）在这一段插了一段\"看命顺序\"，是全书最像\"操作流程\"的一段**：\"**看命顺序：一看星君（紫微、天府），总的格局大小；二看日月，父母和自己的……；三看财——'人有二库（田宅、天府），库中要见禄'**（**禄存、化禄。'禄存是固定钱，是薪水；化禄是薪水以外获得的钱财'**）。**此人二库见一禄，财帛宫天府见禄存，身宫在财帛宫，为后天工资收入，人非常节俭、比较吝啬。命宫、父母宫、田宅不见禄，先天无财，出生在贫困之家，虽然父亲有权禄，也被母亲得瑟光了。**\" **这一段有两个极实用的区分**：**①\"禄存\"与\"化禄\"不是一回事**——**\"禄存是固定钱（薪水）；化禄是薪水以外获得的钱财\"**（**即：一个是\"稳定收入\"，一个是\"额外收入\"**）；**②\"人有二库：田宅、天府\"**——**即：看财不只看财帛宫，还要看\"田宅\"与\"天府\"两个\"库\"**（**而\"库中要见禄\"，才算\"有存\"）。** **须说明**：**这是编者对\"看命顺序\"的整理**（**不是原讲，属编辑加工**）；**其可用的核极窄**：**\"禄存＝固定、化禄＝额外\"这组区分是可核的定义**（**可核其是否被一致使用**），**而\"不见禄则先天无财\"\"被母亲得瑟光了\"属命理断言与口语评点**；**⚠ 须标**：**\"命宫、父母、田宅不见禄→出生贫困\"不可核**（**家庭经济状况由实际条件决定，与星位无关**）。","o":"TJ-0716 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·财帛宫（PDF 第67页）"},{"t":"二百五十八、\"合八字\"的正确理解","h":"不是\"合才能结婚\"，而是\"不合的才该结\"","c":"方法——**这一条是全册最反常识、也最值得记的一处。原文**：\"**'合八字与八字合是两回事'。如果说两人合八字才能结婚，'这是对合八字的错误理解'——'错一步，十年乃字'。合八字的解释：一合八字；二不合八字。'有的合才能结婚，有的不合才可以结婚'。我们看八字，一定要看先天的立命：如果一个人先天命就是一世夫妻，那找个八字与他合的就可以结婚了；'如果一个人他的先天命为二婚命，那找一个合他八字的妻子不很惨吗'？比如此男如果找一个先天命为廉贞贪狼的妻子，妻子不是很惨吗？'所以先天命为二婚的人，我们要找一个八字与他不合的人结婚才对'。**\" **这一段的逻辑须拆开看**：**①前提**——**先看\"先天命\"是\"一世夫妻\"还是\"二婚命\"**；**②若\"一世夫妻\"→ 找\"合八字\"的**（**因为合，才能走到头**）；**③若\"二婚命\"→ 找\"不合八字\"的**（**因为\"合\"意味着\"两人会粘住\"，而\"粘住\"在二婚命里就意味着\"离不掉、更痛苦\"**）。** **即：\"合\"不是祝福，而是一个\"耦合强度\"的调节**（**婚姻该长则调高耦合，该短则调低耦合**）。** **须说明**：**这是讲义对\"合八字\"的重新解释**；**其可用的核是\"语义层\"**：**民间\"合八字\"通常被理解为\"合则吉、不合则凶\"，而讲义明确反对这个理解**（**它把\"合\"变成了\"依命而定的参数\"**）——**而这一层\"反常识\"是有价值的：它至少指出\"合\"不是一个固定方向的好事**；**⚠ 须标**：**\"一世夫妻\"\"二婚命\"\"找不合的才结\"仍是命理框架内的判断，无可验证基础**——**而\"刻意找八字不合的人结婚\"这个建议，在实际生活里可能带来真实的后果**，**这是本集必须标出的**。","o":"TJ-0717 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·夫妻宫（PDF 第68页）"},{"t":"二百五十八、\"合八字\"的正确理解","h":"四种\"合\"：父母合、兄弟合、朋友合与\"夫妻相\"","c":"要点——**紧接上条，讲义给了\"合\"的几种形态，每一类都配了一个可观察的现象**。**①\"父母合\"**：\"**譬如此男我们给他找个先天命宫入天同、天梁星的妻子，而此男的父母宫入天同、天梁星，就表示我们给此男找的妻子'会像父母对儿子一样的对待这位先生'。**\"（**而\"世上妈妈很怪：自己先生犯桃花要严管，自己儿子犯桃花笑笑了事\"——这句插话极生动**）。**②\"兄弟合\"**：\"**如果此男的妻子是命为巨门、文昌星的，就是兄弟合。**\" **③\"朋友合\"**：\"**如果找个先天命为天机、天魁星的妻子，就为朋友合。'如果朋友合阳宅不介入，他们老是像朋友一样相处，不结婚也不好'。**\" **④\"夫妻相\"**：\"**从临床经验来看，八字合的夫妻，一般一看去都很顺眼，'婚前谈恋爱时很曲折惨烈、要死要活都要结婚'。有个很好玩的现象：过去夫妻不见面、媒妁之言，只要合八字就结婚，跟今天的自由恋爱结婚，一看他们的八字也是合八字的。还有的现象：现在两个不同的家庭，他们自由恋爱，'有的脸很象，这就是我们说的夫妻相'，这就是命。**\" **须说明**：**这是讲义对\"合\"的分类与观察**；**其可用的核极窄**：**\"夫妻相\"是可观察的现象**（**而\"长相相似\"有\"择偶偏好相似\"这一可解释的机制——人会偏好与自己或家人相似的面孔**）——**所以\"夫妻相\"存在，但未必是\"命\"；**⚠ 须标**：**\"合八字→婚前曲折、或脸像→这就是命\"属归因，无验证基础**。","o":"TJ-0718 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·夫妻宫（PDF 第68页）"},{"t":"二百五十九、两处最重要的自我定位","h":"\"我们化解不是去买个鱼缸、画个符、念个咒\"","c":"要点——**这一句是全书最清楚的一次\"反迷信\"表态，须完整记**：\"**所以命上八字婚姻没有问题的，我们不改他的运，让他按命走；命上八字婚姻有问题的，我们才去改他的运。'所以算命只是一个工具，知道哪里有缺点，我们把他补上去就好了'。'我们化解不是去买个鱼缸、画个符、念个咒——这样做于事无补，他的八字还是没变，这是迷信，没有根据的'。**\" **这段话把\"化解\"的范围划清了**：**①算命是\"工具\"**（**不是\"术\"，是\"用来找缺点的工具\"**）；**②\"补缺点\"才是目的**（**而不是\"消灾\"**）；**③\"鱼缸、符咒\"不算化解**（**因为\"他的八字还是没变\"——即：这些东西没有触及任何环节**）。** **而\"没有根据的\"这五个字，是全书对\"迷信\"最直接的一句判语**（**它给出的判据是\"有没有触及对象\"：符咒没有改变任何可指认的东西，所以\"没有根据\"）。** **须说明**：**这是讲义对\"化解\"的界定**；**其可用的核**：**\"改变不了任何可指认的东西，就不算解决\"这一判据，脱开命理也成立**（**在医学上就是\"无效干预\"的判据：若无机制、无指标变化，则不成立**）；**⚠ 而须同时标**：**讲义自己给出的\"化解\"（改阳宅、合八字）同样不可核**——**所以这段话的价值在\"它划了一条反迷信的线\"，而不在\"它给出的替代方案本身成立\"**。","o":"TJ-0719 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·夫妻宫（PDF 第68页）"},{"t":"二百五十九、两处最重要的自我定位","h":"\"不能乱批，否则害别人一辈子\"","c":"风险——**这一句讲的是\"断命的伦理\"，分量极重**：\"**紫微星在丑宫时，武曲、七杀一定在酉宫，日月一定会反背。所以同理，如果此人官禄宫在辰宫太阴星、化忌，那此人不能当官。'所以我们算命要看清此人可能扮演的角色是什么，不能乱批，否则害别人一辈子'。**\" **而与之配套的，是两条\"约束自己\"的方法**：**①\"命相同参\"**——**\"如果此女眼角纹有两根、没有第三根、第四根，为夫妻感情好，'这时不能批丈夫死'，而是夫妻聚少散多（如丈夫做船员等工作）；'如果此女面大、骨粗、声沙，表先生已经走人了，这里就不能批夫妻聚少散多了'——所以要命相同参。**\" **②\"看不到面相就看阳宅\"**——**\"如果看不到此女本人之面相，我们也可看阳宅，'帮助她加减命理吉凶'。**\" **两句合起来，是一套\"自我限制\"**：**同一条星象，可以断\"聚少散多\"，也可以断\"人已走\"——而落在哪一边，取决于面相**（**即：不把单一指标当结论**）；**而当面相看不到时，就退回阳宅**（**即：承认信息不足，换一个可观察的证据源**）。** **须说明**：**这是讲义对\"断命伦理\"的表述**；**其可用的核**：**\"不能乱批，否则害别人一辈子\"这一句是完全站得住的**（**它承认了\"断语有后果\"**）——**而\"命相同参\"\"看阳宅加减\"这两条，实质是\"多源交叉、信息不足时不硬断\"**，**这在任何判断工作中都是正确的方法**；**⚠ 须标**：**三条依据（星象、面相、阳宅）都不可核**，**所以\"交叉\"只是\"在体系内交叉\"，不等于\"得到验证\"**。","o":"TJ-0720 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·官禄宫（PDF 第67~68页）"},{"t":"二百六十、星义的读法","h":"\"以宫性论星义\"与\"三方四正的检查点\"","c":"方法——**这一章给了两条\"怎么读星\"的硬规则**。**①\"以宫性论星义\"**：\"**如果兄弟宫入武曲，那兄弟为武贵。'所以同样的武曲落在哪个宫，以宫性论星义'——如果武曲星在父母宫，父母即为武贵。**\" **②一条可核的\"画盘检查点\"**：\"**命宫、财帛、官禄、迁移为三方四正，'四宫一定要会到'——如果批命宫的三方四正不是此四宫，'你就是画错了命盘'。**\" **第②条极重要**：**它是全书唯一一条\"自我检查\"的硬标准**——**\"三方四正必须是命、财、官、迁四宫；若不是，盘就画错了\"**（**而这可以逐盘核对**）。** 而\"以宫性论星义\"与前章的\"科的两义\"是同一条原理**：**同一个符号，落在不同位置，取不同义**（**武曲在兄弟宫→兄弟是武贵；在父母宫→父母是武贵；在夫妻宫→配偶是武职**）。** **另记一条\"十二宫的排法\"**：\"**（注：命宫、兄弟、夫妻……不论男女都是逆排，夫妻宫不会走在命宫前）**\"——**这条是可核的排盘规则**（**可核其是否被一致遵守**）。** **须说明**：**这是讲义对星义读法的规定**；**其可用的核**：**\"三方四正必须是命财官迁\"与\"十二宫逆排\"都是可核的结构规则**（**而\"画错盘\"是可判定的**）——**这是本册里难得的\"能验算\"的一块**；**⚠ 须标**：**\"武曲在兄弟宫→兄弟武贵\"这类\"由星推人\"的断言不可核**。","o":"TJ-0721 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·官禄宫（PDF 第67~71页）"},{"t":"二百六十、星义的读法","h":"\"用象看\"：一颗落陷的太阳可以读成四种象","c":"方法——**第三例（紫微在寅、命在申，1919 年 9 月 6 日子时，阴男）里有一段极精彩的\"用象\"示范**。**前提**：\"**紫微、天府在寅宫，太阴星一定在卯宫，太阳星一定在亥宫，双星为落陷。'太阳星陷在戌宫就很惨了，此例太阳星陷在亥宫为 21–23 点，就更惨了'\"**（**即：太阳在夜里 21–23 点的位置，等于\"太阳在夜里\"**）。** **而\"用象看\"的推理是同一句**：\"**'因为房子里晚上怎么可能看到太阳呢？不是太阳，那就是火灾'。**\" **同一颗\"亥宫落陷的太阳\"，落到不同宫，读出四种象**：**①在田宅宫——\"表示房子有火灾\"**（**\"用流年来定是何年何月\"**）；**②在父母宫——\"太阳表示父亲，所以父亲有凶象\"**；**③在夫妻宫——\"太阳代表丈夫，所以丈夫有凶灾\"**（**而\"这时不能批丈夫死\"，须配合眼角纹判断，见前条**）；**④在疾厄宫——\"就是眼睛视力不好，因为亥时为晚上 21 点到 23 点，怎么能看到太阳呢？所以眼睛已经看不到了\"**；**⑤在财帛宫——\"此人做生意不行……此人白天晚上都很忙，到头一场空\"**。** **\"用象\"这个方法，实质是\"把一个符号代入该宫的语境，再按常识推理\"**（**太阳＝光、＝父、＝夫、＝眼、＝财路；而\"夜里看不到太阳\"就是\"该有的东西在该在的时候不在\"）。** **须说明**：**这是讲义\"用象看\"的示范**；**其可用的核极窄**：**\"用象\"本身是一种\"以语境定含义\"的读法**（**可核其是否自洽**），**而\"某宫落陷→必有火灾／凶灾\"不可核**；**⚠ 须重点标**：**\"如果有化忌，那儿子一定是死了；如果是杀星，羊、陀、火、铃、空、劫带化忌，一定是子女死\"这一段**——**\"一定是死了\"是全册最绝对的一类断言**（**而\"子女死亡\"对任何父母都是最重的话**）；**本集照录其规则，同时明确：不可据命盘断言任何人的生死，尤其不可对当事人说出这类话**。","o":"TJ-0722 · 天纪·紫微详解·第五章紫微十二宫详解·第三例·用象（PDF 第70页）"},{"t":"二百六十、星义的读法","h":"\"人要有刚强，龙卷风把人都吹不走\"","c":"要点——**第三例福德宫段，讲义对\"刚强\"讲了一段极好的话**：\"**福德宫：武曲入庙在戌宫，对宫辰宫贪狼星入庙。'武官星入庙最好，大吉，人很刚强'。'人要有刚强，有个性，龙卷风把人都吹不走'；'如果不刚强（星为平陷时），两句话就把人骗走了'，这样的人没有主见、没有刚强。'有的小孩本来不是这样、胆子很大，往往被妈妈训练成没有了个性，什么事都由妈妈做主'。'杀（煞）星入庙，出现的问题都不大'。**\" **这段话有三层**：**①\"刚强\"的判据是\"龙卷风把人都吹不走\"**（**即：在强压下仍不改变**）；**②不刚强的后果是\"两句话就把人骗走了\"**（**即：不是\"没有能力\"，是\"没有主见\"**）；**③\"小孩被妈妈训练成没有了个性\"**——**这一句极精：它指出\"个性\"是可以被\"训练掉\"的**（**而出于好意的包办，效果与压制相同**）。** **而\"煞星入庙，问题不大\"这一条，与前章\"入庙则有预警\"是同一原理**（**\"入庙\"是\"力量用在明处\"，所以\"凶\"反而可控**）。** 另记一句极要紧的**：\"**武曲和贪狼对宫会到，还要有好的流年，也就是适合的年龄——'将军以上大多在 43–52 岁以上，现在十几岁是不可能的'。'好星出现的时机流年不对，也没用'。**\" **须说明**：**这是讲义对\"刚强\"与\"时机\"的论述**；**其可用的核是第①②③层**（**\"刚强＝在强压下不改\"、\"不刚强的表现是没有主见\"、\"个性会被训练掉\"——这三条脱开命理都成立**）；**⚠ 须标**：**\"武曲入庙则刚强\"\"某岁方成将军\"属命理断言**。","o":"TJ-0723 · 天纪·紫微详解·第五章紫微十二宫详解·第三例·福德宫（PDF 第71页）"},{"t":"二百六十、星义的读法","h":"\"忧能伤肺，思能伤脾\"：一处中西相合的注解","c":"要点——**第二例的疾厄宫段，讲义引了一句中医的\"五志伤脏\"，并给了极生活化的注解**：\"**疾厄宫：在寅宫，陀罗星落陷。'寅为肺有病，外科为右脚有病'。辰宫太阴星化忌是胃不好，巳宫为脾也不好。'中医忧能伤肺，思能伤脾'——所以谈恋爱时，思念太重没胃口，'吃东西如同嚼蜡，思伤脾'。**\" **这一条的价值在于\"它把一句抽象的中医命题落到了具体经验上\"**：**\"思伤脾\"**（**中医：思虑过度伤脾，脾主运化**）**→ \"谈恋爱时思念太重没胃口，吃东西如同嚼蜡\"**（**即：情绪影响食欲，而食欲属\"脾\"的范畴**）。** **而这一层在现代医学里有对应的机制**：**情绪应激通过下丘脑—垂体—肾上腺轴与自主神经影响胃肠功能**（**急性应激可抑制胃排空、改变食欲**；**而\"如同嚼蜡\"正是味觉与食欲被抑制的体验描述**）。** **须说明**：**这是讲义借中医\"五志伤脏\"对疾厄宫的注解**；**其可用的核是\"情绪影响食欲\"这一层**（**可观察、有机制支持**）；**⚠ 须标**：**\"寅宫为肺有病\"\"陀罗落陷→右脚有病\"属星位配属断言**，**而\"某宫对应某脏腑\"的配属，本集只记录，不作认可**（**尤其\"外科为右脚有病\"这类具体部位对应，无解剖学依据**）。","o":"TJ-0724 · 天纪·紫微详解·第五章紫微十二宫详解·第二例·疾厄宫（PDF 第67页）  ---"},{"t":"二百六十一、\"钟表轴\"：一个多层时间的模型","h":"轴不动，层在转","c":"定义——**编者（署名\"紫易奇缘\"）在第三例开头插了一段极深的说明，本集认为它是全册最接近方法论的段落，须完整记**：\"**我们在看后天盘时，要把自己比作钟表的轴——'但是这个轴是固定不动的'，就像我们站在十二宫的中间，'十二宫是静止的'。'我们的神（思维）随着上面不同的层在转动'：大限（有些客户怕听到大限这个词，用大运）每十年跳一格，流年每年跳一格，依次类推——'这样你就会感觉时空在变动，四季在轮回，每层的速度不同，百颗星象有快有慢不断地发生组合又解体，人的吉凶祸福、生老病死，一目了然'。**\" **这个模型可以拆成三层**：**①\"轴\"是静止的**（**十二宫固定不动，是坐标系**）；**②\"层\"是转动的**（**大限十年一层、流年一年一层，各层转速不同**）；**③\"神（思维）\"是随层转的那个观察者**（**即：看盘的人不在盘里，但要看\"层与层的叠加\"**）。** **而\"每层的速度不同\"这一句，是它的技术核心**：**同一个命盘，套上\"十年层\"是一种读法，套上\"一年层\"是另一种读法，两层的交叠处才是\"出事\"的地方**（**这也解释了为什么后文的断案总是\"大限×流年×宫干×星曜\"四重叠加**）。** **须说明**：**这是编者的方法论自述**（**不是原讲**）；**其可用的核**：**\"多层叠加\"这个模型本身是可理解的**（**年、月、日、时的叠加，在任何\"周期性系统\"里都存在**）——**而它的价值在于\"把'命'变成了'多层坐标的交点'\"，而不是\"一句断语\"**；**⚠ 须标**：**这个模型再精致，也不改变\"各层的内容（星曜配属）不可核\"这一点**——**模型可理解，不等于预测有效**。","o":"TJ-0725 · 天纪·紫微详解·第五章紫微十二宫详解·第三例·方法论（PDF 第71页）"},{"t":"二百六十一、\"钟表轴\"：一个多层时间的模型","h":"\"你首先看到的不是吉，是终点\"","c":"风险／要点——**紧接上段，编者说出了这套东西最沉重的一句自述**：\"**'这时你首先看到不是吉，是终点（死）'——'你会逐渐对此术失去兴趣……此时你给客户看命时，因为因果关系，你会说出很多善意的假话'。**\" **这三句要分开读**：**①\"你首先看到的不是吉，是终点\"**——**即：看多了就会看到\"所有人的盘最后都走到同一个终点\"**（**而\"吉\"只是中间的一段**）；**②\"你会逐渐对此术失去兴趣\"**——**因为\"如果一个系统里所有人的结局都一样，那么中间那些吉凶的差别就没有那么重要\"**；**③\"你会说出很多善意的假话\"**——**这是全段最重的一句：**因为\"因果关系\"（**你说的话会影响对方**），**所以\"诚实\"与\"有用\"之间出现了冲突，而选择是\"善意的假话\"**。** **这三句合起来，是一份\"从业者的困境说明\"**：**看得越深→越看出终点→越失去兴趣→但面对客户时，又因\"说真话会伤人\"而说假话。** **须说明**：**这是编者本人的反思，不是讲义的技术内容**；**其可用的核**：**\"真话与有用之间的冲突\"是一个真实的伦理问题**（**在医学上就是\"预后告知\"问题：如何告知末期病情而不摧毁病人的意志**）——**而这段自述的价值，不在于它给出了答案，而在于它承认了这个困境**；**⚠ 而须同时标**：**\"善意的假话\"在医疗、法律、财务领域是不被允许的**（**因为这些领域有\"知情同意\"的要求**）；**在命理咨询这种\"无强制后果\"的场合，它或许可被理解，但**\"善意\"本身不能成为\"不实\"的许可证**。","o":"TJ-0726 · 天纪·紫微详解·第五章紫微十二宫详解·第三例·方法论（PDF 第71页）"},{"t":"二百六十二、可核的规则：化忌的条件与\"季节横看\"","h":"\"巨门化忌要看丁干\"","c":"定义——**第三例给了一条极清楚的\"化忌判定条件\"，本集认为这是可核的**：\"**化忌由年天干或本宫干决定。此宫只有一个主星，就是巨门——'巨门化忌要看丁干'（丁阴同机巨），'丁年巨门才化忌'，'取决于流年是丁年'。**\" **这条规则的实质是\"条件式\"**：**化忌不是\"某星固有\"，而是\"某干×某星\"的组合**（**\"巨门化忌\"只在\"丁年\"发生，其他年份巨门不化忌**）。** **而它在后文立刻被用上了**：**编者分析该命 34 岁（1952 壬辰年）时写道\"由于大限宫干是乙，巨门不具备化忌条件，单从巳亥宫目前还看不出有死亡条件\"**——**即：\"化忌条件不成立，所以这一层还推不出结论\"**（**这是一次\"规则约束结论\"的实例**）。** **须说明**：**这是讲义对化忌条件的说明**；**其可用的核极准**：**\"丁年巨门化忌\"可由十干四化表直接查出**（**丁——阴同机巨：太阴禄、天同权、天机科、巨门忌** ✓）——**所以这一条是可核的**；**⚠ 而\"化忌→出事\"这一层不可核**（**规则可核，效应不可核，这是两件事**）。","o":"TJ-0727 · 天纪·紫微详解·第五章紫微十二宫详解·第三例·子女宫（PDF 第71页）"},{"t":"二百六十二、可核的规则：化忌的条件与\"季节横看\"","h":"\"寅为春、卯为夏、辰为秋、巳为冬\"：要横看四宫","c":"方法——**这一条极精巧，须照录**：\"**巨门星会到天马星，象义是'骑着马打官司'，表示有车祸。'寅宫为春、卯宫为夏、辰宫为秋、巳宫为冬'。注：'春夏秋冬要横看四宫'。所以是'冬天有车祸'（巳为冬）。（巳为脾，车祸会伤到脾脏。）**\" **这条规则的构造有两步**：**①\"巨门（是非口舌）＋天马（动）\"→ \"骑着马打官司\"→ 车祸**（**这是\"星义相加\"**）；**②\"定季节\"**——**寅、卯、辰、巳四宫横排，分别对应春、夏、秋、冬**（**所以\"巨门＋天马\"落在\"巳宫\"＝冬天**）。** **而\"巳为脾，车祸会伤到脾脏\"是第三步**（**宫位配脏腑）。** **须说明**：**这是讲义对\"季节与宫位\"的规定**；**其可用的核极窄**：**\"寅卯辰巳＝春夏秋冬\"是一套固定的对应表**（**可核其是否被一致使用**），**而\"巨门＋天马＝车祸\"\"巳＝脾\"都不可核**；**⚠ 须重点标**：**\"某年冬天有车祸\"这类断言，一旦被当事人当真，可能造成两种后果**（**一是过度恐惧、回避出行；二是真的出事时把它当作\"命定\"而不去复盘真实原因**）——**而车祸的真实原因（速度、路况、疲劳、酒驾）是可查、可改的**。","o":"TJ-0728 · 天纪·紫微详解·第五章紫微十二宫详解·第三例·子女宫（PDF 第71~72页）"},{"t":"二百六十三、\"伤使夹命\"与张良命例","h":"\"看她丈夫寿终并没有这么烦琐\"","c":"要点——**第三例用整整两页推演\"她丈夫如何死\"，而最后作者自己把结论收成了两句**：\"**其实看她丈夫寿终并没有这么烦琐：1、看巨门化忌；2、看大限和流年的伤使。'张良就是伤使夹限死的'，下附张良命盘和断语，一看便知。**\" **而前面那一长串推演（本集照录其骨架）**：**大限行田宅宫（34–43）→\"大限引动火蛇，水火相冲，巳亥相冲\"→ 亥宫天干为乙 →\"乙使卯宫太阴化忌直冲对宫（酉）大夫\"→ 大限夫妻宫在酉 →\"酉主肾，表示丈夫有肾脏病\"→ 火星为炎症 → 天同为天医、自身免疫好 → 但对宫化忌来冲、病情加重 → 流年干壬使武曲化忌反击 → 破军、大耗守流财 → 投资失败 → 文曲化忌形成官司 → 丈夫的钱被倒账 →\"太阳化忌，丈夫服毒自杀（地空、地劫）\"→ 黑白双煞（天使、天伤）引路走入地下之门（巨门）。** **而作者把这一长串收成\"两句\"**（**巨门化忌＋伤使**）——**这一收，恰好说明\"推演链\"与\"结论\"是两回事**（**链条越细，越像\"事后叙述\"**）。** **须说明**：**这是讲义对第三例的推演与收束**；**其可用的核极窄**：**\"天同为天医\"是一条星义（可核其定义）**，**而\"她丈夫如何死\"的整条链不可核**；**⚠ 须重点标**：**这类\"逆推死亡原因\"的叙述有一个共同问题——它总是在\"人已经死了\"之后进行**（**而死因已定，任何一套符号都能被\"配上\"**）；**这正是\"事后归因\"的典型形态**（**而它的不可证伪性，恰恰来自\"死亡已发生\"这一点**）。","o":"TJ-0729 · 天纪·紫微详解·第五章紫微十二宫详解·第三例·流年（PDF 第72~74页）"},{"t":"二百六十三、\"伤使夹命\"与张良命例","h":"张良命例：\"极富贵之命，直须限落夹地\"","c":"数据——**这一处是全书唯一一次给古人排盘，且有明确的生卒年，本集照录并核其数字**。**原文**：\"**张良，秦末汉初杰出谋臣，'甲午（公元前 267）年五月初六日辰时生'。'此是双禄朝垣，左右昌曲加会，又兼紫府同宫，作极富贵之命。直须限落夹地，故以命亡：76 岁大小二限在天伤、地空、天使衰死之地，是以难逃'。'己酉，公元前 192 年三月初七故，享年七十六岁'。'伤使：天伤加恶曜，仲尼绝粮邓通亡'。**\" **本集核其数字**：**公元前 267 年生、公元前 192 年卒——按周岁计为 75 年；而讲义作\"享年七十六岁\"，用的是\"虚岁\"（含首尾）** ✓（**两者不矛盾，只是口径不同**）。** **而这一例的结构极清楚**：**①先是\"极富贵之命\"**（**双禄朝垣＋左右昌曲＋紫府同宫**）；**②然后\"直须限落夹地，故以命亡\"**（**即：命再好，走到\"夹地\"就完了**）；**③具体是\"76 岁大小二限在天伤、地空、天使衰死之地\"**（**三重凶叠加**）。** **而\"伤使：天伤加恶曜，仲尼绝粮邓通亡\"这一句，是把\"天伤＋恶曜\"配了两个历史典故**（**孔子陈蔡绝粮、邓通饿死**）——**即：这一类凶的组合，古人已经用\"绝粮\"\"饿死\"来命名它的性质。** **须说明**：**这是讲义所附的张良命盘断语**；**其可用的核极准**：**\"公元前 267 年生、公元前 192 年卒\"是可核的史实框架**（**而\"享年七十六\"与\"周岁 75\"之差，是虚岁与周岁的口径差，可验算**）；**⚠ 须标**：**\"极富贵之命\"与\"限落夹地故以命亡\"是命理判断**，**而\"张良命盘\"本身是后人按其生辰排出来的**（**其生辰是否可靠，史无明文**）——**所以这一例的\"可核\"只到\"年份\"这一层**。","o":"TJ-0730 · 天纪·紫微详解·第五章紫微十二宫详解·第三例·张良命例（PDF 第74页）"},{"t":"二百六十四、一条完整的事后归因链","h":"\"因为她缺钱\"：从武贪格到服毒","c":"风险——**第三例的流年段，给了一条极完整的\"事件链\"，本集照录并标其性质**。**起点**：\"**十年大运的第一年是 34 岁，1952 年干支为壬辰，'流年出现五个格局'：1、天乙本命拱命、天乙流年拱命；2、文星拱命；3、七杀朝斗；4、武贪格；5、大限命里逢空格。'真正使她出问题的是后两个格'。'为什么？因为她缺钱'。**\" **背景**：\"**看本命盘三方四正不见禄，后天二库为空库没有余钱；命宫、身宫、父母宫和田宅宫都不见禄，出生在一个贫困家庭。财帛宫化忌、福德化禄，'后天一心想挣钱'。**\" **事件链**：\"**命主流年 34 岁遇到武贪格，'终于有了挣钱的机会'，'在两个女人的怂恿下，担保抵押进行了投资'，结果流年不利，太岁、小限迭并，文曲化忌冲对宫流迁，流年干壬使武曲化忌反击；破军、大耗守流财，导致投资失败，文曲化忌形成文书、票据官司；……'丈夫的钱被倒账，钱没了'……'太阳化忌，丈夫服毒自杀'。**\" **须说明**：**这是讲义对该命 34 岁流年的推演**；**其可用的核极窄**：**\"1952 年为壬辰年\"是可核的**（**干支纪年可验算**），**而\"因为她缺钱所以出问题\"之后的整条链不可核**；**⚠ 须重点标（三点）**：**①这条链是\"事后拼装\"的**——**\"武贪格→挣钱机会→担保投资→投资失败→官司→倒账→服毒\"，每一步都可以在事后找到对应的符号**（**但事前无法指定\"哪一步一定发生\"**）；**②它把\"贫困\"读成了\"命盘不见禄\"**——**而贫困是有具体社会与家庭原因的，把它归到星位上，会掩盖真正的可改进之处**；**③\"服毒自杀\"被解释为\"太阳化忌＋地空地劫\"**——**这是把一起真实的死亡事件\"符号化\"**，**而自杀的真实原因（债务、羞耻、抑郁、无路可走）在链条里只剩\"钱没了\"三个字**。** **本集据此提示**：**这类\"完整归因链\"最容易让人误以为\"命理能解释一切\"**——**而它的\"完整\"恰恰来自\"事后可以任意接线\"**。","o":"TJ-0731 · 天纪·紫微详解·第五章紫微十二宫详解·第三例·流年（PDF 第73~74页）  ---"},{"t":"二百六十五、符号方向的第二次验证","h":"\"○×××○×\"与蒙卦的吻合","c":"数据——**前章据屯卦判定\"金钱课符号自右向左读\"，本章的蒙卦给了第二次独立验证**。**原文**：\"**山水蒙卦：'○×××○×'（小鬼偷钱）中下。**\" **本集核对蒙卦卦体**：**山水蒙＝艮上坎下；下卦坎（初六阴、九二阳、六三阴）、上卦艮（六四阴、六五阴、上九阳）**（**即自下而上：阴、阳、阴、阴、阴、阳**）。** **再比对符号\"○×××○×\"**：**若自左向右（初→上）读，得\"阳、阴、阴、阴、阳、阴\"——与蒙卦不符**（**初爻应是阴，此处却是阳**）；**若自右向左读，得\"阴、阳、阴、阴、阴、阳\"——与蒙卦完全吻合** ✓。** **据此判定**：**\"自右向左\"这一读向得到第二次独立确认**（**屯卦与蒙卦的初爻阴阳正好相反——屯初九为阳、蒙初六为阴——所以两卦的符号序列必然不同，而两次判定指向同一个方向，就不是巧合）。** **须说明**：**这是本集用两个\"可判卦\"交叉验证得到的结论**；**其可用的核极准**：**卦体是固定的，符号序列只有一种读法能与它吻合**（**而两次交叉验证一致，说明这一判定成立**）；**⚠ 一并标明**：**这一结论只解决\"怎么读\"，不解决\"读出来准不准\"**——**但\"怎么读\"错了，后面全错，所以它仍是最要紧的一块**。","o":"TJ-0732 · 天纪·紫微详解·第四章卦象详解·山水蒙·文王金钱课（PDF 第76页）"},{"t":"二百六十六、蒙卦：性格与破解","h":"\"敢承担责任，但不知错在何处\"","c":"要点——**蒙卦\"性格\"段有一段极传神的描述，须完整记**：\"**上艮下坎，上山水下，属于土克水。'艮为三子、坎为二子，两子相斗，家庭不和，二子受伤，长幼错乱，家出逆子，易惹官司'。'蒙卦朦胧未清，看事不清、分辨能力差，智慧未启，生活无序，做事不周，交友不慎，往往受到牵连'。'蒙像个孩子处于朦胧的状态，遇事天不怕、地不怕，敢承担责任，细细追究下去，又不知错在何处？永远懵懵懂懂，似是而非'。**\" **这一段最精的是最后一句**：**\"遇事天不怕、地不怕，敢承担责任，细细追究下去，又不知错在何处\"**——**它把\"蒙\"写成了\"不是不敢担，而是担了也不知道错在哪\"**（**而这正是\"蒙昧\"最准确的样子：不是无能，是\"没有分辨力\"**）。** **而\"永远懵懵懂懂，似是而非\"这八个字，是对\"蒙\"最好的概括**（**\"似是而非\"——它有\"近似正确\"的外形，所以最难被自己发现）。** **须说明**：**这是讲义对蒙卦性格的论述**；**其可用的核是\"蒙的形态\"这一层**（**\"敢担责却不知错在哪\"是一种可观察的心理状态**）——**而\"艮为三子、坎为二子、两子相斗\"是卦象配属**（**可核其是否被一致使用**）；**⚠ 须标**：**\"家出逆子、易惹官司\"属命理断言**。","o":"TJ-0733 · 天纪·紫微详解·第四章卦象详解·山水蒙·性格（PDF 第75页）"},{"t":"二百六十六、蒙卦：性格与破解","h":"\"破解：一是换房间，二是本人想通转换观念\"","c":"方法——**蒙卦\"地脉道\"里的\"破解\"一节，是本册里极少见地把\"主次\"讲清楚的地方**：\"**山水蒙卦：'未婚的三子住到二儿子的正北坎位，叫山水蒙'。表示愚昧、蒙蔽、欺骗家人、惟利是图、独断专行、险中取财和不良习气。'往往比同龄人早婚七年'。由于一念之差误了一世，毁了一生。'如要破解：一是要换房间住，二是要本人想通转换观念——这是最主要的'，此后方可成功。**\" **这一句的分量在于它把\"改阳宅\"降为次要**：**①\"换房间住\"是外部调整**；**②\"本人想通转换观念\"才是\"最主要的\"**（**而\"此后方可成功\"——即：观念不通，换了房间也不会成功）。** **这与前章\"位对了念就对了\"构成一组**：**\"位\"是外部条件，\"念\"是内部条件**——**而在\"破解\"这一层，讲义明确把\"念\"排在前**（**因为\"位\"只能\"提供一个可能\"，\"念\"才决定\"走不走得出来\"）。** **须说明**：**这是讲义对蒙卦破解的说明**；**其可用的核**：**\"观念转换为主要、环境更换为次要\"这一次序，脱开命理也成立**（**在很多行为干预里，环境调整是\"降低难度\"，而认知改变才是\"改变行为\"**）；**⚠ 须标**：**\"住某位即得某卦、必致某果\"的因果缺乏验证**，**而\"换房间能否改变性格\"更是无法检验的断言**。","o":"TJ-0734 · 天纪·紫微详解·第四章卦象详解·山水蒙·地脉道（PDF
