第76页）"},{"t":"二百六十七、编者的一次实战自述","h":"\"从网上找到了我，要求我帮她化解\"","c":"风险——**\"（二）附加命例\"一节，是编者（署名\"紫易奇缘\"）所记的一次真实接触，须照录并标其性质**：\"**此女是倪师《天纪》的粉丝。当她看到自己的命宫有廉贞、七杀和日月反背，她怕大限 25–35 丈夫出事，'从网上找到了我，要求我帮她化解'。我看到命盘后经过分析，找到了问题所在：夫妻宫是丈夫的命宫，他的命宫'半路埋尸'（廉贞、七杀）。**\" **而编者的处置**：\"**未宫是命宫，辰宫是子女宫，第一胎是儿子（若为儿子，其命宫在辰）；她第一胎生的是女儿，命宫在对宫（戌宫）……子宫是妻子的田宅宫、是女儿的福德宫，福德宫是祖父，三方见巨门、天使，太阳陷，'孙女出生祖父驾鹤西去'。**\" **\"**想要第二胎，问题出来了：辰为子女宫，见巨门、天使，太阳陷，父亲看不到太阳了，骑着天马，跟随地劫走入丧门。**'我叫她晚生二胎三年'，去年问了下，以平安度过此劫。**\" **须说明（三点）**：**①这是编者自述的个案**（**\"从网上找到了我\"\"去年问了下\"，属\"一方称\"，无第三方可核**）；**②其\"化解\"手段很具体——\"晚生二胎三年\"**（**这是一个可执行的行动，而不是符咒**，**这一点与前章\"不做鱼缸符咒\"的表态一致**）；**③而其\"验证\"是\"去年问了下，平安度过\"**（**这是典型的\"个案自述式验证\"：成功会被记住，失败不会被记账**）。** **⚠ 须重点标**：**本集记录此事，但不把它当作\"命理有效\"的证据**——**因为\"晚生三年后平安\"这一结果，无法排除\"本来就会平安\"这一可能**（**而这里缺的正是\"如果不晚生，会不会出事\"的对照组**）。","o":"TJ-0735 · 天纪·紫微详解·第五章·附加命例第二例（PDF 第77页）"},{"t":"二百六十八、需卦：六爻是六个\"距离刻度\"","h":"郊→沙→泥→血→酒食→穴","c":"要点——**需卦的六爻要旨表，本身就是一个极清楚的\"刻度序列\"**（**照录**）：**初九——\"需于郊，利用恒，无咎\"**；**九二——\"需于沙，小有言，终吉\"**；**九三——\"需于泥，致寇至\"**；**六四——\"需于血，出自穴\"**；**九五——\"需于酒食，贞吉\"**；**上六——\"入于穴，有不速之客三人来，敬之终吉\"。** **这六爻构成一条\"与危险的距离线\"**：**郊（城外，最远）→ 沙（水边沙地，渐近）→ 泥（已陷，寇至）→ 血（已伤，但出了穴）→ 酒食（安然进食）→ 穴（进入洞穴，遇不速之客）**（**而这与《人间道》需卦\"郊→沙→泥→血→酒食→穴\"的\"六个刻度\"完全同构**）。** **而卦辞与象辞也照录**：\"**需。有孚，光亨，贞吉。利涉大川。象曰：云上于天，需；君子以饮食宴乐。**\" **占例**：\"**水天需，此卦为蔡顺遇赤眉乱，卜得后，乃知必脱大难也**\"——**\"蔡顺遇赤眉\"是\"二十四孝\"里的典故**（**蔡顺拾葚养母、遇赤眉军而获赠米**）。** **图解**：\"**僧人引路，主柔而无欲、有灾入空门可解；也表示得福禄人引接。一墓暗示官和财、'置之死地而后生'；墓前有龙，代表辰时——辰为墓为库、辰为水库，说明水已被储藏起来了。'月下之墓又为戌'，也主狗年发福发禄。月当空主光明，女人居上、清明无灾。一门为龙门、官府；一人攀龙尾，'随真龙变化、攀龙附贵'，说明迫切需求雨水。**\" **须说明**：**这是讲义对需卦的著录**；**其可用的核**：**\"郊→沙→泥→血→酒食→穴\"这个序列本身是《易》的原文结构**（**可核其顺序**）——**而这个\"距离刻度\"的读法，是《人间道》与本书共有的一个亮点**（**它把六个爻变成了\"六种处境\"，而不是\"六个吉凶\"**）；**⚠ 须标**：**\"辰为水库\"\"月下之墓为戌\"\"狗年发福\"属卦图取象与配属，本集只记录，不认同其预测义**。","o":"TJ-0736 · 天纪·紫微详解·第四章卦象详解·水天需（PDF 第78页）  ---"},{"t":"二百六十九、金钱课符号方向的四次验证","h":"屯、蒙、需、讼四卦逐一核对","c":"数据／方法——**\"文王金钱课\"的六个符号到底从哪一端读，本集已用四个\"混排卦\"逐项核对完毕。核法固定**：**①先按卦名写出卦体**（**上卦＋下卦，自下而上逐爻定阴阳**）；**②再取讲义所给符号串**；**③分别按\"自左向右（初→上）\"与\"自右向左（初→上）\"两读**；**④比对哪一个与卦体完全吻合。** **四次结果（本集全部复算）**：\n\n| 卦 | 卦体（自下而上） | 讲义符号 | 自右向左读 | 吻合 |\n|---|---|---|---|---|\n| 水雷屯（坎上震下） | 阳、阴、阴、阴、阳、阴 | ×○×××○ | 阳、阴、阴、阴、阳、阴 | ✓ |\n| 山水蒙（艮上坎下） | 阴、阳、阴、阴、阴、阳 | ○×××○× | 阴、阳、阴、阴、阴、阳 | ✓ |\n| 水天需（坎上乾下） | 阳、阳、阳、阴、阳、阴 | ×○×○○○ | 阳、阳、阳、阴、阳、阴 | ✓ |\n| 天水讼（乾上坎下） | 阴、阳、阴、阳、阳、阳 | ○○○×○× | 阴、阳、阴、阳、阳、阳 | ✓ |\n\n**四卦全对，且\"自左向右\"四卦全错。** **据此判定（不再是推测）**：**这套符号是自右向左书写的——最右一个符号为初爻，最左一个为上爻。** **而\"四卦全对\"之所以有力，是因为这四卦的初爻阴阳两两交错**（**屯初九阳、蒙初六阴、需初九阳、讼初六阴**）——**若符号方向判断有误，不可能四次都吻合**（**一次巧合是偶然，四次一致就是规则**）。** **须说明**：**这是本集对\"编码规则\"的独立核验**（**不是照抄讲义，而是从卦体反推**）；**其可用的核极准**：**卦体是《易》的固定内容，符号串是讲义原文，比对是纯算术**（**所以这一条是全册最不容置疑的一块**）；**⚠ 一并标明**：**本集解决的是\"怎么读\"，不是\"读出来准不准\"**——**但乾、坤这类\"六爻全同\"的卦，若方向错了也无从发现**（**而它们恰好掩盖了这个问题**），**这一点也须记下**。","o":"TJ-0737 · 天纪·紫微详解·第四章卦象详解·屯、蒙、需、讼四卦文王金钱课（PDF 第63、76、79、81页）"},{"t":"二百七十、需卦：老好人的画像","h":"\"利他不利己……活在别人的看法里\"","c":"要点——**需卦\"性格\"段，是本册刻画一种人格最准确的一段，须完整记**：\"**上坎下乾，上金下水，'金水多情，纵欲精竭'。阳多阴少，不利于女人、缺少子嗣。'性格为人保守、谦和有礼'。'需卦不重视现实，利他不利己，善良正直、没有邪念，遇事挺身而出，替别人瞎操心'。'往往注重别人的想法、看法、活在别人的看法和想里，得不到别人的任何（认同）'，'感觉生活无味、心多烦恼，活的很累'。得此卦者只要坚定信念，定能功成名就。**\" **这一段写的是一种极常见的人格**：**①\"保守、谦和有礼\"**（**外在表现**）；**②\"不重视现实、利他不利己、善良正直、遇事挺身而出、替别人瞎操心\"**（**行为模式**）；**③\"活在别人的看法和想法里\"**（**内在机制**）；**④\"感觉生活无味、心多烦恼，活的很累\"**（**结果**）。** **而四层之间是有因果的**：**因为\"太在意别人的看法\"→所以\"事事利他\"→但因为\"得不到认同\"→所以\"活得很累\"**（**即：这是一种\"付出—无回馈—更付出\"的循环**）。** **须说明**：**这是讲义对需卦性格的论述**；**其可用的核是\"人格画像\"这一层**（**\"老好人\"的描述在任何心理学框架下都成立**）——**而\"上坎下乾→金水多情\"\"阳多阴少→不利于女人\"是卦象配属**；**⚠ 须标**：**\"不利于女人、缺少子嗣\"\"纵欲精竭\"属命理断言**。","o":"TJ-0738 · 天纪·紫微详解·第四章卦象详解·水天需·性格（PDF 第79页）"},{"t":"二百七十、需卦：老好人的画像","h":"\"长兄一结婚，立刻变成雷天大壮局\"","c":"方法——**需卦\"地脉道\"给了一条极重要的\"动态变局\"规则**：\"**水天需卦：'二子居住到西北角爸爸的位置，行使爸爸神的意识'。代表'成长快速，势必超过同年龄许多'；而且'性格刚烈，不受建言'。注意此局：'长兄一结婚，立刻变成雷天大壮局'。**\" **这一条与屯卦\"二子住震位就不是屯卦\"是同一类规则**：**名位不是静态的**（**同一个人住同一个位，\"卦\"会随\"家里其它人的变动\"而变**）。** **而\"二子住父位\"的三重后果，讲义给了三个**：**①\"成长快速、超过同年龄许多\"**（**因为\"行使爸爸神的意识\"——即：提前承担了长辈的角色**）；**②\"性格刚烈，不受建言\"**（**即：过早\"当大人\"，反而听不进话**）；**③\"长兄一结婚，立刻变成雷天大壮局\"**（**即：兄长成家后，家的格局整体改写**）。** **须说明**：**这是讲义对需卦地脉道的说明**；**其可用的核极窄**：**\"提前承担长辈角色→成熟快但难听劝\"这一层是可理解的**（**在家庭系统里，\"亲职化\"（parentification）确有类似的观察**——**过早承担照顾者角色的孩子，往往显得成熟，但也容易出现控制欲与拒绝求助**）；**⚠ 须标**：**\"住某位即得某卦、必致某性格与婚姻\"的因果缺乏验证**——**而\"必须住对位才不受影响\"这个前提，本身就无法检验**。","o":"TJ-0739 · 天纪·紫微详解·第四章卦象详解·水天需·地脉道（PDF 第79页）"},{"t":"二百七十一、讼卦：争辩者的画像","h":"\"路见不平就要讼\"","c":"要点——**讼卦\"性格\"段，把一种\"争辩型人格\"写得极准**：\"**上乾下坎，上金下水，'金生水利于中男'，主多情淫乱、情感冲动，容易树敌、导致财破。'讼因是非引发诉讼，有讼必有竞争意识'；'主头脑灵活、能言善辩'；'讼为强词夺理，无有谦让之心、全凭感觉意气用事，路见不平就要讼'；'对待婚姻也如此，往往不切实际，很少从对方角度考虑配偶感受，造成婚姻不和谐'。从健康上看多主肠胃消化系统不良。'讼也主说的多，做的少，不能吃苦耐劳，嘴上功夫'。**\" **这一段的结构是\"一个长处配三个短处\"**：**长处——\"头脑灵活、能言善辩、有竞争意识\"**；**短处——①\"强词夺理、无谦让之心、全凭意气用事\"（把'辩'变成了'争'）；②\"很少从对方角度考虑配偶感受\"（把'争'带进了婚姻）；③\"说的多、做的少、不能吃苦耐劳\"（把'说'替代了'做'）**。** **而\"路见不平就要讼\"这六个字最传神**：**它不是\"为自己争\"，而是\"为不平争\"**——**即：这种人往往\"自觉有理\"，所以最难被劝止**（**而这也正是《人间道》讼卦\"健而不险不生讼，险而不健不能讼\"的另一种说法）。** **须说明**：**这是讲义对讼卦性格的论述**；**其可用的核是\"争辩型人格的三短\"这一层**（**\"辩而不让\"\"把争带进亲密关系\"\"说到做不到\"——这三条在任何语境下都成立**）；**⚠ 须标**：**\"上乾下坎→多情淫乱、容易树敌、导致财破\"\"多主肠胃消化系统不良\"属命理断言**。","o":"TJ-0740 · 天纪·紫微详解·第四章卦象详解·天水讼·性格（PDF 第80~81页）"},{"t":"二百七十一、讼卦：争辩者的画像","h":"\"争讼无所谓胜败，忍让止讼才是关键\"","c":"要点——**讼卦的\"卦义\"收束，只有一句话，但极重**：\"**天水讼卦，讼者，讼也，诉讼、争执，'为凶卦也'。乾为天、坎为水，天在水上；天的性质向上，水的性质向下。'天水相隔，背道而驰'，这就是讼卦的卦象。得此卦者：百事皆不利，口舌是非多。遇事不应险进，以退守为安。'争讼无所谓胜败，忍让止讼才是关键'。天高水深，不易远行。必免争讼，力求和平。**\" **\"争讼无所谓胜败\"这一句，是全卦的枢纽**：**它的意思是\"打官司这件事本身没有赢家\"**（**因为即使赢了，关系、时间、精力都已损失**）——**而由此推出的结论不是\"要赢\"，而是\"要止\"**（**\"忍让止讼才是关键\"**）。** **而这一层与《人间道》讼卦\"讼不可成也\"\"中吉的'中'不是中间是适可而止\"完全同调**（**两册在这里的结论是一致的）。** **须说明**：**这是讲义对讼卦卦义的收束**；**其可用的核**：**\"争讼无胜败\"这一判断，在有\"关系成本\"的场合是成立的**（**即：法律上可以赢，关系上必定输**）——**这也是现代调解与替代性争议解决（ADR）的基本前提**；**⚠ 而须标**：**\"忍让止讼\"不能被绝对化**——**在权益被实质侵害、或涉及人身安全时，退让不是美德而是纵容**（**这一点与《人间道》\"讼卦第二爻须循法律途径\"是一致的：该走的程序要走**）。","o":"TJ-0741 · 天纪·紫微详解·第四章卦象详解·天水讼（PDF 第81页）"},{"t":"二百七十一、讼卦：争辩者的画像","h":"讼卦\"地脉道\"：父居二子位必讼","c":"方法——**讼卦\"地脉道\"是一段\"后果清单\"，且含一条可核的量化说法**：\"**天水讼卦：'父亲居住在正北二子的位置，一定会讼'。做什么事情都有官司纠纷，而且运气下降，'降到第五位，运气也拖后五年'。如果是李姓将会遇险。此局官司不断，诉讼缠身。注：'离婚会破此局'。公务人员，升迁会慢五年、诸事不顺、容易受到牵连。已婚之人婚姻必破；专业技术人员：要防诉讼、防无事生非。**\" **其中\"运气降到第五位、拖后五年\"\"升迁会慢五年\"是两处量化**（**而\"五年\"这个数在全书里反复出现：屯卦\"早婚二年\"、蒙卦\"早婚七年\"、需卦\"婚事延后七年\"——**同一册里\"几年\"的数字彼此不一致，须记下**）。** **\"离婚会破此局\"这一句极有意思**：**它是\"解法\"**——**即：父亲不在二子位上（因离婚而离开），这个\"讼局\"就不成立**（**这与《人间道》\"名位相等\"的逻辑一致：位不符则局不成**）。** **须说明**：**这是讲义对讼卦地脉道的说明**；**其可用的核极窄**：**\"位不符则局不成\"是一条自洽的规则**（**可核其是否被一致应用**），**而\"必讼\"\"必破\"\"慢五年\"不可核**；**⚠ 须标**：**\"离婚会破此局\"这一说法有一个实际风险——它可能被听成\"为了破局而离婚\"**（**而婚姻的决定不应由\"破不破局\"来决定**）。","o":"TJ-0742 · 天纪·紫微详解·第四章卦象详解·天水讼·地脉道（PDF 第81页）  ---"},{"t":"二百七十二、师卦：抗上而义气","h":"\"性格抗上，不利于升迁；对下宽宏义气\"","c":"要点——**师卦\"性格\"段把一种\"中下层能人\"的处境写得很准**：\"**上坤下坎，上土下水，属于土克水，不利于中男；'坎为险，易招致官司是非，性格抗上，不利于升迁；对下宽宏义气，自力更生，能者多劳，财运丰厚'。师为军队，有战争之象，又表有结帮武斗、争强好胜之意。'师主战，缺乏细节、不重视细节和小事'；也暗示'人心眼小，文化低，内心空虚，往往关注的是别人怎么想，缺乏主动思考力，事业上感到英雄无用武之地，生不逢时'。从健康上看，坎为水主肾、主耳、'主孕妇容易流产'；肾不利必影响到生育、主人丁稀少不旺。**\" **这一段的核心，是一组\"上下不对称\"**：**对上——\"抗上，不利于升迁\"**；**对下——\"宽宏义气，自力更生，能者多劳\"**。** **即：同一个人，向上是\"不服从\"，向下是\"讲义气\"**——**而这两面其实同源：他\"认人不认位\"**（**所以对\"人\"肯出力，对\"位\"不肯低头**）。** **而\"英雄无用武之地，生不逢时\"这一句，是这组不对称的必然结果**（**因为上升通道恰恰由\"位\"决定**）。** **须说明**：**这是讲义对师卦性格的论述**；**其可用的核是\"上下不对称\"这一层**（**\"对上不服、对下讲义气\"是一种可观察的组织行为模式**——**在管理上，这类人往往是\"优秀的执行者、糟糕的下属\"**）；**⚠ 须标**：**\"心眼小、文化低、内心空虚\"\"主孕妇容易流产\"属命理断言**（**而\"某卦主流产\"这类涉及生育的断言，对备孕者心理影响直接，不可采**）。","o":"TJ-0743 · 天纪·紫微详解·第四章卦象详解·地水师·性格（PDF 第82页）"},{"t":"二百七十二、师卦：抗上而义气","h":"母居二子位：\"泼妇骂街、妻殴夫\"","c":"方法——**师卦\"地脉道\"是本册对\"地脉道\"讲得最激烈的一条**：\"**地水师卦：'母亲居住在正北二子的房间为师局'——'泼妇骂街，女人性刚，甚至与人殴打，凶暴，易于人发生矛盾争端，仇视外人'。'婚姻有家暴、妻殴夫之象'。'男命女身、胆大过人、独来独往'。'事业不得志、常常引发纠纷'。'经商主破财、破婚'。'如果属虎、马、羊之人大发、官运亨通，但是婚姻大凶'。**\" **这一条须两层处置**：**①它的\"机制\"是\"母居子位\"**（**即：母亲占了\"二子\"（中男）的位置，\"名位不相等\"**）——**而这与全书\"名位相等\"的框架一致**（**可核其是否自洽**）；**②它的\"后果描述\"极重**（**\"泼妇骂街\"\"妻殴夫\"\"家暴\"**）——**而这类描述带强烈的性别羞辱色彩**。** **本集处置**：**照录其\"规则\"（母居二子位＝师局、名位不相等）**，**但把\"泼妇骂街\"\"妻殴夫\"这类描述标为\"带性别偏见的表述\"，不采其贬损义**。** **须说明**：**这样处置的理由是\"两件事必须分开\"**：**\"名位是否相等\"是这套体系内的可核规则**；**\"占用某个位置的女人就是泼妇\"，是对人的整体贬损**（**而\"妻殴夫\"这一条更把\"家庭暴力\"写成了\"女人的因果报应\"，这恰好会掩盖家暴的真实成因与求助路径**）。** **⚠ 须重点标**：**家暴的成因是权力与控制，不是\"住错了房间\"**——**任何遭遇家暴的人，应寻求报警（110）、妇联（12338）或法律援助，而不是\"换个房间住\"**。","o":"TJ-0744 · 天纪·紫微详解·第四章卦象详解·地水师·地脉道（PDF 第83页）"},{"t":"二百七十二、师卦：抗上而义气","h":"第五次验证：师卦的符号","c":"数据——**师卦给了第五个可核的\"混排卦\"，验证结果与前四卦一致**。**原文**：\"**地水师卦：'××××○×'（马到成功）上平。**\" **本集核对师卦卦体**：**地水师＝坤上坎下；下卦坎（初六阴、九二阳、六三阴）、上坤（六四阴、六五阴、上六阴）**（**即自下而上：阴、阳、阴、阴、阴、阴**）。** **比对符号\"××××○×\"**：**若自左向右读，得\"阴、阴、阴、阴、阳、阴\"——与师卦不符**（**第二爻应是阳，此处却是阴**）；**若自右向左读，得\"阴、阳、阴、阴、阴、阴\"——与师卦完全吻合** ✓。** **据此**：**\"自右向左\"这一读向已有五次独立验证**（**屯、蒙、需、讼、师**），**而五卦的初爻与次爻阴阳各不相同**（**屯初九阳、蒙初六阴、需初九阳、讼初六阴、师初六阴但九二阳**）——**五次全中、\"自左向右\"五次全错，这一判断已无可疑**。** **须说明**：**这是本集第五次核验**；**其可用的核极准**：**卦体固定、符号原文、比对是纯算术**（**而五次一致，是\"规则\"而非\"巧合\"**）；**⚠ 一并标明**：**读者若要自行核对，须先把\"卦体\"写对**——**而\"卦体写错\"正是本册最常见的错误之一**（**前文已查出\"兑＝☷\"\"黄桑\"\"履霜怪冰\"\"元堂九四\"四处**）。","o":"TJ-0745 · 天纪·紫微详解·第四章卦象详解·地水师·文王金钱课（PDF 第83页）"},{"t":"二百七十三、第四例：天梁在午与\"天仓\"","h":"\"武官为一品，近天子侧\"","c":"定义——**第四例（紫微在卯、命在申，1955 年 3 月 28 日未时，阴男）的第一条要点，把\"天梁在午\"讲得极清楚**：\"**1、'天梁在午入庙，发武职之人'。'午宫一定逢天梁星且一定是入庙'。'天梁星在午宫，武官为一品，近天子侧'。'武官有四种人：军人、警察、法官、外交官——都为一方之主，且有生杀之权'。**\" **这一条的价值在于它给出了一个\"职业清单\"**：**\"军人、警察、法官、外交官\"四类**（**而\"一方之主、有生杀之权\"是它们的共同特征**——**即：都是\"在授权范围内可以决定他人命运\"的岗位**）。** **而这个清单在全册出现过两次**（**前章坤卦流年\"司法官处贵（军人、警察、法官、外交官）\"**）——**两处一致，可核其一致性 ✓**。** **须说明**：**这是讲义对\"天梁在午\"的规定**；**其可用的核极窄**：**\"武官四种人\"这份清单在册内是一致的**（**可核**），**而\"天梁在午→必为武官一品\"不可核**；**⚠ 须标**：**本集记录这套\"星—职\"对应，不认同\"由星定职\"的断言**——**尤其\"有生杀之权\"这类表述，与现代公职的\"依法授权\"性质不同，须分清**。","o":"TJ-0746 · 天纪·紫微详解·第五章紫微十二宫详解·第四例（PDF 第84页）"},{"t":"二百七十三、第四例：天梁在午与\"天仓\"","h":"《太清神鉴》的\"天仓\"与三种读法","c":"要点——**第四例引了一部古籍，并给了\"天仓\"的三种读法**：\"**3、面相：天仓下陷。《太清神鉴》：'天仓，主食禄之位。平满圆成肉丰'。'天仓为迁移宫，也就面相流年 30 岁的位置，位于眼尾与眉尾处的上方'。**\" **而后给了三种\"天仓下陷\"的读法**：**①\"人得重病，天仓黑黑的陷下去了\"**（**病重之象**）；**②\"如果有人精神好、天仓下陷，表示食之无味——他老是在担忧什么，吃了东西没有消化吸收\"**（**忧思之象**）；**③\"又表示夫妻缘分浅，情感易不稳定\"**（**情感之象**）。** **另两条**：\"**有黑痣陷缺者，有军中之难也**\"；\"**天仓黑痣乱纹，预示着夫妻感情不和谐、缘分极浅、互相猜忌，还会有第三者、婚外情等感情纠葛**\"；\"**地库整体下凹有牢狱之灾**\"。** **须说明**：**这是讲义引《太清神鉴》对\"天仓\"的论述**；**其可用的核极窄**：**\"天仓位于眼尾与眉尾上方、为迁移宫、主 30 岁\"是一套固定的部位定位**（**可核其是否被一致使用**），**而\"天仓下陷→病重／忧思／婚变\"不可核**；**⚠ 须重点标**：**这三种读法里，第①条涉及\"病重\"**——**而\"面色／部位变化\"可能与真实的营养、内分泌、慢性病相关**（**如面颊凹陷可见于消瘦、消耗性疾病**），**所以正确的处置是\"面色形体异常应就医查明原因\"，而不是\"读成命象\"**；**第③条\"天仓乱纹→婚外情\"更是把\"面部纹理\"与\"伴侣忠诚\"绑在一起**，**其后果是\"以貌疑人\"，本集不采**。","o":"TJ-0747 · 天纪·紫微详解·第五章紫微十二宫详解·第四例·面相（PDF 第84页）"},{"t":"二百七十三、第四例：天梁在午与\"天仓\"","h":"\"孤星独守\"：一星独守一宫的四读","c":"定义——**第四例的第四条要点，给了\"孤星独守\"的完整规则，且含一句极冷酷的实用话**：\"**4、孤星独守：左辅、右弼、八座、三台。'如果一星独守一宫，表示一辈子孤单，孤苦伶仃——在那宫，那一宫孤单'。**\" **四读（照录）**：**①\"在父母宫，父母单一\"**；**②\"在夫妻宫，会离婚——但是也要太阳亮不亮、有没有化忌，再定结果\"**；**③\"如果在命宫，主孤单一辈子\"**；**④\"如果在父母宫，主单亲；如果在夫妻宫，表示二婚，就是一定会离婚；如果在福德宫，那很惨\"**。** **另有一条正面的规定**：\"**福德宫最好有紫微星，还有辅、弼两星最好。'光有紫微星没有辅、弼星也不行'。**\" **而最值得记的是最后那一句**：\"**如果在命宫，表示生下来就是佐才，为辅佐之才，如当助教、老板助理。'是老板就找这样的人——他命中孤单，能随叫随到'。**\" **\"是老板就找这样的人，他命中孤单，能随叫随到\"这十四个字，是全书最赤裸的一句\"用人逻辑\"**：**它把\"孤单\"直接翻译成\"可用性\"**（**因为\"孤单\"，所以\"没有别的事要顾\"，所以\"随叫随到\"**）。** **须说明**：**这是讲义对\"孤星独守\"的规定**；**其可用的核极窄**：**\"一星独守一宫\"是可核的结构判断**（**能数出\"这一宫有几颗星\"**），**而\"独守→孤单→二婚→很惨\"不可核**；**⚠ 须重点标**：**\"是老板就找这样的人\"这一句，作为\"用人建议\"是危险的**——**它把\"员工的孤独\"当作\"组织的资源\"**（**而这恰好是\"过度索取\"的起点**）；**本集照录这句原话（因为它真实反映了某种用人观），但不认同其正当性**。","o":"TJ-0748 · 天纪·紫微详解·第五章紫微十二宫详解·第四例·孤星独守（PDF 第84~85页）"},{"t":"二百七十三、第四例：天梁在午与\"天仓\"","h":"\"廉贞庙七杀旺＝积富；廉贞陷七杀陷＝横死\"","c":"要点——**第四例末尾给了\"同组合、庙陷相反\"的对照，极清晰**：\"**此人未宫：'廉贞庙、七杀旺，表示积富，累积财富'。'如廉贞陷、七杀陷，表示横死'。**\" **这一条是全册\"庙旺落陷\"作用最直接的一次示范**：**同一组星（廉贞＋七杀），只因\"庙旺\"与\"落陷\"之差，结果从\"积富\"变成\"横死\"**（**即：在这套体系里，\"星的性质\"不是固定的，\"星的强度\"才决定吉凶方向**）。** **而这一层与前章\"入庙则有预警、落陷则无预警\"是同一原理**（**\"庙\"＝力量用在明处、可控；\"陷\"＝力量用在暗处、失控**）。** **须说明**：**这是讲义对廉贞七杀的规定**；**其可用的核极窄**：**\"庙／旺／平／陷\"是一套可查的强度等级**（**可核其是否被一致使用**），**而\"积富／横死\"不可核**；**⚠ 须重点标**：**\"横死\"这个词在本册出现过三次（廉贞七杀\"半路埋尸\"、廉贞破军\"水中作塚\"、廉贞贪狼\"横夭\"），而三处都是\"以星断死法\"**——**本集统一处置：照录其规则，同时明确\"不可据命盘预言任何人的死亡方式\"，尤其不可对当事人说出口**。","o":"TJ-0749 · 天纪·紫微详解·第五章紫微十二宫详解·第四例·命宫（PDF 第85页）  ---"},{"t":"二百七十四、化忌的位置与\"半空折翅\"","h":"\"化忌在本宫力小，在对宫最凶\"","c":"要点——**第四例给出了\"化忌在何处\"的强弱规则，这是本册一条重要的技术规定**：\"**此人命宫在申宫，看三方四正，加上辰宫巨门星陷落和子宫太阳星陷落——'这已经是杀星了'。对宫迁移宫为寅宫，太阴星化忌。'当化忌在本宫时杀的力量还小一些，问题不是很大；这个化忌在对宫'；'三方的巨门、太阳已经煞聚了，对宫化忌再冲，麻烦的事就多了'。**\" **两条规则（须记）**：**①\"化忌在本宫时，杀的力量还小\"**；**②\"化忌在对宫（冲）时，力量最大\"**；**③\"大限化忌算十年、流年是一年，但危害都是一样\"**（**即：不论十年还是一年，\"伤害的强度\"不随时间尺度打折**）。** **据此推出的\"格\"**：\"**两边不是太阳星陷和巨门陷，而是擎羊、陀罗、火星等小杀星也一样——反正都不好。对宫是化忌，这也是一格，叫\"半空折翅格\"。就是说中年时，30 岁左右，这个象是一个定律：30 岁左右，出现先天性绝症。还有一种是后天有灾星进来。**\" **须说明**：**这是讲义对化忌位置与\"半空折翅格\"的规定**；**其可用的核极窄**：**\"化忌在本宫／对宫\"是一个可核的盘面位置**（**能指出化忌落在哪一宫**），**而\"必在 30 岁左右出先天性绝症\"不可核**；**⚠ 须重点标**：**这一条是全书对读者心理影响最大的断言之一**——**\"你 30 岁左右会有先天性绝症\"若被当作预言说出口，其伤害远大于所谓\"预警\"**。** 本集统一处置**：**照录\"半空折翅格\"这一术语的构成（对宫化忌＋三方煞聚），但明确\"不可据此向任何人预告疾病与死亡年龄\"**；**若确有身体异常，唯一正确路径是就医检查，不是看盘**。","o":"TJ-0750 · 天纪·紫微详解·第五章紫微十二宫详解·第四例·三方四正（PDF 第86页）"},{"t":"二百七十五、\"将星得令\"与\"吉星不要太早\"","h":"\"吉星不要来得太早，后面就会惨\"","c":"要点——**第四例的田宅宫，给了\"将星得令格\"的定义，而紧接着一句关于\"时机\"的判断极精**：\"**田宅宫：此人武曲、破军，两个武官星相会。'如果此宫为命宫，也叫将星得令格'。这里是讲命，'男人拿武官星最好，出来就化将'。'如果是 32–41 岁，或者是 44–53，是不是可以当将军了'。**\" **而此例的落点是**：\"**此例是 92–101，在这里就不能批武官了，因太老，时机已过。**\" **由此引出一句极重要的通则**：\"**'算命的时候，将星入男命最好，入女命有一个忌讳'。**\" **以及本册最警醒的一句之一**：\"**'所以人的吉星不要来得太早，后面就会惨。比如：经常看到很多天才儿童，到后来都没有消息了'。**\" **这一句的分量在于它承认了\"吉凶有时机\"**：**同一颗\"将星\"，在 22 岁是\"少年得志\"，在 92 岁就\"不能批\"**（**因为\"用不上了\"**）。** **而\"吉星不要太早\"这一层，脱开命理极有说服力**：**\"早\"意味着\"在被训练之前就获得了结果\"**（**而\"天才儿童后来没有消息\"这件事，在现实中确有大量案例可查**）。** **须说明**：**这是讲义对\"将星\"与\"时机\"的论述**；**其可用的核**：**\"吉星来得太早反而坏事\"这一判断，在人才成长语境下可成立**（**与\"早慧者的后续发展\"这类研究问题相关**）；**⚠ 须标**：**\"武官星在女命有忌讳\"\"92 岁不能批武官\"属命理与旧说**，**尤其\"入女命有忌讳\"是把\"女性不宜掌权\"写进了规则**（**本集只记其存在，不采其义**）。","o":"TJ-0751 · 天纪·紫微详解·第五章紫微十二宫详解·第四例·田宅宫（PDF 第86页）"},{"t":"二百七十六、\"雄宿朝垣\"与\"眯眯眼\"","h":"\"发两种人：军人与商人\"","c":"定义——**第五例（紫微在辰、命在亥，1967 年 2 月 10 日，阴女）开篇给了一个\"格\"**：\"**紫微星在辰宫：'廉贞在申宫、贪狼在寅宫，或贪狼在申宫、廉贞在寅宫，这叫雄宿朝垣格'。**\" **此格的三条断语（照录）**：**①\"发两种人，一为军人，二为商人（生意人）\"**（**唯一的\"两业\"格**）；**②\"商人的命宫和财帛宫，一定要有化禄\"**（**即：走商路须\"化禄\"到位**）；**③\"雄宿朝垣的人一定会出将入相——武职人出将入相；生意人一定会当老板\"**。** **而它的\"短板\"也被点明**：\"**'此八字之人后期会毁在桃花上'。'过去说这个人命很好，交桃花后会破财，说的就是雄宿朝垣的命'；'有的桃花好，有的不好'。**\" **另有一条极生动的\"面相判定法\"**：\"**面相：眯眯眼。'比如一群男人在聊天，突然进来一靓女，其他人都没有变脸色，其中一人变成眯眯眼，眼睛眯成一条缝——就是他成格，就是这个命格'。'男女一样都好色，甚至有的女人比男人更好色'。**\" **须说明**：**这是讲义对\"雄宿朝垣格\"的规定**；**其可用的核极窄**：**\"廉贞与贪狼分居寅、申二宫\"是明确的结构条件**（**可核**），**而\"必为军人或商人、必出将入相\"\"好色\"不可核**；**⚠ 须重点标两点**：**①\"眯眯眼就是好色\"这一类\"面相判定\"，其推论力为零**（**人在看到吸引自己的对象时眯眼，是普遍的生理反应，与\"好色成性\"无关**）；**②\"女人比男人更好色\"这句是旧说＋调侃，不可采**。","o":"TJ-0752 · 天纪·紫微详解·第五章紫微十二宫详解·第五例（PDF 第87页）"},{"t":"二百七十六、\"雄宿朝垣\"与\"眯眯眼\"","h":"一句难得的\"职业伦理自述\"","c":"要点——**第五例中有一段，是全书极少见地\"自己给自己划了一条线\"，须完整记**：\"**女人文曲、文昌会到太阴星时，会有桃花。杨贵妃就是。'当批到女人文曲、文昌会太阴星为桃花，但我们不要说出来——这是女人的私事，说出来可以惹出麻烦事来'。**\" **这一句的分量，不在\"桃花\"这个断语，而在\"不要说出来\"这个自我约束**：**它承认了\"有些看得出来，但不该说\"**（**而理由不是\"不准\"，是\"会惹麻烦\"——即：会损伤当事人**）。** **而紧接的下一句则转了向**：\"**紫易奇缘曰：男人遇到文曲、文昌同宫在丑，因有文化修养，往往内色（好色），不流露出来，暗自手淫。**\" **须注意\"紫易奇缘曰\"这个署名**：**它是编者自己附的评论，不是讲义原文**（**而这一条的内容，把\"读书人文昌文曲\"与\"暗自手淫\"直接挂钩，属无从验证的私德揣测**）。** **须说明**：**本集对这一段的两层处置**：**①\"不要说出来，这是女人的私事\"这一句，作为\"职业伦理的自觉\"，值得单独记下**（**它比全书其它地方的\"断人隐私\"要克制得多**）；**②\"紫易奇缘曰\"那一句，标为\"编者附评、属私德揣测，不予采信\"**。** **⚠ 一并标明**：**两段的标准不应不同**——**若\"女人的私事不该说\"，则\"男人的私事\"同样不该说**（**而这一处恰恰是\"一放一收\"，可核其双重标准**）。","o":"TJ-0753 · 天纪·紫微详解·第五章紫微十二宫详解·第五例·文昌文曲（PDF 第88页）"},{"t":"二百七十七、\"清官也误国\"","h":"\"清且明才是好官，明就是适时而作\"","c":"要点——**第六例（紫微在巳、命在酉，1994 年 2 月 28 日，阳女）有一段论\"太阴在子\"，落到一句极精的判断**：\"**太阴星在子宫，子时晚上（23:00–1:00）为月亮最亮的时候，这叫\"水澄桂萼\"。表示清明，当官是大清官。'清官不一定是好官，清官也误国。清且明才是好官——明就是适时而作'。**\" **\"清官也误国\"这四个字，脱开命理是一句真正的政治观察**：**\"清\"是操守（不贪），\"明\"是判断（能断）**——**而\"只有操守、没有判断\"的官，会因为\"道德上无懈可击\"而更难被纠正**（**他以\"我是清白的\"为理由，拒绝承担后果**）。** **而\"明就是适时而作\"这一句，给\"明\"下了操作定义**：**不是\"看得清\"，而是\"在对的时机做对的事\"**（**即：明＝判断力＋时机感**）。** **这一层与《人间道》的\"知临\"\"知柔知刚\"是同一路数**（**可核其内在一致**）。** **须说明**：**这是讲义对\"水澄桂萼\"格的论述**；**其可用的核**：**\"清≠明\"\"清官可能误国\"这一判断，在任何治理语境下都成立**（**可举史例，但本集不添讲义之外的例证**）；**⚠ 须标**：**\"太阴在子→必为大清官\"属命理断言**。","o":"TJ-0754 · 天纪·紫微详解·第五章紫微十二宫详解·第六例·太阴在子（PDF 第90页）"},{"t":"二百七十八、日月三格","h":"\"日月夹命\"\"明珠出海\"\"日月并明\"","c":"定义——**全书\"日月\"相关的三个格，在这一段里被一起给出，须逐一定义**：**①\"如果命宫在丑宫，左右为太阳和太阴，是日月夹命——就是日月夹财，主一世不缺财，一世荣华\"**；**②\"紫微星在午宫：太阳星一定在卯宫（5:00–7:00），命宫在亥，这叫月朗天门；太阴星一定在亥宫（21:00–23:00）\"**；**③\"如果命宫在卯，卯为东方、为雷，所以叫日照雷门\"**；**④\"如果命宫在未宫，左边是月朗天门、右边是日照雷门，这叫明珠出海格——也叫日月并明格\"**。** **而\"明珠出海\"有一句极妙的判语**：\"**'明珠出海格的人 24 小时都是明的，随时可看出谁是小人'。**\" **另两条（照录）**：**\"如果此格为女命，主父母双全，再看她的日月饱满\"**；**\"男人太阳星在卯宫最好，女人太阴星在亥宫最好。如果反背就不好\"**。** **须说明**：**这是讲义对日月三格的规定**；**其可用的核较松但清楚**：**三格都是\"太阳、太阴与命宫的相对位置\"**（**可核其位置条件是否被一致使用**——**而\"日月反背\"（太阳在夜宫、太阴在昼宫）与\"日月并明\"（各在其位）是一组对照，这一对是全书最自洽的配对之一**）；**⚠ 须标**：**\"日月夹命→一世不缺财\"\"明珠出海→随时可看出谁是小人\"属命理断言**，**而\"看出谁是小人\"这类能力断言尤须警惕**（**它会让人以\"我看得出\"为理由，对他人下不可反驳的判断**）。","o":"TJ-0755 · 天纪·紫微详解·第五章紫微十二宫详解·第五至七例·日月格（PDF 第89~93页）"},{"t":"二百七十九、必须剔除的一处与必须警告的一处","h":"①\"暗权女人\"段中的族群贬损","c":"风险——**第四例论\"暗权\"（女命得武曲破军）时，有一段包含明确的族群贬损，本集不予转录**。**原文的论点是**：\"**暗权的女人很可怕，疑心重，容易跟踪监视丈夫，最后会害到自己**\"；**继而以\"鼻形\"断\"财\"**：\"**有的鼻孔很紧、看不到，这都是小气鬼，一毛不拔，是吝啬鬼**\"；**随后举了一个\"例证\"，以某一族群的鼻形断言\"都是没有财的、身无恒产\"**。** **本集处置**：**①前一句\"暗权女人疑心重、跟踪监视丈夫\"，作为\"人格描述\"照录**（**但其前提\"女人不该有权\"不采**）；**②\"以鼻孔形状断吝啬\"标为\"面部特征与人格的无效关联\"**；**③以族群举证的这一段，整段剔除，不予转录**（**理由是：它以\"族群的体貌\"为对象作整体性的\"无财\"断言，属于对特定群体的贬损，且其推论基础为零**）。** **须说明**：**剔除不等于\"原文没有\"**——**本集照实记下\"此处原文含族群贬损表述、已剔除\"，以便读者知道缺口在哪**；**⚠ 须重点标**：**\"以鼻形／眼色／体貌断人贫富与品性\"这一整套做法，与殖民时代以来的\"体貌决定论\"同源**（**而它已被历史反复证伪**）——**这是本册最不该被\"当知识\"收进去的部分**。","o":"TJ-0756 · 天纪·紫微详解·第五章紫微十二宫详解·第四例·暗权（PDF 第86~87页）"},{"t":"二百七十九、必须剔除的一处与必须警告的一处","h":"②\"改阳使丈夫犯桃花以便离婚\"","c":"风险——**第四例里还给了一条\"术的应用\"，其内容涉及操纵他人情感，须照录并严标**：\"**再比如丈夫在外花天酒地，妻子想与他离婚，又怕他打，可以改阳，使先生犯桃花——外面的女人非要嫁给他不可，这样离婚就会比较顺利。**\" **这一条须拆成三层来看**：**①它的\"前提\"里已经藏了一个严重事实——\"又怕他打\"**（**即：这个场景里存在家庭暴力**）；**②它的\"手段\"是\"改阳宅的方位，去催动丈夫的桃花\"**（**即：用风水手段改变第三方的行为**）；**③它的\"目的\"是\"让离婚顺利\"**。** **本集处置**：**①照录此条，因为它真实反映了这套体系里\"术可以被这样用\"**；**②但须明确标为\"危险之术，不予认可\"**——**理由有三**：**(a) 以\"改阳宅\"去影响一个不在场的第三人的情感与婚姻选择，是对他人意志的操纵**；**(b) \"怕他打\"说明当事人处于家暴风险中，此时最需要的不是\"风水技巧\"，而是安全与法律支持**；**(c) 即使\"离婚顺利\"这个结果成立，也无法证明是\"改阳\"起的作用**（**因为离婚本身是双方行为的结果**）。** **⚠ 须重点标**：**遭遇家暴的处置顺序是\"先保安全、再谈关系\"**——**可拨 110（报警）、12338（妇联维权）、12348（法律援助）；如有即时危险，应离开现场并联系可信任的人**；**不要以\"改阳宅、调方位\"替代这些路径**。","o":"TJ-0757 · 天纪·紫微详解·第五章紫微十二宫详解·第四例·阳宅（PDF 第86页）"},{"t":"二百八十、阳宅两条：生离与死别","h":"\"客厅在西北角主生离，厨房在西北角主死别\"","c":"要点——**第六例的\"阳宅\"一节只有两句，但把\"同一个方位、两种功能、两种结果\"分得很清**：\"**'客厅在西北角，主生离'；'西北角为厨房，主死别'。**\" **这一条的技术点在于\"西北＝乾位\"**（**而乾在家庭里代表\"父\"、代表\"家主\"**）——**所以讲义的意思是**：**\"客厅（对外、待客）占了乾位→家人离散；厨房（生火、饮食）占了乾位→折损家主\"**（**这是\"位\"与\"功能\"配错的两种后果**）。** **而它与前文\"西北角须为客厅或夫妻房\"的说法须并读**——**此处说\"客厅在西北角主生离\"，而更早处说\"西北方为客厅或夫妻房\"为宜**（**两处对\"西北放客厅\"的评价相反，可核其不一致**）。** **须说明**：**这是讲义对阳宅方位的说明**；**其可用的核极窄**：**\"西北＝乾位＝家主\"这一配属在全册是一致的**（**可核**），**而\"主生离／主死别\"不可核**；**⚠ 须重点标**：**\"厨房在西北角主死别\"这类断言，其伤害方式是\"让人把亲人的病与死归因到'我当初挪了灶'\"**——**而这是典型的\"自我归罪\"陷阱**（**本集明确不采此义**）。","o":"TJ-0758 · 天纪·紫微详解·第五章紫微十二宫详解·第六例·阳宅（PDF 第91页）  ---"},{"t":"二百八十一、\"自杀格\"：最高级警告","h":"原文怎么写的，与为什么必须警惕","c":"风险——**第八例（紫微在未、命在丑，1957 年 8 月 5 日，阴女）开篇即给了这样一个\"格\"**：\"**紫微星在未宫：'廉贞、贪狼落陷在亥宫，这叫自杀格'。**\" **原文的三种落点**：**①\"如果在夫妻宫，可能因感情不和自杀\"**；**②\"如果在子女宫，可能因爱情自杀\"**；**③\"如果生下来就是此命，可能先天有自杀趋势\"**。** **以及与年龄绑定的警示**：\"**假如你儿子 12–21 岁逢到此限，你就要小心，他会为恋爱自杀的，'自杀倾向很重的'。**\" **以及一句\"性格\"断语**：\"**'个性：一哭、二闹、三上吊。那你就要小心了'。**\" **讲义给的\"改运方法\"**：\"**小儿就是'去蒙之道，叫他想开'。再看他是第几子，然后用阳宅改后天的运，'让他的念改过来'。'临床上往往是什么样的命，做什么样的方位——逃都逃不掉的'。**\" **须说明（本集最高级别的处置）**：**①照录这个\"格\"的存在与原文表述**（**因为它是这套体系真实的一环，删掉就失真**）；**②但必须明确——任何\"命盘显示自杀格\"都不构成任何医学判断，也不是任何人的命运**；**③自杀念头是**可识别的医学事件**，属精神科急症，有明确的评估与干预手段**（**而\"命盘\"不在其中**）；**④⚠ 尤其危险的是\"一哭二闹三上吊\"这句——它把自杀写成\"性格表演\"**，**而后果是家人会把真实的求救信号当成\"又在闹\"，从而错过干预窗口**。** **⚠ 求助路径（须原样给出）**：**全国心理援助热线 12356；北京心理危机研究与干预中心 010-82951332；如有即时危险，立即拨 120／110，或陪同前往就近医院急诊**；**\"叫他想开\"不能替代专业治疗**——**抑郁症是可治疗的疾病，不是\"念头不对\"**。","o":"TJ-0759 · 天纪·紫微详解·第五章紫微十二宫详解·第八例（PDF 第94页）"},{"t":"二百八十二、\"一念之间\"","h":"\"就算你的命是最凶的格，都会变成最好的格\"","c":"要点——**第八例在讲完\"日月并明格\"之后，说了一段全书最有分量的话，须完整记**：\"**'所以做人不做聪明之人，在做听明（高明）之人。就算你的命是最凶的格，都会变成最好的格——了解我的意思吗？一念之间。如果你的念是对的，我们可以把一个人的时空马上缩短'。**\" **这段话是全书对\"命与念\"关系最完整的一次表述**，**须拆三层**：**①\"不做聪明之人，做听明之人\"**（**\"聪明\"是反应快，\"听明\"是听得进**——**而这一层与\"需卦老好人\"\"讼卦能言善辩\"两处形成对照：能说与会听，是两件事**）；**②\"最凶的格可以变成最好的格——一念之间\"**（**即：格的吉凶不是终局，\"念\"可以改写它**）；**③\"如果你的念是对的，我们可以把一个人的时空马上缩短\"**（**\"缩短时空\"——即：不必等十年大限走完，念一转，处境就变**）。** **须说明**：**这是讲义的核心主张之一，也是全书\"自我修正\"的逻辑支点**（**它让\"命理\"不成为宿命论**）；**其可用的核**：**\"认知改变可以缩短痛苦的持续时间\"这一层，在心理干预里是成立的**（**认知行为治疗的核心假设正是\"改变解释方式即改变体验\"**）；**⚠ 而须并读同一节的另一句**：\"**临床上往往是什么样的命，做什么样的方位，逃都逃不掉的**\"——**这一句与\"一念之间可以改写\"直接冲突，可核其自相矛盾**（**本集两存，并标明这一处冲突**）。","o":"TJ-0760 · 天纪·紫微详解·第五章紫微十二宫详解·第八例·日月并明（PDF 第95页）"},{"t":"二百八十三、编者的一次公开反驳","h":"\"我感觉倪师对上面各格分析的有些过重了\"","c":"要点——**这是全册最重要的一处\"编者自己的话\"，须完整照录**：\"**'紫易奇缘：我感觉倪师对上面各格分析的有些过重了。我举几个例子——**\" **而后给了三个反证**：**①\"左图是林青霞的命和父母宫。她的父亲林维良（1920—2006），山东莱阳人，年轻时是一位国民党军医，1948 年随部队赴台，退役后夫妻俩开过医疗门诊部、办过服装厂、经营过饭庄酒店。2006 年 5 月，林维良 88 岁病逝于台北市\"**（**即：与\"某格风险极高于兵祸\"的断言不符**）；**②\"另一个是主持界名嘴周某，他的命宫未，卯宫是大限 42–51 岁——'只是事业不顺而已，并没有死于兵祸之中'\"**；**③\"下面是老蒋的，他的紫微在丑，命宫和武曲都在运程范围之内——他的事情众所皆知（略）\"**。** **须说明**：**这是编者在书内公开质疑原讲法\"过重\"**（**并给出\"真实人物＋真实结局\"的反证**）——**而这一处的价值极高，因为它示范了\"如何检验一个格\"**：**不靠辩论，靠\"找一个符合条件但结局不符的人\"**。** **⚠ 而须一并标明三点**：**①编者所举三例仍属\"个案对照\"，不是系统检验**（**要判断一个格是否成立，需要的是\"所有符合条件者的结局分布\"，而不是挑几个例子**）；**②三例中的人物身份、生卒、经历均可外部查证**（**这是难得的\"可核\"部分**）；**③编者此处的立场，与\"倪师原讲\"不同**——**本集两者都记，不替任一方站台，只标明分歧点在哪**。","o":"TJ-0761 · 天纪·紫微详解·第五章紫微十二宫详解·第八例后编者按（PDF 第95页）"},{"t":"二百八十四、\"格\"因行业与作息而变","h":"泛水桃花与夜班反背","c":"要点——**第七例给出了两条极有意思的\"条件式\"**，**它们说明同一个格在不同条件下结果会反转**：**①\"如果女命在子，贪狼守值，子为水宫，此女命犯桃花，叫泛水桃花。'如果女孩在演艺界就会出名，名声很大；在其它行业，则名声不好'。'贪居亥子，都为泛水桃花，就是桃花之命'。**\"（**即：同一个\"桃花\"，在演艺界是\"名气\"，在别的行业是\"坏名声\"**——**可见\"吉凶\"取决于\"场域\"，而不是星本身**）；**②\"如果命宫在午宫，32–41 岁在卯宫会到太阳星，为日照雷明格，为正官带，'白天上班，大旺，大发'。'如果上的是夜班则为反背'，女孩子会在酒店里做事情。**\"（**即：同一颗\"太阳\"，\"白天工作\"得旺，\"夜间工作\"就成\"反背\"**）。** **须说明**：**这是讲义对\"泛水桃花\"与\"日照雷明\"的规定**；**其可用的核极窄**：**\"落在哪个领域、什么时候工作\"是可核的处境**（**而\"同一特质在不同场域有不同评价\"这一层，脱开命理是成立的**：**同样的外向、表演欲，在演艺业是资产，在需要安静的岗位上就是负债**）；**⚠ 须标**：**\"在其它行业则名声不好\"\"上夜班的女孩子会在酒店里做事\"属行业偏见与命理断言**（**而后者尤其把\"夜班\"与\"特定职业\"绑定，是对夜班劳动者（医护、警务、物流、安保）的贬损，本集不采**）。","o":"TJ-0762 · 天纪·紫微详解·第五章紫微十二宫详解·第七例（PDF 第92~93页）"},{"t":"二百八十五、\"七杀朝斗\"与\"爵禄\"之辨","h":"\"爵代表社会地位，禄代表财禄\"","c":"定义——**第九例给了\"七杀朝斗／仰斗\"两格，并给\"爵禄\"下了明确界定**：\"**'七杀在寅申宫坐命，称为七杀朝斗格；七杀在子午宫坐命，则是七杀仰斗格'。'七杀朝斗格一辈子爵禄荣昌——爵代表社会地位，禄代表财禄'。**\" **而\"紫府坐垣\"的构成也在此给出**：\"**'紫微、天府在申宫，这叫紫府坐垣，或称紫府同宫格'；'七杀一定在寅宫，这叫七杀朝斗'。**\" **另两条**：\"**太阳在巳宫、太阴在酉宫，如果命宫在丑宫，这叫日月并明格。主一世英明，一辈子荣华，左右逢源**\"；\"**太阳在巳宫、巨门星在亥宫，这叫巨日格；太阳、巨门同宫也成此格。如果在命宫，生下来就是豪门宅地之家；如果父母宫为巨日格，爸爸妈妈有钱，祖业很大，会继承祖业**\"。** **须说明**：**这是讲义对这几个格的定义**；**其可用的核较松但清楚**：**\"爵＝社会地位、禄＝财禄\"这一对区分，是全册里对\"成功\"最细致的一次拆解**（**即：名与利是两回事，可兼得，也可只得其一**）——**而这一层脱开命理也成立**；**⚠ 须标**：**\"主一世英明\"\"生下来就是豪门\"\"必继承祖业\"属命理断言**。","o":"TJ-0763 · 天纪·紫微详解·第五章紫微十二宫详解·第九例（PDF 第97页）"},{"t":"二百八十六、一处明确的错误：标题与内容不符","h":"\"十二地支六冲\"下的内容是六合","c":"风险——**第九例里有一处**必须记下的错误**，**它的危害在于\"会被照抄进笔记\"**：**原文小标题写的是\"十二地支六冲\"，而其下所列为**\"子丑合土，午未合火，寅亥合木，卯戌合火，辰酉合金，巳申合水\"**。** **本集的核对（逐条）**：**①这六组是\"六合\"，不是\"六冲\"**（**六合＝两两相合；六冲＝子午、丑未、寅申、卯酉、辰戌、巳亥相冲**）——**所以标题与内容**不符**；**②\"午未合火\"亦与通行说不同**（**通行多作\"午未合土\"或\"午未为日月之合\"**，**而此处作\"火\"**）；**③而这一节前一句\"紫微十二宫，两宫相对，地支都是相克关系\"**也不完整**（**子午（水火相克）、寅申（金木相克）、卯酉（金木相克）、巳亥（水火相克）可称相克；而丑未、辰戌是\"土见土\"，属\"同类\"而非相克**）。** **须说明**：**这三处都是\"可核\"的问题**（**对照通行命理文献即可判**）；**本集处置**：**照录讲义原文，但在旁注明\"标题应为六合\"\"午未合火与通行说不同\"\"'都是相克'不成立于丑未辰戌\"**——**理由很简单**：**读者照抄\"六冲\"三个字，就会在下一本笔记里把六合当六冲用**，**而这个错误会一路传下去**；**⚠ 一并标明**：**本集对\"六合／六冲\"只在\"记录这套系统的规则\"这一层发言，不认其预测效力**。","o":"TJ-0764 · 天纪·紫微详解·第五章紫微十二宫详解·第九例（PDF 第97页）"},{"t":"二百八十七、比卦起首：药炉与桔树","h":"\"药炉高处闲置\"与\"桔树开花主晚发\"","c":"要点——**比卦（水地比）的爻位表与图解都照录**：**上六\"比之无首，凶\"；九五\"显比，王用三驱，失前禽。邑人不诫，吉\"；六四\"外比之，贞吉\"；六三\"比之匪人\"；六二\"比之自内，贞吉\"；初六\"有孚比之，无咎。有孚盈缶，终来有它吉\"。** **占例**：\"**水地比，此卦为陆贾将说蛮，卜得，果胜蛮王归降也**\"（**\"陆贾说南越\"是汉初史事**）。** **卦义**：\"**相亲相依、和顺贞吉**\"。** **图解（两条极精）**：\"**'秀才饮酒望月，为举杯对月，自酌自饮、其乐盈盈，也示才智之人无忧之象；酒为忘忧之物，孤独之象'。'药炉高处闲置，表示无病无灾、身体健康，无须用药'。'桔树开花主晚发，大器晚成之象'。**\" **其中\"药炉高处闲置，表示无病无灾、无须用药\"这一句，是本册少见的一条\"正面取象\"**：**它把\"药炉闲置\"读成\"健康\"，而不是\"药无效\"**（**即：最好的状态是\"用不上药\"**）——**而这一层与《人间道》比卦\"三驱\"（不赶尽杀绝）的取向一致**。** **须说明**：**这是讲义对比卦的著录**；**其可用的核**：**爻辞与卦辞是《易》原文**（**可核**），**而\"酒＝忘忧＝孤独\"\"桔树＝晚发\"是卦图取象**；**⚠ 须标**：**\"药炉闲置＝无病\"这类取象不可反过来用**（**不可因\"药炉闲置\"就判定自己没病、停药**——**\"无须用药\"的判断只能由医生做出**）。","o":"TJ-0765 · 天纪·紫微详解·第四章卦象详解·水地比（PDF 第98页）  ---"},{"t":"二百八十八、第六次验证：比卦的符号","h":"\"×○××××\"与\"雷地豫\"的自洽","c":"数据——**比卦给了第六个可核的符号，且这一节还带出一处**跨章自洽**，须一并核**。**原文**：\"**水地比卦：'×○××××'（船得顺风）上吉。**\" **本集核对卦体**：**水地比＝坎上坤下；下卦坤（初六阴、六二阴、六三阴）、上坎（六四阴、九五阳、上六阴）**（**即自下而上：阴、阴、阴、阴、阳、阴**）。** **比对**：**自左向右得\"阴、阳、阴、阴、阴、阴\"——不符**（**第二爻应是阴**）；**自右向左得\"阴、阴、阴、阴、阳、阴\"——完全吻合** ✓。** **六次验证**：**屯、蒙、需、讼、师、比，\"自右向左\"六次全中、\"自左向右\"六次全错**。** **而本节的第二处可核，是\"变局\"规则的自洽**：**需卦说\"长兄一结婚，立刻变成雷天大壮局\"**（**雷天大壮＝震上乾下**）；**比卦说\"长兄结婚此局立变，请看雷地豫卦\"**（**雷地豫＝震上坤下**）。** **两卦对照即可还原这条规则**：**①\"二子住父位（乾）＝需\"，长子婚后→\"震（长男）＋乾＝大壮\"**；**②\"二子住母位（坤）＝比\"，长子婚后→\"震（长男）＋坤＝豫\"**——**即：长子成家后\"归位为震（长男）\"，并接管原先二子所占的那个位，卦由\"新住者（震）＋原位\"重算。** **这说明全书\"名位\"体系是**可以自洽复算的**（**不是随意贴卦名**）。** **须说明**：**这是本集第六次符号核验，另加一处\"变局规则\"的自洽复算**；**其可用的核极准**（**卦体固定、符号原文、加法定性**）；**⚠ 而须标**：**\"变局\"的\"必致某果\"不可核**——**可核的只是\"卦名算得对\"，不是\"生活真会如此\"**。","o":"TJ-0766 · 天纪·紫微详解·第四章卦象详解·水地比·文王金钱课（PDF 第99页）"},{"t":"二百八十九、比卦：哥们义气","h":"\"有求必应……欠缺考虑，逞强好胜，拔刀相助\"","c":"要点——**比卦\"性格\"段写的是另一种人格，与需卦的\"老好人\"恰成一对**：\"**上坎下坤，属土克水，不利于中男。'比卦注重哥们意气，心性善良、乐于助人，生活在女人圈中的哥们；只要您说，有求必应，义不容辞，关心亲朋好友、兄弟姐妹，家庭和悦，荣华富贵'。'遇到事情欠缺考虑，逞强好胜，拔刀相助'。健康主肾和耳、孕妇主易流产，男主肾功能差、人丁稀少。**\" **这一段的四层**：**①\"注重哥们意气\"（关系取向）**；**②\"心性善良、乐于助人、有求必应、义不容辞\"（行为）**；**③\"欠缺考虑，逞强好胜，拔刀相助\"（代价）**；**④\"家庭和悦，荣华富贵\"（结果）**。** **与需卦\"利他不利己、活在别人的看法里\"相比**：**需卦的\"利他\"是\"在意评价\"，比卦的\"利他\"是\"在意义气\"**——**一个向内（怕被看轻），一个向外（怕不够义气）**（**而两者都\"活得很累\"，只是累法不同**）。** **续论另给了一条\"速动\"的断语**：\"**预测生意，需要良友合作，容易成功。预测婚姻，'速动可成，闪婚容易成功'。上卦中男、下卦地母，'有恋母情结'，恋爱时容易感情不稳定。坤又为众、为多，'男性脚踏多只船'；不利于女性，以防色情或甜言蜜语所害。**\" **须说明**：**这是讲义对比卦性格的论述**；**其可用的核**：**\"义气型人格\"的描述可成立**（**\"有求必应→逞强→被拖累\"是一个真实的循环**）；**⚠ 须标**：**\"闪婚容易成功\"\"男性脚踏多只船\"\"不利于女性\"属命理断言与性别定型**（**而\"闪婚容易成功\"这一条尤其须驳**：**闪婚的高风险是有据可查的，把它说成\"容易成功\"会直接误导**）。","o":"TJ-0767 · 天纪·紫微详解·第四章卦象详解·水地比·性格（PDF 第98~99页）"},{"t":"二百九十、比卦地脉道：二子住母位","h":"\"个性像母亲\"\"喜欢年长女人\"","c":"方法——**比卦\"地脉道\"给了一条与前几卦同构的规则，并含一个\"化解\"与一次\"变局\"**：\"**水地比卦：'二子居住西南母亲位'——'个性像母亲、愿意做母亲做的事'。任劳任怨，与母亲心连心、家事一手包办。'适婚年龄到时，喜欢年长女人'。**\" **三条后果（照录）**：**①\"同时出生之人，要拖后三年再结婚，否则不出一年婚必破散\"**；**②\"命中主破，婚事不成\"**；**③\"不改居住则终身不娶，但与有婚之人或离婚之女有往来，终无结果\"**。** **而\"变局\"的指向极明确**：\"**注意：'长兄结婚此局立变，请看雷地豫卦'，在下部详解里。**\" **这一条与前面两条规则的配比是**类同的**（**震为中男？不——坎为中男、震为长男**）：**\"二子\"＝坎（中男），\"母位\"＝坤**，**合为\"水地比\"**；**长子婚后归\"震\"，接管此位则成\"雷地豫\"**（**可核其自洽，见前条**）。** **另有一条\"化解\"**：\"**面相：'耳垂（耳珠）朝向嘴的方向，往往发晚'——'水地比卦可化解这种面相'**\"；**以及**\"**如果看到女命是巨日格的，太阳是平、不亮；或者是武曲、破军入命的，这都是'偏房命'。男人如果遇到这两点，则为终身不娶。'化解这种命就是用水地比卦'**\"。** **须说明**：**这是讲义对比卦地脉道的说明**；**其可用的核极窄**：**\"二子居母位→比\"在卦名层面可复算**（**坎＋坤＝水地比 ✓**），**而\"必终身不娶\"\"必为偏房\"不可核**；**⚠ 须重点标**：**\"偏房命\"这个词本身带着旧式婚姻制度的烙印**（**它把\"不能成为正妻\"说成一个人的固有命运**），**本集只记其术语与\"以比卦化解\"这一套说法，不认其义**；**而\"用某个卦去化解某种面相／命格\"这一操作，其有效性无从检验**。","o":"TJ-0768 · 天纪·紫微详解·第四章卦象详解·水地比·地脉道（PDF 第99页）"},{"t":"二百九十一、小畜卦：中层辅助之才","h":"\"适合中层管理的辅助人才，不适合从商当老板\"","c":"要点——**小畜卦\"性格\"段，是全书对\"职业适配\"讲得最具体的一处**：\"**上巽下乾，上木下金、金克木，巽为长女被克，'丁财两败'。巽为风、不安分，主背井离乡，居无定所，漂泊在外。巽易招致官司是非。'小畜讲究公平合理，遇事处理讲究公平，做事有模有样——即不太贪，又不假仗义'，'适合中层管理的辅助人才，不适合从商当老板'，善于积极进取、注重心志修养、获得众多贵人相助。健康方面：'巽主风，为筋骨酸痛或瘫痪，有眼疾之兆'。**\" **其中\"不太贪，又不假仗义\"这八个字，是一个极准的\"度\"**：**\"不贪\"是底线，\"不假仗义\"是上限**（**即：既不占便宜，也不逞义气**）——**而这恰好是\"中层辅助者\"最需要的两种品质**（**因为中层既不能自作主张，也不能完全不动**）。** **而\"适合中层管理的辅助人才，不适合从商当老板\"这一句，把\"位置\"说得很清楚**：**同一组性格，在\"辅佐位\"上是优点，在\"主帅位\"上就是缺点**（**这与前章\"孤星独守＝佐才\"\"是老板就找这样的人\"是同一组的另一半：那一处讲\"老板要谁\"，这一处讲\"你该干什么\"**）。** **须说明**：**这是讲义对小畜卦性格的论述**；**其可用的核**：**\"辅助型人才的适配边界\"这一层是可讨论的**（**\"不贪＋不逞义气\"确实指向\"稳健的执行者\"**）；**⚠ 须标**：**\"丁财两败\"\"主背井离乡\"\"筋骨酸痛或瘫痪、有眼疾之兆\"属命理断言**（**而\"瘫痪、眼疾\"这类具体病症的断言，绝不可当作健康提示使用**）。","o":"TJ-0769 · 天纪·紫微详解·第四章卦象详解·风天小畜·性格（PDF 第100页）"},{"t":"二百九十二、小畜地脉道：长女代父职","h":"\"女代父职、能力强过男人\"","c":"方法——**小畜卦\"地脉道\"给的是\"长女住父位\"这一局，其描述极具体**：\"**风天小畜卦：'长女居住在西北，那是爸爸的位置'——'女儿有了爸爸的神态，主观很强、个性很强'。对家庭有了责任感，'不重视学业和婚姻'。'女代父职、能力强过男人，独立自主，不依靠他人'。**\" **而\"后果\"分两侧**：**①事业侧——\"在事业上企图心旺盛，早年为老板，事业有成\"**；**②婚姻侧——\"需要与命同参；比不在此位住的人提前两年结婚，但婚姻不成或有破。'女强人有终身不嫁的'。如果是属羊或属马的人有婚姻，但'丈夫助力不大，全靠自己之力独撑大局'\"**。** **这一条的结构值得记**：**它把\"女代父职\"的两面都写了——能力上\"强过男人、独立自主\"，婚姻上\"不重视、易破、或终身不嫁\"**（**即：这不是\"吉\"或\"凶\"，而是\"一种代价结构\"**）。** **须说明**：**这是讲义对小畜卦地脉道的说明**；**其可用的核极窄**：**\"长女（巽）住父位（乾）＝风天小畜\"在卦名层面可复算**（**巽＋乾＝风天小畜 ✓**），**而\"必破婚、必终身不嫁\"不可核**；**⚠ 须重点标**：**\"女强人有终身不嫁的\"这一类说法，在当代语境里有明显的暗示性**（**它把\"女性能力强\"与\"婚姻不幸\"绑在一起**）——**而这类说法最大的害处，是让\"能干\"这件事本身被当成一种缺陷**（**本集只记其\"代价结构\"这一层，不采\"能干=婚姻不幸\"的因果**）。","o":"TJ-0770 · 天纪·紫微详解·第四章卦象详解·风天小畜·地脉道（PDF 第101页）"},{"t":"二百九十三、小畜的\"密云不雨\"","h":"与《人间道》同名卦的呼应","c":"要点——**小畜的卦辞与《人间道》所录一致，且图解给出了\"蓄\"的具体意象**：\"**'小畜。亨。密云不雨，自我西郊。象曰：风行天上，小畜；君子以懿文德'。**\" **占例**：\"**风天小畜，此卦为韩信攻取散关不克，卜得之后，再击之，果破也**\"（**\"再击之，果破\"——即：第一次不成，第二次成，正合\"小畜\"的\"小有阻碍、终将亨通\"**）。** **图解（三条）**：\"**'水未到不能行；船停与对岸，有工具无法使用'。'望杆立在草中等信息——说明\"望\"为观望，蓄神以待时；有草字头的姓氏之人是贵人'。'一羊一马过河，说明午未日被合住'；'杨姓、马姓之人，或属马羊之人为贵人'。'双重山象征出字；一人站在山顶，孤立独行、主险不可往，也暗示人走下坡之路，为\"蓄止\"'。'下有舟横于岸上，准备出发'。**\" **其中\"船停与对岸，有工具无法使用\"这一句最精**：**它把\"小畜\"的处境写成\"条件都具备、时机不到\"**（**不是\"缺东西\"，而是\"用不上\"**）——**而这正是\"密云不雨\"的意思：云已经积够（条件齐了），雨还没下（时机未到）。** **须说明**：**这是讲义对小畜的著录**；**其可用的核**：**卦辞为《易》原文**（**可核**），**而\"某姓为贵人\"\"午未被合住\"是卦图取象**；**⚠ 须标**：**\"某姓即贵人\"这类取象会被当成\"择人标准\"用**（**而其依据为零**）——**本集只记录\"讲义这样取象\"，不作为识人依据。","o":"TJ-0771 · 天纪·紫微详解·第四章卦象详解·风天小畜（PDF 第100~101页）  ---"},{"t":"二百九十四、三才论：各占三分之一","h":"\"我们能控制的是人和地理，加起来大于命\"","c":"要点——**第六章开篇有一段全书最重要的话，须完整照录**：\"**'看的命占 1/3（天文）；运的时候占 1/3（地理）；人事的部分占 1/3（人事）——天、地、人三才'。'我们能控制的是人（易经原则）和地理（卦的变换），加起来大于命'。'人掌握人间道、运用易经原则；将卦的演绎变化运用到地理上。知道事先的结果、预防将要发生的事'。**\" **这一段的分量在于它给\"命\"定了权重**：**命只占三分之一**（**而\"运（地理）\"与\"人事\"各占三分之一**）——**由此推出的结论是\"加起来大于命\"**（**即：后天可调的两份，可以压过先天的一份**）。** **而\"我们能控制的是人和地理\"这一句，划出了\"可改\"与\"不可改\"的界**：**天（先天命）不可控；人（人间道）与地（阳宅）可控**（**而且\"可控的两份加起来大于不可控的一份\"**）。** **须说明**：**这是讲义的方法论总纲**（**而它恰是这套体系\"能自我辩护\"的关键**：**若命不可改，则\"化解\"无从谈起；若命全可改，则\"算\"就没有意义**——**\"三分之一\"这个设计，正好把两头都保住了**）；**其可用的核**：**\"先天条件只占一部分、后天努力与所处环境可以叠加超过它\"这一层，脱开命理是可讨论的**（**而这与\"遗传不是命运\"的常识相通**）；**⚠ 而须标**：**\"各占三分之一\"这个比例本身，没有任何实证依据**（**它是一个为了自洽而设的数，不是测量出来的数**）。","o":"TJ-0772 · 天纪·紫微详解·第六章案例分析·开篇（PDF 第106页）"},{"t":"二百九十五、\"谈果\"与\"谈因\"","h":"\"今天以前为命，今天以后通通可以改命\"","c":"要点——**紧接着的一小段，把\"算命\"与\"宗教\"作了区分，是全书少见的一次\"自我定位\"**：\"**'算命是谈果、是科学；宗教是谈的因、是哲学，宗教没有算命的'。'算命今天以前为命，今天以后通通可以改命'。**\" **三层**：**①分工——\"算命谈果（结果），宗教谈因（原因）\"**；**②界别——\"宗教没有算命的\"**（**即：算命不属于宗教的功能**）；**③时间的切分——\"今天以前为命（已成定局），今天以后可以改命\"**（**即：算命的对象是\"已成的果\"，而它的用途是\"改将来的因\"**）。** **须说明（本集须明确的三点）**：**①\"算命是谈果\"这一层，作为\"这套体系的自我描述\"可以记**；**②但\"算命是科学\"这个断言不成立**——**科学的核心是可检验、可反驳、可重复；而命理断言既不可反驳也不可重复**（**本集不采\"算命是科学\"这一提法**，**只记\"讲义这样主张\"**）；**③\"今天以后可以改命\"这一条，其价值不在\"命\"字，而在\"以后\"二字**（**它把注意力从\"预测\"转到了\"行动\"**）。** **⚠ 须一并标**：**宗教与\"因\"的对应也过于简化**（**宗教的核心不止是\"解释原因\"，算命也不止是\"给出结果\"**）——**但本集照录原话，不改写其逻辑**。","o":"TJ-0773 · 天纪·紫微详解·第六章案例分析·开篇（PDF 第106页）"},{"t":"二百九十六、看盘三步与\"福德宫\"","h":"①三方四正 ②四化位置 ③福德宫","c":"方法——**第一例（紫微在子、命在酉，1948 年 12 月 25 日，阳男）给了\"看一个盘的三步顺序\"，这是全书最清楚的一次\"操作流程\"**：\"**这个八字重点：'1、先看三方四正'——命的太阳、天梁；财的太阴、化权＋禄存；事业（空宫）的天魁；'命中天喜对迁移红鸾'；'2、看四化星的位置'——午宫贪狼化禄、巳宫太阴化权、子宫紫微＋右弼化科、亥宫福德天机化忌，'命中三方有权在财宫'；'3、关注福德宫的好坏、天机化忌'。**\" **而\"福德宫\"的解释极重要**：\"**福德宫：男命我们来看福德宫化忌。'福德主一世福德，化忌一世不顺、很累'。'那福德宫化忌，不会生离，那就是只有死别了'。'福德宫相当于一个人的夫妻宫'。**\" **\"福德宫相当于夫妻宫\"这一句，把\"一个人的内心状态\"与\"他的婚姻\"作了等号**（**逻辑是：内心不顺→关系必受损**）——**而这一层脱开命理其实是通的**（**一个人的内在状态会渗透到亲密关系里**）。** **须说明**：**这是讲义对\"看盘顺序\"与\"福德宫\"的规定**；**其可用的核**：**\"三方四正\"是可核的结构**（**前文已记\"三方四正必须是命、财、官、迁\"**），**而\"福德宫化忌→只余死别\"不可核**；**⚠ 须重点标**：**\"福德宫化忌，不会生离，那就是只有死别\"这一句，是本册最典型的\"预告生死\"**——**本集照录其规则，但不认可\"由一宫化忌推断配偶风险极高\"的做法**。","o":"TJ-0774 · 天纪·紫微详解·第六章案例分析·第一例（PDF 第106~107页）"},{"t":"二百九十七、\"日月反背\"的读法","h":"\"太阳快下山\"\"中午出月亮\"","c":"要点——**第一例把\"日月反背\"讲成了极具体的生活图景**：\"**命宫：看太阳在酉，'太阳快下山了'。太阴（月亮）在巳出来，'中午出月亮'，这叫日月反背。'也就是说生意做的不分黑天白日、非常辛苦'。'日月反背也主夫妻聚少散多，常在外难团聚'。**\" **这一条的技术点是\"以时间定反背\"**：**太阳在酉（17–19 时，日落）＝\"将落\"**；**太阴在巳（9–11 时，日中）＝\"错时\"**——**两星都\"不在其位\"，故曰反背**。** **而它给出的\"生活转译\"很生动**：**\"不分黑天白日\"**（**日夜颠倒**）→**\"非常辛苦\"**；**\"聚少散多、常在外难团聚\"**（**分居或异地**）。** **须说明**：**这是讲义对\"日月反背\"的读法**；**其可用的核极窄**：**\"某星落在某时辰所对应的宫位\"是可核的位置**（**可指出太阳在酉、太阴在巳**），**而\"必致辛苦、必致聚少散多\"不可核**；**⚠ 而须标**：**\"生意不分黑天白日\"这一层，现实中与\"倒班、跨境时差、创业期作息\"直接相关**（**它有真实的生活成因，不必靠星象解释**）。","o":"TJ-0775 · 天纪·紫微详解·第六章案例分析·第一例·命宫（PDF 第107页）"},{"t":"二百九十八、\"日丽中天\"的四种时龄","h":"同一格，在四个年龄段是四件事","c":"要点——**第十例（紫微在酉、命在亥，1961 年 3 月 10 日，阴男）把\"同一格在不同年龄段\"讲得最完整，是全书\"时机论\"的示范**：\"**紫微星在酉宫：太阳星在午宫（11:00–13:00），这叫\"日丽中天\"。**\" **四种落点（照录）**：**①\"如果命宫在午宫，为正格，'表示一辈子日丽中天'\"**；**②\"如果 35–44 岁逢到，这十年流年叫日丽中天，为成格，'正好是在人生精华年龄时期'\"**；**③\"如果命宫在未宫，午宫是 15–25，也是日丽中天，'代表学习很好，考试很棒，当过好多班长、委员的'，是\"小成格\"——'而成年后没有好的运程了'\"**；**④\"如果女命宫在申宫，夫妇宫在午，这日丽中天是丈夫的，'丈夫这十年日丽中天'\"**；**⑤而本命的大限 52–62 也是日丽中天——\"时间有点晚了，到了退休年龄，太阳化权拼死拼活地干，累了一身病……'太阳＋午为头部和视力出了毛病'，人的身体开始衰弱；'需要看大夫'，'化忌将前半生挣的钱花掉'\"**。** **这一组的价值在于\"同一格、五种意义\"**（**而其中第③条最警醒**：**\"小成格\"——少年时样样出色，成年后反而没有好运程**，**即：早年的\"成\"用尽了力气**）。** **另有一条\"因宫位改行当\"的对照**：\"**巨门星在戌宫、太阳星在午宫且入庙，如果命宫在寅宫，这叫'巨日会命'，主大财……'从商运好，做巨贾、大生意的'**\"；**而\"如果命宫在午宫，太阳入命，这种日丽中天就不是商人了，而是武职人员——'武职大利，最少干到参谋总长'，如果此命是武职，'职务一定会升到中将级'\"**。** **须说明**：**这是讲义对\"日丽中天\"的规定**；**其可用的核极窄**：**\"太阳在午宫\"是可核的位置**，**而\"必为巨贾\"\"必升中将\"不可核**；**⚠ 须重点标**：**\"太阳＋午为头部和视力出了毛病\"是医学断言**（**视力问题与\"太阳在午\"无任何已知关联**）——**而\"需要看大夫\"这一句是本册少见的一句正确建议，可以保留**。","o":"TJ-0776 · 天纪·紫微详解·第五章·第十例（PDF 第102~103页）"},{"t":"二百九十九、\"杀星独守\"与\"同会\"","h":"\"独守要高度重视；与吉星同会，凶大减\"","c":"方法——**第十一例（紫微在戌、命在子，1957 年 2 月 28 日，阴男）给了\"孤杀星\"的两条处置规则**：\"**'地劫陷，孤星独守在丑宫，本宫凶、对宫更凶'。'比如：流年走到孤杀星的对宫，就表示这一年是凶——为什么凶？要看八字来决定'。'杀星独守一宫一定要引起高度重视；如果杀星与吉星同会一宫，凶大减，问题不大'。**\" **两条规则须并记**：**①\"独守\"＝力量集中、无牵制→\"高度重视\"**；**②\"同会\"＝力量被分散→\"凶大减\"**（**这与前章\"杀星与吉星同会则力降\"是同一条，可核其一致性 ✓**）。** **而编者在此处加了自己的判断**：\"**紫易奇缘：这命有两次关口——大限 38–47、大限 58–67，'第一大关口很难过去'。**\" **以及一个\"化解方案\"**：\"**'上面问题不是孤杀星单一的问题，而是天伤、天使索命；地空、地劫为上一世的因果关系'；再加六煞聚集。'如果化解起来比较麻烦，还有神佛（华盖），不小心会引火烧身，空劫为灵性物质。如果遇到时最好叫他请宗教人士化解一下，你再给他调整阳宅，可渡过这一劫，到达大限 58–67 岁'。**\" **须说明**：**这是讲义与编者对\"孤杀星\"的处置**；**其可用的核极窄**：**\"独守／同会\"是盘面可数的结构**（**可核**），**而\"上一世的因果\"\"灵性物质\"\"请宗教人士化解\"属不可检验的说法**；**⚠ 须重点标**：**\"地空、地劫为上一世的因果\"是把\"无法解释的困境\"归因于\"前世\"**——**而这一归因的实际后果，是让人放弃可做的事**（**本集不采此义**）；**另标**：**\"第一大关口很难过去\"这类断言，对当事人是纯粹的心理负担，不可对当事人说出口**。","o":"TJ-0777 · 天纪·紫微详解·第五章·第十一例（PDF 第103~104页）"},{"t":"三百、第七次验证与一处必须警惕的\"观气色\"","h":"小畜的符号与\"一进门就断言他已死\"","c":"数据／风险——**本段含两件事，一件可核，一件须严标**。**①第七次符号验证**：\"**风天小畜：'○○×○○○'（密云不雨）下平。**\" **核卦体**：**风天小畜＝巽上乾下；下乾（初九阳、九二阳、九三阳）、上巽（六四阴、九五阳、上九阳）**（**自下而上：阳、阳、阳、阴、阳、阳**）。** **比对**：**自左向右得\"阳、阳、阴、阳、阳、阳\"——不符**（**第三爻应是阳**）；**自右向左得\"阳、阳、阳、阴、阳、阳\"——完全吻合** ✓。** **至此\"自右向左\"已有七次验证**（**屯、蒙、需、讼、师、比、小畜**）。** **②须最高级警惕的一段**：\"**'1、算命人一进来，就知道要算的人已经死了——观来人是命主之妻，整个脸面色发白、额头枯白，暗淡无光，残暗带丧色，命主已死'。**\" **这一段是\"以气色断生死\"的典型**——**而它的问题不在\"看不准\"，而在\"看得准也不该这样用\"**：**它把\"来者的悲伤面色\"读成\"被算者已死\"的证凭**（**而\"面色发白、无光\"在丧亲、失眠、重病陪护、贫血、黄疸等情况下都会出现**）。** **⚠ 本集处置**：**照录此段，但明确\"不可仿效\"**——**①\"面色发白、额头枯白\"有明确的医学成因，不是\"死亡信号\"**（**若自己或家人面色异常，应查血常规、肝功能、营养状态，而不是查命盘**）；**②而这段记录还有一处**可复算的算术**：**\"命主是民国 37 年（1911＋37＝1948 年）戊子年生……到算卦那年是 44 岁（1948＋44－1＝1991 年）\"**——**本集复算：民国 37 年＝1912＋37－1＝1948 年 ✓；1948＋43（实岁）＝1991 年 ✓**（**两处换算均正确，这是本册少见的\"算术无误\"**）。** **须说明**：**这是本集第七次符号核验，另附一处\"观气色\"的风险标注与两处年份复算**；**其可用的核极准**（**符号与年份都可独立复算**）；**⚠ 而\"观气色断生死\"这一做法，其实际危害是\"以貌定生死\"**——**本集明确：任何人的生死，不能由他人的面色推断，更不能由第三方转述**。","o":"TJ-0778 · 天纪·紫微详解·第四章卦象详解·风天小畜·文王金钱课（PDF 第101页）；第六章案例分析·第一例（PDF 第107页）  ---"},{"t":"三百零一、\"死色\"：最高级警告与一处剔除","h":"\"两周内能看到\"与\"黑白无常抓错人\"","c":"风险——**第一例在\"夫妻生离死别\"之下，有一段全册最危险的文字，须照录其结构并严标**。**原文**：\"**'夫妻生离死别面相：鱼尾纹只一条向下，主生离。鱼尾纹有叉，黑黑暗暗的，或印堂上白白的，主已死'。'夫妻对方未死又要死的面相：男有哭脸，主将死妻；女面大、骨粗、皮骨相连，主将死夫'。'死色两周之内都能看到'。'死之前的一个时辰前，人脸虽然有点红，脸上毛孔会发青色的，这是牛鬼蛇神已经附身了，这样是没有解的。我们算到的前一天给他做头七仪式，黑白无常就会抓错人，会逃过此劫'。**\" **本集处置（三层，须逐条看）**：**①照录其\"面相—死期\"的结构**（**因为它是这套体系真实存在的一环**）；**②但必须明确——\"死色\"\"哭脸\"\"皮骨相连\"都不是任何死亡信号**：**\"印堂发白、面色发黑\"可见于贫血、肝病、肾衰、重度失眠；\"眼眶发青\"可见于疲劳与循环不良；\"消瘦到皮骨相连\"可见于消耗性疾病与营养不良**——**这些都需要查病因，而不是\"读死期\"**；**③\"给他做头七仪式，黑白无常就会抓错人，会逃过此劫\"这一操作，本集明确剔除，不予转录细节**——**理由是：它把\"救不了\"归因于\"仪式没做对\"，会让家属在丧亲期进行无效支出，并把无可挽回的死亡变成\"可以打折的交易\"**。** **⚠ 须重点标**：**\"这是牛鬼蛇神已经附身了，这样是没有解的\"——这一句对濒死者家属的伤害最大**（**\"没有解\"三个字，直接剥夺了求助的理由**）；**而事实上任何阶段都存在可做的医疗与照护**（**即使进入终末期，也有姑息治疗、疼痛控制、心理支持可提供**）；**⚠ 另标**：**\"女面大、骨粗、皮骨相连，主将死夫\"这一条，以女性的体貌推断\"丈夫将死\"，其推论基础为零，且对女性外貌的贬损明显，本集不采其义**。","o":"TJ-0779 · 天纪·紫微详解·第六章案例分析·第一例·夫妻生离死别（PDF 第110页）"},{"t":"三百零二、\"为什么人没有死\"","h":"父母宫庙旺即\"贵人挡灾\"","c":"要点——**第一例在批流年时，自问自答了一个极关键的问题，这是全书\"护身\"机制讲得最清楚的一次**：\"**'大限 23–32 岁化忌（见图一亥宫），也是凶限——为什么人没有死呢？'看前十年 13–22 戌宫为父母宫，'主星庙旺，表示父母是他的贵人，帮他挡住灾凶，所以没有事发生'。'后面是朋友宫，寅宫 53–62 煞星会聚，朋友本来不好又无贵星挡灾'。**\" **这条规则的逻辑是**：**\"凶限\"本身不必然致祸，\"有没有贵星挡在前面\"才是关键的变量**（**即：化忌是\"压力\"，父母宫庙旺是\"缓冲\"**）。** **而这条案例的结局也照录了**：\"**此人晚上开车回来的途中被人杀死丢在水里；23–32 这十年也是诸多不顺，毕业后一直打工，领固定薪水、工作很辛苦受了不少委屈。**\" **须说明**：**这是讲义对\"凶限为何未应\"的解释**；**其可用的核极窄**：**\"父母宫庙旺／落陷\"是盘面可判的**（**可核**），**而\"父母是贵人、能挡灾\"不可核**；**⚠ 须重点标**：**这个案例涉及一起真实命案**（**\"被人杀死丢在水里\"**）——**本集只作为\"讲义所述案例\"记录，不重复细节、不作任何\"命理已预测\"的认可**；**而\"父母能挡灾\"这类说法，实际会衍生出\"父母不在就必出事\"的推论**（**那对失去父母的人是残忍的**）。","o":"TJ-0780 · 天纪·紫微详解·第六章案例分析·第一例·批流年（PDF 第109页）"},{"t":"三百零三、\"以星断死\"的两种句式","h":"\"目不见日月\"与\"最后导致被杀\"","c":"风险——**同一例里有两处\"以星断死\"的句式，须单独标出**。**其一**：\"**我们查 44 岁在巳宫，对宫天机化忌来冲，'对宫冲最凶'；巳宫中午把太阳看成了月亮，一定是眼睛闭上了，'目不见日月'——人死掉了当然见不到日月。**\"（**这是把\"星落\"读成\"眼闭\"、再读成\"人死\"**）；**其二**：\"**'43–52（在丑位，是他的官禄宫为空宫）对宫同巨，因生意产生了矛盾，官司口舌是非不断，最后导致被杀'。**\"（**这是把\"宫位组合\"直接写成\"死因\"**）。** **须说明**：**这两处都是\"以星象断死法与死因\"的典型**——**而它们的共同问题是：把\"一种解释框架\"当成了\"因果本身\"**。** **⚠ 须重点标**：**\"目不见日月\"是一个很美的意象，但它不是诊断**（**闭眼可以是睡眠、昏迷、麻醉、癫痫发作后、临终——每一种都有明确的可查环节**）；**而\"最后导致被杀\"这一句更须慎重**：**它把一起凶案的成因，归给了\"官禄宫空宫＋对宫同巨\"**——**而任何凶案都有其具体的社会、经济、人际与治安成因，不会因为某个宫位而必然发生**。** **本集处置**：**两处均照录为\"讲义原文的判断\"，同时在旁注明\"不可据此推断任何人的死亡方式或死因\"**——**尤其不可向当事人或家属说出这类话**。","o":"TJ-0781 · 天纪·紫微详解·第六章案例分析·第一例·批流年（PDF 第109页）"},{"t":"三百零四、流年数字怎么读","h":"\"父母宫（戌）1,13,25,37,49,61\"","c":"方法——**这一例给了一条极实用的\"技术说明\"**：\"**有些排盘软件不需要我们计算流年，上面都已经有了。如：父母宫（戌）'1,13,25,37,49,61'——数字是几，就是流年几岁。我们只要按着大限年龄范围去找就行。**\" **这一条的价值在于它解释了一个\"可核的编码\"**：**每个宫位上的一串数字，是\"虚岁流年\"落在该宫的年份表**（**差值恒为 12，即地支循环**）；**\"1,13,25,37,49,61\"正是\"戌\"宫的虚岁序列**（**1＝戌、13＝戌、25＝戌……**，**每隔 12 年回到同一宫**）——**本集复算：1＋12＝13 ✓、13＋12＝25 ✓、25＋12＝37 ✓、37＋12＝49 ✓、49＋12＝61 ✓**，**五步全部吻合**。** **而紧接的一段\"换算\"也须复算**：\"**'他视频说的 80 年，不是 1980 年，而是民国 80 年。孙中山创建中华民国是 1912 年，1911 年辛亥革命爆发，1911＋80＝1991，我们算卦都用虚岁，需要减去 1 岁，即 1911＋80－1＝1990 年'。**\" **本集复算：1911＋80＝1991 ✓；1991－1＝1990 ✓**（**算术无误**）。** **⚠ 但这里出现一处须记的**矛盾**：**前文（同一例）说\"到算卦那年是 44 岁（1948＋44－1＝1991 年）\"，即\"1991 年虚岁 44\"**；**而此处说\"1990 年他 44 岁\"**。** **本集复算：1948 年生 → 1990 年虚岁＝1990－1948＋1＝43 岁；1991 年虚岁＝44 岁**——**所以\"1991 年虚岁 44\"是对的，\"1990 年 44 岁\"错了 1 岁**（**同一例内前后相差一年，属内部矛盾，须记**）。** **须说明**：**这是本集对\"流年编码\"的复算（五步全对）与\"年份换算\"的复核（算术对、但两处年份自相矛盾）**；**⚠ 一并标明**：**\"虚岁与实岁的换算\"是这套系统里最容易出错的地方**（**而它一错，整条批流年就全偏一年**）。","o":"TJ-0782 · 天纪·紫微详解·第六章案例分析·第一例·批流年（PDF 第108~109页）"},{"t":"三百零五、合伙三规则","h":"\"化权在谁，谁就当老板\"","c":"方法——**第一例末尾给了\"合伙关系\"的三条判定，结构极清楚**：\"**假如：①'朋友宫化权，你主动投资别人；别人化权，也就是朋友化权——朋友当老板'。②'如果你的财帛宫禄很大（化禄代表财星很大），结果没有权，权在朋友宫——适合你和朋友合伙做生意，朋友当老板，你来做事情'。③'如果朋友宫全是财星，你的命中化权——就变成朋友和你合伙做生意，朋友出钱，你来当老板，你来赚钱'。**\" **三条可以合成一条通则**：**\"谁拿化权，谁就是主导者（当老板）；谁拿化禄，谁就出钱（或得钱）\"**——**①权在朋友→朋友当老板；②禄在你、权在朋友→朋友当老板、你做事；③权在你、财星在朋友→你当老板、朋友出钱。** **这一条是全册少数**逻辑完全自洽**的规则**（**因为它只做\"权／禄的归属换算\"，不额外加吉凶判断**）——**而这恰好也是\"合伙\"这件事的真实结构：出钱的人、做主的人，可以由两个不同的人担任**（**而真正出事的时候，往往是\"出钱的人想做主\"**）。** **须说明**：**这是讲义对合伙关系的规则**；**其可用的核**：**\"化权／化禄落在哪一宫\"是盘面可查的**（**可核其推理是否一致**），**而\"这样合伙必成／必败\"不可核**；**⚠ 而须标**：**这个框架\"只论位置、不论信任\"**（**而现实中的合伙失败，多数不是因为\"权在谁\"，而是因为\"没说清\"**）。","o":"TJ-0783 · 天纪·紫微详解·第六章案例分析·第一例·合伙（PDF 第110页）"},{"t":"三百零六、\"武官星＋四化\"的四种出路","h":"化禄做商、化科做自由业","c":"要点——**第一例的子女宫，给了\"一颗武官星配不同四化\"的四条出路，是全册对\"职业路径\"最细的一次拆解**：\"**'星不管阴阳，武官带星都是男孩'——如贪狼、七杀、破军等；'贪狼有命中一个儿子'。子女宫：'贪狼旺（武官星，1 个儿子）、化禄（适合做生意）、擎羊平'。'贪狼在午宫且化禄，表示做生意当大老板'。**\" **四条出路（照录）**：**①\"如果没有化禄，贪居子午，为武官\"**；**②\"如果已经当了武官，会赚军费钱\"**；**③\"如果是化科，为自由业，如医师、会计师、律师……一个人单干，全权自己说了算\"**；**④\"这样的人一颗武官星化科就可以了\"**。** **这一条最精的是第③④两条**：**\"化科→自由业（医师、会计师、律师）\"，且点明其共同特征是\"一个人单干，全权自己说了算\"**——**而\"这样的人一颗武官星化科就可以了\"，意思是\"不必再贪多\"**（**即：有一个\"专业资质＋独立开业\"的组合就够**）。** **须说明**：**这是讲义对武官星配四化的规定**；**其可用的核极窄**：**\"化禄／化权／化科／化忌落在哪一宫\"是可查的**，**而\"必当大老板／必当武官\"不可核**；**⚠ 须标**：**\"武官带星都是男孩\"这一条把\"子女性别\"与\"星曜\"绑定**（**而其依据为零；本集不采**）。","o":"TJ-0784 · 天纪·紫微详解·第六章案例分析·第一例·子女宫（PDF 第109页）"},{"t":"三百零七、履卦：唯一提到\"科研\"的一格","h":"\"适合搞科研或做一些古怪之事\"","c":"要点——**履卦（天泽履）的\"性格\"段，是全册唯一一次把\"科研\"作为适配方向说出来**：\"**上乾下兑、双金比和、阴阳合和之象，'老父配少妻，利于桃花'。表示'女人美丽、男人钱多权大'。'履卦如履薄冰，喜欢刺激、冒险、竞争和探索'。'不安于现状和平淡的生活，难于容入他人的活动圈，适合搞科研或做一些古怪之事，易见机行事，所以被人反感和嫉妒，成败不定、起落变化快'。得此卦者'抗上与领导往往对立，但此人正直、胆大、任性和仗义执言，家族或个人财运往往非常好'。**\" **这一段的四层**：**①\"喜欢刺激、冒险、竞争和探索\"（动机）**；**②\"不安于现状和平淡、难于融入他人的活动圈\"（社交代价）**；**③\"适合搞科研或做一些古怪之事，易见机行事\"（适配方向）**；**④\"被人反感和嫉妒，成败不定、起落变化快\"（外部评价）**。** **而\"抗上与领导对立，但正直、胆大、任性、仗义执言\"这一组，与前面\"师卦抗上、坤卦直方大\"是同一路数**（**可核其人物类型的重复**）。** **\"地脉道\"那一侧则给了另一面**：\"**'父亲居住在正西小女儿的位置上'——'事业上常有欲进不得，退之又凶，是个进退两难之局'。'个性象女人、外似柔弱、遇到险事却往往踌躇不前，常常靠女人出面解决问题'。'官运不通、停止不前；商机不利、运气不佳，往往错失良机，后悔不已'。婚姻方面：'妻子能力超过自己，同床异梦、有娶二房之意，婚姻主凶，同龄婚姻有破裂之象'。**\" **须说明**：**这是讲义对履卦性格与地脉道的论述**；**其可用的核**：**\"喜爱探索、不擅合群、与上级易对立\"作为一类人格画像可成立**（**而这与\"科研人员\"的刻板印象相近——本集照录\"讲义这样归类\"，不认\"科研=此格\"**）；**⚠ 须标**：**\"父亲住少女位→妻子能力超过自己、有娶二房之意\"这一条，含明显的性别与婚姻定型**（**它把\"妻子强\"直接推向\"丈夫要另娶\"，而其推论基础为零**）。","o":"TJ-0785 · 天纪·紫微详解·第四章卦象详解·天泽履·性格与地脉道（PDF 第110~111页）  ---"},{"t":"三百零八、第八、第九次验证与一次\"化解\"运算","h":"履卦与泰卦的符号，及\"退回原位＝乾为天\"","c":"数据／方法——**本段给了两个可核的符号，并给出一条可运算的\"化解法\"**。**①第八次验证**：\"**天泽履卦：'○○○×○○'（凤鸣岐山）上上。**\" **核卦体**：**天泽履＝乾上兑下；下兑（初九阳、九二阳、六三阴）、上乾（九四阳、九五阳、上九阳）**（**自下而上：阳、阳、阴、阳、阳、阳**）。** **自左向右得\"阳、阳、阳、阴、阳、阳\"——不符**（**第三爻应是阴**）；**自右向左得\"阳、阳、阴、阳、阳、阳\"——完全吻合** ✓。** **②第九次验证**：\"**地天泰卦：'×××○○○'（喜报三元）上吉。**\" **核卦体**：**地天泰＝坤上乾下；下乾（初九、九二、九三皆阳）、上坤（六四、六五、上六皆阴）**（**自下而上：阳、阳、阳、阴、阴、阴**）。** **自左向右得\"阴、阴、阴、阳、阳、阳\"——不符**；**自右向左得\"阳、阳、阳、阴、阴、阴\"——完全吻合** ✓。** **至此\"自右向左\"已九次验证**（**屯、蒙、需、讼、师、比、小畜、履、泰**）。** **③而\"化解\"那一条，是本段最有意思的一处**：\"**天泽履卦的名位不等栏写：\"进退两难、原地危险／退回原位、成乾为天\"。**\" **本集复算这个\"化解\"**：**天泽履＝乾（父）上＋兑（少女）下**——**即\"父居于少女之位\"**；**而\"退回原位\"＝父（乾）回到父位（乾）**——**乾上乾下＝乾为天** ✓（**卦名运算完全正确**）。** **这说明这套\"化解\"不是符咒，而是\"把错位的名位改回去\"**（**而\"改回去\"之后得到的卦，是纯阳的\"乾为天\"**）。** **须说明**：**这是本集第八、第九次符号核验，另附一处\"化解＝位复原\"的卦名复算**；**其可用的核极准**（**三处都是卦名加法**）；**⚠ 而须标**：**\"改为乾为天\"之后\"生活是否变好\"，不可核**——**可核的只有\"卦名算得对\"**。","o":"TJ-0786 · 天纪·紫微详解·第四章卦象详解·天泽履（PDF 第112页）、地天泰（PDF 第114页）"},{"t":"三百零九、泰卦：管理者的两面","h":"\"公正、强硬、不偏不倚\"与\"对亲者过于无情\"","c":"要点——**泰卦\"性格\"段，是全书对\"管理者\"写得最立体的一段**：\"**上坤下乾、土生金，乾为老父、坤为老母、阴阳正配，人财两旺、升官加薪、家庭和乐。'上卦为母，母仪天下，遇事处理公正，手段强硬，不偏不倚，对亲朋好友或者爱人子女也是如此——适合从事管理（领导）工作'；'对亲者来说手段过于无情，使人敬而远之'。得此卦者财运丰厚、官运大吉大利，有成名利业之象。**\" **这一段的精处，在它把同一个特质的两面同时写出**：**正面——\"公正、强硬、不偏不倚\"是管理者最需要的三样**；**负面——\"对亲者过于无情，使人敬而远之\"是同一个特质在私领域的代价**（**即：能对所有人一视同仁，也就意味着\"对亲近的人也不讲情面\"**）。** **而\"适合从事管理（领导）工作\"这一句，与前面\"小畜＝中层辅助人才\"\"孤星独守＝佐才\"正好构成一组**：**小畜\"适合辅助、不适合当老板\"；泰卦\"适合管理\"；而两者的分界正是\"能不能不偏不倚\"**。** **须说明**：**这是讲义对泰卦性格的论述**；**其可用的核**：**\"公正＋强硬＋不讲情面\"这一组，作为管理者画像极准**（**而\"对亲者过于无情\"是这类人的真实代价**）；**⚠ 须标**：**\"人财两旺、升官加薪\"属命理断言**。","o":"TJ-0787 · 天纪·紫微详解·第四章卦象详解·地天泰·性格（PDF 第113页）"},{"t":"三百零九、泰卦：管理者的两面","h":"\"宜固守旧，不利创新\"","c":"方法——**泰卦的\"卦义\"给了一条全书少见的\"否定性建议\"**：\"**地天泰卦，泰者，通也。天地交泰，阴阳和光。外卦为坤、代表地；内卦为乾、代表天；天气下降，地气上升，天地相交，这便是泰卦的卦象。得此卦者：'泰卦事宜固守旧，不利创新；要将原来的事情做得完整，不适合新的开拓'。所求顺遂，恶事消亡。**\" **\"宜固守旧，不利创新\"这一条的价值在于它是\"限制型建议\"**：**它不告诉你\"该做什么\"，而告诉你\"现在不该开新的\"**（**理由是同为\"泰\"＝\"通\"，通的时候应当\"把已有的做完\"，而不是\"另起炉灶\"**）。** **而\"要将原来的事情做得完整\"这一句，把\"固守\"具体化了**：**固守不是\"不动\"，是\"收尾\"**（**即：把手上未完成的做完**）。** **须说明**：**这是讲义对泰卦的卦义**；**其可用的核**：**\"顺境时不宜扩张、宜收尾\"这一层，在项目与经营语境下是可讨论的**（**因为顺境中开新局，往往在资源分散处翻车**）；**⚠ 须标**：**\"所求顺遂、恶事消亡\"属命理断言**。","o":"TJ-0788 · 天纪·紫微详解·第四章卦象详解·地天泰（PDF 第113页）"},{"t":"三百零九、泰卦：管理者的两面","h":"妻居夫位与\"名位相等\"的条件","c":"方法——**泰卦\"地脉道\"是本册唯一被直接称为\"大吉\"的一局，且它有一个明确的前提条件**：\"**地天泰卦：'妻子居住在西北丈夫之位为泰卦'，有否极泰来、安泰舒适之象。夫妻和睦。'此局大吉，婚姻主一世夫妻、白头到老'。事业'在家能相夫教子'；'在公事进退有据，受人重用，必不待言，心想事成'。健康方面：'一生无大病'；'未经指点住在此位大富大贵'。能力：'把握先机、刚柔并进，事事快人一步，终必大成'。**\" **而\"名位\"一栏把条件说得很清楚**：\"**'结过婚的为母亲；丈夫健在时，与丈夫同住乾位最好'。**\" **这个条件的三个要素须记**：**①\"结过婚\"**（**即：身份已是\"母\"**）；**②\"丈夫健在\"**（**即：乾位有\"父\"，不是空位**）；**③\"与丈夫同住\"**（**即：不是\"妻独居乾位\"，而是\"夫妻同住\"**）。** **而这三条恰好回答了前文\"坤卦\"处的一个疑问**：**坤卦说\"已婚或寡居带子女方成格\"\"婚破后不再有二次婚姻\"\"解法与丈夫同住西北为泰卦\"**——**两处指向同一个答案：**\"妻住西北\"只有在\"丈夫也在\"的时候，才叫\"泰\"**（**若丈夫不在，那个\"乾位\"就没有人来填，卦就不成立**）。** **须说明**：**这是讲义对泰卦地脉道的规定**；**其可用的核**：**\"妻（坤）＋夫（乾）＝坤上乾下＝地天泰\"在卦名层面可复算** ✓（**而\"妻独居乾位\"算不出泰卦**——**这一处与坤卦的\"解法\"是自洽的**）；**⚠ 须标**：**\"一生无大病\"\"一世夫妻白头到老\"属命理断言**（**而\"住某位则一生无大病\"这类断言，会让人延误就医，绝不可采**）。","o":"TJ-0789 · 天纪·紫微详解·第四章卦象详解·地天泰·地脉道（PDF 第114页）"},{"t":"三百一十、第二例：一句\"这个命就不用看了\"","h":"福德宫廉破与\"单星地劫\"","c":"风险——**第二例（紫微在巳、命在未，1955 年 3 月 7 日，阴女）开篇两句都很重，须照录并严标**。**第一句**：\"**'此命福德宫很重要——女人相当（相当）夫妻宫；如果福德宫很差的时候，这个命就不用看了'。**\"（**即：福德宫坏到一定程度，连\"看\"都不必**）；**第二句**：\"**福德宫：是廉破。'廉破是水中做坟（冢），廉杀是半路埋尸'。'廉破最凶，主横祸、意外、孤单'。所以女人如果福德宫是廉破，'一看福德宫很差，看命时心中就要警惕，她的命一定有问题的，会有状况发生的'。**\" **以及命宫一侧**：\"**'单星地劫坐命的人，没有吉星来救，就有危重的危险发生'。但'此命地劫单守是在早年小时候比较凶；如果对宫有化忌来冲，她早年就完了'。'此宫对宫没有化忌星，我们看她早年大限 3–12 的时候有点凶——凶的地方可能是没有祖业、童年不顺、辛苦成家'。**\" **须说明（三层）**：**①\"福德宫差到这个命不用看\"是一个\"判定终止\"的说法**（**它在体系内是自洽的：既然最坏已定，往下算无意义**）；**②但这一句对当事人的效果是\"被判定了\"**——**它的实际后果，是让人放弃\"还能做什么\"的念头**；**③⚠ 本集明确**：**\"福德宫廉破→必主横祸、意外、孤单\"不可核，且\"没有吉星来救就有危重的危险\"这一类表述，是本册最不应被说出口的话之一**——**它把\"未来的不确定\"直接压缩成\"注定\"**。** **本集处置**：**照录其规则与术语**，**并明确\"此说不可用于对任何人作出结论\"**。","o":"TJ-0790 · 天纪·紫微详解·第六章案例分析·第二例·福德宫（PDF 第115页）"},{"t":"三百一十一、\"小限起法\"：女命一岁从丑起","h":"\"看那年有灾\"的可核算术","c":"方法——**同一例给了一条\"小限\"的具体起法，这是本册少数\"纯算术\"的规定**：\"**地劫在大限 3–12 岁的时候，看那年有灾——定小限：'女命一岁从丑宫起，女人逆转'；1、2、3、4、5、6、7——'七岁逢地劫那年就有灾'。**\" **这条规则的构造**：**①起点——女命 1 岁在丑宫**；**②方向——逆转（即逆时针，按地支逆序走）**；**③序列——1 岁丑、2 岁子、3 岁亥、4 岁戌、5 岁酉、6 岁申、7 岁未……**（**即：每岁退一位**）。** **本集复算**：**丑→子→亥→戌→酉→申→未，共七步，第 7 岁落在\"未\"宫** ✓。** **而\"七岁逢地劫那年就有灾\"这句话，与它前面\"1、2、3、4、5、6、7\"的列举一致**（**即：判定的落点是\"第 7 岁=未宫\"**）。** **须说明**：**这是讲义对\"小限起法\"的规定**；**其可用的核较松但清楚**：**\"一岁起丑、逆行、每岁一位\"是一组可复算的规则**（**可核其步骤是否被一致使用**），**而\"七岁逢地劫必有灾\"不可核**；**⚠ 须重点标**：**\"小孩七岁前有灾\"\"七岁那年就有灾\"这类断言，对父母的心理影响极大**（**而它最坏的效果，是让父母在孩子的正常生病、跌倒、受惊时，把它当成\"命定的灾\"**）——**本集明确：儿童的健康与安全，靠的是照护、疫苗、体检与安全环境，不是靠\"那年有灾\"的预告**。","o":"TJ-0791 · 天纪·紫微详解·第六章案例分析·第二例·小限（PDF 第115页）"},{"t":"三百一十二、履卦的\"先天／后天／流年\"","h":"\"庶出之人天注定\"与\"男外有妾\"","c":"要点——**履卦的三栏（先天／后天／流年）集中了一组与\"婚姻、出身、妾\"相关的断语，须照录并标**：\"**先天：'庶出之人天注定（两眼上下不相等），寄人旗下不自知，早年离家'。'早年重重阻隔，早年非常辛苦成家！科甲不兴，桃花多'。**\" **后天**：\"**'妾有闪，人偏离，进军令（也代表法院传票）重楼之侧，无名有险'（专门讲婚姻）；'夫妻相隔，总为情，官司失财，生横事'。**\" **流年**：\"**'男外有妾，妾在重楼之内，武官外调，财不利，契约成空，婚事凶'。'竹子立下，文书破'。'遇猴乃有千里行'。**\" **须说明（两点）**：**①\"两眼上下不相等→庶出\"是\"以貌断出身\"**（**而\"两眼大小不等\"在医学上是常见现象**：**可为先天性、也可为外伤、上睑下垂、斜视等所致**——**它与\"是否庶出\"无任何关系**）；**②\"男外有妾\"\"妾有闪\"这一组，把\"妾\"作为一种常态来谈论**（**这是旧式婚姻制度的产物**，**而本集只记录\"讲义这样取象\"，不把它当作对当代婚姻的描述**）。** **⚠ 须重点标**：**\"以两眼是否等大断出身\"与\"以面断贵贱\"属同一类做法**（**而它在本册出现过多次**：**鼻孔断财、眉断兄弟、天仓断夫妻、鱼尾纹断生死**）——**本集统一标为\"面部特征与命运的无效关联\"**。","o":"TJ-0792 · 天纪·紫微详解·第四章卦象详解·天泽履·先天后天流年（PDF 第111~112页）  ---"},{"t":"三百一十三、\"改运\"的完整流程","h":"时机、名位与\"不能乱改\"","c":"方法——**第二例给出了全册最完整的一套\"改运流程\"，其核心是\"时机\"而不是\"方位\"**：\"**①37 岁求测，流年在丑（迁移宫）；38 岁在子（朋友宫化忌，'化忌不利婚姻'）；39 岁官禄宫不行；40 岁田宅宫也不行；41 岁进入福德宫。'女人的福德宫也是丈夫的宫位'。'41 岁才可以改运。**\" **②而改运有一条\"硬条件\"**：\"**'结婚后二人一定要睡在西北角主卧室，否则历史重演'。'如果婚前住在东南，婚后没有住西北，就等于害了她，让她再次发生这个事情'。**\" **③最关键的是这一句**：\"**'改动的时机很重要，不能乱改'。'如此命这两年都不好，不利于婚姻就不要改变——反正不好，叫她继续睡在坤位，这时名位相等'。'不管男女，只要名位相等，就先不要动。名位相等发事业，有利于事业'。**\" **④以及一个实务落点**：\"**夫妻宫是紫杀，'代表先生是独子、头顶上没有人，做事业当老板他说了算'。如今丈夫走掉了，'公司的法人要由她说了算，法人名要改成她的，叫她住在西南角，就名位相等了，这样就会发事业'。**\" **⑤最后给的\"跨区\"方案**：\"**'方法就是叫她在坤宫等待几年，而后叫她直接进入父母宫结婚'——'叫她在年底时从坤宫西南角搬到东南角住，头西南、脚朝东北'；'一住进去时间不长，就是 42 岁见到红鸾，42 岁就结婚了'。'这就是改命方法，跨过两大灾区'。**\" **须说明**：**这一套流程的价值，全在\"什么时候该动、什么时候不该动\"这一层**（**而\"名位相等就先不要动\"这一条，是本册最保守也最稳的一句**：**它承认\"不动\"也是一种正确的处置**）；**其可用的核极窄**：**\"住坤位（母位）已婚者名位相等\"可核其与\"名位相等\"的定义是否一致** ✓，**而\"改运后必在某岁结婚\"不可核**；**⚠ 须重点标**：**\"结婚后二人一定要睡西北角主卧室，否则历史重演\"这类话，会形成一种自我强化的恐惧**（**夫妻卧室选在哪一屋，是一件普通的居住安排；把它与\"婚姻存亡\"绑定，会让每一次搬家都变成一次赌注**）。","o":"TJ-0793 · 天纪·紫微详解·第六章案例分析·第二例·改运（PDF 第118~119页）"},{"t":"三百一十四、两处必须严标的话","h":"\"小孩像大人→早夭\"与\"直接批一字死\"","c":"风险——**本段有两处必须最高级标注**。**其一（关于儿童）**：\"**'善解人意、行动如大人'。'如果命、相都有，为成格——为早夭之人'。**\" **而同一段讲义自己也给了正确的方向**：\"**'所以小孩子要有天真、活泼、无邪；赤子之心保持到老都可以'。**\" **须说明**：**前半句是本册对儿童最危险的一条断言**——**它把一个孩子的\"懂事\"（善解人意、举止成熟）读成\"早夭之兆\"**；**而\"懂事\"恰恰常常是\"被要求懂事\"的结果**（**如家庭困难、父母病弱、被寄予厚望**）——**需要的是理解与减轻负担，不是\"命不好\"的标签**；**⚠ 本集明确：任何\"孩子像大人就是早夭\"的说法，其依据为零，且会给父母造成长期恐惧**。**其二（关于告知方式）**：\"**'命中有这个灾，她就会将吉宅换成凶宅来住'——理由'房间小改善条件'；'主动往坑里面跳的'。改后不久丈夫开刀，身体也不太好。'阳宅西北角为厨房，主丈夫死象'。'算命以果决行，启蒙一定要言简刚中，直接批一字\"死\"字，可能他会叫你教他解的方法'。**\" **须说明**：**\"直接批一字死\"这一条，是本册对\"如何告知\"最坏的一个示范**——**它主张用\"死\"字直接击中当事人，以换取\"求教解法\"的服从**；**而这一做法的实际后果，是让一个正在应对家人重病的人，先被一句断言击垮**；**⚠ 本集明确不采**：**重大坏消息的告知有专业规范**（**如\"坏消息告知\"（SPIKES）流程要求先了解对方想知多少、再分步给信息、并给出可行的下一步**）——**而\"批一字死\"不属其中之一**。","o":"TJ-0794 · 天纪·紫微详解·第六章案例分析·第二例（PDF 第115~117页）"},{"t":"三百一十五、\"旺夫不等于白头偕老\"","h":"两句极精的判断","c":"要点——**第二例的福德宫一段，有两句话写得很准，须单独记**：\"**'此命是旺夫——就是做事叫丈夫放心、无后顾之忧'。'旺夫不等于会白头偕老的。贤妻良母不等于长命百岁的'。**\" **这两句的分量在于它们把\"好\"与\"久\"分开**：**\"旺夫\"是\"让丈夫放心、无后顾之忧\"（一种功能）**；**\"白头偕老\"是\"关系持续到最后\"（一种时长）**——**而讲义明说：前者不保证后者**。** **而\"贤妻良母不等于长命百岁\"这一句，同样是把\"德\"与\"寿\"分开**（**即：\"做得好\"不等于\"活得久\"**）。** **须说明**：**这是讲义在福德宫论述中的一句自省**（**而它在全册的语境里相当罕见**：**因为全书大部分地方都在\"以吉凶断结果\"，而这里承认了\"好人不一定有好结果\"**）；**其可用的核**：**\"功能好\"与\"关系长久\"不是同一件事——这一层在现实里是成立的**（**一个\"让人放心\"的伴侣，可能恰恰因为\"太能撑\"而不被察觉其消耗**）；**⚠ 而须标**：**\"旺夫\"\"贤妻良母\"是旧式性别角色的评价词**，**本集只记其\"功能≠时长\"这一层逻辑，不采其对女性的角色要求**。","o":"TJ-0795 · 天纪·紫微详解·第六章案例分析·第二例·福德宫（PDF 第117页）"},{"t":"三百一十六、编者的两次实测","h":"\"概率太小\"与\"孩子提前十六天出生\"","c":"数据——**本段有两处编者（署名\"紫易奇缘\"）自己的实测记录，而两次都指向\"这套做法不灵\"**。**其一（关于\"挑怀孕月份定子女性别\"）**：**讲义主张\"我们挑她何时怀孕……'事先决定什么时间怀孕，生男、生女，这是真科学'\"**；**而编者的记录是**：\"**我们来计算一下：42 岁是本大运最后一年，为 1996 年，次年 1997 年；如果四月怀孕、第二年正月生——'我用排盘软件模拟了几次，生天梁、天机的宝宝概率太小'。**\" **其二（关于给外孙算八字）**：\"**'我女儿要生宝宝，医院提前 20 天通知家属，做好心理准备，孕妇可能难产、要做好剖腹产准备。于是我这个姥爷就开始为外孙推算八字——前十五天、后十五天，一一算了一遍。算完后的第二天，孩子提前十六天顺产出生了，哈哈！今年外孙三岁多了，因此，我还没有看过他的八字命盘'。**\" **须说明（三点）**：**①第一处是**编者的反证**——**讲义说\"这是真科学\"，编者用\"软件模拟几次，概率太小\"直接对冲**（**即：连\"能不能生成那个盘\"都不成立**）；**②第二处是**一个自嘲故事，也是一个残酷的对照**——**他算了\"前十五天、后十五天\"，而孩子\"提前十六天\"出生，恰好落在他算的范围之外**（**\"因此，我还没有看过他的八字命盘\"——算不出来，就只能不看了**）；**③⚠ 而须明确否定讲义的\"真科学\"主张**：**\"事先决定怀孕时间以决定子女性别与命盘\"不是科学**——**胎儿性别由受精时的染色体决定，不可能由\"挑月份\"改变；而\"挑时辰\"所能影响的只是\"剖宫产的日期\"，与\"命盘\"无关**。** **⚠ 一并标**：**编者的自嘲，恰好是\"命理不可预测\"的一个内部证据**（**而他把它写进了书里，这本身值得记**）。","o":"TJ-0796 · 天纪·紫微详解·第六章案例分析·第二例·编后记（PDF 第119~120页）"},{"t":"三百一十七、\"半空折翅\"的失效论证","h":"\"你会遇到无数这样的格，人还平安健在\"","c":"要点——**第三例（紫微在寅、命在戌，1953 年 11 月 9 日，阴男）之后，编者给了一段**极有力的方法论反驳**，须完整照录**：\"**紫易奇缘：他不是死在半空折翅——大限在未宫 32–41，是机梁日月和日月反背，虽然是中年，但不是半空折翅格，是流年逢限使。'如果按半空折翅格，你会遇到无数这样的格，人还平安健在'。**\" **这一段的价值在于它说中了\"格\"的要害**：**一个\"格\"要成立，必须\"符合条件者都如此\"**；**而\"半空折翅\"的判定条件（对宫化忌＋三方煞聚＋中年）太宽**——**宽到\"无数人符合\"，而其中\"平安健在\"的占绝大多数**（**那么它就**不是一个预测，而是一个描述**）。** **讲义的原文则是**：\"**'武曲星在戌宫坐命，对宫是火星、贪狼化忌，而且是三方四正的迁移宫化忌——化忌对冲命是最凶的，半空折翅'。'就是机月同格也会被杀死的'，或者意外死亡；'半空折翅一定在中年这一段时间的（32–41）'，'这是命'。**\" **⚠ 而这一例的结局也照录了**：\"**在民国 82 年（1993 年），'在台湾中南发生一起枪击案被枪杀，被害者就是此命之人'。1953＋41－1＝1993 年。**\"（**本集复算：1953＋41－1＝1993 ✓**）。** **须说明**：**这是本册第二次出现\"编者反驳原讲法\"**（**第一次是关于\"格分析过重\"，用林青霞父亲等人作反证**）；**而这一次的反驳更精准——它不找人举例，而是直接指出\"条件太宽即失效\"**。** **⚠ 须重点标**：**这一例涉及一起真实枪击案的被害者**——**本集只记\"讲义这样陈述\"，不重复案情、不作任何\"命理已预测\"的认可**；**而\"机月同格也会被杀死的\"\"这命解也解不了\"这类话，绝不可对任何人说出**。","o":"TJ-0797 · 天纪·紫微详解·第六章案例分析·第三例（PDF 第120~122页）"},{"t":"三百一十八、小限起法的男女之分","h":"\"男从未起顺转，女从丑起逆转\"","c":"方法——**同一段给了\"男命小限\"的起法，正好与前例的\"女命小限\"配成一对**：\"**'男命癸巳年生人，定小限：巳酉丑、丑墓冲未，一岁从未宫起，男顺转'——37、38、39、40、41 岁，'41 岁在亥位父母宫'，'41 岁一定在中年大限 32–41 这一段时间'。**\" **两法并列（本集整理）**：**①男命：1 岁起未宫，顺转（未→申→酉……）**；**②女命：1 岁起丑宫，逆转（丑→子→亥……）**。** **本集复算男例**：**未→申→酉→戌→亥，共 5 步，第 5 岁落亥**（**而原文列到 41 岁落亥宫——若\"1 岁未、2 岁申……\"，则 41 岁＝未＋40 位＝未＋40，因 12 一循环，40 mod 12＝4，未＋4＝亥 ✓**，**与原文\"41 岁在亥位\"吻合**）。** **须说明**：**这是本集对\"男顺女逆\"小限起法的复算**（**男例自洽 ✓、女例前已核自洽 ✓**）；**其可用的核较松但清楚**：**\"起宫＋方向＋每岁一位\"是一组可复算的规则**（**而两例的落点都与原文相符**）；**⚠ 须标**：**\"起宫为何男从未、女从丑\"这一层，讲义未给理由**（**它属规定，不是推导**）——**而\"某岁落某宫→必应某事\"不可核**。","o":"TJ-0798 · 天纪·紫微详解·第六章案例分析·第三例·小限（PDF 第121页）  ---"},{"t":"三百一十九、\"炼错孩子\"的案例","h":"\"抱错了也是好事，否则中年风险极高\"","c":"要点——**第四例（紫微在寅、命在未，1958 年 6 月 27 日，阳男）讲了一个极特殊的案例，须照录并标其性质**：\"**迁移宫：天机在迁移宫化忌冲命；身宫在夫妻宫有巨门、禄存同宫；父母宫是七杀、天马；代表父母的日月，太阴在卯化权、太阳在亥为陷——'一看这命就是日月反背，人都是命啊'。**\" **而后是本例的核心事实**：\"**'此人出生在医院，结果医院发生了火灾，一荒乱父母抱错了孩子，命主就这样和父母离散了'。所以'日月反背、成了二姓异生子（领养）'——'否则就夭折了'。'此人命大，鬼使神差地成了二姓人活了下来'。'抱错了也是好事，否则中年风险极高'。**\" **须说明（三层）**：**①这是一个关于**医院火灾致婴儿抱错**的案例**（**它是一件真实的、可核的事故类型**：**新生儿错抱在医疗史上确有记录，现代已靠腕带、足印、DNA 等手段防范**）；**②讲义的处置方式是\"事后归因\"**——**它把\"抱错\"这个**事故**，解释成\"命该如此（日月反背→二姓异生子）\"，并进一步说\"否则就夭折了\"\"抱错了也是好事\"**；**③⚠ 本集明确标出这一层的问题**：**\"否则会夭折、所以抱错是好事\"这种说法，把一件对两个家庭都是创伤的事故，改写成了\"命运的保护\"**（**而它的实际后果，是让当事人不去追究事故的责任、也不去处理\"被抱错\"带来的身份困惑**）。** **⚠ 另须标**：**\"二姓异生子就不批命了\"**——**讲义自己在这里设了一条\"停止线\"**（**\"因为二姓异生子就不在批命了，这种化忌冲命大都是过继之人\"**），**而这条\"停止线\"在体系内是自洽的**（**既然\"过继\"已改了\"名位\"，原盘就不适用**）——**但它同时也说明：这套体系遇到\"名位被改写\"的情形，只能\"不批\"**。","o":"TJ-0799 · 天纪·紫微详解·第六章案例分析·第四例（PDF 第123页）"},{"t":"三百二十、\"脚朝向太阳，左眼一定会瞎\"","h":"一条必须最高级警告的操作","c":"风险——**同一例给出的\"过继化解法\"，含一条全册最危险的\"朝向\"断言**：\"**如果是过继之命，化解方法：叫他出生后住在东宫（等于命中化权），将脚朝向延年方——'他的延年方在南'。化煞星：午有化科、未有天梁、天钺。'酉与北不能用——北有化忌和煞星，西有杀、劫和太阳陷，不能用'。**\" **而后是关键的一句**：\"**'如果脚朝太阳，你看命盘相当于他的脸看着你'——'亥宫是不是在他的左侧？太阳在左侧，太阳代表眼睛和视力，化煞就是去掉的意思，**脚朝向太阳，他的左眼一定会瞎的**'。'所以化煞一定注意，不能随便而为'。'太阴是右眼'。**\" **本集处置（三层）**：**①照录其规则**（**因为它是这套体系里\"化煞\"操作的具体一环**）；**②⚠ 但必须明确——\"脚朝向某个方位会导致左眼失明\"没有任何依据**：**视力丧失的成因是明确的（屈光、白内障、青光眼、视网膜病变、视神经损伤、外伤、糖尿病视网膜病变等），与\"睡觉时脚朝哪\"无关**；**③而这个说法的实际危害有两层**：**(a) 它可能让家长因恐惧而不敢按医嘱安排婴儿床位**（**而新生儿睡眠的首要原则是\"仰卧、床面平整、无软物\"以防窒息**）；**(b) 它把\"可能的视力问题\"引向\"朝向\"，从而延误真正该做的眼科检查**。** **⚠ 须重点标**：**讲义自己写了\"化煞一定注意，不能随便而为\"**——**这句话说明它也知道这是\"不可随意操作\"的部分**（**而本集的立场更直接：这一整类\"朝向—身体损伤\"的因果链，不予认可**）。** **⚠ 一并标**：**\"太阳是左眼、太阴是右眼\"是一组配属**（**它在册内是一致的，可核**），**但\"配属一致\"不等于\"对应真实\"**。","o":"TJ-0800 · 天纪·紫微详解·第六章案例分析·第四例·过继化解（PDF 第124~125页）"},{"t":"三百二十一、\"主动与被动的关糸\"","h":"红鸾在命宫与在夫妻宫，是两种人","c":"要点——**第四例的夫妻宫一段，把\"同一颗星落在不同宫\"的差别讲得极透**：\"**夫妻宫是巨门、禄存——'是此命最累的地方，也是倒霉的地方'。天梁坐命'人正派，厚道、坚强'，但化权在财而不是命，做事业有领导力。'娶个太太是巨门很累'；禄存'表太太喜欢吵，且家中掌财权'；但红鸾星在夫妻宫，'表示此人很愿意这样'。'天梁是男大娶小妻，可能他很爱自己太太'。**\" **而后是本段最精的一句**：\"**'如果红鸾在命中，可能他想尽办法离婚；但是红鸾在夫妻宫，他认了'。'这里就是算命中主动与被动的关系'。因为他的红鸾星在夫妻宫，所以他认了。'如果要让他太太好点，住西北角是唯一的方法'。**\" **\"主动与被动的关系\"这一句，是全书对\"命与选择\"区分最清楚的一次表述**：**红鸾在命宫＝\"他想离\"（主动）**；**红鸾在夫妻宫＝\"他认了\"（被动）**——**同一个\"红鸾\"，位置不同，一个生出\"行动\"，一个只生出\"接受\"**。** **而它给出的\"改进\"又落回\"位\"上**：\"**如果要让他太太好点，住西北角是唯一的方法**\"（**西北＝乾＝夫位**）。** **须说明**：**这是讲义对\"红鸾位置\"与\"夫妻宫\"的论述**；**其可用的核**：**\"同一件事，落在不同位置会引出不同的应对（主动改变 vs 被动接受）\"这一层，在心理与组织语境下是可讨论的**（**而\"位置\"在命理里是宫位，在现实里可比作\"这件事在你生命中的位置\"**）；**⚠ 须标**：**\"住西北角是唯一的方法\"这一条，把婚姻的改善归给单一变量**（**而\"唯一\"二字是全书常见的绝对化表述，须警惕**）；**另标**：**\"巨门星太太面相：面形小、声高、音大，是个又白又细、而且凶悍的母老虎\"**——**这一条以体貌与声音贬损女性，本集不采其义**。","o":"TJ-0801 · 天纪·紫微详解·第六章案例分析·第四例·夫妻宫（PDF 第125页）"},{"t":"三百二十二、一处可核的自洽：丁干与癸干四化","h":"编者的推演与十干四化表完全吻合","c":"数据——**本段编者（署名\"紫易奇缘\"）做了一次完整四化推演，而它可以与本册前章的\"十干四化表\"逐项核对**。**原文**：\"**紫易奇缘：大限 46–55，对宫是本夫妻宫，主妻子之事；大限夫妻宫在酉，酉的三方是巳，又是夫妻宫；'巳宫是丁干，四化为丁：太阴禄、天同化权、天机化科、巨门化忌'——'太阴化禄妻子要钱，天同化权拼命干活；天机、天刑化科丈夫大脑时刻想着犯罪抢钱；巨门化忌，活的生不如死'。'太阳为丈夫，在亥宫宫干是癸，癸破巨贪'——'贪狼在子女宫，为夫妻同房之事，化忌连做\"爱\"都不想了'；'对宫是武曲、地劫，一心在想着如何抢钱，满足妻子的需求'。**\" **本集核对（两处）**：**①丁干四化**——**前章所录十干四化表为\"丁：阴同机巨\"**（**即太阴禄、天同权、天机科、巨门忌**）；**与编者的\"丁太阴禄、天同化权、天机化科、巨门化忌\"**完全吻合** ✓；**②癸干四化**——**表为\"癸：破巨阴贪\"**（**破军禄、巨门权、太阴科、贪狼忌**）；**与编者的\"癸破巨贪\"**（**即破军、巨门、贪狼，正对应禄权忌三字**）**也吻合** ✓。** **据此**：**编者的四化推演\"用字规则\"是正确的**（**而这一点很要紧：四化推演一旦用错干，整段全错**）。** **须说明**：**这是本集对\"十干四化表\"与\"实际推演\"之间的一次交叉核对，结果一致 ✓**（**这属\"编码规则\"层面的可核**）；**⚠ 而须重点标**：**推演所用的\"字\"对了，不等于推演出的\"事\"是对的**——**\"妻子要钱\"\"丈夫想着犯罪抢钱\"\"活的生不如死\"\"连做爱都不想了\"这些结论，是编者的自由发挥，与本集所核的\"四化规则\"无关**；**⚠ 另须标**：**这段文字内容极度负面**（**它把一个十年大限，写成\"抢劫、生不如死、无性生活\"的连续剧**），**而这类叙述对当事人的伤害，远超过\"算得准不准\"**。","o":"TJ-0802 · 天纪·紫微详解·第六章案例分析·第四例·第五大限（PDF 第127页）"},{"t":"三百二十三、\"天机为大脑\"","h":"一颗星如何被读成\"飞行的子弹\"","c":"要点——**第三例末尾，有一段对\"天机＋擎羊\"的取象解释，把\"星\"读成\"物理事件\"的路径说得很完整**：\"**'在看流年身宫——天机为大脑，想法瞬间到达，代表速度快、飞机、汽车、飞行的子弹'。'擎羊恶性事故、空中坠落物体等'；'在流年身宫，飞行的子弹瞬间穿过人体'。**\" **这一段的构造是\"两层取象相乘\"**：**①\"天机\"＝\"想法瞬间到达\"→抽象出\"速度\"**（**于是可指飞机、汽车、子弹**）；**②\"擎羊\"＝\"恶性事故、空中坠落物\"→抽象出\"突发的伤害\"**；**③两者叠在\"流年身宫\"，就得到\"子弹瞬间穿身\"**。** **须说明**：**这是讲义对\"天机＋擎羊\"的取象**；**其可用的核极窄**：**\"天机主思虑、主变动\"是这套系统的固定配属**（**可核其是否被一致使用**），**而\"子弹穿身\"是取象的结果，不是预测**；**⚠ 须重点标**：**这一套\"星→物理事件\"的读法，与\"枪击案\"这类真实悲剧放在一起时，最容易被误读为\"命理已预测\"**——**而它的实际逻辑是\"事后找象\"**（**先知道发生了枪击，再从\"天机＝速度、擎羊＝突发伤\"里拼出一个解释**，**这叫事后归因，不是预测**）。** **⚠ 另标**：**\"飞机、汽车\"这两个词在 1993 年之前就已存在**（**而\"飞行的子弹\"这一象，在任何有枪的社会里都可被\"对号入座\"**）——**即：这类取象的\"覆盖面\"极宽，宽到几乎总能找到对应**。","o":"TJ-0803 · 天纪·紫微详解·第六章案例分析·第三例·流年身宫（PDF 第122页）"},{"t":"三百二十四、否卦起首","h":"\"此卦缺子孙爻\"","c":"要点——**否卦（天地否）的爻位表与图解照录**：**上九\"倾否，先否后喜\"；九五\"休否，大人吉；其亡其亡，系于苞桑\"；九四\"有命无咎，畴离祉\"；六三\"包羞\"；六二\"包承，小人吉；大人否，亨\"；初六\"拔茅茹，以其汇，贞吉，亨\"。** **占例**：\"**天地否，此卦为苏秦将游说六国时卜得，后果为相**\"。** **卦义**：\"**阴阳乖离，不利君子**\"。** **图解（四段，极生动）**：\"**'一人在路上坐着，远未到达目的地，需要积蓄力量，等待时机'。'一人张弓射箭而弓箭落地，没有射中，半途而废'。'一人拍掌大笑，为乐极生悲之兆'。'旁有口舌二字，象征因口舌而受辱'。'此为天地不交、人口不圆之象'。**\" **另有一句极特殊的注**：\"**'此卦缺子孙爻'。**\" **须说明**：**这是讲义对否卦的著录**；**其可用的核**：**爻辞为《易》原文**（**可核**），**而\"缺子孙爻\"是一条关于\"象数结构\"的说明**（**它指的是在某种取象体系里，否卦对应的\"六亲\"中缺\"子孙\"这一项**——**而这一点可与\"否＝闭塞、上下不交\"的卦义相互印证**：**闭塞之时，生发之气不出**）；**⚠ 而须标**：**\"张弓射箭落地＝半途而废\"\"拍掌大笑＝乐极生悲\"是卦图取象**（**本集只记录，不认其预测效力**）；**另标**：**\"苏秦游说六国，后果为相\"是占例的\"应验故事\"**（**属\"事后附会\"一类**，**而\"苏秦\"其人在史料中的结局并不好**——**这一点讲义未提，本集只按原文记录占例，不作评价**）。","o":"TJ-0804 · 天纪·紫微详解·第四章卦象详解·天地否（PDF 第127~128页）  ---"},{"t":"三百二十五、第十次验证：否卦","h":"\"○○○×××\"与\"虎落深坑\"","c":"数据——**否卦给了第十个可核的符号**。**原文**：\"**天地否卦：'○○○×××'（虎落深坑）下平。**\" **本集核对卦体**：**天地否＝乾上坤下；下坤（初六阴、六二阴、六三阴）、上乾（九四阳、九五阳、上九阳）**（**即自下而上：阴、阴、阴、阳、阳、阳**）。** **比对**：**自左向右得\"阳、阳、阳、阴、阴、阴\"——不符**（**初爻应是阴**）；**自右向左得\"阴、阴、阴、阳、阳、阳\"——完全吻合** ✓。** **至此\"自右向左\"已十次验证**（**屯、蒙、需、讼、师、比、小畜、履、泰、否**）。** **而\"否／泰\"这一组还提供了一个**结构性对照**，须记**：**泰卦＝坤上乾下（阴上阳下，\"天地交\"）**，其符号为\"×××○○○\"；**否卦＝乾上坤下（阳上阴下，\"天地不交\"）**，其符号为\"○○○×××\"——**两卦的符号正好互为倒序**（**而两卦的卦义也正好相反**）。** **这说明符号串与卦体是**一一对应的映射**（**不是随手写的六个圈叉**）。** **须说明**：**这是本集第十次符号核验，另附\"泰／否互为倒序\"的对照**；**其可用的核极准**（**卦体固定、符号原文、比对为纯算术**）；**⚠ 而须标**：**十次全中只证明\"编码规则一致\"，不证明\"占断有效\"**——**泰卦符号\"×××○○○\"，否卦符号\"○○○×××\"，两者都对；但泰卦的\"喜报三元\"与否卦的\"虎落深坑\"是否真的对得上人生，是另一件事**。","o":"TJ-0805 · 天纪·紫微详解·第四章卦象详解·天地否·文王金钱课（PDF 第129页）"},{"t":"三百二十六、否卦：\"先君子后小人\"","h":"\"既不违规，也不犯法\"的损人不利己","c":"要点——**否卦\"性格\"段，把一个\"看起来没问题、实际很伤人\"的人格写透了**：\"**上乾下坤、土生金、为阴阳合和之象，家庭和睦、人丁兴旺、资财丰厚。'上阳下阴，二气不交，失运时做事阻力大'。'性格主能力强、反应快，自尊心强，亲和力差、不能平易近人，所以容易树敌，做事徒劳无功'。'否卦先君子后小人——时间一长，本性就暴露出来了：争强好胜、嘴上得理不饶人，无赖泼皮，既不违规、也不犯法，这种损人不利己的事经常发生'。**\" **这一段最精的是**三层组合**：**①\"先君子后小人\"（时间性）**——**初识时是君子，久处后见小人**；**②\"嘴上得理不饶人\"（手段性）**——**他不打人，只讲理，而\"讲理\"本身成了武器**；**③\"既不违规，也不犯法\"（合法性）**——**他做的事挑不出错，却\"损人不利己\"**。** **而这三层合起来，是一种极难对付的人**：**因为\"他没错\"，所以\"你没理由指责他\"**；**而\"损人\"累积起来，关系就耗光了**。** **须说明**：**这是讲义对否卦性格的论述**；**其可用的核**：**\"合法但消耗人\"这一层，在任何组织里都成立**（**而\"得理不饶人\"正是这类人的标志**）；**⚠ 须标**：**\"上乾下坤→家庭和睦、资财丰厚\"与\"否＝闭塞\"在字面上冲突**（**而讲义自己也在下句转向\"失运时阻力大\"，可核其自我修正**）；**另标**：**\"无赖泼皮\"这个词带贬损，但本集照录，因为它确是该段原文的用词**。","o":"TJ-0806 · 天纪·紫微详解·第四章卦象详解·天地否·性格（PDF 第128页）"},{"t":"三百二十六、否卦：\"先君子后小人\"","h":"\"不知己之才能如何，妄度不知量进\"","c":"要点——**否卦\"地脉道\"（父居母位）的开头，给了一个极好的\"病因\"分析**：\"**天地否卦：（父亲住母亲的位置——西南角）。'男人之性过刚于女，自尊好强之心，不知己之才能如何，妄度不知量进，乃终成否卦'。**\" **\"不知己之才能如何，妄度不知量进\"这十六个字，是全册对\"失败成因\"最准的一次概括**：**两层——①\"不知己之才能如何\"（没有自知）**；**②\"妄度不知量进\"（没有分寸却还想前进）**——**而这两层合起来，就是\"否\"（闭塞）**。** **而它给的六条后果（照录）**：**①\"于婚事主大凶，夫妻反目成仇\"**；**②\"官家之人，必主否塞不通，终致无成——不但不升官，反招凶祸，乃致退休\"**；**③\"商家人，居此局，必生大耗，财耗家散，终致一败涂地\"**；**④\"健康上亦凶，主大病缠身；如加上命中流年逢羊刃，血光必现，在数中难逃此大限之局\"**；**⑤\"宜生女孩\"**；**⑥\"妻盛夫衰\"**。** **须说明**：**这是讲义对否卦地脉道的说明**；**其可用的核**：**\"不知己才、不知量进\"这一层，作为\"失败的结构\"是可讨论的**（**而它不依赖任何星象**：**高估自己＋低估阻力＝闭塞**）；**⚠ 须重点标**：**第④条\"血光必现，在数中难逃此大限之局\"是最重的断言**——**\"难逃\"二字会直接剥夺人求医、避险的动力**（**本集明确：任何\"必现血光\"的预告，不可对人说出；而\"逢羊刃见血光\"无任何医学或事故学依据**）。","o":"TJ-0807 · 天纪·紫微详解·第四章卦象详解·天地否·地脉道（PDF 第128页）"},{"t":"三百二十七、同人卦：\"空有一腔热血\"","h":"\"大事办不成，小事不想干\"","c":"要点——**同人卦\"性格\"段，写的是另一种常见的人**：\"**天上火下，属于火克金，'女欺男、丈夫惧内'。先后天卦同位，主人缘佳，喜交异性，精力旺盛、才华出众，适应团体生活。'乾上具有领导力，有贵人相助，事业顺利，有奋斗精神，能结交志同道合的朋友，共同发展事业'。'金火相克，遇事较现实，自私利己，喜好拉帮结派、另立山头——大事办不成，小事不想干，空有一腔热血，得不到发挥的地方'。健康方面：天火主肺，'肺病、痨病、吐血等'；'处事不当易生官非诉讼之灾'。**\" **\"大事办不成，小事不想干，空有一腔热血，得不到发挥的地方\"这一句，是全册对\"怀才不遇\"最准的一次描述**：**它不是\"没有能力\"，而是\"能力被卡在中间\"**——**大事需要的资源与耐力他没有，小事他不屑做**（**于是长期停在\"抱负很大、产出很小\"的状态**）。** **而\"喜好拉帮结派、另立山头\"这一条，与前面\"同人于宗，吝\"（只跟本宗族抱团）是同一路数**（**可核其呼应**）。** **续论给了正面的一半**：\"**天火同人卦是天下一堆火，众志成城才会有力量。象征团结众人才有收获。'一个好汉三个帮'，相互鼓励、齐心协力做正事，然后衣锦荣归。**\" **须说明**：**这是讲义对同人卦性格的论述**；**其可用的核**：**\"大事办不成、小事不想干\"这一层，在任何职业语境下都成立**（**它描述的是一种\"能力与任务不匹配\"的停滞**）；**⚠ 须标**：**\"女欺男、丈夫惧内\"\"天火主肺、痨病、吐血\"属命理与医学断言**（**而\"吐血\"\"痨病\"这类具体病症的断言，绝不可当作健康提示**）。","o":"TJ-0808 · 天纪·紫微详解·第四章卦象详解·天火同人·性格（PDF 第130页）"},{"t":"三百二十七、同人卦：\"空有一腔热血\"","h":"\"已婚男人唯一的科甲卦\"与\"脚朝文昌\"","c":"方法——**同人卦\"地脉道\"给了四条，其中第 1 条是全册少见的\"唯一性\"规定，也给出了一条\"朝向\"的正用法**：\"**天火同人卦：（父亲住在二女儿的位置——正南卧房）。**\" **四条（照录）**：**①\"发科甲：'已婚的男人唯一出现科甲的卦就是天火同人卦'——父亲住正南卧房，考试金榜题名；'睡觉的时候，脚朝文昌、文曲、天钺、天魁、化科所在宫位置的方位'\"**；**②\"商人财禄非常平稳，需要二人合伙做，方可成事\"**；**③\"文官或武官容易升迁\"**；**④\"夫妻均住正南卧房，夫妻大凶——主妻有暗伤（解决方法：妻子仍睡西北角，吉），妻子疾病缠身\"**。** **第④条最见功力**：**它承认\"同一个局，夫妻都住就凶，只有父住就吉\"**——**并给了明确的\"解法\"：\"妻子仍睡西北角（乾位），吉\"**（**即：把\"占了女儿位\"的妻子，送回\"妻位\"**）。** **而\"名位不等\"栏也照应**：\"**'妻子疾病缠身，需要回到乾位方可平安健康'。**\" **须说明**：**这是讲义对同人卦地脉道的规定**；**其可用的核**：**\"父（乾）＋中女（离）＝乾上离下＝天火同人\"在卦名层面可复算** ✓，**而第④条的\"解法\"与\"名位相等\"框架也是自洽的**（**妻子回乾位＝名位复原**）；**⚠ 须重点标**：**\"已婚男人唯一出现科甲的卦\"这个\"唯一\"，是讲义自己的断言**（**而全册并无\"科甲\"的完整定义与统计，无法支持\"唯一\"**）；**另标**：**\"脚朝文昌、文曲、天钺、天魁、化科所在宫位置的方位\"这一条，与前面\"脚朝太阳，左眼一定会瞎\"正好构成一对**——**同一册里，\"朝向\"既被说成能\"发科甲\"，又被说成能\"致失明\"**（**而两者都无依据；本集两处都只作记录，不作认可**）。","o":"TJ-0809 · 天纪·紫微详解·第四章卦象详解·天火同人·地脉道（PDF 第130~131页）"},{"t":"三百二十八、否卦的\"测字\"一节","h":"\"二戈一贝（贱）\"与\"姓谢逢张不中\"","c":"要点——**否卦的\"流年\"栏，附了一段\"测字\"，这是全册仅有的几处\"以字断事\"的实操**：\"**测字：'二戈一贝（贱）！'自寻烦恼。'寸言立身（谢）'，'逢张落第'（姓谢逢到姓张，不中）。'掌'，测字为'堂上拿人'。**\" **本集拆解它的构造（三层）**：**①\"二戈一贝\"＝\"贱\"字**（**\"贱\"的繁体\"賤\"由\"贝\"与两个\"戈\"形构件组成**——**所以\"二戈一贝\"指的就是这个字**）；**②\"寸言立身\"＝\"谢\"字**（**\"謝\"由\"言\"＋\"身\"＋\"寸\"组成**）；**③\"掌\"＝\"堂上拿人\"**（**\"掌\"字上为\"尚\"，下为\"手\"，讲义把它读成\"堂上（尚）＋拿（手）\"**）。** **而\"逢张落第（姓谢逢到姓张，不中）\"这一条，是\"字与姓的相冲\"**（**即：由\"谢\"与\"张\"两个姓的\"字义\"推出\"考试不中\"**）。** **须说明**：**这是一套\"拆字\"（字谜式）的推法**；**其可用的核**：**\"二戈一贝＝贱\"\"寸言立身＝谢\"这两处拆字，是可核的**（**靠字形即可验证，而两处都拆得对 ✓**）；**⚠ 而其\"断事\"部分不可核也不可采**：**\"姓谢逢到姓张不中\"把一个考试结果归给两个人的姓氏组合**（**而一个人的考试结果，取决于准备、能力与考场状况**）。** **⚠ 另须标**：**\"二戈一贝（贱）\"这个拆法，本身就把\"贱\"这个贬词与一个字形绑定**（**而\"贱\"在汉语中兼具\"价格低\"与\"地位低／品行劣\"两义**）——**本集只记其\"拆字技术\"，不采用其对人的评价义**。","o":"TJ-0810 · 天纪·紫微详解·第四章卦象详解·天地否·流年（PDF 第129页）"},{"t":"三百二十九、同人卦的爻位与取象","h":"\"浮鱼从水之卦，二人分金之象\"","c":"要点——**同人卦的爻位表、卦辞与图图解照录**：**上九\"同人于郊，无悔\"；九五\"同人先号啕而后笑。大师克相遇\"；九四\"乘其墉，弗克攻，吉\"；九三\"伏戎于莽，升其高陵，三岁不兴\"；六二\"同人于宗，吝\"；初九\"同人于门，无咎\"。** **卦辞**：\"**同人：同人于野，亨。利涉大川，利君子贞。象曰：天与火，同人；君子以类族辨物。**\" **占例**：\"**天火同人，此卦为刘文龙在外求官，卜得后果衣锦还乡**\"。** **卦义**：\"**两人契义、其利断金**\"。** **图解（四段）**：\"**'心字，象征心专名利、同心协力'。'旁边一人张弓射向山上，寓意高中；同心协力就会高中'。'河边一只鹿饮水，象征爵禄源源而来'。'溪阔水深，寓意前程远大'。'此为浮鱼从水之卦，二人分金之象'。'卦身为寅，不入卦'。'图中一人捧书文，利于功名学业'。**\" **须说明**：**这是讲义对同人卦的著录**；**其可用的核**：**爻辞为《易》原文**（**可核**），**而\"心字\"\"张弓向山\"\"鹿饮水\"\"溪阔水深\"是卦图取象**；**⚠ 须标**：**\"卦身为寅，不入卦\"是一条\"象数结构\"的说明**（**它指的是\"卦身\"这一构件落在寅，而未进入卦体**——**此类术语在册内出现极少，本集照录，不作展开**）；**另标**：**\"二人分金之象\"与卦义\"两人契义、其利断金\"合看，同人卦的核心意象是\"二人同心\"**（**而这一层与《人间道》\"同人于野\"的\"公\"字取向相通**）。","o":"TJ-0811 · 天纪·紫微详解·第四章卦象详解·天火同人（PDF 第129~130页）  ---"},{"t":"三百三十、第十一次验证：同人卦","h":"\"○○○○×○\"与\"仙人指路\"","c":"数据——**同人卦的符号给了第十一个可核点**。**原文**：\"**天火同人：'○○○○×○'（仙人指路）中吉。**\" **本集核对卦体**：**天火同人＝乾上离下；下离（初九阳、六二阴、九三阳）、上乾（九四阳、九五阳、上九阳）**（**即自下而上：阳、阴、阳、阳、阳、阳**）。** **比对**：**自左向右得\"阳、阳、阳、阳、阴、阳\"——不符**（**第二爻才是阴**）；**自右向左得\"阳、阴、阳、阳、阳、阳\"——完全吻合** ✓。** **至此\"自右向左\"已十一次验证**（**屯、蒙、需、讼、师、比、小畜、履、泰、否、同人**）。** **而这一卦还提供了一个新情况，须注意**：**它的\"阴\"落在第二爻（自右数第二个位置）**（**而不是像屯、蒙那样落在首位或中段**）——**这进一步说明\"自右向左\"不是靠\"某一位恰好对上\"凑出来的**，**而是整串统一按一个方向读**。** **须说明**：**这是本集第十一次符号核验**；**其可用的核极准**（**卦体固定、符号原文、比对为纯算术**）；**⚠ 而须标**：**十一次一致，仍只证明\"编码规则\"，不证明\"占断\"**（**\"仙人指路\"这一吉语，与\"○○○○×○\"之间没有任何可核的因果关系**）。","o":"TJ-0812 · 天纪·紫微详解·第四章卦象详解·天火同人·文王金钱课（PDF 第131页）"},{"t":"三百三十一、\"喜神入命不一定婚姻美满\"","h":"一条极难得的自我限定","c":"要点——**第五例（紫微在申、命在午，1958 年 1 月 4 日，阴女）开篇对\"红鸾、天喜\"的说明，罕见地给了一个\"反例\"**：\"**命宫入红鸾星或天喜星，这叫'女招贵夫、男招美妻'。有红鸾、天喜的人喜欢追求美女帅哥——**喜神入命不一定婚姻美满**。**\" **这一句的分量在于它和前面的\"女招贵夫、男招美妻\"直接相抵**：**前半句是\"吉断\"（会招到好配偶），后半句是\"限定\"（但不一定婚姻美满）**——**而讲义把两句并排放着，等于自己承认：**\"招到好人\"不等于\"过好日子\"**（**这与前章\"旺夫不等于白头偕老\"是同一层意思**）。** **另有一处更值得记的**\"来源分层\"**：\"**'命宫在午，夫妻在辰，转了个弯，这叫隔角煞，这是离婚的象。**（此条非倪师讲）**'**\" **编者（署名\"紫易奇缘\"）在这里**明确标注了哪一条不属原作者**（**这是本册极少见的\"逐条注明出处\"**）——**而本集据此把该条单列为\"编者所增\"**。** **须说明**：**这是讲义与编者对\"红鸾天喜\"的说明**；**其可用的核**：**\"吉星入命≠婚姻美满\"这一层限定，作为\"对吉断的自我校正\"是可核的**（**它出现在册内，就说明体系里存在\"反例意识\"**）；**⚠ 须标**：**\"隔角煞＝离婚的象\"这一条，编者自己已标\"非倪师讲\"**（**而\"隔角\"在紫微斗数中另有一套定义，与本处\"命宫与夫妻宫转了个弯\"未必是一回事**）。","o":"TJ-0813 · 天纪·紫微详解·第五章紫微十二宫详解·第五例（PDF 第132页）"},{"t":"三百三十二、\"日角陷丧父，月角陷丧母\"","h":"一套必须最高级警告的\"以貌断亲\"","c":"风险——**第五例的面相段，给出了一整套\"以面部特征断父母生死与出身\"的规则，须照录并明确警告**：\"**面相：日月角——'日角陷丧父，月角陷丧母'。'左眉高者丧父，右眉高者丧母；两个眉比较高，妈妈先去世'。**'两眼不同等为庶出、过继'**。'女人男命女身一辈子辛苦，像男人一样辛苦劳累'。**\" **⚠ 本集处置（三层）**：**①照录其规则**（**因为它是这套体系的一部分，且必须让人看清它到底说了什么**）；**②⚠ 明确——这一套没有任何依据**：**父母是否早逝，取决于其自身的健康、年龄与疾病，不可能由子女的\"日角、月角、眉高、眼大小\"决定**；**③⚠ 而它的伤害是双向的**：**(a) 它让子女看着自己的脸，去揣度\"是不是我克了父母\"**——**这是一种**自我归罪**（**而\"我害了父母\"这个念头，会在亲人离世后变成长期的内疚**）；**(b) \"两眼不同等为庶出、过继\"这一条，是以眼睛大小不等断定一个人的出身**——**这是对\"庶出\"\"过继\"这两类身份的贬抑，也是对当事人隐私的粗暴推断**。** **⚠ 须重点标**：**\"日角\"\"月角\"是面相学里的固定部位**（**其位置在额，可核其命名在册内一致**），**但\"部位命名一致\"与\"能断父母生死\"是两件事**；**⚠ 另标**：**\"女人男命女身一辈子辛苦\"这一条，把\"女性承担男性角色\"读成\"命苦\"**（**而现实中\"承担\"往往是环境所迫，需要的是分担，不是\"命该如此\"的判词**）。","o":"TJ-0814 · 天纪·紫微详解·第五章紫微十二宫详解·第五例·面相（PDF 第134页）"},{"t":"三百三十三、把同性恋读成\"凶\"","h":"\"儿子睡在正西，成了同性恋\"","c":"风险——**第五例的子女宫一段，出现了全册对性少数最直接的一次贬损叙述，须照录并明确否定**：\"**'命盘子女宫天同化权，儿子化权，子女宫三方四正有禄权科，说明这个儿子非常优秀的，她命上的儿子很棒'。**结果叫儿子睡在正西，儿子神念改了——男身女态，穿裙子、穿姐姐的花衣服，成了雷泽归妹卦，成了同性恋'**。**\" **⚠ 本集处置（三层，须完整照录）**：**①先照录其\"卦名运算\"，因为它本身的算法是对的**：**雷泽归妹＝震上兑下；\"正西\"＝兑（少女位）；\"儿子\"＝震（长男）**——**长男居少女位＝震上兑下＝雷泽归妹** ✓（**卦名可复算**）。**②⚠ 但必须明确——\"住哪个房间\"不会改变一个人的性取向**：**性取向的形成，现代研究指向生物、遗传、激素与早期环境等多因素共同作用，且**不由居住方位决定**（**世界卫生组织与主流精神医学早已将同性性取向从疾病分类中移除**，**中国 2001 年版《中国精神障碍分类与诊断标准》亦不再将其列为病态**）。**③⚠ 而这一段最严重的问题在**价值判断**：**它把\"成了同性恋\"写成一件\"坏了\"的事，与前句\"这个儿子非常优秀的\"形成对照**——**即：孩子原本\"很棒\"，因为\"成了同性恋\"而变成了\"凶\"**。** **⚠ 本集明确：这样的叙述，是对同性恋者的歧视，不予认可**——**性取向不是\"神念改了\"，不是\"穿姐姐花衣服\"学来的，更不是\"凶\"**。** **⚠ 另须标**：**该书同一段还写\"西北角厕所缺失丈夫位，丈夫去世了\"**——**这是一个\"缺角致祸\"的结构**（**它把家人的死亡归因于房子的一个缺角**，**而这类归因会让丧偶者长期自责**）。","o":"TJ-0815 · 天纪·紫微详解·第五章紫微十二宫详解·第五例·子女宫（PDF 第135页）"},{"t":"三百三十四、一张完整的\"子女宫→子女数\"对照表","h":"十四种星象与孩子数","c":"方法——**第六例（紫微在辰、命在辰，1962 年 2 月 27 日，阳男）的子女宫段，给出一张完整的\"星象→子女数\"对照表，可入册**。**原文照录**：\"**子女宫在丑——'紫微、天相代表生儿子，双星是两个孩子'；'如果是天机、巨门就没有孩子，是零蛋'；'机巨是有兄弟、无儿子'；'贪狼一个儿子'；'太阳是一个儿子'；'天同一个儿子'；'破军是二个以上'；'天府、武曲是二个儿子'；'文昌一个'；'廉贞二个'；'廉破二个'；'七杀二个'；'日月是一男一女'；'逢化忌为无子'；'三方会禄生贵子，儿子非常优秀了'。**\" **本集整理为表（十五行）**：**紫微＋天相＝子、双星为二｜天机＋巨门＝0（\"有兄弟、无儿子\"）｜贪狼＝1｜太阳＝1｜天同＝1｜破军＝2 以上｜天府＋武曲＝2｜文昌＝1｜廉贞＝2｜廉破＝2｜七杀＝2｜日月＝一男一女｜逢化忌＝无子｜三方会禄＝贵子。** **须说明**：**这是讲义对\"子女宫星象→子女数\"的规定**；**其可用的核**：**该表在册内是完整的、且各项互不冲突**（**可与前章\"紫微天相＝两个孩子\"的零星说法对上** ✓）；**⚠ 须重点标**：**这张表的\"精确度\"本身就是一个警报**——**它给的是\"几个孩子\"\"男或女\"这种**可被现实立刻推翻**的结论**（**而一对夫妻生几个孩子，取决于生育意愿、身体状况与时代条件，与星象无关**）；**⚠ 另标**：**\"逢化忌为无子\"这一条最伤人**（**它会让一对正在为不孕困扰的夫妻，把原因归到\"命里化忌\"上**，**而真正该做的是去生殖医学中心查原因**）。","o":"TJ-0816 · 天纪·紫微详解·第五章紫微十二宫详解·第六例·子女宫（PDF 第137页）"},{"t":"三百三十五、四卦全对：一个家庭的\"卦象合影\"","h":"父、母、长子、次子，四个卦名全部可复算","c":"数据——**第六例有一处极难得的\"全家卦象\"记录，而四个卦名**全部可复算**。**原文**：\"**'看看家人如何——他的父母左右不了他'。'他父亲住在三女儿的位置（正西），是**天泽履卦**'；'**妈妈是地泽临卦**'；'**儿子是雷天大壮卦**'；'**二儿子是坎为水，行险之道，这儿子喜欢冒险**'。'看八字属于正格，非常正派；如果八字不好、又喜欢冒险，将成为一个为非作歹之辈'——'这是全家人卦象'。**\" **本集逐一复算（四卦全对）**：**①父亲住三女儿位（正西）**——**正西＝兑（少女）；父＝乾；乾上兑下＝天泽履** ✓；**②母亲住正西**——**母＝坤；坤上兑下＝地泽临** ✓；**③儿子住西北乾位（\"他未婚住在西北乾位，住在爸爸的位置上\"）**——**长男＝震；震上乾下＝雷天大壮** ✓；**④二儿子**——**中男＝坎；坎上坎下＝坎为水** ✓。** **四卦全对** ✓✓✓✓。** **而这一组还揭示了一个**结构上的要点**，须记**：**同住\"正西\"的父与母，卦名不同（天泽履 vs 地泽临）**——**因为\"上卦\"取的是\"住的人\"（乾／坤），\"下卦\"取的是\"住的位\"（兑）**。** **这说明\"卦名＝人＋位\"的算法是**一贯的**（**而不是\"某方位固定对应某卦\"**）。** **须说明**：**这是本集对\"一个家庭四卦\"的完整复算，四卦全对**；**其可用的核极准**（**人—位—卦三者关系可逐项验算**）；**⚠ 而须标**：**\"二儿子喜欢冒险→若八字不好将成为为非作歹之辈\"这一条，是对未成年人的**品性预判**（**而\"喜欢冒险\"是一种正常的儿童气质**，**把它与\"为非作歹\"连起来，是给孩子贴标签**）。","o":"TJ-0817 · 天纪·紫微详解·第五章紫微十二宫详解·第六例·阳宅（PDF 第138页）"},{"t":"三百三十五、四卦全对：一个家庭的\"卦象合影\"","h":"\"财星出来过早\"与\"好位化减忌威力\"","c":"要点——**第六例有两处判断写得相当好，须单独记**。**其一（关于\"早发\"）**：\"**'大限 16–25（父母宫），天梁守命化禄——第一个十年就化禄，他的财星出来过早，没有来得及择业，就接过父母手中的祖业（祖上产业）'。'因为他还没有成熟，还不具备这个才力'。**\" **而后是结果**：\"**'他自身开始化忌……本身化忌当不成老板；再报考公务人员，已经晚了。唯一的选择是去私企，给别人打工，领取固定薪水'。**\" **\"财星出来过早\"这一判断，与前章\"吉星不要来得太早，后面就会惨\"是同一路**（**可核其前后呼应 ✓**）——**而它说中的是一个常见的现实结构**：**年纪太轻就接手一份\"不该那么早到手\"的资源（家业、大钱、高位），能力尚未长成，资源就先耗尽**。** **其二（关于\"命与运的减法\"）**：\"**'他住在西北角，雷天大壮的时候会掌权做主——西北为天，是最高的、是权的位置；他命中有权，运上又很好，所以 26–35 岁感情在纠结中，工作上还是很如意的'。**有阳宅的好位和好运，化减了忌的威力**。**\" **\"化减了忌的威力\"这一句，是全册对\"命与运关系\"最清楚的一次表述**：**不是\"命好就一切好\"，而是\"命里的一个'忌'，可以被'位'与'运'削弱\"**（**它与前章\"命占三分之一、运占三分之一、人事占三分之一\"是同一模型** ✓）。** **须说明**：**这是讲义对第六例的判断**；**其可用的核**：**\"资源到手太早、能力未及\"这一层是可讨论的现实结构**（**而\"化减\"这一层，作为\"多因素折减\"的模型是可核其自洽的**）；**⚠ 须标**：**\"唯一的选择是去私企打工\"这类\"唯一\"，属绝对化表述**（**而一个人的职业选择永远不会只有一个**）。","o":"TJ-0818 · 天纪·紫微详解·第五章紫微十二宫详解·第六例·大限（PDF 第136~138页）"},{"t":"三百三十六、编者的勘误","h":"\"《天纪实录》上册此例排错\"","c":"要点——**第六例开头有一处**文献校勘**，极有分量**：\"**此命是民国 51 年正月二十三日戌时生人，阳男。公元 1962 年 2 月 27 日 20 时 10 分，农历壬寅年正月二十三日戌时。**（注：《天纪实录》上册此例排错，正确 2 月 27 日误排 3 月 28 日）**\" **这一段的价值在于它做了一件**可核的事**：**指出另一本书的日期排错了，并给出正确值**（**而日期一错，四柱、大限、小限全错**——**这是命理排盘里\"一错到底\"的地方**）。** **而本集可据以**核算**：\"**民国 51 年＝1911＋51＝1962 ✓**\"（**与\"公元 1962 年\"吻合**）。** **须说明**：**这是本册编者对《天纪实录》的一处勘误**；**其可用的核极准**：**民国纪年换算可验算** ✓（**而\"2 月 27 日 vs 3 月 28 日\"这一处，属\"原文之间的差异\"，本集只能照录编者的更正，无法替两书裁定**）；**⚠ 另须标（一处算术问题）**：**同一例说\"今年 33 岁（1995 年求测）\"**，**而 1962 年生人至 1995 年为 33 周岁、34 虚岁**——**故\"33\"应是周岁**；**而同册第五例说\"民国 83 年（1994 年），她虚岁 38 岁\"，而 1958 年生人至 1994 年为 36 周岁、**37 虚岁**——此处**多算了一岁**（**本集照录原文，并标此差异**）。** **⚠ 一并标**：**小限一例可复算**——**\"壬寅生人小限从辰宫起 1 岁，25 在辰，顺行\"**；**则 33 岁＝辰＋8 位＝辰→巳→午→未→申→酉→戌→亥→子＝子 ✓**（**与原文\"33 在子位化忌\"吻合**）。","o":"TJ-0819 · 天纪·紫微详解·第五章紫微十二宫详解·第六例（PDF 第136、137页）  ---"},{"t":"三百三十七、\"住就会得艾滋病\"","h":"一条必须最高级警告的医学断言","c":"风险——**第六例的化解段，出现了一句全册最严重的\"方位—疾病\"断言，须照录并明确否定**：\"**'父母住在西北角、他父母住的房间空出，他不能住（归妹卦）——**住就会得艾滋病**'。**\" **⚠ 本集处置（三层）**：**①照录**（**因为必须让人看清这个体系说了什么**）；**②⚠ 明确——艾滋病由 HIV 病毒经**血液、性接触、母婴**三条途径传播**（**与\"住哪个房间\"没有任何关系**：**HIV 不会通过空气、共用餐具、共用卫生间、同住一室传播**）；**③⚠ 而这句话的伤害有三层**：**(a) 它让一个住在某房间的人，长期活在一个毫无根据的恐惧里**；**(b) 它把一种传染病**道德化**——暗示\"住错地方\"就会得\"那种病\"，而\"那种病\"在很长一段时间里被当作\"脏病\"看待**；**(c) 它把预防的重心，从\"安全性行为、不共用针具、规范输血、母婴阻断\"这些真正有效的措施，转向\"换房间\"**。** **⚠ 须重点标**：**这一类\"住某处→得某病\"的链条，在册内并非孤例**（**前面还有\"脚朝太阳→左眼必瞎\"\"西北缺角→丈夫去世\"**）；**而它们的共同结构是：把一个**已发生的坏结果**，追溯到一个**可改动的家居细节**上**。** **⚠ 本集明确：任何\"住哪就会得什么病\"的说法，都不可对人说出**（**尤其不可对一个正在担心自己健康的人说**）。","o":"TJ-0820 · 天纪·紫微详解·第五章紫微十二宫详解·第六例·化解（PDF 第139页）"},{"t":"三百三十八、\"低山根的人往往缺乏上进心\"","h":"一套以鼻梁断人的品性与子女","c":"风险——**第六例的面相段，把\"山根\"读成一个人的全部处境，须照录并警告**：\"**'山根太低，眼睛凸出来，鼻子的起势不强，表示根基薄弱，不易获得祖（产）'。'心里往往想不开，脑筋转不过来弯，往往对眼前的事情感觉不满意，活得很累'。**'低山根的人往往缺乏上进心，懒惰消极，容易生病，往往下一代很坎坷'**。'没有眉毛是空壳子，喜欢做假、虚伪，外阔内空'。**\" **⚠ 本集处置（三层）**：**①照录**；**②⚠ 明确——以鼻梁高低判断一个人的**上进心、勤惰、健康、乃至\"下一代很坎坷\"**，没有任何依据**：**\"山根\"的形态由骨骼与软组织决定（**与遗传、发育、外伤有关**），**而一个人的上进心与勤惰，由性格、环境、机会与意志共同决定**；**③⚠ 而它的伤害是**直接的**：**它把\"懒惰消极\"这个贬词，写进了一个人的**脸**里**——**而一个人若从小被告知\"你山根低，所以你懒、你没出息\"，这句话本身就会变成一种自我暗示**。** **⚠ 另须标**：**\"没有眉毛是空壳子，喜欢做假、虚伪\"这一条，是以毛发的有无断定品性**（**而眉毛稀疏可由遗传、甲状腺问题、化疗、斑秃等多种原因造成**）——**以\"空壳子\"称人，是对外貌的贬损**。","o":"TJ-0821 · 天纪·紫微详解·第五章紫微十二宫详解·第六例·面相（PDF 第140页）"},{"t":"三百三十九、编者的三次公开纠错","h":"\"这一例倪师讲的有点乱\"\"文昌在酉化忌，为排有误\"","c":"要点——**本章编者（署名\"紫易奇缘\"）连续做了三次**对原作者的公开纠正**，三次都可核，须单列**。**其一（第六例）**：\"**'这一例倪师讲的有点乱，无法整理，后面略过……后面加了一些风水知识'。**\" **其二（第七例·排盘错）**：\"**上图为原始命盘，**排盘错误**——此命出生时间，文昌不会出现在酉宫。**\" **并给出依据**：\"**命主是 1961 年三月初五戌时生人，按照紫微斗数安星法，生时在戌，**文昌星应该在子宫**，而倪师视频上，文昌星旺化忌在酉——**为排有误**！**\" **其三（第七例·宫位错）**：\"**倪师重点讲的是文昌在酉化忌，为排有误；另一个是**34 岁不求测**——'34–43 是田宅宫'，'34 岁误讲事业宫'，'事业宫是第五大限 44–53'；我们不再重复倪师的流年分析。下面我给大家分析下流年。**\" **须说明（三层）**：**①\"这一例讲的有点乱，无法整理\"这句最诚实**——**它承认\"原文无法整理\"，而不是硬凑**（**这在整册里极为少见**）；**②两处纠错都指向**排盘与宫位**（**这是命理里最硬的\"技术错误\"**：**排盘一错，四柱、大限、小限全错**）；**③⚠ 而须标**：**编者纠的是\"排盘\"，不是\"结论\"**——**他并没有说\"因为排错了，所以这批案例都不成立\"，而是\"排错了，我重排后再讲\"**（**这是一种\"在体系内维护体系\"的做法**，**它与\"批判体系\"是两件事**）。","o":"TJ-0822 · 天纪·紫微详解·第五章紫微十二宫详解·第六例、第七例（PDF 第140、142、145页）"},{"t":"三百四十、一条可复算的安星口诀","h":"\"子时戌上起文昌，逆到生时\"","c":"方法——**编者纠错所依据的，是一条**可复算的安星口诀**，须照录并复算**：\"**安文昌文曲星：'子时戌上起文昌，逆到生时是贵乡；文曲数从辰上起，顺到生时是本乡'。**\" **本集复算（按\"文昌逆行\"）**：**子时→戌，丑时→酉，寅时→申，卯时→未，辰时→午，巳时→巳，午时→辰，未时→卯，申时→寅，酉时→丑，**戌时→子**。** **故戌时生人，文昌应在**子宫** ✓**——**与编者的更正\"文昌应该在子宫\"**完全吻合** ✓。** **而倪师视频中\"文昌旺化忌在酉\"，恰好错开两位**（**酉是\"丑时\"的位置**）。** **须说明**：**这是一条可逐项验算的安星规则**；**其可用的核极准**（**十二时辰与十二宫一一对应，逆推即可**）；**⚠ 而须标**：**\"文昌\"这个\"星\"本身是虚构的**（**它是一套**符号系统**里的一颗\"星\"，不是天文学意义上的天体**），**故此处的\"可核\"仅限于\"口诀与排盘是否一致\"**（**不涉及\"文昌是否影响考运\"**）。","o":"TJ-0823 · 天纪·紫微详解·第五章紫微十二宫详解·第七例·安星（PDF 第142页）"},{"t":"三百四十一、\"落陷\"的机制解释","h":"\"巳宫是上午 9 点到 11 点，这个时间出月亮，看不到光\"","c":"要点——**第七例给了一个全册最好的\"落陷\"解释，因为它讲清了**机制**而不是只给结论**：\"**'兄弟宫是太阴落陷，为什么太阴星会落陷？**太阴就是月亮，此宫是巳宫（上午 9:00–11:00）——这个时间出月亮，是看不到光的，所以落陷**'。**\" **这一段的构造极清晰**：**①\"太阴＝月亮\"（星即物）**；**②\"巳时＝上午 9–11 点\"（宫配时辰）**；**③\"这个时辰月亮不出、无光\"（现实天象）**；**④故\"太阴在巳＝落陷\"（结论）**。** **这是全册少见的\"由天象推配属\"的写法**（**而不是\"某星在某宫就凶\"的直接断言**）——**而它本身是可核的**：\"**巳时（9–11 点）确实看不到月亮** ✓\"（**月亮在此刻或在地平线以下、或淹没在日光里**）。** **须说明**：**这是讲义对\"落陷\"的机制解释**；**其可用的核**：**\"宫—时—天象\"三层可逐项验证** ✓（**而\"十二宫配十二时辰\"这套对应，在册内是一致的**）；**⚠ 须标**：**\"落陷→见不到丈夫\"这个跳跃是不可核的**——**\"月亮在白天不可见\"是天文事实，而\"因此会见不到丈夫\"是比喻的延伸**（**讲义自己也用了\"暗示\"二字，可核其措辞**）。","o":"TJ-0824 · 天纪·紫微详解·第五章紫微十二宫详解·第七例·父母宫（PDF 第145页）"},{"t":"三百四十二、身宫的定义与\"两库二禄\"","h":"\"人有两库是田宅和天府，人有二禄是化禄和禄存\"","c":"定义——**第七例给了\"身宫\"的完整定义，也给了一组极精的\"库/禄\"分类，两句都须入册**。**其一（身宫）**：\"**'身宫：就是一个人的**后天宫位**'。'身在财宫，就会在私企或私人公司工作'；'身在官禄，就会去考公务员、想当官或进事业单位上班'；'身在迁移宫，就想往外跑，到外地发展'；'身在夫妻，受后天婚姻的影响很大，一心在婚姻和家庭上转'。'命身同宫，以主星定，但是此人以自我为中心，很少接受他人建议'。'身宫、命宫同宫又化禄，表示生下来就很富有，继承祖业'。**\" **其二（两库二禄）**：\"**'人有两库，是田宅和天府；人有二禄，是化禄和禄存'。'此命三方四正不见二禄，表后天无财运'；'父母宫化禄，说明出生在富有之家'；'田宅宫有禄存，表后天因嫁夫获得了少量财富，主要靠精打细算、会积存起来的钱财'。**\" **须说明**：**这是讲义对\"身宫\"与\"库禄\"的定义**；**其可用的核**：**\"身宫＝后天宫位\"这一层，在册内被一贯使用 ✓**（**可核它与\"命宫＝先天\"的对举**）；**而\"两库二禄\"是一组**分类框架**（**田宅与天府为\"藏\"，化禄与禄存为\"得\"**——**这组对举在语义上是清楚的**）；**⚠ 须标**：**\"身在财→必在私企\"这类\"宫位→职业\"的对应，是**规定**不是推导**（**而\"命身同宫→以自我为中心\"这一条，是从\"重合\"推出\"自我\"，属比喻延伸**）。","o":"TJ-0825 · 天纪·紫微详解·第五章紫微十二宫详解·第七例·身宫（PDF 第143、145页）"},{"t":"三百四十三、\"阳男阴女顺行\"与年干速查","h":"两条可复算的行运规则","c":"方法——**第七例给了两条**可复算的行运规则**，须照录并复算**。**其一（大限方向）**：\"**'心算 1961 年出生－1994 年＝33，＋1＝34 岁，为第四大限'。'年干支为辛丑，是阴女；**阳男阴女，大限顺时针排序**'——'34 岁为第四大限，是田宅宫'。**\" **其二（年干速查）**：\"**'公元尾数是 4，4 的天干是甲'；'四化口诀：**甲廉破（武）阳**，太阳化忌'。**\" **本集复算（两处）**：**①年龄**——**1994－1961＝33；33＋1＝34 岁** ✓（**与原文\"34 岁\"吻合**）；**②四化**——**甲干为\"廉破武阳\"**（**廉贞禄、破军权、武曲科、太阳忌**）；**原文写作\"甲廉破午阳\"**（**\"午\"当为\"武\"之误**，**而同句\"太阳化忌\"正确** ✓）；**③年干速查**——**公元年份尾数与天干对应：尾数 4＝甲、5＝乙、6＝丙、7＝丁、8＝戊、9＝己、0＝庚、1＝辛、2＝壬、3＝癸**（**1994 尾数为 4，故为甲年** ✓，**与原文一致**）。** **须说明**：**这是讲义与编者给出的两条行运规则**；**其可用的核极准**（**年龄可算、年干可查、四化可对** ✓✓✓）；**⚠ 须标**：**\"阳男阴女顺行、阴男阳女逆行\"这一条，在册内被多次使用且方向一致**（**可核其自洽**），**但\"为何男顺女逆\"讲义未给理由**（**它属规定**）。","o":"TJ-0826 · 天纪·紫微详解·第五章紫微十二宫详解·第七例·行运（PDF 第145页）"},{"t":"三百四十四、改运方法的五条总结","h":"\"书桌朝向化科，老板桌面朝禄\"","c":"方法——**第六例末尾，编者把\"改运\"做成了一套**可照抄的操作清单**，须照录**：\"**'改运方法：在延年方取吉位——像此命辰宫有紫相很吉，巳宫为吉方，戌宫也算吉方'。'改阳宅时，住家脚的朝位一定要朝向身体健康的方位才行'。'学生读书的书桌朝向化科的方位，**在那个房间无所谓**'。'住的要名位相等'。'求财：老板桌面朝禄的方位、财星和禄星'。**'如果禄与忌在一起，不用——用了会出现三角债，挣的全是外面欠款，全是欠条'**。'科权坐命的时候，官做得很大'。**\" **这一套的五条要点**：**①住家：脚朝\"身体健康的方位\"**；**②学生：书桌朝\"化科的方位\"，房间可以不限**；**③居住：名位相等**；**④求财：桌面朝\"禄\"（财星、禄星）**；**⑤禄忌同宫：不用**（**否则\"三角债，全是欠条\"**）。** **须说明**：**这是编者对\"改运\"的实操总结**；**其可用的核**：**\"书桌朝化科、房间无所谓\"这一条，是册内少见的\"放松条件\"的表述**（**它承认\"房间\"不是唯一变量**，**与前文\"位最重要\"构成一个修正**）；**⚠ 须重点标**：**\"脚朝身体健康的方位\"\"桌面朝禄\"这一类\"朝向\"操作，都无依据**（**而\"禄忌同宫→三角债\"这一条尤其具体到\"全是欠条\"，属过度精确的断言**）；**⚠ 另标**：**\"科权坐命→官做得很大\"是吉断**（**而它把\"官位\"与\"星象\"绑定，与前面\"官家之人居否卦必致退休\"正好是一对**）。","o":"TJ-0827 · 天纪·紫微详解·第五章紫微十二宫详解·第六例·改运（PDF 第140页）  ---"},{"t":"三百四十五、编者的第四次纠正","h":"\"只有到了第四大限才化忌，不影响生儿育女\"","c":"要点——**第七例末尾，编者（署名\"紫易奇缘\"）做了一次与前三次性质不同的纠正：前三次纠的是**排盘与宫位**，这一次纠的是**一个断命结论**。**原文**：\"**'主卧在西南，留有子女卧室'。'命主八字子女宫无主星，为空宫，表示命中无子女'。'阳宅东南为巽，也代表有女无子'——**讲义上说\"酉宫文昌化忌才无子女\"，真实是只有到了第四大限才化忌，所以命中这个忌不影响生儿育女**'。**\" **这一段的关键在\"本命忌\"与\"大限忌\"的区分**：**讲义说\"文昌在酉化忌→所以无子女\"**；**编者指出：那个\"酉宫化忌\"在**本命盘里并不成立**（**文昌本应在子宫，见前章安星口诀可复算**），**它只在**第四大限**才出现**——**而\"大限的忌\"与\"出不出生\"无关**。** **须说明（三层）**：**①这是编者的第四次公开纠正，也是**唯一一次针对\"结论\"而非\"排盘\"**的纠正**（**它的分量比前三次都重**：**前三次是\"算错了\"，这一次是\"结论本身不成立\"**）；**②其可用的核**：**\"文昌应在子宫\"可复算** ✓（**见前章\"子时戌上起文昌，逆到生时\"**），**而\"化忌落在本命还是落在某大限\"是可区分的两件事**（**前者影响一生，后者只影响那十年**）；**③⚠ 须标**：**编者纠的只是\"这一条断语不成立\"**，**而他没有跳出\"子女宫空宫＝无子女\"这个框架**（**即：他仍在体系内做\"这条忌没落上\"的技术辨析**，**而不是质疑\"星象能否定子女\"这件事本身**）。","o":"TJ-0828 · 天纪·紫微详解·第五章紫微十二宫详解·第七例·阳宅（PDF 第147页）"},{"t":"三百四十六、\"辰戌为天罗地网\"","h":"一次把流年、小限、对冲、四化叠加的断法","c":"方法——**第七例的流年部分，是全册\"复式断\"最完整的一次示范，须照录其叠加层次**：\"**'34 岁是 1994 年，为甲戌年；戌宫为流年太岁，与小限重叠——必主发生大事'。'什么大事？**辰戌为天罗地网**，流年太岁和小限被地网索困，对冲辰宫天罗'（'为本夫妻宫、又是大限疾厄宫'）——'丈夫病了'。'本命夫妻的三方为大限田宅，人在家中病（去）的'；'巨门、文昌化三忌，要命的病'。'伤使二煞索命，流年命干是戊（戊贪阴右机），乘天马而去……'**\" **本集拆解其叠加层次（五层）**：**①流年太岁**（**戌**）**＋②小限**（**同在戌，\"重叠\"**）**→\"必主大事\"**；**③\"辰戌为天罗地网\"**（**戌为地网、辰为天罗，两宫对冲**）；**④对冲辰宫**——**该宫既是本命夫妻宫、又是大限疾厄宫**（**双关：既管婚姻、又管疾病**）；**⑤\"巨门文昌化三忌\"＋\"伤使二煞\"**（**星煞再叠**）。** **须说明**：**这是讲义对\"大事如何被断出\"的完整示范**；**其可用的核**：**\"戊干四化为贪、阴、右、机\"**（**贪狼禄、太阴权、右弼科、天机忌**）**与本册十干四化表\"戊贪阴右机\"**完全吻合** ✓；**而\"辰戌为天罗地网\"是斗数的固定术语**（**可核其于册内一致使用**）；**⚠ 须重点标**：**\"要命的病\"\"二煞索命\"直接指向一个人的死亡**（**而这一整段是在**事后**组织的：**先知道丈夫已病故，再把\"流年重叠、天罗地网、三忌、二煞\"逐层摆上去**）——**这属\"事后配象\"，不是预测**。** **⚠ 本集明确：任何\"某人何时会死\"的推算，都不可对人说出**。","o":"TJ-0829 · 天纪·紫微详解·第五章紫微十二宫详解·第七例·流年（PDF 第146页）"},{"t":"三百四十七、\"变卦\"：姐姐一结婚就换了卦","h":"与\"长兄结婚变雷天大壮\"是同一条规则","c":"数据——**大有卦末尾有一句极短的注，却是理解全册\"变卦\"机制的钥匙，须照录并复算**：\"**注：**本人未婚，姐姐一结婚，此卦变成风天小畜卦**。**\" **本集复算（两卦）**：**①原局**——**\"次女住父位\"：次女＝离（中女）、父位＝乾；离上乾下＝**火天大有** ✓**；**②姐姐结婚后**——**姐姐＝巽（长女）；巽上乾下＝**风天小畜** ✓**。** **即：位没变（仍是父位／乾），变的是\"住在位上的人\"**（**次女出嫁前是\"离\"，姐姐嫁后\"长女\"成主，占位者变为\"巽\"**），**卦随之而变**。** **而这条规则与前文完全一致**：\"**'长兄一结婚，立刻变雷天大壮'**\"（**长子＝震；震上乾下＝雷天大壮**）——**也是有\"人\"（震）＋\"位\"（乾）**。** **须说明**：**这是本集对\"变卦\"机制的第二次复算，两次规则一致 ✓**；**其可用的核极准**（**\"人＋位\"两项确定，卦名即可推出**）；**⚠ 而须标**：**\"变卦\"的关键在\"谁住在位上\"**（**而\"谁住\"是家事安排，与\"命\"无关**）——**即：这套系统把\"家庭成员变动\"读成\"卦变\"**，**而\"卦变\"又被读成\"运变\"**（**这一层跳跃不可核**）；**⚠ 另标**：**\"姐姐一结婚就变\"这一条，还暗示\"姐姐嫁出＝位空出\"**（**它与前章\"东宫大儿子结婚，二儿子补上去住\"是同一套**递补**逻辑**）。","o":"TJ-0830 · 天纪·紫微详解·第四章卦象详解·火天大有·名位不等（PDF 第149页）"},{"t":"三百四十八、第十二次验证：大有卦","h":"\"○×○○○○\"与\"砍树摸雀\"","c":"数据——**大有卦的符号给了第十二个可核点**。**原文**：\"**火天大有：'○×○○○○'（砍树摸雀）上中。**\" **本集核对卦体**：**火天大有＝离上乾下；下乾（初九阳、九二阳、九三阳）、上离（九四阳、六五阴、上九阳）**（**即自下而上：阳、阳、阳、阳、阴、阳**）。** **比对**：**自左向右得\"阳、阴、阳、阳、阳、阳\"——不符**（**第五爻才是阴**）；**自右向左得\"阳、阳、阳、阳、阴、阳\"——完全吻合** ✓。** **至此\"自右向左\"已十二次验证**（**屯、蒙、需、讼、师、比、小畜、履、泰、否、同人、大有**）。** **而这一卦的\"阴\"落在第五爻**（**与同人卦的\"阴\"在第二爻正好相对**）——**两卦的阴位一前一后，而两读比对下仍只有\"自右向左\"成立**，**这是\"方向确定\"最强的证据之一**。** **须说明**：**这是本集第十二次符号核验**；**其可用的核极准**；**⚠ 而须标**：**\"砍树摸雀\"这个吉语，与\"○×○○○○\"之间仍无因果关系**（**而\"上中\"这一评级，在册内另有一套分级，可核其用字一致**）。","o":"TJ-0831 · 天纪·紫微详解·第四章卦象详解·火天大有·文王金钱课（PDF 第149页）"},{"t":"三百四十九、\"毅力坚强\"与\"耍派头、撑面子\"","h":"大有卦的一正一反","c":"要点——**大有卦\"性格\"段，把一个人的\"强\"与\"强\"的代价并排写出**：\"**上离下乾、天上有火，属于火克金，'火在上，居高临下，有领导力'。'个性毅力坚强、心胸宽阔、处事沉稳、是非分明，敢担当重任、力排万难——富贵之象、能成名立业'。'火克金，重名利，耍派头、撑面子、较真、功力，尤其喜欢当公众人物'。健康方面：'不利于乾（老翁），有咳嗽、吐血'；'破财、官非、诉讼之象'。**\" **这一段的精处在**同一个\"火克金\"同时生出了正反两面**：**正面是\"毅力坚强、敢担当、力排万难\"**（**因为火在上，居高临下，有领导力**）；**反面是\"耍派头、撑面子、较真\"**（**因为火克金——\"金\"被克，就成了\"面子\"与\"排场\"上的消耗**）。** **而\"尤其喜欢当公众人物\"这一句最准**：**它不是\"喜欢出名\"，而是\"需要一个观众\"**（**因为\"撑面子\"这件事，必须有人看见**）。** **续论给了正面的一半**：\"**火天大有卦是天上有火，火高悬于天，象征拥有大的收获。'众人拾柴火焰高'；'自天佑之'，象征天命所归、得人心、得天下、物归我有，所以吉顺。日丽中天，高高在上。**\" **须说明**：**这是讲义对大有卦性格的论述**；**其可用的核**：**\"强而好面子\"这一层，在现实里是成立的**（**而\"撑面子\"往往正是\"能力很强但消耗很大\"的人的标志**）；**⚠ 须标**：**\"不利于乾（老翁）、有咳嗽、吐血\"属医学断言**（**而\"吐血\"这类具体病症，绝不可当作健康提示**）。","o":"TJ-0832 · 天纪·紫微详解·第四章卦象详解·火天大有·性格（PDF 第148页）"},{"t":"三百五十、\"肖犬之小姐居此局反之\"","h":"一个明确的条件反转","c":"方法——**大有卦\"地脉道\"（次女住父位）给了四条，而在四条之后，紧接了一个**条件反转**，须照录**：\"**火天大有（次女住父位，自己未婚、姐姐未嫁）：'未婚之女，娇美如花，事业上功成名就，但婚姻不好，即为此局之人'。**\" **四条（照录）**：**①\"性阳刚过人，倔强固执，本性展现无遗\"**；**②\"不重视婚姻，也不在乎婚姻，唯对子女独有所钟——有**未婚生子**之象，且不在乎人言，且主得二子\"**；**③\"如遇命中婚姻顺畅，则比同时生人要**早三年**成婚\"**；**④\"命中事业旺、祖业大之人，再加上此局，势必为**女承父业**之象，兄弟无力\"**。** **而反转紧接其后**：\"**'**肖犬之小姐居此局，反之，必主大吉大利**——智慧高、婚事吉、事业顺利，婚后有二子双生之象'。**\" **须说明（两层）**：**①这是本册少见的一处\"同一局、因人而异\"**（**同样是\"次女住父位\"，属狗的人结果**完全相反**）；**②它的出现，在体系内部是**一条自我限定的裂缝**——**如果一个\"局\"的吉凶能被\"生肖\"整条翻转，那\"局\"本身就不是决定性的**。** **⚠ 须重点标**：**②中\"未婚生子之象\"这一条，把一种家庭形态当作\"局\"的产物**（**而\"不在乎人言\"四字，恰说明这套体系对它是有评判的**）；**而\"兄弟无力\"\"女承父业\"这类断语，也都在替一个家庭预设结局**。","o":"TJ-0833 · 天纪·紫微详解·第四章卦象详解·火天大有·地脉道（PDF 第148页）"},{"t":"三百五十一、\"又姓狄、又肖犬\"","h":"一条把姓名与生肖叠加到极致的断言","c":"要点——**大有卦\"先天\"栏，出现了一句全册最极端的\"姓名—命运\"断言，须照录并标**：\"**'术中兄弟二人，谋略过人，生极富'。'狗人逢之必加吉，男招贵妻，女招贵夫'。'名狄，肖犬，是真形'——**如果那个人，又姓狄，又肖犬，会建立不世之功；如果再（加上）时运到了，这种人都会有机会做到天子**！'**\" **本集拆其构（两层）**：**①\"狄\"字从\"犬\"**（**\"狄\"的构字含\"犬\"旁，故\"姓狄\"与\"肖犬\"被读成\"真形\"）**；**②两层叠满**（**姓＋生肖→\"不世之功\"→\"做到天子\"**）。** **须说明**：**这是讲义对\"姓名—生肖—命运\"最集中的一次推演**；**其可用的核**：**\"狄\"字含\"犬\"旁是可核的字形事实** ✓；**⚠ 而须重点标**：**\"又姓狄、又肖犬→会建立不世之功→有机会做到天子\"这一串，没有任何依据**——**一个人的成就取决于能力、机会与选择，与姓氏和生肖无关**；**而\"做到天子\"这一层，更是一句**不可兑现的许诺**（**它会让听者产生一种\"我天生该做大事\"的错觉**）。** **⚠ 另须标**：**\"狗人逢之必加吉\"与前条的\"肖犬反之\"是同一路的\"生肖加成\"**（**而它在册内可核其一致使用**，**但\"一致\"不等于\"有效\"**）。","o":"TJ-0834 · 天纪·紫微详解·第四章卦象详解·火天大有·先天（PDF 第148页）"},{"t":"三百五十二、\"药王\"与\"犬为戌\"","h":"一张画里的三个吉象","c":"要点——**大有卦的卦图，把\"药王、犬、孕妇\"三样东西读成一串吉兆，是\"图—象—事\"转换的完整示范**：\"**'结果难测'。'左侧为一药王，说明**临产遇良医**——其人手中持药，药还有光，说明必定灵验；药王持（有）宝葫芦，里面装着药，起到**稳固胎气**'。'药王旁边为一**犬**，主**戌日有喜**——犬为戌，**戌为火库，内藏有火，是为\"大有\"之象**'。'此为**金玉满堂之卦、日丽中天之象**'。'右侧有一孕妇，腹中有一道喜气冲天；气中两小儿，主**有双胎**；但性别不知'。**\" **须说明**：**这是讲义对大有卦图的著录**；**其可用的核**：**\"犬＝戌\"是地支与生肖的固定对应** ✓（**而\"戌为火库\"是五行术语**，**可核其于册内一致**）；**⚠ 须重点标**：**\"药王持药、药还有光→必定灵验\"这一条，是本册又一次的\"图画即应验\"**（**它的逻辑是：**画上有个药王拿着发光的药，所以产妇会遇到好医生**）——**而这与\"临产是否平安\"毫无关系**；**⚠ 另标**：**\"气中两小儿，主有双胎；但性别不知\"**——**这一句难得地**留了白**（**讲义承认\"性别不知\"**），**而这种\"留白\"在全册里极少**，**可核其作为\"有限度表述\"的一例**。","o":"TJ-0835 · 天纪·紫微详解·第四
