」**：**「①伤口须先清创 + 破伤风预防；②糖敷有感染风险（尤其糖尿病）；③深伤/出血不止须急诊」** ✓✓","o":"RJ-2233 · 《人纪·神农本草经》上经第一百二十一味，讲解（PDF 第 293–294 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"甘蔗水与糖的寒温","c":"讲义讲「一个极精的生熟异性」：「**那蔗糖呢甘寒，一般直接挤压蔗糖水出来，甘蔗挤水、甘蔗水甘味而且是带寒的。****但是你烤过以后、煮热过煮熟以后，就变甘温了，药性就变成温性的。****甘温能够除大热，所以有时候发烧小孩子发烧怎么样，用蔗糖用甘蔗水煮热比较好。****光是一味糖就有那么好的效果。**」\n\n**【极精】甘蔗水：生 = 甘寒；煮 = 甘温除大热**\n\n```\n生甘蔗水 → 甘寒\n煮热甘蔗水 → 甘温 → 除大热\n```\n\n**「一味糖，两种性」——「这是最精的生熟异治。」** ✓✓","o":"RJ-2234 · 《人纪·神农本草经》上经第一百二十一味，讲解（PDF 第 294 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"酸甘化阴","c":"讲义讲「一个极实用的配」：「**比如说你要吃柠檬，柠檬汁很好啊；新鲜柠檬买来是酸味的，酸味是不是入肝的？可以清肝清胆。****可是你过食酸，会抽筋嘛；那你加点甜味下去、加点蔗糖下去。****如果你的蔗糖再加柠檬，酸甜混在一起，那是最好家庭制的柠檬水、柠檬糖水。**」\n\n**【极精】酸 + 甘 = 化阴（不抽筋）**\n\n```\n酸（柠檬）+ 甘（蔗糖）\n  → 酸甘化阴 → 不抽筋\n```\n\n**「酸甜混在一起最好」——「这条与 n194酸甘化阴」同一主题。** ✓✓","o":"RJ-2235 · 《人纪·神农本草经》上经第一百二十一味，讲解（PDF 第 294 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"蜂蜜蜂蜡蜂子的本草条目","c":"【本经原文】「**味甘平，主风头，除蛊毒，补虚羸伤中；久服令人光泽好颜色不老；大黄蜂子主心腹胀满痛，轻身益气，土蜂子主痈肿。**」【主治】「**蜂蜜为润脏腑要药，主益气补中，滋养脾胃，调和营卫，治五脏不足，肠胃燥结，肌肉疼痛，除心烦，疗肠澼，作榳入谷道，导便秘。****蜂蜡为止血、安胎、补益药，治孕妇胎动下血有殊效，又为硬膏基础剂。****蜜蜂子为补虚、解毒药，治麻风病及肠寄生虫结聚腹痛。**」【别录】「**蜂蜜益气补中，止痛解毒，除众病，和百药，久服强志轻身。**」【用量】「**可做食品，无定量。**」【禁忌】「**无。**」\n\n**【极重要】蜂蜜/蜂蜡/蜂子三味**\n\n| 药 | 用 |\n|---|---|\n| **蜂蜜** | **润脏腑/补中/导便秘** |\n| **蜂蜡** | **止血/安胎/硬膏基础** |\n| **蜂子** | **补虚/解毒** |\n\n**「一窝蜜蜂三味药」——「这是最精的一窝三药。」** ✓✓","o":"RJ-2236 · 《人纪·神农本草经》上经第一百二十二味「蜂子、蜂蜜、蜂蜡」，原文（PDF 第 295–296 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"蜜煎导法","c":"讲义讲「一个极精的古法」：「**在经方里面《伤寒论》里面有蜜煎导法。****蜜煎导法就是用蜂蜜把它熬熬熬很浓，水份一直发掉；在它挥发越来越粘、快要结晶的时候，你一直在翻动它，就会变成一个圆锥形的。****或者是你把它放在一个椎形的模子里面（很烫哦要小心），倒进去变成一个椎形的。****这个时候你塞到肛门里面去；西医用甘油碇，中医通大便。****大便排不出来、肛门口太硬，我们塞蜂蜜进去；但是你这个蜂蜜软软粘粘的、你怎么塞进去？那必须要用做的、熬过以后。**」\n\n**【极重要】蜜煎导法 = 古代灌肠（栓剂）**\n\n```\n蜂蜜熬浓 → 圆锥形 → 塞肛\n  → 导便秘（古代开塞露）\n```\n\n**「这是最精的古代栓剂」——「这条与 n182滑石利窍」、n188「大黄后下」同一逻辑。** ✓✓","o":"RJ-2237 · 《人纪·神农本草经》上经第一百二十二味，讲解（PDF 第 296–297 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"蜂蜡点白发","c":"原文【甄权】「**蜂蜡主孕妇胎动，下血不绝欲死，以鸡子大煎三五沸，投美酒半升立愈；又主白发镊去，消蜡点孔中即生黑发。**」讲义：「**你可以把白的头发呢把它拔起来，拔起来呢那个洞点一下那个蜂蜡在里面，再生出来就是黑发。****这个都无所谓你可以试看看；当然你精神要很多，因为有时一票白发，一搓哇、很麻烦。**」\n\n**【极精】蜂蜡点白发**\n\n```\n拔白发 → 点蜂蜡 → 生黑发（讲义说）\n```\n\n**须「标」**：**「①拔发不会改变毛囊色素；②不可相信；③白发须查营养/甲状腺/遗传」** ✓✓","o":"RJ-2238 · 《人纪·神农本草经》上经第一百二十二味，讲解（PDF 第 296–297 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"牡蛎的本草条目","c":"【本经原文】「**味咸平，主伤寒寒热温疟，洒洒惊恚，怒气除拘，缓鼠瘘，女子带下赤白；久服强骨节，杀邪气延年。**」【产地】「**产浅海泥沙中，右壳小而薄、左壳大而凸，常连缀重叠，附于岩石。**」【性味】「**味咸，性平，微寒，无毒。**」【主治】「**牡蛎为软坚利水、敛汗固肠要药，主益肝肾，除老血，治伤寒，留热在骨间，化痰破积，去胁下坚满，涩大小肠，清热安神。**」【用量】「**普通三四钱。**」【禁忌】「**恶麻黄细辛吴萸伏磠砂；凡病虚而有寒者忌；肾虚无火、寒精自出者亦忌。**」\n\n**【极重要】牡蛎的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **咸/平/微寒** |\n| **主治** | **软坚利水/敛汗固肠/益肝肾** |\n| **禁** | **虚而有寒/肾虚无火** |\n\n**「软坚利水、敛汗固肠」是最精的八字定位** ✓✓","o":"RJ-2239 · 《人纪·神农本草经》上经第一百二十四味「牡蛎」，原文（PDF 第 298 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"三个动悸的分部","c":"原文【药征】「**主治胸腹之动也，旁治惊狂烦躁。****牡蛎黄连龙骨同治烦躁，而各有所主也：心口黄连所主，脐下龙骨所主也，而部位不定、胸腹烦躁者，牡蛎所主也。**」\n\n**【极重要】三个动悸的分部**\n\n```\n心口动悸 → 黄连\n脐下动悸 → 龙骨\n胸腹不定 → 牡蛎\n```\n\n**「动悸三分」——「这条与 n212脐下动悸=龙骨」同一主题。**要点：**这一条极重要，它是「动悸的三分部」** ✓✓","o":"RJ-2240 · 《人纪·神农本草经》上经第一百二十四味，原文引《药征》（PDF 第 298 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"牡蛎软坚治甲状腺","c":"讲义讲「一个极精的对应」：「**牡蛎呢味咸，咸味；大家都知道咸可以怎么样？软坚。****坚硬的东西都可以用；而牡蛎的咸味，最主要是针对，除了肾脏以外，就是甲状腺肿瘤、甲状腺。****因为牡蛎里面有什么？碘嘛，海里面的东西；海里面出来的东西，对我们的瘿瘤（我们叫瘿），过去我们称为瘿。****瘿讲的就是现在的甲状腺肿瘤，效果都会非常的好。**」\n\n**【极重要】牡蛎 = 软坚 + 含碘（甲状腺）**\n\n```\n牡蛎（咸、含碘）\n  → 瘿（甲状腺肿/瘤）\n```\n\n**「瘿就是甲状腺肿瘤」——「这是最精的古名对今名。」**要点：**须「标」**：**「①甲状腺结节须超声 + 甲功；②碘不能治甲癌（有些甲癌忌碘）；③须专科」** ✓✓","o":"RJ-2241 · 《人纪·神农本草经》上经第一百二十四味，讲解（PDF 第 298–299 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"牡蛎补骨不是钙片","c":"讲义讲「一个极有意思的对比」：「**我们用汤剂的时候，用它的咸味、入肾，才能够补骨。****你拿牡蛎去煮，我们煮的汤来喝，跟你吃的那个钙片，不一样的结果。****吃牡蛎的那个汤、我们的汤剂的时候使用，可以骨头增生很快。****像我治疗骨头断掉、骨折的病人，西医到医院去接好；那骨头裂开、断开在那，你用中药治的时候，牡蛎就很好用。**」\n\n**【极重要】牡蛎补骨（汤剂 ≠ 钙片）**\n\n```\n牡蛎汤（咸入肾）→ 补骨\n钙片 → （讲义说）不补骨\n```\n\n**须「标」**：**「①钙片是有效的（骨质疏松须钙 + 维D）；②『钙片把骨头里的钙打出来』是错误；③不可停钙」** ✓✓\n\n**极精！！\"牡「蛎粉止盗汗\"** ✅✓\n- **\"牡蛎打粉的话，可以止小儿盗汗；让你扑在身上，那个粉扑在身上，就好像痱子粉一样扑在身上，可以止盗汗\"** ✓✓\n\n**【极精】\"牡「蛎粉= 止盗汗（外用）\"** ✅✓","o":"RJ-2242 · 《人纪·神农本草经》上经第一百二十四味，讲解（PDF 第 299 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"龟甲的本草条目","c":"【本经原文】「**味咸平，主漏下赤白，破症瘕疟痎，五痔阴蚀，湿痹四肢重弱，小儿囟不合；久服轻身不饥。**」【产地】「**处处有之，生池泽及海水中；其甲即龟甲，肉亦入药。**」【性味】「**味甘咸，性平，无毒。**」【主治】「**龟板为益阴滋血要药，主补心肾，益大肠，去瘀血，续筋骨，治久疟、劳复、血痹、湿痹、症瘕、产难、久痢久泻。**」【别录】「**惊恚气，心腹痛不可久立，骨中寒热，伤寒劳复；或肌体寒热欲死，以作汤良**」\n\n**【极重要】龟甲的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘咸/平/无毒** |\n| **主治** | **益阴滋血/补心肾/续筋骨** |\n\n**「龟鹿二胶」形成对药：龟甲（阴）+ 鹿角胶（阳）** ✓✓","o":"RJ-2243 · 《人纪·神农本草经》上经第一百二十五味「龟甲」，原文（PDF 第 300 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"龟甲续：对药与三方","c":"【容川】「**龟之性伏，其精在板，能通任脉；任为离中之阴，以下交于督，合为既济之象，故龟板益阴滋心肾；与鹿茸是对子；以水配火，不使壮火食气，如此气纳矣。**」【用量】「**普通二至四钱。**」【禁忌】「**妊娠及病人虚而无热者均忌；凡使用时须研极细，否则留滞肠胃，能变症瘕，鳖甲亦然。**」讲义列方：「**大补阴丸（黄柏知母熟地败龟板）治阴亏火旺、肺痿咳血、呃逆烦热易饥、骨蒸盗汗、足膝疼热虚劳；龟鹿二仙膏（败龟板鹿角枸杞人参）主大补精髓，益气养神，治视物不清；加味芎归汤，治横生倒产、交骨不开，用以催生良。**」\n\n**【极重要】龟甲续：对药与三方**\n\n| 药/方 | 内 |\n|---|---|\n| **龟板 + 鹿茸** | **对子（阴 + 阳）** |\n| **大补阴丸** | **阴亏火旺** |\n| **龟鹿二仙膏** | **大补精髓** |\n\n**「任为离中之阴，以下交于督，合为既济之象」——「这是最精的气化描述。」**要点：**这一条极重要，它是「龟鹿对药」** ✓✓","o":"RJ-2244 · 《人纪·神农本草经》上经第一百二十五味，原文引唐容川（PDF 第 300 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"龟板通任脉","c":"讲义讲「一个极重要的性质」：「**龟之性伏，其精在板，能通任脉；任为离中之阴，以下交于督，合为既济之象，故龟板益阴滋心肾。****与鹿茸是对子；以水配火，不使壮火食气，如此气纳矣。**」\n\n**【极重要】龟板 = 通任脉（既济）**\n\n```\n龟板（任脉，阴）→ 下交于督\n  + 鹿茸（督脉，阳）→ 龟鹿二仙\n    = 既济（水火既济）\n```\n\n**「龟鹿二仙」是中医最经典的对药。**","o":"RJ-2245 · 《人纪·神农本草经》上经第一百二十五味，讲解（PDF 第 300–301 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"舌顶上腭任督相通","c":"讲义讲「一个极有趣的观察」：「**诸位看那个乌龟，乌龟壳在这边……乌龟的头伸出来的时候，你看嘴巴——如果这样仔细看看嘴巴哦，它的舌头永远是顶在上面。****乌龟的舌头顶在上腭，它天生如此，所以它天生任督二脉是通的，所以乌龟很长寿。****所以诸位平常没事，就算你开车回哪里去哪里、平常坐飞机，随时舌头顶在上腭，一直是顶在上腭，把它养成习惯。****养成习惯以后，你常常训练气沉丹田，因为随时你行走坐卧，你无时无刻不在练功。**」\n\n**【极精】舌顶上腭 = 任督相通（最简的养生）**\n\n```\n舌顶上腭 → 任督相通\n  → 气沉丹田\n    = 行走坐卧都在练功\n```\n\n**「乌龟很长寿」——「这条与 n210气沉丹田」同一主题。** ✓✓","o":"RJ-2246 · 《人纪·神农本草经》上经第一百二十五味，讲解（PDF 第 301 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"小儿囟门不合用龟甲","c":"讲义讲「一个极具体的对应」：「**有一种病，小孩子呢、这个头顶的骨头……软骨，密合的不好，一个洞子在里面没有密合。****用龟甲效果最好，一下子就合起来了，最明显。**」\n\n**【极精】小儿囟门不合（解颅）→ 龟甲**\n\n**须「标」**：**「囟门闭合迟须查佝偻病/甲状腺/脑积水」** ✓✓","o":"RJ-2247 · 《人纪·神农本草经》上经第一百二十五味，讲解（PDF 第 300 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"龟甲须研细","c":"原文【禁忌】「**妊娠及病人虚而无热者均忌；凡使用时须研极细，否则留滞肠胃，能变症瘕，鳖甲亦然。**」\n\n**【极精】龟甲须研细（否则留滞）**\n\n**「这条与 n214牡蛎粉须细」同一体系。** ✓✓","o":"RJ-2248 · 《人纪·神农本草经》上经第一百二十五味，原文（PDF 第 300 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"桑螵蛸的本草条目","c":"【本经原文】「**味咸平，主伤中，疝瘕阴痿，益精生子，女子血闭，腰痛，通五淋，利小便水道；今名桑螵蛸。**」【产地】「**处处有之，乃螳螂所作房，着生于桑枝上者。**」【性味】「**味咸甘，性平，无毒。**」【主治】「**桑蜱蛸为固肾益精要药，主遗尿，滑精，治白浊疝瘕，肾衰阴痿，通五淋，疗便浊。**」【别录】「**疗男子虚损，四脏气微，梦寐失精，遗溺，久服益气养神。**」【甄权】「**炮熟空心食之，止小便利。**」【吴克潜】「**桑螵蛸为小儿梦中遗尿要药，得覆盆子菟丝子益智仁补骨脂等甚效，合龙骨疗滑精。**」【用量】「**普通一钱至三钱。**」【禁忌】「**凡膀胱有热，小便短数者忌之。**」\n\n**【极重要】桑螵蛸的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **咸甘/平/无毒** |\n| **主治** | **固肾益精/止遗尿/止滑精** |\n| **禁** | **膀胱有热/小便短数** |\n\n**「固肾益精」——「桑螵蛸散（桑螵蛸、远志、龙骨、菖蒲、人参、茯神、龟板、当归）治小便日数十次、如稠米泔色、心神恍惚。」** ✓✓","o":"RJ-2249 · 《人纪·神农本草经》上经第一百二十六味「桑螵蛸」，原文（PDF 第 301–302 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"桑螵蛸生精又固精","c":"讲义讲「一个极重要的双向」：「**这个桑螵蛸呢，实际上就是螳螂的幼虫。****那这个桑螵蛸呢，也是益精生子；它也是味道比较咸平的。****我们用在滋补的药里面用到很多补肾、补肾益精的药，男女都可以用；那桑螵蛸呢，有固肾的功能，益精又固肾、固精的功能。****那有的人呢，比较早泄、早泄的话，你开一些比如菟丝子啊、覆盆子啊，这种都是生精子的药，并没有固阳的药，对不对？****你要固守嘛，固守的时候，你用到桑螵蛸可以固守，龙骨、固守它，锁阳、固住它，精就不会出来。**」\n\n**【极重要】桑螵蛸 = 生精 + 固精（一药两能）**\n\n```\n菟丝子/覆盆子 → 生精（种子）\n桑螵蛸/龙骨/锁阳 → 固精（守）\n```\n\n**「生精 + 固精 = 一对」——「这是最精的双向。」** ✓✓","o":"RJ-2250 · 《人纪·神农本草经》上经第一百二十六味，讲解（PDF 第 302 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"遗尿针夜尿点加桑螵蛸","c":"讲义讲「一个极实用的配」：「**像甄权呢，他说这个桑螵蛸这种药，你烤啊……烤啊，就象烤肉一样，烤烤就可以吃啦，很好吃啊、很香啊。****所以这个就是能够止小便；小便的时候没办法控住，老年人吃了就可以。****那小孩子遗尿啊、尿床都可以。****那你如果说针灸很熟，扎了小朋友那个夜尿点，通一下它；然后再给他吃点桑螵蛸，烤点桑螵蛸给他吃，晚上看他尿不尿。**」\n\n**【极精】遗尿 = 针夜尿点 + 桑螵蛸**\n\n**「针 + 药」——「这是最精的组合。」** ✓✓","o":"RJ-2251 · 《人纪·神农本草经》上经第一百二十六味，讲解（PDF 第 302 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"以意取象","c":"讲义讲「一个极重要的本草方法论」：「**那为什么我们会用它……经方……《神农本草经》里面说海蛤？是以意来取的。****不是说我们中国以前用化学去分析。****是这个海蛤呢，它被切成一片一片的，本身就碎下来一片一片。****你想象一下攻坚的力量强不强？打成一片一片的，那肿瘤被打散掉，要海蛤比文蛤好，这样想就好。****所以你说化痰软坚，文蛤跟海蛤比较，海蛤绝对会比文蛤强很多。**」\n\n**【极重要】以意取象（碎片的攻坚）**\n\n```\n海蛤（天然成碎片）→ 打散肿瘤\n文蛤（整体）→ 力较弱\n```\n\n**「不是化学分析，是意取」——「这条与 n181医者易也」、n194「取象」同一主题。** ✓✓","o":"RJ-2252 · 《人纪·神农本草经》上经第一百二十七味「海蛤」，讲解（PDF 第 304–305 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"淡水鱼的土味是药性","c":"讲义讲「一个极精的判据」：「**那这个鲤鱼呢，最主要是，我们排水、面目浮肿、形成肚子积水、腹水都可以使用。****味道甘寒，诸位记得哦，为什么要这个淡水鱼？因为淡水鱼都有土味。****凡是有土的厚味的，就可以用。****所以，老用大头鳊，没有土味就没有效。****那土味很重的、淡水鱼、鲤鱼土味很重，它是在土里面活到的；它水里面跑啊，当然一定能够排水，不排水它淹死啊。**」\n\n**【极精】土味 = 药性（没土味无效）**\n\n**「咸味/土味就是药性」——「这条与 n181只记味道」、n185「天时气味」同一主题。** ✓✓","o":"RJ-2253 · 《人纪·神农本草经》上经第一百二十九味「蠡鱼」，讲解（PDF 第 305–306 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"水与湿要分治","c":"讲义讲「一个极重要的区别」：「**老师，我这个……痔疮，肛门口常常湿湿黏黏的，赤小豆！去湿嘛。****我们有当归赤小豆散，病人一开口以后你就听到，听到以后你的处方已经出来了。****痔疮只是一个形，诸位要用药要用神、药的神；所谓药的神不是说你要用药如神，而是你要加入用药的精神所在。****我跟你讲去湿，老师、这个伤口粘嗒嗒的一直流脓、一直流水出来，收不了口，赤小豆去湿啊。****鲤鱼不能去湿啊，鲤鱼只能去水啊。****那个水积在里面、一直有湿来的，湿太盛才积水；所以你要排水跟去湿加在一起才有用。**」\n\n**【极重要】水 ≠ 湿（先去湿再利水）**\n\n```\n湿（粘稠）→ 赤小豆/白术/苍术\n水（稀）→ 泽泻/猪苓/车前子/鲤鱼\n\n湿太盛才积水 → 先治湿，再利水\n```\n\n**「先治湿再利水」——「这条与 n184白术/苍术」、n206「猪苓」、n209「泽泻」同一主题。** ✓✓","o":"RJ-2254 · 《人纪·神农本草经》上经第一百二十九味，讲解（PDF 第 306–307 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"煨熟取土性","c":"讲义讲「一个极精的炮制」：「**那水肿胀满，还有另外一种吃法：你把鲤鱼呢，肚子剖开来、把内脏去掉，就拿白矾、生的白矾末塞到肚子里面。****都不要加盐水啊，就新鲜的把鲤鱼鳞把它去掉，肚子劈开，拿白矾五钱塞进去；然后用牙签给它扎住，外面用铝箔包起来。****过去呢，是放在土里面烤；你如果说真的有土灶，直接焖在土里面煨熟。****什么叫煨熟？煨熟就是说这个是一堆土堆，你火在周围烧，那你把那个鲤鱼拿到土堆里面，这就叫做煨。****煨熟有它的功能，为什么？取它的土性、土的性。**」\n\n**【极重要】煨熟 = 取土性（强脾排水）**\n\n```\n鲤鱼 + 白矾 → 黄土煨熟\n  → 取土性 → 强脾 → 排水（鼓胀）\n```\n\n**「取土性」——「这是最精的炮制取象。」** ✓✓","o":"RJ-2255 · 《人纪·神农本草经》上经第一百二十九味，讲解（PDF 第 307–308 页）。"},{"t":"神农本草经·上经：龟甲（续）、桑螵蛸、海蛤/文蛤、蠡鱼（鲤鱼）、鲤鱼胆","h":"鼓胀病机肝脾水","c":"讲义讲「一条极精的病机链」：「**我们的鼓胀，肚子大起来，都是脾阳不够、脾脏出问题。****那脾脏为什么出问题？因为肝有问题啊，肝有问题影响到脾，脾脏受到肝的迫害，脾脏无力了。****要怎么样强脾的功能、把水排掉？因为脾统水，全身的水是脾脏在管。**」\n\n**【极重要】鼓胀病机：肝 → 脾 → 水**\n\n```\n肝病 → 克脾（木克土）\n  → 脾阳不足 → 不能统水\n    → 腹水/鼓胀\n```\n\n**「肝→脾→水」——「这条与 n143见肝病当先实脾」、n171「治肝固脾」同一主题。** ✓✓","o":"RJ-2256 · 《人纪·神农本草经》上经第一百二十九味，讲解（PDF 第 308 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"甘淡渗利为阳","c":"讲义讲「一个极重要的第六味」：「**这个象莲子呢，淡味渗泻为阳；诸位记不记得我们前面就开始讲：所有本草上经的淡味，它能够渗泻的，都是阳药。****我们不是酸苦甘辛咸嘛，这是味厚的、这是五味；另外独立一味就是淡味，这是阳药。****平常就可以吃淡味的。****但是淡味的药，平常让你吃都可以吃，象莲子，非常好用，这个滋润。****这个你这样子，用观想：老师莲子是白色的，入肺嘛，介绍完了，就已经入肺了。**」\n\n**【极重要】甘淡渗利为阳（第六味）**\n\n```\n五味（酸苦甘辛咸）+ 第六味「淡」\n  → 淡味渗泻 = 阳药\n    → 可日常（莲子/薏仁/芡实/淮山）\n```\n\n**「五味之外还有一味淡」——「这条与 n181五味之义」、n182「阴阳之义」同一主题。** ✓✓","o":"RJ-2257 · 《人纪·神农本草经》上经第一百三十一味「藕实茎」，讲解（PDF 第 309 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"湿的三源与小湿即排","c":"讲义讲「一个极重要的湿学」：「**味道很甘，甘淡利湿；我们身上都会有些湿的累积，很正常。****比如说你现在正在做木工、你流一身汗……结果你坐在那边休息、风在那边吹，汗就停住了。****总是偶尔会有些湿在身体里面；你吃东西也会有些湿在里面，吃坏肚子也会有些湿在里面。****你要随时，有一点小小累积湿的时候你就把它排掉，那你怎么会有大病呢。****湿就是黏黏的象痰一样，老痰、胶痰啊；正好停在骨头上，那是风湿啊。**」\n\n**【极重要】湿的三源与小湿即排**\n\n```\n湿三源：汗停（被风吹）+ 吃 + 病后\n  → 小湿即排（莲子/薏仁/芡实/淮山）\n    = 上经的定义（治未病）\n```\n\n**「小湿即排」——「这条与 n174治病于治之初」、n142「小病就要动手」同一主题。** ✓✓","o":"RJ-2258 · 《人纪·神农本草经》上经第一百三十一味，讲解（PDF 第 309–310 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"四臣汤四味","c":"讲义讲「一个极精的四味」：「**那象我们前面介绍的淮山，淮山是不是甘淡的？象莲子、薏仁，薏仁是不是甘淡的？加上我们后面还要介绍的芡实；你看外边路边的四臣汤，就这四个药。****那甘淡，平常你就可以吃；没事就拿来煮。****诸位常常保持这样子，甘淡味的东西常常吃，身上没有累积湿，你根本就没有病。****这就是本草上经的定义：上经就是你能够常常这样子维持身体的话，延年益寿、不老神仙。**」\n\n**【极精】四臣汤 = 淮山 + 莲子 + 薏仁 + 芡实（全甘淡）**\n\n**「四味全甘淡」——「这是最精的四味。」** ✓✓","o":"RJ-2259 · 《人纪·神农本草经》上经第一百三十一味，讲解（PDF 第 310 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"莲子去芯","c":"讲义讲「一个极精的细节」：「**一般来说我们莲子把中间的芯去掉；任何的芯都是烦躁的，会造成烦躁的，所以把芯拿掉，就不会烦。****如果你连着芯在吃，这个时候人就会比较烦躁。****所以我们在吃的时候里面都没有芯的。**」\n\n**【极精】莲子芯 = 烦躁（去芯）**\n\n**「芯令人烦」→「去芯」。** ✓✓","o":"RJ-2260 · 《人纪·神农本草经》上经第一百三十一味，讲解（PDF 第 312 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"莲子利尿太强会涩大便","c":"讲义讲「一个极实用的副作用」：「**如果煮熟吃太多，涩大便，因为他通利小便，利尿的功能很强啊，大便就干掉了。****所以你不要吃太多；你要吃莲子的话，因为它利尿很强，你可以要吃些增润的药。****所以会把淮山放进去，淮山就是滋润的药；光吃莲子的话就一直利小便啊。****所以吃了莲子汤你就没事跑厕所嘛，小便太多，大便自然就干掉了。**」\n\n**【极精】莲子 + 淮山/猪肠 = 一利一润（配对）**\n\n**「一利一润」——「这是最精的配伍。」** ✓✓","o":"RJ-2261 · 《人纪·神农本草经》上经第一百三十一味，讲解（PDF 第 311–312 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"大枣的本草条目","c":"【本经原文】「**味甘平，主心腹邪气，安中养脾，助十二经，平胃气，通九窍，补少气少津液，身中不足，大惊，四肢重，和百药；久服轻身长年。**」【性味】「**味甘，性平，无毒。**」【主治】「**大枣为补中益气、和解百药要药，主养脾平胃，调荣卫，生津液，润心肺，治虚损。**」【别录】「**补中益气，坚志强力，除烦闷，疗心下悬，除肠癖。**」【之才】「**杀乌头附子天雄毒。**」【药征】「**主治挛急引强急也，旁治咳嗽奔豚烦躁，身疼胁痛，腹中痛。**」【用量】「**普通二至三钱。**」【禁忌】「**生枣多食，令人热渴膨胀、动脏腑，损脾元，助湿热；忌与葱鱼同食；凡中满者、小儿疳病者、齿痛及患痰热者，均忌。**」【容川】「**大枣禀火之赤色，亦入心以养血；肉黄，得火生土之性，故纯于补脾胃。**」\n\n**【极重要】大枣的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒** |\n| **主治** | **补中益气/和解百药/生津液** |\n| **禁** | **中满/湿热/齿痛** |\n\n**「杀乌头附子天雄毒」是「中毒解法。」** ✓✓","o":"RJ-2262 · 《人纪·神农本草经》上经第一百三十二味「大枣」，原文（PDF 第 312 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"红枣火土兼顾","c":"讲义讲「一个极精的取象」：「**我们有两种枣，我们现在是 132 味药，一种是大枣；我们这里讲的大枣专门指的是红枣，黑枣不是这里讲的。****因为红枣呢，皮是红的、芯是黄的，所以他入心、入心脏；同时黄的入脾脏。****所以他同时能火、土兼顾的，质又很粘稠，所以它滋润的力量非常强。**」\n\n**【极重要】红枣 = 火土兼顾（心 + 脾）**\n\n```\n红枣：皮红 → 入心（火）\n     芯黄 → 入脾（土）\n       = 火土兼顾\n```\n\n**「色 + 质双取」——「这是最精的取象。」** ✓✓","o":"RJ-2263 · 《人纪·神农本草经》上经第一百三十二味，讲解（PDF 第 312 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"红枣固胃津","c":"讲义讲「一个极重要的功能」：「**你如果这个枣光煮到枣汤里面，它会很粘，实际上是胃的津液；所以我们中医常常使用红枣去固胃、保护胃。****当我们发现这个药下去会伤到胃的津液，一次下去病会好、可是胃会干掉，里面津液没了。****因为我们中药、中医呢，我们使用的方法是汗、吐、下三法；有时候药会伤到肠胃的津液，肠胃都没有粘液、没有津液都干掉了。****我们会知道：这样做，我们会事先在方子里面就会加红枣进去，去保护他肠胃的津液，以免它丧失掉。**」\n\n**【极重要】红枣 = 汗吐下的护胃津**\n\n```\n汗/吐/下（三法）→ 伤胃津\n  + 红枣 → 固胃津（护盾）\n```\n\n**「预先加红枣」——「这条与 n176汗吐下三法」同一主题。** ✓✓","o":"RJ-2264 · 《人纪·神农本草经》上经第一百三十二味，讲解（PDF 第 313 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"红枣炖鸡不炖鲤鱼","c":"讲义讲「一个极精的配伍禁忌」：「**那你如果说，我们红枣和鲤鱼不煮在一起的。****你想想看，鲤鱼是利水的，这个红枣是填脾胃、它是能够增益津液的；鲤鱼是利水的。****所以我们红枣会炖鸡，不会拿去炖鲤鱼。****为什么要用鸡？因为鸡它本身有增润津液的功能；因为你要增润津液、你要滋补，所以用红枣。****那鲤鱼是攻坚是排水用的；你不会吃个鲤鱼汤来补身体啊，是排水的。**」\n\n**【极精】红枣炖鸡（补）≠ 鲤鱼（排）**\n\n**「补与排不可同锅」——「这是最精的配伍禁忌。」** ✓✓","o":"RJ-2265 · 《人纪·神农本草经》上经第一百三十二味，讲解（PDF 第 313 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"红枣须破皮","c":"讲义讲「一个极实用的细节」：「**使用的时候，诸位要煎的时候，把那个红枣打碎、或者撇开来，让他皮弄破煮，味道才会出来。****一般来说，大部分十颗、十粒啊、十二颗，都可以；你用钱的话，两钱、三钱都没有关系。**」\n\n**【极精】红枣须破皮（才出味）**\n\n**「破皮才出味」——「这是最精的煎法。」** ✓✓","o":"RJ-2266 · 《人纪·神农本草经》上经第一百三十二味，讲解（PDF 第 313 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"虫鸟吃过最甜","c":"原文【孟铣】「**小儿患秋痢，与蛀枣食之良。**」讲义：「**他过去治小孩子秋天患秋痢、下利，可以找给虫蛀过的红枣吃，这是最好。****诸位如果一个食物，果实虫不来吃、这个是不能吃的。****虫子吃过的最甜；你如果去采那个水蜜桃，你看那个桃子被鸟啄过的最甜。****你绝对没那个鸟聪明，动物吃过的最甜。**」\n\n**【极精】虫鸟吃过 = 最甜（天然筛选）**\n\n**「动物吃过的最甜」——「这条与 n181食物坏死」同一逻辑。** ✓✓","o":"RJ-2267 · 《人纪·神农本草经》上经第一百三十二味，讲解（PDF 第 313 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"覆盆子的本草条目","c":"【本经原文】「**味酸平，安五脏，益精气长阴，令坚强志，倍力有子；久服轻身不老；今名覆盆子。**」【性味】「**味甘酸，性微温，无毒。**」【主治】「**覆盆子为补涩要药，主益肾脏，缩小便，起阳事，固精液，治遗尿遗精。**」【藏器】「**食之令人好颜色，榨汁涂发不白。**」【甄权】「**主男子肾精虚竭阴痿，能令坚长，女子食之有子。**」【括要】「**补虚续绝，强阴健阳，悦泽肌肤，安和五脏，温中益力。**」【用量】「**普通一钱至二至三钱。**」【禁忌】「**小便短涩者不宜（今之前列腺肿大或是癌症均不宜）。**」\n\n**【极重要】覆盆子的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘酸/微温（《正义》认为专养阴）** |\n| **主治** | **补涩/益肾缩尿/起阳固精** |\n| **禁** | **小便短涩/前列腺/癌** |\n\n**「《本草通玄》：强肾而无燥热之偏，固精而无疑涩之害，金玉之品也」** ✓✓","o":"RJ-2268 · 《人纪·神农本草经》上经第一百三十四味「蓬蘽」，原文（PDF 第 315–316 页）。"},{"t":"神农本草经·上经：藕实茎（莲子，续）、大枣、蒲萄、蓬蘽（覆盆子）、鸡头实（芡实）","h":"覆盆子专养阴非助阳","c":"《本草正义》「**覆盆子为滋养真阴之药，味带微酸，能收摄耗散之阴气而生精液……《本经》主安五脏，脏者阴也；凡子皆坚实，多能补中，况有酸收之力，自能补五脏之阴而益精气。****凡子皆重，多能益肾，而此又专入肾阴，能坚肾气。****惟此专养阴，非以助阳；《本经》、《别录》并未言温，其以为微温微热者，皆后人臆测之辞。****一似凡补肾者皆属温药，不知肾阴肾阳，药物各有专主；滋养真阴者，必非温药。**」\n\n**【极重要】覆盆子 = 养阴非助阳（文献辨析）**\n\n```\n覆盆子：酸收 → 养阴（非温）\n后世误标「微温」→ 臆测\n```\n\n**「后世臆测」——「这是最精的文献辨析（纠正温性之误）。」** ✓✓","o":"RJ-2269 · 《人纪·神农本草经》上经第一百三十四味，原文引《本草正义》（PDF 第 316 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"麻子仁的本草条目","c":"【本经原文】「**味辛平，主五劳七伤，利五脏，下血寒气；多食令人见鬼狂走，久服通神明轻身；今名麻勃（花粉）、火麻仁（果仁）。**」【性味】「**麻仁味甘，性平；麻勃味辛，性温。**」【主治】「**麻仁为滑润、行血、除风、强壮药，治大便燥，乳汁少，热淋经闭；麻勃为除风、通经、健脑药。**」【别录】「**麻仁治中风汗出，逐水气，利小便，破积血，复血脉，乳妇产后余疾。**」【日华】「**补虚劳，逐一切风气；长肌肉，益毛发，通乳汁，止消渴，催生难产。**」【用量】「**普通钱半至三钱。**」【禁忌】「**大便溏者禁忌麻仁。**」【容川】「**麻仁油滑，而无辛烈之性，故但能润降，不能速下。**」\n\n**【极重要】麻子仁的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平（麻勃辛温）** |\n| **主治** | **滑润/行血/除风** |\n| **禁** | **大便溏** |\n\n**「多食令人见鬼狂走」——「这是古籍对过量反应最直白的一句。」** ✓✓","o":"RJ-2270 · 《人纪·神农本草经》上经第一百三十七味「麻蕡」，原文（PDF 第 318 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"有仁皆润下","c":"讲义讲「一个极精的类推」：「**诸位只要看到有仁，都代表会有油脂，都是能够利尿利大便的，都是吃多了会下利。****柏子仁、杏仁，只要有仁的都有，都会利大便。****那西洋人呢，只知道用蓖麻子、就是我刚刚讲的蓖麻子油来通大便，他不知道我们中药麻子仁、柏子仁、酸枣仁很多仁都可以通大便，个个的功能都不一样。**」\n\n**【极重要】有仁皆润下（麻/柏/杏/酸枣）**\n\n```\n有仁（油脂）→ 润下（利大便）\n  麻子仁/柏子仁/杏仁/酸枣仁\n```\n\n**「有仁皆润」——「这是最精的类推。」** ✓✓","o":"RJ-2271 · 《人纪·神农本草经》上经第一百三十七味，讲解（PDF 第 318–319 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"上经润别经攻","c":"讲义讲「一个极重要的分级逻辑」：「**因为治病的时候要用大黄；你平常的时候，老年人的虚秘、人是因为虚排不出来的，你用大黄下去人更虚啊、太强了。****你用麻仁下点下去，滋润它、让他出来，他大便排出来人也不会虚。****所以麻子仁是功能清润、能够润肠的药、能够通大便的药；但把它放到本草的上经，意思就是你平常也可以吃的。****那大黄、芒硝是很凶的，不要乱来，要把它放到别的经；所以有他的目的。**」\n\n**【极重要】上经润 vs 别经攻（安全分级）**\n\n```\n麻子仁（上经）→ 润下（不伤正）\n大黄芒硝（他经）→ 攻下（伤正）\n```\n\n**「放到哪一经，就是什么级别的药」——「这是最重要的分级逻辑。」** ✓✓","o":"RJ-2272 · 《人纪·神农本草经》上经第一百三十七味，讲解（PDF 第 319 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"大便24小时须排","c":"讲义讲「一个极重要的标准」：「**记得，每天一定要有大便；我们一天 24 个小时是一个大周天，子丑寅卯、辰巳午未、申酉戌亥，12 个时辰是一个大周天。****所以你循环过来的时候，到了早晨 5 点到 7 点的时候大肠的卯时，大肠开卯时一定要去上厕所。****吃下去的东西 24 小时要排掉；排不出来呆在身体里面超过 24 小时以后它就开始产生变化了。****小病、便秘都要讲，免得以后发生很多问题。**」\n\n**【极重要】大便 24 小时须排（大肠卯时）**\n\n```\n5–7 点（卯时）大肠经当令 → 该上大号\n超过 24 小时 → 开始变化\n```\n\n**「24 小时」——「这条与 n1775–7 点大肠经」同一主题。** ✓✓","o":"RJ-2273 · 《人纪·神农本草经》上经第一百三十七味，讲解（PDF 第 319–320 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"问清你的正常是什么","c":"讲义讲「一个极精的问诊技巧」：「**有的时候问她，21 岁 22 岁的小姐，你大便好不好？『大便很好啊』。****你怎么个好？『一个礼拜一次』——她问我很好啊，一个礼拜一次很爽啊，不要常常上厕所多难过啊。****所以你们要问人家，她跟你说正常，你要问清楚『你的正常是什么意思』啊；每天一次不是一个礼拜一次。****所以临床的时候一定要小心，人家跟你说正常，没有讲完、还没讲完，这要特别特别注意。**」\n\n**【极精】问清「你的正常是什么」**\n\n**「病人说正常不等于正常」——「这条与 n175肚子痛三问」同一主题。** ✓✓","o":"RJ-2274 · 《人纪·神农本草经》上经第一百三十七味，讲解（PDF 第 320 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"瓜蒂的本草条目","c":"【本经原文】「**味苦寒，主大水，身面四肢浮肿；下水杀虫毒，咳逆上气及食诸果，病在胸腹中，皆吐下之；即甜瓜之蒂也。**」【性味】「**味苦，性寒，无毒。**」【主治】「**上焦之实症，以吐取之，浊痰壅塞，全身水肿等实症。**」【倪注】「**主治因上焦不通造成之全身性水肿，专治膈上之疾，中风浊痰不出、无法吞咽；仲景方之瓜蒂散。**」【药征】「**主治胸中有毒，欲吐而不吐也。**」【用量】「**普通一钱至二钱。**」【禁忌】「**凡虚弱之人禁忌之。吐后不止，可服半夏解之。**」\n\n**【极重要】瓜蒂的本草条目（吐法）**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦/寒/无毒** |\n| **主治** | **上焦实症/吐法/身面浮肿** |\n| **禁** | **虚弱之人** |\n\n**「病在胸腹中，皆吐下之」——「这是内经吐法的方。」** ✓✓","o":"RJ-2275 · 《人纪·神农本草经》上经第一百四十味「瓜蒂」，原文（PDF 第 322 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"吐法的吸管比喻","c":"讲义讲「一个极精的比喻」：「**那瓜蒂呢，主大水，身面四肢浮肿。****这个身面四肢浮肿大水是因为上焦有病，痰涎壅塞到以后，肺里面的水没有办法进入肾脏。****肺是肾的母，肺在上面、肾脏在下面。****你这样子想：肺是翡翠水库，里面的水就是肺；那个流出来河流里的水就是肾脏。****当你水库里的水堵到的时候，这个水就开始累积；肺主皮毛，哇全身就发起来了。****吐的时候那瓜蒂散一下去、那一吐，痰一吐掉那水通通跑出来。****就好像、理论就好像你拿一个吸管，在杯子里面有水，你拿吸管吸住，然后你手按着吸管，水就在吸管里面；你把上面一打开、水就排掉了——吐法原理就在这里。**」\n\n**【极重要】吐法 = 开上口（吸管比喻）**\n\n```\n肺（水库）\n  → 痰堵（下口闭）→ 水停 → 全身肿\n    → 吐法（开上口）→ 水自下\n```\n\n**「吸管比喻」——「这条与 n174提壶揭盖」同一体系。** ✓✓","o":"RJ-2276 · 《人纪·神农本草经》上经第一百四十味，讲解（PDF 第 322–323 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"听声辨虚实","c":"讲义讲「一个极快的判法」：「**所谓实症，你听就知道了：这个病人进来、还没有看到你，还在外面诊所门口，你还没看到那个病人，就听他讲话很大声『医生在哪里啊？』——啊这一定是实症。****那个人进来安安静静没有声音，那是虚症啊。****实症嘛，你可以看到、听的到啊；根本还没看到病人，听就知道了，实症。**」\n\n**【极精】听声辨虚实（隔门就知）**\n\n**「隔门就知」——「这条与 n159听声辨虚实」同一主题。** ✓✓","o":"RJ-2277 · 《人纪·神农本草经》上经第一百四十味，讲解（PDF 第 322–323 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"能吐须能止","c":"讲义讲「一个极实用的补救」：「**后面的禁忌：吃了瓜蒂吐的不止，老师吃了太多不停止怎么办？用半夏，止吐啊。****那如果说你刚好发生在你岳母身上，那你给她吃两钱，那完了、不要混了；所以一钱就够了，那个子很大的、体格很大的用两钱嘛。****当一个医生你要知道：你要吐，你要知道如何止吐。**」\n\n**【极精】能吐须能止（半夏）**\n\n**「知道如何止吐」——「这是最精的安全意识。」** ✓✓","o":"RJ-2278 · 《人纪·神农本草经》上经第一百四十味，讲解（PDF 第 323 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"冬瓜子入肺去痰","c":"【本经原文】「**味甘平，主令人悦泽好颜色，益气不饥；久服轻身耐老。**」【性味】「**甘寒。**」【主治】「**泻寒热，甘益脾，利二便，消水肿，止消渴，散热毒痈肿；子能补肝明目。**」讲义：「**现在我们这个白瓜子呢，并不是南瓜子，而是我们的冬瓜子、你也可以说是冬瓜仁。****在孙思邈的【千金方】里面……我重新补进去的方子就是我们的苇茎汤，那苇茎汤就有冬瓜仁在里面。****那这个冬瓜仁是入肺的，止咳入肺的，能够去痰。****因为它味甘寒，所以我们遇到热家的、热病、热症的咳嗽的时候、肺炎的时候我在用它。**」\n\n**【极精】冬瓜子 = 入肺去痰（苇茎汤）**\n\n**「这条与 n173苇茎汤」同一主题。** ✓✓","o":"RJ-2279 · 《人纪·神农本草经》上经第一百四十一味「白瓜子」，原文及讲解（PDF 第 323–324 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"上经142味完整分类","c":"讲义讲「一个极重要的总表」：「**前面呢，《神农本草经》上经的部分，诸位回头看前面的目录，我把它重新整理过：第 1 味药到第 18 味药，专门是玉石的上品；第 19 到 91 味药，是草药类；第 92 到 111，是木头的入中药；第 112，就一味，就是用人的上品——头发；第 113 到 118 这六味药呢，是兽类；第 119 到 120 两味药呢是禽类；第 121 到 130 呢，是虫类、鱼类；第 131 到 135 是果类的上品；第 136 到 137 这两种是米谷类；最后 138 到 142 就是我们菜类的上品。**」\n\n**【极重要】《神农本草经》上经 142 味完整分类**\n\n| 序 | 类 | 数 |\n|---|---|---|\n| **1–18** | **玉石上品** | **18** |\n| **19–91** | **草类** | **73** |\n| **92–111** | **木类** | **20** |\n| **112** | **人（头发）** | **1** |\n| **113–118** | **兽类** | **6** |\n| **119–120** | **禽类** | **2** |\n| **121–130** | **虫鱼类** | **10** |\n| **131–135** | **果类** | **5** |\n| **136–137** | **米谷类** | **2** |\n| **138–142** | **菜类** | **5** |\n| **合** | | **142** |\n\n**「142 味」——「这是最重要的上经全表。」** ✓✓","o":"RJ-2280 · 《人纪·神农本草经》上经第一百四十二味后，总述（PDF 第 325 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"上经养生中经治病","c":"讲义讲「一个极重要的分工」：「**本草经卷二……中经一百二十种为臣，主养性、以应人；无毒有毒斟酌其宜，欲去病补羸者本中经。****真正要治病的、大病来了要靠中经。****至于上经，上经只是养生、随意取，不老神仙啊。****真正治病中经一定要熟，这一百二十味药，写的很清楚啊；只是大家过去没有注意到，我们现在给大家提示一下。**」\n\n**【极重要】上经养生 vs 中经治病**\n\n```\n上经 142 味 → 养生、随意取（可日常）\n中经 120 味 → 治病、必须熟（斟酌宜）\n```\n\n**「两经分工」——「这是最重要的两层分工。」** ✓✓","o":"RJ-2281 · 《人纪·神农本草经》中经卷首，讲解（PDF 第 326 页）。"},{"t":"神农本草经·上经收官：麻蕡（麻子仁，续）、冬葵子、瓜蒂、白瓜子、苦菜、上经分类总表；中经开篇：雄黄","h":"雄黄蚀疮杀虫","c":"【本经原文】「**味苦平寒，主寒热鼠瘘，恶创疽痔死肌，杀精恶物鬼邪气，百虫毒，胜五兵；炼食之，轻身神仙。**」【性味】「**味辛苦，性温，有毒。**」【主治】「**雄黄为蚀疮杀虫要药，主辟邪气，疗诸疮，解毒，为外科要剂，亦可内服。**」【用量】「**普通内服数分，外用无定量。**」【禁忌】「**雄黄性热有毒，外用易见长，内服难免害；凡服之中病即止，无过剂也。**」【吴克潜】「**雄黄于疮痬螫外科，最为急用，以其性能杀虫解毒也；但过用终不免侵蚀好肉，故不可多服。**」讲义：「**过去雄黄用的很多，在外用的时候，佩戴在身上，雄黄可以辟邪。****所谓什么叫辟邪？因为雄黄的味道很强、阳气很强，虫蛇都不会近身，就是辟邪嘛，跟麝香一样。**」\n\n**【极精】雄黄 = 蚀疮杀虫（外科要剂）**\n\n**须「强「标」**：**「①雄黄含砷（As2S2），有毒；②不可内服自制；③雄黄酒已禁（砷中毒）；④外用也须慎」** ✓✓","o":"RJ-2282 · 《人纪·神农本草经》中经第一百四十三味「雄黄」，原文及讲解（PDF 第 326–327 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"石硫黄的本草条目","c":"【本经原文】「**味酸温，主妇人阴蚀，疽痔恶血，坚筋骨，除头秃，能化金银铜铁奇物。**」【产地】「**产火山地带。**」【性味】「**味酸，性温，有毒。**」【主治】「**硫磺为补阳要药，主治脾胃虚寒，寒痹冷癖，命门火衰，能发汗以祛寒痰，及疏利大肠、通习惯性便秘，杀虫，治疮疥。**」【甄权】「**下气，治腰肾久冷，除冷风顽痹；生用治疥癣，炼服主虚损泄精。**」【容川】「**能燃，是水中之火也；其味酸，是得木味；水中之阳，发则为木，故味酸而能燃；为温下焦肝肾之猛药。**」【用量】「**普通五分至二钱。**」【禁忌】「**硫磺为救急妙药，但中病便当已，不可尽剂；中硫磺毒，黑铅煎汤解之，或是食鸭肉可解之。**」\n\n**【极重要】石硫磺的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **酸/温/有毒** |\n| **主治** | **补阳/命门火衰/化五金** |\n| **禁** | **不可尽剂/畏细辛朴消** |\n\n**「能化金银铜铁奇物」——「这是本草最奇特的一条功能。」** ✓✓","o":"RJ-2283 · 《人纪·神农本草经》中经第一百四十四味「石硫黄」，原文（PDF 第 329–330 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"硫磺是中经第二味","c":"讲义讲「一个极重要的分量」：「**中经第二味药，就叫做硫磺、石硫磺。****刚刚本草经开始就跟诸位介绍，真正能够去病的是中经的药，历代相传就这样子。****硫磺是中经里面的第二味药，你就知道它的分量有多重；到现在居然没有人会用。****中医不会用、古代的医生都会用、过去的经方都会用，现在的医生不会用。**」\n\n**【极重要】硫磺 = 中经第 2 味（补阳之最）**\n\n**「分量有多重」——「这是最重要的补阳药。」** ✓✓","o":"RJ-2284 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 329 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"石硫磺与土硫磺","c":"讲义讲「一个极重要的鉴别」：「**硫磺市面上有两种，一种是石硫磺，一种是土硫磺。****这个土硫磺呢才是真正的剧毒，非常的毒；所以土硫磺不会作内服的。****土硫磺一般是那个国术跌打损伤，它拿去做伤科，和铜啊一些能够和在一起，止痛。****土硫磺颜色是褐色的，褐色的味道很腥、非常的腥，褐色的是土硫磺，这个是不能吃的。****我们在治病的时候用的是石硫磺；石硫磺拿出来的时候是淡黄、鹅黄色，象刚出生的小鸡鸡毛的颜色。**」\n\n**【极重要】石硫磺（淡黄）vs 土硫磺（褐色剧毒）**\n\n```\n石硫磺（淡黄/鹅黄）→ 可内服\n土硫磺（褐色/腥）→ 剧毒，仅外用伤科\n```\n\n**「颜色就是安全线」——「这是最重要的鉴别。」** ✓✓","o":"RJ-2285 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 329–330 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"硫磺比附子更热","c":"讲义讲「一个极精的比较」：「**那石硫磺呢这个药是大热的药。****你说这个人这个用很多，比如这个外号叫附子；那附子跟硫磺比起来，硫磺大附子一大截。****这是火山口的东西，硫磺就产在火山口。**」\n\n**【极精】硫磺 > 附子（大热）**\n\n**「大附子一大截」——「这是最精的排序。」** ✓✓","o":"RJ-2286 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 330 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"硫磺化五金治膀胱结石","c":"讲义讲「一个极特殊的功能」：「**那过去呢，很多我们老先生老太太、乡下人喝井水，那个水里面本身铁质很重。****喝喝身上铁块很多，这个结果堵在膀胱里面，膀胱里面有铁、小粒铁粒。****诸位你怎么知道这水里面有铁很多？你把那个地下水喷墙，喷完后一段时间，看那水黄黄的、褐色的，那个就是铁在里面。****结果小便排不出来了……这个膀胱结石啊、不是石头哦，是五金在里面。****这个时候你用什么药清石头都清不出来，这个时候用什么药？硫磺！硫磺能够化五金。****你说老师我怎么知道它是金属在里面堵到？很简单：那病人躺倒的时候没感觉，一站起来小便就有问题；躺倒的不痛，站起来的时候痛。**」\n\n**【极重要】硫磺化五金（膀胱结石）**\n\n```\n地下水（高铁）→ 膀胱五金 → 尿闭\n  → 硫磺（化五金）→ 小便出\n```\n\n**「躺倒不痛、站起痛」——「这是极精的结石体位征。」** ✓✓","o":"RJ-2287 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 330–331 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"脏病须用阳药","c":"讲义讲「一条极重要的治法逻辑」：「**所有的脏病和腑病：腑呢，我们称为阳；脏呢，称为阴。****所谓脏就是累积，有东西积嘛、就会累积；腑呢，本身是宣泄。****所以你食物吃进去以后，大便排出来；脏呢、脏是收藏。****那你如果说今天脏有病，有累积在里面，它本身是收藏，结果它收藏的是什么？坏的东西在里面，然后肿瘤在里面长。****因为你开刀下去的时候，它脏本身性还在那边积啊，还在那边累积累积还是越来越大，因为它是阴。****这个时候呢，只有用阳的药，峻补阳的药。****因为阳是脏的力量，力量一增强以后，它会把里面的东西清出来。**」\n\n**【极重要】脏病须用阳药（峻补阳）**\n\n```\n脏（阴）→ 主藏 → 肿瘤积聚\n  → 须峻补阳（硫磺）\n    → 阳为脏之力 → 清出积\n```\n\n**「阳是脏的力量」——「这条与 n160阴实则死」、n155「阴实」同一主题。** ✓✓","o":"RJ-2288 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 331 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"硫磺中毒与肝病排毒","c":"讲义讲「一个极精的鉴别」：「**石硫磺一吃下去，就很补啊、火山爆发一样；你也不要乱吃，不能乱吃，吃多了会中毒。****那石硫磺呢，中毒的时候全身皮肤会发痒，起一个个红疹子。****起了红疹子以后跟我们治肝病的不一样：我们治肝病的时候一吃，病人会有皮肤痒、大便会变黑色。****它的红疹子、那个皮肤，如果是治肝病的，我们肝在排毒的时候，是皮肤痒看不到疹子；硫磺的话你可以看到一个个红疹子，像痱子，一颗一颗的起来，那是硫磺。****那如果说你要把它毒性解掉，很简单，叫他吃鸭肉就好了。**」\n\n**【极重要】硫磺中毒 vs 肝病排毒**\n\n```\n硫磺中毒 → 皮肤痒 + 红疹（像痱子）\n肝病排毒 → 皮肤痒 + 无疹 + 大便黑\n```\n\n**「有疹无疹」——「这是最精的鉴别。」** ✓✓","o":"RJ-2289 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 331–332 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"硫磺治水肿15分钟起效","c":"讲义讲「一个极精的病案」：「**我们身上有积水的时候，当我们的阳不够的时候，这个水在身体里面是冷水；冷水才会积啊，热水一气化就好了。****现在有一个病人，他专门在开个餐厅，一天呢要十几个小时站在厨房里面；久站是不是伤骨？肾主骨嘛、久立伤肾。****病人全身水肿，肿那么大，呼吸非常的短。****你除了利水的药以外，就加一味硫磺下去；我看他体格蛮大的，加五钱下去。****因为硫磺是粉状的，所以我们用绵布包起来，不然你一煮的话硫磺到处跑。****一吃下去以后，15 分钟、20 几分钟开始全身冒汗。****他觉得人好像突然变得跟气球一样；他人原来很重、身上走路很重，他人越来越轻了。****他原来一楼到二楼走不上去的啊，15 分钟、20 分钟以后，就那么快，水就开始退了。**」\n\n**【极精】硫磺水肿 15 分钟起效（绵布包）**\n\n**须「强「标」**：**「①硫磺须严格炮制与剂量；②不可自服；③水肿须查病因（心/肾/肝/甲减）\"** ✓✓","o":"RJ-2290 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 332–333 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"生用攻坚炮制补阳","c":"讲义讲「一个极重要的生熟异用」：「**我们硫磺呢，有生用、有熟用。****【甄权】这边：硫磺能下气，治腰肾久冷；生用呢能治疥癣，炼用治虚损泻泄。****那我们一般炮制过以后的硫磺呢，补阳、补的力量很强；攻坚的时候我用生用的。****平常我们攻坚，比如肝脏、肝癌，生的我们用（作）攻坚用。****但是他如果是虚症、阳不举，或是精不够、或者腰痛啊怎么样，我们用炮制。****硫磺的炮制呢，过去用的最多的就是用酒来炮制……你把硫磺包在绵布里面，好几包放在药壶里面，然后你倒满满一瓶米酒，去炖它。**」\n\n**【极重要】生用攻坚 vs 炮制补阳**\n\n```\n生硫磺 → 攻坚（肝癌/疥癣）\n炮制（酒/甘草）→ 补阳（固精/阳痿）\n```\n\n**「生熟异用」——「这是最重要的生熟异用。」** ✓✓","o":"RJ-2291 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 333–334 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"三大热药的区分","c":"讲义讲「一个极重要的区分」：「**因为我们有大热的药、大热大补的药，像硫磺、生附。****那老师这两个怎么区分呢，什么时候用硫磺、什么时候用生附？****听，老师、我这个病人嘛、或者是病人的小孩子跟你抱怨『我妈妈两脚无力』——你只要想到脚无力，就是硫磺，就讲完了。****那老师那个前面说的肉桂粉，肉桂粉生用也可以点命门火，没错啊；肉桂粉这个火是来自木头的。****如果火很小了、一丢下去，木头丢下去，一碰上去这个火就没了。****所以老师、怎么知道那个命门火快衰竭了？人的生命走到尽头、油灯烬枯只剩一点火了。****这时候你肉桂一下去，火就没了，因为肉桂是木嘛；你必须从里面加油、火上加油上去，利用那一点微燃的一点点火，火量让它大起来——这个时候就是要硫磺。**」\n\n**【极重要】三大热药：肉桂（木/引火）、生附（火）、硫磺（油/加油）**\n\n```\n肉桂（木）→ 要有火才能燃 → 火将熄则不可用\n生附/硫磺 → 加油 → 从内部让火大起来\n```\n\n**「加油 vs 添柴」——「这条与 n209肉桂冲服」、n203「附子」同一主题。** ✓✓","o":"RJ-2292 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 335 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"脚无力用硫磺","c":"讲义讲「一个极快的指征」：「**你只要想到脚无力，就是硫磺，就讲完了。****所以病人命门火不够的时候、下焦阳虚的时候，阳就是力量。****阳虚的时候走路就没有力量；所以瘫痪的人、下肢瘫痪的人我们都会使用到硫磺。**」\n\n**【极精】脚无力 = 硫磺（阴虚 = 无力）**\n\n**「阳就是力量」——「这是最精的一句。」** ✓✓","o":"RJ-2293 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 335 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"硫磺酸收加大热","c":"讲义讲「一个极精的性味组合」：「**因为硫磺是酸收，它是酸味，它收敛力量很强；那它又是性大热，大热又有散的力量。****它的颜色又是黄的，它入三焦系统。****在收放的同时呢，可以把我们的毛孔——你不用运动——开合、开合，毛孔就乖乖地开合。****该从皮肤毛孔散掉的水把它排掉，该从小便的水把它排掉。****所以吃硫磺我们治疗全身性的水肿，一剂下去的时候是汗流浃背、小便一直出来，同时发生的。**」\n\n**【极重要】硫磺 = 酸收 + 大热（双向）**\n\n```\n酸收（收敛）+ 大热（发散）\n  → 毛孔开合有度\n    → 汗 + 尿双排（水肿）\n```\n\n**「双向」——「这条与 n182双向调节」、n215「桑螵蛸」同一主题。** ✓✓","o":"RJ-2294 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 335–336 页）。"},{"t":"神农本草经·中经：雄黄（续）、石硫黄、雌黄","h":"里寒的描写","c":"讲义讲「一个极生动的临床画像」：「**诸位没有得过里寒的症，所以你不了解什么是里寒。****里寒的时候，真的是大热天你要换件衣服还要在烤炉面前换衣服，你无法想象啊。****那个仲夏、到七月还好，八月，你家住在 7 楼的顶楼，太阳从上面晒下来，白天一天没有人在家里面、闷在那边，门窗都关起来。****晚上你回到家里面去，不用开冷气，三床棉被盖起来，躲在里面你还在发冷——这叫里寒。**」\n\n**【极精】里寒 = 八月三床棉被还发冷**\n\n**「三床棉被还发冷」——「这是最精的画像。」** ✓✓","o":"RJ-2295 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 336 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"烫伤处理的三步","c":"讲义讲「一个极具体的外治」：「**我们外伤，当你皮肤烫伤的时候，水泡那么大一个……你如果给西洋人处理，我把这个皮剪掉，这是最愚蠢的方法、开了一个大口。****不要剪掉，这是不对的。****当你起个水泡的时候，用三棱针、用我们放血的针从旁边，不要从顶上，从旁边扎、刺一个洞。****如果他的泡很大，一个洞来不及放，你刺两个、三个洞嘛；然后用手慢慢的、轻轻的往下挤压，把水慢慢慢慢挤出来。****挤出来以后让它贴近皮肤，让这个烫坏的地方贴到皮肤，它会再生回来。****那粉跟膏不一样，西洋人把它弄成膏状，这就没有 common sense；因为你皮肤毛孔很多，你膏一涂的话，毛孔都封掉了。****所以，有疤无疤就看你当时敷上去的是粉状物还是膏状物，要点在这里。**」\n\n**【极重要】烫伤处理：不剪皮 + 侧刺放水 + 撒粉（不用膏）**\n\n```\n烫伤起泡 → 不剪皮\n  → 侧刺（三棱针，不刺顶）→ 轻挤放水\n    → 贴回 → 撒硫磺粉（不封毛孔）\n      → 无疤\n```\n\n**「粉 vs 膏 = 有疤无疤」——「这是最精的一句。」**要点：**须「强「标」**：**「①烫伤须先冲冷水（20分钟）；②大面积/深度烫伤须急诊（烧伤科）；③不可自行挑破水泡（感染）；④硫磺粉不是无菌」** ✓✓","o":"RJ-2296 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 337 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"危急时好转即十倍","c":"讲义讲「一条极重要的重剂原则」：「**我们处方里面，病人危险的时候、脚完全没有力的时候，下硫磺。****硫磺重剂的时候，平常我们 3 钱、5 钱；病人感觉到很不错哦，但是很危险。****因为病人还在危险之中、已经恢复的时候，这个时候你不要手软了哦。****按照《神农本草经》前面第一、开宗明义讲的：你给他一、让他好转，病人只要好转，你十倍之给他。****3 两，单味药，一剂下去；硫磺本来是 3 钱，病人好转、有救了，就有救嘛。****那人已经快死了，那你无所谓；已经快死了，你硫磺 3 两一下去，刚才前面是 3 钱，一剂就把他救回来，因为他没有时间等嘛。**」\n\n**【极重要】危急时「好转即十倍」（3 钱 → 3 两）**\n\n```\n3 钱 → 好转 → 3 两（十倍）\n  理由：没有时间等\n```\n\n**须「绝「对「强「标」**：**「这是讲义的重剂经验，绝不可自行照做；硫磺3两可致中毒/死亡」** ✓✓","o":"RJ-2297 · 《人纪·神农本草经》中经第一百四十四味，讲解（PDF 第 337–338 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"雄黄加热即成砒霜","c":"讲义讲「一个极重要的化学警告」：「**那这些药实际上都可以服用，但是这种金石类的药，雄黄、雌黄都很凶，我们一般生用，一点点就好了，诸位不要煮过。****这个雄黄实际上，煮过以后它有水银的成分，所以中毒。****实际上，雄黄一烧过就是砒霜。****所以我们如何得到砒霜？很简单，你把雄黄一加热变成黑黑的就是砒霜。**」\n\n**【极重要】雄黄加热 = 砒霜（绝对禁）**\n\n```\n雄黄（As₂S₂）→ 加热 → 砒霜（As₂O₃，剧毒）\n  → 绝对不可煮/加热\n```\n\n**「一烧过就是砒霜」——「这是最重要的化学警告。」** ✓✓","o":"RJ-2298 · 《人纪·神农本草经》中经第一百四十五味「雌黄」，讲解（PDF 第 338–339 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"补阳梯队的最后一味","c":"讲义讲「一个极精的梯队」：「**现在了解这个雄黄、雌黄跟硫磺：当你用一些补阳的药，比如巴戟天、肉苁蓉、菟丝子、覆盆子，弄了半天，阳还是起不来，硫磺！就起来了。****硫磺再不起来，算了算了；因为富士山就是硫磺堆起来的嘛。****你连硫磺都没有用了，除了火山口有硫磺冒出来，它可以把山弄起来，不相信弄不回来。**」\n\n**【极精】补阳梯队：巴戟天/肉苁蓉/菟丝子/覆盆子 → 硫磺**\n\n```\n平补（巴戟天/肉苁蓉/菟丝子/覆盆子）\n  → 无效 → 硫磺（最强）\n```\n\n**「最强的一张牌」——「这是最精的补阳梯队。」** ✓✓","o":"RJ-2299 · 《人纪·神农本草经》中经第一百四十五味，讲解（PDF 第 339 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"水银几乎不用","c":"【本经原文】「**味辛寒，主疥瘘痂伤白秃，杀皮肤中虱，堕胎，除热，杀金银铜锡毒，镕化还复为丹；久服神仙不死。**」【性味】「**味辛，性寒，有毒。**」【主治】「**水银为杀虫要药，主治杨梅疮毒，及皮肤诸病，润肠下死胎。**」【用量】「**普通多配合丸散方用，内服约数分，外用无定量。**」【禁忌】「**水银性沉，与金银诸物同；吞服金银水银者，皆足以致命，饵服者须慎之。**」讲义：「**这种很毒的东西我们就不要太接近它，我们使用到硫磺就够了。****水银那么强，所以我几乎没有用过它。**」\n\n**【极精】水银 = 几乎不用（最直白）**\n\n**「我几乎没有用过它」——「这是最精的态度。」**要点：**须「强「标」**：**「①水银是剧毒（汞中毒不可逆）；②绝对禁内服；③WHO已禁汞制剂」** ✓✓","o":"RJ-2300 · 《人纪·神农本草经》中经第一百四十六味「水银」，原文及讲解（PDF 第 339–340 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"石膏的本草条目","c":"【本经原文】「**味辛微寒，主中风寒热，心下逆气，惊喘口干，舌焦不能息，腹中坠痛，除邪鬼，产乳金创；又名寒水石。**」【性味】「**味甘辛，性微寒，无毒。**」【主治】「**石膏为清凉解热要药，主治肺胃三焦气分之热，大渴热狂，能解肌发汗，又能清热止汗。**」【别录】「**除时气头痛身热，三焦大热，皮肤热，肠胃中结气，解肌发汗，止消渴烦逆腹胀。**」【元素】「**止阳明经头痛，发热恶寒，日晡潮热，大渴引饮，中暑潮热，牙痛。**」【药征】「**主治烦渴，旁治谵语烦躁身热。**」【用量】「**普通三钱至五钱，大剂二三两。**」【禁忌】「**伤寒中风太阳症、少阳症之往来寒热等均忌；真寒假热之症或因里虚引起之虚热症亦忌；胃家寒症者亦忌；恶巴豆畏铁。**」\n\n**【极重要】石膏的本草条目（白虎）**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘辛/微寒/无毒** |\n| **主治** | **清凉解热/肺胃三焦气分/大渴热狂** |\n| **禁** | **太阳/少阳/真假寒热/胃寒** |\n\n**「大渴热狂」——「这是白虎汤的主症。」** ✓✓","o":"RJ-2301 · 《人纪·神农本草经》中经第一百四十七味「石膏」，原文（PDF 第 340–341 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"四大神兽方","c":"讲义讲「一个极精的命名」：「**第 147 味药我们称之为石膏；石膏在经方里面我们就称之为白虎。****那麻黄呢我们叫做青龙，因为它颜色、色青的；那这个红枣嘛大枣，我们称为朱雀；附子是黑色的我们称之为玄武。**」\n\n**【极重要】四大神兽四方**\n\n| 方 | 药 | 色 | 位 |\n|---|---|---|---|\n| **青龙** | **麻黄** | **青** | **东** |\n| **白虎** | **石膏** | **白** | **西** |\n| **朱雀** | **大枣** | **红** | **南** |\n| **玄武** | **附子** | **黑** | **北** |\n\n**「四神兽方」——「这条与 n199麻黄青龙」、n203「附子玄武」、n216「大枣朱雀」同一体系。** ✓✓","o":"RJ-2302 · 《人纪·神农本草经》中经第一百四十七味，讲解（PDF 第 340–341 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"阳明症但热不寒","c":"讲义讲「一条极重要的六经定位」：「**因为我遇到真的是需要石膏的时候，我们叫做白虎；因为石膏是阳明症。****病先在太阳，病在太阳以后，如果没有把它治好……它会进入两个 option：第一个就进入阳明，第二个进入少阳。****进入少阳的话，你就有机会进入太阴、少阴、厥阴。****如果没有进入少阳、进入阳明，一进入阳明就到此为止，就不会（再进了）。****所以阳明症呢、阳明症是但热不寒。****你问病人渴不渴？『渴啊』；你想喝冷水热水？『最冰的，冰块越多越好』。****都是热，他讲出来的通通是热——但热不寒，阳明症嘛。**」\n\n**【极重要】阳明症 = 但热不寒（阳明就是终点）**\n\n```\n太阳 → 阳明（到此为止）或 少阳 → 三阴\n阳明 = 但热不寒（只热）\n```\n\n**「进了阳明就停」——「这条与 n62病入阳明就停了」同一主题。** ✓✓","o":"RJ-2303 · 《人纪·神农本草经》中经第一百四十七味，讲解（PDF 第 341–342 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"热极生寒","c":"讲义讲「一条极精的圆运动理论」：「**治过最重的、最强的，从超过 450 磅体重，少掉 165 磅。****这个人我石膏一直开下去；可是我开 4 两、8 两、10 两、12 两、14 两，越吃越热。****他说『你给我吃这个药，我胃口还没那么大；结果你一直给我换处方，我觉得回家那个袋子越来越重、越来越重的时候，我越煮结果我的胃口越来越大、越渴、越热』。****不用，我就会用热药，让他热极生寒——这个时候不是生硫磺，是生附子。****可是《黄帝内经》讲的很清楚：热极生寒。****所以人体不是直线的，人体是个圆形的；你热热热，热到这边来的时候，它已经超过一个范围的时候，你要退热退不掉了、完全退不掉了。****你让他热过头，一热过头它就冷回来了。**」\n\n**【极重要】热极生寒 = 圆运动（不是直线）**\n\n```\n直线思维：热 → 用寒（石膏）\n圆运动：热过头 → 反冷 → 用热（生附子）\n```\n\n**「人体是圆的」——「这条与 n177人身是圆的」同一主题。** ✓✓","o":"RJ-2304 · 《人纪·神农本草经》中经第一百四十七味，讲解（PDF 第 342–343 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"寒热就是速度","c":"讲义讲「一个极精的定义」：「**所以寒的定义是什么？我们用这样子，给诸位一个感觉：中医比较形而上，速度很快就是热。****比如说，这个人说『老师奇怪，我肚子饿死了，我吃东西吃了三碗还是吃不饱，再吃四碗、不是不饱啊，吃五碗还是不饱』。****『我口渴，一直在喝水，喝了一百杯还是在渴』——你怎么喝一百杯下去？真的喝一百杯哦，喝完，因为他喝了就小便、喝了就小便，速度很快，就是热。****寒就是让他速度慢下来。****比如说，一天他一餐饭要吃五碗，你用石膏一去了以后，大概吃个三碗；第二天再吃完药，就变成吃一碗半；第三天再吃完我们的石膏，变成吃一碗。**」\n\n**【极精】寒热 = 速度（快=热、慢=寒）**\n\n**「速度就是寒热」——「这是最精的定义。」** ✓✓","o":"RJ-2305 · 《人纪·神农本草经》中经第一百四十七味，讲解（PDF 第 344–345 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"糖尿病的二十年轨迹","c":"讲义讲「一个极精的观察」：「**有个人跑过来，一开始这个人还没有被判定糖尿病……他嘴巴口很渴，那喝一杯水就小一杯水。****哎呀、先生，你糖尿病，开始吃药。****可是一段时间呢，越吃就不行了，大概维持个五年、有的人十年，以后呢，就要用胰岛素来控制。****胰岛素控制个五年，差不多了，就不能控制了。****我临床上看到，有的人是二十年，前面十年是那个口服药，口服药一直加重；没办法了，后面就改胰岛素。****差不多二十年，后来全身浮肿，全身肿得不能动，血糖还是很高；打胰岛素再打都没有用，然后到头来就是走。**」\n\n**【极精】糖尿病的二十年轨迹（讲义观察）**\n\n```\n口服药加量 → 胰岛素加量 → 40mg×2/日 → 全身肿 → 终末\n```\n\n**须「严重标」**：**「这是讲义的病例观察，不等于胰岛素无效；胰岛素是1型糖尿病的生命；2型须按指南用药，不可停」** ✓✓","o":"RJ-2306 · 《人纪·神农本草经》中经第一百四十七味，讲解（PDF 第 343–344 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"金石类须棉布包","c":"讲义讲「一个极实用的包煎法」：「**那这个石膏呢包的时候，一样，跟生硫磺；金石类的药，打散了、打碎，打散了以后像这个。****金石类的药，那个石硫磺跟石膏都是粉状的，我们一般用棉布袋袋起来嘛，不要整个给他倒下去。****一倒下去，拿的是白灰，你怎么给我吃白灰？跟其他药和下去很难看。**」\n\n**【极精】金石类须棉布包（不可直接倒）**\n\n**「棉布袋」——「这是最精的包煎法。」** ✓✓","o":"RJ-2307 · 《人纪·神农本草经》中经第一百四十七味，讲解（PDF 第 343 页）。"},{"t":"神农本草经·中经：石硫黄（续）、水银、石膏、慈石（磁石）","h":"慈石引肺气入肾","c":"【本经原文】「**味辛寒，主周痹，风湿肢节中痛不可持物，洗洗，酸消，除大热，烦满及耳聋；今名磁石。**」【性味】「**味辛，性寒，无毒。**」【主治】「**磁石为补肾强阴要药，取其能引肺气入肾，使阴阳安宅，镇惊，明目，通耳，益精。**」【别录】「**养肾脏，强骨气，益精除烦，通关节。**」【灵胎】「**补肾降火，强筋壮骨。**」【用量】「**入煎剂二钱至四钱，水飞用三分至八分。**」【禁忌】「**凡石药皆有毒，独磁石冲和无悍猛之气，然体重、难于消化；渍酒优于丸散。**」讲义：「**一百四十八，这个是慈石，它这名字取得很好：不单单是代表石头是有磁力以外，最主要因为有吸力嘛，铁都会吸过来。****形容慈母，儿子看到妈妈，马上跑过来跟妈妈粘在一起，像吸铁一样。**」\n\n**【极精】慈石 = 引肺气入肾（磁引铁）**\n\n```\n磁石（吸铁）→ 引肺气入肾\n  → 阴阳安宅\n```\n\n**「慈母」是命名（最精）** ✓✓","o":"RJ-2308 · 《人纪·神农本草经》中经第一百四十八味「慈石」，原文及讲解（PDF 第 345 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"吸气困难治肾","c":"讲义讲「一条极重要的呼吸两分法」：「**我们之所以会用慈石，原因是因为这样子：中医认为说，肺是金，金会生水；那如果金不能生水、肺气没有办法下降，就会非常的短气。****所以病人呢，我们常常就问病人：你有气喘，请问你是呼气困难还是吐气困难？****那病人说，啊、我是呼气困难、吸气吸不进去。****正常人，一吸、气到了肺里面以后，直接到了肾脏里面去，就会吸气、吸得饱满。****但是，如果这个气没有办法到达肾脏，只能到肺脏就吐回去，那就是、这个吸气就会困难。****所以一般来说，我们吸气困难的时候，我们就去治肾；吐气困难的时候，吐气完全靠肺。**」\n\n**【极重要】吸气困难 → 治肾（慈石）；呼气困难 → 治肺**\n\n```\n吸气难（吸不到肾）→ 治肾（慈石 + 补肾药）\n呼气难（吐不出）→ 治肺\n```\n\n**「呼吸两分法」——「这条与 n146吸难=实证、呼难=虚证」同一体系。** ✓✓","o":"RJ-2309 · 《人纪·神农本草经》中经第一百四十八味，讲解（PDF 第 345–346 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"气未归元治肺后肾痛","c":"讲义讲「一个极精的反应」：「**我们常常在治疗病人，哎呀气喘啦；我们开那个治肺的药，开下去，哎我喘好多了；可是呢、奇怪，我这辈子肾脏不痛的，开始肾脏痛。****这就代表气没有归元、没有到肾脏，这个时候你开一点补肾的药，他这个痛就会没有。****所以，肺和肾，是这个母子的关系。**」\n\n**【极精】治肺后肾痛 = 气未归元**\n\n**「气未归元」——「这是最精的反应。」** ✓✓","o":"RJ-2310 · 《人纪·神农本草经》中经第一百四十八味，讲解（PDF 第 346 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"阳起石的本草条目","c":"【本经原文】「**味咸微温，主崩中漏下，破子臧中血，症瘕结气，寒热腹痛，无子，阴痿不起，补不足。**」【性味】「**味咸，性微温，无毒。**」【主治】「**阳起石为补命门壮阳道要药，功能疗阴痿，男女下部虚冷，补不足。**」【甄权】「**补肾气，精乏腰痛，膝冷湿痹，子宫久冷，冷症寒瘕。**」【好古】「**补命门火不足。**」【用量】「**普通水飞用，五分至一钱。**」【禁忌】「**凡阴虚及阳痿属于失志，以致火气闭密、不得发越而然，与崩漏由于火盛、而非虚寒者，均忌；忌羊血。**」\n\n**【极重要】阳起石的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **咸/微温/无毒** |\n| **主治** | **补命门/壮阳道/软坚（肿瘤）** |\n| **禁** | **阴虚有火/崩漏火盛** |\n\n**「其山冬不积雪、夏则生云，积阳上升」——「这是取象。」** ✓✓","o":"RJ-2311 · 《人纪·神农本草经》中经第一百五十味「阳起石」，原文（PDF 第 347 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"火与阳的区分","c":"讲义讲「一个极重要的区分」：「**它是壮阳，阳就是力量、阳等于力量。****我们前面讲的硫磺，这个是点命门火；这个火跟阳不太一样。****火是闷在里面的；阳是你感受得到外面。****比如说你点火、烧起来那个火，你可以看到那个火在那边；阳是太阳光的热，你可以感觉得到。****这个阳跟火，是不一样的东西。****地底下，我们知道地底下很热，那是地底下有火在那边；地面上是阳。****那阳起石呢，能够壮阳；硫磺是补命门火。****实际上我们真的补那个命门火不足，我们用硫磺；阳不足的时候用阳起石。**」\n\n**【极重要】火（地下/闷）vs 阳（地上/可感）**\n\n```\n火（硫磺）→ 地底下，闷在里面（命门火）\n阳（阳起石）→ 地面上，可感受到（力量）\n```\n\n**「火 vs 阳」——「这条与 n218硫磺加油」、n203「附子」同一主题。** ✓✓","o":"RJ-2312 · 《人纪·神农本草经》中经第一百五十味，讲解（PDF 第 348 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"阳起石用于多种癌","c":"讲义讲「一个极直白的用法」：「**我再强调一下：几乎很多的癌症，肾脏癌、子宫癌、卵巢癌、大肠癌，我都会使用到阳起石。****这个药本身又没有毒性，很好用，性又是阳的；那你可以重用，比如说 1 钱、2 钱、3 钱、4 钱、5 钱都没有关系。****后面呢，诸位看这个阳起石的禁忌：任何的虚寒，你不是虚寒、里面带一点阳火的，不管这个火是虚火还是实火，有火的、有热的，都不好用。****我们用滋补、补阳的药，一定是纯虚证的时候、纯寒症的时候使用，是最好的时候。**」\n\n**【极精】阳起石用于多癌（软坚 + 温）**\n\n**须「强「标」**：**「癌症须规范治疗（手术/化疗/放疗/靶向/免疫）；中药不可替代」** ✓✓","o":"RJ-2313 · 《人纪·神农本草经》中经第一百五十味，讲解（PDF 第 348 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"不正常出血必查宫颈癌","c":"讲义讲「一个极重要的提醒」：「**主崩中漏下，像女人呢、子宫颈癌，她常常的漏水、滴漏那个血，一直不停啊。****绝大多数的太太，她没有做什么子宫膜片怎么样，哎怎么搞的、月经怎么不停哦，连续一个月、每天都来，不正常的出血，就是子宫颈癌。****所以子宫颈癌最明显的表症，就是不停的、不正常的出血——崩中漏下。**」\n\n**【极重要】不正常出血一个月 = 须查宫颈癌**\n\n**须「强「标」**：**「①绝经后出血/接触性出血须立即妇科；②筛查是TCT + HPV；③不可只靠中药」** ✓✓","o":"RJ-2314 · 《人纪·神农本草经》中经第一百五十味，讲解（PDF 第 348 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"天然盐与精炼盐","c":"讲义讲「一个极精的对比」：「**我们一般吃的海盐、青盐、岩盐，这种天然的盐，都有排水的功能。****就是我们的人工盐不排水；所以你到那个工厂提的精炼盐，都不排水，越吃水肿越厉害。****最烂的盐，就是我们在美国在餐厅里面桌子上吃的那种盐最烂。****他们美国人吃盐的时候，吃个牛排、盐洒很多啊，不是洒两三下，洒满满的啊。**」\n\n**【极精】天然盐排水 vs 精炼盐不排（越吃越肿）**\n\n**须「标」**：**「①钠摄入过多确会水肿/高血压；②但不是因为『精炼』；③限钠是关键」** ✓✓","o":"RJ-2315 · 《人纪·神农本草经》中经第一百四十九味「凝水石」，讲解（PDF 第 347 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"干姜的本草条目","c":"【本经原文】「**味辛温，主胸满咳逆上气，温中止血，珠汗，逐风湿痹，肠澼下利，生者尤良；久服去臭气通神明。**」【性味】「**味辛，性温，无毒。**」【主治】「**干姜为除寒散结要药，主温中逐寒，回阳通脉，治四肢逆冷，中寒霍乱，冷痛疝气，寒泻腹痛，开脏腑，宣脉络。**」【容川】「**而四逆理中，则干姜不炮，取其性烈，乃能去寒；能温土中之阳，阳出则阴消。**」【药征】「**主治结滞水毒也，旁治呕吐咳，下利，厥冷，腹痛，胸痛，腰痛。**」【用量】「**普通一钱至三钱，大剂上两许。**」【禁忌】「**久服伤阴损目，误服劫津耗液；凡阴虚内热、阴虚咳嗽吐血、表虚有热、自汗盗汗、脏毒下血、因热呕恶、火热胀痛均忌。**」\n\n**【极重要】干姜的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛/温/无毒** |\n| **主治** | **除寒散结/温中逐寒/回阳通脉** |\n| **禁** | **阴虚内热/吐血（阴虚）** |\n\n**「生者尤良」——「这是本草对生干的定评。」** ✓✓","o":"RJ-2316 · 《人纪·神农本草经》中经第一百五十七味「干姜」，原文（PDF 第 351–352 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"咳嗽一问分寒热","c":"讲义讲「一个极简的分法」：「**现在有个人咳嗽，哎呀、医生我一直咳嗽。****啊你咳嗽，你口渴不渴？不渴——寒。****你口渴不渴？啊很渴啊、喝了很多冷水——热。****这马上就分出来了。****老师、糟糕，这个病人哑巴、你问他他不会讲；那你也可以拿两杯水放到他前面，一个冷水一个热水，试试看。****如果他两杯水都不拿，那你还可以看舌头：舌头是白的，都是寒的；舌头是干的、黄的、干燥的，都是热症。**」\n\n**【极重要】一问渴不渴分寒热（最简）**\n\n```\n咳 + 不渴 → 寒（干姜）\n咳 + 大渴冷饮 → 热（寒药）\n哑巴 → 两杯水测试 / 舌苔\n```\n\n**「两杯水测试」——「这是最精的哑巴法。」** ✓✓","o":"RJ-2317 · 《人纪·神农本草经》中经第一百五十七味，讲解（PDF 第 353 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"吐血用干姜","c":"讲义讲「一条极重要的观念」：「**这就区分南北派的不一样了：一般的温病家呢，如果一个人有咳嗽吐血，吐血一定是大热，全部开寒凉的药——完了！****吐血是里面寒很盛才会吐血，所以我们开大温大热的药下去。****诸位用一个观念去想：今天如果我们到大陆的北方、到了东北、黑龙江齐齐哈尔，你晚上睡觉的时候，你外面院子里面那个水管的水啊没有放掉，第二天早上起来，水管爆裂掉了。****冷的会让水管爆开了，这是大家都有的共识。****寒，所以血管会破裂；所以我们所有的吐血、咳血，第一个就想到干姜。**」\n\n**【极重要】吐血 = 血管爆裂（水管冻裂比喻）**\n\n```\n寒 → 血管收缩/脆 → 破裂 → 吐血\n  → 干姜（温）→ 血管复常 → 血止\n```\n\n**「冷会让水管爆裂」——「这是最精的比喻。」**要点：**须「绝「对「强「标」**：**「①吐血须立即急诊（内镜/介入/输血）；②不可用干姜止血；③上消化道出血首选内镜止血」** ✓✓","o":"RJ-2318 · 《人纪·神农本草经》中经第一百五十七味，讲解（PDF 第 353–354 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"干姜回阳大拇指比喻","c":"讲义讲「一个极精的比喻」：「**为什么回阳？因为肺是阳、阳气聚结的地方；所以一个人有没有力气，跟他的肺有关系。****就好像我们五个指头，手太阴肺经在大拇指上面；这五个指头里面，以大拇指的力量最强。****所以一个大拇指是独立的，另外四个要跟大拇指来抗衡。****你想想大拇指是气动工具嘛，肺是气，哇、最强，气动工具力量很大。****中医认为阳要失的时候，代表人快死掉了；我们要回阳救逆的时候，我们会用到干姜，干姜是入肺。****我们要救心脏，就干姜；还有要救肺，就干姜；几个药合在一起，就是回阳救逆的汤剂（四逆汤方）。**」\n\n**【极精】大拇指 = 肺经 = 气动工具（最强）**\n\n**「气动工具」——「这是最精的比喻。」** ✓✓","o":"RJ-2319 · 《人纪·神农本草经》中经第一百五十七味，讲解（PDF 第 354–355 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"炮制温而不烈","c":"【容川】「**干姜炮制则温而不烈，性轻而上浮；而四逆理中，则干姜不炮，取其性烈，乃能去寒。**」讲义：「**我们四逆汤、理中汤之类呢，干姜都不炮，它都是生用；我们就希望它的、干姜的烈性。****就是因为它的干姜的生用，才能够去里寒。**」\n\n**【极精】四逆须生干姜（不炮）**\n\n**「生用才能去里寒」——「这条与 n209肉桂生用」同一体系。** ✓✓","o":"RJ-2320 · 《人纪·神农本草经》中经第一百五十七味，原文引唐容川及讲解（PDF 第 355 页）。"},{"t":"神农本草经·中经：慈石（续）、凝水石、阳起石、铁精、干姜","h":"干姜气化水","c":"讲义讲「一条极重要的原理」：「**所以说，我们能够去寒，就是要靠这个干姜；能补那个脾脏，因为它是黄色的，姜类的是土类的东西，所以对脾脏很好。****那任何东西能够补到脾脏的，都能够利水、排水。****所以我们在用排水的药的时候，我们要让水气化；在身体里面气化的时候，也是要靠干姜来气化。****而肺就是水的上源，肺好像天空、天上的云一样；那水要能够气化，水才会能够出来。****那水不能气化，累积在身体里面，就是积水。****所以我们干姜常常会使用在水肿、水排不出来的时候。**」\n\n**【极重要】干姜气化水（肺为水上源）**\n\n```\n干姜（温脾/肺）\n  → 水气化 → 汗/尿出\n无水气化 → 积水（水肿/腹水）\n```\n\n**「气化才能排水」——「这条与 n215水与湿」、n157「三焦决渎」同一主题。** ✓✓","o":"RJ-2321 · 《人纪·神农本草经》中经第一百五十七味，讲解（PDF 第 355–356 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"葛根的本草条目","c":"【本经原文】「**味甘平，主消渴，身大热，呕吐，诸痹，起阴气，解诸毒；葛谷，主下利，十岁以上。**」【性味】「**味甘，性平，无毒。**」【主治】「**葛根为发汗解肌升阳散火要药，主消渴大热，伤寒中风，治头痛，泄泻，开胃气，解酒毒。**」【别录】「**疗伤寒中风头痛，解肌发表出汗，开腠理，疗金疮，止胁风痛。**」【容川】「**葛根其根深，能以地中水气，上达于苗叶，其苗极长，象人身之太阳经；从膀胱水中，达阳气于经脉，以卫周身，故入太阳经。**」【药征】「**主治项背强也，旁治喘而汗出。**」【用量】「**普通二钱至六钱。**」【禁忌】「**多用反伤胃气，升散太过也。**」\n\n**【极重要】葛根的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒** |\n| **主治** | **升津/项背强/解酒毒** |\n| **禁** | **多用伤胃气** |\n\n**「起阴气」——「这是最精的一句。」** ✓✓","o":"RJ-2322 · 《人纪·神农本草经》中经第一百五十九味「葛根」，原文（PDF 第 353–355 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"葛根升津不升气","c":"【容川】「**与升麻不同：葛根根实，故升津不升气；升麻根空，有孔道以行气，故升气而不升津。**」讲义：「**像升麻，我们升提的药物很多，升麻也是，那里面是空的，所以升麻的孔道能行气；升麻是升气不升津。****也就是说，一个病人跑来给你说『医生啊，我很口渴』，开个升麻——鸡同鸭讲、不会到；对不对？葛根，到了。**」\n\n**【极重要】葛根升津不升气（vs 升麻）**\n\n```\n葛根（根实）→ 升津不升气（口渴/项强）\n升麻（根空）→ 升气不升津（气陷）\n```\n\n**「实 vs 空」——「这是最精的一对。」** ✓✓","o":"RJ-2323 · 《人纪·神农本草经》中经第一百五十九味，原文引唐容川及讲解（PDF 第 357 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"项强就用葛根","c":"讲义讲「一个极快的反应」：「**临床上面，我们什么时候会使用到葛根？病人告诉你『老师，我脖子好硬、好难过』——项强，强硬的时候，就是葛根。****因为项强、脊椎骨，一根这样的脊椎骨，到了项这边，膀胱经这边两条经下来的时候，很多经络缠绕在这，督脉一直上来，到顶这个地方。****所以项强是葛根的主要症状。****你只要听到一个人说『项强』，你就可以用葛根了，就结束了。****不要等到说要项强、你再考虑要不要用葛根，等越来越抽、越来越抽，啊、现在需要了，人家已经不会讲话了。**」\n\n**【极重要】项强 = 葛根（听到就用）**\n\n**「一听到就用」——「这是最精的反应。」** ✓✓","o":"RJ-2324 · 《人纪·神农本草经》中经第一百五十九味，讲解（PDF 第 355、357 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"有汗用葛根无汗用麻黄","c":"讲义讲「一个极精的分法」：「**那第二个：有汗无汗，问他『你那个感冒，有汗？无汗？』有汗，已经可以用葛根了；无汗则是麻黄之类的。****为什么？因为它是得自于表虚；所谓的『得自于表虚』——小孩子在运动在玩乐、流汗，表是空的、表是张开的，这个中的那个风寒，得自于表虚的病。****葛根汤就是这个病。**」\n\n**【极重要】有汗 → 葛根（表虚）；无汗 → 麻黄（表实）**\n\n**「表虚 vs 表实」——「这条与 n199麻黄」同一体系。** ✓✓","o":"RJ-2325 · 《人纪·神农本草经》中经第一百五十九味，讲解（PDF 第 357 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"小儿流汗吹冷气","c":"讲义讲「一个极精的画像」：「**一般小孩子活蹦乱跳、精力很多；他平常白天就在活动，一直热啊、流汗流汗；流汗以后他就坐在那边汗透当风、找很冷的、很凉快的地方。****如果学校那个教室走廊、那个回廊角的那边，风吹得最凉快，那坐那边吹凉风。****运动完么，一票人坐在那边吹凉风、喝冰汽水、吃冰棒。****他在运动之下伤了津液之后得到了寒，就是伤于冬；然后一发起来，就是因为津液丧失而得到的风寒，简单讲就是这样子的。****所以葛根汤常常用在小儿科，小孩子一发烧、葛根汤证。**」\n\n**【极精】流汗 + 吹冷气 = 葛根汤证（小儿）**\n\n**「汗透当风」——「这条与 n55汗被逼回去」、n162「湿衣服」同一体系。** ✓✓","o":"RJ-2326 · 《人纪·神农本草经》中经第一百五十九味，讲解（PDF 第 355–356 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"水痘麻疹用葛根透发","c":"讲义讲「一个极精的用法」：「**葛根发汗解肌升阳、散火的药，要发阳解肌升阳；诸位想想看，升发的力量很强。****我们小孩子有水痘，小孩子三岁、或者五岁、四岁得到水痘；那水痘一起来，小孩子说『咦、老师你看手指头旁边有个小水泡跑起来了』。****水痘，中医认为是一种胎毒，发散出来。****我们有葛根汤，葛根一下去，全身 overnight、一个晚上起来，全身透发水痘。****问小孩子痛不痛？痒不痒？『不痛啊』；精神好不好？胃口大开、开始吃东西。**」\n\n**【极精】水痘/麻疹 → 葛根透发（胎毒）**\n\n**须「标」**：**「①水痘现代有疫苗；②高热须对症；③不可强行透发」** ✓✓","o":"RJ-2327 · 《人纪·神农本草经》中经第一百五十九味，讲解（PDF 第 356 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"刚痉是脑部缺水","c":"讲义讲「一条极重要的病机」：「**有一种痉病，突然之间昏厥了、全身绷紧、角弓反张、弯过去。****为什么？因为脑部的津液没有了、水没了，脑部里头没有水啊；所以你摸到头是凉的啊、头顶没有水。****那如果哪里津液不够了、堵在项这边、没有办法上来了，那脑部里面不单单是缺氧。****津液不足的时候，人会抽筋、抽搐起来的时候角弓反张，好像癫痫一样。****整个这样身体反过来，本来手脚在前面，手往后翻，这样翻过去，中医称之为刚痉。****这个时候呢，也是要靠葛根，唯一的药；葛根把津液提升起来，从肾脏提升起来，直接把那个水提到脑部去，让脑部得到充足的水分，痉的现象就会解除掉。**」\n\n**【极重要】刚痉 = 脑部缺水 → 葛根升津**\n\n```\n津液不下 → 脑缺水 → 角弓反张（刚痉）\n  → 葛根（升津至脑）→ 痉解\n```\n\n**「从肾脏提升起来」——「这条与 n37刚痉/柔痉」、n213「痉病」同一体系。**要点：**须「强「标」**：**「角弓反张须立即急诊（脑膜炎/破伤风/癫痫）；不可只用葛根」** ✓✓","o":"RJ-2328 · 《人纪·神农本草经》中经第一百五十九味，讲解（PDF 第 356 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"断食治癌的思路","c":"讲义讲「一个极敏感的思路」：「**断谷不饥，断谷；过去呢道家修炼断谷么。****那你想想看，如果你今天得到癌症，你要吃饭、肿瘤也要吃饭，对不对？那很累啊。****你不吃又不行、吃了又怕自己身体没吃到、喂到肿瘤去。****唯一的方法怎么样？断食。****断食是一种很好的养生之道；那你断食的时候，肚子里面吃点东西，葛粉很好。****我们断食的时候最怕失水、脱水；你只要没有脱水，十天、两个礼拜、三个礼拜，你跟它耗、耗，癌细胞饿死了么。****你没有事、它死掉了，这是一种方法，不是没有效哦。****所以你要看情形：如果这人得了癌症非常的壮，断食配合药物治疗……这都是很好治的方法。****那这个人呢，来之前已经做过化疗五次了、已经快挂了，元气都没了；你让他断食，他马上就死给你看。****所以不能断食，所以你要看情形、要因人制宜。**」\n\n**【极精】断食治癌（须看体力）**\n\n**须「严重标」**：**「①断食不能治癌；②癌症患者禁忌自行断食（恶液质/肌少）；③须营养科」** ✓✓\n\n**「因人制宜」是前提** ✓✓","o":"RJ-2329 · 《人纪·神农本草经》中经第一百五十九味，讲解（PDF 第 357 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"瓜蒌根实的本草条目","c":"【本经原文】「**味苦寒，主消渴身热，烦满大热，补虚安中，续绝伤；今名天花粉。**」【性味】「**味甘，性寒，无毒。**」【主治】「**瓜篓实为润肺降气要药，主祛痰止嗽，涤胸中垢腻，润心肺及胃；天花粉主消渴，烦满大热，通乳消肿。**」【吴克潜】「**一般治痰剂有宣有下有消有攻有润，而瓜篓实为润也；润剂之别是：瓜篓清而润、苏子温而润、莱服子消而润、麦冬补而润、牛蒡杏仁散而润。**」【倪注】「**按伤寒杂病论之用根为生津要药，滋润太阳经之燥与胃经之燥，实为去心包积痰之要药。**」【用量】「**普通一钱至三钱。**」【禁忌】「**脾胃虚寒作泄者忌；反乌头，忌铁。**」\n\n**【极重要】瓜蒌根/实的本草条目**\n\n| 药 | 用 |\n|---|---|\n| **瓜蒌根（花粉）** | **生津/消渴/通乳** |\n| **瓜蒌实** | **润肺/胸痹/心脏** |\n| **瓜蒌皮** | **润肠消炎** |\n\n**「去心包积痰之要药」——「这是最精的定位。」** ✓✓","o":"RJ-2330 · 《人纪·神农本草经》中经第一百六十味「栝篓根」，原文（PDF 第 358–359 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"瓜蒌像心脏","c":"讲义讲「一个极精的取象」：「**几乎所有的消渴、糖尿病、口渴，都在用瓜蒌根；几乎所有的心脏病、胸痞，统统在用瓜蒌实，胸闷、统统在用瓜蒌实。****为什么？因为瓜蒌长的就像心脏么。****那你去看瓜蒌实，一颗、两颗、三颗、四颗，它有中间有间隙，那个就好像丝瓜；把那个纵、剖面切下来，这个很多籽在里边。****纵劈下来，中间都是它连接的网，一片一片下来，就好像心脏的心室一样。**」\n\n**【极重要】瓜蒌像心脏（取象）**\n\n```\n瓜蒌实（纵剖如心室）→ 治胸痹/心脏病\n瓜蒌根（生津）→ 治消渴/口渴\n```\n\n**「像心脏」——「这条与 n194取象」、n215「以意取象」同一体系。** ✓✓","o":"RJ-2331 · 《人纪·神农本草经》中经第一百六十味，讲解（PDF 第 359 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"葛根与瓜蒌根的位置","c":"讲义讲「一个极精的对比」：「**那瓜蒌根主治消渴的力量比葛根还好。****葛根呢，它的津液是在后项、从太阳经上来，在脖子上面，津液上来到脑部去。****瓜蒌根不是，直接跑到喉咙，一吃下去，马上津液就生出来了。**」\n\n**【极重要】葛根（后项/脑）vs 瓜蒌根（喉咙直接）**\n\n```\n葛根 → 项背→脑（项强/刚痉）\n瓜蒌根 → 喉咙直接（消渴/口渴）\n```\n\n**「位置不同」——「这是最精的一对。」** ✓✓","o":"RJ-2332 · 《人纪·神农本草经》中经第一百六十味，讲解（PDF 第 359 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"胸痞的四个来源","c":"讲义讲「一个极直白的态度」：「**【药征】呢主治胸痞，胸痞的话、就是胸口的闷痛、胀痛。****那里面可能原因是心脏瓣膜闭锁不全，或者是动脉血管堵塞，或者是心律不整，都没有关系，你放瓜蒌实下去。****那心脏的肥大都没有关系，我们不管你内证、只管外面的症状。**」\n\n**【极精】胸痞：瓣膜/阻塞/心律不整/肥大 → 瓜蒌实**\n\n**须「强「标」**：**「胸闷痛须先排心梗（ECG + 肌钙蛋白）；不可只用瓜蒌实」** ✓✓","o":"RJ-2333 · 《人纪·神农本草经》中经第一百六十味，讲解（PDF 第 360 页）。"},{"t":"神农本草经·中经：葛根（续）、栝篓根（瓜蒌根）、苦参、当归","h":"攻补三策","c":"讲义讲「一条极重要的治疗策略」：「**病人体力如果很好的时候、精神状况很好的时候，你就直接开始攻。****精神不够的时候，你要补泻兼顾；完全虚的时候，你就不要攻了，就去补他，什么十全大补汤什么的，都可以开了。****所以你要因时因地制宜。****同样一个病的病人来的时候，他是肝癌；可是这个是精神非常好、那个是精神非常的坏，你处方不适用的。****过去临床上也看到说，这个太太人完全虚掉了、乳癌，到最末期完全就虚掉了；诶、不要开任何攻坚的药，开十全大补汤。**」\n\n**【极重要】攻补三策：实则直攻、半虚补泻兼顾、全虚只补**\n\n```\n体力好 → 直攻\n精神不够 → 补泻兼顾\n全虚 → 只补（十全大补汤）\n```\n\n**「因时因地制宜」——「这条与 n134病大于元气不可攻」、n179「放手一搏」同一主题。** ✓✓","o":"RJ-2334 · 《人纪·神农本草经》中经第一百六十二味「当归」，讲解（PDF 第 362–363 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"治瘤的四个指标","c":"讲义讲「一条极重要的治瘤原则」：「**无论如何，一定要在治疗任何的肿瘤、抓到了癌症重症，主要的原则：第一个就是要胃气恢复。****所有的重症的人呢，胃气恢复一定是在半夜；晚上睡醒过来突然三更半夜怎么肚子好饿，一看、两点、一点半。****半夜醒过来肚子饿，就是胃气恢复的现象。****你只要一直保持病人胃气的恢复、保持他的胃口、保持他有大便出来、保持能够睡、小便正常，基本上他就不会坏了。****一段时间以后，这个黑盒子就盖起来了。****可能肿瘤还在那边，或者不在了，都无所谓，因为他已经不妨碍你了。****这个飞机只有 Crash 时候才去开黑盒子嘛；你没事把黑盒子打开来干嘛。**」\n\n**【极重要】治瘤四指标：胃气、胃口、大便、睡眠（+小便）**\n\n```\n胃气恢复（半夜饿醒）→ 有胃口\n  → 有大便 → 能睡 → 小便正常\n    → 带瘤生存（不打开黑盒子）\n```\n\n**「黑盒子」——「这条与 n138七天胃气」、n113「喜是最好的症状」同一主题。**要点：**须「标」**：**「①带瘤生存须规范随访（影像）；②不等于不治疗」** ✓✓","o":"RJ-2335 · 《人纪·神农本草经》中经第一百六十二味「当归」，讲解（PDF 第 363 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"当归头生血尾行血","c":"【容川】「**归首之性升，故主生血；尾之性降，故主行血。**」讲义：「**我们过去当归有当归头、当归身、当归尾。****这个当归的头的性，头上嘛，主生、生血；尾呢，主行血。****当然，我们切当归的时候，没有什么分头尾；当归拿来的时候，把它一压、压扁，一劈下来的时候，一片一片劈下来就头尾都有了。****我们很少去区分；除非我们说刻意，这个病人要下胎、这个女孩子这个要胎儿让他下来，那当归你的补血不好啊，就当归尾就好。**」\n\n**【极精】当归头生血、尾行血（下胎用尾）**\n\n**「首升尾降」——「这是最精的一对。」** ✓✓","o":"RJ-2336 · 《人纪·神农本草经》中经第一百六十二味，原文引唐容川及讲解（PDF 第 363–364 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"治肝必通大肠","c":"讲义讲「一条极重要的诀窍」：「**我们治肝病，一定会去治大肠，因为肝的下方跟大肠是相连的。****所以肝气能够舒、能够郁、能够散；肝气能够郁闷、郁的气能够散开来，要靠大肠。****所以说，治肝病的诀窍一定要通大肠，我跟诸位已经一再的强调过。****这是肝脏，肝脏到大肠下方有个血管、这边血管，这是相通的，所以肝和大肠是相通的。****所以我们在治疗肝病的时候一定要注意便秘的问题。**」\n\n**【极重要】治肝必通大肠**\n\n**须「强「标」**：**「①肝性脑病用乳果糖是对的；②但『肝血流入大肠』解剖方向反了（门静脉是肠→肝）；③便秘确会加重肝性脑病」** ✓✓\n\n**「这条与 n67治肝一定要治大肠」同一主题。** ✓✓","o":"RJ-2337 · 《人纪·神农本草经》中经第一百六十二味，讲解（PDF 第 364 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"麻黄的本草条目","c":"【本经原文】「**味甘，温，无毒；治中风，伤寒，头痛；温疟，发表出汗，去邪热气，止咳逆上气，除寒热，破症坚积聚；一名龙沙。**」【性味】「**味苦，性温散，无毒。**」【主治】「**麻黄为发汗解散要药，功能退热平喘利水，主伤寒表实无汗，治肺实喘逆，通利水道。**」【容川】「**其茎空，直达而上，且无大味，纯得天轻阳之气，故专主气分；一般取其苗，以其苗细长中空，象人毛孔，而气轻扬，故能发汗。****其根坚实味涩，故能止汗。**」【药征】「**主治喘咳水气也，旁治恶风恶寒，无汗，身疼，骨节痛，一身黄肿。**」【用量】「**普通五分至一钱，大剂三钱。**」【禁忌】「**诸虚有汗，肺虚痰嗽，气虚发喘，均忌。**」【倪注】「**因麻黄根能止汗，节亦止汗，故欲发汗，则须去根与节。**」\n\n**【极重要】麻黄（青龙）的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦/温散/无毒** |\n| **主治** | **发汗解表/喘/水** |\n| **禁** | **虚汗/肺虚喘** |\n\n**麻黄茎发汗、节根止汗** ✓✓","o":"RJ-2338 · 《人纪·神农本草经》中经第一百六十三味「麻黄」，原文（PDF 第 364–365 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"麻黄提炼减肥药事件","c":"讲义讲「一个极重要的公案」：「**青龙，这个麻黄呢，质非常的轻；就因为质轻，所以他气他就往上升。****过去因为那个有药厂，就拿单味的麻黄，去买很多麻黄去把它提炼出来做成那个减肥药，在美国卖。****卖了以后造成别人心脏受损，心脏受损以后麻黄就禁用。****闯祸的是西药厂，结果西药厂还可以使用，因为他们是研究单位。****因为我在发言哪，我在那边骂。****我就跟他说：你如果让 FDA 通过、所有人不能使用麻黄，你是千古的罪人。****我治疗所有的肺癌、肺病、肺痨、肺结核、气喘、咳嗽，没有不使用麻黄的。**」\n\n**【极精】麻黄提炼减肥药事件（最重要的公案）**\n\n**「提炼 vs 生用」——「这是最精的一对。」**要点：**须「强「标」**：**「①麻黄碱确有心血管风险，多国限制；②讲义这一点说对了；③不可因此自行服用麻黄」** ✓✓","o":"RJ-2339 · 《人纪·神农本草经》中经第一百六十三味，讲解（PDF 第 365–366 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"麻黄须复方","c":"讲义讲「一条极实用的用法」：「**那这个麻黄不能单用；不要、回家，老师那么好，回家单吃麻黄，完了。****你一吃下去，今天晚上就不要睡觉了。****所以如果今天晚上打麻将赌钱，那你就要吃麻黄；那单味一下去，马上就精神很好，通宵达旦的不睡觉。****那麻黄是复方，我们会用；我们不是单味用麻黄，我们有好几味配在一起，各种不同的药配在一起，他产生不同的作用。**」\n\n**【极精】麻黄须复方（不可单用）**","o":"RJ-2340 · 《人纪·神农本草经》中经第一百六十三味，讲解（PDF 第 366 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"一剂知二剂已","c":"讲义讲「一条极重要的用药法」：「**发汗，你说老师中医的名词不好；解表什么意思？皮肤表面上，当有风寒的时候，表、皮肤毛孔就被束住了。****束住以后呢，你汗透发不出来，我们就称之为表实。****那个表实，要把表实打开来的话，我们就要靠麻黄来解表。****麻黄一下去，毛孔就开了、毛孔开了汗就出来了。****那你说那很好啊、多用，一直用那汗就出来不止了；所以你不能过用，汗出来就好了嘛。****所以我们经方是、一再讲，我是绝对处方，药到了就停掉了。****所以我们才会说一剂知二剂已。**」\n\n**【极重要】一剂知二剂已（汗出即停）**\n\n**「药到就停」——「这条与 n211中病即止」、n78「大毒治病十去其六」同一主题。** ✓✓","o":"RJ-2341 · 《人纪·神农本草经》中经第一百六十三味，讲解（PDF 第 366 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"肺家实症用麻黄","c":"讲义讲「一条极重要的定位」：「**肺实，肺的本身呢，管全身的皮肤毛孔；肺家实热的时候，他们那里面汗动不了。****肺是水的上源，当然会影响到水道；肺一打开来、毛孔一开来，水就往下走了。****病人呢，气喘咳嗽的时候，几乎都会用到麻黄。****我们说用五行的来形容：木、火、土、金、水，我们要治肺是不是要治肝？治肺一定要治肝。****麻黄是青色的，就是青木；用麻黄去治。****所以记得我的话：肺家的病、喘、气喘、咳嗽、肺癌，什么问题统统要靠麻黄。****麻黄能够宣肺，能够把肺气打开来。****使用的时机，就是肺家的实症。**」\n\n**【极重要】肺家实症 → 麻黄（宣肺）**\n\n```\n肺实（无汗/喘/水）→ 麻黄（青木）\n治肺必治肝（青木）\n```\n\n**「这条与 n199麻黄」同一主题。** ✓✓","o":"RJ-2342 · 《人纪·神农本草经》中经第一百六十三味，讲解（PDF 第 366–367 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"脓疮出血禁麻黄","c":"讲义讲「一个极实用的禁忌」：「**大家记住一个治皮肤病的原则：你皮肤如果有脓痒、化脓了，像青春痘很多，像那个伤口有化脓，只要用脓疮的时候，都不要去发表。****因为你一发表，脓疮的话会更多，因为你一发表水会更多、湿会更深。****所以其它的皮肤病，像风疹啊、疥疮啊、湿疹都可以使用，但是就是有脓疮的时候最好不要用。****还有呢，皮肤上有出血；出血来找你，你刚好你在拿药，刚好一个病人是麻黄汤证，结果呢、麻黄汤你本来要给那个病人，给错了，给了这个。****一吃下去，本来就出血，一吃麻黄，啪、出血的力量更强了。**」\n\n**【极精】脓疮/出血禁麻黄（发表）**\n\n**「有脓不发表」——「这条与 n49疮家不可发汗」、n47「衄家不可汗」同一主题。** ✓✓","o":"RJ-2343 · 《人纪·神农本草经》中经第一百六十三味，讲解（PDF 第 366 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"乳癌的三层","c":"讲义讲「一个极精的病机」：「**所以白通草我用在通奶，乳房硬块的时候我们用的很多。****因为我们的观念里面认为说：你乳癌之前是乳房的硬块，乳房的硬块之前是陈旧的奶水累积。****因为陈旧的奶水里面很多钙质，很多钙质你才会累积成硬块、像石头一样。****那个在乳腺里面塞住，然后变成奶粉一样、像石头一样很硬，以后越来越严重。****那我们要把它通利出来，我们要开很多通利的药；只要能够入三焦淋巴系统的药，统统可以通乳、通奶、胸部的乳腺。**」\n\n**【极精】乳癌的三层：陈旧奶 → 硬块 → 乳癌**\n\n```\n陈旧奶水（钙质沉积）\n  → 乳房硬块（如石）\n    → 乳癌\n```\n\n**须「强「标」**：**「①乳房硬块须超声/钼靶+活检；②『陈旧奶水致癌』无证据；③不可只靠通乳药」** ✓✓","o":"RJ-2344 · 《人纪·神农本草经》中经第一百六十四味「通草」，讲解（PDF 第 368 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"白芍收静脉瘤","c":"讲义讲「一个极重要的用法」：「**所有世界上的妈妈们，如果你脚有静脉瘤的时候，就是太散。****你需要一个药来收敛它；唯一能够收敛、把静脉瘤静脉血管收缩起来的，就是一味药——白芍。****你三钱开；你要真的要去收的时候，因为你要收住血脉、在四肢末梢。****你三钱，大概可以把肚子的；一般来说，只要是腹痛、女孩的月经痛。****你要去收那个腿上的静脉瘤，三钱根本是刷牙漱口的，至少要一两来起价。****张仲景也讲了，张仲景有经方芍药甘草汤，告诉你要用重剂了。****所以当你的目的，是要去收他的静脉的时候，你必须要重剂。**」\n\n**【极重要】白芍收静脉瘤（须重剂 1 两）**\n\n```\n静脉瘤（太散）→ 白芍（酸收）\n轻剂（3 钱）→ 只治腹痛\n重剂（1 两）→ 才收静脉\n```\n\n**「3 钱是刷牙漱口」——「这是最精的剂量观。」**要点：**须「标」**：**「①静脉曲张首选压力袜/手术/激光；②1两白芍可致腹泻/电解质紊乱；③不可自行重剂」** ✓✓","o":"RJ-2345 · 《人纪·神农本草经》中经第一百六十五味「芍药」，讲解（PDF 第 369–371 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"腹痛用芍胸满去芍","c":"讲义讲「一条极精的一对」：「**我们经方有一句话：腹痛，用芍；胸满，用枳实。****但是，胸满的时候，因为重剂的时候，白芍是酸收啊、它是入血分的。****酸收的时候经脉的血流回心脏的速度很快，所以有胸满的人不加白芍。****所以你回头再看张仲景的《伤寒》《金匮》，只要有胸满的他就桂枝汤去芍药。****因为你在白芍在收敛的同时，那静脉回到心脏的力量太强，胸满会增强，所以把白芍拿掉。**」\n\n**【极重要】胸满去芍药（静脉回流太强）**\n\n**「腹痛用芍、胸满去芍」——「这是最精的一对。」** ✓✓","o":"RJ-2346 · 《人纪·神农本草经》中经第一百六十五味，讲解（PDF 第 370 页）。"},{"t":"神农本草经·中经：当归（续）、麻黄、通草、芍药","h":"动脉属阳静脉属阴","c":"讲义讲「一条极重要的配对」：「**那如果我们要想阴阳要平衡，在《神农本草经》里面，这个白芍就是阴药，因为它入血分嘛。****桂枝呢，前面讲了桂枝，就是阳药；这两个一阴一阳，配对的。****如果我们用白话文解释：动脉血管、动脉是循环，心脏动脉的部分是属于阳，属于桂枝。****静脉的属于阴，属于芍药。****当然这是一个比较狭隘的想法；当我们一个人身上失掉平衡的时候，我们就要靠白芍和桂枝来调整一下。****当你阳比较虚、阴比较盛的时候，你桂枝多一点、把芍药少一点，我们有桂枝加桂汤。****当你阳比较盛、阴那个比较虚的时候，芍药重用一点、桂枝少用一点，我们的建中汤就是这样来的。**」\n\n**【极重要】动脉 = 阳（桂枝）；静脉 = 阴（白芍）**\n\n```\n动脉（阳）→ 桂枝\n静脉（阴）→ 白芍\n阳盛阴亏 → 芍药多（建中汤）\n阴盛阳亏 → 桂枝多（桂枝加桂汤）\n```\n\n**「动阳静阴」——「这条与 n196桂枝」同一主题。** ✓✓","o":"RJ-2347 · 《人纪·神农本草经》中经第一百六十五味，讲解（PDF 第 370–371 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"止痛的两味药","c":"讲义讲「一个极直白的用法」：「**我们有两味药，一味药叫延胡索，一味药叫金铃子。****这是我们中医的止痛的药，好像吗啡一样，止痛的药。****那肝癌很痛，我们可以让病人少受一点痛，就算要死也少受点痛嘛。****西医一般这个时候都用吗啡。****我们用延胡索、金铃子开重剂下去；金铃子用的时候开下去煮起来粘达达的、非常的粘稠，它是我们止痛的很好的药。**」\n\n**【极重要】止痛两味：延胡索 + 金铃子（如吗啡）**\n\n**须「强「标」**：**「①癌痛须规范用阿片类（WHO三阶梯）；②不可用中药替代；③延胡索含生物碱，强度远不如吗啡」** ✓✓","o":"RJ-2348 · 《人纪·神农本草经》中经第一百六十五味「芍药」，讲解（PDF 第 371–372 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"白芍的四个用途","c":"讲义讲「一个极实用的总结」：「**诸位记得，我们在肝病的时候，止痛；妇科的时候肚子痛的时候；脚静脉瘤、静脉曲张的时候，统统会用到白芍。****这个白芍使用的地方非常的多。****在阴虚的时候我们都会用白芍；阴阳要平衡的时候，我们会重用白芍。**」\n\n**【极精】白芍四用：肝痛、妇科痛、静脉瘤、阴虚**","o":"RJ-2349 · 《人纪·神农本草经》中经第一百六十五味，讲解（PDF 第 372 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"瞿麦利水破血","c":"【本经原文】「**味苦，寒，无毒；治关格，诸癃结，小便不通；出刺，决痈肿，去翳，破胎堕子，下闭血；一名巨句麦。**」【性味】「**味苦，性寒，无毒。**」【主治】「**瞿麦为利水破血要药，主五淋，治小便癃闭，月经不通，降心火，利小肠。**」【禁忌】「**瞿麦性猛利，善下逐；凡肾气虚、小肠无大热、胎前产后一切虚人患小水不利，及水肿鼓胀脾虚者均忌；能堕胎孕妇忌用。**」讲义：「**因为它药性是寒的，所以如果遇到热性的病是对症的。****比如说我小便痛、小便颜色赤红，已经讲完了他就是热嘛，我们就要用寒的药。****那寒症的话药就不能用；比如说小便是淡白的也不痛，虚寒的人，你再用寒药的话他人会更虚。****所以一般这个瞿麦呢，我们是只用在实症，虚症的时候我们都不用。**」\n\n**【极重要】瞿麦 = 利水 + 破血（只用实症）**\n\n```\n热淋（尿痛/色赤）→ 瞿麦（苦寒）\n虚寒淋（尿淡白不痛）→ 禁用\n```","o":"RJ-2350 · 《人纪·神农本草经》中经第一百六十七味「瞿麦」，原文及讲解（PDF 第 373–374 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"淋病绝对忌汗","c":"讲义讲「一条极重要的禁忌」：「**王执中后面最后一句话很重要：所有这种最忌发汗，汗之便血。****这讲的是什么？淋病。****我们所谓五淋，有石淋、沙淋呀，这个淋病、小便有问题的时候，所有的热症，这个绝对忌讳发汗。****因为中医的观念呢，你发汗他的话小便就会带血。****中医的观念里面认为说，汗血是同源、来自相同的地方。****汗一多的时候小便变得浓浊了嘛、更浓了。****小便里面那个石头呀、一些沙淋呀不容易排出来。****太浓以后排出来以后，它经过那个尿道的时候，那个沙淋、石淋会把尿道划开来、会划伤口。****所以排出来血很多，所以一般淋病我们绝对忌汗，一汗的话小便就会出血。**」\n\n**【极重要】淋病绝对忌汗（汗血同源）**\n\n```\n淋病（石淋/沙淋）→ 禁发汗\n  发汗 → 小便浓浊 → 沙石划伤尿道 → 血尿\n```\n\n**「汗之必便血」——「这条与 n47衄家不可汗」、n49「疮家不可发汗」同一主题。**要点：**须「标」**：**「①淋病（尿路感染/结石）须抗生素/排石；②脱水确会加重；③但不是主要风险」** ✓✓","o":"RJ-2351 · 《人纪·神农本草经》中经第一百六十七味，讲解（PDF 第 373–374 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"玄参清火退热","c":"【本经原文】「**味苦，微寒，无毒；治腹中寒热积聚，女子产乳余疾；补肾气，令人目明；又名黑参、元参。**」【主治】「**元参为清火退热要药，功能治一切实热，狂热，燥热，肿疡，瘰疬。**」【甄权】「**热风头痛，伤寒劳复，暴结热，散瘿瘤瘰疬。**」【大明】「**治游风，补劳损，心惊烦躁，骨蒸，传尸邪气，消肿毒。**」【纲目】「**滋阴降火，解斑毒，利咽喉，通小便血滞。**」【用量】「**普通钱半至三四钱，大剂一二两。**」【禁忌】「**凡血少目昏，停饮支满，血虚腹痛，脾虚泄泻，均忌。**」讲义：「**它你采下来生的时候是白的，你刀子一切了以后它当时就变黑的了，所以叫黑参、叫玄参。****诸位看到只要是黑色的，颜色黑的统统能入肾。**」\n\n**【极精】玄参 = 清火退热（实热/瘰疬）**\n\n**「黑色入肾」——「这是最精的一句。」** ✓✓","o":"RJ-2352 · 《人纪·神农本草经》中经第一百六十八味「玄参」，原文及讲解（PDF 第 375–376 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"秦艽是督脉专药","c":"【本经原文】「**味苦，平，无毒；治寒热邪气，寒湿风痹，肢节痛；下水，利小便。**」【主治】「**秦艽为治风湿要药，功能清风热治湿热，主寒热身酸痛，黄疸酒毒，养血，荣筋，安胎。**」【容川】「**秦艽肌纹多，左右交缠，故治左右偏风、筋脉疼痛之症，利于续接经脉。**」讲义：「**所有尤其因为秦艽长的哦，为什么它筋非常多？它像个树，秦艽长的时候就这样子的，把树这样包起来的、交叉的这样包起来的，把树包得紧紧的。****所以我们只要治疗督脉的病；别人只要讲了督脉脊椎骨痛、那脖子有酸痛，常常这里骨节酸痛，然后我们除了针灸以外，处方都可以用秦艽。**」\n\n**【极精】秦艽 = 督脉专药（脊椎/腰椎）**\n\n**「把树包得紧紧的」——「这是取象。」** ✓✓","o":"RJ-2353 · 《人纪·神农本草经》中经第一百六十九味「秦艽」，原文及讲解（PDF 第 377 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"续断与秦艽","c":"讲义讲「一条极精的一对」：「**老师你前面教我个续断，现在又来个秦艽；没错，骨头骨折的时候续断，筋折的时候秦艽。****这两个稍微不一样。****那偏风，就是瘫痪嘛，左边瘫痪、右边瘫痪都可以使用秦艽。**」\n\n**【极精】续断 vs 秦艽（骨 vs 筋）**\n\n```\n骨头骨折 → 续断\n筋骨折 → 秦艽\n```\n\n**「这条与 n210续断」同一主题。** ✓✓","o":"RJ-2354 · 《人纪·神农本草经》中经第一百六十九味，讲解（PDF 第 378 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"风湿的分部用药","c":"讲义讲「一条极重要的分部」：「**中药使用的时候很多药可以治风湿关节；但是我们真正要治在临床上看的时候，到底哪一个地方用什么药。****秦艽的时候大部分用在脊椎骨上面、尾椎骨腰椎骨上面。****那比如说我们会用乌头其它的东西可以就在手关节上面；膝盖关节可能用其它的防风啊、附子啊这种。****为什么会这样子区分开来？我们张仲景把它区分开来的。****所以看起来好像都能治风湿关节炎，但是如果你真的用秦艽临床上去治疗手风湿关节炎的话，效果绝对没有乌头来的那么好。****但是如果是督脉、脊椎骨的那个风湿关节炎酸痛的话，你用秦艽效果比乌头还好。****不能统统开到一起哦，乱枪打鸟。**」\n\n**【极重要】风湿分部：手→乌头；脊/腰→秦艽；膝→防风/附子**\n\n```\n手关节 → 乌头\n督脉/腰椎 → 秦艽\n膝关节 → 防风/附子\n```\n\n**「不能乱枪打鸟」——「这条与 n176乱枪打鸟（80–90 味）」同一主题。** ✓✓","o":"RJ-2355 · 《人纪·神农本草经》中经第一百六十九味，讲解（PDF 第 377–378 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"百合润肺宁心","c":"【本经原文】「**味甘，平，无毒；治邪气腹胀，心痛，利大小便；补中益气。**」【主治】「**百合为清凉退热要药，主润肺宁心，清热止咳，补中益气，治百合病，肺病，吐血。**」【别录】「**除浮肿胪胀，痞满寒热；通身疼痛，及乳难喉痹，止涕泪。**」【大明】「**安心定胆益志，养五脏，治颠邪狂叫惊悸。**」【用量】「**普通一钱至三钱。**」【禁忌】「**中寒者勿服。**」讲义：「**经方里面我们有百合汤治疗狐惑。****它是色白嘛，能够宁肺宁心，能够让心呢非常的安宁。****所以那个百合嘛，什么都合意、好好好、很好很好，心情就会很好。**」\n\n**【极重要】百合 = 润肺宁心（治百合病）**\n\n**「百合病」——「这条与 n38百合病」同一主题。** ✓✓","o":"RJ-2356 · 《人纪·神农本草经》中经第一百七十味「百合」，原文及讲解（PDF 第 379–380 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"肺干燥的判据","c":"讲义讲「一个极简的判据」：「**那你说老师什么时候要润肺？因为肺太干燥了就要润嘛。****那老师我怎么知道他肺太干燥？你看他一直在喝水、干咳咳嗽，那个就是干燥。****好，你要开药去润；百合、杏仁都可以润肺的，白色的统统可以润肺的，莲子也可以。**」\n\n**【极精】肺干燥 = 一直喝水 + 干咳（白色润肺）**","o":"RJ-2357 · 《人纪·神农本草经》中经第一百七十味，讲解（PDF 第 379 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"知母泻肺火清胃火","c":"【本经原文】「**味苦，寒，无毒；治消渴，热中，除邪气，肢体浮肿，下水，补不足，益气。**」【主治】「**知母为清凉解热要药，功能泻肺火，清胃火，下水消肿，利二便。**」【别录】「**疗伤寒久疟烦热，胁下邪气；多服令人泄。**」【甄权】「**心烦燥闷，骨热劳往来，产后蓐劳，肾气劳，憎寒虚烦。**」【元素】「**凉心去热，治阳明火热，泻膀胱肾经火热。**」【好古】「**泻火而上清肺金，滋水而下润肾燥，治命门相火有馀。**」【容川】「**知母叶至难死，拔之犹生，即知其得水气多，故能清气分之热。**」【用量】「**普通钱半至三钱。**」【禁忌】「**能滑肠，泄泻者忌；阳痿及易举易痿，脾弱饮食不化，胃虚不思食，均忌。**」讲义：「**《伤寒论》里面我们有白虎汤，白虎汤呢，就是石膏还有配上知母。**」\n\n**【极重要】知母 = 泻肺火 + 清胃火（白虎汤）**\n\n```\n白虎汤 = 石膏 + 知母\n```\n\n**「叶至难死」——「这是取象（得水气多）。」** ✓✓","o":"RJ-2358 · 《人纪·神农本草经》中经第一百七十一味「知母」，原文及讲解（PDF 第 380–381 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"胃火大是一直流吃","c":"讲义讲「一个极简的判据」：「**你说老师，我怎么知道这个胃火很大？很简单啦——『你胃口好不好？』『超级好啊，吃，我从早可以吃到晚』。****这个胃火太大，火就是不断地动嘛。**」\n\n**【极重要】胃火大 = 一直吃（吃一整天）**\n\n**「从早吃到晚」——「这是最精的画像。」** ✓✓","o":"RJ-2359 · 《人纪·神农本草经》中经第一百七十一味，讲解（PDF 第 381 页）。"},{"t":"神农本草经·中经：芍药（续）、蠡实、瞿麦、玄参、秦艽、百合、知母","h":"正常胃蠕动一息五次","c":"讲义讲「一条极精的生理数」：「**正常胃的蠕动呢，你吸一次、两次，吐气再两次，吸吐之间一次；所以一呼一吸，胃这样从下面蠕上来，刚好五次。****所以呼吸之间，脉的动跟我们那个胃的蠕动是相同的。**」\n\n**【极精】正常胃蠕动 = 一息 5 次**\n\n**「与脉同」——「这条与 n61一呼一吸五至」、n74「一息五至」同一主题。** ✓✓","o":"RJ-2360 · 《人纪·神农本草经》中经第一百七十一味，讲解（PDF 第 381 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"便秘的两分","c":"讲义讲「一个极重要的分法」：「**便秘我们分两种，一种是寒实，一种是热实。****在阳明症里面的时候、病在阳明的时候，出现的都是热实；寒实在少阴症、厥阴症才会看到。****老师怎么知道他是寒实、热实呢？问小便——小便是什么颜色？黄的，实热！****小便一个礼拜不出来、小便还是淡白的，这种人寒实。****你就问他：一个礼拜不上厕所，肚子难不难过？不难过——寒实，因为他没有蠕动嘛。****寒就是没有蠕动。****为什么要分寒实和热实？很简单，因为我们有的药是去热的药，有的药是去实的药。****所以我们会重复的、去实的药是相同的，但是去寒和去热的药是不一样的。**」\n\n**【极重要】便秘两分：寒实 vs 热实**\n\n| 项 | 热实 | 寒实 |\n|---|---|---|\n| **小便** | **黄** | **淡白** |\n| **腹痛** | **痛** | **不难过** |\n| **所在** | **阳明** | **少阴/厥阴** |\n| **用药** | **去热 + 去实** | **去寒 + 去实** |\n\n**「去实同、去寒热不同」——「这是最精的一句。」** ✓✓","o":"RJ-2361 · 《人纪·神农本草经》中经第一百七十一味「知母」，讲解（PDF 第 381–382 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"问小便颜色分寒热","c":"讲义讲「一个极实用的远程诊断」：「**老师怎么知道他是寒实、热实呢？问小便——小便是什么颜色？黄的，实热！****小便一个礼拜不出来、小便还是淡白的，这种人寒实。**」\n\n**【极精】问小便颜色分寒热**\n\n**「这条与 n42问病人小便黄的还是淡的」同一主题。** ✓✓","o":"RJ-2362 · 《人纪·神农本草经》中经第一百七十一味，讲解（PDF 第 381–382 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"中药能收能放","c":"讲义讲「一个极直白的观念」：「**你如果太胖、胃口太大，减肥的时候，你说『奇怪了，儿子怎么那么胖』，每天吃麦当劳炸鸡啊。****因为吃那个油炸的越吃胃火越大，越吃越强。****丢点知母石膏给他吃，吃了他就不想吃了。****有没有效？你再问他『儿子，我们去吃麦当劳？』『不想去』——唉，有效哦。****还有的小孩子呢是不吃，也很麻烦；我们如何让他的胃火增加？也有啊。****所以中药是能收能放的。****没有胃口的小孩子，让他有胃口；胃口太大了，我们让他减少。**」\n\n**【极精】中药能收能放（增胃口/减胃口）**\n\n**须「标」**：**「减肥须生活方式 + 药物；中药不可替代；石膏大剂可致胃寒/电解质」** ✓✓","o":"RJ-2363 · 《人纪·神农本草经》中经第一百七十一味，讲解（PDF 第 382 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"高热的三种来路","c":"讲义讲「一条极重要的鉴别」：「**病人如果发高热、但热不寒、壮热的时候，那个小孩子发烧。****那个被子都拉开来；那个大热的时候，我们讲壮热。****这时候我们白虎汤下去。****小孩子不讲话，你怎么知道他壮热？很简单啊——他不恶寒啊，衣服、棉被都踢开来了嘛。****如果是伤寒的时候，我们麻黄汤很多汤都可以去高烧。****但是你怎么知道他是恶寒还是发热？小孩子盖着棉被、在里面发抖，你盖着棉被他都不踢开来，代表里面是冷的、表面是冷的。****即使是发烧，但是他是伤寒，你用发汗的药。****还有那个便秘的也会高烧的；有的便秘的时候，我用大承气、很强的药，把他大便攻出来，烧就退了。**」\n\n**【极重要】高热三种：白虎（肺/胃）、麻黄（伤寒）、承气（便秘）**\n\n```\n高热 + 踢被 → 壮热（白虎汤）\n高热 + 盖被发抖 → 伤寒（麻黄汤）\n高热 + 便秘 → 大承气\n```\n\n**「踢被 vs 盖被」——「这是最精的鉴别。」** ✓✓","o":"RJ-2364 · 《人纪·神农本草经》中经第一百七十一味，讲解（PDF 第 382 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"贝母祛痰收敛疮口","c":"【本经原文】「**味辛，平，无毒；治伤寒烦热，淋沥邪气，疝瘕，喉痹，乳难，金疮，风痉；一名空草。**」【性味】「**味辛苦，性平无毒。**」【主治】「**贝母为祛痰治咳要药，功能散结泄热，润肺清火，治烦热疮疡。**」【大明】「**消痰润心肺；末和沙糖丸含之，止嗽；烧灰油调，传人畜恶疮，敛疮口。**」【容川】「**色白性平，利胸肺之痰气。**」【药征】「**主治胸膈郁结痰饮。**」【用量】「**普通钱半至三钱。**」【禁忌】「**寒湿痰食痰嗽，湿痰在胃、恶心欲吐，脾胃湿痰作眩，及痰厥头痛，中恶呕吐，胃寒作泄，均忌贝母。**」讲义：「**贝母这个东西，当我们一直把它打成细粉、把那个纤维拿掉，变成很细的贝母粉；丢到水里面就融化掉了，就是水飞嘛。**」\n\n**【极精】贝母 = 祛痰 + 收敛疮口（外用）**\n\n**「人面疮」是传说（须存疑）** ✓✓\n\n**须「强「标」**：**「①眼药须无菌，自制眼药危险；②疮口须规范换药；③人面疮是传说」** ✓✓","o":"RJ-2365 · 《人纪·神农本草经》中经第一百七十二味「贝母」，原文及讲解（PDF 第 382–383 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"白芷散风表汗","c":"【本经原文】「**味辛，温，无毒；治女人漏下赤白、血闭、阴肿、寒热、风头侵目泪出，长肌肤，润泽，可作面脂。**」【主治】「**白芷为散风表汗要药，功能通窍去湿，疗风行血，止头痛，和肠胃。**」【元素】「**解利手阳明头痛，中风寒热，及肺经风热，头面皮肤风痹燥痒。**」【用量】「**普通五分至钱半。**」【容川】「**白芷辛香，色白入肺，入阳明经，根性又主升，故能升散肺与阳明之风寒。**」讲义：「**白芷，阳明头痛，就是前额痛，额头这边痛就是阳明痛；阳明痛大部分是来自胃。**」\n\n**【极重要】白芷 = 散风表汗 + 阳明头痛（前额）**\n\n```\n阳明头痛（前额）→ 白芷\n也可外用（面脂/美容）\n```\n\n**「前额痛 = 阳明」——「这条与 n77胃经头维」同一体系。** ✓✓","o":"RJ-2366 · 《人纪·神农本草经》中经第一百七十三味「白芷」，原文及讲解（PDF 第 384–385 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"风胜湿","c":"讲义讲「一条极重要的原理」：「**诸位，风胜湿；如果说，老师，这个地方湿气太盛了，我们要怎么样把湿气去掉？吹风！湿就会散掉。****所以风是胜湿的，所有能够祛风的药都是能够去湿的药。****所谓祛风的比如说，这个把风赶动；一赶动，你看，白芷呢，疗风邪，为散风的药。****白芷是祛风的药，味道是辛、它主散，所以它能够祛湿。**」\n\n**【极重要】风胜湿（吹风湿就散）**\n\n```\n祛风药 → 就是祛湿药\n风（动）→ 湿散\n```\n\n**「这条与 n78风能胜湿」、n128「风湿」同一主题。** ✓✓","o":"RJ-2367 · 《人纪·神农本草经》中经第一百七十三味，讲解（PDF 第 385 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"淫羊藿壮阳益精","c":"【本经原文】「**味辛，寒，无毒；治阴痿，绝伤，茎中痛，利小便，益气力，强志。**」【性味】「**味辛苦，性温（或作小寒）。**」【主治】「**淫羊霍为壮阳益精要药，功能治阳痿茎痛，坚筋骨，利小便。**」【大明】「**治丈夫绝阳无子，女人绝阴无子，老人昏耄，中年健忘，一切冷风劳气，筋骨挛急，四肢不仁，补腰膝，强心力。**」【用量】「**普通钱半至三钱。**」【禁忌】「**凡虚阳易举，梦遗不止，便赤口干，强阳不痿均忌。**」讲义：「**诸位记得，痛，是因为不通，不通就痛啊。****一个是你有石头堵到、有东西堵到里面不通；还有一种是寒。****寒就是血管缩小，各方面的那个管道、进去的管道循环系统统缩小了，三焦淋巴系统也缩小了。****这个时候我们要用热药下去，把这个寒水化掉，气血才会流畅，就不会痛了嘛。**」\n\n**【极重要】淫羊藿 = 壮阳益精（通则不痛）**\n\n**「不通就痛」——「这是最精的病机。」** ✓✓","o":"RJ-2368 · 《人纪·神农本草经》中经第一百七十四味「淫羊藿」，原文及讲解（PDF 第 385–387 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"中药只分阴阳","c":"讲义讲「一条极重要的定位」：「**女人可不可以吃？一样。****你说『老师，这个只补男人』——错了，中药是双向的。****因为中药没有什么男性荷尔蒙和女性荷尔蒙，没有。****中药只分阴阳。****所以说这是西药和中药不一样，中药呢，不会；男人壮阳，女人也可以壮阳。****如果哪个家伙说中药这个是男性荷尔蒙，这个是混蛋，破坏我们中药名声就是这种人。****这荷尔蒙本来就是在动物身上才会有，怎么会在人身上呢。**」\n\n**【极重要】中药只分阴阳（双向）**\n\n```\n中药 → 无性激素，双向（男/女都可用）\n西药激素 → 单向（有性别副作用）\n```\n\n**「这条与 n216覆盆子养阴非助阳」同一主题。**要点：**须「标」**：**「①淫羊藿≠睾酮；②性功能障碍须查睾酮/血管」** ✓✓","o":"RJ-2369 · 《人纪·神农本草经》中经第一百七十四味，讲解（PDF 第 386–387 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"黄芩的本草条目","c":"【本经原文】「**味苦，平，无毒；治诸热，黄疸，肠澼，泄利，逐水，下血闭；恶疮，疽蚀，火疡。**」【性味】「**味苦，性平，无毒。**」【主治】「**黄芩为清热要药，功能去心肺大小肠诸经之热，肝胆之火；主治黄疸，肠澼泄利，风热，湿热，天行热疾，女科养阴安胎。**」【容川】「**黄芩味苦，中多空虚，有孔道；人身惟三焦是行水气之孔道主相火，故主清相火；火逆呕苦、黄芩为正药；此药苦而色绿，故能入胆。**」【药征】「**治心下痞也，旁治胸胁满，呕吐下利也。**」【用量】「**普通钱半至三钱。**」【禁忌】「**过服损胃，血虚寒中者忌。**」\n\n**【极重要】黄芩的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦/平/无毒** |\n| **主治** | **清热/黄疸/肠澼/安胎** |\n| **禁** | **寒利/血虚寒中** |\n\n**「中多空虚」——「这是取象（三焦孔道）。」** ✓✓","o":"RJ-2370 · 《人纪·神农本草经》中经第一百七十五味「黄芩」，原文（PDF 第 387–388 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"寒利与热利","c":"讲义讲「一条极重要的鉴别」：「**老师，那你说寒利和热利我怎么去区分呢？很简单，请问你，你有大便是臭还是不臭？****『我大便没有味道啦，我吃玉米就拉玉米出来』——哦，那个寒利。****这个寒利的时候，寒就是没有消化嘛；你吃的空心菜拉空心菜出来、吃的玉米拉玉米出来。****很好，我给你黄芩，一下子就拉得更凶，为什么？因为寒对寒。****那，你说老师，热利是什么？热利是拉出来很臭，消化了但是排出来很臭、又湿又臭，有酸味的。****这个是热症，里面是热嘛，就开黄芩。**」\n\n**【极重要】寒利 vs 热利（最简判据）**\n\n```\n寒利 → 不臭 + 完谷不化（吃玉米拉玉米）→ 禁黄芩\n热利 → 臭 + 酸 + 湿 → 黄芩\n```\n\n**「完谷不化 = 寒利」——「这条与 n48下利清谷」、n105「小便黄」同一主题。** ✓✓","o":"RJ-2371 · 《人纪·神农本草经》中经第一百七十五味，讲解（PDF 第 388 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"绿色就是胆汁","c":"讲义讲「一个极精的对应」：「**这个药呢，苦，而且颜色是绿的，所以能入胆；胆汁呢，是绿色的。****所以只要你听到病人说『哎呀奇怪，倪老师，我的小孩子为什么大便出来是绿色的』——胆汁。****『唉哟，我就喂母乳，奶水出来是绿色的』——胆汁。****『啊，我呕吐，吐出来是绿色的』——胆汁。****哦，绿的就是胆汁；那我们要知道是胆的时候，我们用黄芩。**」\n\n**【极重要】绿色 = 胆汁（黄芩入胆）**\n\n```\n大便绿/奶水绿/呕吐绿 → 胆汁 → 黄芩\n```\n\n**「绿的就是胆汁」——「这是最精的一句。」**要点：**须「标」**：**「①婴儿绿便多为肠道蠕动快/铁剂，不是胆病；②呕绿须急诊（胆道/肠阻）；③奶水绿无临床意义」** ✓✓","o":"RJ-2372 · 《人纪·神农本草经》中经第一百七十五味，讲解（PDF 第 389 页）。"},{"t":"神农本草经·中经：知母（续）、贝母、白芷、淫羊藿、黄芩","h":"坐月子可去百病","c":"讲义讲「一条极重要的提醒」：「**因为女人在怀孕的时候，一人吃两个人补；所以女人在怀孕的中间，大部分出现的都是热症。****所以很多的妈妈们很好玩，她们在做小姐的时候，一年四季脚都是冰的；等到她一结了婚、一怀孕以后，身体热起来了。****很多太太们呢，在怀孕之前每个月月经都痛；等她怀完孕、生完小孩后，月经的痛就没了。****所以生小孩之前、身有百病没有关系。****如果说在生完小孩、在坐月子中间，我们好的医师在旁边给你调理的话，百病皆去。**」\n\n**【极重要】坐月子可去百病（最重要的提醒）**\n\n**须「强「标」**：**「①产后调理有益，但不能『去百病』；②产后须规范随访（抑郁/盆底/甲状腺）；③不可用此拒绝就医」** ✓✓","o":"RJ-2373 · 《人纪·神农本草经》中经第一百七十五味，讲解（PDF 第 389 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"心下痞的来路","c":"讲义讲「一条极精的病机」：「**那这个『心下痞』呢，往往是：你现在感冒了、发烧，这个微烧，本来不是很严重。****那中医看，这个病在表，脉都是浮的；按照《黄帝内经》，这个浮脉是表，那开点发表药就好了。****结果他在煮药的时候肚子饿嘛，还有点饿、还有点胃气在那边，就跑去买个便当。****那个便当是坏的、食物是坏的，一吃下去那个坏的食物造成下利。****按照我们的原则，治症的时候，病人有表证的时候我们不可以攻下的，要先解表再去攻里。****这个表邪一下陷，就变成『心下痞』。****这里会有胸胁苦满嘛，为什么？因为你本来在表，一瞬间统统跑到肋骨这边来，从太阳马上变成少阳，堵在那个胸肋之间。**」\n\n**【极重要】心下痞（表证误下）**\n\n```\n表证（该解表）\n  → 误吃坏食物下利 → 表邪内陷\n    → 心下痞（+ 胸胁苦满，太阳→少阳）\n```\n\n**「表证不可下」——「太阳一瞬变少阳」——「这两句最精。」** ✓✓","o":"RJ-2374 · 《人纪·神农本草经》中经第一百七十五味「黄芩」，讲解（PDF 第 389–390 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"黄芩的主治总结","c":"讲义讲「一条极清的总结」：「**注明一下：黄芩——去肝胆火，下热利，呕吐，心下痞，这个都是主要的治证。**」\n\n**【极重要】黄芩四大治证：去肝胆火、下热利、呕吐、心下痞**","o":"RJ-2375 · 《人纪·神农本草经》中经第一百七十五味，讲解（PDF 第 390 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"狗脊强筋骨","c":"【本经原文】「**味苦，平，无毒；治腰背强，关机缓急，周痹，寒湿膝痛，颇利老人；一名百枝。**」【性味】「**味苦甘，性微温（或作平），无毒。**」【主治】「**狗脊为益气血，强筋骨要药，功能治肝虚肾亏，脚弱腰痛，筋肉拘急，失溺淋露。**」【别录】「**疗失溺不节，男女脚弱腰痛，风邪淋露，少气，目暗，坚脊，利俯仰。**」【甄权】「**男子女人毒风软脚，肾气虚弱，续筋骨，补益男子。**」【灵胎】「**去寒湿，强筋骨。**」【用量】「**普通钱半至三四钱。**」【禁忌】「**肾虚有热，小水不利或短涩黄赤，口苦舌干，均忌。**」讲义：「**这个『关机』呢，就是，你看老人走路很慢、动作、关节很紧，都可以使用狗脊。**」\n\n**【极精】狗脊 = 老人强筋骨（补肝肾）**\n\n**「颇利老人」——「这是本草的原文定评。」** ✓✓","o":"RJ-2376 · 《人纪·神农本草经》中经第一百七十六味「狗脊」，原文及讲解（PDF 第 390–391 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"白茅根止血利水","c":"【本经原文】「**味甘，寒，无毒；治劳伤、虚羸，补中益气，除瘀血、血闭、寒热，利小便；其苗，主下水。**」【性味】「**味甘，性寒，无毒。**」【主治】「**白茅根为止血利尿要药，功能止吐血行瘀血，治消渴水肿，不伤胃气。**」【别录】「**下五淋，客热在肠胃，止渴，坚筋，妇人崩中。**」【大明】「**主妇人月经不匀，通血脉，淋沥。**」【用量】「**普通钱半至三钱。**」【禁忌】「**不宜遇铁；胃寒脾湿者忌之。**」讲义：「**如果说有一个人，他是同时身体里面有出血，同时又兼有水肿，我们就可以想到用白茅根，因为它一个药是两种功能同时具备在身上。**」\n\n**【极重要】白茅根 = 止血 + 利水（双能）**\n\n```\n出血 + 水肿（同时）→ 白茅根（一药两能）\n```\n\n**「一药双能」——「这是最精的定位。」** ✓✓","o":"RJ-2377 · 《人纪·神农本草经》中经第一百七十八味「茅根」，原文及讲解（PDF 第 392–393 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"胃寒的最简判据","c":"讲义讲「一个极简的判据」：「**所谓胃寒的人呢，很简单，胃口很小，吃一点点；鸡蛋嘛、吃个半个，饭吃几口就饱了，这种就是胃寒。****或者就不喜欢吃饭，这种都是胃寒。****寒症的时候如果你使用寒凉的药，就会寒上加寒。****但是到寒极的时候、到极限的时候又会转寒为热。**」\n\n**【极重要】胃寒 = 吃几口就饱（半个鸡蛋）**\n\n**「吃几口就饱」——「这是最精的判据。」** ✓✓","o":"RJ-2378 · 《人纪·神农本草经》中经第一百七十八味，讲解（PDF 第 393 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"肝癌栓塞的反对","c":"讲义讲「一段极敏感的反对」：「**比如说现在有一个人肝病、肝癌，西医很喜欢做栓塞。****千万不要栓塞，因为你一栓塞以后呢，等到我要把它拿掉、拿不出来啦，所以只有一次机会。****你一做栓塞以后造成身体里面会出血、瘀血，血会逆流。****那如果说你没有做栓塞，身体循环还是很好，我们只要活血化瘀，然后再一直清利你的大肠，保持你的肠胃系统很好，那你根本就不会水肿。****所以我一再跟病人说，不要去做栓塞，做完栓塞有几个人活到呢。****所以他哪天得了肝病，你不想活了、你去做栓塞，保证你活不了。**」\n\n**【极重要】肝癌栓塞 → 绝对反对**\n\n**须「绝「对「强「标」**：**「①TACE是肝癌的标准治疗（BCLC指南），可延长生存；②『保证活不了』是错的；③不可用此放弃规范治疗」** ✓✓\n\n**「这是全书最需要否定的一段。」** ✓✓","o":"RJ-2379 · 《人纪·神农本草经》中经第一百七十八味，讲解（PDF 第 392–393 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"紫苑祛痰止咳","c":"【本经原文】「**味苦，温，无毒；治咳逆上气，胸中寒热结气，去蛊毒，痿厥，安五脏。**」【性味】「**味苦辛，性温，无毒。**」【主治】「**紫苑为祛痰止咳要药，主治咳逆，痰涎，吐脓血，益肺气。**」【别录】「**疗咳唾脓血，止喘悸，五劳体虚，补不足，小儿惊痫。**」【甄权】「**治尸疰，补虚下气，劳气虚热。**」【好古】「**益肺气，主息贲。**」【用量】「**普通七分至钱半。**」【禁忌】「**肺病咳逆喘嗽，皆阴虚肺热也；忌独用多用，即用亦须与二冬百部桑皮等苦寒药参用。**」讲义：「**由于紫苑的性是温的，所以寒家的咳嗽、寒咳，我们可以加上紫苑。****那肺癌、肺结核，名称不管、病名不管，要出现肺寒证的人，咳血、咳嗽，都可以使用紫苑。**」\n\n**【极精】紫苑 = 祛痰止咳（性温 → 寒咳）**\n\n**「病名不管、只管证」——「这是最精的态度。」** ✓✓","o":"RJ-2380 · 《人纪·神农本草经》中经第一百七十九味「紫苑」，原文及讲解（PDF 第 393–394 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"紫草是痧痘要药","c":"【本经原文】「**味苦，寒，无毒；治心腹邪气，五疸，补中益气，利九窍，通水道。**」【性味】「**紫草味甘咸，性寒，无毒。**」【主治】「**紫草为痧痘要药，功能凉血，活血，透发解毒，治恶疮天花、麻疹及小儿疮疖与面皻。**」【别录】「**通水道，疗肿胀满痛，以合膏疗小儿疮及面皻。**」【用量】「**普通二钱至三钱，大剂一两。**」【禁忌】「**痘已出而红活及白陷，脾胃肠虚寒大便溏者忌服。**」讲义：「**过去我们那个紫云膏，要用紫根熬出来以后，跟那个黄蜡调在一起，变成紫云膏，可以外涂。****把那个六碗水煮成一碗、很浓嘛；把紫根拿掉，然后放黄蜡进去，融化在里面以后就变成膏状的，拿起来好像牙膏一样。**」\n\n**【极精】紫草 = 痧痘要药（紫云膏）**","o":"RJ-2381 · 《人纪·神农本草经》中经第一百八十味「紫草」，原文及讲解（PDF 第 394–395 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"不要被禁忌绑住手脚","c":"讲义讲「一条极重要的态度」：「**那这种《本草经》或者是《本草纲目》，《神农本草经》很多的药物上的禁忌，你真的临床在用的时候，当有需要的时候，用！不用管它的禁忌，不要去想那么多，不要被禁忌绑住手脚。****小孩子发烧、发疹子发得很厉害，你要用紫根、天花要用紫根；肠胃虚寒下利，那你管他的，可以加些白术啊、附子啊，把虚寒散了去掉，同时用紫根下去治病嘛。****当个医生，药是你的武器；武器是你作战用的，你不可以被你自己的武器限制住，要随时能够变通。**」\n\n**【极重要】药是武器（不可被禁忌限制）**\n\n**须「标」**：**「①禁忌是安全边界，不是可选项；②孕妇/肝肾功能差须遵禁忌；③『不管禁忌』只适合有经验的医师」** ✓✓","o":"RJ-2382 · 《人纪·神农本草经》中经第一百八十味，讲解（PDF 第 395 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"败酱草是腹膜炎专药","c":"【本经原文】「**一名鹿肠；味苦，平，无毒；治暴热，火疮赤气，疥瘙，疽，痔，马鞍热气。**」【主治】「**败酱草主治赤眼，障膜，弩肉，聤耳，痈肿结热，破凝聚血，化脓为水。**」【甄权】「**治毒风瘰痹，破多年凝血，能化脓为水，产后诸病，止腹痛。**」【大明】「**治血气心腹痛，破症结，催生落胞，赤白带下，排脓补瘘。**」【用量】「**普通一二钱。**」讲义：「**败酱草！在《神农本草经》里面讲很多败酱草其他的功能，但张仲景在其他地方都没用，用在这个腹膜炎真是药到病除。****你不要拿一个单味的败酱草给他；我们薏苡附子败酱散，还有薏苡仁、附子，败酱草只是其中一味。**」\n\n**【极重要】败酱草 = 腹膜炎专药（薏苡附子败酱散）**\n\n```\n阑尾炎/腹膜炎 → 薏苡附子败酱散\n```\n\n**须「强「标」**：**「①急性阑尾炎/腹膜炎须立即急诊手术；②不可用中药保守」** ✓✓","o":"RJ-2383 · 《人纪·神农本草经》中经第一百八十一味「败酱」，原文及讲解（PDF 第 396–397 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"阑尾点的定位","c":"讲义讲「一个极实用的压痛点」：「**这个急性盲肠炎，西医都还会误诊，他绝对不是诊断很正确；还有人刀子一开进去，以为绝对是盲肠炎，开进去的时候不是盲肠炎，很多呀。****我们不会误诊：把脚拉起来，足三里下两寸压压看，阑尾点，哇、很痛，盲肠炎，就讲完了。**」\n\n**【极精】阑尾点：足三里下 2 寸（压痛）**\n\n**须「强「标」**：**「①阑尾炎须超声/CT确诊；②压痛点不能替代影像；③延误可致穿孔腹膜炎」** ✓✓","o":"RJ-2384 · 《人纪·神农本草经》中经第一百八十一味，讲解（PDF 第 396 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"以通为补","c":"讲义讲「一条极精的观念」：「**她吃我的大黄、芒硝这种药，每天吃；她便秘很严重啊。****她连续吃三个月，下利得很严重，她一直排出来、一直排出来。****我说你会不会虚弱？她说越吃精神越好——这叫做『以通为补』。****你如果说啊，老师，这人那么虚弱，十全大补——你完啦，一下去更燥热更痛。****什么叫做治疗、治愈；你人需要以通为补。****只要三焦通利，只要身体的肠胃功能都很好，你只要让他新陈代谢非常好，他吃下去的食物都能够吸收，就是大补啦。****所以你才会有问题说：老师，为什么我开的十全大补、开的四物、开的四君子，那么补的药下去病人还是很虚弱？因为你没有补到。**」\n\n**【极重要】以通为补（三焦通利才是大补）**\n\n**「通了就是补」——「这是最精的一句。」** ✓✓\n\n**须「强「标」**：**「①大黄芒硝连服 3个月有风险（电解质/肾）；②须医师监督；③不可自行久服」** ✓✓","o":"RJ-2385 · 《人纪·神农本草经》中经第一百八十一味，讲解（PDF 第 397 页）。"},{"t":"神农本草经·中经：黄芩（续）、狗脊、茅根、紫苑、紫草、败酱","h":"败酱草的腹痛定位","c":"讲义讲「一条极精的提醒」：「**《大明》呢，你看说它能够治血气心腹痛，都是腹痛、破症结。****这个腹痛讲的就是这个地方——腹膜炎。****你不要那个女人月经痛给她败酱草，这样吃下去，老师、败酱草不能止腹痛。****她说她的月经痛，我什么时候跟你说过她月经痛用了？那为什么不用白芍？你要给她吃这个败酱草。****败酱草是肠子引起的腹痛，实际上是腹膜炎。**」\n\n**【极精】败酱草只治肠子腹痛（月经痛用白芍）**\n\n**「不要用错」——「这条与 n223疼痛定位」同一主题。** ✓✓","o":"RJ-2386 · 《人纪·神农本草经》中经第一百八十一味，讲解（PDF 第 398 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"虚痛与实痛的时间判据","c":"讲义讲「一条极重要的虚实分法」：「**任何的实痛，诸位记得。****那这个虚实怎么分辨？实，代表『有』，有东西。****有东西在里面，所以痛是实的时候，意思就是说二十四小时持续地去痛，痛不已。****虚是没有东西，就是痛痛停停、痛痛停停。****所以你问他痛：你痛多久了？『啊，我是一直在痛』——所以你已经结束了，已经是实症嘛。****你要知道是实的话，你要开去实的药进去；虚的话，你要开补虚的药去。**」\n\n**【极重要】虚痛 vs 实痛（时间判据）**\n\n```\n实痛 → 24 小时持续痛，痛不已\n虚痛 → 痛痛停停（间歇）\n```\n\n**「痛不已 = 实」——「这是最精的判据。」** ✓✓","o":"RJ-2387 · 《人纪·神农本草经》中经第一百八十一味「败酱」，讲解（PDF 第 399 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"虚痛与实痛的触诊判据","c":"讲义讲「一条极重要的触诊」：「**还有呢，触诊：摸他、压，哇！很痛很痛，那就是实嘛。****里面有东西嘛。****压，哦好爽啊，多压一下、多按摩一下，越按越舒服——虚痛。****所以，很多地方都可以辨虚实。****阴阳表里虚实寒热这几个字，是我们中医的辩证的原则、法则。**」\n\n**【极重要】虚痛 vs 实痛（触诊）**\n\n```\n拒按（压更痛）→ 实\n喜按（压舒服）→ 虚\n```\n\n**「这条与 n161喜按为虚、拒按为实」同一主题。** ✓✓","o":"RJ-2388 · 《人纪·神农本草经》中经第一百八十一味，讲解（PDF 第 399 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"白鲜皮是治黄专剂","c":"【本经原文】「**味苦寒，无毒；治头风，黄疸，咳逆淋漓，女子阴中肿痛。**」【性味】「**味苦，性寒，无毒。**」【主治】「**白鲜皮主治头风黄疸，天行时疾。**」【甄权】「**治一切热毒风，恶风，疮疥癣赤烂，眉发脱脆，皮肌急，壮热恶寒，解热黄、酒黄、急黄、谷黄、劳黄。**」【大明】「**通关节，利九窍，及血脉，通小肠水气，天行时疾，头痛眼疼。**」【用量】「**钱半至三钱。**」讲义：「**这个白鲜皮，我们在使用上是治黄。****只要看到黄疸，我们就想到白鲜皮，尤其是急性的黄疸。****什么叫急性的黄疸？上一分钟还没有，下一分钟就来了。****所以现在猛爆性肝炎、和急性肝炎，突然发起来的黄疸，马上就可以使用白鲜皮。****白鲜皮是治黄的专剂。**」\n\n**【极重要】白鲜皮 = 治黄专剂（急性黄疸）**\n\n```\n急性黄疸（猛爆性肝炎）→ 白鲜皮（苦寒）\n```","o":"RJ-2389 · 《人纪·神农本草经》中经第一百八十二味「白鲜皮」，原文及讲解（PDF 第 399–400 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"白鲜皮的配伍","c":"讲义讲「一个现成的治肝方」：「**所以诸位记住，有一个人突然发猛爆性肝炎，突然瞬间黄起来，原因可能是胆堵到了、胆结石堵到了，不管他什么样，要想到白鲜皮。****当然我们会有很多方剂加在一起，可能会有前面学过的茵陈、栀子等；大便便秘，我们加大黄。****我们白鲜皮加进去。****病人往来寒热、恶心，你就加小柴胡，诸如此类，治肝的处方已经出来了。**」\n\n**【极重要】治黄复方：白鲜皮 + 茵陈 + 栀子 + 大黄 + 小柴胡**\n\n```\n黄疸 → 白鲜皮（专）+ 茵陈/栀子（辅）\n便秘 → 加大黄\n往来寒热/恶心 → 加小柴胡\n```\n\n**须「强「标」**：**「①急性肝衰/胆道梗阻须立即急诊；②不可只用中药；③须查胆红素/凝血/影像」** ✓✓","o":"RJ-2390 · 《人纪·神农本草经》中经第一百八十二味，讲解（PDF 第 400–401 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"酸浆就是洛神","c":"【本经原文】「**味酸，平，无毒；治热，烦满，定志，益气，利水道；产难，吞其实立产；一名醋浆，又名洛神珠、灯笼草。**」【性味】「**其根及苗味苦，性寒；酸浆果味酸，性平。**」【主治】「**其苗、叶、根、茎皆为解热，排水药，治百日咳，黄疸，小便赤涩，果能催生。**」【弘景】「**酸浆捣汁服，治黄病多效。**」【用量】「**一般一钱至四钱。**」【禁忌】「**孕妇禁忌。**」讲义：「**因为一百八十三根据我的想法和考证，就是你们吃的洛神、什么洛神茶，酸酸的那个洛神果，就是它。****别名又叫洛神珠，也叫做灯笼草。****如果一个法医说吃洛神茶死掉了，这个法医应该被开除。**」\n\n**【极精】酸浆 = 洛神（烦热定志）**\n\n**「酸能收敛，能治烦热、定志益气」** ✓✓","o":"RJ-2391 · 《人纪·神农本草经》中经第一百八十三味「酸浆」，原文及讲解（PDF 第 401–402 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"紫参破血通经","c":"【本经原文】「**味苦，寒，无毒；治心腹积聚，寒热邪气；通九窍，利大小便；一名牡蒙。**」【性味】「**味苦，性寒，无毒。**」【主治】「**紫参为破血通经要药，功能治心腹寒热积聚，产后恶露不行。**」【别录】「**疗肠胃大热，唾血衄血，肠中聚血，廱肿诸疮，止渴益精。**」【甄权】「**治心腹坚胀，散瘀血，治妇人血闭不通。**」【好古】「**主狂疟温疟，鼽血，汗出，治血痢。**」【用量】「**普通一钱至三钱。**」【禁忌】「**畏辛夷。**」讲义：「**紫参呢由于它性是寒凉的性，它不是温热的性；所以说当你使用紫参的时候，要考虑到，病人如果是热症，紫参是完全对症的；病人如果是寒症，紫参不对症。**」\n\n**【极精】紫参 = 破血通经（热症）**\n\n**「知道药性寒热的目的，只此而已」** ✓✓","o":"RJ-2392 · 《人纪·神农本草经》中经第一百八十四味「紫参」，原文及讲解（PDF 第 402–403 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"槀本祛风镇痛","c":"【本经原文】「**一名地新；味辛，温，无毒；治妇人疝瘕，阴中寒肿痛，腹中急，除风头痛，长肌肤，悦颜色；名鬼卿。**」【性味】「**味苦辛，性温。**」【主治】「**鬼卿为祛风寒镇痛要药，治大寒犯脑头痛齿亦痛，女人阴寒肿痛，体肤风湿。**」【元素】「**治太阳头痛，巅顶痛，大寒犯脑，痛连齿颊。**」【大明】「**治皮肤疵皯，酒皻，粉刺，癫疾。**」【用量】「**普通一钱至三钱。**」【禁忌】「**热病头痛，血虚头痛，均忌服。**」【附方】「**头屑干洗——槀本，白芷等份共末，夜擦旦梳，垢自去。**」讲义：「**它主要的功能呢，因为它是苦味的、辛味的，所以苦味能够泄、辛味能够散，所以能够驱风、祛风寒，能够镇痛。**」\n\n**【极精】槀本 = 祛风镇痛（巅顶痛/美容）**\n\n**「大寒犯脑」——「这是最精的定位（巅顶痛连齿）。」** ✓✓","o":"RJ-2393 · 《人纪·神农本草经》中经第一百八十五味「槀本」，原文及讲解（PDF 第 403–404 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"石苇利尿治淋","c":"【本经原文】「**味苦，平，无毒；治劳热邪气，五癃，闭不通，利小便水道。**」【性味】「**味甘（或作苦），性寒（或作平），无毒。**」【主治】「**石苇为利尿治淋要药，主清肺火以滋源，通膀胱以利水，益精气，治淋闭。**」【别录】「**止烦下气，通膀胱满，补五劳，安五脏，去恶风，益精。**」【日华】「**治淋沥遗溺。**」【用量】「**普通一至二钱。**」讲义：「**石苇这个药呢，主要我们是用在利尿，治淋病的时候。****小便有问题的时候，也是专门用在热症。****所以石苇是凉性的药。**」\n\n**【极精】石苇 = 利尿治淋（热症）**\n\n**「清肺火以滋源」——「这是提壶揭盖的思路。」** ✓✓","o":"RJ-2394 · 《人纪·神农本草经》中经第一百八十六味「石苇」，原文及讲解（PDF 第 404 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"萆薢补肝虚固下焦","c":"【本经原文】「**味苦，平，无毒；治腰背痛，强骨节，风寒湿周痹，恶疮不瘳，热气。**」【性味】「**甘苦性平，功能除浊分清。**」【主治】「**入足阳明厥阴，祛风去湿，以固下焦，补肝虚，坚筋骨，益睛明目；恶疮梅毒及淋浊。**」【别录】「**阴痿失溺，老人五缓，关节老血。**」【甄权】「**冷气节痹，腰脚瘫缓不遂，手足惊挚，男子腰痛，久冷，膀胱宿水。**」【用量】「**一般用四至五钱，大剂量用一两。**」讲义：「**这个药呢，最主要的功能，补肝虚、强固下焦；所以它是一个滋补的药，味苦，苦能坚嘛。**」\n\n**【极精】萆薢 = 补肝虚固下焦（梅毒/淋浊）**\n\n**「老人五缓」——「五缓是形容词，代表动作都缓慢下来」** ✓✓","o":"RJ-2395 · 《人纪·神农本草经》中经第一百八十七味「萆薢」，原文及讲解（PDF 第 404–405 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"金石药与草木药","c":"讲义讲「一条极精的比较」：「**象我们有很多补肾的，巴戟天、肉苁蓉啊这种都可以治腰脚无力的，但是跟硫磺比起来的话，那硫磺一钱下去，等于你吃十根肉苁蓉、很好，那一斤、两斤的巴戟天，可能硫磺一钱。****我们的草木类的药，跟金石类的药比起来，金石类非常彪悍吶。****所以中国过去的道家为什么去炼丹？他炼丹都会用金石类的药。****他们的观念是这样子：你如果是吃金石类的东西，你的寿命，就比如你吃黄金，寿命就像黄金，黄金几千年不会坏掉。****你如果吃草木类的药，则灌木乔木一生上百年，所以你可以活百岁嘛。**」\n\n**【极重要】金石药 vs 草木药（炼丹之理）**\n\n```\n金石（硫磺/黄金）→ 千年不坏 → 寿命如石\n草木（巴戟/苁蓉）→ 百年树 → 寿命百岁\n```\n\n**「金石非常彪悍」——「这是最精的比较。」** ✓✓","o":"RJ-2396 · 《人纪·神农本草经》中经第一百八十七味，讲解（PDF 第 405–406 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"白薇凉血退热","c":"【本经原文】「**味苦，平，无毒；治暴中风，身热，肢满，忽忽不知人；狂惑，邪气，寒热，酸疼，温疟洒洒、发作有时。**」【性味】「**味苦咸，性平，无毒；阳明冲任之药。**」【主治】「**白薇为凉血退热要药，功能清虚火，除胃热，主治身热肢满，风温灼热，汗出热不退，妇人身热，伤中淋露。**」【别录】「**疗伤中淋露，下水气，利阴气，益精。**」【用量】「**普通一钱至二钱。**」讲义：「**这个白薇呢，它本身是凉血能够退热的药。****当你血太热的时候，血会往上一直冲，冲到脸上整个红了，中医叫血热。**」\n\n**【极精】白薇 = 凉血退热（血热面红）**\n\n**须「标」**：**「①面红血压高须降压药；②不可只用白薇；③急性脑血管病须急诊」** ✓✓","o":"RJ-2397 · 《人纪·神农本草经》中经第一百八十八味「白薇」，原文及讲解（PDF 第 406–407 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"白薇是冲任之药","c":"讲义讲「一个极罕见的标注」：「**性味是苦咸；苦味的药能够泻、能够坚，咸味的药能够攻、能够软坚。****性平无毒，阳明、冲脉、任脉的药。****诸位很少看到这个——他会写这个是哪条经。****这里特别注明了：冲、任的药物。**」\n\n**【极精】白薇 = 冲任之药（罕见标注）**\n\n**「本草中罕见标经络」——「这是文献学的价值。」** ✓✓","o":"RJ-2398 · 《人纪·神农本草经》中经第一百八十八味，讲解（PDF 第 407 页）。"},{"t":"神农本草经·中经：白鲜皮、酸浆、紫参、槀本、石苇、萆薢、白薇、水萍","h":"水萍即浮萍","c":"【本经原文】「**味辛，寒，无毒；治暴热身痒，下水气，胜酒，长须发，止消渴；久服轻身；一名水花或浮萍。**」【产地】「**处处有之，浮生于河泽水面；无根，叶大而面青背紫者谓之浮萍。**」【主治】「**水萍为解热，发汗，利水，祛湿药；能消皮肤肿痒，治水肿，风疹，丹毒，小便不利，目赤翳膜，外治敷疮肿。**」【别录】「**主风湿，麻痹，脚气，打扑损伤，目赤翳膜，口舌生疮，衄血。**」【藏器】「**捣汁服，主水肿，利小便。**」【大明】「**治热毒，风热，热狂，熁肿毒，汤火伤，风疹。**」【元素】「**下气，以沐浴生毛发。**」【灵胎】「**其性清浮，治在肌表。**」\n\n**【极精】水萍（浮萍）= 发汗利水祛湿（治在肌表）**\n\n**「无根浮水面」——「这是取象（其性清浮，治在肌表）。」** ✓✓","o":"RJ-2399 · 《人纪·神农本草经》中经第一百八十九味「水萍」，原文（PDF 第 407–408 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"浮萍是风疹专药","c":"讲义讲「一个极精的取象」：「**我们治疗一个病，风疹，最好用浮萍。****你说那老师为什么风疹最好用浮萍？用中药呢，一再强调要以意得。****这个风疹呢没有受到风是不发，隐藏在那里；一喝酒出来、风一吹到马上发风疹，或吃了螃蟹、吃了虾子马上肿就起来。****平常都看不到呢？怎么一发就发起来呢？这就是风疹。****浮萍呢还是一样，风一吹它到处跑啊。**」\n\n**【极精】浮萍 = 风疹专药（以意得）**\n\n```\n风疹（风一吹就发）→ 浮萍（风一吹就到处跑）\n```\n\n**「以意得」——「这是本草方法论的活例。」** ✓✓","o":"RJ-2400 · 《人纪·神农本草经》中经第一百八十九味「水萍」，讲解（PDF 第 408–409 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"浮萍质轻只需一钱","c":"讲义讲「一个剂量提醒」：「**这个药本身的质很轻，你开浮萍、开一钱就一大堆了，你不用开到很重，开到五六钱这就一大包。****那这个浮萍呢也可以作发汗的药，但这个浮萍的发汗跟麻黄桂枝的发汗，那真是小巫见大巫。****所以你要取它微汗、一点点汗的时候可以用浮萍。**」\n\n**【极精】浮萍质轻（一钱即一堆）**\n\n**「这条与 n224一斤棉花 vs 一斤铁」同一主题。** ✓✓","o":"RJ-2401 · 《人纪·神农本草经》中经第一百八十九味，讲解（PDF 第 409 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"鲜血与黑血的分别","c":"讲义讲「一条极重要的鉴别」：「**我们大便带血先不要紧张，你要先问他：请问你是看到黑血还是鲜血？****鲜血都没有事。****鲜血是近血，所谓近血就是靠近肛门的血呀。****『我的大便是黑的』，一冲的时候看到暗红的血——这是远血。****远血就可能来自胃呀、胃里面的出血。****所以胃溃疡、胃癌里面出血大便是黑的。**」\n\n**【极重要】便血：鲜血（近血）vs 黑血（远血）**\n\n```\n鲜血 → 近血（肛门/大肠）→ 多良性\n黑血 → 远血（胃/上消化道）→ 须查胃镜\n```\n\n**「近血 vs 远血」——「这是最精的鉴别。」** ✓✓\n\n**须「强「标」**：**「①黑便须立即查胃镜/粪隐血；②鲜血也须查肠镜（排结直肠）；③不可因『鲜血没事』而延误」** ✓✓","o":"RJ-2402 · 《人纪·神农本草经》中经第一百九十一味「地榆」，讲解（PDF 第 411–412 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"内痔外痔与大肠炎","c":"讲义讲「一个极精的分型」：「**这个内痔、外痔嘛，或者大肠炎。****外痔就是大便都很好，肛门外面胀的很痛呀，都没有血；结束的时候一擦纸巾上有血，这是外痔。****内痔不是呀，内痔是先血后便，哇——先排一大堆血出来，最后才排大便出来，这是内痔。****大肠炎呢、colitis，血跟大便是混在一起的，那一天下利三、四十次呀，这个没事就在跑厕所——大肠炎。**」\n\n**【极重要】下消化道出血三型**\n\n| 型 | 特征 |\n|---|---|\n| **外痔** | 便好、肛外胀痛、擦纸有血 |\n| **内痔** | **先血后便**（先喷血再排便） |\n| **大肠炎** | **血便混合** + 一天 30–40 次 |\n\n**「先血后便 = 内痔」——「这是最精的判据。」** ✓✓","o":"RJ-2403 · 《人纪·神农本草经》中经第一百九十一味，讲解（PDF 第 412 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"地榆是止血收敛药","c":"【本经原文】「**味苦，微寒，无毒；治妇人乳痉痛、七伤、带下十二病，止痛，除恶肉，止汗气；消酒，明目，治金疮。**」【性味】「**味苦（或作苦甘酸），性微寒，无毒。**」【主治】「**地榆为止血收敛要药，功能止吐血下血久痢，妇人崩带。**」【别录】「**止脓血诸瘘恶疮热疮，补绝伤，产后内塞，可作金疮膏，消酒除渴，明目。**」【大明】「**止吐血鼻衄，伤风，月经不止，血崩，产前后诸血疾，并水泻。**」【用量】「**普通二钱至三至四钱。**」【禁忌】「**性寒下行，脾胃虚寒作泄、白痢久而胃弱、胎产虚寒泄泻、血崩脾虚作泄，均忌。**」讲义：「**地榆这个药呢，主要的使用时机是我们用来止血、收敛。**」\n\n**【极精】地榆 = 止血收敛（肠胃/肛门/吐血）**\n\n**「前面介绍的阿胶，它也有止血的效果；但阿胶比较偏重于这个女人的月经，地榆呢比较偏重于肠胃、大肠、肛门这边」** ✓✓","o":"RJ-2404 · 《人纪·神农本草经》中经第一百九十一味「地榆」，原文及讲解（PDF 第 411–413 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"地榆首尾之别","c":"【容川】「**地榆首之气味厚，故行血更有力；尾之药味薄，故行血之力轻。**」讲义：「**所以地榆首跟地榆尾稍微一点不同。****你去写个地榆头，药房不会抓给你的，你就写地榆好了。**」\n\n**【极精】地榆首行血有力、尾力轻**\n\n**「这条与 n222当归头生血、尾行血」同一体系。** ✓✓","o":"RJ-2405 · 《人纪·神农本草经》中经第一百九十一味，原文引唐容川及讲解（PDF 第 413 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"海藻是长寿的零食","c":"讲义讲「一个极精的定名」：「**这个大脖子，东南沿海的人吃海藻；西南一带因为离海远没有吃海藻，就成大脖子。****所以中医我们几千年前就讲海藻。****这个味咸性寒，过去呢，我们海藻可以用一句话来讲，叫做：长寿的零食。****你常常吃零食很多，什么最好——海藻。****在邻海边的渔村里面，渔村海边都是沙很多嘛，青菜种不了呀，就是吃海鲜、海产品。****那长寿的人很多。****不要说没有人得甲状腺的问题，长寿、100 多岁呀，他一生没有吃过什么小白菜、青杠菜、高丽菜，他就吃海藻。**」\n\n**【极重要】海藻 = 长寿的零食（碘与甲状腺肿）**\n\n```\n缺碘（离海远）→ 大脖子（甲状腺肿）\n常吃海藻（沿海）→ 长寿无甲状腺病\n```\n\n**「这是全书最精的食疗定名。」** ✓✓\n\n**须「标」**：**「①甲状腺病须查甲功/超声；②海藻碘含量高，甲亢须限碘；③不可以食疗替代药物」** ✓✓","o":"RJ-2406 · 《人纪·神农本草经》中经第一百九十二味「海藻」，讲解（PDF 第 414–415 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"海藻咸能软坚","c":"【本经原文】「**味苦，寒，无毒；治瘿瘤气，颈下核，破散结气，痈肿，症瘕，坚气，腹中上下鸣，下十二水肿。**」【性味】「**味咸，性寒，无毒。**」【主治】「**海藻为除热软坚要药，主瘿瘤瘰疬，治瘫肿老痰，通血脉，利小便。**」【别录】「**疗皮间积聚，暴溃瘤气，结热，利小便。**」【甄权】「**辟百邪鬼魅，治气急心下满，疝气下坠，疼痛卵肿。**」【用量】「**普通一钱至三钱。**」【禁忌】「**脾家有湿者忌。**」讲义：「**海藻本身是味咸，咸能软坚；所以说，你如果说是甲状腺、淋巴腺、腋下的淋巴结、耳朵下面的淋巴结，或者鼠蹊部的淋巴结，不单单是甲状腺你可以使用，淋巴癌、淋巴肿瘤你都可以使用海藻。**」\n\n**【极重要】海藻 = 咸能软坚（甲状腺/淋巴结）**\n\n**须「强「标」**：**「①甲状腺结节/淋巴结须超声 + 穿刺；②『咸能软坚』不能替代治疗；③甲亢禁大量碘」** ✓✓","o":"RJ-2407 · 《人纪·神农本草经》中经第一百九十二味，原文及讲解（PDF 第 414–416 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"月经就是奶水就是海潮","c":"讲义讲「一条极精的类比」：「**中医的观念里面认为说：月经呢，为什么叫月？就是天上的月亮；大自然界海有潮汐，每一个月涨潮一次、退潮一次。****每个月涨潮的那几天，就是女人月经来的时候。****所以女人的月经就如同自然界的海水的海潮是相等相通的。****海潮来的时候呢，海水是咸味的；女人月经是咸味的，男人的精也是咸味的。****这个海藻呢就是咸味的东西，所以咸味的对咸味的，它能够直接入到子宫卵巢里面去。**」\n\n**【极精】月经 = 奶水 = 海潮（咸味）**\n\n```\n月（月亮/潮汐）→ 月经\n咸味（海藻）→ 直入子宫卵巢\n```\n\n**「月经就是奶水」——「这条与 n221陈旧奶水」同一体系。** ✓✓\n\n**「海潮与月经相通」——「这是最精的类比。」** ✓✓","o":"RJ-2408 · 《人纪·神农本草经》中经第一百九十二味，讲解（PDF 第 416 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"海藻吃瘦的逻辑","c":"讲义讲「一个极精的逻辑」：「**那我们的一个案例，那个太太坐在麻将桌上打麻将，常年喜欢打麻将嘛，连打三天三夜，打得眼睛也突出来了。****因为看起来像甲状腺亢进，眼睛肿大。****结果吃了以后，她身材回到做小姐的时候身材，少了七公斤多、十五六磅。****如果说甲状腺腺体的功能很好的时候，你不需要什么运动，坐在那边打麻将都会瘦。****而只是一个软坚的药、消积的药在里面，她整个人瘦掉，大便都恢复正常。**」\n\n**【极精】软坚消积 → 人自然瘦**\n\n```\n咸味软坚 → 消积（消除累积）→ 瘦\n```\n\n**须「标」**：**「①减重须饮食 + 运动；②『吃海藻就会瘦』无普适证据；③甲亢须规范治疗」** ✓✓","o":"RJ-2409 · 《人纪·神农本草经》中经第一百九十二味，讲解（PDF 第 416–417 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"王瓜根治淤血闭经","c":"【本经原文】「**味苦，寒，无毒；治消渴，内痹，瘀血，月闭，寒热，酸疼；益气，愈聋；一名土瓜。**」【性味】「**味苦，性寒，无毒（或作小毒）。**」【主治】「**王瓜根主泻热，利水，行血，益气，治天行热疾，消渴，痞满，热结，黄疸变黑，妇女经闭。**」【别录】「**疗诸邪气，热结鼠瘘，散痈肿流血，妇人带下，下乳汁不通，止小便数不禁，逐四肢骨节中水。**」【大明】「**天行热疾，酒黄病，壮热心烦闷，热劳，排脓，消扑损瘀血，破症癖，落胎。**」【用量】「**普通一至二钱。**」【禁忌】「**能使人吐下，不宜多服。**」讲义：「**这个土瓜呢，专门使用在闭经。****我们取它的根，而不是拿它的瓜。****这个土瓜根呢，专门治泻热、利水、行血益气。****那临床上使用，你看『疗诸邪气』，看那个【别录】，中间那边他说：妇人带下、下乳汁不通。****你月经没有了、奶水下不来了，你土瓜根一下去，把那个瘀血一散掉，奶水跟着就往下走了，月经就来了。**」\n\n**【极精】王瓜根（土瓜根）= 淤血闭经**\n\n**「月经就是奶水」——「本草原文从『带下、下乳汁不通』可反证。」** ✓✓","o":"RJ-2410 · 《人纪·神农本草经》中经第一百九十味「王瓜」，原文及讲解（PDF 第 410–411 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"更年期月闭是正常","c":"讲义讲「一条极重要的提醒」：「**那你已经更年期 50 岁了，你一直给她吃土瓜根、想办法让月经来，那不对的。****人家七七四十九、妇女天癸竭，月经要停止，这个时候月闭是正常的。****慢慢慢慢停下来，可能月经不规则，三个月四个月来一次、然后半年来一次、一年来一次，慢慢停掉了、闭掉了。****那女人没有月经的时候，你还认为她月闭症、给她吃土瓜根，这是个白目
