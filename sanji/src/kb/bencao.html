 性 |\n|---|---|---|\n| **甘草** | **中实** | **补脾阴/益胃阳** |\n| **黄耆** | **中空** | **气分/走而不守** |\n\n**「中空走而不守，中实守而不走」——「这条与 n182中空发表、内实攻里」有对应。**要点：**这一条极精，它是「形态定性」** ✓✓","o":"RJ-1912 · 《人纪·神农本草经》上经第二十三味，原文引唐容川（PDF 第 118 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"甘草不能用在急攻","c":"讲义讲「一个极重要的禁忌」：「**甘草本身缓和、药性太缓，我们要赶快把水排掉，就你在那边用甘草、说慢一点。****比如说我们有十枣汤，这个甘遂、芫花、大戟很凶啊；我们希望他一下吃一剂下去、三个小时统统结束了，吐泻统统完了。****『老师我放甘草』，你岳母吐泻六个小时，她一定会把你做掉！****张仲景就很聪明啊：既然我们要竣下、要汗吐下，又吐又下、快一点要他结束，就不用、不会用甘草。**」\n\n**【极重要】甘草不能用在急攻**\n\n```\n十枣汤（甘遂/芫花/大戟）\n  → 须快（3 小时结束）\n  → 去甘草（慢则 6 小时）\n```\n\n**「紧急的时候还要甘草咧？甘草不要用了」——「这是最精的缓峻之分。」**要点：**这一条极重要，它与 n190、n193「排腹水忌甘草」形成同一体** ✓✓","o":"RJ-1913 · 《人纪·神农本草经》上经第二十三味「甘草」，讲解（PDF 第 119 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"桔梗甘草汤","c":"讲义讲「一个极具体的方」：「**我们在经方里面使用的时候，我们有一个汤药，桔梗甘草汤，专门治疗吐脓的、脓稠。****吃了桔梗甘草汤下去，把肺里面的脓疡吐掉了。****很多肺癌啦、讲白了就是肺癌，里面在吐血的时候，我们用甘草下——桔梗甘草，一吐血出来啊；本来是吐的白沫，吐吐就吐血出来，慢慢慢慢的肺的容积会回来。**」\n\n**【极重要】桔梗甘草汤**\n\n```\n桔梗 + 甘草 → 排肺脓\n```\n\n**「桔梗甘草汤专门治吐脓」——「须强标：不能替代肺癌治疗。」**要点：**须「强「标」**：**「①肺癌须规范治疗（手术/化疗/靶向/免疫/放疗）；②咯血须立即就诊（查支气管镜/CT）；③桔梗甘草汤只是辅助排痰」** ✓✓","o":"RJ-1914 · 《人纪·神农本草经》上经第二十三味，讲解（PDF 第 119–120 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"久咳必有瘀","c":"讲义讲「一个极重要的机制」：「**因为你在咳嗽咳很久的样子，不管你是用什么咳嗽，咳久的时候肺的气管会破裂，因为有淤血在里面。****所以我们开处方的时候，除了开去痰的药、止咳的药、去血的药，同时还要开活血化淤的药在里面。****不然的话，淤血在里面、还是在造成肺里面的障碍，肺的容积还是没有办法回来，病人还是会短气、还是会咳嗽。**」\n\n**【极重要】久咳必有瘀**\n\n```\n久咳 → 气管破裂 → 淤血\n  → 去痰 + 止咳 + 活血化瘀\n```\n\n**「咳久了会有淤血，还要开活血化瘀的药」——「这是最精的久咳病理。」**要点：**这一条极重要，它与 n43「痰饮」、n94「咳论」同一体** ✓✓","o":"RJ-1915 · 《人纪·神农本草经》上经第二十三味，讲解（PDF 第 120 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"生半夏就是婆婆药","c":"讲义讲「一个极生动的例子」：「**比如说我们这个半夏是毒的，靠甘草也可以解，但是生姜解半夏的毒更快，几乎是放在嘴巴里边、声音就回来了。****生半夏有个外号叫婆婆药——就是你是媳妇，每天有婆婆在盯你、很讨厌，唠唠叨叨讲话讲不完；你放点生半夏在菜里边，给她一吃声音就没了、喉咙哑掉了。****当你要声音恢复的时候，切一片生姜放到嘴巴里面，她一含声音就回来了，解毒就这么快。**」\n\n**【极精】生半夏 = 婆婆药**\n\n```\n生半夏 → 失声\n生姜   → 立解\n```\n\n**「一吃声音就没了，含姜声音就回来」——「须强标：绝不可用于他人。」**要点：**须「强「标」**：**「①生半夏有毒（黏膜刺激/失声/水肿）；②绝不可用于他人（涉嫌伤害）；③须炮制（法半夏/姜半夏）；④生姜解半夏毒是经典，但不可故意试毒」** ✓✓","o":"RJ-1916 · 《人纪·神农本草经》上经第二十三味，讲解（PDF 第 120 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"金石中毒四症","c":"讲义讲「一个极具体的中毒表现」：「**吴克潜过去用甘草来解金石类——过食云石、吃的硫黄吃太多了、吃这个白石英、紫石英太多了、在家里偷吃空青、想练丹，吃的太过了、中毒了。****中毒的症状，大部分都是皮肤痒、看上去起很多红疹，舌头麻、头皮发麻。****这个时候甘草就解金石类的毒，效果最好。**」\n\n**【极精】金石中毒四症**\n\n| 症 | 判 |\n|---|---|\n| **皮肤痒** | + |\n| **红疹** | + |\n| **舌头麻** | + |\n| **头皮发麻** | + |\n\n**「皮肤痒、红疹、舌麻、头皮麻」——「须强标：这是神经受累的红旗。」**要点：**须「强「标」**：**「①金石/重金属中毒须立即就诊（洗胃/螯合/透析）；②甘草不能代替急救；③舌麻 + 头皮麻是神经系统受累」** ✓✓","o":"RJ-1917 · 《人纪·神农本草经》上经第二十三味，讲解（PDF 第 120 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"生甘草与炙甘草","c":"讲义讲「一个极重要的炮制区分」：「**生用，它的气是取它的气是平的、比较平缓、比较温和；炙用的时候，唐容川认为说是取其益胃、使胃气上升，像炙甘草汤。****甘草，我们用蜂蜜来炙；简单说是用蜂蜜来炒过、炒得红红的。****炒过以后，味很厚；旁边围绕的、等于是像焦糖一样；糖它是烧焦的味道的，这个焦是入火、入心火。****所以唐容川讲的炙甘草汤，在经方里面是脉结代、心动悸，炙甘草汤主之。**」\n\n**【极重要】生甘草 vs 炙甘草**\n\n| 形 | 性 | 用 |\n|---|---|---|\n| **生** | **气平/温和** | **解毒/泻火** |\n| **炙** | **蜜炙（焦糖入心）** | **益胃/强心/脉结代** |\n\n**「蜂蜜炒得红红的，焦味入心火」——「这是最精的炮制逻辑。」**要点：**这一条极重要，它是「炮制改性」** ✓✓","o":"RJ-1918 · 《人纪·神农本草经》上经第二十三味，讲解（PDF 第 121 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"生解毒，炙强心","c":"讲义讲「一个极清的用法分界」：「**解毒的时候我们要用生甘草，你不要去用炙甘草去解毒。****生用甘草取它的性比较平，我们不需要那么强烈的、我们需要温和的时候，一般用生甘草就可以了。****去治疗心率不整、动悸、跳动很快的时候，非要炙甘草不行，生的甘草不堪用的。****一般来说我们会用炙过的、大部分都是治疗心脏的时候；病人呈现虚寒的症状的时候，我们都会用炙甘草。**」\n\n**【极精】生解毒，炙强心**\n\n```\n解毒/泻火/温和 → 生甘草\n心率不整/动悸/虚寒 → 炙甘草\n```\n\n**「解毒用生，强心用炙」——「这是最清晰的二分法。」**要点：**这一条极精，它是「生炙不可互换」** ✓✓\n\n**极精！！\"炙「甘草汤治脉结代」（「跳二下停一下）\"** ✅✓\n- **\"所以动悸的时候，就是心脏跳动的很快、无法制止、跳的很快；还有跳跳停停的脉——跳二下停一下、跳三下停一下，用炙甘草汤治\"** ✓✓\n- **\"一共九味药在里面，当然他是重用炙甘草\"** ✓✓\n\n**须「强「标」**：**「脉结代（早搏/房颤/传导阻滞）须做心电图 + 动态心电；不可只用炙甘草汤」** ✓✓","o":"RJ-1919 · 《人纪·神农本草经》上经第二十三味，讲解（PDF 第 121 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"甘草治急迫","c":"讲义讲「一个极精的主治」：「**甘草，主治急迫；《药征》就是日本的东洞吉益，这个是日本的经方家。****里急的急痛的时候，甘草可以缓；甘味性缓，这个用途它可以止痛、缓。****如果一个人常常筋在里面抽痛、我们筋在抽的时候、筋在拘急的时候，是『急食甘以缓之』。****急食甘、甘就甘草，甜可以缓它；同时甘草它的缓的功能可以止痛。**」\n\n**【极精】甘草治急迫**\n\n```\n筋抽/里急急痛\n  → 甘缓 → 止痛\n```\n\n**「急食甘以缓之」——「这条与 n78甘缓」完全一致。**要点：**这一条极精，它是「主治急迫（古义）」** ✓✓","o":"RJ-1920 · 《人纪·神农本草经》上经第二十三味，讲解（PDF 第 121–122 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"甘草四禁","c":"讲义讲「一个极清的禁忌表」：「**中满呕家——呕吐的人，还有喝酒——酒家喝……就是喝酒的酒客；还有肿满、肚子胀满的人、湿很重的，中湿肿满的我们不用甘草。****就是我刚刚讲：我们在排水、急着要攻水把水排出来，这时候你把甘草也放下去，让他排不出来、缓水。**」\n\n**【极精】甘草四禁**\n\n| 禁 | 因 |\n|---|---|\n| **中满** | **守而不走** |\n| **呕家** | **甘缓留邪** |\n| **酒家** | **湿热** |\n| **湿肿胀满** | **不利排水** |\n\n**「中满、呕家、酒家、湿肿，都不用甘草」——「这是最清的禁忌表。」**要点：**这一条极精，它与 n185「五病所禁」同一体** ✓✓\n\n**极精！！\"六「一散（滑石6:甘草1）\"** ✅✓\n- **\"温病、南派的六一散，六一散就是滑石用六、甘草用一；诸位一看就知道，这一定是湿热的、不是很严重的积水\"** ✓✓","o":"RJ-1921 · 《人纪·神农本草经》上经第二十三味，讲解（PDF 第 122 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"干地黄的本草条目","c":"【本经原文】「**味甘寒，主折跌绝筋，伤中逐血痹，填骨髓长肌肉，作汤除寒热积聚，除痹；生者尤良，久服轻身不老，一名地髓。**」【产地】「**产陕西河南者良，生川泽黄土之地。**」【性味】「**味甘性寒无毒。**」【主治】「**干地黄为滋阴养血要药，功能凉血热，滋肝肾，养心益肺，通血脉逐血痹。**」【别录】「**主男子五劳七伤，女子伤中胞露下血，破恶血溺血，利大小肠，去胃中宿食。**」【元素】「**凉血生血，补肾水真阴，除皮肤燥，去诸湿热。**」【好古】「**主心病掌中热痛，脾气痿蹶，嗜卧，足下热而痛。**」【灵胎】「**熟地补血，生地凉血。**」【用量】「**普通二钱至四钱，大剂二三两。**」【禁忌】「**凡病人脾胃弱、大便泄、产后不食或泻，及胸膈多痰、气道不利者均忌；忌铜铁及茶，得清酒麦冬良。**」\n\n**【极重要】干地黄的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/寒/无毒** |\n| **主治** | **滋阴养血/凉血热/滋肝肾** |\n| **禁** | **脾胃弱/便泄/产后不食/多痰** |\n\n**「生者尤良」——「地黄生用优于制用」** ✓✓","o":"RJ-1922 · 《人纪·神农本草经》上经第二十四味「干地黄」，原文（PDF 第 122–123 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"地黄原来是黄色","c":"讲义讲「一个极精的纠正」：「**一般来说，大家看到生地、熟地，一看那个黑的，以为它入肾。****实际上，地黄是黄色的；原地黄，为什么叫黄？因为是黄色的。****它炮制过以后才会变成黑色；炮制过、蒸、九蒸九晒过了以后变成黑色。****所以它原来，因为它味道是甘、它性是寒，甘味的入脾脏。**」\n\n**【极精】地黄原是黄色**\n\n```\n生地（黄，甘寒）→ 九蒸九晒 → 熟地（黑，温）\n  入脾              →        入肾\n```\n\n**「地黄本来是黄的，蒸黑了才入肾」——「这条与 n181炮制改性」完全一致。**要点：**这一条极精，它是「颜色的来源」** ✓✓","o":"RJ-1923 · 《人纪·神农本草经》上经第二十四味，讲解（PDF 第 123 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"地黄其实滋脾阴","c":"原文【容川】「**产中州，得土深水厚之性，内含润泽之湿也；原色为黄，制后为黑。****故人知地黄之能滋肾阴，不知地黄实滋脾阴。****内经云脾为阴中之至阴；地黄以湿归脾，脾阴足，则肝肾自受其灌溉。****其不辛温，故能益水液、滋血之源，而不能变化、以成血色；以水配火，不使壮火食气，如此气纳矣。**」\n\n**【极重要】地黄其实滋脾阴**\n\n```\n地黄 → 滋脾阴 → 脾阴足\n  → 肝肾自受灌溉（间接）\n```\n\n**「大家都以为滋肾，其实是滋脾阴」——「这是最精的间接滋养。」**要点：**这一条极重要，它与 n183「甘味入脾」、n59「九维五行表」同一体** ✓✓","o":"RJ-1924 · 《人纪·神农本草经》上经第二十四味，原文引唐容川（PDF 第 122 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"男熟女生","c":"讲义讲「一个极精的分用」：「**男人跟女人，一般我们的观念是这样的：女人，我们大部分选用生地；男人，我们大部分是熟地。****这个生地，就是新鲜的生地；男人去选用熟地、炮制过的这个生地就是熟地。****因为炮制过以后性就比较温了、颜色是比较黑的；就是补脾胃以外，它能补肾、就是顾到精。****女人不需要补精，用生地就可以了；生地能够补血凉血。**」\n\n**【极精】男熟女生**\n\n| 性 | 药 | 理 |\n|---|---|---|\n| **男** | **熟地** | **补肾精** |\n| **女** | **生地** | **补血凉血** |\n\n**「男用熟地补肾精，女用生地补血凉血」——「这是最简的性别分用。」**要点：**须「标」**：**「『男熟女生』是经验用法；现代用药应按辨证（阴虚/血虚/湿热）而非性别」** ✓✓\n\n**极精！！\"怀「孕时身体热→用生地\"** ✅✓\n- **\"在胎产中间——为什么在怀孕的时候身体会比较热？因为小 baby 在妈妈肚子里面，胎粪都还在里面……身体里面有毒，这种带里面都是毒，毒都会产生热\"** ✓✓\n- **\"这个热你不能用熟地，大部分我们用生地；生地补脾胃、同时还能凉血，能够有些胎毒毒素在血里面、能够凉血\"** ✓✓\n\n**须「标」**：**「『胎毒→孕热』是中医概念；孕期用药须严格遵医嘱」** ✓✓","o":"RJ-1925 · 《人纪·神农本草经》上经第二十四味，讲解（PDF 第 123 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"阴虚才用生地","c":"讲义讲「一个极精的适应证」：「**我们常常用生地的时候，是用在滋阴的。****什么时候会需要去滋阴？因为病人呈现出来阴虚的症状。****『那老师阴虚是什么症状？』『阴虚就是阳症、阳会上亢的都是阳症——比如说这个人红光满面，但是人身体没有力，而是红光满面』。****因为呈现的都是热证，实际上都是阴虚；就是因为阴虚才没有办法把阳固守住，所以阳出来、看到的都是阳症。**」\n\n**「阴虚就是阳证：红光满面但无力」——「这条与 n191阴虚见阳证」完全一致。** ✓✓","o":"RJ-1926 · 《人纪·神农本草经》上经第二十四味，讲解（PDF 第 124 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"肾热外泄与脚的温度","c":"讲义讲「一个极重要的体征」：「**【好古】说，主心病掌中热痛，这个足下热而痛——这就是肾热哦。****我们正常人，我在介绍《黄帝内经》的时候我都跟诸位讲过：脚底板是温热的、脚上面是冷的；有的人整个脚是热的，代表太过了。****肾脏，第十四椎命门；肾是水，水里面有火，这个火是隐藏在水的中间的；这个火外面是水，所以皮肤、脚掌——脚的背面上摸到是冷的、脚底摸到是热的。****有一天这个火如果没有办法呆在这里面、往外散，就是肾脏的热、肾热外泄。**」\n\n**【极重要】脚的温度**\n\n| 位 | 温 |\n|---|---|\n| **脚背** | **冷** |\n| **脚底** | **热** |\n| **整脚热** | **太过（肾热外泄）** |\n\n**「脚背冷、脚底热，整个脚热就是肾热外泄」——「这条与 n87脚面冷、脚底热」、n127「掌背冷、掌心热」完全一致。**要点：**这一条极重要，它是「肾火藏于水中」** ✓✓","o":"RJ-1927 · 《人纪·神农本草经》上经第二十四味，讲解（PDF 第 123–124 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"白术的本草条目","c":"【本经原文】「**味苦，主风寒湿痹，死肌痉疸止汗，除热消食，作煎饵；久服轻身延年，不饥；一名山精。**」【产地】「**产河南浙江安徽及各地，为山间多年野生草；根细者如指，大者如拳，外微褐，肉白入药。**」【性味】「**味甘性温无毒。**」【主治】「**白术为健脾胃要药，功能利水去湿，和中调气；外科用托疡疮。**」【别录】「**大风在身面，风眩头痛，眼泪出，消痰水，逐皮间风水结肿，除心下急满，霍乱吐下不止，利腰脐间血，益津液，暖胃消谷嗜食。**」【甄权】「**治心腹胀满，腹中冷痛，胃虚下利，多年气痢，除寒热止呕逆。**」【大明】「**反胃利小便，主五劳七伤，补腰膝长肌肉，治妇人症瘕。**」【好古】「**理胃益脾，补肝风虚，主舌本强，食即呕，胃脘痛，心下急痛，心下水痞，冲脉为病，气逆里急脐腹痛。**」【容川】「**内含甘润之油质，可以滋脾之阴；外发辛香之温性，故可以畅达脾之阳；尤以浙产之油质最厚，可补脾之膏油；油不粘水，故能利水。**」【药征】「**主利水也，故能治小便自利、不利，旁治身烦疼，痰饮失精，眩冒下利喜唾。**」【灵胎】「**白术补脾补气，苍术燥湿发汗。**」【用量】「**普通半至三钱，大剂二三两。**」【禁忌】「**凡病属阴虚血少、精不足、内热骨蒸、口干唇燥、咳嗽吐痰、吐血鼻血、齿血、咽塞、便秘、滞下均忌；溃疡用之反生脓作痛；忌与蛤雀桃李菘菜青鱼同食。**」\n\n**【极重要】白术的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/温/无毒** |\n| **主治** | **健脾胃/利水去湿/和中调气** |\n| **禁** | **阴虚血少/内热骨蒸/便秘** |\n\n**「一名山精，必欲长生服山精」** ✓✓","o":"RJ-1928 · 《人纪·神农本草经》上经第二十五味「白术」，原文（PDF 第 125 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"术附汤是排脓汤","c":"讲义讲「一个极重要的方」：「**我们有一味药、有一个处方，叫术附汤；因为白术能够去湿、附子能够去寒；附子是将军，无所不到、很厉害力量很大。****就这两味药设计好了排脓汤。****『老师啊，很多地方生脓啊』——排什么地方的脓？那个脓跑到骨头里面去了，我们必须要靠一些热药、入肾入骨的药；黑的附子很热，下去让它——寒，里面发炎那个骨头里面，西医要把他做截肢的。****这个时候你炮附子下去把寒去掉，同时白术去湿，所以这个叫做术附汤、排脓的。**」\n\n**【极重要】术附汤 = 排脓**\n\n```\n白术（去湿）+ 附子（去寒入骨）\n  → 深部脓（骨）往表走\n```\n\n**「脓跑到骨头里面，靠术附汤排出来」——「须强标：骨髓炎须抗生素+手术。」**要点：**须「强「标」**：**「①骨髓炎须抗生素 + 手术（不可只用术附汤）；②附子毒性极强（须炮制/先煎）；③『西医要截肢』是误导」** ✓✓","o":"RJ-1929 · 《人纪·神农本草经》上经第二十五味，讲解（PDF 第 126 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"白术是天然除湿剂","c":"讲义讲「一个极形象的实验」：「**你可以试验：把白术打粉以后放在里面，overnight，第二天就是、粉没有了、就变成一块整块的硬下来像石头一样。****所以白术能够去湿，因为空气里面很多湿、湿吸收过来就硬起来。****如果说白术在室内、它都没有成块的话，代表这个房子很干燥；否则的话你如果放很多白术在房间里，你就不需要除湿剂了，整个干掉了！所以那个白术力量很强。**」\n\n**【极精】白术 = 天然除湿剂**\n\n```\n白术粉 + 空气湿 → 一夜成硬块\n```\n\n**「放很多白术在房间里，你就不需要除湿剂了」——「这是最直观的去湿证明。」**要点：**这一条极精，它是「可观察的实验」** ✓✓","o":"RJ-1930 · 《人纪·神农本草经》上经第二十五味，讲解（PDF 第 126 页）。"},{"t":"神农本草经·上经：甘草（续）、干地黄、白术","h":"白术加茯苓：收湿加排出","c":"讲义讲「一个极重要的配伍」：「**白术我们常常合并用的时候我们会跟茯苓在一起用。****因为茯苓是甘味淡味、是渗湿的；白术是去湿的，所以白术要下去把湿收集起来，白术的工作就结束了。****如果没有茯苓的话，湿就停在那边、它不知道往哪里走；所以你要用使药把它排出身体里面。****茯苓是利尿的，所以白术把湿收起来的时候、茯苓一加进去的话，这个湿就会从小便排出来。**」\n\n**【极重要】白术 + 茯苓**\n\n```\n白术 = 收湿（收集）\n茯苓 = 渗湿（排出，利尿）\n  → 收 + 排 = 完整闭环\n```\n\n**「白术收湿，茯苓排出」——「这是最精的收排配伍。」**要点：**这一条极重要，它与 n192「鼻窦炎三味药（苍术）」有对应** ✓✓","o":"RJ-1931 · 《人纪·神农本草经》上经第二十五味，讲解（PDF 第 127 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"针灸的速度","c":"讲义讲「一个极精的临床场景」：「**冲脉为病，气逆里急脐腹痛；如果你会针灸，你看冲脉那个脉是往上走，病人有恶心反胃、胃里面难过。****你们学过针灸的公孙，你公孙针下去以后、那个白术还没有下锅，那个针下去病人就好了。****甚至药还没有下锅、还在洗——药煮要洗一下再煮——还在洗的那个人已经好了。****针在旁边你不用，我们的公孙主冲脉，为什么不用呢？**」\n\n**【极重要】针灸的速度**\n\n```\n药还没下锅 → 针已见效\n  → 针药并用，因时因地制宜\n```\n\n**「公孙主冲脉，针下去病人就好了」——「这条与 n154冲脉病用公孙+内关」完全一致。**要点：**这一条极重要，它是「针药并用的价值」** ✓✓","o":"RJ-1932 · 《人纪·神农本草经》上经第二十五味「白术」，讲解（PDF 第 127–128 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"白术通利三焦","c":"讲义讲「一个极重要的机制」：「**唐容川，他这个白术里面、有增加了白术的解释，浙江的最好；因为白术里面有油脂在里面。****它能够通利三焦，所以它能够利水。****所以我们常常在治水、治疗水肿水病的时候，不管是肝硬化腹水、或者是肾脏积水，我们常常会使用到白术，因为白术能够通利三焦。****因为白术里面有油脂在里面，通利三焦，能够让水道能够非常的通畅。****白术，是补脾的正药，也是利水的主药。**」\n\n**【极重要】白术通利三焦**\n\n```\n白术（油脂）→ 通利三焦\n  → 水道通畅 → 利水\n```\n\n**「白术有油脂，通利三焦，能利水」——「这条与 n77三焦=油网」完全一致。**要点：**须「强「标」**：**「①肝硬化腹水/肾性积水须病因 + 利尿 + 限钠 + 规范治疗；②白术不能代替利尿剂/穿刺；③腹水须查病因（肝/心/肾/肿瘤/结核）」** ✓✓","o":"RJ-1933 · 《人纪·神农本草经》上经第二十五味，讲解（PDF 第 128 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"白术的双向","c":"讲义讲「一个极反直觉的现象」：「**《药征》你看治小便、主利水也，所以它能治小便自利或不利。****『老师这是不是矛盾？小便自利和不利这两个矛盾。』****中药没有矛盾，因为中药里面，你小便频也可以用白术、小便不利也可以用白术，是取它的中性，常常会出现这种现象。**」\n\n**【极精】白术双向**\n\n| 症 | 用 |\n|---|---|\n| **小便频** | **白术** |\n| **小便不利** | **白术** |\n\n**「取它的中性，双向调节」——「这条与 n193中药的双向调节」完全一致。**要点：**这一条极精，它是「双向调节的又一例」** ✓✓","o":"RJ-1934 · 《人纪·神农本草经》上经第二十五味，讲解（PDF 第 128 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"中药是 push 你自己","c":"讲义讲「一个极重要的定义」：「**老外问的问题很好啊：『我们那个中药为什么我们几千年我们可以用到这个历久不衰？』****我们用这个中药唯一的目的就是：它到身体里面以后，会 push 你自己，让你身体所有东西被你自己所掌控。****所以你吃了中药以后，你是自我恢复了，当然是痊愈啦。****不是因为我药，是因为我的药推你，把你弄好。****所以中药完全是让你自己的功能强悍到，他的功能由自己恢复来的。**」\n\n**【极重要】中药是 push 你自己**\n\n```\n中药 → push 身体 → 自我恢复\n```\n\n**「中药是推你自己，让你自己恢复」——「这是最精的作用模式。」**要点：**须「标」**：**「『西药只能控制、不能讲痊愈』须否定（许多西药可治愈感染/结核/白血病/C型肝炎；『中药都能痊愈』也不成立）」** ✓✓","o":"RJ-1935 · 《人纪·神农本草经》上经第二十五味，讲解（PDF 第 128–129 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"白术与苍术","c":"讲义讲「一个极重要的区分」：「**有人说一株树，这里是白术、根部的地方是白术，到顶上的树枝树叶、顶上的地方苍术长在树顶。****所以你用树枝树干是苍术，用树根是白术，就同一个本草。****白术在土里面，土里面含有湿在里面，所以它可以活在里面、它去湿、它收湿。****苍术是露在外面的，它干燥的，所以苍术的性比较燥。****所以我们会用苍术在上，苍术配合菖蒲、配合辛夷来治鼻窦炎。**」\n\n**【极重要】白术 vs 苍术**\n\n| 药 | 部 | 性 | 用 |\n|---|---|---|---|\n| **白术** | **根（土中）** | **收湿（润）** | **补脾胃** |\n| **苍术** | **枝叶（外露）** | **燥湿（燥）** | **上部（鼻）** |\n\n**「同株不同部位，根收湿、枝燥湿」——「这是最精的形态定性。」**要点：**这一条极重要，它与 n192「鼻窦炎三味药（苍术）」有对应** ✓✓","o":"RJ-1936 · 《人纪·神农本草经》上经第二十五味，讲解（PDF 第 129 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"用错了的指纹","c":"讲义讲「一个极精的药效指纹」：「**所以你开了白术，肠胃的湿收的很干净、肠胃湿收的很干净的时候胃口大开啊；病人就会跑来跟你讲：『你要我吃的药很好啊，我是吃鼻子的药，吃的我胃口大开，鼻子还在流水』。****所以你用错了，应该用苍术。****同时鼻子又不好、又同时胃口不好，你才会两个药同用。**」\n\n**【极重要】用错了的指纹**\n\n```\n治鼻却胃口大开、鼻水仍流\n  → 用错（当用苍术）\n```\n\n**「胃口大开、鼻子还在流水，就是用错了」——「这是最精的疗效指纹。」**要点：**这一条极重要，它是「错用的可读性」** ✓✓\n\n**极精！！\"苍「术白术并用的时机\"** ✅✓\n| 情 | 配 |\n|---|---|\n| **鼻+胃同病** | **苍术 + 白术** |\n| **积水（水盛）** | **苍术 + 白术 + 茯苓** |\n| **白术主脾胃/肌肉；苍术到头部** | — |","o":"RJ-1937 · 《人纪·神农本草经》上经第二十五味，讲解（PDF 第 129 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"骨蒸的画像","c":"讲义讲「一个极精的临床画像」：「**病人骨蒸的时候，大部分都是瘦子；病人跑过来跟你讲：『医生奇怪了，我胃口很好，我怎么吃都不胖啊』——骨蒸。****病人觉得骨头里面发热，就骨蒸。****蒸蒸的，就是那个热不是说燥热，就好像一阵一阵的蒸、好像蒸笼的感觉，身体里面带个蒸笼。****然后瘦瘦的怎么吃也吃不胖，骨蒸啊！内热，然后口干唇燥。****骨蒸的人呢常常会有痛，肌肉痛、关节痛很多地方痛；他会跟你讲一百种、上一百种不同的附症。****其实就是骨蒸；你把他骨蒸一治好，痛统统去掉了。**」\n\n**【极重要】骨蒸的画像**\n\n```\n① 吃很多但不胖\n② 骨头里像蒸笼（一阵阵热）\n③ 口干唇燥\n④ 全身多处痛（百种附症）\n```\n\n**「吃很多不胖，骨头里像蒸笼」——「须强标：这是须排除的病。」**要点：**须「强「标」**：**「『骨蒸』（消瘦 + 多食 + 低热 + 骨痛）→须排除①甲亢；②结核；③糖尿病；④恶性肿瘤；⑤风湿性多肌痛（PMR）/骨髓瘤」** ✓✓","o":"RJ-1938 · 《人纪·神农本草经》上经第二十五味，讲解（PDF 第 129 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"黄土汤里有白术","c":"讲义讲「一个极重要的例外」：「**我们真正使用，像那个溃疡——你如果是在肠胃里面的溃疡，白术是收敛的力量很强、胃的蠕动会很强。****所以你吃下去的时候，如果病人有化脓疡在里面的时候，白术放在里面的时候有收湿的效果，很好啊、并不坏啊。****所以我们中药里面很多、经方里面很多药，比如黄土汤我们有白术在里面，治疗胃出血、肠胃出血那效果都很好的。**」\n\n**【极精】黄土汤（白术在内）**\n\n```\n黄土汤 = 灶心黄土 + 白术 + ...\n  → 治胃出血/肠胃出血\n```\n\n**「黄土汤有白术，治肠胃出血效果很好」——「这条与 n47黄土汤」有对应。**要点：**这一条极精，它是「禁忌的例外（脏层面）」** ✓✓\n\n**须「强「标」**：**「消化道出血须立即就诊（查内镜/血常规/凝血）；不可只用黄土汤」** ✓✓","o":"RJ-1939 · 《人纪·神农本草经》上经第二十五味，讲解（PDF 第 130 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"菟丝子的本草条目","c":"【本经原文】「**味辛平，主续绝伤，补不足，益气力肥健，汁去面皯；久服明目，轻身延年。**」【产地】「**产朝鲜川泽及田野，我国亦有之；夏生苗，初如细丝，得地种植物而缠绕之，自绝其根，即借他物之养料以生长。**」【性味】「**味辛甘，性平无毒。**」【主治】「**菟丝子为补肾益精要药，主绝续伤，补不足，坚筋骨，强阴分，治茎中寒，精自出，溺有余沥，腰痛膝冷。**」【甄权】「**治男女虚冷，添精益髓，去腰疼膝冷，消渴热中。**」【大明】「**补五劳七伤，治鬼交泄精，尿血，润心肺。**」【灵胎】「**补益肝脾，接续筋骨。**」【用量】「**普通一钱至三钱。**」【禁忌】「**肾家多火，阳强不痿，及大便燥急者，均忌；得酒良。**」\n\n**【极重要】菟丝子的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛甘/平/无毒** |\n| **主治** | **补肾益精/强阴分/茎中寒** |\n| **禁** | **阳强不痿/大便燥** |\n\n**「自绝其根，借他物养料生长」——「这是最奇的寄生。」** ✓✓","o":"RJ-1940 · 《人纪·神农本草经》上经第二十六味「菟丝子」，原文（PDF 第 130–131 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"菟丝子用错","c":"讲义讲「一个极重要的禁忌后果」：「**『老师，这个人精不够，我给他吃菟丝子』——吃完菟丝子回来，他就会告诉你：『医生，我这辈子从来没有倒下去过，吃了你的药从此就不举了』。****这就是菟丝子；读书要小心点、要看清楚。****如果你病人说举起来没有问题，你不要给他吃菟丝子，这是我们当医生要注意的。**」\n\n**【极重要】菟丝子用错**\n\n```\n阳强不痿（性功能正常）+ 菟丝子\n  → 反而容易不举\n```\n\n**「本来正常，吃了就不举了」——「这是最精的禁忌后果。」**要点：**这一条极重要，它是「禁忌的临床可见」** ✓✓\n\n**极精！！\"确「定用菟丝子的两个条件\"** ✅✅\n```\n① 精不够（精子淡/少）\n② 同时不举\n  → 菟丝子（精变浓 + 举）\n```\n\n**极精！！\"种「子类药 = 补精\"** ✅✅\n- **\"中药所有用到种子的药，都是在补精的、都是能够补到精子的\"** ✓✓\n- **\"那菟丝子是其中一个，像覆盆子也是\"** ✓✓\n\n**【极精】\"种「子类药= 补精\"** ✅✅","o":"RJ-1941 · 《人纪·神农本草经》上经第二十六味，讲解（PDF 第 131–132 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"牛膝的本草条目","c":"【本经原文】「**味苦酸，主寒湿痿痹，四肢拘急，膝痛不可屈伸，逐血气伤热火烂，堕胎；久服轻身耐老。**」【产地】「**产我国河南一带，四川亦有出产；为山野自生之多年生草本，根入药。**」【性味】「**味苦酸性平无毒。**」【主治】「**牛膝为寒湿痹痿、骨节疼痛要药，走血能补，益肝肾强筋骨，痛淋浊，引诸药下行，治膝痛，能堕胎。**」【别录】「**疗伤中少气，男子阴消，老人失溺，补中续绝，益精，利阴气，填骨髓，止白发，除脑中痛，及腰脊痛。**」【甄权】「**治阴痿，补肾助十二经脉，逐恶血。**」【大明】「**治腰膝软怯弱，破症结，排脓止痛，产后心腹痛，并血晕，落死胎。**」【灵胎】「**舒筋行血，降气堕胎。**」【用量】「**普通钱半至三钱。**」【禁忌】「**牛膝误用必伤胎，经闭未久、疑似有妊者忌用；上焦药中勿用；梦遗失精，脾虚下陷，血崩不止亦忌；忌牛肉牛乳。**」【容川】「**牛膝性降，因根深味苦，故能引水火下行；因根坚实、形不空、无升达之孔道，味既苦泻，故下行双足；其节如膝，能利膝胫，以其形似也。**」\n\n**【极重要】牛膝的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦酸/平/无毒** |\n| **主治** | **寒湿痹痿/骨节疼痛/引药下行/堕胎** |\n| **禁** | **疑似妊/上焦/遗精/血崩** |\n\n**「引诸药下行，是牛膝最独特的定位」** ✓✓","o":"RJ-1942 · 《人纪·神农本草经》上经第二十七味「牛膝」，原文（PDF 第 132–133 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"牛膝的形态定性","c":"讲义讲「一个极精的取象」：「**牛膝这个药，顾名思义、我们可以以意得药：这牛膝长得很深、一根通到底。****你拔出来看，就是一根像牛的膝盖、牛的腿一样；一根中间有个结、很深、深到底、一路直行下去，根非常扎实。**」原文【容川】「**其节如膝，能利膝胫，以其形似也。**」\n\n**【极精】牛膝 = 形似膝 → 治膝**\n\n```\n节如膝 + 根深如腿\n  → 引药下行 → 治膝痛\n```\n\n**「节如膝，能利膝胫」——「这是最精的形态定性。」**要点：**这一条极精，它与 n184「枝达四肢、中空发表」同一体系** ✓✓","o":"RJ-1943 · 《人纪·神农本草经》上经第二十七味，原文及讲解（PDF 第 133 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"以通为补","c":"讲义讲「一个极重要的定义」：「**中药补药的定义，不能说吃当归好、黄芪啊、人参啊、滋补的药，不是那么简单；而补的定义我们要扩大。****比如说这个人便秘很严重……那这种严重的便秘，我们去用芒硝去攻，把它统统清出来以后。****对你来说、你没有便秘的问题，芒硝对你来说、可能弄得很虚弱；对他来说、它把大便通通清出来、人很轻松、开始又可以大吃的时候，对他来说芒硝是他的补药。****所以中药的定义是在这里面，我们范围要广；所以『以通为补』，像这个牛膝，是以活血为补。**」\n\n**【极重要】以通为补**\n\n```\n芒硝（便秘者）→ 通 → 补\n牛膝（瘀血者）→ 活血 → 补\n```\n\n**「芒硝对便秘的人来说就是补药」——「这条与 n115对证就是补」完全一致。**要点：**这一条极重要，它是「补的相对性」** ✓✓","o":"RJ-1944 · 《人纪·神农本草经》上经第二十七味，讲解（PDF 第 135 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"牛膝为什么能止白发","c":"讲义讲「一个极精的推理」：「**【别录】说它能够填骨髓，还有止白发、就是能够让头发变黑。****为什么这种药会有这种情形？因为我们说久病有淤——很多病、比如头发白发，因为有淤血、身上气血不通，所以他头发白的。****那牛膝它可以把气血打通、他头发就变黑了。**」\n\n**【极精】久病有淤 → 白发**\n\n```\n气血不通（瘀）→ 白发\n  → 牛膝活血 → 发黑\n```\n\n**「头发白是因为气血不通」——「须标：白发主因是遗传与年龄。」**要点：**须「标」**：**「白发主因是遗传/年龄/B12/甲状腺/白癜风；『活血→黑发』无证据」** ✓✓","o":"RJ-1945 · 《人纪·神农本草经》上经第二十七味，讲解（PDF 第 134 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"牛膝的禁忌","c":"原文【禁忌】「**牛膝误用必伤胎，经闭未久、疑似有妊者忌用；上焦药中勿用；梦遗失精，脾虚下陷，血崩不止亦忌；忌牛肉牛乳。**」讲义：「**那病人已有血崩了、下面血崩不止，还遗精了、已经下面一直在宣泄了，你再用牛膝、再去攻下，不合理。**」\n\n**【极精】牛膝四禁**\n\n| 禁 | 因 |\n|---|---|\n| **疑似妊** | **堕胎** |\n| **上焦药** | **牛膝走下焦** |\n| **遗精** | **已下泄** |\n| **血崩** | **再攻下不合理** |\n\n**「下面已经在宣泄，再用牛膝攻下，不合理」——「这是最精的禁忌逻辑。」**要点：**须「强「标」**：**「①牛膝有堕胎风险，孕妇禁用；②上焦病不用（引药下行）；③不可自行用于堕胎（危险）」** ✓✓","o":"RJ-1946 · 《人纪·神农本草经》上经第二十七味，原文及讲解（PDF 第 133 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"牛膝的剂量","c":"讲义讲「一个具体的剂量」：「**牛膝你用的剂量一定要够。牛膝我用的时候，我起价 3 钱看看。****病人膝盖痛、我不管是风湿痛关节，尤其是那个扭伤、摔伤的，牛膝效果很好。****我们这个小孩的体格 3 钱，如果遇到个子比较大的，5 钱 6 钱 8 钱都没有关系的。****老人家，膝盖没有力、走路没有力，牛膝下去、膝盖就会很有力量。**」\n\n**【极精】牛膝的剂量**\n\n| 体 | 量 |\n|---|---|\n| **小孩** | **3钱** |\n| **大个** | **5–8钱** |\n| **老人膝无力** | **牛膝（有效）** |\n\n**「膝盖没有力，牛膝下去就很有力量」——「这是最具体的应用。」**要点：**须「标」**：**「膝痛须先查病因（骨性关节炎/半月板/韧带/痛风）；不可只用牛膝」** ✓✓","o":"RJ-1947 · 《人纪·神农本草经》上经第二十七味，讲解（PDF 第 133 页）。"},{"t":"神农本草经·上经：白术（续）、菟丝子、牛膝","h":"气与味的阴阳","c":"讲义讲「一个极精的判别」：「**你说『老师怎么分这个气？』很简单：你如果人参把它切片、你烤完、你切开，哇！那个味道很强，那就是气很强。****你把中国大陆产的茅台打开来，在房间里面、整个房间都是香气，那就是气很强；米酒打开来就没有味道，气薄。****那气很强的是阳中的阳药，我们讲气就是阳嘛；那阳中的阳药，就是气很强、味道很厚。****气很薄，米酒就是阳中的阴。**」\n\n**【极精】气与味的阴阳**\n\n| 例 | 气 |\n|---|---|\n| **人参（切片）** | **气强（阳中之阳）** |\n| **茅台** | **气强** |\n| **米酒** | **气薄（阳中之阴）** |\n\n**「茅台气强，米酒气薄」——「这条与 n182阴阳之义」完全一致。**要点：**这一条极精，它是「可闻的阴阳」** ✓✓","o":"RJ-1948 · 《人纪·神农本草经》上经第二十七味，讲解（PDF 第 134 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"杜牛膝与牛膝","c":"讲义讲「一个极重要的区分」：「**杜牛膝，完全没有补益的效果，只攻下。****所以我们在破血、腹部有淤血——像我们这边的足球赛，如果不小心踢脚、踢到男人的睾丸，踢到那个痛翻了，里面那个淤血，当然我们有抵挡汤、调和承气汤，很多药去攻它。****这个时候如果我们用单味的药，用杜牛膝也可以。****还有妇人肚子里面子宫卵巢里面有肿瘤，它可以止痛的，这就是杜牛膝，跟牛膝是不太一样的。**」\n\n**【极精】杜牛膝 vs 牛膝**\n\n| 药 | 性 |\n|---|---|\n| **牛膝** | **攻中带补** |\n| **杜牛膝** | **纯攻（无补）** |\n\n**「一个攻中带补，一个纯攻」——「这是最精的同类异用。」**要点：**须「强「标」**：**「①睾丸外伤须立即泌尿外科（可致破裂/坏死）；②卵巢肿瘤须规范治疗；③杜牛膝不可代替」** ✓✓","o":"RJ-1949 · 《人纪·神农本草经》上经第二十七味「牛膝」附录，讲解（PDF 第 135–136 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"逆经","c":"讲义讲「一个极特殊的病」：「**有一种病，这个药一定要使用——就是逆经。****什么叫逆经？女人的月经每个月按时要到；月经是法像海洋的潮汐，潮汐是每个月涨潮一次，月经也一样。****那所以是咸味的嘛，海水是咸味的、像月亮，所以叫月经。****那这个如果说你的月经来的时候、本来应该往下走，可月经来的时候从鼻子出来，这叫做逆经。****所以每个月太太或者小姐就要流很多鼻血、流个几天月经，她没有月经在下面、逆经从鼻子流出来。**」\n\n**【极重要】逆经**\n\n```\n月经应下行 → 从鼻出（逆经）\n  → 益母草（最好）\n```\n\n**「月经从鼻子出来，就是逆经」——「这条与 n52倒经」有对应。**要点：**须「强「标」**：**「『逆经』（经期鼻出血）→须排除①子宫内膜异位症（鼻黏膜病灶）；②鼻出血的其他原因（凝血/高血压/鼻黏膜）；须妇科 + 耳鼻喉科评估」** ✓✓","o":"RJ-1950 · 《人纪·神农本草经》上经第二十八味「充蔚子」，讲解（PDF 第 136–137 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"益母草的本草条目","c":"【本经原文】「**味辛微温，主明目益精，除水气，久服轻身；茎主瘾疹痒，可做浴汤；一名益母。**」【产地】「**多生于原野及近水处，叶为深裂式，茎做方形，名益母草，即茺蔚子。**」【性味】「**味辛苦性微寒，无毒。**」【主治】「**此药为去瘀生新，通调月经，及产后要药，根茎功用相同。**」【别录】「**疗血逆，大热头痛心烦。**」【吴瑞】「**舂仁生食补中益气，通血脉，填精髓，止渴，润肝。**」【用量】「**普通一钱至三钱。**」【禁忌】「**血崩及瞳子散大均忌，唯热血欲贯瞳仁者，可与凉药同用。**」【附录】「**益母草性味通茺蔚子，主瘾疹，可做浴汤；捣汁服用主浮肿下水，消恶毒疔肿、乳痈丹游等毒可敷之；又服汁主治胎死腹中及产后血胀闷，滴汁入耳治耳聤。**」\n\n**【极重要】益母草的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛苦/微寒/无毒** |\n| **主治** | **去瘀生新/通调月经/产后要药** |\n| **禁** | **血崩/瞳子散大** |\n\n**「充蔚子就是益母草，开处方写益母草」** ✓✓","o":"RJ-1951 · 《人纪·神农本草经》上经第二十八味，原文（PDF 第 136–137 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"微寒可常服","c":"讲义讲「一个极精的分寸」：「**这个药很普遍，它的性味在这个地方比较重要，就是味辛苦、性微寒。****诸位，我们所有微寒的药，只要有微寒、人家不说大寒，只有微寒我们都可以当滋补的药，平常都可以吃、没有关系。****它又有辛味、又有苦味，所以治疗的范围就比较广。**」\n\n**【极精】微寒可常服**\n\n```\n微寒 → 可当滋补（常服）\n大寒 → 不可\n```\n\n**「只有微寒，才可以当滋补药常吃」——「这条与 n181五味之用」有对应。**要点：**这一条极精，它是「寒的程度分界」** ✓✓","o":"RJ-1952 · 《人纪·神农本草经》上经第二十八味，讲解（PDF 第 137 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"生用外洗，炮制配药","c":"讲义讲「一个极具体的用法」：「**一般来说，浴汤的时候都是拿新鲜的，新鲜的来煮、来擦身体、洗身体。****那要配药的时候我们才会炮制过。****因为这个它有微寒、益母草是微寒的性、一点点寒；诸位常常看人家眼睛，眼球红血丝冲了很多，益母草就可以用啦。****所以说那个血热贯瞳仁都可以统用，因为性比较寒凉。**」\n\n**【极精】生用外洗，炮制配药**\n\n```\n浴汤（风疹/痒疹）→ 新鲜生用\n内服配药        → 炮制\n```\n\n**「洗身体用新鲜的，配药才炮制」——「这是最具体的用法分层。」**要点：**这一条极精，它是「生熟分用」** ✓✓","o":"RJ-1953 · 《人纪·神农本草经》上经第二十八味，讲解（PDF 第 138 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"回阳救逆用大热","c":"讲义讲「一个极重要的用药原则」：「**所以益母草的【禁忌】，血崩还有瞳子扩散、瞳孔都放大了、都快死掉了，这个时候你不能开寒凉的药。****这样会死的更快，他本来已经够冷、你再开冷的药、更冷。****血崩了那我们要收敛，收敛的时候开寒凉的药都不好。****我们一般回阳救逆的时候，都是用大热大辛大热的药去救逆。**」\n\n**【极重要】回阳救逆用大热**\n\n```\n瞳散/血崩（将亡）→ 不可寒凉\n  → 须大辛大热 + 收敛\n```\n\n**「已经够冷，再开冷的药就更冷」——「这条与 n74回光返照」、n72「绝汗=油」有对应。**要点：**这一条极重要，它是「寒热的方向性」** ✓✓","o":"RJ-1954 · 《人纪·神农本草经》上经第二十八味，讲解（PDF 第 138 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"中医改变环境，不杀菌","c":"讲义讲「一个极重要的观点」：「**耳朵这个地方，你喷药下去能够保持它干燥；像我们的矾石也是种干燥剂，麝香是无孔不入。****所以你从这边、耳朵一喷进去的时候，麝香它整个扩散到内耳里面，把里面的湿、里面的脓、里面的粘液通通吸掉，现在变得很干燥在里面。****干燥了就好像在沙漠里面——沙漠里面人都不要去、连细菌都不要去；所以你耳朵、内耳里面一直保持很干燥，所以喷几下小孩子中耳炎就好啦。****我没有说杀啊！中医不是去杀病毒，中医是改变环境。****你在那边杀、杀了半天，环境还在那边嘛。**」\n\n**【极重要】中医改变环境，不杀菌**\n\n```\n干燥（矾石）+ 无孔不入（麝香）\n  → 环境不宜菌 → 炎自消\n```\n\n**「环境在那边，杀半天还是会回来」——「这是最精的环境论。」**要点：**须「强「标」**：**「①中耳炎须规范治疗（抗生素/镇痛/引流）；②『不杀菌』不等于细菌不重要；③慢性须耳鼻喉科评估」** ✓✓","o":"RJ-1955 · 《人纪·神农本草经》上经第二十八味，讲解（PDF 第 138–139 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"女萎（玉竹）的本草条目","c":"【本经原文】「**味甘平，主中风暴热不能动摇，跌筋结肉，诸不足；久服去面黑皯，好颜色，润泽，轻身不老；又名萎蕤，现名玉竹。**」【产地】「**生于山麓阴地之多年生草，各地皆有，以产南部地方者为上；其地下茎粗大有三棱，节作紫黑色。**」【性味】「**味甘性平无毒。**」【主治】「**萎蕤为治风热风湿入肌作痛要药，功能祛风清热，除湿止痛，主邪热头痛，及腰痛身痛，补劳伤。**」【别录】「**心腹中结气，虚热湿毒肿痛，茎中寒，及目痛眦烂泪出。**」【甄权】「**时疾寒热，内补不足，去虚劳客热，头痛不安加而用之良。**」【容川】「**风能胜湿，风伤血则筋燥，玉竹可以润燥。**」【用量】「**普通二钱至四钱，大剂二三两。**」【禁忌】「**畏咸卤。**」\n\n**【极重要】女萎（玉竹）的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒** |\n| **主治** | **风热风湿入肌作痛/祛风清热/润燥** |\n| **禁** | **畏咸卤** |\n\n**「叶似竹，根大如指，可啖」——「玉竹可入菜」** ✓✓","o":"RJ-1956 · 《人纪·神农本草经》上经第二十九味「女萎」，原文（PDF 第 139 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"玉竹是肌肉痛的专药","c":"讲义讲「一个极明确的定位」：「**这个女萎，我们又称为玉竹；你们到药房去的时候开玉竹，不要写这个女萎。****这个药是我在治疗肌肉关节痛、尤其肌肉痛，英文叫做 painMuscle……全身肌肉痛，一定要会用玉竹。****这个根据我们临床的实用上看；那很多的未婚的男女、太太，这个发生在女人身上很多。**」\n\n**【极重要】玉竹 = 肌肉痛的专药**\n\n```\n肌肉痛（painMuscle）\n  → 玉竹\n```\n\n**「全身肌肉痛，一定要会用玉竹」——「须标：肌肉痛须排查病因。」**要点：**须「强「标」**：**「全身肌肉痛须排除①风湿性多肌痛（PMR）；②肌炎/横纹肌溶解；③甲减/电解质；④他汀类药物；⑤感染（流感/登革）」** ✓✓","o":"RJ-1957 · 《人纪·神农本草经》上经第二十九味，讲解（PDF 第 139–140 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"风能胜湿","c":"原文【容川】「**风能胜湿，风伤血则筋燥，玉竹可以润燥。**」讲义：「**【唐容川】风能胜湿，所有去风的药都能够去湿；因为玉竹可以去风，所以玉竹可以润燥，甘味的都可以；尤其是很燥，统统可以使用玉竹。**」\n\n**【极精】风能胜湿**\n\n```\n去风药 → 也去湿\n玉竹（去风）→ 润燥\n```\n\n**「所有去风的药都能去湿」——「这条与 n184六淫主治」有对应。**要点：**这一条极精，它是「一药多能」** ✓✓","o":"RJ-1958 · 《人纪·神农本草经》上经第二十九味，原文及讲解（PDF 第 139–141 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"经方为基础，单味为加减","c":"讲义讲「一个极精的比喻」：「**我今天有经方做基础，就是我上一堂课也强调，我为什么去骂温病的——因为他也有温病做基础，他把经方失掉了。****而真正能起重症治病的是经方；那你抱一大堆方子，你治一堆小病可以、你治不了大病。****一定要以经方做基础，后面那些圣诞树是经方，你插一些、上面的装饰你可以放一些温病的药，都没有关系。****所以我们现在为什么让你们认识单味的药，就是后面的方剂的时候，你就可以自己加减。**」\n\n**【极精】圣诞树比喻**\n\n```\n经方 = 圣诞树（主干）\n单味药 = 装饰（加减）\n→ 有《本经》基础才知道加什么\n```\n\n**「经方是圣诞树，单味药是装饰」——「须标：这是派系立场。」**要点：**须「标」**：**「『温病治不了大病』是派系立场，须标；现代中医须循证」** ✓✓","o":"RJ-1959 · 《人纪·神农本草经》上经第二十九味，讲解（PDF 第 140–141 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"药随医亡","c":"讲义讲「一个极精的观察」：「**第 30 防葵，近年来已经很少用，这个防葵、本草经有些药，根本现在没有人认得了。****那很少采药的师傅，认不得了，因为没有医生用嘛。****没有医生用的时候就不采了；这个采药师傅，他祖父的时候可能认得、爸爸可能还稍为有点印象；到了他的时候，因为已经没有中医会用了，就没有了。**」\n\n**【极精】药随医亡（失传链）**\n\n```\n无医生用 → 不采 → 认不得 → 彻底失传\n```\n\n**「没有医生用，就不采了，慢慢就失传了」——「这是最精的知识断层。」**要点：**这一条极精，它是「药与医的共生」** ✓✓","o":"RJ-1960 · 《人纪·神农本草经》上经第三十味「防葵」，讲解（PDF 第 141–142 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"柴胡的本草条目","c":"【本经原文】「**味苦平，主心腹，去肠胃中结气，饮食积聚，寒热邪气，推陈致新；久服轻身明目益精；现名柴胡。**」【产地】「**出关东陕西各地，今各处亦有产，分南北两种，性味相同；产银州者曰银柴胡，性味稍异。**」【性味】「**味苦性平无毒。**」【主治】「**柴胡为发表清热要药，功能散三焦肝胆诸经之热邪，主治寒热疟疾，口苦耳聋，头痛眩晕。**」【别录】「**除伤寒心下烦热，诸痰热结实，胸中邪气，五脏间游气，大肠停积水胀，及湿痹拘急。**」【甄权】「**治热劳骨蒸烦疼，热气，肩背疼痛，劳乏羸瘦，下气消食，宣畅气血。**」【容川】「**柴胡一茎直上，花清香，故能升散郁结；专治胸前逆满……其色青，生于春而采于夏，得木火之气，从中土以达木火之气，使不侮肺也。**」【药征】「**主治胸胁苦满也，旁治往来寒热也，腹中痛，胁下痞鞭。**」【灵胎】「**其性轻扬，能逐半表半里之邪。**」【用量】「**普通八分至一钱，大剂三四钱。**」【禁忌】「**凡虚人气升呕吐，及阴虚火热炎上，法同所忌。**」\n\n**【极重要】柴胡的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦/平/无毒** |\n| **主治** | **发表清热/散三焦肝胆热/半表半里** |\n| **特** | **主治胸胁苦满；往来寒热** |\n| **禁** | **虚人气升呕吐/阴虚火炎** |\n\n**「推陈致新，是柴胡的核心」** ✓✓","o":"RJ-1961 · 《人纪·神农本草经》上经第三十一味「茈胡」，原文（PDF 第 142–143 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"半表半里无处不有","c":"讲义讲「一个极重要的扩展」：「**是少阳的药，经方里面用的很多；小柴胡、大柴胡，柴胡用的非常的多，张仲景认为它是属于半表半里的药。****半表半里，不单单是存在是肝胆；半表半里存在所有的脏腑的表里。****比如说肺跟大肠表里，那你为什么肺跟大肠表里？因为中间有半表半里的衔接。****那我们用的定义可能三焦系统、或者是怎么样；这个柴胡，主要就是专门治疗病在半表半里之间。**」\n\n**【极重要】半表半里无处不有**\n\n```\n一切表里之间\n  都有半表半里（三焦/膜网）\n```\n\n**「不只肝胆，所有脏腑的表里之间都有半表半里」——「这是最精的普遍性。」**要点：**这一条极重要，它与 n77「三焦=油网」同一体** ✓✓","o":"RJ-1962 · 《人纪·神农本草经》上经第三十一味，讲解（PDF 第 143 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"肝木要疏：修枝比喻","c":"讲义讲「一个极精的比喻」：「**我们认为肝是木嘛，要疏、要多多疏木，木一定要疏、木不能太郁。****树木如果树枝长太多、果子长得很密，这个果子不能吃的；要把那个枝干减掉，让它里面太阳光能够进去、空气能够流通进去、长得就会很好。****肝木时常要疏的，你不能树木长的太茂、太郁，郁闷在里面，以后会出问题的。****所以我们治肝病的主要的药物，柴胡。**」\n\n**【极精】修枝 = 疏肝**\n\n```\n树太密 → 剪枝 → 光/风进\n肝太郁 → 柴胡 → 疏\n```\n\n**「枝太密果子不能吃，要剪枝让阳光进去」——「这是最精的疏肝取象。」**要点：**这一条极精，它是「农艺比喻」** ✓✓","o":"RJ-1963 · 《人纪·神农本草经》上经第三十一味，讲解（PDF 第 143 页）。"},{"t":"神农本草经·上经：杜牛膝、益母草、女萎、防葵、柴胡","h":"真柴胡的形态","c":"原文【容川】「**良柴胡须用一茎直上，茎色青，叶生四面、细如竹叶、开小黄花者，乃为真柴胡，此为仲景所用。****四川梓潼产柴胡最佳，价极廉。****今多不知用，因药典有软柴胡、银柴胡、红柴胡等，皆以假乱真。**」\n\n**【极精】真柴胡的形态**\n\n| 征 | 内 |\n|---|---|\n| **茎** | **一茎直上/色青** |\n| **叶** | **生四面/细如竹叶** |\n| **花** | **小黄花** |\n\n**「一茎直上、细如竹叶、开小黄花，才是真柴胡」——「这是最精的药材鉴别。」**要点：**这一条极精，它与 n187「川军/锦纹大黄」同一主题（别名之害）** ✓✓","o":"RJ-1964 · 《人纪·神农本草经》上经第三十一味，原文引唐容川（PDF 第 143 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"劳症通向骨蒸","c":"讲义讲「一个极重要的病理」：「**什么叫劳？劳症的表面上看的时候，病人再怎么吃、再怎么营养都吃下去，瘦、不会胖，然后平常体力很差，这就是劳。****起因可能是癌症做完化疗，可能是他一直在做劳力的工作……病由劳力工作、做太过度产生的。****那劳症出现了以后，就会产生骨蒸；所以我们在治疗骨蒸，发生都是因劳病而来的。****骨头里面有阳是深藏在里面、不出来的；这个阳如果往外散的时候，就是骨蒸。**」\n\n**【极重要】劳症 → 骨蒸**\n\n```\n劳（过劳/化疗后）\n  → 骨中之阳外散\n  → 骨蒸（自觉骨头热）\n```\n\n**「骨头里的阳往外散，就是骨蒸」——「这是最精的机制链。」**要点：**这一条极重要，它与 n195「骨蒸的画像」完全一致** ✓✓","o":"RJ-1965 · 《人纪·神农本草经》上经第三十一味「茈胡」，讲解（PDF 第 143–144 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"骨蒸三征","c":"讲义讲「一个极具体的望诊」：「**那这种人都会有烦疼，很多的疼痛、肌肉啊、关节啊、到处都会痛。****所以你看一个人：形瘦、脉大，血脉都变得很大，疲劳没有力量、人倦怠无力，就已经可以看得出来。****那在《黄帝内经》里面讲，面色是青的、主的是痛；你看、哎呀一看，脸是青的，知道他里面很痛。****痛的时候、再加上人瘦、怎么吃都吃不胖，这是所谓的骨蒸、劳症。**」\n\n**【极重要】骨蒸三征**\n\n| 征 | 内 |\n|---|---|\n| **形瘦脉大** | + |\n| **面青** | **主痛** |\n| **倦怠无力** | + |\n\n**「形瘦、脉大、面青，就知道是骨蒸」——「这条与 n195骨蒸的画像」完全一致。**要点：**须「强「标」**：**「形瘦 + 脉大 + 多处痛→须排除结核/恶性肿瘤/甲亢/PMR/骨髓瘤」** ✓✓","o":"RJ-1966 · 《人纪·神农本草经》上经第三十一味，讲解（PDF 第 144 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"柴胡与连翘","c":"讲义讲「一个极精的层次区分」：「**【备要】，本草备要说：伤寒邪热、痰热结实、虚劳肌热、十二经络，功同连翘。****那有一点不一样，连翘是连翘、跟柴胡有点不太一样；所以本草备要的，我们要稍作修正一下。****连翘我们一般使用在皮肤有发瘾疹、发痒疹、皮肤有过敏，我们会使用到连翘。****那柴胡，倒是不是；柴胡我们是身体里面的——如果用现代语词来说，可能是淋巴系统、或者是内分泌系统产生的不平衡，我们会用到柴胡。**」\n\n**【极精】柴胡 vs 连翘**\n\n| 药 | 层 |\n|---|---|\n| **柴胡** | **里（三焦/淋巴/内分泌）** |\n| **连翘** | **表（皮肤/瘾疹/过敏）** |\n\n**「连翘走皮肤，柴胡走三焦」——「这是最精的层次分工。」**要点：**这一条极精，它是「同功不同层」** ✓✓","o":"RJ-1967 · 《人纪·神农本草经》上经第三十一味，讲解（PDF 第 144 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"柴胡四征","c":"讲义讲「一个极重要的证候群」：「**我们这个入少阳，学过针灸的都知道：旁边的偏头痛、少阳的头痛，所以我们就用柴胡。****所谓胸胁苦满，因为柴胡是入少阳、少阳是胆跟肝；中焦的地方、肋骨的周围，病人会有胸胁苦满的现象。****所以我们一定要听到病人陈述恶心——『啊我恶心』——那就是柴胡。****还有就是胸胁苦满，一定是柴胡——就是两胁之间这个非常的胀满。**」\n\n**【极重要】柴胡四征**\n\n| 征 | 判 |\n|---|---|\n| **往来寒热** | **+（须与桂麻各半汤鉴别）** |\n| **恶心** | **+** |\n| **胸胁苦满** | **+** |\n| **偏头痛（两侧）** | **+** |\n\n**「恶心、胸胁苦满，就是柴胡」——「这是最精的柴胡证。」**要点：**这一条极重要，它与 n124「胸胁苦满=少阳」完全一致** ✓✓\n\n**极重要！！\"柴「胡治肝病的全谱\"** ✅✅\n- **\"所有的肝病，我们只要遇到肝病、肝的问题、胆的问题、脾脏的问题、胰脏的问题，我们都会考虑用到柴胡\"** ✓✓\n- **\"我治疗肝病、不管是 B 肝还是 C 肝，到现在都是用柴胡；肝癌、肝硬化都会用到柴胡；胆结石，我们也会用到柴胡\"** ✓✓\n\n**须「强「标」**：**「B肝/C肝须抗病毒 + 定期随访（肝功/HBV-DNA/超声/AFP）；柴胡不能代替」** ✓✓","o":"RJ-1968 · 《人纪·神农本草经》上经第三十一味，讲解（PDF 第 144–145 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"虚热的治法","c":"讲义讲「一个极重要的组方原则」：「**我们如果诊断出来他是阳虚，我们不会说这个药专门治疗阳虚，不是这样子做的。****是我们要取补阳的药、要让阳气行走的药，同时要有补虚的药；补虚的药跟行阳的药放在一起，才可以把阳虚治好。****那如果说『老师，我是虚热的人，所以我一吃人参、这个嘴角都破裂啦』——那怎么办？****我们很少说开一味药、这味药就可以专去虚热；而是我们先要开个补药在里面、把你的虚要补足，然后同时开个去热的药在里面，这个时候虚热就会去掉。**」\n\n**【极重要】虚热的治法**\n\n```\n虚热 → 补虚（治本）+ 去热（治标）\n    两药同方\n```\n\n**「补虚和去热，两药放一个方子才治得好」——「这条与 n162只祛热是治标」完全一致。**要点：**这一条极重要，它是「对药组方」** ✓✓","o":"RJ-1969 · 《人纪·神农本草经》上经第三十一味，讲解（PDF 第 145 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"左胁痛与右胁痛","c":"原文引汪昂「**凡胁痛，多属肝旺，宜小柴胡汤；加青皮川芎白芍，左胁痛宜治活血行气，右胁痛宜消食行痰；因胁痛须开郁，故加柴胡则皆宜也。**」\n\n**【极精】左胁痛 vs 右胁痛**\n\n| 侧 | 治 |\n|---|---|\n| **左** | **活血行气（左属血）** |\n| **右** | **消食行痰（右是胆）** |\n\n**「左边是血，右边是胆」——「这是最精的左右分治。」**要点：**这一条极精，它是「同证异位异治」** ✓✓","o":"RJ-1970 · 《人纪·神农本草经》上经第三十一味，原文引汪昂（PDF 第 143 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"麦门冬的本草条目","c":"【本经原文】「**味甘平，主心腹结气，伤中伤饱，胃络脉绝羸瘦短气；久服轻身不老，不饥。**」【产地】「**生山谷肥地，我国陕西及江浙一带多有之；叶绿，四季不凋，根黄白色，入药。**」【性味】「**味甘性寒，无毒。**」【主治】「**麦冬为润肺清火要药，主治肺中伏火，痰多，心腹结气，肺弱胃弱，津少口渴，止咳嗽，疗肺病吐脓血。**」【别录】「**疗身重目黄，心下支满，虚劳客热，口干燥渴，止呕吐，愈痿躄，强阴益精，消谷调中，保神定肺气，定五脏，令人肥健，美颜色，有子。**」【元素】「**治肺中伏火，补心气不足，主血妄行，及经水枯，乳汁不下。**」【灵胎】「**补土生金，寒咳勿用。**」【用量】「**普通一钱至三钱。**」【禁忌】「**麦冬性寒，虽主脾胃而虚寒泄泻及痘疮虚寒作泻，产后虚寒作泻均忌；入补药，酒浸良。**」\n\n**【极重要】麦门冬的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/寒/无毒** |\n| **主治** | **润肺清火/肺中伏火/津少口渴** |\n| **禁** | **虚寒泄泻/寒咳** |\n\n**「麦冬甘寒润肺，天冬苦平清虚热」** ✓✓","o":"RJ-1971 · 《人纪·神农本草经》上经第三十二味「麦门冬」，原文（PDF 第 146 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"麦门冬汤三征","c":"讲义讲「一个极重要的绝对处方」：「**我们在经方使用的话，常常就是干咳，病人咳嗽、没痰，嘴巴很干——麦门冬汤。****已经讲完了、处方已经开完了；因为是这个绝对处方，所以你不需要考虑，直接开给她就好了。****你只要听到她讲的：干咳、嘴巴里面口渴、很干燥，舌头伸出来黄腻、黄黄、干干的，都可以使用麦门冬汤。所以中医是辨症论治。**」\n\n**【极重要】麦门冬汤三征**\n\n```\n① 干咳（无痰）\n② 口渴/口干\n③ 舌苔黄腻/干\n```\n\n**「干咳、口渴、舌苔黄干，就是麦门冬汤」——「须强标：须规范诊治。」**要点：**须「强「标」**：**「①肺癌/肺结核/肺气肿须规范诊治；②『不管西医诊断』是误导（延误可致危险）；③麦门冬汤只适合阴虚燥咳证」** ✓✓","o":"RJ-1972 · 《人纪·神农本草经》上经第三十二味，讲解（PDF 第 147 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"不能看化验单开药","c":"讲义讲「一个极重要的批评」：「**现在外面的中医，可能看到西医检验报告再开处方：什么三酸油脂比较高、开个什么药给你；胆固醇比较高、开个什么药给你。****这就不对了，这根本就是妖怪，不是这个、我不知道他是怎么开的。****因为病人在前面，你是找医生还是找魔？你是找神还是找魔？**」\n\n**【极重要】不能看化验单开药**\n\n```\n辨\"证\" → 开方\n✗ 辨\"指标\" → 开方\n```\n\n**「看化验单开药，就是妖怪」——「这是最精的辨证原则。」**要点：**须「标」**：**「①现代中医须辨病 + 辨证结合（不可只凭症状）；②指标异常须规范评估（如血脂/血糖）；③血脂/血糖须按指南用药（他汀/降糖）」** ✓✓","o":"RJ-1973 · 《人纪·神农本草经》上经第三十二味，讲解（PDF 第 147 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"眼诊三圈","c":"讲义讲「一个极精的眼诊」：「**在看瞳孔的时候、瞳孔是黑的，我们中医是看肾脏。****我不管你是金头发蓝眼睛、黑头发褐色眼睛，都无所谓；瞳孔都是黑的，这是肾脏。****那什么东西可以治水？土是不是可以治水——我们去筑堤防，为什么？就治水。****所以瞳孔旁边这一圈，就是我们的脾脏的地方。****那再外面这一圈，很密、像木头一样排起来；什么可以治土？是不是木可以克土。****所以这个土能治水，这眼睛这三圈，瞳孔这三圈就看完了。**」\n\n**【极重要】眼诊三圈**\n\n| 圈 | 脏 | 五行 |\n|---|---|---|\n| **瞳孔（黑）** | **肾** | **水** |\n| **瞳旁（黄）** | **脾** | **土（治水）** |\n| **外圈（密如木）** | **肝** | **木（克土）** |\n| **白（眼白）** | **肺** | **金** |\n\n**「瞳孔黑是肾，瞳旁黄是脾，外圈密是肝」——「须强标：这是中医理论。」**要点：**须「强「标」**：**「①眼诊三圈是中医理论；②眼黄须查肝功/胆红素/溶血/胰头；③不可只凭眼诊判病」** ✓✓","o":"RJ-1974 · 《人纪·神农本草经》上经第三十二味，讲解（PDF 第 147 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"烤面包就是肺热","c":"讲义讲「一个极精的生活比喻」：「**那白的部分，这个白的部分、阴阳五行白的不就是入肺吗？****结果你现在一看，他肺里面有黄——你把那个白的面包去烤一烤、白面团有没有？它烤出来都是黄的，这里面太热了。****所以中医的生理学，跟我们日常生活的习惯完全是一样的，很明确地摆在你前面；他的眼睛黄，当然可以用麦门冬汤了。**」\n\n**【极精】烤面包 = 肺热**\n\n```\n白面团 → 烤 → 变黄\n  = 肺（白）有热 → 眼白变黄\n```\n\n**「白面包烤出来都是黄的，就是里面有热」——「这是最精的生活化比喻。」**要点：**这一条极精，它是「烤色= 热」** ✓✓","o":"RJ-1975 · 《人纪·神农本草经》上经第三十二味，讲解（PDF 第 147 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"独活的本草条目","c":"【本经原文】「**味苦平，主风寒所击，金疮止痛，贲豚，痫痓，女子疝瘕；久服轻身耐老。****此药有风花不动，无风独摇。**」【产地】「**产我国四川陕西甘肃，或云产西羌者名羌活；独活根老而气细，羌活根嫩而气雄。**」【性味】「**味辛苦，性温，无毒。**」【主治】「**独活为风痛要药，主治头痛身痛脚痛，机关不利，风湿诸痹。**」【别录】「**疗诸贼风，百节痛风，无问久新。**」【甄权】「**治诸中风湿冷，奔喘气逆，皮肤苦痒，手足挛痛，劳损风毒齿痛。**」【好古】「**去肾间风邪，搜肝风，泻肝气，治项强，腰脊痛。**」【用量】「**普通一钱至三钱。**」【禁忌】「**凡血虚发痉、血虚头痛，及遍身疼痛、骨痛，因而带寒热者，均属内症，均忌；误用必反剧。**」【容川】「**色黑，故兼入少阴经，以达太阳，能散背脊之风寒；同天麻与白头翁皆有风不动、无风而动。**」\n\n**【极重要】独活的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛苦/温/无毒** |\n| **主治** | **风痛要药/头身脚痛/关节不利** |\n| **禁** | **血虚发痉/血虚头痛（均属内症）** |\n\n**「独活根老气细，羌活根嫩气雄」——「这是最精的同源异用。」** ✓✓","o":"RJ-1976 · 《人纪·神农本草经》上经第三十三味「独活」，原文（PDF 第 148 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"风花不动，无风独摇","c":"原文「**此药有风花不动，无风独摇。**」讲义：「**那怎么知道它是祛风的药？这个我们有好几味药：风吹它的时候它不动，这个本草本身它不会动；没有风吹的时候它才会动。****『老师，这个草药它是个神经病』——这个中医就看它的物性：这风吹它不会动、没有风了它开始动，跟风一般的风性是相反的，那入药、入祛风的药。****像我们过去有天麻、白头翁，都是风动它不动，都是同样的性质。**」\n\n**【极重要】风花不动，无风独摇**\n\n```\n风吹它不动 + 无风它自己摇\n  → 与风性相反 → 祛风药\n```\n\n**「风吹不动、无风自摇，就拿来祛风」——「这是最精的物性取药。」**要点：**这一条极重要，它是「反其性而用」** ✓✓\n\n**极重要！！\"风「痛= 游走性的痛（≠痛风）\"** ✅✅\n- **\"这里讲的风痛你不要把它误解为痛风——痛风这是西医的名词；我们讲风痛，风痛就是游走性的痛\"** ✓✓\n- **\"所谓风就是动症、肌肉跳动，或者是关节痛，你的痛在移动性的\"** ✓✓\n- **\"比如说我今天左肩痛、明天右肩痛、后天是膝盖痛；医生不懂啊、就骂病人『你这个神经病啊』\"** ✓✓\n- **\"病人就告诉你『我就是风痛』\"** ✓✓\n\n**【极重要】\"风「痛 = 游走性痛\"** ✅✅\n\n**极精！！\"辛 + 「苦 = 祛风\"** ✅✅\n- **\"辛味的药它能够散、能够润、能够散风；苦味的药能够坚、能够泻、能够泻风\"** ✓✓\n- **\"所以它能够祛风，就是因为它不但能够泻、同时能够散\"** ✓✓","o":"RJ-1977 · 《人纪·神农本草经》上经第三十三味，原文及讲解（PDF 第 148–149 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"独活适实痛，不适虚痛","c":"讲义讲「一个极重要的分型」：「**【禁忌】我们有两种痛：一种是实痛、一种是虚痛；这个独活比较适合用在实痛、不适合用在虚痛上面。****因为它收风走表，表就是风吹，那就是实痛。****实痛是它痛来的比较强；虚痛来得隐隐作痛、有一种钝痛。****实痛是一般你帮他按摩、越按越痛，他不喜欢你按摩、不能碰；虚痛是你越按越舒服。**」\n\n**【极精】实痛拒按 vs 虚痛喜按**\n\n| 痛 | 按 |\n|---|---|\n| **实痛** | **越按越痛（拒按）** |\n| **虚痛** | **越按越舒服（喜按）** |\n\n**「按了舒服是虚，按了更痛是实」——「这条与 n161喜按为虚、拒按为实」完全一致。**要点：**这一条极精，它是「触诊定虚实」** ✓✓","o":"RJ-1978 · 《人纪·神农本草经》上经第三十三味，讲解（PDF 第 150 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"车前子的本草条目","c":"【本经原文】「**味甘寒，无毒，主气癃，止痛，利水道小便，除湿痹；久服轻身耐老；因喜在牛迹中生，故又名当道也。**」【产地】「**产泽野及路旁，处处有之；自地下生叶，从叶中抽茎，长数寸，多子。**」【性味】「**味甘，性寒，无毒。**」【主治】「**车前子为行水泄热要药，主利小便，通淋沥，清肺肝风热，渗膀胱湿热，强阴益精明目。**」【别录】「**男子伤中，女子淋沥不欲食，养肺，强阴益精，令人有子，明目疗赤痛。**」【甄权】「**去风毒，肝中风热，毒风冲眼，赤痛障翳，脑痛泪出，压丹石毒，去心胸烦热。**」【灵胎】「**专利小便。**」【用量】「**普通钱半至三钱。**」【禁忌】「**内伤劳倦，阳气下陷者忌；肾气虚脱者忌与淡渗药同用。**」【吴克潜】「**车前子能利水道而不走真气，与茯苓同功；治暑湿暴下，则泌别清浊，使小便利而泄泻自止；治五淋则渗泄湿热，使从小便下而淋自止；且以通为补，车前尤能强肾益精。**」\n\n**【极重要】车前子的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/寒/无毒** |\n| **主治** | **行水泄热/利小便/渗膀胱湿热** |\n| **禁** | **内伤劳倦/阳气下陷** |\n\n**「喜在牛迹中生，故又名当道」——「名字来自生长地。」** ✓✓","o":"RJ-1979 · 《人纪·神农本草经》上经第三十四味「车前子」，原文（PDF 第 150 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"车前子长在牛粪里","c":"讲义讲「一个极生动的名字来源」：「**你知道为什么叫车前子？因为这个植物很好玩，它就喜欢长在牛粪里面。****以前都是牛在拉车，牛在拉车、也是一边排大便；一坨一坨在马上路就一坨一坨，以前不是现在的马路、都是泥土。****它就开始长、长个车前草；它在车的前面、你眼睛看到前面都是，路上前面。****车不是只有你一头牛、有一票牛；前面的牛大了大便、长了出来——是车前你可以看到。****所以我们以前采药的师傅，就专门找牛粪里，一把都是车前草。**」\n\n**【极精】车前子 = 长在牛粪里**\n\n```\n牛粪 → 车前草长\n  → 在车前面 → 车前\n```\n\n**「长在牛粪里，在车前面，所以叫车前」——「这是最生动的命名学。」**要点：**这一条极精，它与 n181「不要记名称，只记味道」形成对照（这一个是名字有来历）** ✓✓","o":"RJ-1980 · 《人纪·神农本草经》上经第三十四味，讲解（PDF 第 150–151 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"利水道而不走真气","c":"原文【吴克潜】「**车前子能利水道而不走真气，与茯苓同功；治暑湿暴下，则泌别清浊，使小便利而泄泻自止；治五淋则渗泄湿热，使从小便下而淋自止；且以通为补，车前尤能强肾益精。**」\n\n**【极重要】利水道而不走真气**\n\n```\n车前子 → 利水（不伤正）\n  → 与茯苓同功\n```\n\n**「利水道而不走真气，与茯苓同功」——「这条与 n195以通为补」、n194「利小便=实大便」完全一致。**要点：**须「标」**：**「『车前子强肾益精』无依据（车前子是利尿药，不是补肾药）」** ✓✓","o":"RJ-1981 · 《人纪·神农本草经》上经第三十四味，原文引吴克潜（PDF 第 150 页）。"},{"t":"神农本草经·上经：柴胡（续）、麦门冬、独活、车前子","h":"利尿剂不要常吃","c":"讲义讲「一个极精的提醒」：「**你只要记得甘味的寒味的，都可以常常当饭吃；但是你没事这种利尿剂你不要吃。****因为你很好、你把它吃了、你小便——我刚刚讲你小便小太多、肾气就不固。****我们为什么去、你看我们常常写问诊单，比如说我们说一个人一天 5 次到 7 次小便。**」\n\n**【极精】利尿剂不要常吃**\n\n```\n利尿太过 → 肾气不固\n正常：一天 5–7 次小便\n```\n\n**「小便太多，肾气就不固」——「这条与 n157三皇穴=水道」同一体。**要点：**这一条极精，它是「正常频率的参照」** ✓✓","o":"RJ-1982 · 《人纪·神农本草经》上经第三十四味，讲解（PDF 第 151 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"木香的本草条目","c":"【本经原文】「**味辛。主邪气，辟毒疫温鬼，强志，主淋露，久服不梦寤魇寐。**」【产地】「**我国云南贵州两广皆出产，其根外面灰黄，内部灰白，有香气入药。**」【性味】「**味辛苦，性温无毒。**」【主治】「**木香为开胃调气要药，功能行三焦之气，宣扬肠胃之滞，主治心腹诸痛呕吐泄泻，消痞积，辟邪气。**」【甄权】「**九种心痛，积年冷气，痃症块，胀痛，壅气上冲，烦闷羸劣，女人血气刺心，痛不可忍，末酒服之。**」【元素】「**散滞气，调诸气，和胃气，泄肺气。**」【丹溪】「**行肝经气，煨熟实大肠。**」【好古】「**治冲脉为病，逆气里急，主浮，渗小便秘。**」【灵胎】「**辟邪逐疫。**」【用量】「**普通五分至二钱。**」【禁忌】「**肺虚有热，元气虚脱，及阴虚内热，诸病有热，心痛属火，均忌。**」\n\n**【极重要】木香的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛苦/温/无毒** |\n| **主治** | **开胃调气/行三焦之气/宣肠胃之滞** |\n| **禁** | **一切热症（虚热实热）/元气虚脱** |\n\n**「木香是开胃调气的要药，专行三焦之气」** ✓✓","o":"RJ-1983 · 《人纪·神农本草经》上经第三十五味「木香」，原文（PDF 第 152–153 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"气就是动能","c":"讲义讲「一个极精的定义」：「**所谓气就是一个动能，比如说我们一呼、胃蠕动两次，一吸胃动两次，这就是气，气就在动，从你的呼吸里就可以看到。****有人呼吸，吸了半天肠胃没有动、怎么冷冰冰的冰块一样在边，这时候我们可以用木香可以让它行气。****气就是它的动能，可以让它回来。**」\n\n**【极重要】气就是动能**\n\n```\n一呼胃蠕动两次 + 一吸胃动两次 = 气\n吸半天肠胃不动（冷如冰）\n  → 木香（行气）\n```\n\n**「气就是动能，从呼吸里就能看到胃在不在动」——「这是最精的『气』的定义。」**要点：**须「强「标」**：**「胃肠蠕动迟缓须排除①糖尿病胃轻瘫；②甲减；③药物（抗胆碱能/阿片）；④电解质；⑤器质性」** ✓✓","o":"RJ-1984 · 《人纪·神农本草经》上经第三十五味，讲解（PDF 第 154 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"木香行气，白芍行血","c":"讲义讲「一个极精的分工」：「**我们在行下焦、肚子的问题，我们有常常使用的就是：行气我们会用什么？木香。****行血，如果血有堵塞到的时候我们会用白芍。****这个如果是血瘀到，比如说一个太太来找你：『哎呀我这个子宫月经痛，很痛，每次月经来会刺痛』——你不会用木香的、你会用白芍，有淤血、活血化瘀。****这个女的来了说『我膀胱会刺痛』——膀胱有没有被踢到、有没有被先生踢到？没有——木香是行气的，就这样分开来了。**」\n\n**【极精】木香行气 vs 白芍行血**\n\n| 痛 | 药 |\n|---|---|\n| **月经刺痛（瘀血）** | **白芍（活血化瘀）** |\n| **膀胱刺痛（无外伤）** | **木香（行气）** |\n\n**「同一个『刺痛』，一个行血一个行气」——「这是最精的辨痛定药。」**要点：**须「强「标」**：**「①经期剧痛须查子宫内膜异位症/肌瘤/腺肌症；②膀胱刺痛须查尿路感染/结石」** ✓✓","o":"RJ-1985 · 《人纪·神农本草经》上经第三十五味，讲解（PDF 第 154 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"舌苔看寒湿","c":"讲义讲「一个极简的判据」：「**你说『老师我们怎么依从』，就是我刚刚讲得很简单：只要有寒、呕吐，里面有寒有呕吐有气结住、食物不消化不消化的现象，都可以使用木香。****最明显的表症是你舌头伸出来我看看：一看舌头是白白湿湿的，寒湿就知道了。****我们的舌苔是看胃气；寒就是白、白色就是寒；所以你比较厚一点的就是湿，舌苔比较厚、黏黏的就是湿，白色的就是寒。****所以舌头上就可以看到寒湿的现象。**」\n\n**【极精】舌苔看寒湿**\n\n| 苔 | 判 |\n|---|---|\n| **白** | **寒** |\n| **厚/黏** | **湿** |\n| **白+厚黏** | **寒湿（木香）** |\n\n**「苔白是寒，苔厚黏是湿」——「这是最简的舌诊口诀。」**要点：**这一条极精，它与 n183「舌诊三段」同一体系** ✓✓","o":"RJ-1986 · 《人纪·神农本草经》上经第三十五味，讲解（PDF 第 155 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"热症一律不用木香","c":"讲义讲「一条铁律」：「**【禁忌】，你看『肺虚有热，元气虚脱』，一般来说阴虚内热、所有的热症，只要有出现热，不管是虚热、实热，木香都不要用。****木香都是用在寒湿、寒症上面，用的木香最多。**」\n\n**【极重要】热症一律不用木香**\n\n```\n木香（辛温）\n  → 只用于寒湿、寒症\n  → 虚热/实热 全忌\n```\n\n**「只要有热，虚热实热，木香都不要用」——「这是最硬的药性边界。」**要点：**这一条极重要，它与 n184「六淫主治」的药性对应完全一致** ✓✓","o":"RJ-1987 · 《人纪·神农本草经》上经第三十五味，讲解（PDF 第 155 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"辟邪逐疫的时代背景","c":"讲义讲「一个读古书的态度」：「**像【徐灵胎】说『辟邪逐疫』，就是讲的是我们为了是可以预防得到一些食物中毒的病，旅途中间使用的。****过去我们中国人、中医过去我们没有什么那个现在人的名词，所以它只能写辟邪逐疫。****你不要说这个讲话这样子不合科学性的，你要想到当时的时代背景。**」\n\n**【极精】读古书要看时代背景**\n\n```\n\"辟邪逐疫\"\n  = 当时没有\"细菌/病毒\"这些词\n  → 实质是预防食物中毒\n```\n\n**「不要说不合科学，要想到当时的时代背景」——「这是最精的读古书态度。」**要点：**这一条极精，它与 n133「《内经》72/73 篇阙亡」同一主题（文献学的诚实）** ✓✓","o":"RJ-1988 · 《人纪·神农本草经》上经第三十五味，讲解（PDF 第 155 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"病人说舒服就不要改处方","c":"讲义讲「一个极实用的原则」：「**如果病人有必要，他吃三钱哇吃的很好；病人在处方如果你改处方的时候，如果病人说『医生我吃的药很舒服』，你就不要改变、不要改处方继续用，不要去给他增加加减。****他吃的很舒服、吃的时候还有一点点还是不够，我们可以加重剂量。****病人只要吃的很好，你就不要改处方；你只要让他吃到感觉『哎老师医生我有什么不舒服了』，你再看看需不需要做加减，否则处方不要去动它。**」\n\n**【极精】病人说舒服就不要改处方**\n\n```\n有效且舒服 → 不改方\n还不够      → 只加剂量\n出现不适    → 才考虑加减\n```\n\n**「吃得舒服就不要动它」——「这是最精的守方原则。」**要点：**须「标」**：**「①疗效与舒适不等于安全（须定期查肝肾功能）；②长期用药须评估」** ✓✓","o":"RJ-1989 · 《人纪·神农本草经》上经第三十五味，讲解（PDF 第 156 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"寒才结住：热熨法","c":"讲义讲「一个极重要的结块逻辑」：「**中医认为寒才会结住，所以我们来治疗肿块、硬块的时候，我们常常用很多很热的药。****为什么？因为我们的观念：你会结到就好像冰块一样——为什么冰块？冷，冷就结到了。****所以你如果是结块的硬块、肿瘤的东西，我们寒凉的药下去的话，它就会结的更硬。****如果是结硬块的时候，我们用热药下去了以后，这硬块没有动、反而会增大，代表你的热力不够，可以倍之、加倍用它；还不够可以十倍用它。****如果说病人缩小了，你就不要变它。**」\n\n**【极重要】寒才结住**\n\n```\n寒 → 结（如冰）\n  寒凉药 → 结更硬\n  热药   → 硬块不动反而增大 = 热力不够 → 倍之/十倍\n  热药   → 缩小 = 有效 → 剂量不变\n```\n\n**「硬块像冰，冷就结、热就化」——「这是最精的结块模型。」**要点：**须「强「标」**：**「①肿块/硬块须先确诊（影像 + 活检）；②热熨不能代替手术/化疗；③『热力不够可十倍』是针对峻药的经验，不可自行加量」** ✓✓","o":"RJ-1990 · 《人纪·神农本草经》上经第三十五味，讲解（PDF 第 156–157 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"木香饼治乳房硬块","c":"原文【弘景】「**木香饼（生地木香作饼），热熨贴之，治结肿成核，消乳中结核酸痛等，均有灵效。**」讲义：「**像生地和木香两个把它做成饼、热熨；像乳房里面有硬块，这种乳房硬块都是没有破裂、没有爆发出来，就是在里面硬结在里面。****你可以用个生地——生地很粘稠——跟木香两个和在一起，打成做成、搅在一起把它做成饼放上去。****所谓热熨，就是用滚热的东西烫它；你如果想『老师我拿熨斗可不可以』——可以，很烫太烫了，你要隔很多层去烫它。**」\n\n**【极精】木香饼治乳房硬块**\n\n```\n生地（黏稠）+ 木香 → 作饼\n  → 热熨 → 消乳中结核酸痛\n```\n\n**「生地黏稠和木香做饼，热熨乳房硬块」——「须强标：乳房硬块必须先查。」**要点：**须「强「标」**：**「乳房硬块须先做超声/钼靶/活检排除乳癌；热熨不能代替」** ✓✓\n\n**极精！！\"热「熨只要热就好（不必拘器具）\"** ✅✓\n- **\"真正是温度在刺激木香跟生地，而不是说你一定要什么熨斗或一定要什么固定的器具，不需要，没有关系，只要热就好了\"** ✓✓\n- **\"热熨法非常好用\"** ✓✓\n\n**\"与 n198「寒才结住同一体！！\"** ✓✓","o":"RJ-1991 · 《人纪·神农本草经》上经第三十五味，原文引陶弘景及讲解（PDF 第 156 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"木香用在癌症","c":"讲义讲「一个临床范围」：「**【唐容川】就讲的很清楚，木香的理气，因为它香味归脾、脾本来就是主香味的；而味辛为金、得木气之温，所以说理这个三焦的气非常的好用。****我们临床上用在胃癌、大肠癌，用得很多；胰脏癌，我们都会用到木香。**」\n\n**【极精】木香用在癌症**\n\n```\n胃癌 / 大肠癌 / 胰脏癌\n  → 行气（寒湿气结）\n```\n\n**「胃癌、大肠癌、胰脏癌都用木香」——「须强标：这是辅助。」**要点：**须「强「标」**：**「癌症须规范治疗（手术/化疗/靶向/免疫）；木香只是对症辅助」** ✓✓\n\n**极精！！\"木「香五枝五节合脾之数\"** ✅✓\n- **\"【容川】……茎是五枝五节，合于脾之数\"** ✓✓\n- **\"其气浮味沉，能理上中下三焦\"** ✓✓\n\n**【极精】\"五「枝五节 = 脾之数（土数5）\"** ✅✓","o":"RJ-1992 · 《人纪·神农本草经》上经第三十五味，讲解（PDF 第 157 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"署豫（山药）的本草条目","c":"【本经原文】「**味甘温，主伤中，补虚羸，除寒热邪气，补中，益气力，长肌肉；久服耳目聪明，轻身不饥，延年。又名薯豫，又名山药，今名淮山。**」【产地】「**产河南及浙江等地，他处亦多有之；为山野自生之宿根蔓草，根入药。**」【性味】「**味甘性温平，无毒。**」【主治】「**署豫为补虚扶弱要药，主益肺脾，清虚热，治虚羸，长肌肉，补心益肾，疗健忘遗精，生捣敷痈疮，消肿硬。**」【别录】「**主头面游风，头风眼眩，下气，止腰痛，治虚劳羸瘦，充五脏，除烦热。**」【甄权】「**补五劳七伤，去冷风，镇心神，安魂魄，补心气不足，开达心孔多记事。**」【大明】「**强筋骨，主泄精健忘。**」【丹溪】「**生捣贴肿硬毒能消散。**」【用量】「**普通钱半至三钱。**」【禁忌】「**恶甘遂，不宜与面同食。**」【容川】「**味甘有液，得土之湿气，功能补脾阴即补脾之水以补湿；因其色白，得土中之金气，故有益肺之功；带酸之性故兼入肝肺。**」\n\n**【极重要】署豫（山药）的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/温平/无毒** |\n| **主治** | **补虚扶弱/益肺脾/长肌肉/补心益肾** |\n| **禁** | **恶甘遂/不宜与面同食** |\n\n**「补虚羸、长肌肉，是山药的第一功用」** ✓✓","o":"RJ-1993 · 《人纪·神农本草经》上经第三十六味「署豫」，原文（PDF 第 158 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"色白入肺，味甘入脾","c":"讲义讲「一个极精的推理」：「**它最主要的能够补虚羸，个人比较虚弱的人、羸瘦的人通通可以；补中益气、能够让肌肉长出来，平常就可以多吃。****像由于它色白、它的颜色是白的，味道是甘的；甘的是入脾脏，任何味道甘饴的通通入脾脏、通通能够长肌肉。****它又是色白，是不是入肺？所以它润肺。****它能够、这个对皮肤很好——肺主皮毛。**」\n\n**【极精】色白入肺，味甘入脾**\n\n```\n色白 → 入肺 → 润肺 → 皮肤好（肺主皮毛）\n味甘 → 入脾 → 长肌肉\n```\n\n**「甘入脾长肌肉，白入肺润皮肤」——「这是最简的五行推理。」**要点：**这一条极精，它与 n181「五色之义」、n184「五行属性」完全一致** ✓✓\n\n**极精！！\"山「药可以当菜吃（菜场就有）\"** ✅✓\n- **\"你可以当菜吃，你有没有听过吃山药死掉的？没有吧；所以这就是中药好的地方，我们不但可以当食物，还可以入药\"** ✓✓\n- **\"平常没什么事就可以吃\"** ✓✓\n- **\"你到菜场，就可以看到很多山药……日本人也很喜欢吃\"** ✓✓\n\n**\"这是「极精的『药食同源』\"** ✅✓","o":"RJ-1994 · 《人纪·神农本草经》上经第三十六味，讲解（PDF 第 158–159 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"阴虚用阳药治","c":"讲义讲「一个极反直觉的治法」：「**主益肺、益脾，能够清虚热；你如果说光是你靠一味淮山来清它的虚热，力量比较笼统。****真的我们来治病的时候，病人出现的虚热，我们一定开补虚的药跟去热的药、开在一起，效果最大。****所以我们看到比如说这个人是阴虚的时候，我们会开阴——阴是虚的，你除了我们可以滋阴、一般来说我们滋阴就补些滋阴的药下去把阴给补回来。****阴虚，实际上，阴、我们用阳药去治它；虚就不用去救它，所以有时候我们不用阴虚的药、阴虚的症状我们不用滋阴的药，我们会用阳药跟补药进去，把它的阴虚症去掉。**」\n\n**【极重要】阴虚用阳药治**\n\n```\n阴虚 → 滋阴（常规）\n阴虚 + 虚（不用去救\"阴\"本身）\n  → 阳药 + 补药 → 阴虚自去\n```\n\n**「阴虚的时候，用阳药去治它」——「这是最反直觉的治则。」**要点：**须「强「标」**：**「①阴虚须辨具体（肝阴/肾阴/肺阴/胃阴）；②『不用滋阴药』不等于不滋阴；③阳药须防温燥伤阴（须专业辨证）」** ✓✓\n\n**极精！！\"六「味地黄丸里有淮山\"** ✅✓\n- **\"像经方里面的六味地黄丸，里面就有淮山，就有淮山\"** ✓✓\n- **\"这个专门补虚用的\"** ✓✓\n\n**\"与 n189「六味地黄丸有对应！！\"** ✓✓","o":"RJ-1995 · 《人纪·神农本草经》上经第三十六味，讲解（PDF 第 159 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"淮山的命名之乱","c":"讲义讲「一个极精的抱怨」：「**第三十六，署豫。我们平常很少写这个字，实际上，署豫就是什么？就是淮山，过去我们也称为山药。****这个产的地方在河南怀庆，旧的怀庆府产得最好、品质最好，所以它叫淮山药。****一开始我就跟诸位讲过，所以中药的名称一直在改，很讨厌，它就是淮山、淮山药。****实际上现在我们就讲淮山就可以了，或者你写山药，药房也一样。**」\n\n**【极精】淮山的命名之乱**\n\n| 名 | 说 |\n|---|---|\n| **署豫/薯豫** | 《本经》原名 |\n| **山药** | 通称 |\n| **淮山** | 河南怀庆产（怀庆府→淮） |\n\n**「中药的名字一直在改，很讨厌」——「这是最真实的文献学困境。」**要点：**这一条极精，它与 n196「真柴胡」、n197「药随医亡」同一主题（名实之辨）** ✓✓","o":"RJ-1996 · 《人纪·神农本草经》上经第三十六味，讲解（PDF 第 158 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"木香的预防用法","c":"讲义讲「一个极实用的场景」：「**过去做生意的人，常常在旅行旅途中间，到了云南、贵州瘴疠这种之地的时候，容易得到肠胃方面的问题。****所以说常常怕旅途之间常常会有这个因为吃到食物不干净而产生的呕吐下痢，他们都会带些木香粉在身上，这是泡点水就吃下去。****也就是说以后你的病人如果问你、跟问你说『我可不可以旅行、我可不可以带点药预防这个吃坏肚子』——可以带点木香，你放进去就好了，做成粉、带在身上吃。**」\n\n**【极精】木香的预防用法**\n\n```\n旅行（瘴疠之地/饮食不洁）\n  → 带木香粉 → 泡水吃\n```\n\n**「出门带木香粉，预防吃坏肚子」——「这是最早的旅行药。」**要点：**须「标」**：**「①旅行腹泻首选ORS + 卫生；②细菌性须抗生素；③木香不能预防感染」** ✓✓\n\n**极精！！\"中「下焦+ 槟榔为使\"** ✅✓\n- **\"【吴克潜】木香调气定痛，功力甚佳，治中下二焦气结滞而不运，宜槟榔为使，故治痢疾腹痛，有木香槟榔丸之设也\"** ✓✓\n- **\"诸位看这个人，如果这是肋骨、这是肚脐、这是腹部；以肚脐这边这个区隔和肋骨这边区隔，这叫做下、中、上焦；木香是中下焦\"** ✓✓\n\n**【极精】\"木「香= 中下焦；槟榔为使\"** ✅✓","o":"RJ-1997 · 《人纪·神农本草经》上经第三十五味，讲解（PDF 第 154–155 页）。"},{"t":"神农本草经·上经：木香、署豫（山药）","h":"辛能横行","c":"讲义讲「一个极精的药性」：「**这个木香、味辛，它是辛香，非常的香。****辛味的药在这个地方我们看得很清楚，不单单是发散，辛能够润、能够发散。****还有辛能够怎么样？横行——这个要了解什么叫横行：这味药看得很清楚，因为它能行气、散郁。****所以我们如果肠胃只是肠胃发炎，你不见得用得到这味药；里面有寒、有结石，或有结到了，或有硬块在里面了，整个肠子不蠕动了、胃不蠕动了，我们用木香。**」\n\n**【极精】辛能横行**\n\n```\n辛 → 发散 + 润 + 横行（行气散郁）\n```\n\n**「辛不只发散，还能横行」——「这条与 n181五味之用（辛散润横行）」完全一致。**要点：**这一条极精，它是「辛的三重功能」** ✓✓","o":"RJ-1998 · 《人纪·神农本草经》上经第三十五味，讲解（PDF 第 153 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"薏仁剂量要大","c":"讲义讲「一个极实用的剂量观」：「**我们这种味甘淡的药平常当食物用的；你如果说开个处方，我知道薏仁可以行水、能够去湿，薏仁三钱、可能就太轻。****吵着要吃：老师，五钱、八钱、一两、一两、二两都没有关系，一直加上去。****所以平常淮山的时候你可以吃，去随便怎么样煮菜；你真的要治病的时候，要大剂才有用——小剂的刷牙漱口可以，剂量用大的重的才有效。**」\n\n**【极精】薏仁剂量要大**\n\n```\n食用（当杂粮）→ 随意\n治病          → 大剂（一两起）\n小剂          → 只能「刷牙漱口」\n```\n\n**「小剂只能刷牙漱口，大剂才治病」——「这是最狠的剂量分寸。」**要点：**须「标」**：**「①薏仁长期大量可能影响电解质；②孕期/肾功不全须评估；③『大剂才有效』不等于越多越好」** ✓✓","o":"RJ-1999 · 《人纪·神农本草经》上经第三十七味「薏苡仁」，讲解（PDF 第 160–161 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"孕妇不忌薏仁","c":"讲义讲「一个极重要的纠正」：「**【禁忌】，薏仁的禁忌，它说大便燥结、因寒转筋，及孕妇忌；其实，孕妇要不要忌？不要忌、不要忌。****本经上面说的有的时候不见得是很正确的。****如果怀孕的妇女她本身湿很盛、由于积水、怀孕、水肿、胃口也不是很好；你用薏仁，同时可以利水又可以去湿，怎么会要禁忌，这个想不通。****一般来说怀孕的孕妇，禁忌的药都是能够活血化瘀的药、能够排淤血的药，大部分要禁掉。****像我们红花、丹皮、三菱、莪术，都是活血化瘀的药、攻坚的药；结果你在怀孕的时候猛吃这种药，当然会流产啦。**」\n\n**【极重要】孕妇不忌薏仁**\n\n```\n孕妇禁 = 活血化瘀/攻坚药\n  （红花/丹皮/三棱/莪术）\n薏仁 ≠ 活血化瘀 → 不忌\n```\n\n**「孕妇忌的是活血化瘀，不是薏仁」——「这是最精的禁忌逻辑。」**要点：**须「强「标」**：**「①传统与现代药典多把薏苡仁列为孕妇慎用（兴奋子宫的体外数据）；②『不忌』不等于可大量长期服；③孕期用药须产科评估」** ✓✓","o":"RJ-2000 · 《人纪·神农本草经》上经第三十七味，讲解（PDF 第 161 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"寒证抽筋不能用薏仁","c":"讲义讲「一个极重要的鉴别」：「**我们只有寒症的时候，才没办法用。****我看过严重的人，每天晚上睡觉的时候，这个脚整个抽起来、整个拉，拉硬要把它扯直，它都抽不起来。****这是寒，非常的冰冷，下半身整个是冰的。****这个时候你说『这个筋拘的时候，我们得甘则缓』——你用个薏仁、这个什么麦芽糖下去还是抽筋，也没有用，因为它是寒极。****寒的症出现的时候非常的痛，抽起来的时候整个筋拉得很紧、整个脚弯了起来，等于是弓到的、脚贴到屁股睡觉的。****这个时候你必须要用很热的药下去才有用；你开这个薏仁，力量就不够，你开一两二两，吃了好凉好凉，还是抽。**」\n\n**【极重要】寒证抽筋 → 须大热**\n\n```\n热症抽筋（风热）→ 薏仁\n寒证抽筋（冰冷弓身）→ 大热药（薏仁/麦芽糖无用）\n```\n\n**「脚贴到屁股睡觉的抽筋，是寒极，必须用热药」——「这是最精的寒热鉴别。」**要点：**须「强「标」**：**「①夜间腿抽筋须排除电解质（镁/钙/钾）、甲状旁腺、糖尿病、药物（利尿/他汀/β2）；②持续抽搐须排除神经系统病」** ✓✓","o":"RJ-2001 · 《人纪·神农本草经》上经第三十七味，讲解（PDF 第 161 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"薏仁去油","c":"讲义讲「一个生活化的用法」：「**这个薏仁因为去湿、它甘淡渗利、去湿很好，还可以去油。****所以很多人皮肤上生点油，比如在脖子这边、领子，夏天这个领子遮到这边、这个最潮湿的地方再这一带；你没事吃吃薏仁，能够把油去掉。****薏仁，它能够去湿；你加上绿豆、你再加些糖、跟这个蔗糖，是不是很好的药。**」\n\n**【极精】薏仁去油**\n\n```\n甘淡渗利 → 去湿 → 去油\n（脖子/领口最潮处）\n```\n\n**「脖子一带最潮最油，吃薏仁能去油」——「这是最生活化的用法。」**要点：**这一条极精，它与 n184「甘淡利湿」同一体** ✓✓","o":"RJ-2002 · 《人纪·神农本草经》上经第三十七味，讲解（PDF 第 161–162 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"泽泻的本草条目","c":"【本经原文】「**味甘寒，主风寒湿痹，乳难消水，养五脏，益气力，肥健；久服耳目聪明，不饥延年，轻身，面生光，能行水上。**」【产地】「**产我国福建陕西河南山东等地，生于水泽池沼，根作圆球形，色黄，入药。**」【性味】「**味甘咸，性寒无毒。**」【主治】「**泽泻为渗湿利尿要药，主风寒湿痹，逐膀胱三焦停水，通淋沥，止遗泄，利小便，消肿胀。**」【别录】「**补虚损，五脏痞满，起阴气，止泄精，消渴，淋沥，逐膀胱三焦停水。**」【元素】「**入肾经，去旧水，养新水，利小便，消肿胀，渗泄止渴。**」【药征】「**主治小便不利冒眩也，旁治渴。**」【灵胎】「**消水利肿。**」【用量】「**普通一钱至三钱。**」【禁忌】「**凡病人无湿无饮而阴虚，及肾气乏绝、阳衰精自流出、肾气不固、精滑目痛、虚寒作泄等候，均忌。**」\n\n**【极重要】泽泻的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘咸/寒/无毒** |\n| **主治** | **渗湿利尿/逐膀胱三焦停水/消肿** |\n| **禁** | **阴虚无湿/肾气乏绝** |\n\n**「逐膀胱三焦停水，是泽泻最准的定位」** ✓✓","o":"RJ-2003 · 《人纪·神农本草经》上经第三十八味「泽泻」，原文（PDF 第 162 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"阴虚与阳虚的面色","c":"讲义讲「一个极精的望诊分型」：「**泽泻这个药病人是阴虚的，比较忌用；像薏仁阴虚的用很好，因为薏仁能够滋阴。****所以如果是水肿、是阳虚的、阳虚得水肿，小便不利，阳虚的水肿，我们都可以使用泽泻。****简单的分别，有时候病人比方说『我全身积水了』——阴虚的人一定会出现阳症，眼睛一看，脸红红的，这是阴虚。****阳虚的人脸暗暗的、黑黑暗暗的、淡淡的，也没有什么人的颜色、都是暗色，它是阳虚，眼睛一看就知道。**」\n\n**【极重要】阴虚 vs 阳虚的面色**\n\n| 型 | 面 | 机制 |\n|---|---|---|\n| **阴虚** | **脸红（阳症）** | **里阳外走（危）** |\n| **阳虚** | **脸暗/淡** | **阴跑出来** |\n\n**「阴虚出现阳症，阳虚出现阴症」——「这是最精的一看就知。」**要点：**这一条极重要，它与 n143「阴虚眼花、阳虚看不见」互为镜像** ✓✓","o":"RJ-2004 · 《人纪·神农本草经》上经第三十八味，讲解（PDF 第 163 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"去旧水养新水","c":"讲义讲「一个极重要的机制」：「**【元素】它能够入肾经，能够把去旧水养新水，利小便，消肿胀。****有的时候你看到它『老师这个利尿剂为什么会止渴？』因为它把你旧水排掉、你新水自然而然生出来。****我们要明目，中医的观念里面是不是水生木，木讲得就是肝；陈水不能生木、陈旧的水不能生木，一定是新水。****旧的要去掉、新的才来；所以说真正的新陈代谢的意思：你要把旧的排掉，新的才会产生。****你看一个泽泻，它可以明目，是因为它能够去旧水。**」\n\n**【极重要】去旧水养新水**\n\n```\n旧水（陈水）→ 排 → 新水才生\n水生木 → 明目\n```\n\n**「旧的排掉，新的才来，这就是新陈代谢」——「这是最精的古典版。」**要点：**这一条极重要，它与 n188「旧水=坏水」同一体** ✓✓","o":"RJ-2005 · 《人纪·神农本草经》上经第三十八味，讲解（PDF 第 164 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"眼皮跳是陈水","c":"讲义讲「一个极精的判据」：「**诸位你怎么知道身上有陈水？有的时候你说『老师我脚也没有积水、我身上也没有积水，我怎么知道我身上有多余的水？』****水有时候、老师你看，我眼皮在跳——我们这个下眼跳福、什么祸什么不是；在中医的观念里面认为说这是水，水在皮下面才会跳动、肌肉在膶动。****你如果说是用天纪我们给人家算命：眼皮、上下左右、祸福什么，是算命的看法；中医的看法认为说里面有陈水就会有这种现象。**」\n\n**【极精】眼皮跳 = 陈水**\n\n```\n眼皮跳/肌肉瞤动\n  → 皮下有陈水 → 泽泻\n```\n\n**「水在皮下才会跳」——「须标：更常见于疲劳与镁缺乏。」**要点：**须「标」**：**「眼皮跳更常见于①疲劳/睡眠不足；②咖啡因；③镁/钙缺乏；④干眼/视疲劳；⑤面肌痉挛（须排除神经病）」** ✓✓","o":"RJ-2006 · 《人纪·神农本草经》上经第三十八味，讲解（PDF 第 165 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"眩冒是肾气的分级","c":"讲义讲「一个极重要的预后」：「**【药征】，日本的经方家写的一本药书，它说主治小便不利冒眩也，旁治渴。****这个水严重的时候，病人会有冥眩；为什么？因为肾气从后面直达到脑部去。****当你的水气很盛、没有办法排出去的时候，会影响到脑部，病人会冥眩的。****所以肾脏功能越差的时候，开始昏眩的现象就越严重。****当昏眩到已经不能站起来了、在呕吐了，这等于肾脏已经几乎接近衰竭了，要开始洗肾了。**」\n\n**【极重要】眩冒 = 肾气的分级**\n\n```\n昏眩轻 → 肾功差\n昏眩重（不能站+呕吐）\n  → 近衰竭（要洗肾）\n```\n\n**「昏眩到不能站、还呕吐，就是快洗肾了」——「这是最硬的预后分级。」**要点：**须「强「标」**：**「头晕 + 呕吐 + 不能站→须立即急诊（可为卒中/心源性/肾衰/电解质）；不可只用泽泻」** ✓✓","o":"RJ-2007 · 《人纪·神农本草经》上经第三十八味，讲解（PDF 第 164 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"泽泻双刃","c":"讲义讲「一个极重要的双刃」：「**小便得很多、利得很多，肾气就会虚掉，所以人会昏幕、眼睛看不清楚。****所以我们吃泽泻、之所以泽泻能够明目，是因为它能够渗湿。****如果已中病而用之过量，则诛伐无过，使肾气虚而昏目。****药本在治病救偏，过量则害，百药皆然，岂独泽泻而已。**」\n\n**【极精】泽泻双刃**\n\n```\n适量 → 去陈水 → 明目\n过量 → 肾气虚 → 昏目\n```\n\n**「过量则害，百药皆然」——「这是全册最精的警句。」**要点：**这一条极精，它是「剂量的第一原则」** ✓✓","o":"RJ-2008 · 《人纪·神农本草经》上经第三十八味，原文引王海藏及讲解（PDF 第 164 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"治水三方","c":"原文「**著名方剂有疏凿饮（泽泻商陆赤小豆羌活大腹皮椒目木通秦艽茯苓槟榔生姜）治水气通身浮肿、烦燥喘渴、小便不利。****泽泻汤（泽泻五两白术二两）治心下有支饮、其人苦冒眩者。****五苓散（茯苓猪苓白术泽泻肉桂）治水分有热、小便不利、烦渴或水饮内停、脐下悸者。**」\n\n**【极重要】治水三方**\n\n| 方 | 主 |\n|---|---|\n| **疏凿饮** | **通身浮肿** |\n| **泽泻汤** | **支饮冒眩** |\n| **五苓散** | **水分有热/烦渴/脐下悸** |\n\n**「全身水肿用疏凿饮，冒眩用泽泻汤，脐下悸用五苓散」——「这是三方三层。」**要点：**这一条极重要，它与 n197「五苓散」有对应** ✓✓\n\n**极精！！\"不「要自行配疏凿饮\"** ✅✅\n- **\"你看到这个方子里面他并没有写剂量，所以你不要自己回去配\"** ✓✓\n- **\"你知不知道个商陆是很强的药？你药性还没有了解、你自己比例还不知道，你就把他等量配出来，吃下去你就不得了啦\"** ✓✓\n\n**须「强「标」**：**「商陆（商陆皂苷）有毒，可致呕吐/腹泻/电解质紊乱；绝不可自行配方」** ✓✓","o":"RJ-2009 · 《人纪·神农本草经》上经第三十八味，原文（PDF 第 162–163 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"泽泻与薏仁","c":"讲义讲「一个极精的对比」：「**泽泻这个药跟刚刚薏仁的药不太一样：泽泻这个药病人是阴虚的，比较忌用。****像薏仁阴虚的用很好，因为薏仁能够滋阴，这是滋阴的药；泽泻，阴虚的人用不好。****所以说如果是水肿、是阳虚的、阳虚得水肿、小便不利、阳虚的水肿，我们都可以使用泽泻。**」\n\n**【极精】泽泻 vs 薏仁**\n\n| 药 | 阴虚 |\n|---|---|\n| **薏仁** | **可（能滋阴）** |\n| **泽泻** | **忌** |\n\n**「薏仁能滋阴，泽泻阴虚忌」——「这是最精的同类异用。」**要点：**这一条极精，它与 n199「阴虚vs阳虚」同一体** ✓✓","o":"RJ-2010 · 《人纪·神农本草经》上经第三十八味，讲解（PDF 第 163 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"远志的本草条目","c":"【本经原文】「**苦温，主咳逆伤中补不足，除邪气，利九窍，益智慧，耳目聪明不忘，强志倍力；久服轻身不老。**」【产地】「**产陕西河南，为山野自生之常绿草，其根入药。**」【性味】「**味甘苦性温无毒。**」【主治】「**远志为强心益智要药，功能治神虚怔忡，痰涎咳逆。**」【别录】「**利丈夫，定心气，止惊悸益精，去心下隔气，皮肤中热，面目黄。**」【之才】「**杀天雄附子乌头毒，煎汁饮之。**」【甄权】「**治健忘，安魂魄，令人不迷，坚壮阳道。**」【好古】「**肾积奔豚。**」【灵胎】「**补心通窍，益智除邪。**」【用量】「**普通八分至二三钱。**」【禁忌】「**凡心经有实火、为心家实热，应用黄连生地者禁，与参术等助阳气药物同用；畏珍珠藜芦，得茯苓良。**」【容川】「**其性与桂枝同，但桂枝四达，远志则系根体细瘦，故主入心经，以散心中之滞血；味苦亦入心，兼有辛温之性，故能补心火。**」\n\n**【极重要】远志的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦温（甘苦）** |\n| **主治** | **强心益智/神虚怔忡/痰涎咳逆** |\n| **禁** | **心经实火（黄连生地证）** |\n\n**「杀天雄附子乌头毒——远志还能解毒」** ✓✓","o":"RJ-2011 · 《人纪·神农本草经》上经第三十九味「远志」，原文（PDF 第 166 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"远志与桂枝","c":"原文【容川】「**其性与桂枝同，但桂枝四达，远志则系根体细瘦，故主入心经，以散心中之滞血。****味苦亦入心，兼有辛温之性，故能补心火。**」\n\n**【极精】远志 vs 桂枝**\n\n| 药 | 走 |\n|---|---|\n| **桂枝** | **四达** |\n| **远志** | **专入心（散心中滞血）** |\n\n**「桂枝四达，远志专入心」——「这是最精的同性异形。」**要点：**这一条极精，它与 n184「枝达四肢、根多补」同一体系** ✓✓","o":"RJ-2012 · 《人纪·神农本草经》上经第三十九味，原文引唐容川（PDF 第 166 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"远志强心益智","c":"讲义讲「一个极明确的定位」：「**远志这个药非常的妙；一般的中医呢，远志，这个智慧吗、增强记忆啊、长智慧。****远志可以定心宁心，不要太焦虑、紧张、不要太害怕，可以增长智慧、耳聪目明。****小孩子读书要读的很好、要耳聪目明，父母给他吃、让他远志，可以聪明一点、体力也会好。****身体虚弱，我们可以加点远志。**」\n\n**须「标」**：**「『远志提高智力』无RCT证据；儿童记忆/注意须排除①睡眠不足；②ADHD；③视力/听力；④缺铁/甲减」** ✓✓\n\n**极精！！\"怔「忡= 神虚\"** ✅✓\n- **\"【主治】远志为强心益智要药，功能治神虚怔忡，痰涎咳逆\"** ✓✓\n- **\"远志可以定心宁气，不要太焦虑、紧张、不要太害怕\"** ✓✓\n\n**【极精】\"怔「忡= 神虚（心悸）」** ✅✓","o":"RJ-2013 · 《人纪·神农本草经》上经第三十九味，讲解（PDF 第 166–167 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"泽泻的炮制","c":"原文【炮制】「**拣去杂质，大小分开，浸泡四小时，热天加少量明矾，冬天不用。捞出，沥干除水，用盐水喷洒，晒干，火烤使色现微黄色，取出，冷却即得。**」讲义：「**泽泻本身，它的【性味】有甘一点咸味在里面，因为我们在炮制泽泻的时候，我们会撒一点盐上去。****除了要增强它的药性以外，就是让它持久一点，都用点盐、在它有盐味；本身泽泻就有点咸味，我们在炮制的时候还会再加点盐。**」\n\n**【极精】泽泻的炮制**\n\n```\n浸泡 → 明矾（热天）→ 盐水喷 → 晒 → 火烤微黄\n  → 咸味入肾（引药下行/增效）\n```\n\n**「撒盐是为了增强药性、让它持久」——「这是最具体的炮制逻辑。」**要点：**这一条极精，它与 n188「炮制的目的」同一主题** ✓✓","o":"RJ-2014 · 《人纪·神农本草经》上经第三十八味，原文炮制及讲解（PDF 第 163 页）。"},{"t":"神农本草经·上经：薏苡仁、泽泻、远志","h":"泽泻粉放汤里","c":"讲义讲「一个极实用的手法」：「**一般来说，我如果看到这个病人常常眼皮会跳、或者肌肉跳的时候，放一点泽泻粉在里面、和在个汤剂里面就可以了。****你如果说『老师我这个泽泻，我把这个炒青菜、我就盐巴我就不放了，我就用泽泻粉下去』——可以，带一点点咸味也不难吃。****平常泽泻你们可以常常吃，但是也不要吃太多。**」\n\n**【极精】泽泻粉放汤里**\n\n```\n眼皮跳/肌肉跳\n  → 泽泻粉 + 汤剂\n```\n\n**「眼皮跳就放一点泽泻粉」——「这是最轻的用法。」**要点：**须「标」**：**「①泽泻不宜长期大量（伤肾气）；②电解质须监测」** ✓✓","o":"RJ-2015 · 《人纪·神农本草经》上经第三十八味，讲解（PDF 第 165 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"附子的三个阶段","c":"讲义讲「一个极重要的药材常识」：「**这一株附子，因为他的根茎下面结到了、附在这个根茎上面，所以会叫附子，附在他的子上面。****三年生就是附子；如果三年你不采收、四年采收，就是乌头；如果四年不采收、五年采收，就是天雄。**」\n\n**【极重要】附子三阶段**\n\n```\n3 年 → 附子\n4 年 → 乌头\n5 年 → 天雄\n```\n\n**「同一株，三年是附子、四年是乌头、五年是天雄」——「这是最精的同株不同年。」**要点：**须「强「标」**：**「附子/乌头/天雄含乌头碱；0.2mg即可中毒、2–4mg可致死；必须炮制 + 先煎 + 专业处方，绝不可自行服」** ✓✓","o":"RJ-2016 · 《人纪·神农本草经》上经第三十九味「远志」，讲解（PDF 第 167 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"远志解乌头毒","c":"讲义讲「一个极重要的解毒」：「**这些统统是大热大毒的药；那你吃下去的话，病人伤到、会有后遗症的：伤到心脏，心脏会瓣膜闭锁不全；伤到心脏，心肌有问题，心脏会绞痛、心脏会空空的感觉。****因为病人会心里不舒服，代表中毒；弥补的方式就是远志。****单味的药，开个远志五钱，三碗水煮成一碗，吃个几包就好了。****那过去有的医家、有的医书说：天雄、乌头、这个毒、无解；其实有解，就是远志，因为他们不了解。**」\n\n**【极重要】远志解乌头毒**\n\n```\n乌头碱中毒（心脏）\n  → 远志（单味五钱）\n```\n\n**「天雄乌头之毒，解药就是远志」——「须强标：这是中医经验。」**要点：**须「强「标」**：**「①乌头碱中毒须立即急诊（心电监护 + 镁/胺碘酮/利多卡因）；②远志不能代替急救；③须查心肌酶/ECG」** ✓✓","o":"RJ-2017 · 《人纪·神农本草经》上经第三十九味，讲解（PDF 第 167 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"远志治心脏病","c":"讲义讲「一个极重要的扩展」：「**其实治心脏病很好用，我常常用远志把人家心脏病治好。****一般中医只知道增强记忆啊、宁神镇心啊、耳聪目明，小孩子可以；他不晓得远志可以治心脏病，所以是非常好的药。****我们只要听到心脏病人大部分人都睡觉睡的不是很好，我都会加远志下去；心里面闷闷的感觉，我们都会加远志下去，效果都非常的好。**」\n\n**【极重要】远志治心脏病**\n\n```\n心脏病 + 失眠/胸闷\n  → 远志\n```\n\n**「一般人只知道远志益智，不知道它能治心脏病」——「须强标：须规范诊治。」**要点：**须「强「标」**：**「心脏病须规范评估（ECG/心超/冠脉CTA/肌钙蛋白 + 药物/介入/手术）；远志只是辅助」** ✓✓","o":"RJ-2018 · 《人纪·神农本草经》上经第三十九味，讲解（PDF 第 167 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"心火不足与心火有余","c":"讲义讲「一个极精的心火分型」：「**【禁忌】，你凡是心经有实火、心家的实热、实火的时候，我们一般用黄连生地；因为心火太过、心火不足的时候，我们就会远志。****我们看，舌为心表；舌头伸出来，干燥、黄湿干燥，心家的实火，会有裂纹。****心的脉就会很壮，摸他就会，心脏的脉、左侧的脉就会非常的强硬。****心火很胜的时候，病人都会呈现燥热的症状，很热很烦很燥。****心火不足的时候，会恶寒、怕冷，脚都是冰冷的，大部分我们都可以用远志。**」\n\n**【极重要】心火不足 vs 有余**\n\n| 型 | 舌 | 脉 | 症 |\n|---|---|---|---|\n| **有余（实火）** | **干燥黄/裂纹** | **左寸强硬** | **燥热烦** |\n| **不足** | — | — | **恶寒/脚冰（用远志）** |\n\n**「舌为心表，舌有裂纹就是心家实火」——「这是最精的心火分型。」**要点：**这一条极重要，它与 n67「舌为心之苗」同一体** ✓✓","o":"RJ-2019 · 《人纪·神农本草经》上经第三十九味，讲解（PDF 第 167–168 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"龙胆草的本草条目","c":"【本经原文】「**味苦涩，主骨间寒热，惊痫邪气，续绝伤，定五脏，杀蛊毒；久服益智不忘，轻身耐老。**」【产地】「**山野自生之宿根草，其叶经霜雪不凋，根茎黑暗褐色入药。**」【性味】「**味甘涩，性大寒，无毒。**」【主治】「**龙胆草为涤邪火除湿热要药，功能健胃清热，治痢杀虫，主治肝火胆火胃火、下焦湿热。**」【东垣】「**退肝经邪热，除下焦湿热之肿，泻膀胱之火。**」【容川】「**味苦而坚涩，兼水火之性，故能泻肝胆之火；且龙胆草根多而深细，故泻火并兼降利，能清热以利少阳三焦与胆之火。**」【用量】「**普通五分至钱半。**」【禁忌】「**胃虚血少，脾胃两虚作泻，病虚有热均忌。**」**「龙胆草大苦大寒，所治多湿热之病……柴胡为主、龙胆为使，治目疾必用之药；因性大寒故不可久服，恐伤胃气。」**\n\n**【极重要】龙胆草的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦涩/大寒/无毒** |\n| **主治** | **肝火胆火胃火/下焦湿热** |\n| **禁** | **胃虚血少/脾胃两虚** |\n\n**「柴胡为主、龙胆为使，治目疾必用」** ✓✓","o":"RJ-2020 · 《人纪·神农本草经》上经第四十味「龙胆」，原文（PDF 第 168–169 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"大寒治重症，微寒可常服","c":"讲义讲「一个极重要的分层」：「**我们用药，大热大寒都是起重症的；重症的时候我们会需要，所以当你看到病人是热、是炎症的时候，你必须用大寒的药下去。****微寒常常可以当做刷牙漱口、当菜吃得；大寒不好、不行，治病的。****你不要没事『老师我要吃个龙胆草』，那过一个礼拜，你怎么那么冷、瘦的干干小小的；我们在外面热的要死，你穿个棉袄夹克过来上课。**」\n\n**【极重要】大寒治重症，微寒可常服**\n\n```\n微寒 → 可当菜吃（日常）\n大寒 → 只治重症（不可常服）\n```\n\n**「大寒吃多了，夏天也要穿棉袄」——「这条与 n196益母草微寒可当滋补」完全一致。**要点：**这一条极重要，它与 n183「十剂的分层」同一体** ✓✓","o":"RJ-2021 · 《人纪·神农本草经》上经第四十味，讲解（PDF 第 169 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"寒热并结才同用大寒大热","c":"讲义讲「一个极重要的用药指征」：「**有的时候大寒的药跟大热的药混合在一起用，为什么？因为真正到了危急的时候、急重症的时候，都是看到病人有寒症、有热症、寒热并结的时候，他两种同时会存在。****那同时存在、那你怎么办？你只好大寒大热的药放在一起，你无从选择，这个时候你要用。****那只是看到纯寒、或是纯热，那病还是比较轻一点；虽然是重症，病还是比较轻一点。**」\n\n**【极重要】寒热并结 → 大寒大热同用**\n\n```\n纯寒 / 纯热 → 病相对轻\n寒热并结   → 危重（须寒热并用）\n```\n\n**「寒热同时存在，只好大寒大热放一起」——「这是最硬的用药指征。」**要点：**须「强「标」**：**「寒热并用须严格辨证 + 剂量配伍；错用可致病情恶化；须专业中医师」** ✓✓","o":"RJ-2022 · 《人纪·神农本草经》上经第四十味，讲解（PDF 第 169 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"六经辨证的源头是热论","c":"讲义讲「一个极重要的源流」：「**为什么张仲景用六经辩证？当然六经辩证的源头来自《黄帝内经》里面的『热论』，最早源头来自《黄帝内经》的热论。****当我们病人在治症的时候，原来是最重的、厥阴啊、最重；但是等过来，我们治治『老师，我的病人现在是往来寒热、恶心、少阳症』——都不会死掉啊，就代表病人回来了。**」\n\n**【极重要】六经辨证的源头 = 热论**\n\n```\n《内经·热论》→ 六经辨证\n  厥阴（最重）→ 少阳（回来了）\n```\n\n**「从厥阴治到少阳，就是病人回来了」——「这条与 n77六经辨证出自内经」完全一致。**要点：**这一条极重要，它与 n46「从阴黄治成阳黄=好转」同一逻辑（逆「转的方向」）** ✓✓","o":"RJ-2023 · 《人纪·神农本草经》上经第四十味，讲解（PDF 第 169 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"龙胆草剂量以大便为度","c":"讲义讲「一个极精的定量」：「**龙胆草吃下去，因为他是苦味的嘛，病人会『吃你的药，怎么一天多了两三次大便？』原来没有那么多、现在多了两三次，很好啊。****一般我的剂量都是三钱；重症的话，如果下去，病人吃龙胆草一定会至少多一次大便。****比如说病人原来一天一次，吃了龙胆草以后、加了龙胆草以后，可能变一天两次、三次；剂量要开的刚刚好。****原来他是便秘，吃了龙胆草，你不要加其他药；吃了龙胆草以后，病人会有一天一次的大便，就刚刚好了、就不要动了，就是龙胆草的剂量了。**」\n\n**【极重要】龙胆草剂量以大便为度**\n\n```\n便秘者 → 大便由「无」变「1 次」\n  = 剂量刚好\n变 2–3 次 = 药量偏大\n```\n\n**「一天一次就是刚好，不要动了」——「这是最具体的以效定量。」**要点：**这一条极重要，它与 n190「大黄以大便为度」同一主题** ✓✓","o":"RJ-2024 · 《人纪·神农本草经》上经第四十味，讲解（PDF 第 169 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"酒浸则上行","c":"原文「**洁古曰下行之功与防己同，酒浸则能上行外行；柴胡为主、龙胆为使，治目疾必用之药。**」讲义：「**所以眼睛是炽热的、红血丝很多的，那我们需要开龙胆草。****那龙胆草是往下走啊，那我们希望龙胆草到上面、不要到下面去，你就用酒粹一下、用酒浸。****平常一般来说，龙胆草放到酒里面泡个两个小时再拿出来，就可以了。****一般来说这个药用酒炮制过、再放到药里面去的话，这个药都能走上走外，因为酒是辛、吃了都是往上升。**」\n\n**【极精】酒浸 = 上行**\n\n```\n龙胆草（本下行）\n  + 酒浸 → 上行 → 治眼疾\n```\n\n**「用酒泡两小时，药性就往上走」——「这是最精的炮制改方向。」**要点：**这一条极精，它与 n182「升降浮沉」同一主题** ✓✓","o":"RJ-2025 · 《人纪·神农本草经》上经第四十味，原文及讲解（PDF 第 169–170 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"龙胆草的两个反面","c":"讲义讲「一个极精的同症不同龄」：「**所以肝经包括小便——你们都学过针灸了，那个足厥阴肝经呢是络过睾丸、络过阴茎这边；那小便刺痛都可以用龙胆草啊。****如果遗尿，老人遗尿，他已经很寒了，你用龙胆草，他遗得更厉害。****那年轻人膀胱发炎感染你可以用龙胆草，因为是热症嘛、这是寒药。**」\n\n**【极精】龙胆草的两个反面**\n\n| 症 | 用 |\n|---|---|\n| **年轻人膀胱炎（热）** | **龙胆草** |\n| **老人遗尿（寒）** | **禁用** |\n\n**「年轻人膀胱炎可用，老人遗尿用了更遗」——「这是最精的同症不同龄。」**要点：**须「标」**：**「①尿路感染须查尿培养 + 按指南用抗生素；②老人遗尿须排除前列腺/膀胱过度/神经源性」** ✓✓","o":"RJ-2026 · 《人纪·神农本草经》上经第四十味，讲解（PDF 第 170 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"细辛的本草条目","c":"【本经原文】「**味辛温，主咳逆头痛，脑动，百节拘挛，风湿痹痛，死肌；久服明目利九窍，轻身长年；岐伯曰无毒，色白者善。**」【性味】「**味辛性温无毒。**」【主治】「**细辛为风痛要药，功能深入散风袪寒，主治咳逆上气，风湿，痹痛，头痛，齿痛，泄热破痰，开窍行水。**」【别录】「**温中下气，破痰，利水道，开胸中滞积，除喉痹，鼻塞不闻香臭，风痫癫疾，下乳结，汗不出，血不行，安五脏，益肝胆，通精气。**」【弘景】「**含之去口臭。**」【好古】「**治督脉为病，脊强而厥。**」【容川】「**细辛形细色黑，故入少阴经；味大辛，能温散少阴之风寒；而少阴为寒水之脏，寒则水气上泛；细辛散少阴之寒，能达水中之阳，故能逐水饮。**」【药征】「**主治宿饮停水也，故治水气在心下而咳满，或上逆，或胁痛。**」【用量】「**普通三分至一钱。**」【禁忌】「**升燥发散性烈，凡内热及火升炎上、上盛下虚、气虚有汗、血虚头痛、阴虚咳嗽，均忌。**」\n\n**【极重要】细辛的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛/温/无毒** |\n| **主治** | **风痛要药/散风袪寒/开窍行水** |\n| **禁** | **内热火升/上盛下虚/气虚有汗/阴虚咳** |\n\n**「散少阴之寒，能达水中之阳」——「这是最精的细辛机制。」** ✓✓","o":"RJ-2027 · 《人纪·神农本草经》上经第四十一味「细辛」，原文（PDF 第 171–172 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"六经头痛六药","c":"原文「**张子和曰治头痛：太阳经则羌活，少阴则细辛，阳明则白芷，厥阴则川芎吴萸，少阳则柴胡。****成无己曰胆气不足，细辛补之。****元素曰以独活为使治少阴头痛如神。**」\n\n**【极重要】六经头痛六药**\n\n| 经 | 药 |\n|---|---|\n| **太阳** | **羌活** |\n| **少阴** | **细辛** |\n| **阳明** | **白芷** |\n| **厥阴** | **川芎/吴萸** |\n| **少阳** | **柴胡** |\n\n**「少阴头痛，非细辛不能治」——「这是最精的引经药表。」**要点：**这一条极重要，它与 n126「偏头痛=少阳」、n197「柴胡四征」同一体** ✓✓","o":"RJ-2028 · 《人纪·神农本草经》上经第四十一味，原文引张子和（PDF 第 172 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"细辛毒性的三种说法","c":"讲义讲「一个极重要的文献分歧」：「**南方温病派『啊！细辛不能用、细辛有毒』——就结束了，他已经不用了。****那我们北方的经方呢，细辛用得很多；张仲景好几个地方用细辛。****在过去《黄帝内经》岐伯说细辛没有毒、《神农本草经》说细辛没有毒的；到了《本草纲目》说细辛大毒，我不晓得为什么会变成这样子。****有没有毒？没有毒。**」\n\n**【极重要】三本书三个说法**\n\n| 书 | 说 |\n|---|---|\n| **《内经》** | **无毒** |\n| **《本经》** | **无毒** |\n| **《本草纲目》** | **大毒** |\n\n**「同一味药，三本书三个说法」——「须强标：现代有限量。」**要点：**须「强「标」**：**「①细辛含马兜铃酸（肾毒性/致癌）；②『无毒』是古代标准；③现代限量（煎剂1–3g，不宜久服大量）；④肾功不全禁用」** ✓✓","o":"RJ-2029 · 《人纪·神农本草经》上经第四十一味，讲解（PDF 第 172–173 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"水的阳：加热才会循环","c":"讲义讲「一个极重要的物理模型」：「**肾水、肾脏里面的水，我们讲坎中的阳；肾脏、肾是水脏，那这个水如果说没有热度、没有阳——就好像一瓶冷水在那边，你不动它，它永远千年也不会动。****但是如果你一加热、到了一定温度的时候，它就开始循环了；有温度开始循环，那个温度我们称之为阳。****所以那个水肿了、水停在下面，就好像一杯水倒下来，水就在下面了、上面是空的下面是实的。****那个人上半身渴得要死，喝得再多的水通通积在下面，越喝下面越胀、口还是渴的。****代表水里面的阳已经没有了。**」\n\n**【极重要】水的阳：加热才会循环**\n\n```\n冷水（无阳）→ 不动 → 水肿/渴\n加热（阳）→ 循环\n细辛 = 小强（振水中之阳）\n```\n\n**「一杯冷水不动，加热才循环，那个温度就叫阳」——「这条与 n156水的五段路径」完全一致。**要点：**这一条极重要，它是「阳的物理定义」** ✓✓","o":"RJ-2030 · 《人纪·神农本草经》上经第四十一味，讲解（PDF 第 173 页）。"},{"t":"神农本草经·上经：远志（续）、龙胆、细辛","h":"吐气一定是热的","c":"讲义讲「一个极朴素的检验」：「**正常人呢，诸位不要把人想得很复杂、用 commonsense 去想：你吐气的时候是不是热气跑出来？你跑到镜子前面吐气，『哈』，热气对不对？****有个人吐没有热气，你根本是死人或者是外星人。****所以说我们身上有水，这个水一定是热的，有没有疑问？没有疑问嘛。****可是西医认为水就是水，他就不去检验水的温度啊，所以他只有验血报告。**」\n\n**【极精】吐气一定是热的**\n\n```\n吐气有热 = 活人（水是热的）\n吐气无热 = 死人\n```\n\n**「身上有水，这个水一定是热的」——「这是最朴素的检验。」**要点：**须「标」**：**「①西医当然测体温/电解质/渗透压；②『不验水』是修辞；③水代谢病须规范诊治」** ✓✓","o":"RJ-2031 · 《人纪·神农本草经》上经第四十一味，讲解（PDF 第 174 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"阴虚与阳虚","c":"讲义讲「一个极精的定义」：「**石斛是滋阴的药，一般都是阴虚的时候才用。****比如说『医生我去检验说我那个精子太稀，所以我太太没有办法受孕』——阴虚！眼睛看得到的、虚掉了通通是阴。****眼睛看不到的、虚掉了通通是阳。****有的时候你再看看我的手：你看得到我皮肤肌肉，但是你看不到力量有多少——看不到的是阳、看得到的是阴。****肌肉都软缩没有力了——阴虚；那力气没了、走路没有力气——阳虚。**」\n\n**【极重要】阴虚 vs 阳虚**\n\n| 型 | 判 |\n|---|---|\n| **阴虚** | **看得到的虚（肌肉软缩）** |\n| **阳虚** | **看不到的虚（力气没）** |\n\n**「看得到的是阴，看不到的是阳」——「这是最精的阴阳定义。」**要点：**这一条极重要，它与 n162「阳虚则外寒、阴虚则内热」互为补充** ✓✓","o":"RJ-2032 · 《人纪·神农本草经》上经第四十二味「石斛」，讲解（PDF 第 177 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"舌苔是胃气","c":"讲义讲「一个极精的舌诊」：「**一般我们看胃热看舌苔，舌苔就是胃气的所在。****所以我们看很多癌症的病人，有时候一看舌苔没了、就是绛红色、没有舌苔，胃气都跑掉了。****所以你有一点舌苔是很好的；那舌苔太厚也不行、没有也不行，要一点点。****最好的舌苔上面薄薄的一层、涵盖的很均匀，不要有千疮百孔。****最好是平整、而且是薄薄细细的一层在上面，是最好的、胃气最好了。****如果舌苔比较黄比较厚，胃气湿热比较重嘛，那你吃这个石斛很好啊。**」\n\n**【极重要】舌苔 = 胃气**\n\n| 苔 | 判 |\n|---|---|\n| **薄白均匀** | **最好（胃气好）** |\n| **无苔/绛红** | **胃气跑掉（危）** |\n| **厚/黄** | **湿热** |\n| **地图舌** | **不好** |\n\n**「舌苔没了、绛红色，胃气就跑了」——「这是最精的舌苔五判。」**要点：**这一条极重要，它与 n183「舌诊三段」同一主题** ✓✓","o":"RJ-2033 · 《人纪·神农本草经》上经第四十二味，讲解（PDF 第 178 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"胃热的两征","c":"讲义讲「一个极简的判据」：「**小孩子胃热，舌头伸出来看看，舌苔比较粘、粘腻就是胃热。****一般来说胃热的人胃口都会很强、非常强。**」\n\n**【极精】胃热 = 苔黏 + 胃口强**\n\n```\n苔黏腻 + 胃口特别强\n  → 胃热（石斛）\n```\n\n**「苔黏、胃口特别强，就是胃热」——「这是最简的胃热二征。」**要点：**须「标」**：**「胃口过强须查①甲亢；②糖尿病；③幽门螺杆菌；④精神性贪食；⑤药物（激素/抗精神病）」** ✓✓","o":"RJ-2034 · 《人纪·神农本草经》上经第四十二味，讲解（PDF 第 178 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"胃寒就是瘦","c":"讲义讲「一个极争议的推论」：「**你胃如果寒一点，人就会比较瘦，所以我们讲胃寒的大部分都是瘦子。****所以我们中药，你说『老师我们可不可以设计一个药来减肥』——当然可以了，我让你胃寒掉、你就瘦下来了。****你本来很胖、肌肉里面的湿很多；我让你胃寒掉，同时把你肌肉里面、四肢里面、肚子里的湿去掉，结果津液去掉就瘦下来了。**」\n\n**【极精】胃寒 = 瘦**\n\n```\n胃寒 + 去湿\n  → 津液去 → 瘦\n```\n\n**「让胃寒掉，你就瘦下来了」——「须强标：这是错误且危险的做法。」**要点：**须「强「标」**：**「①用药制造胃寒来减肥是错误且危险（可致营养不良/胃病/反弹）；②减重须饮食 + 运动 + 规范治疗（GLP-1/奥利司他）；③不可自行服寒凉药减肥」** ✓✓","o":"RJ-2035 · 《人纪·神农本草经》上经第四十二味，讲解（PDF 第 179 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"巴戟天的本草条目","c":"【本经原文】「**味辛微温，主大风邪气，阴痿不起，强筋骨安五脏，补中增智益气。**」【产地】「**产四川者最佳，多山林内，叶经冬不枯，根似联珠，入药。**」【性味】「**味辛甘，性微温，无毒。**」【主治】「**巴戟天为补气益精要药，功能祛风除湿，强筋骨，壮元阳，治遗精。**」【甄权】「**男子夜梦鬼交泄精，强阴，下气，治风癞。**」【用量】「**普通一钱至三钱。**」【禁忌】「**凡相火炽、思欲不得、便赤口苦、目昏目痛、烦燥口渴、大便燥结者均忌；恶雷丸丹参，得覆盆子良。****此药治肾亏最佳，故遗精滑精者宜，阳痿者良，有虚火者禁忌。**」【容川】「**色紫而根实，能温肝；足厥阴主风，属阴中之阳，药气温者即阴中之阳，故入肝。**」\n\n**【极重要】巴戟天的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛甘/微温/无毒** |\n| **主治** | **补气益精/强筋骨/壮元阳** |\n| **禁** | **相火炽/大便燥（虚火禁）** |\n\n**「根似联珠，是巴戟天的形态特征」** ✓✓","o":"RJ-2036 · 《人纪·神农本草经》上经第四十三味「巴戟天」，原文（PDF 第 179 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"真假巴戟天","c":"讲义讲「一个极直白的判别」：「**那个巴戟天呢，是我们补肾壮阳健骨非常有名的药。****如果吃下去你没有感觉到男性的活力、没有增强，代表买到假巴戟天了。****真正的巴戟天呢味辛、辛味的比较有点辣，而且吃下去有点甜，药性是温性的药。****所以辛甘，我们讲辛甘发散为阳；所以巴戟天也是什么？也是阳药。**」\n\n**【极精】真假巴戟天**\n\n```\n真：辛（辣）+ 甜 + 温\n    = 辛甘发散 → 阳药\n假：无感觉\n```\n\n**「吃完没感觉，就是假的」——「须标：这不是可靠的判别标准。」**要点：**须「标」**：**「①以主观感受判药真伪不可靠；②须看来源/检验报告/GMP；③性功能问题须泌尿外科 + 心血管/内分泌评估」** ✓✓","o":"RJ-2037 · 《人纪·神农本草经》上经第四十三味，讲解（PDF 第 179 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"张仲景不用巴戟天","c":"讲义讲「一个极有趣的观察」：「**但是张仲景呢没有用巴戟天、不用巴戟天。****他大概受到某种宗教或是怎么样，反正他不赞成很补阳、补阳补得很强。****临床的治症我们可以跟大家介绍，我们有的时候需要这样子；尤其肝病的人需要这样子。**」\n\n**【极精】张仲景不用巴戟天**\n\n```\n《伤寒》《金匮》无巴戟天\n  → 经方不重用强补阳\n```\n\n**「张仲景不赞成补阳补得很强」——「这是最有趣的留白。」**要点：**这一条极精，它与 n195「中药是push你自己」同一主题（不「滥补」）** ✓✓","o":"RJ-2038 · 《人纪·神农本草经》上经第四十三味，讲解（PDF 第 179–180 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"壮阳还要固阳","c":"讲义讲「一个极重要的两层」：「**如果你说巴戟天治遗精、精虚，你吃巴戟天精会增，哇量会增加很多啊，可还是可能会再遗哟。****我们有很多锁阳、固阳，因为你只在壮阳、你没有固啊。****你忘了去固阳，固阳有固阳的药啊。****那你只是去壮它、还要加些固阳的药，所以我们话还没讲完，诸位不要急着去吃巴戟天。**」\n\n**【极重要】壮阳 + 固阳**\n\n```\n只壮不固 → 量多但仍会遗\n壮 + 固   → 才成\n```\n\n**「只壮不固，还是照遗」——「这是最精的两个层次。」**要点：**这一条极重要，它是「补的两个动作」** ✓✓","o":"RJ-2039 · 《人纪·神农本草经》上经第四十三味，讲解（PDF 第 180 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"阳不足会见阴物","c":"讲义讲「一个极重要的推衍」：「**【甄权】说『男子夜梦鬼交泄精』，这一句话大家看好像没什么。****这个我们可以推衍到很多：除了你梦靥、你梦到恶梦惊醒过来，阳不足、阳虚的人都会看到阴物。****这句话就代表巴戟天是阳药；阳不够的人常常会见到这种鬼邪的东西，那阳不足我们可以用巴戟天把阳补回来。****一般我们有两种情形：一种就是人虚劳、先天生下来就是痨病的人常常会看到奇奇怪怪的东西；还有一种人就是在临终之前常常会看到，有人来接引啊什么、会看到。**」\n\n**【极重要】阳不足 → 见阴物**\n\n```\n阳虚（虚劳/临终）\n  → 见鬼/噩梦 → 巴戟天（阳药）\n```\n\n**「阳虚的人会看到阴物」——「须强标：须排除谵妄与精神科。」**要点：**须「强「标」**：**「幻视/噩梦须排除①谵妄（感染/电解质/药物/酒精戒断）；②痴呆/精神病；③PTSD；④睡眠瘫痪；⑤临终期（须安宁疗护）」** ✓✓","o":"RJ-2040 · 《人纪·神农本草经》上经第四十三味，讲解（PDF 第 181 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"补肾是保护肝脏的第一步","c":"讲义讲「一个极重要的治则」：「**你看唐容川『色紫而根实而能温肝，足厥阴主风』；所以我一再跟诸位讲，肝病在缓和的时候、人慢慢在病情稳定的时候，我们一直在补他的肾。****因为巴戟天是补肾固精的药，但是它就去肝风、它是对肝脏很好，因为水能够生木嘛。****所以我们保护肝脏的方法，第一个强水！固肾。****你一两不见得是要太太怎么样，那是补肾啊！水去生木，木头会长得很好。****这个时候你加一些舒肝木的药、让肝木不要那么郁闷在里面，这个时候肝脏功能就会非常好。**」\n\n**【极重要】补肾 = 强水 → 生木**\n\n```\n肝病稳定期：\n  ① 固肾（强水）\n  ② 舒肝（柴胡/郁金）\n  → 水生木\n```\n\n**「保护肝脏第一步，就是强水固肾」——「这是最精的水生木治肝法。」**要点：**须「强「标」**：**「B肝/C肝/肝硬化/肝癌须抗病毒/规范治疗 + 定期筛查（超声/AFP）；补肾不能代替」** ✓✓","o":"RJ-2041 · 《人纪·神农本草经》上经第四十三味，讲解（PDF 第 182 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"天麻的本草条目","c":"【本经原文】「**味辛温，主杀鬼精物蛊毒恶气；久服益气力长阴肥健轻身增年；今之天麻。**」【产地】「**产四川及各地山野林中之阴地，苗名赤箭，根即天麻。**」【性味】「**味辛性平无毒。**」【主治】「**天麻为祛风镇痉要药，功能治诸风头痛头眩，风湿痹，小儿精痫拘挛。**」【甄权】「**治冷气麻痹瘫缓不随，语多恍惚，善惊失志。**」【大明】「**助阳气，补五劳七伤，鬼疥，通血脉，开窍。**」【用量】「**普通八分至二三钱。**」【禁忌】「**风药多燥，风能胜湿故也；凡病人觉津液少、口干舌燥、咽干痛、大便涩，及火炎头晕、血虚头痛、似中风症皆忌。**」\n\n**【极重要】天麻的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛/平/无毒** |\n| **主治** | **祛风镇痉/头痛头眩/小儿痫拘挛** |\n| **禁** | **津液少/口干舌燥/大便涩** |\n\n**「苗名赤箭，根即天麻」——「一物二名。」** ✓✓","o":"RJ-2042 · 《人纪·神农本草经》上经第四十六味「赤箭」，原文（PDF 第 183 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"治风先治血","c":"原文「**东垣曰肝虚不足者，天麻川芎以补之。****罗天益曰眼黑头眩，风虚内作，非天麻不能治，因此天麻有养血之功。****汪昂云风药中必兼养血药以制其燥，养血药须兼收风药宣其滞也。****古云治风先治血，血行风自灭。**」\n\n**【极重要】治风先治血**\n\n```\n风药（燥）+ 养血药（制燥）\n  → 血行风自灭\n```\n\n**「治风先治血，血行风自灭」——「这是最精的风血同治理。」**要点：**这一条极重要，它与 n149「治风先治血」同一主题** ✓✓","o":"RJ-2043 · 《人纪·神农本草经》上经第四十六味，原文引汪昂（PDF 第 183 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"归纳到阴阳寒热就够了","c":"讲义讲「一个极重要的学法」：「**所以诸位看本草经里面很多很细，你如果记不起来一点都不要紧张；第一个书在里面你可以回头去翻，第二个你如果把它变成阴阳、变成寒热的时候，你处方就很好处方了。****『啊，老师，天麻是阳药』——已经讲完了。****你就可以开处方，阴症寒症出现的时候我们用天麻。****你只要记得天麻是要止抽筋。**」\n\n**【极精】归纳到阴阳寒热就够了**\n\n```\n记不住 700 味\n  → 只记「阴阳寒热」\n  → 处方就会了\n```\n\n**「天麻是阳药，讲完了」——「这条与 n181不要记名称，只记味道」完全一致。**要点：**这一条极精，它是「学药的方法论」** ✓✓","o":"RJ-2044 · 《人纪·神农本草经》上经第四十六味，讲解（PDF 第 184 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"羚羊角治抽痉","c":"讲义讲「一个极有趣的取象」：「**藏羚羊的羚羊脚是很好的治抽痉的药，治疗脑瘤啊我们会常常用到。****那为什么说这个高山上的羚羊脚会治疗抽痉？你想想看嘛，它在五千尺以上那么高的地方，有没有看到羚羊抽筋啊？也没看到羚羊高原症昏倒。****那个脚还长的很好、脚都很强；所以一般有钱人是看到羚羊的毛，我们中医是看到羚羊的脚，脚可以熄风止痉。**」\n\n**【极精】羚羊角（高原=不抽筋）**\n\n```\n5000 尺高原，羚羊不抽筋\n  → 羚羊角熄风止痉\n```\n\n**「有钱人看羚羊的毛，中医看羚羊的脚」——「须强标：保护物种。」**要点：**须「强「标」**：**「羚羊角属保护物种（CITES），禁止贸易；临床已用替代品（水牛角/人工配方）；不可购买野生制品」** ✓✓","o":"RJ-2045 · 《人纪·神农本草经》上经第四十六味，讲解（PDF 第 184 页）。"},{"t":"神农本草经·上经：石斛、巴戟天、白英、白蒿、赤箭（天麻）","h":"细辛与麻辣锅","c":"讲义讲「一个极生活化的辩护」：「**细辛一吃下去、因为细辛很峻、辛辣味很重，所以四川麻辣锅——你知道麻辣锅一吃舌头是不是麻掉了？****你吃麻辣锅舌头麻掉你不怕，这是麻辣锅你都不怕；吃细辛嘴巴麻掉『这个有毒』——其实是一样的东西。****那你嘴巴会麻、很多东西都会让嘴巴麻，芭蕉也会让嘴巴麻啊。****当然那我们的乌头也会呀，但是我们知道怎么解嘛。****所以为什么医药要医生来管，因为我们知道药什么时候用。**」\n\n**【极精】麻 ≠ 毒**\n\n```\n麻辣锅麻（不怕）\n细辛麻（说有毒）\n  = 同一种「麻」\n```\n\n**「麻辣锅都敢吃，细辛麻就怕」——「这是最生活化的辩护。」**要点：**须「强「标」**：**「①口唇/舌麻须立即停药就诊（过敏/乌头碱/神经毒素）；②『麻≠毒』不意味着安全；③细辛有肾毒性」** ✓✓","o":"RJ-2046 · 《人纪·神农本草经》上经第四十一味，讲解（PDF 第 176–177 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"天麻滋润津液","c":"讲义讲「一个生活化的功用」：「**那过去我们女人呢用天麻很好：女人用天麻的时候可以让女人的胸部变大，然后女人的皮肤变得很细。****本来天麻很便宜，就是知道了以后就贵了。****因为它能够滋润津液，所以能让皮肤变得很好。**」\n\n**须「标」**：**「『天麻丰胸/美肤』无依据；须不采（与 n120寿眉同类）」** ✓✓\n\n**极精！！\"天「麻= 止抽筋（一句话记住）\"** ✅✓\n- **\"你只要记得天麻是要止抽筋\"** ✓✓\n- **\"癫痫或者是脑瘤，病人有抽筋的现象我们会使用它；药性呢是阳性的药，所以说冷气麻痹、手脚冰冷通通可以用天麻\"** ✓✓\n\n**【极精】\"天「麻 = 止抽筋（阳药）\"** ✅✓","o":"RJ-2047 · 《人纪·神农本草经》上经第四十六味「赤箭」，讲解（PDF 第 185 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"奄闾子是伤科药","c":"【本经原文】「**味苦微寒，主五脏瘀血，腹中水气，胪张留热，风寒湿痹，身体诸痛；久服轻身延年不老。**」【性味】「**味苦性微寒，无毒。**」【主治】「**奄闾主五脏瘀血，风寒湿痹，身体诸痛，明目益气消食。**」【禁忌】「**用之治扑打损伤效，罕有用于调理者。**」讲义：「**奄闾子这个药，是中医伤科在用的。****这个药主活血化瘀，内脏的五脏出血、撞伤打伤；这个是苦味的药，药很苦。****伤科的药在用的时候，诸位内服跟外服都可以，你给它泡在药酒里面、内服也可以。**」\n\n**【极重要】奄闾子 = 伤科药**\n\n```\n外伤/内脏撞伤出血\n  → 活血化瘀（内服/外敷/药酒）\n```\n\n**「罕有用于调理者」——「这是最明确的适用范围。」**要点：**须「强「标」**：**「①外伤/内脏撞伤须先做影像（CT/超声排除内出血/器官破裂）；②活血化瘀药不能代替止血/手术；③抗凝药同用须谨慎」** ✓✓","o":"RJ-2048 · 《人纪·神农本草经》上经第四十七味「奄闾子」，原文及讲解（PDF 第 185 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"瘀血的三处","c":"讲义讲「一个极具体的查瘀法」：「**『老师，我怎么知道这个病人内有淤血、身上有瘀血？』很简单，你舌头伸出来我看看。****舌头伸出来一看，哎！老师它上面生个黑痣——瘀血；有的时候黑黑的一粒粒小小的，就是瘀血。****还有呢，脚痉骨小腿拉起来，一看从三阴交的地方一直到这个地机——从地机三阴交这一段肌肤甲错、皮肤干干的，干脱屑下来。****『老师，我就奇怪，就这一段皮肤像蛇皮一样，常常褪皮下来、一块一块的』——就是腹部里面有瘀血、腹腔里面有瘀血。**」\n\n**【极重要】瘀血三处**\n\n| 处 | 征 |\n|---|---|\n| **舌** | **黑痣/黑粒** |\n| **地机—三阴交** | **肌肤甲错（蛇皮）** |\n| **症状** | **痛** |\n\n**「舌上黑痣、小腿蛇皮，就是有瘀血」——「这条与 n51瘀血看三处」有对应。**要点：**这一条极重要，它是「可自查的三处」** ✓✓","o":"RJ-2049 · 《人纪·神农本草经》上经第四十七味，讲解（PDF 第 185–186 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"析蓂子已经失传","c":"【本经原文】「**味辛微温，主明目目痛泪出，除痹痛，补五脏益精光；久服轻身不老。**」讲义：「**这个第 48 味药呢叫析蓂子，用得不多；诸位看看本经原文，到现在也没有什么认得它，诸位参考就可以了。****我都没有使用过。**」\n\n**【极精】析蓂子 = 失传**\n\n```\n本经有载 → 无人认得 → 无人用\n```\n\n**「我都没有使用过」——「这条与 n196药随医亡」同一体。**要点：**这一条极精，它是「讲义的自限（诚实）」** ✓✓","o":"RJ-2050 · 《人纪·神农本草经》上经第四十八味「析蓂子」，原文及讲解（PDF 第 186 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"蓍实是第四十九味","c":"【本经原文】「**味苦平，主益气充肌，明目聪慧先知；久服不饥不老轻身。**」讲义：「**这个蓍呢很好玩，它就故意放在第 49 味。****过去我们文王《易经》的时代，我们起课卜卦的时候用的筒子；现在庙里面放的都是竹子做的，以前放的都是蓍草。****因为我们那个爻课签筒里面是有五十根的蓍茎在里面；卜筮啊、掉一根出来、四十九；那第一根出来是天、里面四十九，我们天人地。****第四十九味药蓍实。**」\n\n**【极重要】蓍实 = 第 49 味（与易经对应）**\n\n```\n《易经》蓍草五十根\n  取一（天）→ 用四十九\n《本经》第 49 味 = 蓍实\n```\n\n**「五十根蓍草取一，用四十九，所以排第 49 味」——「这是最精的数与药对应。」**要点：**须「标」**：**「『聪慧先知』无依据；蓍草卜筮无预测效力（与 n188干支择日同类）」** ✓✓","o":"RJ-2051 · 《人纪·神农本草经》上经第四十九味「蓍实」，原文及讲解（PDF 第 186–187 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"六芝五色配五脏","c":"【本经原文】「**赤芝—味苦平，主胸中结，益心气，补中，增慧智，不忘；一名丹芝，生霍山。****黑芝—味咸平，主癃，利水道，益肾气，通九窍，聪察；一名元芝，生恒山。****青芝—味酸平，主明目补肝气，安精魂，仁恕；一名龙芝，生太白。****白芝—味辛平，主咳逆上气，益肺气，通利口鼻，强志意，勇悍，安魂；一名玉芝，生华山。****黄芝—味甘平，主心腹五邪，益脾气，安神，忠信和乐；一名金芝，生嵩山。****紫芝—味甘温，主耳聋，利关节，保神，益精气，坚筋骨，好颜色；一名木芝，生高夏地上，色紫形如桑。****六芝皆无毒，六月八月采。**」\n\n**【极重要】六芝五色配五脏**\n\n| 芝 | 味 | 脏 | 功 |\n|---|---|---|---|\n| **赤芝** | **苦** | **心** | **增慧智** |\n| **黑芝** | **咸** | **肾** | **利水道聪察** |\n| **青芝** | **酸** | **肝** | **明目补肝** |\n| **白芝** | **辛** | **肺** | **益肺气** |\n| **黄芝** | **甘** | **脾** | **安神** |\n| **紫芝** | **甘温** | **肾/骨** | **坚筋骨/好颜色** |\n\n**「五味配五色，就是五脏」——「这是最精的五味五色五脏全套。」** ✓✓","o":"RJ-2052 · 《人纪·神农本草经》上经第五十味「六芝」，原文（PDF 第 187 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"灵芝不能治癌","c":"讲义讲「一个极难得的自限」：「**芝类的东西它的药性都是很平和的，没有办法把阴实打开来的药。****在中医理论上能够治病很难，但是能够祛命延年、就是预防生病，能够让你的五脏六腑功能变得很强，我承认它有这个功能，真的治病差一段。****至于现代的药理学说它可以治疗癌症啊什么的，我是姑且听之。**」\n\n**【极重要】灵芝不能治癌**\n\n```\n灵芝 = 预防/保健（平和）\n✗ 不能打开阴实（肿瘤）\n```\n\n**「灵芝治病差一段」——「这是讲义最难得的自限。」**要点：**须「强「标」**：**「①灵芝不能治癌；②癌症须规范治疗（手术/化疗/靶向/免疫）；③灵芝可能与抗凝/化疗药相互作用，须告知医师」** ✓✓\n\n**极精！！\"药「典里的『仁恕/勇悍/忠信和乐』\"** ✅✓\n- **\"那青芝呢『仁恕』，吃的人很仁恕；所以如果是你的岳父脾气不好，你就赶快送点青芝给他吃\"** ✓✓\n- **\"诸如此类的，有没有效就看个人啦\"** ✓✓\n- **\"对身体很好是肯定的\"** ✓✓\n\n**\"这是「极精的『古人的道德联想』（须标：无依据）」** ✓✓","o":"RJ-2053 · 《人纪·神农本草经》上经第五十味，讲解（PDF 第 188 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"卷柏生用破血，炙用止血","c":"【本经原文】「**味辛温，主五脏邪气，女子阴中寒热，痛，症瘕，血闭，绝子；久服轻身和颜色；一名万岁。**」【主治】「**卷柏生用平，主破血通经；炙用性温，治肠风脱肛。**」【大明】「**镇心，除面皯，头风，暖水脏，生用破血，炙用止血。**」【禁忌】「**多用于止血药中，其他方剂罕用。**」讲义：「**卷柏呢这个药，妇科常常用……它另外一个名称叫万岁。****专门治疗女子阴中寒热、症瘕血闭，这种都是子宫瘤、卵巢瘤或者是你的肌瘤水瘤。****血闭绝子、不会怀孕生小孩都可以用卷柏，为什么？活血化瘀。**」\n\n**【极重要】卷柏生用破血，炙用止血**\n\n```\n生用 → 破血通经（痛经/瘀）\n炙用 → 止血（肠风脱肛）\n```\n\n**「同一味药，生用破血、炙用止血」——「这是最精的炮制变性。」**要点：**须「强「标」**：**「①子宫瘤/卵巢瘤须规范妇科评估；②活血化瘀不能代替手术/药物；③孕妇禁用」** ✓✓","o":"RJ-2054 · 《人纪·神农本草经》上经第五十一味「卷柏」，原文及讲解（PDF 第 188 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"生用破血，炙用止血是通则","c":"讲义讲「一条极重要的通则」：「**这个不单单是卷柏，所有的药只要是炙用都在止血，生用都在活血化瘀、破血；生用破血力量很强。****『老师，同样一味药，你刚刚不是说它在攻血活血，这又在止血？』——对呀，中药就是这样子，中药是取它的平衡点。****所以补不足去有余的时候，你药一下去原来小便不通的通了，原先是小便淋利的、同样的药两个都好，中药就会有这种现象。**」\n\n**【极重要】生用破血，炙用止血（通则）**\n\n```\n一切药：生用 → 活血破血\n        炙用 → 止血\n```\n\n**「中药是取它的平衡点」——「这条与 n182中药的双向调节」完全一致。**要点：**这一条极重要，它是「一条通则」** ✓✓","o":"RJ-2055 · 《人纪·神农本草经》上经第五十一味，讲解（PDF 第 189 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"子宫寒就不怀孕","c":"讲义讲「一个极重要的推论」：「**诸位现在从我们后面不要说你还没学到《伤寒》《金匮》，光是前面《黄帝内经》、针灸、还有这个《神农本草经》到现在，你可以知道：女人如果子宫寒就不会怀孕。****如何让她子宫热起来就会怀孕；那我们热的方法很多，你可以灸关元啊、吃吃卷柏啊，很多种药味都可以让它温子脏的。****你现在就晓得了人工受精那个有没有用——他没有寒热的啊，硬给你种进去、里面还是寒的，照样流产嘛。**」\n\n**【极重要】子宫寒 → 不孕**\n\n```\n子宫寒（中医）→ 温子脏\n  → 灸关元 / 卷柏\n```\n\n**「子宫寒就不会怀孕」——「须强标：人工受精并非无用。」**要点：**须「强「标」**：**「①不孕须规范生殖医学评估（排卵/精子/输卵管/子宫内膜/甲状腺）；②IVF成功率受多因素影响（年龄最关键）；③『人工受精无用』是明确错误，须否定」** ✓✓","o":"RJ-2056 · 《人纪·神农本草经》上经第五十一味，讲解（PDF 第 188 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"蓝实（青黛）的本草条目","c":"【本经原文】「**味苦寒，主解毒，杀蛊蚑，注鬼，螫毒；久服头不白轻身；又今俗名青黛。**」【性味】「**味咸性寒无毒。**」【主治】「**蓝实（青黛）为解散热毒要药，主散五脏郁火，治时疾热狂与大青同功，并敷热疮虫咬，头生黄水疮，治小儿丹毒。**」【甄权】「**填骨髓，明耳目，利五脏，调六腑，通关节，治经络中结气，使人健少睡，益心力。**」【别录】「**蓝叶杀百药毒，解狼毒，射罔毒。**」【时珍】「**主解斑蝥，芫青，朱砂，橒鸡，砒石毒。**」【备要】「**外敷治痈疽蛇犬毒。**」【用量】「**普通三分至钱半。**」【禁忌】「**凡血证非血分实热，而由阴虚内热、阳无所附，火气因空上炎，发为唾咯吐血诸证，切不可用青黛等；盖血得寒则凝，则寒热交作，胸膈或痛，愈增其病。**」\n\n**【极重要】蓝实（青黛）的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **咸/寒/无毒** |\n| **主治** | **解散热毒/五脏郁火/外敷疮毒** |\n| **禁** | **阴虚内热之血证** |\n\n**「血得寒则凝，这就是禁忌的道理」** ✓✓","o":"RJ-2057 · 《人纪·神农本草经》上经第五十二味「蓝实」，原文（PDF 第 189–190 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"质轻的药只用几分","c":"讲义讲「一个极具体的剂量单位」：「**青黛是粉；你不要白目『老师，三钱』——哇！那是一大票，吃得牙齿都是蓝的、整个都蓝的、舌头都蓝的。****其实五分、三分。****十分是一钱。****质地非常地轻，任何质地轻的药，诸位不要开三钱五钱，笑死人，三分就够了。**」\n\n**【极重要】质轻的药只用几分**\n\n```\n青黛（粉/极轻）→ 3–5 分（不是钱）\n十分 = 一钱\n```\n\n**「质地轻的药，三分就够了」——「这是最具体的剂量单位。」**要点：**这一条极重要，它与 n186「石膏要用两」形成对照（重「者用两，轻者用分」）** ✓✓","o":"RJ-2058 · 《人纪·神农本草经》上经第五十二味，讲解（PDF 第 190 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"带状疱疹三步","c":"讲义讲「一个极具体的操作」：「**包括带状疱疹、腰蛇毒、胸蛇、锦蛇，那个青黛撒上去。****先等下撒啊、因为有头有尾吗，头尾用灸的、隔姜灸，在头尾一灸它就停住了。****还有一种就是我们针灸讲过的直接在上面烧：拿那个棉花，薄薄的上面上一点凡士林，就在那疱疹上面，然后把棉花轻轻贴上去，打火机『卟』一点。****烧完的时候病人本来很痛啊、烧完就不痛了。****那你烧过以后呢，青黛撒上去；所以你先灸两边，隔姜灸各灸个三壮五壮都没有关系；然后在平面上再烧过，烧过以后青黛粉撒上去然后回家。**」\n\n**【极重要】带状疱疹三步**\n\n```\n① 灸头尾（隔姜灸 3–5 壮）\n② 棉花薄片烧过\n③ 青黛粉撒上\n```\n\n**「头尾一灸，它就停住了」——「须强标：不能替代抗病毒。」**要点：**须「强「标」**：**「①带状疱疹须抗病毒（阿昔洛韦/伐昔洛韦72h内）+ 镇痛（加巴喷丁）；②后神经痛须规范治疗；③棉花烧灼有烧伤/感染风险，不可自行操作；④须排除免疫抑制」** ✓✓","o":"RJ-2059 · 《人纪·神农本草经》上经第五十二味，讲解（PDF 第 191–192 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"青黛解乌头毒","c":"原文【别录】「**蓝叶杀百药毒，解狼毒，射罔毒。**」讲义：「**射罔呢就是乌头——过去在云贵高原一带、四川那个深山里面，因为乌头很多；山胞打猎的时候，那个箭簇只要这个乌头汁煮一下蘸上去，只要中、十步就死掉。****中了乌头毒怎么办？——青黛；青黛呢，身上粉洒一洒、伤口里面洒洒，你让他拔掉再洒嘛，然后嘴巴再吃那个青黛下去，毒就解掉了。****『老师，你昨天不是说那个远志？』——当然，远志当然可以；远志是喝乌头伤到心脏才吃的，外面的伤口呢用青黛。**」\n\n**【极重要】青黛 vs 远志**\n\n| 中毒 | 解 |\n|---|---|\n| **外伤（箭毒）** | **青黛（外敷+内服）** |\n| **心脏（内服乌头）** | **远志** |\n\n**「外伤用青黛，伤心用远志」——「须强标：不能替代急救。」**要点：**须「强「标」**：**「乌头碱中毒须立即急诊（心电监护 + 镁/胺碘酮）；青黛/远志不能代替急救」** ✓✓","o":"RJ-2060 · 《人纪·神农本草经》上经第五十二味，原文引陶弘景及讲解（PDF 第 191–192 页）。"},{"t":"神农本草经·上经：奄闾子、析蓂子、蓍实、六芝、卷柏、蓝实（青黛）","h":"青黛生用，不要煮","c":"讲义讲「一个极具体的用法」：「**一般我们内服的时候，因为三分、五分就很小一包，你一定要汤药煮完以后，汤药拿起来，把那个放到嘴巴里面、青黛放到嘴巴里面，药冲下去。****你不会把那个粉放下去煮，直接生用，解毒的力量更强。**」\n\n**【极精】青黛生用，不要煮**\n\n```\n汤药煮好 → 青黛粉放嘴里 → 药冲下\n（不煮，解毒力更强）\n```\n\n**「粉不能煮，直接生用」——「这是最具体的服法。」**要点：**这一条极精，它与 n186「石膏先煎」、n188「大黄后下」同一主题（煎「法分层」）** ✓✓","o":"RJ-2061 · 《人纪·神农本草经》上经第五十二味，讲解（PDF 第 192 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"川芎治头痛","c":"讲义讲「一个极重要的三通道」：「**遇到任何的肝病，诸位只要记得，看到肝病、不管你是什么 B 肝、C 肝、肝硬化、肝癌，川芎都要用。****头痛，我们开处方的时候病人只要喊头痛，第一个下去就是川芎了。****所以过去中医有说：治头痛不会用川芎的人就不会治头痛，有这句话。****那川芎呢，也是妇科的良药。**」\n\n**【极重要】川芎治头痛**\n\n```\n头痛 → 川芎（第一味）\n肝病 → 川芎\n妇科 → 川芎\n```\n\n**「不会用川芎，就不会治头痛」——「这是最精的三个通道。」**要点：**这一条极重要，它与 n200「六经头痛六药」同一体（川芎是「厥阴引经」）** ✓✓","o":"RJ-2062 · 《人纪·神农本草经》上经第五十三味「芎穷」，讲解（PDF 第 194 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"阿司匹林的争议","c":"讲义讲「一个极激烈的主张」：「**病人在吃阿司匹林，阿司匹林是酸的；病人吃到后来的时候有天到医院去打点滴说血管都找不到，为什么？酸收嘛，整个血管缩起来。****我开的大剂的川芎下去，效果就很好。****那我宁可你吃川芎来预防中风跟治疗中风，而不要去吃阿司匹林。****讲阿司匹林好的根本是妖魔。****那脑神经科的说不能吃阿司匹林、阿司匹林吃了会脑出血；心脏科的说吃阿司匹林可以预防心脏病；那病人夹在中间，你告诉我，我要听谁的？都不要吃就对的。**」\n\n**【极重要】阿司匹林的争议**\n\n```\n讲义立场：川穹 > 阿司匹林\n```\n\n**「都不要吃就对的」——「须逐条否定：这是危险的。」**要点：**须「逐条否定」**：**「①阿司匹林在二级预防（已有心梗/缺血性卒中）有明确获益（ATT/CAPRIE）；②一级预防按风险分层（USPSTF：60岁以上不启动）；③『阿司匹林把血管缩起来』无药理依据（阿司匹林是抗血小板，不是缩血管）；④绝不可自行停药（可致支架内血栓）；⑤川芎不能代替抗血小板」** ✓✓","o":"RJ-2063 · 《人纪·神农本草经》上经第五十三味，讲解（PDF 第 194–195 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"剂量的两个立场","c":"讲义讲「一个极实用的分层」：「**平常好像我炖个四物汤，四物汤里也有川芎啊、八珍汤啊，川芎然后去炖鸡，你用个两钱、三钱就可以了。****治病的时候，开处方要有个观念：剂量上面你要看那个病人嘛——你要是她救命还是要给他省钱？****川芎是无毒的药，你吃个一两、一剂一两也不会死人；你要救他，开个一两又 So What？**」\n\n**【极重要】剂量的两个立场**\n\n```\n保健（四物汤炖鸡）→ 2–3 钱\n救命             → 1 两\n```\n\n**「你要救命还是要省钱」——「这是最精的两个立场。」**要点：**须「标」**：**「『无毒可以一两』须谨慎（川芎过量可致头痛/胃刺激/抗凝相互作用）」** ✓✓\n\n**极精！！\"药「房自动减量 = 缺德\"** ✅✓\n- **\"如果说开重剂的时候，他们到药房去抓、药房他不给药，或者说是自己就自动减轻斤两；他不知道病人重到什么程度，所以药房就缺德\"** ✓✓\n- **\"然后你为了拿这个药、你还跟他争辩一番、还在那边吵，然后他又表示自己懂\"** ✓✓","o":"RJ-2064 · 《人纪·神农本草经》上经第五十三味，讲解（PDF 第 195 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"川芎与当归","c":"原文【容川】「**川芎之味更辛苦于当归，得木火之性尤烈，苦而兼辛，有生血之功，质不柔润，性专走窜，故专主行心肝之血。****苦者火之味也，苦而兼辛，则性温而有生血之功；苦而不辛，则性凉而专主泻血。****温者阴中之阳，是风木本气，故入肝经；根又主上升故能至于巅顶，以散风寒。**」\n\n**【极精】川芎 vs 当归**\n\n| 药 | 味 | 性 |\n|---|---|---|\n| **当归** | **辛甘** | **补（柔润）** |\n| **川芎** | **辛苦更烈** | **走窜（行血）** |\n\n**「质不柔润，性专走窜，专主行心肝之血」——「这是最精的同族异用。」**要点：**这一条极精，它与 n182「当归味厚」同一主题** ✓✓\n\n**极精！！\"根「主上升→至巅顶\"** ✅✓\n- **\"根又主上升故能至于巅顶，以散风寒\"** ✓✓\n- **\"上行头目，下行血海\"** ✓✓\n\n**【极精】\"川「芎上下皆到（头目 + 血海）\"** ✅✓","o":"RJ-2065 · 《人纪·神农本草经》上经第五十三味，原文引唐容川（PDF 第 194 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"黄连的本草条目","c":"【本经原文】「**味苦寒，主热气，目痛，眦伤，泣出，明目，肠澼，腹痛，下利，妇人阴中肿痛；久服令人不忘。**」【性味】「**味苦性寒无毒。**」【主治】「**黄连为清火除湿健胃要药，功能治湿滞，解热毒，益肝胆，厚肠胃，主治肠澼下痢，天行热疾，胎毒疳疾。**」【别录】「**五脏冷热，久下泄澼脓血，止消渴，大惊，调胃厚肠益胆，疗口疮。**」【容川】「**黄连之味正苦，入心经以泻火；清火之药，是水交于火也，故能止血；凡药得苦味者，其中必含水性，故能降火，此为水火互根之理；其纯于苦味而无气，故守而不走，为去暑之要药。**」【药征】「**主治心中烦悸也，旁治心下痞，吐下腹中痛。**」【用量】「**普通三分至一钱。**」【禁忌】「**血少气虚、致惊悸烦燥；小儿痘疮阳虚作泄、行浆后泄泻；老人脾胃虚寒泻、真阴不足内热均忌。**」\n\n**【极重要】黄连的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦/寒/无毒** |\n| **主治** | **清火除湿/解热毒/厚肠胃** |\n| **禁** | **血少气虚/脾胃虚寒** |\n\n**「纯于苦味而无气，故守而不走」是黄连最精的定性** ✓✓","o":"RJ-2066 · 《人纪·神农本草经》上经第五十五味「黄连」，原文（PDF 第 196–197 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"虚热黄连阿胶汤，实热三黄泻心汤","c":"原文【倪注】「**按此药专治热与利湿，凡出现热症皆可用；但是须要辨明是属于何种热。****例如虚热，则须在去热药中增加补虚的药物，像黄连阿胶汤；如是实热，则须在去热的药中加去实的药物，像三黄泻心汤之类。****学者按此推之，即可善用黄连。**」\n\n**【极重要】虚热 vs 实热**\n\n```\n虚热 → 黄连阿胶汤（去热 + 补虚）\n实热 → 三黄泻心汤（去热 + 去实）\n```\n\n**「同一个黄连，配补虚或配去实，方向完全不同」——「这条与 n197虚热的治法」完全一致。**要点：**这一条极重要，它是「同药不同配」** ✓✓","o":"RJ-2067 · 《人纪·神农本草经》上经第五十五味，原文【倪注】（PDF 第 197 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"剂量与煮法","c":"讲义讲「一个极精的剂量观」：「**平常剂量的时候，如果是汤剂，我们两钱；那要看你怎么用。****像我开两钱的时候，有时候是九碗煮三碗，所以倒一碗、手上还不到一钱。****你如果是开一钱的话，你可以三碗煮一碗，剂量是跟我一样的。****所以不单单是看你药是多少，同时你要看它怎么个熬煮法。**」\n\n**【极重要】剂量 = 重量 × 煮法**\n\n```\n2 钱 / 9 碗煮 3 碗\n  = 每碗 1 钱（同 1 钱 / 3 碗煮 1 碗）\n```\n\n**「三钱那么苦？其实是九碗煮三碗，每碗刚好一钱」——「这是最精的剂量两个变量。」**要点：**这一条极重要，它是「重量 + 浓度」** ✓✓","o":"RJ-2068 · 《人纪·神农本草经》上经第五十五味，讲解（PDF 第 197–198 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"寒极生热，热极生寒","c":"讲义讲「一个极危险的反治法」：「**有的时候病人如果是极虚极寒的时候，你用了很热的药下去，他吃下去还是冷；这时候你用黄连、极寒的药下去——寒极生热。****本来你是这样子过去、一直在寒，结果我们用热药去压它、压不下来，干脆用寒的过来，一推推回来了。****同样的，当你是很热很热的时候，我们用很凉的药下去、一直在压制它；如果没有好了、你给它寒凉的药越多、它反而越热，这个时候我们给热的药、它会回头。****那有时候很热壮热、一派的阳明热证，开石膏是对症、石膏八两十两十二两一斤下去他还是热，那怎么办？——生附子，一剂一下去三钱就够了。**」\n\n**【极重要】寒极生热，热极生寒**\n\n```\n极寒 + 热药不效 → 黄连（寒极生热）\n极热 + 石膏不效 → 生附子（热极生寒）\n```\n\n**「完全是逆道、背道而驰」——「须强标：这是极危险的反治法。」**要点：**须「强「标」**：**「①这是极危险的反治法，须由经验丰富的中医师在辨证确切 + 严密监护下使用；②生附子有乌头碱毒性；③不可自行尝试；④急危重症须先现代医学评估」** ✓✓","o":"RJ-2069 · 《人纪·神农本草经》上经第五十五味，讲解（PDF 第 198 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"黄连与石膏","c":"讲义讲「一个极精的分层」：「**黄连跟石膏有点不太一样：石膏呢，它是颜色是白色的、它是寒凉的药；那黄连是不是颜色比较深？石膏是淡味的、那黄连是味道很厚的。****所以一个入血分、一个入气，两个是不一样的性质。****血里面过热、产生毒素我们会用到黄连。**」\n\n**【极精】黄连 vs 石膏**\n\n| 药 | 色/味 | 层 |\n|---|---|---|\n| **石膏** | **白/淡** | **气分** |\n| **黄连** | **深/厚** | **血分** |\n\n**「一个入血分，一个入气分」——「这条与 n186石膏」同一主题。**要点：**这一条极精，它是「气血二分」** ✓✓","o":"RJ-2070 · 《人纪·神农本草经》上经第五十五味，讲解（PDF 第 198–199 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"口疮外用五倍子","c":"讲义讲「一个极具体的选药」：「**嘴巴里面有生疮的时候，我们黄连是内服；黄连粉来涂嘴巴，你已经很苦了、涂上更苦。****所以我们嘴巴里面有疮在、在外用的时候我们不是用黄连，我们是用五倍子。****五倍子打粉、粉剂，涂口舌。****很涩，它一沾在……『老师那个口水也沾不住』——你错了，就沾得住；五倍子一沾就沾住了，别的东西沾不住、就是五倍子可以沾住。**」\n\n**【极精】口疮外用 = 五倍子（涩能黏）**\n\n```\n内服 → 黄连\n外用 → 五倍子（涩/黏得住）\n```\n\n**「五倍子一沾就沾住」——「这是最具体的内外分工。」**要点：**这一条极精，它是「同证分内外」** ✓✓","o":"RJ-2071 · 《人纪·神农本草经》上经第五十五味，讲解（PDF 第 198–199 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"杀虫的智斗","c":"讲义讲「一个极精的配方设计」：「**杀虫呢，我们会用苦味的药杀虫：找那个最苦的药、最酸的药、最辣的药找出来，这三个把它混在一起。****然后为了虫吃到，要骗那个虫——不然那个虫很聪明，你一闻到那个饭菜的香味、虫也闻到，『哇好爽』，虫开始动了。****那它吃到这个黄连『我不要吃』——虫会挑食物啊。****所以我们要跟虫斗智：挑最苦的药——黄连，最酸的药——比如说乌梅，最辣的药——干姜，和在一起。****然后外面用蜜包起来；到了里面蜂蜜没了，咬下去是『哇又苦又酸又辣』，它一气就搬家、全部出来从大便。**」\n\n**【极重要】杀虫的智斗**\n\n```\n蜜衣（诱）→ 苦（黄连）+ 酸（乌梅）+ 辣（干姜）\n  → 虫搬家\n```\n\n**「要跟虫斗智」——「这是最精的诱敌深入。」**要点：**须「标」**：**「①规范驱虫用阿苯达唑/甲苯达唑/伊维菌素；②乌梅丸是经方（须专业辨证）；③不可自行配制」** ✓✓","o":"RJ-2072 · 《人纪·神农本草经》上经第五十五味，讲解（PDF 第 199 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"虫的四个诊断","c":"讲义讲「一个极具体的查虫法」：「**怎么知道这小孩子身体里面有虫呢？诊断的方法很多。****第一个，你把他眼睛张开来看：白的地方你看到蓝点、或者是小黑点，一块块小点，有的一个两个，这个是 75% 就已经肯定肚子里面有虫了。****还有就是下唇拉起来，你看到牙肉最底下、很多的白点、一串一串的白点，这是虫。****脚上的压百虫窝，百虫窝压有压痛点，肚子里面有虫。****问诊『你晚上睡觉时候肛门痒不痒？』『痒啊，有时候抓肛门』——好，虫。****还有的呢，大便，你去看大便、大便里面就有虫啊。**」\n\n**【极重要】虫的四个诊断**\n\n| 法 | 征 |\n|---|---|\n| **眼白蓝/黑点** | **75% 确定** |\n| **下唇内白点** | **虫** |\n| **百虫窝压痛** | **虫** |\n| **夜间肛门痒** | **虫** |\n| **大便见虫** | **虫** |
