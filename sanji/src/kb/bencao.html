气生发于春，乃少阳之气，宜温而柔，似脉中和缓而微弦之象。****如生发太过，刚暴急躁，失其柔和之性，则宜甘味缓其性，制约其迫急之势，如甘草。****肝德在散，辛者横行而散，可助肝之用，故为补，如柴胡、川芎。****酸味束而收敛，补肝体而敛肝用，碍其疏散之性，故以之为泻，如五味子。**」\n\n**【最重要】五脏苦欲补泻完整表（苦/欲 双栏）**\n\n| 脏 | **苦（所恶）** | **欲（所喜=补）** | 泻 |\n|---|---|---|---|\n| **肝** | 急（甘缓） | 散（辛补） | 酸 |\n| **心** | 缓（酸收） | 软（咸补） | 甘 |\n| **脾** | 湿（苦燥） | 缓（甘补） | 苦 |\n| **肺** | 气上逆（苦泄） | 收（酸补） | 辛 |\n| **肾** | 燥（辛润） | 坚（苦补） | 咸 |\n\n**「违其性则苦，遂其性则欲；所恶为泻，所喜为补」——「这是最精的补泻定义。」** ✓✓✓","o":"RJ-2720 · 《人纪·神农本草经》附·第二篇「性味功效理论」（PDF 第 627 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"六淫治法总表","c":"【组方】「**方剂的配伍，就是调剂四气五味，让这些药物相互配合来实现一个功用。****这些配伍原则出自《素问·至真要大论》：『风淫于内，治以辛凉，佐以苦甘，以甘缓之，以辛散之。****热淫于内，治以咸寒，佐以甘苦，以酸收之，以苦发之。****湿淫于内，治以苦热，佐以酸淡，以苦燥之，以淡泄之。****火淫于内，治以咸冷，佐以苦辛，以苦下之。****燥淫于内，治以苦温，佐以甘辛，以苦下之。****寒淫于内，治以甘热，佐以苦辛，以咸泄之。』**」\n\n**【极重要】六淫治法总表（《至真要大论》）**\n\n| 邪 | 主治 | 佐 | 制 |\n|---|---|---|---|\n| **风** | 辛凉 | 苦甘 | 甘缓/辛散 |\n| **热** | 咸寒 | 甘苦 | 酸收/苦发 |\n| **湿** | 苦热 | 酸淡 | 苦燥/淡泄 |\n| **火** | 咸冷 | 苦辛 | 苦下 |\n| **燥** | 苦温 | 甘辛 | 苦下 |\n| **寒** | 甘热 | 苦辛 | 咸泄 |\n\n**「这是最精的组方总纲（六淫六法）。」** ✓✓✓","o":"RJ-2721 · 《人纪·神农本草经》附·第二篇「性味组方理论」（PDF 第 627–628 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"小柴胡汤性味配伍","c":"【成无己《伤寒明理论》】「**柴胡味苦平微寒，黄芩味苦寒，《内经》曰『热淫于内，以苦发之』。****邪在半表半里，则半成热矣。****热气内传，攻之不可，则迎而夺之，必先散热，是以苦寒为主，故以柴胡为君、黄芩为主，以成撤热发汗之剂。****人参味甘平，邪气传里，则里气不治，甘以缓之，是以甘物为之助，故用人参甘草为佐，以扶正气而复之也。****半夏味辛微温，邪初入里，则里气逆，辛以散之，是以辛物为之助，故用半夏为佐，以顺逆气、而散邪也。****生姜味辛温，大枣味甘温，《内经》曰『甘辛发散为阳』。****表邪未已、迤逦内传，即未作实，宜当两解，其在外者必以甘辛之物发散，故生姜大枣为使。**」\n\n**【极重要】小柴胡汤的性味配伍解（成无己）**\n\n```\n君：柴胡（苦平微寒）+ 黄芩（苦寒）→ 撤热\n佐：人参/甘草（甘平）→ 扶正气\n佐：半夏（辛温）→ 散逆气\n使：生姜（辛温）+ 大枣（甘温）→ 发散和表\n「七物相合，两解之剂」\n```\n\n**「这是最精的『用性味解方』范式。」** ✓✓","o":"RJ-2722 · 《人纪·神农本草经》附·第二篇「性味组方理论」（PDF 第 628 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"五行五性与五能","c":"【五行·五性】「**五行为一气，它属于气的消息变化。****气的变化分三种情况：1、阳；2、阴；3、阴阳平衡。****属于阳的有火和木：****1、火主向上运动，而且运动的速度快，有『炎上』的特点，表示气的上升，属于『长』。****2、木主发散运动，运动的速度缓慢些，有『曲直』的特点，表示气的展放，属于『生』。****属于阴的有金和水：****3、金主向内聚动，也就是收敛运动，有『从革』的特点，它运动的速度较快，表示气的内收，属于『收』。****4、水主向下运动，运动速度缓慢，有『润下』的特点，表示气之下降，属于『藏』。****属于阴阳平衡的有土：****5、土主水平旋转，外界看起来属于平衡态（内动外静），有『稼穑、化育』的特点，表示气之平衡，属于『化』。**」【五能】「**1、火：上升能；2、木：发射能；3、土：旋转能；4、金：聚合能；5、水：下势能。**」\n\n**【极重要】五行五性（炎上/曲直/从革/润下/稼穑）与五能**\n\n| 行 | 性 | 运动 | 能量 |\n|---|---|---|---|\n| **火** | 炎上 | 向上（快） | 上升能 |\n| **木** | 曲直 | 发散（慢） | 发射能 |\n| **土** | 稼穑 | 水平旋转 | 旋转能 |\n| **金** | 从革 | 内收（较快） | 聚合能 |\n| **水** | 润下 | 向下（慢） | 下势能 |\n\n**「用『速度+方向』定义五行」——「这是全书最精的物理化解释。」** ✓✓","o":"RJ-2723 · 《人纪·神农本草经》附·第四篇「五行五性/五能」（PDF 第 630–632 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"相生相克是好的相乘相侮是坏的","c":"【五行关系】「**五行的关系分为两种状态：****1、平衡状态——包括相生相克。****一定要搞清楚，相生相克是保持阴阳平衡的关键，它们都是『好的』。****2、异常状态——包括相乘相侮。****此时已经失去平衡，它们才是『坏的』。**」【相生】「**相生就是互相助长、促进、互助，目的是补不足。****相生的顺序是：土生金生水生木生火生土，一个循环闭环。**」【相克】「**相克就是互相抑制、制约、克制，目的是防太过。****相克的顺序是：土克水克火克金克木克土，也是一个循环闭环。**」【类经】「**盖造化之机，不可无生，亦不可无制。****无生则发育无由，无制则亢而为害。**」【相乘】「**相乘就是倍克，加倍克制的意思，目的变成『乘人之危』了，是进攻。****相乘的顺序跟相克一致：木乘土，土乘水，水乘火，火乘金，金乘木。****相克的原因有两种：被克者不足，或者克者太过。**」【相侮】「**相侮就是反克，反过来克制的意思，目的变成『反客为主』了，是防守。****相侮的顺序跟相克相反：木侮金，金侮火，火侮水，水侮土，土侮木。****相侮的原因也有两种：被克者太过，或者克者不足。**」\n\n**【最重要】相生相克（正常）vs 相乘相侮（异常）**\n\n```\n相生（补不足）：土→金→水→木→火→土\n相克（防太过）：土→水→火→金→木→土\n相乘（A太过/B不足）→ 顺相克方向加重\n相侮（A不足/B太过）→ 逆相克方向反克\n「无生则发育无由，无制则亢而为害」\n```\n\n**「『相生相克都是好的』——这是全书最精的观念纠偏（很多人误以为相克是病）。」** ✓✓✓","o":"RJ-2724 · 《人纪·神农本草经》附·第四篇「五行相生相克相乘相侮」（PDF 第 632–635 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"五行与后天八卦","c":"「**五行和先天八卦没有明显的直接关系。****因为五行的『行』相当于 s=v·t 中的 v，也就是速度。****它跟 s（距离、空间）和 t（时间）都有关系。****而先天八卦描述的是天地生成的阳升阴降……表述生生不息，没有明显的相克等关系。****而后天八卦既有时间又有空间，既表现为相生、又表现为相克，故可以和五行极好地对应上。****它们的对应关系基于时位关系。****比如：在后天八卦中，震属于东方、属于春天，而五行是木属于东方、属于春天，所以震属于木。****为啥有两土两木两金而只有一火一水呢？因为阴阳的质变和量变。****震木到巽木是木的量变——此阶段阳气增加，虽然发散运动加快，但未达到炎上的温度，仍然为木。****兑金到乾金是金的量变——此阶段阴气增加，虽然收敛运动变慢，但未变成润下的特征，故仍然为金。****而坤土和艮土，是阴阳质变的两个阶段。****坤土为阴、为湿土，所以靠近离火，火温湿土则生兑金。****艮土为阳、为干土，所以靠近坎水，水润土则生木。**」\n\n**【极精】五行与后天八卦的对应（两土两木两金、一火一水）**\n\n```\n后天八卦（时空兼具）↔ 五行（速度 v）\n震/巽 = 木（量变：发散加快未到炎上）\n兑/乾 = 金（量变：收敛变慢未到润下）\n坤（湿土/阴）→ 近离火 → 火温湿土生兑金\n艮（干土/阳）→ 近坎水 → 水润土生木\n「五行 = 气的速度」\n```\n\n**「五行=速度 v，八卦=s 与 t」——「这是全书最精的物理类比（与天纪可交叉印证）。」** ✓✓","o":"RJ-2725 · 《人纪·神农本草经》附·第四篇「五行与八卦」（PDF 第 635–636 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"本草备要药性总义","c":"【第五篇《本草备要》药性总义】「**凡药酸属木入肝、苦属火入心、甘属土入脾、辛属金入肺、咸属水入肾，此五味之义也。****凡药青属木入肝、赤属火入心、黄属土入脾、白属金入肺、黑属水入肾，此五色之义也。****凡药酸者能涩能收、苦者能泻能燥能坚、甘者能补能和能缓、辛者能散能润能横行、咸者能下能软坚、淡者能利窍能渗泄，此五味之用也。****凡药寒、热、温、凉，气也；酸、苦、甘、辛、咸，味也。****气为阳，味为阴。****气厚者阳中之阳，薄者阳中之阴；味厚者阴中之阴，薄者阴中之阳。****气薄则发泄（发散），厚则发热（温燥），味厚则泄（降泻），薄则通（利窍渗湿）。****辛甘发散为阳，酸苦涌泄为阴，咸味涌泄为阴，淡味渗泄为阳。****轻清升浮为阳，重浊沉降为阴。****阳气出上窍，阴味出下窍。****清阳发腠理，浊阴走五脏。****清阳实四肢，浊阴归六腑。****此阴阳之义也。****凡药轻虚者浮而升，重实者沉而降。****味薄者升而生（象春），气薄者降而收（象秋），气厚者浮而长（象夏），味厚者沉而藏（象冬），味平者化而成（象土）。**」\n\n**【极重要】《本草备要》药性总义（最凝练的纲领）**\n\n```\n五味入五脏：酸肝/苦心/甘脾/辛肺/咸肾\n五色入五脏：青肝/赤心/黄脾/白肺/黑肾\n五用：酸涩收/苦泻燥坚/甘补和缓/辛散润横行/咸下软坚/淡利窍渗泄\n气味阴阳：辛甘发散为阳；酸苦涌泄为阴；咸涌泄为阴；淡渗泄为阳\n升降：轻清升浮/重浊沉降\n四季象：味薄象春（升）/气薄象秋（降）/气厚象夏（长）/味厚象冬（藏）/味平象土（化）\n```\n\n**「这是全册最凝练的总纲（可作全书的总结页）。」** ✓✓✓","o":"RJ-2726 · 《人纪·神农本草经》附·第五篇「《本草备要》药性总义」（PDF 第 637–638 页）。"},{"t":"本草备要药性总义（终篇）：药用部位、七情、五味所伤、炮制","h":"根升梢降","c":"【《本草备要》药性总义】「**凡药根之在土中者，半身以上则上升，半身以下则下降**（以生苗者为根，以入土者为梢）。******上焦用根，下焦用梢，半身以上用头，中焦用身，半身以下用梢。****虽一药而根、梢各别，用之或差，服亦罔效**」。【李时珍】「**升者引之以咸寒，则沉而直达下焦；沉者引之以酒，则浮而上至巅顶。****一物之中，有根升梢降、生升熟降者，是升降在物亦在人也。**」【药之为枝/皮/心/干】「**药之为枝者达四肢，为皮者达皮肤，为心、为干者内行脏腑。****质之轻者上入心、肺，重者下入肝、肾。****中空者发表，内实者攻里。****枯燥者入气分，润泽者入血分。****此上下内外，各以其类相从也。**」\n\n**【最重要】用药部位决定作用方向**\n\n```\n根（生苗/半身以上）→ 升/上焦\n梢（入土/半身以下）→ 降/下焦\n头 → 上焦；身 → 中焦\n枝 → 四肢；皮 → 皮肤；心/干 → 内行脏腑\n质轻 → 心肺（上）；质重 → 肝肾（下）\n中空（如麻黄/木通）→ 发表\n内实 → 攻里\n枯燥 → 入气分；润泽 → 入血分\n```\n\n**「汉防己用根（上行）、木防己用梢（下行）」——「这是全册最精的『部位选药』（与 n228 防己条目互证）。」** ✓✓✓","o":"RJ-2727 · 《人纪·神农本草经》附·第五篇「《本草备要》药性总义」（PDF 第 638 页）。"},{"t":"本草备要药性总义（终篇）：药用部位、七情、五味所伤、炮制","h":"五色五味五气配十经","c":"「**凡药色青、味酸、气臊、性属木者，皆入足厥阴肝、足少阳胆经**（肝与胆相表里，胆为甲木，肝为乙木）；**色赤、味苦、气焦、性属火者，皆入手少阴心、手太阳小肠经**（小肠为丙火，心为丁火）；**色黄、味甘、气香、性属土者，皆入足太阴脾、足阳明胃经**（胃为戊土，脾为己土）；**色白、味辛、气腥、性属金者，皆入手太阴肺、手阳明大肠经**（大肠为庚金，肺为辛金）；**色黑、味咸、气腐、性属水者，皆入足少阴肾、足太阳膀胱经**（膀胱为壬水，肾为癸水）。****凡一脏配一腑，腑皆属阳，故为甲、丙、戊、庚、壬；脏皆属阴，故为乙、丁、己、辛、癸也。**」\n\n**【极重要】五色/五味/五气 → 五脏六腑十经（配十天干）**\n\n| 五色 | 味 | 气 | 行 | 腑（阳/干） | 脏（阴/干） |\n|---|---|---|---|---|---|\n| **青** | 酸 | 臊 | 木 | 胆（甲） | 肝（乙） |\n| **赤** | 苦 | 焦 | 火 | 小肠（丙） | 心（丁） |\n| **黄** | 甘 | 香 | 土 | 胃（戊） | 脾（己） |\n| **白** | 辛 | 腥 | 金 | 大肠（庚） | 肺（辛） |\n| **黑** | 咸 | 腐 | 水 | 膀胱（壬） | 肾（癸） |\n\n**「腑皆阳（甲丙戊庚壬），脏皆阴（乙丁己辛癸）」——「这是最精的干支配脏腑。」** ✓✓","o":"RJ-2728 · 《人纪·神农本草经》附·第五篇「药性总义」（PDF 第 638 页）。"},{"t":"本草备要药性总义（终篇）：药用部位、七情、五味所伤、炮制","h":"心包三焦无所主","c":"「**十二经中，惟手厥阴心包、手少阳三焦经无所主，其经通于足厥阴、少阳。****厥阴主血，诸药入肝经血分者，并入心包；****少阳主气，诸药入胆经气分者，并入三焦。****命门相火，散行于胆、三焦、心包络，故入命门者，并入三焦。****此诸药入诸经之部分也。**」\n\n**【极重要】心包/三焦「无所主」——寄附于肝/胆**\n\n```\n手厥阴心包 ← 并入 足厥阴肝（血分）\n手少阳三焦 ← 并入 足少阳胆（气分）\n命门相火 → 散行胆/三焦/心包\n```\n\n**「这是最精的十二经『实为十经』解释。」** ✓✓","o":"RJ-2729 · 《人纪·神农本草经》附·第五篇「药性总义」（PDF 第 638–639 页）。"},{"t":"本草备要药性总义（终篇）：药用部位、七情、五味所伤、炮制","h":"药之七情","c":"「**药有相须者，同类而不可离也**（如黄柏、知母、破故纸、胡桃之类）；**相使者，我之佐使也；相恶者，夺我之能也；相畏者，受彼之制也；相反者，两不可合也；相杀者，制彼之毒也。****此异同之义也。**」\n\n**【最重要】药之七情（相须/相使/相恶/相畏/相反/相杀 + 单行）**\n\n| 情 | 含义 | 例 |\n|---|---|---|\n| **相须** | 同类不可离（协同） | 黄柏+知母；破故纸+胡桃 |\n| **相使** | 我之佐使（主辅） | — |\n| **相恶** | 夺我之能（削弱） | — |\n| **相畏** | 受彼之制（被抑制） | — |\n| **相反** | 两不可合（配伍禁忌） | 十八反 |\n| **相杀** | 制彼之毒（解毒） | 生姜杀半夏 |\n\n**须「绝「对「强「标」**：**「①相反/相恶须严守（十八反）；②相畏与相恶古义不同；③配伍须专业医师」** ✓✓","o":"RJ-2730 · 《人纪·神农本草经》附·第五篇「药性总义」（PDF 第 639 页）。"},{"t":"本草备要药性总义（终篇）：药用部位、七情、五味所伤、炮制","h":"子母补泻与子能令母实","c":"「**人之五脏应五行，金、木、水、火、土，子母相生。****经曰：『虚则补其母，实则泻其子。』****又曰：『子能令母实。』****如肾为肝母，心为肝子，故入肝者，并入肾与心；****肝为心母，脾为心子，故入心者，并入肝与脾；****心为脾母，肺为脾子，故入脾者，并入心与肺；****脾为肺母，肾为肺子，故入肺者，并入脾与肾；****肺为肾母，肝为肾子，故入肾者，并入肺与肝。****此五行相生，子母相应之义也。**」\n\n**【最重要】子母补泻 + 一药入三经**\n\n```\n虚则补其母，实则泻其子\n「子能令母实」\n入肝者 → 兼入肾（母）+ 心（子）\n入心者 → 兼入肝（母）+ 脾（子）\n入脾者 → 兼入心（母）+ 肺（子）\n入肺者 → 兼入脾（母）+ 肾（子）\n入肾者 → 兼入肺（母）+ 肝（子）\n```\n\n**「『一药入三经』——这是最精的归经扩展。」** ✓✓✓","o":"RJ-2731 · 《人纪·神农本草经》附·第五篇「药性总义」（PDF 第 639 页）。"},{"t":"本草备要药性总义（终篇）：药用部位、七情、五味所伤、炮制","h":"五味所伤","c":"「**酸伤筋**（敛则筋缩），**辛胜酸；苦伤气**（苦能泻气），**咸胜苦；甘伤肉，酸胜甘；辛伤皮毛**（疏散腠理），**苦胜辛；咸伤血**（咸能渗泄），**甘胜咸。****此五行相克之义也。**」\n\n**【极重要】五味所伤与「相胜」（五行相克）**\n\n```\n酸伤筋 → 辛胜酸（金克木）\n苦伤气 → 咸胜苦（水克火）\n甘伤肉 → 酸胜甘（木克土）\n辛伤皮毛 → 苦胜辛（火克金）\n咸伤血 → 甘胜咸（土克水）\n```\n\n**须「标」**：**「①此为传统五行推演；②『伤』须按过量理解；③不可因此禁食」** ✓✓","o":"RJ-2732 · 《人纪·神农本草经》附·第五篇「药性总义」（PDF 第 639 页）。"},{"t":"本草备要药性总义（终篇）：药用部位、七情、五味所伤、炮制","h":"五病所禁","c":"「**酸走筋，筋病毋多食酸**（筋得酸，则拘挛收引益甚也）；**苦走骨，骨病毋多食苦**（骨得苦，则阴益甚重而难举也）；**甘走肉，肉病毋多食甘**（肉得甘，则壅气胪肿益甚也）；**辛走气，气病毋多食辛**（气得辛，则散而益虚也）；**咸走血，血病毋多食咸**（血得咸，则凝涩而口渴也——咸能渗泄津液）。****此五病之所禁也。**」\n\n**【极重要】五病所禁（与 n79「五味所禁」互证）**\n\n| 味 | 走 | 病禁 | 机理 |\n|---|---|---|---|\n| **酸** | 筋 | 筋病禁酸 | 拘挛收引更甚 |\n| **苦** | 骨 | 骨病禁苦 | 阴重难举 |\n| **甘** | 肉 | 肉病禁甘 | 壅气胪肿 |\n| **辛** | 气 | 气病禁辛 | 散而益虚 |\n| **咸** | 血 | 血病禁咸 | 凝涩口渴（渗泄津液） |\n\n**「咸走血」——「这是最精的『高血压/血液病忌咸』的经典依据（与限钠一致）。」** ✓✓✓","o":"RJ-2733 · 《人纪·神农本草经》附·第五篇「药性总义」（PDF 第 640 页）。"},{"t":"本草备要药性总义（终篇）：药用部位、七情、五味所伤、炮制","h":"多食五味致五伤","c":"「**多食咸，则脉凝泣而变色**（脉即血也，心合脉，水克火）；**多食苦，则皮槁而毛拔**（肺合皮毛，火克金）；**多食辛，则筋急而爪枯**（肝合筋，爪者筋之余，为金克木）；**多食酸，则肉胝胕而唇揭**（脾合肉，其华在唇，木克土）；**多食甘，则骨痛而发落**（肾合骨，其华在发，土克水）。****此五味之所伤也。**」\n\n**【最重要】多食五味致五伤（《素问·五脏生成》同源）**\n\n```\n多咸 → 脉凝泣（心血）\n多苦 → 皮槁毛拔（肺）\n多辛 → 筋急爪枯（肝）\n多酸 → 肉胝唇揭（脾）\n多甘 → 骨痛发落（肾）\n```\n\n**「与 n66五脏生成」完全一致。** ✓✓\n\n**须「标」**：**「①高盐致高血压（与『脉凝泣』可互证）；②高糖与骨质/脱发有关（观察性）；③平衡饮食为本」** ✓✓","o":"RJ-2734 · 《人纪·神农本草经》附·第五篇「药性总义」（PDF 第 640 页）。"},{"t":"本草备要药性总义（终篇）：药用部位、七情、五味所伤、炮制","h":"以形相类入经","c":"「**药之为物，各有形、性、气、质。****其入诸经，有因形相类者**（如连翘似心而入心，荔枝核似睾丸而入肾之类）；**有因性相从者**（如属木者入肝、属水者入肾；润者走血分，燥者入气分；本天者亲上、本地者亲下之类）；**有因气相求者**（如气香入脾、气焦入心之类）；**有因质相同者**（如药之头入头、干入身、枝入肢、皮行皮；又如红花、苏木汁似血而入血之类）。****自然之理，可以意得也。**」【命名】「**药有以形名者（人参、狗脊之类）；有以色名者（黄连、黑参）；有以气名者（香薷）；有以味名者（甘草、苦参）；有以质名者（石膏、石脂、归身、归尾）；有以时名者（夏枯、款冬）；有以能名者（何首乌、骨碎补）。**」\n\n**【极精】入经四条路径：形/性/气/质**\n\n```\n形相类 → 连翘似心入心；荔枝核似睾丸入肾\n性相从 → 木入肝/水入肾；润入血/燥入气\n气相求 → 香入脾；焦入心\n质相同 → 头入头/枝入肢/皮行皮；红花苏木汁似血入血\n```\n\n**「荔枝核似睾丸入肾」——「这是最精的取象（与天纪术数取象同源）。」** ✓✓\n\n**须「标」**：**「①取象归经为传统模型；②须以实证药理证实；③不可仅凭外形用药」** ✓✓","o":"RJ-2735 · 《人纪·神农本草经》附·第五篇「药性总义」（PDF 第 640 页）。"},{"t":"本草备要药性总义（终篇）：药用部位、七情、五味所伤、炮制","h":"炮制九法与对药性影响","c":"「**凡药火制四：煅、煨、炙、炒也；水制三：浸、泡、洗也；水火共制二：蒸、煮也。****酒制升提，姜制温散；入盐走肾而软坚，用醋注肝而收敛；童便制，除劣性而降下；米泔制，去燥性而和中；乳制润枯生血，蜜制甘缓益元；陈壁土制，借土气以补中州；面裹曲制，抑酷性勿伤上膈；黑豆、甘草汤渍，并解毒致令平和；羊酥、猪脂涂烧，咸渗骨容易脆断。****去穣者免胀，去心者除烦。****此制治各有所宜也。**」\n\n**【极重要】炮制九法（火四/水三/水火共二）与炮制对药性的定向改变**\n\n```\n火制四：煅/煨/炙/炒\n水制三：浸/泡/洗\n水火共制二：蒸/煮\n──────────────────\n酒制升提　姜制温散\n盐制走肾软坚　醋制注肝收敛\n童便制降下　米泔制去燥和中\n乳制润枯生血　蜜制甘缓益元\n陈壁土制补中州　面裹曲制护上膈\n黑豆/甘草汤渍解毒\n羊酥/猪脂涂烧渗骨\n去穣免胀　去心除烦\n```\n\n**「这是全册最完整的炮制总表（把 n181–n251 全书的炮制散点一网打尽）。」** ✓✓✓","o":"RJ-2736 · 《人纪·神农本草经》附·第五篇「药性总义」（PDF 第 640 页）。"},{"t":"本草备要药性总义（终篇）：药用部位、七情、五味所伤、炮制","h":"用药五失：兵不精练适以舆尸","c":"「**药之为用，或地道不真，则美恶迥别；或市肆饰伪，则气味全乖；或收采非时，则良莠异质；或头尾误用，则呼应不灵；或制治不精，则功力大减。****用者不察，顾归咎于药之罔功。****譬之兵不精练，思以荡寇克敌，适以舆众舆尸也。****治疗之家，其可忽诸！**」【《千金》】「**凡药须治择熬泡毕，然后秤用。****不得生秤，湿润药皆先增分两，燥乃秤之。**」\n\n**【极重要】用药五失（地道/市肆/收采/头尾/制治）**\n\n```\n① 地道不真（产地不对）→ 美恶迥别\n② 市肆饰伪（掺假造假）→ 气味全乖\n③ 收采非时（采收时机）→ 良莠异质\n④ 头尾误用（部位错用）→ 呼应不灵\n⑤ 制治不精（炮制不到位）→ 功力大减\n「兵不精练，适以舆尸」（打不过还抬尸回来）\n《千金》：湿药先增分两，燥乃秤之\n```\n\n**「这是全册最精的药材质量观（现代 GAP/GMP 的古典表达）。」** ✓✓✓\n\n**「神农本草经全册至此收官（639 页 / 70.07 万字全覆盖）。」** ✓✓","o":"RJ-2737 · 《人纪·神农本草经》附·第五篇「药性总义」（PDF 第 640 页）。"}];</script>
