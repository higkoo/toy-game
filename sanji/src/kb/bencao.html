药以后，咳血也没有了，那什么时候是好的呢？****这就需要用《黄帝内经》跟针灸。****很简单嘛：晚上一觉到天亮，3 点到 5 点都不会醒过来，对不对？****肺有问题的时候，3 点钟准时醒过来，5 点钟以后就可以睡了。****肝有问题的话，1 点到 3 点。****还有呢，肺主皮毛、皮肤毛孔，皮肤毛孔变得很润泽。****那舌苔是气的所在，舌苔也可以看到肺里面的功能情形；眼白的部分也是可以看到肺的情形。****还有你可以压第三椎，看他痛不痛；还有耳朵里面的肺的点穴区。**」\n\n**【极精】肺病 = 3–5 点醒（肝病 1–3 点）**\n\n```\n3–5 点醒 → 肺\n1–3 点醒 → 肝\n肺愈判据：一觉到 5 点 + 皮肤润泽\n```\n\n**须「标」**：**「①夜间定时醒无特异性；②须查OSA/哮喘/心衰；③不可单凭此判病」** ✓✓\n\n**「这条与 n1771–3 点起床＝肝经病」完全一致。** ✓✓","o":"RJ-2580 · 《人纪·神农本草经》下经第二百八十六味，讲解（PDF 第 535–536 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"青葙子就是草决明","c":"【本经原文】「**味苦，微寒，无毒；治邪气，皮肤中热，风瘙身痒，杀三虫；子名草决明，治唇口青。**」【性味】「**味苦，性微寒，无毒。**」【主治】「**青葙子为眼科要药，主镇肝明目，治赤障青盲翳膜。**」【甄权】「**治肝脏热毒充眼，赤障青盲翳肿，恶疮疥疮。**」【大明】「**治五脏邪气，益脑髓，镇肝，明耳目，坚筋骨。**」【用量】「**普通一钱至二、三钱。**」【禁忌】「**虚寒之人，火衰目病者不宜。**」讲义：「**青葙子它又名草决明。****诸位读过，决明子就是草决明，跟决明子很类似。****这个青葙子是治疗眼科的、和决明子一样，眼科的药。****诸位，如果你说我什么都不要看，我就专门看眼科，你从这边开始往回头，把眼科的药物通通找出来分寒热，然后再放到柴胡汤、小柴胡汤里面，几乎眼科的病都治，很快、很简单。**」\n\n**【极精】青葙子 = 草决明（眼科，镇肝明目）**\n\n```\n眼科 → 清肝热药 + 小柴胡汤（引经）\n```\n\n**「把眼科药分寒热 + 小柴胡汤 = 几乎治所有眼病」——「这是最精的组方捷径。」** ✓✓\n\n**须「标」**：**「①视力下降须查眼底/OCT；②屈光/白内障须手术；③中药不可替代」** ✓✓","o":"RJ-2581 · 《人纪·神农本草经》下经第二百八十四味「青葙子」，原文及讲解（PDF 第 533–534 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"大戟泻脏腑水湿","c":"【本经原文】「**一名邛巨；味苦，寒，有小毒；治蛊毒，十二水，腹满急痛，积聚，中风，皮肤疼痛，吐逆。**」【性味】「**味苦性寒，有小毒。**」【主治】「**大戟为泻脏腑水湿要药，主消水肿，祛痰涎，利大小便，泻痘毒陷［泻脏腑水湿要药；1. 一般都要加大枣保护身体津液；2. 一定要禁盐。］**」【别录】「**颈腋痈肿头痛，发汗，利大小便。**」【甄权】「**下恶血癖块，腹内雷鸣，通月水，堕胎。**」【大明】「**泻毒药，泻天行，黄病温疟，破症结。**」【用量】「**普通八分至二钱。**」\n\n**【极重要】大戟 = 泻脏腑水湿（须大枣 + 禁盐）**\n\n```\n大戟（峻）→ 水肿/痰涎\n+ 大枣（护津液）\n+ 禁盐\n```\n\n**须「绝「对「强「标」**：**「①大戟有毒（峻下）；②孕妇禁（堕胎）；③须专业医师；④不可自服」** ✓✓","o":"RJ-2582 · 《人纪·神农本草经》下经第二百八十七味「大戟」，原文及主治（PDF 第 536 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"大戟在脏腑之间","c":"讲义讲「一«条«极«重«要«的«定«位»」：「**大戟跟甘遂有点差异：大戟专门在脏腑之间，这个水停在脏腑之间，我们要用大戟。****所以十枣汤我们会用甘遂、大戟。****为什么三种不同的药配在一起？因为三种不同的药，他进入不同的地方：****大戟呢，脏腑之间的消水、水肿。**」【禁忌】「**大戟力峻，取效甚捷而用之亦宜慎，反甘草，用菖蒲解之，得枣良，不损脾。**」【别名】「**伤到它那个茎，会有那个白汁、白色的、奶水一样的乳液流出来。****你在荒郊野外看到那个茎有白色的乳汁流出来，这种都是有毒的。**」\n\n**【极重要】大戟 = 脏腑之间的水（vs 甘遂：经隧/上焦）**\n\n```\n脏腑之间积水 → 大戟\n```\n\n**「白色乳汁的药都有毒」——「这是最精的野外辨识。」** ✓✓\n\n**须「绝「对「强「标」**：**「①大戟有毒；②反甘草（菖蒲解）；③须专业医师；④不可自服」** ✓✓","o":"RJ-2583 · 《人纪·神农本草经》下经第二百八十七味「大戟」，原文及讲解（PDF 第 536–538 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"汤剂攻下粉剂攻上","c":"讲义讲「一«条«最«重«要«的«剂«型«差«别»」：「**汤剂跟粉剂，使用的时机不一样。****汤剂是汤者、荡也，你把这个汤加一个『艹』头，扫荡的『荡』。****所以，你如果说把大戟三钱、甘遂三钱煮成汤吃下去，一般我们是攻肚子、小腿、大腿、脚肿、下半身。****如果是粉，粉就不攻下面。****所以十枣汤我们在吃的时候，粉、直接吃下去，把肺里的水清掉、上焦。****所以汤剂跟粉剂，结果是不一样的。****我们还有贴肚脐的，呆会再跟诸位介绍。**」\n\n**【最重要】汤剂（荡）攻下半身；粉剂攻上焦**\n\n```\n汤剂（汤者荡也）→ 腹水/下肢/脚肿\n粉剂 → 上焦/肺水（十枣汤）\n贴脐 → 另一途径\n```\n\n**「这是全书最精的剂型理论。」** ✓✓\n\n**「与 n240十枣汤用粉」互证。** ✓✓","o":"RJ-2584 · 《人纪·神农本草经》下经第二百八十七味，讲解（PDF 第 537 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"峻剂须配红枣护胃","c":"讲义讲「一«条«极«重«要«的«配«伍»」：「**一般来说，我们用到这种大戟、攻坚药，像芫花、大戟、甘遂这种东西，我们都会和大枣在里面、红枣在里面。****那为什么要红枣呢？因为这种峻剂下去的时候，会把肠胃里面的粘液当场就去掉，速度非常的快。****病人会进入上吐下泄，大吐、吐出来的时候是飚出来的，大便、然后小便不断的排出来。****那我们用红枣放在里面，这是弥补他在吐的同时，不要伤到正气，就是伤到胃气。**」\n\n**【极重要】峻下药必配红枣（护胃黏液）**\n\n```\n大戟/甘遂/芫花/葶苈 + 大枣\n→ 「泻时伤胃津液」被护住\n```\n\n**「这是最精的配伍通则（峻药+护胃）。」** ✓✓\n\n**「与 n239葶苈大枣泻肺汤」、n240「十枣汤」完全一致。** ✓✓","o":"RJ-2585 · 《人纪·神农本草经》下经第二百八十七味，讲解（PDF 第 537–538 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"峻剂与补药须分开","c":"讲义讲「一«条«极«精«的«服«法»」：「**一般来说，都是开一剂就够了。****开完的时候，病人的元气虚，你开些补药把他身体补回来，让水能够汽化。****那水在汽化的时候、它水又回来，你再开第二剂下去清掉。****所以你会补药和攻药同时在使用，但是不会放在同一个方子里边。****比如你攻药早上吃完攻药，中午、晚上要吃滋补药。****不会说把十全大补汤和十枣汤混在一起吃。****先吃完十枣汤，可能吐泄都完了、正常了，再给他吃十全大补。****不然你吃下也吐光了，那个补药统统吐到水槽里边去了，没有用、身体不受。**」\n\n**【极精】峻剂与补药：同一天但不同方（先攻后补）**\n\n```\n早上：攻药（十枣汤）\n正常后：补药（十全大补）——不可同方\n```\n\n**「这是最精的服药时序。」** ✓✓","o":"RJ-2586 · 《人纪·神农本草经》下经第二百八十七味、第二百八十八味，讲解（PDF 第 538–539 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"贯众打虫","c":"【本经原文】「**一名贯节；味苦，微寒，有毒；治腹中邪热气，诸毒，杀三虫。**」【性味】「**味苦，性微寒，有小毒。**」【主治】「**贯众为解毒要药，功能治腹中邪热之毒，软坚破积，及妇科诸血症。**」【别录】「**去寸白［绦虫］，破症瘕，除头风，止金疮。**」【苏颂】「**为末水服一钱，止鼻血有效。**」【灵胎】「**解毒杀虫。**」【用量】「**普通一钱至二钱。**」【禁忌】「**无。**」讲义：「**我们使用贯众的时候，就是打蛔虫、打虫药。****你看小孩子的肚子这么大、那么圆，山野里面、农村里面，小孩子肚子很大很圆，这大部分都有虫在里面、有蛔虫在。****那贯众是一个很凶悍的处方。**」\n\n**【极重要】贯众 = 打蛔虫/绦虫（小儿腹大）**\n\n```\n小儿腹大而圆 → 蛔虫 → 贯众（1–2 钱，虫多 3 钱）\n```\n\n**须「标」**：**「①儿童腹大须查营养/肝脾/寄生虫；②驱虫须确诊（粪检）；③孕妇慎」** ✓✓","o":"RJ-2587 · 《人纪·神农本草经》下经第二百九十味「贯众」，原文及讲解（PDF 第 539 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"肛门痒就是有虫","c":"讲义讲「一«条«极«精«的«单«一«症«状»」：「**有虫子最明显的表征就是晚上睡觉的时候肛门会很痒，那个就是肚子里面有虫。**」\n\n**【极精】肛门夜间痒 = 有虫（蛲虫）**\n\n```\n夜间肛门痒 → 蛲虫（最典型）\n```\n\n**「这是最精的单一症状诊断。」** ✓✓\n\n**须「标」**：**「①须查粪检/透明胶带试验；②须治疗全家；③不可只凭痒服药」** ✓✓","o":"RJ-2588 · 《人纪·神农本草经》下经第二百九十味，讲解（PDF 第 539 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"有虫的三诊法","c":"讲义讲「一«条«极«精«的«儿«童«三«诊»」：「**那小朋友呢，肚子里面有虫，我们检查的方式很多：****第一个，你看如果有虫的话，肚子会很大、挺起来、硬梆梆的；****第二个，你把他下唇拉起来一看——牙齿下方的牙龈的地方，你会看到很多白色的虫卵一样的、一粒粒的、白色的，它就长在那边；****眼白里边有蓝点，都是肚子里边有虫。**」\n\n**【极重要】有虫三诊：腹大硬 + 下唇白点 + 眼白蓝点**\n\n```\n① 腹大挺硬\n② 下唇内侧/牙龈白点（「虫卵斑」）\n③ 眼白蓝点\n```\n\n**须「标」**：**「①这三征无特异性（须粪检）；②下唇白点可为正常腺体；③眼白蓝点可为巩膜色素」** ✓✓\n\n**「这是最精的望诊三征。」** ✓✓","o":"RJ-2589 · 《人纪·神农本草经》下经第二百九十六味「萹蓄」，讲解（PDF 第 543–544 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"狼牙治阴疮","c":"【本经原文】「**一名狼牙；味苦，寒，有毒；治邪气，热气，疥瘙，恶疡，疮，痔，去白虫。**」【性味】「**味苦，性寒，有毒。**」【主治】「**为解毒杀虫要药，治风瘙，恶疮，驱寸白条虫。**」【甄权】「**治浮风瘙痒，煎汁洗恶疮。**」【大明】「**杀腹脏一切虫，止赤白痢，煎服。**」【禁忌】「**内服须慎重。**」讲义：「**这狼牙呢，经方里面使用，在妇人阴中有疮、阴疮、不能收口。****因为阴部里面有津液、是润滑的地方，所以说有伤口在里面的时候，非常不容易收口，因为他不是干的嘛、是湿的。****这个时候我们用狼牙来治疗，外敷的。****一般来说狼牙煮过汤以后，用那个棉棒放到狼牙汤里面泡，泡了之后塞到阴道里面去，能够治得那个疮。****一般来说，这个狼牙都是外用，很少有内服的。**」\n\n**【极精】狼牙汤 = 阴道湿疮（外治）**\n\n```\n阴疮（湿处不易收口）→ 狼牙汤棉棒塞入\n```\n\n**须「强「标」**：**「①阴部溃疡须查性病/疱疹；②须妇科就诊；③狼牙有毒，禁内服」** ✓✓","o":"RJ-2590 · 《人纪·神农本草经》下经第二百九十二味「牙子」，原文及讲解（PDF 第 541 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"羊踯躅是麻沸汤","c":"【本经原文】「**味辛，温，有大毒；治贼风在皮肤中淫淫痛，温疟，恶毒，诸痹。**」【性味】「**味辛，性温，有大毒。**」【主治】「**羊踯躅为诸风湿痹痛药，主痛风走注，风痰湿痹，治蛊毒。**」【用量】「**普通分许。**」【禁忌】「**羊食其草，踯躅而死，有毒之药宜慎用之；近眼令人昏翳，其根误服亦能杀人，中毒者绿豆汁解之。**」讲义：「**我们有一些药，像这个蔓陀罗、羊踯躅，很多都是我们过去华佗使用那个麻沸汤——吃了麻醉药、开刀时使用。****现在我们不用它、很少使用，因为现在西药的麻醉很盛行。****以前用这些毒药来做麻醉，够好。****名字来源很好玩：因为羊吃到这个草以后，开始踯躅、脚不断地这样跳动，然后死掉了、吃太多了。**」\n\n**【极精】羊踯躅/曼陀罗 = 华佗麻沸汤（古代麻醉）**\n\n```\n羊踯躅 + 曼陀罗 → 麻沸汤\n羊食之 → 踯躅（痉挛）→ 死\n```\n\n**须「绝「对「强「标」**：**「①有大毒，可致死；②绝对不可内服；③现代麻醉已替代」** ✓✓","o":"RJ-2591 · 《人纪·神农本草经》下经第二百九十三味「羊踯躅」，原文及讲解（PDF 第 541–542 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"商陆敷脐利尿","c":"讲义讲「一«条«最«精«的«外«治»」：「**有一种方式：排水、又不伤正，不管他元气强还是元气弱。****就是过去那个商陆，把它打粉以后，放一点点麝香——因为麝香就来至麝的肚脐嘛，无孔不入，混点麝香在里面。****然后用棉布包起来、放在病人肚脐上。****然后你如果加温，可以用那个熨斗或者电热毯在上面加热，一放上边就开始排小便。****不用内服、外敷，就开始排小便。****因为商陆涤水。**」【主治】「**商陆为利水消肿要药。**」【容川】「**商陆用根，取其内透膜膈，以导水下行。****一般用苗则升，用根则降。**」\n\n**【最重要】商陆 + 麝香敷脐 → 利尿（不伤正）**\n\n```\n商陆粉 + 麝香少许 → 棉布包 → 敷脐\n+ 加热（熨斗/电热毯）→ 开始利尿\n```\n\n**「这是最精的外治（脐疗）。」** ✓✓\n\n**须「强「标」**：**「①商陆有毒；②麝香孕妇禁；③皮肤须防灼伤；④不可代替透析/利尿剂」** ✓✓","o":"RJ-2592 · 《人纪·神农本草经》下经第二百九十四味「商陆」，讲解（PDF 第 542–543 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"商陆赤白分用","c":"【本经原文】「**味辛，平，有毒；治水胀，疝瘕，痹，熨除痈肿，杀鬼精物。**」【产地】「**其根有赤白两种，赤者有毒，白者入药。**」【性味】「**味苦（或作辛），性寒，有毒。**」【甄权】「**泻十种水病，喉痹不通，薄切醋炒涂喉外良。**」【大明】「**通大小肠，泻蛊毒，堕胎。**」【用量】「**普通五分至一钱左右。**」【禁忌】「**虚人禁用；赤者有毒伤人，只堪贴脐，商陆入麝香少许，用以利溲水肿。**」讲义：「**那商陆有两种，一种是赤根的、一种是白的。****你们现在看到是白色的、白色的入药。****赤色的可以外用、赤色的很毒、不要吃。****赤色我们拿来敷肚脐，比白色的好，因为它很强嘛。****一般来说你用 1 钱、大、重剂 2 钱就可以了。**」\n\n**【极重要】商陆：白根入药、赤根只可贴脐（极毒）**\n\n```\n白商陆 → 内服（1–2 钱）\n赤商陆 → 只敷脐（极毒，不可内服）\n```\n\n**须「绝「对「强「标」**：**「①赤商陆有毒，禁内服；②孕妇禁（堕胎）；③须专业医师」** ✓✓","o":"RJ-2593 · 《人纪·神农本草经》下经第二百九十四味，原文及讲解（PDF 第 542–543 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"白头翁治痢","c":"【本经原文】「**一名野丈人；味苦，温，有毒；治温疟，狂易，寒热，症瘕积聚，瘿气，逐血，止痛，治金疮。**」【性味】「**味辛苦，性温，无毒（或作小毒）。**」【主治】「**白头翁为治痢要药，功能泄热凉血，治毒痢赤痢［大便时肛门很热，便后又想上厕所］，下血腹痛，及妇女经闭。**」【甄权】「**赤痢腹痛，齿痛，百节骨痛，项下瘿瘤。**」【弘景】「**止毒痢。**」【药征】「**主治热痢下重也。**」讲义：「**白头翁为治痢要药。**」【附注】「**赤痢：大便时肛门很热，便后又想上厕所（＝里急后重）。**」\n\n**【极重要】白头翁 = 赤痢/热痢下重（里急后重）**\n\n```\n赤痢（肛门灼热 + 便后又想上）→ 白头翁\n白头翁汤（湿热痢）\n```\n\n**须「强「标」**：**「①血便须查粪检/培养（志贺/阿米巴）；②细菌性痢疾须抗生素；③不可延误」** ✓✓","o":"RJ-2594 · 《人纪·神农本草经》下经第二百九十八味「白头翁」，原文及讲解（PDF 第 544–545 页）。"},{"t":"神农本草经·下经：大戟（续）、贯众、商陆、白头翁","h":"白头翁一茎直上如柴胡","c":"【容川】「**白头翁一茎直上如柴胡，所以能治下痢后重者，升散郁结也。****其无风动摇，有风不动，色白有毛，凡毛皆得风气，采于秋月，得金木交合之气，故能熄风。****从肺金以达风木之气，使木不侮土，故功在升举后重而止痢疾。****又其味苦，是治风热之妙药。****仲景治产后中风，及痢疾后重者，走取其熄风火、达肝阳也。**」【别录】「**治鼻衄。**」\n\n**【极精】白头翁一茎直上如柴胡 → 升散郁结（治后重）**\n\n```\n茎直上（取象柴胡）→ 升举 → 治下痢后重\n有风不动（「无风动摇」须校）→ 熄风\n```\n\n**「从肺金达风木、使木不侮土」——「这是最精的五行推演。」** ✓✓\n\n**须「标」**：**「①『无风动摇、有风不动』与原文互倒，须核；②取象不可作为药理证据」** ✓✓","o":"RJ-2595 · 《人纪·神农本草经》下经第二百九十八味，容川注（PDF 第 545 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"热痢与寒痢之辨","c":"讲义讲「一«条«最«重«要«的«鉴«别»」：「**我们痢分 2 种，一种是寒痢，一种是热痢。****那热痢呢，那老师你怎么知道是热痢？你去闻就知道了，它是又酸又臭。****热，你看到颜色就知道是热。****寒痢就是他吃进去是意苏苏、拉出来是意苏苏——吃进去是青钢菜，拉出来的就是青钢菜，吃什么拉什么，食物都没有消化掉，那是寒痢。**」\n\n**【最重要】热痢（酸臭/色深）vs 寒痢（完谷不化）**\n\n```\n热痢 → 酸臭 + 色黄赤 + 肛门灼热\n寒痢 → 完谷不化（吃什么拉什么）+ 不臭\n```\n\n**「这是全书最精的痢疾鉴别。」** ✓✓\n\n**须「强「标」**：**「①痢疾须查粪培养/镜检；②细菌性/阿米巴须病原治疗；③不可只凭气味」** ✓✓","o":"RJ-2596 · 《人纪·神农本草经》下经第二百九十八味「白头翁」，讲解（PDF 第 545 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"寒痢误用白头翁会加重","c":"讲义讲「一«条«极«重«要«的«警«告»」：「**那如果是你岳母得了寒痢，你再给她吃白头翁，那她痢得更厉害，从此你就不用回娘家了。****所以说你寒热一定要区分。****当你寒热区分的时候，你下重手、一剂下去就回来，那病人好得很快。**」【禁忌】「**滞下胃虚不思食，及完谷不化，泄泻由虚寒寒热而不由湿毒者均忌，得酒良。**」\n\n**【极重要】寒痢误用白头翁 → 更重**\n\n```\n寒痢（完谷不化/胃虚）→ 白头翁（苦寒）→ 加重\n```\n\n**「寒热一定要区分」——「这是最精的误治警告。」** ✓✓","o":"RJ-2597 · 《人纪·神农本草经》下经第二百九十八味，讲解及禁忌（PDF 第 545–546 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"里急后重的定义","c":"讲义讲「一«条«极«精«的«症«状«定«义»」：「**那这个『里急后重』：上完厕所，下痢很重，肛门还很热，老是还想上厕所，这是白头翁汤症，哦、赤痢。****那唐容川，你看白头翁一茎直上、象柴胡一样，就是因为他一茎往上，所以可以治下痢后重，明白没有？****这就后重就是：上完厕所还想上、感觉那肛门还没收起来、收不起来，那你还是很想再坐回去那种感觉。****这种感觉出现的时候，你就要记得白头翁，它能升散郁结。**」\n\n**【极精】里急后重 = 上完厕所还想上（肛门收不起来）**\n\n```\n里急后重 = 便后肛门未收 + 想再坐回\n→ 白头翁（升散郁结，象柴胡）\n```\n\n**「这是最精的患者感受描述。」** ✓✓\n\n**「这条与 n249肛门收不起来」互证。** ✓✓","o":"RJ-2598 · 《人纪·神农本草经》下经第二百九十八味，讲解（PDF 第 546–547 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"白头翁汤是一千八百年前的方","c":"讲义讲「一«个«极«精«的«对«话»」：「**病人跟我讲：你下痢有多久了？『2 年。』天哪！2 年！****那你吃了什么药？『我什么药都吃了，照样痢。』****我说那你看过中医没有？『没有。』****那这就是原因了！****我开完处方特地跟他讲：你这个处方以后我可以把它翻译成英文，让你看看 1800 多年前就有这个处方、也就是我们早在 1800 多年前已经解决了。****然后他吃完，我问他你好不好？我心里知道他会好啊，他说很好啊！****我说你看：1800 多年前我们就把你治好了，到现在你还治不了，你们还有大堆仪器，我连仪器都不用看。**」\n\n**【极精】白头翁汤（1800 年）治两年痢疾**\n\n**「这是最精的文献自信（但须避免过度自夸）。」** ✓✓\n\n**须「标」**：**「①慢性腹泻须查炎性肠病/显微镜结肠；②不可盲目自信；③须标本对比」** ✓✓","o":"RJ-2599 · 《人纪·神农本草经》下经第二百九十八味，讲解（PDF 第 546–547 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"连翘散结清火象心包","c":"【本经原文】「**一名异翘；味苦，平，无毒；治寒热，鼠瘘，瘰疬，痈肿，恶疮，瘿瘤，结热，蛊毒。**」【性味】「**味苦辛，性平，无毒。**」【主治】「**连翘为散结清火要药，主治疮疡，能清火解毒，消肿排脓，散血结气聚，去上焦热，通利小便（常与银花为伍用）。**」【甄权】「**通利五淋，小便不通，除心家客热。**」【丹溪】「**泻心火，除脾胃湿热，治中部血证以为使。**」【容川】「**连翘亦象心包，而质轻扬，味微苦，故轻扬上达，能清心与上焦头目之热。**」【倪注】「**此药常与银花同用，皆属味清而质轻，皆能升清气。**」【用量】「**普通一钱至三钱。**」讲义：「**唐容川他说连翘长得象心包、心脏的外围象心包，质轻、非常地轻，味苦，所以能清心和上焦头目之热。****所以说如果牙痛、鼻塞、眼睛的赤肿赤痛、青春痘都可以使用连翘。**」\n\n**【极重要】连翘 = 散结清火（象心包，轻扬上达）**\n\n```\n上焦热（头目/咽/痘/小便赤）→ 连翘 + 银花\n```\n\n**「象心包（取象）」——「这是最精的取象。」** ✓✓","o":"RJ-2600 · 《人纪·神农本草经》下经第三百零二味「连翘」，原文及讲解（PDF 第 548–549 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"连翘没有滋补功能","c":"【禁忌】「**连翘清而无补之药也，痈疽已溃及日久，火热由于虚，与脾胃薄弱作泄者均忌，忌火。**」讲义讲「一«条«极«精«的«外«形«判«断»」：「**虚症的人少用，因为连翘本身就是清热、它没有滋补的功能。****你可以看它这中药的样子：干干的、没有这个壳，你拿到药比较有津液、比较湿润的，都有滋补的功能在里边。****比如你看到知母、麦冬、当归、生地、熟地，这些都有。****你看这连翘干干的，象个壳这样、象花生壳一样、瓜子壳，它本身没有滋补功能，它就是清毒。****没滋补药性的时候，虚症的人、很虚的人不用。**」\n\n**【极精】看药材外形判断有无滋补（干壳=纯清，润泽=有补）**\n\n```\n干枯如壳（连翘）→ 纯清无补\n湿润有津（知母/麦冬/当归/生地）→ 有滋补\n```\n\n**「这是最精的药材外形学。」** ✓✓","o":"RJ-2601 · 《人纪·神农本草经》下经第三百零二味，讲解及禁忌（PDF 第 549 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"蚤休解蛇毒","c":"【本经原文】「**味苦，微寒，有毒；治惊痫，摇头，弄舌，热气在腹中，癫疾，痈疮，阴蚀，下三虫，去蛇毒。**」【性味】「**味苦，微寒，有毒。**」【主治】「**蚤休主散结导热，治寒热，疟疾，癫疾，痈疽，瘰疬，解蛇毒虫（磨醋敷）。**」【别录】「**癫疾痈疮，除蚀，下三虫，去蛇毒。**」【大明】「**治胎风手足搐。**」【用量】「**普通五分至二钱，外用无定量。**」【禁忌】「**以治外证，殊有功效，但其性苦寒，不宜多服，元气虚者忌之。**」讲义：「**这个处方呢，过去我们使用在专门解蛇毒。****被蛇咬到、被这个响尾蛇咬到、那个台湾的百步蛇。****临床上使用的时候，一般来说我们是用 3 钱，有些重剂的时候会用到 5 钱。****那如果说我们外用也可以打成粉，涂在咬伤的伤口上面。**」\n\n**【极重要】蚤休（重楼）= 解蛇毒（内服+外敷）**\n\n```\n蛇咬 → 蚤休 3–5 钱（汤）+ 粉外敷\n```\n\n**须「绝「对「强「标」**：**「①蛇咬须立即120/抗蛇毒血清；②不可用中药替代；③须制动/绑扎」** ✓✓","o":"RJ-2602 · 《人纪·神农本草经》下经第三百零六味「蚤休」，原文及讲解（PDF 第 550 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"急症不加甘草","c":"讲义讲「一«条«最«重«要«的«配«伍«禁«忌»」：「**一般来说我们用解毒的药，诸位记得：我们取它的迅捷的时候，我们希望它到身上去很快地去把毒素中和掉的时候，我们都是用汤剂——汤者、荡也。****那你不要神经病去加个甘草进去，懂不懂我的意思？****甘草是缓，那你减缓它的速度了。****我们需要药比较缓慢发挥的时候、慢慢进去的时候，我们就会用到甘草。****有些药跑得太快了，必需要用甘草。****有些状况是危急的，你必须让药走得很快，这个时候你不要加甘草在里面。****比如说我们前面开的利水的药、比较如商陆、甘遂、芫花、大戟、牵牛，这种峻药，我们在攻的时候，我们一般放红枣进去保护胃，你不要放个甘草，这个是外行，这个会误人生命的。**」\n\n**【最重要】急症/峻剂不加甘草（甘草缓其速）**\n\n```\n急症/解毒/峻下 → 不加甘草（要快）\n需缓（如大黄甘草汤）→ 加甘草\n峻下护胃 → 用红枣（非甘草）\n```\n\n**「会误人生命」——「这是全书最重的配伍禁忌。」** ✓✓\n\n**须「强「标」**：**「①甘草与甘遂/大戟/芫花/海藻十八反；②须药师审方；③不可自配」** ✓✓","o":"RJ-2603 · 《人纪·神农本草经》下经第三百零六味，讲解（PDF 第 550–551 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"咸味药能攻坚","c":"讲义讲「一«条«极«精«的«性«味«法»」：「**石长生这个药现代人用得不多。****诸位看它的味是咸味的，只要是咸味的药，都有攻坚的效果。****所以有硬块、有痰、喉咙里面有痰阻、有个硬块长在里边……中医过去认为说：很多的病啊、就是陈年的病，不是瘀血就是老痰，堵在里面、痰块、硬硬的，这个时候我们用攻坚咸味的药能够把它散化出来。****所以你看它的功能主治：石长生主积聚痈肿，能够祛痰利尿，能够散结排脓。**」\n\n**【极精】咸味 = 攻坚（软坚散结）**\n\n```\n咸味 → 攻坚/软坚（硬块/老痰/瘀血）\n```\n\n**「陈年的病，不是瘀血就是老痰」——「这是最精的久病观。」** ✓✓\n\n**「与 n227海藻咸能软坚」、n235「咸能伤骨」互证。** ✓✓","o":"RJ-2604 · 《人纪·神农本草经》下经第三百零七味「石长生」，讲解（PDF 第 551 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"夏枯草煮蛋预防扁桃腺炎","c":"【本经原文】「**味苦，辛，寒，无毒；治寒热瘰，鼠瘘，头疮，破症，散瘿结气，脚肿，湿痹，轻身。**」【产地】「**四川为良，冬至后生，夏至而枯。**」【性味】「**味苦辛，性微寒，无毒。**」【主治】「**夏枯草为瘰疬要药，主养阴血，散结毒，治目珠疼夜甚，阴肿赤白带下，消暑清湿。**」【倪注】「**民间方使用单味夏枯草五钱，生鸡蛋带壳一只，用水二碗煮成一碗，将汤喝尽，去壳吃蛋。****如果于健康时吃一剂，则终身不再犯扁桃腺炎。**」讲义：「**这个土匪跟侦稽队说：反正我明天已经要死了，我告诉你个偏方——你看我们土匪窝里边，我们从小生下来都是吃夏枯草的。****用夏枯草加蛋，拿 5 钱剪的夏枯草、一个生鸡蛋，然后 2 碗水煮成 1 碗，那蛋也熟了。****把汤喝了、把蛋壳剥了把鸡蛋吃了。****为什么？吃完了以后喉咙就不会发炎了。**」**「但是这个药很奇怪：发病的时候吃没有用。****所以夏枯草煮蛋一定要确定病人没有扁桃腺发炎才能吃。**」\n\n**【极重要】夏枯草 5 钱 + 生鸡蛋 → 预防扁桃腺炎（发病时无效）**\n\n```\n健康时：夏枯草5钱 + 蛋（2碗煮1碗）→ 吃汤+蛋\n已发炎时：无效（须治疗）\n```\n\n**须「强「标」**：**「①『终身不再犯』为民间说法，无证据；②扁桃腺炎（尤其A组链球）须抗生素；③反复发作须耳鼻喉科」** ✓✓\n\n**「这是最精的民间预防方（附严格条件）。」** ✓✓","o":"RJ-2605 · 《人纪·神农本草经》下经第三百一十一味「夏枯草」，原文、倪注及讲解（PDF 第 552–553 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"夏枯草冬至生夏至枯","c":"【容川】「**此以时为治之药：夏枯草生于冬末，长于三春，正得水木之气，遇夏则枯。****因木当火令，其气退谢，故可用以退肝胆经之火。**」讲义：「**夏枯草是冬至以后开始出生，到夏至就枯萎掉了。****夏天枯的、冬天长得很好。****专门治疗甲状腺肿大，所以你看主治为瘰疬的要药，主养阴血，散结毒。****治眼睛、眼珠的疼痛——因为甲状腺肿的时候，有的时候眼睛会凸出来、痛，我们用夏枯草。****一般来说夏枯草三钱五钱都没有关系，它主要就是去湿热、把郁结的气散掉。**」\n\n**【极精】夏枯草：冬至生、夏至枯 → 退肝胆火（甲状腺/突眼）**\n\n```\n冬生夏枯（水木之气）→ 退肝胆火\n甲状腺肿/突眼/目珠夜痛 → 夏枯草\n```\n\n**「以时为治」——「这是最精的取时用药。」** ✓✓\n\n**须「标」**：**「①甲状腺肿须查甲功/超声/穿刺；②突眼须排Graves（须内分泌科）；③不可单靠夏枯草」** ✓✓","o":"RJ-2606 · 《人纪·神农本草经》下经第三百一十一味，容川注及讲解（PDF 第 552–553 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"芫花攻上焦水","c":"【本经原文】「**一名去水；味辛，温，有小毒；治咳逆上气，喉鸣，喘，咽肿，短气，蛊毒，鬼疟，疝瘕，痈肿，杀虫、鱼。**」【性味】「**味辛（或作苦），性温，有毒（或作大毒）。**」【主治】「**芫花为行水祛痰要药，主水肿，水饮，痰癖，利血脉，治疮毒［去上焦水用芫花，去腹中水用大戟，去三焦水用甘遂；使用时一定要加大枣］。**」【药征】「**主逐水也，旁治咳掣痛。**」【用量】「**普通七分至二钱。**」【禁忌】「**芫花大戟甘遂，逐水泄热，能直达水饮巢囊隐癖之处，但可徐徐用之，取效甚捷，不可过剂，泄人元气；反甘草，能堕胎，孕妇忌用，醋制良。**」讲义：「**芫花质比较轻、质最轻。****如果说我们要攻上焦的水，这都是涤水的要药。****如果这个人痰涎的壅塞很盛、胸腔里面痰涎很盛、脑部里面有积水——老师，芫花跟生半夏？哇、你这个很凶啊，这俩个药对、非常的对症！这俩个药一下去痰水就排出来了。****所以芫花大部分是上焦、肺以上喉咙的痰水。**」\n\n**【极重要】芫花 = 上焦水（质最轻，1 钱即够）**\n\n```\n上焦/胸肺/脑积水 → 芫花（花类质轻 1 钱）\n```\n\n**须「绝「对「强「标」**：**「①芫花有毒（峻下）；②孕妇禁（堕胎）；③反甘草；④须专业医师」** ✓✓","o":"RJ-2607 · 《人纪·神农本草经》下经第三百一十二味「芫花」，原文及讲解（PDF 第 553–554 页）。"},{"t":"神农本草经·下经：白头翁（续）、连翘、夏枯草、芫花","h":"三味峻药的分工","c":"【主治附注】「**去上焦水用芫花，去腹中水用大戟，去三焦水用甘遂；使用时一定要加大枣。**」讲义讲「一«条«最«重«要«的«总«结»」：「**芫花的话，你在汤剂时用一钱，因为它是花类、很轻。****汤剂开的时候：芫花一钱、甘遂两钱、红大戟两钱。****如果说你芫花用两钱、甘遂用三钱、红大戟用三钱，因为这俩个质比较重、因为这是根嘛，这是花类，根的质比较重。****一般来说花都长在上面。****所以说攻上焦积水的时候一定要用它（芫花）；脏腑之间积水的时候会用到大戟；涤水力量的时候、把水排出体外的时候要用甘遂。****所以三个药混合在一起、刚好。****吃下去以后上吐——上面会吐的原因是有芫花在里面；大便会清出来很多水在那边。**」\n\n**【最重要】三味峻药分工**\n\n| 药 | 部位 | 剂量（质） |\n|---|---|---|\n| **芫花** | 上焦/胸肺 | 1 钱（花，最轻） |\n| **大戟** | 脏腑之间 | 2 钱（根） |\n| **甘遂** | 三焦/经隧 | 2 钱（根） |\n\n**「花往上、根往下」——「这是全书最精的取象定位。」** ✓✓\n\n**须「绝「对「强「标」**：**「三者皆有毒，合用极危（十枣汤）；须住院/专业医师；绝对不可自制」** ✓✓","o":"RJ-2608 · 《人纪·神农本草经》下经第三百一十二味，原文附注及讲解（PDF 第 553–554 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"十枣汤排肺水从大便出","c":"讲义讲「一«条«最«重«要«的«机«理»」：「**肺里面积水，一吃下去后上吐下泻，病人好了。****为什么？大便排出来是水的时候，是把脏腑里面的水统统清掉，那是靠大戟。****那甘遂呢？上焦、中焦、下焦它都走；芫花只走上焦。****所以说你要把这三个药混在一起的时候，它就可以把肺里面的积水从大便给你排掉、全部清掉。****所以上面吐，就好像一个吸管：你放到水里面去，按到吸管拉起来的时候水在里面；上面一吐、上面一开开，下面水就出来。****排肺积水的时候不是小便，是从大便清出来。**」\n\n**【最重要】十枣汤排肺水：上与下同时开（吸管比喻）**\n\n```\n芫花（上焦开口）→ 吐\n大戟（脏腑）→ 大便出水\n甘遂（三焦通走）→ 全身\n```\n\n**「这是全册最精的吸管比喻。」** ✓✓\n\n**须「绝「对「强「标」**：**「①峻剂，可致脱水/低钾；②须住院/专业医师；③绝对不可自制」** ✓✓","o":"RJ-2609 · 《人纪·神农本草经》下经第三百一十二味「芫花」，讲解（PDF 第 554–555 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"峻剂伤胃津液的表现","c":"讲义讲「一«条«极«精«的«副«作«用»」：「**这些药在使用的时候我们会加红枣、温胃，不要让肠胃里面的津液不足、不要让肠胃里面都干掉了。****像这种峻药，你如果没有加红枣，里面没有胃液了嘛、整个黏的，胃壁会黏在一起、肠壁会黏在一起。****黏在一起的感觉呢？病人吃不饱！吃东西吃下去，还是饿、还是不饱。****为什么？因为它黏在一起、完全没有津液了，这时就要红枣。****万一你说忘掉了，吃下去了——这时你拿红枣去煮，煮那个稀饭、黏答答的，给她吃下去，好来弥补它。**」\n\n**【极精】峻剂无红枣 → 胃壁黏连 → 「吃不饱」**\n\n```\n峻下 + 无红枣 → 胃津枯 → 胃壁黏连 → 吃仍饿\n补救：红枣稀饭（黏稠补津）\n```\n\n**「这是最精的副作用画像。」** ✓✓","o":"RJ-2610 · 《人纪·神农本草经》下经第三百一十二味，讲解（PDF 第 554–555 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"留饮的成因","c":"讲义讲「一«条«极«重«要«的«病«因»」：「**比如说现在天气热，你在外面动、流很多汗，流汗的时候你又回到房间里面、你房间里面有冷气。****你要在外面待一下、不要动，等汗停下来再进去，可是有时候忙啊、谁有时间在那待一下？马上就进去了。****进去以后冷，那里面身体很热、外面很冷，冷空气刺激你的皮肤毛孔、皮肤毛孔缩起来，缩起来你的汗就排不出来。****刚开始一般来说皮肤痒痒、抓抓就过去了，那有时候留饮，慢慢慢慢日积月累下来。****而你的工作就在冷冻库里面、你是屠夫啊，一下跑里面来、一下跑外面来，就那种冷热变化很大，慢慢日积月累下来，你留饮、水回头停在肺的下方。**」\n\n**【极重要】留饮成因 = 大汗后骤入冷气（毛孔骤缩）**\n\n```\n大汗（毛孔张）→ 骤入冷气（毛孔闭）\n→ 汗不得出 → 水停肺下 = 留饮\n职业性：屠夫（冷库↔外）最典型\n```\n\n**「这是最精的生活病因学。」** ✓✓","o":"RJ-2611 · 《人纪·神农本草经》下经第三百一十二味，讲解（PDF 第 555 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"抗生素治感冒是安慰剂须修正","c":"讲义讲「一«段«须«修«正«的«主«张»」：「**比如说我们就感冒发烧，那感冒发烧老外不知道什么发表的药啊，就吃抗生素。****抗生素根本是鸡同鸭讲、根本没有用。****我从来没有看过一个人感冒治好的，感冒还在吃抗生素。****明知道感冒是滤过性病毒，药物学说没有任何能杀滤过性病毒，你说他感冒还在吃抗生素、图个安心嘛。****所以说西药都是安慰剂。**」\n\n**【须「否定】抗生素是安慰剂」/「西药都是安慰剂」**\n\n**须「逐条否定」**：**「①病毒性感冒确不需抗生素（此点正确）；②但抗生素治细菌感染可救命（肺炎/脓毒症/链球咽炎）；③『西药都是安慰剂』为严重错误：胰岛素/青蒿素/抗生素/化疗/麻醉皆救命；④须标讲义过度概括」** ✓✓✓","o":"RJ-2612 · 《人纪·神农本草经》下经第三百一十二味，讲解（PDF 第 555–556 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"巴豆是最后一线攻坚药","c":"【本经原文】「**一名巴菽；味辛，温，有大毒；治伤寒，温疟，寒热，破症瘕，结聚坚积，留饮痰癖，大腹水胀，荡涤五脏六腑，开通闭塞，利水谷道，去恶肉，除鬼毒、蛊疰邪物，杀虫、鱼。**」【性味】「**味辛，性温，有毒。**」【主治】「**巴豆为峻泻要药，主荡涤脏腑，开通闭塞，破症坚积聚，留饮痰澼，治大腹水胀，胎伤腹中，利水谷道，排恶疮脓血。**」【元素】「**导气消积，去脏腑停寒，治生冷硬物所伤。**」【容川】「**巴豆油滑，而主下降，故能利大便；味大辛故性烈，大热则悍，以悍烈行其滑利，故迅捷而不留也。**」【药征】「**主治心腹胸膈之毒，兼治心腹卒痛，胀满吐脓。**」【用量】「**普通五厘至三至五分。**」【禁忌】「**凡一切汤散丸剂切勿轻投，即不得以急证，亦须炒熟压令油极净，入分许即止，不得多用；中巴豆毒，用冷水、黄连汁、大豆汁解之效。**」讲义：「**当你不通的时候、什么样都没办法的时候，你就要想到巴豆。****巴豆是唯一最后一线的药，最后一线攻坚的药！**」\n\n**【最重要】巴豆 = 最后一线攻坚（荡涤五脏六腑）**\n\n```\n全消化道堵塞（吃到喉→肛）→ 巴豆\n无物可挡（「哄」全部清出）\n```\n\n**须「绝「对「强「标」**：**「①巴豆有大毒（巴豆油），可致致命性腹泻；②绝对不可自服/自制；③须住院/专业医师；④孕妇禁（堕胎）」** ✓✓","o":"RJ-2613 · 《人纪·神农本草经》下经第三百一十三味「巴豆」，原文及讲解（PDF 第 556–557 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"走马汤","c":"讲义讲「一«条«极«重«要«的«命«名»」：「**为什么叫走马汤？就是你有没有看到马？****你骑过马的人就知道：马是一边吃一边大便的，一边走一边大便的，它不停。****所以叫走马汤。****那我们用在什么时候呢？****有个人吃东西吃得很多，阳明热、胃口很大，天气很热、吃得很多，吃完以后堵在肠子里面，吃完以后呢，他又吃冰的、甜点。****你一吃大量的食物下去，然后吃了大量的冰下去以后，里面肠子蠕动就缓慢下来、堵在下面。****你身体发现后需要把它排掉，所以又产生蠕动，希望把它清掉；结果你一蠕动，你又开始饿了，开始饿了你又开始吃了，晚餐你又吃很多冰的、宵夜又吃一大票，这是恶性循环。****有个人呢就是从喉咙开始一直到肛门整个堵到，你怎么处理？****大黄什么都没有用，全部都没有用、吃太多了，只有靠巴豆。**」\n\n**【极重要】走马汤 = 巴豆 + 杏仁（泡水不煮）**\n\n```\n全消化道堵塞（连吃冰→蠕动慢→再吃→恶性循环）\n→ 走马汤（巴豆+杏仁，泡水）\n→ 一剂「哄」全出\n```\n\n**须「绝「对「强「标」**：**「①肠梗阻须禁泻药（可致穿孔）+ 急诊；②走马汤极危，现代禁用；③只作文献」** ✓✓\n\n**「这是最精的方名来源。」** ✓✓","o":"RJ-2614 · 《人纪·神农本草经》下经第三百一十三味，讲解（PDF 第 557 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"巴豆与咖啡豆同源","c":"讲义讲「一«条«极«精«的«文«献«学»」：「**其实巴豆，西洋人呢咖啡豆——这个咖啡豆呢拿在手上的时候，是因为他把里面的油榨光了。****如果咖啡豆的生药、你不要把它的油榨光，巴豆！一样的东西。****你把油榨光以后、它没油了，毒性去掉了，焦黑、烤焦黑了，烘焙过以后很焦黑了，非常的香。****越毒的越香我告诉你！**」\n\n**【极精】巴豆 = 未脱油的咖啡豆（同属大戟科）**\n\n```\n巴豆（含巴豆油，剧毒）\n咖啡豆（脱油+烘焙 → 无毒，香）\n「越毒的越香」\n```\n\n**须「强「标」**：**「①二者同科不同种（巴豆属vs咖啡属）；②不可等同；③须标讲义为类比」** ✓✓\n\n**「这是最精的植物学类比。」** ✓✓","o":"RJ-2615 · 《人纪·神农本草经》下经第三百一十三味，讲解（PDF 第 557–558 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"巴豆中毒冷水即解","c":"【禁忌】「**中巴豆毒，用冷水、黄连汁、大豆汁解之效。**」讲义：「**你如果吃到巴豆下利不止，最严重的结果就是下利不止，这个时候你喝杯冷水就解掉了。****你看它的禁忌最后那边：中巴豆毒，用冷水、黄连汁、大豆汁都可以。****你不需要黄连煮汁、大豆煮汁——不需要！****冷水一杯下去，巴豆的毒就解掉了、就不会下利了。**」\n\n**【极重要】巴豆中毒 → 冷水一杯（热毒遇冷即解）**\n\n```\n巴豆（大热/辛烈）→ 下利不止\n冷水一杯 → 毒解（热遇冷）\n```\n\n**须「绝「对「强「标」**：**「①巴豆中毒可致脱水/休克；②须立即急诊（补液）；③『冷水一杯』不足以救；④不可自试」** ✓✓","o":"RJ-2616 · 《人纪·神农本草经》下经第三百一十三味，讲解及禁忌（PDF 第 557–558 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"蜀椒闭口有毒","c":"【本经原文】「**味辛，温，有毒；治邪气，咳逆，温中，逐骨节皮肤死肌，寒湿痹痛，下气，久服之头不白，轻身，增年。**」【性味】「**味辛，性温，有毒。**」【主治】「**蜀椒为散寒祛湿、补火温中要药，主邪气咳逆，寒热痹痛，宣肺燥脾，治骨节皮肤死肌，止呕逆，伏蚘虫。**」【容川】「**辛温以散寒湿，能杀虫化湿。**」【用量】「**普通五分至钱半。**」【禁忌】「**久服令人失明伤血脉，多忘乏气；杏仁为使，得盐味佳；中其毒者，火麻仁浆解之；闭口者有毒勿用。**」讲义：「**那这个蜀椒呢，你看到那个蜀椒嘴巴崩开来的、蜀椒那个壳子崩开来的，开口的都没有毒，闭口的都有毒！****如果说你一大票、你当然可以慢慢捡、慢慢捡出来，你是大量的话，没办法就把蜀椒丢到水上面去：****没有开口的通通沉下去，浮在水上面的通通是开口的。****这个时候水下面的不要，上面拿出来、晒干烘干就可以了。**」\n\n**【极精】蜀椒开口无毒、闭口有毒（浮水法筛选）**\n\n```\n开口（壳裂）→ 无毒 → 浮水\n闭口 → 有毒 → 沉底\n```\n\n**「浮水法鉴别」——「这是最精的挑拣术。」** ✓✓\n\n**须「强「标」**：**「①闭口椒（含未熟果）确有毒；②须买正规炮制品；③孕妇慎」** ✓✓","o":"RJ-2617 · 《人纪·神农本草经》下经第三百一十四味「蜀椒」，原文及讲解（PDF 第 559–560 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"麻辣是解毒不是嗜好","c":"讲义讲「一«条«极«精«的«地«理«解«释»」：「**性温，有毒——这一种有毒呢，并不是说吃的人会死掉。****辛辣的东西，为什么四川人呢他会吃很多麻辣锅啊这种东西？为什么？****因为当地的山区——你到地坞山里、云贵四川这一带，非常高、没有平原，人们生活在山里面，沼气瘴气很多。****有时候几百年的树林都没有人进去过，那个树叶累积起来沼气很多，还有毒蛇啊、毒虫啊之类的，食物上呢、饮食上还有些溪水里面有毒啊！****所以很多这种辛辣的东西加在里面，都是为了解毒。****老天爷很公平啊：这个东西有什么问题，它就产生什么东西来制它。**」\n\n**【极精】麻辣火锅 = 解瘴气（地理决定饮食）**\n\n```\n山地/瘴气/毒虫/毒水 → 辛辣解毒\n「有什么问题，就产生什么制它」\n```\n\n**「这是最精的饮食地理学。」** ✓✓","o":"RJ-2618 · 《人纪·神农本草经》下经第三百一十四味，讲解（PDF 第 560 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"皂荚是碱性清焦痰","c":"【本经原文】「**味辛，咸，温，有小毒；治风痹，死肌，邪气，风头，泪出，利九窍，杀精物。**」【性味】「**味辛咸，性温，有小毒。**」【主治】「**皂荚为通窍搜风拔毒杀虫要药，主风痹死肌，消痰涎，破坚症，治肠痈腹痛，溃散疮疡［配合红枣用；治脱肛；喉咙闭塞/化脓用皂角刺］。**」【别录】「**疗腹胀满，消谷，除咳嗽，囊结，明目益精；可为沐药，不入汤。**」【用量】「**普通一钱至三钱。**」【禁忌】「**药性颇峻，中病即止；孕妇亦忌。**」讲义：「**那中药用皂荚，为什么？皂荚是碱性的。****所以我们去很浓浊、很黄浊的痰的时候，我们会用到皂荚。****在民国初年的时候用得很多：那个时候抽鸦片的人很多，抽鸦片的时候喉咙里都是痰、比抽烟的人痰还多，那我们用皂荚来清痰。****皂荚顾名思义，它是碱性的嘛，所以它用来洗衣服。**」\n\n**【极重要】皂荚 = 碱性去焦痰/陈年浊痰**\n\n```\n焦痰/陈年浊痰（烟/鸦片）→ 皂荚（碱化）\n从大便排出（可变黑、带烟味）\n```\n\n**须「强「标」**：**「①皂荚有小毒（皂苷可致呕吐/溶血）；②须制用/配红枣；③老年/体弱/孕妇慎」** ✓✓\n\n**「这是最精的碱化去痰。」** ✓✓","o":"RJ-2619 · 《人纪·神农本草经》下经第三百一十五味「皂荚」，原文及讲解（PDF 第 560–561 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"皂荚必配红枣","c":"讲义讲「一«条«极«重«要«的«自«动«配«伍»」：「**皂荚是碱性的嘛，所以它用来洗衣服；那你胃是酸的，你光吃皂荚、一下去，我们胃就受不了了，所以我们就配合红枣。****只要你记得保护胃，你就一定要加红枣在里面。****皂荚和红枣配起来就变成我们很有名的汤剂，专门来清肺里面的浓痰、浊痰、陈年的老痰。****你如果用皂荚来清肺里面的痰，任何不管它多老、多陈、多陈旧，十几年的痰在里面，给你通通清掉。****清痰的时候吃完他不会吐，从大便排出，皂荚一吃大便排出、清出来黑的。****一般都是三钱、三钱起跳；如果比我个子大点的四钱、五钱都没关系。****但你自动——开了皂荚就要用大枣，一定要配合在一起。**」\n\n**【极重要】皂荚（碱）+ 胃酸 → 必配红枣护胃**\n\n```\n皂荚（强碱）→ 伤胃\n+ 红枣（护胃）\n= 皂荚丸（清陈年老痰）\n```\n\n**「自动化的（开皂荚必配大枣）」——「这是最精的配伍纪律。」** ✓✓","o":"RJ-2620 · 《人纪·神农本草经》下经第三百一十五味，讲解（PDF 第 561 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"皂角刺比皂荚更锋利","c":"【皂角刺】「**即皂树刺，味辛性温，无毒，主通关窍，消痈疽，搜风，杀虫，治风疠，腹内生疮，妇人妒乳，胎衣不下。****功同皂荚而力更锋锐，能直达病所，通风涎咽喉阻塞、治痈疽未溃均妙；痈疽已溃者、气虚者与孕妇均禁用。**」讲义：「**皂荚里面还有一个叫皂刺，皂刺就是那个皂树上面那个刺、那个钩钩的啊。****一般我们用到皂荚，皂刺比皂荚还强、还凶悍。****所以说像喉咙堵塞住，我们都可以使用这个皂角刺。****然后还有痈未溃烂（也可用）。**」\n\n**【极精】皂角刺 = 比皂荚更锋锐（直达病所）**\n\n```\n皂角刺 → 咽喉阻塞/痈疽未溃（托毒透脓）\nVs 皂荚 → 痰/脱肛\n```\n\n**须「强「标」**：**「①痈疽已溃/气虚/孕妇禁；②喉梗阻须急诊；③不可自用」** ✓✓","o":"RJ-2621 · 《人纪·神农本草经》下经第三百一十五味，皂角刺条及讲解（PDF 第 562–563 页）。"},{"t":"神农本草经·下经：芫花（续）、巴豆、蜀椒、皂荚","h":"雄黄烧烟就是砒霜","c":"讲义讲「一«条«须«强«标«的«警«告»」：「**我们有很多熏肛的方法，肛门那个生疮、烂掉、不能收口。****比如说你拿个瓦片、下面烧火，屁股不要坐在瓦片上面、要有点常识，中间有个洞嘛，然后下面一个火炉、瓦片在上面、隔一段距离。****比如说你放的是雄黄——雄黄下面一加热就变成砒霜，但是它的烟一起来是青色的烟，那个很毒啊。****那我们收口、肛门瘘管，雄黄杀菌力很强，因为砒霜嘛，下去什么都给你杀掉了。****你在熏的时候你记得、我跟你讲的是砒霜：你要用一个布袋把你的脖子遮住、绑住，像那个剪头发一样绑住，一熏起来在下面、鼻子闻不到。**」\n\n**【须「强标】雄黄加热变砒霜（As₂O₃）」**\n\n**须「绝「对「强「标」**：**「①雄黄（As₄S₄）加热确可生成三氧化二砷（砒霜），剧毒；②绝对不可焚烧雄黄（吸入可致中毒/肺损）；③不可自行熏肛；④肛瘘/脱肛须肛肠科」** ✓✓✓\n\n**「这是全册最重要的一条安全警告。」** ✓✓","o":"RJ-2622 · 《人纪·神农本草经》下经第三百一十五味，讲解（PDF 第 561–562 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"柳树全身是药","c":"【本经原文】「**一名柳絮；味苦，寒，无毒；治风水，黄疸，面热黑；叶，治马疥，痂疮；实，主溃痈，逐脓血。**」【性味】「**柳絮、柳枝、柳叶、柳根皆味苦，性寒。**」【主治】「**柳絮为祛湿、解热、止痛药，治黄疸，湿痹，金疮及脚气。****柳叶可疗疥，洗漆疮，解热毒，止痛。****柳枝及根白皮能解热，止痛，消肿。**」【时珍】「**煎服治黄疸，白浊，酒煮熨诸肿痛，去风，止痛，消肿。**」【用量】「**一般一钱至三钱。**」【禁忌】「**寒症忌用。**」讲义：「**这个柳树非常好、全身是药。****我们讲的全身是药：你看它的柳絮、柳条、柳叶、柳枝、柳树的根通通可以用。****所以你看它处在江南一带。****经方张仲景没有用这个药，但是你有机会用到。**」\n\n**【极精】柳树：絮/叶/枝/根白皮皆药**\n\n```\n柳絮 → 祛湿止痛/金疮止血\n柳叶 → 疥疮/漆疮\n柳枝+根白皮 → 消肿止痛/黄疸\n```","o":"RJ-2623 · 《人纪·神农本草经》下经第三百一十六味「柳花」，原文及讲解（PDF 第 563–564 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"柳根治乳房硬块","c":"【附方】「**乳痈妒乳——初起坚紫，众疗不愈，柳根皮熟捣，火温棉裹熨之，冷更易，一宿消。**」讲义：「**第五个、胸部的、乳房的硬块：你如果是乳房的、乳癌的初期，有硬块在里面，颜色是坚紫、硬非常的硬，而且颜色是紫色的，这个时候刚开始、没有切片、什么都没有，你可以用柳根，效果很好。**\n\n**用不用无所谓，只是一般你去药房里面买柳根、没有。****你要去公园自己去挖，带着铲子自己去砍两根回来。**\n\n**【极重要】柳根皮捣烂温熨 → 乳痈初起（坚紫）**\n\n```\n乳痈初起（坚/紫/未溃）→ 柳根皮捣 + 温熨 → 一宿消\n```\n\n**须「绝「对「强「标」**：**「①乳房硬块须超声 + 钼靶 + 穿刺（排癌）；②绝对不可以外敷代替活检；③『一宿消』不可信；④须就诊」** ✓✓✓\n\n**「这是最精的外治（但须极谨慎）。」** ✓✓","o":"RJ-2624 · 《人纪·神农本草经》下经第三百一十六味，附方及讲解（PDF 第 563–564 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"金铃子配延胡索如吗啡","c":"【本经原文】「**味苦，寒，有小毒；治温疾，伤寒，大热，烦狂，杀三虫，疥，疡，利小便水道；今名金铃子，又名川楝子、苦楝子。**」【性味】「**金铃子味苦，性微寒，其皮味苦，性微寒，有小毒。**」【主治】「**为解热、利尿、镇痛要药［1. 金铃子、延胡索并用功同吗啡，一般 3 钱，重用 5、6 钱不等；2. 治胰脏癌、肝癌痛］，治妇女白带，疝气及心腹诸痛症。****苦楝皮杀虫治疥癣，亦可为蔬菜杀虫药。**」【东垣】「**入心及小肠，止上下腹痛。**」【括要】「**泻膀胱，治诸疝虫痔，能入肝舒筋，导小肠、膀胱之热，为疝气要药。**」【用量】「**一般一钱至三钱。**」【禁忌】「**胃虚寒者禁之。**」讲义：「**一般来说，我用金铃子的时候，最多肝癌、胰脏癌的痛。****金铃子呢，是止痛的要药，我常常配合延胡索一起使用。****那西医呢就用吗啡；中药的止痛药用金铃子、元胡索来止痛。****如果说一般来我都开 3 钱，3 钱下去、病人还痛的话，你可以加到 5 钱都没关系。**」\n\n**【最重要】金铃子 + 延胡索 = 中药止痛（功同吗啡）**\n\n```\n肝癌/胰脏癌痛 → 金铃子 3 钱 + 延胡索 → 可至 5–6 钱\n疝气 → 金铃子（肝经入睾丸）\n```\n\n**须「强「标」**：**「①癌痛须规范三阶止痛（吗啡/羟考酮）；②不可以中药替代；③金铃子有小毒（肝毒性须注意）；④须肿瘤科」** ✓✓\n\n**「这是全书最精的止痛药对。」** ✓✓","o":"RJ-2625 · 《人纪·神农本草经》下经第三百一十七味「楝实」，原文及讲解（PDF 第 564–565 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"郁李仁破气行水","c":"【本经原文】「**味酸，平，无毒；治大腹水肿，面目四肢浮肿，利小便水道；根，治齿断肿，龋齿，坚齿。**」【性味】「**味酸（或作苦辛），性平，无毒。**」【主治】「**郁李仁为润燥破血、泄气行水要药，主大肠气滞，关格不通，治大腹水肿，四肢浮肿，破结气，利水道。**」【孟铣】「**破癖气，下四肢水，酒服四十九粒，能泻结气。**」【东垣】「**专治大肠气滞，燥湿不通。**」【用量】「**普通一钱至三钱。**」【禁忌】「**性专下降，善导大肠燥结，利周身水气，然下后多令人津液亏损，燥结愈甚，乃治标救急之药，非可常用；津液不足者忌用之。**」讲义：「**郁李仁呢，是润燥破血、泄气行水的药。****有时你的气没办法、堵在里面、气机不通，这个时候我们用郁李仁把气泄掉、把水排出来。****处方的时候你用 3 钱、5 钱都可以。**」\n\n**【极精】郁李仁 = 破气 + 行水（气结在腹中）**\n\n```\n气滞 + 水肿（关格不通）→ 郁李仁\n（治标救急，多服伤津）\n```\n\n**「这是最精的『气结』用药。」** ✓✓","o":"RJ-2626 · 《人纪·神农本草经》下经第三百一十八味「郁李仁」，原文及讲解（PDF 第 565–566 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"四十九是阳数","c":"讲义讲「一«条«极«精«的«数«术»」：「**郁李仁本来一颗一颗的，它说四十九。****那真的你也不用去算四十九哦，因为过去很多的医家呢，都以四十九为一个数。****为什么？因为七七是四十九、是阳数，所以它用四十九，因为它能够行阳嘛、能够散气。****真的说四十八或五十无所谓啊，我不相信会差了一点点。**」【孟铣原文】「**酒服四十九粒，能泻结气。**」\n\n**【极精】四十九 = 七七 = 阳数（药量取象）**\n\n```\n四十九粒（7×7）→ 阳数 → 行阳散气\n```\n\n**「这是最精的数术注解（附理性态度）。」** ✓✓\n\n**须「标」**：**「『四九』为象数附会，实际按剂量」** ✓✓","o":"RJ-2627 · 《人纪·神农本草经》下经第三百一十八味，讲解（PDF 第 566 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"雷丸治小儿虫积","c":"【本经原文】「**一名雷矢；味苦，寒，有小毒；主杀三虫，逐毒气，胃中热，利丈夫，不利女子；作膏摩，除小儿百病。**」【产地】「**生土中，为竹之余气所结，故亦曰竹苓。**」【性味】「**味苦（或作咸），性寒，有小毒。**」【主治】「**雷丸为消积杀虫要药，主除皮中热结，逐毒气，杀诸虫，作摩膏治小儿百病。**」【别录】「**作摩膏除小儿百病，逐邪气恶风汗出，除皮中热结，积虫毒，白虫寸白；久服令人阴痿。**」【用量】「**普通一至二钱。**」【禁忌】「**不利女子，多服令人阴痿。**」讲义：「**雷丸中药房都有得卖。****一般来说，小儿科的时候使用，小孩子、儿科；一般来说雷丸可以做膏，做成药膏、涂在身体、皮肤上面。****那你看雷丸的性味：味苦、咸，性寒有小毒，一般来说就是小孩子杀虫。****像那个食物消化不好，用雷丸杀虫。****使用最多的就是蛔虫。**」\n\n**【极精】雷丸（竹苓）= 小儿杀虫/摩膏**\n\n```\n小儿虫积/消化不良 → 雷丸（1–2 钱）\n外用摩膏 → 除小儿百病\n```\n\n**须「标」**：**「①儿童须查粪检；②雷丸有小毒；③不可自服」** ✓✓","o":"RJ-2628 · 《人纪·神农本草经》下经第三百二十味「雷丸」，原文及讲解（PDF 第 567–568 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"莽草外洗","c":"【本经原文】「**味辛，温，有毒；治风头，痈肿，乳痈，疝瘕，除结气，疥瘙，杀虫、鱼。**」【性味】「**味辛性温有毒。**」【主治】「**消肿、杀虫要药，治痈肿，瘰疬，疥癣，白秃，头风痛及皮肤麻痹。**」【别录】「**疗喉痹不通，乳难，头风痒，可用沐，勿内服。**」【甄权】「**不入汤服；主头疮白秃，杀虫，与白蔹、赤小豆为末，鸡子白调之如糊，敷毒肿。**」【用量】「**无定量。**」【禁忌】「**只可做沐汤及外敷药，不可内服。**」讲义：「**诸位记得，你看那个花类的东西，像那个、它种子在传播的时候会有枊（áng）、长枊，风一吹的时候到处飘。****你看它性那么轻，那么轻的浮在表面上、浮在空中，可以散到很远的地方、它可以到皮肤表面上。****所以说外洗一定可以使用，绝对不会有问题的，是杀虫的药。****身上的疥癣、皮肤痒什么都可以使用。**」\n\n**【极精】莽草：轻浮达表 → 只可外洗（禁内服）**\n\n```\n种子轻浮随风 → 达皮肤表面 → 外洗杀虫\n（绝对禁内服）\n```\n\n**须「绝「对「强「标」**：**「莽草有毒（莽草素，可致惊厥），绝对禁内服；只外洗」** ✓✓","o":"RJ-2629 · 《人纪·神农本草经》下经第三百一十九味「莽草」，原文及讲解（PDF 第 566–567 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"蛇蜕蝉蜕一对并用","c":"【本经原文】「**味咸，平，无毒；治小儿百二十种惊痫，瘈瘲，癫疾，寒热，肠痔，虫毒，蛇痫。**」【性味】「**味咸甘，性平，无毒（或作小毒）。**」【主治】「**蛇蜕主瘈瘲癫疾，弄舌摇头，治皮肤疥癣疮疡，明目退翳。**」【别录】「**大人五邪，言语僻越，止呕逆，明目，烧之疗诸恶疮。**」【用量】「**普通五分至一钱。**」【禁忌】「**性走窜，凡小儿惊痫癫疾，非外邪客忤而由肝心虚者忌用；孕妇忌之。**」讲义：「**蛇蜕，336，我们用来治疗皮肤病，常常跟蝉蜕在一起并用。****你看主治，蛇蜕主瘛疭、癫疾、癫痫，小孩子弄舌头、摇头晃脑——现在不是 Tourette 证（抽动秽语综合征）吗？摇头晃脑、像那个耸肩呐，就是晃来晃去。****还有这个小朋友还有口吐脏话、没办法控制、就在那边讲——哦、蛇蜕！蛇蜕是专门用在小儿科方面的。****我常常开的是蛇蜕五分、蝉蜕五分，一对一起用。**」\n\n**【极重要】蛇蜕 + 蝉蜕（各 5 分）= 抽动秽语/皮肤病**\n\n```\n小儿抽动（摇头/弄舌/耸肩/秽语）→ 蛇蜕+蝉蜕\n皮肤病/疥癣 → 同\n```\n\n**「这是全书最精的虫类药对。」** ✓✓\n\n**须「强「标」**：**「①抽动秽语须神经内科/儿童精神科；②不可以中药替代；③须排风湿舞蹈/癫痫」** ✓✓","o":"RJ-2630 · 《人纪·神农本草经》下经第三百三十六味「蛇蜕」，原文及讲解（PDF 第 569–571 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"蛇蜕以皮换皮","c":"讲义讲「一«条«极«精«的«取«象»」：「**因为蜕就是褪下来的皮，你看眼睛里面生眼翳，可以用蛇蜕退掉。**」【主治】「**明目退翳。**」讲义讲「煮蛇蜕须布包」：「**但希望你在煮蛇蜕、下蛇蜕的时候，你让那个蛇蜕用棉布把它包起来。****包起来并不是蛇蜕需要包，而是浮在表面上太可怕：哎，怎么有蛇在里面？****可能煮药煮到一半、蛇跑进去。****所以还是用棉布把它包起来、不用给他看到。**」\n\n**【极精】蛇蜕「以皮换皮」→ 退眼翳/皮肤病**\n\n```\n蛇蜕（蜕皮）→ 退翳（眼）/换皮（皮肤）\n煮时布包（避免患者看到惊吓）\n```\n\n**「这是最精的取象思维（+人文细节）。」** ✓✓\n\n**须「标」**：**「①眼翳须眼科（白内障/角膜）；②不可以中药替代手术；③须散瞳检查」** ✓✓","o":"RJ-2631 · 《人纪·神农本草经》下经第三百三十六味，讲解（PDF 第 569–570 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"地龙攻坚与脑积水","c":"【本经原文】「**味咸，寒，无毒；治蛇瘕，去三虫，伏尸，鬼疰，虫毒，杀长虫；仍自化作水；今名地龙。**」【性味】「**味甘酸，性寒，无毒。**」【主治】「**蚯蚓主解毒，敷疮，小便不通，赤白痢疾。**」【日华】「**小儿阴囊忽虚热肿痛，以生甘草汁入轻粉末调涂之。**」【用量】「**普通一钱至三钱。**」【禁忌】「**内服宜煎汁澄清，不必用渣。**」讲义：「**蚯蚓呢主解毒、赤白痢。****我们常常在用蚯蚓的时候，用在攻坚：比如说妇人有干血痨、里面有淤血的时候，我们会用地龙，因为地龙是无孔不入。****还有呢，在脑积水的时候也会用到地龙：因为这个水停在脑部里面，如果泥土挡到、水浮在上面就下不来。****所以我们用地龙下去；脑部肿瘤、脑瘤的时候我们会使用到地龙，因为地龙能够疏通开来，然后生半夏把水导下来。****地龙本身在泥土里面到处钻啊挖啊、翻土一样。**」\n\n**【极重要】地龙 = 无孔不入（攻坚/干血痨/脑积水）**\n\n```\n干血痨（淤血）→ 地龙（无孔不入）\n脑积水/脑瘤 → 地龙（疏通）+ 生半夏（导水）\n```\n\n**须「绝「对「强「标」**：**「①脑积水/脑瘤须神外科；②不可以中药替代手术；③地龙有小毒（抗凝/过敏）」** ✓✓\n\n**「这是最精的取象（钻土=通窍）。」** ✓✓","o":"RJ-2632 · 《人纪·神农本草经》下经第三百三十七味「白颈蚯蚓」，原文及讲解（PDF 第 571–572 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"地龙吃多人会虚","c":"讲义讲「一«条«极«精«的«剂«量»」：「**使用剂量上面，地龙非常的凶，这个吃下去、吃多人身体会虚。****所以说一般来说像我这种体格，你用两钱就可以了。**」\n\n**【极精】地龙 2 钱为度（多服伤正）**\n\n```\n地龙 2 钱（一般体格）\n多服 → 体虚\n```\n\n**「这是最精的剂量上限。」** ✓✓","o":"RJ-2633 · 《人纪·神农本草经》下经第三百三十七味，讲解（PDF 第 572 页）。"},{"t":"神农本草经·下经：柳花、楝实、郁李仁、蛇蜕、地龙","h":"饭前饭后服药法","c":"讲义讲「一«条«极«重«要«的«服«药«时«机»」：「**那中药有饭前还是饭后服：如果我们要病人、这个药能够攻到脑部去，大部分都是饭后吃；****要攻到往下焦、攻到小肠大肠、攻到膝盖、攻到脚部的时候，都是饭前吃，大部分都是这样子。****那发表的药也是在饭前吃。**」\n\n**【极重要】服药时机：攻上（饭后）／攻下与发表（饭前）**\n\n```\n攻脑部/上焦 → 饭后\n攻下焦（小肠/大肠/膝/脚）→ 饭前\n发表（汗法）→ 饭前\n```\n\n**「这是全书最精的服药时间表。」** ✓✓\n\n**「与 n232病在上饭后、病在下饭前」（n50 妇人妊娠）完全一致。** ✓✓","o":"RJ-2634 · 《人纪·神农本草经》下经第三百三十七味，讲解（PDF 第 572 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"蜈蚣攻坚但伤血","c":"【本经原文】「**味辛，温，有毒；治鬼疰，虫毒，啖诸蛇、虫、鱼毒，杀鬼物老精，温疟，去三虫。**」【性味】「**味辛，性温，有毒。**」【主治】「**蜈蚣为驱风散结要药，主小儿惊痫，风搐脐风，治寒热积聚，堕胎，去恶血，制蛇毒。**」【别录】「**疗心腹寒热积聚，堕胎，去恶血。**」【日华】「**治症瘕。**」【用量】「**普通一至二钱。**」【禁忌】「**蜈蚣有毒，必风气暴烈、药病相当乃可设；或过剂，以蚯蚓桑皮解之；畏蛞蝓，被蜈蚣螫伤，捣蛞蝓涂之即止痛。**」讲义：「**过去我们使用在肿瘤硬块的时候会用蜈蚣，因为蜈蚣很凶、它咬进去的力量很强。****所以淋巴癌、淋巴肿块、肝癌肿块，都会使用到蜈蚣。****但是诸位记得：动物性的药它本身攻坚的力量很强，但同时会伤血，一定会伤到。****所以说你要加一些补血的药、混合在一起，攻补、补泻兼顾，不要老是在那边攻。**」\n\n**【极重要】蜈蚣攻坚 → 必配补血（攻补兼顾）**\n\n```\n淋巴/肝肿块 → 蜈蚣 1–2 钱\n+ 补血药（否则伤血）\n```\n\n**须「绝「对「强「标」**：**「①蜈蚣有毒；②肿块须先确诊（不可盲攻）；③须肿瘤科；④不可自服」** ✓✓\n\n**「动物药攻坚必伤血」——「这是最精的攻补原则。」** ✓✓","o":"RJ-2635 · 《人纪·神农本草经》下经第三百三十九味「蜈蚣」，原文及讲解（PDF 第 572–573 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"水蛭要选吸血的小水蛭","c":"【本经原文】「**味咸平，有毒；主逐恶血，瘀血，月闭，破血瘕，积聚，无子，利水道。**」【性味】「**味咸，性平，有毒。**」【主治】「**水蛭主逐恶血，破症积，治折伤坠扑，蓄血疼痛，堕胎通经，外治肿毒。**」【药征】「**治女子月闭，欲成干血劳。**」【宗奭】「**治折伤坠扑蓄血有功。**」【容川】「**锐而善入，又能吮血，故主攻血积。**」【灵胎】「**逐瘀破积。**」【用量】「**普通一至二钱。**」【禁忌】「**破血泄结之品，不可轻服；误吞水蛭入腹难死，久则生子、食人肝血、腹痛难忍、面目黄瘦；用田中泥一两、雄黄二钱为丸，分四服，开水下即随大便而出；此物畏石灰食盐。**」讲义：「**那这个水蛭必须要找吸血的水蛭。****那水蛭很小，那你只好把脚放到水里面去看它吸到你的脚上的一只，那个就有用。****水蛭攻坚的力量非常的强，硬块、活血、化瘀，尤其是急性的。****那到市场上去挑水蛭的时候：越细小的力量越大。**」\n\n**【最重要】水蛭须用吸血种、越小力越大**\n\n```\n吸血水蛭（细小为佳）→ 攻坚/化瘀\n抵当汤 = 水蛭 + 虻虫\n```\n\n**须「绝「对「强「标」**：**「①水蛭有毒（抗凝/出血）；②外来水蛭有感染风险；③绝对不可自捕自用；④须专业医师」** ✓✓","o":"RJ-2636 · 《人纪·神农本草经》下经第三百四十味「水蛭」，原文及讲解（PDF 第 573–574 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"水蛭治睾丸踢伤","c":"讲义讲「一«条«极«重«要«的«急«症»」：「**如果有人踢到睾丸、急性的伤、踢到睾丸会重伤，那时候淤血会大块、整个肿起来、小便排不出来——这会死人的！****这个时候呢，我们用水蛭、用虻虫。**」【容川】「**锐而善入，又能吮血，故主攻血积。**」\n\n**【极重要】睾丸踢伤（淤血/尿不出）= 急症 → 水蛭+虻虫（抵当汤）**\n\n```\n睾丸外伤 → 大块淤血 + 尿闭 → 急症\n抵当汤（水蛭+虻虫）\n```\n\n**须「绝「对「强「标」**：**「①睾丸外伤须立即急诊（超声/手术）；②尿闭为泌尿急症；③抵当汤不可自用」** ✓✓","o":"RJ-2637 · 《人纪·神农本草经》下经第三百四十味，讲解（PDF 第 573–574 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"动物药一剂即止","c":"讲义讲「一«条«极«重«要«的«用«法»」：「**处方的时候，我们过去经方里面有叫抵当汤。****那水蛭和虻虫，在开这种药的时候是峻剂、这种都属于峻剂。****你可以一剂、一剂给他，就清出来了，大便出来都是黑的，小便那边的淤血都会排出来。****一般来说我们开的一钱两钱就够了，看严重性、体格大小。****水蛭到手上的时候是炮制过——所谓炮制过就是他当场抓到水蛭就在那烧红的瓦片上烧过，偏黄的、烤黄了以后收起来，这样不会坏掉、风干了跟干掉了一样，只要没有水它就不会坏掉。**」【药征】「**治女子月经，月经都不来了、月闭、干血在里面，你用很多活血化瘀的药清不出来的时候，诸位就要想到用动物性的药，一剂就够了，吃了月经就来了。**」\n\n**【极重要】动物性峻药：一剂即止（月经即来）**\n\n```\n干血痨/月闭（植物药无效）→ 动物药（水蛭/虻虫）一剂\n```\n\n**「用植物药清不出来时才用动物药」——「这是最精的升级阶梯。」** ✓✓","o":"RJ-2638 · 《人纪·神农本草经》下经第三百四十味，讲解（PDF 第 573–574 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"斑蝥治子宫肌瘤","c":"【本经原文】「**味辛寒，有毒；治寒热，鬼疰，虫毒，鼠瘘，恶疮，疽蚀，死肌，破石癃。**」【性味】「**味辛，性寒，有毒。**」【主治】「**斑蝥主瘰疬虫毒，治血积，蚀死肌，破石癃，堕妊娠死胎，敷鼠瘘恶疮。**」【别录】「**血积，伤人肌，治疥癣，堕胎。**」【用量】「**普通二分至三分。**」【禁忌】「**有毒，用时去翅足，同糯米炒熟，或麸炒过、醋煮用；惟性猛毒，力能烂肉堕胎，体虚者忌之。**」讲义：「**斑蝥在治疗女人的子宫肌瘤、子宫肿瘤，动物性的药很强。****临床上你如果用斑蝥——斑蝥很毒，把那个翅膀、脚、头统统去掉，烤干以后打成粉，放一点点剂量下去。****一般来说女人吃了比较不舒服，是可以攻坚——子宫的肿瘤。****可是妇女吃完就一天，那阴道那边就很想上厕所的感觉，一直想排东西出来、排不出来，就没办法出去上班。**」\n\n**【极重要】斑蝥（去翅足、米炒）= 攻子宫肌瘤（极毒）**\n\n```\n子宫肌瘤 → 斑蝥 2–3 分（极毒）\n副作用：里急后重、无法上班\n```\n\n**须「绝「对「强「标」**：**「①斑蝥素有剧毒（肾毒/致死）；②绝对不可自制/自服；③子宫肌瘤须妇科评估；④现代极少用」** ✓✓","o":"RJ-2639 · 《人纪·神农本草经》下经第三百四十一味「斑蟊」，原文及讲解（PDF 第 574–575 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"蝉蜕点眼方","c":"【本经原文】「**味甘，平，无毒；治小儿惊痫，寒热，结气，蛊毒，鬼疰；又名知了，今名蝉蜕。**」【性味】「**味甘咸性寒。**」【主治】「**为解热镇惊退翳之药，治小儿热惊，皮肤风热瘾疹，目生翳障，治小儿哑病及阴肿［秦皮 3 钱、蝉蜕 5 分、蛇蜕 5 分，三碗煮一碗，可内服可点眼睛，治眼红肿、生翳］。**」【宗奭】「**除目昏除翳，以水煎汁服，治小儿疮疹出不快，甚良。**」【时珍】「**治头风眩晕，皮肤风热，痘疹作痒，破伤风，大人失音，小儿噤风天吊，惊哭夜啼，阴肿。**」【用量】「**一般五分至一钱。**」【禁忌】「**无。**」【附方】「**小儿惊啼——蝉蜕后半截为末，入薄荷脑少许，每服一匙蜜调下，亦治夜啼。****瘾疹——蝉蜕与薄荷叶等分为末，每酒服一钱，日三。**」讲义：「**任何的蝉蜕，你看像蛇蜕，蜕皮的东西、甲壳类蜕皮的东西，都能够退眼睛的翳。****诸位看，如果说我们用秦皮、然后蝉蜕、蛇蜕……秦皮我们用三钱、蝉蜕五分，一剂三碗水煮一碗，不多啊，然后过滤掉，用这来点眼药水，很好啊，内服都可以。****可以止痛止痒眼睛的红肿刺痛、消炎，像那个结膜炎、角膜炎，那去眼翳的障碍、生白内障眼翳的东西，内服也可以。**」\n\n**【最重要】点眼方：秦皮 3 钱 + 蝉蜕 5 分 + 蛇蜕 5 分（内服可点眼）**\n\n```\n眼红肿/结膜炎/角膜炎/翳 → 秦皮3钱+蝉蜕5分+蛇蜕5分\n三碗煮一碗 → 过滤 → 点眼/内服\n```\n\n**须「强「标」**：**「①眼部感染须眼科（细菌/病毒）；②自制滴眼液有感染风险；③白内障/角膜须手术」** ✓✓\n\n**「这是全书最精的眼科外治方。」** ✓✓","o":"RJ-2640 · 《人纪·神农本草经》下经第三百四十四味「雀瓮」（蝉蜕），原文及讲解（PDF 第 576–577 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"蜕皮药都能退翳","c":"讲义讲「一«条«极«精«的«取«象»」：「**任何的蝉蜕，你看像蛇蜕——蜕皮的东西、甲壳类蜕皮的东西，都能够退眼睛的翳。****所以治疗眼科的时候我们都会使用它。**」\n\n**【极精】蜕皮类药 → 退眼翳（以蜕退翳）**\n\n```\n蛇蜕/蝉蜕（蜕皮）→ 退眼翳\n取象：「蜕」= 退\n```\n\n**「这是最精的取象通则。」** ✓✓","o":"RJ-2641 · 《人纪·神农本草经》下经第三百四十四味，讲解（PDF 第 576–577 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"桃仁活血化瘀通便","c":"【本经原文】「**味苦，平，无毒；治瘀血，血闭瘕，邪气，杀小虫；今名桃仁。**」【性味】「**味苦甘，性平，无毒。**」【主治】「**桃仁为破血润燥要药，主行瘀血，消心下坚硬，治血晕血痞血积血痢，血热燥痒，蓄血发狂，通月经［桃仁吃多了很上火］。**」【元素】「**治血结血秘血燥，通润大便；破蓄血。**」【容川】「**桃花红而仁味苦，皆得地火之性；仁在核中，又象人心，味苦有生气，是正入心中，故桃仁能破血，亦能生血。****气属阳，血属阴，瘀血阻气，则阳不入阴，蒸热汗出，宜破其血，使气得入于血中，则不壅热，桃仁主之。**」【倪注】「**痘家勿用，因仁有生气，可令痘长。**」【药征】「**主治瘀血，少腹满痛，兼治肠痈及妇人经水不利。**」【用量】「**普通一钱至二至三钱。**」【禁忌】「**桃仁散而不收，泻而无补，过用或不当，能使血下不止，损伤真阴；双仁者有毒。**」讲义：「**这个桃仁我们使用非常多，专门活血化瘀、治淤血。****比如说咳嗽咳久、痰里面带血，或肺里面有血、很多肺气管破裂里面有血，我们会用桃仁。****妇女来经期痛或者下血块下来肚子痛、每次来了痛经，我们也可以加桃仁。****那一般来说都是加三钱、三钱起跳，那力量才有。****举凡任何的淤血我们需要活血化瘀的时候都会使用到桃仁。****但我们不会说管他淤血在哪个部位：在肺里面、在子宫里面、在大肠里面、在胃里面、在肌肉上面，统统可以使用桃仁，脑部里面也可以使用桃仁。**」\n\n**【最重要】桃仁 = 全身各处活血化瘀（3 钱起）**\n\n```\n淤血（肺/子宫/大肠/胃/肌肉/脑）→ 桃仁\n+ 通便（仁剂含油）\n```\n\n**须「强「标」**：**「①活血药有出血风险；②孕妇禁；③抗凝药同用须谨慎」** ✓✓","o":"RJ-2642 · 《人纪·神农本草经》下经第三百五十二味「桃核仁」，原文及讲解（PDF 第 578–580 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"有仁皆润下","c":"讲义讲「一«条«极«精«的«通«则»」：「**所以诸位只要记得我们中医讲的『仁』剂：只要有『仁』就代表有油脂，油就代表可以利大便。****这个利大便当然不能跟大黄比了——大黄叫川军，川象征四川人已经很辣了，加上大将军、川军更凶悍啊。****那它当然没有像大黄利得那么厉害，但是它有通便的功能。**」\n\n**【极精】「有仁皆润下」——仁（种子）含油脂 → 通便**\n\n```\n桃仁/杏仁/麻子仁/柏子仁/酸枣仁/郁李仁 → 润下\n(峻下仍是大黄)\n```\n\n**「这条第四次出现（n213/n216/n218…）」——「这是最精的药类通则。」** ✓✓","o":"RJ-2643 · 《人纪·神农本草经》下经第三百五十二味，讲解（PDF 第 578 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"贫血其实是阳不入阴","c":"讲义讲「一«条«最«重«要«的«病«机»」：「**就代表他补不进去。****所以如果说不了解如何补血、只知道开补血的药，而不知道如何把血补足，你没有办法治好贫血。****很多的贫血实际上是『阳不入阴』。****怎么讲阳不入阴？比如说他身上有血、淤血堵到了、在这血管里面淤血，那阳气呢？****真的血里面的阳、就是血里面的动能，这个阳之气也可以讲我们血里面的氧气，在血里面停有很多的氧，进不去、因为有淤血堵到。****这个时候你开活血化瘀的药，把淤血一去掉的时候，阳可以入阴，那血液循环就开始动、血就开始生产制造。**」\n\n**【最重要】贫血 = 阳不入阴（淤血阻隔）→ 先化瘀再补血**\n\n```\n贫血 + 补血无效（上火/燥渴/脉数）→ 有淤血\n→ 活血化瘀 → 阳入阴 → 造血恢复\n```\n\n**「这是全书最精的贫血病机。」** ✓✓\n\n**须「强「标」**：**「①贫血须查血常规/铁代谢/骨穿；②缺铁/B12/叶酸须补充；③不可只靠中药」** ✓✓","o":"RJ-2644 · 《人纪·神农本草经》下经第三百五十二味，讲解（PDF 第 579–580 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"补血须三脏并顾","c":"讲义讲「一«条«极«重«要«的«治«则»」：「**所以中医过去在治疗贫血的时候，你看：肝藏血、脾统血、心生血。****所以你要这三个脏器同时能顾虑到的话，就会把造血的功能恢复。****那西医到现在贫血没办法、无治，没有办法治贫血，所以大概两个月给你打一个多种维他命、B12 注射一剂，然后看看红血球太低了打红血球、血红素太低了打点血红素、铁太少了给你输铁片。**」【附注】「**一般临床医生没有注意到这一点。**」\n\n**【极重要】补血三脏：肝藏血、脾统血、心生血**\n\n```\n贫血 → 入肝 + 入脾 + 入心 三脏同治\n```\n\n**「这是最精的补血框架。」** ✓✓\n\n**须「修正」**：**「『西医没办法治贫血』须否：缺铁性贫血口服铁剂有效（一线）；B12/叶酸有效；肾性贫血用EPO；地中海贫血输血/去铁；骨髓移植可治愈」** ✓✓✓","o":"RJ-2645 · 《人纪·神农本草经》下经第三百五十二味，讲解（PDF 第 579–580 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"桃仁吃多了长痘","c":"讲义讲「一«条«极«精«的«副«作«用»」：「**桃仁会上火，那女孩子会长痘痘，男人也会长痘痘。****如果说看这个小姐是你的情敌，那小姐那么漂亮、她月经痛，桃仁你多加一点，她就跟你说吃了这个你开的药月经不痛了、很好；可为什么痘痘那么多、脸上长满痘痘？****所以年轻小姐不要吃太多桃仁，或者你用别的药取代。****这个用一钱就可以了。****我每次桃仁一拿掉、痘子就没了；一加进去、痘子就来了。**」【主治附注】「**桃仁吃多了很上火。**」【倪注】「**痘家勿用，因仁有生气，可令痘长。**」\n\n**【极精】桃仁会上火 → 痘家/年轻女性慎用（1 钱）**\n\n```\n桃仁（仁有生气）→ 上火 → 长痘\n痘家勿用；女性用 1 钱\n```\n\n**「这是最精的药物副作用观察。」** ✓✓","o":"RJ-2646 · 《人纪·神农本草经》下经第三百五十二味，讲解及倪注（PDF 第 579–580 页）。"},{"t":"神农本草经·下经：蜈蚣、水蛭、斑蝥、蝉蜕、桃核仁","h":"铁片补铁反堵肝须修正","c":"讲义讲「一«段«须«修«正«的«主«张»」：「**铁太少了给你输铁片，那你如果按照西医的做法——铁片吃完堵在肝脏里面、肝里面都是铁，吃完铁片以后第一个后遗症就是便秘。****你不相信你吃吃看。****吃铁不会补铁，西医认为补铁，你吃了铁剂还不如吃点那个叫什么菠菜啊，搞不好补起铁来比你那个更好。****所以西医不晓得如何治贫血。**」\n\n**【须「否定】吃铁不会补铁」/「铁片堵在肝」/「菠菜胜铁剂」**\n\n**须「逐条否定」**：**「①口服铁剂（硫酸亚铁/富马酸亚铁）是缺铁性贫血的一线治疗，效果确切（Hb 上升）；②铁剂常见副作用是胃肠刺激/黑便/便秘，非『堵肝』；③铁过载（血色病/输血）才沉积肝/心；④菠菜含铁但吸收率低（草酸），远不如铁剂」** ✓✓✓","o":"RJ-2647 · 《人纪·神农本草经》下经第三百五十二味，讲解（PDF 第 579–580 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"杏仁治肺结核的二战记录","c":"【本经原文】「**味甘，温，有毒；治咳逆上气，肠中雷鸣，喉痹，下气，产乳，金疮，寒心，奔豚；今名杏仁。**」【性味】「**味甘苦，性温，有小毒。**」【主治】「**杏仁为咳逆痰气要药，主咳嗽气急，能下气平喘，治风寒痰滞，能宣肺解肌，除风散寒，润燥消积，利胸膈气滞，通大肠气闭。**」【元素】「**除肺热，治上焦风燥，利胸膈气逆，润大肠气秘。**」【容川】「**杏仁有油，但得苦味，无辛烈之气，故降而不及。****色白属金，降气行痰，气降则血降，故凡吐血必咳痰；痰为气分，因气逆而血升，故引出其血也。**」【药征】「**主治胸间停水也，故治喘咳，而旁治短气结胸，心痛，形体浮肿。**」【用量】「**普通钱半至三钱。**」【禁忌】「**阴虚咳嗽、肺家有虚热痰者均忌；杏仁双仁者有毒能杀人。**」讲义：「**过去东北、我们抗日战争在东北打的时候，结果很多人得到 TB 就是肺结核。****当时没什么药怎么办？当时就有个老先生跟个年轻人讲——那年轻人肺结核、一直在咳血，他说你去花点钱去买那个杏、丹东东北产的那个杏。****然后你吃那个杏里面的仁、新鲜的仁，然后你专门去吃那个仁。****结果吃了两三个月，咳嗽也好了、也不吐血咳血，都好啦。****后来日本人把他抓起来剖开，一看他肺里面所有的肺泡结的地方都有杏把它结住，功能完全恢复，只是那个杏把肺泡破损的地方统统结起来了、结痂。**」\n\n**【最重要】杏仁使肺破溃处结痂（TB 咯血）**\n\n```\nTB 咯血 → 新鲜杏仁长期服 → 病灶结痂\n```\n\n**须「绝「对「强「标」**：**「①肺结核须规范抗结核（DOTS，6个月四联）；②杏仁含苦杏仁苷（氰化物），过量可致死；③绝对不可以杏仁代替抗结核；④二战记录为个案轶事」** ✓✓✓","o":"RJ-2648 · 《人纪·神农本草经》下经第三百五十三味「杏核仁」，原文及讲解（PDF 第 581–582 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"杏仁专去浊痰黄痰","c":"讲义讲「一«条«极«重«要«的«适«应»」：「**杏仁呢，咳利痰气的要药。****张仲景用杏仁用得很多，包括宣肺去痰、肺气不开，宣肺，它能够去痰。****这个杏仁去的痰呢都是浊痰、黄浊的痰。****对肺的功能很好。****那我们不管治疗百日咳、不管它的名称是什么——不管是 TB 或者肺结核、或者是肺气肿、或者气喘、或者只是一般性的咳嗽都没有关系，只要看到有痰、肺气没有办法宣泄、短气，统统可以加杏仁上去。****黄痰、黄粘稠的焦痰、口渴，一般来说应该是热症，我们可以用杏仁。**」\n\n**【极重要】杏仁 = 黄浊痰/焦痰（热证）**\n\n```\n黄浊稠痰 + 口渴 → 杏仁（宣肺下气）\n```\n\n**「不论病名，只要黄痰就用」——「这是最精的取用原则。」** ✓✓","o":"RJ-2649 · 《人纪·神农本草经》下经第三百五十三味，讲解（PDF 第 582 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"气降则血降","c":"【容川】「**杏仁有油，但得苦味，无辛烈之气，故降而不及。色白属金，降气行痰，气降则血降，故凡吐血必咳痰。****痰为气分，因气逆而血升，故引出其血也。**」讲义：「**那个吐血一定会有咳痰：痰是气分，因为气逆有血生、所以引起出血。****这个时候痰呢，就是有痰你没有好，痰一直咳出来以后血就跟着出来。****你会看到血是因为之前有痰出来。****所以说杏仁能够去痰、所以它能够止血，最主要是它把痰去掉所以血就归位，最主要原因在这里面。**」\n\n**【极精】气降则血降（先去痰则血归位）**\n\n```\n吐血 ← 气逆 + 痰 → 杏仁（降气去痰）→ 血降\n```\n\n**「这是最精的吐血机制（气逆致血升）。」** ✓✓\n\n**须「强「标」**：**「①咯血须立即查CT/气管镜；②大量咯血须急诊；③不可靠杏仁止血」** ✓✓","o":"RJ-2650 · 《人纪·神农本草经》下经第三百五十三味，容川注及讲解（PDF 第 582–583 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"杏仁用豆腐制可去痘","c":"【禁忌】「**凡杏子性皆热，小儿多食致疮痈膈热，多食动宿疾，产妇尤忌。**」讲义讲「一«条«极«精«的«炮«制»」：「**那这个禁忌，杏子比较热，跟桃仁杏仁都一样，吃了容易长痘痘。****但是你如果做成了杏仁豆腐不一样了——那豆腐本来就是去热毒的。****所以我们中医，过去豆腐……慈禧太后她吃那个珍珠，因为珍珠可以美颜嘛，但珍珠有毒啊、那个怎么吃？****她用珍珠、下面一层豆腐做底，把珍珠放上去……用棉布把珍珠撒上去一收好收。****豆腐很奇怪，豆类的东西可以去热毒。****所以你如果是杏仁用豆腐炮制过的话，反而可以去痘痘，那个热性反而没有。****所以你吃杏仁豆腐倒没有关系。**」\n\n**【极精】豆类去热毒（杏仁豆腐可解杏之热）**\n\n```\n杏仁（热/长痘）+ 豆腐（豆类去热毒）\n→ 炮制后热性去、可去痘\n```\n\n**「豆类去热毒」——「这是最精的炮制原理。」** ✓✓","o":"RJ-2651 · 《人纪·神农本草经》下经第三百五十三味，讲解（PDF 第 582–583 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"水的六种分类与治法","c":"讲义讲「一«条«最«重«要«的«水«病«地«图»」：「**很多的水肿，我这里大致分一下：****我们有两种水：一种肝病，肝病造成的水的时候，那个腹水肚子很大，这个时候我们是以健脾为主、把脾脏功能健起来。****所以我们开很多处方，都是比如苍术、白术、泽泻、车前、木通、灯芯草，都是健脾利湿、甘淡渗利的药。****那你如果是肾脏病，很多人肾脏有问题也会水肿、堵在下面、下焦、两个腿、脚都肿起来，这些肾脏病的水肿的时候，主力的药我们用一些商陆、甘遂、牵牛之类的把水排掉。****那如果水跑到肺里面去的时候，我们用一些甘遂、芫花、大戟这个来清它。****如果由肺里面跑到胁间里面去了，我们可以用一些生半夏。****那有些人积水跑到子宫里面去造成子胀，子宫里面堵起来，我们用一些甘遂、大黄放在里边。****那如果是治水，它是外面的风水、就是皮肤整个肿起来，这时候中医是用发汗的方法，汗一发水就退掉。**」\n\n**【最重要】水病六分类与治法（全书最完整地图）**\n\n| 部位/病因 | 治法/主药 |\n|---|---|\n| **肝病腹水** | 健脾为主（苍白术/泽泻/车前/木通/灯芯） |\n| **肾病下肢** | 峻下（商陆/甘遂/牵牛） |\n| **肺水** | 甘遂/芫花/大戟 |\n| **胁间水** | 生半夏 |\n| **子宫积水** | 甘遂 + 大黄 |\n| **风水（皮肤）** | 发汗 |\n\n**「这是全册最精的水病地图。」** ✓✓✓\n\n**须「强「标」**：**「①水肿须查心/肾/肝/甲状腺/营养；②利尿剂/透析/限钠为规范；③峻剂须住院」** ✓✓","o":"RJ-2652 · 《人纪·神农本草经》下经第三百五十五味「苦瓠」，讲解（PDF 第 583–584 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"青盐与茯苓戎盐汤","c":"【增补一】「**青盐——即戎盐，补肾，泻血热。****【性味】甘咸而寒，入肾经。****【主治】助水脏，平血热，坚骨固齿，明目乌发。****【别录】治目痛赤涩，吐血溺血，齿舌出血。****【炮制】不假煎炼，方棱，明莹，色青者良。****【用量】普通五分至一钱。****【禁忌】多食伤肺，走血，渗津，发渴；凡血病、哮喘、水肿、消渴人为大忌。**」讲义：「**这是我国大陆青海的盐巴。****它的性是甘咸而寒，直接入肾经。****那过去在青康、青海这一带的人呢，因为它们只食用的盐是青盐，所以说他们这边的人几乎没有人得到肾结石。****在经方里面张仲景有茯苓戎盐汤，里面讲到用这个青盐来打那个肾结石，所以是很好使用的。****青盐就是青色的、真的是青色的，海盐就是白色的，一看就看出来了。**」\n\n**【极重要】青盐（戎盐）= 补肾/泻血热/化肾结石（茯苓戎盐汤）**\n\n```\n青盐（青海，方形青色结晶）→ 入肾\n茯苓戎盐汤 → 肾结石\n```\n\n**须「强「标」**：**「①肾结石须多饮水/枸橼酸盐/体外碎石/手术；②『吃青盐不得结石』为观察性；③不可以盐代药」** ✓✓","o":"RJ-2653 · 《人纪·神农本草经》第三章增补一「青盐」，原文及讲解（PDF 第 585–586 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"青盐配炮附子刷牙","c":"讲义讲「一«条«极«重«要«的«外«用»」：「**它呢入水脏，坚骨固齿，明目乌发。****过去我们拿青盐打成粉跟炮附子两等量打成粉来刷牙，来保持牙齿很好、不会动摇。****你说如果喝了冰水……中国青盐和那个炮附子，你只要刷两天两次再喝冷水看看，马上就好了。****中医比他们还快，牙齿还很坚固。****真的，你那个牙齿摇动了、会摇动的牙齿，你下次用青盐和炮附子两个等量和在一起刷两天，以后第三天你去……那个 T-bone 那个排骨，你跟他说 well done 全部烤熟，咬啊，哇！一点都不痛，牙齿真凶啊。****所以青盐非常好用。******不要炮制，颜色是青色的最好。**」\n\n**【极重要】青盐 + 炮附子（等量）刷牙 → 固齿/止牙酸**\n\n```\n青盐粉 + 炮附子粉（1:1）→ 刷牙\n「牙为骨之余」（肾主骨）\n```\n\n**须「强「标」**：**「①牙齿松动须牙科（牙周炎/骨吸收）；②炮附子有毒，不可口服/吞下；③不可代替牙科治疗」** ✓✓\n\n**「这是全书最精的外用固齿方。」** ✓✓","o":"RJ-2654 · 《人纪·神农本草经》第三章增补一，讲解（PDF 第 585–586 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"甘遂配牵牛是绝配","c":"讲义讲「一«条«极«精«的«配«伍»」：「**尤其在使用那个甘遂跟牵牛的时候。****这甘遂和牵牛很好玩：你单用甘遂病人受不了、很难过、胀腹啊恶心哪；你单用牵牛也不行、下痢啊肚子痛啊。****你两个混在一起、一点都没感觉，就在排水，大便排出来，小便也会排一些、但绝大部分是大便排出来。****等量，就是要忌盐。**」\n\n**【极重要】甘遂 + 牵牛（等量）= 无难受感的排水**\n\n```\n单用甘遂 → 胀腹恶心\n单用牵牛 → 下痢腹痛\n两者等量 → 无感排水（+ 忌盐）\n```\n\n**「这是最精的配伍减毒。」** ✓✓\n\n**须「绝「对「强「标」**：**「①二者皆峻，可致脱水/电解质紊乱；②须住院/专业医师；③绝对不可自服；④忌盐须严格」** ✓✓","o":"RJ-2655 · 《人纪·神农本草经》第三章增补一「青盐」，讲解（PDF 第 586 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"诃子涩肠止痢","c":"【增补二】「**诃黎勒（诃子）****【性味】味苦酸涩，性温，无毒。****【主治】诃子为涩肠治痢、保肺调气要药，主胸膈结气，心腹胀满，消痰，化食，通津，开胃，治心腹虚痛，肠风下血，崩带，胎漏，久痢，虚嗽。****【甄权】破胸膈结气，通利津液，止水道，黑髭发。****【萧柄】下宿物，止肠澼久泄赤白痢。****【丹溪】实大肠，敛肺降火。****【用量】普通一至二钱。****【禁忌】气虚宜缓缓少用，以此虽涩肠而又泄气也；凡咳嗽痢疾初起者均忌。**」讲义：「**这个是它酸收敛。****酸涩的药，所以诃子专门是涩肠止痢的药、保肺调气的药。****那张仲景实际上是用在气逆：就是放屁的时候好像机关枪一样、砰砰砰一直气逆，那个是下痢但是没有力、腹胀排气很凶，这时我们用诃子，就是诃黎勒。**」\n\n**【极重要】诃子 = 涩肠止痢 + 敛肺（久痢/虚嗽）**\n\n```\n久痢/久泄（无力但排气很凶）→ 诃子\n初起痢疾/初咳 → 忌用（闭门留寇）\n```\n\n**「这是最精的涩药禁忌（初起忌用）。」** ✓✓","o":"RJ-2656 · 《人纪·神农本草经》第三章增补二「诃黎勒」，原文及讲解（PDF 第 586–587 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"酸收反而打开喉咙","c":"讲义讲「一«条«最«精«的«反«直«觉»」：「**咽喉不利含三数枚胜，因为它能够下气嘛、能够下俗物、能够通气、收敛。****所以喉咙不利的时候是喉咙闭锁住，那你想张开的话其实就是收敛。****为什么？那喉咙摆成这个样子、食物是可以通过去的；那现在堵到了，那你要收敛的话就要往回收——这往回收、这往回收，就是收敛，管道就打开来。****所以我们要用酸收的药，所以喉头才会打开来。****那酸味，张仲景还担心半夏通利的还不够，把半夏泡到醋里面更酸、通利它。****我们讲苦酒就是醋。**」\n\n**【极重要】酸收 → 管道反张（喉闭用酸收）**\n\n```\n喉闭（管道被堵扁）→ 酸收（往回收）→ 管道张开\n半夏苦酒汤 = 生半夏 + 醋（更酸更利）\n```\n\n**「这是全书最精的反直觉物理。」** ✓✓\n\n**须「强「标」**：**「①喉梗阻须立即急诊；②『酸收开喉』非适用于所有喉闭；③须气管切开备案」** ✓✓","o":"RJ-2657 · 《人纪·神农本草经》第三章增补二，讲解（PDF 第 587 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"红花多用破血少用养血","c":"【增补三】「**红花——本经无记载。****【性味】味辛，性温，无毒。****【主治】红花为活血行瘀要药，主暴吐紫血（紫则有瘀），产后血晕，痘疮血热有毒（血行则毒解），治月经不调，腹中结块。****【开宝】主产后血运口噤，腹内恶血不尽，绞痛，胎死腹中，并酒煮服。****【丹溪】多用破血，少用养血。****【用量】普通五分至钱半。****【禁忌】忌沉香麝香，能使红花变色；可下死胎，孕妇忌用；过用红花，能使血行不止而毙。**」【容川】「**色赤自入血分，味苦专能泄血，而花性专主轻扬，上行外走，故能泄肌肤脉络在外在上之血。**」讲义：「**一般来说大吐、吐血，产后的眩晕，我们都会用红花。****为什么？因为血在走的时候，红花能够行血，所以血里面有瘀血块挡住的时候，它能够把它清出来，让血变得速度加快、不会有瘀血堵在身体里面。****那用得多呢，把血会破坏掉；少用呢，能够养血。****那一般来说我们五分到一钱，一钱半就很多了，因为红花质很轻。**」\n\n**【最重要】红花：多用破血、少用养血（5 分–1.5 钱）**\n\n```\n少用（5 分–1 钱）→ 养血\n多用 → 破血（过量→血行不止「而毙」）\n孕妇禁（下死胎）\n```\n\n**须「强「标」**：**「①红花有活血作用，孕妇/抗凝/术前禁；②过量可致出血；③『而毙』为讲义极言」** ✓✓","o":"RJ-2658 · 《人纪·神农本草经》第三章增补三「红花」，原文及讲解（PDF 第 587–588 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"治风先治血","c":"【容川】「**有谚云：治风先治血，血行风自灭，血足则肝阳不动，而风自熄。****观仲景之红蓝花酒，治风气百疾，则知治风先治血的道理。****色红能生血，而味苦又能泻血。**」讲义：「**唐容川呢，他对这个红花解释得非常好：花性主轻扬、上行外走。****他是熟谙我们的中医的话、这个专科医师讲的话、经验。****治风我们要先治血，血行风自灭。****我们讲的肝就是风、肝脏就是风脏，治肝就是先治血，血走、肝病自然就会好。****血足则肝阳不动、风自熄，风就会停止下来、肝病就会停下来。****所以说我们一定要让它行血，所以活血化瘀是我们治疗肝病的大原则。**」\n\n**【最重要】治风先治血，血行风自灭（治肝大原则）**\n\n```\n肝病（风脏）→ 活血化瘀（血行 → 风灭）\n红蓝花酒（仲景）\n```\n\n**「这是全书最精的治肝原则。」** ✓✓\n\n**须「修正」**：**「『西医血管栓塞就是找死』须否——TACE/TAE是肝癌规范治疗之一（须按指征）」** ✓✓","o":"RJ-2659 · 《人纪·神农本草经》第三章增补三，容川注及讲解（PDF 第 587–588 页）。"},{"t":"神农本草经·下经（续）与增补：杏仁、青盐、诃子、红花","h":"藏红花通脑部血","c":"【番红花】「**味甘性平无毒，主活血开郁，治心忧气闷，惊悸，伤寒发狂；今多用为开胃行经之品。**」【藏红花】「**红花之产于西藏者，性味同红花；以入滚水内色如血、可冲四次不变色者为真；主活血通经治吐血；功用最良。**」讲义：「**那藏红花呢，因产在西藏高山的地方、青藏高原上面，它能够通到脑部的血。****所以你如果吃藏红花的话，一般这脑部不会缺氧。****所以西藏人、很多动物那个羚羊啊，在那个五千公尺以上跳得跑得很开心、牦牛那个跑啊跳啊很开心。****为什么它们没事、我们常人有事？这个红花嘛。****所以红花呢，在我们使用上，我们治疗脑中风、脑瘀血的话我们都会使用红花。****如果说你没有藏红花、找不到正品藏红花，你用川红花的话剂量重一点就好了，比如三钱。****你用藏红花可能五分、一钱就够了，藏红花的力量是比川红花来得强。**」\n\n**【极重要】藏红花通脑部血（高原/中风用）**\n\n```\n脑中风/脑瘀血 → 红花（藏红花 5 分–1 钱 / 川红花 3 钱）\n川红花：臭袜味；藏红花：淡味（鉴别）\n```\n\n**须「强「标」**：**「①脑卒中须立即120/溶栓（4.5h）；②红花不可替代急救；③抗凝/抗血小板同用须慎；④孕妇禁」** ✓✓\n\n**「这是最精的产地-药力关联（高原→脑）。」** ✓✓","o":"RJ-2660 · 《人纪·神农本草经》第三章增补三，番红花/藏红花条及讲解（PDF 第 588 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"赤小豆行水散血","c":"【增补五】「**赤小豆——本经无记载。****【性味】味辛（或作甘酸）性平，无毒。****【主治】赤小豆为行水散血、消肿解毒要药，主排痈肿脓血，水气肿账，治脚气，利小便，疗一切痈疽恶疮发背，内外可用。****【甄权】治热毒，散恶血，除烦满，通气，健脾胃；捣末同鸡子白涂一切热毒痈肿。****【孟铣】和鲤鱼煮食，甚治脚气。****【容川】赤小豆发芽，则能透达脓血（黏涩又味甘，能填补止泻利）。****【用量】普通钱半至三至四钱。**」讲义：「**赤小豆呢跟红豆长的很像，我们挑越紧小、越小越细小的越好。****赤小豆主要是行水、散淤。****我也使用的很多，赤小豆，甚而至于包括痔疮、外痔我都加赤小豆，很好，赤小豆跟当归能够排血。****凡是身上的湿热都可以使用赤小豆。**」\n\n**【极重要】赤小豆 = 行水散血（痔疮/痈肿/脚气）**\n\n```\n痔疮/痈肿/湿热 → 赤小豆（+ 当归排血）\n脚气 → 赤小豆 + 鲤鱼\n```\n\n**「越小越紧越好」——「这是最精的选材标准。」** ✓✓","o":"RJ-2661 · 《人纪·神农本草经》第三章增补五「赤小豆」，原文及讲解（PDF 第 589–590 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"艾叶暖子宫","c":"【增补六】「**艾叶——本经无记载。****【性味】味苦，性温，无毒。****【主治】艾叶为灸百病要药，并可作煎剂，主暖子宫，调经，止血，安胎。****【甄权】止崩血肠痔，止腹痛安胎；苦酒作煎治癣甚良。****【好古】治带脉为病，腹胀满，腰溶溶如坐水中。****【容川】艾叶味苦而气温，其茸又能发火，是以能温肝补火；禀母木火之气，能入血室，女人经痛乃凝血作痛，艾叶可去血室中之冷气也。****【用量】普通数分至钱半，炙用无定量。****【禁忌】妇女血热而月经超前者宜慎用之。**」讲义：「**这个艾叶呢除了做灸以外可以做汤剂。****张仲景用艾叶的地方用在妇科里面——妇人的子宫太冷，所以子宫太冷的话月经不顺；或者女人要怀孕、子宫里面太冷、脚太冷、月经延后、子宫里面有淤血，统统可以放艾叶下去。****那艾叶晒干过后很轻，所以你用两钱够了，有时候一钱也够了。****像个子比较小的一钱；中等的像我这种两钱；遇到那种像熊一样大的女人你可以三钱。**」讲义讲「组合方」：「**老师我这个痛经痛的很厉害——艾叶两钱、炮附子（炮过的附子去子宫）、细辛去下焦的寒湿两钱，哇，这个很凶啊，还有一点痛你再加点白芍，那你说川红花加一点点、川芎，你看自动开出来的方子，有没有效？一定有效。**」\n\n**【最重要】艾叶 = 暖子宫（痛经/宫寒/不孕）**\n\n```\n宫寒痛经 → 艾叶 + 炮附子 + 细辛（下焦寒湿）+ 白芍 + 红花/川芎\n```\n\n**须「强「标」**：**「①痛经/不孕须妇科查因（子宫内膜异位/腺肌症）；②炮附子/细辛有毒，须专业医师；③孕妇用药须慎」** ✓✓","o":"RJ-2662 · 《人纪·神农本草经》第三章增补六「艾叶」，原文及讲解（PDF 第 590–591 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"艾叶醋煮治癣","c":"【甄权】「**苦酒作煎治癣甚良。**」讲义：「**像那个止血崩啊都可以用。****苦酒作煎治癣——什么叫苦酒作煎治癣？就是用醋和艾叶煮在一起。****那醋跟艾煮在一起的时候、你们记得啊，治癣类很好，不是叫你去喝啊！煮完以后你外涂癣，这一定会有效的。****因为醋是酸收嘛，那艾叶本来就是清热解毒的，一涂上去效果一定很好。****所以长的癣啊、长的那么一块很顽固的癣，诸位用艾叶跟醋煮在一起。****那这个醋你不要跑到美国、美国有很多那果醋在那架子上……米醋啊，米醋来最好。**」\n\n**【极精】艾叶 + 米醋煮 → 外涂顽癣（酸收+解毒）**\n\n```\n艾叶 + 米醋 → 煮 → 外涂（不内服）\n```\n\n**须「强「标」**：**「①顽癣须皮肤科确诊（真菌/银屑）；②醋外用可刺激/灼伤；③不可以外治代替抗真菌」** ✓✓","o":"RJ-2663 · 《人纪·神农本草经》第三章增补六，讲解（PDF 第 591 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"紫苏治喉咙气堵","c":"【增补七】「**紫苏——本经无记载。****【性味】味辛，性温，无毒。****【主治】紫苏为发表散寒解毒要药，功能降气化痰，发汗祛寒，主伤风寒热霍乱，肺气喘急，心腹胀满，安胎，妇人胎前宜之。****【容川】紫苏色红味辛香，能散血分肌肉中之寒；枝叶披离，故主散之性多，而主升之性少。**」讲义：「**紫苏的主要治疗呢是发表、散寒、解毒。****因为它是叶子、它的质非常轻，所以它的行气的力量很强。****所谓行气，诸位呢我一再跟诸位讲过：脖子——整个喉咙呢是气海、气之海，所以喉咙有东西堵到我们会去用紫苏。****有的人呢跑出来说：哎呀我这个喉咙里面老是哽了个东西、咳也咳不出来，好像有痰在里面、实际上又没有痰——这就是气堵到里面，这一定要紫苏才能够把它化掉。**」讲义讲「煮法」：「**因为这个药性很轻，所以不能煮太久。****因为它行气的药，所以大部分煮完药的时候最后在起锅前一分钟、两分钟前把紫苏放下去煮一煮就可以了，煮太久了反而没有力量。**」\n\n**【极重要】紫苏治「喉中哽物但无痰」（气堵）**\n\n```\n喉中异物感（无痰/气堵）→ 紫苏（行气）\n最后下（1–2 分钟）\n```\n\n**「与 n52 半夏厚朴汤（咽中如有炙脔）互证——此处为『气堵』版。」** ✓✓","o":"RJ-2664 · 《人纪·神农本草经》第三章增补七「紫苏」，原文及讲解（PDF 第 591–593 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"紫苏叶梗子分工","c":"【容川】「**苏子——主上气咳逆冷气，及腰脚中湿气、风结气，调中止霍乱，消五膈呕吐反胃，消痰止嗽，利大小便，治肺气喘急。****苏叶——主发散，发散风气宜用叶，清利上下宜用子。****苏梗——主顺气表散。****汪昂曰：叶发汗散寒，梗顺气安胎，子开郁降气，消痰定喘。**」讲义：「**用量呢紫苏那个叶梗啦、什么苏子这都是，真正在使用的候很多都混在一起捡在一起、统统混在一起，不会跟你分开来。****诸位按照这个写倒没有关系，倒没有那么强烈要分苏叶跟苏子苏梗哪、叶梗哪分那么多啊，整个的使用都没有什么关系。**」\n\n**【极精】紫苏三部位：叶发汗、梗顺气安胎、子降气消痰**\n\n```\n叶 → 发汗散寒\n梗 → 顺气安胎\n子 → 开郁降气/消痰定喘（苏子降气汤）\n```","o":"RJ-2665 · 《人纪·神农本草经》第三章增补七，容川注及讲解（PDF 第 592–593 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"饴糖不煮只融化","c":"【增补八】「**饴糖——补中益气。****【性味】味甘，性温，无毒。****【主治】饴糖为滋润肺脾、健胃补中要药，主补虚冷，益气力，治胃气枯燥，脾弱不运。****【思邈】补虚冷，益气力，止肠鸣咽痛，治唾血，消痰，润肺止嗽。****【宗奭】脾弱不思食人多用，能和胃气，亦用和药。****【用量】普通二钱至三钱。****【禁忌】丹溪曰：饴属土，成于火，大发湿中之热，多食助脾风，能生胃火，此损齿之因。**」讲义：「**这个麦芽糖饴糖就是麦芽糖，滋润肺脾的药、健胃补中、补虚冷。****张仲景呢我们常常他在用建中汤里面放些饴糖，讲的就是麦芽糖。****这个麦芽糖不是放进去煮，煮了就没有力量了——它已经熬过十二个小时以上了，有时候一天一夜熬出来。****那你是煮完汤药以后、喝之前呢要加温，要把麦芽糖拿一勺进去融化一下。**」\n\n**【极重要】饴糖（麦芽糖）：不煮、喝前融化（建中汤）**\n\n```\n饴糖（已熬 12h+）→ 不可入煮 → 汤成后融化\n小建中汤 = 桂枝汤 + 饴糖\n```\n\n**「小朋友药里加饴糖就肯喝」——「这是最精的服药依从性技巧。」** ✓✓","o":"RJ-2666 · 《人纪·神农本草经》第三章增补八「饴糖」，原文及讲解（PDF 第 593 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"麦芽糖损齿蔗糖健齿","c":"【禁忌】「**大发湿中之热，多食助脾风，能生胃火，此损齿之因。**」讲义讲「一«条«极«精«的«对«比»」：「**那这个禁忌啊，它说麦芽糖吃多了会损齿、这个要注意一下。****那我们的蔗糖是健齿、保护牙齿；麦芽糖的确会损伤牙齿，因为它太粘了。****损齿的原因因为你这个粘了、平常在吃啊煮汤药吃，一口喝下去融化在汤药里面没有关系；****可是在睡前有没有吃了麦芽糖、嘴巴张开睡、什么虫子都跑进去啊，对啊、那个麦芽糖好甜啊。**」\n\n**【极精】麦芽糖太粘 → 损齿；蔗糖护齿**\n\n```\n麦芽糖（粘）→ 睡前残留 → 蛀牙\n甘蔗糖 → 相对护齿\n```\n\n**须「标」**：**「①糖类皆可致龋（细菌产酸），无『护齿糖』；②须限糖（WHO <10%）；③睡前刷牙」** ✓✓","o":"RJ-2667 · 《人纪·神农本草经》第三章增补八，讲解（PDF 第 593 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"侧柏叶当归生发","c":"【增补九】「**柏叶（侧柏叶）****【性味】味苦涩，性微寒，无毒。****【主治】侧柏叶为滋阴凉血要药，主吐血衄血尿血便血，治冷风湿痹，敷汤火伤，生肌杀虫。****【别录】主吐血，衄血，痢血，崩中赤白，益气，令人耐寒暑，去湿痹生肌。****【大明】灸罯冻疮，烧取汁涂头，黑润鬓发。****【苏颂】敷汤火伤，止痛减瘢；作汤常服杀五脏虫，益人。****【用量】普通一钱至三钱。**」讲义：「**这个柏叶呢一般侧生的柏叶入药，所以都是使用侧柏叶。****侧柏叶呢味是苦涩、一点点寒。****那柏叶呢是滋阴凉血的药，主吐血、鼻血、小便带血都可以使用它。****因为我们这个、柏叶它能够补血，是侧生的，我们取它侧生的：我们把柏叶跟当归混在一起的时候就变成很有名的生发的药。****所以头发要长就当归和侧柏叶两个混在一起。****当归是补血的，侧柏叶呢是侧生嘛，那你原来的发根那个洞掉了，我们让它长出旁边、旁边再长出一根来，要侧柏叶。**」\n\n**【极精】侧柏叶 + 当归 = 生发（取「侧生」之象）**\n\n```\n脱发 → 当归（补血）+ 侧柏叶（侧生→旁生）\n```\n\n**「取象：侧生 → 旁边再生一根」——「这是最精的取象。」** ✓✓\n\n**须「标」**：**「①脱发须查雄激/休止期/营养/甲状腺；②米诺地尔/非那雄胺为一线；③不可只靠中药」** ✓✓","o":"RJ-2668 · 《人纪·神农本草经》第三章增补九「柏叶」，原文及讲解（PDF 第 594 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"侧柏叶治吐血","c":"讲义讲「一«条«极«重«要«的«适«应»」：「**那经方里面吐血不止，这个吐血里面的原因可能是肝癌、肝硬化的病人——肝病很严重、肝会压迫到食道旁边的门静脉破裂以后吐血出来。****我不管里面的原因是什么，病人吐血就可以使用柏叶。**」\n\n**【极重要】侧柏叶治吐血（含门静脉破裂）**\n\n```\n吐血（门静脉高压/肝病）→ 侧柏叶（凉血止血）\n```\n\n**须「绝「对「强「标」**：**「①呕血须立即急诊（失血性休克）；②门脉高压出血须急诊止血（套扎/TIPS）；③绝对不可用中药止血而延误」** ✓✓✓","o":"RJ-2669 · 《人纪·神农本草经》第三章增补九，讲解（PDF 第 594 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"豆豉水火相济","c":"【增补十】「**豆豉——又名香豉。****【性味】色黑味咸，无毒；形如心，色如肾，味咸入肾，故治火中之水，令水火相济。****【主治】主治心中懊憹也，旁治心中结痛及心中满而烦也。****【倪注】经方中之栀子豆豉汤主治心中懊憹，一般多用于病愈后之失眠烦躁。**」【用量】「**一般一钱至三钱。**」讲义：「**诸位看它颜色是黑的所以入肾，味道咸的就入肾，所以它能治火中之水、令水火相济。****中医的观念里面呢这个水，活的水呢只要是任何活的水，水里面都要有阳；那这个如果这个阳不见了、水里面没有阳了以后，人就会重症失眠。****那我们让水里面的火能够归位就是豆豉。****那经方里面的栀子豆豉汤，一般我们是用在大虚之后的失眠。****所以病人在生完一场大病以后、病初愈的时候有失眠的现象产生，我们用栀子豆豉汤，极虚的人我们才会用栀子豆豉汤。**」\n\n**【极重要】豆豉：火中之水（大病初愈失眠）**\n\n```\n大病初愈失眠（虚烦）→ 栀子豉汤\n豆豉（色黑入肾/咸）→ 水火相济\n```\n\n**「这是最精的『火中水』模型。」** ✓✓\n\n**须「标」**：**「①失眠须查焦虑/抑郁/OSA；②CBT-I为一线；③不可只靠中药」** ✓✓","o":"RJ-2670 · 《人纪·神农本草经》第三章增补十「豆豉」，原文及讲解（PDF 第 594–595 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"鸡矢白治鼓胀","c":"【增补十一】「**鸡矢白——（鸡矢白散）****【产地】为鸡食砂岩后排出之大便中，色白者。****【性味】味苦，性微寒，无毒。****【主治】主行水消积，治鼓胀，疗转筋入腹，破石淋，利二便，下气破血；解金银毒；酒服疗乳妒乳痈乳头破裂。****【素问】治臌胀。****【用量】普通一钱至三钱。****【禁忌】酒服最佳。**」讲义：「**这个鸡矢白呢方子在《黄帝内经》里面有介绍——就是我们讲鸡呢山鸡、放山鸡，吃的那个砂岩石灰岩以后排出来的大便、颜色白的我们把它收起来。****这个主行水消积，专门治鼓胀。****这不是说拿起来就给他吃下去啊、不是。****这个鸡矢白拿出来炮炙过、炙过烤过烤过以后味道没有啦，跟酒撒酒上去混在一起吃下去才有效。**」\n\n**【极重要】鸡矢白（鸡屎白）= 治鼓胀（《内经》第一方）**\n\n```\n鼓胀（腹水）→ 鸡矢白（炮炙）+ 酒\n```\n\n**须「绝「对「强「标」**：**「①鸡粪有感染风险（沙门氏/寄生虫）；②绝对不可自制/自服；③腹水须查肝/心/肾/肿瘤；④须规范治疗」** ✓✓","o":"RJ-2671 · 《人纪·神农本草经》第三章增补十一「鸡矢白」，原文及讲解（PDF 第 595 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"硫磺解五金毒","c":"讲义讲「一«条«极«重«要«的«解«毒»」：「**这个呢它鸡矢白能解金银毒。****酒服疗乳房的癌啊、乳房硬块啊、乳房化脓啊、乳头破裂啊，都可以使用这个鸡矢白。****那解金银毒，我们如果说有金中毒或者银中毒——五金的中毒：铜啊、金银铜铁锡，你不要去记鸡矢白解金银毒、那铜毒啊什么东西你不要……****硫磺解五金毒！****所以我们真的五金中毒的时候我们使用硫磺，一律用硫磺，硫磺解毒一下统统清出来。****这个是用硫磺来解金属的毒最好、速度最快。****所以有金属中毒的时候大家记得用石硫磺。**」\n\n**【极重要】硫磺解五金毒（非鸡矢白）**\n\n```\n金属中毒（金/银/铜/铁/锡）→ 石硫磺（非鸡矢白）\n```\n\n**须「绝「对「强「标」**：**「①金属中毒须立即急诊（螯合剂/洗胃）；②硫磺不可作为解毒首选；③须职业病/毒理」** ✓✓","o":"RJ-2672 · 《人纪·神农本草经》第三章增补十一，讲解（PDF 第 595 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"乳香没药活血止痛","c":"【增补十三 没药】「**味苦辛，性平，无毒。****【主治】没药为散血消肿、定痛生肌要药，主破血止痛，治折伤瘀血，消肿毒。**」【增补十四 乳香】「**味苦辛，性微温，无毒。****【主治】乳香为活血伸筋要药，主通行周身经络，去风散瘀，活血定痛［金铃子、延胡索、没药、乳香都有镇痛作用，因为可以活血化瘀，痛是不通则痛］，托疮毒，消痈疽。**」【吴克潜】「**打扑跌损，皆伤筋络，气血不行，瘀痈作痛；乳香没药，皆能止痛消肿生肌，故二药多相兼而用。**」【用量】「**普通五分至二钱。**」讲义：「**会用到这个药一般来说都是伤科：跌打损伤、骨头骨折了、脱臼了、肌肉拉伤了、里面内出血，都会使用没药。****那当然我们身体里面有淤血、长久的淤血，所以我们在活血化瘀、在治疗癌症的时候我们也会用到一些像没药，它有止痛的效果在里面。**」讲义讲「乳香」：「**乳香是活血伸筋的要药，抽筋、脚痉挛绷的很紧，我们会用到乳香。****所以你看诸位现在学到了：金铃子、延胡索、乳香、没药干嘛？止痛。****有的时候癌症的痛的时候没有办法，我们加重入药可以止痛，效果绝对会比使用吗啡来的好。****那它能够止痛的原因呢就是因为它活血，所以痛是不通则痛。**」\n\n**【最重要】乳香 + 没药 = 活血伸筋止痛（不通则痛）**\n\n```\n伤科（骨折/脱臼/拉伤/内出血）→ 乳香 + 没药（各 2 钱，重症 3–4 钱）\n癌痛 → 金铃子 + 延胡索 + 乳香 + 没药\n```\n\n**「痛是不通则痛」——「这是最精的痛机。」** ✓✓\n\n**须「强「标」**：**「①癌痛须规范三阶止痛（吗啡是标准）；②『效果绝对比吗啡好』须否；③乳香没药有抗凝/过敏；④孕妇禁」** ✓✓","o":"RJ-2673 · 《人纪·神农本草经》第三章增补十三/十四「没药/乳香」，原文及讲解（PDF 第 596–598 页）。"},{"t":"增补《神农本草经》：赤小豆、艾叶、紫苏、饴糖、侧柏叶、乳香没药","h":"没药治肝血不足失眠","c":"【好古】「**心胆虚，肝血不足。**」讲义：「**那这个【好古】呢他说这个没药心胆虚——就是心胆虚的人呢就是病人比较胆小、常常有焦虑的现象。****肝血不足的人呢一定会失眠、睡觉睡的不好。****我们人能眠按照内经里面：人能眠因为血能归肝、魂藏在血里面，血能够入肝以后我们才能够睡觉。****你肝血不足的话你的魂呢失守、没有办法留在肝里面，所以人就会失眠。****这个时候肝血不足有失眠的现象，就会产生失眠，这个时候我们是使用没药的时机。**」\n\n**【极重要】肝血不足 → 魂失守 → 失眠（没药）**\n\n```\n心胆虚/焦虑 + 肝血不足 → 失眠\n「血能归肝，魂藏血中」→ 不眠则魂失守\n```\n\n**「这是最精的失眠病机（魂不归肝）。」** ✓✓\n\n**须「强「标」**：**「①失眠须查焦虑/抑郁；②CBT-I/药物为一线；③『魂』为理论模型」** ✓✓","o":"RJ-2674 · 《人纪·神农本草经》第三章增补十三「没药」，好古注及讲解（PDF 第 597 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"白芷治阳明头痛","c":"【增补十五】「**白芷——行手足阳明，入手太阴而为阳明主药，故治头面诸疾。****【性味】味辛（或作甘）性温，无毒；色白入肺。****【主治】白芷为散风发表要药，功能通窍去湿，疗风行血，止头痛，和肠胃，烧之辟邪气。****【甄权】能蚀脓，止心腹血刺痛，女人沥血腰痛血崩。****【大明】治目赤努肉，去面皯疵瘢，补胎瘘滑落，破宿血，补新血，乳痈，发背，一切痈疮疥癣，止痛排脓。****【元素】解利手阳明头痛，中风寒热，及肺经风热，头面皮肤风痹燥痒。****【用量】普通五分至钱半。****【禁忌】恶旋覆花，制雄黄硫黄。**」【吴克潜】「**白芷为肺胃大肠三经气分药，亦入三经血分，擅散风去湿之功；配白芷治偏正头风、齿痛、带下者，成方颇多。**」讲义：「**这个白芷是我们阳明经的药。****比如说我们讲阳明经头痛——一个人头痛有很多种头痛，前额痛就是阳明经的痛。****所以针灸上面我们前额痛的时候我们下中脘，处方的时候我们用白芷。****那这个白芷呢味道是辛辣、性温、颜色色白，颜色色白是入肺。****那这个白芷呢也可以打粉涂在脸上——像涂在脸上的药粉我们有玉肌散，像有绿豆粉、白芷，这种都是很好的外敷的美容的药。**」\n\n**【极重要】白芷：前额痛（阳明）+ 玉肌散美容**\n\n```\n前额痛（阳明经）→ 白芷（配中脘）\n外敷美容 → 玉肌散（绿豆粉 + 白芷）\n```\n\n**「这是最精的经络-药物对应。」** ✓✓","o":"RJ-2675 · 《人纪·神农本草经》第三章增补十五「白芷」，原文及讲解（PDF 第 598–599 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"粳米补脾清肺","c":"【增补十六】「**粳米——粳：硬也，糯：懦也；补脾清肺。****【产地】我国东南诸省；粳乃稻米之总称。****【性味】甘凉，得天地中和之气，色白入肺。****【主治】和胃补中，除烦清热，煮汁止渴。****【仲景】以清热补不足。****【张文潜】粥能畅胃气，生津液，每晨空腹食之，所补不细；与脏腑相宜者唯此最佳。****【用量】可以日常服用。****【禁忌】无禁忌。**」讲义：「**这个粳米这个我们在经方里面白虎汤里面我们会用到粳米。****为什么用到粳米？就是因为它能够补脾清肺、它能够滋润的药。****那越陈越好，用陈米最好。****性味诸位看：甘凉、得天地中和之气，色白入肺，能够和胃补中、清热除烦、能够煮汁止渴。****所以在白虎汤里面我们会用到粳米来清热、来补他的水的不足。**」\n\n**【极重要】粳米 = 白虎汤中的「补不足」（非单纯佐药）**\n\n```\n白虎汤（石膏/知母/甘草/粳米）\n粳米 → 补脾清肺 + 生津（防石膏伤胃）\n```","o":"RJ-2676 · 《人纪·神农本草经》第三章增补十六「粳米」，原文及讲解（PDF 第 599–600 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"红番薯稀饭养胃","c":"讲义讲「一«条«最«重«要«的«养«生»」：「**你如果吃一般的糙米煮成的稀饭，再用红番薯——乡下人很喜欢用这种番薯去煮。****红薯去煮稀饭，那是这个好上加好。****现在非常多的、我问了很多的高龄长寿的，都是早上吃那个稀饭、红番薯煮的稀饭，这个真的是养生健康。****因为红番薯是地下的、红色的，属于火和土中间的东西、带着甜味红色的，红番薯比白番薯来的好。****煮稀饭稀饭又是土啊、土就是甘味的、甘凉的药，甘凉的这个食物，所以说一定可以把脾胃补的好。****因为早上你刚起来的时候，清晨起来的时候是胃，7 点到 9 点是胃气最旺的时候。****这时候你吃下去对胃最好的东西——红番薯的稀饭，那是无孔不入，它能够透发到全身去。****脾主肌肉，脏腑里面都有肌肉，所以能够散发到全身。**」\n\n**【最重要】红番薯稀饭：7–9 点（胃经当令）吃最好**\n\n```\n红番薯（火+土）+ 糙米稀饭（土/甘凉）\n7–9 点胃旺时吃 → 补脾胃 → 透发全身\n```\n\n**「火土相生」——「这是最精的养生方（平实且安全）。」** ✓✓","o":"RJ-2677 · 《人纪·神农本草经》第三章增补十六，讲解（PDF 第 599–600 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"不要体检扫描须否定","c":"讲义讲「一«段«须«强«标«否«定»」：「**那它是潘朵拉的盒子——黑盒子是规定是飞机失事你才去拿的嘛，那你还没有失事去拿什么黑盒子？****不要动它。****那十年才长那么大一点点的话，那十倍好不好、长那么大那是一百年。****也就是你不动它，它长的非常的慢；你一动它，全身都扩散了很快。****所以，不要神经病去体检、做什么 CT scan、X scan、什么核磁共振扫描——你就完蛋了。****这扫描了半天就是把癌症找出来，坏人好人扫描是一样的、看不出来。****扫描还是只能看到形、看不到神。**」\n\n**【须「绝对强标】不要体检扫描」/「动它就扩散」**\n\n**须「逐条否定」**：**「①筛查（乳腺钼靶/结肠镜/低剂量CT/HPV）可降死亡率，有RCT；②早期癌多可治愈（早期乳癌5年生存>90%）；③『动它就扩散』无依据（活检不导致转移）；④此说若被采信可致延误死亡，须最高级否定」** ✓✓✓","o":"RJ-2678 · 《人纪·神农本草经》第三章增补十六，讲解（PDF 第 600 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"李根白皮治奔豚","c":"【增补十七】「**甘李根白皮——本经无记载。****【性味】味咸性大寒。****【主治】为解热药，治消渴，奔豚气逆。****【别录】李根白皮治消渴，止心烦，逆奔豚气。****【孟铣】将之炙黄煎汤，日再饮之，治女人卒赤白带下。****【甄权】治脚下气，主热毒烦躁，煮汁服止消渴。****【用量】一般三钱至五钱。****【禁忌】津液不足者忌。**」讲义：「**这李树的根，过去呢东南角、东南角的李树根，因为它是东南方嘛，那是巽卦属于风位。****味咸性大寒，解热的药，治消渴。****这个李根白皮呢，主治消渴，一般来说你买不到，你要跑到那个种李树的农家去挖几个根出来。****一般来说主治消渴、口渴、渴饮百杯不能止渴、奔豚气逆，都可以使用。****这个奔豚气逆就是觉得身上心跳得很快，好像甚而身上热水在滚着。****还有病人会跟你陈述说：奇怪好像有个人上面有个腾、热的茶壶，然后把水倒着从我头上灌下来，哇那热水一直灌下来，摸摸看又没有啊、冰冰的。****他就是感到很热、还在身上跑来跑去，这都属于奔豚气逆。**」\n\n**【极重要】奔豚气逆 = 「有人拿热茶壶从头上灌下来」（无形热流上下）**\n\n```\n奔豚（气从少腹上冲、无形热流）→ 李根白皮（+ 桂枝加桂汤）\n```\n\n**「这是最精的患者主诉画像。」** ✓✓\n\n**须「强「标」**：**「①此类症状须排心律失常/焦虑/PTSD；②须心电图/甲功；③不可只按奔豚治」** ✓✓","o":"RJ-2679 · 《人纪·神农本草经》第三章增补十七「甘李根白皮」，原文及讲解（PDF 第 600–601 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"三七是云南白药主药","c":"【增补十八】「**三七——本经无记载。****【性味】味甘，微苦，性温，无毒。****【主治】三七为散瘀定痛要药，功能散一切恶血，保一切新血，治血瘀成肿成痛，外敷能消肿止血；为云南白药之主药。****【日华】金鱼将死，入山漆叶（三七叶）汁于鱼口，即活；无名疮疖，捻叶敷之。****【倪注】举凡内外伤，诸烂疮，乳痈等都可以用，镇痛止血。****【用量】普通钱半至三钱，大剂一两左右。****【禁忌】无。**」讲义：「**它是散瘀定痛的要药，所以三七呢活血化瘀、散一切恶血——我们把坏的血清除掉，才会产生新的血，所以也是止痛的药。****三七的止痛，大部分都是伤科的止痛：骨折、筋拉伤、脱臼、刀伤、砍伤、车祸的外伤、甚至枪伤、马脚的踢伤，什么伤都可以用三七。****那我们现在用在所有的伤科痛证，象乳房的痛、臭、化脓都可以使用三七。**」\n\n**【极重要】三七 = 散瘀定痛（云南白药主药，伤科第一）**\n\n```\n一切外伤（骨折/拉伤/脱臼/刀枪伤）→ 三七\n「散恶血、保新血」\n```\n\n**须「强「标」**：**「①严重外伤须急诊（止血/清创/手术）；②三七有抗凝，术前/抗凝同用须停；③孕妇慎」** ✓✓","o":"RJ-2680 · 《人纪·神农本草经》第三章增补十八「三七」，原文及讲解（PDF 第 601 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"鸡子黄是导引药","c":"【增补十九】「**鸡子黄——本经无记载。****【性味】味甘性平。****【主治】镇心安脏，益气补血；清咽开音，散热定惊；止嗽止痢，利产安胎。**」【禁忌】「**多食令人滞闷。**」讲义讲「一«条«最«重«要«的«机«理»」：「**我们的经方里面有、我们的黄连阿胶汤里面就有。****你光黄连阿胶煮完了以后不行、这个药没有效，要用生的鸡蛋黄。****这个阿胶是在还有点滚的时候把阿胶冲下去嘛，等到温的时候再把蛋黄打下去。****你不能在滚的时候就把蛋黄打下去，蛋黄一下去变蛋花汤了。****所以你要在温的时候，蛋黄生用。****那为什么要用这个蛋黄？****鸡蛋黄其实是一个导引的药。****所以我们所谓君臣佐使……你这个补血的药要补到心脏里面去。****那心中有一滴血，心脏的正中心有一滴血，这一滴血是永远是新鲜的。****那有一天呢，突然被惊吓到、或者是一些事情影响到、扰心烦心，这滴血瞬间消失掉了。****那我们都知道阿胶能够补血，那你身上很多地方都补，要补的话你怎么知道光阿胶补下去的话、补到肝脏、补到肺脏、补到血管里面去，那有补到心脏那么凑巧？****所以我们要有一个药、导引阿胶，来告诉阿胶说：你要在心脏中间制造一滴血出来。**」\n\n**【最重要】鸡子黄 = 导引药（引阿胶入心中，生用温冲）**\n\n```\n黄连阿胶汤 = 黄连/黄芩/芍药/阿胶/鸡子黄（生/温冲）\n鸡子黄（悬浮中央）→ 引阿胶补「心中一滴血」\n```\n\n**「蛋黄悬浮在中间」——「这是全书最精的取象。」** ✓✓\n\n**须「强「标」**：**「①生鸡蛋有沙门氏风险；②须巴氏消毒/可生食蛋；③高胆固醇者须遵医嘱」** ✓✓","o":"RJ-2681 · 《人纪·神农本草经》第三章增补十九「鸡子黄」，原文及讲解（PDF 第 601–603 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"猪胆汁灌肠","c":"【增补二十】「**猪胆、猪肤****【性味】猪胆汁味苦性寒，无毒。****【主治】主清心明目，凉肝胆，治目赤目翳，小儿疳瘦；著名方剂有猪胆汁方（用猪胆汁和醋少许，灌入谷道中，少顷大便出宿垢），治阳明热结于下、大便不通者。****【用量】一次一枚。****【禁忌】寒实者禁忌。**」讲义：「**张仲景猪胆汁不是拿起来喝。****你的胆汁已经很苦了，还找猪的胆汁来喝？****那我们那个猪胆汁呢是润肠用的。****有时候病人体很虚、汤剂攻不下去、他不能喝了，这个时候我们把那个胆汁——猪的胆汁，从灌肠从肛门那面灌进去。****灌到大肠里面，大肠有那个胆汁来滋润的话，哇、大下！****中国以前用竹管、竹筒、竹子抽起来打进去，那现在有那个大的针管、你不要拿针头嘛，拿个圆筒嘛。**」\n\n**【极重要】猪胆汁灌肠 = 体虚便秘不能攻下时的外治**\n\n```\n体虚 + 便秘（不可攻下）→ 猪胆汁灌肠（+ 醋）\n```\n\n**须「强「标」**：**「①灌肠须医嘱；②急腹症/肠梗阻禁；③不可自制」** ✓✓","o":"RJ-2682 · 《人纪·神农本草经》第三章增补二十「猪胆」，讲解（PDF 第 603–604 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"蜜煎导法","c":"讲义讲「一«条«极«精«的«外«治»」：「**那你说老师、甘油锭？那当然不要用。****猪胆，外用的、无所谓。****那甘油不要用。****我用蜜蜂——有没有、蜜煎导法，圆锥状塞到肛门里去，都可以，这是我们外用的通大便的。**」【猪肤】「**猪肤煮米粉，治喉咙化脓长疮。**」讲义：「**象猪肤，我们用猪皮，拿来煮米粉，也是张仲景使用到的。****喉咙痛啊、喉咙里头长疮啊、喉咙里头长阴实、化脓，都可以使用。**」\n\n**【极精】蜜煎导法 = 蜂蜜熬成圆锥塞肛（外治便秘）**\n\n```\n便秘（虚不可攻）→ 蜜煎导（蜂蜜圆锥塞肛）\n猪肤汤 → 咽痛/喉疮\n```\n\n**「这是最精的古代外治（无甘油时代的甘油栓）。」** ✓✓","o":"RJ-2683 · 《人纪·神农本草经》第三章增补二十，讲解（PDF 第 604 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"郁金散郁","c":"【增补二十一】「**郁金（玉金）****【性味】味辛苦，性寒，无毒。****【主治】郁金为凉血破瘀要药，功能开血中之郁，泄血中之热，治吐血，溺血，恶血留积，失心癫狂。****【唐本】主血积下气，生肌止血，破恶血，血淋，尿血，金疮。****【甄权】单用治女人宿血气心痛，冷气结聚。****【丹溪】治吐衄，妇人倒经［益母草、郁金配伍治逆经］，痘毒入心。****【元素】凉心。****【用量】普通一钱至三钱。**」讲义：「**我在治肝病的时候，最喜欢使用郁金，因为郁金不单单是活血，最主要它还散郁、散这个郁气。****这个人很恶阻、郁气，得到病哦很恶阻郁气、郁闷、结气可以散掉。****所以郁金吃了人会很开心、心情会比较好一点。****老师那我们前面学过合欢，合欢当然可以啊、合欢很好啊，合欢吃的人很开心嘛；那远志呢，远志也很好啊，远志除了可以强心以外，还可以让一个人镇静不要焦虑、心情能够比较平和。****那剂量呢，严重的肝病的话用五钱，一般的肝炎用三钱，五钱、六钱、七钱都没有关系，因为你知道这个药可以解郁。**」\n\n**【极重要】郁金 = 开血中之郁（「吃了人会很开心」）**\n\n```\n肝病（郁气/闷）→ 郁金（3–7 钱）\n三大「开心」药：郁金（散郁）/ 合欢（安神）/ 远志（镇静强心）\n```\n\n**「这是最精的『情志药』三分工。」** ✓✓","o":"RJ-2684 · 《人纪·神农本草经》第三章增补二十一「郁金」，原文及讲解（PDF 第 604–605 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"木通象车轮通经脉","c":"【增补二十二】「**木通****【性味】味辛苦（或作辛甘）性平，无毒。****【主治】木通为导湿热、利小便要药，主降心火，清肺热，化津液，止大渴，治淋沥，水肿。****【甄权】治五淋，利小便，开关格，治人多唾，主水肿浮大。****【孟铣】利诸经脉寒热不通之气。****【大明】安心除烦，止渴退热，明耳目，治鼻塞；通小肠下水，破积聚血块，排脓；女人血闭，月候不匀；乳结，下乳。****【用量】普通七分至二钱。****【禁忌】凡精滑不梦自遗，及阳虚气弱，内无湿热者忌；孕妇禁用。**」讲义：「**这个木通呢过去我们称为通草。****它的味道是辛苦性平，木通是导湿热、利小便的药。****所以一般来说我们治水肿的时候会使用到木通。****那腹水、肝硬化、积水的时候常常会这个木通也会用到。****张仲景用做通脉当归四逆汤里面——当归四逆汤里面就是手脚冰冷，加木通的意思就是让它气能够通到所有的经脉上去。****木通象车轮一样，所以它能够通关活络，效果非常好。**」\n\n**【极重要】木通（象车轮）→ 通经脉（当归四逆汤治手足冷）**\n\n```\n手足冰冷（血虚寒厥）→ 当归四逆汤（含木通）\n木通「象车轮」→ 通关活络\n```\n\n**须「绝「对「强「标」**：**「①关木通（含马兜铃酸）可致肾衰竭/上尿道癌，已禁用；②须用川木通（无毒）；③孕妇禁」** ✓✓✓\n\n**「这是全册最关键的药材安全鉴别（关木通 vs 川木通）。」** ✓✓","o":"RJ-2685 · 《人纪·神农本草经》第三章增补二十二「木通」，原文及讲解（PDF 第 605–606 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"木通下乳","c":"【大明】「**乳结，下乳。**」讲义：「**乳房呢奶水硬在那边、堵在那边出不来，乳房有硬块哦、出不来，我们可以用木通来清它。****木通也是很好使用的一个药。****那一般来说的话，这个木通质很轻，诸位看它是质很轻的东西，一般开二钱、二钱都很多了，一钱两钱就够了。**」\n\n**【极精】木通下乳（乳房硬块/乳汁不通）**\n\n```\n乳汁不通/乳结 → 木通（1–2 钱）\n```\n\n**须「强「标」**：**「①乳房硬块须超声 + 穿刺（排癌）；②不可只通乳；③关木通禁」** ✓✓","o":"RJ-2686 · 《人纪·神农本草经》第三章增补二十二，讲解（PDF 第 606 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"薤白治胸痹","c":"【增补二十四】「**薤白——调中助阳，散血生肌，泄下焦大肠气滞。****【性味】味辛苦，性温，无毒。****【主治】薤白为滑利散结要药，主胸痹刺痛，泄痢后重，温中助阳，下气散血，除寒热，治带下［治肺、心不可或缺的药］。****【别录】归骨，除寒热，去水气，温中散结气。****【东垣】治泄痢下重，能泄下焦阳明气滞。****【思邈】心病宜食之，利产妇。****【孟铣】治女人带下赤白；骨哽在咽不去者，食之即下。****【药征】主治心胸痛而喘息咳唾也，旁治背痛，心中痞。****【用量】普通一钱至三钱。****【禁忌】发热病不宜多食；不可与牛肉同食，令人作症瘕。**」讲义：「**那这个薤白呢主散结生肌。****那张仲景在用薤白的时候，是在用治疗肺上面的。****你看它是主治滑利散结的要药。****主胸痹刺痛——胸痹刺痛，心脏有问题也是刺痛啊。****中医治疗心脏一定要去治疗肺，就好像我们治疗肝脏一定治疗脾。****我们治疗心脏一定治疗肺，因为火和金嘛。**」\n\n**【最重要】薤白 = 胸痹刺痛（栝蒌薤白白酒汤）**\n\n```\n胸痹（胸痛彻背/喘息咳唾）→ 薤白（+ 栝蒌）\n「治心必治肺」（火克金，金为火之制）\n```\n\n**须「绝「对「强「标」**：**「①胸痛须立即120/心电图/肌钙；②急性心梗须急诊PCI；③薤白不可替代急救」** ✓✓\n\n**「治心必治肺」——「这是最精的五行治则。」** ✓✓","o":"RJ-2687 · 《人纪·神农本草经》第三章增补二十四「薤白」，原文及讲解（PDF 第 606–607 页）。"},{"t":"增补（续）：白芷、粳米、李根白皮、三七、鸡子黄、郁金、木通、薤白","h":"新绛止血行血","c":"【增补二十三】「**新绛——主止血行血。****【产地】即大红帽之纬也。****【性味】烧炙后用，味苦辛。****【主治】主要用于止血行血。****【用量】一般五分至一钱。****【禁忌】忌与活血化血之药同用。**」讲义：「**第 23 我们所谓新绛，新绛这个药呢它是主止血行血。****张仲景也是用在这个地方而已，那主要是止血活血使用的。****那一般来说这个新绛这个药比较单独，它不会跟一般活血化血的药放在一起用的。****那新绛呢一般来说这个用的也不多，五分一钱，要烧炙过以后用。**」\n\n**【极精】新绛（大红帽纬）= 止血行血，单独用**\n\n```\n新绛（烧炙后用，5 分–1 钱）→ 止血行血\n不与活血药同用（唯经方一用）\n```","o":"RJ-2688 · 《人纪·神农本草经》第三章增补二十三「新绛」，原文及讲解（PDF 第 606 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"白前降气","c":"【增补二十五】「**白前——长于降气，下痰止嗽，治肺气壅实，胸膈逆满。****【产地】嘉谟曰：似牛膝短小柔软、能弯者为白薇，长坚易折者为白前。****【性味】辛苦味甘，性微温，无毒。****【主治】白前为下气降痰要药，主治咳逆上气，肺病痰喘。****【别录】主胸胁逆气，咳嗽上气，呼吸欲绝。****【大明】主一切气，肺气烦闷，贲豚肾气。****【用量】普通一钱至三钱。****【禁忌】肺虚哽气者忌。**」【吴克潜】「**白前能祛痰而利肺气……其功能专于降气，气降故痰亦下，故惟肺气壅实、兼有痰凝塞者用之无不奏效；若虚者则不宜。**」讲义：「**白前这个药最重要是：卡痰、肺气下不去。****你不要管寒热，病人只要跟你说呼吸不过来、好像很短气、气都下不去的感觉、肺好像变得很小，都可以使用。****白前是主治下气降痰的主要药、咳气上逆、肺病喘咳。****那里面可能是肺癌、可能是肺气肿，我们不管它。****如果咳气、那个气由下往上逆、上气，结果咳血，用白前。**」【辨】「**白芨**（吐血/咳血）**vs 白前**（降气/痰喘）**——两药不同。**」\n\n**【极重要】白前 = 降气（气下不去/短气）**\n\n```\n肺气壅实（短气/气下不来）→ 白前（不分寒热）\n白芨 → 咳血止血（不同药）\n```\n\n**「这是最精的易混药对（白前 vs 白芨）。」** ✓✓","o":"RJ-2689 · 《人纪·神农本草经》第三章增补二十五「白前」，原文及讲解（PDF 第 607–608 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"神曲助消化","c":"【增补二十六】「**神曲——辛能散气，甘调中，温开胃，化水谷，消积滞。****【产地】乃以青蒿、苍耳、野蓼自然汁、杏仁泥、赤小豆末和白面，如造酱法酿制者。****【性味】味甘，性温，无毒。****【主治】神曲为消食化痰要药，主化水谷宿食，行气调中，健脾开胃，治症结胀满，泄泻痢疾。****【元素】养胃气，治赤白痢。****【用量】普通一钱至三钱。****【禁忌】脾阴虚胃火盛者忌之，虚胀者亦不宜；又能落胎，孕妇宜少食。**」讲义：「**神曲是消化、消食化痰的药，健脾开胃。****一般来说，不管是什么病——一般的病、或者重病、癌症，病人的胃口都不是很好、吃东西都不是很消化，一般我们都会加一点神曲在里面，帮助消化食物。**」\n\n**【极重要】神曲 = 重病/癌症都加（保胃气）**\n\n```\n重病/癌症（食欲差）→ 神曲（1–3 钱）\n「有胃气则生」\n```\n\n**「这是最精的『保胃气』常规加法。」** ✓✓","o":"RJ-2690 · 《人纪·神农本草经》第三章增补二十六「神曲」，原文及讲解（PDF 第 608–609 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"甘麦大枣汤治一边开心一边流泪","c":"【增补二十七】「**小麦——养心除烦，利溲止血。****【性味】味甘，性平，微寒，无毒。****【主治】小麦主除客热，养心气，为服食滋养之品［甘草、小麦、红枣汤治女人阴道干］。****【别录】主除客热，止烦渴咽燥，利小便，养肝气，止漏血唾血，令女子易孕。****【思邈】养心气，心病宜食之。****【素问】麦属火，心之谷也。****【附录】浮小麦——主益气除烦，治盗汗自汗，骨蒸虚热，妇人劳热。****【用量】普通二至三钱。**」讲义：「**张仲景在用小麦的时候，甘麦大枣汤，在用小麦，专门用在女人。****那个『如见神灵』——常常看到妖魔鬼怪、床旁边站个人；晚上深更半夜、床旁边站个人，如见神明状。****还有妇人流泪：那边开 party、生日，大家心情很好、几代同堂、大家都很开心，在那边吃东西聊天，她也很开心，一边开心、一边在流眼泪。****那为什么开心、眼泪还一直不断在流？****这时候要用小麦，因为她子宫、阴道里面整个是干的，津液下不去、从眼睛回逆出来。****所以女人没有事情在那边流眼泪……平常看喜剧也流眼泪，这就要用到甘麦大枣汤。****因为它能养心除烦、能够补足一个人的津液。**」\n\n**【最重要】甘麦大枣汤（甘草+小麦+红枣）= 脏躁**\n\n```\n① 「如见神灵」（幻觉）\n② 「一边开心一边流泪」（情绪矛盾）\n③ 阴道干燥（津液不下、上逆为泪）\n→ 甘麦大枣汤\n```\n\n**「与 n52甘麦大枣汤（数欠喜伸）」互证——此处给出最完整的脏躁四象。** ✓✓\n\n**须「强「标」**：**「①幻觉/情绪剧烈波动须精神科；②甘麦大枣汤对更年期情绪有效（有研究）；③不可以替代抗精神病药；④自杀风险须评估」** ✓✓","o":"RJ-2691 · 《人纪·神农本草经》第三章增补二十七「小麦」，原文及讲解（PDF 第 609–610 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"灶心土修补胃壁","c":"【增补二十八】「**灶心土——治吐血，下血，胃家损伤之重症者；今人称伏龙肝。****【产地】乡下土灶烧之多年者佳，新土无效。****【性味】味甘性温平，功能补土利湿，修补胃壁之损伤。****【主治】胃出血，呕吐血，大便黑等。****【仲景】黄土汤用之，治疗便血吐血等。****【用量】一般三钱至五钱。****【禁忌】无。**」讲义：「**现在能够把破损的胃修补好的，就是一个灶心土。****那这里讲吐血、下血，跟一般的肺有问题导致的吐血、下血又不一样：胃里面吐血出来。****灶心土味甘性平，能补土利湿、修补胃壁的损伤，因为吃土补土嘛。****那个灶心土是因为经过火烧过十几年以后、在那个锅子里面反复炒，这个土烧了越多年效果越强。****那你会用棉布把它包起来，不然一煮的话灰都到处跑。**」\n\n**【极重要】灶心土（伏龙肝）= 胃出血/修补胃壁（黄土汤）**\n\n```\n胃出血（吐血/黑便）→ 灶心土 5 钱起（布包煮）\n「烧越多年效果越强」\n```\n\n**须「绝「对「强「标」**：**「①胃出血须立即急诊（内镜止血/输血）；②黑便须查血常规；③灶心土不可替代急救」** ✓✓","o":"RJ-2692 · 《人纪·神农本草经》第三章增补二十八「灶心土」，原文及讲解（PDF 第 610–611 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"远血与近血","c":"讲义讲「一«条«最«重«要«的«鉴«别»」：「**大便是黑色的代表是胃出血；如果大便是鲜红色的，代表说你是痔疮出的血、近血，靠近直肠里面的血。****黑色的血代表是远血，从胃来的。****一般胃出血的话一定要用到灶心土，这个黄土汤在使用。**」\n\n**【极重要】黑便（远血/胃）vs 鲜血（近血/直肠）**\n\n```\n黑便（柏油样）→ 胃/上消化道（远血）\n鲜血 → 直肠/肛（近血，痔/肛裂）\n```\n\n**须「绝「对「强「标」**：**「①黑便= 上消化道出血，须急诊；②鲜血须排结直肠癌/息肉；③须胃镜/肠镜」** ✓✓✓\n\n**「这条与 n227便血鲜血 vs 黑血」完全一致。** ✓✓","o":"RJ-2693 · 《人纪·神农本草经》第三章增补二十八，讲解（PDF 第 610–611 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"天疱疮埋土须强标","c":"讲义讲「一«段«须«强«标»」：「**有一种病叫天疱疮，就是小朋友全身皮肤溃烂掉。****溃烂到什么程度？如果他的手指头一碰墙壁、碰到一样东西，过 5 分钟之后碰到的东西就会烂掉、化脓；你一抱她，你的手纹的那个地方就会化脓，接触到的地方就糜烂掉。****治疗他的方法，当然我们处方的药很多，但是效果没有一种来的好，就是泥土。****那怎么治？就找个地方土比较干净的……到山里面去找片黄土，土质很好、挖个洞，把小孩子埋在里面、头露在外面。****头露在外面给他呼吸，爸妈在旁边陪他，就用土把他全身盖住。****他就是碰到那个土，土用来生金、用来长皮肤，皮肤会长的非常好。**」\n\n**【极精】天疱疮「埋土」疗法（土生金/长皮肤）**\n\n**须「绝「对「强「标」**：**「①天疱疮（寻常型天疱疮/大疱性皮病）须皮肤科 + 激素/免疫抑制；②埋土可致严重感染（破伤风/败血症），绝对禁用；③须住院治疗；④此法绝对不可尝试」** ✓✓✓","o":"RJ-2694 · 《人纪·神农本草经》第三章增补二十八，讲解（PDF 第 611 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"阴实者死","c":"讲义讲「一«条«极«重«要«的«定«论»」：「**按照中医的理论，阴实都是死的——张仲景认为阴实者死，一个字，都是死症。****那我们用一些极热的药把阴实的门打开来。****就好像如果这个地方树木生的很茂密、太茂密的时候树木会死掉，那上天就制造了台湾的台风、佛州的飓风，他就把很密的树吹开来、把里面的东西清掉、清掉很多杂枝，那个树木、林相就会很好。****所以说台风……同时他又把那多余的树、木要疏嘛，常常去剪枝。****自然界那么多树木怎么剪、谁拿个刀子去剪啊？大自然会自然清除他，一直在循环，那木在疏。****疏这木的时候，除了风来疏以外，火可以烧。****所以那个阿里山的神木雷电打到的时候失火，森林的火灾可以把一些树木去掉，去掉以后经过焚烧的树木长出来的枝芽都是鲜绿的，非常的好。****我们用大热的药就是用火烧的方式。**」\n\n**【极重要】阴实者死（张仲景）→ 大热药「火烧」开门**\n\n```\n阴实（肿瘤/寒实）→ 极热药（生附/硫磺）→ 「如火烧森林」\n火后新芽鲜绿（推陈致新）\n```\n\n**「这是全书最精的自然比喻。」** ✓✓\n\n**须「绝「对「强「标」**：**「①肿瘤须规范治疗（手术/化疗/放疗/靶向）；②极热药（生附/硫磺）有毒，不可自用；③『阴实者死』须否（早期癌多可治愈）」** ✓✓","o":"RJ-2695 · 《人纪·神农本草经》第三章增补二十八，讲解（PDF 第 611–612 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"大热药如火烧森林","c":"讲义讲「一«条«极«精«的«对«比»」：「**我们的烧是很温和的烧，烧一下还可以壮阳啊。****那你西药烧不起来，西药一烧整个烧掉啊、就不会活回来了，这不一样的烧。****你自己看：西药一烧马上倒阳；我们一烧马上壮阳——本来没有阳，马上壮起来。****我们烧的药都是壮阳的药，很好的药，对不对，又没有什么后遗症。****就是有后遗症，皮肤痒痒的，吃吃鸭汤、鸭肉汤就结束了。****怎么样都有解毒的药，绝对会比化疗来的好，剂量的多少而已。**」\n\n**【极精】「温和的烧（壮阳）」vs「西药烧掉（不活）」**\n\n**须「逐条否定」**：**「①『绝对比化疗好』为严重错误：化疗可治愈多种癌（白血病/淋巴瘤/睾丸癌）；②化疗副作用可管理；③须标讲义比喻过度」** ✓✓","o":"RJ-2696 · 《人纪·神农本草经》第三章增补二十八，讲解（PDF 第 612 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"中医认为人能活125岁","c":"讲义讲「一«条«极«精«的«寿«命«观»」：「**现在世界上最长寿的，我们中医的认为从《黄帝内经》、我们去查中医认为人可以活多少岁，按照中医的理论是 125 岁。****但这 125 岁被下了定义：就是以前住在山里面、农村里面、乡下，那空气很好啊，他也没有抽水马桶、也没有电、很开心。****也没有什么空气污染、也没有水污染。****现在你水龙头打开来那水还能喝吗？****诸如此类的，出去下的雨还是酸雨。****空气污染……这些都会减短我们的寿命。****所以环境造成我们人类会短命。**」\n\n**【极精】中医寿命 125 岁（须限定「理想环境」）**\n\n```\n125 岁 = 上古之人（空气好/无污染/与世无争）\n现代污染 → 减寿\n```\n\n**须「标」**：**「①125岁为理论极限，实际人类最高纪录约122岁；②寿命受基因/环境/医疗多因素；③不可作为疗效承诺」** ✓✓","o":"RJ-2697 · 《人纪·神农本草经》第三章增补二十八，讲解（PDF 第 612–613 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"形存神不在","c":"讲义讲「一«条«极«精«的«养«生«观»」：「**所以实际上诸位呢要形存，形在神不在。****当你了解以后，形在这个世界上，神不在；神要到山里面去哦，要清心寡欲、要保持愉快的心情。****驸马爷怎么做，你就心情开朗一点就好了，看什么都好，不要去扯、不要争执什么东西，也不要去示威游行、不需要，让自己活长一点。**」\n\n**【极精】「形存神不在」——身在尘世、神在山林**\n\n```\n形（身在世）｜神（清心寡欲/愉快/不争）\n```\n\n**「这是最精的养生心法（平实）。」** ✓✓","o":"RJ-2698 · 《人纪·神农本草经》第三章增补二十八，讲解（PDF 第 613 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"台湾癌症死亡率上升的说法须修正","c":"讲义讲「一«段«须«修«正«的«数«据«主«张»」：「**卫生署今年又公布了：24 年来全世界的癌症死亡率都下降，台湾呢、癌症死亡率上升，只有台湾上升。****前 5 大癌症：肝癌、胃癌、直肠癌、大肠癌、肺癌什么的一直往上升。****23 年来卫生署发扬的医学是对的，怎么会上升呢？****一定是 something wrong、一定有错误在里面。**」\n\n**【须「修正】世界癌症死亡率下降台湾上升（归因）」**\n\n**须「逐条修正」**：**「①全球癌症新发与死亡总数因人口老龄化而上升；②年龄标化死亡率在多国下降（含台湾部分癌种）；③台湾癌症死亡率近年趋稳/下降，非『一直上升』；④须以卫福部统计为准」** ✓✓","o":"RJ-2699 · 《人纪·神农本草经》第三章增补二十八，讲解（PDF 第 613 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"四气：寒热温凉","c":"【附：中医药基础摘录·第一篇 药性基础】「**一、四气：四气，即指药物具有寒、热、温、凉四种不同的药性。****它是通过调节机体寒热变化来纠正人体阴阳盛衰的。****四气药性也和五味一样，寓有阴阳属性，即寒凉属阴，温热属阳。****寒凉与温热是相对立的两种药性，而寒凉与温热之间则仅是程度上的不同，即『凉次于寒』、『温次于热』。****有些本草文献对药物的四性还用『大热』、『大寒』、『微温』、『微凉』加以描述。****此外，四性以外还有一类平性药，它是指寒热之性不明显、药性平和、作用较缓和的一类药。****药性的寒热温凉是由药物作用于人体所产生的不同反应和所获得的不同疗效而总结出来的。****一般来讲，寒凉药分别具有清热泻火、凉血解毒、滋阴除蒸、泻热通便、清热利水、清化热痰、清心开窍、凉肝息风等作用；而温热药则分别具有温里散寒、暖肝散结、补火助阳、温阳利水、温经通络、引火归源、回阳救逆等作用。****《素问·至真要大论》『寒者热之、热者寒之』、《本经》序例『疗寒以热药、疗热以寒药』指出了如何掌握药物的四气理论以指导临床用药的原则。**」【李中梓】「**寒热温凉，一匕之谬，复水难收。**」\n\n**【极重要】四气：寒凉属阴、温热属阳（平性居中）**\n\n```\n寒凉 → 清热泻火/凉血解毒/滋阴除蒸/通便\n温热 → 温里散寒/补火助阳/温经通络/回阳救逆\n「疗寒以热药，疗热以寒药」\n```\n\n**须「强「标」**：**「『一匕之谬，复水难收』须警惕误用（寒证用寒、热证用热可致死）」** ✓✓","o":"RJ-2700 · 《人纪·神农本草经》附：中医药基础摘录·第一篇「四气」（PDF 第 614–615 页）。"},{"t":"增补（终）：白前、神曲、小麦、灶心土与四气五味","h":"五味与阴阳五行","c":"【附·五味】「**药性的五味，是指药物有酸、苦、甘、辛、咸五种不同的味道。****有些药物还具有淡味或涩味，因而实际上不止五种。****但是五味是最基本的五种滋味，所以仍然称为五味。****《内经》云：『辛甘淡属阳，酸苦咸属阴。』****《洪范》谓：『酸味属木、苦味属火、甘味属土、辛味属金、咸味属水。』****《素问·藏气法时论》指出：『辛散、酸收、甘缓、苦坚、咸软。』**\n\n**辛，『能散能行』**——发散、行气、行血（解表/行气/活血药多辛）\n\n**甘，『能补能和能缓』**——补益、和中、调和药性、缓急止痛\n\n**酸，『能收能涩』**——收敛、固涩（固表止汗/敛肺止咳/涩肠止泻/固精缩尿）\n\n**苦，『能泄、能燥、能坚』**——清泄火热、泄降气逆、通泄大便、燥湿、坚阴\n\n**咸，『能下、能软』**——泻下通便、软坚散结（瘰疬/痰核/瘿瘤/癥瘕）【缪希雍】「**物有味必有气，有气斯有性。**」\n\n**【极重要】五味总纲**\n\n| 味 | 功用 | 阴阳 |\n|---|---|---|\n| **辛** | 散/行 | 阳 |\n| **甘** | 补/和/缓 | 阳 |\n| **淡** | 渗利 | 阳 |\n| **酸** | 收/涩 | 阴 |\n| **苦** | 泄/燥/坚 | 阴 |\n| **咸** | 下/软 | 阴 |\n\n**「气味合参」：气味相同作用近，气味不同作用别（如黄芪甘温补气、锁阳甘温助阳）** ✓✓\n\n**须「标」**：**「①五味与五行配属为传统理论模型；②须与实证药理结合；③不可仅凭味断效」** ✓✓","o":"RJ-2701 · 《人纪·神农本草经》附：中医药基础摘录·第一篇「五味」（PDF 第 615–616 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"淡味能渗能利","c":"【附·五味续】「**淡，『能渗、能利』，即具有渗湿利水的作用，故不少利水渗湿的药物都具有淡味。****淡味药多用治水肿、脚气、小便不利之证。****如薏苡仁、通草、灯心草、茯苓、猪苓、泽泻等。****由于《本经》未提淡味，后世有些医家主张『淡附于甘』，然淡味与甘味的作用各具自己的特点，应该分别论述为是。**」【涩】「**涩，与酸味药的作用相似，多用治虚汗、泄泻、尿频、遗精、滑精、出血等证（症）。****如莲子固精止带，禹余粮涩肠止泻，乌贼骨收涩止血等。****故本草文献常以酸味代表涩味功效，或与酸味并列，标明药性。****多数药物具有几种味，对这些药物功效的认定，必须全面综合并结合临床疗效来认识概括。**」\n\n**【极重要】淡味（能渗能利）与涩味（能收能涩）**\n\n| 味 | 功用 | 代表药 |\n|---|---|---|\n| **淡** | 渗湿利水 | 薏苡仁/通草/灯芯草/茯苓/猪苓/泽泻 |\n| **涩** | 收涩（止汗/止泻/固精/止血） | 莲子/禹余粮/乌贼骨 |\n\n**「淡≠甘」——「这是最精的辨味（淡附于甘仅为旧说）。」** ✓✓","o":"RJ-2702 · 《人纪·神农本草经》附：中医药基础摘录·第一篇「五味」（PDF 第 616–617 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"诸花皆升旋覆独降","c":"【升降浮沉】「**从药物的质地、部位与升降浮沉的关系来看，一般花、叶、皮、枝等质轻的药物大多为升浮药，如苏叶、菊花、蝉衣等；而种子、果实、矿物、贝壳及质重者大多属沉降药，如苏子、枳实、牡蛎、代赭石等。****除上述一般规律外，某些药物也有特殊性——旋覆花虽然是花，但能降气消痰、止呕止噫，药性沉降而不升浮；苍耳子虽然是果实，但功能通窍发汗、散风除湿、药性升浮而不沉降。****故有『诸花皆升，旋覆独降；诸子皆降，苍耳独升』之说。**」\n\n**【最重要】诸花皆升，旋覆独降；诸子皆降，苍耳独升**\n\n```\n花/叶/皮/枝（质轻）→ 升浮（苏叶/菊花/蝉衣）\n子/实/矿/贝（质重）→ 沉降（苏子/枳实/牡蛎/代赭石）\n例外：旋覆花（降）、苍耳子（升）\n```\n\n**「例外由气味决定」——「这是最精的升降判别。」** ✓✓","o":"RJ-2703 · 《人纪·神农本草经》附·第一篇「升降浮沉」（PDF 第 617–618 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"炮制配伍改变升降","c":"「**药物的升降浮沉并不是一成不变的，临床上往往受到炮制与配伍的影响而发生变化。****如有些药物酒制则升，姜炒则散，醋炒收敛，盐炒下行。****如大黄，属于沉降药、峻下热结、泻热通便，经酒炒后，大黄则可清上焦火热，以治目赤头痛。****故李时珍说『升者引之以咸寒，则沉而直达下焦；沉者引之以酒，则浮而上至巅顶』。****又药物的升降浮沉通过配伍也可发生转化——如升浮药升麻配当归、肉苁蓉等咸温润下药同用，虽有升降合用之意，实成润下之剂。****即少量升浮药配大量沉降药，也就随之下降。****又牛膝引血下行为沉降药，与桃仁、红花及桔梗、柴胡、枳壳等升达清阳、开胸行气药同用，也就随之上升，主治胸中瘀血证。**」【王好古】「**升而使之降，须知抑也；沉而使之浮，须知载也。**」\n\n**【极重要】炮制（酒升/姜散/醋收/盐下）与配伍改变升降**\n\n```\n酒炒 → 升（大黄酒炒清上焦）\n姜炒 → 散\n醋炒 → 收\n盐炒 → 下\n少量药物被大队反向药「带着走」\n```\n\n**「这是最精的药性可变性。」** ✓✓","o":"RJ-2704 · 《人纪·神农本草经》附·第一篇「升降浮沉」（PDF 第 618–619 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"五脏苦欲补泻","c":"【补泻】「**早在《内经》已有许多论述。****在『脏气法时论』中，更对五脏之苦欲，提出了用五味补泻的治疗法则。****如谓：『肝欲散，急食辛以散之，用辛补之，酸泻之。……心欲软，急食咸以软之，用咸补之，甘泻之。……脾欲缓，急食甘以缓之，用苦泻之，甘补之。……肺欲收，急食酸以收之，用酸补之，辛泻之。……肾欲坚，急食苦以坚之，以苦补之，咸泻之。』****后世医家对于药物的补泻性能论述更多。****如张子和谓：『五脏各有补泻，五味各补其脏……实则泻之，诸痛为实，痛随利减，芒硝、大黄、牵牛、甘遂、巴豆之属，皆泻剂也。』****由上可见，《内经》言补泻，是以脏腑苦欲论补泻；而后世言补泻，则是以扶正祛邪论补泻。**」\n\n**【极重要】五脏苦欲补泻（《素问·脏气法时论》）**\n\n| 脏 | 欲 | 补 | 泻 |\n|---|---|---|---|\n| **肝** | 散 | 辛 | 酸 |\n| **心** | 软 | 咸 | 甘 |\n| **脾** | 缓 | 甘 | 苦 |\n| **肺** | 收 | 酸 | 辛 |\n| **肾** | 坚 | 苦 | 咸 |\n\n**「这是与 n78藏气法时」完全一致的总表（可交叉印证）。** ✓✓","o":"RJ-2705 · 《人纪·神农本草经》附·第一篇「补泻」（PDF 第 619–620 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"同一药物兼具补泻","c":"「**然而，药物的补泻作用，并非单补单泻，往往是错综复杂的。****一种药物往往有多种作用，其中有些作用属补性作用、有些作用属泻性作用；随着不同的配伍应用，而显现不同的补泻作用。****如桂枝，发汗解肌属于泻性作用，而温阳、通阳则属于补性作用。****又如茯苓，利水渗湿属于泻性作用，而健脾安神则属于补性作用。**」【补泻定义】「**补性药物的作用：主要是补益人体的亏损，增强机体的功能，提高机体的抗病机能。****泻性药物的作用：主要是祛除外邪与致病因子，调整机体和脏腑功能。**」【虚实并见】「**但是疾病的虚实并非单一的，往往虚中挟实，或实证兼虚，临床治疗又当虚实兼顾，补泻并用。**」【灵活用法】「**此外，临床上又有『虚则补其母，实则泻其子』，以及『以泻为补』、或『以补为泻』的用法。**」\n\n**【极精】同一药物兼具补泻（桂枝/茯苓）**\n\n```\n桂枝：解肌（泻）+ 温阳通阳（补）\n茯苓：利水（泻）+ 健脾安神（补）\n「补泻随配伍而变」\n```\n\n**「这是最精的『一药两面』。」** ✓✓","o":"RJ-2706 · 《人纪·神农本草经》附·第一篇「补泻」（PDF 第 619–620 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"归经理论的形成","c":"【归经】「**归经是药物作用的定位概念，即表示药物在机体作用的部位。****归是作用的归属，经是脏腑经络的概称。****所谓归经，就是指药物对于机体某部分的选择性作用。****《伤寒论》六经分经用药为归经理论的形成奠定了基础。****金元时代，易水学派代表人物张洁古在其所著《珍珠囊》中，正式把归经作为药性主要内容加以论述；王好古《汤液本草》、徐彦纯的《本草发挥》又全面汇集了金元时期医家对归经学说的见解，标志着系统的归经理论已确立。****清代沈金鳌的《要药分剂》正式把『归经』作为专项列于『主治』项后说明药性。**」【徐灵胎】「**不知经络而用药，其失也泛，必无捷效；执经络而用药，其失也泥，反能致害。**」\n\n**【极重要】归经=药物作用的「定位」概念**\n\n```\n归经（选择性作用）→ 张洁古《珍珠囊》（正式）\n→ 沈金鳌《要药分剂》（专项）\n徐灵胎：不执经络则泛，执经络则泥\n```\n\n**「这是最精的归经史与辩证态度。」** ✓✓","o":"RJ-2707 · 《人纪·神农本草经》附·第一篇「归经」（PDF 第 620–623 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"引经药与分经头痛","c":"【归经应用】「**又羌活、葛根、柴胡、吴茱萸、细辛同为治头痛之药，但羌活善治太阳经头痛、葛根善治阳明经头痛、柴胡善治少阳经头痛、吴茱萸善治厥阴经头痛、细辛善治少阴经头痛。****因此，在熟悉药物功效的同时，掌握药物的归经对相似药物的鉴别应用有十分重要的意义。**」【引经报使】「**如羌活为太阳经引经药，柴胡为少阳经引经药，升麻、白芷、石膏等为阳明经引经药。****引经药可将整个方药的作用带入某经。**」【吴茱萸汤】「**临床常用吴茱萸汤治疗厥阴头痛、干呕吐涎沫，该病因胃中虚寒、浊阴上逆所致，而十二正经中，只有足厥阴肝经循行时『上出额，与督脉会于巅』。**」\n\n**【最重要】分经头痛与引经药（五分经）**\n\n| 经 | 头痛部位 | 引经药 |\n|---|---|---|\n| **太阳** | 后头/项 | 羌活 |\n| **阳明** | 前额 | 葛根/白芷/石膏 |\n| **少阳** | 两侧 | 柴胡 |\n| **厥阴** | 巅顶 | 吴茱萸 |\n| **少阴** | 全头/脑 | 细辛 |\n\n**「这是最精的『头痛分经』实战表。」** ✓✓","o":"RJ-2708 · 《人纪·神农本草经》附·第一篇「归经」及第二篇「性味归经」（PDF 第 621–622、623 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"归经须与气味升降合参","c":"「**如同归肺经的药物，由于有四气的不同，其治疗作用也异：紫苏温散肺经风寒、薄荷凉散肺经风热、干姜性热温肺化饮、黄芩性寒清肺泻火。****同归肺经的药物，由于五味的不同，作用亦殊：乌梅酸收，敛肺止咳；麻黄辛散，宣肺平喘；党参味甘，补肺益气；陈皮苦燥，化燥湿痰；蛤蚧咸兼补肾，纳气定喘。****同归肺经的药物，因其升降浮沉之性不同，作用迥异：桔梗、麻黄药性升浮，故能开宣肺气、止咳平喘；杏仁、苏子药性降沉，故能泻肺止咳平喘。****四气五味、升降浮沉、归经同是药性理论的重要组成部分，在应用时必须结合起来，全面分析。**」【脏腑相关】「**如肾阴不足，水不涵木、肝火上炎，目赤头晕，治疗时当选用黄柏、知母、枸杞、菊花、地黄等肝、肾两经的药物来治疗，以益阴降火、滋水涵木；而肺病久咳，痰湿稽留，损伤脾气，肺病及脾、脾肺两虚，治疗时则要肺脾兼顾。**」\n\n**【极重要】同归肺经而作用迥异（气/味/升降三维）**\n\n```\n四气不同：紫苏温、薄荷凉、干姜热、黄芩寒\n五味不同：乌梅酸收、麻黄辛散、党参甘补、陈皮苦燥、蛤蚧咸补\n升降不同：桔梗/麻黄升；杏仁/苏子降\n```\n\n**「这是最精的『同经不同效』三维分析。」** ✓✓","o":"RJ-2709 · 《人纪·神农本草经》附·第一篇「归经」（PDF 第 622 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"毒性古今含义不同","c":"【毒性】「**对于毒性的概念，古今含义不同。****西汉以前是以『毒药』作为一切药物的总称。****故《周礼·天官冢宰》有『医师掌医之政令，聚毒药以供医事』的说法；《尚书·说命篇》则谓『药弗瞑眩，厥疾弗瘳』。****明代张景岳《类经》云『药以治病，因毒为能，所谓毒者，因气味之偏也。****盖气味之正者，谷食之属是也，所以养人之正气；气味之偏者，药饵之属是也，所以去人之邪气。』****论述了毒药的广义含义，阐明了毒性就是药物的偏性。****后世本草书籍在其药物性味下标明『有毒』、『大毒』、『小毒』等记载，则大都指药性的毒副作用的大小。**」\n\n**【最重要】毒性有广义（=药物偏性）与狭义（=毒副作用）两层**\n\n```\n广义（西汉前）：「毒药」= 一切药物（气味之偏）\n狭义（后世）：毒副作用大小（大毒/常毒/小毒/无毒）\n```\n\n**「这是最精的毒性概念史（理解中药『毒』的关键）。」** ✓✓","o":"RJ-2710 · 《人纪·神农本草经》附·第一篇「毒性」（PDF 第 622–623 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"本经三品以毒性为据","c":"「**东汉时代，《本经》、《内经》已把毒性看做是药物毒副作用大小的标志。****如《本经》三品分类法即是以药物毒性的大小、有毒无毒做为分类依据之一。****并提出了使用毒药治病的方法：『若有毒药以疗病，先起如黍粟，病去即止；不去倍之，不去十之，取去为度。』****在《内经》的七编大论中，亦有『大毒、常毒、小毒』等论述。****如《五常政大论》云：『大毒治病，十去其六；常毒治病，十去其七；小毒治病，十去其八；无毒治病，十去其九；谷肉果菜食养尽之，无使过之、伤其正也。』**」\n\n**【极重要】《本经》三品分类以毒性为据（上/中/下三品）**\n\n```\n上品（无毒/久服不伤人）→ 应天\n中品（有毒无毒斟酌）→ 应人\n下品（多毒/不可久服）→ 应地\n《内经》用量梯度：大毒十去六 → 无毒十去九\n```\n\n**「这与 n234下经三特征」完全一致。** ✓✓\n\n**「『中病即止』的经典依据。」** ✓✓","o":"RJ-2711 · 《人纪·神农本草经》附·第一篇「毒性」（PDF 第 623 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"中药中毒五大原因","c":"「**产生中药中毒的主要原因有以下几方面：****一是剂量过大**，如砒霜、胆矾、斑蝥、蟾酥、马钱子、附子、乌头等毒性较大的药物，用量过大或时间过长可导致中毒；**二是误服伪品**，如误以华山参、商陆代人参，独角莲代天麻使用；**三是炮制不当**，如使用未经炮制的生附子、生乌头；**四是制剂服法不当**，如乌头、附子中毒，多因煎煮时间太短，或服后受寒、进食生冷；**五是配伍不当**，如甘遂与甘草同用，乌头与瓜蒌同用而致中毒。****此外，个体差异与自行服药也是引起中毒的原因。**」\n\n**【最重要】中药中毒五大原因**\n\n```\n① 剂量过大（砒霜/斑蝥/附子/乌头/马钱子）\n② 误服伪品（华山参代人参/商陆代人参/独角莲代天麻）\n③ 炮制不当（生附子/生乌头未制）\n④ 服法不当（煎煮时间太短/服后受寒/生冷）\n⑤ 配伍不当（甘遂+甘草；乌头+瓜蒌）\n+ 个体差异 / 自行服药\n```\n\n**须「绝「对「强「标」**：**「①任何中药不可自行抓药/自制；②乌头类须专业炮制/久煎；③十八反十九畏须严守；④中毒须立即急诊」** ✓✓✓","o":"RJ-2712 · 《人纪·神农本草经》附·第一篇「毒性」（PDF 第 623–624 页）。"},{"t":"药性理论补遗：淡涩味、升降浮沉、补泻、归经、毒性","h":"中药无毒是误解","c":"「**对于中药的毒性必须正确对待，一般人们错误地认为中药大都直接来源于生药材，因而其毒性小、安全系数大，对中药毒性缺乏正确的认识。****正确对待中药毒性，首先要正确地对待本草文献的记载。****历代本草对药物毒性多有记载，值得借鉴。****但由于受历史条件的限制，也出现了不少缺漏和错误的地方——如《本经》中把丹砂（朱砂）列为首药、视为上品无毒；《本草纲目》认为马钱子无毒；《中国药学大辞典》认为黄丹、桃仁无毒等等。****说明对待药物毒性的认识，随着临床经验的积累、社会的发展，有一个不断修正、逐步加深认识的过程。****正确对待中药毒性，还要重视中药中毒的临床报道。****建国以来，出现了大量中药中毒报告，仅单味药引起中毒就达上百种之多——其中植物药九十多种，如苍耳子、苦楝根皮、昆明山海棠、狼毒、萱草、附子、乌头、夹竹桃、雪上一枝蒿、福寿草、槟榔、乌桕、巴豆、半夏、牵牛子、山豆根、艾叶、白附子、瓜蒂、马钱子、黄药子、杏仁、桃仁、曼陀罗、莨菪等；动物药及矿物药各十多种，如斑蝥、蟾蜍、鱼胆、芫青、蜂蛹及砒霜、升药、胆矾、铅、密陀僧、皂矾、雄黄、降药等。****由此可见，文献中认为大毒、剧毒的固然有中毒致死的；小毒、微毒，甚至无毒的同样也有中毒病例发生。****故临床应用有毒中草药固然要慎重，就是『无毒』的，也不可掉以轻心。**」\n\n**【非常重要】「中药无毒」是误解（单味药中毒上百种）**\n\n```\n文献误记：朱砂（上品无毒）→ 实含汞\n马钱子（本草纲目无毒）→ 实含士的宁（剧毒）\n黄丹/桃仁（旧典无毒）→ 实有毒\n认知须随证据修正\n```\n\n**须「绝「对「强「标」**：**「①朱砂含汞，不可久服；②马钱子含士的宁（剧毒）；③『无毒』中药亦可中毒（如杏仁/桃仁/艾叶）；④剂量/炮制/配伍须严守」** ✓✓✓\n\n**「丹砂（朱砂）列为上品无毒」——「这是全册最诚实的自我纠错。」** ✓✓","o":"RJ-2713 · 《人纪·神农本草经》附·第一篇「毒性」（PDF 第 623–624 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"气味厚薄决定煎煮","c":"【气味厚薄】「**《素问·阴阳应象大论》云：『阳为气，阴为味。味厚者为阴，薄为阴之阳；气厚者为阳，薄为阳之阴。』****明确药物四气五味的阴阳属性。****分中药气味阴阳厚薄属性，是为制方时以明其用。****《素问·阴阳应象大论》云：『味厚则泄，薄则通；气薄则发泄，厚则发热。』****如大黄味厚纯阴，故能泻下；泽泻、通草味薄能通利。****附子、干姜气厚纯阳，故能生热；羌活、桂枝气薄，具有发泄、发散之功。**」【煎煮】「**药物气味的厚薄不同，煎煮时间也有所区别。****如气味薄的药煎煮的时间要短，有的需要后下，如薄荷、砂仁。****气味厚的药煎煮的时间要长，有的需要先煎，如龙骨、代赭石。****服药时气味薄者可少服而频服，厚者则多服而顿服。**」\n\n**【极重要】气味厚薄 → 煎煮法/服法**\n\n```\n气味薄（薄荷/砂仁）→ 后下、短煎、少服频服\n气味厚（龙骨/代赭石）→ 先煎、久煎、多服顿服\n味厚则泄（大黄）；味薄则通（泽泻/通草）\n气厚则发热（附子/干姜）；气薄则发泄（羌活/桂枝）\n```\n\n**「这是最精的煎煮法依据。」** ✓✓","o":"RJ-2714 · 《人纪·神农本草经》附·第二篇「性味阴阳厚薄」（PDF 第 625 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"虚人用薄药","c":"「**药物气味的厚薄与药性的强弱、大小、缓急是相关的。****因此体质偏弱的虚人、老人、儿童，如有表证，除了针对寒证、热证、虚证、实证选药外，宜选用桑叶、菊花等气味偏薄药即可解表；而体质壮实的青壮年人，可能需选用麻黄桂枝等气味偏厚药才会汗出表解。****气味厚薄，一匕之谬，覆水难收。**」\n\n**【极精】体质决定用厚药还是薄药**\n\n```\n虚人/老人/儿童表证 → 桑叶/菊花（薄）\n壮实青壮年表证 → 麻黄/桂枝（厚）\n用错「一匕之谬，覆水难收」\n```\n\n**「这是最精的剂量-体质匹配。」** ✓✓","o":"RJ-2715 · 《人纪·神农本草经》附·第二篇「性味阴阳厚薄」（PDF 第 626 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"张元素五类升降","c":"【升降浮沉】「**张元素在《医学启源》中将药物按照『风生升、热浮长、湿化成中央燥降收、寒沉藏』五类，进行分类研究。****该分类法既包含了四气五味的阴阳属性，又蕴含着药类法象的升降浮沉理论。****也就是说：****春象万物之发生，其气升，酸苦咸平是也——这是风生升类药的共性，如柴胡、葛根、防风、川芎、秦艽等。****夏象万物之浮而有余，升极而浮，辛甘温热是也——这是热浮长类药的共性，如附子、干姜、肉桂、木香等。****长夏兼气寒热温凉，兼味辛甘咸苦——药如黄芪、熟地黄、人参、甘草、半夏等。****秋象万物之收成，使阳气收降；辛甘淡平寒凉是也——这是燥降收类药的共性，如茯苓、泽泻、车前子、乌梅、五味子等。****冬周密，万物之闭藏，降极而沉，使阳气不动；酸苦咸寒是也——这是寒沉藏类药的共性，如大黄、石膏、黄芩、知母、苦参等。**」\n\n**【最重要】张元素五类升降（药类法象）**\n\n| 类 | 象 | 性味 | 代表药 |\n|---|---|---|---|\n| **风生升** | 春 | 酸苦咸平 | 柴胡/葛根/防风/川芎/秦艽 |\n| **热浮长** | 夏 | 辛甘温热 | 附子/干姜/肉桂/木香 |\n| **湿化成** | 长夏 | 辛甘咸苦兼寒热温凉 | 黄芪/熟地/人参/甘草/半夏 |\n| **燥降收** | 秋 | 辛甘淡平寒凉 | 茯苓/泽泻/车前子/乌梅/五味子 |\n| **寒沉藏** | 冬 | 酸苦咸寒 | 大黄/石膏/黄芩/知母/苦参 |\n\n**「这是全册最完整的『五味-五行-四季-升降』统一表。」** ✓✓✓","o":"RJ-2716 · 《人纪·神农本草经》附·第二篇「性味升降浮沉」（PDF 第 626 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"酸咸无升辛甘无降","c":"「**因此一般来说，药性升浮的，大多具有辛甘之味和温热之性；药性沉降的，大多具有酸苦咸味和寒凉之性。****故李时珍说：『酸咸无升，辛甘无降，寒无浮，热无沉。』**」【补中益气汤】「**临床中治疗气虚发热的补中益气汤，升麻、柴胡引足阳明胃经及足少阳胆经之气上行阳道，行春夏之令，使下陷之阳气升浮于上，则阴火自降，正是应用了药物性味升降浮沉的特点来组方辨证治疗。****正如柯琴：『选用甘温之品，升其阳以行春生之令。胃中清气下沉，用升麻、柴胡气之轻而味之薄者，引胃气以上腾复其本位，便能升浮以行生长之令矣。』**」\n\n**【最重要】李时珍十六字诀：酸咸无升、辛甘无降、寒无浮、热无沉**\n\n```\n辛甘 + 温热 → 升浮\n酸苦咸 + 寒凉 → 沉降\n补中益气汤：升麻/柴胡（气轻味薄）→ 升阳举陷\n```\n\n**「这是最精的升降口诀。」** ✓✓","o":"RJ-2717 · 《人纪·神农本草经》附·第二篇「性味升降浮沉」（PDF 第 626 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"四时用药法","c":"【法时用药】「**《素问·四气调神大论》提出『四时阴阳者，万物之根本也』的养生大法。****李东垣深谙四时阴阳变化之道，提出『补泻在味、随时换气』的四时用药法。****春季用药酸泻辛补，温补凉泻；****夏季用药咸补甘泻，热补寒泻；****长夏用药甘补苦泻，温凉寒热补泻各从其宜；****秋季用药酸补辛泻，凉补温泻；****冬季用药咸泻苦补，寒补热泻。****药性与四时之气相顺应为补，与四时之气相反为泻，是遂其生长收藏之性，为四时之宜也。**」【李中梓】「**药性之温者，于时为春，所以生万物者也；药性之热者，于时为夏，所以长万物者也；药性之凉者，于时为秋，所以肃万物者也；药性之寒者，于时为冬，所以杀万物者也。**」\n\n**【极重要】四时用药补泻（李东垣）**\n\n| 季 | 补（顺时） | 泻（逆时） |\n|---|---|---|\n| **春** | 辛/温 | 酸/凉 |\n| **夏** | 咸/热 | 甘/寒 |\n| **长夏** | 甘 | 苦 |\n| **秋** | 酸/凉 | 辛/温 |\n| **冬** | 苦/寒 | 咸/热 |\n\n**「顺其性为补，逆其性为泻」——「这是最精的法时原则。」** ✓✓","o":"RJ-2718 · 《人纪·神农本草经》附·第二篇「性味法时用药」（PDF 第 626–627 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"冬不用白虎夏不用青龙","c":"「**《内经》提出『必先岁气，无伐天和』的法时用药法。****东垣在《脾胃论·用药宜禁论》中进一步发挥：『夫四时阴阳者……与万物浮沉于生长之门，逆其根、伐其本，坏其真矣。****故冬不用白虎，夏不用青龙，春夏不服桂枝，秋冬不服麻黄，不失气宜。****如春夏而下、秋冬而汗，是失天信、伐天和也。』****这即是『阴根于阳，阳根于阴；用热远热，用寒远寒』的具体体现。**」【随时加减】「**如东垣清暑益气汤针对食不下，以青皮、木香、陈皮为定法。****因时加减：春月青皮少、陈皮多，更加风药以退其寒覆其上；夏月加黄连；秋月加槟榔、草豆蔻、砂仁，或少用白豆蔻；冬月加益智仁、草豆蔻仁。****如调中益气汤治疗腹痛，夏月须加白芍，冬月不可加白芍，须加干姜或半夏。**」\n\n**【极重要】「冬不用白虎，夏不用青龙」；「春夏不服桂枝，秋冬不服麻黄」**\n\n```\n白虎（石膏/大寒）→ 冬禁（恐伤阳）\n青龙（麻黄/发散）→ 夏禁（恐耗津）\n春夏（升发）不服桂枝（？）；秋冬（收藏）不服麻黄\n「用热远热，用寒远寒」\n```\n\n**须「标」**：**「①此为传统法时原则，现代须按病情而定；②麻黄用于夏季感冒/胸闷亦可（须辨证）；③不可机械禁用」** ✓✓","o":"RJ-2719 · 《人纪·神农本草经》附·第二篇「性味法时用药」（PDF 第 627 页）。"},{"t":"药性理论进阶：气味厚薄、五类升降、四时用药、五行生克","h":"五脏苦欲补泻","c":"【五脏苦欲】「**《素问·脏气法时论》中说：『肝苦急，急食甘以缓之；肝欲散，急食辛以散之；以辛补之，酸泻之。****心苦缓，急食酸以收之；心欲软，急食咸以软之；用咸补之，甘泻之。****脾苦湿，急食苦以燥之；脾欲缓，急食甘以缓之；用苦泻之，甘补之。****肺苦气上逆，急食苦以泄之；肺欲收，急食酸以收之；用酸补之，辛泻之。****肾苦燥，急食辛以润之；肾欲坚，急食苦以坚之；用苦补之，咸泻之。』**」【总纲】「**五脏者，违其性则苦，遂其性则欲。****本脏所恶，即名为泻；本脏所喜，即名为补。**」【举例】「**举例说明：肝
