\n\n**「下唇拉开一串白点，就是虫」——「须标：须规范查虫。」**要点：**须「标」**：**「①须规范查虫（粪便虫卵镜检，连查 3 次）；②蛲虫可用透明胶带法（晨起肛周）；③驱虫须按药典；④眼白斑/下唇白点非特异」** ✓✓","o":"RJ-2073 · 《人纪·神农本草经》上经第五十五味，讲解（PDF 第 199 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"络石藤：藤包石","c":"【本经原文】「**味苦温，主风热死肌痈伤，口干舌焦，痈肿不消，喉舌肿，水浆不下；久服轻身明目，润泽好颜色。**」【主治】「**络石主利筋骨关节，治风热痈肿，能凉血退热，舒筋活络。**」讲义：「**它刚好是在把整个石头绑住、这样包住的感觉；你把它石头想成骨头的话，它对利筋骨关节非常的好。****还有喉咙肿、水浆不下……你可以用络石藤一味药，你用 1 两、用三碗水去煮、煮成一碗，让病人慢慢慢慢喝下去。****这个药呢，因为它把石头整个是包住的，所以它入三焦；像胸部乳房，乳房是不是一大堆乳糜把乳房包住，所以我们在乳癌、通乳上面的时候，我们也会开到络石藤。**」\n\n**【极重要】络石藤：藤包石**\n\n```\n藤包石 → 利筋骨关节（石=骨）\n        → 入三焦（乳糜包乳）\n        → 开喉（1 两煮浓，慢啜）\n```\n\n**「把石头包住，所以能包骨头、包乳房」——「须强标：喉部肿塞是急症。」**要点：**须「强「标」**：**「①喉部肿塞（水浆不下）是急症（会厌炎/喉癌/食管肿瘤），须立即就诊；②乳房硬块须先查；③不可只用络石藤」** ✓✓","o":"RJ-2074 · 《人纪·神农本草经》上经第五十六味「络石」，原文及讲解（PDF 第 200–201 页）。"},{"t":"神农本草经·上经：川芎（续）、蘼芜、黄连、络石藤、蒺藜子","h":"蒺藜子是眼科要药","c":"【本经原文】「**味苦温，主恶血，破症结积聚，喉痹乳难；久服长肌肉，明目轻身。又名刺疾藜。**」【毅民】「**白疾藜治睛球凹陷，及睛生障翳，视物模糊。**」【容川】「**利湿，此以金行水也。**」讲义：「**蒺藜子这个药，是眼科的要药。****尤其蒺藜子里面有一种是白蒺藜，白蒺藜打粉。『老师，这个病人一个眼球都萎缩掉了、凹下去了，怎么办？』——蒺藜能够金生水，那个眼珠里面本来就很多水在里面。****用白色的最好，白色是金嘛。****我在临床上的时候：乳房有硬块、还有哺乳里面有硬块、奶水没有办法完全排完，还有妇科的子宫里面的肌瘤，都可以使用到蒺藜。**」\n\n**【极精】白蒺藜 = 眼科要药**\n\n```\n白（金）→ 金生水 → 眼球凹陷/障翳\n```\n\n**「金生水，所以治眼球萎缩」——「须标：眼球萎缩须眼科评估。」**要点：**须「强「标」**：**「①眼球萎缩/视力下降须眼科急诊（视网膜/视神经/眼压）；②乳房硬块须先查；③子宫肌瘤须规范评估」** ✓✓","o":"RJ-2075 · 《人纪·神农本草经》上经第五十七味「蒺藜子」，原文及讲解（PDF 第 201–202 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"黄芪的本草条目","c":"【本经原文】「**味甘微温，主痈疽久败疮，排脓止痛，大风癞疾，五痔鼠瘘，补虚，小儿百病。**」【主治】「**黄耆为补气要药，功能助肺气，实皮毛，升清气，泻火气，补虚损五劳，痘疮不起，外症治痈疽，托毒止痛。**」【药征】「**主治肌表之水，故能治黄汗盗汗皮水，又旁治身体肿或不仁者。**」【灵胎】「**内补脾胃，外托疮毒。**」【用量】「**普通生者钱半至三钱，炙者八分至三钱，大剂一二两。**」【禁忌】「**黄耆功能实表，有表邪者忌；又能塞补不足，胸膈气闭闷、肠胃有积滞者忌；又能补阳，阳盛阴虚者忌；上焦热甚、下焦虚寒，及病人多怒肝气不和，并痘疮血分热者均忌。**」【倪注】「**一般言黄耆专于补气，凡气虚之症皆可用，又治自汗，补中气之不足，外科及痘科多以之托里透脓，肾亏溺血亦治之。**」\n\n**【极重要】黄芪的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/微温/无毒** |\n| **主治** | **补气/实皮毛/托毒排脓** |\n| **禁** | **表邪/气闭/阳盛阴虚** |\n\n**「实表、气闭、阳盛阴虚三者忌」是黄芪最精的边界** ✓✓","o":"RJ-2076 · 《人纪·神农本草经》上经第五十八味「黄耆」，原文（PDF 第 202–203 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"黄芪是气药之王","c":"讲义讲「一个极重要的定位」：「**黄耆这个药，顾名思义它是黄色的，耆是老；所以说这个黄耆它是补虚劳，你如果长期吃黄耆、人健康长寿，它是中药里面的气药的王。****所以你如果人参、高丽参吃不起、看那红参太贵了，那一斤都一万多块、二万块，那吃不起，我们用黄耆跟甘草，或者单用黄耆都可以。****那我们有黄耆建中汤，黄耆来补气。**」\n\n**【极重要】黄芪 = 气药之王**\n\n```\n人参太贵 → 黄芪 + 甘草 代\n```\n\n**「气药的王」——「这是最精的定位。」**要点：**这一条极重要，它与 n196「人参为王」形成对照（人「参贵/黄芪廉）」** ✓✓","o":"RJ-2077 · 《人纪·神农本草经》上经第五十八味，讲解（PDF 第 203 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"黄芪的六个用法","c":"讲义讲「一套极清晰的六用」：「**第 19 那黄色的呢？就通利三焦。****脾主湿，脾主少腹……脾气虚的时候，黄耆是实脾的药。****那气，皮肤表面上统统是气走的地方，那黄耆能够固表，表虚的时候、黄耆能够固。****我讲了大补脾、你就要：脾主肌肉，脾主四肢，所以四肢上的有问题、肌肉上的萎缩、人太瘦，统统可以吃黄耆。****这个人生了脓疮，在皮肤表面上脓疮一直没有收口，甚至那个疮凹陷下去，我们都可以用黄耆把它提升上来。****包括你水肿都可以用黄耆，为什么？因为通利三焦，三焦水道出焉。**」\n\n**【极重要】黄芪六用**\n\n| 用 | 机 |\n|---|---|\n| **实脾** | **脾主湿/少腹** |\n| **通三焦** | **水道出** |\n| **固表** | **表虚自汗** |\n| **长肌肉** | **脾主四肢** |\n| **托疮** | **久败疮不收口** |\n| **利水** | **水肿/腹积水** |\n\n**「一个黄芪，六个通道」——「这是最精的补气药全景。」** ✓✓","o":"RJ-2078 · 《人纪·神农本草经》上经第五十八味，讲解（PDF 第 203–204 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"黄芪托疮","c":"【本经原文】「**主痈疽久败疮，排脓止痛，补虚。**」讲义：「**不管是褥疮，很多人中风的有褥疮在背后，身上的疮；还有那个糖尿病的病人，脚指头破了个洞、不能收口，统统可以用黄耆。****它可以排脓、止痛、补虚，都可以用。**」原文【附录】「**黄耆皮—性味功用同黄耆，善走表逐水湿，治虚浮及脚肿。**」\n\n**【极重要】黄芪托疮**\n\n```\n褥疮 / 糖尿病足（久不收口）\n  → 黄芪（托毒排脓）\n```\n\n**「疮凹陷下去，黄芪把它提升上来」——「须强标：不能替代清创。」**要点：**须「强「标」**：**「①褥疮/糖尿病足须规范清创 + 抗感染 + 减压 + 血管评估；②黄芪不能代替清创；③糖尿病足须多学科管理（内分泌/血管外科/创面）」** ✓✓","o":"RJ-2079 · 《人纪·神农本草经》上经第五十八味，原文及讲解（PDF 第 204 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"气虚血旺安胎，气旺血衰下胎","c":"讲义讲「一个极重要的原则」：「**中医对女人生产的观念是这样子：你在怀孕的期间，中医想办法让你气虚血旺——气比较虚、血比较旺的话，目的就是安胎。****如果说让病人气旺血衰的时候，就是下胎；这个原则，你就知道什么时候要用黄耆了。****合谷是气穴，你如果让她补气；三阴交是血的穴道、泻血；补气泻血，那补气的话就是气旺就血衰，那就下胎。****所以补合谷泻三阴交，可以下胎；泻合谷、补三阴交可心安胎。****那当我们一个女人到临产、快生产的时候，原来在怀孕前面九个半月都是血旺；到临产、越到临产的时候气越来越旺、越来越旺，要动了。****那这个时候开始震动的时候你可以让她气旺血衰，所以帮助我们顺产，生产就会很顺利。**」\n\n**【极重要】气虚血旺安胎，气旺血衰下胎**\n\n```\n孕期：气虚血旺 → 安胎\n临产：气旺血衰 → 下胎/顺产\n合谷（气）/ 三阴交（血）\n```\n\n**「一个原则，两个方向」——「这条与 n195白术安胎」、n184「胎前产后」同一主题。**要点：**这一条极重要，它是「一个原则两个方向」** ✓✓","o":"RJ-2080 · 《人纪·神农本草经》上经第五十八味，讲解（PDF 第 204–205 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"千金要当小说看","c":"讲义讲「一个极精的读书法」：「**你再回头看中医的书，就不会迷惑嘛，你就当小说看《千金要方》《千金翼方》。****你不能当课本看呐，你要把它当小说看，那就很过瘾了。****不然那么厚怎么看？我都是当小说看啊；你不能一本正经的看，一本正经的看、你头就大了。****一天到晚吃川芎、还有远志来安神，他看了受不了。****要当小说看、参考书看可以，不能把它当正科书看；正科书是伤寒、金匮。****那读书读得很好要同时很开心才行，不然读成神精病。**」\n\n**【极精】千金要当小说看**\n\n```\n正科书 = 伤寒 / 金匮\n小说书 = 千金 / 外台\n```\n\n**「读书要读得开心才行」——「这是最精的读书法。」** ✓✓","o":"RJ-2081 · 《人纪·神农本草经》上经第五十八味，讲解（PDF 第 205 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"黄汗的来源","c":"【药征】「**主治肌表之水，故能治黄汗盗汗皮水。**」讲义：「**黄汗怎么来的？就是汗出马上遇冷。****就是过去发生在黄河边嘛，大家想是黄河所以能够人黄的，其实不是。****因为渡黄河，那个渡夫每天这样，暑天都要拉来拉去、很累啊；然后拉过、到岸的时候还一直汗流浃背，那在等所有的客人上来他才拉第二趟，他就跳到旁边水里面去游泳。****所以他刚冒完汗、汗没有发透就跳到水里面去；然后等到客人来了，他又拉回来、拉完了又发汗，一发汗又跳到水里面去。****长年啊这样热冷、跳来跳去，结果整个腋下、衣服一看全都是黄。**」\n\n**【极重要】黄汗 = 汗出 + 遇冷**\n\n```\n汗出 → 骤遇冷水 → 黄汗\n  → 黄芪（《金匮》）\n```\n\n**「汗没有发透就跳进水里，这就是黄汗」——「这条与 n45黄汗鉴别」同一主题。**要点：**须「标」**：**「黄汗机制仍未明；须排除①色汗症（假单胞菌/真菌）；②肝胆疾病；③药物」** ✓✓","o":"RJ-2082 · 《人纪·神农本草经》上经第五十八味，讲解（PDF 第 206 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"肉苁蓉的本草条目","c":"【本经原文】「**味甘微温，主五劳七伤，补中，除茎中寒热痛，养五脏，强阴益精气多子，妇人症瘕；久服轻身；一名肉苁蓉。**」【产地】「**生于各处高山，为一种寄生植物，茎富肉质，叶细如鳞。**」【性味】「**味甘酸咸，性温无毒。**」【主治】「**肉苁蓉为益髓壮阳要药，功能治精血不足，阳痿不举，女子绝产阴痛，润枯燥，滑大肠。**」【甄权】「**益髓悦颜色，大补壮阳，治女子血崩。**」【大明】「**男子绝阳不兴，女人绝阴不产，润五脏，长肌肉，暖腰膝。**」【容川】「**象人之阴，味咸入肾，温润而强阴，能助肾中之阳，益命门之火也。**」【用量】「**普通二钱至四钱。**」【禁忌】「**凡泄泻，肾中有热，强阳易兴而精不固者均忌；忌犯铁器。**」\n\n**【极重要】肉苁蓉的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘酸咸/温** |\n| **主治** | **益髓壮阳/润枯/滑大肠** |\n| **禁** | **泄泻/肾热** |\n\n**「叶细如鳞，茎富肉质——这是以意得知的形态学」** ✓✓","o":"RJ-2083 · 《人纪·神农本草经》上经第五十九味「肉松容」，原文（PDF 第 206–207 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"咸能软坚的两级","c":"讲义讲「一个极精的剂量分层」：「**它的性味是味甘酸咸；咸能够软坚，我们很多攻坚的药都是咸味的药。****那有淡咸跟重咸：淡咸呢就是一般的攻坚，比如说这个大便出不来了，那用淡咸的药；肿瘤的药，淡咸的药又不行了，要用重咸的药。****所以你如果坐在餐厅里面吃饭……隔壁两个女的在讲话『奇怪那个中医很烂，我吃他的药咸的要死，我老公吃他的药甜的要死，哪有这个中药那么极端的？』——这个中医就是高手。****我们开处方都是极端的，不是大咸就是大苦、大辣，那才有作用嘛。**」\n\n**【极重要】咸能软坚两级**\n\n| 级 | 用 |\n|---|---|\n| **淡咸** | **一般攻坚（便秘）** |\n| **重咸** | **肿瘤** |\n\n**「不是大咸就是大苦，那才有作用」——「须强标：重咸治肿瘤无依据。」**要点：**须「强「标」**：**「①咸味过量可致高钠/血压/肾负担；②『重咸治肿瘤』无临床依据；③口味极端不是疗效指标」** ✓✓","o":"RJ-2084 · 《人纪·神农本草经》上经第五十九味，讲解（PDF 第 207 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"阳强则阴不积","c":"讲义讲「一个极重要的推论」：「**阳不足的时候才会有阴积，阴才会有累积嘛；阴累积多了以后变成阴实。****我们要把阳补足，我们开很多阳的药；所以表面上听那是壮阳、补肾固精、壮阳的药，实际上治肿瘤的药——为什么？因为阳强，阴才不积。****阳气很旺，它气血才会流行。****我们决胜负的时候是在补肾：阳一壮起来，那个气也就通了，阴实门也就打开来，就是要靠这个阳药。**」\n\n**【极重要】阳强则阴不积**\n\n```\n阳虚 → 阴积 → 阴实（肿瘤）\n  → 补阳（肉苁蓉/细辛等）\n  → 阳强则阴不积\n```\n\n**「壮阳药就是治肿瘤的药」——「须强标：这是过度推论。」**要点：**须「强「标」**：**「①『壮阳药 = 治肿瘤药』无临床依据，须否定过度推论；②肿瘤须规范治疗（手术/化疗/放疗/靶向/免疫）；③不可用中药替代；④可作为支持治疗但须告知医师」** ✓✓","o":"RJ-2085 · 《人纪·神农本草经》上经第五十九味，讲解（PDF 第 208 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"维他命C的两个病例","c":"讲义讲「两个个案」：「**你看那女人哦，那个乳癌、乳房硬块，她吃那维他命 C，越吃越大，长得很大。****还有最新那个病人呢：先生是牙医，和太太两个人都是我的病人；他看到广告说有的卖……药厂的 Sales manager 推着行李箱进到医生的诊所『嗨医生，这是我们最新的维他命 C，我送你一罐吃吃看』。****结果他和他老婆两个人分享；她大概吃两个礼拜，乳房有个硬块长出来了、把她吓死了；他吃两个礼拜，肾结石！****所以我常常说维他命 C 啊是给你的敌人吃的，自己不要吃。**」\n\n**【极精】维他命 C = 给敌人吃的**\n\n```\n大剂量维 C\n  → 乳房硬块 / 肾结石\n```\n\n**「给敌人吃的」——「须强标：个案不能普遍化。」**要点：**须「强「标」**：**「①维生素C在常规剂量下安全（RDA 90/75 mg）；②大剂量（>2g/日）可致肾结石（草酸钙）、胃肠不适；③『乳房硬块/肾结石由维C引起』是个案，不能普遍化；④不可因此拒绝必要的维生素」** ✓✓","o":"RJ-2086 · 《人纪·神农本草经》上经第五十九味，讲解（PDF 第 208 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"肾主大小便","c":"讲义讲「一个极精的三角」：「**因为肾脏不单单是主小便，肾主大小便。****所以一般观念来说『啊老师这个肾脏主小便』——肾也主大便。****所以肾脏功能有问题，大便一定会同时发生问题。****过去经方，我们在治肝的时候，会去治大肠；为什么？大肠尽量保持它舒畅，肾脏就会很好。****肾脏不要花精神体力去照顾大便，专心来水生木就好。****所以我们会开些通利大便的药；肝脏有问题的时候一定会影响到肾脏，然后肾脏、大便就没了，便秘，大小便都没了。**」\n\n**【极重要】肾主大小便**\n\n```\n治肝 → 通大肠 → 肾不必分神 → 水生木\n```\n\n**「肾主大小便，所以治肝先通肠」——「这条与 n178治肝一定要通利肠子」完全一致。**要点：**这一条极重要，它是「肝-肾-大肠三角」** ✓✓","o":"RJ-2087 · 《人纪·神农本草经》上经第五十九味，讲解（PDF 第 208–209 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"防风的本草条目","c":"【本经原文】「**味甘温无毒，主大风头眩痛，恶风，风邪，目盲无所见，风行周身，骨节疼痹烦满；久服轻身。**」【性味】「**味甘辛，性温，无毒。**」【主治】「**防风为伤风头痛要药，功能散表发汗，主诸般风，周身痛，搜肝泻肺，散风胜湿。**」【大明】「**治三十六般风，男子一切劳劣，补中益神，风赤眼，止冷泪，及瘫痪，通利五脏关脉。**」【元素】「**治上焦风邪，泻肺实，散头目中滞气，经络中留湿，主上部见血。**」【吴克潜】「**防风善表散，故用以解毒，如砒毒，乌头毒，芫花毒，野菌毒，诸毒药。****又防风本制黄耆，黄耆得防风而功最大，治风邪久留不去，表虚自汗不止。**」【容川】「**防风辛而味甘入肌，气香而温，故入脾；散肌肉之风寒。**」【用量】「**普通一钱至三钱。**」【禁忌】「**似中风，产后血虚发痉，诸病血虚痉急，头痛不因风寒，溏泻不因寒湿，二便秘涩，小儿慢惊，阴虚盗汗，阳虚自汗，均忌。**」\n\n**【极重要】防风的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘辛/温/无毒** |\n| **主治** | **散表发汗/风湿/解毒** |\n| **禁** | **血虚痉/阴虚盗汗** |\n\n**「黄耆得防风而功最大」是防风的配伍价值** ✓✓","o":"RJ-2088 · 《人纪·神农本草经》上经第六十味「防风」，原文（PDF 第 209 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"风痛与固定痛","c":"讲义讲「一个极重要的鉴别」：「**那这个风症一个标准的一个症状就是它游走性，不会固定在哪里。****整颗头都痛，有时在后面，它的痛常常变化；有时候整个头、有时候偏、有时候偏这边、有时候后脑勺，这是风痛。****如果是一个地方痛、我就是痛那一点、都不动，就很危险了，恐怕是脑瘤或者是那个血管堵到了。****那就是川芎。**」\n\n**【极重要】风痛 vs 固定痛**\n\n| 型 | 判 |\n|---|---|\n| **游走性** | **风（防风）** |\n| **固定不动** | **脑瘤/血管堵（川芎 + 须查）** |\n\n**「固定一点不动，就很危险」——「这条与 n200六经头痛」、n203「川芎治头痛」同一主题。**要点：**须「强「标」**：**「固定头痛须立即神经科（头CT/MRI排除占位/出血/血管畸形）」** ✓✓","o":"RJ-2089 · 《人纪·神农本草经》上经第六十味，讲解（PDF 第 209–210 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"黄芪与防风互相制衡","c":"讲义讲「一个极精的配伍」：「**黄芪跟防风是两个互相制衡的药，黄耆呢、得到防风，力量更强。****如果我防风和黄芪加在一起，DOUBLE。****为什么会制衡？因为你光是一个黄芪，黄芪走表速度很快；那防风呢、配在里面的时候能够制衡，黄芪不要太快。****所以陈年的老病，有时候痛了很久的、全身肌肉痛痛了很久、太久了病很深；你用黄芪，单味黄芪走得很快嘛，你用防风把它收一下，不要太快，病还没有出去、你就跑掉了。**」\n\n**【极精】黄芪 + 防风（走表 + 收住）**\n\n```\n黄芪（走表快）+ 防风（收住）\n  → 久病深者：不透表就走\n```\n\n**「一快一慢」——「这是最精的配伍节奏。」** ✓✓\n\n**极精！！\"防「风解毒（野菌中毒）\"** ✅✓\n- **\"防风也是解毒的药，因为防风呢散、它的功能善于散表；任何性发散的都可以解毒\"** ✓✓\n- **\"所以像砒霜的毒、乌头的毒、芫花的毒、野菌的毒\"** ✓✓\n- **\"吃那个香菇，跑到山区里面随便采、那香菇好漂亮哦、五颜六色又厚；采完煮了吃，结果吃完中毒，那怎么办？吃防风\"** ✓✓\n\n**须「强「标」**：**「食用野菌中毒须立即急诊（毒蕈可致肝衰/肾衰）；防风不能解蕈毒」** ✓✓","o":"RJ-2090 · 《人纪·神农本草经》上经第六十味，讲解（PDF 第 210–211 页）。"},{"t":"神农本草经·上经：黄芪、肉苁蓉、防风、蒲黄","h":"蒲黄的炮制","c":"【本经原文】「**味甘平，主心腹膀胱寒热，利小便，止血消瘀血；久服轻身，益气力延年神仙。**」【产地】「**香蒲为生于池沼之宿根草，处处有之，蒲黄乃蒲花之花粉。**」【性味】「**味甘辛，性平，无毒。**」【主治】「**蒲黄为凉血活血散结除热要药，生用消瘀通经，疗扑打损伤；炒黑用止血止崩，止带止遗。**」【甄权】「**治痢血鼻衄，吐血，尿血，泻血，利水道，通经络，止女子崩中。**」\n\n**【极重要】蒲黄生用 vs 炒黑用**\n\n```\n生用 → 消瘀通经（跌打）\n炒黑 → 止血止崩\n```\n\n**「生用消瘀、炒黑止血」——「这条与 n202生用破血、炙用止血」完全一致。**要点：**须「强「标」**：**「①出血须规范止血（压迫/内镜/介入/输血）；②蒲黄不能代替；③活血药与抗凝药同用须谨慎」** ✓✓","o":"RJ-2091 · 《人纪·神农本草经》上经第六十一味「蒲黄」，原文（PDF 第 211 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"蒲黄加五灵脂","c":"原文【大明】「**妇人带下，月侯不匀，血气心腹痛，妊妇下血，坠眙，血运，血症，儿枕气痛，颠扑血闷，排脓，疮疖，游风肿毒，下乳汁，止泄精。**」【用量】「**普通七分至二钱。**」【禁忌】「**一切劳伤发热，阴虚内热，无瘀血者忌。**」**蒲黄配合五灵脂，治产后腹痛，产后血晕，不省人事，亦治妇人痛经；单用炒黑，止一切血均效。**\n\n**【极重要】蒲黄 + 五灵脂（失笑散）**\n\n```\n蒲黄 + 五灵脂 = 失笑散\n  → 产后腹痛/血晕/痛经\n```\n\n**「蒲黄配五灵脂，就是失笑散」——「这是最精的止痛对药。」**要点：**须「标」**：**「失笑散须辨证（瘀血为主）；孕妇须慎；与抗凝药同用须评估」** ✓✓","o":"RJ-2092 · 《人纪·神农本草经》上经第六十一味「蒲黄」，原文（PDF 第 212 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"炒黑止血的理由","c":"讲义讲「一个极实用的细节」：「**我们外敷的药，炒熟最好，因为怕有些不干净的东西嘛、灰尘啊什么不干净的东西，你炒熟以后就没有关系，外敷，那止血的效果非常的好。****所以以前我们那个部队打战的时候，军人身上带点蒲黄粉，止血嘛；刀砍伤怎么样，撒上去、止血。**」\n\n**【极精】炒黑 = 一为止血，二为灭菌**\n\n```\n炒黑 → ① 止血（炮制变性）② 高温灭菌（外敷）\n```\n\n**「炒熟就没关系，怕有灰尘」——「这是最精的双重理由。」**要点：**须「强「标」**：**「外伤出血须清创 + 压迫 + 就医；不可自行撒药粉（感染/破伤风）；破伤风须TAT + 清创」** ✓✓","o":"RJ-2093 · 《人纪·神农本草经》上经第六十一味，讲解（PDF 第 212 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"香蒲是少用药","c":"【本经原文】「**味甘平，主五脏心下邪气，口中烂臭，坚齿明目聪耳；久服轻身耐老。**」讲义：「**香蒲跟蒲黄稍微有点不太一样，我们现在大部分都是用蒲黄，很少用香蒲。****一般来说蒲黄跟香蒲通通都是活血化瘀的、清热解毒的药，诸位这样子记就可以了。**」\n\n**【极精】香蒲 = 少用（记大类）**\n\n```\n香蒲 / 蒲黄 → 活血化瘀 + 清热解毒\n```\n\n**「记大类就够了」——「这条与 n196纲举目张」同一主题。**要点：**这一条极精，它是「分类代替逐味」** ✓✓","o":"RJ-2094 · 《人纪·神农本草经》上经第六十二味「香蒲」，原文及讲解（PDF 第 213 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"续断的本草条目","c":"【本经原文】「**味苦微温，主伤寒，补不足，金疮痈伤，折跌续筋骨，妇人乳难；久服益气力。**」【性味】「**味苦，性微温，无毒。**」【主治】「**续断为补益筋骨要药，主伤中，腰脊痛，折跌续筋骨，疮痈止痛生肌，破瘀生新，补肝肾，安胎气，并治产后诸病。**」【容川】「**此物多筋，故治绝伤；因其筋象骨节，故主接筋骨，去骨节间之风寒。**」【灵胎】「**补益劳伤，强续筋骨。**」【用量】「**普通二钱至三四钱。**」【禁忌】「**禁与苦寒药治血病，及大辛热药用于胎前；又气味颇劣，颇不宜于胃，恶雷丸。**」【仲醇】「**欲行血理伤，当与当归牛膝肉桂延胡索同用；欲止血疗崩中补不足，则与白胶阿胶地黄麦冬杜仲人参山茱萸杞子黄耆五味同用；欲安胎则与凉血补血顺气药同用；欲疗金疮，则与金疮药同用。**」\n\n**【极重要】续断的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦/微温/无毒** |\n| **主治** | **补筋骨/续筋骨/破瘀生新/安胎** |\n| **禁** | **苦寒治血/大辛热胎前** |\n\n**「此物多筋，故主接筋骨」是最精的取象** ✓✓","o":"RJ-2095 · 《人纪·神农本草经》上经第六十三味「续断」，原文（PDF 第 213 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"续断是补骨","c":"讲义讲「一个极重要的定位」：「**续断我们用得非常的多，张仲景几乎没有怎么用；续断用得多呢，我们是用在伤科。****受伤的时候、骨折、肌肉拉伤，都可以用续断；包括乳癌、癌症的肿块，通通可以用到续断。****续断，味道非常的苦；苦味呢能燥、能坚、能泻，所以如果你骨头、骨折有发炎的时候，它能够去热、去燥、去湿，能收敛伤口、能够坚，让骨头长得很硬、肌肉长得很结实。****所以一般伤科只要有骨折，我们都会选用续断。**」\n\n**【极重要】续断 = 补骨（苦能坚）**\n\n```\n骨折 → 续断（苦能坚/燥/泻）\n  → 骨硬 + 肌实\n```\n\n**「苦能坚，让骨头长得很硬」——「这是最精的药性对应。」**要点：**这一条极重要，它与 n195「苦能坚（大黄、n197苦能燥）同一体系** ✓✓","o":"RJ-2096 · 《人纪·神农本草经》上经第六十三味，讲解（PDF 第 213 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"骨折案例：钙片与续断","c":"讲义讲「一个极震撼的对比」：「**你骨头少掉一节、比如说两寸，被大卡车压过去、骨头整个碎掉，粉碎性骨折。****西医只有把碎骨头拿出来……打了钢钉、在外面把它固定住；外面呢就用那个支架、转、转，把那个撑开来。****开始用所有的西药，你讲得出来对骨头好的、他通通开进去了，包括一天吃 1500mg 钙片、九个月，屁用也没有。****结果花了 3 个月骨头通通长好了，我花了六个月帮他排肾结石。****西医吃根本没有造骨头，反而制造一大堆肾结石出来。****我从头到尾看，没有开一片钙片给他吃，开中药，开一票续断是真的。**」\n\n**【极重要】骨折案例（钙片 vs 续断）**\n\n```\n粉碎性骨折：\n  西药 1500mg 钙 × 9 月 → 骨不连 + 肾结石\n  中药 续断 × 3 月 → 骨芽对生\n```\n\n**「钙片没造骨头，反而造肾结石」——「须强标：这是个案，不能普遍化。」**要点：**须「强「标」**：**「①这是个案，不能普遍化；②粉碎性骨折须骨科规范治疗（内固定/外固定 + 功能锻炼）；③钙片不是骨折治疗；④『西药无用』须否定（抗骨质疏松药/维D/蛋白质 + 康复训练有明确获益）；⑤不可自行用续断代替骨科」** ✓✓","o":"RJ-2097 · 《人纪·神农本草经》上经第六十三味，讲解（PDF 第 213–214 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"续断剂量与人情","c":"讲义讲「一个极实际的分层」：「**处方剂量的时候你可以看嘛，两钱三钱；你看是岳父，五钱。****五钱不但可以长得很快，而且可以活血化瘀、能够止痛的效果。****开重，只要是活血化瘀的药，开重就有止痛的效果，所以岳父的话，开五钱一两。**」\n\n**【极精】活血化瘀药开重 = 止痛**\n\n```\n2–3 钱 → 长骨\n5 钱–1 两 → 止痛\n```\n\n**「开重就有止痛的效果」——「这是最精的剂量层级。」** ✓✓\n\n**极精！！\"骨「断不分寒热\"** ✅✓\n- **\"至于说禁忌，治苦寒、大辛、胎前啊，不需要那么去禁忌它\"** ✓✓\n- **\"只要骨头断掉了，不要管他里面寒热，直接开处方下去了\"** ✓✓\n\n**【极精】\"骨「断不分寒热（急症优先）」** ✅✓","o":"RJ-2098 · 《人纪·神农本草经》上经第六十三味，讲解（PDF 第 214 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"漏芦的本草条目","c":"【本经原文】「**味苦咸寒，主皮肤热，恶创，疽痔，湿痹，下乳汁；久服轻身益气，耳聪目明，不老延年。**」【性味】「**味苦咸，性寒，无毒。**」【主治】「**漏芦为泄热解毒要药，主治恶疮热毒，湿痹，扑损，能排脓止血，通经脉。**」【大明】「**通小肠，泄精尿血，肠风，赤眼，小儿壮热，扑损续筋骨，乳痈瘰疠金疮，止血排脓，补血长肉，通经脉。**」【括要】「**下乳汁，消热毒，排脓止血生肌杀虫，能预解时行痘疹毒；取其寒胜热，又入阳明故也；无则以山栀取代之。**」【用量】「**普通一钱至三钱。**」【禁忌】「**妊娠禁用，疮疡阴证平塌不起发者，真气虚也，法当内塞；漏芦苦寒，非所宜投。**」\n\n**【极重要】漏芦的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦咸/寒** |\n| **主治** | **泄热解毒/排脓止血/通经** |\n| **禁** | **妊娠/阴证平塌** |\n\n**「苦咸寒」是漏芦最重要的三性** ✓✓","o":"RJ-2099 · 《人纪·神农本草经》上经第六十四味「漏芦」，原文（PDF 第 214–215 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"咸入肾，寒用热证","c":"讲义讲「一个极基础的归经」：「**因为它药味很咸，咸味的药一定入肾，诸位记得，咸味的药一定入肾。****它的药性是寒的，诸位一定要知道，因为它是大寒性的药，所以你必须要热症才会用，就是发炎了你才可以用。****那真的我们看到很多内科的比如说肿瘤、癌症的；有很多，它的炎低温不是高温，低温的话、他里面是寒掉了；真的是炎症的话，它发炎发热、很高温，这时候你可以用寒凉的药下去。**」\n\n**【极精】咸 → 肾；寒 → 热证**\n\n```\n咸 → 入肾\n大寒 → 只用于热证/炎症\n```\n\n**「低温的痛不是炎症，不能用寒药」——「这是最精的寒药使用边界。」** ✓✓","o":"RJ-2100 · 《人纪·神农本草经》上经第六十四味，讲解（PDF 第 215 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"奶水下行就是预防乳癌","c":"讲义讲「一套极重要的理论」：「**【括要】里面说下乳汁，大家只要记得：能够清奶水、把奶水从胸部清出来到子宫里面的药，只要有这种药，都是可以预防乳癌的药。****但是奶水为什么会累积在乳房里面？你想、或者是逆流，最主要是情绪——外就是情绪，内就是心里面有压力。****又一天到晚担心先生男朋友在外面有；要求自己很好强、洁癖，非要把家里弄很干净，乳癌。****因为她给自己压力很大嘛；看到地上有一点灰尘就受不了。****要舍下，舍下就会很好，那都可以预防乳癌。**」\n\n**【极重要】奶水下行 = 预防乳癌**\n\n```\n奶水不能下行 → 逆流乳房\n  → \"下乳汁\"药可预防乳癌（讲义说）\n```\n\n**「舍下就会很好」——「须强标：乳癌的病因不是奶水积聚。」**要点：**须「强「标」**：**「①乳癌真实危险因素：BRCA1/2、雌激素暴露、年龄、肥胖、酒精、生育/哺乳史、家族史；②不是『乳房奶水积聚』；③筛查：40岁起每 1–2年钼靶；④情绪压力不是病因但影响免疫；⑤『舍下可预防乳癌』无依据」** ✓✓","o":"RJ-2101 · 《人纪·神农本草经》上经第六十四味，讲解（PDF 第 215 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"阴证平塌：乳头塌陷","c":"讲义讲「一个极重要的体征」：「**那阴证的疮、平塌、塌陷下去的，都是不好的症状，包括乳癌。****那乳癌，你可以看到乳头它是塌陷下去的；突出来没事的、都是塌陷下去的。****伤口塌陷下去的都是癌症；遇到塌陷的时候，就不要用这个漏芦。****象我们塌陷下去的，法当内塞——不是说里面塞东西，而是用一些药象防风、黄芪，能够行气；炮附子、白术，这种能够排脓。****所以法当内塞，不是塞卫生纸下去啊，就是靠中药把里面的气补足，叫内塞。**」\n\n**【极重要】阴证平塌（乳头塌陷）**\n\n```\n突出来 → 没事\n塌陷下去 → 癌症（阴证）\n  → 不用漏芦（苦寒）\n  → 法当内塞（黄芪/附子/白术/防风）\n```\n\n**「塌陷下去的都是癌症」——「须强标：须立即乳腺外科。」**要点：**须「强「标」**：**「①乳头塌陷/乳房硬块/橘皮征/乳头溢液须立即乳腺外科（超声 + 钼靶 + 活检）；②不可自行判断；③乳癌须规范治疗；④『内塞』不能代替」** ✓✓","o":"RJ-2102 · 《人纪·神农本草经》上经第六十四味，讲解（PDF 第 215 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"营实是蔷薇子","c":"【本经原文】「**味酸温，主痈疽恶创，结肉跌筋，败创热气，阴蚀不瘳，利关节。**」【主治】「**营实主痈疽，下停水。**」【括要】「**口舌縻烂，蔷薇根煮汁温含；口疮日久，延及胸前生疮，三年以上不愈者，用此效；杨梅疮筋骨毒痛，取根皮煮汁多饮效；下疳用黄花蔷薇叶焙研洗之敷之良。**」讲义：「**营实的性是酸的，酸主收，收敛。****有伤口开在那边的时候，营实可以收，可以把脓水去掉，同时收口；同时把里面的停水清掉。****你这个水不清掉，光吃那个消炎药不会好的，因为水在那边嘛、炎症随时会回来的。****营实，就是蔷薇子拿回来、炒过以后打粉，直接涂在上面就可以了，收口效果很好。**」\n\n**【极精】营实 = 蔷薇子（酸收收口）**\n\n```\n口舌糜烂 / 下疳 / 陈年老疮\n  → 蔷薇子炒粉外涂（酸收）\n```\n\n**「水不清掉，炎症随时回来」——「须强标：口腔溃疡超过 2 周须活检。」**要点：**须「强「标」**：**「①口腔溃疡超过 2周须活检（排除口腔癌）；②性病须规范诊治（梅毒青霉素）；③外用不能代替」** ✓✓","o":"RJ-2103 · 《人纪·神农本草经》上经第六十五味「营实」，原文及讲解（PDF 第 216 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"天名精与良恶性触诊","c":"【本经原文】「**味甘寒，主瘀血，血瘕欲死，下血止血，利小便；久服轻身耐老。**」【主治】「**天名精主治瘀血症瘕，诸毒疔肿，破血生肌杀虫，内外皆可用。**」【禁忌】「**时珍曰有小毒，生汁吐人。**」讲义：「**诸位要在肿瘤、身上的癌症肿瘤跟一般的瘀血、我们这个良性的瘤怎么区分？最简单的方式你用触摸。****摸上去只要是肿瘤、硬，他是恶性的；摸他表面非常的硬，而且表面上非常的粗糙；一般大多数病人不疼的。****那你摸到表面很平滑的、它会动的、而且会疼的，这是良性的。**」\n\n**【极重要】良性 vs 恶性（触诊）**\n\n| 型 | 触 |\n|---|---|\n| **恶性** | **硬/粗糙/不痛/不动** |\n| **良性** | **平滑/可动/有痛** |\n\n**「硬的、粗糙的、不痛的，就是恶性」——「须强标：触诊不能代替影像。」**要点：**须「强「标」**：**「①触诊不能代替影像 + 活检；②恶性肿瘤可能痛；③须立即专科就诊」** ✓✓","o":"RJ-2104 · 《人纪·神农本草经》上经第六十六味「天名精」，原文及讲解（PDF 第 217 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"决明子炒熟泡茶","c":"【本经原文】「**味咸平，主青盲目淫，肤赤白膜，眼赤痛泪出；久服益精光。**」【主治】「**决明子为泻肝明目要药，能补肝虚泻肝经风热，主头风头痛，治一切眼病。**」【日华】「**助肝气益精，以水调末涂肿毒，治太阳穴头痛；作枕头治头风明目。**」讲义：「**这个决明子你把它炒熟，泡茶喝，好像麦茶一样。****如果眼睛不好的人，你可以炒决明子，炒熟以后泡茶。****但小心要找厕所小便，喝太多了嘛，因为它味道是甘苦咸，咸会有利水的功能。****炒决明子不要放盐巴了，炒完它有点咸味，淡淡的咸味很好喝。****肝主眼睛，肝开窍在眼睛，所以眼睛的问题我们会去治疗肝。****我们的明目地黄丸里面就有这个东西。**」\n\n**【极重要】决明子 = 泻肝明目（炒熟泡茶）**\n\n```\n炒决明子 → 茶（麦茶味/微咸）\n  → 泻肝明目 + 利水（小便多）\n  → 明目地黄丸 + 决明子枕\n```\n\n**「炒决明子当茶，还能做枕头」——「须标：不能治近视、白内障。」**要点：**须「标」**：**「①决明子茶不能治近视/白内障/青光眼；②眼病须眼科；③低血压/利尿剂同用须注意」** ✓✓","o":"RJ-2105 · 《人纪·神农本草经》上经第六十七味「决明子」，原文及讲解（PDF 第 217–218 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"丹参一味功兼四物","c":"【本经原文】「**味苦微寒，主心腹邪气，肠鸣幽幽如走水，寒热积聚，破症除瘕，止烦满益气。**」【主治】「**丹参为通经要药，功能活血调经，治心腹邪气，寒热积聚，宿血恶露。**」【纲目】「**活血通心包络，治疝痛。**」【用量】「**普通二钱至三四钱，大剂一两。**」【禁忌】「**孕妇无故忌，畏咸水，反藜芦。**」原文「**丹参为女子调经良药，故有一味丹参功兼四物之称；产后养血去瘀，能入心养血，故天王补心丹中用此味治劳心过度、神志不宁、烦热健忘、怔忡。**」\n\n**【极重要】丹参 = 一味功兼四物**\n\n```\n丹参（赤参）→ 入心\n  → 补 + 攻（活血 + 养血 + 安胎 + 排瘀）\n  → 天王补心丹\n```\n\n**「一味丹参抵四物」——「这是最精的一味抵四味。」** ✓✓\n\n**极重要！！\"丹「参= 安胎 + 排瘀（同时）\"** ✅✅\n- **\"丹参呢，也可以安胎，尤其在妇人产前『老师她出血了』\"** ✓✓\n- **\"我们不能开太多活血化瘀的药，开下去她胎儿掉下来怎么办\"** ✓✓\n- **\"你开丹参，丹参可以固胎、可以安胎，同时可以把瘀血排掉，应该是很好、这很好用\"** ✓✓\n\n**【极重要】丹参 = 安胎 + 排瘀** ✅✅\n\n**\"与 n195「白术安胎、n202卷柏生用/炙用同一主题！！\"** ✓✓","o":"RJ-2106 · 《人纪·神农本草经》上经第六十八味「丹参」，原文及讲解（PDF 第 218–219 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"经方为主，南派为辅","c":"讲义讲「一个极重要的学习路线」：「**那经方，我们在使用张仲景的方子的时候，几乎看不到丹参；我在治疗心脏病也看不到丹参，妇科的时候、张仲景也不用丹参。****但是我一再跟大家强调：你们要以张仲景的《伤寒》《金匮》的条辨里面的方子为主；那再加上需要加增减什么药的时候，从《神农本草经》里面增减，这就永远不会脱离经方的范围。****这个做到了很好以后，再去加南派的药进来了，天王补心丹啊、龙胆泻肝汤啊，附在上面——圣诞树枝很好了嘛，多几个灯啊、多几个腊烛，这样子是对的。****如果没有经方做基础，你用南派的话，你空壳子，外面很好、里面空的，没办法治病的，辩证都会有问题。**」\n\n**【极重要】经方为主，南派为辅**\n\n```\n骨架：伤寒 / 金匮 + 本经\n装饰：南派方（天王补心丹/龙胆泻肝汤）\n→ 无骨架 = 空壳\n```\n\n**「圣诞树的比喻」——「这是最精的学习路线。」**要点：**须「标」**：**「『南派是空壳』是派系立场，须不采；好的中医会融合两者」** ✓✓","o":"RJ-2107 · 《人纪·神农本草经》上经第六十八味，讲解（PDF 第 219 页）。"},{"t":"神农本草经·上经：蒲黄（续）、香蒲、续断、漏芦、营实、天名精、决明子、丹参","h":"茜草是血见愁","c":"【本经原文】「**味苦寒，主寒湿，风痹，黄疸，补中；现名茜草。**」【性味】「**味酸咸，性寒无毒。**」【主治】「**茜草为凉血通经要药，主吐血下血，月经不通，月经不止，治骨节风痛，折跌损伤，凉无病之血，行已伤之血。**」【别录】「**止血内崩，下血，膀胱不足，踒跌，蛊毒；久服益精气，可以染绛。**」【用量】「**普通一钱至二钱。**」【禁忌】「**病人虽见血证，若加泄泻、饮食不进者忌。**」原文「**茜草一名血见愁，其理血之效可知；俗方用治女子经水不通，以一两煎酒服之。**」\n\n**【极重要】茜草 = 血见愁**\n\n```\n凉无病之血，行已伤之血\n  → 吐血/下血/经闭/经不止\n  → 可染绛（染料）\n```\n\n**「凉无病之血，行已伤之血」——「这是最精的双向调节。」**要点：**须「强「标」**：**「①出血须规范止血；②茜草不能代替；③与抗凝同用须谨慎」** ✓✓","o":"RJ-2108 · 《人纪·神农本草经》上经第六十九味「茜根」，原文（PDF 第 219–220 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"茜草止血又攻坚","c":"讲义讲「一个极重要的双向」：「**如果状况不明、还出现腹痛得很厉害，你不了解里面什么样的状况，我们就开茜草。****这个茜草，活血化瘀的力量很强、它的范围很广，为什么？因为它是味酸主收，而且它是咸味的药；咸味的药主攻坚，它能够攻坚。****所以很多硬块呀在里面、肿瘤呀，我们都去开，都可以开茜草。****有些病人呢如果下血、比如说子宫，西医说你子宫颈癌、病人出血不止；开处方进去的时候，我又希望止血，又怕止血的话、一下止血的话，那血排不出来。****开茜草啊！茜草本主收敛的、又主攻坚，它一起来的，我们就有这种药。**」\n\n**【极重要】茜草 = 止血 + 攻坚**\n\n```\n出血（子宫颈癌）+ 怕止血留瘀\n  → 茜草（酸收 + 咸攻坚）\n```\n\n**「止血又攻坚，它一起来的」——「须强标：血无止法须否定。」**要点：**须「强「标」**：**「①『血无止法』须否定（大出血必须止血：压迫/内镜/介入/输血）；②妇科出血须立即妇科就诊」** ✓✓\n\n**极精！！\"胖「= 热，瘦= 凉\"** ✅✓\n- **\"一般来说，我们看女人、看外症：人比较稍微胖一点的，都是热；比较瘦的，都是凉\"** ✓✓\n- **\"所以如果说稍微胖点的女太太小姐们呢，你用茜草这个寒药，就是很对症的\"** ✓✓\n\n**【极精】胖 = 热，瘦 = 凉** ✅✓","o":"RJ-2109 · 《人纪·神农本草经》上经第六十九味「茜根」，讲解（PDF 第 220 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"血见愁","c":"原文「**茜草一名血见愁，其理血之效可知；俗方用治女子经水不通，以一两煎酒服之。****仲醇曰治疸，此治因蓄血而发黄的疸，不专于湿热者也。**」讲义：「**茜草又一个名称叫血见愁——任何的血病、碰到茜草，这个血病都发愁；意思就是茜草效果很好，它凝血的效果非常的好。**」\n\n**【极精】血见愁 = 血病见它就愁**\n\n```\n血见愁（茜草）→ 凝血效佳\n```\n\n**「血病碰到它就发愁」——「这是最直观的命名逻辑。」** ✓✓","o":"RJ-2110 · 《人纪·神农本草经》上经第六十九味，原文及讲解（PDF 第 220 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"血余炭就是乱发","c":"讲义讲「一个极有趣的命名」：「**头发变黑的，这是历代的经验方：茜草一斤、生地三斤，你把它加进水熬成膏，每天喝个半勺、一个月头发就变黑了。****因为中医的观念里面认为：发为血余，血在滋润它多余的地方就是头发。****所以，我们血余炭，你如果把头发烧了以后、就是血余炭。****其实血余炭就是比较好听嘛，实际上就是乱发；如果讲这是我头发烧焦给你吃的、怪怪的。****说说那个黄土不好，灶心土、说是伏龙肝，听起来还不错。****我讲老鼠药，西医也说老鼠药不好听嘛，他说 Coumarin 好听嘛，实际就是老鼠药。**」\n\n**【极精】命名的艺术（血余炭 = 乱发）**\n\n| 好名 | 实名 |\n|---|---|\n| **血余炭** | **乱发烧焦** |\n| **伏龙肝** | **灶心土** |\n| **Coumarin** | **老鼠药** |\n\n**「中医有一些名字，就是这样子」——「这是最有趣的语言学观察。」**要点：**须「标」**：**「茜草 + 生地染发无科学依据；白发须排除营养/甲状腺/贫血；染发剂（对苯二胺）才是有效方案」** ✓✓","o":"RJ-2111 · 《人纪·神农本草经》上经第六十九味，讲解（PDF 第 220 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"飞廉是少用药","c":"【本经原文】「**味苦平，主骨节热，胫重酸疼；久服令人身轻。**」【主治】「**飞廉花根为去风湿止痛活血药，能下乳汁及杀虫。**」【禁忌】「**里有寒，又兼下痢者禁用。**」讲义：「**这种药呢，张仲景都没有用过；现在也很少人去用这些东西。****一般来说飞廉的外皮呢，我们使用在这个皮肤上的问题、被蜜蜂咬到了。****任何的药，大家只要记得，当你做外敷的时候、外用的时候：一个是你可以用新鲜的汁，比如说你用新鲜药材用汁挤出来；还有呢，你把它烘焙、烘干后打粉备用。****那这个药，我本人用得不多。**」\n\n**【极精】飞廉 = 少用（蜜蜂咬）**\n\n**外敷药的两种形式**：\n```\n① 鲜汁（现挤）\n② 干粉（烘干预备）\n```\n\n**「外敷就两种形式」——「这是最实用的通则。」** ✓✓","o":"RJ-2112 · 《人纪·神农本草经》上经第七十味「飞廉」，原文及讲解（PDF 第 221 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"五味子的本草条目","c":"【本经原文】「**味酸温，主益气，咳逆上气，劳伤羸酸，补不足，强阴，益男子精。**」【性味】「**味酸（皮甘肉酸核辛苦，都具咸味，五味俱备）性温无毒。**」【主治】「**五味子为肺虚咳逆上气要药，主敛肺滋肾，祛痰止咳，生津止渴，敛汗退热，治劳伤，补不足。**」【别录】「**养五脏，除热，生阴中肌。**」【大明】「**明目，暖水脏，壮筋骨，治风，消食，反胃，霍乱转筋，痃癖，奔豚冷气。**」【好古】「**治喘咳逆，壮水镇阳。**」【容川】「**五味子酸敛肝木，得金收之性，使木气不上逆，则水火二者皆不上冲于肺；其味酸而质润，囊大而中空，有肺中空虚之象；又生于叶间，其性轻浮，故专攻敛肺生津。**」【用量】「**普通五分至一钱，大剂倍用。**」【禁忌】「**咳初起脉数，有实火，及肝家有动气，肺气有实热、痧疹初发，及一切停饮，均忌。**」\n\n**【极重要】五味子的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **酸（五味俱备）/温** |\n| **主治** | **敛肺滋肾/祛痰止咳/敛汗** |\n| **禁** | **实火/痧疹初发/停饮** |\n\n**「咳初起、实火、停饮三者忌」是五味子最重要的边界** ✓✓","o":"RJ-2113 · 《人纪·神农本草经》上经第七十一味「五味子」，原文（PDF 第 221–222 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"五味子五味俱备","c":"讲义讲「一个极精的命名」：「**为什么称为五味子？因为它这一味药，五种味道，肝心脾肺肾、酸苦甘辛咸，正好入肝心脾肺肾。****它皮是甜的，肉是酸的，核是辛的、苦的、辣味，五味俱全的。****它最强的味道就是酸，酸主收敛，温性的药。****以北五味，北五味是药性最好的；北五味长得里面的子是红色的、外边是黑色的。**」\n\n**【极重要】五味子 = 五味俱备 → 五脏**\n\n```\n皮甘 / 肉酸 / 核辛苦 / 具咸\n  → 酸苦甘辛咸 → 入五脏\n  → 最强是酸（收敛）\n```\n\n**「一味药入五脏」——「这是最精的一药入五脏。」** ✓✓","o":"RJ-2114 · 《人纪·神农本草经》上经第七十一味，讲解（PDF 第 222 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"子类药都补精","c":"讲义讲「一条极有趣的通则」：「**五味子是黑色的；『老师，它黑色的怎么会来治肺呢？』——因为它是入肾、补肾的。****诸位你只要知道什么子、什么子，反正出现子——除了孔子、孟子这个以外——覆盆子啊、菟丝子啊、胡麻仁啊，这个什么子都能够补精的、固精的子。****因为它黑色的、色黑，所以它能够把肺里边的水导到肾脏里边去，所以是咳嗽常常使用的药物。**」\n\n**【极精】子类药都补精**\n\n```\n五味子（黑）→ 入肾\n  → 肺水下降到肾 → 治咳\n```\n\n**「除了孔子孟子，什么子都补精」——「这是最精的子类通则。」** ✓✓","o":"RJ-2115 · 《人纪·神农本草经》上经第七十一味，讲解（PDF 第 223 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"咳嗽的五音","c":"讲义讲「一个极精的辨咳」：「**那我们有一种咳嗽呀是商音，我们叫宫、商、角、徵、羽；商音就这样：咳、咳、咳。****咳嗽的音是散的，我们可以用五味子收。****还有水气凌心，痒、喉咙，唉哟、喉咙好痒，咳咳咳，咳得比较舒服，因为水上来、水气上来，有五味子可以把它清掉。**」\n\n**【极精】咳嗽五音（商音散 → 收）**\n\n```\n商音（散）→ 五味子收\n水气凌心（咽痒）→ 五味子清\n```\n\n**「咳嗽的音是散的」——「这是最精的以音辨咳。」** ✓✓","o":"RJ-2116 · 《人纪·神农本草经》上经第七十一味，讲解（PDF 第 222–223 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"小青龙八味","c":"讲义讲「一个极精的歌诀」：「**所以张仲景的小青龙啊，还有麻芍姜辛桂五草半。****以后我会教大家背歌诀：小青龙就是小青龙，麻芍姜辛桂五草半；我们是念字头，八味药就讲完了。****里面麻芍姜辛：麻黄、白芍、干姜、细辛；桂五：桂枝、五味——五味就是五味子。****还有苓甘五味姜辛汤，有五味子在里面。**」\n\n**【极重要】小青龙八味**\n\n| 字头 | 药 |\n|---|---|\n| **麻** | **麻黄** |\n| **芍** | **白芍** |\n| **姜** | **干姜** |\n| **辛** | **细辛** |\n| **桂** | **桂枝** |\n| **五** | **五味子** |\n| **草** | **甘草** |\n| **半** | **半夏** |\n\n**「八个字就讲完了」——「这是最精的歌诀记药。」**要点：**这一条极重要，它是「经方记忆法」** ✓✓","o":"RJ-2117 · 《人纪·神农本草经》上经第七十一味，讲解（PDF 第 223 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"一吸气就咳就是气逆","c":"讲义讲「一个极精的指征」：「**咳逆的时候，好像不得不咳；一吸气、『老师我怎么一吸气、深呼吸就要咳』。****那气就逆嘛，五味子可以把气硬迫下去、迫到下边去。****所以我们常常在治疗包括长年的咳嗽、或者是长年的气喘；只要是病人有吸、不能吸进去气会反逆，或者有会咳嗽，我们通通在用五味子。****不一定说一定要是咳嗽，气喘都可以治。**」\n\n**【极重要】一吸气就咳 = 气逆**\n\n```\n深呼吸就咳（吸气性）\n  → 气逆 → 五味子（镇阳下降）\n```\n\n**「气逆就把它硬迫下去」——「这条与 n146吸难=实证」有对应。** ✓✓","o":"RJ-2118 · 《人纪·神农本草经》上经第七十一味，讲解（PDF 第 223 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"旋覆花是降逆","c":"【本经原文】「**味甘温，主益气，去面皯黑，色媚好；其根味辛，主腹中寒热邪气，利小便；今名旋覆花。**」【别录】「**续筋骨，合金疮。**」讲义：「**经方里边很有名的旋覆代赭石汤，旋覆花还是用在这边，它是降逆。****逆气、这胃气反逆的时候用；胃气反逆上来的时候用，哕、打嗝，哕就是打嗝，呃呃呃、打嗝不止，这么往上逆，通通可以用旋覆花。****张仲景治胃家、胃病的时候，这个用得很多。**」\n\n**【极重要】旋覆花 = 降逆**\n\n```\n哕（打嗝）/ 胃气反逆\n  → 旋覆代赭汤\n```\n\n**「哕就是打嗝，往上逆」——「这是最精的降逆定位。」** ✓✓","o":"RJ-2119 · 《人纪·神农本草经》上经第七十二味「旋华」，原文及讲解（PDF 第 224 页）。"},{"t":"神农本草经·上经：茜草（续）、飞廉、五味子、旋覆花","h":"胃酸的寒热两型","c":"讲义讲「一个极重要的分型」：「**几乎所有的病人，尤其胃酸呕逆的时候，就两种胃酸呕逆：一种是寒、一种是热。****舌头伸出来我们看一下：淡白的、白白的，然后人脸色很暗——寒。****寒的时候我们会开吴茱萸啊、干姜其他的药，这比较热的药。****那在美国临床的时候，见到大胖子呀、吃很多汽水、每天吃喝咖啡呀、吃了肉色是黄的，那就是旋覆花、代赭石汤这些。****那我胃酸很多，我开处方的时候心里就很清楚，这个药一剂、吃下去就好。**」\n\n**【极重要】胃酸两型**\n\n| 型 | 舌/色 | 药 |\n|---|---|---|\n| **寒** | **淡白/面暗** | **吴茱萸/干姜** |\n| **热** | **黄/胖/肉黄** | **旋覆代赭汤** |\n\n**「胃酸就两种，一寒一热」——「须标：须规范治疗。」**要点：**须「标」**：**「胃酸反流（GERD）真实机制：LES功能/裂孔疝/肥胖/药物；须规范治疗（PPI）+ 生活方式（减重/抬高床头/避免睡前进食）」** ✓✓\n\n**极精！！\"胃「酸的主因（甜 + 白面 + 乳 + 碳酸）\"** ✅✓\n- **\"那当然了，胃酸的主因，他是因为吃甜的嘛；因为吃白糖吃得太多、白面吃太多、乳类的制品吃太多，碳酸钙、碳酸的东西、象那个汽水喝太多，都不好\"** ✓✓\n\n**须「标」**：**「饮食是诱因之一，不是主因；须按GERD规范诊治」** ✓✓","o":"RJ-2120 · 《人纪·神农本草经》上经第七十二味，讲解（PDF 第 224–225 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"景天治蜂蝎咬伤","c":"讲义讲「一个极实用的外科药」：「**景天呢大部分都是用在外科，内科很少用，都是用在外科上、敷的。****它的味苦甘，专门治疗被蜜蜂毒蜂咬伤，能够拔脓吸毒；蝎子咬伤、景天；还有那个火烧伤、火的烫伤、刀疮刀伤，都可以用。****尤其治疗这个毒的蜜蜂效果最好；毒蜜蜂啊、还有那个蝎子啊、毒蜘蛛咬到，我们用这个效果都很好。****所以以后你们知道那个虎头蜂咬伤通通可以用景天。**」\n\n**【极精】景天 = 蜂蝎伤外用**\n\n```\n毒蜂 / 蝎子 / 毒蜘蛛 / 烫伤 / 刀伤\n  → 景天（叶，外敷）\n```\n\n**「虎头蜂咬伤通通可以用景天」——「须强标：蜂蜇可致过敏性休克。」**要点：**须「强「标」**：**「①虎头蜂/毒蜂蜇伤可致过敏性休克，须立即急诊（肾上腺素 + 抗组胺）；②不可只用景天；③毒蜘蛛/蝎子须抗毒素」** ✓✓","o":"RJ-2121 · 《人纪·神农本草经》上经第七十六味「景天」，讲解（PDF 第 228 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"外用无定量","c":"讲义讲「一个极简单的通则」：「**那这种专门是疗外伤、那个止血用的，外用；外用的药没有定量，因为撒皮肤外面嘛。****他如果被蚊子咬了 1 个包，你说外用固定一钱、撒完，99 个包呢还没用？你不要那么固执，全身都可以撒。****一般来说我们外用药的时候都是熟用，所谓熟用就是炮制、烤过烤干了、炒干了也可以；反正把水分去掉、弄干了以后打粉。**」\n\n**【极精】外用无定量**\n\n```\n外用 → 无定量（按面积撒）\n内服 → 有定量（钱为单位）\n```\n\n**「99 个包还没用？」——「这是最实用的通则。」** ✓✓","o":"RJ-2122 · 《人纪·神农本草经》上经第七十六味，讲解（PDF 第 228 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"茵陈的三种黄","c":"讲义讲「一个极重要的三分」：「**这个药呢，是经方里面的，治黄的重药、要药。****我们前面介绍过黄芪，黄芪可以退黄，没错、茵陈也可以退黄；但是黄芪退的黄是三焦的黄，会染色皮肤，那个汗、流汗出来会把衣服染色掉。****茵陈的黄不是，茵陈是肝胆病的黄，肝病那个黄用茵陈。****还有一种黄是贫血的黄、血色的黄，那个是我们要补血的药，把血补足。****手掌拿起来一看整个手都暗黄、淡黄色，没有什么血色。**」\n\n**【极重要】三种黄**\n\n| 型 | 治 |\n|---|---|\n| **三焦黄（黄汗）** | **黄芪** |\n| **肝胆黄（肝病）** | **茵陈** |\n| **贫血黄（血虚）** | **补血** |\n\n**「三种黄，三种药」——「这条与 n46黄疸/黄汗鉴别」、n204「黄汗」同一主题。**要点：**这一条极重要，它是「三黄分治」** ✓✓","o":"RJ-2123 · 《人纪·神农本草经》上经第七十七味「茵陈」，讲解（PDF 第 229 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"阳黄与阴黄","c":"【本经原文】「**味苦平，主风湿寒热，邪气热结黄疸；久服轻身，益气耐老，面白悦；今名茵陈蒿。**」【性味】「**味苦性平微寒，无毒。**」【主治】「**茵陈蒿为黄疸要药，功能除湿利尿，主治脾胃湿热，天行时热，周身发黄，以此为君。**」【药征】「**主治发黄也。**」讲义：「**所有的湿热症，这热若它在中焦、病人恶心呕吐，还结黄疸、胆汁、胆堵到了，胆汁逆流、全身黄疸，都会用到茵陈。****一般来说在经方里面，我们会区分两种，我们叫阴阳：阳黄，还有一种我们称之为阴黄。****茵陈蒿大部分用在阳黄。**」\n\n**【极重要】阳黄与阴黄**\n\n```\n阳黄（湿热/胆汁逆流）→ 茵陈蒿汤\n阴黄（寒湿）→ 须温\n```\n\n**「茵陈大部分用在阳黄」——「这条与 n46阳黄治成阴黄=恶化」同一主题。**要点：**这一条极重要，它是「黄的两极」** ✓✓","o":"RJ-2124 · 《人纪·神农本草经》上经第七十七味，原文及讲解（PDF 第 230–231 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"寒热并结时茵陈照用","c":"讲义讲「一个极重要的用药观」：「**那我们在治疗肝病的时候，有的遇到寒热、遇到错综，也有寒症也有热症的时候怎么处理呢？****你就用茵陈，跟寒药热药用在一起没有关系，很正常的。****治疗癌症的时候、肝硬化肝癌，到后来都会看到寒热并结；都是重症才会寒症热症都有。****这个时候你寒药热药合在一个方子里面没有关系，就用，不要说忌讳『啊这个是寒药，我们热症才用、寒症不用』——不行。**」\n\n**【极重要】寒热并结 → 寒热药同用**\n\n```\n肝硬化/肝癌 → 寒热并结\n  → 寒药 + 热药同方（茵陈在其中）\n```\n\n**「寒热药同方，很正常的」——「这条与 n196寒热药同用」、n203「寒极生热」同一主题。**要点：**这一条极重要，它是「不忌寒热同方」** ✓✓","o":"RJ-2125 · 《人纪·神农本草经》上经第七十七味，讲解（PDF 第 230 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"越简单越正确","c":"讲义讲「一个极精的判断」：「**《药征》他讲得很简单：主治发黄，任何的发黄都可以治——越简单的叙述越正确。****所以发黄，黄你就想到茵陈。****当然也不是说只开一味茵陈在里面哪，有个复方在里面；这个茵陈是其中一个去黄很重要的药物。****所以可能你们遇到的是急性肝炎、B 型肝炎或 C 肝、或者是肝硬化肝癌，或者是胆结石；凡是看到黄，通通可以使用茵陈。**」\n\n**【极精】越简单越正确**\n\n```\n《药征》「主治发黄」三个字\n  → 概括全部\n```\n\n**「越简单的叙述越正确」——「这是最精的判断法。」** ✓✓","o":"RJ-2126 · 《人纪·神农本草经》上经第七十七味，讲解（PDF 第 231 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"杜若已经失传","c":"【本经原文】「**味辛微温，主胸胁下逆气，温中风，入脑户，头肿痛，多涕泪出；久服益精明目，轻身；一名杜衡。**」【主治】「**杜衡主治发热头痛，能催吐，近世用者不多。**」【括要】「**下气杀虫，利小便，发汗通经；将根末吹入鼻中，能做轻嚏。**」讲义：「**现在这个药，很少很少人会去使用它，用的不多了。****那这个诸位可以看一看就好了；《神农本草经》里面有好些药现在已经没有人认得了。**」\n\n**【极精】杜若 = 失传（又一例）**\n\n```\n本经有载 → 无人认得\n```\n\n**「好些药已经没人认得」——「这条与 n196药随医亡」、n201「析蓂子」同一主题。** ✓✓","o":"RJ-2127 · 《人纪·神农本草经》上经第七十八味「杜若」，原文及讲解（PDF 第 231 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"沙参的本草条目","c":"【本经原文】「**味苦微寒，主血积，惊气，除寒热，补中益肺气；久服利人。**」【性味】「**味甘苦，性微寒，无毒（色白）。**」【主治】「**沙参为清补肺气要药，功能清肺中之热，祛肺中之痰，补肺中之气，治久咳，退邪热，安神；南沙参力减。**」【甄权】「**去皮肌浮风，疝气下坠；治常欲眠，养肝气，宣五脏风气。**」【用量】「**普通钱半至三四钱。**」【禁忌】「**脏腑无实热，肺虚客寒作嗽者均忌；反藜芦，恶防己。**」\n\n**【极重要】沙参的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘苦/微寒（色白入肺）** |\n| **主治** | **清补肺气/清肺热/祛痰** |\n| **禁** | **肺虚客寒/反藜芦** |\n\n**「色白入肺，这是最直观的取象」** ✓✓","o":"RJ-2128 · 《人纪·神农本草经》上经第七十九味「沙参」，原文（PDF 第 231–232 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"肺寒用人参，肺热用沙参","c":"原文【元素】「**肺寒者用人参，肺热者用沙参；故举凡属肺家有虚热，嗽痰咳血，潮热似痨症，用之甚佳。****如属风寒初客肺，浊痰未成，此时宜解表为先。**」\n\n**【极重要】肺寒用人参，肺热用沙参**\n\n```\n肺寒（虚寒）→ 人参\n肺热（虚热）→ 沙参\n风寒初客（痰未成）→ 先解表\n```\n\n**「一寒一热，两味对药」——「这是最精的一寒一热。」**要点：**这一条极重要，它与 n196「人参为王」形成对照** ✓✓","o":"RJ-2129 · 《人纪·神农本草经》上经第七十九味，原文引张元素（PDF 第 232 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"五脏制衡如五权分立","c":"讲义讲「一个极重要的系统观」：「**任何能够治肺的、任何能够滋肺的、能够补肺的，都能够制肝、都能够控制肝。****五脏的相生相克，为什么不单单说它相生还有相克啊、相侮？为什么？就是因为有生克这种制化的关系，所以五脏是很均衡的存在，它的功能就会很好；有一个脏不行了，其他就会压过来。****就像现在五权分立制衡、互相制衡，就是系统要很好、人的系统要很好的话，要制衡得很好。****任何对肝脏很好的，都会对脾脏很好；任何对脾脏很好的都会对肾脏很好；任何对肾脏很好的都会对心脏很好；任何能对心脏很好的都能对肺脏很好。**」\n\n**【极重要】五脏制衡（五权分立）**\n\n```\n肺好 → 肝好 → 脾好 → 肾好 → 心好 → 肺好\n```\n\n**「克不是不好，而是制衡」——「这条与 n66破坏的力量大于建设」、n180「五脏将绝」同一主题。**要点：**这一条极重要，它是「克的正面解释」** ✓✓","o":"RJ-2130 · 《人纪·神农本草经》上经第七十九味，讲解（PDF 第 232 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"沙参只是事后调理","c":"讲义讲「一个极重要的分层」：「**实际上，我们真正在治疗肺、肺科的病人的时候，人参沙参这种药对我来说都只是事后调理。****因为病已经治好了，调理的时候我开点药给他。****真正在治病的时候，像人参、沙参我都用不上的；我们治疗肺啊，再严重的，我都用不到这种药。****我们都用经方，很好的经方。**」\n\n**【极重要】沙参 = 事后调理**\n\n```\n治病：经方（寒热极端）\n调理：沙参 / 人参\n```\n\n**「治病用不到滋补药」——「这是最精的治病/调理二分。」**要点：**这一条极重要，它与 n196「人参在南方不太会用」、n200「轻可去实」同一体系** ✓✓","o":"RJ-2131 · 《人纪·神农本草经》上经第七十九味，讲解（PDF 第 233 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"石龙刍泻心经热","c":"【本经原文】「**味苦微寒，主心腹邪气，小便不利，淋闭，风湿，鬼注，恶毒；久服补虚羸，轻身，耳目聪明，延年；一名龙须草。**」【主治】「**龙须草为泻心经之热，通利小肠膀胱要药，主治小便不通，小便带血；茎中热痛及淋闭。**」【禁忌】「**小便不通不因于热者勿用。**」讲义：「**这个龙须草是泄心经的药、泄心经心脏，这个心经的热，能够通利小肠。**」\n\n**【极精】石龙刍 = 泻心经热 → 通小肠**\n\n```\n心经热 → 小肠 → 膀胱（小便）\n```\n\n**「心热往下走到小肠」——「这条与 n77心移热于小肠」同一主题。**要点：**须「标」**：**「小便不通须先排除①前列腺增生；②尿潴留（急性须导尿）；③结石；④感染」** ✓✓","o":"RJ-2132 · 《人纪·神农本草经》上经第八十二味「石龙刍」，原文及讲解（PDF 第 233 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"王不留行连国王的命令都不听","c":"【本经原文】「**味苦平，主金创止血，逐痛出剌，除风痹内寒；久服轻身耐老。**」【产地】「**处处有之，为一年生草本植物；因其性走而不守，虽有王命，不能留行，故名之。**」【主治】「**王不留行为行血要药，走血分通血脉，行月经，下乳汁，催生定痛，治金疮。**」【禁忌】「**走而不守，血症慎用，孕妇忌之。**」讲义：「**王不留行的意思就是：过去那部队作战，国王的命令你都要听；那你不听就砍头啦。****这个王不留行是，它连国王的命令都不听，它管他的，就走掉啦、就是力量很强。****比如说，老师我有个刺，肉刺刺在里面、外面的根断掉了，找不到，刀子又挖不进去，怎么办？王不留行，下去的时候把它推出来。****它意思是这个药连国王的命令都不听，你一吃它就只管治，你说停、它都不停。**」\n\n**【极重要】王不留行 = 连国王的命令都不听**\n\n```\n走而不守 → 活血力量极强\n  → 肉刺能推出来\n  → 乳癌/子宫瘤/卵巢瘤\n```\n\n**「药名即药性」——「这是最精的命名。」**要点：**须「强「标」**：**「①孕妇忌；②出血倾向/抗凝同用须慎；③穿山甲属保护物种，禁用（CITES附录I）」** ✓✓\n\n**极重要！！\"不「通则痛\"** ✅✓\n- **\"可以催生定痛、可以止痛；任何的痛，如果不通则痛\"** ✓✓\n- **\"你有淤血淤到、气堵到，淤血淤到，它就会痛；那你王不留行下去，活血化瘀的、行血的力量很强，吃了淤血就没有了、没有淤血的话痛就去掉了\"** ✓✓\n\n**【极精】\"不「通则痛\"** ✅✓","o":"RJ-2133 · 《人纪·神农本草经》上经第八十五味「王不留行」，原文及讲解（PDF 第 236 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"升麻的本草条目","c":"【本经原文】「**味甘辛，主解百毒，杀百老物殃鬼，辟温疾障邪气毒蛊，入口皆吐出，中恶腹痛，时气毒疠，头痛，寒热，风肿诸毒，喉痛口疮；久服不夭。**」【性味】「**味甘苦，性平无毒。**」【主治】「**升麻为升阳散毒要药，功能升清气，散浊邪，治斑疹疮毒，时气寒热，阳明胃经风邪。**」【好古】「**牙根浮烂恶臭，太阳鼻衄，为疮家圣药。**」【用量】「**普通八分至一钱半。**」【禁忌】「**凡吐衄多痰，阴虚火动，气逆呕吐，惊悸怔忡癫狂等病，均忌；误用多致危。**」【容川】「**升麻味甘，能升脾胃之气；其能升之理则因根中有孔道，引水气上达于苗，故性主升；然无四散之性，因为是根之性；升麻根大于苗，故根之得气也厚，故专取其根。**」\n\n**【极重要】升麻的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘苦/平** |\n| **主治** | **升阳散毒/斑疹/阳明风邪** |\n| **禁** | **吐衄/阴虚火动/气逆** |\n\n**「疮家圣药」是升麻最重要的定位** ✓✓","o":"RJ-2134 · 《人纪·神农本草经》上经第八十六味「升麻」，原文（PDF 第 237 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"阳明风邪在脸","c":"讲义讲「一个极具体的部位」：「**升麻是升阳散毒的要药，阳下坠能够升阳；那脸上的阳明经的风邪，脸上的斑点——比如说脸上的阳明经的位置，脸在这边，这个眼睛、脸、嘴巴、耳朵，阳明经在这个地方**（头维下关颊车迎，承泣四白巨髎）**这些位置上长了红斑，都可以用这个升麻，外敷内服都可以。****过去小孩子呢发痘疮啊什么，用升麻泡水调调水，用那个粘在伤口上都很好用的；那过去呢牙根都烂掉了、牙龈都烂掉了，腐烂了都可以用升麻。**」\n\n**【极精】阳明风邪在脸**\n\n```\n阳明经（头维/下关/颊车/迎香/承泣/四白/巨髎）\n  → 脸上红斑 → 升麻（内服/外敷）\n```\n\n**「脸上阳明经长红斑，就用升麻」——「这是最具体的部位。」** ✓✓","o":"RJ-2135 · 《人纪·神农本草经》上经第八十六味，讲解（PDF 第 237 页）。"},{"t":"神农本草经·上经：景天（续）、茵陈、杜若、沙参、王不留行、升麻","h":"疮家圣药","c":"讲义讲「一个极重要的定位」：「**所以升麻是一个疮家的圣药——身上生疮、恶疮、脓疮，牙齿牙龈的毁损，通通都可以使用升麻。**」\n\n**【极重要】升麻 = 疮家圣药**\n\n```\n疮（恶疮/脓疮/牙龈毁损/痘疮）\n  → 升麻\n```\n\n**「疮家圣药，一句话就够」——「这是最精的定位。」**要点：**须「标」**：**「牙龈腐烂/恶臭须先排除①牙周病；②口腔癌；③白血病/粒细胞缺乏；④汞/铅中毒」** ✓✓","o":"RJ-2136 · 《人纪·神农本草经》上经第八十六味，讲解（PDF 第 237–238 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"胡麻的本草条目","c":"【本经原文】「**味甘寒，主五藏邪气，风寒湿痹，益气，补脑髓，坚筋骨；久服耳目聪明，不饥不老增寿；乃巨胜之苗也。****今称胡麻，此植物叶名青蘘，种子名胡麻。**」【主治】「**胡麻主长肌肉，补虚羸，滋润五脏，利大小肠；其油亦作解毒用。**」【别录】「**胡麻坚筋骨，明耳目，耐饥渴；疗金疮止痛，及伤寒温疟，大吐后虚热羸困。**」【廷飞】「**炒食不食，风病人久食，则步履端正，语言不蹇。**」【用量】「**普通一钱至三钱。**」【禁忌】「**多用为服食，少以入药；如入药，大便溏泄者忌之。**」\n\n**【极重要】胡麻（青蘘）的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒** |\n| **主治** | **长肌肉/补虚羸/润五脏/利大小肠** |\n| **禁** | **大便溏泄** |\n\n**「叶名青蘘，种子名胡麻」是一物二名** ✓✓","o":"RJ-2137 · 《人纪·神农本草经》上经第八十七味「青蘘」，原文（PDF 第 238–239 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"仁剂有油能利肠","c":"讲义讲「一条极清晰的通则」：「**胡麻子也可以有油浸在里面；主治呢胡麻长肌肉、补虚羸，滋润五脏、利大小肠。****任何有油脂的都会利大小肠，比如说当归，拿了当归有油脂；麻子仁、酸枣仁，仁剂的都有油脂。****只要有油脂的通通可以会利肠子，比如说那个芝麻也会利肠，因为它里面有油在里面。**」\n\n**【极重要】仁剂有油 → 利肠**\n\n```\n当归 / 麻子仁 / 酸枣仁 / 芝麻\n  → 含油 → 润肠\n```\n\n**「有油就润肠」——「这条与 n188大黄后下」、n204「肉苁蓉滑大肠」同一体系。**要点：**这一条极重要，它是「润下的机制」** ✓✓","o":"RJ-2138 · 《人纪·神农本草经》上经第八十七味，讲解（PDF 第 238–239 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"姑活是冬葵子","c":"【本经原文】「**味甘温，主大风邪气，湿痹寒痛；久服轻身益寿耐老；一名冬葵子。**」【性味】「**冬葵子及叶、根味皆甘，性滑。**」【主治】「**为冷滑解热药，主滑胎易产，治热痢，通尿疗淋。**」【别录】「**疗妇人乳内闭、肿痛；根治恶疮疗淋，利小便。**」【思邈】「**此脾之菜也，宜脾，利胃气，滑大肠。**」【用量】「**一钱至三钱，大剂一两。**」【禁忌】「**无，可做菜肴。**」讲义：「**主治是解热冷滑解热的药，滑胎，就是胎儿难产不下，我们可以用冬葵、用姑活，这个能够助产。**」\n\n**【极重要】姑活 = 冬葵子（滑胎助产 + 通乳）**\n\n```\n冬葵子（性滑）\n  → 滑胎易产 / 通乳 / 通尿疗淋\n```\n\n**「性是滑的，所以能滑胎」——「滑性的药就是润滑。」**要点：**须「强「标」**：**「①滑胎助产不可自行用；②难产须产科急诊；③孕妇用药须咨询」** ✓✓","o":"RJ-2139 · 《人纪·神农本草经》上经第八十八味「姑活」，原文及讲解（PDF 第 239 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"通乳最快是葱白","c":"讲义讲「一个极生活化的技巧」：「**过去中医呢，这个女孩子第一胎的时候生完、妇女生完小孩以后喂母乳，喂母乳说『诶，奶排不出来』；那有很多奶水，就奶头那边那个孔窍没有开，奶水排不出来，小孩子在哭、吸又吸不出来。****怎么处理？这个冬葵，冬葵很好效果。****有一种速度最快的：那个葱啊，葱白嘛，然后你切一段葱白的地方，你拿那个葱白在乳头那边涂一下，反过来须须又把它刷一刷，砰、马上奶水就喷出来了。****速度就那么快，因为它是辛香发散的，葱白是辛。****当然你可以再去煮冬葵呀；你要记得擦干净，不然小孩子吃到不是奶是葱、辣死了。**」\n\n**【极精】通乳最快 = 葱白 + 葱须**\n\n```\n奶结（乳头孔窍未开）\n  → 葱白涂 + 葱须刷\n  → 立刻通\n```\n\n**「辛香发散，马上喷出来」——「须强标：不能替代哺乳指导。」**要点：**须「强「标」**：**「①产后乳汁不下须先排除①乳头内陷/破裂；②乳腺炎（红肿热痛 + 发烧）；③衔接不当；④须正规哺乳指导 + 通乳（泵/按摩）；⑤葱白刺激有皮炎风险」** ✓✓","o":"RJ-2140 · 《人纪·神农本草经》上经第八十八味，讲解（PDF 第 239–240 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"三味药已经失传","c":"【本经原文】「**别羁：味苦微温，主风寒湿痹，身重四肢疼酸，寒邪历节痛。**」【本经原文】「**屈草：味苦，主胸胁下痛邪气、腹间寒热，阴痹；久服轻身益气耐老；因方药无人用，今无人识者。**」【本经原文】「**淮木：味苦平，主久咳上气，伤中虚羸，女子阴蚀漏下，赤白沃。**」讲义：「**第 89 呢，别羁，现在已经没有人用了。****还有那个屈草；还有呢 91 淮木，这三味药到现在也是无人能识了，这是很可惜的。**」\n\n**【极重要】三味失传**\n\n```\n别羁 / 屈草 / 淮木\n  → 无人能识\n```\n\n**「这三味药到现在也无人能识」——「这是最诚实的文献学记录。」** ✓✓","o":"RJ-2141 · 《人纪·神农本草经》上经第八十九至九十一味，原文及讲解（PDF 第 240 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"抵挡汤是山东话","c":"讲义讲「一个极有趣的语言学」：「**因为有的跟当地的方言有关系，就好像那个经方里面我们叫抵挡汤。****其实你仔细想想看这个为什么叫抵挡？因为山东话『抵挡抵挡』就是『唯一、独一无二』，没有其他的方子可以这样。****结果把他看成抵挡，就实际上有语言的关系嘛。****所以读中医还要有点语言的天分；你要语言的天分很简单，多看看相声。**」\n\n**【极重要】抵挡汤 = 山东话「唯一」**\n\n```\n抵挡（山东话）= 唯一、独一无二\n  ≠ 抵挡（抵抗）\n```\n\n**「读中医还要有点语言的天分」——「这是最精的方言与药名。」** ✓✓","o":"RJ-2142 · 《人纪·神农本草经》上经第八十九至九十一味，讲解（PDF 第 240 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"桂枝的本草条目","c":"【本经原文】「**味辛温，主上气咳逆，结气喉痹吐吸，利关节，补中益气；久服通神轻身不老；一名肉桂，一名桂枝，一名桂心。**」**桂之供药有两种：一曰菌桂，又称小桂，其皮为肉桂，或称筒桂；一曰牡桂，又称大桂，或单称桂，其皮为官桂，其枝为桂枝。**【主治】「**桂枝为发表解肌要药，主温经通脉，表虚中风，治手足痛风，伤寒头痛，无汗能发，有汗能止，行肺气，散寒邪，调和营卫，横通肢节。**」【药征】「**主治冲逆也，旁治奔豚头痛，发热恶风，汗出身痛。**」【用量】「**普通三分至钱半。**」【禁忌】「**凡阴虚火炎，温病大热，喉症血症均忌。**」\n\n**【极重要】桂枝的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛甘/温/无毒** |\n| **主治** | **发表解肌/温经通脉/降冲逆** |\n| **禁** | **阴虚火炎/温病大热/血症** |\n\n**「桂之供药有两种」是最重要的分类** ✓✓","o":"RJ-2143 · 《人纪·神农本草经》上经第九十二味「牡桂」，原文（PDF 第 240–241 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"桂枝与白芍","c":"讲义讲「一个极精的一对」：「**那如果说我们把动脉跟静脉：动脉是从心脏到四肢末梢去的，静脉是从四肢末梢回心脏的。****如果我们把那个血液循环系统切成两半，桂枝的话、主的就是动脉。****那另外一个相对的就是白芍，白芍就是芍药。****白芍呢就是阴药、走静脉；所以这两个是互相呼应的药，这是阴药、这是阳药。****平常我们用的时候剂量同等、等量；但是我们要阳比较强呢、这个人阳虚，我们把阳药加重一点；阴比较虚，我们把阴药加重点，阴阳就平衡出来了。**」\n\n**【极重要】桂枝 vs 白芍**\n\n```\n桂枝 → 动脉 → 阳\n白芍 → 静脉 → 阴\n  → 等量则平，偏则调\n```\n\n**「一对阴阳药」——「这条与 n196白芍静脉」、n172「桂枝管手」同一体系。**要点：**这一条极重要，它是「循环的一对」** ✓✓","o":"RJ-2144 · 《人纪·神农本草经》上经第九十二味，讲解（PDF 第 241 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"桂枝就是肢","c":"讲义讲「一个极精的取象」：「**中药用的时候，用到枝；枝的时候心里想就是这个肢，同、你要有这个想法，就是这个肢的意思。****所以任何人只要说四肢上、手脚四肢上的问题，你第一个就要想到桂枝，因为它是枝。****第二个它是血红色的，它性很辛、香，它味很重的。****只要肌肉的问题通通都会使用桂枝，心脏的问题也会使用桂枝。**」\n\n**【极精】桂枝 = 肢（取象）**\n\n```\n枝 → 肢 → 四肢\n  → 四肢问题第一味\n```\n\n**「枝就是肢」——「这是最精的取象。」** ✓✓\n\n**极重要！！\"张「仲景用桂枝占经方 6%\"** ✅✓\n- **\"张仲景用桂枝用得非常的广，金匮伤寒的处方里面有 6% 都有桂枝在里面\"** ✓✓","o":"RJ-2145 · 《人纪·神农本草经》上经第九十二味，讲解（PDF 第 241 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"无汗能发，有汗能止","c":"讲义讲「一个极重要的双向」：「**它说主温经通脉、表虚中风，表虚的人可以用；无汗能发汗，有汗能够止汗。****所以中药是互相的，汗太多我们用桂枝，没有汗我们用桂枝也可以发汗。****行肺气，能够散寒邪，用途非常的广。**」\n\n**【极重要】无汗能发，有汗能止**\n\n```\n表虚中风\n  → 无汗：桂枝发汗\n  → 有汗：桂枝止汗\n```\n\n**「汗太多、没汗都用桂枝」——「这条与 n182双向调节」同一主题。**要点：**这一条极重要，它是「双向调节」** ✓✓","o":"RJ-2146 · 《人纪·神农本草经》上经第九十二味，讲解（PDF 第 241 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"奔豚的机制","c":"讲义讲「一个极生动的病案」：「**病人跟我讲：那个胸口、哇，一直不断跳动，心脏跳的很厉害、停不下来，好像心很慌、好像心脏要从胸口、嘴巴里面跳出来；然后同时呢好像有人灌热水灌到身体里边去，热一直冲上来。****比如说你心脏在这边、这个血进去出来，这个是肚脐、这大肠在这边；有一天呢你有便秘，这个人平常就是大便不是很好。****结果很多人憋到家、快到家了、赶快要上厕所；结果儿子要逗妈妈、吓妈妈就躲在门后面，妈妈一进来、儿子一跳出来一叫，妈妈吓一跳。****受到惊吓的时候，妈妈一紧张，那个气从这边大肠到肝脏呢有一个血管；进了这个血管再从这入肝脏的血管，木生火。****大便的那个沼气，本来进不了血管的，结果跑到血管里面到心脏。****那心脏说『你是沼气、大便气怎么会跑到我这里来』；心脏在抗拒它，一抗拒的时候心脏跳动加速很快。****这个时候我们要用桂枝； accelerating 那我们要加重桂枝，桂枝的喷射的力量把你赶到四肢末梢去。**」\n\n**【极重要】奔豚 = 便秘 + 惊吓 + 沼气入心**\n\n```\n便秘 + 惊吓 → 沼气入血 → 心抗拒 → 奔豚\n  → 桂枝加桂（喷射到四肢）\n```\n\n**「沼气跑到心脏，心脏抗拒就奔豚」——「须强标：奔豚须先查ECG。」**要点：**须「强「标」**：**「①奔豚现代对应：①阵发性心动过速/室上速；②焦虑发作（恐慌）；③胃食管反流；④须立即查 ECG/甲状腺/贫血；⑤不可只用中药」** ✓✓","o":"RJ-2147 · 《人纪·神农本草经》上经第九十二味，讲解（PDF 第 242–243 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"出血减桂枝","c":"讲义讲「一个极实用的禁忌」：「**那禁忌呢，有的时候血症、出血很多的时候，我们桂枝的量要比较少。****因为桂枝不能止血，它辛甘发散嘛；病人正在出血、正在大量出血的时候，你这边加桂枝，这不火上加油、血会出来更多。****因为它是辛甘发散的药，不是收血的药、收敛血的药；你可以加些敛血的药、止血的药。**」\n\n**【极精】出血减桂枝**\n\n```\n出血 → 桂枝减量（辛甘发散）\n  → 加止血药\n```\n\n**「火上加油」——「这条与 n202生用破血」、n205「蒲黄炒黑止血」同一逻辑。** ✓✓","o":"RJ-2148 · 《人纪·神农本草经》上经第九十二味，讲解（PDF 第 243 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"肉桂的本草条目","c":"【本经原文】「**味辛温，主百病，养精神和颜色，为诸药先聘通使；久服轻身不老，面生光华媚好，常如童子；又名肉桂。**」【性味】「**味辛甘，性大热，有小毒。**」【主治】「**肉桂为温补要药，主扶火助阳，温中逐寒，能引火归元，治上热下寒，破沉寒痼冷，疗霍乱转筋，心腹诸痛，疝瘕奔豚。**」【好古】「**补命门不足，能益火消阴。**」【元素】「**补下焦不足，治沉寒痼冷之病；春夏为禁药，秋冬下部腹痛非此不能止。**」【汪昂】「**木得桂而枯，又能抑肝风而扶脾土。**」【用量】「**普通三分至一钱。**」【禁忌】「**忌生葱石脂及火炙；凡阴虚内热、液少口干者慎用。**」\n\n**【极重要】肉桂的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛甘/大热/有小毒** |\n| **主治** | **温补/引火归元/破沉寒痼冷** |\n| **禁** | **阴虚内热/春夏** |\n\n**「引火归元，治上热下寒」是肉桂最精的定位** ✓✓","o":"RJ-2149 · 《人纪·神农本草经》上经第九十三味「菌桂」，原文（PDF 第 243–244 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"肉桂点火，附子固火","c":"讲义讲「一个极重要的配伍」：「**肉桂呢就是其中一个温补命门火的一个药。****命门火衰的时候，我们中医认为说命门火等于是生命的源头；所以当我们在危急救难的时候、大起重症的时候，我们要把命门火点起来。****你可以假定命门火就是个蜡烛；油灯尽枯的时候，我们中药有很多点命门火的东西。****点了火以后，你要让火固定住啊，不能点得火很大、一下子灭掉。****只要这个命门火在，人就不会死。****所以你看后面，张仲景用肉桂的时候他旁边用附子——为什么？你光靠一个肉桂下去没有用；肉桂下去点火啦，附子来固阳、固住它不会往外散。**」\n\n**【极重要】肉桂点火，附子固火**\n\n```\n肉桂（点火命门）→ 附子（固住不散）\n  → 元阳真气\n```\n\n**「点火 + 固火」——「这条与 n202壮阳 + 固阳」同一逻辑。**要点：**须「强「标」**：**「①肉桂 + 附子是峻烈温阳药，须辨证 + 监护；②附子有乌头碱毒性；③不可自行服；④『命门火固在就不死』是夸张，须否定；⑤癌症须规范治疗」** ✓✓","o":"RJ-2150 · 《人纪·神农本草经》上经第九十三味，讲解（PDF 第 244–246 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"肉桂生用冲服","c":"讲义讲「一个极具体的服法」：「**那肉桂呢，一般我们生用、冲服；比如说我们开个处方，我们需要去用肉桂，我们将肉桂打粉。****肉桂放下去煮太可惜啊，你煮的味道都发散掉了，因为它是辛甘发散。****比如肉桂粉，吃的时候撒上去、喝下去。****哎，意大利人大概听到说这个补肾、补命门火，所以卡布其诺他吃那个咖啡加点肉桂粉吃下去。**」\n\n**【极精】肉桂生用冲服**\n\n```\n肉桂 → 打粉冲服（不煮，煮则辛散尽失）\n```\n\n**「煮就发散掉了」——「这条与 n188大黄后下」、n202「青黛不煮」同一体系。** ✓✓","o":"RJ-2151 · 《人纪·神农本草经》上经第九十三味，讲解（PDF 第 245 页）。"},{"t":"神农本草经·上经：青蘘（胡麻）、姑活（冬葵子）、牡桂（桂枝）、菌桂（肉桂）","h":"桂的三个部位三个功","c":"讲义讲「一个极清晰的分工」：「**我们在用肉桂，这里最主要的是大家要能够分清楚：什么时候用肉桂，什么时候用桂枝，什么时候用桂皮。****肉桂——肾脏、命门火衰的时候。****桂皮呢，它主上升，皮嘛、上升。****桂枝呢主血脉不通；啊我手麻了、老师我手都麻了、脚麻了——桂枝。****那如果是心脏闷痛，你不会用肉桂吧？用桂枝嘛，因为桂枝对心脏，它直接入心脏。**」\n\n**【极重要】桂的三个部位三个功**\n\n| 部 | 功 |\n|---|---|\n| **肉桂（皮/小桂）** | **命门火** |\n| **桂皮** | **上升** |\n| **桂枝（枝/大桂）** | **血脉不通/心** |\n\n**「同一株，三个部位三个功」——「这是最精的部位分工。」** ✓✓\n\n**极精！！\"六「味vs桂附八味（寒热体质）\"** ✅✅\n- **\"那这个六味地黄丸就是六种药：山茱萸、淮山、熟地（三补三泄）、丹皮、泽泻、茯苓\"** ✓✓\n- **\"加上肉桂跟炮附子，那个肉桂炮附子就是体质比较虚寒的人\"** ✓✓\n- **\"只要有个常常下利、然后恶寒、怕冷、喜欢喝温水、晚上睡觉有点冷、脚是冷的，这已经是讲『告诉你我要桂附八味丸』\"** ✓✓\n- **\"那我大便便秘、嘴巴口渴、燥渴、我喜欢喝冷水，你要吃滋补的药，给他开六味地黄丸\"** ✓✓\n- **\"千万不要开反的；开反了便秘者恒秘、更秘啊\"** ✓✓\n\n**【极重要】六味 vs 桂附八味（寒热体质）**\n\n| 体 | 方 |\n|---|---|\n| **虚寒（下利/怕冷/脚冷/喜温水）** | **桂附八味** |\n| **燥热（便秘/口渴/喜冷水）** | **六味地黄** |\n\n**\"这是最精的一寒一热两方\"** ✅✅\n\n**须「标」**：**「六味/桂附须辨证；不可自行服（高血压/糖尿病/肾病须咨询）」** ✓✓","o":"RJ-2152 · 《人纪·神农本草经》上经第九十三味，讲解（PDF 第 245–246 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"风寒湿三药合治","c":"讲义讲「一个极重要的配伍」：「**比如说我们开炮附子，因为炮附子是祛寒的，桂枝是祛风的，白术祛湿的。****所以我们辨证很重要啊，一看风寒湿三个合成一个病，你要开祛风、祛寒、祛湿三种药合在一起，它才能够入药、才能够治病。****老师，你开了祛风袪湿的就是没有开祛寒的，病就没有去。****老师，这几味药这么胡乱弄在一起，如果说它们都混在一起、说那个药性都不均匀的话怎么办？甘草，我们加甘草下去嘛。****甘草主缓，甘主和——好啊，你们大家不要吵喔，共同待在一个汤剂里面，大家不要去吵，你去把关节去治好就好了。**」\n\n**【极重要】风寒湿三药合治**\n\n```\n风 → 桂枝\n寒 → 炮附子\n湿 → 白术\n和 → 甘草\n```\n\n**「缺一味，病不去」——「这条与 n188四味缺一不可」、n202「四君子」同一体系。**要点：**这一条极重要，它是「配伍的完整性」** ✓✓","o":"RJ-2153 · 《人纪·神农本草经》上经第九十二味，讲解（PDF 第 246 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"痛风不等于风湿关节炎","c":"讲义讲「一个极重要的分辨」：「**那老师，那还有痛风，那不一样，我们还有别的方法。****因为热证呀或怎么样，处方不一样。****还有到膝盖去的，那老师，那膝盖痛怎么办？这个处方就稍微不一样。**」\n\n**【极精】痛风 ≠ 风湿关节炎**\n\n```\n风湿关节炎（寒湿）→ 桂枝+炮附+白术\n痛风（热证/尿酸盐）→ 另方\n膝痛 → 又另方\n```\n\n**「方随部位、随病性变」——「这是最精的分辨。」** ✓✓","o":"RJ-2154 · 《人纪·神农本草经》上经第九十二味，讲解（PDF 第 246 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"处方是自然天成的","c":"讲义讲「一个极重要的处方观」：「**所以诸位以后，我们现在学了本草经，以后要做加减，你随时设计一个方子就出来了，马上就跑出来了。****处方是自然天成的；你没有治好病，是因为你的方子不对，并不是药和原理没有效。****所以诸位以后辨证一定要很熟。**」\n\n**【极重要】处方 = 自然天成**\n\n```\n辨证熟 → 方自出\n病不愈 = 方不对（非药无效）\n```\n\n**「处方是自然天成的」——「这是最精的方随证出。」** ✓✓","o":"RJ-2155 · 《人纪·神农本草经》上经第九十二味，讲解（PDF 第 246 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"辨证论治对辨验血报告","c":"讲义讲「一个最重要的批评」：「**我们这个外面的一般的，很多的中医呢，大部分他不是辨证论治，他是辨、辨那个验血报告论治。****『嗯，这个胆固醇太高了……三酯太高』这样子的，『PSA 太高了』，开个降摄护腺的，诸如此类的。****我们正统中医不是这样子，什么 PSA 我们不看它；病名全部统统舍掉，完全辨证论治。****所以我们在这里统统讲的是治证。**」\n\n**【极重要】辨证论治 vs 辨验血报告**\n\n| 正 | 错 |\n|---|---|\n| **辨证论治（症）** | **辨验血报告（病名）** |\n\n**「病名全部舍掉」——「这条与 n138可以看报告，但要忘掉病名」同一主题。**要点：**须「标」**：**「这是派系立场；现代检查有明确价值（如PSA筛查、血脂管理），不可全盘舍弃」** ✓✓","o":"RJ-2156 · 《人纪·神农本草经》上经第九十二味，讲解（PDF 第 247 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"治癌的四大原则","c":"讲义讲「一个极重要的大原则」：「**所谓新的、陈的，新陈代谢是新的进去、要换旧的出来；所以你吃下去 24 小时一定要排出去，那你吃下去到 48 小时还没有排出去，这个东西在身体里就是毒。****你在治疗癌症，里面还有毒在里面，你是不是同时要把它排掉？****我们不管他里面是什么病，你在治它的时候，基本上的大原则：第一个保持大小便通畅；第二个保持他胃口很好；第三个想尽办法让他睡；第四个想尽办法让他开心——你已经赢了。**」\n\n**【极重要】治癌四大原则**\n\n```\n1. 大小便通畅\n2. 胃口好\n3. 睡得好\n4. 开心\n→ 已赢\n```\n\n**「四个做到，你已经赢了」——「这条与 n173六大健康标准」、n168「只要有积马上就去掉」同一体系。**要点：**这一条极重要，它是「治癌的四大原则」** ✓✓\n\n**须「强「标」**：**「癌症须规范治疗（手术/化疗/靶向/免疫）；中医是辅助，不可替代」** ✓✓","o":"RJ-2157 · 《人纪·神农本草经》上经第九十二味，讲解（PDF 第 248 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"阳药升提","c":"讲义讲「一个极重要的判据」：「**凡是阳药，这种肉桂都是阳药；阳药呢都有升提的功能。****所以你那疮本来在皮肤之上，结果这个皮肤下陷一块、疮长在下面——人家在皮肤上突起来，这个很好治；那皮肤下陷、就是里阳不够了、里虚掉了，我们用阳药去升提它，都可以治好。****就好像如果是一个乳房硬块的病人……那如果说她是第一期或第二期，那个乳头整个凹陷下去了，但是伤口没有出来；这个时候你要让它乳头抬出来，阳就回头了。****不是只有皮肤上的疮凹下去你看得懂，那乳头不见了你也看不懂了；人要依此类推。**」\n\n**【极重要】阳药升提 → 乳头抬起 = 好现象**\n\n```\n里阳不足 → 疮/乳头下陷\n阳药升提 → 突起 = 好转\n```\n\n**「乳头抬出来，阳就回头了」——「这条与 n203阳器突起=阳还在」同一主题。**要点：**须「强「标」**：**「乳头内陷须先排除①乳腺癌（乳头凹陷 + 橘皮征 + 溢液）；②先天性内陷；③乳腺炎后瘢痕；须乳腺超声/钼靶；不可只服中药」** ✓✓","o":"RJ-2158 · 《人纪·神农本草经》上经第九十二味，讲解（PDF 第 248–249 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"松树四个部位四个功","c":"【本经原文】「**味苦温，主疽恶创，头伤白秃，疥搔风气，安五脏，除热；久服轻身不老延年。**」【性味】「**松脂味苦甘，性温；松子味甘，性微温；松花味甘，性温；松节味苦，性温。**」【主治】「**松脂为袪风寒湿、止痛、生肌、杀虫药；治痈疽恶疮、风痹、死肌、疥癣、蛀齿。****松子为祛风、滋润强壮药；治骨节风痹、气虚头眩、肺燥咳嗽及老人虚闭。****松花为驱风、镇静药；治头眩脑肿。****松节为驱风、止痛药；治历节风痛、风痹、脚弱。**」【用量】「**普通一钱至三钱。**」【禁忌】「**燥热症者忌。**」\n\n**【极重要】松树四味**\n\n| 部 | 功 |\n|---|---|\n| **松脂** | **袪风寒湿/生肌/杀虫** |\n| **松子** | **祛风/滋润/强壮** |\n| **松花** | **驱风/镇静** |\n| **松节** | **驱风/止痛** |\n\n**「一株松树四个部位四个功」——「这是最精的部位分工。」** ✓✓","o":"RJ-2159 · 《人纪·神农本草经》上经第九十四味「松脂」，原文（PDF 第 249 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"松脂琥珀蜜蜡","c":"讲义讲「一个极有趣的同源」：「**这个松树，从树皮旁边的裂缝里面漏出来的油脂，就是我们现在讲的松脂。****如果说这是横木上面结的油脂很大，通通掉到地上、掉到土里面，一埋好几百年、好几千年，那就是琥珀。****如果再浓一点、再密一点，就是所谓的蜜蜡。**」\n\n**【极重要】松脂 → 琥珀 → 蜜蜡**\n\n```\n松脂（新鲜）→ 琥珀（埋地千百年）→ 蜜蜡（更浓）\n```\n\n**「三个都是松树的东西」——「这是最精的同源。」** ✓✓","o":"RJ-2160 · 《人纪·神农本草经》上经第九十四味，讲解（PDF 第 249 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"山猪找茯苓","c":"讲义讲「一个极精的采药法」：「**我们的茯苓是不是在松树下面？要去采茯苓啊，那你怎么知道哪一颗松树下面有茯苓？你不会几万、几千万棵每一棵下面都去刨一下。****那个采药的人眼睛一看就知道这个树下哪一个根、哪一边有茯苓，他一挖下去就中，他绝对不会错。****为什么？因为我们有种动物叫山猪；这个山猪呢，只要有茯苓，它闻到有茯苓的味道啊，就很欲望难忍，所以就去啃。****可是根很深啊，挖不到他就放弃走了。****老天爷都弄好的，采药的师傅一看，有被山猪挖过的，一挖下去、再深一点，就是茯苓了。**」\n\n**【极精】山猪找茯苓**\n\n```\n山猪闻茯苓 → 啃树根 → 挖不到放弃\n  → 采药人见猪坑 → 再深挖 = 茯苓\n```\n\n**「动物指示药材」——「这是最精的民间采药法。」** ✓✓","o":"RJ-2161 · 《人纪·神农本草经》上经第九十四味，讲解（PDF 第 249 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"一剂知二剂已","c":"讲义讲「一个极有力的疗效」：「**那你吃松节，我们有非常多的风湿关节止痛药，一剂知、二剂已的。****我们经方里面用的时候，我在美国真的是痛的病人，那关节、类风湿性，关节都变形了；药一下下去，硬把他救回来。****你不是病人你不知道，哇，那个痛去掉，真的很感激啊。****美国人跟我怎么讲，他说『你这个药给我吃下去，我那个痛能去掉；你如果今天给我说，那堆大便就是我吃的药、我的痛会止掉，我都会吃下去』——你说这个痛到了什么程度。**」\n\n**【极精】一剂知，二剂已**\n\n```\n一剂知（立刻缓解）\n二剂已（痊愈）\n```\n\n**「一堆大便我也吃」——「这是最生动的痛觉写照。」**要点：**须「标」**：**「『温病派没效』是派系立场，须否定（温病学派有明确疗效，如银翘散）\"** ✓✓","o":"RJ-2162 · 《人纪·神农本草经》上经第九十四味，讲解（PDF 第 250–251 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"燥热证几秒判","c":"讲义讲「一个极快的判法」：「**所以燥热证很简单可以判读：病人舌头伸出来苔是黄的，一直在那边喝水，你不用问就知道他是燥热证。****一般肥胖的人比较容易燥热证；脸上比较赤、比较红。****有的时候，即使他是哑巴，一看燥热就结束了！不用开口去问他『你口渴不渴？』****诸位记得：树脂类的东西、脂类的东西，还有子的、子的，还有树节，一般来说燥热的证、它的药是性温的，所以有燥热证的话不要用。**」\n\n**【极精】燥热证几秒判**\n\n```\n① 舌苔黄\n② 一直喝水\n③ 脸赤红\n④ 肥胖\n```\n\n**「哑巴也一看就知道」——「这是最精的快诊。」** ✓✓","o":"RJ-2163 · 《人纪·神农本草经》上经第九十四味，讲解（PDF 第 251–252 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"槐实的本草条目","c":"【本经原文】「**味苦寒，主五内邪气热，止涎唾，补绝伤，五痔，火创，妇人乳瘕，子藏急痛。**」【性味】「**味苦性平，无毒。**」【主治】「**槐花为凉血要药，主五痔肠风，解毒杀虫，凉大肠，润肝燥，治吐衄、崩中、痢疾、漏下。**」【大明】「**主五痔、心痛、眼赤，杀腹脏虫，及皮肤风热、肠风泻血、赤白痢，并炒研服。**」【灵胎】「**清湿火疗疮痔。**」【用量】「**普通一钱至三钱。**」【禁忌】「**病人虚寒作泄，及阴虚血热而非实热者均忌。**」【附录】「**槐角子即槐实，味苦性寒，无毒；主一切热，散一切结，清一切火，治五痔瘘疮（熬膏丸入谷道，日三易）、邪热、妇人乳瘕、子脏急痛、补绝伤、疗火疮、阴疮湿痒、大热难产，能明目补脑。**」\n\n**【极重要】槐实的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦/平（寒）** |\n| **主治** | **凉血/五痔肠风/解毒杀虫** |\n| **禁** | **虚寒作泄/阴虚血热** |\n\n**「一切热、一切结、一切火」是槐实最精的三句** ✓✓","o":"RJ-2164 · 《人纪·神农本草经》上经第九十五味「槐实」，原文（PDF 第 252–253 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"痔疮是久坐加小肠湿热","c":"讲义讲「一个极真实的病因」：「**他说文革的时候我们没有东西吃、还有大跃进的时候也没有东西吃；我那时还小，我们家五个兄弟姐妹，妈妈去槐树采那个槐花、炒来当菜吃。****我说『吃了很好，不会得痔疮』；他说对啊，我们这边都没有人得痔疮。****他们也不会得痔疮，他们都没有坐在那里、都在动。****痔疮是因为长年坐：计程车司机、长途灰狗、美国灰狗 bus 的司机，都有痔疮。****过去我们说痔疮啊，是小肠湿热下注，所以他是湿热的证，槐实呢可以把这个湿热排掉。**」\n\n**【极重要】痔疮 = 久坐 + 小肠湿热**\n\n```\n久坐（司机、办公）→ 痔疮\n机制：小肠湿热下注\n```\n\n**「久坐致痔」——「这条与现代一致（久坐 + 腹压 + 静脉曲张）。」** ✓✓","o":"RJ-2165 · 《人纪·神农本草经》上经第九十五味，讲解（PDF 第 252–253 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"一招半式走江湖","c":"讲义讲「一个极有意思的现象」：「**过去我们学医啊，一招半式走江湖；那有个家族呢，就是他家什么都不会，就是会治痔疮。****那老祖宗就告诫说『我告诉你不要传给别人，传给别人的话你就没饭吃』。****所以他的子孙永远记得这句话，我们永远不讲方子。****不管是内痔外痔，一来就拿槐实膏塞进去，那每个都好了；其实就是槐实膏。**」\n\n**【极精】一招半式走江湖**\n\n```\n一族只传一方 → 专治痔疮\n```\n\n**「专精一方」——「这是最精的专精。」** ✓✓","o":"RJ-2166 · 《人纪·神农本草经》上经第九十五味，讲解（PDF 第 253 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"枸杞的本草条目","c":"【本经原文】「**味苦寒，主五内邪气，热中消渴，周痹；久服坚筋骨，轻身不老。**」【产地】「**处处有之；其子名枸杞，根皮名地骨皮，均入药。**」【性味】「**味甘苦，性平，无毒。**」【主治】「**枸杞子为滋肾养肝要药，生精润肺要药；主五内邪热，周痹风湿，坚筋骨，补精气，治虚劳，明目。**」【别录】「**下胸胁气，客热头痛，补内伤大劳嘘吸，强阴，利大小肠。**」【甄权】「**补精气，诸不足，易颜色，变白，明目安神。**」【用量】「**普通一钱至三钱。**」【禁忌】「**凡有外邪实热，脾虚有湿及肠滑者忌。**」\n\n**【极重要】枸杞的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘苦/平/无毒** |\n| **主治** | **滋肾养肝/生精润肺/明目** |\n| **禁** | **外邪实热/脾虚有湿** |\n\n**「枸杞子 + 地骨皮 = 一树两药」** ✓✓","o":"RJ-2167 · 《人纪·神农本草经》上经第九十六味「枸杞」，原文（PDF 第 253–254 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"红色药入心先润肺","c":"讲义讲「一个极精的治法」：「**平常用的枸杞，中药用，因为它的颜色是红的，这个能够养肺。****我们中医治肺：心是红色的、赤色的，我们治疗心脏的时候，所有红色的药一进来的时候，一定会去润肺。****为什么？因为木火土金水；中医在治疗心脏病，第一个我们要去治金，所以把肺弄好、心脏就会好。****就好像一个修车师傅，引擎有问题，他会去查水箱；水箱就是肺，引擎就是心脏。**」\n\n**【极重要】红色药 → 润肺 → 治心**\n\n```\n红（入心）→ 先润肺（金）\n  → 治心先治肺（水箱 = 肺，引擎 = 心）\n```\n\n**「水箱与引擎」——「这条与 n63肺像水箱」、n142「心阳上逆」同一体系。**要点：**这一条极重要，它是「五行的治法」** ✓✓","o":"RJ-2168 · 《人纪·神农本草经》上经第九十六味，讲解（PDF 第 254 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"淡味红入气分","c":"讲义讲「一个极精的辨味」：「**因为它是红色的，是淡味的红、不是厚味的红。****如果味道很重，我们知道是入血分；它是淡味的，淡味的红它入气分，所以气分它就会入肺脏。****它是润肺的，很好的药。**」\n\n**【极重要】淡味红 = 气分；厚味红 = 血分**\n\n```\n淡味（红）→ 气分 → 肺\n厚味（红）→ 血分\n```\n\n**「味道的厚薄定气血」——「这条与 n182味厚阴、气薄阳」同一体系。** ✓✓","o":"RJ-2169 · 《人纪·神农本草经》上经第九十六味，讲解（PDF 第 254 页）。"},{"t":"神农本草经·上经：桂枝（续）、松脂、槐实、枸杞","h":"枸杞黄芪甘草当茶","c":"讲义讲「一个极简单的日常法」：「**你平常没事在诊所里面、在办公室里面，可以泡一些，拿两片黄芪、几颗枸杞在里面；当然你环境比较好一点，泡一点红参。****你可以泡一些甘草、黄芪，然后枸杞，把它当茶喝；当茶喝的时候，那个气会很旺，讲话就声音就很大。****那我们常常在讲话的人吃吃枸杞，你不用拿起来当花生米、多硬呀、吃得牙齿断掉；泡起来吃、泡在热水里面、当茶泡。**」\n\n**【极精】枸杞 + 黄芪 + 甘草 = 当茶**\n\n```\n黄芪（补气）+ 枸杞（润肺）+ 甘草（和中）\n  → 气旺声大\n```\n\n**「当茶泡，不上火」——「这是最实用的日常法。」** ✓✓","o":"RJ-2170 · 《人纪·神农本草经》上经第九十六味，讲解（PDF 第 254–255 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"侧柏叶硬挤一根能生发","c":"讲义讲「一个极精的取象」：「**这个柏树的叶子生下来好像针形一样，针形的、细细的。****那如果生的这个叶子是这样子，它从那边硬挤一根出来，硬挤一根出来这就是侧柏叶。****因为它是硬从叶子那边硬长了一根出来，你看那个洞、那个很硬嘛、那个树枝是针叶嘛、很硬。****它硬生一根出来，你看利不厉害、很厉害。****我们就用它生发；头发很有名的生发剂就是当归（发为血之余，我们要补血），还有侧柏叶。****利用侧柏叶的性，硬把你头发从旁边生出来；你那个发秃头秃掉了、洞没有了，从旁边硬给你长一根出来。**」\n\n**【极精】侧柏叶 = 硬挤一根（生发）**\n\n```\n侧柏叶 → 从旁边硬生一根\n  → 生发（汉唐 34 号）\n```\n\n**「洞没有了，从旁边硬长一根」——「这是最精的取象生发。」**要点：**须「强「标」**：**「①脱发须先排除①雄激素性脱发（最常见）；②甲状腺异常；③贫血/铁缺；④休止期脱发（压力/产后）；⑤药物（化疗/抗凝）；⑥须皮肤科评估」** ✓✓","o":"RJ-2171 · 《人纪·神农本草经》上经第九十七味「柏实」，讲解（PDF 第 256–257 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"柏子仁的本草条目","c":"【本经原文】「**味甘平，主惊悸，安五脏，益气除湿痹；久服令人悦泽美色，耳目聪明，不饥不老，轻身延年；今名柏子仁。**」【主治】「**柏子仁为滋润要药，主养心气，润肾燥，除风湿，治痹痛，疗恍惚虚损，养肝舒脾。**」【别录】「**疗恍惚虚损，吸吸历节，腰中重痛，益血止汗。**」【甄权】「**治头风腰肾中冷，膀胱冷，浓宿水，兴阳道，去百邪鬼魅，小儿惊痫。**」【用量】「**普通一钱至三钱。**」【禁忌】「**肠滑做泻，膈间多痰，阳道数举，肾家有热，暑湿做泻者均忌。**」\n\n**【极重要】柏子仁的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒** |\n| **主治** | **养心气/润肾燥/养肝舒脾** |\n| **禁** | **肠滑/阳道数举** |\n\n**「滋润要药」是柏子仁最重要的定位** ✓✓","o":"RJ-2172 · 《人纪·神农本草经》上经第九十七味「柏实」，原文（PDF 第 256 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"补脾药多燥柏子仁独润","c":"原文【吴克潜】「**柏子仁不寒不燥，味甘而补，辛而能润，既养心肾，兼益脾肾；凡补脾药多燥，唯此独润而气味清香，故脾约宜之；燥脾药中，加用最良。****著名方剂有柏子养心丸（柏子仁、枸杞子、麦冬、当归、石菖蒲、茯神、元参、熟地、甘草），治劳欲过度，心血亏损，精神恍惚，怔忡惊悸，及健忘遗精等症。**」\n\n**【极重要】补脾药多燥，柏子仁独润**\n\n```\n补脾（白术/苍术）→ 燥\n柏子仁 → 润（脾约 = 大便难）\n```\n\n**「一润一燥」——「这是最精的一润一燥。」**要点：**这一条极重要，它与 n196「白术燥」、n201「署豫（山药）润」形成对照** ✓✓","o":"RJ-2173 · 《人纪·神农本草经》上经第九十七味，原文引吴克潜（PDF 第 256 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"仁剂含油必下利","c":"讲义讲「一个极简单的通则」：「**大家只要记得任何的实，这个实呢都是种子嘛，就都有仁在里面。****那这个长年服用可不可以啊？可以，但是如果你有下痢、虚利的人，一天跑个十几二十次，再吃柏子仁、跑个二三十次，那更麻烦。****所以有虚的人不要吃。****常常便秘的人：老师，我是女孩子，我要漂亮，我有一点便秘，老师你给我配点吃。****当然可以啊；你这个仁如果不炒过，很难吃的；油的东西，炒过、加过温的，是不是变香味？****所以柏子仁炒过跟这个决明子炒在一起，炒完以后才香，放点枸杞，带到上班去吃。**」\n\n**【极精】仁剂含油 → 下利（虚人忌）**\n\n```\n实 = 种子 = 仁 = 含油\n  → 便秘宜 / 下利忌\n```\n\n**「炒过才香」——「这条与 n209仁剂有油」、n207「胡麻利肠」同一体系。** ✓✓","o":"RJ-2174 · 《人纪·神农本草经》上经第九十七味，讲解（PDF 第 256 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"肝燥的四症","c":"讲义讲「一个极清晰的辨证」：「**能够润肝、滋润肝；像我们肝主筋，我们全身的筋、肝主筋。****肝燥的时候，眼睛会跟着很干燥。****肝开窍于眼睛，肝经络过我们睾丸、络过我们的阴部，那肝主全身的筋。****当你太燥的时候，晚上也不好睡觉、眼睛也干燥、没有津液，都可以用柏子仁。****就好像这树木太干了，因为太久没有下雨了，你加一点水到土里面树就会吸收；那个水就是柏子仁、那个树木就是肝脏。**」\n\n**【极精】肝燥的四症**\n\n```\n① 眼干\n② 睡不好\n③ 筋（肝主筋）\n④ 无津液\n→ 柏子仁（水 = 柏子仁，树 = 肝）\n```\n\n**「树木太干，加水」——「这是最精的比喻。」** ✓✓","o":"RJ-2175 · 《人纪·神农本草经》上经第九十七味，讲解（PDF 第 257 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"茯苓的本草条目","c":"【本经原文】「**味甘平，主胸胁逆气，忧恚惊邪恐悸，心下结痛，寒热烦满，咳逆，口焦舌干，利小便；久服安魂养神，不饥延年。**」【产地】「**产我国云南及各省山中大松树下，年久而巨大者良。**」【性味】「**味甘性平无毒。**」【主治】「**茯苓为利水行痰、通补兼长要药；主胸胁逆气，忧恚惊恐，治烦满咳逆，水肿淋沥；能除湿益燥，开胃平呕，除虚热，安心神。**」【药征】「**主治悸及肉瞬筋惕也；旁治小便不利，头眩烦躁。**」【灵胎】「**补脾生津，化痰利水。**」【用量】「**普通钱半至四钱，大剂二三两。**」【禁忌】「**恶白敛，畏地榆雄黄秦艽鳖甲；忌米醋及酸物；凡病人肾虚，小水自利或不禁，或虚寒，精清精滑均忌。**」【容川】「**茯苓得木之气，又能疏土，故能化气行水。**」\n\n**【极重要】茯苓的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒（甘淡入气分）** |\n| **主治** | **利水行痰/通补兼长/安心神** |\n| **禁** | **肾虚/小水自利** |\n\n**「利水行痰、通补兼长」是最精的八字定位** ✓✓","o":"RJ-2176 · 《人纪·神农本草经》上经第九十八味「茯苓」，原文（PDF 第 258–259 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"茯苓利水不伤正","c":"原文【吴克潜】「**茯苓能行气而和缓，利水而不伤正，故通补皆宜，古今方中用者很多。**」讲义：「**所以我们要找一些排水的药而不伤正气；西药呢，把水利掉了，人的正气也伤到了。****我们利水的药、利小便的药最好就是茯苓。****所以茯苓，我们用的量很大，经方里面很多地方都有用茯苓。**」\n\n**【极重要】茯苓 = 利水不伤正**\n\n```\n通补兼长 = 利水 + 不伤正\n```\n\n**「西药把水利掉，正气也伤到」——「这是最精的通补兼长。」**要点：**须「标」**：**「『西药伤正气』是派系立场；利尿剂有明确适应证（心衰/高血压/肾病），不可停药」** ✓✓","o":"RJ-2177 · 《人纪·神农本草经》上经第九十八味，讲解（PDF 第 260 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"利尿还生津","c":"讲义讲「一个极反直觉的现象」：「**老师，这个利尿剂的话，一般口渴了你还利尿、不是口更渴？你错了，这个茯苓不但利尿还生津止渴。****中药就是这样子哈。****一般皮是黑的、黑白相间的，它不但利尿还补肾，所以还有滋补的功能。****因为它口焦舌干啊，能够利小便、安魂养神。**」\n\n**【极重要】利尿还生津（反直觉）**\n\n```\n茯苓：利水 + 生津（并行）\n西药利尿剂：利水 → 更渴\n```\n\n**「利尿还生津」——「这是最精的利水与生津并行。」** ✓✓","o":"RJ-2178 · 《人纪·神农本草经》上经第九十八味，讲解（PDF 第 259 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"肉跳是皮下积水","c":"讲义讲「一个极具体的体征」：「**《药征》说：主悸，治悸，肉瞤筋惕。****老师啊，奇怪，我这边没事怎么肌肉跳来跳去、眼皮这边跳来跳去。****相面说的是左右上下跳福跳祸啊什么的；眼皮不断跳，受不了啊——茯苓！****皮下有积水就是茯苓，肉跳动。**」\n\n**【极重要】肉跳 = 皮下积水 → 茯苓**\n\n**须「强「标」**：**「①肌束颤动/肉跳常见原因：①良性（疲劳/咖啡因/电解质）；②药物（利尿剂/激素/支气管扩张）；③神经肌肉（ALS、脊髓型颈椎病）；④甲亢；⑤须查电解质 + 肌电图」** ✓✓","o":"RJ-2179 · 《人纪·神农本草经》上经第九十八味，讲解（PDF 第 260 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"茯苓真伪看筋纹","c":"讲义讲「一个极实用的鉴别」：「**这个茯苓呢，外面是黑的、劈下去是白的。****那怎么分辨真伪？中国大陆很多东西作假；茯苓来的时候一木桶一木桶的，打开、他切好片。****真正的正茯苓，你拿到灯光下一看，可以看到里面经的纹路、经络、经的纹路，很多经。****那如果说是面粉皮做的，那个面粉皮啊、烤干以后很像茯苓啊，白白的面粉你拿起来捏啊，你以为是茯苓，一煮下去——面疙瘩！****结果呢，你拿起来就没有筋，很坏啊、很坏！**」\n\n**【极精】茯苓真伪 = 看筋纹**\n\n```\n真：灯光下可见筋纹\n假：面粉皮 → 一煮面疙瘩，无筋\n```\n\n**「一煮变面疙瘩」——「这是最精的鉴别法。」** ✓✓","o":"RJ-2180 · 《人纪·神农本草经》上经第九十八味，讲解（PDF 第 259 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"榆皮对皮水茯苓对腹胀","c":"【本草原文】「**味甘平，主大小便不通，利水道，除邪气；久服轻身不饥；今名榆白皮。**」【主治】「**榆白皮为泄滞去着、利水消肿要药；主大小便不通，利五淋，渗湿热，治肠胃邪热、水肿、痈肿，外敷疗癣湿、头疮。**」【禁忌】「**此能利窍渗湿热，去有形之积，气盛而壅者宜之；若胃寒而虚者，久服恐泄真气。**」讲义：「**如果这个人呢，是皮肤上全是水肿、整个皮上面都是肿的，是皮水，你使用榆白皮可能会比茯苓来得好。****但是如果是肚子鼓胀、恰恰是因为脾脏功能不好的，你用茯苓会比榆白皮好。****这样想就可以了。**」\n\n**【极重要】榆皮 vs 茯苓**\n\n| 症 | 药 |\n|---|---|\n| **皮水（皮上全肿）** | **榆白皮** |\n| **腹胀（脾功能差）** | **茯苓** |\n\n**「同是利水，分部位」——「这条与 n201同名异等」、n204「同中异治」同一体系。** ✓✓","o":"RJ-2181 · 《人纪·神农本草经》上经第九十九味「榆皮」，原文及讲解（PDF 第 261–262 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"酸枣仁的本草条目","c":"【本经原文】「**味酸平，主心腹寒热，邪结气聚，四肢酸疼，湿痹；久服安五脏，轻身延年。**」【性味】「**味酸，性平，无毒。**」【主治】「**酸枣仁为宁心敛汗要药，主心腹寒热，邪结气聚，烦心不眠，虚汗烦渴；治四肢酸痛湿痹，益肝养筋。**」【别录】「**烦心不得眠，脐上下痛，血转久泄，虚汗烦渴，补中益肝气，坚筋骨，助阴气。**」【药征】「**主治胸膈烦躁，不能眠也。**」【用量】「**普通一钱至三钱。**」【禁忌】「**凡肝胆心脾有实邪热者，禁用，以收敛故也。**」\n\n**【极重要】酸枣仁的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **酸/平/无毒** |\n| **主治** | **宁心敛汗/烦心不眠/益肝养筋** |\n| **禁** | **实邪热** |\n\n**「宁心敛汗」是酸枣仁最精的四字** ✓✓","o":"RJ-2182 · 《人纪·神农本草经》上经第一百味「酸枣」，原文（PDF 第 262 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"酸收定神","c":"讲义讲「一个极清晰的机制」：「**酸枣仁呢，为什么叫酸？因为它的味道是酸的。****你看到仁剂，那就知道如果你多吃就会下利，因为里面有油。****这个药因为味道是酸的，酸的是它有收敛的功能。****所以一个人表虚、如果是发汗不止，或者是心情、这个心理面这个很急躁，我们可以收敛。****酸味的药都是收敛的药，所以虚烦不得眠，我们酸枣仁汤也是治疗失眠很好的一个方剂。****因为它入肝嘛，酸味入肝，所以说能够滋肝养筋。**」\n\n**【极重要】酸味 = 收敛 → 酸枣仁汤治失眠**\n\n```\n酸（收）→ 敛汗/敛神\n  → 虚烦不得眠\n```\n\n**「酸收定神」——「这条与 n203酸味收敛」、n196「五味子酸收」同一体系。** ✓✓\n\n**极精！！\"攻「下时不用酸枣仁\"** ✅✓\n- **\"它的禁忌，因为它是主收敛，所以当你再用攻下排的时候，不要用酸枣仁，因为它是收敛嘛\"** ✓✓\n- **\"有实邪热者，比如说正在发肝炎、全身发黄，正在清热的时候，你就不要去开那个酸枣仁\"** ✓✓\n\n**【极精】\"攻「下不用酸收（收敛碍下）\"** ✅✓","o":"RJ-2183 · 《人纪·神农本草经》上经第一百味，讲解（PDF 第 262–263 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"黄柏的本草条目","c":"【本经原文】「**味苦寒，主五脏肠胃中结热，黄疸，肠痔，止泄利，女下漏下，赤白阴阳蚀疮；今名黄柏。**」【性味】「**味苦，性寒，无毒。**」【主治】「**黄柏为除热杀虫、坚肾益阴要药；主结热，黄疸，诸痿瘫痪，治诸疮痛、泄痢、下血，泻膀胱相火，疗淋浊白带，肠胃结热。**」【元素】「**泻膀胱相火，补肾水不足，坚肾壮骨髓，疗下焦虚，诸痿瘫痪，利下窍，除热。**」【丹溪】「**得知母降阴火；得苍术除湿清热，为治痿要药；得细辛泻膀胱火，治口舌生疮。**」【用量】「**普通五分至二钱。**」【禁忌】「**恶干漆，伏硫磺；阴阳两虚，脾胃薄弱者均忌。**」\n\n**【极重要】黄柏的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦/寒/无毒** |\n| **主治** | **除热杀虫/坚肾益阴/泻膀胱相火** |\n| **禁** | **阴阳两虚/脾胃薄弱** |\n\n**「坚肾益阴」是黄柏最反直觉的定位（苦寒却能坚肾）** ✓✓","o":"RJ-2184 · 《人纪·神农本草经》上经第一百〇一味「檗木」，原文（PDF 第 263 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"黄柏配苍术治痿","c":"讲义讲「一个极精的配伍」：「**比如说黄柏是去热的、苍术是祛湿的，所以湿热他都可以，两个药、一个去热一个去湿，你就放在一起的话，那是不是可以除湿清热？****那很多阳痿啊，就是湿热，就造成这样子，你可以用这个，诸如此类的。****所以药物的选择呢，就是看它的药性。**」\n\n**【极重要】黄柏 + 苍术 = 治痿**\n\n```\n黄柏（去热）+ 苍术（祛湿）\n  → 湿热痿（阳痿）\n```\n\n**「一寒一燥」——「这是最精的一寒一燥（二妙散的原型）。」**要点：**这一条极重要，它是「配伍的一寒一燥」** ✓✓","o":"RJ-2185 · 《人纪·神农本草经》上经第一百〇一味，讲解（PDF 第 263 页）。"},{"t":"神农本草经·上经：柏实（柏子仁）、茯苓、榆皮、酸枣（酸枣仁）、檗木（黄柏）","h":"三黄汤","c":"讲义讲「一个极常用的组合」：「**尤其是小便痛、小便刺痛，那黄柏效果很好；膀胱的热、肾脏的热、肾脏有结石或者是痛，我们三黄汤：黄连、黄芩、黄柏。**」\n\n**【极精】三黄汤 = 黄连 + 黄芩 + 黄柏**\n\n```\n黄连（心/中焦）\n黄芩（肺/上焦）\n黄柏（肾/下焦）\n  → 三焦热\n```\n\n**「三黄分三焦」——「这是最精的三焦分工。」**要点：**须「标」**：**「三黄汤苦寒，须辨证；不可长期服（伤胃 + 电解质）；孕妇/儿童慎」** ✓✓","o":"RJ-2186 · 《人纪·神农本草经》上经第一百〇一味，讲解（PDF 第 263 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"干漆是大毒须炮制","c":"【本经原文】「**味辛温，无毒，主绝伤补中，续筋骨，填髓脑安五脏，五缓六急，风寒湿痹；生漆去长虫；久服轻身耐老。**」【主治】「**干漆主破瘀血，续筋骨，治风寒湿痹，积滞，疝瘕，心痛，闭经。**」【元素】「**削年深坚结之积滞，破日久凝结之瘀血。**」【禁忌】「**畏川椒紫苏鸡卵及蟹，忌油脂；然大伤营血卫气，若胃虚大疮及无瘀血者均忌用。**」讲义：「**这个药争议了很久；它本身在《神农本草经》里是无毒的。****干漆就是漆树啊；这个漆我们有做油漆树，这个树本身就是很毒、很毒。****摘漆树啊，那个很熏；那个干漆啊，手摸几下回来，你赶快要洗手，不然的话会微微刺痛，好像手要腐蚀掉的感觉。**」\n\n**【极重要】干漆 = 大毒（须炮制）**\n\n```\n生漆 → 接触即皮炎（漆酚过敏）\n  → 必须炮制（瓦上烧烟尽）\n```\n\n**「手摸几下就要洗手，好像要腐蚀掉」——「这是最诚实的毒性记录。」**要点：**须「强「标」**：**「①漆酚可致接触性皮炎（可致敏/重症）；②干漆内服有肾毒/肝毒风险；③现代基本不用；④过敏体质禁；⑤不可自制」** ✓✓","o":"RJ-2187 · 《人纪·神农本草经》上经第一百〇二味「干漆」，原文及讲解（PDF 第 265 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"瘀血三看补充","c":"讲义讲「一个极重要的判据」：「**百病呢都有瘀，这是唐容川的讲法；临床上在看的时候、我们真的在治的时候，到后来都是活血化瘀。****病人只要开活血化瘀的药，病人病情都会好转。****最明显有淤血的症状我跟诸位讲过：比如脚、脚腿的地方皮肤有白，就好像肌肤甲错；舌头里面有黑紫点；舌苔呢、舌头的形状。****如果这个人的舌头外面像牙齿痕很多的，这都属于有瘀血的状况。**」\n\n**【极重要】瘀血三看（补充）**\n\n```\n① 肌肤甲错（脚腿皮肤白）\n② 舌有黑紫点\n③ 舌边齿痕\n```\n\n**「这条与 n52瘀血看三处」同一主题。** ✓✓","o":"RJ-2188 · 《人纪·神农本草经》上经第一百〇二味，讲解（PDF 第 265 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"五加皮对蛇床子","c":"【本经原文】「**味辛温，主心腹疝气腹痛，益气疗躄，小儿不能行，疽创阴蚀。**」【主治】「**五加皮为祛风湿壮筋骨要药，主疼痹风弱，五缓虚羸，小儿行迟，疝气腹痛，治瘀留皮肌，阴痒囊湿。**」【甄权】「**破逐恶风，四肢不遂，贼风伤人，软脚兼腰，主多年瘀血在皮肌，治痹湿内不足。**」【禁忌】「**下部无寒湿邪而有火，及肝肾虚而有火，均忌。**」讲义：「**要记得它的寒热：五加皮呢是性温，温性的药，所以一般遇到寒症的时候使用。****那还有很多像蛇床子去湿热的药、寒药，那你就要用蛇床子，两个是反的。**」\n\n**【极重要】五加皮 vs 蛇床子**\n\n| 药 | 性 | 用 |\n|---|---|---|\n| **五加皮** | **温** | **寒症阴部湿疹** |\n| **蛇床子** | **寒** | **湿热阴部湿疹** |\n\n**「两个是反的」——「这是最精的一寒一温。」** ✓✓","o":"RJ-2189 · 《人纪·神农本草经》上经第一百〇三味「五加皮」，原文及讲解（PDF 第 266 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"质轻入头","c":"【本经原文】「**味苦微寒，主筋骨间寒热痹，拘挛明目，坚齿利九窍，去白虫；久服轻身耐老。**」【主治】「**蔓荆子为搜风凉血要药，主利九窍，散风邪，明目坚齿，治风头痛脑鸣，湿痹拘挛。**」【容川】「**蔓荆子气烈，味辛而气发散，而质轻，故主散头目之风。**」讲义：「**蔓荆实的这个气非常的烈；气烈的意思就是说你闻这个味道很强，味辛而气发散，质非常的轻。****质轻的药呢通通入头部，所以散头部的痛、头部的风、头痛啊头风啊这种我们可以用蔓荆子。****比如我们入关节的药用关节的药，头痛的药我们用蔓荆实。**」\n\n**【极重要】质轻入头（蔓荆子）**\n\n```\n气烈 + 质轻 → 入头部\n  → 头风头痛\n```\n\n**「质轻上升」——「这条与 n182叶散、花轻扬」同一体系。** ✓✓","o":"RJ-2190 · 《人纪·神农本草经》上经第一百〇四味「蔓荆实」，原文及讲解（PDF 第 267 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"功能重复是因性味不同","c":"讲义讲「一个极精的药性观」：「**中药很多药你在看《神农本草经》的时候会发现：老师，它很多治疗的功能都是重复的。****重复的原因是因为他的性味不一样。**」\n\n**【极精】功能重复 = 性味不同**\n\n```\n同功能 → 选哪个？\n  → 看性味（寒热温凉）\n```\n\n**「重复不是冗余，是备选」——「这是最精的药性。」** ✓✓","o":"RJ-2191 · 《人纪·神农本草经》上经第一百〇四味，讲解（PDF 第 267 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"辛夷菖蒲苍术治鼻窦炎","c":"【本经原文】「**味辛温，主五脏身体，寒风头脑，面皯；久服下气，轻身明目，增年耐老。**」【主治】「**辛夷为升阳治上要药，主头脑各病，鼻渊鼻塞，行胃气，宣肺气。**」【别录】「**温中解肌，利九窍，通鼻塞涕出，治面肿，引齿痛，眩冒身几几如在车船之上者。**」【容川】「**辛夷花在树梢，其性极升，而味辛散，故能散脑鼻之间风寒。**」讲义：「**诸位呢可以跟菖蒲混在一起，我们最常用的辛夷加菖蒲。****这两个配合在一起，如果要更强加苍术。****为什么要加苍术？苍术除了开胃以外，苍术是本草、根是白术，最顶端的树叶是苍术，所以苍术呢祛湿。****如果你有辛夷的辛香发散，发散了以后湿还在里边、并没有出来；你开苍术去收起来，开菖蒲往下导。**」\n\n**【极重要】辛夷 + 菖蒲 + 苍术 = 治鼻窦炎**\n\n```\n辛夷（辛香发散，开窍）\n菖蒲（去湿下导，利窍）\n苍术（祛湿收）\n  → 任何鼻窦炎\n```\n\n**「这三味去湿开窍，不分寒热」——「这是最重要的鼻窦炎方。」**要点：**这一条极重要，它与 n203「菖蒲开窍」、n201「同名异等」同一体系** ✓✓","o":"RJ-2192 · 《人纪·神农本草经》上经第一百〇五味「辛夷」，原文及讲解（PDF 第 268 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"鼻窦炎的寒热加减","c":"讲义讲「一个极清晰的加减」：「**那现在有一个人呢，老师我鼻水不断的流，流出来都是白色的水。****白色的水一直讲白色，就代表是肺里面是寒的；你可以同样的药加点干姜啊、炙甘草去他的肺寒。****那如果说他的鼻涕是粘稠很黄的，你可以同样的药加点去肺热的药，比如杏仁、麦门冬、祛痰的药半夏啊、诸如此类啊、天南星啊。****这个方子就出来了；那治鼻子的药很简单。**」\n\n**【极重要】鼻窦炎的寒热加减**\n\n| 涕 | 加 |\n|---|---|\n| **白色水（寒）** | **干姜 + 炙甘草** |\n| **粘稠黄（热）** | **杏仁/麦冬/半夏/天南星** |\n\n**「一个方，两个变」——「这是最精的一方两变。」** ✓✓","o":"RJ-2193 · 《人纪·神农本草经》上经第一百〇五味，讲解（PDF 第 268–269 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"针喷服三管齐下","c":"讲义讲「一个极重要的治法」：「**那你说老师如果他过来了，我们针灸：先下合谷、再来扎迎香，迎香下完了他鼻子已经通了。****那你再给他针这个、再给他吃这个药。****如果你说再强、你鼻子还严重，喷药嘛；我们的麝香矾石散，那个麝香喷进去的时候无孔不入，辛香开窍的力量很大。****外用的、内服的、再针灸，怎么会不好？你需要开刀吗？不需要。****你们知道鼻窦炎怎么开刀？他把你嘴巴拉起来、从里面开进去，然后再清出来；很多人清完了以后，在医院里恢复一两个礼拜，鼻子又塞啦。****因为肺开窍在鼻嘛，这个肺在管这个鼻的问题；你只知道鼻窦炎在治疗鼻子，那个肺没有去治疗，怎么会好呢。**」\n\n**【极重要】针 + 喷 + 服 = 三管齐下**\n\n```\n合谷 + 迎香 + 药 + 麝香矾石散\n  → 不需开刀\n```\n\n**「外用的、内服的、再针灸」——「这条与 n207外用内服双管」、n201「四诊合参」同一体系。**要点：**这一条极重要，它是「三管齐下」** ✓✓\n\n**须「强「标」**：**「①鼻窦炎须先排除①真菌性；②息肉；③肿瘤；④牙源性；⑤顽固须ENT评估（FESS）；⑥不可全盘否定手术」** ✓✓","o":"RJ-2194 · 《人纪·神农本草经》上经第一百〇五味，讲解（PDF 第 268–269 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"闻味定气血","c":"讲义讲「一个极简单的判法」：「**这个只要记得辛香发散：黑胡椒是不是辛香发散？味道那么重、气很厚，它是入血分的，所以你会尝到很好吃啊、它入血分嘛。****但是你如果喷，老师，鼻是气分啊，那是无所谓的，那个可以急救嘛。****所以你只要闻到味道比较重的都是气比较厚的，味道比较薄的气比较薄。****很简单啊：气是肺、血就是心脏，好、就这样子分出来了。**」\n\n**【极精】闻味定气血（味厚气厚）**\n\n```\n味重（厚）→ 气厚 → 血分\n味淡（薄）→ 气薄 → 气分\n```\n\n**「闻到味道重就是气厚」——「这条与 n182味厚阴、气薄阳」同一体系。** ✓✓","o":"RJ-2195 · 《人纪·神农本草经》上经第一百〇五味，讲解（PDF 第 269 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"桑寄生的本草条目","c":"【本经原文】「**味苦平，主腰痛，小儿背强，痈肿，安胎充肌肤，坚发齿，长须眉；其实明目轻身通神。**」【产地】「**产我国广西，或云处处有之，但寄生杂树者多，寄生桑树者少。**」【主治】「**桑上寄生为补肝肾坚筋骨要药，主腰痛背强，益血脉，安胎孕，治女子内伤不足，怀孕胎漏，产后余疾。**」【别录】「**去女子崩中内伤不足，产后余疾，下乳汁，主金疮，去痹。**」【甄权】「**主怀孕漏血不止，令胎牢固。**」【灵胎】「**驱风养血安胎。**」【用量】「**普通一钱至三钱。**」【禁忌】「**忌见火。**」\n\n**【极重要】桑寄生的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦酸/平** |\n| **主治** | **补肝肾/坚筋骨/安胎** |\n| **忌** | **见火** |\n\n**「寄生桑树者少」是重要的产地提示** ✓✓","o":"RJ-2196 · 《人纪·神农本草经》上经第一百〇六味「桑上寄生」，原文（PDF 第 269 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"桑寄生是金木之间气","c":"原文【容川】「**此药味酸枝繁，具木之性，生于桑树之上；桑者，木中之金也，寄生附之，故独得金木之间气。****且根不粘土，纯感风气而生，故为清散风木之要药。****此药附木而生，象胆附肝，味酸苦，得木火之味，能清肝胆之火，治风热，筋脉结等症。****胆通三焦之网膜，外连于筋；寄生如藤附木，象人之筋，故治之。**」讲义：「**而且根不沾土，因为你寄生在树梢上面，根不碰到土气；他是感风气而生，就是风吹到生、没有碰到土气。****所以它是清散风木的要药；那风是什么啊？肝脏啊。**」\n\n**【极重要】桑寄生 = 金木之间气（根不粘土）**\n\n```\n桑（木中之金）+ 寄生（根不沾土，感风而生）\n  → 清散风木\n```\n\n**「金木之间气」——「这是最精的取象。」**要点：**这一条极重要，它与 n195「杜牛膝」、n201「白英」同一体系** ✓✓","o":"RJ-2197 · 《人纪·神农本草经》上经第一百〇六味，原文引唐容川及讲解（PDF 第 270 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"胆结石禁桑寄生","c":"讲义讲「一个极具体的禁忌」：「**那现在举例给你听：比如说这个桑寄生呢它是味苦性平的，这个药是酸味。****酸味的药，酸是不是主收敛？主收敛嘛。****那你如果遇到病人是胆结石——老师，你怎么知道他是胆结石？很简单嘛：胆结点这边有压痛点；我常常十一点到一点、半夜 12 点钟子时的时候那个美国的吸血鬼起床了，他就痛；然后耳朵的胆点痛，都可以知道是胆结石。****胆结石的时候你不能用酸味收敛啊，你用桑寄生他收得更紧，所以不能用。****但是胆发炎啦，压胆石点没有痛点；胆发炎、小便有点黄、大便不是很好、消化不是很好——这个时候你可以使用它。**」\n\n**【极重要】胆结石禁桑寄生（酸收更紧）**\n\n```\n胆结石（压痛点 + 子时痛 + 耳胆点痛）→ 禁\n胆发炎 → 可用（酸收 + 苦泄）\n```\n\n**「酸收更紧」——「这是最精的禁忌具体化。」**要点：**须「强「标」**：**「①胆结石须超声确诊；②症状性须LC（腹腔镜胆囊切除）；③急性胆囊炎/胆管炎须急诊；④子时痛不等于结石」** ✓✓","o":"RJ-2198 · 《人纪·神农本草经》上经第一百〇六味，讲解（PDF 第 270–271 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"杜仲的本草条目","c":"【本经原文】「**味辛平，主腰脊痛，补中益精气，坚筋骨强志，除阴下痒湿，小便余沥；久服轻身耐老。**」【产地】「**产我国陕西四川等地，树皮中有银丝如棉，故亦名锦杜仲，入药。**」【性味】「**味辛甘，性温，无毒。**」【主治】「**杜仲为健筋骨补腰肾要药，主腰膝酸痛，体虚强直，治胎漏胎堕，精气亏弱。**」【容川】「**杜仲柔韧，象人之筋膜，能伸能缩，极其坚韧，包紫黑，味纯厚，故入肝肾，以强人筋骨。**」【用量】「**普通二钱至三四钱，大剂二三两。**」【禁忌】「**恶元参蛇蜕；肾虚火炽者忌，当知母黄柏同用。**」\n\n**【极重要】杜仲的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛甘/温/无毒** |\n| **主治** | **健筋骨/补腰肾/安胎** |\n| **禁** | **肾虚火炽** |\n\n**「柔韧象筋膜」是最精的取象** ✓✓","o":"RJ-2199 · 《人纪·神农本草经》上经第一百〇七味「杜仲」，原文（PDF 第 272 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"杜仲真伪看白丝","c":"讲义讲「一个极实用的鉴别」：「**那如何知道真伪？这杜仲皮，如果你把它拉起来，看到没有、有白丝，看到没有？****真的杜仲，一劈就干了、是假的杜仲。****怎么劈它都有那个白丝，是真的杜仲。****那诸位看看这个相：妇科常用杜仲，你看里面的丝拉得很紧、对不对？你们试试看、拉得很紧。**」\n\n**【极重要】杜仲 = 白丝（锦杜仲）**\n\n```\n真：劈开有银白丝（如棉）\n假：一劈即断，无丝\n```\n\n**「以象辨药」——「这是最精的以象辨药。」** ✓✓","o":"RJ-2200 · 《人纪·神农本草经》上经第一百〇七味，讲解（PDF 第 273 页）。"},{"t":"神农本草经·上经：干漆、五加皮、蔓荆实、辛夷、桑上寄生、杜仲","h":"抖孩子伤腰","c":"讲义讲「一个极精的现代病因」：「**腰背痛、女人的腰脊痛都可以用；所以杜仲是补筋骨壮腰肾的药。****背后、腰背后痛、关节痛、坐骨神经痛都可以使用杜仲，尤其是女孩子生了小孩子腰酸背痛。****除了生产的经过会伤到以外，还有就是年轻的妈妈不懂，就是抱小孩子，小孩子在那边哭，她就抖、她背后在那边摇、前面在这边抖；很多女孩子因为抖太久了，弄得腰受伤。**」\n\n**【极精】抖孩子伤腰**\n\n```\n产后抱娃抖 → 腰受伤\n  → 杜仲\n```\n\n**「抖太久，腰受伤」——「这是最精的现代病因。」** ✓✓","o":"RJ-2201 · 《人纪·神农本草经》上经第一百〇七味，讲解（PDF 第 273 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"女贞子弯曲如小肾","c":"【本经原文】「**味苦平，主补中安五脏，养精神，除百疾；久服肥健，轻身不老；又名女贞子。**」【主治】「**女贞子为除热益精要药，主补中安五脏，养精神，健腰膝，治白发。**」【用量】「**普通一至三钱。**」【禁忌】「**气味俱阴，老人当入保脾胃药及椒红温暖之剂，不然恐腹痛作泻。**」讲义：「**果实类的药，一般果实类的药都安五脏，那个滋补的功能。****那这个女贞子除热、益精的药、滋补的药，所以我们常常开年龄大一点的，我常常开一点女贞子在里面。****诸位看看女贞子长什么样子？弯弯曲曲的一个，弯弯曲曲的好像小肾脏一样；那颜色比较暗一点、黑的，那你看他那个味道是苦味。**」\n\n**【极精】女贞子 = 弯曲如小肾**\n\n```\n形如小肾 → 补腰膝\n```\n\n**「气味俱阴，老人须温药同行」——「这是最精的配伍留意。」** ✓✓","o":"RJ-2202 · 《人纪·神农本草经》上经第一百〇八味「女贞实」，原文及讲解（PDF 第 273–274 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"木兰皮治面疱酒糟鼻","c":"【本经原文】「**味苦寒，主身大热在皮肤中，去面热，赤疱酒皻，恶风瘨疾，阴下痒湿，明耳目。**」【性味】「**木兰皮味苦，性寒。**」【主治】「**木兰皮为解热，行血，祛湿药；治面疱，酒糟鼻，水肿，酒疸，重舌，及阴下湿痒。**」【禁忌】「**体寒之人禁。**」讲义：「**这个木兰我们是用皮，主要是皮；它的味苦、性寒。****寒的药通通是……这个女孩子吃对皮肤也是很好。****面皰、青春痘啊，用木兰皮可以治，诸位可以参考。**」\n\n**【极精】木兰皮 = 面疱/酒糟鼻**\n\n```\n木兰皮（苦寒，皮）\n  → 面疱（青春痘）/ 酒糟鼻\n```\n\n**「女孩子吃对皮肤很好」——「这是最精的皮类药。」**要点：**须「标」**：**「酒糟鼻须皮肤科（甲硝唑/避光/镭射）；青春痘须规范（维A酸/避免挤压）」** ✓✓","o":"RJ-2203 · 《人纪·神农本草经》上经第一百〇九味「木兰」，原文及讲解（PDF 第 274 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"蕤核生治多睡熟治失眠","c":"【本经原文】「**味甘温，主心腹邪气，明目，目赤痛，伤泪出；久服轻身，益气不饥。**」【主治】「**蕤核主心腹邪热结气，治目赤痛伤泪出，翳膜，眦烂；生用疗多睡，熟用治不眠。**」【藏器】「**生治足睡，熟治不眠。**」【用量】「**普通一钱至三钱。**」【禁忌】「**能补肝虚，今人多用治眼疾，然非火风暴眼所宜用也。**」讲义：「**这个药用得不多，我们很少用它。****这个药，生用治疗睡眠太多、熟用治疗失眠『老师，这个是反的』——对，反的。****可以使用，可以补肝；现在的人多使用眼疾、眼科治疗上面。****也是仁核用药，是那个仁入药，专门对失眠、睡眠、眼睛的问题使用的。**」\n\n**【极精】蕤核 = 生治多睡，熟治失眠**\n\n```\n生（生用）→ 嗜睡\n熟（炮制/炒）→ 失眠\n```\n\n**「对，反的」——「这条与 n205蒲黄生破熟止」同一体系。**要点：**这一条极精，它是「最反直觉的生熟异治」** ✓✓","o":"RJ-2204 · 《人纪·神农本草经》上经第一百一十味「蕤核」，原文及讲解（PDF 第 274–275 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"陈皮的本草条目","c":"【本经原文】「**味辛温，主胸中瘕热逆气，利水谷；久服去臭，下气通神；又名橘皮；今之陈皮。**」【产地】「**产我国广东，即广橘皮，以晒干陈久为良，故名陈皮。**」【性味】「**味苦辛，性温，无毒。**」【主治】「**陈皮为宣通疏利要药，主行气健胃，去湿化痰，能发散清热，消积水气。**」【别录】「**下气止呕咳，治气冲胸中，吐逆霍乱，疗脾不能消谷，止泄，除膀胱留热停水，起淋，利小便，去寸白虫。**」【药征】「**主治呃逆也，旁治胸痹停痰。**」【用量】「**普通一钱至三钱。**」【禁忌】「**凡中气虚，气不归元者，忌与耗气药同用；胃虚有火呕吐，忌与温热香燥药同用；阴虚咳嗽生痰，忌与半夏南星等同用。**」【成无己】「**陈皮和百药，脾为气母，肺为气籥；凡补药涩药必用陈皮以利气；气行则领导百药，有痰者因气行而化，有湿者亦因气行而消。**」\n\n**【极重要】陈皮的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛苦/温/无毒** |\n| **主治** | **行气健胃/去湿化痰/消积水气** |\n| **禁** | **中气虚/气不归元** |\n\n**「宣通疏利」是陈皮最精的四字** ✓✓","o":"RJ-2205 · 《人纪·神农本草经》上经第一百一十一味「橘柚」，原文（PDF 第 275 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"陈皮对青皮","c":"讲义讲「一个极清晰的一皮两用」：「**那我们还有一种青皮，这个陈皮，为什么叫陈皮？就是橘子晒干了以后，越陈年是越久越好。****中药是很多药是陈年的；『老师，会不会坏？』不会坏，橘皮是越陈年的好。****还有青皮，青皮就是橘子还是青色的时候就把它采下来，还没有熟就把它采下来。****那青皮跟陈皮两个同样是皮；注意：青皮能够入肝脏，舒肝的力量非常强，味、气很厚。****我们知道有肝病的时候常常用青皮。****陈皮是宣通疏利的药；因为那个味道是辛香的，它能够行气健脾，健脾的时候我们都会使用陈皮。**」\n\n**【极重要】陈皮 vs 青皮**\n\n| 药 | 入 | 用 |\n|---|---|---|\n| **陈皮（熟橘皮）** | **脾/胃/肺** | **行气健胃/降气** |\n| **青皮（未熟橘皮）** | **肝** | **舒肝（力强）** |\n\n**「一皮两用，一入脾胃一入肝」——「这是最精的一皮两用。」** ✓✓","o":"RJ-2206 · 《人纪·神农本草经》上经第一百一十一味，讲解（PDF 第 275–276 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"陈皮走肺厚朴走肠","c":"讲义讲「一个极精的部位分工」：「**唐容川这个，陈皮也是木的实、木结的果实，这种能够治胃、能够治脾；清香，所以上达于肺。****像枳实，枳实很小、一个个长得很小，止咳，它不清香不走肺。****一般那个果实清香的果实都能够入肺。****那厚朴，味道比较辛辣，但是厚朴的气太沉，很强啊，味道很强的都往下沉，所以它不走肺。****所以我们使用的时候：如果说一个人的肠胃，陈皮你要着重在胃的地方；厚朴在小肠大肠的地方，着重在这个上面。****所以，如果一个病人有问题我们会陈皮厚朴一块儿使用。**」\n\n**【极重要】陈皮（胃）vs 厚朴（肠）**\n\n```\n陈皮 → 胃（上焦/中焦）\n厚朴 → 小肠大肠（下焦）\n  → 合用（气入丹田）\n```\n\n**「清气入丹田」——「这是最精的部位分工。」** ✓✓","o":"RJ-2207 · 《人纪·神农本草经》上经第一百一十一味，讲解（PDF 第 276–277 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"呃逆分轻重","c":"讲义讲「一个极实用的分层」：「**打嗝、嗝逆，一般的嗝逆你可以用陈皮，陈皮很好用。****重症的嗝逆、到了癌症的末期陈皮就比较不够用；当然你可以用陈皮，但陈皮的力量不够。****一般的嗝逆可以用陈皮，陈皮效果不错。****而且很好吃，橘子皮嘛、很香。**」\n\n**【极精】呃逆分轻重（陈皮只治轻）**\n\n```\n一般呃逆 → 陈皮\n癌症末期呃逆 → 陈皮不够\n```\n\n**须「强「标」**：**「顽固呃逆（>48h）须查①胰腺癌/胃癌；②尿毒症；③脑干病变；④膈下脓肿；⑤药物」** ✓✓","o":"RJ-2208 · 《人纪·神农本草经》上经第一百一十一味，讲解（PDF 第 276 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"发髲是血余炭","c":"【本经原文】「**味苦温，主五癃关格不通，利小便水道；疗小儿痫，大人痓，仍自还神化。**」【产地】「**乃人身头上之发也，处处有之。**」【主治】「**发髲主益阴泄热，治小便不利，五癃关格，小儿惊痫，血闷血晕，去瘀血，止好血。**」【丹溪】「**乱发消瘀血，止舌血，补阴甚捷。**」【用量】「**普通三五分。**」讲义：「**这个经方里面我们会用到头发、猪油、猪膏；头发煎在一起，猪油在锅子里滚的时候，头发『哧……』一下就没了。****按张仲景的说法是治诸黄，不管是什么样的黄疸都能够治。****头发我们知道是血之余，头发为血余；你烧过以后就叫血余炭。****吃了这个药，利小便非常的凶悍。**」\n\n**【极重要】发髲 = 血余炭（治黄/利水）**\n\n```\n血余（头发）→ 烧炭（血余炭）\n  → 治诸黄 / 利小便\n```\n\n**「利小便非常的凶悍」——「这是最精的血余。」**要点：**须「强「标」**：**「①血余炭现代用于止血；②『猪油煎头发治黄』无现代证据；③不可自制；④黄疸须查病因（病毒/胆道/溶血）」** ✓✓","o":"RJ-2209 · 《人纪·神农本草经》上经第一百一十二味「发髲」，原文及讲解（PDF 第 277–278 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"头发不可生吃","c":"讲义讲「一个极真实的风险」：「**你的头发如果是生的吃下去不得了，它在里面消化不掉啊；头发很厉害，消化不掉就打在一起、结在一起，很麻烦的啊。****那还是有方法的了：过去孙思邈用酸菜，那个腌的酸菜；那个发结在里面清不出来，那酸菜保证——那个酸菜又酸又咸又臭，『哇——』一下就吐出来。****头发结在里面，那头发不好消化；不要随便拿起来吃，一定要炸过、一定要在油里面炸过再吃。**」\n\n**【极精】头发不可生吃**\n\n```\n生吃 → 胃内结团（毛发胃石）\n  → 须炸过（油煎）\n```\n\n**「头发消化不掉，结成团」——「这是最精的风险提示。」**要点：**须「强「标」**：**「毛发胃石须胃镜取出（不可催吐）；嚼发癖（trichotillomania/trichophagia）须精神科」** ✓✓","o":"RJ-2210 · 《人纪·神农本草经》上经第一百一十二味，讲解（PDF 第 278 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"龙骨的本草条目","c":"【本经原文】「**味甘平，主心腹鬼注，精物老魅，咳逆泄利脓血，女子漏下，症瘕坚结，小儿热气惊痫；齿，主小儿大人惊痫癫疾狂走，心下结气，不能喘息，诸痉，杀精物；久服轻身，通神明延年。**」【主治】「**龙骨为固敛正气、镇纳浮阳要药；主安心神辟惊烦，治泄痢脓血，崩带遗精，镇喘逆，敛虚汗，收疮口，疗脱肛。**」【药征】「**主治脐下动也，旁治烦惊失精。**」【灵胎】「**敛气涩血，定志安神。**」【用量】「**普通二钱至三四钱。**」【禁忌】「**收摄太过，若非久痢虚脱者，切勿妄投；火盛失精者误用，多致溺赤涩痛；得人参牛黄良，畏石膏川椒，忌鱼及铁器。**」\n\n**【极重要】龙骨的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒** |\n| **主治** | **固敛正气/镇纳浮阳/安心神** |\n| **禁** | **收摄太过/火盛失精** |\n\n**「固敛正气、镇纳浮阳」是最精的八字定位** ✓✓","o":"RJ-2211 · 《人纪·神农本草经》上经第一百一十三味「龙骨」，原文（PDF 第 278–279 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"浮阳如引擎过热","c":"讲义讲「一个极精的比喻」：「**金石类的药都有重镇的功能、往下沉的功能；所以一个人如果心气很慌很乱、焦虑、心气提起下不来，就是说金石类的。****我们什么叫做扶阳？常人，阳就是一定在阴的里面。****所以我们可以用离中虚、坎中连来代表他；那阳是伏、潜在阴的里面，这叫做正常。****举例：这个肺、这个心脏；心脏的火没有肺的金来克制它的时候，这个心脏火会过热、心阳就会上浮，就会浮阳。****肺是汽车的冷却器、水箱，心脏是汽车的引擎；心脏过热、引擎过热就是浮阳。**」\n\n**【极重要】浮阳 = 引擎过热（水箱制不住）**\n\n```\n心阳上浮（肺金制不住）\n  → 心悸/心慌\n    → 龙骨（重镇）\n```\n\n**「引擎过热」——「这条与 n63肺像水箱」、n209「红色药润肺」同一体系。** ✓✓","o":"RJ-2212 · 《人纪·神农本草经》上经第一百一十三味，讲解（PDF 第 279 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"龙骨牡蛎固阳软坚","c":"讲义讲「一个极精的配伍」：「**龙骨这个药常常跟牡蛎是混合在一起的；这都是咸味的药，咸味能够软坚。****坚就是硬块，我们治疗甲状腺肿瘤、或是子宫癌、或是胸部有肿瘤有硬块，都是利用咸味的药。****那像这个能够镇摄心阳的，举例给你听：像有一个年青人跑来说『哎呀，我这个晚上睡觉在梦遗啊、梦遗得很严重、没有办法控制』。****每天晚上只要睡得、气血很暗，这种就是阳门、阳不守；固阳的时候，我们用龙骨牡蛎固阳。****病人遗精或者是小便没有办法控制，一剂下去就止掉、马上就改善下去。**」\n\n**【极重要】龙骨 + 牡蛎 = 固阳（咸软坚）**\n\n```\n龙骨 + 牡蛎（咸）\n  → 固阳（遗精/尿失禁）\n  → 软坚（甲状腺/子宫/胸硬块）\n```\n\n**「咸能软坚，又能固阳」——「这是最精的一药两用。」**要点：**这一条极重要，它与 n194「咸软坚」、n200「龙胆」同一体系** ✓✓\n\n**须「强「标」**：**「①遗精/尿失禁须先排除①前列腺病；②糖尿病神经源性；③脊髓病变；④药物」** ✓✓","o":"RJ-2213 · 《人纪·神农本草经》上经第一百一十三味，讲解（PDF 第 279 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"脐下动悸用龙骨","c":"讲义讲「一个极具体的体征」：「**《药征》主治脐下动，旁治烦惊失精——肚脐以下的震动。****我们人身在中医的看法里面常常会出现脐下有动悸、肚脐以下的悸、心下悸。****这个悸，就好像病人也会跟你讲『心脏在跳、我的心脏在跳』；动悸啊，这个就是这里讲的悸。****龙骨是治疗脐下动悸其中的一味药，不是单味用。****所以一般我看到病人的时候，神不守、很慌乱、心神不守、盗汗，我都会用到龙骨。**」\n\n**【极精】脐下动悸 = 龙骨**\n\n```\n脐下动 / 心下悸\n  → 龙骨（非单味，须配伍）\n```\n\n**「神不守、很慌乱、盗汗」——「这是最精的桂枝+龙骨+牡蛎证。」** ✓✓","o":"RJ-2214 · 《人纪·神农本草经》上经第一百一十三味，讲解（PDF 第 279–280 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"麝香是开窍第一药","c":"【本经原文】「**味辛温，主辟恶气，杀鬼精物，温疟，虫毒，痫痓，去三虫；久服除邪，不梦寤魇寐。**」【主治】「**麝脐香为开关通窍要药，主内透骨髓，外彻皮毛，走窜开通；治中恶，痞满，风毒，风痰，暴痛卒闭，疗痰厥惊痫，鼻塞耳聋目翳。**」【用量】「**普通数厘至分许。**」【禁忌】「**凡病之属于虚者，当补益，概勿施用；劳怯及孕妇均不宜佩带，忌蒜及近鼻嗅之。**」讲义：「**诸位现在只看温的药，还有大热的药；温的只是中等的，热，当然就是很热了。****那辛辣的发散，我们过去，麝香的味道很臭嘛；晚上睡觉的时候放在嘴巴旁边，那个山里面、山区里面那个瘴气很多，那个山精鬼魅的用得很多。****晚上睡觉就把它放在旁边，麝香放在旁边就百毒不侵；因为臭，很臭，你知道是麝香你忍耐一下，蚊虫也不来咬你。**」\n\n**【极重要】麝香 = 开窍第一药**\n\n```\n麝香（辛温）\n  → 内透骨髓，外彻皮毛\n  → 暴痛卒闭 / 痰厥 / 鼻塞\n```\n\n**「开关通窍」是麝香最精的四字** ✓✓\n\n**须「强「标」**：**「①孕妇禁（可致流产）；②麝香属保护物种（CITES附录I），天然麝香禁用；③现代用人工麝香；④不可自行服」** ✓✓","o":"RJ-2215 · 《人纪·神农本草经》上经第一百一十四味「麝香」，原文及讲解（PDF 第 280–281 页）。"},{"t":"神农本草经·上经：女贞实、木兰、蕤核、橘柚（陈皮/青皮）、发髲、龙骨","h":"麝香矾石散","c":"讲义讲「一个极实用的配方」：「**就像我讲麝香矾石散，我那个矾石是，一到一百来说的话，矾石是 98，麝香只有 2；绝大多数是矾石，麝香一点点下去就好了，很凶悍，这个无孔不入啊。****你喷下去的时候，它就钻啊钻啊，只有有洞它就钻到里面去。****我们常常临床上用到鼻子鼻窦炎，或者昏倒了昏迷过去，或者这个耳朵发炎，我们喷点这个麝香矾石；矾石有干燥的功能嘛，麝香无孔不入。****一喷进去，麝香在里面无所不跑，然后这个矾石就骑这个麝香的背啊，就把这个所以可以抵达的地方都到达。****同样的，中医的认为脑和鼻是相通的，所以我们要提神醒脑，我们常常取鼻子，让鼻子保持通畅。**」\n\n**【极重要】麝香矾石散 = 98 矾石 + 2 麝香**\n\n```\n麝香（2，无孔不入，带路）\n矾石（98，干燥，清创）\n  → 鼻窦炎/昏迷/耳炎\n```\n\n**「矾石骑着麝香的背」——「这是最精的配伍比。」** ✓✓\n\n**极精！！\"脑「鼻相通→脑部残水从鼻清（降颅压）\"** ✅✅\n- **\"因为脑跟鼻子是相通的，造成我们治疗脑部肿瘤的时候、或有脑部的伤科是这个、中风、脑撞伤\"** ✓✓\n- **\"我们为什么是用麝香矾石把这个脑部的残水从鼻子里面清出来？是把那个脑部的压力减少，病人头部的疼痛会减下，同时神智会比较清醒一点\"** ✓✓\n- **\"脑部会用到麝香矾石，很彪悍嘛\"** ✓✓\n\n**【极精】\"脑「鼻相通→脑压降（讲义说）\"** ✅✅\n\n**须「强「标」**：**「①颅内压升高须立即急诊（不可用喷鼻降压）；②脑脊液鼻漏是真实急症；③脑外伤须CT + GCS」** ✓✓\n\n**极精！！\"吴「克潜的开窍全表\"** ✅✓\n- **\"一般毛孔闭塞的我们用麻黄，腠理闭塞者葛根以通之，荣卫闭塞者桂枝以通之，风塞者独活羌活以通之，血塞者延胡郁金以通之，肺气塞者桔梗前胡以通之，心气塞者菖蒲远志以通之，胃气塞者藿香川朴以通之，肝气塞者香附川芎以通之\"** ✓✓\n- **\"但是此类用法可以一脏一腑一经为治，并非闭塞之重者\"** ✓✓\n- **\"当诸邪深入、或内病暴作，内则经络全被遏阻之势，外则诸窍亦有闭塞之象；是故心神失其主、神志为蒙，此时势非麝香通之不可\"** ✓✓\n- **\"著名方剂有麝香天麻丸、麝昏蟾酥丸，及至宝丹、紫雪丹、苏合丸、牛黄清心丸等\"** ✓✓\n\n**【极精】\"开「窍的全表\"** ✅✅\n```\n毛孔→麻黄  腠理→葛根  荣卫→桂枝\n风→独活羌活  血→延胡郁金\n肺→桔梗前胡  心→菖蒲远志\n胃→藿香川朴  肝→香附川芎\n诸窍全闭→麝香（唯一）\n```\n\n**\"这是「最精的开窍地图！！\"** ✅✅","o":"RJ-2216 · 《人纪·神农本草经》上经第一百一十四味，讲解（PDF 第 280–281 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"麝香不煮","c":"讲义讲「一个极具体的用法」：「**这个时候非麝香不行，那臭也要吃啊，没关系，麝香是无毒的。****你要怎么吃？掏耳屎的那个小棒棒，一小块就够了，你不要整块都吞下去了。****正好急救嘛。****所以一个人你看他心神失常、眼睛看不到雾气重、经络闭锁的时候，就要想到使用它。****不需要煮。****【禁忌】凡是属于虚的，我们当补益，不要吃。****麝香攻坚的力量很强。**」\n\n**【极重要】麝香不煮（生用/吞）**\n\n```\n麝香 → 生用（不煮）\n  → 掏耳棒挑一小块\n```\n\n**「一小块就够，不要整块吞」——「这是最精的用量。」**要点：**须「强「标」**：**「①孕妇禁（可致流产）；②天然麝香属CITES附录I，禁用；③现代用人工麝香；④不可自服」** ✓✓","o":"RJ-2217 · 《人纪·神农本草经》上经第一百一十四味，讲解（PDF 第 282–283 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"牛黄的本草条目","c":"【本经原文】「**味苦平，主惊痫寒热，热盛狂痓，除邪逐鬼。**」【产地】「**牛黄生于病牛胆中，状如鸡子黄，多出陕西甘肃等地。**」【性味】「**味苦，性平，有小毒。**」【主治】「**牛黄为泻热定惊、利痰清心要药；主惊痫，寒热中恶，口噤，小儿惊邪，痘疮发狂，治痰迷，痉急，斑痧疮毒，益肝胆，定魂魄。**」【别录】「**疗小儿百病，诸痫热，口不开，大人狂癫，又堕胎。**」【用量】「**普通五分至一钱。**」【禁忌】「**恶龙骨龙胆（钱乙方中不忌）、地黄常山蜚蠊，畏牛膝干漆；风热未深者忌用。**」\n\n**【极重要】牛黄的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦/平/有小毒** |\n| **主治** | **泻热定惊/利痰清心/益肝胆** |\n| **禁** | **风热未深/孕妇（堕胎）** |\n\n**「泻热定惊、利痰清心」是最精的八字定位** ✓✓","o":"RJ-2218 · 《人纪·神农本草经》上经第一百一十五味「牛黄」，原文（PDF 第 283 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"牛黄是病牛的胆结石","c":"讲义讲「一个极精的来源」：「**大家都知道，有个很有名的药叫牛黄清心丸，那个北平的同仁堂、牛黄清心丸。****这个我们经方呢，张仲景是没有用牛黄的。****牛黄是怎么来的？是病的牛，牛生病了在胆上产生的那个黄，颜色看见就像鸡蛋黄一样，只有生病了的牛胆上才有那个东西。****那能够泄热定惊；牛黄一般来说清心丸嘛，就能止烦除烦，能让心情比较好。****尤其是过去用到牛黄的地方，南派用在清心这一类寒凉的药，用在这个癫痫、发痫。****只要小孩子喉咙发炎、扁桃发炎，小孩子发那个癫痫，小孩子出疹子、出红疹通通在使用牛黄。**」\n\n**【极重要】牛黄 = 病牛的胆结石**\n\n```\n牛生病 → 胆中黄（如鸡蛋黄）\n  → 牛黄\n```\n\n**「张仲景没有用牛黄」——「这是最精的来源（牛胆结石）。」** ✓✓","o":"RJ-2219 · 《人纪·神农本草经》上经第一百一十五味，讲解（PDF 第 283 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"禁用熊脂","c":"【本经原文】「**味甘微寒，主风痹不仁，筋急，五藏腹中积聚，寒热羸瘦，头疡白秃，面皯；久服强志，不饥轻身。**」【产地】「**熊身上之脂肪，今已经不用。**」讲义：「**第 116 味药，熊脂，现在是拿不到了，野生动物保护法。****有的时候是查获了一百多只熊掌，真是很恶劣，我到现在基本没开过。****你说有没有效？肯定有效；我们可以用别的方法来取代。****我看到杀只熊的，我不赞成这种做法；即使熊没有保护、到处都是熊，我不赞成讲这个，这个很残忍。**」\n\n**【极重要】禁用熊脂（保护动物）**\n\n```\n熊脂（有效）→ 禁（残忍）\n  → 用别的方法取代\n```\n\n**「我到现在基本没开过」——「这是最精的医者伦理。」** ✓✓","o":"RJ-2220 · 《人纪·神农本草经》上经第一百一十六味「熊脂」，原文及讲解（PDF 第 284–285 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"鹿角胶的本草条目","c":"【本经原文】「**味甘平，主伤中劳绝，腰痛羸瘦，补中益气，妇人血闭无子，止痛安胎；久服轻身延年；一名鹿角胶。**」【性味】「**味甘，性平，无毒。**」【主治】「**主补中益气，长肌增髓，止痛安胎，黑须发，强筋骨，壮腰膝，生精血，治伤中、虚损、劳嗽、吐血、尿血、下血、多汗淋露、腰痛羸瘦、四肢作痛、崩中带下。**」【别录】「**疗虚劳洒洒如疟，羸瘦，四肢酸疼，腰脊痛，小便数利，泄精溺血，破瘀血在腹，散石淋。**」【灵胎】「**补督脉，强肾气。**」【用量】「**普通七分至钱半。**」【禁忌】「**壮年慎用，阴虚火旺者忌；不可嗅，有虫恐入鼻内。**」\n\n**【极重要】鹿角胶（白胶）的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒** |\n| **主治** | **补中益气/强筋骨/止痛安胎** |\n| **禁** | **阴虚火旺/壮年慎** |\n\n**「补督脉、强肾气」是最精的四字（徐灵胎）** ✓✓","o":"RJ-2221 · 《人纪·神农本草经》上经第一百一十七味「白胶」，原文（PDF 第 284 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"鹿角是督脉之余","c":"讲义讲「一个极精的取象」：「**诸位看哦，鹿角是这样长的；这个鹿大概它在晚上睡觉的时候，头都是直的。****所以它晚上睡觉它会找一个小树丛、或者是树枝比较低的，走进去，把那个角放到枝桠撑到。****所以它活到的时候头角很直的，你看它的阳气多旺。****动物身上的角是督脉之余、督脉多余的地方；我们头发是血之余，角是督脉之余啊。****头发可以活血化瘀；鹿角胶你看它补督脉的力量强不强？所以一般来说督脉有什么，我们都会想到用鹿角胶、鹿角。**」\n\n**【极重要】鹿角 = 督脉之余**\n\n```\n发 = 血之余\n角 = 督脉之余\n  → 补督脉\n```\n\n**「头都是直的，阳气多旺」——「这条与 n209侧柏叶生发」、n172「头发是血余」同一体系。**要点：**这一条极重要，它是「督脉之余」** ✓✓","o":"RJ-2222 · 《人纪·神农本草经》上经第一百一十七味，讲解（PDF 第 285 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"久立伤骨用鹿角胶","c":"讲义讲「一个极实用的对应」：「**那我们什么时候会用到它？比如说你当老师，每天站在那边，久立伤骨，对不对？这个《黄帝内经》——久坐伤肌肉，久立，站那边伤骨。****那你可不可以吃？当然可以吃啊，腰痛羸瘦、补中益气。****女人月经不好、同时能够止痛安胎。****补中益气，那么长肌肉、增骨髓、黑头发，你看滋补的药很多。**」\n\n**【极精】久立伤骨 → 鹿角胶**\n\n```\n久立（老师/售货员）→ 伤骨\n  → 鹿角胶\n```\n\n**「久立伤骨」——「这条与 n182久立」同一体系。** ✓✓","o":"RJ-2223 · 《人纪·神农本草经》上经第一百一十七味，讲解（PDF 第 285 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"补药的时机","c":"讲义讲「一个极重要的原则」：「**诸位记得，下焦有火的人，滋补的药……不用。****比如说这个人每天他很虚弱、骨头会痛，这个药你给他说；他腰酸背痛，你给他说。****他又告诉你『我小便很痛、大便便秘、小便很黄』——你要把他的热去掉，再给他吃补药。****吃补药的时机一定要病人没有病的时候，你这样想就好啦；病人没有病的时候去补他，没关系。****那当然是虚寒的病人吃起来正对症，因为它是全阳的药啊、非常的对症，能够补督脉。**」\n\n**【极重要】补药的时机（无病时补）**\n\n```\n有热（尿黄/便秘/尿痛）→ 先清热\n无病（虚寒）→ 再补\n```\n\n**「无病时补」——「这条与 n200虚不受补」、n185「不足先补」同一体系。**要点：**这一条极重要，它是「补法时机」** ✓✓","o":"RJ-2224 · 《人纪·神农本草经》上经第一百一十七味，讲解（PDF 第 285–286 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"尺脉数禁补","c":"讲义讲「一个极快的判法」：「**所以你如果说你实在搞不清楚，你摸脉都可以。****尺脉，尺是下焦，你摸到尺脉是比较快、比较数，下焦就有热，那就先不要用它。****所以我们用在虚寒的病人、本来是萎的、阳痿的，我们一用鹿茸他就会翘起来。****那这个凡是督脉的病，通通都可以使用鹿角胶。**」\n\n**【极精】尺脉数 = 下焦热 → 禁补**\n\n```\n尺脉（下焦）数 → 有热 → 禁温补\n尺脉迟/弱 → 虚寒 → 可补\n```\n\n**「摸脉就能判」——「这是最精的脉诊应用。」** ✓✓","o":"RJ-2225 · 《人纪·神农本草经》上经第一百一十七味，讲解（PDF 第 286 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"阿胶的本草条目","c":"【本经原文】「**味甘平，主心腹内崩，劳极洒洒如疟状，腰腹痛，四肢酸疼，女子下血安胎；久服轻身益气。**」【产地】「**原产山东东阿县，用阿井之水将牛皮或驴皮煎熬而成；今多以驴皮熬胶入药。**」【性味】「**味甘，性平，无毒。**」【主治】「**阿胶为养阴清热要药，主清补肺脏，滋益肝肾和血液，坚筋骨，治风痛、虚劳喘嗽吐血、妇人血枯经闭、崩中带下。**」【别录】「**丈夫小腹痛，虚劳羸瘦，阴气不足，脚酸不能久立，养肝气。**」【药征】「**主治诸血症，故兼治心烦不得眠者。**」【容川】「**阿胶以水济火，是以坎填离；此阴汁得心火化为赤，即为血；益阴气，使阳不动、保持厥阴之本体。**」【灵胎】「**养肝滋血，补脾安胎。**」【用量】「**普通一钱至三钱。**」【禁忌】「**气味虽平和，然其性黏腻，胃弱作呕吐、脾虚食不消者均忌。**」\n\n**【极重要】阿胶的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒** |\n| **主治** | **养阴清热/补肺/安胎** |\n| **禁** | **胃弱/脾虚（黏腻）** |\n\n**「以坎填离」是最精的取象（水济火）** ✓✓","o":"RJ-2226 · 《人纪·神农本草经》上经第一百一十八味「阿胶」，原文（PDF 第 287 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"阿胶冲服不煮","c":"讲义讲「一个极重要的用法」：「**真的使用的时候打碎它，然后把它打成碎末一点；用的时候不煮的。****阿胶不能煮；这个你要吃的时候，趁滚水的时候，煮两碗药，把药渣拿掉，火不要关、一点点火。****就看到那个汤剂上面有点点冒泡泡，这个时候把阿胶冲下去，和一和、关火。****不能煮啊，一煮阿胶就没啦、一点力量都没有了。**」\n\n**【极重要】阿胶 = 冲服（不煮）**\n\n```\n阿胶 → 趁滚汤冲下（余火）\n  → 一煮失效\n```\n\n**「一煮就没力量」——「这条与 n188大黄后下」、n209「肉桂冲服」同一体系。**要点：**这一条极重要，它是「冲服法」** ✓✓","o":"RJ-2227 · 《人纪·神农本草经》上经第一百一十八味，讲解（PDF 第 287–288 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"月经期禁阿胶","c":"讲义讲「一个极重要的禁忌」：「**阿胶是补血补心血的药，补血的力量很强，我们常常在使用。****阿胶吃了可以安胎、阿胶可以止血。****那女孩子月经来的时候不要吃阿胶。****有的人不会，绝大多数的人会哦；月经来的时候一吃阿胶，因为阿胶收敛血的力量很强。****月经来了本来是五天，来的第二天不小心吃了阿胶，月经没了。****那没有关系，停掉了、下次月经又来，所以阿胶要禁这个事情。****同样的有的女的她吃了阿胶，月经照来，那是血虚的时候。**」\n\n**【极重要】月经期禁阿胶（止血）**\n\n```\n正常经期 → 禁（血止）\n血虚经少 → 反而量多（滋补）\n```\n\n**「双向」——「这条与 n182双向调节」同一体系。**要点：**这一条极重要，它是「双向」** ✓✓","o":"RJ-2228 · 《人纪·神农本草经》上经第一百一十八味，讲解（PDF 第 287–288 页）。"},{"t":"神农本草经·上经：麝香（续）、牛黄、熊脂、白胶（鹿角胶）、阿胶","h":"黄连阿胶汤治心血虚失眠","c":"讲义讲「一个极精的方」：「**各种的血症，兼治心烦不得眠。****我们经方里面有一个叫黄连阿胶汤，那就是心烦不得眠。****我们有酸枣仁汤也可以治，还有很多、豆豉汤，很多都可以治疗失眠的。****这黄连阿胶汤是一个，心血虚的时候不得眠。**」\n\n**【极精】黄连阿胶汤 = 心血虚不得眠**\n\n```\n心血虚 → 心烦不得眠\n  → 黄连阿胶汤\n```\n\n**「心血虚」——「这条与 n210酸枣仁汤」同一主题。** ✓✓","o":"RJ-2229 · 《人纪·神农本草经》上经第一百一十八味，讲解（PDF 第 288 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"石蜜的本草条目","c":"【本经原文】「**味甘平，主心腹邪气，诸惊痫痓，安五藏，诸不足，益气补中，止痛解毒除众病，和百药；久服强志轻身，不饥不老。**」【产地】「**产四川浙江等地，即白沙糖之凝结成块者。**」【性味】「**味甘，性寒，无毒。**」【主治】「**石蜜主和中益脾，润心肺解酒毒，治目中热膜，燥热咳嗽，心腹胀热，口干渴。**」【灵胎】「**养胃和中。**」【用量】「**普通做食品，入药无定量。**」【禁忌】「**无。**」【吴克潜】「**糖之赤者为赤沙糖，白者为白沙糖，凝结成块者为冰糖，入药用冰糖最良。**」讲义：「**石蜜讲的就是冰糖，你看外面白白一块的，市面上卖的就是冰糖；中药很多我们在熬药的时候，丢几块糖下去，那种就是冰糖。**」\n\n**【极重要】石蜜（冰糖）的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/寒/无毒** |\n| **主治** | **和中益脾/润心肺/解酒毒** |\n| **禁** | **无** |\n\n**「禁：无」是上经药最典型的特征** ✓✓","o":"RJ-2230 · 《人纪·神农本草经》上经第一百二十一味「石蜜」，原文及讲解（PDF 第 292 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"上经补身中经治病","c":"讲义讲「一个极重要的分层」：「**一般来说，食物都是性寒、微寒的药；微寒的东西呢都是补中益气。****所以你看《神农本草经》，上经大部分都是益气延年、随时可以喝的补身体用的；真正治病的药是在中经。**」\n\n**【极重要】上经补身，中经治病**\n\n```\n上经 → 益气延年（可日常）\n中经 → 治病（须辨证）\n下经 → 攻邪（须慎）\n```\n\n**「分区就是分级」——「这是最精的三经分层。」** ✓✓","o":"RJ-2231 · 《人纪·神农本草经》上经第一百二十一味，讲解（PDF 第 292 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"精炼糖是毒药","c":"讲义讲「一个极强烈的批评」：「**市面上卖的是……你不要想现代人的糖，现代人的糖是不对的、那个是精炼糖，那个不对的，不能吃的，那根本就是毒药。****你如果不相信我的话，你去买杯咖啡，不要加糖你喝下去过 20 分钟胃酸就起来了；然后你再加糖下去，再喝 10 分钟胃酸就起来，更强。****那个白糖是精炼的糖，因为精炼糖以后体积非常小；我们嘴巴里的一些细菌病毒、嘴巴很大，那你体积很小了后，它会喂食它。****当你一喂食它以后，这些细菌吃了以后，排出来的代谢物就是酸的；第一个把你牙齿腐蚀掉，第二个到胃里面就是胃酸。**」\n\n**【极重要】精炼糖 = 毒药（讲义强调）**\n\n```\n精炼糖（体积小）\n  → 喂食口腔细菌 → 产酸 → 龋齿 + 胃酸\n\n天然蔗糖/冰糖（体积大）\n  → 滋补\n```\n\n**「体积越小越有害」——「这是最精的体积论。」**要点：**须「标」**：**「①精炼糖过量确有害（龋齿/肥胖/代谢）；②但『精炼糖是毒药』过度；③WHO建议游离糖<10%总能」** ✓✓","o":"RJ-2232 · 《人纪·神农本草经》上经第一百二十一味，讲解（PDF 第 292–293 页）。"},{"t":"神农本草经·上经：石蜜（冰糖）、蜂蜜/蜂蜡/蜂子、蜜蜡、牡蛎、龟甲","h":"蔗糖外敷止血","c":"讲义讲「一个极精的外用法」：「**这个蔗糖我们不单单是饮食里面加在里面、面包里面可以用蔗糖；外用，任何的刀伤伤口，你一受伤，家里面有蔗糖。****一下刀有伤口，这个蔗糖拿起来压到那个伤口，大概两三分钟放开来，就看到止血了。****因为糖是粘稠嘛，糖能够止血。****然后你持续不要用什么药，持续它干掉你再换；洗完澡一看它冲掉你再放点下去，大概三天，疤痕都没有、连疤都看不到。**」\n\n**【极精】蔗糖外敷止血**\n\n```\n蔗糖（粘稠）→ 压迫止血\n  → 三天疤痕都不见（讲义说）\n```\n\n**须「强「标
