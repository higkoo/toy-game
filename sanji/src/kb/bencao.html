医生。****或者卵巢子宫切掉了、没有月经了，你给人家吃土瓜根，这不是很好呀。**」\n\n**【极重要】更年期月闭是正常（禁催经）**\n\n```\n49 岁天癸竭 → 月经停（正常）\n  → 不可用土瓜根强催\n```\n\n**「这是最精的提醒。」** ✓✓","o":"RJ-2411 · 《人纪·神农本草经》中经第一百九十味，讲解（PDF 第 410–411 页）。"},{"t":"神农本草经·中经：水萍（续）、王瓜、地榆、海藻、泽兰","h":"泽兰是女科行水行血药","c":"【本经原文】「**一名龙枣；味苦，微温，无毒；治乳妇衄血，中风余疾，大腹水肿，身面四肢浮肿，骨节中水，金疮，痈肿疮脓。**」【性味】「**味苦甘，性微温，无毒。**」【主治】「**泽兰为女科要药，功能行血消水，主养血气，破宿瘀，消症瘕痈肿，胎前产后诸病。**」【甄权】「**产后腹痛，频产血气衰冷，成劳瘦羸，妇人血沥腰痛。**」【大明】「**胎前产后百病，通九窍，利关节，养血气破宿血，消症瘕，通小肠，长肌肉，消扑损瘀血。**」【灵胎】「**清湿热，治水肿。**」【用量】「**普通一钱至三钱。**」【禁忌】「**破血通积，大虚不宜。**」讲义：「**泽兰是最主要是行水、行血、消水的重要的药物。****几乎你看到一个女人过胖、身上有积水，统统可以使用。**」\n\n**【极精】泽兰 = 女科行水行血（浮肿）**\n\n**「行血 + 消水双能」——「这条与 n225白茅根一药双能」同一体系。** ✓✓","o":"RJ-2412 · 《人纪·神农本草经》中经第一百九十三味「泽兰」，原文及讲解（PDF 第 417 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"防己的品种","c":"讲义讲「一条极重要的品种警告」：「**一百九十四这个防己，市面上有汉防己、木防己，还有广防己，什么什么很多说明。****我们使用的是木防己。****前一阵子说『哎呀这个有马兜铃酸什么呀』——马兜铃本来就是中药，那广防、那个汉防己里面也有含有马兜铃在里面。****马兜铃呢本身是个中药，有个中药就叫马兜铃；汉防己里面也有马兜铃的成分在里面，那是毒的。****我们使用的防己是木防己，木防己没有毒。**」\n\n**【极重要】防己品种：木防己（无毒）vs 汉防己（含马兜铃酸）**\n\n```\n木防己 → 无毒（讲义所用）\n汉防己/广防己 → 含马兜铃酸 → 肾毒\n```\n\n**须「绝「对「强「标」**：**「①马兜铃酸已被证实致肾衰/上尿道癌；②广防己/汉防己多国禁用；③不可自行服用防己」** ✓✓\n\n**「这是全段最重要的安全警告。」** ✓✓","o":"RJ-2413 · 《人纪·神农本草经》中经第一百九十四味「防己」，讲解（PDF 第 419 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"防己纹如车轮","c":"【容川】「**能去湿热，属苦降之品；其形中空，纹如车轮，能外行腠理，内行三焦，能通水气。**」讲义：「**诸位看防己长这个样子，他的颜色，中间是白的、旁边是黄的。****唐容川他说，这个能够去湿热，因为他是苦、辛苦；辛苦能够降火。****纹如车轮，所以他能够外行腠理、内行三焦、通水气，这个解释得很好。**」\n\n**【极精】防己纹如车轮（外行腠理、内行三焦）**\n\n**「中空纹如车轮」——「这是最精的取象。」** ✓✓","o":"RJ-2414 · 《人纪·神农本草经》中经第一百九十四味，原文引唐容川及讲解（PDF 第 419 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"减肥方的完整组方","c":"讲义讲「一个极精的实操」：「**有一个人呢，老师我太胖了，胃口非常大，我一天可以、一餐吃好几碗，常常一直在饿。****石膏是白虎、他是主阳明经热的药，石膏是很寒凉的药；你一下去的时候，如果说三钱，没用——三钱是刷牙漱漱口的；你改三两，喔、很大，一吃下去，胃马上缩小。****缩小了以后，那一点欲望都没有，看到食物都不想吃了。****知母能够去热，加上一点知母去热。****那个人已经很胖，我们多加点防己，来把里面的三焦油、里面的水排一排。****用点茯苓，茯苓本来就是白色、根部的，能够渗、甘淡渗湿的药，所以说能够把多余的水分也给他剔掉。****泽泻可以利全身的水。**」\n\n**【极重要】减肥方：石膏 + 知母 + 防己 + 茯苓 + 泽泻**\n\n```\n石膏（三两）→ 缩胃/去胃火\n知母 → 去热\n防己 → 清三焦油\n茯苓 → 渗肌肉水\n泽泻 → 利全身水\n```\n\n**须「强「标」**：**「①石膏三两可致胃寒/电解质；②减重须GLP-1等规范药物 + 生活方式；③不可自行大剂」** ✓✓","o":"RJ-2415 · 《人纪·神农本草经》中经第一百九十四味，讲解（PDF 第 419–420 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"减肥方须加利尿","c":"讲义讲「一个极重要的补救」：「**因为你一不吃东西以后，身上会积水呀，很好玩：你平常吃点、没什么变得很扎实，你突然瞬间没有胃口了；没有胃口以后，身上会把水释放出来，这个时候你那个身上会虚胖。****这时候你用防己来把三焦系统的水统统清利掉。****那你弄不好，我们开处方不是面面俱到的；你开个处方忘了利尿，吃完他胃口没了，胃口没了以后他开始积水，容易积水呀，因为没有吃东西呀。**」\n\n**【极精】减胃口后必积水（须配利尿）**\n\n```\n突然无胃口 → 水释放 → 虚胖/积水\n  → 必须配防己/茯苓/泽泻\n```\n\n**「忘了利尿就会积水」——「这是最精的补救。」** ✓✓","o":"RJ-2416 · 《人纪·神农本草经》中经第一百九十四味，讲解（PDF 第 420 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"款冬花引肺气下行","c":"【本经原文】「**味辛，温，无毒；治咳逆上气，善喘，喉痹，诸惊痫，寒热邪气。**」【性味】「**味辛甘，性温，无毒。**」【主治】「**款冬花为润肺祛痰止嗽要药，主治咳逆上气，肺痿肺痈，寒热邪气。**」【甄权】「**疗肺气心促，急热劳咳，连连不绝，涕唾稠粘，肺痿肺痈吐脓血。**」【大明】「**润心肺，益五脏，除烦消痰，洗肝明目。**」【用量】「**普通钱半至三钱。**」【容川】「**此药生于冬月冰雪之中，而花又在根下，乃坎中之阳象，故能引肺中阳气下行，而为利痰止咳之要药。**」讲义：「**它因为是温性的药，所以说你要治疗寒性的肺的问题最好。****比如说病人寒咳，躺下去人就咳，那嘴巴也不口渴，常常喉咙里面有水的声音、肺里面有积水的声音，都可以使用它。**」\n\n**【极精】款冬花引肺气下行（坎中阳象）**\n\n**「花在根下 = 坎中之阳」——「这是最精的取象。」** ✓✓","o":"RJ-2417 · 《人纪·神农本草经》中经第一百九十五味「款冬花」，原文及讲解（PDF 第 420–421 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"款冬花无禁忌","c":"讲义讲「一个罕见的定评」：「**一般来说，因为它药性是温的，并不是说很强的、很热的药，是平温的。****所以【禁忌】里面说，款冬花为什么叫冬花？冬天的时候它开花。****它的药性是辛散、润，能够润燥，甘缓而和，所以有的时候你看到咳嗽，不清楚虚实寒热，你都用冬花都没有关系。****没有那么强烈的，说一定要寒证的才使用，热证也可以使用。它没有什么大的禁忌。**」\n\n**【极精】款冬花无禁忌（虚实寒热皆可）**\n\n**「不清楚虚实寒热就用冬花」——「这是最精的容错药。」** ✓✓","o":"RJ-2418 · 《人纪·神农本草经》中经第一百九十五味，讲解（PDF 第 421 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"丹皮是理血要药","c":"【本经原文】「**味辛，寒，无毒；治寒热，中风，瘛瘲，痉，惊痫，邪气，除症坚，瘀血留舍肠胃，安五脏，疗痈疮；今名丹皮。**」【性味】「**味辛苦，性微寒（或作性温），无毒。**」【主治】「**丹皮为理血要药，功能清伏火，凉血热，通月经，排瘀血；主治胎前产后，冷热气血之病，为女科良剂。**」【甄权】「**治冷气，散诸痛，女子经脉不通，血沥腰痛。**」【大明】「**通关腠血脉，排脓，消扑损瘀血，续筋骨，除风痹。**」【容川】「**其色味如红花，而根性主下达，与花不同，故主内及泄中下焦之血。**」【用量】「**普通一钱至三钱。**」【禁忌】「**入血凉血能行血；凡女子血崩，及经血过期不尽，均忌与行血药同用。**」讲义：「**丹皮我们用得非常的广，十个里面有八个我们都在开丹皮。****丹皮是理血的，反正有血症，我们都会使用丹皮。**」\n\n**【极重要】丹皮 = 理血要药（有血症就用）**\n\n**「十个里八个都在开」——「这是最精的使用频率。」** ✓✓","o":"RJ-2419 · 《人纪·神农本草经》中经第一百九十六味「牡丹」，原文及讲解（PDF 第 421–422 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"久病必有淤","c":"讲义讲「一条极重要的法则」：「**【刘元素】那边他说神智不足无汗的骨蒸——那个不是山谷的谷哦，我们要更正，是骨头的骨，骨里面发热。****一般来说，虚，久病必有淤。****唐容川呢，他认为久病之人哪，必有淤。****所以说他会出血症论，就是活血化瘀，这是他的法则。**」\n\n**【极重要】久病必有淤（唐容川《血证论》）**\n\n**「这条与 n80治病必先去其血」同一主题。** ✓✓","o":"RJ-2420 · 《人纪·神农本草经》中经第一百九十六味，讲解（PDF 第 422–423 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"活血化瘀不能单独用","c":"讲义讲「一条极精的治癌思路」：「**那一般我们治疗癌症、治疗硬块肿瘤的时候，就是活血化瘀，讲穿了就是活血化瘀。****你光是活血化瘀没有用哦，它只是一个部分。****你要把阴，就是要用热药下去，把阴实的门打开来，然后才有办法把病去除掉。****但是你如果说，把那个热的药下去啊、把实、堵塞得到的硬块，同时加入活血化瘀的药，就是我们很好的治癌的妙药。**」\n\n**【极重要】活血化瘀不能单独用（须热药开门）**\n\n```\n单用活血化瘀 → 无门可入 → 无效\n热药开阴实之门 + 活血化瘀 → 治癌\n```\n\n**「把阴实的门打开」——「这是最精的治癌思路。」** ✓✓\n\n**须「强「标」**：**「①癌症须规范治疗；②热药（附子/硫磺）有毒；③不可自行配方」** ✓✓","o":"RJ-2421 · 《人纪·神农本草经》中经第一百九十六味，讲解（PDF 第 423 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"根往下花往上","c":"讲义讲「一条极精的取象」：「**唐容川说，其色味如红花，它颜色看起来像红花一样；而根本生的任何的根，根的性都是往下走的，都是主下达；所以你要用植物的根的时候，都是往下走的。****花都是往上走的，所以我们鼻子病很多是用取花的。****淤血、气、阻气都在腹部。****正常的人呢，阳要在阴里面，这个脏才会有功能、才会有活动。**」\n\n**【极精】根往下（主下达）、花往上（主上行）**\n\n```\n根 → 下行（中下焦/腹部）\n花 → 上行（鼻/头面）\n```\n\n**「这条与 n211根升梢降」同一体系。** ✓✓","o":"RJ-2422 · 《人纪·神农本草经》中经第一百九十六味，讲解（PDF 第 423 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"出血禁辛辣","c":"讲义讲「一条极实用的禁忌」：「**丹皮呢，因为它入血、凉血，它能够行血；所以凡是女子血崩、已经在出血了、月经过期一直没有停，本来应该上个礼拜就停的，结果月经到现在滴滴答答还在来，还在出血，这个时候呢，你不能和排血、行血的药一起吃，吃下去的话，越吃呢、血量就越多。****在失血的时候，辛辣的东西不能吃。****蒜啦，辛辣的不要；你病人现在出血、刚失完血、现在伤口正在收口。****辛辣的主发散，你越吃血就流得越多，就不要吃辛辣的东西。**」\n\n**【极重要】出血禁辛辣（辛主发散）**\n\n```\n出血中 → 禁行血药 + 禁辛辣（蒜/辣椒）\n   → 辛散 → 出血更多\n```\n\n**「这是最精的医嘱。」** ✓✓","o":"RJ-2423 · 《人纪·神农本草经》中经第一百九十六味，讲解（PDF 第 424 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"荆芥是发表替代","c":"【本经原文】「**味辛，温，无毒；治寒热，鼠，瘰疬生疮，破结聚气，下瘀血，除湿痹；一名鼠蓂，又名荆芥。**」【性味】「**味辛，性温，无毒。**」【主治】「**荆芥为发表要药，功能祛风理血，发汗退热；主治寒热头疼诸风疮毒；亦为妇人胎前产后良剂。**」【甄权】「**单用治恶风贼风，口面歪斜，遍身瘰痹，心虚忘事，益力添精。**」【用量】「**普通八分至二钱。**」【禁忌】「**凡表虚有汗，血虚寒热，阴虚火炎面赤，因而头痛者均忌。**」讲义：「**你如果说，走个地方，哎呀老师，他这个麻黄也没有卖、桂枝也没有，那我们用什么办法发表？就要荆芥。****荆芥可以发表，功能祛风理血，发汗退热。****除了内服以外，新鲜的荆芥，你把它捣烂、跟醋和在一起，涂在外伤的创口、脓疡、脓疮的创口，都可以。**」\n\n**【极精】荆芥 = 发表替代（无麻黄桂枝时）**\n\n**「外敷内服皆可」——「这是最精的实用价值。」** ✓✓","o":"RJ-2424 · 《人纪·神农本草经》中经第二百零三味「假苏」，原文及讲解（PDF 第 426 页）。"},{"t":"神农本草经·中经：泽兰（续）、防己、款冬花、牡丹、荆芥","h":"香苏治背痛腰痛","c":"【本经原文】「**味咸，寒，无毒；治腰脊病不得着床，俛仰艰难；除热，可做浴汤；又名香苏。**」【性味】「**味咸性寒。**」【主治】「**散瘀血，镇痛药，治腰痛及杖疮。**」【苏敬】「**疗血胀下气，治杖疮捣汁涂之。**」讲义：「**过去的名称我们叫爵床，现在我们叫香苏；讲香苏人家就知道了，讲爵床就没有人知道。****这个是背痛、腰痛使用得很多，弯、前后俯仰都不行的，使用的。****当然你针灸也可以啊。**」\n\n**【极精】香苏（爵床）= 背痛/腰痛（俯仰艰难）**\n\n**「不得着床、俛仰艰难」——「这是最精的原文描述。」** ✓✓","o":"RJ-2425 · 《人纪·神农本草经》中经第二百零二味「爵床」，原文及讲解（PDF 第 425–426 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"吴茱萸的本草条目","c":"【本经原文】「**味辛，温，有小毒；主温中，下气，止痛，咳逆，寒热，除湿，血痹，逐风邪，开腠理；根，温，杀三虫。**」【性味】「**味辛，性温，有小毒。**」【主治】「**吴茱萸为下气开郁、除风寒湿要药，主温中逐寒，驱风散热，止痛疗痹，治心腹冷痛，下焦冷气，中寒中恶，呕吐泻利，亦杀虫。**」【甄权】「**霍乱转筋，胃冷吐泻，腹痛，产后心痛，治遍身瘰痹刺痛。**」【容川】「**吴茱萸辛而带苦，子性又主下降，故主降水饮，行滞气；专治肝寒之吐逆。**」【药征】「**主治呕而胸满。**」【灵胎】「**驱肝风，逐肺寒。**」【用量】「**普通三分至钱半。**」【禁忌】「**凡一切阴虚之证，及五脏六腑有热无寒之人，均忌用吴茱萸。**」讲义：「**我们有时候遇到一些病人呢，呕吐、恶心，我们要找止呕的药，吴茱萸就是很好、很好的止恶心的药。****你必须要寒症引起的恶心才会使用到吴茱萸。**」\n\n**【极重要】吴茱萸 = 止呕专药（寒症）**\n\n**「药征只说四个字：主治呕而胸满——越简单越正确。」** ✓✓","o":"RJ-2426 · 《人纪·神农本草经》中经第二百零七味「吴茱萸」，原文及讲解（PDF 第 429–430 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"剂量判断病情深浅","c":"讲义讲「一条极精的定量法」：「**当你使用吴茱萸的时候，一般的胃下垂，1 钱马上好了，吃下去很舒服了。****当你用到 1 钱没有效，2 钱的时候，你就知道这个人是胃癌了嘛，或是胰脏癌之类的。****因为你很确定你的药品质是好的，第二个，你很确定病人是寒症、是需要这个药。****那你从药的剂量上面，你就可以判断出来这个病的深浅。****胰脏癌我吴茱萸都用 3 钱啊、4 钱啊；那一般的胃下垂 1 钱就够了。****所以处方的剂量、吃下去以后病人恢复的情形，可以协助医生判断病情的深浅。**」\n\n**【极重要】剂量反应 = 病情深浅的探针**\n\n```\n1 钱无效 → 2 钱有效 → 提示重症（胃癌/胰脏癌）\n1 钱即效 → 轻症（胃下垂）\n```\n\n**「以剂量测深浅」——「这是全书最精的定量诊断法。」** ✓✓\n\n**须「强「标」**：**「①癌症须影像/病理确诊；②不可用剂量反应判癌；③吴茱萸过量有毒」** ✓✓","o":"RJ-2427 · 《人纪·神农本草经》中经第二百零七味，讲解（PDF 第 431–432 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"吴茱萸配干姜","c":"讲义讲「一条极精的配伍」：「**吴茱萸在用的时候我们常常是配合干姜在使用的。****因为吴茱萸也是辛香发散嘛、干姜也是一样；因为干姜入胃、吴茱萸入肝。****那这两个碰在一起的话，肝胃之间的寒就能够去掉，也就是中焦的寒都可以去掉。****所以我们常常吴茱萸是配合干姜在使用它，不单单是单味的吴茱萸。**」\n\n**【极精】吴茱萸（肝）+ 干姜（胃）= 去中焦之寒**\n\n```\n吴茱萸 → 入肝\n干姜 → 入胃\n合用 → 肝胃之寒（中焦）皆去\n```\n\n**「辛夷菖蒲一对、桂枝白芍一对」——「药是成对出来的」** ✓✓","o":"RJ-2428 · 《人纪·神农本草经》中经第二百零七味，讲解（PDF 第 433 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"有毒的药放片姜","c":"讲义讲「一条极精的配伍法则」：「**当我们使用药、中药的时候有一点点毒性的时候，我们中医都喜欢放一点点姜在里面，不管是生姜还是干姜，都是姜，都可以解毒。****所以吴茱萸我们放一点点姜，好像我们使用半夏也放一点姜一样；吴茱萸放一点干姜，这两个常常是合并在一起使用。****我们药是出来是成对的。**」\n\n**【极精】有毒的药放姜解毒（半夏/吴茱萸）**\n\n```\n有毒性药（半夏/吴茱萸）+ 姜 → 解毒\n```\n\n**「这条与 n203附子配生姜」同一体系。** ✓✓","o":"RJ-2429 · 《人纪·神农本草经》中经第二百零七味，讲解（PDF 第 433 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"寒热的分辨","c":"讲义讲「一条极简的三问」：「**实际上就是寒性的恶心。****老师到底寒热我怎么辩？你问他：你口渴不渴？不渴就是寒，渴、热嘛。****那你想喝喝热水、冷水？『我想喝冰水』——里面是热的嘛；『我想喝温水』——里面是冷的嘛。****舌苔我看看，舌头伸出来白白厚厚的，寒嘛；黄黄的，热嘛，已经讲完了。**」\n\n**【极重要】寒热三问：渴不渴、要冰/温、舌苔白/黄**\n\n**「这条与 n224两杯水测试」、n219「咳嗽一问」同一体系。** ✓✓","o":"RJ-2430 · 《人纪·神农本草经》中经第二百零七味，讲解（PDF 第 432–433 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"人参半夏干姜汤","c":"讲义讲「一个极精的经方」：「**一个妇女跑来了，老师我现在这个怀孕，那怀孕了五个月、吐了五个月，每天抱在马桶那边，这个日子怎么过。****七个月的是中国人，六个月的是美国人的白种人太太。****那个美国人相信西医，就跑到西医那边去；西医说哪有呕吐那么厉害的，胃镜进去，出出进进一个多小时，胃镜把她的胰脏刮破，又开刀动手术，小孩子失掉、流掉。****中国人呢，找中医；我一看，这个恶心很简单嘛，呕吐津液已经伤了很多。****加点人参，人参在里面把津液补一下；恶心得很厉害，加点干姜，干姜能够止呕、那个温中嘛止呕；还因为不是肝脏，是因为下焦的那个肚子怀孕的小孩子水往上冲、羊水太多往上冲，我们还用一点半夏下去。****三味药，这是经方——人参半夏干姜汤，在妇科里面的；三味药药粉，给她三包吃下去，回家就呕就好了，收她 15 块美金。**」\n\n**【极精】人参半夏干姜汤（妊娠恶阻）**\n\n```\n妊娠呕吐 → 人参（补津液）+ 半夏（降逆）+ 干姜（温中止呕）\n```\n\n**须「强「标」**：**「①妊娠剧吐（HG）须查电解质/酮体；②半夏妊娠须慎用；③须产科随访」** ✓✓","o":"RJ-2431 · 《人纪·神农本草经》中经第二百零七味，讲解（PDF 第 433–434 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"一剂知二剂已的适用范围","c":"讲义讲「一条极重要的分界」：「**务求让诸位一剂知，很多病象感冒啊都一剂知、二剂已。****肠胃病、真正入到阴脏的时候、阴实的时候，就要耗很多时间。****所有一般的表症，几乎都一剂知、二剂已的。**」\n\n**【极重要】一剂知二剂已只适用于表症**\n\n```\n表症（感冒）→ 一剂知、二剂已\n肠胃病 → 需时间\n阴实（癌症）→ 耗很多时间\n```\n\n**「这是最精的分界。」** ✓✓","o":"RJ-2432 · 《人纪·神农本草经》中经第二百零七味，讲解（PDF 第 432 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"不要滥用 X 光","c":"讲义讲「一条极敏感的警告」：「**今天有个人报纸登出来，有个专门修理 X 光机的那个技师得到血癌。****所以，你如果闲了、穷极无聊，你就去照 X 光。****一个腰痛也要去照 X 光，你多问两句话嘛：你这个腰痛什么时候开始的？昨天开始的；那你昨天有没有抬东西？有！讲完了，就知道受伤得到的嘛。****多问几个问题，多深入一下就已经知道它怎么回事了，不要一定去照个片子再说。****真正你的车祸意外偶尔去照一下无所谓，你不要滥用它嘛。**」\n\n**【极精】不要滥用 X 光（多问几句胜过照片子）**\n\n**「这条与 n178问得越少越高明」须修正相对——这里主张多问** ✓✓\n\n**须「标」**：**「①辐射有剂量阈值，合理使用利大于弊；②该做的CT/X光不可拒；③不可因此延误诊断」** ✓✓","o":"RJ-2433 · 《人纪·神农本草经》中经第二百零七味，讲解（PDF 第 431–432 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"药房必须中医管药","c":"讲义讲「一条极重要的主张」：「**我们处方的时候很麻烦，第一个，你的药品管要很好，所以药房一定要自己管、不能给人家管。****现在台湾不知道哪个笨蛋、白目立了一个法规，是一个 GMP 的厂在管，那你完了，药的品质不能确定。****药品质不能确定的话，医师处方下手的时候，要是病人没有好反应的话，医师以为我错了。****药房一定要中医管，几千年来都是中医师在管药房的。**」\n\n**【极重要】药品管决定剂量判断**\n\n```\n药品质好 → 无效 = 剂量不够（可加量）\n药品质差 → 无效 = 归因错误\n```\n\n**「品质不能确定，医师以为我错了」——「这是最精的因果。」** ✓✓","o":"RJ-2434 · 《人纪·神农本草经》中经第二百零七味，讲解（PDF 第 431 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"栀子泻火要药","c":"【本经原文】「**味苦，寒，无毒；治五内邪气，胃中热气，面赤，酒疱皶鼻，白癞，赤癞，疮疡。**」【性味】「**味苦，性寒，无毒。**」【主治】「**栀子为泻火要药，主五内邪气时热，心烦懊憹，泻三焦火，清胃脘血，治五种黄病，通小便，解消渴。**」【别录】「**疗目赤热疮，胸心大小肠大热，心中烦闷。**」【甄权】「**去热毒风，除时疾热，解五种黄病，利五淋，通小便，解消渴，明目。**」【元素】「**治心烦懊憹不得眠，脐下血滞而小便不利。**」【丹溪】「**泻三焦火，清胃脘血，治热厥心痛，解热郁，行结气。**」【药征】「**主治心烦也，旁治发黄。**」【灵胎】「**清胃热，泻肺火。**」【用量】「**普通一钱至三钱。**」【禁忌】「**凡脾胃虚弱，血虚发热，心肺无邪热，小便闭由膀胱气虚，均忌。**」讲义：「**栀子呢是泻火的药，泻火主要的药。****所以栀子去黄很有名，专门去黄的专剂。**」\n\n**【极重要】栀子 = 泻火要药（心烦 + 发黄）**\n\n**「药征只两句话：主治心烦，旁治发黄」** ✓✓","o":"RJ-2435 · 《人纪·神农本草经》中经第二百零八味「栀子」，原文及讲解（PDF 第 435–436 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"栀子豆豉汤","c":"讲义讲「一个极精的经方」：「**如果你的祖母或者谁晚上睡不着、很烦，睡不着，你就想到栀子；栀子可以除烦，吃下去人很开心就睡去了，虚热除烦。****心是君主之官，肺为相傅之官，来节制心火之太过。****肺和心两个关系很好的时候，肺就可以把心脏的热往下导，让这个热进入小肠。****那如果肺的津液不够，心的热往上走的时候、心火太盛，这个时候就会懊憹啊、产生心烦。****张仲景治心中懊憹用栀子豆豉汤。****过去我们栀子豆豉汤不单单是心中懊憹，还有大病、刚生完重病——病通通好了，哎奇怪这个病人现在失眠，什么都好了，就是睡觉睡不好，栀子豆豉汤。****所以一般来说，大病初愈之后的失眠，我们也会用到栀子豆豉汤。**」\n\n**【极重要】栀子豆豉汤 = 心烦懊憹 + 大病初愈失眠**\n\n```\n心烦懊憹（肺不能导心火下行）→ 栀子豆豉汤\n大病初愈失眠 → 栀子豆豉汤\n```\n\n**「虚烦不得眠」——「这是最精的定位。」** ✓✓","o":"RJ-2436 · 《人纪·神农本草经》中经第二百零八味，讲解（PDF 第 436 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"栀子象心包","c":"【容川】「**栀子味苦象心包，故能泻心包之火。性苦寒，有皮膈，象心包，内之子赤，正属心之色；其花色白，当属肺金，结子成赤，当属心火，是为从肺入心，正治心中烦热之药。****栀子花白子赤，正是以肺金而归制心火也。**」讲义：「**栀子拿起来看看，一个个象心包一样，圆圆的、红红的，所以它能泻心包的火。****心包和三焦是表里嘛。**」\n\n**【极精】栀子象心包（花白子赤 = 肺金制心火）**\n\n```\n栀子花白（肺金）→ 子赤（心火）\n  → 以肺金制心火\n```\n\n**「这是最精的取象。」** ✓✓","o":"RJ-2437 · 《人纪·神农本草经》中经第二百零八味，原文引唐容川及讲解（PDF 第 436 页）。"},{"t":"神农本草经·中经：桑根白皮、竹叶、吴茱萸、栀子","h":"竹叶与竹茹","c":"【本经原文】「**味苦，平，无毒；治咳逆上气，溢筋急，恶疡，杀小虫；根，作汤，益气，止渴，补虚，下气。**」【主治】「**竹叶为解热，祛痰，止渴，镇静药，止消渴，热狂烦闷及小儿惊痫。**」【容川】「**因叶在四旁，则主四散，故能清肌中之热；竹茹象人之筋脉，则清脉络之热以和血。**」【用量】「**五钱至一两。**」【禁忌】「**寒症忌用。**」讲义：「**临床上用得最多就是消渴，就是所谓的糖尿病，嘴巴口渴，我们开竹叶汤啊。****那这个竹叶呢，它专门去痰热，尤其是痰热，妇女怀孕中间的热，这个竹叶非常的好用。**」\n\n**【极精】竹叶（叶主四散清肌热）+ 竹茹（象经脉清络热）**\n\n**「竹茹不是竹笋」——「这是最精的提醒。」** ✓✓","o":"RJ-2438 · 《人纪·神农本草经》中经第二百零六味「竹叶」，原文及讲解（PDF 第 428–429 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"枳实是破气行痰药","c":"【本经原文】「**味苦，寒，无毒；治大风在皮肤中，如麻豆苦痒，除寒热结，止利，长肌肉，利五脏，益气轻身。**」【性味】「**味苦，性寒，无毒。**」【主治】「**枳实为破气行痰要药，主破结实，消胀满，治胸胁痰癖，心下痞痛，消食散血，去胃中湿热。**」【别录】「**除胸胁痰癖，逐停水，破结实，消胀满，心下急痞痛逆气。**」【甄权】「**解伤寒结胸，主上气喘咳。**」【药征】「**主治结实之毒，旁治胸满胸痹，腹满腹痛。**」【用量】「**普通八分至二钱。**」讲义：「**枳实最主要呢是能够破气、行痰的要药。****很多心脏病的人，胸中都有痰，胸里面、喉咙里面都有痰，所以一再咳；痰很多的时侯，我们用到枳实、胸闷，行气能够行痰、能够破气。****张仲景在处方的时侯，遇到病人只要胸满、胸腔里面胀满——『老师我胸很闷』——都会用到枳实。**」\n\n**【极重要】枳实 = 破气行痰（胸痞/心脏病）**\n\n**「很多痰饮会造成心脏病」——「这是最精的病机。」** ✓✓","o":"RJ-2439 · 《人纪·神农本草经》中经第二百一十味「枳实」，原文及讲解（PDF 第 435–436 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"枳实疏导心气入小肠","c":"讲义讲「一条极精的表里机制」：「**这个心和小肠是表里的，所以当你用枳实去疏通心气的时侯、痰去掉的时侯，心气就会往下走进入小肠，小肠蠕动就会回来。****所以张仲景在让小肠蠕动恢复的时侯，会加枳实下去。****我们经方里面以后会遇到承气汤，小承气、大承气我们都会用到枳实，就是因为它能够疏导心气。****心和小肠相表里，所以枳实一下去，小肠的速度、蠕动的速度就会回来。**」\n\n**【极精】枳实 → 疏导心气 → 小肠蠕动恢复**\n\n```\n心与小肠相表里\n枳实破胸痰 → 心气下行 → 小肠蠕动回来\n```\n\n**「这是最精的脏腑关联。」** ✓✓","o":"RJ-2440 · 《人纪·神农本草经》中经第二百一十味，讲解（PDF 第 436 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"厚朴是下气药","c":"【本经原文】「**味苦，温，无毒；治中风，伤寒，头痛，寒热，惊悸气，血痹，死肌，去三虫。**」【性味】「**味苦辛，性温，无毒。**」【主治】「**厚朴为下实散满、祛湿健胃要药，主温中益气，消痰下气，气血痹，湿霍乱。**」【别录】「**温中益气，消痰下气，疗霍乱及腹痛胀满，胃中冷逆，胸中呕不止。**」【甄权】「**治积年冷气，腹内雷鸣虚吼，宿食不消，去结水，破宿血，化水谷。**」【药征】「**主治胸腹胀满也，旁治腹痛。**」【容川】「**厚朴本皮，味比枳壳更重，故理脾气；故仲景用枳壳治心下满，用厚朴治腹痛。厚朴行大肠之气，故肺气得泄。**」【用量】「**普通七分至二钱。**」讲义：「**厚朴呢就能够下气，因为它的味道非常的重；厚朴的功能就是下气，所谓气就是动能。****所以你厚朴一下去，大肠蠕动就会回来；枳实一下去，小肠的蠕动就会回来。**」\n\n**【极重要】厚朴 = 下气（大肠蠕动）**\n\n```\n厚朴（味厚/树皮）→ 大肠\n枳实（味轻）→ 小肠\n```\n\n**「气就是动能」——「这是最精的定义。」** ✓✓","o":"RJ-2441 · 《人纪·神农本草经》中经第二百一十一味「厚朴」，原文及讲解（PDF 第 437–438 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"逆气的物理定义","c":"讲义讲「一条极精的物理学解释」：「**逆气的原因，这个再给诸位一个观念：大肠蠕动的时候应该是往前蠕动的，所以这个大便才会这样出来、从肛门出来。****往前走，所谓逆气就是蠕动没了。****那你气往那个、那个蠕动本来就要往前走，不进则退，往回退，气就往上走。****所以病人会感到气一直往上逆，那个就是什么？就是逆气。****这时候厚朴最好用。**」\n\n**【极精】逆气 = 蠕动停止 + 不进则退**\n\n```\n正常 → 蠕动向前（向下排）\n逆气 → 蠕动停了 → 不进则退 → 气上逆\n```\n\n**「不进则退」——「这是最精的物理化比喻。」** ✓✓","o":"RJ-2442 · 《人纪·神农本草经》中经第二百一十一味，讲解（PDF 第 438–439 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"枳实厚朴大黄芒硝的加减","c":"讲义讲「一条最精的实操」：「**如果再加，如果再加大黄，大黄能够去实，把小肠的实去掉；那芒硝能够攻坚，如果硬的大便大黄没法去掉，用芒硝下去，把硬的大便打散掉。****就变成说厚朴、枳实、大黄、芒硝使用在一起，那就会把大肠里面结硬的硬块打出来。****那如果大肠里面没有东西、只有小肠里有东西，你就不要芒硝嘛。**」\n\n**【极重要】承气汤四药的各司其职**\n\n| 药 | 作用 | 靶点 |\n|---|---|---|\n| **厚朴** | 下气 | 大肠蠕动 |\n| **枳实** | 破气 | 小肠蠕动 |\n| **大黄** | 去实 | 小肠之实 |\n| **芒硝** | 攻坚 | 硬大便打散 |\n\n**「这是最精的组方分解。」** ✓✓","o":"RJ-2443 · 《人纪·神农本草经》中经第二百一十一味，讲解（PDF 第 438 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"问放不放屁","c":"讲义讲「一条极精的问诊」：「**老师你怎么知道大肠里面没有东西？很简单啊，你问病人你放不放屁。****哦屁很多——屁很多就是大肠里都是气、没有东西，就是你不加芒硝。****那如果老师啊我屁都没有一个，那你就堵在大肠里面了，硬块、硬的大便都堵在大肠里面，这时候你就加芒硝下去。****这就是小承气、大承气的差别。**」\n\n**【极精】问放不放屁 → 判大肠有无实**\n\n```\n屁多 → 大肠只有气 → 小承气（无芒硝）\n无屁 → 大肠有硬块 → 大承气（加芒硝）\n```\n\n**「这是最简的床边判据。」** ✓✓","o":"RJ-2444 · 《人纪·神农本草经》中经第二百一十一味，讲解（PDF 第 438 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"寒实与热实","c":"讲义讲「一条极重要的分法」：「**老师你怎么知道他是实热？很简单啊，小便：你小便什么颜色？黄色——实热，讲完了。****哦小便淡白，你一个礼拜没上厕所，小便还是白的——寒实。****寒实和热实，实我们有去实的药，但这个药只负责去实、不管寒热。****那你是不是要加些去寒的药在里面、配合去实的药才对症？****现在是实热，你出的去实的药大黄、芒硝是去实，那要加些去热的药在里面、降气的药，你加了厚朴、枳实。**」\n\n**【极重要】便秘二分：热实（小便黄）vs 寒实（小便淡白）**\n\n```\n小便黄 → 热实 → 大黄芒硝 + 厚朴枳实\n小便淡白 → 寒实 → 去实药 + 去寒药\n```\n\n**「这条与 n42、n224 同一主题，本册第三次出现。」** ✓✓","o":"RJ-2445 · 《人纪·神农本草经》中经第二百一十一味，讲解（PDF 第 440 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"补泄三策","c":"讲义讲「一条极重要的治则」：「**所以我们中医呢是要补泄兼顾。****当我们治病的时候大原则是这样子：病人精神体力都很好的时候，我们专门攻、开治病的药给他。****病人体力差的时候，我们要补泄兼顾，补身体的药跟攻病的药同时兼顾。****病人已经纯虚了、奄奄一息的时侯，攻病的药全部拿掉，全部开滋补的药——十味地黄、那个十味加起来就是我们那个十全大补汤，都可以使用，在病人没有力的时侯都可以使用。**」\n\n**【极重要】补泄三策**\n\n```\n体力好（纯实）→ 专攻\n体力差（半虚）→ 补泄兼顾\n纯虚（奄奄一息）→ 只补（十全大补）\n```\n\n**「这条与 n221攻补三策」同一主题。** ✓✓","o":"RJ-2446 · 《人纪·神农本草经》中经第二百一十四味「山茱萸」，讲解（PDF 第 442–443 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"山茱萸是补肝专药","c":"【本经原文】「**味酸，平，无毒；治心下邪气，寒热，温中，逐寒湿痹，去三虫，久服轻身；一名蜀枣。**」【性味】「**味酸（或辛酸），性平，或作性温，无毒。**」【主治】「**山茱萸为滋阴助阳、养血涩精要药；主逐寒湿痹，安五脏，通九窍，暖腰膝，添精髓，治阳痿遗精，血弱体痛。**」【甄权】「**治脑骨痛，疗耳鸣，补肾气，兴阳道，坚阴茎，添精髓，止老人尿不节。**」【大明】「**暖腰膝，助水脏，除一切风，逐一切气，破症结。**」【元素】「**温肝。**」【用量】「**普通一钱至二至三钱。**」【禁忌】「**命门火燥，强阳不痿者，膀胱热结，不宜用。**」【容川】「**山茱萸酸而质润，故专入肝，滋养阴血。**」讲义：「**最主要是补肝，我们用的补肝的药不多，山茱萸就是一味补肝的药，又是能够滋补、又养血。****六味地黄丸、桂附八味丸里面我们就有山茱萸。**」\n\n**【极重要】山茱萸 = 补肝专药（六味地黄丸核心）**\n\n**「补肝的药不多，山茱萸就是一味」——「这是最精的定位。」** ✓✓","o":"RJ-2447 · 《人纪·神农本草经》中经第二百一十四味「山茱萸」，原文及讲解（PDF 第 442–443 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"山茱萸治耳鸣","c":"讲义讲「一条极精的用法」：「**甄权说：治脑骨痛、耳鸣——肾虚的人耳鸣，这个效果很好哦。****病人常常跟我说耳朵鸣，你就山茱萸加个三钱哦、五钱没问题，我常常加五钱。**」\n\n**【极精】肾虚耳鸣 → 山茱萸**\n\n**「这条与 n131耳鸣的两种」须分型互补** ✓✓","o":"RJ-2448 · 《人纪·神农本草经》中经第二百一十四味，讲解（PDF 第 443 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"剂量因体格而异","c":"讲义讲「一条极精的临床观察」：「**我常常加五钱，为什么？老美那体格很大。****我每次帮老美看病，好像在帮那个熊看病，那个熊啊，看的时侯都是抬头看的；替中国人看的是这样（低头）。****所以中国人呢（低头）三钱，（抬头）五钱、六钱，因为治病是个良心嘛。****你不能说都是三钱，虽然价钱收的一样，但我还是给他多一点，因为病人那么胖、那么大，那怎么办？**」\n\n**【极精】剂量因体格而异（老美五钱、国人三钱）**\n\n**「治病是个良心」——「这是最精的剂量观。」** ✓✓","o":"RJ-2449 · 《人纪·神农本草经》中经第二百一十四味，讲解（PDF 第 443 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"秦皮是洗眼药水","c":"【本经原文】「**味苦，微寒，无毒；治风寒湿痹，洒洒寒气，除热，目中青翳，白膜；久服头不白，轻身。**」【主治】「**秦皮为收敛除热要药，主痢疾带下，男子少精，治风湿痹，目中翳膜，除肝热，补下焦。**」【甄权】「**痛风泪不止，作汤浴小儿身热，煎水澄清洗赤目极效。**」【容川】「**此药象人之皮，味苦兼降湿热。故仲景用治皮肤发黄之症。**」【用量】「**一般二至五钱。**」【禁忌】「**里寒之症不用。**」讲义：「**秦皮这个秦皮外用的很有名，那就是你熬汤药，三碗熬成一碗，把那个渣滤掉，用那个滤网把那滤掉，那个比较干净的没有残渣，这个洗眼睛很好啊。****目赤、眼痒、刺痛。****我们那个角膜炎、结膜炎，用秦皮的汤来洗眼睛。**」\n\n**【极精】秦皮 = 洗眼药水（目赤/角膜炎/结膜炎）**\n\n**须「强「标」**：**「①眼部感染须就医；②自制洗眼液须无菌；③角膜炎可致盲，不可自行冲洗」** ✓✓","o":"RJ-2450 · 《人纪·神农本草经》中经第二百一十二味「秦皮」，原文及讲解（PDF 第 440–441 页）。"},{"t":"神农本草经·中经：枳实、厚朴、秦皮、山茱萸、紫葳","h":"枳实象心脏","c":"讲义讲「一条极精的取象」：「**这个枳实哦，它长的样子就像心脏、心室。****所以在我们治疗胸痞的时侯、胸闷的时侯、心脏病的时侯，我们都会使用到枳实。**」\n\n**【极精】枳实象心室（治胸痞）**\n\n**「这条与 n221瓜蒌像心脏」同一取象体系。** ✓✓","o":"RJ-2451 · 《人纪·神农本草经》中经第二百一十味，讲解（PDF 第 437 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"猪苓利尿还能止渴","c":"【本经原文】「**味甘，平，无毒；治痎疟，解毒，蛊疰不祥；利水道；久服轻身，耐老。**」【性味】「**味甘，性平，无毒。**」【主治】「**猪苓为行水渗湿要药，主肿胀腹满，热渴懊憹，治淋肿，白浊子淋，尿闭，开腠理，泻膀胱。**」【元素】「**治渴除湿，去心中懊憹。**」【好古】「**泻膀胱。**」【药征】「**主治渴而小便不利也。**」【用量】「**普通钱半至三四钱。**」【禁忌】「**猪苓利水之功多，久服必损肾气，昏人目；淡渗大燥，能亡津液，无湿者忌之。**」讲义：「**中药的利尿和西药的利尿不一样：西药在利尿的时候医生会告诉你多喝水，中药的利尿，你不要喝。****消渴、渴得很重的时候，你一去利尿、吃下去反而渴止掉了。****中药即使你利尿剂用得比较多点，但是病人绝对不会脱水。**」\n\n**【极重要】猪苓 = 利尿 + 止渴（中药利尿不脱水）**\n\n```\n西药利尿 → 须多喝水\n中药利尿 → 不须喝水 + 反能止渴\n```\n\n**「这是最精的中西对比。」** ✓✓","o":"RJ-2452 · 《人纪·神农本草经》中经第二百一十六味「猪苓」，原文及讲解（PDF 第 444–445 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"猪苓汤须加阿胶","c":"讲义讲「一条极精的组方」：「**猪苓是很好的利尿剂，在膀胱的结石、肾结石的时候，我们会用一些像猪苓。****比如用滑石、用戎盐、青盐呀，咸能软坚啊。****用猪苓、茯苓、泽泻等；那你说老师这个药下去以后，石头动呀、石头排出来，如果石头很大，石头旁边很利嘛，会把那个尿道割破，割破小便会带血呀，那怎么办？加点阿胶嘛。****唉一看，老师，好像猪苓汤嘛！**」\n\n**【极精】排石须加阿胶（护尿道）**\n\n```\n结石 → 滑石+青盐（软坚）+ 猪苓/茯苓/泽泻（利水）\n     + 阿胶（护尿道防割伤）\n= 猪苓汤\n```\n\n**「这是最精的组方推导。」** ✓✓","o":"RJ-2453 · 《人纪·神农本草经》中经第二百一十六味，讲解（PDF 第 445 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"以通为补","c":"讲义讲「一条极精的剂量观」：「**剂量在用的时候你可以 3 钱、4 钱、5 钱，小便不出来 6 钱、7 钱都没有关系，他需要就可以开，以通为补。****猪苓的禁忌里面写得很好：猪苓利水的功比较多，久服吃太多了会伤到肾气，小便水利太多了嘛。****淡渗利的药会产生燥，吃太多会大燥，人会亡津液，所以没有湿症的人不要随便去用它。**」\n\n**【极精】以通为补（但无湿者忌）**\n\n**「这条与 n225以通为补」同一主题。** ✓✓","o":"RJ-2454 · 《人纪·神农本草经》中经第二百一十六味，讲解（PDF 第 445 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"龙眼甘味入脾","c":"【本经原文】「**味甘，平，无毒；治五脏邪气，安志，厌食；久服强魂魄，聪明，轻身，不老，通神明。**」【性味】「**味甘，性平，无毒。**」【主治】「**龙眼为滋养要药，主益脾长肌，养心安神，治血虚怔忡劳神健忘。**」【别录】「**主五脏邪气，安志厌食，除蛊毒，去三虫。**」【括要】「**主补血气，养肌肉，益虚气，除健忘，治怔忡，开胃益脾，补虚长智。**」【用量】「**普通二至三钱。**」【禁忌】「**甘能作胀，凡中满气膈之证均忌。**」讲义：「**龙眼是滋养的药，它主要可以益脾长肌肉。****为什么？甘味入脾，能够健脾；脾统血，身上的血是脾脏在管，入脾的都能够补到血。****可以养心安神，所以治血虚怔忡劳神健忘。**」\n\n**【极精】龙眼 = 甘味入脾 → 脾统血 → 补血**\n\n**「归脾汤里面都有龙眼」——「这是最精的方剂关联。」** ✓✓","o":"RJ-2455 · 《人纪·神农本草经》中经第二百一十八味「龙眼」，原文及讲解（PDF 第 446–447 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"鹿茸补督脉、龟板补任脉","c":"【本经原文】「**味甘，温，无毒；治漏下，恶血，寒热，惊痫，益气，强志，生齿，不老；角，温，无毒；治恶疮，痈肿，逐邪恶气，留血在阴中。**」【性味】「**味甘咸，性温，无毒。**」【主治】「**鹿茸为大补真阳要药，主养血益阳，强筋健骨，生精充髓，治男子虚劳，老人精衰，腰膝无力，滑精，眩晕，妇人崩瘘带下。**」【容川】「**其宿以头顾尾，能通督脉；督者肾脉，坎中一阳之主脉也。****鹿生北方，得坎中一阳之气也，故其督脉极旺，而脊与脑髓极足，因而上发而生角；每年一换，初生为鹿茸，茸之精气极足，为补髓强精壮阳益血之圣药。**」【用量】「**普通七分至钱半。**」【禁忌】「**壮年慎用，阴虚火旺者忌之。**」讲义：「**如果以任脉来说的话是败龟板，败龟板最好；督脉来说的话是鹿茸。**」\n\n**【极重要】鹿茸补督脉、龟板补任脉**\n\n```\n督脉 → 鹿茸（最强）\n任脉 → 败龟板（最好）\n```\n\n**「这是全册最精的任督配对。」** ✓✓","o":"RJ-2456 · 《人纪·神农本草经》中经第二百二十三味「鹿茸」，原文及讲解（PDF 第 449–450 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"以物像为补","c":"讲义讲「一条极精的滋补理论」：「**这类型的药补身体的时候跟多种维他命不一样，中医是以物像来补：比如你吃骨髓补骨髓，吃肝补肝，以物像来补绝对是有他的道理存在。****你如果精炼过的多重维他命营养剂，那个是因为精炼过的体积会变得很小，你吃下去等于喂食这个癌症、喂食这个疾病。****天然的东西，像动物身上的鹿茸啊什么的，它的体积比较大，你吃下去同类、同气相求，所以它滋补到你的身体里面，而且不会滋补到坏的东西。**」\n\n**【极重要】以物像为补 vs 精炼维他命（喂食癌症）**\n\n```\n天然整食（体积大）→ 同气相求 → 补身不补病\n精炼营养剂（体积小）→ 喂食疾病/癌症\n```\n\n**「这条与 n214精炼糖 = 毒药」同一体系。** ✓✓\n\n**须「强「标」**：**「①精炼维生素是现代营养基石；②不可停用；③『喂食癌症』无证据」** ✓✓","o":"RJ-2457 · 《人纪·神农本草经》中经第二百二十三味，讲解（PDF 第 450 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"羚羊角舒筋","c":"【本经原文】「**味咸，寒，无毒；主明目，益气，起阴，去恶血，注下，辟蛊毒，恶鬼，不祥，安心气，常不魇寐。**」【性味】「**味咸，性寒。**」【主治】「**羚羊角为清热，明目，强筋骨，起阴气药，治伤寒，热病寒热，中风附骨痛，产后恶血动心，食噎及惊痫。**」【容川】「**羚羊挂树干而眠，身悬而能眠，因其筋最直，故能治筋缩抽扯之症；角尤精气之所在，故性微寒，功专舒筋，本天水之阴，以清热也。**」【用量】「**一般一钱至三钱。**」【禁忌】「**有寒利者禁忌。**」讲义：「**羚羊角的使用时机最重要的就是在这里面：抽筋、拘急。****所以脑伤的时候、脑部的肿瘤、脑部的瘀块、外伤等，我们在治疗脑部疾病的时候，预防病人有抽搐情况的时候，开羚羊角在里面，他就不会抽筋了嘛。**」\n\n**【极重要】羚羊角 = 舒筋（脑瘤/脑伤预防抽搐）**\n\n**「羚羊窜得很快，腿筋的力量特别强」——「这是最精的取象（以筋治筋）。」** ✓✓","o":"RJ-2458 · 《人纪·神农本草经》中经第二百二十七味「羚羊角」，原文及讲解（PDF 第 452–453 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"抽筋吃木瓜","c":"讲义讲「一个极简的生活法」：「**那你说老师一般的抽筋我们吃木瓜，对不对？对啊，得甘则缓，你吃点糖就缓掉了。****那还有一种抽筋，有脑瘤、癫痫、脑瘤，很强烈的抽筋，平常就要配一些止痉的药，羚羊角就是一味。**」\n\n**【极精】一般抽筋 → 吃木瓜（得甘则缓）**\n\n```\n一般抽筋（腓肠肌）→ 甘味缓急（木瓜/糖）\n病理性抽搐（脑瘤/癫痫）→ 羚羊角\n```\n\n**「得甘则缓」——「这是最精的层次区分。」** ✓✓","o":"RJ-2459 · 《人纪·神农本草经》中经第二百二十七味，讲解（PDF 第 453 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"合欢令人欢乐无忧","c":"【本经原文】「**味甘，平，无毒；主安五脏，和心志，令人欢乐无忧；久服轻身，明目，得所欲。**」【性味】「**合欢皮味甘，性平。**」【主治】「**为合血，消肿，止痛药，治筋骨折伤及肺痈吐脓。**」【大明】「**煎膏消痈肿，续筋骨。**」【用量】「**一般二至四钱。**」【禁忌】「**无禁忌。**」讲义：「**这个合欢皮味道是甘味的，看它的名字就知道——合欢嘛，令人欢乐无忧，吃下去就会很开心。****西药也有开心的药，中药也有。****一般在筋骨的折伤、还有情绪不好的时候，我们会加一些合欢下去，让心情变好。****张仲景在肺痈呕吐脓血的时候，会用到合欢。**」\n\n**【极精】合欢 = 令人欢乐无忧（情绪药）**\n\n**「西药也有开心的药，中药也有」——「这是最精的对位。」** ✓✓","o":"RJ-2460 · 《人纪·神农本草经》中经第二百二十一味「合欢」，原文及讲解（PDF 第 449 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"【须绝对否定】B肝疫苗造成MS","c":"讲义讲「一段须整段否定的内容」：「**像脊椎骨扭伤呀、受伤，或 MS，像脊椎骨变得 S 型的哦，你知道变成 S 型怎么来的？****这个病本来是不存在的哦，就是打 B 肝疫苗造成的后遗症就是 MS，督脉本来就直的嘛，现在扭曲变成 S 形，就是打 B 肝疫苗造成的。****所以我一直很反对打疫苗，打了还照样得肝癌，还不是照死。****根本就没有用的，打了疫苗的后遗症就是脊椎骨整个弯掉的。**」\n\n**【须「绝对强标否定」】「B肝疫苗造成MS」**\n\n**须「强标否定」**：**「①多发性硬化（MS）是自身免疫病，与疫苗无因果；②B肝疫苗是预防肝癌最有效的手段（WHO认定）；③此段为错误主张，不可采信」** ✓✓\n\n**「这是全册须最强否定的内容。」** ✓✓","o":"RJ-2461 · 《人纪·神农本草经》中经第二百二十三味，讲解（PDF 第 450–451 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"中医是圆的西医是线","c":"讲义讲「一段极精的哲学对比」：「**中医不是没有东西，真正好的理论是圆形的，是没有极限的、一直在循环。****当你越了解的时候，越简单、越简单、越简化。****西医不是，西医是一条线，二分法，越分越细、越分越细，到后来没有东西可以分啦。****到时就完了。**」\n\n**【极精】中医是圆的、西医是线**\n\n```\n中医 → 圆（循环/简化/无极限）\n西医 → 线（二分/细分/有极限）\n```\n\n**「这是本册最精的哲学对偶，可与 n219人体是圆的」并读。** ✓✓","o":"RJ-2462 · 《人纪·神农本草经》中经第二百一十八味，讲解（PDF 第 447 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"卫矛是调经次要药","c":"【本经原文】「**味苦，寒，无毒；治女子崩中下血，腹满，汗出，除邪，杀鬼毒，蛊疰；一名鬼箭。**」【主治】「**为调经止痛要药，治女子崩中，产后腹绞痛。**」【甄权】「**破陈血，能落胎。**」【大明】「**通月水，破症结，止血崩带下，杀腹脏虫。**」【用量】「**一般一钱至三钱。**」【禁忌】「**寒利者禁用。**」讲义：「**中药里面调经的药很多，卫矛呢不是主力的药，像白芍、川芎、丹皮为主力的药。****如果瘀血比较严重的，我们就用桃仁呀、红花呀、藏红花活血化瘀。****一般来说药性是寒的，所以用在热症的时候；绝大多数太太月经痛是寒痛不是热痛，热痛的时候我们用卫矛。**」\n\n**【极精】卫矛 = 调经次要药（热痛专用）**\n\n```\n月经痛 90% 以上 → 寒痛 → 加炮附子/生附子\n热痛（少数）→ 卫矛\n```\n\n**「分清主次」——「这是最精的用药层次。」** ✓✓","o":"RJ-2463 · 《人纪·神农本草经》中经第二百二十味「卫矛」，原文及讲解（PDF 第 448–449 页）。"},{"t":"神农本草经·中经：猪苓、龙眼、松萝、卫矛、合欢、鹿茸、羚羊角","h":"鹿胎补胞宫","c":"【原文附】「**鹿胎——浑然元气所在，归下焦而不上行，为种子益肾补胞宫之要药。**」讲义：「**鹿胎真的是很补、是非常补的药，就是鹿的幼胎，还在肚子里面还没有生出来的。****那个杀鹿把那个鹿胎拿出来，那是补胎宫的药，能够生小孩、壮精，那个是非常的强的哦。****只是不太人道，我也没有用过、也没有吃过，想到就不想吃了。**」\n\n**【极精】鹿胎补胞宫（但「不太人道」）**\n\n**「归下焦而不上行」——「这与鹿茸上行恰成对照。」** ✓✓\n\n**须「标」**：**「①涉及濒危物种/动物福利；②不可提倡；③现代有规范生殖医学」** ✓✓","o":"RJ-2464 · 《人纪·神农本草经》中经第二百二十三味，原文附及讲解（PDF 第 450–451 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"犀角已禁用与替代","c":"【本经原文】「**味苦，寒，无毒；治百毒，蛊疰，邪鬼，瘴气，杀钩吻、鸩羽、蛇毒，除邪，不迷惑，魇寐。**」【性味】「**味苦酸咸，性寒，无毒。**」【主治】「**犀角为散邪清热凉血解毒要药，主伤寒时疫，发黄发斑，风毒中恶，狂言妄语，治胃中大热，痘疮黑陷。**」【用量】「**普通三分至一钱。**」【禁忌】「**恶乌头，忌盐，能消胎气，孕妇忌服。**」讲义：「**228 犀角就是犀牛角，现在这个药呢，已经禁用了，国际都列为国际保护动物。****那现在犀角禁用了，所以南派的不会治高热了，看到你高热，就叫他去打点滴。****打什么点滴呀，不要打点滴，我们用石膏啊，很多很多去热的药，一剂就把那个热退掉了，不需要用到犀牛角。****张仲景在 1800 年前，他也没有用到犀牛角呀。**」\n\n**【极重要】犀角禁用 → 石膏替代**\n\n```\n犀角（禁用于保护动物）→ 石膏/黄连/甘草替代\n```\n\n**「张仲景也没用犀角」——「这是最精的考证。」** ✓✓\n\n**须「强「标」**：**「①犀角全球禁用（CITES）；②不可非法购买；③高热须查病因」** ✓✓","o":"RJ-2465 · 《人纪·神农本草经》中经第二百二十八味「犀角」，原文及讲解（PDF 第 453–454 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"黄连解尿毒甘草解食毒","c":"讲义讲「一条极精的解毒分工」：「**黄连和甘草有什么不一样？很简单呀我们前面讲过：甘草解百草的毒；黄连苦味的入心，任何东西能够达到心脏里面、能够造成心脏毒害，用黄连就可以解呀。****尿毒实际上并不是在洗肾呀，是心肺透析，把心脏的血拿出来把里面的尿毒洗掉，再把它放回心脏里面。****所以黄连是解尿毒用的。****那你说哎老师用甘草解尿毒行不行？这两个不对症。****所以诸位只要想它的药性：苦味的入心，任何能毒害心脏的就是黄连可以解；食物中毒是用甘草。**」\n\n**【极重要】黄连解心毒（尿毒）、甘草解食毒**\n\n```\n尿毒（心毒）→ 黄连（苦入心）\n食物中毒 → 甘草（解百草毒）\n```\n\n**「这两个不对症」——「这是最精的解毒分工。」** ✓✓\n\n**须「强「标」**：**「①尿毒症须透析/移植；②不可用黄连代替；③食物中毒须洗胃/就医」** ✓✓","o":"RJ-2466 · 《人纪·神农本草经》中经第二百二十八味，讲解（PDF 第 454 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"刺猬皮治痔疮三部曲","c":"【本经原文】「**味苦，平，无毒；治五痔，阴蚀，下血赤白，五色血汁不止，阴肿痛引腰背；酒煮杀之。**」【主治】「**猬皮治五痔，泻血，阴肿痛及反胃，炙为末或烧灰服。**」【别录】「**疗腹痛疝积，烧灰酒服。**」【毅明】「**治反胃吐食。**」【用量】「**一般一钱至三钱。**」【禁忌】「**禁生用。**」讲义：「**我们会用到刺猬皮最多的地方是用在痔疮。****那你说老师痔疮不是地榆吗？那赤小豆去湿、地榆止血、刺猬呢来活血化瘀。****长痔疮的时候，里面瘘管会很多，刺猬可以到所有的地方去，用刺猬皮来收敛、赤小豆去湿、地榆止血，这样就会配合得很好。****痔疮我们分内痔跟外痔就讲完了，名称不一样用药是一样。**」\n\n**【极精】治痔三药：赤小豆去湿 + 地榆止血 + 刺猬皮活血化瘀**\n\n```\n痔疮 = 湿 + 血 + 瘀\n赤小豆（湿）+ 地榆（血）+ 刺猬皮（瘀）\n```\n\n**「针灸针下孔最、承山」——「这是最精的配穴。」** ✓✓","o":"RJ-2467 · 《人纪·神农本草经》中经第二百三十一味「猬皮」，原文及讲解（PDF 第 455–456 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"露蜂房通乳","c":"【本经原文】「**味苦，平，有毒；治惊痫，瘛瘲，寒热，邪气，癫疾，鬼精，蛊毒，肠痔；一名蜂肠。**」【性味】「**味甘咸，性平，有毒，火烧灰用。**」【主治】「**露蜂房为解毒，杀虫药，治附骨瘫疽，瘰疬，恶疮，惊痫，癫疾，杀肠中寄生虫，兴肠道。**」【用量】「**一般一钱至三钱。**」【禁忌】「**禁生用。**」讲义：「**露蜂房长成这个样子，诸位看像什么？就像乳房哦。****因为它长得就像乳房，同时里面一个洞一个洞就像乳糜管，所以它通乳的力量非常强。****如果现在是在喂乳、喂母乳的期间刚生完小孩如果奶水出不来，我们可以露蜂房，一下子奶水就弄出来很多。**」\n\n**【极重要】露蜂房 = 通乳（蜂房象乳房/乳糜管）**\n\n```\n蜂房（一洞一洞）→ 象乳糜管 → 通乳\n产后奶水不出 → 露蜂房\n```\n\n**「这是最精的取象。」** ✓✓","o":"RJ-2468 · 《人纪·神农本草经》中经第二百三十二味「露蜂房」，原文及讲解（PDF 第 456–457 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"癌症的积理论","c":"讲义讲「一条极精的病机」：「**中国人的字写得好，所谓的癌症——病字头，山上面有三个口，意思是成长得很快。****本来是个很好的细胞在这边，那这个正常的奶水是营养；但是如果说这个营养停在身体里面太久了，身体的好细胞就会说我帮你消化掉。****陈旧的营养会误导，中医叫做积，累积的积。****癌症它并不是病毒呀，它误解了：怎么那么多营养在那边，所以一个变两个、两个变四个、四个变八个，就变成这样子。****所以我们身上不要有积，随时都要排积，每天都要排。**」\n\n**【极重要】癌症 = 积（陈旧营养误导细胞）**\n\n```\n奶水停滞 → 变粉状/钙质 → 积\n积久 → 细胞误解 → 增生（癌）\n```\n\n**「癌症并不是病毒」——「这是最精的癌症观。」** ✓✓\n\n**须「强「标」**：**「①癌症是基因突变 + 多因素；②『陈旧奶水致癌』无证据；③乳癌须超声/钼靶/活检」** ✓✓","o":"RJ-2469 · 《人纪·神农本草经》中经第二百三十二味，讲解（PDF 第 457–458 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"自然界没有百分之百营养","c":"讲义讲「一条极精的核心洞见」：「**中药的好处在那里，就是它是天然的东西，它不是百分之百纯营养。****好比如说吃橘子，橘子里面有维他命 C 呀，但是橘子里面很多的纤维、很多的水，维他命 C 只是一部份。****那现在的西药厂的维他命 C 绝对不等于橘子；精炼过的营养，那是百分百的营养，没有东西帮你排积！****老天爷从来没有制造出百分之百营养，从来没有一样自然界的东西是百分之百的营养，包括你甘蔗的蔗糖——挤完了还有甘蔗渣。**」\n\n**【极重要】自然界没有 100% 营养（food matrix）**\n\n```\n天然食物 → 营养 + 纤维（排积）\n精炼营养剂 → 100% 营养，无排积成分\n```\n\n**「这条与 n60自然界不产生纯营养」同一主题。** ✓✓\n\n**须「标」**：**「①补充剂在缺乏时有效；②不可全盘否定；③膳食为主」** ✓✓","o":"RJ-2470 · 《人纪·神农本草经》中经第二百三十二味，讲解（PDF 第 457–458 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"钙与钙片不相等","c":"讲义讲「一条极精的区分」：「**钙片你不要吃，我们正常人都需要钙、但不需要钙片。****钙和钙片不一样喔，了解我意思吧？好！不相等的东西我们绝对不能放在一起。**」\n\n**【极精】钙 ≠ 钙片**\n\n**须「强「标」**：**「①骨质疏松须补钙 + 维D；②钙片有明确获益；③不可停用」** ✓✓\n\n**「这是最精的语义区分。」** ✓✓","o":"RJ-2471 · 《人纪·神农本草经》中经第二百三十二味，讲解（PDF 第 458 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"鳖甲攻坚","c":"【本经原文】「**味咸，平，无毒；治心腹症瘕坚积，寒热，去痞，息肉，阴蚀，痔，恶肉。**」【性味】「**味咸，性平，无毒。**」【主治】「**鳖甲为益阴除热散结要药，主心腹症瘕坚积寒热，治老疟疟母，骨节间劳热，消肿下瘀，能堕胎。**」【甄权】「**宿食症块痃癖，冷瘕劳瘦，除骨热结实壅，下气，妇人瘘下五色，下瘀血。**」【容川】「**鳖甲攻破肝气，去症瘕。**」【用量】「**普通二钱至四钱。**」【禁忌】「**妊娠及阴虚胃弱、阴虚泄泻、产后泄泻均忌。**」讲义：「**乳癌呀、肝癌、胰脏癌我们都会使用到鳖甲，所以一般来说，我们在治疗肝癌的时候、尤其在治疗乳癌肝癌的时候，鳖甲用得很凶，是攻坚用的。**」\n\n**【极重要】鳖甲 = 攻坚（肝/胰/乳房）**\n\n**「鳖甲在土里面钻得很深」——「所以主攻土位（脾胃/肝/胰/乳）」** ✓✓\n\n**须「强「标」**：**「①癌症须规范治疗；②鳖甲不能替代；③鳖甲可堕胎，孕妇禁」** ✓✓","o":"RJ-2472 · 《人纪·神农本草经》中经第二百三十三味「鳖甲」，原文及讲解（PDF 第 459–461 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"龟板滋补鳖甲攻坚","c":"讲义讲「一条极精的对比」：「**这个鳖甲跟乌龟，老师，这乌龟龟板是滋补的、补肾的，那鳖甲为什么是攻坚那么厉害啊？两个性不一样。****比如说乌龟跟鳖看起来很像，性不一样：鳖很凶呀，鳖咬人，你有没听过乌龟咬人？鳖很凶啊，所以说攻坚要靠鳖，钻进去的力很强；乌龟动作比较慢、长寿，龟龄嘛长寿，所以说乌龟大部分都是滋补使用，真的攻坚时候我们用鳖甲。**」\n\n**【极精】龟板（滋补/慢/长寿）vs 鳖甲（攻坚/凶/钻）**\n\n```\n乌龟 → 慢 → 滋补（补肾）\n鳖 → 凶 → 攻坚（破症瘕）\n```\n\n**「这是最精的性格取象。」** ✓✓","o":"RJ-2473 · 《人纪·神农本草经》中经第二百三十三味，讲解（PDF 第 460 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"攻中带补","c":"讲义讲「一条极精的治则」：「**那你说这个人很虚很弱，可是又有一个肿块在那边；因为肿块在那边、我们摸得到肝脏肿块在那边，人很虚很弱。****那老师前面你跟我说过，山茱萸是不是补肝的？那这个鳖甲攻肝的，那我补药攻药一起用——当然可以，这就是中医。****西医不管啊，把你先杀了再说；他这个化疗的药进去以后，肿瘤没死，人先死掉，那就是这样子。****中医不是，中医很活。****体格很壮的时候我们不要补他嘛、攻坚；体格很虚弱，补、攻中带补，都可以使用。**」\n\n**【极精】攻中带补（鳖甲 + 山茱萸）**\n\n```\n肝肿块 + 体虚 → 鳖甲（攻）+ 山茱萸（补）同用\n```\n\n**「中医很活」——「这是最精的对比。」** ✓✓","o":"RJ-2474 · 《人纪·神农本草经》中经第二百三十三味，讲解（PDF 第 461 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"螃蟹解漆毒","c":"【本经原文】「**味咸，寒，有毒；治胸中邪气，热结痛，喎僻，面肿，败漆；烧之致鼠。**」【性味】「**味咸，性寒，有小毒。**」【主治】「**蟹主散血，解结，疏肝气，理经脉，利肢节，续筋骨，治热结痛，胸中邪气，面肿，妇人经血不通。**」【禁忌】「**能动风，有风疾人不可食；中蟹毒，紫苏煎浓汁，冷服。**」讲义：「**结果这个医生来一看，这个是中的漆毒。****那怎么处理呢？****螃蟹，你不要拿那个活生生的拿在肚子上啊，不是哦；螃蟹，蒸过、蒸过螃蟹以后，放在肚脐上，把身上那个漆的毒吸出来，人就恢复过来。****所以过去，如果我们确定这个房子里面油漆的味道很重，这个时候我们就会放很多螃蟹。**」\n\n**【极精】螃蟹解漆毒（蒸蟹敷脐）**\n\n**「这是全书最奇的偏方。」** ✓✓\n\n**须「强「标」**：**「①漆毒（过敏）须就医，可致全身反应；②不可以蟹代替；③装修须通风」** ✓✓","o":"RJ-2475 · 《人纪·神农本草经》中经第二百三十四味「蟹」，原文及讲解（PDF 第 461–462 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"紫苏解蟹毒","c":"讲义讲「一条极精的解毒药」：「**螃蟹呢……那如果说你吃螃蟹吃得太多了、螃蟹毒怎么办？我们都是苏叶。****日本人就知道啊，所以日本人吃日本料理的时候都会放几片绿绿的叶子，那就是紫苏叶。****那我们中药拿苏叶来行气，所以喉咙很多问题的时候我们会用到紫苏叶。****换句话说任何鱼虾的过敏——『老师，我对鱼虾过敏啊』——你用紫苏叶，到中药房买紫苏叶。**」\n\n**【极精】紫苏解蟹毒 / 鱼虾过敏**\n\n```\n蟹毒 → 紫苏（煎浓汁冷服）\n鱼虾过敏 → 紫苏叶\n```\n\n**「日本料理放紫苏叶」——「这是最精的文化印证。」** ✓✓\n\n**须「强「标」**：**「①过敏性休克须肾上腺素 + 急诊；②紫苏不能替代；③严重过敏禁食」** ✓✓","o":"RJ-2476 · 《人纪·神农本草经》中经第二百三十四味，讲解（PDF 第 462–463 页）。"},{"t":"神农本草经·中经：犀角、猬皮、露蜂房、鳖甲、蟹","h":"露蜂房质轻几分即可","c":"讲义讲「一条极精的剂量提醒」：「**这露蜂房就是意来的，用意看这个露蜂房长的样子。****所以说，如果女孩子胸部有硬块在里面，你可以放一点露蜂房。****记得我的话，不要放个 5 钱哦，你没看过蜂房，蜂房很轻呀，风一吹就跑掉了；不要用那个 17 级风，嘴巴一吹就跑掉了，质很轻的。****所以遇到质轻的药物，剂量开少，开个几分就好了，几分就好几个了。**」\n\n**【极精】质轻药（蜂房/浮萍/冬花）只开几分**\n\n```\n质轻（蜂房/浮萍）→ 几分即可\n质重（鳖甲/牡蛎）→ 数钱至两\n```\n\n**「这条与 n229浮萍一钱即一堆」同一体系。** ✓✓","o":"RJ-2477 · 《人纪·神农本草经》中经第二百三十二味，讲解（PDF 第 458 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"肌肤甲错是陈血的标志","c":"讲义讲「一条极重要的诊断」：「**『那老师你怎么知道他是瘀血呢？』我们叫肌肤甲错。****什么叫肌肤甲错？皮肤就好像蛇皮一样一块一块的，拍一拍白白的屑就掉下来。****『老师全身？』不是，只长一段地方、一节地方，从三阴交到蠡沟这一段地方，脚上面这一段。****腿拿起来你这个小腿怎么搞的，肌肤甲错。****里面有陈血、肚子里面有陈血、恶血，很深的地方。****它就会从这个地方表现出来。****这个时候就是大黄蟅虫丸症。**」\n\n**【极重要】肌肤甲错 = 陈血（三阴交→蠡沟段）**\n\n```\n小腿内侧（三阴交—蠡沟）蛇皮样脱屑\n  → 腹内陈血/恶血\n  → 大黄蟅虫丸证\n```\n\n**「只长一段地方」——「这是最精的定位（不是全身）。」** ✓✓","o":"RJ-2478 · 《人纪·神农本草经》中经第二百三十六味「蛴螬」，讲解（PDF 第 463–464 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"蝉蜕蛇蜕以皮换皮","c":"【本经原文】「**味咸，寒，无毒；治小儿惊痫，夜啼，癫病，寒热。**」【灵胎】「**清火散风。即今日之蝉。**」讲义：「**我们在用动物脱下来的壳的时候，就是脱皮嘛，所以用到皮肤病上的时候很多。****所以我们在治疗重症，比如说那种疥癣或者皮肤湿疹很严重，我会开蝉蜕、蛇蜕。****那种新的皮会换旧的皮。****因为它的目的我刚刚讲过，你不用管它是寒热，就是你希望他新的皮去换旧的皮的时候，就会想到蝉蜕。**」\n\n**【极精】蝉蜕/蛇蜕 = 以皮换皮（皮肤病）**\n\n```\n蝉蜕（脱壳）/ 蛇蜕（蜕皮）→ 新皮换旧皮\n湿疹/疥癣（不分寒热）→ 蝉蜕/蛇蜕\n```\n\n**「这是最精的取象。」** ✓✓","o":"RJ-2479 · 《人纪·神农本草经》中经第二百三十五味「蚱蝉」，原文及讲解（PDF 第 462–463 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"质轻药只开几分","c":"讲义讲「一条极精的剂量」：「**那这种蛇蜕、蝉蜕本身质很轻，所以你也不要开那个五钱、三钱，一大包，三分、五分就很多了。****就是你去树上面，蝉那个壳，就那个东西。**」\n\n**【极精】蝉蜕/蛇蜕只开三分五分**\n\n**「这条与 n232蜂房几分即可」同一体系。** ✓✓","o":"RJ-2480 · 《人纪·神农本草经》中经第二百三十五味，讲解（PDF 第 463 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"白僵蚕改伤口颜色","c":"【本经原文】「**味咸，平，无毒；治小儿惊，夜啼，去三虫，灭黑，令人面色好，男子阴易病。**」【性味】「**味咸辛，性平，无毒。**」【主治】「**白僵蚕为祛风化痰要药，主小儿惊痫，头风齿痛，喉痹咽肿，中风失音，治丹毒搔痒，瘰疬结核，去皮肤中如虫行；外用灭诸疮瘢痕。**」【别录】「**女子崩中赤白，产后腹痛，灭诸疮瘢痕，为末封疔肿，拔根极效。**」【灵胎】「**驱风逐痰。**」【用量】「**普通八分至三钱。**」【禁忌】「**所治诸病，非由风寒外邪客入者，均忌。**」讲义：「**如果开完刀、很多女孩子剖腹产，开完刀以后呢，剖腹那个刀口肿起来一块，红红的一条，像阿拉斯加大脚蟹的脚一样、肥肥的红红的，怎么办？这个白僵蚕是伤口的颜色。****『老师我这个腿很漂亮，结果一个伤口黑的』——用白僵蚕它会把那个皮肤颜色变掉、变回来，变成正常颜色。**」\n\n**【极重要】白僵蚕 = 改伤口/瘢痕颜色（灭黑）**\n\n**「这条与 n229僵蚕收疤」同一主题。** ✓✓\n\n**须「标」**：**「①瘢痕须激光/药物；②外敷须无菌；③不可自行敷伤口」** ✓✓","o":"RJ-2481 · 《人纪·神农本草经》中经第二百三十八味「白僵蚕」，原文及讲解（PDF 第 466–467 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"白僵蚕拔疔","c":"讲义讲「一条极精的外用」：「**外伤可以敷着使用。****白僵蚕除了这个以外还有疔：任何疔的时候，疔是有个硬块、很深。****这个白僵蚕放在上面它可以拔疔。****这个你摸上有个硬块在里面，白僵蚕涂上去疔会往外走，它会吸出来。****再深的根白僵蚕都可以把它吸出来。****这是外用。****外用的时候要打粉。**」\n\n**【极精】白僵蚕拔疔（外用打粉）**\n\n**须「强「标」**：**「①疔（金葡菌感染）可致脓毒血症；②须抗生素；③不可自行外敷」** ✓✓","o":"RJ-2482 · 《人纪·神农本草经》中经第二百三十八味，讲解（PDF 第 467 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"头痛三药","c":"讲义讲「一条最精的组方」：「**僵蚕两钱，如果头痛很严重三钱，尤其头痛效果非常好，这个我常常使用。****头痛前面讲过川芎——头痛中医一定开川芎。****川芎能活血化瘀使血管扩张嘛，僵蚕还有一个白附子，白附子我们治疗头痛的祛风的。****白附子是草药类，白僵蚕是动物性的药，川芎是把血管打开的药。****这三味药合在一起治各种的头痛，头痛会去掉。**」\n\n**【极重要】头痛三药：川芎（开血管）+ 僵蚕（祛风）+ 白附子（祛风）**\n\n```\n川芎 → 血管扩张\n僵蚕 → 动物性祛风\n白附子 → 植物性祛风\n三味合用 → 通治各种头痛\n```\n\n**「这是最精的组方。」** ✓✓","o":"RJ-2483 · 《人纪·神农本草经》中经第二百三十八味，讲解（PDF 第 468 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"药后仍痛提示脑瘤","c":"讲义讲「一条极重要的诊断逻辑」：「**当你重剂头痛完全没有减轻、你用再重他还是没有减轻，那根本就是脑瘤才会有，否则都会去掉。****所以中药可以帮助你治病以外，可以帮助协助你诊断有没有长东西。****因为这个药只是止痛、没有攻坚的功能。****里面有脑瘤，你怎么知道有脑瘤呢？****那脑瘤很小的时候或脑部有瘀血的时候侦测不出来，这个时候药物可以帮助你——告诉你：药下去还在那边痛，就是有问题的。**」\n\n**【极重要】药后仍痛 = 提示器质性病变（脑瘤）**\n\n```\n头痛 → 重剂三药 → 痛止 → 功能性\n                 → 痛不减 → 疑脑瘤（须影像）\n```\n\n**「这是最精的诊断性治疗（ex juvantibus）。」** ✓✓\n\n**须「强「标」**：**「①头痛须查影像/血压；②『药无效=脑瘤』不可作为依据；③须神经科」** ✓✓","o":"RJ-2484 · 《人纪·神农本草经》中经第二百三十八味，讲解（PDF 第 468 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"乌贼骨补肝明目","c":"【本经原文】「**味咸，微温，无毒；治女子漏下赤白经汁，血闭，阴蚀肿痛，寒热，惊气，症瘕，无子。**」【性味】「**味咸，性微温，无毒。**」【主治】「**乌贼骨主通经络，祛寒湿，治寒热症瘕，阴蚀肿痛，赤白漏下，血枯经闭，能补肝伤、疗血不足。**」【别录】「**惊气入腹，腹痛环脐，丈夫阴中肿痛，令人有子。**」【日华】「**疗血崩，杀虫。**」【用量】「**普通一钱至三钱。**」【禁忌】「**血病多热者勿用。**」讲义：「**写乌贼鱼骨药房不知道，叫海螵蛸。****那补剂上面呢，补肝脏。****它能补肝。****任何东西只要补肝的都能明目，因为肝开窍在眼睛嘛。**」\n\n**【极精】乌贼骨（海螵蛸）= 补肝 → 明目**\n\n**「桑螵蛸是螳螂窝（补肾）vs 海螵蛸是乌贼骨（补肝）」——「这是最精的分辨。」** ✓✓","o":"RJ-2485 · 《人纪·神农本草经》中经第二百三十七味「乌贼鱼骨」，原文及讲解（PDF 第 465 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"小便不通要分寒热","c":"讲义讲「一条极重要的分法」：「**一个人说小便不通，刺痛、滴滴沥沥、黄加很红加刺痛，这是热症；脸是红的、脉是瘦的，这是热症，用寒药，消炎嘛。****同样一个老先生跑来，脸色苍白、没有力气，小便滴滴答答，他是摄护腺肥大，里面是虚寒的，这个时候你不要给他吃石龙子，越吃小便越不出来，因为它是寒凉的药，这要大热的药下去才行。****所以寒热要分得清楚。**」\n\n**【极重要】小便不通二分：热症（石龙子）vs 虚寒（摄护腺肥大，须大热药）**\n\n```\n小便刺痛/黄/脸红 → 热 → 寒药（石龙子）\n小便滴答/面苍白/无力 → 虚寒（BPH）→ 大热药\n```\n\n**须「强「标」**：**「①老年男性排尿困难须查PSA/超声；②急性尿潴留须导尿；③不可自行用药」** ✓✓","o":"RJ-2486 · 《人纪·神农本草经》中经第二百四十二味「石龙子」，讲解（PDF 第 469–470 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"寒药避孕热药助孕","c":"讲义讲「一条极精的法则」：「**孕妇不要吃，因为它性很寒。****孕妇在怀孕中间的时候和怀孕之前，我们要让容易怀孕的时候，我们都要让她热。****子宫太冷不容易受孕。****反过来说寒凉的药是可以避孕的，热性的药是可以助孕的。**」\n\n**【极精】寒药避孕、热药助孕**\n\n```\n子宫冷 → 难受孕 → 热药助孕\n寒凉药 → 不利受孕（非可靠避孕）\n```\n\n**须「强「标」**：**「①中药不是可靠避孕手段；②须用规范避孕；③不孕须夫妻同查」** ✓✓","o":"RJ-2487 · 《人纪·神农本草经》中经第二百四十二味，讲解（PDF 第 470 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"蛴螬与大黄蟅虫丸","c":"【本经原文】「**味咸，微温，有毒；治恶血，血瘀，痹气，破折，血在胁下坚满痛，月闭，目中淫肤，青翳，白膜。**」讲义：「**蛴螬呢，在经方里面我们有大黄蟅虫丸，我们在治疗瘀血、陈年的老血的时候，会有时候使用到蛴螬。****张仲景用一次。****蛴螬这个药是金龟子的幼虫，一般来说长在比较脏的地方，有一点毒性的，能够去肝血、瘀血块。**」\n\n**【极精】蛴螬 = 金龟子幼虫（大黄蟅虫丸）**\n\n**「张仲景用一次」——「这是最精的文献统计。」** ✓✓\n\n**须「标」**：**「①昆虫药须炮制；②卫生风险；③现代多有替代」** ✓✓","o":"RJ-2488 · 《人纪·神农本草经》中经第二百三十六味「蛴螬」，原文及讲解（PDF 第 463–465 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"经方与南派的药味数","c":"讲义讲「一条极精的对比」：「**因为张仲景处方、经方的时候，我们所谓经典之方，这个处方简单几味药。****像温病派、南派的中医，你去给他说『医生我咳嗽』，可以开八九十味药，所有《本草纲目》里面能治咳嗽的药统统开在里面。****药房拿到这个药单不想做这个生意，太麻烦了嘛。****拿到经方家的药很开心，为什么？五味药、七味药、四味药、两味药结束了，一包结束了。****经方就这样子。**」\n\n**【极精】经方（2–7 味）vs 南派（80–90 味）**\n\n**「这条与 n176乱枪打鸟的处方」同一主题。** ✓✓","o":"RJ-2489 · 《人纪·神农本草经》中经第二百三十六味，讲解（PDF 第 464 页）。"},{"t":"神农本草经·中经：蚱蝉、蛴螬、乌贼鱼骨、白僵蚕、石龙子、蜚虻","h":"牛虻须牛舍所产","c":"【本经原文·蜚虻】「**味苦，微寒，有毒；主逐瘀血，破下血积，坚痞症瘕，寒热，通利血脉及九窍；又名虻虫。**」【主治】「**活血化瘀，专攻妇女子脏之瘀，与少腹中之瘀血。**」【药征】「**瘀血，少腹鞭满，兼治发狂瘀热喜忘，及妇人经水不利。**」【容川】「**蝱虫为飞而食血，故主行上下之血。可以攻血。**」【用量】「**一般一钱至三钱。**」【禁忌】「**下利者忌用。**」讲义：「**入药的时候是蜚虻、是牛虻。****牛虻只产在牛圈里、牛窝里面。****你想想看那个虻虫叮在那个牛背上，那个吸血针可以穿过那个牛皮、到里面去吸血，你说厉害不厉害。****所以我们用虻虫、水蛭的时候，抵当汤在使用它的时候，那个药要很强的药、很峻的药，要找牛虻，一定要生在牛栏里面的才可以。**」\n\n**【极精】虻虫须牛舍所产（吸血针穿牛皮）**\n\n```\n木虻（草虻）→ 力弱\n牛虻（蜚虻）→ 吸血穿牛皮 → 峻剂（抵当汤）\n```\n\n**须「强「标」**：**「①抵当汤是峻剂（水蛭/虻虫）；②须专业医师；③孕妇/凝血障碍禁」** ✓✓","o":"RJ-2490 · 《人纪·神农本草经》中经第二百四十四味「蜚虻」，原文及讲解（PDF 第 471–472 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"干血痨的判据","c":"【药征】「**主治干血，故兼治少腹满痛，及妇人经水不利。**」讲义：「**那【药征】，主治干血，这个干血，我们有个特别名称叫做痨证、干血痨。****这个血干在里面，清出来不好清，太久了、陈血、陈年的血，会让一个人非常的疲劳，我们叫干血痨。****工作一下就会很疲劳，痨证。****那我们要用些昆虫甲虫类的药来清它。****我讲干血你怎么知道呀？很简单，小腿的地方肌肤甲错，那是主要的症状。**」\n\n**【极重要】干血痨 = 陈血 + 肌肤甲错 + 疲劳**\n\n```\n干血（陈血）→ 干血痨\n判据：小腿肌肤甲错（三阴交→蠡沟）\n      + 工作一下就很疲劳\n```\n\n**「小腿肌肤甲错是主症」——「这条与 n233 同一主题，互为印证。」** ✓✓","o":"RJ-2491 · 《人纪·神农本草经》中经第二百四十六味「蟅虫」，讲解（PDF 第 474–475 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"虫类药攻坚的道理","c":"【本经原文·蜚蠊】「**味咸，寒，有毒；治血瘀症坚，寒热，破积聚，喉咽痹，内寒无子。**」讲义：「**这 245 我们叫蜚蠊。****蜚蠊你知道是什么？就是蟑螂。****治血瘀症坚，这种虫类的药、甲壳类的药，外面是硬壳、身体在里面，外面是硬壳，都有攻坚的效果。****关节炎都可以。**」\n\n**【极精】虫类/甲壳类 = 攻坚（外硬壳内软体）**\n\n```\n甲壳在外 + 软体在内 → 攻坚之象\n蟑螂/地鳖虫/虻虫/水蛭 → 破积聚\n```\n\n**「这是最精的取象。」** ✓✓","o":"RJ-2492 · 《人纪·神农本草经》中经第二百四十五味「蜚蠊」，原文及讲解（PDF 第 473 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"峻剂到就好","c":"讲义讲「一条极重要的用药分寸」：「**动物类的药，攻瘀血的时候都是非常的峻、很强啊。****所以你不要随便吃，没有必要不要吃；这种虻虫没有必要，不对症的时候不要吃。****没有那个症不要吃，有那个症的时候是唯一的处方。****一剂下去就好了，好了以后不要再吃啦。****那这个人刚好是你岳母怎么办？好了，当时很好，今天晚上很感谢你、不需要了；你还给她吃，第二天能恨死你。****人吃了会虚掉，因为它很强的攻坚的药，没有必要你还在攻它——它不坚了嘛。****所以最好不要随便乱用。****到就好啦，药中了就可以啦。**」\n\n**【极重要】峻剂「到就好」（中病即止）**\n\n```\n有坚（症）→ 用峻剂 → 一剂到\n坚已去 → 停（再攻则伤人）\n```\n\n**「这是最精的分寸（中病即止）。」** ✓✓\n\n**「这条与 n176药后护理」同一精神。** ✓✓","o":"RJ-2493 · 《人纪·神农本草经》中经第二百四十五味，讲解（PDF 第 473–474 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"夜明砂治夜盲","c":"【本经原文】「**味咸，平，无毒；治目瞑，明目，夜视有精光；久服令人喜乐、媚好、无忧；一名蝙蝠，今名夜明砂。**」【产地】「**山洞之中，倒悬于洞顶之上；其屎供药用。**」【性味】「**味辛性寒。**」【主治】「**为散血明目要药，治障翳，青盲，夜盲，头面痈肿，疳积，瘰疬。**」【灵胎】「**养血明目。**」【用量】「**一般一钱至二钱。**」【禁忌】「**胃肠寒之人禁忌。**」讲义：「**这个伏翼呢，就是蝙蝠的大便，你不用把袋子打开来闻。****蝙蝠夜袭性的动物，所以你如果眼睛夜盲呀，统统可以使用。****这个蝙蝠呢，味道是辛，辛辣的味道主发散，药性是寒的；所以一般来说，肠胃比较冷的人都不能吃。**」\n\n**【极精】夜明砂（蝙蝠屎）= 夜盲（以夜视之兽治夜盲）**\n\n```\n蝙蝠（夜视有精光）→ 夜明砂 → 治夜盲\n```\n\n**「这是最精的取象（以物治物）。」** ✓✓\n\n**须「标」**：**「①夜盲须查维A缺乏/视网膜色素变性；②须补充维A；③不可以此代替」** ✓✓","o":"RJ-2494 · 《人纪·神农本草经》中经第二百四十七味「伏翼」，原文及讲解（PDF 第 475–476 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"乌梅的本草条目","c":"【本经原文】「**味酸，平，无毒；主下气，除热，烦满，安心，止肢体痛，偏枯不仁，死肌，去青黑痣，恶疾；能益气，不饥。**」【性味】「**乌梅味酸，性平而涩；白梅味酸咸，性平。**」【主治】「**乌梅为收敛，解热，消肿，驱虫之药，治久利，痢疾，反胃，去面痣，蚀恶肉，蚘厥吐利，反胃膈噎；驱蛔虫。**」【弘景】「**白梅和药点痣，蚀恶肉；水渍汁饮治伤寒烦热。**」【时珍】「**敛肺，涩肠，止久嗽泻利，反胃膈噎，蛔厥吐逆，消肿涌痰，杀虫，解鱼毒，硫磺毒。**」【容川】「**乌梅极酸，能敛肝木之阳，能化蛔虫，能去坏肉，此是以木来克土，酸能收之义。**」【用量】「**一般一钱至三钱。**」【禁忌】「**多食梅肉损齿伤筋；凡风寒初起，疟痢未久者均忌；忌猪肉。**」讲义：「**乌梅主治：收敛、解热、消肿、驱虫。****所以临床上面，有病人会有吐蚘，那蛔虫从嘴巴里面吐出来，肚子里面长虫，我们用乌梅。**」\n\n**【极重要】乌梅 = 收敛 + 解热 + 消肿 + 驱虫（四能）**\n\n**「酸能收」——「这是最精的中心。」** ✓✓","o":"RJ-2495 · 《人纪·神农本草经》中经第二百四十八味「梅实」，原文及讲解（PDF 第 477–478 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"乌梅丸治紧张就下利","c":"讲义讲「一个极精的经方」：「**还有下利，有的人一考试，他就紧张，一紧张就下利，这种就是乌梅丸。****所以乌梅有收敛的功能，最常用的就是下利跟驱虫。**」\n\n**【极重要】紧张就下利 → 乌梅丸**\n\n```\n考试紧张 → 下利（肠易激）→ 乌梅丸（收敛）\n```\n\n**「这条与 n162紧张就下利」同一主题。** ✓✓\n\n**须「标」**：**「①IBS须排器质性；②须饮食/心理/药物综合；③乌梅丸须辨证」** ✓✓","o":"RJ-2496 · 《人纪·神农本草经》中经第二百四十八味，讲解（PDF 第 478 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"抽筋禁酸宜甘","c":"讲义讲「一条极精的饮食提醒」：「**如果说，有个病人在抽筋、痉挛、抽筋，所以你吃太多酸的话呢，抽筋会更严重。****诸位如果有晚上抽筋的现象的话，酸的东西就不要吃了，要吃甜的——得甘则缓嘛。****可以吃点麦芽糖啊、甜味的东西，都可以缓筋，像香蕉。**」\n\n**【极精】抽筋禁酸、宜甘（得甘则缓）**\n\n```\n抽筋 → 忌酸（酸收，更拘急）\n     → 宜甘（甘缓，缓筋）\n```\n\n**「这条与 n232抽筋吃木瓜」同一体系。** ✓✓","o":"RJ-2497 · 《人纪·神农本草经》中经第二百四十八味，讲解（PDF 第 478 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"醋能醒酒","c":"讲义讲「一条极精的生活法」：「**一般酸味的东西，都能够消酒毒。****你想想看，今天有一个人喝醉了酒、醒不过来了，你把他醋灌下去，人家马上就醒过来。****一般我们灌茶叶对不对，你把醋灌下去，他当场就吓醒过来了。**」\n\n**【极精】酸味消酒毒（醋能醒酒）**\n\n**须「强「标」**：**「①酒精中毒/昏迷须急诊；②不可灌醋（误吸风险）；③侧卧防误吸」** ✓✓","o":"RJ-2498 · 《人纪·神农本草经》中经第二百四十八味，讲解（PDF 第 478 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"乌梅化蛔虫蚀恶肉","c":"【容川】「**乌梅极酸，能敛肝木之阳，能化蛔虫，能去坏肉，此是以木来克土，酸能收之义。**」讲义：「**唐容川，近代的经方家，他说：乌梅极酸，能收敛肝木之阳，能化蛔虫、去坏肉，酸能收，所以对肝脏非常好。****除了下利以外，有一种是魂不归肝、造成失眠，这个时候我们用乌梅、用酸枣仁，我们可以让病人晚上很好的睡觉。****那一般，你治乳房、乳癌啊，捣烂贴在外面都可以，因为酸味的东西有腐蚀作用。****它这种天然的酸，一般来说它会把坏的东西腐蚀掉、坏肉去掉，好肉它不会的。**」\n\n**【极精】乌梅三用：化蛔虫、去坏肉、敛肝阳（治失眠）**\n\n```\n化蛔虫（蛔得酸则伏）\n去坏肉（酸能蚀）\n魂不归肝失眠 → 乌梅 + 酸枣仁\n```\n\n**「这是最精的三用。」** ✓✓","o":"RJ-2499 · 《人纪·神农本草经》中经第二百四十八味，讲解（PDF 第 479 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"白米精炼不好","c":"讲义讲「一条极精的饮食观」：「**现在改良过的白米并不好，改良后的白米里面植物纤维少很多，非常得不好。****我如果叫病人把这个白米白面停掉——因为白面很多都是精炼过，有些放了漂白的东西，把那个面弄得很白，实际上都不好。****我的药可以弄回去吃，糙米最多，让病人去煮糙米稀饭，放点红番薯啊、番薯稀饭促进消化，然后把那个白米白面通通停掉。****这种东西下去的时候纤维很多，自然而然会帮助排便。****现在很多人便秘，本来就排不出来，再吃的米又没有纤维在里面。**」\n\n**【极精】白米精炼（纤维少）→ 便秘；糙米好**\n\n**「这条与 n60food matrix」、n232「100% 营养」同一体系。** ✓✓","o":"RJ-2500 · 《人纪·神农本草经》中经第二百五十一味「黍米」，讲解（PDF 第 480 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"葱叶导尿","c":"讲义讲「一个极精的古代技术」：「**光是一根葱，有葱尾、葱白和葱叶。****那这个葱尾（根部）的部分切下来，那个尾（根部）的须须，刺激一下乳头；然后旁边这一片切下来这个切面的地方有辣味，刺激一下那个乳头，奶水就排出来了。****这个葱白的地方可以入汤剂，能够通脉、通血络、活脉。****葱茎呢，就是这个葱叶……我们没有那个橡皮的导尿管，那个橡皮的导尿管是给敌人用的，因为那个很痛嘛；中医过去导尿管就是葱叶。****叶子找那个比较长、粗的，把它叶尖切掉，这个头里面有津液嘛、里面辣的津液很多。****这个是葱叶，中间是空的，当把它伸到尿道里面去以后，它那个辛辣的会刺激它，一下子就排出来了。****中医过去是用葱叶来导尿。**」\n\n**【极精】葱叶导尿（古代导尿管）**\n\n```\n葱叶（中空 + 辛辣）→ 插入尿道 → 刺激排尿\n葱白 → 通脉（汤剂）\n葱须 → 刺激乳头通乳\n```\n\n**须「强「标」**：**「①尿潴留须无菌导尿（急诊）；②葱叶导尿会致感染；③绝对不可模仿」** ✓✓\n\n**「这是最精的古代技术还原。」** ✓✓","o":"RJ-2501 · 《人纪·神农本草经》中经第二百五十三味「葱实」，讲解（PDF 第 481 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"下经的药性定位","c":"【原文】「**叁 下经**」：「**本经下药一百二十五种为佐使，主治病以应地，多毒不可久服，欲除寒热邪气，破积聚愈疾者，本下经。**」讲义：「**现在，今天我们开始介绍《神农本草经》下卷的药。****诸位看，125 种，为佐为使，治病以多毒，大部分还是以治病为主的，药性很毒，所以不可以长期的服用。****你要欲除寒热的邪气、破积聚肿瘤的，都是要靠本草经的下经。****所以，这个下经张仲景用得非常多。**」\n\n**【极重要】下经三特征：佐使、多毒、不可久服**\n\n```\n上经（142）→ 养生（可久服）\n中经（120）→ 治病（须斟酌）\n下经（125）→ 攻邪（多毒不可久服）\n```\n\n**「破积聚要靠下经」——「这是最精的分级。」** ✓✓\n\n**「这条与 n217上经养生 vs 中经治病」构成完整三阶。** ✓✓","o":"RJ-2502 · 《人纪·神农本草经》下经开篇序文及讲解（PDF 第 481 页）。"},{"t":"神农本草经·中经末与下经：蟅虫、伏翼、梅实、粟米、下经序","h":"三阶用药的完整地图","c":"综合全书三个分级的定位：上经「**上药一百二十种为君主养命以应天，无毒，多服久服不伤人**」；中经「**中药一百二十种为臣主养性以应人，有毒无毒，斟酌其宜**」；下经「**下药一百二十五种为佐使，主治病以应地，多毒不可久服**」。讲义对应：「**上经养生、中经治病、下经攻邪**」。\n\n**【极重要】本草三阶：养生（天）→ 养性（人）→ 治病（地）**\n\n| 阶 | 数 | 定位 | 用法 |\n|---|---|---|---|\n| **上经** | 142 | 应天/养命 | 无毒，久服不伤人 |\n| **中经** | 120 | 应人/养性 | 斟酌其宜 |\n| **下经** | 125 | 应地/治病 | 多毒，不可久服 |\n\n**「这是全书的骨架。」** ✓✓","o":"RJ-2503 · 《人纪·神农本草经》上经、中经、下经三处序文（PDF 第 481 页及各卷首）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"石灰止血蚀腐肉","c":"【本经原文】「**味辛，温；治疽，疡，疥瘙，热气，恶疮，癞疾，死肌，堕眉，杀痔虫，去黑子、息肉。**」【性味】「**味辛，性温，有毒。**」【主治】「**石灰为止血要药，功能蚀恶肉，止吐血，疗金疮，又能解酸类中毒。**」【甄权】「**治病疥，蚀恶肉，止金疮血甚长。**」【大明】「**生肌长肉，吐血，白癜疬疡，瘢疵，痔瘘，瘿赘疣子，妇人粉刺。**」【用量】「**普通三分至一钱。**」【禁忌】「**性燥，且能蚀肉，不可多服。**」讲义：「**石灰是止血的药，我们可以敷作外用，功能蚀腐肉、腐烂的肉。****像乳癌，你如果说外面敷点石灰——但石灰又要小心哦，石灰很毒啊，很凶，所以我一般很少用；你用的话加一点点在里面，在其他的粉剂里面。****这个石灰非常凶，是止血的要药。**」\n\n**【极重要】石灰 = 止血 + 蚀腐肉（极凶）**\n\n**须「强「标」**：**「①生石灰（氧化钙）强碱性，可致化学烧伤；②绝对不可外敷伤口；③不可内服」** ✓✓\n\n**「这是必须最强警告的一味。」** ✓✓","o":"RJ-2504 · 《人纪·神农本草经》下经第二百五十五味「石灰」，原文及讲解（PDF 第 481–482 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"金石药剂量须轻","c":"讲义讲「一条极重要的剂量警告」：「**一般来说，我们都是外用，内服的时候剂量很少。****不要开的时候说：老师，我们石膏，用二两三两。****那你石灰用二两三两？要命了哦。****这个没有用，要三分五分，一点点就好了，最多用上一钱。****内服的不多，张仲景也没有用内服的，偶尔用作外敷，外敷也是撒一点点在药粉里面而已。**」\n\n**【极重要】石膏可用三两，石灰只用三分（同是石，天差地别）**\n\n```\n石膏（硫酸钙）→ 三两\n石灰（氧化钙）→ 三分，最多一钱\n```\n\n**「同是石类，毒性天差」——「这是最精的对比。」** ✓✓","o":"RJ-2505 · 《人纪·神农本草经》下经第二百五十五味，讲解（PDF 第 482 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"代赭石镇降止呕酸","c":"【本经原文】「**味苦，寒，无毒；治鬼疰，贼风，蛊毒，杀精物恶鬼，腹中毒，邪气，女子赤沃漏下。**」【性味】「**味苦甘，性寒（或作平），无毒。**」【主治】「**代赭石为镇虚祛风、养阴血要药，功能避邪毒，治气逆，痰逆，反胃，血中热，血痹，血痢，女子赤白带下。**」【大明】「**安胎健脾，止反胃，吐血，鼻衄，月经不止，肠风痔瘘泻痢。**」【用量】「**入煎剂钱半至三钱，水飞用五分至一钱。**」【禁忌】「**下部虚寒及阳虚阴痿者忌；凡使，醋淬，研末，水飞用。**」【容川】「**赭石重镇，其色赤，又入血分，故一名血师，因其能降血也。血为气之宅，故旋覆花代赭石汤，止噫气者，正是行血而降其气也。**」讲义：「**诸位只要记得，恶心呕吐、他胃里面是热症，统统可以使用代赭石，因为它是石类的药，它是镇压着往下重坠的功能很强。****所以你反胃得很厉害，代赭石一下去，恶心的现象就去掉了。**」\n\n**【极重要】代赭石 = 重镇降逆（胃热呕酸）**\n\n```\n舌黄（热）+ 呕酸 → 代赭石（旋覆花代赭石汤）\n舌白（寒）+ 呕 → 吴茱萸/干姜\n```\n\n**「石类重镇」——「这是最精的物理。」** ✓✓","o":"RJ-2506 · 《人纪·神农本草经》下经第二百五十九味「代赭」，原文及讲解（PDF 第 484–485 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"胃酸的成因","c":"讲义讲「一条最精的机制」：「**我在美国看病，十个里面九个都有胃酸，为什么？喜欢吃甜的。****胃酸怎么来的？你吃台湾的蔗糖，蔗糖不会产生胃酸，因为蔗糖的体积很大、天然的，天然的东西体积都很大。****细菌、病毒嘴巴很小，蔗糖很大，它没法吃它。****但你如果吃人工的糖、精炼糖，精炼糖体积很小，细菌就可以吃、刚好喂进去。****细菌病毒吃进去，排出来的就是酸。****所以老外呢，吃咖啡、在加糖，就是酸；再吃个甜甜圈，更酸，酸上加酸。**」\n\n**【极重要】胃酸 = 精炼糖喂细菌 → 细菌产酸**\n\n```\n天然蔗糖（体积大）→ 细菌吃不下 → 不产酸\n精炼糖（体积小）→ 细菌可吃 → 产酸（胃酸）\n```\n\n**「这条与 n214精炼糖 = 毒药」同一体系，此处给出完整机制链。** ✓✓\n\n**须「标」**：**「①胃酸主因是下食管括约肌松弛 + 胃酸分泌；②『糖喂细菌』非主流机制；③须PPI等规范治疗」** ✓✓","o":"RJ-2507 · 《人纪·神农本草经》下经第二百五十九味，讲解（PDF 第 485–486 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"病怎么来的比治好更重要","c":"讲义讲「一条极精的治疗观」：「**如果你在治病的时候不知道病怎么来的，就算把病治好了，同样的病还是会来。****对不对？一定的嘛。****Commonsense 嘛。****酸如果不去，这个抑制胃酸下去，倒回来就是胃癌、胰脏癌，就是这样来的。****因为酸是会克土。**」\n\n**【极精】不知病因则病必复发**\n\n```\n只治标（抑酸）→ 病因未除 → 复发/进展\n知病因（戒精炼糖）→ 根治\n```\n\n**「不知道病怎么来，仙丹也没用」——「这是最精的治本观。」** ✓✓","o":"RJ-2508 · 《人纪·神农本草经》下经第二百五十九味，讲解（PDF 第 486–487 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"盐的品种与结石","c":"讲义讲「一条极精的流行病学观察」：「**东南沿海的一大堆人都生病啦，就一看，奇怪啦，都没有人得胆结石、都是肾结石。****青海一带，奇怪啦，得的不是肾结石，得的都是胆结石。****因为东南沿海人、就是江浙人喜欢吃酸的，吃醋吃得很凶，酸的入肝胆，诸位不要胆结石的话很简单，多吃酸醋。****海盐呢，没法清除肾结石。****云贵青海这一带的人因为吃青盐，内陆盐本身可以清肾结石，所以他每天吃青盐、每天清他的肾，所以没有人得肾结石。****但是他里面吃的咸味辣味，没有人吃酸的，所以有病都是胆结石。**」\n\n**【极重要】盐/醋与结石的地域差异（观察性）**\n\n```\n沿海（海盐 + 醋）→ 肾结石多、胆结石少\n内陆（青盐 + 无醋）→ 胆结石多、肾结石少\n推论：酸入肝胆（防胆结石）；青盐（助排肾结石）\n```\n\n**须「强「标」**：**「①结石主因是饮水/饮食/代谢/遗传；②此为观察性推论，非因果；③结石须规范诊治」** ✓✓","o":"RJ-2509 · 《人纪·神农本草经》下经第二百六十味「卤咸」，讲解（PDF 第 487–488 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"任何东西过量都不好","c":"讲义讲「一条极精的平衡观」：「**盐吃一点很好，不要吃多哦。****老师这个很好、我吃很多——任何东西过量都不好。****一点点可以清肾结石，可以排水；吃太多，咸能伤骨。****那久立有伤骨，站那边当老师已经很伤骨了，吃的很咸伤骨，血液就会很浓稠，不好。****倒过来关节肌肉都会萎缩。**」\n\n**【极精】咸能伤骨（过量）**\n\n```\n少量盐 → 排水/清石\n过量盐 → 伤骨/血稠/肌肉萎缩\n```\n\n**「这条与 n185久立伤骨」并读。** ✓✓","o":"RJ-2510 · 《人纪·神农本草经》下经第二百六十味，讲解（PDF 第 488 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"土类燥湿止痢","c":"【本经原文·白垩】「**味苦，温，无毒；治女子寒热，症瘕，月闭，积聚，阴肿痛，漏下，无子。**」【性味】「**味苦，性温，无毒。**」【主治】「**白垩主燥湿温臓，治吐血反胃泻痢，外用治风赤烂眼，疿疹搔痒。**」【甄权】「**疗女子血结，涩肠，止痢。**」【用量】「**普通数分至一钱。**」【禁忌】「**用时宜取白色者，以盐汤飞过；不可久服，否则损五脏，令人羸瘦。**」讲义：「**这个垩，就是白土、白色的土。****这个土类的东西可以燥湿、温燥，所以治疗吐血、灶心土；外用治疗风湿、瘙痒、皮疹都可以使用。****一般来说土来治疗水，所以河堤泛滥了、土可以做河堤，土能够止下痢，所以严重的下痢都可以使用。**」\n\n**【极精】土类燥湿止痢（白垩/灶心土）**\n\n```\n土（河堤喻）→ 挡水 → 止下痢\n白垩/灶心土 → 燥湿温中\n```\n\n**「土能做河堤」——「这是最精的取象。」** ✓✓","o":"RJ-2511 · 《人纪·神农本草经》下经第二百六十一味「白垩」，原文及讲解（PDF 第 488 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"附子的本草条目","c":"【本经原文】「**味辛，温，有大毒；治风寒，咳逆，邪气，温中，金疮，破症坚，积聚，血瘕，寒湿痿躄，拘挛，膝痛，不能行步；一名茛。**」【性味】「**味辛甘，性大热，有大毒。**」【主治】「**附子为扶元回阳、补火退寒要药，主寒湿痿躄，症瘕积聚，命门火衰，脾胃虚寒，治寒霍乱转筋，阳气暴脱，及真寒假热，阳气欲散，疗寒痰，寒痛，阴疽。**」【别录】「**腰脊风寒，脚气寒冷弱，心腹冷痛，霍乱转筋，下痢赤白，温中，强阴，坚肌骨，又堕胎为百药长。**」【好古】「**督脉为病，脊强而厥。**」【容川】「**人身之气，生于肾中一阳……附子可以振肾阳以蒸动其气。其色纯黑，味辛烈，能从下焦扶阳补气……附子是助热，热生于水中，是得天水之阳，故附子入气分以助阳，能补命门之火，是以火化水，为肾与膀胱要药。**」【药征】「**主逐水，能治恶寒，身体四肢及骨节疼痛，或沉重，或不仁，或厥冷，而旁治腹痛失精下利。**」【灵胎】「**逐寒邪，回阳气。**」【用量】「**普通一钱至三钱，大剂一至二两。**」\n\n**【最重要】附子 = 扶元回阳（补命门火/救逆）**\n\n**「张仲景是最会用附子的一个人」——「这是全书最重要的药。」** ✓✓\n\n**须「绝「对「强「标」**：**「①附子含乌头碱，有大毒；②须炮制 + 先煎（久煎）；③须专业医师处方；④不可自行服用」** ✓✓","o":"RJ-2512 · 《人纪·神农本草经》下经第二百六十四味「附子」，原文（PDF 第 489–490 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"生附子与炮附子截然不同","c":"【倪注】「**炮附子可以固表虚，去肺家寒症；生附子可以去里寒，二者截然不同。医者须明辨之，方可以用之无误。****临床时可见病人因表虚而至真阳外越，我辈当以炮附子为救逆之剂。****如脉细无力，病人昏迷不识人，此为里寒至极，因而真阳不足，当此之时又须以生附为主。**」讲义：「**我们使用炮附子时候，有使用炮附子的时机。****炮附子最好是表虚时候用，病人大汗不止、小便滴滴答答。****你说老师怎么记？很简单，你把小便的口当成一个毛孔好了，你汗流都不止，是表虚。**」\n\n**【最重要】生附子（去里寒）vs 炮附子（固表虚）**\n\n```\n炮附子 → 固表虚（大汗不止/小便滴答/真阳外越）\n生附子 → 去里寒（脉细无力/昏迷不识人）\n```\n\n**「二者截然不同」——「这是全书最精的辨法。」** ✓✓\n\n**「把小便口当成毛孔」——「这是最精的记忆法。」** ✓✓","o":"RJ-2513 · 《人纪·神农本草经》下经第二百六十四味，倪注及讲解（PDF 第 489–491 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"乌头附子天雄","c":"【产地】「**产我国四川山野……其初种之根，生成小块状者曰乌头，附乌头旁生而大者即附子，又附生而变形者曰天雄，小者毒强而大者毒少，故近人多取用附子。**」讲义：「**其初种的根，生成小块状的叫乌头；伏在乌头旁、大块的，是附子；附生而变形者，是天雄；小者毒强而大者毒少。****所以我们尽量选是大附子，很大的一个，有的像拳头一样。****那乌头呢，前面已经介绍过，又有个名字叫射罔。****过去的土人呢，就把乌头拿起来、挤个乌头汁，毒箭放里面，看到动物走过就射，一射就射在屁股上面，哇、整个麻掉了。**」\n\n**【极精】乌头（小/毒强）、附子（大/毒少）、天雄（变形）**\n\n```\n初生根小块 → 乌头（毒最强，射罔/毒箭）\n旁生大块 → 附子（毒较少）\n变形附生 → 天雄\n```\n\n**「小者毒强、大者毒少」——「这是最精的剂量逻辑。」** ✓✓","o":"RJ-2514 · 《人纪·神农本草经》下经第二百六十四味，原文产地及讲解（PDF 第 490 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"乌头碱中毒","c":"讲义讲「一条极重要的中毒描述」：「**吃附子时候如果是生附、炮附子没有了，生附子煮的汤，一喝下去，就舌头口唇麻掉了，吃下去麻麻麻，麻到手指的末梢、脚趾的末梢。****因为他有乌头碱在里面，是种神经的毒。****如果跟化学专家讲乌头碱，他听到头就麻掉了，因为他们知道很毒啊。**」\n\n**【极重要】乌头碱中毒 = 舌唇麻→末梢麻（神经毒）**\n\n```\n舌/唇麻 → 手指末梢 → 脚趾末梢\n  = 乌头碱中毒（神经毒）\n```\n\n**须「绝「对「强「标」**：**「①出现任何口唇/舌麻须立即停药 + 急诊；②可致心律失常/死亡；③须备急救」** ✓✓\n\n**「这是全书最重要的中毒警告。」** ✓✓","o":"RJ-2515 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 490–491 页）。"},{"t":"神农本草经·下经：石灰、代赭石、卤咸、白垩、附子","h":"附子的多种炮制法","c":"讲义讲「一条极精的炮制」：「**市面上拿到的都是炮制过的附子。****炮制的方式很多：有的附子蒸一下、跟豆腐放在一起，豆腐可以去毒，豆腐很厉害、豆类解毒能力很强；豆腐放下面一层，附子放在中间，下面是压着豆腐，蒸。****或者过去是珍珠，珍珠粉也可以这样做。****还有人煮时候用甘草煮过，煮出来后切片、烘焙过、切片，就是制过的炮附子。****我们使用炮附子时候，有使用炮附子的时机。**」【倪注附】「**今用盐腌以去毒，使附子之性不全，非正法也。**」\n\n**【极精】附子炮制三法：豆腐蒸、珍珠粉、甘草煮**\n\n```\n豆腐（豆类解毒）+ 蒸 → 炮附子\n甘草煮 → 炮附子\n盐腌 → 【非正法】（药性不全）\n```\n\n**「盐腌使药性不全」——「这是最精的批评。」** ✓✓","o":"RJ-2516 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 491 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"生附子与石硫磺的分工","c":"讲义讲「一条极重要的分工」：「**生附子黑色，专门入肾入骨头。****硫磺呢，黄色的，颜色不一样，专门入三焦，上焦、中焦、下焦，入奇恒之腑。****脑瘤，脑部的奇恒之腑、脏腑之间的奇恒之腑。****还有人呢，是中了五金的毒、铜铁中毒，用硫磺可以解五金的毒。****一个人是肾阳不够、肾里的水不够造成腿没力气，我们会用生附子。****那如果说这个人本身肾阳很够、肾阳没有缺，腿没有力的时候，我们会去用生硫磺。**」\n\n**【极重要】生附子（黑/肾/骨）vs 石硫磺（黄/三焦/奇恒之腑）**\n\n```\n生附子（黑）→ 肾、骨 → 肾阳不足腿无力\n石硫磺（黄）→ 三焦、奇恒之腑 → 肾阳足而腿无力/脑瘤/五金毒\n```\n\n**「颜色决定归经」——「这是最精的取象。」** ✓✓\n\n**须「绝「对「强「标」**：**「①附子与硫磺皆有大毒；②须专业医师；③不可自行服用」** ✓✓","o":"RJ-2517 · 《人纪·神农本草经》下经第二百六十四味「附子」，讲解（PDF 第 491–492 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"里寒的描写","c":"讲义讲「一个极精的问诊情景」：「**病人告诉你，医生我冷。****你问他：你是怎么个冷？****病人说：哦，我冷到晚上仲夏之夜，我房子晒了一天太阳、里面很闷热，门窗还要关起来、还要盖三层被子，我还是冷。****这是里寒，这时候就靠生附子。****唯有生附子可以解决。****如果里寒，加上全身有水肿、水肿在那边、三焦不通，生附子加石硫磺并在一起用就可以。**」\n\n**【极精】里寒的四要素：仲夏 + 晒热屋 + 关门窗 + 三层被**\n\n```\n仲夏（最热）+ 晒热房 + 关门窗 + 三层被 → 仍冷\n= 里寒（非表寒）\n```\n\n**「这是最精的里寒画像。」** ✓✓","o":"RJ-2518 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 492 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"命门火的源头是天阳","c":"讲义讲「一条极重要的机制链」：「**命门火呢，生命之火我们要靠生附还有硫磺都可以点火。****那你说老师肉桂？肉桂也是可以，按照《神农本草经》也是可以温命门火。****他这个桂附呢是木头来的，木生火，所以说肉桂可以啊。****但是木头丢下去的时候，我们实际上这个命门火的源头叫心脏。****当我们人吸一口气进来，我们叫天阳；吸进来这个天的阳到了心里面好像氧气一样，突然氧很多、火就很旺。****这个心火因为我们吸入的阳火旺起来，这个火再到命门，就是我们的命门火。****所以真正的命门火的源头是来自我们吸入的天阳。**」\n\n**【极重要】命门火源头 = 吸入的天阳 → 心火 → 命门**\n\n```\n吸气（天阳）→ 心火旺 → 下传命门 → 命门火\n```\n\n**「肉桂强心、生附直接点肾火」——「这是最精的三级链条。」** ✓✓","o":"RJ-2519 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 492–493 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"肉桂生附硫磺三药分工","c":"讲义讲「一条最精的三药对比」：「**肉桂呢是木生火，他在这个心脏的部分，他能够强心；所以我们要强心的时候，倒不是开附子，而是开的是肉桂。****那老师我们又要强心又要强肾，那肉桂附子开到一起嘛，桂附八味丸就是这样来的啊。****那附子不一样，附子是生在田里面的，它是在水里面的，那就是水里面的阳，水就是肾脏。****所以我们在治疗肾脏病的时候、尿毒，他用的附子很多。****所以说真的是，唐容川讲：肉桂是补火，所以不一样。****肉桂吃下去，心脏力量搏动会起来，心脏搏动产生的热会进入肾脏。****生附不是这样啊，直接就在肾脏点火了、还要经过心脏？不需要经过心脏，直接在肾脏就点火了。**」\n\n**【最重要】三药分工：肉桂（强心）→ 生附（直点肾火）→ 硫磺（三焦）**\n\n```\n肉桂（木生火）→ 强心 → 心热下传肾\n生附（水中之阳）→ 直接点肾火（不经心）\n硫磺（黄）→ 三焦/奇恒之腑\n```\n\n**「不经心脏，直接点肾火」——「这是最精的差别。」** ✓✓","o":"RJ-2520 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 493、499 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"生附子的剂量滴定","c":"讲义讲「一条最精的剂量法」：「**这个生附子吃下去的时候，病人你要问他：三钱开下去，你吃完药嘴巴麻不麻？****那吃完药嘴巴就麻啦——剂量到此为止，不要再添加了。****三钱就嘴巴麻么？没感觉呀、一点感觉都没有。****嗯，四钱哦，下次来就四钱；还没麻、五钱；一点点麻，知道一点点麻，那重剂重病就好了。****这个生附子产生的麻，绝对不会 有后遗症，跟乌头不一样。**」\n\n**【最精】生附子剂量滴定 = 以「麻」为终点（3→4→5 钱）**\n\n```\n3 钱不麻 → 加至 4 钱 → 5 钱微麻 = 到位\n麻即止（不加）\n```\n\n**「以麻感滴定」——「这是最精的个体化剂量法。」** ✓✓\n\n**须「绝「对「强「标」**：**「①这是危险做法，绝对不可模仿；②须住院/监护；③麻 = 乌头碱中毒早期」** ✓✓","o":"RJ-2521 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 494–495 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"生附子与乌头之别","c":"讲义讲「一条极重要的文献学纠错」：「**真的凶的是乌头最凶，天雄那根本不能比了、根本没什么毒了。****所以最不毒是天雄，中小毒是附子，大毒是乌头。****但是有一种病非乌头不可，我会告诉诸位。****那这个就是这样子造成人家说生附子不能吃啊。****那生附子为什么过去说是毒？除了麻以外，它因为里面纤维很多。****你一煮完，好像那个芋头煮烂了以后，一煮烂了你看那汤上面一层毛，黑毛毛的，你一吃下去那不是纤维么？一吃到吞不下去，就在喉咙里面粘到，一粘到就咳得很厉害啊。****因为你会想把这纤维咳掉嘛，细细的毛你吞不下去、嗝在那喉咙那边，就开始说这个附子有毒。****其实附子没有毒啊，真的有一点点毒但不是那么强。**」\n\n**【极重要】毒性排序：天雄（最不毒）< 附子（小毒）< 乌头（大毒）**\n\n**「纤维粘喉被误判为中毒」——「这是最精的文献学纠错。」** ✓✓\n\n**「猎人用乌头不用附子」——「这是最精的旁证。」** ✓✓","o":"RJ-2522 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 493–494 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"生附子须棉布包","c":"讲义讲「一条极精的实操」：「**生附子剂量的时候你要小心：第一个我们在使用，比如说像我这种个子、一看生附子三钱，比我小一点两钱，再小一点一钱。****那你要生附子、生的附子切块，你不要整个丢下去，因为你洗完过晒干会很硬，切一刀破八片——有没有，像张仲景切成八片。****那个丢下去的时候最好用棉布给它包起来，不然的话那个纤维会跑出来。****所以你棉布包起来，纤维就在棉布里面就不会出来，就不会粘到喉咙、就不会咳嗽。****那炮附子不用，一炮制过之后那纤维都烂掉了。**」\n\n**【极精】生附子须棉布包（防纤维粘喉）**\n\n```\n生附子（纤维多）→ 破八片 + 棉布包\n炮附子 → 纤维已烂，不须包\n```\n\n**「这是最精的实操细节。」** ✓✓","o":"RJ-2523 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 494 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"青盐炮附子刷牙","c":"讲义讲「一个极精的用法」：「**那炮附子这个你说生附子三钱这个体格，那炮附子三钱，那三钱是刷牙用的、刷牙啊。****炮附子和青盐合到一起刷牙，牙齿固得很好；那炮咸能入肾么，补骨对不对。****青盐炮附子跟过去那个宫廷里面统统是用青盐刷牙的。****青盐就够了，因为青盐本来就够啦；但是有炮附子更好，为什么？因为炮附子是咸味入肾，它能够补，因为牙为骨之余嘛，它能够补骨。**」\n\n**【极精】青盐 + 炮附子刷牙（牙为骨之余）**\n\n```\n牙 = 骨之余\n青盐（咸入肾）+ 炮附子（补骨）→ 固齿\n```\n\n**「这是最精的宫廷用法。」** ✓✓","o":"RJ-2524 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 494 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"生附往里炮附往外","c":"讲义讲「一个最精的图示解说」：「**如果说我们用个图示来代表生附子和炮附子的功能……如果这是个人、这是中心：当你使用生附的时候，病人吃了药的感觉是这样的——生附他能够从这个地方往人体最中心的地方去攻、往里面走，所以它能够把里寒去掉，不管多里。****炮附子是往外走、往外走的时候，炮附子、炮制过的，所以走在皮肤表面上。****所以我们有的时候脓疡、里面化脓了，我们要推出来，要炮附子。****那你如果炮附、生附一起用——老师一个往里面推、一个往外挤，你把中间这个部分、正好卡在中间这个地方、正好在皮肤肌肉中间，所以说那你要一挤的时候，这一段的水全部一起排掉。**」\n\n**【最重要】生附往里攻（去里寒）、炮附往外推（排脓/表虚）**\n\n```\n生附 → 向内（攻里寒）\n炮附 → 向外（推脓/固表）\n生附+炮附 → 双向挤（全身水肿一剂排）\n```\n\n**「一挤就把水全部排掉」——「这是最精的药性几何学。」** ✓✓\n\n**须「绝「对「强「标」**：**「①此法极危险；②须专业医师；③不可模仿」** ✓✓","o":"RJ-2525 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 498–499 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"尿毒与尿意","c":"讲义讲「一条极重要的阳的定义」：「**阳我们一再的讲，阳就是动能。****比如说我们的念头想法：那哎哟我们现在想上厕所，你想上厕所、你知道你要小便，这叫做正常。****所以说你的念头又为尿意，你这个尿意呢就是因为你有阳，才有尿意、意念才会有。****哪天你尿意没了，你不知道要上厕所啊——『奇怪老师我一天没有感觉到小便』——诶呀我吓死了，阳没有了。****尿毒的人就没有尿意，这个意念没了。****那我们要让这个尿意回头，就是让他的阳回头。**」\n\n**【极重要】尿意 = 阳（意念）；尿毒 = 无尿意**\n\n```\n尿意（想上厕所）= 阳（动能/意念）\n尿毒（无尿意）= 阳已亡\n```\n\n**「阳就是动能」——「这是最精的阳的定义。」** ✓✓\n\n**「这条与 n212气就是动能」同一体系。** ✓✓","o":"RJ-2526 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 496 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"尿毒脸黑是肾营养反逆","c":"讲义讲「一条极精的机制」：「**阳是有储蓄的作用、有蓄的作用，所以说我们叫潜。****中医讲潜的话，就是电池蓄电池一样，储蓄的作用。****当你阳没有了，我们身上的营养还是不能进去啊——这个营养本来应该呆在肾脏里，那肾脏现在没有阳了、不蓄电了，那个营养怎么办？所以就反逆出来，反逆出来就跑脸上、头上、身上都是黑的。****所以黑色实际上是肾脏的营养，本来应该呆肾脏里的，现在不能呆了。****尿毒的病人一进去一看都是黑人，管他是白种人、黄种人，进去一看全部是黑的，因为肾是黑色。**」\n\n**【极精】尿毒脸黑 = 肾的营养反逆（阳不蓄）**\n\n```\n肾阳（蓄电池）→ 蓄营养\n阳亡 → 营养反逆上脸 → 面色黑\n```\n\n**「阳 = 蓄电池」——「这是最精的比喻。」** ✓✓","o":"RJ-2527 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 496–497 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"表寒与里寒","c":"【药征】「**主逐水，能治恶寒，身体四肢及骨节疼痛，或沉重，或不仁，或厥冷。**」讲义：「**这里的恶寒并不是表的恶寒，我们有里面的恶寒跟表的恶寒。****表的恶寒的话，身好像被皮鞭打到，全身皮肤很痛、好像杖鞭打了一样、很冷哦，那个夏天关在车子里面还冷，你一摸脉、脉是浮的，我们叫表寒，皮肤很痛哦。****里寒呢也是很冷，但是皮肤不痛，你摸脉沉在底下的。****里寒那就是生附子。****如果说这个是表寒、脉很浮、皮肤肌肉关节都很痛，我们知道这个是要发表——比如开一些麻黄汤来发表；结果呢你开了炮附子下去，炮附子是收敛的，结果吃下去不对症、越吃越热。**」\n\n**【极重要】表寒（脉浮/皮肤痛）vs 里寒（脉沉/皮肤不痛）**\n\n```\n表寒（脉浮 + 身痛 + 无汗 + 高热）→ 麻黄汤（发汗）\n里寒（脉沉 + 不痛 + 苍白 + 不渴）→ 生附子（回阳）\n  ⚠ 用炮附子治表寒 = 越吃越热（收敛之误）\n```\n\n**「脉浮/脉沉 + 痛/不痛」——「这是最精的四字鉴别。」** ✓✓","o":"RJ-2528 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 495–496 页）。"},{"t":"神农本草经·下经：附子（续）核心辨法","h":"固阳与脱证","c":"讲义讲「一条极重要的归纳」：「**你说固阳，过去中医的观念里面我们要固阳、固本培元要固阳。****这个阳虚呢——你说老师什么叫阳虚？精子不能收啊也叫阳虚，流汗流不止啊也叫阳虚，舌头伸出来收不回去啊，你不要听到真的有这种病啊——舌头收不回去、阳虚，我们要让他收回来，都要靠附子收回来啊。****还有脱肛啊、疝气啊，都要靠附子，脱证都要靠附子，因为它能固阳嘛。****但这个固阳你是要靠炮附子。**」\n\n**【极重要】脱证（汗不止/遗精/舌不收/脱肛/疝气）→ 炮附子固阳**\n\n```\n脱证（气/血/津外泄）→ 炮附子（收敛固阳）\n```\n\n**「这条与 n201炮附子固表虚」同一主题。** ✓✓","o":"RJ-2529 · 《人纪·神农本草经》下经第二百六十四味，讲解（PDF 第 495–496 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"乌头蜜制法","c":"【本经原文】「**味辛，温，有大毒；治中风，恶风洒洒，出汗，除寒湿痹，咳逆上气，破积聚，寒热；其汁煎之，名射罔，杀禽兽；一名奚毒。**」讲义讲工艺：「**这乌头呢一定要先经过水煮。****我平常是乌头一两、川乌，然后呢，三碗水煮成一碗，煮成一碗以后去渣——也就是说乌头你不要用了，就拿个滤网把渣给丢了，剩下一碗乌头汤。****还没有完啊，你不要拿去给病人喝啊，当场就隔屁着凉。****然后呢，再去两碗的蜜、蜂蜜，蜂蜜配合混合下去。****那你这一碗的乌头汤跟两碗蜜和在一起的时候，蜜就溶化、比较稀，对不对？好，再煮、再煮成两碗，就拿到手上啦，这是最稳当的。****然后这两碗就是我们所谓的乌头蜜。**」\n\n**【最重要】乌头蜜三步工艺**\n\n```\n川乌一两 + 三碗水 → 煮成一碗 → 去渣（弃乌头）\n+ 两碗蜂蜜 → 再煮成两碗 = 乌头蜜\n```\n\n**再用桂枝汤冲服：一平匙乌头蜜 / 一剂**\n\n**须「绝「对「强「标」**：**「①乌头有大毒（乌头碱）；②绝对不可自行制备；③须专业医师/药师；④心律失常可致死」** ✓✓\n\n**「这是全书最精的炮制工艺。」** ✓✓","o":"RJ-2530 · 《人纪·神农本草经》下经第二百六十五味「乌头」，原文及讲解（PDF 第 500–501 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"乌头治类风湿","c":"讲义讲「一条极重要的疗效」：「**那世界上只有这个药可以治疗西医所谓的类风湿性关节炎：手头关节整个变形掉，然后变成肿大、关节地方肿大，然后变形。****你知道痛到什么程度？痛到他宁可死。****就是因为这样子痛，所以他们才会吃止痛药、吃到连肾脏衰竭掉。****但是你用乌头蜜制的时候，他会慢慢……我用乌头汤、乌头桂枝汤治病人的时候，有个老太太吃两个礼拜，连关节变形形状都回来，手都可以握拳了。****本来握拳都不能握，她手拿起来就是巫婆的手一样，变形回来。**」\n\n**【极重要】乌头桂枝汤 → 类风湿关节变形回退（两周）**\n\n```\n类风湿（关节变形/剧痛）→ 乌头桂枝汤\n2 周 → 关节形状回退、可握拳\n```\n\n**须「绝「对「强「标」**：**「①类风湿须风湿科 + DMARDs/生物制剂；②乌头不能替代；③此为个案」** ✓✓","o":"RJ-2531 · 《人纪·神农本草经》下经第二百六十五味，讲解（PDF 第 501–502 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"川乌与草乌","c":"讲义讲「一条极重要的分辨」：「**我们乌头有两种，一种是川乌头，一种是草乌头。****你如果到中药行去，他会问你：『你要川乌还是草乌？』要看看你是行家。****我们是用川乌头，草乌头是伤科在用，草乌头非常的毒。****那是我们伤科，我们伤科很多药要用铜、自然铜，很多伤科外伤扭伤、那个续断接骨用的。****所以国术馆用得很多，那种是草乌头，不是川乌头。****第一个我们选择的是川乌，乌头拿出来就是乌头，就是黑黑的乌头。**」【禁忌】「**详见附子。**」\n\n**【极重要】川乌（内服）vs 草乌（伤科外用，极毒）**\n\n```\n川乌（内服/乌头蜜）→ 类风湿\n草乌（伤科外用）→ 极毒，绝不可内服\n```\n\n**须「绝「对「强「标」**：**「草乌毒性远强于川乌，多国禁内服；须严格区分」** ✓✓","o":"RJ-2532 · 《人纪·神农本草经》下经第二百六十五味，讲解（PDF 第 500、503 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"止痛药致洗肾","c":"讲义讲「一条极重要的临床观察」：「**你到洗肾中心去问，你年纪轻轻、三四十岁怎么洗肾呀？吃止痛药吃太多。****吃什么止痛药啊？风湿关节炎的止痛药吃太多，结果吃到肾衰竭洗肾啊。****台湾一大堆洗肾中心里面，不敢说百分之百，百分之三十到四十是因为吃止痛药后来洗肾的。****那都是吃风湿关节炎的药，吃得半年就要洗肾。**」\n\n**【极重要】NSAIDs 止痛药 → 肾衰竭（30–40% 洗肾）**\n\n```\n风湿关节炎 → 长期 NSAIDs → 肾衰竭 → 洗肾\n```\n\n**须「强「标」**：**「①NSAIDs确有肾毒（尤其老年/脱水/CKD）；②须医师监测；③『30–40%』为讲义估计，非流行病学数」** ✓✓\n\n**「这是最精的临床观察。」** ✓✓","o":"RJ-2533 · 《人纪·神农本草经》下经第二百六十五味，讲解（PDF 第 500 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"远志解乌头毒","c":"讲义讲「一条极精的解药」：「**我们治疗尿毒的时候，有的时候这个毒进入到心脏里面去，我们会用解毒的药，比如说我们前面教的黄连、黄连解毒——解什么毒啊？尿毒嘛。****有任何的毒侵犯到心脏里面、顺着血液会进入心脏会造成心脏衰竭，这种的毒通通可以用黄连来解它。****乌头、附子、天雄的毒，你用远志可以解掉。****那黄连解毒的同时怕心脏麻痹掉，如果是尿毒，你可以加一些远志、加一些肉桂，让心脏强起来，解毒的同时能够强心。**」\n\n**【极精】远志解乌头/附子/天雄毒**\n\n```\n尿毒（心毒）→ 黄连\n乌头/附子/天雄毒 → 远志\n```\n\n**须「绝「对「强「标」**：**「①乌头碱中毒须急诊（心律失常）；②远志不能替代急救；③须洗胃/活性炭/对症」** ✓✓\n\n**「这是最精的解药对应。」** ✓✓","o":"RJ-2534 · 《人纪·神农本草经》下经第二百六十五味，讲解（PDF 第 503 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"天雄的采收年份","c":"【本经原文】「**味辛，温，有大毒；治大风，寒湿痹，历节痛，拘挛缓急，破积聚、邪气，金疮，强筋骨，轻身，健行。**」【性味】「**味甘辛，性温热，有毒。**」【主治】「**天雄与附子之功用略同，惟一般对下元虚寒性机能衰退者及风痰症都多用天雄。**」【别录】「**疗头面风，去来疼痛，心腹结聚，关节重，不能步行，除骨间痛，长阴气，强心，令人勇武力作不倦。**」【用量】「**一般一钱至三钱。**」【禁忌】「**热症之人忌用。**」讲义：「**天雄实际上就是附子五年以后采收：我们同一株，农民去种，第三年采收下来是大附子，四年采收的是乌头，第五年去采收的根茎那就是天雄。****它在土里面很久，很久以后它的性能就很强很凶。****最毒的是乌头，其次才是天雄附子。**」\n\n**【极重要】天雄 = 五年生（3年附子、4年乌头、5年天雄）**\n\n```\n3 年 → 大附子\n4 年 → 乌头\n5 年 → 天雄（最强/最补）\n```\n\n**「在土里越久性能越强」——「这是最精的年份学。」** ✓✓","o":"RJ-2535 · 《人纪·神农本草经》下经第二百六十六味「天雄」，原文及讲解（PDF 第 504 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"三药分工总表","c":"讲义讲「一条最精的总结」：「**这三味药（乌头、附子、天雄），所以你们现在分清楚了：治癌症的时候我们用生附子，治关节炎的时候我们用乌头，壮元阳、壮肾、壮阳的时候我们可以用天雄，是不是就分开来了。****张仲景也是这样子用的。****所以我们不会用天雄去攻坚、去攻肿瘤，因为是阴实嘛、实症。****那如果说我们用乌头去攻、不会，乌头去攻关节——关节怎么变形，非要用乌头进入到了关节里面去、最深的嘛，硬把那个关节打、挺回来。**」\n\n**【最重要】三药分工：生附治癌、乌头治关节、天雄壮阳**\n\n| 药 | 靶点 | 用途 |\n|---|---|---|\n| **生附子** | 里寒/阴实 | 癌症、救逆、尿毒 |\n| **乌头** | 关节最深 | 类风湿变形 |\n| **天雄** | 下元/命门 | 壮阳、痨症 |\n\n**「这是全书最精的三药地图。」** ✓✓","o":"RJ-2536 · 《人纪·神农本草经》下经第二百六十六味，讲解（PDF 第 505 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"治水肿须忌盐","c":"讲义讲「一条极精的饮食禁忌」：「**还有呢，我们在临床上治症的时候要注意一点：如果治疗水肿，我们炮附子、生附子下去水退了，退了以后告诉你：盐巴不要吃。****海盐不要吃，我们在使用的这些药都是盐性的药，再吃盐巴病会回来的。****人是圆形的，太过病又会回头。****所以我们在治疗水肿的时候、肾脏病的时候，病人要忌盐，因为这个味道都是咸味的药。**」\n\n**【极精】水肿退后忌盐（咸味圆运动回头）**\n\n```\n水肿 → 附子/硫磺（咸味）退水\n退后仍吃盐 → 「太过回头」→ 水肿复发\n```\n\n**「人是圆形的，太过回头」——「这是最精的圆运动应用。」** ✓✓\n\n**须「标」**：**「①肾病须限钠（非绝对禁）；②须营养师；③低钠血症须补」** ✓✓","o":"RJ-2537 · 《人纪·神农本草经》下经第二百六十六味，讲解（PDF 第 506 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"生半夏是水玉","c":"【本经原文】「**味辛，平，有毒；治伤寒，寒热，心下坚，下气，喉咽肿痛，头眩，胸胀，咳逆、肠鸣，止汗；一名地文，一名水玉。**」【性味】「**味辛，性平，有毒。**」【主治】「**半夏为除湿化痰，止呕止哕，开郁发表要药，主和胃，健脾，消积，化涎，顺气止咳，平逆止吐，治心痛，痞结，水饮，痰气，救五绝。**」【甄权】「**制者消痰下肺气，开胃健脾，止呕吐，去胸中痰；生者摩痈肿，除瘤瘿气。**」【容川】「**此生当夏之半，其根成于秋时，得燥金辛烈之气，故主降逆水饮，为阳明之药，此为真性。**」【药征】「**主治痰饮呕吐也，旁治心痛逆满，咽中痛，咳悸，腹中雷鸣。**」【灵胎】「**开肺降逆，消痰燥湿。**」【用量】「**普通一钱至三钱。**」【禁忌】「**一切血症及阴虚血少，津液不足之病，均忌；孕妇禁用，用姜佐则无害，反乌头。**」讲义：「**它还有一个名称叫水玉，很好听啊、叫水玉。****生半夏长在水里面，它排水的力量非常的强。**」\n\n**【最重要】生半夏 = 水玉（排水最强）**\n\n**「中医经方家使用生半夏是在涤痰去痰的时候使用最多：去痰、止咳、开喉」** ✓✓\n\n**须「绝「对「强「标」**：**「生半夏有毒（含草酸钙针晶），须制（姜半夏）；孕妇禁；不可自行服用」** ✓✓","o":"RJ-2538 · 《人纪·神农本草经》下经第二百六十七味「半夏」，原文及讲解（PDF 第 506–507 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"生半夏磨肿瘤","c":"讲义讲「一个极精的外用」：「**平常呢你诊所里面放一些生半夏。****有个人跑来，你看生半夏有多强：你还没有内服呢，那生半夏拿起来一颗一颗的，你用棉布袋扎起来。****然后给你看那个脖子肿得很大，把那个生半夏放在袋子里面啊，一边跟他讲话、一边在那（肿的地方）磨、磨他的硬瘤、肿瘤、甲状腺的硬块、腋下的硬块、阴瘤啊什么，就这么摩搓。****一边就开始动了，就听到水声了，就开始融化了。****生半夏就是这么强啊。**」\n\n**【极精】生半夏布包外磨（听水声）**\n\n```\n生半夏 + 棉布袋 → 外磨甲状腺硬块\n  → 「听到水声」→ 硬块开始融化\n```\n\n**须「绝「对「强「标」**：**「①甲状腺结节须超声 + 穿刺；②外磨不能缩小肿瘤；③不可自行操作」** ✓✓\n\n**「这是最精的取象（以水化水）。」** ✓✓","o":"RJ-2539 · 《人纪·神农本草经》下经第二百六十七味，讲解（PDF 第 507 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"三生饮急救","c":"讲义讲「一条极重要的急救方」：「**中医急救的时候我们用三生饮：生半夏 3 钱、生（天）南星、这些都是毒药哦，生附子都是 3 钱，你用 3 碗煮成 1 碗，灌下去的时候，那喉咙里面的痰整个都吐出来，醒过来。****急救哦。****这个生半夏要生用的时候，我们要生用的时候取它的迅捷。****所以生用处方的时候它会有毒，但是它的速度会非常的快速、当场就知道了。**」【倪注】「**一般使用生半夏以止呕吐时，多加生姜以制其毒。****重症病患之呕吐，唯此生半夏可治，学者当用之勿惧。**」\n\n**【极重要】三生饮 = 生半夏 + 生南星 + 生附子（各 3 钱）**\n\n```\n三生饮 → 涌吐喉中痰 → 醒（急救）\n「生用取其迅捷」\n```\n\n**须「绝「对「强「标」**：**「①中风/昏迷须立即120；②三生饮有大毒，现代不可用；③绝对不可自制」** ✓✓","o":"RJ-2540 · 《人纪·神农本草经》下经第二百六十七味，讲解及倪注（PDF 第 507 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"生姜解半夏毒","c":"【倪注】「**实则此药又名婆婆药，意即可以让人失音，并不会致命。****如果失音时，只须口含生姜片，须臾声自回。**」讲义：「**那生半夏过去人家不敢吃就是怕中毒嘛，实际上我上面写很清楚，就是这个中毒不会死人，就是声音没有了。****因为半夏是无色无味，一煮起来、吃下去声音没了，所以我们叫它婆婆药。****你叫她声音恢复很简单，因为生姜专门解半夏的毒。****所以你只要嘴巴含一片生姜，含下去以后那生姜味道跑到口水里面，一进入喉咙，声音就来了。****一物克一物。**」\n\n**【极精】生姜解半夏毒（失音含姜片即回）**\n\n```\n生半夏中毒（失音）→ 口含生姜片 → 声音恢复\n```\n\n**须「强「标」**：**「①半夏中毒可致口舌麻木/呼吸困难；②须就医；③姜片是辅助非解毒药」** ✓✓\n\n**「一物克一物」——「这是最精的配伍解药。」** ✓✓","o":"RJ-2541 · 《人纪·神农本草经》下经第二百六十七味，倪注及讲解（PDF 第 507 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"男怕脚肿女怕戴帽","c":"讲义讲「一条极重要的危症判据」：「**那男人跟女人又不太一样：女人呢头肿起来非常危险，同样是生半夏用在女人身上跟用在男人身上不一样。****女人身上想尽办法要把你水导下来；男人头肿起来没什么危险。****所以车祸下来，一左一右两个人同时乘一部车子出车祸，同时两个人脑积水的时候，头肿起来的话，男人一般会存活下来、女人就存活不下来。****但是同样反过来，男人如果脚肿起来，就活不了了；女人脚肿起来就活得了。****所以我们中医有句话叫男怕脚肿、女怕戴帽——头肿得像戴帽子一样，很危险的症状。**」\n\n**【极重要】男怕脚肿、女怕戴帽（危症判据）**\n\n```\n男 → 脚肿（危）\n女 → 头肿（危）\n```\n\n**「这是最精的民间危症口诀。」** ✓✓\n\n**须「强「标」**：**「①水肿须查心/肾/肝/甲状腺；②头面肿 + 呼吸困难须急诊；③此口诀无性别生理依据」** ✓✓","o":"RJ-2542 · 《人纪·神农本草经》下经第二百六十七味，讲解（PDF 第 508–509 页）。"},{"t":"神农本草经·下经：乌头、天雄、半夏","h":"半夏是至高之水","c":"讲义讲「一条极重要的定位」：「**人身上呢，至高的水，这生半夏呢，去至高之水。****老师你说什么叫至高之水？脑水。****脑积水的时候，我们要靠生半夏把它清掉。****那肺里面有水，生半夏也可以使用。****我们现在是肺积水、肺有一点点水、咳嗽、喉咙很痒，那生半夏下去咳嗽去掉就好了。**」\n\n**【极重要】生半夏去「至高之水」（脑积水/肺水）**\n\n```\n至高之水（脑）→ 生半夏\n肺水 → 生半夏\n```\n\n**「水能生万物，也生肿瘤」——「这是最精的水观。」** ✓✓\n\n**须「强「标」**：**「①脑积水须神外科（分流术）；②不可以中药替代；③急性颅压高须急诊」** ✓✓","o":"RJ-2543 · 《人纪·神农本草经》下经第二百六十七味，讲解（PDF 第 508 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"半夏的使用时机问口渴","c":"讲义讲「一条极精的用药条件」：「**因为他抵水的力量很强，所以一般我们会给你下处方生半夏的时候，我们会问一个问题：问口渴。****病人如果口渴、嘴巴很渴，我们一般不用半夏，因为半夏抵水力量很强，越吃越渴。****所以不渴的时候我们会用半夏。****我们使用半夏的时机就是要问口渴。****但这是一般的大原则；紧急的时候那人昏迷过去了、喉咙里面痰很多，你还是问渴不渴？不要那么没有常识。**」\n\n**【极精】用半夏的条件：不渴（渴则越吃越渴）**\n\n```\n不渴 + 痰/呕/咳 → 半夏\n口渴 → 不用半夏（抵水伤津）\n（急救例外）\n```\n\n**「问口渴是用半夏的门槛」——「这是最精的用药条件。」** ✓✓","o":"RJ-2544 · 《人纪·神农本草经》下经第二百六十七味「半夏」，讲解（PDF 第 509–510 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"口渴不欲饮就是淤血","c":"讲义讲「一条极重要的症状组」：「**病人有血症会口渴……有淤血的时候很好玩喔：你问他，你口渴不渴？****他会说：医生我很奇怪喔，我嘴巴很渴、可是我不想喝水。****你听着很火大、想给他一个耳光——来踢馆了是不？嘴巴说口渴、又不想喝水。****他这个症状就是标准的身体里有淤血，就是这种感觉：嘴巴很干燥，可他不想喝水。****所以听到嘴巴很干燥、不想喝水——淤血。****他没有骗你，那是淤血。****在经方里面讲的很清楚：血症就是口渴不欲饮。**」\n\n**【极重要】口渴不欲饮 = 淤血（经方定理）**\n\n```\n口渴 + 不想喝水 → 淤血（「但欲漱水不欲咽」）\n```\n\n**「这是最精的淤血证。」** ✓✓\n\n**「这条与 n173血无止法」须否定并列——此处是正确的经典证候。** ✓✓","o":"RJ-2545 · 《人纪·神农本草经》下经第二百六十七味，讲解（PDF 第 510 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"孕妇用半夏须配干姜","c":"讲义讲「一条极重要的怀孕用药」：「**孕妇禁用，有没有禁用？没有禁用。****孕妇在恶心呕吐的时候，非要用半夏、干姜才能止呕。****所以你好好的、没有恶心，你给她吃什么半夏啊？那半夏利水很强啊，那羊水没有了，小孩子干在里面渴死了。****所以不要随便用半夏。****就像我那天跟诸位讲，病人怀孕到 6 个月，呕吐吐得抱住马桶，我只是开了 3 包、每包 1 钱——那半夏、干姜、人参 3 包就好了。****好了就好了，就不要再吃了嘛。**」\n\n**【极重要】孕妇用半夏须配干姜（否则羊水干）**\n\n```\n妊娠恶阻 → 半夏 + 干姜 + 人参（1 钱）\n无恶心 → 禁用（利水伤羊水）\n```\n\n**须「强「标」**：**「①妊娠用药须产科评估；②半夏传统列妊娠慎用；③剧吐须查电解质」** ✓✓","o":"RJ-2546 · 《人纪·神农本草经》下经第二百六十七味，讲解（PDF 第 510 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"半夏苦酒汤开喉","c":"讲义讲「一个极精的经方」：「**喉咙痛、恶心、呕吐、咳嗽，第一个想到就是半夏。****那一般的喉痛我们除了半夏，为了开结——因为整个喉咙闭锁掉了，我们用生半夏，光是靠生半夏破喉咙。****因为我们前面用生半夏把喉咙声音都去掉了，那很厉害。****那你喉咙整个肿起来、整个肿起来旁边肿大，不管是喉癌还是整个闭锁住、东西下不去，我们用生半夏；光生半夏破开的力量还不够，要泡在醋里面，醋是酸收就能收敛打开来，能够滑进去。****可能张仲景加一些鸡蛋清，所以我们半夏苦酒汤就这么来的，能让喉咙打开来。****实在还不行我们可以用硝石。**」\n\n**【极精】半夏苦酒汤 = 生半夏 + 醋 + 蛋清（开喉）**\n\n```\n喉闭（肿瘤/水肿）→ 生半夏破 + 醋（酸收）+ 蛋清（滑）\n```\n\n**须「强「标」**：**「①喉梗阻/呼吸困难须立即急诊（气管切开）；②不可自制；③喉癌须规范治疗」** ✓✓","o":"RJ-2547 · 《人纪·神农本草经》下经第二百六十七味，讲解（PDF 第 510 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"天南星涤痰半夏去水","c":"【本经原文】「**味苦，温，有大毒；治心痛，寒热，结气，积聚，伏梁，伤筋，瘘，拘缓，利水道；又名虎掌，今名天南星。**」【性味】「**味苦，性温，有大毒。**」【主治】「**天南星为祛风湿豁顽痰要药；主风痰壅塞，中风口噤，治口歪眼斜，痈毒疥癣，小儿惊风。**」【好古】「**补肝风虚，治痰功同半夏。**」【用量】「**普通五分至钱半。**」【禁忌】「**误服麻唇舌，得防风则不麻；凡使，宜以矾汤或皂角水浸，至不麻乃止。**」讲义：「**那老师半夏去痰、天南星也去痰，两个差异在哪里？****半夏比较去水——痰之前是水，水没有去掉才成痰，停太久变成痰。****所以我们要痰跟水一齐攻掉，才要半夏跟南星使用在一起。**」\n\n**【极重要】天南星（涤痰）vs 半夏（去水）：须同用**\n\n```\n水（半夏）→ 停久成痰（天南星）→ 痰水同攻\n三生饮 = 半夏 + 南星 + 生附\n```\n\n**「痰之前是水」——「这是最精的病理阶梯。」** ✓✓\n\n**须「强「标」**：**「天南星有大毒（口舌麻），须制（矾/皂角）；孕妇禁」** ✓✓","o":"RJ-2548 · 《人纪·神农本草经》下经第二百六十八味「虎掌」，原文及讲解（PDF 第 510–512 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"痰饮会造成怪病","c":"讲义讲「一条极精的临床经验」：「**当我们去涤痰的时候，我们百病、奇怪的病，过去很多奇症，看不懂怎么会有这个问题、很想不通的时候，我们大部分都会去痰。****痰饮会造成很多的怪病，所以我们有时候往往专心在治、把痰排掉的时候，诶、其他的病跟着好起来了。****我们有病人呢，皮肤痒得很厉害，开了很多皮肤痒的药没有用啊；可是他在抱怨，奇怪喉咙里面一直有痰、咳嗽得很厉害，我们开了涤痰的药在里面，诶、痰一去掉、皮肤好起来了，怪了。****所以痰饮是主症，其它有很多附带的症状被看到，往往我们会被附带的症状所迷惑。**」\n\n**【极精】痰饮是主症（皮肤痒/昏迷皆可源于痰）**\n\n```\n怪病/皮肤病/神昏 → 查痰饮\n涤痰 → 附带症状自消\n```\n\n**「肺主皮毛」——「这是最精的肺-皮关联。」** ✓✓","o":"RJ-2549 · 《人纪·神农本草经》下经第二百六十八味，讲解（PDF 第 512 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"大黄是去实的药","c":"【本经原文】「**味苦，寒，无毒；主下瘀血，血闭，寒热；破症瘕积聚，留饮，宿食，荡涤肠胃，推陈致新，通利水谷，调中化食，安和五脏。**」【性味】「**味大苦，性大寒，无毒（或作有毒）。**」【主治】「**大黄为泻实热、荡积滞要药，主血闭热结，功能下瘀破症，荡涤肠胃，推陈致新，调中化食，大便燥结，女子经闭。**」【容川】「**大黄味苦大寒，形大而气烈，得地火之阴味，色黄，为火之退气所发见，故能退火，专下血分之结……与黄连之守而不走，正好相反。大黄是治火之药，禀地气，入后天之血分也。**」【药征】「**主通利及结毒也，故能治胸满腹满，腹痛及便秘，小便不利，旁治发黄瘀血脓肿。**」【用量】「**普通五分至三钱。**」【禁忌】「**凡气分病，及胃寒血虚，妊娠产后，均忌。**」讲义：「**大黄是泻实的药，其实没有去热，泻实的药。****如果我们想写标准一点的书的话，大黄是泻实的药，它并不去热。****寒实我们也是用大黄。**」\n\n**【最重要】大黄 = 去实（不分寒热）**\n\n```\n大黄 → 只去「实」（有东西）\n热实 → 大黄 + 黄芩/黄连（去热）\n寒实 → 大黄 + 附子/干姜（去寒）\n```\n\n**「大黄本身不去寒也不去热，它就是去实」——「这是全书最精的药性定义。」** ✓✓","o":"RJ-2550 · 《人纪·神农本草经》下经第二百七十味「大黄」，原文及讲解（PDF 第 513–516 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"大黄甘草汤解食物中毒","c":"讲义讲「一«个«极«精«的«经«方»」：「**你吃东西吃坏了，吃完以后胃里面怪怪的，再一看泡面已过期 6 个月，再一看后面有个小洞、蟑螂咬的洞。****你看的时候没有看到后面啊，已吃到肚子里面去了，这是初症、停在胃里面。****这个时候要靠大黄，它没有分寒热，就要把实去掉。****但是你不会光用一味大黄的药。****大黄它是将军啊、外号是川军，四川人吃辣已经很彪悍了，再加上它是四川的将军。****所以说你下去就跑掉啦，实还没有去掉、大黄已经跑掉了。****这时候我们就会加甘草，喂你慢点慢点不要跑得太快，停下把胃里面清掉，就好了。****所以，我们经方在处理吃坏肚子的食物，我们用大黄甘草汤。****很简单的两味药。**」\n\n**【极重要】大黄甘草汤 = 大黄（去实）+ 甘草（缓其迅急）**\n\n```\n食物中毒（初症/胃中）→ 大黄甘草汤\n大黄（快）→ 甘草缓之 → 彻底清胃\n```\n\n**须「强「标」**：**「①食物中毒须洗胃/补液/就医；②不可自服大黄；③感染性腹泻禁止泻」** ✓✓\n\n**「甘草缓大黄之迅急」——「这是最精的配伍逻辑。」** ✓✓","o":"RJ-2551 · 《人纪·神农本草经》下经第二百七十味，讲解（PDF 第 514–515 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"胃里永远存两成食物","c":"讲义讲「一条极精的《灵枢》引文」：「**按照我们灵枢与素问……因为《灵枢》是一个解剖学，《灵枢》其中一篇就谈到胃的大小，按照度量，是百分之二十。****也就是说，按照《黄帝内经·灵枢》篇里面说，这个胃下面有百分之二十停着食物。****所以你新的食物下去以后，把旧的食物顶出来。****这个食物每一餐都在更新，百分之二十永远有食物在里面。****也就是因为有一点食物、永远有一点食物存在胃的下方，所以我们人可以容许一个礼拜不吃食物——这是《灵枢经》里面的。****那你喝水就可以了，不会死，因为这里有食物。**」\n\n**【极精】胃的 20% 常备食物（可一周不食）**\n\n```\n胃下 20% 常存食物（不断更新）\n  → 可一周不食（只须饮水）\n```\n\n**「这是最精的《灵枢》解剖引文。」** ✓✓","o":"RJ-2552 · 《人纪·神农本草经》下经第二百七十味，讲解（PDF 第 515 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"大黄的剂量与煮法","c":"讲义讲「一条极精的剂量算法」：「**使用的时候，剂量比如说我们开处方的时候，大黄两钱，那你的处方不是一次性吃两钱啊。****你如果是六碗水煮两碗的话，一碗不是才一钱？****大黄如果三钱，你再看他：老师这个三钱是神经病、吃了会下利——你再看他是不是九碗煮三碗，一碗还是一钱！****那为什么会有这种情形？你想想看嘛：三碗去煮一碗，然后药渣出来，再三碗煮一碗、再拿三碗煮一碗，不是九碗煮三碗？****一次煮完不是很快？而且不要拖泥带水，药又平均，目的在只此而已！**」\n\n**【极精】九碗煮三碗 → 一碗 = 一钱（不是一次吃三钱）**\n\n```\n开 3 钱 ≠ 一次吃 3 钱\n九碗煮三碗 → 每碗 1 钱\n```\n\n**「这是最精的剂量换算。」** ✓✓","o":"RJ-2553 · 《人纪·神农本草经》下经第二百七十味，讲解（PDF 第 516 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"重症大原则是肠胃通畅","c":"讲义讲「一条极重要的治则」：「**有的时候三钱都出不来，大便很严重啊，四钱、五钱、六钱、七钱用上去都没关系。****我们治疗胰脏癌的时候、肾脏病大便出不来的时候都六钱，胰脏癌大便才清出来，清出来黑泥一样。****当你药性很了解的时候，你知道他是实症，你摸摸他肚子……压压，哦、很痛，我们知道是内实。****还有呢，小便的颜色：你小便是什么颜色？深黄色，里面是热实在里。****重症、危急的重症，你永远记着一个大原则——想办法让他肠胃通畅，从喉咙到肛、直肠出去一路顺畅！****能够消化食物。****基本上能够掌握这个样子的话，他就不会死，再重也不会死。**」\n\n**【极重要】重症大原则 = 肠胃通畅（咽喉→直肠）**\n\n```\n重症 → 保证消化道通畅\n  + 天枢/关元压痛（内实）\n  + 小便深黄（热实）\n```\n\n**「这是全书最精的重症治则。」** ✓✓\n\n**须「强「标」**：**「①肠梗阻须禁泻药 + 急诊；②须影像确诊；③不可自行大剂大黄」** ✓✓","o":"RJ-2554 · 《人纪·神农本草经》下经第二百七十味，讲解（PDF 第 516–517 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"大黄走而不守","c":"讲义讲「一«条«极«精«的«对«比»」：「**【唐容川】说大黄气味都很厚，所以它是能够退火、荡实的力量非常的强。****大黄跟黄连刚好是反的：大黄是走、迅捷，它不会停留的；黄连呢反过来，黄连是守而不走。****所以，我们大黄呢是治火的药，它是攻；黄连也是治火的药，但是是解毒。**」\n\n**【极精】大黄走而不守、黄连守而不走**\n\n```\n大黄 → 走（攻下/荡实）\n黄连 → 守（解毒/清心）\n```\n\n**「这是最精的药性人格化。」** ✓✓","o":"RJ-2555 · 《人纪·神农本草经》下经第二百七十味，讲解（PDF 第 517 页）。"},{"t":"神农本草经·下经：半夏（续）、虎掌、大黄","h":"热极生寒与寒极生热","c":"讲义讲「一«条«最«精«的«圆«运«动»」：「**寒极也会生热，热极会生寒。****我们在遇到临症上面的时候，病人出现纯热症，我们用大寒的药下去——比如说石膏下去，病人越吃寒凉的药，是越吃越热，奇怪了，绝对是对症啊，我们用白虎，一剂下去，结果病人还是热。****《黄帝内经》里说：热极会生寒；它还没有到极，你可以让它到极——热上加热，你火上加油，加生附子下去，哇，一下吃下去，一贴药还没有吃完、只吃第一碗，吃完就开始冷了。****那反过来，寒的极，比如说尿毒、或者是癌症的后期的时候，小便也是清的，寒极，里面很冷，那你用生附子一剂一剂下去、生硫磺下去还是冷，热极还热不起来，怎么办呢？****寒极，不行，我们要用寒凉的药——寒极会生热；它还会到极寒，这个时候我们用黄芩、黄连、大黄、黄柏，寒凉的药下去，病人手脚热起来了。****这是中医到了很高的阶段。**」\n\n**【极重要】热极生寒 / 寒极生热（反着治）**\n\n```\n纯热 + 大寒药无效 → 加热药（生附）→ 冷\n纯寒 + 大热药无效 → 加寒药（芩连柏）→ 热\n```\n\n**「人是圆的，过头会回头」——「这是最精的圆运动临床。」** ✓✓\n\n**须「强「标」**：**「①极高风险（附子/大黄）；②须专业医师/住院；③绝对不可自行尝试」** ✓✓","o":"RJ-2556 · 《人纪·神农本草经》下经第二百七十味，讲解（PDF 第 517 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"葶苈子把云变成雨","c":"【本经原文】「**味辛，寒，无毒；治症瘕，积聚，结气，饮食寒热，破坚，逐邪，通利水道。**」【性味】「**味辛苦，性大寒，无毒。**」【主治】「**葶苈子为下气行水要药，功能降肺气，逐痰饮，止喘促，下膀胱水，治面目浮肿。**」【甄权】「**疗肺壅上气咳嗽，止喘促，除肺中痰饮。**」【容川】「**葶苈子多油，当能滑利，又有辛味……其味苦，与大黄之苦而滑润相似，故葶苈子隐含巴豆与大黄二者之性，故能大泻肺中之痰饮脓血，性极速降，是猛药类。**」【药征】「**主治水病也，旁治肺痈结胸也。**」【灵胎】「**泻肺气，利水道。**」【用量】「**普通八分至二、三钱。**」讲义：「**因为肺是肾脏的妈妈，所以肺是肾水的上源，肺法像天幕，好像天上的云一样。****那你这天上的云只在那面、只停在天上不下雨啊，是不是很闷热？****葶苈子就这样：把云下来变成雨！****葶苈子能下肺气，所以说它能够治喘、喘气，非常好用。**」\n\n**【极精】葶苈子 = 把云变成雨（肺为水之上源）**\n\n```\n肺（天幕/云）不下雨 → 喘/面肿\n葶苈子 → 云降为雨（下肺气）\n```\n\n**「这是全册最精的气象比喻。」** ✓✓","o":"RJ-2557 · 《人纪·神农本草经》下经第二百七十一味「葶苈」，原文及讲解（PDF 第 518–519 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"早晨面肿是肺水","c":"讲义讲「一«条«极«精«的«问«诊»」：「**由于水在上面，就会有面目浮肿这种现象，脸肿，都可以使用葶苈子。****很多妇人脸肿的原因呢，早上起来脸胖、厚厚的，下面有水一样——『老师我为什么早上起来脸肿肿的』，那就是葶苈子。****这是肺里面的水。****一般来说我们去水的时候，这个肺里面的水去掉以后，得教妇人——太太多运动。****她们有的很少运动、不太出汗嘛，所以水停在里面排不出去。**」\n\n**【极精】晨起面肿 = 肺水（葶苈子 + 运动）**\n\n```\n晨起面肿/眼睑浮肿 → 肺水 → 葶苈子\n+ 运动出汗（关键）\n```\n\n**须「标」**：**「①晨起面肿须查肾/甲状腺/心；②须限盐；③不可只靠利水」** ✓✓","o":"RJ-2558 · 《人纪·神农本草经》下经第二百七十一味，讲解（PDF 第 519 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"葶苈须配大枣","c":"讲义讲「一«条«极«重«要«的«配«伍»」：「**葶苈子用三钱、四钱都在使用，但是我们单用葶苈子是不会这么用的。****如果用了葶苈子的时候，我们会用大枣，为什么？****因为葶苈子它下水的力量很强，它会伤到胃气、胃的津液，所以我们要用红枣，比如大枣十枚、十个大枣，来保护他的胃。**」【禁忌】「**肿满由脾虚不能制水，小便不通，由膀胱虚无气以化者均忌，肺气虚者亦忌，宜大枣为辅。**」\n\n**【极重要】葶苈大枣泻肺汤 = 峻药 + 护胃**\n\n```\n葶苈子（峻下肺水 → 伤胃津）\n+ 大枣十枚（护胃气）\n```\n\n**「峻药必配护胃药」——「这是最精的组方原则。」** ✓✓\n\n**「肝癌腹水不用葶苈子（脾虚不能制水）」——「这是最精的禁忌。」** ✓✓","o":"RJ-2559 · 《人纪·神农本草经》下经第二百七十一味，讲解及禁忌（PDF 第 519–520 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"桔梗与白泡沫痰","c":"【本经原文】「**味辛，微温有小毒；治胸胁痛如刀刺，腹满，肠鸣幽幽，惊恐悸气。**」【性味】「**味苦辛，性微温，有小毒。**」【主治】「**桔梗为宣肺祛痰要药，功能治痰壅气逆，胸胁气痛，利咽喉，治肺痈。**」【大明】「**下一切气，止霍乱转筋，心腹胀痛，补五劳，养气除邪辟温，破症瘕肺痈，养血排脓，补内漏。**」【药征】「**主治浊唾肿脓也，旁治咽喉痛。**」【用量】「**普通八分至二钱。**」讲义：「**张仲景认为说吐白沫就是白泡沫。****所以我每次问病人：你咳嗽啊？你痰长什么样子？『我痰焦黄的』——那生半夏、天南星就解决了。****『我的痰不是这样子，我的痰是白色有泡泡的』——我听了心都凉一半了，我最怕这种痰，里面有问题。****有时候吐白泡沫吐在马路上，太阳一晒以后，痰变得很大一个泡、整个泡泡跑起来，说明有肺癌、肺脓疡的现象，这个时候我们就使用桔梗。**」\n\n**【最重要】白泡沫痰（日晒起泡）= 肺癌/肺脓疡 → 桔梗**\n\n```\n黄痰 → 半夏/南星（热痰）\n白泡沫痰（日晒成大泡）→ 桔梗（肺痈/肺癌）\n```\n\n**须「绝「对「强「标」**：**「①咳血/白泡沫痰须立即查CT/气管镜；②肺癌须规范治疗；③不可依痰判癌」** ✓✓\n\n**「这是全书最精的痰诊。」** ✓✓","o":"RJ-2560 · 《人纪·神农本草经》下经第二百七十二味「桔梗」，原文及讲解（PDF 第 520–521 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"桔梗甘草汤排脓排血","c":"讲义讲「一«条«极«重«要«的«经«方»」：「**这个桔梗呢很厉害，它除了排脓以外还排血。****比如说我们常常用桔梗甘草汤，桔梗在用的时候，病人在喝完、咳血出来，可以把里面的瘀血排出来。****这个血停在肺里面不行，很多血呢是因为咳嗽咳久了、支气管破裂后造成出血，这时候要把血排掉。****严重的肺病、里面化脓疡的时候，那肺的器官都坏、破裂掉，把这个坏的组织清除来，这个桔梗就这么强！**」\n\n**【极重要】桔梗甘草汤 = 排脓 + 排瘀血**\n\n```\n肺痈（脓/血）→ 桔梗甘草汤\n桔梗（排）+ 甘草（缓/解毒）\n```\n\n**须「强「标」**：**「①咳血须查结核/肿瘤/支扩；②大量咯血须急诊；③不可自服」** ✓✓","o":"RJ-2561 · 《人纪·神农本草经》下经第二百七十二味，讲解（PDF 第 521 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"以通为补","c":"讲义讲「一«条«极«重«要«的«治«则»」：「**所有的我们的补剂，除了纯虚症以外——比如说气虚、血虚，你一补就到了。****如果说你是有东西堵到的虚证，我们是『以通为补』！****比如说现在这个人明明是便秘、这个血虚、胃口没有、便秘，结果他人很虚弱啊，你猛给他吃，吃完还是很虚弱、一点用都没有。****你把他大便一清出来以后，他肚子饿、开始吃东西，真正消化到，那个才能补到他自己，这就叫『以通为补』。****那『以通为补』经方用得最多，经方大部分以通为补。****南方的温病嘛，都是补嘛，十全大补丸、四物汤开出来都是补。****补要看时机，不能乱补。**」\n\n**【极重要】以通为补（有堵则先通后补）**\n\n```\n纯虚 → 直补\n有堵的虚 → 先通（排便/排脓）→ 自能受补\n```\n\n**「这条与 n225以通为补」第三次出现，此处给出最完整论证。** ✓✓","o":"RJ-2562 · 《人纪·神农本草经》下经第二百七十二味，讲解（PDF 第 521 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"补内漏","c":"【大明】「**补内漏。**」讲义：「**什么叫内漏哦，就是内出血。****这个病人很好玩啊，病人会给你讲：哎幺奇怪，里面好像有水龙头开着，只是水一滴一滴在里面滴。****他问你：奇怪这是什么病，怎么有个水在里面滴滴滴？****就是内漏！****里面有脓疡，我们在使用的时候，桔梗。**」\n\n**【极精】内漏 = 「里面有水龙头一滴滴滴」（内出血）**\n\n```\n自觉「体内水龙头滴水声/滴落感」\n  → 内漏（内出血/脓疡）\n  → 桔梗\n```\n\n**「这是最精的患者主诉。」** ✓✓\n\n**须「强「标」**：**「①内出血须查凝血/影像；②须急诊；③不可延误」** ✓✓","o":"RJ-2563 · 《人纪·神农本草经》下经第二百七十二味，讲解（PDF 第 521–522 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"桔梗重症用一两","c":"讲义讲「一«条«极«精«的«剂«量»」：「**一般来说处方的时候，桔梗用一钱、两钱。****我处方的时候，我遇到重症，这种重症我不会用一钱、两钱的啊。****我一下子一两，还一钱、两钱？一钱、两钱对我来说是刷牙漱口了。****一两，凶不凶？一两！****当你肯定药物对症的时候，下手要重，因为病不会等，下手要重，大家不要怕。****桔梗不会——上面是『小毒』，大毒我们都会用，小毒算什么？根本不会死人！**」\n\n**【极精】重症剂量：桔梗一两（轻症 1–2 钱）**\n\n**「病不会等，下手要重」——「这是最精的剂量观。」** ✓✓\n\n**「这条与 n222白芍 1 两才收静脉瘤」同一体系。** ✓✓","o":"RJ-2564 · 《人纪·神农本草经》下经第二百七十二味，讲解（PDF 第 521–522 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"青蒿去肝胆虚热","c":"【本经原文】「**一名青蒿；味苦，寒，无毒；治疥瘙痂痒，恶疮，杀虱，留热在骨节间，明目。**」【性味】「**味苦，性寒，无毒。**」【主治】「**青蒿为清虚热要药，主治虚痨骨蒸，烦热盗汗，疟痢虚热，血中伏热，明目。**」【大明】「**补中益气，补劳；长毛发令黑不老。**」【容川】「**青蒿色青味苦，正治肝胆之相火；其节中必生红虫，乃感风化而生之虫，故青蒿为去风清热之要药。****青蒿节以虫杀虫，消瘀去蒸，借虫以攻血，借风气以散郁火也。**」【用量】「**普通一钱至二钱。**」【禁忌】「**产后气虚，内寒作泻，及饮食停滞、泄泻者均忌。**」讲义：「**如果说这个肝胆的火是实热、实又热，可能是胆结石啊或者肝炎，所以实热。****没有实症还有热，就是虚热。****虚就是没有，但是在里面发热。**」【附注】「**吴茱萸补肝虚；栀子去肝黄；青蒿去肝虚热。**」\n\n**【极精】青蒿 = 肝胆虚热（骨蒸/盗汗）**\n\n```\n肝实热（胆结石/肝炎）→ 黄芩/栀子\n肝虚热（骨蒸/盗汗）→ 青蒿\n```\n\n**「这是最精的三药分工（附注）。」** ✓✓","o":"RJ-2565 · 《人纪·神农本草经》下经第二百七十四味「草蒿」，原文及讲解（PDF 第 522–523 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"旋覆花配代赭石制胃酸","c":"【本经原文】「**一名筋根花，一名金沸；味甘，温，无毒；主益气，去面黑，色媚好；其根，味辛，治腹中寒热邪气，利小便。**」【性味】「**味咸，性温，无毒（或作有小毒）。**」【主治】「**旋覆花为下气祛痰健胃行水要药，主治肺胃气虚，痰水胶结，上气喘急。**」【别录】「**消胸上痰结，唾如胶漆。**」【甄权】「**主水肿，逐大腹，开胃，止呕逆不下食。**」【灵胎】「**降气消痰。**」【用量】「**普通一钱至二、三钱。**」【禁忌】「**病人涉虚者，忌多服；虚寒人禁用。**」讲义：「**主要的功能呢，它能够下气——胃气上升能够冲上、打嗝嗝气上来，下气祛痰，能够健胃行水。****还有我们可以制它的酸、控制制酸，所以我在国外用得很多。****来的病人胃酸很多，旋覆花代赭石汤一剂下去，就中了，无一不好。****那这个是使用的热症，热症的肠胃。**」【附注】「**旋覆花常与代赭石并用；制胃酸仅使用在热症；旋覆花、半夏汤止打嗝。**」\n\n**【极重要】旋覆花 + 代赭石 = 制胃酸（仅热证）**\n\n```\n胃酸（热证：舌黄/口苦）→ 旋覆花代赭石汤\n寒证（舌白/不渴）→ 吴茱萸/干姜\n```\n\n**「金沸草 = 旋覆花（别名）」——「这是最精的别名。」** ✓✓","o":"RJ-2566 · 《人纪·神农本草经》下经第二百七十五味「旋覆花」，原文及讲解（PDF 第 523–524 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"藜芦是催吐药","c":"【本经原文】「**一名葱苒；味辛，寒，有毒；治蛊毒，咳逆，泄利，肠澼，头疡，疥瘙，恶疮，杀诸虫毒，去死肌。**」【性味】「**味辛苦，性寒，有毒。**」【主治】「**藜芦为催吐要药，主风痰上塞，用吐一切恶物，通顶发嚏（嗅之），治风痫，外用治疮疥杀虫。**」【别录】「**疗哕逆喉痹不通，鼻中息肉；不入汤用。**」【用量】「**普通一至二分。**」【禁忌】「**多服引吐，损人元气；畏葱白，服之吐即止；有辛烈气味，入鼻发嚏不止，饮冷水即止；反细辛芍药、人参沙参、苦参丹参，恶大黄。**」讲义：「**这藜芦长得很像葱，现在药房也不好买到。****它是催吐的主要的药，用吐一切恶物——所有的食物坏死的东西、吃到不干净的东西，统统可以吐掉。****通顶，你闻这个藜芦，一闻的时候就会打喷嚏，就好像吃到那个芥末一样。**」\n\n**【极精】藜芦 = 催吐（闻之打喷嚏）**\n\n```\n误食毒物 → 藜芦催吐\n畏葱白（吐即止）\n```\n\n**须「绝「对「强「标」**：**「①误食毒物须急诊，不可催吐（腐蚀性/昏迷禁）；②藜芦有毒；③不可自用」** ✓✓","o":"RJ-2567 · 《人纪·神农本草经》下经第二百七十六味「藜芦」，原文及讲解（PDF 第 525–526 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"射干治热咳","c":"【本经原文】「**一名乌扇，一名乌蒲；味苦，平，有毒；治咳逆上气，喉痹，咽痛，不得消息，散结气，腹中邪逆，食饮大热。**」【性味】「**味苦，性平，有毒。**」【主治】「**射干清火解毒散血消痰要药，主咽喉肿痛，咳逆上气，降实火，利大肠，治积痰瘀血，热气结毒。**」【别录】「**疗老血在心脾间，咳唾言语气臭，散胸中热气。**」【大明】「**消痰破症结，胸膈满腹胀，气喘，痃癖。**」【容川】「**射干微苦，利喉中之痰。**」【用量】「**普通钱半至三钱。**」【禁忌】「**性不益阴，凡脾胃弱，脏寒，气血虚，病无实热，均忌。**」讲义：「**这个是经方里面在使用的，治疗咳嗽上面张仲景在用它。****所有的积痰瘀血、热气热咳的时候，我们都会使用这个射干。****那经方里面有『射干麻黄汤』，就是这个射干。****那喉咙肿痛，半夏、射干都可以使用的。****降实火，肺里面的实火。**」\n\n**【极重要】射干 = 热咳（射干麻黄汤）**\n\n```\n热咳（痰稠/喉痛/气逆）→ 射干麻黄汤\n肺实火 → 射干\n```\n\n**「百日咳、肺结核都可用射干」——「这是最精的适应症。」** ✓✓","o":"RJ-2568 · 《人纪·神农本草经》下经第二百七十八味「射干」，原文及讲解（PDF 第 526–527 页）。"},{"t":"神农本草经·下经：葶苈、桔梗、草蒿、旋覆花、射干","h":"旋覆花根续筋不如续断","c":"【主治附注】「**根能续筋断［续断更好。］**」讲义：「**你说旋覆花的根能够续筋，我直接写续断，不是更好吗？旁治，续筋断。**」\n\n**【极精】旋覆花根续筋断 → 不如直接用续断**\n\n```\n旋覆花根（续筋断，旁治）\n  → 专用则用续断（更优）\n```\n\n**「这是最精的取舍（专药胜于旁治）。」** ✓✓","o":"RJ-2569 · 《人纪·神农本草经》下经第二百七十五味，原文附注及讲解（PDF 第 523–524 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"蜀漆治疟含喹啉百倍","c":"【本经原文】「**味辛，平，有毒；治疟，及咳逆，寒热，腹中症坚，痞结，积聚，邪气，蛊毒，鬼疰；又名常山。**」【产地】「**为落叶小灌木，根名为常山，苗即为蜀漆。**」【性味】「**味苦辛，性寒，有毒。**」【主治】「**蜀漆为驱痰截疟要药，主祛老痰积饮，治新久诸疟，能引痰上行使吐，下行使下，逐水消肿，杀虫，疗蛊（春夏用蜀漆，秋冬用常山）。**」【容川】「**为治疟要药，痰疟是积湿而成的，常山苗能透达以吐之。**」【药征】「**主治胸腹及脐下动剧者，故兼治惊狂火逆疟疾。**」【用量】「**普通八分至三钱。**」【禁忌】「**凡真气虚者忌；得甘草吐疟痰，酒炒用良。**」讲义：「**这个里面的喹啉，比那个喹啉的量、治疟的效果强一百倍以上。****抗日战争的时候用得很多，常山苗治疗疟疾。****在食物经验的时候，那时候疟疾老外用喹啉，结果他们发现：奇怪，中国人用常山呢？所以就研究常山。****一研究发现：哇，它里面含的喹啉的成分是他们使用的一百倍啊。****所以中医早就知道了，还在《神农本草经》里面，还不是明朝的《本草纲目》。**」\n\n**【极重要】常山/蜀漆 = 治疟要药（含喹啉类）**\n\n```\n疟疾 → 常山（根）/蜀漆（苗）\n（春夏用蜀漆、秋冬用常山）\n```\n\n**须「强「标」**：**「①疟疾须青蒿素/ACT（WHO 首选）；②常山有催吐副作用；③不可自服」** ✓✓","o":"RJ-2570 · 《人纪·神农本草经》下经第二百八十一味「蜀漆」，原文及讲解（PDF 第 527–528 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"甘遂是排水峻剂","c":"【本经原文】「**一名主田；味苦，寒，有毒；治大腹疝瘕，腹满，面目浮肿，留饮，宿食，破症坚积聚，利水谷道。**」【性味】「**味苦甘，性寒，有毒。**」【主治】「**甘遂为行水要药、排水峻剂，主治身体浮肿，腹胀，囊肿，攻决痰水，利大小便。**」【别录】「**下五水，散膀胱留热。**」【甄权】「**能泻十二种水疾，去痰水。**」【药征】「**主利水也，旁治掣痛，咳烦，短气，小便难，心下满。**」【用量】「**普通八分至二钱。**」【禁忌】「**元气虚人，除伤寒水结胸不得不用外，其余水肿蛊胀谨慎用之；恶远志，反甘草。**」讲义：「**这个甘遂非常的凶悍。****甘遂是峻剂，排水的峻剂，非常的彪悍。****开的时候你不要开两剂，开一剂。****经验好的、甘遂开三钱，看多了、甘遂三钱都没关系，就好像炮附子一样。****手比较软的、铅笔不够利的两钱，单剂啊、单剂。****但是我们会用到甘遂的话就是一剂，病人你给他一副，结束了，吃完明天再来。****不给他第二剂的，好了就不要吃了。****因为它非常的凶悍、非常的快，吃下去半个小时就晓得了。**」\n\n**【最重要】甘遂 = 排水峻剂（半小时见效，只开一剂）**\n\n```\n甘遂 2–3 钱（生药）→ 单剂\n半小时 → 上吐下泻/小便 → 排干\n```\n\n**须「绝「对「强「标」**：**「①甘遂有毒，可致脱水/电解质紊乱；②须住院/专业医师；③绝对不可自服；④体虚/孕妇/心衰禁」** ✓✓","o":"RJ-2571 · 《人纪·神农本草经》下经第二百八十二味「甘遂」，原文及讲解（PDF 第 529–530 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"实水的判据是按之不起","c":"讲义讲「一«条«极«重«要«的«鉴«别»」：「**这两味药使用的时候一定要看到脚肿、脚肿大，肿得非常大，好像整个膨起来像大气球一样，才可以使用、才是使用的时机，代表是实水。****实水——如果是脚肿，你压下去又弹起来，这不是实水，不可以使用。****峻剂的时候，强烈的药物一定要确诊、确认才能够用。****你按下去、凹下去，弹不起来，对症，这时候不要怕，你再不救他就来不及了。**」\n\n**【极重要】实水 = 按之凹陷不起（弹不起来）**\n\n```\n按之凹陷不起 → 实水 → 甘遂/牵牛可用\n按之即起 → 非实水 → 不可用\n```\n\n**「这是最精的虚实水鉴别（pitting edema 四级）。」** ✓✓","o":"RJ-2572 · 《人纪·神农本草经》下经第二百八十二味，讲解（PDF 第 530 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"腹水忌盐只有一次机会","c":"讲义讲「一«条«最«重«要«的«禁«忌»」：「**肿消掉以后，你如果给他吃盐巴，肿又会回来了，因为盐巴是负担。****所以这一段时间禁忌一定要记得：忌盐，一点都不能吃。****你如果说使用了这个药、没有去忌盐，再回头、水再回来的时候，你再用甘遂、用牵牛，排不出来了。****只有一次机会，所以请大家务必要记住。**」\n\n**【最重要】腹水排后忌盐（只有一次机会）**\n\n```\n腹水 → 甘遂/牵牛排出 → 忌盐（一点都不能）\n若复肿 → 再用甘遂无效（「只有一次机会」）\n```\n\n**「这是全书最重的禁忌警告。」** ✓✓\n\n**须「强「标」**：**「①肾病/腹水须限钠（非绝对禁）；②须营养师；③低钠血症须补」** ✓✓","o":"RJ-2573 · 《人纪·神农本草经》下经第二百八十二味，讲解（PDF 第 530 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"十枣汤三味配红枣","c":"讲义讲「一«条«极«重«要«的«经«方»」：「**张仲景呢是三味，我刚刚讲是两味。****张仲景用三味：甘遂、芫花、大戟，他就不再排腹水，在排胸腔里面、肺里面的积水。****还有甘遂有子宫里面的积水——甘遂、大黄，大黄甘遂汤。****甘遂半夏汤，胸腔里面的积水。****十枣汤里面、肺里面的积水。****如果是用粉的时候，一包一次是一钱，一钱里面有三分之一是甘遂粉，另外三分之一芫花、三分之一大戟，各占三分之一。****这个是粉剂，配合红枣来吞。****红枣，吐泻太厉害的话，肠胃的津液会伤到、会干掉，干掉后你的胃壁连在一起、没有津液，胃很难过啊，所以我们用红枣下去，把胃的津液保护住。**」\n\n**【极重要】十枣汤 = 甘遂 + 芫花 + 大戟（各 1/3）+ 红枣 10 枚**\n\n```\n十枣汤（粉剂 1 钱：甘遂1/3+芫花1/3+大戟1/3）\n+ 红枣十枚（护胃津液）\n```\n\n**须「绝「对「强「标」**：**「①峻剂，可致脱水/低钾/肾衰；②须住院；③绝对不可自制/自服」** ✓✓","o":"RJ-2574 · 《人纪·神农本草经》下经第二百八十二味，讲解（PDF 第 530–531 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"甘遂按部位配伍","c":"讲义讲「一«条«极«精«的«定«位»」：「**甘遂可以去上焦、喉咙、肺里面的，可以去子宫里面的积水，肋间的积水也是用甘遂，看你的搭配。****像这两个（甘遂、牵牛）搭配在一起治腹水、肚子积水、下半身水肿都可以使用。****所以中药的排水药，排掉以后跟西医的抽肺里面的积水不一样：西医抽完以后水还会回来；中药把水排掉了，水不会回来。****一般来说西医没有动过，都可以利得出来；西医动过的不容易利出来。**」\n\n**【极精】甘遂按部位配伍（上焦/子宫/肋间/腹水）**\n\n| 部位 | 配伍 |\n|---|---|\n| 胸肺 | 甘遂半夏汤/十枣汤 |\n| 子宫 | 大黄甘遂汤 |\n| 腹水/下肢 | 甘遂 + 牵牛 |\n| 肋间 | 甘遂 |\n\n**「中药排水不返、西医抽水会返」——「这是最精的对比。」** ✓✓","o":"RJ-2575 · 《人纪·神农本草经》下经第二百八十二味，讲解（PDF 第 531–532 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"甘遂生用不炮制","c":"讲义讲「一«条«极«精«的«炮«制»」：「**甘遂是生用，不要炮制。****诸位记得：你一炮制，力量就没了，就不叫甘遂了。****生用力量最强。**」\n\n**【极精】甘遂生用（炮制则失效）**\n\n```\n甘遂 → 生用（峻）\n炮制 → 力量消失\n```\n\n**「这是最精的炮制例外。」** ✓✓","o":"RJ-2576 · 《人纪·神农本草经》下经第二百八十二味，讲解（PDF 第 532 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"十枣汤配比错误案例","c":"讲义讲「一«个«极«精«的«医«疗«事«故»」：「**我开十枣汤，我的药方是固定的。****结果我药房的师傅换人，换人时的交接没有交接的很好：十枣汤他把红枣配在比例里面，是不是剂量就不够了？****病人吃完，我只开一剂给他，吃完之后第二天他来看我，我问：有没有吐啊？有没有泻？没有啊。****嗯？不对啊，我再开一剂，吃完再来一看，还是没有吐泻。****我到药房去，进去我就问师傅你怎么配的？他就给我讲他把红枣配到比例里面。****居然：甘遂、芫花、大戟都是 1，红枣是 10 颗嘛，他把它配成 10，当然没有用。****我亲自配给他，就是生药粉一包，再拿 10 颗红枣回去煮，第二天吃完以后他打电话来说好了、不用来了，一剂就够了。**」\n\n**【极精】十枣汤配比错误 = 峻药被稀释（无效）**\n\n```\n正确：甘遂1 + 芫花1 + 大戟1 ｜ 红枣 10 枚另煮\n错误：把红枣算进比例（10）→ 峻药仅 1/13 → 无效\n```\n\n**「这是最精的医疗安全案例（交接流程）。」** ✓✓\n\n**须「强「标」**：**「①配伍比例关系疗效/安全；②须双人核对；③峻剂须药师把关」** ✓✓","o":"RJ-2577 · 《人纪·神农本草经》下经第二百八十二味，讲解（PDF 第 530–531 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"白及治肺内伤","c":"【本经原文】「**一名甘根，一名连及草；味苦，平，无毒；治痈肿，恶疮，败疽，伤阴，死肌，胃中邪气，贼风，鬼击，痱缓不收。**」【性味】「**味苦辛，性寒，无毒。**」【主治】「**白及为止血疗疮要药，功能逐瘀生新，补肺损，止吐血（用于肺内伤，如拳击打伤）。**」【甄权】「**除白癣疥虫，结热不消。**」【东垣】「**止肺血。**」【灵胎】「**敛疮涩血。**」【用量】「**普通一钱至三钱。**」【禁忌】「**凡痈疽已溃，不宜同苦寒药服；畏李核杏仁，反乌头。**」讲义：「**临床上使用的时候是：肺吐血、肺有内伤，用在肺上面——内伤、病人吐血、打击、撞伤，比如说拳击、打伤，我们使用白及，这个是伤科使用。****因为它苦嘛，苦能泻、辛能散。**」\n\n**【极重要】白及 = 肺内伤止血（拳击/撞伤/车祸）**\n\n```\n肺内伤/咯血（外伤性）→ 白及\n3 钱（重症 5 钱；体重 300 磅→8 钱）\n```\n\n**须「强「标」**：**「①咯血须查CT/凝血；②须急诊；③白及不替代止血药」** ✓✓","o":"RJ-2578 · 《人纪·神农本草经》下经第二百八十六味「白及」，原文及讲解（PDF 第 534–535 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"止血须配化瘀","c":"讲义讲「一«条«最«重«要«的«复«方«理«由»」：「**中医呢，止血的时候、我们中药的处方是这样子：你不能说看到他单味的——有时可以单味的使用，有的时候不能单味。****比如说这是止血、那个肺有损伤、肺损、咳血、打伤了嘛。****那你想止血的时候，哪有这么凑巧啊：这个血管这里破掉了，你一用白及下去把它止血掉，就结束了？****没有啊！****他在你吃白及之前就已经有很多瘀血在这边了、组织碎片在里面，对不对？****你要把它清掉，你不能光止血，你将来会知道，所以中医中药才有复方的现象。****那要加什么药？比如说丹皮，丹皮是活血化瘀的啊；那肺里面它燥渴、津液不够了，我们可以给加点麦冬，补他的津液；川芎是活血、让他的血管、血液循环非常好，化瘀、去瘀血。****那处方就出来了。**」\n\n**【极重要】止血必配化瘀（否则瘀血留滞）**\n\n```\n白及（止血）+ 丹皮（活血化瘀）+ 麦冬（补津）+ 川芎（行血）\n```\n\n**「这是全书最精的复方理由。」** ✓✓\n\n**「这条与 n147血不止法」须否定相对照——此处是正确的『止血+化瘀』。** ✓✓","o":"RJ-2579 · 《人纪·神农本草经》下经第二百八十六味，讲解（PDF 第 535 页）。"},{"t":"神农本草经·下经：蜀漆、甘遂、白及、大戟","h":"肺病三点到五点醒","c":"讲义讲「一«条«极«精«的«疗«效«判«据»」：「**那你说：老师，他吃了
