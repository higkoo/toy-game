<script>const D=[{"t":"一、学术源流与立场","h":"\"三坟\"之说与本书的自我定位","c":"要点——倪海厦自序开篇即立定高度：\"我国自古相传有**三坟**，最是深奥难懂，历代以来所有名家都认为**能解此三坟者就是最懂中华文化的人**——这三坟就是**《易经》《黄帝内经》与《神农本草经》**。\"他说明本书的编法：\"我**收集历代各名家对本草所做之论述，再加上我个人从临床经验中所获得的知识**，虽完成这部《神农本草经》的解说，但是必然有不足之处。\"**本书的功能定位**（极关键）：\"本书虽未完善，但是**已经包含所有将来研究伤寒与金匮所需的药性知识在内**，因此如能熟读本书，**将来研究经方时必然事半功倍**，替研习经方者省去许多不必要的查询药物时间；将来**一看到处方时，就可以心知肚明处方原因、剂量使用、用药原则**等等。\"落款：\"汉唐中医倪海厦谨记，**6/18/2006 于佛州深夜丑时自家书房**\"。这一自序把《神农本草经》置于\"三坟\"之列，并非单纯的推崇，而是明确了它的学科地位——**本草是经典医学的基础层，与《易经》（理）、《内经》（法）并列**。","o":"RJ-1736 · 《神农本草经》自序（PDF 第12~13页）"},{"t":"一、学术源流与立场","h":"张仲景是经方的\"发扬者\"，而非创立者","c":"要点——这是倪海厦一个考据性的判断，直接影响学习路径。\"关于《神农本草经》，你们可以看前言，**它不是一个人的著作，而是一段时间的著作**，我们姑且把它设定在**黄帝那个时段**——那一段时间的著作。\"**关于经方的来源**：\"张仲景呢，他看**《胎胪药录》**……张仲景的经方，我们学的经方，《伤寒》《金匮》，实际上根据我们的考证——**真的我们去找医学的考证的时候、历史的考证的时候，张仲景只是经方的一个发扬者，他并不是一个经方创立者**。**经方在汉朝时代是存在的**，很早以前从这边**西域就进来了**，经方最早可能是来自西域，因为**很多药物是来自西域**，然后张仲景是个发扬者。\"**他给出的旁证**：\"所以他四十岁以后，伤寒一来，他一个张氏家族**死掉三分之二**的人，所以他把**南阳太守辞了不干**，那么几年之间就起来——为什么会起来？**是因为方子已经固定在那边**，所以他当时看这个方子，写下来这些东西。\"这一判断的学术意义在于：若经方本有固定方证体系，则学习重点应是**还原与掌握这套既定体系**，而不是\"从张仲景个人的创见去理解\"。这也解释了他为何坚持先学本草、再读方书——**方证背后是药性标准**。","o":"RJ-1737 · 第一章 前言（PDF 第13页）"},{"t":"一、学术源流与立场","h":"\"先立药性标准，再读经方\"的教学次序","c":"要点——倪海厦解释为何愿意讲《神农本草经》——\"过去一直没有医家愿意去讲《神农本草经》，为什么我这次愿意来讲？就是因为**如果药性我们没有设定一个标准、我们没有给诸位一个标准，以后《金匮》《伤寒》的处方剂量你不会用，药性你不会用**。\"他的做法是：\"我是尽我们最大的能力，**在临床上面看到、然后怎么样子、食物上的经验，然后把它设定个标准出来**。\"**次序安排**：\"变成说，我现在讲这个《神农本草经》，**在讲伤寒、讲金匮之前先讲《神农本草经》**，让你对本草很了解了，**等到你去看经方，一看就知道它做什么，那你不会迷失在里面**。\"这一教学设计的核心是**\"标准先行\"**：中药的剂量与药性在历代文献中说法不一，若无一个统一基准，读方书时便无法判断\"为何用此量\"。他承认这个标准是\"从临床与食物经验\"设定的，即**经验性标准**而非文献考据标准——这一点应当明确，因其标准与《药典》法定剂量未必一致。","o":"RJ-1738 · 第一章 前言（PDF 第13页）"},{"t":"一、学术源流与立场","h":"为何不取《本草纲目》：取舍的边界","c":"要点——倪海厦对取材范围有明确取舍：\"那本草的药性呢，因为我们因为**《胎胪药录》已经没了**，我们找《神农本草经》，**《神农本草经》里有些药物很偏，那我们把它删掉**。\"**对《本草纲目》的评价**：\"那我们为什么不去介绍这个《本草纲目》？**《本草纲目》1880 种药**，李时珍很过分，他把什么**寡妇床头的尘**——灰尘啊，她是寡妇，你去拿她床头的灰尘，**三年、积了三年没擦掉的灰尘**，那个才有用；那个**洗米的水要洗三次**、洗碗水要洗三次，那个水拿来入药，这个不是很好；**天灵盖**，你叫我，我死也不要吃天灵盖。\"这一取舍的标准可归纳为两条：**①删\"偏药\"**——即药性峻猛偏激、现代临床罕用者；**②拒\"怪药\"**——即取自人体遗骸（天灵盖）、污秽之物（寡妇床头尘、洗米水）等，因其不合卫生、也难以验证。这一立场与近代本草学的转向一致：**从\"博收\"转向\"精选可用\"**，以 301 味（本经原数）替代 1880 种，使学习者能在有限精力内掌握经方所需的核心药。","o":"RJ-1739 · 第一章 前言（PDF 第14页）"},{"t":"二、全书结构","h":"三品分类与 301 味的层级","c":"定义——《神农本草经》按**三品**分类，全书目录清晰呈现：**上经**（第 1~142 味，如牡桂、菌桂、松脂、槐实、枸杞、柏实、茯苓、榆皮、酸枣，以及龙骨、麝香、牛黄、阿胶、牡蛎、龟甲、大枣、胡麻等）；**中经**（第 143~254 味，起于雄黄、石硫黄、雌黄、水银、石膏、慈石，含干姜、葛根、苦参、当归、麻黄、芍药、玄参、百合、知母、黄芩、吴茱萸、栀子、枳实、厚朴、山茱萸、猪苓、鹿茸、羚羊角、犀角、鳖甲等）；**下经**（第 255~301 味，起于石灰、礜石、铅丹，含**附子、乌头、天雄、半夏、大黄、葶苈、桔梗、旋覆花、藜芦、射干、白头翁、夏枯草、芫花、巴豆、蜀椒、皂荚**等）。**三品的传统分工**（据《本经》原序）：上品\"养命以应天，无毒，多服久服不伤人\"；中品\"养性以应人，有毒无毒，斟酌其宜\"；下品\"治病以应地，多毒，不可久服\"。这一分级的实用意义在于：**上品多为可长期服食的补养药，下品多为峻猛攻邪药，须中病即止**。对照可见——附子、大黄、半夏、巴豆等经方核心药全在下经，说明**经方的力量正来自这批\"有毒\"之品**，其使用必须严格依赖剂量与炮制的控制。","o":"RJ-1740 · 目录·上经／中经／下经（PDF 第4~10页）"},{"t":"二、全书结构","h":"增补部分：本经未载的二十八味","c":"要点——书末设\"第三章 增补《神农本草经》不足部分\"，收录本经未载而经方必用的药，共二十八味：**青盐**（\"即戎盐，补肾，泻血热\"）、**诃黎勒（诃子）**、**红花**、**蜘蛛**、**赤小豆**、**艾叶**、**紫苏**、**饴糖**（\"补中益气\"）、**柏叶（侧柏叶）**、**豆豉**（又名香豉）、**鸡矢白**（鸡矢白散）、**蒴翟细叶**（\"现无资料可查，出于王不留行散中\"）、**没药**、**乳香**、**白芷**、**粳米**、**甘李根白皮**、**三七**、**鸡子黄**、**猪胆、猪肤**、**郁金（玉金）**、**木通**、**新绛**（\"主止血行血\"）、**薤白**、**白前**、**神曲**、**小麦**（\"养心除烦，利溲止血\"）、**灶心土**。这一增补名单本身极有诊断价值：它恰好标出了**《伤寒》《金匮》方中频繁出现、而《本经》未收的药**——如**饴糖**（小建中汤）、**豆豉**（栀子豉汤）、**鸡子黄**（黄连阿胶汤）、**猪肤**（猪肤汤）、**新绛**（旋覆花汤）、**灶心土**（黄土汤）、**薤白**（栝蒌薤白白酒汤）、**艾叶**（胶艾汤）、**粳米**（白虎汤）。换言之，**这份增补表就是\"读方书时会撞到的缺药清单\"**，其编排意图正是倪海厦在自序中所说的\"以备将来研习经方时，能有药性之根据\"。","o":"RJ-1741 · 第三章 增补部分（PDF 第10~11页）"},{"t":"二、全书结构","h":"附编：药性基础的五篇摘录","c":"要点——书末附\"**中医药基础摘录**\"，含五篇：**①\"药性基础：四气五味、升降浮沉、补泻归经\"**；**②\"浅说四气五味理论与临床应用\"**；**③\"浅论中药药性之气味厚薄和刚柔燥湿\"**；**④\"十二张图搞清五行，五行相生相克相乘相侮\"**；**⑤\"《本草备要》药性总义\"**。这五篇的编排逻辑是\"**从总纲到应用、从理论到图解**\"：四气五味与升降浮沉是**药性总纲**（寒热温凉四气、酸苦甘辛咸五味、升降浮沉四种趋向、补虚泻实两类作用、归经定位）；气味厚薄刚柔是对同一药性的**更精细分层**（如气味俱厚者沉降、气味俱薄者升浮）；五行相生相克图则是**归经与配伍的理论底座**；最后以《本草备要》\"药性总义\"作结，因其为清代本草学的纲领性文字。这一附编的价值在于：它把散见于各味药下的具体药性，回收为**一套可迁移的判读框架**——读者若只记单味药，遇未载之药便无从判断；若掌握四气五味与升降浮沉，则可对任何一味新药作初步定性。","o":"RJ-1742 · 附 中医药基础摘录（PDF 第11页）"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"五味之义","c":"原文「**凡药酸属木入肝，苦属火入心，甘属土入脾，辛属金入肺，咸属水入肾。**」讲义：「**过去我们说酸味的入肝、苦味的入心、甘味的入脾、辛辣的入肺、咸味的入肾；过去讲《黄帝内经》时就这样子讲完了。****在讲本草经的时候就不是这样讲的。**」\n\n**【极重要】五味之义**\n\n| 味 | 行 | 脏 |\n|---|---|---|\n| **酸** | **木** | **肝** |\n| **苦** | **火** | **心** |\n| **甘** | **土** | **脾** |\n| **辛** | **金** | **肺** |\n| **咸** | **水** | **肾** |\n\n**「酸入肝、苦入心、甘入脾、辛入肺、咸入肾」——「这是全书的第一原理。」**要点：**这一条极重要，它与 n78「五味五能」、n59「九维五行表」完全一致** ✓✓","o":"RJ-1743 · 《人纪·神农本草经》第二章药性总义，第一节「五味之义」，原文及讲解（PDF 第 29 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"不要记名称，只记味道","c":"讲义讲「一个极重要的方法论」：「**你到菜场上面、到水果摊上面，任何地方去，你抓起来一吃酸味的、全部入肝。****中医说医者，易也；我们现在我不用味道来定义——我跟你说柠檬是入肝的、苦瓜入心脏的、这个甜的哈密瓜入脾脏的、大蒜呢入肺脏的、盐巴入肾脏的，你知道了。****你等下跑到阿拉伯去、结果吃到了酸味的不是柠檬，你不知道该怎么做了。****所以老祖宗很聪明，不要去记名称。**」\n\n**【极重要】记性不记名**\n\n```\n柠檬入肝 = 因为酸\n苦瓜入心 = 因为苦\n哈密瓜入脾 = 因为甜\n大蒜入肺 = 因为辛\n盐巴入肾 = 因为咸\n```\n\n**「不要记名称，只记味道」——「这是极精的方法论，可迁移到任何地方。」**要点：**这一条极重要，它是「以属性而非以标签」**。**可采信的现代版**：**「①分类学（按性质而非名字）；②跨文化适用；③『医者易也』＝『以简驭繁』」****。","o":"RJ-1744 · 《人纪·神农本草经》第二章，第一节，讲解（PDF 第 29 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"人工合成的酸不适用","c":"讲义讲「一个必要的限定」：「**你吃到所有酸味的通通入肝；但是我们记得我们现在讲得是几千年这样子酸味的、现在的人工酸你不能算进去。****人工的醋、人工的酸，那种合成的不能算进去。****那是我们现代的东西，以前的没有。**」\n\n**【须标】人工合成的酸不适用**\n\n| 来源 | 适用 |\n|---|---|\n| **天然酸（醋/果） | **是** |\n| **人工合成酸 | **否** |\n\n**「人工的酸不能算进去」——「这是极必要的边界。」**要点：**须「强「标」**：**「『人工酸不适用』是正确的边界（因为性味来自植物代谢产物，而非单纯的H+）；但『现代食品添加剂都不能吃』是过度推论」** ✓✓","o":"RJ-1745 · 《人纪·神农本草经》第二章，第一节，讲解（PDF 第 29 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"食物坏死的酸是腐酸","c":"讲义讲「一个极精的区分」：「**那如果酸，食物坏死的酸、那是腐酸；腐坏的酸，任何东西腐坏了都不能用了。**」\n\n**【极精】腐酸不能用**\n\n| 酸的来源 | 判 |\n|---|---|\n| **正常发酵/果酸** | **可用** |\n| **腐坏发生的酸** | **不能用** |\n\n**「坏死的酸是腐酸，腐坏的都不能用」——「这是最精的食品卫生线。」**要点：**这一条极精，它与现代「腐败产生组胺/霉菌毒素」一致** ✓✓","o":"RJ-1746 · 《人纪·神农本草经》第二章，第一节，讲解（PDF 第 29–30 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"浮在水上无毒，沉下去有毒","c":"讲义讲「一个极简的判毒法」：「**你到菜场去买所有的蔬果，那你把它们丢到水上面去——浮在水上面的通通没有毒，沉下去的通通有毒。****因为很简单，一个水，在人身上占了 75% 的水；那细胞里面有很多水、吃东西还会沉淀还去还得了？那细胞里面的水沉下去了肯定是毒嘛。**」\n\n**【极精】浮 = 无毒；沉 = 有毒**\n\n```\n浮在水上 → 无毒\n沉下去   → 有毒\n```\n\n**「浮的没毒，沉的有毒」——「须强标：密度与毒性无关。」**要点：**须「强「标」**：**「『浮沉判毒』无科学依据（①密度≠毒性；②重金属/某些毒素可溶于水而不沉；③勿自行试毒）** ✓✓","o":"RJ-1747 · 《人纪·神农本草经》第二章，第一节，讲解（PDF 第 30 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"嘴巴麻掉就是毒药","c":"讲义讲「一个极直接的判据」：「**这里神农尝百草，不是说每个都要尝、试它的味道就知道吗？****哪有说真的吃了毒物把它吞下去的？一吃，嘴巴麻掉了，毒药是麻的。**」\n\n**【极精】嘴巴麻掉 = 毒药**\n\n```\n一吃 → 嘴巴麻掉 → 毒\n```\n\n**「毒药是麻的」——「须强标：口唇麻木是急症信号。」**要点：**须「强「标」**：**「口唇/舌麻→须立即停药就诊（①过敏（过敏性休克）；②乌头碱中毒；③神经毒素（河豚/麻醉性贝类）；④低钙/低镁）」** ✓✓","o":"RJ-1748 · 《人纪·神农本草经》第二章，第一节，讲解（PDF 第 30 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"阿斯匹林比中药还毒","c":"讲义讲「一个须标的比较」：「**我们在讲毒药的时候诸位要有个观念：『老师，这个药有毒不能用』——我告诉你，吃了阿斯匹林比它还毒。****我这药是自然的毒，应用得当是治病不会致命；有一定的法则在用的。**」\n\n**【须标】阿斯匹林比中药还毒**\n\n| 说 | 判 |\n|---|---|\n| **『阿斯匹林更毒』** | **派系立场** |\n| **『有法则就不致命』** | **过度概括** |\n\n**「阿斯匹林比中药还毒」——「须标：这是派系立场，绝不可据此停药。」**要点：**须「强「标」**：**「①阿斯匹林在二级预防（已有心脑血管病）有明确获益；②中药也有毒性（马兜铃酸/乌头碱/雷公藤）；③绝不可自行停药」** ✓✓","o":"RJ-1749 · 《人纪·神农本草经》第二章，第一节，讲解（PDF 第 30 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"五色之义","c":"原文「**青属木入肝，赤属火入心，黄属土入脾，白属金入肺，黑属水入肾。**」讲义：「**我眼睛看过去青白相间，我看到是青色跟白色——青色入肝、白色入肺，那这个菜一定介在肝和肺的中间。****所以中医很聪明，我们不要取它的名字；不然的话每次多加个蔬菜你就看不懂了。**」\n\n**【极重要】五色之义**\n\n| 色 | 行 | 脏 |\n|---|---|---|\n| **青** | **木** | **肝** |\n| **赤** | **火** | **心** |\n| **黄** | **土** | **脾** |\n| **白** | **金** | **肺** |\n| **黑** | **水** | **肾** |\n\n**「青白相间就介在肝和肺之间」——「这是最精的配色判断。」**要点：**这一条极重要，它与 n66「五色死/生」、n59「九维五行表」完全一致** ✓✓","o":"RJ-1750 · 《人纪·神农本草经》第二章，第二节「五色之义」，原文及讲解（PDF 第 30–31 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"青白相间介在肝肺之间","c":"讲义讲「一个极精的判断法」：「**你跑到菜场去，眼睛一瞄过去，那么多青菜，名字叫过去可能有好几十种、七八十种青菜的名字都有。****我眼睛看过去青白相间，我看到是青色跟白色——青色入肝、白色入肺，那这个菜一定介在肝和肺的中间。**」\n\n**【极精】青白相间 = 介在肝肺之间**\n\n```\n青（肝）+ 白（肺）\n  → 介于两者之间\n```\n\n**「一眼看过去是青白相间，就知道介在肝和肺中间」——「这是最精的复合判断。」**要点：**这一条极精，它是「多色叠加 = 多靶点」**。**可采信的现代版**：**「①食物的多营养素（多靶点）；②复方药物；③『五色配五脏』是古代归类，须验证」****。","o":"RJ-1751 · 《人纪·神农本草经》第二章，第二节，讲解（PDF 第 30–31 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"「营养学家害死人」须否定","c":"讲义讲「一段须逐条否定的话」：「**我们什么都要听营养学家，我告诉你害死人的就是营养学家。****营养学家说你们蛋黄不要吃，那个高胆固醇的；我就要我的病人吃蛋黄——你的胆固醇太低了，所以你癌症没好。****你看现在得到癌症的哪个胆固醇很高？没癌症的胆固醇都很高。**」\n\n**须「逐条否定**：\n\n| 主张 | 判 |\n|---|---|\n| **『营养学家害死人』** | **情绪化** |\n| **『胆固醇低→癌症没好』** | **无依据** |\n| **『没癌症的胆固醇都很高』** | **倒置因果** |\n\n**「胆固醇低所以癌症没好」——「须明确否定。」**要点：**须「强「标」**：**「①低胆固醇更常见于营养不良/肝病/甲亢/慢性感染；②高胆固醇是心血管危险因素；③『胆固醇高不得癌』是明确错误」** ✓✓","o":"RJ-1752 · 《人纪·神农本草经》第二章，第二节，讲解（PDF 第 31 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"中医化繁为简","c":"讲义讲「一个极精的对比」：「**所以中医是化繁为简，西洋人的化学是化简为繁；化繁了半天，最简单的还是做不出来，所以西医绝对不是中医的对手。****连 H2O 都做不出来，那其他，你需要去做吗？不需要去做。**」\n\n**【极精】化繁为简 vs 化简为繁**\n\n| 路 | 法 |\n|---|---|\n| **中医** | **化繁为简（抓属性）** |\n| **西医/化学** | **化简为繁（拆分）** |\n\n**「中医化繁为简，西医化简为繁」——「须标：二者互补，不是对立。」**要点：**须「标」**：**「『西医绝不是中医的对手』是派系立场；实际现代是还原论 + 系统论并存；『H2O做不出来』是对合成化学的误解」** ✓✓","o":"RJ-1753 · 《人纪·神农本草经》第二章，第二节，讲解（PDF 第 31 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"五味之用","c":"原文「**凡药酸者能涩能收，苦者能泻能燥能坚，甘者能补能和能缓，辛者能散能润能横行，咸者能下能软坚，淡者能利窍能渗泄。****（物熟则甘，土之味也；甘极则反淡，淡本也。）**」\n\n**【极重要】五味之用**\n\n| 味 | 用 |\n|---|---|\n| **酸** | **涩/收** |\n| **苦** | **泻/燥/坚** |\n| **甘** | **补/和/缓** |\n| **辛** | **散/润/横行** |\n| **咸** | **下/软坚** |\n| **淡** | **利窍/渗泄** |\n\n**「酸涩收、苦泻燥坚、甘补和缓、辛散润横行、咸下软坚、淡利窍渗泄」——「这条与 n78五味五能」完全一致。**要点：**这一条极重要，它是「五味的功能表」** ✓✓","o":"RJ-1754 · 《人纪·神农本草经》第二章，第三节「五味之用」，原文（PDF 第 32 页）。"},{"t":"神农本草经·药性总义（一）：五味与五色","h":"酸收的三个用途","c":"讲义讲「一个极精的归纳」：「**比如说我们为什么要收敛，很简单：拉肚子是一种利、要收它；还有流汗不止、我们要收它；还有舌头吐出来收不回去、要收它。**」\n\n**【极精】酸收的三个用途**\n\n| 用 | 情 |\n|---|---|\n| **收泄** | **拉肚子** |\n| **收汗** | **流汗不止** |\n| **收舌** | **舌头吐出收不回** |\n\n**「拉肚子、流汗不止、舌头收不回，都要收」——「这是最精的三个场景。」**要点：**须「标」**：**「①腹泻须先分感染/炎性/功能性；②多汗须查甲亢/低糖/更年期；③舌外伸须查神经系统（不能只收）」** ✓✓","o":"RJ-1755 · 《人纪·神农本草经》第二章，第三节，讲解（PDF 第 32 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"阴阳之义：气为阳，味为阴","c":"原文「**寒热温凉是气也，酸苦甘辛咸是味也；气为阳，味为阴。****其气厚者为阳中之阳，薄者阳中之阴也；味厚者阴中之阴，薄者阴中之阳。****气薄主发泄散表，厚则发热与温；味厚则泄降，薄则通窍、利渗湿。****辛甘发散为阳，酸苦涌泄为阴；咸味涌泄为阴，淡味渗泄为阳。****轻清升浮为阳，重浊沉降为阴；阳气出上窍，阴味出下窍；清阳发肌理，浊阴走五脏；清阳实四肢，浊阴归六腑。**」\n\n**【极重要】阴阳之义**\n\n```\n气（寒热温凉）= 阳\n味（酸苦甘辛咸）= 阴\n\n气厚 = 阳中之阳；气薄 = 阳中之阴\n味厚 = 阴中之阴；味薄 = 阴中之阳\n```\n\n**「气是阳、味是阴」——「这是全书的总纲。」**要点：**这一条极重要，它与 n60「阳包着阴，阴才藏得住」同一体** ✓✓","o":"RJ-1756 · 《人纪·神农本草经》第二章，第四节「阴阳之义」，原文（PDF 第 36 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"气薄主发泄，味厚则泄降","c":"原文「**气薄主发泄散表，厚则发热与温；味厚则泄降，薄则通窍、利渗湿。**」讲义：「**所有的药：气薄者主发泄，像我们讲麻黄、青龙、气很薄……一吃下去就发、发散。****那气如果厚味的、发热和温，比如说我们讲附子，那气很厚、厚重的气、发热、发温。****味道很薄的、能够通窍、能够开窍，比如说我们讲滑石……它能够利渗湿，味淡的能够利湿。**」\n\n**【极重要】气的厚薄与味的厚薄**\n\n| 性 | 行 | 例 |\n|---|---|---|\n| **气薄** | **发泄散表** | **麻黄/青龙** |\n| **气厚** | **发热与温** | **附子** |\n| **味厚** | **泄降** | **熟地/当归** |\n| **味薄** | **通窍/利渗湿** | **滑石** |\n\n**「气薄发散，气厚发热；味厚泄降，味薄通窍」——「这是最精的四象限。」**要点：**这一条极重要，它是「药性的第一层分类」**。**可采信的现代版**：**「①挥发性（气）；②溶解性（味）；③『厚薄』＝『浓度/强度』」****。","o":"RJ-1757 · 《人纪·神农本草经》第二章，第四节，原文及讲解（PDF 第 36–37 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"麻黄没什么味道，最凶","c":"讲义讲「一个极精的反直觉」：「**你是不是吃麻黄没什么味道、淡淡的，最凶的就是它！这是气薄，最凶，然后一吃下去就发、发散。**」\n\n**【极精】麻黄：没味道但最凶**\n\n```\n麻黄（气薄、无味）→ 发散力最强\n```\n\n**「吃麻黄没什么味道，最凶的就是它」——「这是最精的反直觉。」**要点：**这一条极精，它是「无味≠无力」**。**可采信的现代版**：**「①麻黄碱（肾上腺素类效应）；②剂量小、作用强；③须严格控制（心血管风险）」** ✓✓","o":"RJ-1758 · 《人纪·神农本草经》第二章，第四节，讲解（PDF 第 36 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"当归味厚，单吃会下利","c":"讲义讲「一个极实用的提醒」：「**当归拿起来很香，味道很重；你煮汤、你如果什么都不加只吃当归，就会下、会下泻。****因为当归里面有油脂在里面，吃下去你不消化，大便就排出来了。****所以我们处方下去的时候有当归，我们知道这个药味比较厚、这个会攻下，所以我们会加减一下、剂量不要放太多。**」\n\n**【极精】当归味厚 → 单吃会下利**\n\n```\n当归（味厚、有油脂）\n  → 单吃 → 不消化 → 下利\n  → 处方中须减量\n```\n\n**「当归味厚，单吃会下利，所以剂量不要放太多」——「这是最实操的剂量提醒。」**要点：**这一条极精，它与 n52「当归芍药散」、n49「当归四逆汤」的剂量实践一致** ✓✓","o":"RJ-1759 · 《人纪·神农本草经》第二章，第四节，讲解（PDF 第 36–37 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"辛甘发散为阳，咸味下降","c":"讲义讲「一个极精的方向判断」：「**比如说便秘、大便排不出来堵在肛门那边，你不会开辛甘的药下去——到不了的，鸡同鸭讲。****但是你开辛甘的药、如果是治疗鼻子、鼻窦炎或眼睛角膜炎之类，那很好。****可是你下它就到不了，那一定要开咸味的药，就会开芒硝；芒硝是很咸，咸味的药都能够向下。**」\n\n**【极重要】辛甘上行 vs 咸味下行**\n\n| 方 | 药 | 适 |\n|---|---|---|\n| **辛甘（上）** | — | **鼻/眼/皮** |\n| **咸（下）** | **芒硝** | **下焦/便秘** |\n\n**「治鼻子用辛甘，通便用咸味」——「这是最精的方向匹配。」**要点：**这一条极重要，它是「药物的靶向性」**。**可采信的现代版**：**「①局部吸收/分布容积；②脂溶/水溶；③『辛甘上、咸下』是经验总结」****。","o":"RJ-1760 · 《人纪·神农本草经》第二章，第四节，讲解（PDF 第 37–38 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"吸管比喻：提壶揭盖","c":"讲义讲「一个极精的模型」：「**就好像那个吸管，你放到水里面去、你把头按住，拿出来的时候吸管里面有水；这个水你怎么让它出来？放开来，它就出来了。****那上面是毛孔，所以中医有时候用吐的药——一吐下面的水就排出来了；一种是发散的药、发汗的药，一发汗水就排出来了。****那你光是利水的药、利了半天利不出来，所以要因时因地制宜。**」\n\n**【极精】吸管比喻：提壶揭盖**\n\n```\n按住吸管头 → 水不出\n放开上面   → 水就出来\n```\n\n**「上面一开，水就出来」——「这条与 n81吸管比喻=提壶揭盖」完全一致。**要点：**这一条极精，它是「上窍通、下窍通」的「物理模型」**。**可采信的现代版**：**「①负压原理；②利尿不出时先解上（通气/宣肺）；③『提壶揭盖』（中医）」****。","o":"RJ-1761 · 《人纪·神农本草经》第二章，第四节，讲解（PDF 第 38 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"药之相从：升降浮沉","c":"原文「**凡药清虚者浮而升，重实者沉而降。****味薄者升而生如春季，气薄者降而收象秋季；气厚者浮而长象夏天，味厚者沉而藏象冬天；味平者化而成象长夏。****气厚味薄者浮而升，味厚气薄者沉而降；气味俱厚者能浮能沉，气味俱薄者可升可降。**」\n\n**【极重要】药之相从**\n\n| 性 | 行 | 象 |\n|---|---|---|\n| **味薄** | **升/生** | **春** |\n| **气薄** | **降/收** | **秋** |\n| **气厚** | **浮/长** | **夏** |\n| **味厚** | **沉/藏** | **冬** |\n| **味平** | **化/成** | **长夏** |\n\n**「味薄像春天，气薄像秋天；气厚像夏天，味厚像冬天」——「这是最精的四季对应。」**要点：**这一条极重要，它与 n78「五行更贵更贱以知死生」同一体**。**可采信的现代版**：**「①升降浮沉（药物动向）；②四季模型；③『气味厚薄』＝『浓度/强度』」****。","o":"RJ-1762 · 《人纪·神农本草经》第二章，第五节「药之相从」，原文（PDF 第 38 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"酸咸无升，辛甘无降","c":"原文「**酸咸无升，辛甘无降；寒无浮，热无沉——此升降浮沉之义也。**」讲义：「**咸，所有的咸药都是下沉的……味道拿起来咸味的统统下沉。****辛甘不会下降、都是发散的，辛甘都是阳药嘛。**」\n\n**【极重要】酸咸无升，辛甘无降**\n\n```\n酸/咸 → 只降不升\n辛/甘 → 只升不降\n寒     → 不浮\n热     → 不沉\n```\n\n**「酸咸不升，辛甘不降；寒不浮，热不沉」——「这是最简的四条铁律。」**要点：**这一条极重要，它是「药物动向的四条铁律」**。**可采信的现代版**：**「①药物分布的经验规律；②可作为选药的第一筛；③『寒无浮、热无沉』是经验总结」****。","o":"RJ-1763 · 《人纪·神农本草经》第二章，第五节，原文及讲解（PDF 第 38–39 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"根在土中：半身以上升，半身以下降","c":"原文「**凡药根在土中者，半身以上则上升，半身以下则下降。**」讲义：「**为什么要特别强调这个？有的药根它不在土里面的、它是附生在那边的；还有金石类的、矿石类的药、还有动物的药，它没有根啦，所以你不能算在这类。**」\n\n**【极精】根在土中：上下分升降**\n\n```\n根的上半 → 升\n根的下半 → 降\n```\n\n**「根在上半的升，下半的降」——「这是最简的部位判法。」**要点：**这一条极精，它是「部位决定动向」**。**须「标」**：**「『根的上半/下半定升降』是古代经验；附生植物/矿物/动物药不适用（讲义自己也说了）」** ✓✓","o":"RJ-1764 · 《人纪·神农本草经》第二章，第五节，原文及讲解（PDF 第 39 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"质轻上入心肺，重下入肝肾","c":"原文「**药为枝者达四肢，为皮者达皮肤；为心为干者内行脏腑。****质轻者上入心肺，重者下入肝肾；中空者发表，内实者攻里；枯燥者入气分，润泽者入血分——此上下内外之相从也。**」\n\n**【极精】药材部位与归经**\n\n| 部 | 达 |\n|---|---|\n| **枝** | **四肢** |\n| **皮** | **皮肤** |\n| **心/干** | **脏腑** |\n| **质轻** | **心肺** |\n| **质重** | **肝肾** |\n| **中空** | **发表** |\n| **内实** | **攻里** |\n| **枯燥** | **气分** |\n| **润泽** | **血分** |\n\n**「枝达四肢、皮达皮肤、轻入心肺、重入肝肾」——「这是最系统的部位归经。」**要点：**这一条极精，它是「以形取象」的「用药法」**。**须「标」**：**「这是古代类比，须以实证验证（但部位偏好在现代药理中也有对应，如皮类含挥发油、根类含皂苷）」** ✓✓","o":"RJ-1765 · 《人纪·神农本草经》第二章，第五节，原文（PDF 第 39 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"中空发表，内实攻里","c":"原文「**中空者发表，内实者攻里；枯燥者入气分，润泽者入血分。**」\n\n**【极精】中空发表，内实攻里**\n\n| 形 | 用 |\n|---|---|\n| **中空** | **发表** |\n| **内实** | **攻里** |\n\n**「中空的发表，内实的攻里」——「这是最简的形态判法。」**要点：**这一条极精，它是「以形定用」**。**可采信的现代版**：**「①茎中空（如麻黄茎）含挥发油；②根实含储藏物；③『中空/内实』是经验总结」****。","o":"RJ-1766 · 《人纪·神农本草经》第二章，第五节，原文（PDF 第 39 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"枯燥入气分，润泽入血分","c":"原文「**枯燥者入气分，润泽者入血分。**」\n\n**【极精】枯燥入气分，润泽入血分**\n\n| 质 | 分 |\n|---|---|\n| **枯燥** | **气分** |\n| **润泽** | **血分** |\n\n**「枯燥的入气分，润泽的入血分」——「这是最精的气血分判法。」**要点：**这一条极精，它与 n163「取血于营，取气于卫」同一体**。**可采信的现代版**：**「①脂溶性（润）→细胞膜/血；②水溶性（燥）→体液/气；③『气分/血分』是中医的两个层次」****。","o":"RJ-1767 · 《人纪·神农本草经》第二章，第五节，原文（PDF 第 39 页）。"},{"t":"神农本草经·药性总义（二）：阴阳与升降浮沉","h":"痛要分皮、筋、肌、骨、关节","c":"讲义讲「一个极精的问诊」：「**『我痛』『你痛？你怎么会痛？你是皮肤痛？筋痛？肌肉痛？骨头痛？关节痛？』他说『肌肉痛』——讲完了，处方已经出来了。****你不能说『我痛』，你痛就结束了，一点帮助都没有。**」\n\n**【极精】痛要分五层**\n\n| 层 | 定位 |\n|---|---|\n| **皮** | **表（脉浮）** |\n| **筋** | **筋** |\n| **肌** | **肉（脉中）** |\n| **骨** | **里（脉沉）** |\n| **关节** | **骨边** |\n\n**「一句『我痛』，一点帮助都没有」——「须标：疼痛必须先定位。」**要点：**须「强「标」**：**「『一句痛就出处方』是夸张；疼痛须先①定位（皮/筋/肌/骨/关节）；②定性（炎性/神经性/缺血/肿瘤）；③定程（急/慢）」** ✓✓","o":"RJ-1768 · 《人纪·神农本草经》第二章，第四节，讲解（PDF 第 37–38 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"药色之入经脉","c":"原文「**凡药色青，味酸，气臊，性属木者，皆入足厥阴肝，足少阳胆经。****色赤，味苦，气焦，性属火者，皆入手少阴心，手太阳小肠经。****色黄，味甘，气香，性属土者，皆入足太阴脾，足阳明胃经。****色白，味辛，气腥，性属金者，皆入手太阴肺，手阳明大肠经。****色黑，味咸，气腐，性属水者，皆入足少阴肾，足太阳膀胱经。**」\n\n**【极重要】药色之入经脉**\n\n| 色 | 味 | 气 | 行 | 经 |\n|---|---|---|---|---|\n| **青** | **酸** | **臊** | **木** | **肝/胆** |\n| **赤** | **苦** | **焦** | **火** | **心/小肠** |\n| **黄** | **甘** | **香** | **土** | **脾/胃** |\n| **白** | **辛** | **腥** | **金** | **肺/大肠** |\n| **黑** | **咸** | **腐** | **水** | **肾/膀胱** |\n\n**「色、味、气、性四个维度共同决定归经」——「这是最系统的四维归经表。」**要点：**这一条极重要，它是「四维归经」** ✓✓","o":"RJ-1769 · 《人纪·神农本草经》第二章，第六节「药色之入经脉」，原文（PDF 第 41 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"心包与三焦的归属","c":"原文「**十二经中唯手厥阴心包、手少阳三焦经无所主；其经通于足厥阴少阳。****而厥阴主血，诸药入肝经血分者，并入心包；少阳主气，诸药入胆经气分者并入三焦。****命门相火，散行于胆三焦心包，故入命门者并入三焦——此诸药入诸经之分布也。**」\n\n**【极重要】心包与三焦的归属**\n\n```\n入肝经血分 → 并入心包\n入胆经气分 → 并入三焦\n入命门     → 并入三焦\n```\n\n**「心包没有专属药，入肝血分的都并入心包」——「这条与 n52热入血室」、n117「心包把心的火包住」同一体。**要点：**这一条极重要，它解「决了心包/三焦的归属问题** ✓✓","o":"RJ-1770 · 《人纪·神农本草经》第二章，第六节，原文（PDF 第 41–42 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"七情合和","c":"原文「**药有相需者，同类而不可离者；相使者，我之佐使也；相恶者，夺我之能也；相畏者，受彼之制也；相反者，两不相合也；相杀者，制彼之毒也——此异同之义也。**」\n\n**【极重要】七情合和**\n\n| 情 | 义 |\n|---|---|\n| **相需** | **同类不可离** |\n| **相使** | **佐使** |\n| **相恶** | **夺我之能** |\n| **相畏** | **受彼之制** |\n| **相反** | **两不相合** |\n| **相杀** | **制彼之毒** |\n\n**「相需、相使、相恶、相畏、相反、相杀」——「这是中药配伍的七情。」**要点：**这一条极重要，它与现代「药物相互作用」对应** ✓✓","o":"RJ-1771 · 《人纪·神农本草经》第二章，第六节，原文（PDF 第 41–42 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"白术加茯苓是相需","c":"讲义讲「一个极实用的配伍」：「**『药有相需者，同类而不可离者』，就是两个药我们常常放在一起使用的。****比如说白术跟茯苓，我们常常白术跟茯苓放在一起，相需、同类而不可离者、互相依存的。****比如说桂枝和白芍，常常互相依存的。**」\n\n**【极精】相需的经典组合**\n\n| 组 | 义 |\n|---|---|\n| **白术 + 茯苓** | **健脾利湿** |\n| **桂枝 + 白芍** | **调和营卫** |\n\n**「白术茯苓、桂枝白芍，是相需的经典」——「这是最实用的配伍对。」**要点：**须「标」**：**「『相需』是经验，须以剂量比例验证（如苓桂术甘汤术苓比、桂枝汤桂芍比）」** ✓✓","o":"RJ-1772 · 《人纪·神农本草经》第二章，第六节，讲解（PDF 第 42–43 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"「不墨守成规」须限定","c":"讲义讲「一个极重要的态度」：「**相畏者，药性是相反的嘛……这个是在理论上是这样子，真正实际上临床用的时候、你非要用的时候，把这个舍掉，你不要管他，不要墨守成规、照样用没有关系。****我是最不墨守成规的，最皮的，必须要用你就用。**」\n\n**【须标】不墨守成规须限定**\n\n| 说 | 判 |\n|---|---|\n| **『不墨守成规』** | **有限成立** |\n| **『必须用就用』** | **危险** |\n\n**「不要墨守成规，必须用你就用」——「须强标：十八反十九畏不可随意突破。」**要点：**须「强「标」**：**「①十八反/十九畏/妊娠禁忌是历史经验，不可随意突破；②但也不是绝对禁区（须有经验者把握 + 密切监测）；③『我最皮』不能作为规范」** ✓✓","o":"RJ-1773 · 《人纪·神农本草经》第二章，第六节，讲解（PDF 第 43 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"硫磺点命门火","c":"讲义讲「一个极形象的模型」：「**如果我们真要去把命门火点起来，这个命门火衰了、命门好像人的生命的火苗、蜡烛快没了，把它火点起来，要靠硫磺。****硫磺一下去，火就点起来；为什么？硫磺是淡黄色的，三焦油网是黄色的，两个颜色是相同的；硫磺的性很燥，非常的燥，速度非常的快。**」\n\n**【极精】硫磺点命门火**\n\n```\n命门火衰（蜡烛快灭）→ 硫磺\n三焦油网（黄）+ 硫磺（黄）→ 同气相求\n```\n\n**「命门火像蜡烛快没了，要靠硫磺点起来」——「须强标：石硫磺≠土硫磺。」**要点：**须「强「标」**：**「①石硫磺≠土硫磺（土硫磺含砷，剧毒）；②硫磺剂须严格控量（硫化氢/胃肠损伤/皮疹）；③绝不可自服」** ✓✓","o":"RJ-1774 · 《人纪·神农本草经》第二章，第六节，讲解（PDF 第 42–43 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"五脏补泻之义全表","c":"原文「**肝苦急，急食甘而缓之；肝欲散，急食辛以散之，以辛补之，以酸泻之。****心苦缓，急食酸以收之；心欲软，急食咸以软之，以咸补之，以甘泻之。****脾苦湿，急食苦以燥之；脾欲缓，急食甘以缓之，以甘补之，以苦泻之。****肺苦气上逆，急食苦以泻之；肺欲收，急食酸以收之，以酸补之，以辛泻之。****肾苦燥，急食辛以润之；肾欲坚，急食苦以坚之，以苦补之，以咸泻之——此是其义也。**」\n\n**【极重要】五脏补泻全表**\n\n| 脏 | 苦 | 急食 | 欲 | 急食 | 补 | 泻 |\n|---|---|---|---|---|---|---|\n| **肝** | **急** | **甘（缓）** | **散** | **辛（散）** | **辛** | **酸** |\n| **心** | **缓** | **酸（收）** | **软** | **咸（软）** | **咸** | **甘** |\n| **脾** | **湿** | **苦（燥）** | **缓** | **甘（缓）** | **甘** | **苦** |\n| **肺** | **气上逆** | **苦（泻）** | **收** | **酸（收）** | **酸** | **辛** |\n| **肾** | **燥** | **辛（润）** | **坚** | **苦（坚）** | **苦** | **咸** |\n\n**「肝苦急、心苦缓、脾苦湿、肺苦气上逆、肾苦燥」——「这条与 n78五脏所苦/急食表」完全一致。**要点：**这一条极重要，它是「五脏补泻的总表」** ✓✓","o":"RJ-1775 · 《人纪·神农本草经》第二章，第七节「五脏补泻之义」，原文（PDF 第 43 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"肝苦急，急食甘以缓之","c":"讲义讲「一个极实用的治法」：「**肝脏最讨厌的就是急、拘急——拘急就是抽筋，因为肝主筋。****如果筋抽起来的时候、急的时候是非常痛；这个时候急食甘，所以甜味的东西都可以把抽筋的现象去掉。**」\n\n**【极精】肝苦急：抽筋吃甜的**\n\n```\n肝主筋 → 拘急（抽筋）\n  → 急食甘（甜）→ 缓\n```\n\n**「抽筋的时候，吃甜的东西可以缓」——「须标：抽筋先查电解质。」**要点：**须「强「标」**：**「抽筋更常见原因：①低钙/低镁/低钾；②脱水；③药物（利尿剂/他汀）；④神经病变；『甘缓』可作为中医思路，不能替代补电解质」** ✓✓","o":"RJ-1776 · 《人纪·神农本草经》第二章，第七节，讲解（PDF 第 43–44 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"千万不要被名称锁住","c":"讲义讲「一个极重要的方法论」：「**『老师，香蕉是东南方的、那我在西北方、在哈密，没有香蕉』——『哈密瓜也是黄色的、甜的，可不可以？』****这个笨蛋，你不要被名称锁住嘛！****千万不要被名称锁住，我们最怕『立名』；立名的原因是什么？『名』一旦立出来后就有『形』，『神』就失掉了，所以千万不能失掉它的神！**」\n\n**【极重要】千万不要被名称锁住**\n\n```\n香蕉（黄/甜）→ 止抽筋\n香瓜（黄/甜）→ 也行\n哈密瓜（黄/甜）→ 也行\n甘草（甜）→ 沙漠里也有\n```\n\n**「名一立，形就出，神就失掉」——「这是最精的方法论。」**要点：**这一条极重要，它与 n178「不记名称只记味道」完全一致** ✓✓\n\n**须「标」**：**「『名立形出神失』是哲学表达；它的实用价值是『抓属性而非抓标签』；但也不能完全否定病名（现代诊断需要标准化）」** ✓✓","o":"RJ-1777 · 《人纪·神农本草经》第二章，第七节，讲解（PDF 第 44 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"名一立神就失掉","c":"讲义讲「一段极重要的批判」：「**看病也是一样，你把病名一定下来，完啦，神就没有了。****那你以后，现在的中医是这样：『你是这个 MNS，我这个药是治 MNS 的、这个针灸穴道是 MNS 的；你是胃溃疡，这个药是胃溃疡的』——完啦，就看不好病了！****所以你要看症，辨证论治，开出处方才能治得好病。**」\n\n**【极重要】名一立，神就失**\n\n| 路 | 判 |\n|---|---|\n| **对病名开药** | **看不好** |\n| **对证开药** | **能治好** |\n\n**「病名一定，神就没有了」——「须标：病名与辨证不是对立的。」**要点：**须「标」**：**「①病名有助于沟通/筛查/流行病学；②辨证有助于个体化；③二者应结合（并非对立）」** ✓✓","o":"RJ-1778 · 《人纪·神农本草经》第二章，第七节，讲解（PDF 第 44 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"木欲疏：剪枝的比喻","c":"讲义讲「一个极精的模型」：「**肝是木，这个木不能太密；木里面长得太茂盛以后，果树里面如果长得太茂盛——你问果农就知道，他一到时间就剪枝：『不剪掉，这果子长不好啊！』****『100 个你剪掉 90 个、只剩下 10 个？』——『你那 100 个枣都不能吃、全部是酸的；我这 10 个长得又大又好』。**」\n\n**【极精】木欲疏：剪枝比喻**\n\n```\n果树不剪 → 100 个全酸\n剪枝后   → 10 个又大又甜\n```\n\n**「木要疏，阳光才进得来，果实才甜」——「这是最精的『疏』的比喻。」**要点：**这一条极精，它是「疏泄的物理模型」**。**可采信的现代版**：**「①修剪（园艺）；②能量分配；③『疏』＝『减负 + 专注』」****。","o":"RJ-1779 · 《人纪·神农本草经》第二章，第七节，讲解（PDF 第 44–45 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"辛补肝，酸泻肝","c":"讲义讲「一个极具体的用法」：「**如何散它呢？要用辛味的药来散木；辛味的药也可以补它，等于是补肝。****所以我们治疗肝病的时候、我们会加些辛味的药下去，辛辣的药下去能够发散；酸来泄它，酸泄之，酸的入肝嘛，酸泄之。**」\n\n**【极精】辛补肝，酸泻肝**\n\n| 味 | 用 |\n|---|---|\n| **辛** | **散/补** |\n| **酸** | **泄/泻** |\n\n**「治肝病加辛味药，酸味药来泻」——「这是最具体的肝病用药法。」**要点：**这一条极精，它与 n183「五脏补泻全表」一致** ✓✓","o":"RJ-1780 · 《人纪·神农本草经》第二章，第七节，讲解（PDF 第 45 页）。"},{"t":"神农本草经·药性总义（三）：归经、七情与补泻","h":"心苦缓：太慢则热量不足","c":"讲义讲「一个极精的机制」：「**心脏本身是火味，苦缓，急食酸以收之。****心脏有一定的速度，你不能太慢；太慢的时候产生的热量不够。**」\n\n**【极精】心苦缓：太慢则热量不足**\n\n```\n心（火）→ 太慢 → 热量不够\n  → 急食酸以收之\n```\n\n**「心太慢，热量就不够」——「这是最精的心率-体温关联。」**要点：**须「强「标」**：**「心率过慢（<60，有症状）→须查①甲减；②传导阻滞；③药物（β阻滞剂）；④病窦综合」** ✓✓","o":"RJ-1781 · 《人纪·神农本草经》第二章，第七节，讲解（PDF 第 45 页）。"},{"t":"神农本草经·六淫主治","h":"六淫主治全表","c":"原文「**风淫于内，治以辛凉，佐以苦甘，以甘缓之，以辛散之。****热淫于内，治以咸寒，佐以甘苦，以酸收之，以苦发之。****湿淫于内，治以苦热，佐以酸淡，以苦燥之，以淡泄之。****火淫于内，治以咸冷，佐以苦辛，以酸收之，以苦发之。****燥淫于内，治以苦温，佐以甘辛，以苦下之。****寒淫于内，治以甘热，佐以苦辛，以咸泻之，以辛润之，以苦坚之。****此六淫主治，各有所宜，故药性须明，而施用贵审也。**」\n\n**【极重要】六淫主治全表**\n\n| 淫 | 治 | 佐 | 收/发 |\n|---|---|---|---|\n| **风** | **辛凉** | **苦甘** | **甘缓 + 辛散** |\n| **热** | **咸寒** | **甘苦** | **酸收 + 苦发** |\n| **湿** | **苦热** | **酸淡** | **苦燥 + 淡泄** |\n| **火** | **咸冷** | **苦辛** | **酸收 + 苦发** |\n| **燥** | **苦温** | **甘辛** | **苦下** |\n| **寒** | **甘热** | **苦辛** | **咸泻 + 辛润 + 苦坚** |\n\n**「六淫各有所宜，药性须明，施用贵审」——「这是最完整的外感治法表。」**要点：**这一条极重要，它与 n53「五邪（虚/实/贼/微/正）」同一体** ✓✓","o":"RJ-1782 · 《人纪·神农本草经》第二章，第八节「六淫主治」，原文（PDF 第 48 页）。"},{"t":"神农本草经·六淫主治","h":"暑和火看成相通","c":"讲义讲「一个简化」：「**第八，我们看六淫的主治，所谓六淫者，风，寒，暑，湿，燥，热。****这里呢，暑和火我们把它看成相通的。**」\n\n**【极精】六淫的合并**\n\n```\n风·寒·暑·湿·燥·热\n  → 暑 ≈ 火（合并）\n  → 实为五类\n```\n\n**「暑和火看成相通」——「这是最简的合并原则。」**要点：**这一条极精，它与现代「热射病/中暑 = 体温调节失败」一致** ✓✓","o":"RJ-1783 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 48 页）。"},{"t":"神农本草经·六淫主治","h":"风的判据是游走不定","c":"讲义讲「一个极精的判据」：「**我们怎么知道风在里面呢？很简单，这个风产生的症状就是游走不定。****比如说痛，今天痛这边、明天痛那边；病人说我有痛、肩膀痛，然后他说医生我这个痛很奇怪、今天痛这边、明天痛到右边来、后天有痛到环跳，一直跑来跑去的这种——这就是风。****胸口痛也移动的，这就是风证；所以一种病痛它会移动的，通通属于风。**」\n\n**【极重要】风 = 游走不定**\n\n```\n痛今天这边、明天那边 → 风\n痛固定不动           → 非风\n```\n\n**「会移动的痛，通通属于风」——「这条与 n121行痹（风/游走）」完全一致。**要点：**这一条极重要，它是「风的唯一判据」**。**可采信的现代版**：**「①游走性疼痛须排除①风湿多肌痛（PMR）；②转移性疼痛；③神经性疼痛」****。","o":"RJ-1784 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 48 页）。"},{"t":"神农本草经·六淫主治","h":"不要被病名锁住","c":"讲义讲「一个极精的提醒」：「**如果我们定义一定要说是心肌梗塞、一定要说是什么、或者是什么类风湿、关节炎的话，你会被病名锁住，你处方就开不出来。****所以你看风，移走性的通通属于风、移动性的。**」\n\n**【极精】不要被病名锁住**\n\n| 路 | 后果 |\n|---|---|\n| **先立病名** | **处方开不出** |\n| **先抓属性** | **处方自然出** |\n\n**「被病名锁住，处方就开不出来」——「这条与 n183名一立神就失」完全一致。**要点：**须「标」**：**「『不要病名』是强调抓属性；但现代诊断须有病名（筛查/沟通/指南）；二者应结合」** ✓✓","o":"RJ-1785 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 48 页）。"},{"t":"神农本草经·六淫主治","h":"热极生寒：人是圆形的","c":"讲义讲「一个极重要的模型」：「**《黄帝内经》说热极生寒，它是热、我们再用热药，把它推到极限去。****当我们热热热到这边的时候、你一再开寒凉的药、想办法让它降，降不下去；干脆把它推回来算了，再给你热一点推回来——人是一个圆形。****『老师，已经很热了，再用热药脑筋要烧坏的』——你错了，人是圆形的；大气一转，整个寒凉下去。**」\n\n**【极重要】热极生寒：人是圆形的**\n\n```\n只降降不下去 → 推到极限\n→ 圆形一转 → 寒凉下去\n```\n\n**「人是圆形的，推到极限就转回来了」——「这条与 n58重寒则热」、n142「假热真寒」同一逻辑。**要点：**须「强「标」**：**「『热极生寒』的古法须严格限定（①不可用于急性高热（须先退热/查病因）；②『生附子三钱退热』是个案，不可模仿；③附子过量可致心律失常/死亡」** ✓✓","o":"RJ-1786 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 48–49 页）。"},{"t":"神农本草经·六淫主治","h":"热极生寒古法须严格限定","c":"讲义讲「一个具体的案」：「**我开处方，病人那么胖、全身是热的，坐在我面前冷气间还在流汗，嘴巴里还在喝冰水。****你看看，白虎汤啊、没有用啊；八钱、八两、十两、十二两没有用，还是热，越吃越热、越吃胃口越大越渴。****生附子一剂下去，用三钱生附子而已，下去，冷得要死，站在太阳底下都冷，胃口呢、不想吃东西，也不渴。**」\n\n**【须标】热极生寒古法须严格限定**\n\n| 法 | 判 |\n|---|---|\n| **白虎汤（大剂石膏）** | **须监测** |\n| **生附子三钱** | **极危险** |\n\n**「越吃寒药越热，一剂生附子就冷了」——「须强标：附子是剧毒药。」**要点：**须「强「标」**：**「①生附子含乌头碱，0.2 mg 即可中毒、2–4 mg 可致死（与 n121同）；②附子须炮制 + 久煎 + 专业监测；③『一剂退热』是个案，绝不可模仿；④石膏大剂量须监测电解质/肾功」** ✓✓","o":"RJ-1787 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 49 页）。"},{"t":"神农本草经·六淫主治","h":"白虎汤石膏大剂量须监测","c":"讲义讲「一个具体的剂量」：「**我开石膏，起步就是五两，四两；我从来不开一两的。****除了我用大青龙汤，大青龙汤的石膏的话、我石膏在八钱、一两或者是五钱，那个是大青龙，不一样。****我用白虎的时候就不是这样子，一开就是五两、四两，最少了；有时开到十两、十二两还在开。**」\n\n**【须标】石膏大剂量须监测**\n\n| 方 | 剂量 |\n|---|---|\n| **大青龙汤** | **八钱–1两** |\n| **白虎汤** | **4–12两** |\n\n**「白虎起步四五两，有时开到十二两」——「须强标：这是超常规剂量。」**要点：**须「强「标」**：**「①中国药典石膏常用剂量15–60 g；②超大剂量须有明确指征 + 密切监测（电解质/肾/心）；③绝不可自行照方」** ✓✓","o":"RJ-1788 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 48–50 页）。"},{"t":"神农本草经·六淫主治","h":"酸收的三个用途：汗、眼、二便","c":"讲义讲「一个极精的归纳」：「**如果我们一般热很盛的时候、热太过的时候，我们流汗、汗流不止的时候，我们要如何把汗收敛回来？我们用酸味的药就可以收敛。****有的人睡觉眼睛闭不起来，你要想到这个他开在那边、要阖，就要酸味的药。****如果大、小便失禁，大便失禁，要阖、要收嘛，都是酸味的药。**」\n\n**【极精】酸收的三个用途**\n\n| 症 | 用 |\n|---|---|\n| **汗流不止** | **收汗** |\n| **眼睛闭不起** | **收阖** |\n| **大小便失禁** | **收摄** |\n\n**「汗、眼、二便，都要阖、要收」——「这条与 n183酸收的三个用途」互为补充。**要点：**须「强「标」**：**「①眼睛闭不起→须查①面神经麻痹（兔眼）；②甲亢（突眼/眼睑退缩）；③昏迷；②二便失禁→须查脊髓/盆底/神经；③不能只用酸收」** ✓✓","o":"RJ-1789 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 50–51 页）。"},{"t":"神农本草经·六淫主治","h":"眼睛闭不起须查病因","c":"讲义讲「一个极精的体征」：「**有的人睡觉眼睛闭不起来，你要想到这个他开在那边、要阖，就要酸味的药。**」\n\n**【须标】眼睛闭不起须查病因**\n\n```\n睡觉眼睛闭不起（兔眼）\n  → 面神经麻痹 / 甲亢 / 昏迷\n```\n\n**「睡觉眼睛闭不起来」——「这是一条须查病因的体征。」**要点：**须「强「标」**：**「①周围性面神经麻痹（贝尔麻痹）；②甲亢；③昏迷/深睡；④眼睑外翻；⑤须保护角膜（人工泪/眼膏），否则可致角膜溃疡」** ✓✓","o":"RJ-1790 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 51 页）。"},{"t":"神农本草经·六淫主治","h":"苦发：病在里面要发出来","c":"讲义讲「一个极精的用法」：「**以苦味的药来发，病在里面、如果需要发散出来的时候，我们用苦味的药。**」\n\n**【极精】苦发：病在里面要发出来**\n\n```\n病在里面 → 须发散 → 用苦味\n```\n\n**「病在里面要发散出来，用苦味的药」——「这是最精的苦味双用（既能燥又能发）。」**要点：**这一条极精，它与 n78「苦＝干燥剂」互为补充（苦「既能燥、又能发）」** ✓✓","o":"RJ-1791 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 51 页）。"},{"t":"神农本草经·六淫主治","h":"「温病派不会治病」须否定","c":"讲义讲「一段须逐条否定的话」：「**实际上，如果说我们真的去追究起来，他们南派的温病派就说：因为你《伤寒论》里面没有温病的方子……****实际上他就是《伤寒论》没有读通。****这就造成病人的、病机的延误；病机一延误的时候、后面就会出现了死症了。**」\n\n**须「逐条否定**：\n\n| 主张 | 判 |\n|---|---|\n| **『温病派不会治病』** | **派系攻击** |\n| **『伤寒论没读通』** | **不可考** |\n| **『延误造成死症』** | **归因过简** |\n\n**「温病派的方子力量不够，耽误病机」——「须明确否定。」**要点：**须「强「标」**：**「①温病学派（吴鞠通/叶天士）有明确临床价值；②中医内部学派之争不应作为诊疗依据；③『温病派是跟屁虫』等攻击性表述本集不采（与 n113、n155、n158同）」** ✓✓","o":"RJ-1792 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 49–50 页）。"},{"t":"神农本草经·六淫主治","h":"葛根汤就是温病的方子","c":"讲义讲「一个极精的解读」：「**其实《伤寒论》里面就有温病的方子。****我们葛根汤就是说冬天伤于寒，春病必温。****所以说，冬天的时候、小朋友在外面乱跑，流汗呐、伤于寒呐，当时没事、隔年的春天就开始发病，就是葛根汤证。****那是温病的方子，实际他们不晓得葛根汤就是温病的方子。**」\n\n**【极精】葛根汤就是温病的方子**\n\n```\n冬伤于寒 → 当时无事\n  → 春必病温 → 葛根汤证\n```\n\n**「葛根汤就是温病的方子」——「这条与 n55四时的账」同一结构。**要点：**这一条极精，它是「伏气的时序」**。**可采信的现代版**：**「①潜伏期；②延迟发病；③『冬伤于寒，春必病温』＝『季节性触发』」****。","o":"RJ-1793 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 50 页）。"},{"t":"神农本草经·六淫主治","h":"冬伤于寒，春必病温","c":"原文「**冬伤于寒，春必病温。**」讲义：「**冬天的时候、小朋友在外面乱跑、在马路上到处跑，流汗呐、伤于寒呐，当时没事、隔年的春天就开始发病。**」\n\n**【极精】冬伤于寒，春必病温**\n\n```\n冬（藏）→ 汗出当风 → 寒伏\n  → 春（发）→ 病温\n```\n\n**「冬天受了寒，春天就会发病」——「这条与 n55春伤肝→夏寒变」同一结构。**要点：**这一条极精，它是「伏气学说」**。**可采信的现代版**：**「①季节性流行病；②潜伏感染；③『四时的账』＝『延迟效应』」****。","o":"RJ-1794 · 《人纪·神农本草经》第二章，第八节，讲解（PDF 第 50 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"五病所禁全表","c":"原文「**酸走筋，故筋病勿多食酸；筋得酸则拘急，收引益盛。****苦走骨，故骨病勿多食苦；骨得苦则阴益盛，令人重而难举。****甘走肉，肉痛勿多食甘；肉病得甘则壅气，臃肿益甚。****辛走气，气病勿多食辛；气得辛则散，而益虚。****咸走血，血病勿多食咸；血得咸则凝涩，而口渴也。**」\n\n**【极重要】五病所禁全表**\n\n| 味 | 走 | 禁 |\n|---|---|---|\n| **酸** | **筋** | **筋病勿多食酸** |\n| **苦** | **骨** | **骨病勿多食苦** |\n| **甘** | **肉** | **肉病勿多食甘** |\n| **辛** | **气** | **气病勿多食辛** |\n| **咸** | **血** | **血病勿多食咸** |\n\n**「酸走筋、苦走骨、甘走肉、辛走气、咸走血」——「这条与 n79五味所禁表」完全一致。**要点：**这一条极重要，它是「五味的靶器官 + 禁忌」** ✓✓","o":"RJ-1795 · 《人纪·神农本草经》第二章，第十一节「五病所禁」，原文（PDF 第 58 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"治骨折很少用苦药","c":"讲义讲「一个极实用的推论」：「**苦味的走骨头，所以骨病呢、不要吃苦味的药；所以我们一般治疗骨折的问题、我们苦的药很少用。****骨病，得了苦味呢、则阴会越来越盛，让人家重而难举。**」\n\n**【极精】治骨折很少用苦药**\n\n```\n骨病（骨折）→ 苦味少用\n```\n\n**「治骨折很少用苦药」——「这是最实用的推论。」**要点：**这一条极精，它是「从五味所走直接推出用药禁忌」** ✓✓\n\n**须「标」**：**「骨折的核心是复位/固定/营养/康复；『苦味伤骨』无现代依据（但苦寒药久服可影响钙吸收/胃肠）」** ✓✓","o":"RJ-1796 · 《人纪·神农本草经》第二章，第十一节，讲解（PDF 第 58–59 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"腹胀严重不能吃甜的","c":"讲义讲「一个极实用的提醒」：「**甜味走肉。肉病呢——如果你本身肉有病、肌肉有病的人，比如说肌肉里面太过胖呢，或者怎么样子，你还要少吃甜的了。****你吃甜太多的话，臃肿益甚——这个臃呢，指的是腹部、肚子，肚子会肿的越甚。****所以说，当你有腹胀很严重的时候，甜味的药不能吃、甜的东西不能吃；他吃了之后、胀的会很厉害。**」\n\n**【极精】腹胀严重不能吃甜的**\n\n```\n腹胀严重 → 甜味 → 胀更厉害\n```\n\n**「腹胀严重的时候，甜的不能吃」——「这是最实用的饮食禁忌。」**要点：**须「标」**：**「高糖→产气/渗透性腹泻/腹胀是真（FODMAP）；但『甜味伤肉/致肥』须区分糖类（果糖/蔗糖vs 代糖）」** ✓✓","o":"RJ-1797 · 《人纪·神农本草经》第二章，第十一节，讲解（PDF 第 59 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"气喘时辛辣会更虚","c":"讲义讲「一个极实用的推理」：「**辛走气，气病不要吃辛的；所以比如我们一般来治百日咳、气喘、咳嗽，肺病的问题，我们一般来说都告诉他：辛辣的少吃。****气呢，因为肺主气，气得到辛就会散、没有办法聚在一起，造成病人会越虚；比如说气喘了，他已经气很不够了，再吃辛辣、可能会更虚。**」\n\n**【极精】气喘时辛辣更虚**\n\n```\n气喘（气已不足）→ 辛辣 → 更散 → 更虚\n```\n\n**「气喘的人再吃辛辣，会更虚」——「这是最实用的肺病禁忌。」**要点：**须「标」**：**「辛辣可刺激气道/加重咳嗽是真；但『辛散气』的机制须用现代解释（气道刺激 + 胃食管反流）」** ✓✓","o":"RJ-1798 · 《人纪·神农本草经》第二章，第十一节，讲解（PDF 第 59 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"血是咸味的","c":"讲义讲「一个极形象的验证」：「**咸走血，咸味的东西统统走进入血分；你们把血拿出来舔一下，血是咸味的。****血病——血有病人，盐巴、咸的东西少吃；因为血得到盐、咸味的东西，越来越凝涩，而口渴。**」\n\n**【极精】血是咸味的**\n\n```\n血 → 咸味 → 咸入血\n```\n\n**「把血舔一下，是咸的」——「这是最直观的同气相求。」**要点：**这一条极精，它与「生理盐水（0.9%NaCl）」一致** ✓✓\n\n**须「标」**：**「高盐→高血压/水肿/心衰加重是真；但『咸→血凝涩』须用现代机制（渗透压/内皮功能）解释」** ✓✓","o":"RJ-1799 · 《人纪·神农本草经》第二章，第十一节，讲解（PDF 第 59 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"五味所伤全表","c":"原文「**多食咸，则脉凝泣而变色；多食苦，则皮槁而毛拔；多食辛，则筋急而爪枯；多食酸，则肉消皮厚而唇开；多食甘，则骨痛而发落。**」\n\n**【极重要】五味所伤全表**\n\n| 过食 | 伤 |\n|---|---|\n| **咸** | **脉凝泣变色** |\n| **苦** | **皮槁毛拔** |\n| **辛** | **筋急爪枯** |\n| **酸** | **肉消皮厚唇开** |\n| **甘** | **骨痛发落** |\n\n**「多咸伤脉、多苦伤皮、多辛伤筋、多酸伤肉、多甘伤骨」——「这条与 n79五味所伤」完全一致。**要点：**这一条极重要，它是「过食的五个后果」** ✓✓","o":"RJ-1800 · 《人纪·神农本草经》第二章，第十二节「五味所伤」，原文（PDF 第 61 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"甜的吃太多，骨痛发落","c":"讲义讲「一个极精的推理」：「**甜的吃太多，骨痛而发落。****因为脾土嘛，土能克肾，土克水；肾主骨，中医里面肾是不是主骨、肾主头发。****所以我们人的记忆、耳朵的听力、头发的发质、骨质的强硬，统统都是肾脏在管；也是土克水对不对。**」\n\n**【极精】甜的吃太多 → 骨痛发落**\n\n```\n过食甘（土）→ 克水\n  → 肾（骨/发）受伤\n  → 骨痛 + 发落\n```\n\n**「甜吃太多，土克水，骨痛掉发」——「这是最精的五行克制推导。」**要点：**须「强「标」**：**「『甜食→脱发/骨痛』无直接因果（脱发主因是雄激素/遗传；骨痛须排除骨质疏松/转移/炎症）；但高糖→肥胖/代谢紊乱/胰岛素抵抗是真」** ✓✓","o":"RJ-1801 · 《人纪·神农本草经》第二章，第十二节，讲解（PDF 第 61–62 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"甜食伤发的正确说法","c":"讲义讲「一段戏言」：「**哪天你遇到情敌了、这家伙跟我追同一个女孩子，实在是、怎么样修理他？又不好意思讲话、又是同学啊——每天买糖给他吃，吃吃吃啊、每天吃、每天吃，巧克力，不断的送啊；吃得好多就秃头，秃头啊，头发掉光了。****好啊，没事骨质增生，边叫痛啊。**」\n\n**【须标】甜食伤发：戏言不是医学结论**\n\n| 说 | 判 |\n|---|---|\n| **『送糖→秃头』** | **戏言** |\n| **『高糖→脱发』** | **无直接因果** |\n\n**「每天送糖给他吃，吃多了就秃头」——「须明确：这是玩笑，不是医学。」**要点：**须「强「标」**：**「①雄激素性脱发（AGA）是最常见类型（遗传 + DHT）；②高糖的真实风险是肥胖/糖尿病/脂肪肝；③不可以此指导生活」** ✓✓","o":"RJ-1802 · 《人纪·神农本草经》第二章，第十二节，讲解（PDF 第 62 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"口渴是血太浓最简单的指标","c":"讲义讲「一个极简的判据」：「**我们怎么知道这个人血很浓、需要把血稀释掉？口渴。****我就常常问病人：你口渴不渴？口很渴。****所以说，我们要知道这个人血的浓度到底是太浓还是太稀怎么样、正不正常，很简单：口渴不渴就知道了。**」\n\n**【极重要】口渴 = 血太浓 / 肾功能**\n\n| 现 | 义 |\n|---|---|\n| **口渴** | **血太浓/肾功能差** |\n| **口水多** | **肾功能恢复** |\n\n**「口渴不渴，就知道血浓不浓」——「这条与 n131唾液源头在肾」、n156「肾者胃之关」同一体。**要点：**须「强「标」**：**「口渴的首因是①脱水；②高血糖；③药物（抗胆碱能/利尿剂）；④干燥综合征；『血太浓』须用实验（血黏度/Hct/电解质）验证」** ✓✓","o":"RJ-1803 · 《人纪·神农本草经》第二章，第十一节，讲解（PDF 第 59–60 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"口渴首因是脱水","c":"讲义讲「一个极具体的问诊」：「**肾脏功能越来越差的时候，病人是口渴的现象。****这是你问诊可以问到的、病人会陈述的。**」\n\n**【须标】口渴首因是脱水**\n\n| 顺序 | 原因 |\n|---|---|\n| 1 | **脱水** |\n| 2 | **高血糖** |\n| 3 | **药物** |\n| 4 | **干燥综合征** |\n| 5 | **肾功能不全（晚期）** |\n\n**「肾功能差会口渴」——「须标：口渴先查脱水与血糖。」**要点：**须「强「标」**：**「『肾功能差→口渴』只在晚期（肾小管浓缩功能下降）成立；早期肾病常无症；不能以口渴判肾功能」** ✓✓","o":"RJ-1804 · 《人纪·神农本草经》第二章，第十一节，讲解（PDF 第 60 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"「warfarin 是老鼠药」须否定","c":"讲义讲「一段须强标否定的话」：「**warfarin 是他的化学的名称，跟那个老鼠药是一模一样的。****他也不能骗你，他把 warfarin 印得很小……****我告诉你，这是老鼠药，是 great poison。****西药厂一定要弄掉，不弄掉人类毁灭，会毁在他们手上。**」\n\n**须「强标否定**：\n\n| 主张 | 判 |\n|---|---|\n| **『warfarin= 老鼠药』** | **同源但不同用** |\n| **『greatpoison』** | **误导** |\n| **『西药厂要弄掉』** | **情绪化** |\n\n**「华法林就是老鼠药」——「须强标：同源不等于同用途。」**要点：**须「强「标」**：**「①华法林（warfarin）确源于老鼠药成分，但已是标准抗凝药；②用于房颤/机械瓣/VTE可显著降卒中；③绝不可自行停药（可致卒中/肺栓/死亡）；④须定期测INR」** ✓✓","o":"RJ-1805 · 《人纪·神农本草经》第二章，第十一节，讲解（PDF 第 60–61 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"嘴甜身酸：木克土","c":"讲义讲「一个极精的机制」：「**你以为吃到是甜的、嘴巴里是甜的、到身体里是酸的，酸的收的更厉害。****那酸味的为什么说甜食胃会产生问题？因为酸是木克土啊。****咖啡也是酸的，所以所有酸味的东西、全部会影响到脾胃——这就是我们辨证的源头。**」\n\n**【极精】嘴甜身酸**\n\n```\n冰淇淋/黑森林（嘴甜）\n  → 体内代谢为酸\n  → 木克土 → 伤脾胃\n```\n\n**「嘴巴是甜的，到身体里是酸的」——「须标：因果链过长。」**要点：**须「标」**：**「高糖→胰岛素抵抗/脂肪肝/胃排空紊乱是真；但『嘴甜→体内酸→木克土』是中医推演，不能替代血糖/肝功检查；『咖啡是酸的→伤脾胃』过度推论」** ✓✓","o":"RJ-1806 · 《人纪·神农本草经》第二章，第十一节，讲解（PDF 第 60 页）。"},{"t":"神农本草经·五病所禁与五味所伤","h":"蔗糖水稀释血液无依据","c":"讲义讲「一个极简的方」：「**你去买个蔗糖、回来泡着水喝，它就比它好；把那个血稀释掉、血就不会太浓了嘛。****甘蔗汁啊、多喝甘蔗汁啊；你有没有听说过一个人喝甘蔗汁嗝屁的、翘辫子的啊？没有嘛。**」\n\n**【须标】蔗糖水稀释血液无依据**\n\n| 说 | 判 |\n|---|---|\n| **『蔗糖水稀释血』** | **无依据** |\n| **『甘蔗汁无害』** | **过度** |\n\n**「泡个蔗糖水，把血稀释掉」——「须强标：高糖反而有害。」**要点：**须「强「标」**：**「①高糖→血糖升高/渗透性利尿/加重脱水；②脱水首选ORS（口服补液盐：Na+葡萄糖 + K+ + 枸橼酸盐）；③糖尿病人不可大量喝糖水」** ✓✓","o":"RJ-1807 · 《人纪·神农本草经》第二章，第十一节，讲解（PDF 第 60 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"丹砂的本草条目","c":"【本经原文】「**性味甘，微寒无毒，主治身体五脏百病，可以养精神安魂魄、益气明目、杀精魅邪恶鬼，久服通神明，不老能化为汞；畏磁石恶盐水，其色真珠光色如云母，可折者良；又名朱砂。**」【产地】「**在我国四川湖南等山中；以辰州为最佳，故又号辰砂，属石类。**」【主治】「**丹砂为安神要药。**」【用量】「**一般水飞用以拌合他药，单服时可用二、三分，以至钱许。**」【禁忌】「**丹砂只可生研水飞用；火炼则为水银而有毒，不可用；多服丹砂因其性质重坠，使人神定目呆。**」\n\n**【极重要】丹砂的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/微寒/无毒** |\n| **主治** | **安神** |\n| **用量** | **2–3 分至 1 钱** |\n| **禁忌** | **只可生用；火炼成水银有毒** |\n\n**「这是全书第一味药的完整条目，是全书模板」** ✅✅","o":"RJ-1808 · 《人纪·神农本草经》上经第一味「丹砂」，原文（PDF 第 69 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"水飞法","c":"【炮制】「**取朱砂打碎，选去夹石，用磁石吸尽铁削；研成粉末，置钵内，加入适量清水研磨成糊状，然后再加入清水搅拌，使之沉淀；倒出悬浮液，只取下沉粉末，如此反复多次；至手捻之细腻则止，倒出水后，将粉末晒干即得。瓦罐装，置干燥处。**」讲义：「**好的朱砂是沉在底下的，一放下去的时候很多灰都上来……石头类、泥土类都会浮在水上面。****然后再倒第二次水、搅和一下，然后让它朱砂沉下去；轻石类、石头类、沙石类就在上面。**」\n\n**【极精】水飞法**\n\n```\n① 打碎 → 磁石吸铁\n② 加水研磨 → 沉淀\n③ 倒出悬浮液（弃）\n④ 只取下沉粉末（留）\n⑤ 反复多次 → 手捻细腻\n⑥ 晒干、瓦罐装\n```\n\n**「水飞是把杂质浮走，留下纯朱砂」——「这是最标准的炮制法。」**要点：**这一条极精，它是「物理提纯（不用化学）」** ✓✓","o":"RJ-1809 · 《人纪·神农本草经》上经第一味，原文及讲解（PDF 第 69–70 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"沉底有毒，但不煮无毒","c":"讲义讲「一个极精的判据」：「**再过第三次了以后、你把水慢慢倒掉，下面那是纯朱砂、沉底的；因为它沉底，所以它有毒。****记得我讲的话：沉底有毒，但是你不去煮它没有毒。****这个朱砂，你不要过火；你火一烧就变水银了，所以你不能加热的。**」\n\n**【极精】沉底有毒，但不煮无毒**\n\n```\n朱砂（沉底）→ 有毒（潜在）\n  但仍不加热 → 无毒性释放\n```\n\n**「沉底有毒，但不煮就没有毒」——「须标：这是剂量与形态的关键。」**要点：**须「强「标」**：**「①朱砂（HgS）溶解度极低，胃肠吸收率低；②加热→金属汞（Hg）蒸气→剧毒；③长期/大量仍可蓄积（神经/肾）；④现代多国限制内服」** ✓✓","o":"RJ-1810 · 《人纪·神农本草经》上经第一味，讲解（PDF 第 71 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"朱砂不能加热","c":"原文【禁忌】「**火炼则为水银而有毒，不可用。**」讲义：「**这个朱砂，你不要过火；你火一烧就变水银了，所以你不能加热的。****朱砂是生用啊，你不能做药丸的时候、烘焙的时候你把朱砂也放下去了——你不是杀人吗！**」\n\n**【极重要】朱砂不能加热**\n\n```\n朱砂（HgS）→ 加热 → 水银（Hg）\n```\n\n**「火一烧就变水银，所以不能加热」——「这条与【禁忌】完全一致。」**要点：**这一条极重要，它是「化学反应的红线」** ✅✅\n\n**须「强「标」**：**「①HgS + O₂ → Hg + SO₂（加热分解）；②汞蒸气吸入→中枢/肾损伤；③绝不可烘焙/加热含朱砂的丸剂」** ✓✓","o":"RJ-1811 · 《人纪·神农本草经》上经第一味，原文及讲解（PDF 第 71–72 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"朱砂的用量极小","c":"讲义讲「一个极具体的用法」：「**比如说我们这是一个药罐子，里面做了很多小药丸，差不多就接近一斤了；那我们要丹砂要生用，药丸做完以后丹砂是附在外面的。****以前那个药房的师傅啊，这小指甲留长一点……丹砂抠一点，放进去，然后盖子盖在，『嘭』，一震拿出来，整个药丸都是红色的。****丹砂就那么厉害，你就知道它多细了。**」\n\n**【极精】朱砂的用量极小**\n\n```\n一斤药丸 → 只沾指甲尖一点朱砂\n震一下 → 整罐都是红色\n```\n\n**「指甲尖一点点，一斤药丸全红了」——「这是最直观的剂量感。」**要点：**这一条极精，它与【用量】「2–3 分至 1 钱」一致** ✓✓","o":"RJ-1812 · 《人纪·神农本草经》上经第一味，讲解（PDF 第 71–72 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"朱砂是阳中含阴","c":"讲义讲「一个极精的药性解」：「**因其色红，内合真汞之水，属火中有水之药性，故其象心之性；而其性属微寒，得治心病所必须之寒性，服之使人心神内敛神守，故能安眠。****即朱砂，由天地自然熔铸而成，阳中含阴，外露火色，内含水阴，具硫磺水银之相合之性。****因属火体中含有水气，故丹砂能入心、益阴以安神、养血安神为之最；有阳中之阴药称，与人参南北称王。**」\n\n**【极重要】朱砂 = 阳中含阴**\n\n```\n朱砂 = HgS（硫 + 汞）\n外：红色（火）\n内：真水（阴）\n→ 入心、益阴、安神\n```\n\n**「外面是火色，里面是水阴」——「这是最精的以药性解药理。」**要点：**这一条极重要，它是「以形色解药性」的「范本」** ✅✅\n\n**须「强「标」**：**「『硫磺+水银= 阳中含阴』是古代类比；现代须按重金属毒性管理（不可长期内服）」** ✓✓","o":"RJ-1813 · 《人纪·神农本草经》上经第一味，讲解（PDF 第 70 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"朱砂含汞须限制","c":"【禁忌】「**多服丹砂因其性质重坠，使人神定目呆。**」讲义：「**几百年来、几千年来都是这样用的，突然一个卫生署跑出来说：丹砂里面有汞不能用。****第一个我们也知道啊，没有煮过啊；第二个，剂量那么少、怎么会不能用？不懂的人在管懂的人啊。**」\n\n**须「强「标」**：\n\n| 说 | 判 |\n|---|---|\n| **『剂量少就无害』** | **过度自信** |\n| **『不懂的人管懂的人』** | **情绪化** |\n\n**「剂量那么少，怎么会不能用」——「须强标：汞有蓄积性。」**要点：**须「强「标」**：**「①汞蓄积于肾/脑；②慢性汞中毒：神经系统（震颤/记忆下降）、肾损伤、口腔炎；③多国药典已限制朱砂内服（不可长期/大量）；④孕妇/儿童禁用」** ✓✓","o":"RJ-1814 · 《人纪·神农本草经》上经第一味，原文及讲解（PDF 第 71–72 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"朱砂安神是幻象消失","c":"讲义讲「一个极精的机制」：「**这朱砂最主要是安神用的；当你心神不宁的时候、看到以为那边有个人在那边、看到恶鬼，你看到东西不对，吃了朱砂看不到了——这杀恶鬼啦，它就这样写下来。****所以不是说真的杀、杀了它，而是你自己看不到了、你的幻象看不到了。****所以说我们会用到朱砂，一般来说都是心神不宁、长期受到惊吓，这个时候我们在安眠的时候我们会放点朱砂下去。**」\n\n**【极精】朱砂安神 = 幻象消失**\n\n```\n心神不宁 → 幻象（见鬼）\n  → 朱砂 → 幻象消失\n```\n\n**「不是真的杀鬼，是你的幻象看不到了」——「这是最精的『杀鬼』解释。」**要点：**须「强「标」**：**「幻觉/幻视→须先查①精神科（分裂症/双相）；②药物/酒精；③脑器质；④代谢紊乱；绝不可只用朱砂」** ✓✓","o":"RJ-1815 · 《人纪·神农本草经》上经第一味，讲解（PDF 第 70–71 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"朱砂的配伍","c":"讲义引「海藏的话」：「**海藏曰：如同龙骨牡蛎合用，可以养心气；同当归丹参合用，可以养心血；同枸杞地黄合用可以养神；同厚朴川椒等合用可以养脾；同南星川乌同用可以却风；可以明目安胎、也可以解毒、可以发汗，端视医师如何使用而见其功。**」\n\n**【极精】朱砂的配伍**\n\n| 配 | 功 |\n|---|---|\n| **龙骨 + 牡蛎** | **养心气** |\n| **当归 + 丹参** | **养心血** |\n| **枸杞 + 地黄** | **养神** |\n| **厚朴 + 川椒** | **养脾** |\n| **南星 + 川乌** | **却风** |\n\n**「同一个朱砂，配不同药就是不同功效」——「这是最精的配伍观。」**要点：**这一条极精，它与 n183「七情合和」同一体** ✓✓","o":"RJ-1816 · 《人纪·神农本草经》上经第一味，原文引海藏（PDF 第 69 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"蜀椒可制水银","c":"《本草蒙筌》「**世相传此（蜀）椒可制水银，凡误饵成毒者，服即愈也。**」\n\n**【极精】蜀椒可制水银**\n\n```\n误服水银（汞毒）→ 蜀椒可解\n```\n\n**「误吃水银中毒，吃蜀椒就好」——「须标：这是古代记载，未经现代验证。」**要点：**须「强「标」**：**「①汞中毒须立即急诊（驱汞治疗：二巯丙醇/二巯丁二酸）；②『蜀椒解汞』无现代证据；③绝不可自试」** ✓✓","o":"RJ-1817 · 《人纪·神农本草经》上经第一味，引《本草蒙筌》（PDF 第 69 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"《本经逢原》腰痛痰喘案","c":"《本经逢原》「**一人腰痛痰喘，足冷如冰，六脉洪大，按之却软；服八味丸无功，用椒红、茯苓蜜丸，盐汤下，甫二十日而安。****但其性辛温气窜，阴虚火旺人禁之。**」\n\n**【极精】腰痛痰喘 + 足冷如冰 + 脉洪大按软**\n\n```\n上热（脉洪大）+ 下寒（足冷如冰）\n  → 假热真寒（与 n142 一致）\n  → 椒红 + 茯苓\n```\n\n**「上面脉洪大，下面足冷如冰，按之却软」——「这条与 n142假热真寒」完全一致。**要点：**这一条极精，它是「假热真寒」的「经典画像」** ✓✓\n\n**须「标」**：**「『腰痛 + 痰喘 + 足冷』须先排除①心衰；②CKD；③肺病；④主动脉夹层」** ✓✓","o":"RJ-1818 · 《人纪·神农本草经》上经第一味，引《本经逢原》（PDF 第 69 页）。"},{"t":"神农本草经·上经：丹砂（朱砂）","h":"共同处取出就是药性","c":"讲义讲「一个极重要的文献学方法」：「**为什么我们一般本草我们去列的时候、我们会列很多家的注解？就是告诉你：因为相传千年了。****那现在你如果去说去用化学去分析它，分析了半天你还是不知道它的功能是什么。****但是千年来各个名家的注解、你把共同处取出来，大致这个药性就没有什么问题了。**」\n\n**【极重要】共同处取出 = 药性**\n\n```\nN 家注解 → 取共同处 → 药性\n```\n\n**「把各家的共同处取出来，药性就没有问题」——「这是最精的文献综合法。」**要点：**这一条极重要，它是「多源交叉验证」** ✅✅\n\n**可采信的现代版**：**「①系统评价/Meta分析；②多方共识；③『共同处』＝『一致性』」****。\n\n**须「标」**：**「『化学分析半天也不知道功能』是过度（现代药理+分子生物学是必要的；但『多家共同处』的文献法仍有价值」** ✓✓","o":"RJ-1819 · 《人纪·神农本草经》上经第一味，讲解（PDF 第 72–73 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"云母的本草条目","c":"【本经原文】「**味甘平，主身皮死肌，中风寒热，古时在车船上可以除邪气，安五脏，益子精，明目，久服轻身延年；又名云华，云英，云液，云沙，磷石。**」【性味】「**味甘性平，无毒。**」【主治】「**云母主补肺下气，补中坚肌，除邪气，安精神。**」【炮制】「**取净生云母，置铁锅内，煅至火红透，取出，冷却研粉即得。**」\n\n**【极重要】云母的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒** |\n| **主治** | **补肺下气/补中坚肌** |\n| **炮制** | **煅至火红透** |\n\n**「云母是大理石的一种，属玉类」** ✓✓","o":"RJ-1820 · 《人纪·神农本草经》上经第二味「云母」，原文（PDF 第 75 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"云母的五种与五色配五时","c":"原文「**按：抱朴子迁药篇云——云母有五种：其多五色并具，如见青色多者名云英，宜春服之；见赤色多者名云珠，宜夏服之；多白色者名云液，宜秋服之；多黑色者宜冬服之；如见只有青黄二色者名云沙，宜长夏服之；如见晶莹剔透纯白者，可以四时常服之。**」\n\n**【极精】云母五种配五时**\n\n| 名 | 色 | 服 |\n|---|---|---|\n| **云英** | **青** | **春** |\n| **云珠** | **赤** | **夏** |\n| **云液** | **白** | **秋** |\n| **（无名）** | **黑** | **冬** |\n| **云沙** | **青黄** | **长夏** |\n| **（纯白）** | **白** | **四时** |\n\n**「颜色多什么，就什么时候服」——「这条与 n66五色配五时」完全一致。**要点：**这一条极精，它是「同色同时」** ✓✓","o":"RJ-1821 · 《人纪·神农本草经》上经第二味，原文引抱朴子（PDF 第 75 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"金石类与草木类","c":"讲义讲「一个极精的文化史」：「**我们过去相传一个概念、道士还有……就是：你吃草木类的药，你的寿如同草木；比如说树木可以活一百年。****你吃金石类的药，寿同金石、那会千年啊；所以说他们就道士就开始炼丹了。****所以中国最早的化学实际上就是道士他们炼丹的。****那我们中医说：不要，我们吃松树、寿得象松柏延年；象松柏那么常青，所以我们要吃草木类的药。**」\n\n**【极重要】金石类 vs 草木类**\n\n| 类 | 喻 | 寿 |\n|---|---|---|\n| **金石** | **石/金** | **千年** |\n| **草木** | **松柏** | **百年** |\n\n**「中国最早的化学就是道士炼丹」——「这是极精的文化史。」**要点：**这一条极重要，它是「炼丹术= 早期化学」** ✓✓","o":"RJ-1822 · 《人纪·神农本草经》上经第二味，讲解（PDF 第 75–76 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"金石类药用于重症攻坚","c":"讲义讲「一个极具体的用法」：「**金石类的药，好不好用？可以用；我有做这金石类的药，那有重症就能用，因为石头类的东西下沉的力量比较强。****那有时候我们像最后一线的药，在五石乌头丸，在千金要方里面就五种不同的石类的药，然后重症、那个癌细胞扩散、肿瘤都扩散，那重症往下，把这个用金石类的药来攻坚它，那是一个最后一种选择。**」\n\n**【极重要】金石类 = 重症攻坚**\n\n```\n质重 → 下沉 → 攻坚\n用于：肿瘤扩散（最后一线）\n```\n\n**「石头重，下沉力量强，用来攻坚」——「须强标：这是最后一线，不是常规。」**要点：**须「强「标」**：**「①金石类（含重金属：汞/铅/砷/铜）有蓄积毒性；②绝不可用于常规治疗；③肿瘤须规范治疗（手术/化疗/靶向/免疫）；④『五石乌头丸』含乌头 + 五石，毒性极强」** ✓✓","o":"RJ-1823 · 《人纪·神农本草经》上经第二味，讲解（PDF 第 76 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"煅法：金石类通用炮制","c":"讲义讲「一个通用的炮制法」：「**生的云母——我们一般来说所有的金石类的药……都是放在铁锅里面煅至火，就是铁锅就直接放在铁锅里面、不放什么油盐什么，就直接就生烤一样。****把那个放在烤得变成红色的以后、然后整个透红了以后，等它冷、冷了以后把它拿出来打碎，这就是炮制过了；炮制过以后质会很轻很细、打成粉，很好吞。**」\n\n**【极精】煅法**\n\n```\n生矿 → 铁锅煅至通红 → 冷却 → 打碎成粉\n```\n\n**「煅至通红，冷却打粉」——「这是金石类的通用炮制法。」**要点：**这一条极精，它是「高温改性」（「减少结晶水/改变硬度）」** ✓✓","o":"RJ-1824 · 《人纪·神农本草经》上经第二味，讲解（PDF 第 77 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"「石类补眼」无依据","c":"讲义讲「一个推论」：「**一般来说，石头类的药对眼睛都很对眼睛都很好，都是滋补的药。**」\n\n**须「标」**：\n\n| 说 | 判 |\n|---|---|\n| **『石类补眼』** | **无依据** |\n| **『都是滋补』** | **过度** |\n\n**「石头类的药对眼睛都很好」——「须强标：重金属反而伤眼。」**要点：**须「强「标」**：**「①重金属（铅/汞/砷）可致视神经/眼部损伤；②矿物类药须严格限制；③眼病须规范诊治（眼底/OCT/视野）」** ✓✓","o":"RJ-1825 · 《人纪·神农本草经》上经第二味，讲解（PDF 第 77 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"川军与锦纹大黄：别名之害","c":"讲义讲「一个极精的别名问题」：「**我们平常讲大黄，有的医生他就写川军，为什么？他说因为大黄是将军、很凶、无可挡；那是因为大黄是来自四川，所以叫川军。****那还有的医生，我叫锦纹大黄——那是因为他来自甘肃，甘肃那边有个岷州、有个小县就叫中吉，这个地方产的大黄叫做锦纹大黄。****那有的医生就是我表示我很有学问啊：锦纹大黄——好，结果药房没有这个药。****那都是读死书，那个死脑袋。**」\n\n**【极精】别名之害**\n\n```\n川军 = 四川大黄\n锦纹大黄 = 甘肃大黄\n→ 同名异源 → 药房配不出\n```\n\n**「写锦纹大黄，药房没有这个药」——「这是最实用的调剂学提醒。」**要点：**这一条极精，它与 n183「不要被名称锁住」同一主题** ✓✓","o":"RJ-1826 · 《人纪·神农本草经》上经第二味，讲解（PDF 第 76–77 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"玉泉（玉）的本草条目","c":"【本经原文】「**味甘平，主五脏百病，柔筋强骨，安魂魄，长肌肉益气；久服耐寒暑，不饥渴，不老神仙；人临死服五斤，三年色不变，一名玉桃。****玉为阳精之纯者，食之以御水气。**」【性味】「**甘平，无毒。**」【主治】「**清热解渴，安神养肌。**」【括要】「**面身瘢痕，真玉日日磨之则自灭。**」【炮制】「**取净生玉，置砂罐内，煅至火红透，取出，冷却研粉即得。**」\n\n**【极重要】玉泉的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒** |\n| **主治** | **清热解渴/安神养肌** |\n| **要求** | **必须璞玉（不可玉器）** |\n\n**「玉是阳精之纯，可以御水气」** ✓✓","o":"RJ-1827 · 《人纪·神农本草经》上经第三味「玉泉」，原文（PDF 第 77–78 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"必须璞玉，不可玉器","c":"原文「**不可用已经做成玉器之物必伤人也，璞玉乃可用也。**」讲义：「**我们中医吃玉的时候、一定不是你做成了、磨过了、变成一个玉环我去吃它，不行，这已经加工过了；一定要吃璞玉。****就是还没有加工、那个玉还跟石头混在一起的，那璞玉才能吃。**」\n\n**【极重要】必须璞玉，不可玉器**\n\n| 形 | 可 |\n|---|---|\n| **璞玉（未加工）** | **是** |\n| **玉器（已加工）** | **否** |\n\n**「已经做成玉器的不能吃，必须璞玉」——「这是最实用的原料要求。」**要点：**这一条极重要，它是「原料纯度的要求」** ✓✓\n\n**须「强「标」**：**「①玉器可含抛光剂/染色剂/胶；②璞玉也含矿物纤维（石棉类），吸入/吞服有风险；③现代不建议内服玉」** ✓✓","o":"RJ-1828 · 《人纪·神农本草经》上经第三味，原文及讲解（PDF 第 78 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"玉是阳精之纯","c":"原文「**玉为阳精之纯者，食之以御水气。**」讲义：「**中国人对玉要有个观念：玉是阳精的纯的；玉这种东西越清脆、敲起来有金属的声音『嘡』的声音，是纯的玉，非常好。**」\n\n**【极精】玉是阳精之纯**\n\n```\n纯玉 → 敲起来金属声（嘡）\n```\n\n**「敲起来有金属声的，是纯的玉」——「这是最简的鉴别法。」**要点：**须「标」**：**「①敲击声可辅助判断（但不是鉴定标准）；②真伪须仪器（密度/折射率/红外）；③『阳精之纯』是哲学表述」** ✓✓","o":"RJ-1829 · 《人纪·神农本草经》上经第三味，原文及讲解（PDF 第 78–79 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"石钟乳的本草条目","c":"【本经原文】「**味甘，主咳逆上气，明目益精，安五脏，通百节利九窍，下乳汁，又名虚中。****神农辛，黄帝甘，扁鹊甘无毒，如乳汁黄白色，空中相通。**」【性味】「**味甘，性温，无毒。**」【主治】「**石钟乳为补阳益精要药，主治肺气虚损，咳逆上气，明目利窍，补髓疗弱，消渴引饮。**」\n\n**【极重要】石钟乳的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/温/无毒** |\n| **主治** | **补阳益精/肺气虚损** |\n\n**「石钟乳是补阳益精要药」——「须标：现代已不作内服药。」** ✓✓","o":"RJ-1830 · 《人纪·神农本草经》上经第四味「石钟乳」，原文（PDF 第 79 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"「石钟乳内服」须否定","c":"原文【本经】「**主咳逆上气，明目益精，安五脏，通百节利九窍，下乳汁。**」\n\n**须「强标**：\n\n| 主张 | 判 |\n|---|---|\n| **『通百节利九窍』** | **无依据** |\n| **『下乳汁』** | **无依据** |\n| **『补阳益精』** | **无依据** |\n\n**「石钟乳能通百节、下乳汁」——「须明确否定内服。」**要点：**须「强「标」**：**「①石钟乳（碳酸钙）内服吸收差、无治疗价值；②可致胃肠不适/结石；③现代已不作内服药（仅作钙源工业原料）」** ✓✓","o":"RJ-1831 · 《人纪·神农本草经》上经第四味，原文（PDF 第 79 页）。"},{"t":"神农本草经·上经：云母、玉泉、石钟乳","h":"「抗忧郁药让人跳楼」须否定","c":"讲义讲「一段须强标否定的话」：「**所以我宁肯你吃这些石头金石类的药、吃玉，也比那个吃抗忧郁药来得好，因为抗忧郁药的后遗症就是很 HAPPY 去自杀，而且喜欢找很高的楼跳下去。****你们以后注意看新闻，你只要看到这个人从高楼跳下来自杀的，都是吃抗忧郁的药。**」\n\n**须「强标否定**：\n\n| 主张 | 判 |\n|---|---|\n| **『抗抑郁药→自杀』** | **倒置因果** |\n| **『跳楼的都是吃抗抑郁药』** | **无依据** |\n| **『吃玉胜过吃药』** | **危险** |\n\n**「抗忧郁药的后遗症就是去自杀」——「须明确否定，与 n174 完全一致。」**要点：**须「强「标」**：**「①SSRI黑框警告是『用药早期可能增加自杀想法，须密切监测』，不是『药让人更想死』；②抗抑郁药显著降低自杀风险；③绝不可自行停药（可致撤药反应/复发）」** ✓✓","o":"RJ-1832 · 《人纪·神农本草经》上经第三味，讲解（PDF 第 78 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"石钟乳上垂象天，主镇降肺气","c":"讲义讲「一个极精的取象」：「**这个石钟乳到山洞里面去看、那挂在顶上树顶上那都是石钟乳，是吃那个，而不是吃地上的石笋——要吃上面的钟乳。****那这是以意、用象，用它的象来看它。**」原文「**其下垂象天，石又属金，故主镇降肺气。**」\n\n**【极精】石钟乳上垂象天**\n\n```\n上垂（象天）+ 石（属金）\n  → 镇降肺气\n```\n\n**「吃上面的钟乳，不吃地上的石笋」——「这是最精的取象法。」**要点：**这一条极精，它是「以形定向」** ✓✓","o":"RJ-1833 · 《人纪·神农本草经》上经第四味，原文及讲解（PDF 第 79–80 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"石药性悍，不宜久服","c":"原文【禁忌】「**石药性悍，不宜久服。**」讲义：「**这个石药性悍，不单单是指钟乳石，包括云母、包括玉在内，都是性非常的彪悍。****所以我们要炮、煅制；煅过就是烧过以后再、就是让它的性缓一下。****你不要把它生吃，生吃就很强。**」\n\n**【极重要】石药性悍，不宜久服**\n\n```\n石药（钟乳/云母/玉）→ 性悍\n  → 须煅制（缓性）\n  → 不宜久服\n```\n\n**「石药性悍，不单单是钟乳石」——「这条与 n185五病所禁」同一体。**要点：**这一条极重要，它是「通用禁忌 + 炮制必要」** ✓✓","o":"RJ-1834 · 《人纪·神农本草经》上经第四味，原文及讲解（PDF 第 80–81 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"计然的生意经：人弃我捡","c":"讲义讲「一个极精的故事」：「**那个计然讲的话你一定要相信，因为这个是最有名的经济学家；勾践会复国就是计然当他的经济学家。****他计然说出五都黄白的最好。****计然跟他说很简单呐：那个天下大旱的时候，你把船买进来、放在仓库里面；那等到水灾来了以后、你把船拿出来卖，把车子买回来放在仓库里面。****其实这就怎么样？人弃我捡，人争我于。****当他不要的时候你去把它买回来，你要的时候倒出去——你用这八个字去买股票就赢了。**」\n\n**【极精】人弃我捡，人争我于**\n\n```\n旱（船贱）→ 买船\n涝（船贵）→ 卖船、买车\n```\n\n**「八个字：人弃我捡，人争我于」——「这是极精的反周期投资。」**要点：**这一条极精，它是「反周期的古典」** ✓✓","o":"RJ-1835 · 《人纪·神农本草经》上经第四味，讲解（PDF 第 80 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"矾石（明矾）的本草条目","c":"【本经原文】「**味酸寒，主寒热，泄利白沃，阴蚀恶创，目痛，坚筋骨齿；炼饵服之轻身不老，增年寿。****吴普曰矾石，一名羽泽；神农歧伯酸，扁鹊咸，雷公酸无毒；歧伯曰久服伤人骨。**」【性味】「**味酸性寒无毒。**」【主治】「**矾石为收湿解毒止血要药，功能除湿化痰，追延坠浊，主明目坚齿，除风杀虫，蚀恶肉，生好肉，治蛇虫咬伤。**」【禁忌】「**虽可常用无所忌，但不可多服。**」\n\n**【极重要】矾石的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **酸/寒/无毒** |\n| **主治** | **收湿解毒止血** |\n| **禁** | **不可多服（久服伤人骨）** |\n\n**「色白者曰白矾，色光明者曰明矾」** ✓✓","o":"RJ-1836 · 《人纪·神农本草经》上经第五味「矾石」，原文（PDF 第 81 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"久服伤人骨","c":"原文「**歧伯曰久服伤人骨。**」讲义：「**矾石本身是味酸，味道是酸味的，所以筋有抽搐的人不能吃啊。****性寒，本身是寒；那寒的体质的人不能吃，你只要记得药性是寒的、你不能吃寒。****要体性是热的人可以吃。**」\n\n**【极精】久服伤人骨**\n\n```\n矾石（铝）久服 → 伤骨\n```\n\n**「久服伤人骨」——「须标：铝的骨毒性有对应。」**要点：**须「强「标」**：**「①明矾（铝）长期内服→铝蓄积（神经毒性/骨代谢影响）；②『久服伤骨』与铝的骨毒性有一定对应；③不可长期内服」** ✓✓","o":"RJ-1837 · 《人纪·神农本草经》上经第五味，原文及讲解（PDF 第 81 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"矾石四用","c":"原文引陈师古「**矾石之用有四：吐利风热痰延，取其酸苦涌泄也；治诸血痛，脱肛阴挺疮疡，取其酸涩而收也；治痰饮泄痢，崩带风眼，取其收而燥湿也；治喉痹中蛊蛇虫伤蛰，取其解毒也。**」\n\n**【极精】矾石四用**\n\n| 用 | 取 |\n|---|---|\n| **吐利风热痰** | **酸苦涌泄** |\n| **血痛/脱肛/疮疡** | **酸涩而收** |\n| **痰饮/泄痢/崩带** | **收而燥湿** |\n| **喉痹/蛇虫伤** | **解毒** |\n\n**「涌泄、酸收、燥湿、解毒，四个用途」——「这是最系统的功能归纳。」**要点：**这一条极精，它与 n184「六淫主治（以酸收之）」同一体** ✓✓","o":"RJ-1838 · 《人纪·神农本草经》上经第五味，原文引陈师古（PDF 第 81 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"枯矾的炮制","c":"原文「**枯矾：【炮制】取净生白矾，置炽锅内，煅至全部泡松呈白色蜂巢状，取出放凉研粉即得。二矾极酸，变为涩味；酸则收而引津，涩则止而不流。**」讲义：「**明矾这个石头很好玩，你一放在锅子里面一烧，就看见『嘟』起泡泡、哇起泡泡；因为水分很多啊，那水分一烧掉以后、你一弄就是灰，就是枯矾。**」\n\n**【极精】枯矾的炮制**\n\n```\n生白矾 → 煅至泡松（蜂巢状）\n  → 酸变涩\n  → 收而引津 → 止而不流\n```\n\n**「一烧就起泡泡，水烧掉就成枯矾」——「这是最形象的炮制。」**要点：**这一条极精，它是「煅法改性（酸→涩）」** ✓✓","o":"RJ-1839 · 《人纪·神农本草经》上经第五味，原文及讲解（PDF 第 81–82 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"麝香矾石散","c":"原文【倪注】「**枯矾可与麝香合用，因为麝香无孔不入，配合之则可去脑鼻之间的风寒与瘀伤。**」讲义：「**我在用枯矾的时候不是这样，我们用枯矾也可以你直接喷进去，我放了麝香加；我们麝香矾石散就这样来，五十比一的比例，麝香我们是用一，五十的比例其他五十是这个枯矾，和在一起。****枯矾本身能够去息肉、鼻子里面有息肉，能够去痰；那为什么要麝香？因为麝香是无孔不入的。****那麝香配合到枯矾在里面的话，那一个将军骑在马上面，一喷进去，到处窜。**」\n\n**【极重要】麝香矾石散（50:1）**\n\n```\n枯矾 50 : 麝香 1\n  → 喷鼻\n  → 去息肉/化浓痰\n```\n\n**「麝香无孔不入，把枯矾带进去」——「须强标：须专业配制。」**要点：**须「强「标」**：**「①麝香矾石散须专业配制；②鼻窦炎须规范治疗（鼻用激素/抗生素/冲洗）；③不可自制喷鼻（可致鼻黏膜损伤）」** ✓✓","o":"RJ-1840 · 《人纪·神农本草经》上经第五味，原文及讲解（PDF 第 82 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"胆矾：金收木","c":"原文「**胆矾：生铜中，有酸木之味，正得铜中金收之性；金性缓，能平木气。**」\n\n**【极精】胆矾 = 金收木**\n\n```\n生于铜（金）+ 味酸（木）\n  → 金收木 → 平木气\n```\n\n**「胆矾生于铜中，得金收之性，能平木气」——「这是最精的五行推导。」**要点：**这一条极精，它是「同源定性」** ✓✓\n\n**须「强「标」**：**「胆矾（硫酸铜）有毒，误服可致铜中毒/溶血；绝不可内服自制」** ✓✓","o":"RJ-1841 · 《人纪·神农本草经》上经第五味，原文（PDF 第 81 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"消石（硝石）的本草条目","c":"【本经原文】「**味苦寒，主五脏积热，胃张闭，涤去蓄结饮食，推陈致新除邪气；炼之如膏，久服轻身。****吴普曰消石，农曰苦，扁鹊曰甘，名医曰一名芒消；今之硝石。**」【产地】「**产于东印度埃及等热带地方及我国西北；投入火中则爆鸣，立即燃烧而发鲜明之焰。**」【性味】「**味苦性寒，无毒。**」【主治】「**硝石主清积热利小便，治五淋。**」【禁忌】「**忌火。**」【炮制】「**拣去杂质即可。**」\n\n**【极重要】消石（硝石）的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦/寒/无毒** |\n| **主治** | **清积热/利小便** |\n| **禁** | **忌火（投火则爆鸣）** |\n\n**「投入火中则爆鸣，立即燃烧」** ✓✓\n\n**须「强「标」**：**「硝石（硝酸钾/钠）是强氧化剂，可致爆炸/火灾；绝不可加热/摩擦/与还原剂混合」** ✓✓","o":"RJ-1842 · 《人纪·神农本草经》上经第六味「消石」，原文（PDF 第 82–83 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"硝石投火则爆鸣","c":"讲义讲「一个极形象的鉴别」：「**这里讲的硝石，就是我们过去做炸药的硝石，会爆炸的。****你要看看说『老师我煮煮它、看是不是真硝石』——你去火去点，砰！那个脸黑的。****那道士就是装神弄鬼的时候、他就拿硝石粉一洒就，哇！那火就变得很大。**」\n\n**【极精】硝石投火则爆鸣**\n\n```\n硝石 + 火 → 爆鸣\n```\n\n**「一做炸药的硝石，会爆炸」——「须强标：绝不可试。」**要点：**须「强「标」**：**「①硝酸钾投火会爆燃；②绝不可用火测试；③不可用金属工具研磨；④须专业存放」** ✓✓","o":"RJ-1843 · 《人纪·神农本草经》上经第六味，讲解（PDF 第 82–83 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"朴消（芒硝）的本草条目","c":"【本经原文】「**味苦寒，主百病，除寒热邪气，逐六府积聚，结固留癖，能化七十二种石；炼饵服之轻身神仙。**」【产地】「**生于盐卤之地；凡煎炼水硝，结出细芒者为芒硝，结出马牙状者为马牙硝，其凝于底成块者，通为朴硝。**」【性味】「**味咸辛苦，性寒无毒。**」【主治】「**朴消主软坚化积，逐六腑积聚结固留癖；清热泻下，外用消食化积。**」【用量】「**普通三五分。**」【禁忌】「**辛香走窜，不宜多用。**」\n\n**【极重要】朴消（芒硝）的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **咸辛苦/寒/无毒** |\n| **主治** | **软坚化积/清热泻下** |\n| **用量** | **3–5 分** |\n| **禁** | **不宜多用** |\n\n**「结出细芒者为芒硝，结出马牙状者为马牙硝，凝于底成块者为朴硝」——「这是最清的三者关系。」** ✓✓","o":"RJ-1844 · 《人纪·神农本草经》上经第七味「朴消」，原文（PDF 第 83–84 页）。"},{"t":"神农本草经·上经：矾石、消石、朴消","h":"大黄去实，芒硝攻坚","c":"讲义讲「一个极重要的区分」：「**芒硝跟大黄，诸位在使用上面一个概念：芒硝味比较咸。****这咸味是什么？能够软坚，所以是攻坚用；大黄，去实用的。****你不要把它分什么寒热——大黄是去实，芒硝是攻坚；你这样子想的话，这两味药就不会弄错了。****你有这个概念，什么叫做攻坚？这个都在腑上面用的：腑——胆、小肠、胃、大肠、膀胱里面。**」\n\n**【极重要】大黄去实，芒硝攻坚**\n\n```\n大黄 = 去实（内容物）\n芒硝 = 攻坚（硬块/燥屎）\n→ 都在腑（胆/小肠/胃/大肠/膀胱）\n```\n\n**「大黄去实，芒硝攻坚，都在腑上」——「这是最精的两药分工。」**要点：**这一条极重要，它与 n39「承气汤」、n42「大承气三碗」同一体** ✓✓\n\n**极精！！\"唐「容川：芒硝降气分，大黄入血分\"** ✅✅\n| 药 | 分 |\n|---|---|\n| **芒硝** | **气分（降而不升）** |\n| **大黄** | **血分（治火）** |","o":"RJ-1845 · 《人纪·神农本草经》上经第七味，讲解（PDF 第 84–85 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"滑石的本草条目","c":"【本经原文】「**味甘寒，主身热泄澼，女子乳难癃闭，利小便，荡胃中积聚寒热，益精气；久服轻身耐饥长生。**」【产地】「**产我国山东及西南诸省山中；色青白或黄白及银灰色。**」【性味】「**味甘性寒无毒。**」【主治】「**滑石为去湿热利小便要药，主通六府九窍津液；上开肌理下通膀胱，治淋疾，水肿，黄疸。**」【用量】「**普通一钱至三四钱。**」【禁忌】「**凡阴精不足内热……均忌；脾胃俱虚者虽不做泄亦忌，因其性滑也。**」\n\n**【极重要】滑石的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/寒/无毒** |\n| **主治** | **去湿热/利小便（石淋要药）** |\n| **用量** | **1–3 钱** |\n| **禁** | **阴虚/脾胃虚/性滑** |\n\n**「上开肌理、下通膀胱」——「这是最精的双向作用。」** ✓✓","o":"RJ-1846 · 《人纪·神农本草经》上经第八味「滑石」，原文（PDF 第 89 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"滑石是石淋要药","c":"讲义讲「一个极重要的定位」：「**最常用滑石的地方，就是石头堵塞——例如膀胱结石、肾结石，我们都会用到滑石。****因为它甘寒、能够泻下，所以滑石我们常常用在小便；那为什么小便不利要用滑石来利小便？就是膀胱结石堵到了、石头堵到了，我们用滑石把它攻出来。****《药征》说：不单单治小便不利——实际上这里小便不利，就是结石堵到；所以我们经方在治结石的时候、一定会用到滑石。**」\n\n**【极重要】滑石 = 石淋要药**\n\n```\n结石堵 → 小便不利\n  → 滑石（甘寒泻下）→ 攻出\n```\n\n**「石头堵到了，用滑石把它攻出来」——「这是最精的结石用药。」**要点：**须「强「标」**：**「结石须按大小/位置/成分处理（<6mm可观察/排石；>10mm须体外碎石/输尿管镜；多喝水是基础）」** ✓✓","o":"RJ-1847 · 《人纪·神农本草经》上经第八味，讲解（PDF 第 89 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"滑石的剂量","c":"讲义讲「一个具体的剂量」：「**那普通一钱到四钱、三钱四钱；重症的时候，如果是肾结石、遇到石头很大，5 钱 6 钱 7 钱都没有关系。**」\n\n**【极精】滑石的剂量**\n\n| 情 | 量 |\n|---|---|\n| **常** | **1–4 钱** |\n| **重（大结石）** | **5–7 钱** |\n\n**「石头大，5 钱 6 钱 7 钱都没关系」——「这是最具体的剂量梯度。」**要点：**须「标」**：**「剂量须在辨证 + 医师指导下调整；滑石过量可致胃肠刺激/电解质影响」** ✓✓","o":"RJ-1848 · 《人纪·神农本草经》上经第八味，讲解（PDF 第 90 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"粉类药须棉布包煎","c":"讲义讲「一个极实用的技术」：「**那如果说石类的药、粉剂，那么细的粉，我们要直接放到汤药里去煮——成牛奶了。****我们一般用棉布把它包起来；石膏啊、硫磺啊，只要粉类的、我们用棉布包起来，放到里面去煮，不要让它渗出来，直接煮就可以了。**」\n\n**【极精】粉类包煎**\n\n```\n滑石/石膏/硫磺（粉）\n  → 棉布包 → 再煮\n否则汤变浓（成牛奶）\n```\n\n**「不包起来，汤就成牛奶了」——「这是最实用的煎药技术。」**要点：**这一条极精，它是「煎药的操作细节」** ✓✓","o":"RJ-1849 · 《人纪·神农本草经》上经第八味，讲解（PDF 第 90 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"滑石三联问","c":"讲义讲「一个极精的问诊法」：「**诸位你看到病人跑来跟你讲：『哎呀，我小便排不出来，排出来时候小便颜色很黄』『口渴不渴？』『很渴』『热不热？』『很热』——完了，用滑石。****滑石，这时候就应该想到滑石，所以滑石不是单味。**」\n\n**【极精】滑石三联问**\n\n| 问 | 答 | 判 |\n|---|---|---|\n| **小便黄？** | **很黄** | + |\n| **口渴？** | **很渴** | + |\n| **热？** | **很热** | + |\n| | → | **湿热→用滑石** |\n\n**「便黄、口渴、身热，就是湿热，用滑石」——「这是最精的三联问。」**要点：**这一条极精，它与 n42「问小便黄淡」、n129「内热则小便赤」同一体** ✓✓","o":"RJ-1850 · 《人纪·神农本草经》上经第八味，讲解（PDF 第 90 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"石胆（胆矾）的本草条目","c":"【本经原文】「**味酸寒，主明目目痛金创，诸痫痉，女子阴蚀痛，石淋寒热，崩中下血，诸邪毒气，令人有子；炼饵服之不老，久服增寿神仙；能化铁为铜成金银。**」【产地】「**产山中，为蓝色结晶。**」【性味】「**味酸辛，性寒，有小毒。**」【主治】「**胆矾为腐蚀催吐要药，功能蚀恶疮散症积，涌吐风痰，治咽喉口鼻疮毒及目患。**」【用量】「**入煎剂一钱至二钱，研末服一分许。**」【禁忌】「**胃弱人不宜多服。**」\n\n**【极重要】石胆（胆矾）的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **酸辛/寒/有小毒** |\n| **主治** | **腐蚀催吐；蚀恶疮；涌吐风痰** |\n| **禁** | **胃弱人不宜多服** |\n\n**「腐蚀与催吐，是胆矾的两大用途」** ✓✓","o":"RJ-1851 · 《人纪·神农本草经》上经第九味「石胆」，原文（PDF 第 90 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"胆矾是腐蚀加催吐","c":"原文【主治】「**胆矾为腐蚀催吐要药，功能蚀恶疮散症积，涌吐风痰，治咽喉口鼻疮毒及目患。**」【苏颂】「**入吐风痰药最快。**」\n\n**【极重要】胆矾 = 腐蚀 + 催吐**\n\n```\n腐蚀 → 恶疮/息肉\n催吐 → 风痰/喉痹\n```\n\n**「腐蚀与催吐，一体两面」——「须强标：硫酸铜有毒。」**要点：**须「强「标」**：**「胆矾（硫酸铜）有毒：①催吐可致电解质紊乱/误吸（吸入性肺炎）；②腐蚀可致组织损伤/穿孔；③绝不可自用（须专业把握）；④现代催吐已被洗胃/活性炭取代」** ✓✓","o":"RJ-1852 · 《人纪·神农本草经》上经第九味，原文（PDF 第 90 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"胆矾有毒须标","c":"【性味】「**味酸辛，性寒，有小毒。**」【禁忌】「**胃弱人不宜多服。**」讲义：「**因为它性味比较寒、药性比较寒凉，所以胃弱的人不能吃、少吃一点。**」\n\n**须「强标**：\n\n| 说 | 判 |\n|---|---|\n| **『有小毒』** | **实为有毒** |\n| **『胃弱少吃』** | **须更严** |\n\n**「有小毒，胃弱人少服」——「须强标：实际毒性不止『小毒』。」**要点：**须「强「标」**：**「①硫酸铜成人致死量约1g；②误服可致溶血/肝肾衰竭；③绝不可内服自制；④外用也须稀释 + 专业指导」** ✓✓","o":"RJ-1853 · 《人纪·神农本草经》上经第九味，原文及讲解（PDF 第 90–91 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"铜坑三宝：石胆、空青、曾青","c":"讲义讲「一个极精的来源」：「**石胆，就是我们所介绍的胆矾，是一样的东西；那它是产自铜坑。****像这个石胆、那空青、曾青，都是我们过去在产铜的那个矿区里——这地方产铜，里面附带就是这个石胆。****都是铜坑产生：颜色是蓝色的，就叫做石胆；颜色是青色的，就是空青。****石胆是天蓝色、蓝色的结晶，很透；空青颜色比较深一点；曾青里面没有水。**」\n\n**【极精】铜坑三宝**\n\n| 药 | 色 | 特 |\n|---|---|---|\n| **石胆** | **天蓝（透）** | — |\n| **空青** | **青（深）** | **内有水** |\n| **曾青** | **青** | **内无水** |\n\n**「都是铜坑里出来的，颜色不同名字就不同」——「这是最精的同源分类。」**要点：**这一条极精，它与 n183「不要被名称锁住」同一主题** ✓✓","o":"RJ-1854 · 《人纪·神农本草经》上经第九至十一味，讲解（PDF 第 91–93 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"胆矾加铁出铜色","c":"讲义讲「一个极精的鉴别」：「**怎么知道是真正的胆矾？你把它拿出来、跟铁一磨，就会出现铜的颜色——这是胆矾。**」\n\n**【极精】胆矾 + 铁 → 铜（置换反应）**\n\n```\nCuSO4 + Fe → FeSO4 + Cu\n```\n\n**「跟铁一磨就出铜色，这是胆矾」——「这是最精的化学鉴别。」**要点：**这一条极精，它是「置换反应」的「古代版」** ✅✅","o":"RJ-1855 · 《人纪·神农本草经》上经第九味，讲解（PDF 第 91 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"空青的本草条目","c":"【本经原文】「**味甘寒，主青盲，耳聋明目利九窍，通血脉，养精神益肝；久服轻身延年不老，能化铜铁铅锡作金。**」【产地】「**产河南山西陕西山中，色青质轻，近罕见；今名丹青。**」【性味】「**味甘酸，性寒，无毒。**」【主治】「**空青为一切眼目要药，主治目赤目痛，青盲耳聋，利九窍通血脉，养神益肝。**」【大明】「**钻孔取浆，点多年青盲，内障翳膜，养精气；其壳摩翳。**」【用量】「**内服外用，分许至一、二钱；外用点目可以与贝母同用。**」【禁忌】「**勿过量使用；一日点二次即止。**」\n\n**【极重要】空青的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘酸/寒/无毒** |\n| **主治** | **一切眼目要药** |\n| **用** | **钻孔取浆点眼** |\n\n**「钻孔取浆，点多年青盲」——「这是最特殊的眼科药。」** ✓✓","o":"RJ-1856 · 《人纪·神农本草经》上经第十味「空青」，原文（PDF 第 91–92 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"石头里的水就是眼眶里的水","c":"讲义讲「一个极精的取象」：「**为什么叫空青？因为那个青色的石头是空的、你可以看到有水在里面；空的啊，那你就钻个洞、把那个水拿出来。****这个空青就像眼瞳孔一样，所以我们用空青里面的水来点眼睛，非常好。****同样象嘛：石头里的水，跟我们眼珠子里、眼眶里的水是一样的，所以它这个空青，治疗我们的青盲、眼睛的夜盲。****前面不是讲吗？我们中药可以用意念、用意来取它的药。**」\n\n**【极精】石头里的水 = 眼眶里的水**\n\n```\n空青（石中有水）\n  ↔ 眼（眶中有水）\n  → 取象用药 → 治眼病\n```\n\n**「石头里的水，跟眼眶里的水一样」——「这是最精的取象。」**要点：**这一条极精，它是「同象同用」** ✅✅","o":"RJ-1857 · 《人纪·神农本草经》上经第十味，讲解（PDF 第 92 页）。"},{"t":"神农本草经·上经：滑石、石胆、空青、曾青","h":"炉甘石点眼方","c":"讲义讲「一个极具体的方」：「**过去我们中药，最好的点眼药水，是用炉甘石。****我们怎么用？比如说炉甘石一两、硼砂 1 两、海螵蛸 1 两，这三个药，把它打粉，焙制过、烘焙过后打粉；石类药，我们要用的时候，都烘焙过。****如果你有空青，用空青的水来浣过点眼，那是最好的；色盲、眼睛的很多病都可以治。****那如果说这三个药，点下去很涩、病人哇眼睛很涩很难过，你加一点点朱砂——朱砂是润滑的嘛，加一点滑润剂在里面，就可以点眼睛用的。**」\n\n**【极重要】炉甘石点眼方**\n\n```\n炉甘石 1 两\n硼砂   1 两\n海螵蛸 1 两\n→ 煅过打粉 → 点眼\n+ 朱砂少许（润滑）\n+ 空青水（最优，无则用熟水）\n```\n\n**「炉甘石、硼砂、海螵蛸，三味眼科外用药」——「须强标：必须严格无菌。」**要点：**须「强「标」**：**「①古法点眼须严格无菌；②硼砂/炉甘石有刺激性；③眼病须先就诊（感染/角膜损伤须专科）；④绝不可自制点眼」** ✓✓","o":"RJ-1858 · 《人纪·神农本草经》上经第十味，讲解（PDF 第 92–93 页）。"},{"t":"神农本草经·上经：禹余粮、太一余粮、白石英","h":"禹余粮的本草条目","c":"【本经原文】「**味甘寒，主咳逆寒热烦满，痢赤白，血闭，症瘕大热；炼饵服之不饥轻身延年。**」【产地】「**产于山岛或是池泽，乃石中黄粉。**」【性味】「**味甘寒，无毒。**」【主治】「**禹余粮为固补下焦要药，主治滑泄下血，血闭血虚，四肢虚而不仁，崩露赤白。**」【用量】「**入煎剂钱半至三钱，水飞用五分至一钱。**」【禁忌】「**重可去怯，故为镇纳固补之剂；下焦有实热者忌，虚者良。**」【倪注】「**此药多使用于下脓血利不止，常与赤石脂同用。**」【炮制】「**拣去杂质，刷去灰尘，捣碎，置铁锅内，煅透，趁热倒入醋渍淬，取出，晒干，研粉即得。**」\n\n**【极重要】禹余粮的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/寒/无毒** |\n| **主治** | **固补下焦/滑泄下血** |\n| **配** | **赤石脂（止痢）** |\n| **禁** | **下焦有实热者忌** |\n\n**「石中黄粉，外面灰、里面黄」** ✓✓","o":"RJ-1859 · 《人纪·神农本草经》上经第十二味「禹余粮」，原文（PDF 第 93–94 页）。"},{"t":"神农本草经·上经：禹余粮、太一余粮、白石英","h":"赤石脂加禹余粮是止痢对药","c":"讲义讲「一个经典配伍」：「**这个血痢，它是寒性的药，所以说我们一般用在热痢的时候；它是很涩、非常的涩，所以我们用它来做涩剂来止痢。****下痢太多了，我们用涩剂来止痢，你就懂啊。****我们用赤石脂、禹余粮，这个汤方，那是止痢用的、下痢太多了。**」\n\n**【极重要】赤石脂 + 禹余粮**\n\n```\n下痢不止（滑脱）→ 涩剂\n  = 赤石脂 + 禹余粮\n```\n\n**「赤石脂、禹余粮，止痢用的」——「这条与 n49赤石脂禹余粮汤」有对应。**要点：**这一条极重要，它是「涩剂止痢」的「对药」** ✓✓\n\n**须「标」**：**「①涩剂只用于滑脱（无感染/无毒素）；②感染性腹泻禁用止泻药；③须先查病因」** ✓✓","o":"RJ-1860 · 《人纪·神农本草经》上经第十二味，讲解（PDF 第 94 页）。"},{"t":"神农本草经·上经：禹余粮、太一余粮、白石英","h":"煅淬法","c":"【炮制】「**拣去杂质，刷去灰尘，捣碎，置铁锅内，煅透，趁热倒入醋渍淬，取出，晒干，研粉即得。**」\n\n**【极精】煅淬法**\n\n```\n捣碎 → 铁锅煅透 → 趁热醋淬 → 晒干研粉\n```\n\n**「煅透后趁热倒醋里淬」——「这是矿石类的标准炮制。」**要点：**这一条极精，它是「热胀冷缩→粉碎」** ✓✓","o":"RJ-1861 · 《人纪·神农本草经》上经第十二味，原文（PDF 第 93 页）。"},{"t":"神农本草经·上经：禹余粮、太一余粮、白石英","h":"微咸比重咸","c":"原文【容川】「**是石谷中之土质，又具涩性，故以填涩胃肠；甘而微咸，甘能补正以止利，咸能入肾以涩精。**」讲义：「**诸位这个时候要注意了，这个就是《神农本草经》你要会读就在这个地方：微咸和重咸不一样。****我们用到重咸的药是攻坚，攻里面的坚——就是肿瘤、硬块、癌症，我们用重咸的药去攻它。****微咸的药跟重咸的药不一样：微咸的药能够咸能入肾、来涩精。**」\n\n**【极重要】微咸 vs 重咸**\n\n| 咸度 | 用 |\n|---|---|\n| **微咸** | **入肾/涩精** |\n| **重咸** | **攻坚（肿瘤/硬块）** |\n\n**「微咸涩精，重咸攻坚，这是最要紧的分寸」——「须标：重咸治癌无依据。」**要点：**须「强「标」**：**「『重咸攻坚治癌』无依据（高盐反而增加胃癌/高血压风险）；『微咸入肾』是中医理论」** ✓✓","o":"RJ-1862 · 《人纪·神农本草经》上经第十二味，原文及讲解（PDF 第 94–95 页）。"},{"t":"神农本草经·上经：禹余粮、太一余粮、白石英","h":"吃盐要吃对","c":"讲义讲「一个极精的提醒」：「**盐，当然指的是海盐；我们这个《神农本草经》上千年以来的东西，什么人工盐从来没听过。****四川岩盐、岩石里面的、井盐、青海的青盐、海边的东南沿岸一带的海盐，统统可以用。****千万不要『老师吃盐很好』就去买盐，结果盐买错了——我讲此盐非彼盐，这是咸味。**」\n\n**【极精】吃盐要吃对**\n\n| 盐 | 可 |\n|---|---|\n| **海盐/岩盐/井盐/青盐** | **是** |\n| **人工盐** | **否** |\n\n**「此盐非彼盐」——「这是最必要的边界。」**要点：**须「标」**：**「现代食盐的核心是钠摄入量（<5g/日）；不同来源的盐在钠含量上差别不大；『天然盐更好』无强证据」** ✓✓","o":"RJ-1863 · 《人纪·神农本草经》上经第十二味，讲解（PDF 第 95 页）。"},{"t":"神农本草经·上经：禹余粮、太一余粮、白石英","h":"实热的定义","c":"讲义讲「一个极重要的基础」：「**实简单说就是有，有东西啦——这个大便堵到了，一大堆大便堵在里面，有东西就是实。****什么叫做表实？就是毛孔闭锁了——皮肤嘛，表就是皮肤；毛孔闭锁了、没有办法挣开来，结果汗在皮肤下面要透发、透发不出来，就是表实。****那如果是里实？代表里面大便堵到了、出不来，便秘嘛。****所谓寒就是冷……代表寒症是不动的、静止状态的。****所以如果一个人的肠子完全没有蠕动，中医定为寒；有蠕动是热；那有蠕动又排不出来，就是实热。**」\n\n**【极重要】实热的定义**\n\n| 词 | 义 |\n|---|---|\n| **实** | **有东西（固定存在）** |\n| **表实** | **毛孔闭（汗不出）** |\n| **里实** | **大便堵（便秘）** |\n| **寒** | **静止（无蠕动）** |\n| **热** | **蠕动** |\n| **实热** | **有蠕动 + 排不出** |\n\n**「实就是有，寒就是不动，热就是有蠕动」——「这条与 n89通评虚实」、n161「有者为实」完全一致。**要点：**这一条极重要，它是「八纲的最简定义」** ✅✅","o":"RJ-1864 · 《人纪·神农本草经》上经第十二味，讲解（PDF 第 95 页）。"},{"t":"神农本草经·上经：禹余粮、太一余粮、白石英","h":"大便如鞭","c":"讲义讲「一个极精的体征」：「**大便如鞭……比如说大肠我们把它剖面、这是正面看，如果我们把它侧面切下来、大肠壁是这样子，大肠都很宽。****大便堵到，一粒一粒像石头一样、很硬、硬邦邦的……掉出来的时候、掉马桶里面冲不下去，丢到里面会弹回来，像弹珠一样那么硬。****因为大肠原来是这样子，那旁边都堵到了、只有中间一个地方可以过；所以排大便的时候、排得像铅笔一样、像鞭子一样很长一条。**」\n\n**【极重要】大便如鞭**\n\n```\n大肠被硬便堵住（只剩中间缝隙）\n  → 排出时被挤成细条\n  → 形如铅笔/鞭\n```\n\n**「大便像铅笔一样细长」——「这是芒硝攻坚的指征。」**要点：**须「强「标」**：**「『大便变细』→须立即查结肠镜（可提示直肠/乙状结肠肿瘤狭窄）；不可只用芒硝」** ✓✓","o":"RJ-1865 · 《人纪·神农本草经》上经第十二味，讲解（PDF 第 96 页）。"},{"t":"神农本草经·上经：禹余粮、太一余粮、白石英","h":"排水痢是便秘造成的","c":"讲义讲「一个极反直觉的判断」：「**还有一种坚、坚硬的，是大肠那么大，这个大便就那么大一个、几乎整个堵到了，只有旁边一点缝隙可以通过；而水是无孔不入的。****所以这个人大便的时候：『老师我大便下痢不止、一天跑个二三十次厕所都是水』。****一查，一压肚子痛的要死——『先生您这个是因为便秘而造成的下痢』。****这种是排水痢、这种是大便如鞭，统统是里面有坚硬的石头在里面；这个时候就是要使用芒硝的时候。**」\n\n**【极重要】排水痢 = 便秘造成**\n\n```\n硬便堵死大肠 → 只有水能渗出\n  → 一天几十次水样便\n  → 按腹剧痛（拒按）\n```\n\n**「下痢是因为便秘造成的」——「须强标：这是需排除的危象。」**要点：**须「强「标」**：**「『水样便 + 腹痛拒按』→须排除①肠梗阻；②粪嵌塞；③缺血性结肠炎；④感染；须先影像/专科评估，不可直接用芒硝」** ✓✓","o":"RJ-1866 · 《人纪·神农本草经》上经第十二味，讲解（PDF 第 96–97 页）。"},{"t":"神农本草经·上经：禹余粮、太一余粮、白石英","h":"小便黄是热，白是寒","c":"讲义讲「一个极简的判据」：「**所以我们治疗便秘的时候看：先生您小便什么颜色？『黄，热』——就讲完啦。****便秘 10 天没出来：『你小便什么颜色？』『白色』——寒，里面是冷的；白色是寒。****所以你从小便的颜色也可以判断他是寒还是热。**」\n\n**【极精】小便黄是热，白是寒**\n\n| 色 | 判 |\n|---|---|\n| **黄** | **热** |\n| **白** | **寒** |\n\n**「尿黄是热，尿白是寒」——「这条与 n42问小便黄淡」、n129「内热则小便赤」完全一致。**要点：**须「强「标」**：**「尿黄首因是脱水/药物/食物（维B/胡萝卜/利福平）；不能单凭颜色判寒热」** ✓✓","o":"RJ-1867 · 《人纪·神农本草经》上经第十二味，讲解（PDF 第 96 页）。"},{"t":"神农本草经·上经：禹余粮、太一余粮、白石英","h":"「便秘不用照 X 光」须否定","c":"讲义讲「一段须强标否定的话」：「**然后因为中医的生理解剖学非常的完整，所以我们不需要去 X 光去照、不需要去拍片，马上就知道你要吃什么药。****那你说西医有那么多的片子弄出来、还直肠镜进去看，看了半天便秘还是没治好。****那你那么简单的便秘还没治好，你说你会治好大肠癌？**」\n\n**须「强标否定**：\n\n| 主张 | 判 |\n|---|---|\n| **『便秘不用照X光』** | **明确错误** |\n| **『西医只有通便剂』** | **过度简化** |\n| **『治不好便秘→治不好大肠癌』** | **错误推论** |\n\n**「便秘不用照 X 光、不用拍片」——「须明确否定，这是漏诊风险。」**要点：**须「强「标」**：**「①便秘须排除器质性（肿瘤/狭窄/甲减/糖尿病/药物）；②大肠癌筛查须结肠镜（40–45岁起或有症状）；③『大便变细』是红旗，须立即检」** ✓✓","o":"RJ-1868 · 《人纪·神农本草经》上经第十二味，讲解（PDF 第 97 页）。"},{"t":"神农本草经·上经：禹余粮、太一余粮、白石英","h":"太一余粮是禹余粮的优质版","c":"【本经原文】「**味甘平，主治咳逆上气，症瘕血闭，漏下除邪气；久服耐寒暑不饥，轻身飞行千里神仙。****生泰山上，石如甲，甲中有白，白中有黄如鸡子黄色；又名太乙余粮，与禹余粮同，唯质较佳者。**」讲义：「**太一余粮，这个药它的用途跟禹余粮石用途差不多，所以我常常会用禹余粮和禹余粮石，两个是一样的。****太一余粮与禹余粮同，唯品质就是比较鲜黄；那禹余粮石比较暗黄一点，功能差不多。**」\n\n**【极精】太一余粮 = 禹余粮的优质版**\n\n```\n太一余粮（鲜黄）> 禹余粮（暗黄）\n功能相同\n```\n\n**「品质比较鲜黄的叫太一余粮，暗黄的叫禹余粮」——「这是最简的同物异名。」**要点：**这一条极精，它与 n183「不要被名称锁住」同一主题** ✓✓\n\n**极精！！\"金「石类药都把气往下压\"** ✅✓\n| 症 | 机 |\n|---|---|\n| **咳逆上气** | **金石质重→下压** |\n\n**「金石类药，目的就是往下走」——「这是最精的共性。」** ✓✓","o":"RJ-1869 · 《人纪·神农本草经》上经第十三味「太一余粮」，原文及讲解（PDF 第 97–98 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"用药的大原则","c":"讲义讲「一个极重要的原则」：「**我们用药一个大原则、一个前提一个大原则：这个药正常人健康人吃的都没有问题，我们才会拿给病人吃。****如果正常人吃了死掉了，你会不会给病人吃？因为病人比正常人更虚弱嘛；健康人很壮的人死掉了，那病人死定了嘛。****我们开给你的药正常的人都可以吃。**」\n\n**【极重要】用药的大原则**\n\n```\n健康人吃了没问题\n  → 才可以给病人吃\n（因为病人更虚弱）\n```\n\n**「健康人吃了没事，才敢给病人吃」——「这是最精的安全性起点。」**要点：**这一条极重要，它是「安全性的起点」** ✓✓","o":"RJ-1870 · 《人纪·神农本草经》上经第十四味「白石英」，讲解（PDF 第 100 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"「化疗给健康人会死」须否定","c":"讲义讲「一段须强标否定的类比」：「**你到医院去做化疗，你说、你劝我去化疗——你给一个健康人吃，你看健康人他会不会死？我们没有这种记录。****健康人要什么？我们只给病人吃，你就是要让病人死嘛；因为你把同样的化疗给一个健康人他死掉了。****所以你问西医，西医说我们没有这种记录；当然没有这种记录，因为你不能用在健康的人身上。**」\n\n**须「强标否定**：\n\n| 主张 | 判 |\n|---|---|\n| **『化疗给健康人会死』** | **诡辩** |\n| **『健康人不能吃≠药不安全』** | **逻辑错** |\n| **『西医没记录→有问题』** | **倒置** |\n\n**「化疗给健康人会死，说明化疗不安全」——「须明确否定这个类比。」**要点：**须「强「标」**：**「①化疗的剂量/适应证是按肿瘤/体表面积/器官功能精算；②『健康人不能吃』≠『药不安全』（如胰岛素对健康人致命，对糖尿病人救命）；③这个类比不成立」** ✓✓","o":"RJ-1871 · 《人纪·神农本草经》上经第十四味，讲解（PDF 第 100 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"紫石英的本草条目","c":"【本经原文】「**味甘温，主心腹咳逆邪气，补不足，女子风寒在子宫绝孕，十年无子；久服轻身延年。**」【产地】「**产深山中。**」【性味】「**味甘辛，性温无毒。**」【主治】「**主镇怯润枯，养心益肝，治女子风寒在子宫不孕。**」【别录】「**疗上气心腹痛，寒热邪气结心，补心气不足，定惊悸安魂魄，填下焦，止消渴，除胃中久寒，散痈肿，令人悦泽。**」【甄权】「**养肺气，治惊痫，蚀脓。**」【灵胎】「**补血降气。**」【用量】「**普通煎用二至三钱，火炙过后用量宜少。**」【禁忌】「**凡绝孕由阴虚火旺，不能摄受精气者忌用。**」\n\n**【极重要】紫石英的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘辛/温/无毒** |\n| **主治** | **镇怯润枯/养心益肝/子宫不孕** |\n| **禁** | **阴虚火旺者忌** |\n\n**「甘辛为阳，所以紫石英是阳药」** ✓✓","o":"RJ-1872 · 《人纪·神农本草经》上经第十五味「紫石英」，原文（PDF 第 101 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"子宫寒不孕的机制链","c":"讲义讲「一个极清晰的机制」：「**女子风寒在子宫，这个子脏、子宫包膜，我们列为另外一个脏；这个后面子宫后面的就是小肠，要有小肠的火，这个温度在子宫后面，他才有子宫的一定的温度在里面，才会受孕。****那如果你小肠温度不够，子宫就会比较冷；那小肠温度来自哪里？来自心脏。****心跟小肠是表里，心脏不断的跳动……你即使心脏的力量不够，但是你吃紫石英、吃这个药，下去小肠会增加小肠的温度；让小肠的温度上来，当然可以去把那个下部的寒湿去掉变成温热的，温热的就很容易怀孕。**」\n\n**【极重要】子宫寒不孕的机制链**\n\n```\n心 → 小肠（表里）\n  → 子宫（在小肠之前）\n  → 小肠火不足 → 宫寒\n```\n\n**「子宫后面是小肠，小肠的火来自心脏」——「这条与 n43心移热于小肠」完全一致。**要点：**须「标」**：**「『宫寒→不孕』须按现代不孕评估（排卵/输卵管/精液/甲状腺/子宫内膜/AFC等）；『暖宫助孕』无RCT证据」** ✓✓","o":"RJ-1873 · 《人纪·神农本草经》上经第十五味，讲解（PDF 第 101–102 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"淤血加宫寒的处方思路","c":"讲义讲「一个极具体的用法」：「**病人比如说他月经每次来了月经肚子痛，我们去压三阴交——『老师三阴交她有压痛、血海又有压痛、小腿的皮肤老是常常看到白屑、皮肤干干的』——肌肤甲错嘛。****代表她腹里面有淤血；那有淤血我们可以开些活血化瘀的药在里面，再加一些紫石英；象我就加些生附、生硫磺下去，很热，一下结果淤血就化出来。**」\n\n**【极重要】淤血 + 宫寒的处方思路**\n\n```\n三阴交压痛 + 血海压痛 + 肌肤甲错\n  → 腹有淤血\n  → 活血化瘀 + 紫石英 + 生附/生硫磺\n```\n\n**「三阴交压痛、血海压痛、肌肤甲错，就是腹有淤血」——「须强标：生附生硫磺毒性极强。」**要点：**须「强「标」**：**「①生附子/生硫磺毒性极强（附子须先煎/严控量）；②『第二个月就怀孕』须标为个案；③不孕须规范评估」** ✓✓","o":"RJ-1874 · 《人纪·神农本草经》上经第十五味，讲解（PDF 第 102 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"阴虚见阳证，阳虚见阴证","c":"讲义讲「一个极重要的判法」：「**阳虚的人见阴症，阴虚的人会见到阳症。****那个人跑出来，你一看这个人气色很暗、不太爱讲话、静静的坐在那边，都是阴症嘛；『口渴不渴？』『不渴』、没有精神——『老师那个很阴，阴症，他是阳虚』。****结果现在阴虚，阴一虚就没有人来固他的阳，阳就奔、没有限制，阳就奔走；奔走出来你看到的是阳证。****这个人跑进来满面红光、讲话声音很大、心一直很急、口又燥渴，实际上是阴虚造成的阳证。****所以阴虚的人一定看到阳证，阳虚的人看到阴证，一下就能分辨出来。**」\n\n**【极重要】阴虚见阳证，阳虚见阴证**\n\n| 证 | 见 | 原 |\n|---|---|---|\n| **阳虚** | **阴证（暗/静/不渴）** | **阳不足** |\n| **阴虚** | **阳证（红/急/燥渴）** | **阴不固阳→阳奔** |\n\n**「阴虚的人看到的是阳证，阳虚的人看到的是阴证」——「这条与 n162阳虚则外寒、阴虚则内热」完全一致。**要点：**这一条极重要，它是「外观与本质相反」** ✓✓","o":"RJ-1875 · 《人纪·神农本草经》上经第十五味，讲解（PDF 第 102–103 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"醋炙：镇压加收敛","c":"讲义讲「一个极精的炮制原理」：「**为什么要醋？因为味是酸的，我们要取它收敛的功能；如果重镇而且收敛那很好啊。****比如说遗精、精子，这个小孩子年轻常常有遗精，我们要同时他能够收敛、同时能够镇压他，要用醋炙过，趁热的时候去炙它。****我们很多金石类的药很补，那个阳精很多，你不收他就出来了；你不去收他，你这边吃、那边出——象打点滴是一样。**」\n\n**【极重要】醋炙 = 镇压 + 收敛**\n\n```\n金石（重镇）+ 醋（酸收）\n  → 补而不泄（阳精不外漏）\n```\n\n**「重镇而且收敛，那很好」——「这条与 n181酸收的三个用途」、n186「好的朱砂是收敛」同一体。**要点：**这一条极重要，它是「补 + 收配伍」** ✓✓","o":"RJ-1876 · 《人纪·神农本草经》上经第十五味，讲解（PDF 第 103 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"五石脂的本草条目","c":"【本经原文】「**味甘平，主黄疸泄利肠癖脓血，阴蚀下血，赤白邪气痈肿疽痔，恶疮头疡疥掻；久服补骨髓益气肥健不饥，轻身延年；五石脂各随五色补五脏。****计然曰赤石脂出河东赤色者善。**」【性味】「**味酸辛，性大温无毒。**」【主治】「**为固肠收敛要药，主治赤白久痢，赤白带下，厚肠胃，除水湿，收脱肛。**」【括要】「**固肠胃，有收敛之能；下胞衣，无推荡之峻。**」【用量】「**普通二钱至三四钱。**」【禁忌】「**凡火热暴注者不宜用，滞下全是湿热，于法当利……崩中法当补阴清热，带下本属湿热积滞，法当去湿除积，止涩非宜。**」【容川】「**赤石脂粘涩又味甘，能填补止泻利，土之质也，能燥湿。**」【药征】「**主治水毒下利，故兼治便脓血。**」\n\n**【极重要】五石脂（赤石脂）的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **酸辛/大温/无毒** |\n| **主治** | **固肠收敛/赤白久痢/赤白带下/脱肛** |\n| **配** | **禹余粮** |\n| **禁** | **火热暴注/湿热滞下/湿热带下** |\n\n**「涩剂只用于滑脱，湿热不能用」** ✓✓","o":"RJ-1877 · 《人纪·神农本草经》上经第十六味「青石赤石黄石白石黑石脂」，原文（PDF 第 103 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"五石脂：五色补五脏，实用取赤","c":"讲义讲「一个极精的取舍」：「**我们有石的脂，石头里面有脂肪，石脂；这个脂我们有青赤黄白黑五种，类肝心脾肺肾。****一般我们真正在用的时候：计然曰赤石脂河东赤色的、红色的最好；所以说这么多青赤黄白黑，我们以赤石脂为我们选用的药物。**」\n\n**【极精】五石脂 = 五色补五脏，实用取赤**\n\n```\n青赤黄白黑 → 肝心脾肺肾\n实用：赤石脂（河东赤色者善）\n```\n\n**「五种石脂补五脏，我们最常用的就是赤石脂」——「这是最精的取舍。」**要点：**这一条极精，它与 n181「五色之义」、n66「五色死生」同一体** ✓✓","o":"RJ-1878 · 《人纪·神农本草经》上经第十六味，讲解（PDF 第 104 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"赤石脂三用","c":"讲义讲「一个极具体的用法」：「**我们在用赤石脂的时候有的时候是生用，有的时候是放到汤药里面去煮；有的时候是生用、汤药一起用——一边煮，已经放了赤石脂进去煮，煮完以后出来的时候，喝之前拿生的赤石脂冲、再吞下去的。****都有它一定的功能；有时生用、有时熟用、有时候合并用，都是我们医生临症再决定怎么做。**」\n\n**【极精】赤石脂三用**\n\n| 法 | 特 |\n|---|---|\n| **生用** | **收敛止血** |\n| **煮用** | **入汤缓收** |\n| **冲服** | **直接附着** |\n\n**「生用、煮用、冲服，三种用法」——「这是最具体的用法分层。」**要点：**须「标」**：**「赤石脂含铝/硅酸盐，长期大量有风险；须在医师指导下用」** ✓✓","o":"RJ-1879 · 《人纪·神农本草经》上经第十六味，讲解（PDF 第 104 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"子宫颈癌的红旗","c":"讲义讲「一个极重要的警示」：「**带下，像阴蚀下血，就是这个就是出血的病人；病人出血、赤白痢、下痢带血，都可以用。****这个包含着女人的子宫颈癌——子宫颈癌最明显的表证就是无缘无故出血、出血不止。****子宫颈癌，那这种阴蚀下血都含在内，我们要涩剂去止血都可以用这些石脂类的东西。**」\n\n**【极重要】子宫颈癌红旗**\n\n```\n无缘无故出血不止\n  → 子宫颈癌（须立即妇科检查）\n```\n\n**「无缘无故出血不止，就是子宫颈癌」——「须强标：这是红旗，必须立即查。」**要点：**须「强「标」**：**「①绝经后出血/同房后出血/不规则出血须立即妇科评估（TCT/HPV/阴道镜/活检）；②不可只用涩剂止血；③须排除子宫内膜癌/卵巢/宫颈息肉」** ✓✓","o":"RJ-1880 · 《人纪·神农本草经》上经第十六味，讲解（PDF 第 104 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"赤石脂配禹余粮","c":"原文【倪注】「**此药常与禹余粮合用，因同属涩剂，多用于温中止血痢不止。**」讲义：「**赤石脂粘涩又味甘，能填补止泻利，土之质也，能燥湿。**」\n\n**【极精】赤石脂 + 禹余粮**\n\n```\n赤石脂（粘涩甘，土之质）\n+ 禹余粮（甘寒固下焦）\n  → 同属涩剂 → 止痢不止\n```\n\n**「同属涩剂，多用于止痢」——「这条与 n190赤石脂加禹余粮是止痢对药」完全一致。**要点：**须「强「标」**：**「①涩剂只用于滑脱（无感染/无毒素）；②感染性腹泻禁用止泻药；③须先查病因（粪常规/培养/镜检）」** ✓✓","o":"RJ-1881 · 《人纪·神农本草经》上经第十六味，原文及讲解（PDF 第 103–104 页）。"},{"t":"神农本草经·上经：白石英、紫石英、五石脂","h":"湿热带下忌止涩","c":"原文【禁忌】「**凡火热暴注者不宜用，滞下全是湿热，于法当利，自非的受寒邪，下利白积者不宜用；崩中法当补阴清热，带下本属湿热积滞，法当去湿除积，止涩非宜。**」\n\n**【须标】湿热带下忌止涩**\n\n| 证 | 治 |\n|---|---|\n| **湿热滞下** | **当利（不可涩）** |\n| **湿热带下** | **去湿除积（不可涩）** |\n| **火热暴注** | **不宜用** |\n| **崩中** | **补阴清热** |\n\n**「带下本属湿热积滞，止涩非宜」——「这是最精的禁忌。」**要点：**这一条极精，它是「涩剂的边界（实证不可涩）」** ✓✓\n\n**\"与 n190「实热者忌（禹余粮）完全一致！！\"** ✓✓","o":"RJ-1882 · 《人纪·神农本草经》上经第十六味，原文（PDF 第 103 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"收敛药的五个场景","c":"讲义讲「一个极精的清单」：「**脱肛的时候，记得，肛门我们在收敛的时候，我讲过：眼皮盖不起来、眼皮是睁着睡觉；晚上睡觉嘴巴闭不起来、嘴巴张开来了——我们要收敛。****你有盗汗，小朋友盗汗很多的我们要酸收；遗精的我们要收；小便不止的、老年人夜尿很多、每隔半个小时就小一次便、频尿很数，我们也会用到酸性的药，收敛嘛。****那你肠子、小肠的疝气、脱肛，都需要收敛的药。**」\n\n**【极重要】收敛药的五个场景**\n\n| 场 | 症 |\n|---|---|\n| **眼** | **眼皮不盖（睁眼睡）** |\n| **口** | **嘴闭不起** |\n| **汗** | **盗汗** |\n| **精** | **遗精** |\n| **尿** | **夜尿频** |\n| **肠** | **脱肛/疝** |\n\n**「眼皮盖不起来、嘴巴闭不起来、盗汗、遗精、夜尿、脱肛，都要收敛」——「这条与 n181酸收的三个用途」同一体。**要点：**这一条极重要，它是「收敛的适应清单」** ✓✓","o":"RJ-1883 · 《人纪·神农本草经》上经第十六味「石脂」，讲解（PDF 第 104–105 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"病人的话就是处方","c":"讲义讲「一个极精的临床判断」：「**病人来的时候告诉你：我下痢很严重、我拉痢拉到肛门都脱出来了、还在拉——讲完了，赤石脂。****病人已经告诉我们要赤石脂，只是病人不懂；这种光听就知道赤石脂，一定好用。**」\n\n**【极精】病人的话就是处方**\n\n```\n「拉到肛门脱出来还在拉」\n  → 赤石脂（涩剂）\n```\n\n**「病人已经告诉我们了，只是病人不懂」——「这是最精的听诊。」**要点：**须「强「标」**：**「脱肛 + 严重腹泻→须先查病因（感染/炎症性/肿瘤）；涩剂不可用于感染性腹泻」** ✓✓","o":"RJ-1884 · 《人纪·神农本草经》上经第十六味，讲解（PDF 第 105 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"赤石脂的适用范围","c":"讲义讲「一个极重要的分型」：「**那这种【禁忌】，只有寒痢的时候不适合；他所谓下痢白积者不宜用——寒痢的症状，就是排出来大便的颜色都比较淡、水痢会比较多；你压到肚子上肚子没有压痛、里面不是实；病人的颜色气色很暗、形消瘦。****我们这个赤石脂一般来说我们是用在实热、就是发炎的炎症，大便里面带血，会用到赤石脂。****那种下痢、水痢，吃到肚子里就拉，你不需要用到赤石脂跟禹余粮石；一般来说我们用一些白术、茯苓、一些利尿剂。**」\n\n**【极重要】赤石脂的适用范围**\n\n| 类 | 症 | 治 |\n|---|---|---|\n| **实热炎症** | **血与便混合** | **赤石脂 + 禹余粮** |\n| **寒痢（白积）** | **色淡/无压痛/形瘦** | **不用** |\n| **水痢** | **吃就拉** | **白术茯苓（利小便）** |\n\n**「实热炎症才用赤石脂；寒痢、水痢不用」——「须标：这是三层判断的最后一层。」**要点：**这一条极重要，它与 n190、n191 形成三层判断** ✓✓","o":"RJ-1885 · 《人纪·神农本草经》上经第十六味，讲解（PDF 第 105 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"利小便就是实大便","c":"讲义讲「一个极精的治法」：「**那种下痢、水痢，吃到肚子里就拉，你不需要用到赤石脂跟禹余粮石；一般来说我们用一些白术、茯苓、一些利尿剂。****这种下利不止我们利小便，一利小便他大便就好、正常了。**」\n\n**【极精】利小便 = 实大便**\n\n```\n水泻不止 → 利小便 → 大便自实\n```\n\n**「一利小便，大便就正常了」——「这条与 n123利小便（分利）」同一法。**要点：**这一条极精，它是「分利的古典」** ✓✓\n\n**须「强「标」**：**「水泻须先补液 + 查病因；『利小便止泻』不适用于感染性/霍乱/中毒」** ✓✓","o":"RJ-1886 · 《人纪·神农本草经》上经第十六味，讲解（PDF 第 105 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"铜坑眼科药族","c":"【白青·本经原文】「**味甘平，主明目利九窍，耳聋心下邪气令人吐，杀诸毒三虫；久服通神明，轻身延年不老。**」【扁青·本经原文】「**味甘平，主目痛明目，折跌痈肿，金创不疗，破积聚解毒气，利精神；久服轻身不老。**」【别录】「**吐风痰，癫痫，平肝。**」【灵胎】「**养肝明目。**」讲义：「**这种金石类的药，比如说空青、白青、曾青，都是产在铜矿坑里面。****扁青，治症非常多；我们空青、曾青很多都是治疗眼科的病。**」\n\n**【极精】铜坑眼科药族**\n\n```\n空青/曾青/扁青/白青\n  → 都产铜坑\n  → 都主治目痛/目盲\n```\n\n**「铜坑出来的，都是眼科药」——「这是最精的族性归类。」**要点：**这一条极精，它与 n189「铜坑三宝」同一主题** ✓✓\n\n**须「强「标」**：**「铜矿类药（含铜/砷杂质）有毒，绝不可内服；眼病须专科诊治」** ✓✓","o":"RJ-1887 · 《人纪·神农本草经》上经第十七至十八味，原文（PDF 第 105–107 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"水飞法","c":"讲义讲「一个极重要的炮制法」：「**象金石类的药，如果炮制过、提炼过以后，你放水下去——无论是提炼还是锻过、烧过烧红、打碎磨的很细，然后让它溶解到水里面让它飘，就是水飞。****停在那边、然后沉底，沉底的不要；溶化在水里面的就可以作眼科的药来涂。****象曾青、白青、扁青都可以作眼科的药水来涂，眼睛痛痒都可以止痛。****象我前面讲的，我们用炉甘石都可以。**」\n\n**【极重要】水飞法**\n\n```\n煅烧 → 打碎磨细 → 入水搅\n  → 取上层悬浮（弃沉底）\n  → 点眼\n```\n\n**「沉底的不要，取上清的做眼药」——「这是最精的粒度分级。」**要点：**这一条极重要，它是「水飞= 粒度分离」** ✓✓\n\n**须「强「标」**：**「①古法点眼须严格无菌；②矿物粉可致角膜损伤；③绝不可自制；④眼病须专科」** ✓✓","o":"RJ-1888 · 《人纪·神农本草经》上经第十八味「扁青」，讲解（PDF 第 107 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"菖蒲的本草条目","c":"【本经原文】「**味辛温，主风寒湿痹，咳逆上气，开心孔补五脏，通九窍，明耳目，出声音，主耳聋痈疽，温肠胃，止小便利；久服轻身不忘不迷惑延年，生池泽。**」【产地】「**我国四川，今处处有之，多生水滨；根入药，一寸九节者良。**」【性味】「**味辛性温无毒。**」【主治】「**菖蒲为宣窍泄热，健胃行滞要药，主开心孔通九窍，明耳目出声音，治咳嗽上逆，霍乱转筋，健脾胃杀诸虫，疗噤口痢。**」【用量】「**普通生用二三钱，干用五分至一钱半。**」【禁忌】「**忌饴糖羊肉铁器。**」【倪注】「**常用于鼻塞不通，脑部受损；内服外用皆宜。**」\n\n**【极重要】菖蒲的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **辛/温/无毒** |\n| **主治** | **宣窍泄热/开心孔/通九窍/明耳目** |\n| **禁** | **饴糖/羊肉/铁器** |\n\n**「开心孔、通九窍」——「这是菖蒲的核心。」** ✓✓","o":"RJ-1889 · 《人纪·神农本草经》上经第十九味「昌蒲」，原文（PDF 第 106–107 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"石菖蒲与水菖蒲","c":"讲义讲「一个必要的区分」：「**首先我们先确认：市面上有两种，一种石菖蒲、一种是水菖蒲；诸位要拿的是九节石菖蒲，这里讲的是石菖蒲不是水菖蒲。****那真的菖蒲九节、长了九个节，一节一节看起来象竹子一样；你不用真的算是九节。****我们一般的菖蒲，用的是石菖蒲。**」\n\n**【极精】石菖蒲 vs 水菖蒲**\n\n| 类 | 用 |\n|---|---|\n| **石菖蒲（九节）** | **是** |\n| **水菖蒲** | **否** |\n\n**「要拿九节石菖蒲，不是水菖蒲」——「这是最必要的品种区分。」**要点：**这一条极精，它是「同名异种」** ✓✓","o":"RJ-1890 · 《人纪·神农本草经》上经第十九味，讲解（PDF 第 107 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"菖蒲的写法","c":"讲义讲「一个极实用的提醒」：「**《神农本草经》讲这个菖蒲，你这个样子开、到药房不知道；你真要到药房开的时候，菖蒲要这样写、要草字头：菖蒲。****你不能说武昌的昌没有草字头，他说你字写错了。****实际上本草经的原文是昌，结果药房以为你这个人书都没读。**」\n\n**【极精】菖蒲的写法**\n\n```\n本草原文：昌（无草字头）\n写处方：菖蒲（草字头）\n```\n\n**「本草原文是昌，药房以为你书都没读」——「与 n187川军/锦纹大黄」同一主题。**要点：**这一条极精，它是「别名与标准名的冲突」** ✓✓","o":"RJ-1891 · 《人纪·神农本草经》上经第十九味，讲解（PDF 第 107 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"鼻窦炎三味药","c":"讲义讲「一个极具体的方」：「**我最常用的治疗就是这两味药加上苍术……3 钱：苍术 3 钱、菖蒲 3 钱、辛夷 2 钱，这样的话你光这 3 味药，鼻窦炎就好了。****这三味药，只去鼻窦炎里面堵到的东西，不管你是寒热——鼻涕一流出来是浓的就是热，流清涕、排出来都是白白的清的鼻涕都是寒的嘛；不管寒热都用这三味药。****那再去管寒热的话那就要知道，寒热在肺里面，因为肺开窍于鼻嘛、鼻子是肺之窍；这个时候你可以在里面加些干姜，可以去肺的寒；如果肺里面太热，你可以加些杏仁、麦门冬啊诸如此类的。**」\n\n**【极重要】鼻窦炎三味药**\n\n```\n苍术 3 钱 + 菖蒲 3 钱 + 辛夷 2 钱\n  → 通鼻窦（不分寒热）\n寒：+ 干姜\n热：+ 杏仁/麦门冬\n```\n\n**「这三味药，鼻窦炎就好了」——「须强标：须规范治疗。」**要点：**须「强「标」**：**「①鼻窦炎须规范治疗（鼻用激素/生理盐水冲洗/抗生素（细菌性）；②慢性须耳鼻喉科评估；③『不分寒热』是经验用法，不可代替病因治疗」** ✓✓","o":"RJ-1892 · 《人纪·神农本草经》上经第十九味，讲解（PDF 第 108–109 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"辛夷花下垂就是鼻窍","c":"讲义讲「一个极精的取象」：「**辛夷花要 3 钱，那辛夷花一大包、菖蒲一点点——了解我意思吗？稍微减量。****你想想看，一棵树长长长、长到顶上开花，是不是正好开花在这个地方（鼻尖）？……花都开的垂下来的，那个辛夷花就是垂下来的，刚好在鼻子的位置。****如果你鼻子长到这边（头顶），你可能要吃玫瑰、或者是菊花。**」\n\n**【极精】辛夷花下垂 = 鼻窍**\n\n```\n花垂下来 → 位置在鼻\n  → 取象治鼻\n```\n\n**「辛夷花垂下来，刚好在鼻子的位置」——「这是最精的取象，也与剂量有关。」**要点：**这一条极精，它是「花类质轻→剂量减」** ✓✓","o":"RJ-1893 · 《人纪·神农本草经》上经第十九味，讲解（PDF 第 109 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"菊花的本草条目","c":"【本经原文】「**味苦平，主风，头眩肿痛，目欲脱泪出，皮肤死肌，恶风湿痹；久服利气血，轻身耐老延年，生川野及田野；今之菊花。**」【产地】「**处处有之，种类很多，黄白二种入药，味苦；家庭玩赏之菊不入药；今杭州出产多，号称杭菊。**」【性味】「**味苦甘平无毒。**」【主治】「**菊花为清风热明目解毒要药，主诸风头眩肿痛，目痛翳膜，利血脉，治疔疮。**」【容川】「**菊叶为治疮之要药，因其性散，能去肌肉中之风邪也。**」【灵胎】「**平肝熄风。**」【用量】「**普通一钱至三钱。**」【禁忌】「**味苦辣者，陈久者，不堪用；其甘者亦名甘菊，可饮可食亦入药。**」【附加菊叶】「**菊叶解毒之功胜于花，以鲜者良，捣汁敷一切肿毒，亦可内服。**」\n\n**【极重要】菊花的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦甘/平/无毒** |\n| **主治** | **清风热/明目解毒/平肝** |\n| **禁** | **陈久（不越陈越好）** |\n\n**「杭菊小而黄白的最好入药，大朵观赏菊不入药」** ✓✓","o":"RJ-1894 · 《人纪·神农本草经》上经第二十味「鞠华」，原文（PDF 第 110 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"菊花是「越陈越好」的反例","c":"讲义讲「一个极精的反例」：「**【禁忌】的，一般来说菊花陈年太久了不好用；几乎大部分的中药越陈越好——陈皮，我们针灸的艾叶……都是越陈越好。****那个是菊花并不是越陈越好。****等下我们要讲陈皮嘛，陈就是陈年、那个橘子的皮越陈越好。**」\n\n**【极精】菊花是「越陈越好」的反例**\n\n| 药 | 陈 |\n|---|---|\n| **陈皮/艾叶** | **越陈越好** |\n| **菊花** | **陈久不堪用** |\n\n**「大部分中药越陈越好，菊花是例外」——「这是最精的药材学提醒。」**要点：**这一条极精，它是「通则与例外」** ✓✓","o":"RJ-1895 · 《人纪·神农本草经》上经第二十味，讲解（PDF 第 111 页）。"},{"t":"神农本草经·上经：白青、扁青、菖蒲、菊花、人参","h":"人参的本草条目","c":"【本经原文】「**味甘微寒，主补五脏，安精神，定魂魄，止惊悸，除邪气，明目开心益智；久服轻身延年；采根，竹刀刮，曝干，无令见风。**」【产地】「**我国吉林辽宁产者最良……高丽产出丰。**」【性味】「**味甘微苦性微寒无毒。**」【主治】「**人参为大补元气要药，功能治一切衰弱痨瘵，通行周身补五脏之气，泻五脏之火；效益多但功缓；红色曰高丽参，性温而力较峻。**」【甄权】「**主五劳七伤，虚损痿弱，止呕哕，补五脏六腑，保中守神。**」【容川】「**现今人参多人工栽植，药力不如野参；我们可用黄耆甘草代人参，方剂中多以党参代人参。**」【灵胎】「**升提元气，兼补五脏，有崇正去邪之功，然非虚者勿服。**」【用量】「**普通五分至三钱，大剂一两。**」【禁忌】「**肺家有热诸症及阴虚火动之候……均忌，反藜芦。**」\n\n**【极重要】人参的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘微苦/微寒** |\n| **主治** | **大补元气/补五脏/泻五脏之火** |\n| **特** | **效益多但功缓** |\n| **禁** | **肺热/阴虚火动/反藜芦** |\n\n**「人参吵了上千年」——「这是最有争议的药。」** ✓✓\n\n**极精！！\"唐「容川论人参：生于阴而出阳\"** ✅✅\n```\n·生于阴湿之地（阴）\n·发为三枒五叶（阳数）\n→ 阴中出阳 → 化气 → 津液\n```\n\n**「人参生于北方，有阴中之阳药称」——「这是极精的同构推理。」** ✓✓\n\n**须「强「标」**：**「①人参不适用于实证/热证（可致失眠/血压升/出血）；②与抗凝药/降糖药有相互作用；③『人参大补』不等于人人可用」** ✓✓","o":"RJ-1896 · 《人纪·神农本草经》上经第二十一味「人参」，原文（PDF 第 111–112 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"人参的鉴别","c":"讲义讲「一个极实用的鉴别」：「**真正的人参拿起来切的时候，你在烘焙过以后，他拿起来很干很硬；你拿烤炉烤一下，他软掉了、开始切。****切片的时候味道很呛鼻，那个人参的味道很呛鼻，里面的话的确是暗红色的——高丽的红参。****外面很多很恶劣的，萝卜给你染色、然后给你弄干，根本是假的人参。**」\n\n**【极精】人参鉴别三步**\n\n| 步 | 征 |\n|---|---|\n| **干硬** | **真** |\n| **烤后软** | **真** |\n| **切时呛鼻** | **真** |\n| **断面暗红** | **红参** |\n\n**「干硬、烤软、呛鼻、断面暗红」——「这是最实用的四步。」**要点：**这一条极精，它是「伪品鉴别」** ✓✓","o":"RJ-1897 · 《人纪·神农本草经》上经第二十一味「人参」，讲解（PDF 第 112 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"采收忌钢刀","c":"讲义讲「一个极精的细节」：「**到采收的时候、抓人参、抓新鲜的人参的时候都不用金属的刀去，因为金克木，都用竹刀。****晒干了以后、等到统统风干了以后，你拿到手上、然后再辗转卖出来的时候，到你手上你拿来切——你切、用可以用钢刀切没有关系。****在采收的时候要忌用钢刀，怕味道跑掉。**」\n\n**【极精】采收忌钢刀**\n\n```\n采收：竹刀（金克木）\n加工：钢刀可\n```\n\n**「采收用竹刀，怕味道跑掉」——「这条与 n184银器」有对应。**要点：**这一条极精，它是「金克木的应用」** ✓✓","o":"RJ-1898 · 《人纪·神农本草经》上经第二十一味，讲解（PDF 第 112 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"三芽五叶","c":"讲义讲「一个极精的生长形态」：「**你去找人参，一定会到树阴的地方、阴湿的地方去找人参，树根的旁边，三芽五叶。****开出的是三根的枝芽，一个芽上面有五片叶子；人参果是红色的，看起来很像、类似像桑椹一样的小小一味人参果。****看人参，枝子不算，下面那个根就是人参。**」\n\n**【极精】三芽五叶**\n\n```\n三芽五叶 + 红果（似桑椹）\n→ 生于树阴/阴湿处\n```\n\n**「三芽五叶，果红如桑椹」——「这是最准的形态特征。」**要点：**这一条极精，它与 n192「人参生于阴而出阳」同一体** ✓✓","o":"RJ-1899 · 《人纪·神农本草经》上经第二十一味，讲解（PDF 第 113 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"独参汤救逆","c":"讲义讲「一个古法」：「**过去也有人用独参汤，就是救逆的时候，单味一味人参去熬浓汤喝下去，补气嘛、补气。**」\n\n**须「强标**：\n\n| 说 | 判 |\n|---|---|\n| **『独参汤救逆』** | **不能代替急救** |\n| **『大补元气』** | **有限** |\n\n**「独参汤救逆」——「须强标：不能替代休克急救。」**要点：**须「强「标」**：**「①休克须液体复苏 + 升压 + 病因治疗；②大剂人参可致血压升/出血/失眠；③不可用独参汤代替急救」** ✓✓","o":"RJ-1900 · 《人纪·神农本草经》上经第二十一味，讲解（PDF 第 113 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"人参的用法","c":"讲义讲「一个具体的用法」：「**我在用人参的时候，都是病人气血两虚、身体很虚弱的时候我们用人参，其他药还是一样。****其他药可能我是用什么方子，用桂枝汤或者用四逆汤、很多重症的药，那我会加点人参，因为他气血两虚，加点人参下去补他的气血。****人参因为药价会比较贵，我们用人参下去煮，煮完以后，药汤喝了；把人参再拿出来、把它夹出来吃掉，不要浪费掉。**」\n\n**【极重要】人参的用法**\n\n```\n气血两虚 → 用\n  → 加在重症方（桂枝汤/四逆汤）中\n  → 煮后参体吃掉（不浪费）\n```\n\n**「气血两虚才用人参，加了重症方」——「这是最具体的用法。」**要点：**这一条极重要，它是「适应证 + 配伍」** ✓✓","o":"RJ-1901 · 《人纪·神农本草经》上经第二十一味，讲解（PDF 第 113 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"平常吃人参就是浪费弹药","c":"讲义讲「一个极重要的提醒」：「**过去大家因为人参是药王、是很高级的药，你平常都吃人参、每天吃……结果有一天你感冒了，药吃不到啊。****就好像你吃抗生素一样，你每天吃抗生素、等到你真的需要抗生素的时候，不好！****那人参也是一样的：你每天平常没事吃人参、吃吃吃，等到我们真的需要人参的时候——糟糕！人参你吃下去，石沉大海。****所以平常你不用吃人参。**」\n\n**【极重要】平常吃人参 = 浪费弹药**\n\n```\n平常吃 → 真需要时无效（石沉大海）\n```\n\n**「真需要的时候，人参石沉大海」——「这是最精的耐药与浪费。」**要点：**这一条极重要，它与 n183「耐药性」同一主题** ✓✓","o":"RJ-1902 · 《人纪·神农本草经》上经第二十一味，讲解（PDF 第 113 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"中药的双向调节","c":"讲义讲「一个极重要的观点」：「**人参……通行周身补五脏的气，同时能够泻五脏的火，看起来好像是、你又是补又是泄。****中药的好处就在这里，它是个综合。****两个病人主证是一样的，结果这个病人副证、次要的症状是下痢，这个病人是便秘；结果你用主症的药、同样的药一下去的时候，他两个——便秘的人呢大便好了，下痢的人呢不下痢了。****所以中药它有一个中和，不会过与不及，它会自然来调整：多余的排掉、不足的补上去。**」\n\n**【极重要】中药的双向调节**\n\n```\n同一主证 + 相反副证（便秘 vs 下痢）\n  → 同一方 → 双向纠正\n```\n\n**「多余的排掉、不足的补上去」——「这是最精的中和观。」**要点：**须「标」**：**「『同一方治便秘与下痢』须验证（中药是多靶点，但不可据此推论所有病)」** ✓✓","o":"RJ-1903 · 《人纪·神农本草经》上经第二十一味，讲解（PDF 第 114 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"补能恋邪","c":"讲义讲「一个极重要的禁忌机制」：「**一般来说，都是虚证的时候、病人有出现虚证的时候我们用人参；不是虚证、是实证的时候，我们都不用人参。****因为有热证的时候、阴虚火动、像痘疹的时候我们都不用人参。****因为人参有滋补的功能，像补药，病人病症在发散的时候、你用补药一下去，补能恋邪，病就发不出来了。****人参最主要我们是用在虚劳、虚寒，病人刚病完、或者是生病之后、病情严重、身体大虚，还有病人痊愈的时候、气血还没有恢复的时候。**」\n\n**【极重要】补能恋邪**\n\n```\n病在发散（痘疹/表证）\n  → 用补药 → 邪被\"恋\"住\n  → 发不出来\n```\n\n**「补能恋邪，病就发不出来了」——「这是最精的禁忌机制。」**要点：**这一条极重要，它与 n76「不要关门留寇」同一主题** ✓✓\n\n**极精！！\"吃「人参上火 = 里面有热\"** ✅✓\n- **\"如果说有的人吃人参、一吃下去就上火、口腔里面破掉、口干舌燥，人参上火，就因为他里面有热、人参就不适合\"** ✓✓","o":"RJ-1904 · 《人纪·神农本草经》上经第二十一味，讲解（PDF 第 114 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"天门冬的本草条目","c":"【本经原文】「**味苦平，主诸暴风湿偏痹，强肾髓，杀三虫去伏尸；久服轻身益气延年。**」【产地】「**处处有之，近以浙东产者为多；根似麦门冬而色白。**」【主治】「**为清虚热润燥痰要药，主肺气咳逆，风湿偏痹益肌肤，保肺气治消渴、疗咳血。**」【别录】「**保定肺气去寒热养肌肤，利小便，冷而能补。**」【甄权】「**肺气咳逆，喘息促急，肺痿生痈吐脓，除热气通肾，止消渴去热，中风，治湿疥。**」【大明】「**镇心润五脏，补五劳七伤吐血，治咳嗽消痰，去风热烦闷。**」【好古】「**主心病嗌干，心痛渴欲饮，痿躄嗜卧，足下热而痛。**」【用量】「**普通一钱至三钱。**」【禁忌】「**胃虚无热及泻者均忌，忌鲤鱼。**」\n\n**【极重要】天门冬的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **苦/平（一说寒）** |\n| **主治** | **清虚热/润燥痰/肺气咳逆** |\n| **禁** | **胃虚无热/忌鲤鱼** |\n\n**「清虚热、润燥痰，是天门冬的核心」** ✓✓","o":"RJ-1905 · 《人纪·神农本草经》上经第二十二味「天门冬」，原文（PDF 第 115 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"痰的标本","c":"原文引周仲醇「**痰之标在脾胃肺，其本在肾；若非肾家有火、炎上薄肺、煎熬津而成黏腻，则痰何自成。****天冬味苦气寒，能清热保肺、下通于肾，故为消痰止咳必用要药。****观此则天冬治痰乃治本元不足虚火所生之痰，而与外感咳嗽、痰饮咳嗽、虚寒痰嗽、风火痰喘等均不相同。**」\n\n**【极重要】痰的标本**\n\n| 类 | 治 |\n|---|---|\n| **虚火痰（本元不足）** | **天冬（清热保肺+通肾）** |\n| **外感咳嗽** | **不同** |\n| **痰饮咳嗽** | **不同** |\n| **虚寒痰嗽** | **不同** |\n| **风火痰喘** | **不同** |\n\n**「同是咳嗽，四类不同」——「这是最精的鉴别。」**要点：**这一条极重要，它与 n94「咳论」、n43「痰饮」同一体** ✓✓","o":"RJ-1906 · 《人纪·神农本草经》上经第二十二味，原文引周仲醇（PDF 第 115–116 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"天门冬忌鲤鱼","c":"讲义讲「一个极精的考据」：「**最忌——不能跟鲤鱼煮在一起；《神农本草经》里面，有鲤鱼在里面，诸位看药味第 129、那个蠡鱼，实际上现在已经失传了。****根据我的考证……这个蠡鱼是同音的鲤，就是鲤鱼。****天门冬这种药，它是不跟鲤鱼配在一起煮的，配在一起，药性是反的。**」\n\n**【极精】天门冬忌鲤鱼**\n\n```\n蠡鱼（失传）→ 考证为「鲤」\n  → 天门冬 + 鲤鱼 → 药性相反\n```\n\n**「蠡鱼就是鲤鱼」——「这是最精的考证。」**要点：**这一条极精，它是「同音通假 + 相反」** ✓✓","o":"RJ-1907 · 《人纪·神农本草经》上经第二十二味，讲解（PDF 第 116 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"经方为主，温病为附","c":"讲义讲「一个极重要的学术立场」：「**我们在温病和伤寒、温病家跟那个伤寒家，我们并没有说你不要用温病派的药，不是这个意思。****而是说你们的基础应该是在《伤寒论》的基础上面……你如果经方很强很熟练，这个时候你再去看温病派的药，你不会被迷惑、你也不会受到影响。****经方不足的地方，你去用温病的药来补，可以！你不能说把经方舍掉、直接用温病的药，重症你就治不好了、就没有办法启重症、也没有办法救逆。**」\n\n**【极重要】经方为主，温病为附**\n\n```\n《伤寒论》打基础（经方）\n  + 温病药补不足\n✗ 舍经方只用温病（重症治不了）\n```\n\n**「经方为主，温病为附」——「须标：这是派系立场。」**要点：**须「标」**：**「①这是中医内部学术争鸣；②『温病药吃不死人、可以赚钱』是过度概括；③现代中医须结合循证医学」** ✓✓","o":"RJ-1908 · 《人纪·神农本草经》上经第二十二味，讲解（PDF 第 117 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"甘草的本草条目","c":"【本经原文】「**味甘平，主五脏六腑寒热邪气，坚筋骨长肌肉倍力，金创肿解毒；久服轻身延年。**」【性味】「**味甘性平无毒。**」【主治】「**甘草为调合周身气血要药，功能解百毒，补脏腑，泻诸火；在上去痰止咳，在中调和脾胃，在下清热利溲；入和剂则补益，入汗剂则解肌，入凉剂则泻热，入润剂则生津，入峻剂则缓正气，制药之暴性；效益甚多，为诸药之君。**」【别录】「**温中下气，烦满短气，伤脏咳嗽，止渴；通经脉，利气血，解百药毒，为九土之精，安和七十二种石，一千二百种草。**」【容川】「**味甘正入脾，守而不走，补中气，和诸药；根深四五尺，与黄耆同；但黄耆中空，属气分，是得土中之水气；甘草中实，纯得土气之厚，故深长且实，能补脾阴，益胃之阳。**」【倪注】「**甘草缓中，故遇排腹积水时忌用，因其能守，故不利于排水。**」【药征】「**主治急迫，治里急急痛，旁治厥冷烦躁冲逆之症。**」【灵胎】「**生用泻火，解毒炙用，和中益气。**」【用量】「**普通生者五分至钱半，炙者三分至一钱，大剂一两左右。**」【禁忌】「**凡中满人呕家酒家，诸湿肿满及胀满均忌，反大戟甘遂芫花海藻，恶远志忌猪肉。**」\n\n**【极重要】甘草的本草条目**\n\n| 项 | 内 |\n|---|---|\n| **性味** | **甘/平/无毒** |\n| **主治** | **调合气血/解百毒/补脏腑/泻诸火** |\n| **特** | **为诸药之君；生泻火、炙和中** |\n| **禁** | **中满/呕/湿肿/胀；反大戟/甘遂/芫花/海藻** |\n\n**「甘草为诸药之君，效益甚多」** ✓✓","o":"RJ-1909 · 《人纪·神农本草经》上经第二十三味「甘草」，原文（PDF 第 117–118 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"甘草五用","c":"原文【主治】「**入和剂则补益，入汗剂则解肌，入凉剂则泻热，入润剂则生津，入峻剂则缓正气，制药之暴性。**」\n\n**【极精】甘草五用**\n\n| 入 | 效 |\n|---|---|\n| **和剂** | **补益** |\n| **汗剂** | **解肌** |\n| **凉剂** | **泻热** |\n| **润剂** | **生津** |\n| **峻剂** | **缓正气（制暴性）** |\n\n**「同一个甘草，放进五种不同的方，做五种不同的事」——「这是最精的多面手。」**要点：**这一条极精，它是「同药异用取决于配伍」** ✓✓","o":"RJ-1910 · 《人纪·神农本草经》上经第二十三味，原文（PDF 第 118 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"排腹积水时忌甘草","c":"原文【倪注】「**甘草缓中，故遇排腹积水时忌用，因其能守，故不利于排水。**」讲义：「**甘草的性就是缓和，所以当我们用竣剂在攻的时候，有时候怕太过、那个药它一下太过、不回头了，我们加一点甘草，慢一点慢一点。****要让它竣下，甘草要拿掉；所以你如果排水利水的时候、你把甘草放上去，是不对的。**」\n\n**【极重要】排腹积水时忌甘草**\n\n```\n甘草 = 守（缓）\n  → 排水/峻下时须去甘草\n```\n\n**「要让它峻下，甘草要拿掉」——「这条与 n45水气」、n156「水热穴论」有对应。**要点：**这一条极重要，它是「缓与峻的互斥」** ✓✓","o":"RJ-1911 · 《人纪·神农本草经》上经第二十三味，原文及讲解（PDF 第 118–119 页）。"},{"t":"神农本草经·上经：人参（续）、天门冬、甘草","h":"甘草中实，黄耆中空","c":"原文【容川】「**味甘正入脾，守而不走，补中气，和诸药；根深四五尺，与黄耆同；但黄耆中空，属气分，是得土中之水气；甘草中实，纯得土气之厚，故深长且实，能补脾阴，益胃之阳。**」\n\n**【极精】甘草中实，黄耆中空**\n\n| 药 | 形 |
