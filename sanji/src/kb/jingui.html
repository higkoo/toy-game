**脓**变**稠、难排**（**⚠ 故**这个**剂量细节**是**一个**\"**有理由的加减**\"**）；**④⚠ 而\"**一剂两剂就浮到表面**\"这一层**须标**（**⚠ 脓肿**的**形成与消散**需要**时间**（**⚠ 而\"**两天**\"**这个说法**可能**让病人**延误**（**⚠ 故\"**深部脓肿**\"**要**同时**做**影像与抗感染评估**）。** **⚠ 本集按语**：**\"**让脓浮到表面**\"**这个思路**极有用**（**⚠ 因为**它**说明**\"**不是所有脓都要'**压下去**'**\"**（**有些要**\"**托出来**\"**）——**⚠ 而**这一层**在**\"**青春痘**\"**上**也**适用**（**\"**让它自己冒头**\"**（**而不是**\"**硬挤**\"**（**⚠ 因为**硬挤**会**把感染**往深处**推**）。","o":"RJ-2994 · 人纪·金匮要略·疮痈肠痈浸淫病脉证并治第十八（PDF 第584页）"},{"t":"五、\"脓头出了，刺破拔一拔\"","h":"一个\"该不该动\"的边界","c":"风险——**讲义描述了\"脓头出来后\"的处理，而这一层**须划一条线**，须照录并标**：\"**'**当浮到表面上时，你看到**脓头出了，就把它刺破用火罐拔一拔，将脓吸出**'。'**找不到火罐就抓一条吸血虫吸**'。**\" **须说明（四层）**：**①\"**脓头出了、才处理**\"这一层**极重要** ✓（**⚠ \"**脓头**\"**＝**\"**已经液化、位置在皮下**\"**（**⚠ 故\"**该不该刺**\"**的**判据**是**\"**有没有脓头**\"**（**⚠ 而\"**没有脓头的红肿**\"**（**不能**刺**）；**②⚠ 而\"**火罐拔**\"这一层**有一些道理**（**⚠ 负压吸引**可以**帮助**引流**（**⚠ 而**现代**用**\"**切开 + 引流**\"**（**⚠ 故\"**穿刺/切开**\"**（要**在**无菌条件下做**）；**③⚠ 而\"**找不到火罐就抓一条吸血虫吸**\"这一层**须明确删除**（**⚠ 吸血虫**可以**传播疾病**（**⚠ 且**无法**控制**吸引量**（**⚠ 故**这一句**是**\"**一个不能照做的建议**\"**）；**④⚠ 而**这一段的**安全边界**是**：**\"**不要自己刺破**\"**（**⚠ 因为**家庭**无法**无菌**（**⚠ 而\"**自行挤压/刺破**\"**会把**感染**推向**深部**（**⚠ 故\"**有脓头**\"**（**应该**去**门诊**处理**（**而不是**\"**在家挑破**\"**）。** **⚠ 本集按语**：**\"**脓头**\"**这个词**是**一个**极好的**\"**家庭判断点**\"**（**⚠ 因为它**肉眼可见**（**⚠ 故\"**红肿有脓头**\"**（**就医处理**（**\"**红肿无脓头**\"**（**观察 + 热敷**（**⚠ 而\"**不要挤**\"**这三个字**（**是**最值得记住的一句** ✓）。","o":"RJ-2995 · 人纪·金匮要略·疮痈肠痈浸淫病脉证并治第十八（PDF 第584页）"},{"t":"六、\"但能前，不能却\"","h":"八个字，描述了一个极具体的步态","c":"定义——**原文用八个字描述\"趺蹶\"，而讲义把它讲成了一套**极具体的动作**，须照录**：\"**'**师曰：病趺蹶，其人但能前，不能却，刺腨入二寸，此太阳经伤也**'。**\" **讲义的展开**：\"**'什么叫做「趺蹶」？这是走路的一种病症**'。'**病人向前走没有问题，可是病人不能停**——**一停下就好像要摔倒，必须赶快往前走几步才能稳住身体**'。'**还有的病人要左转时，必须先在原地转过身，然后才行再走**'。'**脚不能随意转动，就是趺蹶**'。'**你如果没有看过这个病，你根本不知道它在讲什么**——**那有幸呢，我看过**'。'**这个人呢，但能前不能却——只能往前走、不能退后，不但不能退后，还刹不住车**'。'**还有走走走撞到墙**'。**\" **须说明（四层）**：**①\"**能前不能却**\"这四个字**极准** ✓✓（**⚠ 它**描述的**是**\"**步态的三个特征**\"**（**①**起步向前**（**②**不能止步**（**③**不能后退/转身**）**（**⚠ 故它**是**\"**一个可以用动作复现的描述**\"**）；**②⚠ 而\"**一停就要摔倒、必须赶快往前走几步**\"这一层**极重要** ✓✓（**⚠ 它**是**\"**慌张步态（festinating gait）**\"**的**典型描述**（**⚠ 而**这一层**在**帕金森病**上**极为经典**（**⚠ 故\"**老人家走路越走越快、停不下来**\"**（**要**想到**帕金森**）；**③⚠ 而\"**要左转必须先在原地转身**\"这一层**也**极精** ✓（**⚠ 它**是**\"**转身困难**\"**（**⚠ 而**这一层**在**帕金森、**小脑病变、**脊髓小脑共济失调**上**都**可见**（**⚠ 故\"**转身要分几步**\"**（**是**一个**可以问出来的症状**）；**④⚠ 而\"**刺腨入二寸**\"这一层**须标**（**⚠ 承山穴深刺**有**伤及血管/神经的风险**（**⚠ 故**本集**须注明**\"**不可自行下针**\"**（**⚠ 而**这一层**在**任何\"**针灸**\"**的建议上**都**适用**）。** **⚠ 本集按语**：**\"**但能前，不能却**\"**这八个字**是**全册**最好的一个**步态描述**（**⚠ 因为**它**不是**\"**走路异常**\"**（**是**\"**三个具体动作**\"**（**⚠ 而**任何一个**家属**都**能**观察到**（**⚠ 故\"**老人走路刹不住车**\"**（**是一个**值得**认真对待的**信号**（**⚠ 而**它**不是**\"**老了**\"**。","o":"RJ-2996 · 人纪·金匮要略·趺蹶手指臂肿转筋阴狐疝蚘虫病脉证治第十九（PDF 第599页）"},{"t":"七、\"委中与承山之间出现青筋\"","h":"一个\"受伤后半天内\"可以看见的体征","c":"要点——**讲义给了一个**极具体的观察**（**受伤后的皮下瘀血**），须照录**：\"**'**太太小姐穿高跟鞋时，走楼梯不小心摔倒，刚好伤到尾椎骨**'。'**如果早上受伤、下午就到你的诊所时**——**你看她的委中和承山的中间这一带会有青筋出现，表示有瘀血堵到**'。'**此时不要扎针、用放血针将这青筋表皮刺破，挤一点血出就好了**'。**\" **须说明（四层）**：**①\"**委中与承山之间的青筋**\"这个位置**极具体** ✓（**⚠ 委中**在**腘窝**（**承山**在**小腿后**（**⚠ 而**这一带**正是**\"**下肢静脉/腘静脉**\"**的**走行区**（**⚠ 故\"**青筋**\"**＝**\"**皮下静脉显露或瘀血**\"**）；**②⚠ 而\"**早上受伤、下午就有青筋**\"这一层**极准**（**⚠ 皮下出血**在**数小时内**就会**显现**（**⚠ 故\"**时间窗**\"**这个细节**（**说明**作者**真的**看过**）；**③⚠ 而\"**不要扎针、用放血针**\"这一层**须明确标**（**⚠ 放血**在**家庭**极**危险**（**感染、**出血不止、**伤及血管**）——**⚠ 故**这一条**应改为**\"**看到青筋 → 就医评估**\"**（**⚠ 而**不要**自行**刺破**）；**④⚠ 而\"**这是瘀血堵到**\"这个判断**在**\"**外伤后皮下出血**\"**上**是**对的**（**⚠ 而**它的**处理**（**\"**放血**\"**）**须**由**医疗人员**决定**。** **⚠ 本集按语**：**\"**委中与承山之间**\"**这七个字**是**一个**\"**可以直接看**\"**的**部位**（**⚠ 而它**提示**：**\"**跌倒后小腿后面有没有青紫**\"**（**是一个**可以自己查**的位置**（**⚠ 故\"**摔了一跤**\"**后**（**看**\"**小腿后、**脚踝、**膝盖后**\"**（**⚠ 而**看到青紫**（**要**就医**（**而不是**\"**放点血**\"**）。","o":"RJ-2997 · 人纪·金匮要略·趺蹶手指臂肿转筋阴狐疝蚘虫病脉证治第十九（PDF 第599页）"},{"t":"八、\"承山穴，用三寸针\"","h":"一个关于\"针具长度\"的细节","c":"方法——**讲义给了一个**极具体的针具与穴位**，须照录并标**：\"**'**这个时候可以扎针，扎**承山穴**——**承山穴我们下针时都使用很长的三寸针**'。**\" **须说明（四层）**：**①\"**三寸针**\"这个细节**极具体**（**⚠ 它**说明**\"**不同的穴位**要**不同的针具**\"**（**⚠ 而\"**承山**\"**位于**小腿后肌群**（**⚠ 故**需要**较长**的针**才能**得气**）；**②⚠ 而\"**承山**\"这个选穴**也**极准**（**⚠ 承山**是**\"**治疗小腿转筋、**腰背痛、**痔疮**\"**的**常用穴**（**⚠ 而\"**转筋**\"**（**小腿抽筋**）**正是**后文**要讲的**病**）；**③⚠ 而\"**三寸针**\"这一层的**风险**须标**（**⚠ 承山**深刺**可能**伤及**胫后动脉/神经**（**⚠ 故**必须**由**专业人员**操作**（**⚠ 而**本集**声明**：**\"**不可自行下针**\"**）；**④⚠ 而这一层**的**教学价值**是**：**它**把**\"**针具**\"**与**\"**部位**\"**配了起来**（**⚠ 而**这一层**在**任何**针灸教学里**（**都**是**第一步**（**⚠ 故\"**多深的穴位、多长的针**\"**（**是**一个**必须**先想清楚的问题**）。** **⚠ 本集按语**：**\"**三寸针**\"**这三个字**最值得注意**的是**它**隐含的风险**（**⚠ 因为**\"**深刺**\"**可以**\"**得气更强**\"**（**也可以**\"**伤得更重**\"**（**⚠ 故**读古书**时**（**\"**深刺**\"**这一类指示**（**要**配**\"**现代解剖**\"**读**（**⚠ 而**不能**照字面**执行** ✓）。","o":"RJ-2998 · 人纪·金匮要略·趺蹶手指臂肿转筋阴狐疝蚘虫病脉证治第十九（PDF 第599页）"},{"t":"九、\"走路像鸭子，这种人主大贵\"","h":"一段必须剔除的相术","c":"风险——**讲义在解释\"趺蹶\"时，滑入了一套**相术**，须照录并整段剔除**：\"**'相书上面称这做「**禹步**」**'。'**相传大禹在治水的时候，因为长年站在水里面，寒湿侵入骨节间的地方，就得病的原因**'。'**结果大禹以后走路就变成这样子了**'。'**过去叫做禹步——走路像鸭子一样，鸭子的脚是不会交叉的**'。'**这种人主大贵**'。**\" **须说明（四层）**：**①\"**禹步**\"这个典故**很有意思**（**⚠ 它**把**一个**\"**异常步态**\"**归到了**\"**大禹治水受寒湿**\"**（**⚠ 而**这一层**是**\"**一个传说**\"**（**不是**\"**病因学**\"**）；**②⚠ 而\"**这种人主大贵**\"这一层**须明确否定**（**⚠ 步态**与**\"**贵贱**\"**没有**任何关系**（**⚠ \"**鸭子步**\"**在**医学上**是**\"**肌营养不良、**髋关节病变、**脊髓病变**\"**的**表现**（**⚠ 故**它**是**\"**一个需要查的信号**\"**（**不是**\"**一个吉兆**\"**）；**③⚠ 而\"**大禹走路像鸭子**\"这个画面**有趣**（**⚠ 而**它**的**危险**是**：**如果**有人**信了\"**主大贵**\"**（**就**不会去**查**\"**为什么走路变形**\"**（**⚠ 故**这一句**可能**延误**一个**可治的病**）；**④⚠ 而**本集的处置**是**：**保留\"**禹步**\"**作为**\"**一个古称**\"**（**删除\"**主大贵**\"**与**\"**贵人相**\"**（**⚠ 并注明**\"**步态异常要查神经/肌肉/骨骼，与贵贱无关**\"**）。** **⚠ 本集按语**：**\"**相术**\"**在这一篇里**又出现了一次**（**⚠ 而**它与**第 n47 条\"**天仓凹陷＝小偷**\"**是**同一个模式**（**⚠ 故**这本讲义的**\"**滑出医学边界**\"**（**有**一个**固定的方向**：**从\"**一个体征**\"**滑到**\"**一个人的命**\"**（**⚠ 而**每一次**本集**都**必须**把它**切回来**（**回到\"**体征**\"**本身**。","o":"RJ-2999 · 人纪·金匮要略·趺蹶手指臂肿转筋阴狐疝蚘虫病脉证治第十九（PDF 第599页）"},{"t":"十、这一篇的病，都是\"小病\"","h":"一篇被跳过的内容，与它的价值","c":"要点——**第十九篇的篇名里有六个病**（趺蹶、手指臂肿、转筋、阴狐疝、蚘虫），而**它们**有一个共同点**：都是\"**小病**\"，须照录篇名与结构**：\"**'**趺蹶手指臂肿转筋阴狐疝蚘虫病脉证治第十九**'。**\" **须说明（四层）**：**①这一篇的**六个病**都**不是**\"**要命的病**\"**（**⚠ 而**它们**恰好**是**\"**日常最常见**\"**的一组**（**⚠ 故这一篇的**价值**在**\"**处理小毛病**\"**（**不在**\"**攻坚**\"**）；**②⚠ 而\"**转筋**\"（**小腿抽筋**）**极常见**（**⚠ 而**它的**原因**包括**\"**缺钙、**脱水、**电解质紊乱、**下肢动脉病变、**药物（利尿剂/他汀）**\"**（**⚠ 故\"**夜里小腿抽筋**\"**（**要**查**\"**钙、镁、钾、**血管**\"**（**⚠ 而**不是**\"**只补钙**\"**）；**③⚠ 而\"**蚘虫**\"（**蛔虫**）**这一层**在**今天**已**少见**（**⚠ 而**它的**方**（**甘草粉蜜汤**）**是**\"**甜味诱虫**\"**（**⚠ 故\"**用甜味把虫引出来**\"**（**是**一个**极巧的思路**（**⚠ 而**现代**用**驱虫药**）；**④⚠ 而\"**阴狐疝**\"这一层**＝**\"**腹股沟疝**\"**（**⚠ \"**偏有小大、时时上下**\"**（**⚠ 而**这一层**在**今天**是**\"**外科手术**\"**（**⚠ 故\"**疝气**\"**不要**\"**等它自己回去**\"**（**⚠ 因为**嵌顿**可以**要命**）。** **⚠ 本集按语**：**这一篇**最值得记的是**\"**小病清单**\"**（**⚠ 因为**\"**趺蹶、**抽筋、**疝气、**蛔虫**\"**（**⚠ 这些**在**今天的门诊**里**每天**都**在**出现**（**⚠ 故\"**读古书**\"**不是**只读**\"**大病**\"**（**\"**小病**\"**里**有**更多**可以**直接用**的东西** ✓）。","o":"RJ-3000 · 人纪·金匮要略·趺蹶手指臂肿转筋阴狐疝蚘虫病脉证治第十九（PDF 第599页）"},{"t":"一、\"平脉 + 阴脉小弱 + 渴不能食 + 无寒热 = 妊娠\"","h":"一个\"没有验尿\"时代的诊断","c":"定义——**原文给了一个**四联的判断**，而它**在没有验尿的年代**极实用，须照录**：\"**'**师曰：妇人得平脉，阴脉小弱，其人渴，不能食，无寒热，名妊娠，桂枝汤主之**'。**\" **讲义的展开**：\"**'过去中医没有验尿技术，中医又要如何知道妇女怀孕了？这段是过去诊断是否怀有身孕的方法**'。'**第一个是「得平脉」——凡是女人家怀孕时，脉很正常，只有阴脉稍微弱一点**'。'**为什么是阴脉呢？因为阴脉是尺脉，也讲的是左手的脉，就是血脉**'。'**就是有胎——妇女刚怀孕时血比较弱**'。'**加上病人的症状是「渴，不能食」——嘴巴里面很渴，但是东西却吃不下去**'。'**又没有寒热现象，就是没有表症**'。'**这就表示此女怀孕了**'。**\" **须说明（四层）**：**①四个条件**极清楚**：\n\n| 项 | 表现 |\n|---|---|\n| 脉 | 平脉（整体正常），唯尺脉小弱 |\n| 渴 | 口渴 |\n| 食 | 不能食（吃不下） |\n| 寒热 | 无（排除表证） |\n\n**——⚠ 故这是**一个**\"**用排除法**\"**的诊断**（**⚠ 而\"**无寒热**\"**是**关键的一步**（**⚠ 因为**它**排除了**\"**感冒/感染**\"**（**⚠ 故\"**胀气 + 吃不下**\"**若**同时**有发热**（**要**先想**\"**胃肠炎**\"**）；**②⚠ 而\"**渴 + 不能食**\"这一层**极准** ✓（**⚠ 早孕**的**典型**是**\"**恶心、厌食、口干**\"**（**⚠ 而\"**渴**\"**可能**与**\"**孕早期血容量变化**\"**相关**（**⚠ 故**这**四个字**是**\"**早孕反应**\"**的**古代版**）；**③⚠ 而\"**阴脉小弱**\"这一层**须标**（**⚠ 早孕**的**脉搏变化**（**在**现代**是**\"**滑脉**\"**（**而\"**尺脉小弱**\"**是**另一套描述**（**⚠ 故**两者**不必**都对**（**⚠ 而**它**的**价值**是**\"**提供了一个**\"**可能要查**\"**的提示**）；**④⚠ 而\"**名妊娠**\"之后的**处理**是**下一层**（**见第三条**）。** **⚠ 本集按语**：**这一条**最值得记的是**\"**用排除法做诊断**\"**（**⚠ 因为**它**不依赖**\"**一个特异指标**\"**（**它依赖**\"**一组普通表现**\"**（**⚠ 故\"**育龄女性、月经停了、吃不下、没发热**\"**（**第一件事**是**验孕**（**⚠ 而**不是**\"**治胃**\"**）——**⚠ 这个动作**在**今天**只要**几块钱**（**⚠ 而它**能**避免**\"**把早孕当胃病治**\"**。","o":"RJ-3001 · 人纪·金匮要略·妇人妊娠病脉证并治第二十（PDF 第609页）"},{"t":"二、\"左手主血、右手主气\"","h":"一套关于\"气血比例\"的说法，与\"能不能怀\"的条件","c":"要点——**讲义把\"左右手的脉\"与\"气血\"配了起来，并据此说\"能不能怀孕\"，须照录**：\"**'我们摸她，两手一起摸，病人坐在你对面，两个手一起摸**'。'**女人呢，左边是血，右边是气**'。'**正常的太太小姐呢，左手的脉要比右手脉大——血要大于气**'。'**男人呢，气脉，右手要比左手大**'。'**我们看到这个太太不孕症来，结果她右手的脉大、左手的脉小，气脉大于血脉，她就不会怀孕**'。'**正常人怀孕，那是血旺气衰的体质的时候，你会怀孕——因为我们要靠血来养胎**'。'**补合谷、泄三阴交……合谷是气穴，三阴交是血的穴道**'。'**你如果是补合谷、是补气、泄血的话，是泄胎、堕胎**'。'**你如果是泄合谷、补三阴交，是安胎**'。**\" **须说明（四层）**：**①\"**左血右气**\"这一套**是**一个**\"**双手对比**\"**的方法**（**⚠ 而它**的**价值**是**\"**两只手一起摸**\"**（**⚠ 故\"**对比**\"**比\"**单摸**\"**有信息**（**⚠ 而\"**左右是否对称**\"**在**\"**锁骨下动脉狭窄、**大动脉炎**\"**上**是**一个**真实体征**）；**②⚠ 而\"**血旺气衰才能怀**\"这一层**须标**（**⚠ 怀孕**取决于**\"**排卵、**输卵管、**精液、**内膜**\"**（**⚠ 而\"**气血**\"**不是**\"**受孕率**\"**的**指标**（**⚠ 故**这一段**应读作**\"**营养状态会影响生育**\"**（**⚠ 而\"**营养状态**\"**确实**与**\"**排卵**\"**相关**（**如**体重过低/过高都会影响排卵**））；**③⚠ 而\"**补合谷、泄三阴交＝堕胎**\"这一层**极危险**（**⚠ 这是一个**传统的\"**禁穴**\"**说法**（**⚠ 而**它**在**现代**没有**可靠证据**（**⚠ 故**本集**须明确**\"**不可自行操作**\"**（**⚠ 而**孕妇针灸**应**由**有经验的专业人员**做**）；**④⚠ 而\"**泄合谷、补三阴交＝安胎**\"这一层**也**须标**（**⚠ \"**安胎**\"**的**第一件事**是**\"**查原因（**黄体功能、**甲状腺、**免疫、**解剖**）**（**⚠ 而**不是**\"**扎针**\"**）。** **⚠ 本集按语**：**\"**两只手一起摸**\"**这个动作**本身**极好**（**⚠ 因为**它**能**发现**\"**不对称**\"**（**⚠ 而\"**不对称**\"**是**一个**真实的血管体征**（**⚠ 故\"**摸脉要摸两只手**\"**（**是**一条**可以学的习惯** ✓（**⚠ 而\"**左血右气**\"**这个配属**（**是**旧说**）。","o":"RJ-3002 · 人纪·金匮要略·妇人妊娠病脉证并治第二十（PDF 第611~612页）"},{"t":"三、\"不孕症没有一定的处方\"","h":"一句极重要的观念：把身体调正常，自然就怀","c":"要点——**讲义明确否定了\"一张方治不孕\"，而这一层**极重要**，须照录**：\"**'不孕症没有一定的、一定特别的处方**'。'**用我们经方有个处方，后面会介绍到温经汤——她并不是每个人都要温经汤，而是看她的症状来开的处方**'。'**我在临床上面治疗不孕症的时候，常常是按照病人：你现在是便秘、大柴胡汤证，我就开大柴胡**'。'**你是气喘多少年，我就开射干麻黄汤**'。'**有的时候这个病人是静脉瘤……我们用芍药甘草汤、去杖汤之类的，她过一两个月就怀孕了**'。'**都正常的人才会怀孕**'。'**太太你会怀孕是正常嘛**'。**\" **须说明（四层）**：**①\"**不孕症没有固定方**\"这一层**极重要** ✓✓（**⚠ 它**把\"**不孕**\"**从**\"**一个病**\"**改成了**\"**一个结果**\"**（**⚠ 而\"**结果**\"**要**找**\"**原因**\"**（**⚠ 故\"**治不孕**\"**＝**\"**把身体调回正常**\"**（**而不是**\"**吃促孕药**\"**）；**②⚠ 而\"**你是便秘就开大柴胡、你是气喘就开射干麻黄汤**\"这一层**极具体**（**⚠ 它**示范了**\"**随证治之**\"**（**⚠ 而**这一层**在现代**有对应**（**⚠ \"**肥胖 + 胰岛素抵抗 → 减重可改善排卵**\"**（**\"**甲减 → 补甲状腺素可改善排卵**\"**（**⚠ 故\"**治原发病**\"**（**确实**能**提高**受孕率** ✓）；**③⚠ 而\"**都正常的人才会怀孕**\"这一句**极精** ✓✓（**⚠ 它**是**一个**\"**诊断式的思维**\"**（**⚠ 即：**不怀孕**是**\"**身体某处不正常**\"**的**信号**（**⚠ 而**找那个\"**不正常**\"**（**比**\"**催孕**\"**重要**）；**④⚠ 而\"**一两个月就怀孕了**\"这一层**须标**（**⚠ 时间**因人而异**（**⚠ 而**35 岁以上**的**备孕**有**明确的时间窗**（**⚠ 故\"**试一年未孕**\"**（**要**系统检查**（**而不是**\"**再等等**\"**）。** **⚠ 本集按语**：**这一段**最值得记的是\"**都正常的人才会怀孕**\"**（**⚠ 因为**它**把**\"**不孕**\"**从**\"**一个羞耻**\"**变成了**\"**一个提示**\"**（**⚠ 而\"**提示**\"**是**可以**被**检查的**（**⚠ 故\"**备孕一年没消息**\"**（**不是**\"**命不好**\"**（**是**\"**该查一查**\"**（**⚠ 而**要查的东西**很具体**（**排卵、**输卵管、**精液、**甲状腺、**内膜**）。","o":"RJ-3003 · 人纪·金匮要略·妇人妊娠病脉证并治第二十（PDF 第611页）"},{"t":"四、\"脉能判男女\"——一处自相矛盾的说法","h":"两段话互相打脸，且结论不成立","c":"风险——**讲义在同一篇里给了两套**互相矛盾**的\"辨男女\"法，须照录并核**：\"**'第二个是看尺脉：**如果左边的尺脉跳动的比较强，代表怀的是男的；右边的尺脉跳动的比较强，代表怀的是女的**'。**\" **而同一篇稍后又写**：\"**'那在脉上面呢：**左手边是女孩子，右手边是男孩**'。**\" **还有**：\"**'如果妈妈怀的是儿子，**肚子是会比较尖一点，上面高一点**；**如果是女儿的话，肚子比较下面**'。**\" **以及**：\"**'只要拍身体侧面的 X 光片，**跟妈妈面对面坐就是男的，同方向就是女的，这百分之百准确**'。**\" **须说明（四层，逐层否）**：**①\"**左尺强＝男**\"**与\"**左手＝女、右手＝男**\"**这两句**直接矛盾**（**⚠ 同一页之内**（**⚠ 故**这不是**\"**两个流派**\"**（**是**\"**同一段话里的自相矛盾**\"**（**⚠ 而**一矛盾**就**说明**\"**两套都不成立**\"**）；**②⚠ 而\"**肚子尖＝儿、肚子低＝女**\"这一层**是**民间说法**（**⚠ 腹型**取决于**\"**胎位、**孕妇体型、**腹肌、**羊水**\"**（**⚠ 与**性别**无关**（**⚠ 故**它**不成立**）；**③⚠ 而\"**拍侧面 X 光片、百分之百准确**\"这一层**须**明确否定**（**⚠ 首先**性别**不能**靠**\"**胎儿的朝向**\"**判断**（**⚠ 其次**孕期**做**X 光**是**有害的**（**⚠ 故\"**百分之百**\"**这四个字**（**是**一个**危险的自信**）；**④⚠ 而**正确的一层**是**：**现代**的**无创产前检测**（**NIPT，**孕 10 周后**）**可以**从**母血**中的**胎儿 DNA**判断性别**（**准确率 >99%**）**（**超声**在**孕 15~20 周**后**也**较可靠**（**⚠ 故\"**想知道性别**\"**（**有**安全、准确的办法**（**⚠ 而**不是**\"**摸脉/看肚子**\"**。** **⚠ 本集按语**：**这一段**是**一个**\"**可以拿来自测**\"**的例子**（**⚠ 因为**同一篇里**两句话**互相**矛盾**（**⚠ 故**遇到**\"**祖传秘法**\"**（**先找**\"**它自己有没有矛盾**\"**（**⚠ 而**一有矛盾**（**就**不必**再**往下验证**（**⚠ 这是**一个**极省时间的**判断法** ✓。","o":"RJ-3004 · 人纪·金匮要略·妇人妊娠病脉证并治第二十（PDF 第609~612页）"},{"t":"五、\"则绝之\"","h":"三个字，是\"怀孕不是病\"的最强表达","c":"要点——**原文最后三个字**极重**，而讲义给了两个解释**，须照录**：\"**'**于法六十日当有此证；设有医治逆者，却一月加吐下者，则绝之**'。**\" **讲义的展开**：\"**'最后一句说「**则绝之**」——就是**你不要用任何其他药物给孕妇**'。'「**则绝之**」**就是**不吃药、不用看医生**，**叫做「则绝之」**'。'**如果你把她当成病治，一定会反逆**——**因为她根本就没有病**'。'**所以如果不知道是怀孕，而继续吃药，妇人又吐下不止时，就会流产**'。'**这个「则绝之」，我们翻译上有两个解释**'。'**第一个就是：不用看医生，什么都不用看，因为是自然现象**'。'**还一个就是：像你误治的话，小孩子可能会流产，所以你要注意一点**'。'**这个因为怀孕呢，不是病，不是病**——**所以你可以让她去验尿啊，或者是做一些产前检查，这都无所谓**'。**\" **须说明（四层）**：**①\"**则绝之**\"这三个字**极重** ✓✓（**⚠ 它**说的是**\"**断掉一切不必要的医药**\"**（**⚠ 因为**\"**怀孕不是病**\"**（**⚠ 故**\"**把它当病治**\"**（**会**\"**反逆**\"**（**⚠ 而**这一层**在**\"**孕早期误用攻下/催吐药 → 流产**\"**上**是**真的** ✓）；**②⚠ 而\"**不吃药、不用看医生**\"这一层**须标**（**⚠ 它**指**\"**不需要**\"**为**\"**孕吐**\"**吃**\"**各种药**\"**（**⚠ 而**不是**\"**不产检**\"**（**⚠ 故**讲义**紧接着说**\"**可以让她验尿、做产前检查**\"**（**⚠ 这两句**并**不矛盾**（**⚠ 而**它**划出了一条线**：**\"**不治'**不是病的病**'\"**vs**\"**该做的检查要做**\"**）；**③⚠ 而\"**根本就没有病**\"这一句**极重要**（**⚠ 它**是**一个**\"**看问题的角度**\"**（**⚠ 早孕反应**是**\"**生理**\"**（**不是**\"**病理**\"**（**⚠ 故\"**吐得厉害**\"**（**要**分**\"**正常孕吐**\"**与**\"**妊娠剧吐**\"**（**⚠ 后者**要**住院补液**（**⚠ 而不是**\"**绝之**\"**）；**④⚠ 而\"**以为胃里堵到了，用瓜蒂散、盐汤催吐**\"这一层**极危险**（**⚠ 孕早期**误用**催吐/攻下**（**可以**导致**流产**（**⚠ 故\"**育龄女性、月经停了、胃不舒服**\"**（**第一件事**是**验孕**（**⚠ 而**不是**\"**按胃病治**\"**）。** **⚠ 本集按语**：**\"**怀孕不是病**\"**这五个字**是**这一篇的**地基**（**⚠ 而它**推出**两条**极具体的建议**（**①**不要**为**\"**早孕反应**\"**乱吃药**；**②**该做的产检**要做**（**⚠ 故\"**则绝之**\"**不是**\"**什么都不管**\"**（**是**\"**不要把它当病来治**\"** ✓。","o":"RJ-3005 · 人纪·金匮要略·妇人妊娠病脉证并治第二十（PDF 第610~611页）"},{"t":"六、\"桂枝汤调和阴阳\"","h":"一首解表方，为什么能治早孕反应","c":"要点——**讲义解释了\"为什么早孕反应可以用桂枝汤\"，而这一层**极有意思**，须照录**：\"**'张仲景在这里为什么要用桂枝汤？**'。'**过去我们学的桂枝汤是解肌用的、解表的，能调和营卫，也就是让皮表上的气血能够通和**'。'**桂枝汤到身体里面也是调和阴阳用的**——**就是说桂枝汤能够让脏和腑之间关系重新作调整**'。'**因为妈妈在怀孕后，正常的身体内多了个胎儿在里面，这个时候脏腑功能就不是很协调**——**因为同时要养胎，身体需要重新调适过**'。'**这个时候只有桂枝汤可以帮助孕妇调和阴阳，使脏腑之间能够互相沟通**'。'**所以就很简单的用桂枝汤就好了**'。'**桂枝汤是调和阴阳最好的处方，绝对不会伤到正气，而是保护正气、培养正气**'。**\" **须说明（四层）**：**①\"**身体多了一个人，需要重新调适**\"这个说法**极有意思** ✓（**⚠ 它**把**\"**早孕反应**\"**解释成**\"**系统在重新平衡**\"**（**⚠ 而这一层**在**\"**孕早期血容量、**激素、**代谢的剧烈变化**\"**上**确实**有对应**）；**②⚠ 而\"**桂枝汤调和营卫**\"这一层**是**中医的**一个**核心说法**（**⚠ 而**它在**\"**调节自主神经、**改善循环**\"**上**有**一些**现代研究**（**⚠ 故**这是**一个**\"**温和的调节**\"**（**不是**\"**强力干预**\"**）；**③⚠ 而\"**绝对不会伤到正气**\"这一层**须标**（**⚠ 任何药**都**有**适应与禁忌**（**⚠ 故\"**绝对**\"**这两个字**（**不能**照信**（**⚠ 而**桂枝汤**在**\"**高热、**出血、**阴虚火旺**\"**上**也**要**慎**）；**④⚠ 而\"**没事就吃吃桂枝汤**\"（**同段**）**这一层**须明确否定**（**⚠ \"**没事吃药**\"**不是**\"**养生**\"**（**⚠ 故**本集**删除**\"**常服桂枝汤增强免疫**\"**（**保留**\"**在'**有那个证**'**时用**\"**）。** **⚠ 本集按语**：**\"**多了一个人，需要重新调适**\"**这个解释**最值得记**（**⚠ 因为**它**不玄**（**它**是**\"**一个系统多了一个负载**\"**（**⚠ 而**这一层**在**\"**孕期所有不舒服**\"**上**都**能**用**（**⚠ 故\"**早孕反应**\"**（**不是**\"**病**\"**（**是**\"**系统在适配**\"**（**而适配**需要**\"**时间 + 支持**\"**，**不需要**\"**猛药**\"**）。","o":"RJ-3006 · 人纪·金匮要略·妇人妊娠病脉证并治第二十（PDF 第610页）"},{"t":"七、\"蹲着生，比躺着生顺\"","h":"一个被现代重新发现的体位","c":"要点——**讲义比较了\"蹲姿\"与\"躺姿\"分娩，而这一层**在现代已被重新验证**，须照录**：\"**'过去中医接生时，孕妇都是采蹲姿生产的**——**因为蹲着有物理作用，小孩出会很顺利**'。'**现在孕妇是躺在手术台上，西医叫孕妇像排粪一样用力排**——**结果造成肛门直肠脱出，小孩子还是没出**'。'**现代很多妇女生完小孩后都得到痔疮，或是脱肛**——**就是因为接生不当造成的后遗症**'。'**中医采蹲姿接生是对的**——**现在（有的地方）在研究，让妈妈在浴缸里泡在水中接生，这也是一样的意思**'。**\" **须说明（四层）**：**①\"**蹲姿有物理作用**\"这一层**极准** ✓✓（**⚠ 蹲/立位**使**骨盆出口径线增大**（**⚠ 而**重力**帮助**胎头下降**（**⚠ 故\"**直立位分娩**\"**在**现代**有**RCT 支持**（**第二产程缩短、**会阴撕裂减少、**剖宫产率降低**）——**⚠ 故\"**中医采蹲姿接生是对的**\"**这一句**（**在方向上是对的** ✓）；**②⚠ 而\"**躺姿导致痔疮/脱肛**\"这一层**须标**（**⚠ 妊娠本身**（**子宫压迫、**便秘、**激素**）**是**痔疮的**主要原因**（**⚠ 而\"**接生体位**\"**只是**其中一个因素**（**⚠ 故\"**因为接生不当**\"**这个单一归因**过头了**）；**③⚠ 而\"**泡在水中接生**\"这一层**也**有依据**（**⚠ 水中分娩**在**部分**国家**使用**（**⚠ 而**它的**安全边界**很明确**（**⚠ 故\"**一样的意思**\"**这个类比**（**是**\"**用重力 + 放松**\"**）；**④⚠ 而这一层的**现实意义**极大**（**⚠ 因为**它**指向**\"**分娩体位**\"**这个**可以选的变量**（**⚠ 故\"**生孩子可以不用躺着**\"**（**是一个**可以问医生的问题**（**⚠ 而**WHO**明确**建议**\"**鼓励产妇采取自己选择的体位**\"** ✓）。** **⚠ 本集按语**：**这一段**最值得记的是\"**体位是一个变量**\"**（**⚠ 因为**它**不需要**新药、新设备**（**只需要**\"**换一个姿势**\"**（**⚠ 而\"**换姿势**\"**能**改变**\"**力学**\"**（**⚠ 故\"**最便宜的改变**\"**（**常常**是**\"**最被忽略的**\"** ✓。","o":"RJ-3007 · 人纪·金匮要略·妇人妊娠病脉证并治第二十（PDF 第610页）"},{"t":"八、\"先问她前三个月的月经\"","h":"一个\"怀孕还是长瘤\"的鉴别，只靠问","c":"方法——**原文要区分\"怀孕\"与\"癥病\"，而讲义把它落到了**一个问句**，须照录**：\"**'这个条辨实际上讲的是：我们如何区分病人是怀孕了？还是子宫里面长肿瘤了？**'。'**比如说现在这个月的月经该是五号来，结果月经没有**——**此时我们怎么知道她是怀孕还是有癥病？**'。'**就要先问她之前的三个月月经如何**'。'**如果往前三个月的月经都非常正常，就有可能是怀孕了**'。'**如果前三个月月经很不正常，这就不见得是怀孕**'。'**这是张仲景考虑的第一个重点**'。'**如果确定是怀孕，到了第三个月发现到月经漏下不止，我们就要怀疑她有癥痼**'。**\" **须说明（四层）**：**①\"**先问前三个月**\"这个动作**极精** ✓✓（**⚠ 它**用的是**\"**过去的规律**\"**（**来**判断**\"**现在的停经**\"**（**⚠ 故**问诊**要**问**\"**之前规律不规律**\"**（**不要只问**\"**这个月来没来**\"**）；**②⚠ 而\"**前三个月正常 → 可能是怀孕**\"这一层**极准**（**⚠ 规律月经 + 停经**（**是**\"**妊娠**\"**的**最强提示**（**⚠ 而\"**前三个月就不正常**\"**（**要**想到**\"**无排卵、**多囊、**内分泌**\"**）；**③⚠ 而\"**停经后又漏下不止**\"这一层**极重要**（**⚠ 它**可能是**\"**先兆流产**\"**（**也可能是**\"**肌瘤/息肉**\"**（**⚠ 故\"**停经 + 出血**\"**（**必须**做**\"**hCG + 超声**\"**（**⚠ 而**不是**\"**凭脉**\"**）；**④⚠ 而\"**一定要确定不是怀孕，再开药**\"这一层**极重要** ✓✓（**⚠ 因为**\"**活血化瘀的药**\"**（**可能**导致**流产**（**⚠ 故\"**育龄女性**\"**用**\"**活血药**\"**前**（**必须**先**排除**妊娠**）。** **⚠ 本集按语**：**\"**先问她前三个月**\"**这六个字**是**一个**极好的**\"**问诊模板**\"**（**⚠ 而它**可以**推广到**\"**任何月经异常**\"**（**⚠ 故\"**月经这个月没来**\"**（**先问**\"**之前三个月准不准**\"**（**再问**\"**有没有验过**\"**（**⚠ 而**这两问**（**能**把**\"**怀孕、**内分泌、**器质性**\"**三条路**分开**）。","o":"RJ-3008 · 人纪·金匮要略·妇人妊娠病脉证并治第二十（PDF 第613页）"},{"t":"九、\"鲜红的血\"与\"黑色的血\"","h":"一个\"颜色分两种情况\"的说法，与它的边界","c":"要点——**讲义用\"血的颜色\"区分了两种漏下，而这一层**极精**但**不能单用**，须照录**：\"**'如果怀孕后的第三个月如果有漏下不止，而流出血是**鲜色**的话，代表是怀孕了，但是**将会流产**，不是癥痼造成漏下的**'。'**如果前三个月的月经就很不正常，加上又连续停了三个月月经，此时你不晓得她是怀孕还是有癥**'。'**结果第三个月后出现**漏下黑血不止**时，这就晓得是子宫里面有癥了，不是怀孕**'。**\" **须说明（四层）**：**①\"**鲜红 vs 黑血**\"这个区分**方向是对的** ✓（**⚠ 鲜红**多**提示**\"**新鲜出血（先兆流产、**胎盘因素）**\"**（**⚠ 暗红/黑**多**提示**\"**陈旧血（**积血、**肌瘤变性、**内膜病变）**\"**（**⚠ 故\"**颜色**\"**确实**能**提示**\"**血的来源与时间**\"**）；**②⚠ 而\"**鲜红＝怀孕会流产**\"这一层**须标**（**⚠ 早孕出血**（**约**1/4 的孕妇**会**有**少量出血**（**⚠ 而**其中**约**一半**能**继续妊娠**（**⚠ 故\"**将会流产**\"**这个判断**过头了**（**⚠ 而**它**会**造成**不必要的恐慌**）；**③⚠ 而\"**黑血＝有癥**\"这一层**也**须标**（**⚠ 暗色血**也**可以**来自**\"**宫颈病变、**内膜息肉、**激素波动**\"**（**⚠ 故\"**颜色**\"**只能**提示**（**不能**定论**）；**④⚠ 而**正确的做法**是**：**\"**颜色可以提示，但不能替代 hCG 与超声**\"**（**⚠ 因为**\"**早孕出血**\"**的**第一件事**是**\"**确认胎儿是否存活**\"**（**⚠ 故\"**停经 + 出血**\"**（**必须**做**\"**hCG 动态 + 超声**\"**（**⚠ 而**不是**\"**凭血色判断**\"**）。** **⚠ 本集按语**：**\"**鲜红/黑血**\"**这个观察**极有价值**（**⚠ 而它**的**价值**是**\"**提示**\"**（**不是**\"**结论**\"**（**⚠ 故**本集的处置是**：**保留\"**颜色有提示意义**\"**，**删除\"**鲜红必流产、黑血必肌瘤**\"**，**并注明\"**必须做 hCG + 超声**\"**。","o":"RJ-3009 · 人纪·金匮要略·妇人妊娠病脉证并治第二十（PDF 第613~614页）"},{"t":"十、\"饭后吃，不是怕伤胃\"","h":"一句话，纠正了一个极普遍的误解","c":"方法——**讲义在讲桂枝茯苓丸的服法时，说清了一件**几乎所有人都理解错的事**，须照录**：\"**'经方家会使用丸剂时，就是取它的**药缓力专**'。'**但是用丸剂时要注意**：**如果病在上，我们一定是饭后吃，让药力往上走**'。'**病在下，就是饭前吃，使药力往下走**'。'**所以中药的饭后吃，并不是因为这个药会伤胃**——**而是要让药到病灶位置去**'。'**像乌头赤石脂丸是专门治心痛彻背、背痛彻心的特殊症状，此时一定是要饭后吃**'。'**如果是肚脐痛、痛到背后去，那就是饭前吃**'。'**现在病在下焦，所以「每日食前服一丸」**'。'**不要只吃很小的一丸，这没有用的**——**一般大概吃个三十粒，一天吃三次**'。**\" **须说明（四层）**：**①\"**饭后吃不是怕伤胃**\"这一句**极重要** ✓✓（**⚠ 它**纠正了**一个**极普遍的误解**（**⚠ 而\"**饭前/饭后的真正理由**\"**是**\"**让药力往上/往下**\"**（**⚠ 故\"**中药饭后吃**\"**（**不是**\"**胃药**\"**（**是**\"**定位**\"**）；**②⚠ 而\"**病在上饭后、病在下饭前**\"这个规则**极具体**（**⚠ 它**把\"**服药时间**\"**变成了**\"**一个方向控制**\"**（**⚠ 而**这一层**在**\"**丸剂/散剂**\"**上**极有用**（**因为**丸**在**胃里**停留**时间长**）；**③⚠ 而\"**三十粒、一天三次**\"这一层**极重要** ✓（**⚠ 原文说\"**如兔屎大，每日食前服一丸，不知加至三丸**\"**（**⚠ 而**讲义**明确说**\"**不要只吃很小的一丸，这没有用的**\"**（**⚠ 故\"**古方的剂量**\"**要**按**\"**现代的实际**\"**理解**（**⚠ 而**这一层**是**一个**极诚实的提醒**）；**④⚠ 而\"**药缓力专**\"这四个字**极精**（**⚠ 它**说明**\"**丸剂**\"**的**特点**（**⚠ 故\"**丸**\"**用于**\"**慢病、久服**\"**（**\"**汤**\"**用于**\"**急病、速效**\"**（**⚠ 而**这一层**在**\"**剂型选择**\"**上**是**一条**通则**）。** **⚠ 本集按语**：**\"**饭后吃不是怕伤胃**\"**这八个字**最值得记**（**⚠ 因为**它**几乎**每个**吃中药的人**都**理解错**（**⚠ 而\"**服药时间**\"**是**一个**可以**改的变量**（**⚠ 故\"**药往上走就饭后、往下走就饭前**\"**（**这**比**\"**随便什么时候吃**\"**有讲究** ✓）。","o":"RJ-3010 · 人纪·金匮要略·妇人妊娠病脉证并治第二十（PDF 第614页）"},{"t":"一、\"新产三病\"：痉、郁冒、大便难","h":"三个病，同一个起点","c":"定义——**原文用一问一答把产后病归成了三类**，而这三类**有一个共同源头**，须照录**：\"**'**问曰：新产妇人有三病：一者病痉，二者病郁冒，三者大便难，何谓也？**'。'**师曰：新产血虚，多汗出，喜中风，故令病痉**'。'**亡血复汗，寒多，故令郁冒**'。'**亡津液胃燥，故大便难**'。**\" **须说明（四层）**：**①三病的**起点**是**同一个**：\n\n| 病 | 起点 | 中间环节 | 结果 |\n|---|---|---|---|\n| 痉 | 血虚 | 多汗 + 受风 | 津液竭 → 抽搐 |\n| 郁冒 | 亡血 | 复汗 + 寒多 | 血不上头 → 头晕忧郁 |\n| 大便难 | 亡津液 | 胃燥 | 肠燥 → 便难 |\n\n**——⚠ 故\"**产后三病**\"**不是**\"**三个独立的病**\"**（**是**\"**一个病因**\"**的**三种表现**（**⚠ 而这**一个病因**就是**\"**失血 + 失津**\"**（**⚠ 故**产后的**核心**是**\"**补液 + 补血**\"**（**而不是**\"**三个病分别治**\"**）；**②⚠ 而\"**血虚 → 多汗**\"这一层**极准** ✓（**⚠ 产后**的**\"**褥汗**\"**极常见**（**⚠ 而**大汗**会**进一步**失津**（**⚠ 故\"**产后出汗多**\"**（**不是**\"**排毒**\"**（**是**\"**丢水**\"**（**⚠ 而**这**正是**\"**痉**\"**的**前一步**）；**③⚠ 而\"**喜中风**\"这一层**须标**（**⚠ 产后**免疫力与体力**都**低**（**⚠ 而**\"**受风 → 痉**\"**这个因果**（**在**现代**的**对应**是**\"**感染 → 高热 → 抽搐**\"**（**⚠ 故**产后发热**（**要**先**排除**\"**感染**\"**（**而不是**\"**受了风**\"**）；**④⚠ 而**这三病**的**共同处置**是**\"**补水、补血、通便**\"**（**⚠ 而**它**在**现代**也是**\"**补液、**纠正贫血、**通便**\"**（**⚠ 故**这一条**的**内核**（**今天**仍然**成立** ✓。** **⚠ 本集按语**：**\"**新产三病**\"**这四个字**最值得记的是**\"**一个起点**\"**（**⚠ 因为**它**把**\"**产后的各种不舒服**\"**归到了**\"**失血失津**\"**（**⚠ 故\"**产后头晕、出汗、便秘**\"**（**不是**\"**三个问题**\"**（**是**\"**一个问题的三个面**\"**（**⚠ 而**这一个问题**（**只要**\"**补回来**\"**就能**同时**改善**）。","o":"RJ-3011 · 人纪·金匮要略·妇人产后病脉证治第二十一（PDF 第630页）"},{"t":"二、\"血虚 → 多汗 → 受风 → 痉\"","h":"一条四步的因果链，与两个方","c":"定义——**讲义把\"痉\"的成因拆成了四步**，而这一层**极清楚**，须照录**：\"**'生小孩同时会流出很多血，多数会呈现**血虚**的状态**'。'**血虚时「**多汗出**」——**病人不动也会流很多汗出**'。'**这个时候「**喜中风**」，就是很容易受到风邪**'。'**这就造成「**故令病痉**」——**因为津液丧失太多而得到的痉病**'。'**如果是柔痉，就是栝蒌桂枝汤证；如果是刚痉，就是葛根汤证**'。**\" **须说明（四层）**：**①四步链**极清楚**：**失血 → 血虚 → 多汗（津液外泄）→ 受风 → 痉**（**⚠ 而**它的**关键**是**\"**津液丧失太多**\"**（**⚠ 故\"**痉**\"**的**本质**是**\"**津液不够，筋脉失养**\"**（**⚠ 而**这**在**\"**脱水、**电解质紊乱 → 肌肉痉挛**\"**上**确实**对应** ✓）；**②⚠ 而\"**刚痉/柔痉**\"这一层**是**一个**极实用的二分**（**⚠ \"**刚痉**\"**＝**无汗**（**⚠ \"**柔痉**\"**＝**有汗**（**⚠ 故\"**有没有汗**\"**是**一个**可以问出来的分界线**（**⚠ 而**它**恰好**对应**\"**脱水程度**\"**）；**③⚠ 而\"**病人不动也会流很多汗**\"这一层**极具体**（**⚠ 它**是**\"**产后褥汗**\"**（**⚠ 而**它**在**\"**产后一周内**\"**极常见**（**⚠ 故\"**出汗多**\"**（**要**补**\"**水 + 电解质**\"**（**而不是**\"**再发汗**\"**）；**④⚠ 而\"**痉＝抽搐**\"这一层**须**最高级警告**（**⚠ 凡**\"**产后 + 抽搐/意识改变/高热**\"**（**要**立即**急诊**（**⚠ 因为**它**可能是**\"**子痫、**感染、**低钙、**脑静脉血栓**\"**（**⚠ 故**这一条**不是**\"**在家喝葛根汤**\"**）。** **⚠ 本集按语**：**这一段**最值得记的是**\"**津液丧失太多**\"**（**⚠ 因为**它**把**\"**痉**\"**从**\"**一个神秘的病**\"**变成了**\"**一个可以算的账**\"**（**⚠ 失血 + 出汗 + 哺乳**（**⚠ 都是**\"**出水**\"**（**⚠ 故**产后**的**第一件事**是**\"**把水补回来**\"**（**⚠ 而**不是**\"**怕风、**捂汗**\"**（**⚠ \"**捂汗**\"**会**让**\"**津液**\"**更**少**（**⚠ 这是**一个**方向性错误**）。","o":"RJ-3012 · 人纪·金匮要略·妇人产后病脉证治第二十一（PDF 第630页）"},{"t":"三、\"郁冒\"＝产后的忧郁与头晕","h":"一个被写进两千年前书里的产后抑郁","c":"定义——**讲义明确把\"郁冒\"对应到了产后忧郁**，而这一层**极重要**，须照录**：\"**'**亡血复汗，寒多，故令郁冒**'。'**郁冒是代表**血不足**产生的虚症——**孕妇心情忧郁、闷闷不乐、头昏**，**等产后忧郁症的症状**'。'**这个「病郁冒」，就是产后忧郁**'。'**一个人在那边哭啊，心情就不好**'。'**你怎么哄他都没有用啊**'。**\" **须说明（四层）**：**①\"**郁冒＝产后忧郁**\"这个对应**极重要** ✓✓（**⚠ 因为**它**在**一部**两千年前**的**书里**（**⚠ 而**它**的**描述**（**\"**心情忧郁、闷闷不乐、头昏**\"**+\"**怎么哄都没有用**\"**）**（**与**今天的**\"**产后抑郁**\"**几乎**一致**（**⚠ 故**这不是**\"**现代病**\"**）；**②⚠ 而\"**亡血复汗，寒多**\"这个成因**极精**（**⚠ 失血 + 出汗 → 血容量低 → 脑供血不足 → 头晕**（**⚠ 而**贫血**确实**会**加重**\"**乏力、**情绪低落**\"**（**⚠ 故**产后**查**\"**血红蛋白**\"**（**是一个**极实际的动作**）；**③⚠ 而\"**怎么哄都没有用**\"这一句**极重**（**⚠ 它**说的是**\"**这不是'想开点'能解决的**\"**（**⚠ 故**\"**产后情绪低落**\"**（**不是**\"**矫情**\"**（**⚠ 而**它**需要**\"**评估 + 支持**\"**（**⚠ 而**不是**\"**劝一劝**\"**）；**④⚠ 而**本集的处置**是**：**保留\"**郁冒**\"**作为**\"**产后情绪问题的古称**\"**（**并注明**\"**产后抑郁**是**一个**需要**筛查与治疗**的**疾病**\"**（**⚠ 出现**\"**持续两周以上的情绪低落、**兴趣丧失、**自责、**失眠**\"**（**应**就医**（**⚠ 而**若**出现**\"**伤害自己或孩子的念头**\"**（**要**立即**求援**（**⚠ 可**拨打**心理援助热线**）。** **⚠ 本集按语**：**\"**郁冒**\"**这两个字**最值得注意**的是**它**的**诚实**（**⚠ 一部**古书**愿意**写**\"**一个人在那边哭、怎么哄都没有用**\"**（**说明**作者**真的**见过**（**⚠ 故**今天**读到**这一段**（**应该**想到**\"**这不是**一个人的**问题**\"**（**而**是**一个**可以**被**识别、**被**帮助的**状态**。","o":"RJ-3013 · 人纪·金匮要略·妇人产后病脉证治第二十一（PDF 第630页）"},{"t":"四、产后大便难：用麻子仁丸，不用承气汤","h":"一个关于\"力度\"的选择","c":"方法——**讲义对\"产后便秘\"给了一个**极明确的取舍**，须照录**：\"**'如果我们用承气汤，其攻下力量很强**——**而孕妇刚生完小孩，在血虚的时候，你给她大下，结果本不虚的都被你弄虚了**'。'**之所以选用**麻子仁丸**，可以慢慢地润肠，让孕妇的大便可以很轻松的排出**'。'**不需要用很强的药去攻**'。'**麻子仁丸呢，可以**制造很多的油脂在肠子里面**'。**\" **须说明（四层）**：**①\"**不能用承气汤**\"这一层**极重要** ✓✓（**⚠ 产后**是**\"**虚 + 津亏**\"**（**⚠ 而**峻下**会**进一步**耗津**（**⚠ 故\"**通便**\"**要**\"**润**\"**（**不是**\"**攻**\"**）——**⚠ 这是**一个**极重要的**原则**：**虚人**的**便秘**（**要**\"**给水给油**\"**（**不是**\"**给泻药**\"**）；**②⚠ 而\"**制造油脂在肠子里**\"这个说法**极形象** ✓（**⚠ 麻子仁丸**含**\"**麻子仁、**杏仁、**芍药、**大黄、**枳实、**厚朴**\"**（**⚠ 而**它**的**作用**是**\"**润 + 缓下**\"**（**⚠ 故\"**润肠**\"**是**\"**给肠子加油**\"**（**不是**\"**给肠子加压**\"**）；**③⚠ 而**这一条的**推广**极重要**（**⚠ \"**老人、**产后、**术后、**久病**\"**的**便秘**（**都**属于**\"**虚秘**\"**（**⚠ 故\"**先别用泻药**\"**（**先**问**\"**喝水够不够、**吃油够不够、**活动够不够**\"**（**⚠ 而**这三件事**（**比**\"**吃泻药**\"**安全**）；**④⚠ 而\"**结果本不虚的都被你弄虚了**\"这一句**极精**（**⚠ 它**说的是**\"**治疗本身可以造成新的虚**\"**（**⚠ 故**\"**力度**\"**是**一个**必须**考虑的变量**（**不只有**\"**有效/无效**\"**）。** **⚠ 本集按语**：**\"**不能用承气汤**\"**这六个字**是**一个**\"**力度观**\"**（**⚠ 而它**在**今天**仍然**成立**（**⚠ \"**产后便秘**\"**（**先**\"**喝水、**吃纤维、**走动**\"**（**\"**无效**\"**（**用**\"**乳果糖/聚乙二醇**\"**（**而不是**\"**番泻叶/大黄**\"**（**⚠ 因为**刺激性的泻药**会**让**肠子**更**依赖**）。** **⚠ 本集按语二**：**⚠ 注意**——**\"**生产后的第一次排便**\"**若**伴随**\"**剧烈腹痛、**呕吐、**不排气**\"**（**要**想到**\"**肠梗阻**\"**（**⚠ 而**不是**\"**便秘**\"**（**⚠ 故\"**产后的肚子痛**\"**（**不能**一律**当**\"**子宫收缩**\"**）。","o":"RJ-3014 · 人纪·金匮要略·妇人产后病脉证治第二十一（PDF 第630页）"},{"t":"五、\"搞不清楚的时候，开小柴胡汤\"","h":"一个\"和解\"的兜底思路","c":"要点——**讲义给了一个**极坦率**的处理原则**，须照录**：\"**'如果这三个同时出现——又心情不好、忧郁，又大便排不出来，又得到痉病**——**你不能开一票处方在里面呀**'。'**因为当你搞不清楚的时候，记得啊，张仲景下的定义：**小柴胡汤**'。'**所以**小柴胡汤是对付妇人病最好的利器**'。'**你现在看那个太太，你不晓得用什么处方的时候——怎么那么多毛病**'。'**你实在想不出来，开小柴胡汤给她，用**和解**的方式**'。'**所以我们治病有很多种方式：有表攻下发汗发表，那和解的方式，用小柴胡汤**'。'**这个小柴胡汤很好玩，很多太太吃了小柴胡，她心情就很好了**'。**\" **须说明（四层）**：**①\"**搞不清楚就和解**\"这一层**极重要** ✓✓（**⚠ 它**承认了**\"**有些情况**（**同时**有**好几个问题**\"**（**⚠ 而**这时**\"**不能**一个症状**一个方**\"**（**⚠ 故**\"**和解**\"**＝**\"**不针对某一处，而是调中间**\"**（**⚠ 而**这一层**在**\"**多系统症状**\"**上**有**现实意义**）；**②⚠ 而\"**和解**\"这一层**在**今天的对应**是**\"**先做整体评估、**不要急于**针对单一症状下药**\"**（**⚠ 特别是**\"**多药共用**\"**的**老人**（**⚠ 故\"**症状太多、找不到主线**\"**（**先**\"**停掉不必要的药、**保证睡眠饮食**\"**（**比**\"**再加一个药**\"**安全**）；**③⚠ 而\"**很多太太吃了小柴胡，心情就好了**\"这一层**须标**（**⚠ 这**不是**\"**小柴胡抗抑郁**\"**（**⚠ 而**它**可能是**\"**整体状态改善后情绪好转**\"**（**⚠ 故**\"**产后情绪低落**\"**（**要**评估**（**而**不能**靠**\"**吃小柴胡**\"**）；**④⚠ 而\"**有恶心就可以用小柴胡**\"这一层**须**配**\"**但见一症，不必悉具**\"**读**（**见第六条**）。** **⚠ 本集按语**：**\"**搞不清楚就和解**\"**这七个字**在**临床上**极有用**（**⚠ 因为**它**给**\"**多症状、无主线**\"**一个**\"**不伤害的处理**\"**（**⚠ 而**\"**不伤害**\"**（**在有**多个问题**时**（**比**\"**精准打击**\"**更**重要**（**⚠ 故**这一段**的价值**（**不在**\"**小柴胡**\"**（**在**\"**承认自己不确定**\"**）。","o":"RJ-3015 · 人纪·金匮要略·妇人产后病脉证治第二十一（PDF 第631页）"},{"t":"六、\"怀孕用桂枝汤，产后用小柴胡汤\"","h":"一句极好记的对照","c":"要点——**讲义把\"产前\"与\"产后\"的调理方做成了一组对照**，须照录**：\"**'**伤寒论里面讲：「但见一症，不必悉具」**——**病人只要有恶心，我们就可以使用小柴胡汤去调理**'。'**所以小柴胡汤是非常好的产后调理方剂**'。'****怀孕前两个月身体不舒服，用桂枝汤；生完小孩以后不舒服，用小柴胡汤**'。**\" **须说明（四层）**：**①这一组对照**极好记** ✓✓（**⚠ \"**产前 → 桂枝汤**\"**（**\"**产后 → 小柴胡汤**\"**（**⚠ 故**它**把**\"**两个特殊时期**\"**各**配了**一个**\"**底方**\"**）；**②⚠ 而\"**为什么是这两个**\"这一层**极有意思**（**⚠ 产前**的**问题是**\"**多了一个人，需要调营卫**\"**（**⚠ 产后**的**问题是**\"**少了很多血，需要调中焦**\"**（**⚠ 故**\"**一个调外（营卫）、一个调内（中焦）**\"**（**⚠ 而**这一层**恰好**对应**\"**怀孕**是**\"**加负担**\"**（**\"**产后**\"**是**\"**失血**\"**）；**③⚠ 而\"**但见一症，不必悉具**\"这一层**极重要** ✓✓（**⚠ 它**是**一个**\"**抓主症**\"**的原则**（**⚠ 而**它**的**具体应用**是**\"**有恶心**\"**（**⚠ 故\"**看到恶心、**口苦、**胸胁不适**\"**（**可以**\"**想到小柴胡**\"**（**⚠ 而**不必**\"**全部症状**都**齐**\"**）；**④⚠ 而\"**但见一症**\"这一层**也**有**边界**（**⚠ \"**一症**\"**不能**是**\"**任何一症**\"**（**⚠ 故**本集**须注明**\"**它**指**\"**少阳病的**核心症状之一**\"**（**而**不是**\"**随便一个症状**\"**）。** **⚠ 本集按语**：**\"**怀孕用桂枝汤，产后用小柴胡汤**\"**这十四个字**是**一个**极好的**\"**记忆锚**\"**（**⚠ 而**它**背后**的**道理**（**\"**加负担**\"**vs**\"**失血**\"**）**（**比**口诀**更**重要**（**⚠ 故**记住**口诀**之后**（**要**记住**那个**\"**为什么**\"** ✓）。","o":"RJ-3016 · 人纪·金匮要略·妇人产后病脉证治第二十一（PDF 第631~632页）"},{"t":"七、\"汗流太多，就要把柴胡拿掉\"","h":"一个极具体的加减：柴胡本身能发汗","c":"方法——**讲义在讲小柴胡汤的加减时，点出了一件**极易被忽略的事**，须照录**：\"**'平常我们用小柴胡汤调和新产妇的肠胃就可以了**'。'**用小柴胡汤时大家要注意**：**如果病人已经流汗流很多，而小柴胡汤里面的**柴胡**这一味药会入半表半里之间，**也是一种解表药**'。'**所以吃柴胡也能够发汗**'。'**因此如果病人汗流过多时，**就要把柴胡拿掉**'。**\" **须说明（四层）**：**①\"**柴胡也能发汗**\"这一层**极重要** ✓✓（**⚠ 一般**把**柴胡**当**\"**和解药**\"**（**⚠ 而**讲义**点出**它**\"**入半表半里、**也是一种解表药**\"**（**⚠ 故\"**汗多的人**\"**（**要**去掉**柴胡**（**⚠ 这是**一个**\"**极具体的加减**\"**）；**②⚠ 而\"**产后本来就多汗**\"这一层**使这个加减**更必要**（**⚠ 因为**产后**的**\"**褥汗**\"**（**持续时间长**（**⚠ 故\"**产后用小柴胡**\"**（**要**考虑**\"**去掉柴胡**\"**（**⚠ 而**不是**\"**照原方**\"**）；**③⚠ 而这一层的**推广**极有用**（**⚠ 任何\"**发汗药**\"**（**在**\"**本来就出汗多**\"**的**人**身上**（**都**要**减/去**（**⚠ 故\"**看一个方**\"**（**要**看**\"**每一味药在做什么**\"**（**⚠ 而**不是**\"**这个方治什么病**\"**）；**④⚠ 而\"**柴胡**\"**的**剂量**也**是**一个变量**（**⚠ 故\"**药味不变、**剂量变**\"**（**也**是**一种**调整**（**⚠ 而**这一层**在**经方**上**极常见**）。** **⚠ 本集按语**：**\"**柴胡也能发汗**\"**这五个字**是**一个**\"**读方的方法**\"**（**⚠ 因为**它**提醒**\"**每一味药都有副作用**\"**（**⚠ 而\"**加减**\"**（**不是**\"**随便加**\"**（**是**\"**因为某味药**会**带来某个效应**\"**（**⚠ 故\"**看一个方**\"**（**先**问**\"**这里面哪一味**会**让我出汗/利尿/通便**\"** ✓）。","o":"RJ-3017 · 人纪·金匮要略·妇人产后病脉证治第二十一（PDF 第632页）"},{"t":"八、绞痛与刺痛：两首方的一条分界线","h":"一个\"痛的性质\"就能分开","c":"方法——**讲义用\"痛的性质\"分开了两首方**，而这一层**极精**，须照录**：\"**'如果**腹中有瘀血**，病人会感觉到的痛是**刀刺般的痛**'。'**枳实芍药散只是**绞痛**，或者有点抽筋般的痛**'。'**所以枳实芍药散常常被用在女人刚生完小孩以后，**子宫收缩不是很正常**时所产生的腹痛**'。'**下瘀血汤就是用于**刺痛型**的腹痛**'。**\" **须说明（四层）**：**①\"**绞痛 vs 刺痛**\"这一分**极准** ✓✓（**⚠ \"**绞痛/抽筋**\"**＝**\"**空腔脏器**在**收缩**\"**（**⚠ \"**刺痛/刀割**\"**＝**\"**局部**有**病灶**\"**（**⚠ 故\"**问一句'怎么痛'**\"**（**能**把**\"**功能性的收缩痛**\"**与**\"**器质性的病灶痛**\"**分开**（**⚠ 而**这一层**在**\"**产后腹痛**\"**上**极实用**）；**②⚠ 而\"**子宫收缩不正常**\"这一层**极准**（**⚠ 产后**的**\"**宫缩痛**\"**（**是**\"**绞痛/阵发性**\"**（**⚠ 故\"**喂奶时更痛**\"**（**是**宫缩**（**⚠ 而\"**持续刺痛、**按压更痛、**发热**\"**（**要**想到**\"**感染/残留**\"**）；**③⚠ 而\"**两首方的差别**\"这一层**是**\"**力度**\"**（**⚠ \"**枳实芍药散**\"**是**\"**散剂、轻**\"**（**⚠ \"**下瘀血汤**\"**是**\"**丸/汤、峻**\"**（**⚠ 故**\"**先轻后重**\"**（**是一个**极好的**用药顺序**（**⚠ 而**它**也**符合**\"**能不用峻药就不用**\"**）；**④⚠ 而**这一层**的**安全边界**是**：**\"**产后腹痛 + 发热 + 恶露臭**\"**（**要**先**排除**\"**感染**\"**（**⚠ 而**不是**\"**先**\"**化瘀**\"**（**⚠ 故\"**产后腹痛**\"**（**要**先**量体温**（**⚠ 而**这一步**（**比**\"**辨证**\"**更**急**）。** **⚠ 本集按语**：**\"**怎么痛**\"**这一问**是**全篇**最好的一个**入口**（**⚠ 因为**它**不需要**设备**（**只需要**\"**病人说清楚**\"**（**⚠ 故\"**绞痛**\"**（**按一按**\"**还好**\"**（**\"**刺痛**\"**（**一碰**\"**就躲**\"**（**⚠ 而**这个区别**（**能**决定**\"**先观察**\"**还是**\"**先检查**\"** ✓）。","o":"RJ-3018 · 人纪·金匮要略·妇人产后病脉证治第二十一（PDF 第634页）"},{"t":"九、\"瘀血看三处\"","h":"舌、三阴交、血海膈俞","c":"要点——**讲义给了三个**可以摸/可以看**的瘀血征象**，而这一层**极具体**，须照录**：\"**'看病人舌头时，可以看到**舌上面都是一块一块青的**，**舌头边缘都是齿痕**'。'**再按病人的**三阴交**也有压痛**'。'**再按她的**血海、膈俞穴**又痛**'。'**就已经很肯定是**内有瘀血**了**'。**\" **须说明（四层）**：**①三处**极具体** ✓（**⚠ 舌**（**看**（**⚠ 穴位**（**按**（**⚠ 故它**是**\"**一个可以照着做的自查**\"**）；**②⚠ 而\"**舌上一块一块青**\"这一层**极准**（**⚠ 舌下/舌面**的**青紫**（**确实**提示**\"**瘀**\"**（**⚠ 而**现代**也**用**\"**舌下静脉迂曲**\"**（**⚠ 故\"**看舌头**\"**（**是**一个**便宜的**线索**）；**③⚠ 而\"**三阴交压痛**\"这一层**须标**（**⚠ 压痛**可以**提示**\"**局部敏感**\"**（**而**不能**\"**确诊瘀血**\"**（**⚠ 故**它**是**\"**一个提示**\"**（**⚠ 而**不是**\"**一个证据**\"**）；**④⚠ 而**这一组征象**的**正确用法**是**：**\"**多个征象同时出现**\"**（**才**提示**（**⚠ 故\"**只有一处**\"**（**不**足以**下结论**（**⚠ 而**这一层**恰好**是**\"**中医四诊合参**\"**的**核心**（**⚠ 故**本集**须注明**\"**单一体征不能确诊，须结合影像/化验**\"**）。** **⚠ 本集按语**：**\"**舌、三阴交、血海膈俞**\"**这三处**是**一个**\"**可以自己按**\"**的**组合**（**⚠ 而它**的**价值**是**\"**便宜、无创**\"**（**⚠ 故\"**怀疑瘀血**\"**（**先**看**\"**舌头**\"**、按**\"**那三个点**\"**（**⚠ 而**如果**都**痛**（**再**去**查**（**⚠ 这是**一个**\"**从便宜到贵**\"**的顺序** ✓）。","o":"RJ-3019 · 人纪·金匮要略·妇人产后病脉证治第二十一（PDF 第635页）"},{"t":"十、\"有瘀血，多半有寒\"","h":"一个\"先温后化\"的治疗顺序","c":"要点——**讲义在讲下瘀血汤的加减时，说出了一个**极重要的前提**，须照录**：\"**'一般来说**有瘀血在里面，都是有寒在里面**'。'**所以你要加了附子——**炮附子三钱，温下焦的阳**'。'**下焦阳虚的时候用炮附子**'。'**你一加热，这个肝血就会动了，瘀血也会动**'。'**动了以后，你就用**活血化瘀的药，把它清出来**'。'**同时呢，你就用大黄、桃仁，你可以加丹皮、川芎，诸如此类的**'。**\" **须说明（四层）**：**①\"**有瘀血多半有寒**\"这一层**是一个**前提判断**（**⚠ 而**它**的**逻辑**是**\"**寒则凝**\"**（**⚠ 故\"**只化瘀不温**\"**（**可能**\"**化不动**\"**（**⚠ 而**这一层**在**\"**手脚冷 + 痛经 + 血块**\"**上**有**对应**（**⚠ 故\"**温**\"**是**\"**化瘀**\"**的**前提**）；**②⚠ 而\"**先加热，瘀血才会动**\"这一层**极精** ✓✓（**⚠ 它**给了一个**\"**顺序**\"**（**⚠ \"**先温 → 后化**\"**（**⚠ 而**不是**\"**同时猛攻**\"**（**⚠ 这一层**在**\"**痛经、**产后腹痛**\"**上**极实用**（**⚠ 故\"**一上来就活血**\"**（**可能**\"**没效果**\"**（**⚠ 而**\"**先暖起来**\"**（**再**\"**化瘀**\"**（**顺序对了**）；**③⚠ 而\"**炮附子三钱**\"这一层**须**最高级警告**（**⚠ 附子**有毒**（**⚠ 故**本集**须注明**\"**附子为毒性药材，须经炮制并在医师指导下使用，不可自行服用**\"**（**⚠ 而**\"**温下焦**\"**的**现代对应**（**是**\"**保暖、**热水袋、**艾灸**\"**（**⚠ 这些**安全**）；**④⚠ 而\"**丹皮、川芎**\"这一层**是**\"**化瘀的常规配伍**\"**（**⚠ 而**它**的**力量**温和**（**⚠ 故\"**轻症**\"**可以**用**这类**（**\"**重症**\"**要**评估**）。** **⚠ 本集按语**：**\"**有瘀血，多半有寒**\"**这七个字**是**一个**\"**思路**\"**（**⚠ 因为**它**解释**\"**为什么有人化瘀没效果**\"**（**⚠ 而\"**顺序**\"**（**在**治疗里**常常**比**\"**药**\"**更**重要**（**⚠ 故\"**先温后化**\"**（**是**一个**可以**记住的**次序**（**⚠ 而**安全的部分**（**保暖、**热敷**）**（**今天**就**能**做** ✓）。","o":"RJ-3020 · 人纪·金匮要略·妇人产后病脉证治第二十一（PDF 第634页）"},{"t":"一、\"热入血室\"：一个只问一句就能定的病","h":"\"感冒了，月经来了没有？\"","c":"定义——**原文三条讲的是同一个病**，而讲义把它落到了一个**问句**，须照录**：\"**'**妇人中风七八日，续来寒热，发作有时，经水适断者，此为热入血室，其血必结，故使如疟状，发作有时，小柴胡汤主之**'。**\" **讲义的展开**：\"**'当女子得感冒时，正好遇到月经潮**——**此时病毒就跟着奶水进入子宫里**'。'**阴部只有肝经络过，所以病会从子宫再进到肝脏里，肝本身又在横膈上面，于是病人就会胸胁苦满**'。'**病情发展很快，此时小柴胡汤已经不及，这时候要扎期门穴**'。'**所以当一个太太，正好月经来的时候得了感冒**'。'**女人呢你只要问她：感冒了，月经来了没有？**'。'**是，正好感冒，你就不要怀疑，直接开小柴胡汤，当场就会好**'。'**因为小柴胡汤本身和解少阳，柴胡入三焦，入肝经，肝是不是直接经过子宫？**'。**\" **须说明（四层）**：**①\"**经水适断/适来 + 寒热如疟**\"这一组**极准** ✓✓（**⚠ \"**适**\"**这个字**（**\"**正好在那几天**\"**（**⚠ 故**它**是**一个**\"**时间上的巧合**\"**（**⚠ 而**这个巧合**（**是**\"**热入血室**\"**的**关键**）；**②⚠ 而\"**感冒了，月经来了没有**\"这一句**极重要** ✓✓（**⚠ 它**是**一个**\"**一句话问诊**\"**（**⚠ 因为**它**同时**问到了**\"**有没有外感**\"**与**\"**处于什么生理阶段**\"**（**⚠ 故**问诊**要**问**\"**时间关系**\"**（**不只是**\"**症状**\"**）；**③⚠ 而\"**胸胁苦满**\"这一层**是**\"**少阳证**\"**（**⚠ 而**它**在**\"**经期发热**\"**上**确实**是**一个**\"**可以问出来**\"**的位置**（**⚠ 故\"**经期感冒 + 两胁胀**\"**（**是**\"**小柴胡**\"**）；**④⚠ 而\"**小柴胡汤已经不及，要扎期门**\"这一层**须标**（**⚠ 针灸**须**专业人员**（**⚠ 而**本集的处置**是**：**\"**经期高热 + 意识改变**\"**（**要**立即**就医**（**⚠ 因为**它**可能**是**\"**严重感染**\"**（**⚠ 而**不是**\"**热入血室**\"**）。** **⚠ 本集按语**：**\"**感冒了，月经来了没有**\"**这八个字**是**全册**最好的**一个问句**（**⚠ 因为**它**把**\"**一个模糊的发热**\"**落到了**\"**一个具体的时点**\"**（**⚠ 故**女性病人**说**\"**莫名其妙发烧**\"**（**问**\"**那几天是不是正好在经期**\"**（**是一个**极省事的入口** ✓。","o":"RJ-3021 · 人纪·金匮要略·妇人杂病脉证治第二十二（PDF 第641~642页）"},{"t":"二、\"昼日明了，暮则谵语\"","h":"一个关于\"什么时候糊涂\"的观察","c":"要点——**原文给了一个**极具体的昼夜差异**，而讲义把它讲成了一个字谜**，须照录**：\"**'**妇人伤寒发热，经水适来，昼日明了，暮则谵语，如见鬼状者，此为热入血室**'。**\" **讲义的展开**：\"**'白天很好，晚上到了黄昏太阳一下山，开始「如见鬼状」**'。'**为什么白天看到鬼？**'。'**我们「魄」这个字呢，是不是**白天见鬼**——所以我们尽量不要用简体字，用繁体字比较好**'。'**你如果看到一个男的和一个女的，两个在那发狂奔走、在发谵语，你要问清楚：你到底月经有没有来**'。'**一般来说，大承气汤也会有谵语呀**——**严重的时候，这个大肠的沼气会跑到头部去谵语**'。**\" **须说明（四层）**：**①\"**昼日明了、暮则谵语**\"这一层**极准** ✓✓（**⚠ \"**白天清楚、**晚上糊涂**\"**（**是**\"**谵妄的昼夜节律**\"**（**⚠ 而**它**在**\"**感染、**代谢紊乱、**老年痴呆、**酒精戒断**\"**上**极常见**（**⚠ 故**这一条**在**今天**仍然**有极高的价值** ✓）；**②⚠ 而\"**魄＝白＋鬼**\"这个拆字**极妙** ✓（**⚠ 它**不是**\"**文字学**\"**（**是**\"**一个记忆钩子**\"**（**⚠ 而**它**把**\"**昼日见鬼**\"**（**变成了**\"**造字的人早就见过这个现象**\"**（**⚠ 故**这是一个**极好的**\"**以字证病**\"**的例子**）；**③⚠ 而\"**要问月经有没有来**\"这一层**极重要**（**⚠ 它**说明**\"**同样一个谵语**\"**（**原因**可以**完全不同**（**⚠ 故\"**谵语**\"**（**不**等于**\"**阳明腑实**\"**（**⚠ 而**问**\"**时间关系**\"**（**能**分开**\"**热入血室**\"**与**\"**大承气证**\"**）；**④⚠ 而\"**如见鬼状**\"这一层**须标**（**⚠ 幻觉/谵妄**（**是**\"**一个需要立即评估的**神经精神症状**\"**（**⚠ 而**它**可能**是**\"**脑炎、**败血症、**药物反应、**电解质紊乱**\"**（**⚠ 故\"**看到不存在的东西**\"**（**要**急诊**（**而**不是**\"**驱邪**\"**）。** **⚠ 本集按语**：**\"**昼日明了，暮则谵语**\"**这八个字**是**全册**最好的**一个**\"**症状的时间维度**\"**（**⚠ 因为**它**说明**\"**同一个症状**\"**在**不同时间**（**有**不同意义**（**⚠ 故**问病史**要**问**\"**什么时候重**\"**（**⚠ 而**\"**晚上糊涂**\"**（**在**老人**身上**（**是一个**极常见的**\"**被忽略的信号**\"**（**⚠ 故\"**白天好好的、晚上不认人**\"**（**要**查**（**而不是**\"**老了**\"**）。","o":"RJ-3022 · 人纪·金匮要略·妇人杂病脉证治第二十二（PDF 第642~643页）"},{"t":"三、\"无犯胃气及上二焦\"","h":"三条禁法：不吐、不汗、不下","c":"风险——**原文给了六个字的禁忌**，而讲义把它讲成了三件事，须照录**：\"**'**治之，无犯胃气及上二焦，必自愈**'。'**治疗这种病用**吐法、汗法、下法**都是不对的**'。'**要用**和解**的方式才对**——**譬如说用小柴胡汤，或是等病人自愈**'。**\" **须说明（四层）**：**①\"**无犯胃气及上二焦**\"这六个字**极重要** ✓✓（**⚠ 它**明确**否定了**三条路**（**⚠ 而**这三条路**（**恰好**是**\"**最容易被随手用上**\"**的**（**⚠ 故**它**是**一个**\"**减法式的处方**\"**）；**②⚠ 而\"**吐法**\"这一层**在**\"**经期**\"**上**尤其**危险**（**⚠ 因为**它**会**加剧**\"**盆腔充血、**脱水**\"**（**⚠ 故\"**经期**不舒服**\"**（**不要**\"**催吐**\"**（**也不要**\"**发汗**\"**（**也不要**\"**泻下**\"**）；**③⚠ 而\"**必自愈**\"这一层**须标**（**⚠ 有些**可以**自限**（**⚠ 而\"**高热不退、**意识改变、**剧烈腹痛**\"**（**不会**自愈**（**⚠ 故\"**必自愈**\"**不能**成为**\"**不就医**\"**的**理由**（**⚠ 而**它**的**正确读法**是**\"**不要用错误的方法去干预**\"**）；**④⚠ 而\"**和解**\"这一层**是**一个**\"**中间路线**\"**（**⚠ 而**它**在**现代**的**对应**是**\"**支持治疗 + 观察**\"**（**⚠ 故\"**不确定的时候，先别用力**\"**（**是一个**极重要的**临床原则**）。** **⚠ 本集按语**：**\"**无犯胃气及上二焦**\"**这六个字**最值得记**的是**它**的**克制**（**⚠ 一部**古书**愿意**写**\"**别做什么**\"**（**比**\"**要做什么**\"**（**更**成熟**（**⚠ 故**读这一段**（**要**学**\"**减法**\"**（**⚠ 而**\"**不吐、不汗、不下**\"**（**这**三条**（**今天**也**成立** ✓（**⚠ 因为**它**对应**\"**不要在急性期**乱用**脱水/刺激的手段**\"**）。","o":"RJ-3023 · 人纪·金匮要略·妇人杂病脉证治第二十二（PDF 第642页）"},{"t":"四、半夏厚朴汤：喉咙里\"有东西\"，和\"心被抓住\"","h":"两个症状，一个方","c":"定义——**原文只有一句话**，而讲义给了**第二个更特殊的症状**，须照录**：\"**'**妇人咽中如有炙脔，半夏厚朴汤主之**'。**\" **方**：\"**'半夏五钱，厚朴三钱，茯苓四钱，生姜三片**'。**\" **讲义的展开**：\"**'这个半夏厚朴汤我用的很多，跟后面的甘麦大枣汤都是很普遍的药**'。'**喉咙里面有个梅核气物一样，吞也吞不下、吐也吐不出，就是喉咙里面有东西挡到了**'。'**那么这个半夏厚朴汤证，临床上有个很特殊的症状**——**病人感觉到好像是**有人把我的心脏抓住、握到我的心脏**，**这个就是半夏厚朴汤证**'。**\" **须说明（四层）**：**①\"**咽中如有炙脔**\"这一层**极准** ✓✓（**⚠ 它**描述的**是**\"**咽部异物感**\"**（**⚠ 而**它**的特点是**\"**吞不下、吐不出、**吃饭却不碍**\"**（**⚠ 故\"**咽部异物感但进食正常**\"**（**要**先**想到**\"**癔球症**\"**）；**②⚠ 而\"**有人抓住我的心脏**\"这一层**极特殊** ✓✓（**⚠ 它**是**\"**胸骨后紧缩感**\"**（**⚠ 与**咽部异物感**同属**一个**\"**感觉谱**\"**（**⚠ 故\"**它**说明**\"**这两个症状**可以**同时出现**\"**（**⚠ 而**这一层**在**\"**胃食管反流 + 食管痉挛**\"**上**有**对应** ✓）；**③⚠ 而**这一条**的**安全边界**极重要**（**⚠ \"**觉得有人抓住心脏**\"**（**必须**先**排除**\"**心绞痛/心梗**\"**（**⚠ 故**本集**须注明**：**胸骨后压迫感、**持续超过 15 分钟、**伴出汗/放射痛**\"**（**立即**急诊**（**⚠ 而**不能**先**\"**按半夏厚朴汤证**\"**）；**④⚠ 而\"**半夏五钱、厚朴三钱、茯苓四钱、生姜三片**\"这一层**极具体**（**⚠ 而**生半夏**有毒**（**⚠ 故**须**用**制半夏**（**并在医师指导下**）。** **⚠ 本集按语**：**\"**喉咙里有个东西**\"**与**\"**心被抓住**\"**这**两个症状**放在一起**（**是**一个**极准的**\"**一个病、两个位置**\"**（**⚠ 而**它**的**价值**是**\"**问诊时**多问一句**\"**（**⚠ 故\"**咽部不舒服**\"**（**要**问**\"**胸口有没有紧**\"**（**\"**胸口紧**\"**（**要**问**\"**喉咙有没有堵**\"**（**⚠ 而**这一层**（**连着看**（**就能**找到**同一个原因** ✓（**⚠ 而**第一位**要排除的**（**是**\"**心脏**\"**）。","o":"RJ-3024 · 人纪·金匮要略·妇人杂病脉证治第二十二（PDF 第642页）"},{"t":"五、\"病因是胃里面的停水\"","h":"一个\"从方推因\"的解释","c":"要点——**讲义从方剂的组成**反推**了病因**，而这一层**极有意思**，须照录**：\"**'为什么会有这种症状？好，是因为你看他这个处方，从处方就可以看出来**'。'**半夏厚朴汤之所以妇人会有，因为妇人她以前在做针线、在家里**'。'**这个半夏厚朴汤原来就是因为主要的病因是**胃里面的停水**'。'**所以你看，重用半夏**'。'**为什么要加厚朴？**'。'**加一些行气的药——这就是张仲景的精神**'。**\" **须说明（四层）**：**①\"**从方推因**\"这个方法**极好** ✓（**⚠ 它**是**\"**逆向工程**\"**（**⚠ 从**\"**这个方用了什么药**\"**（**推**\"**病人身上是什么病机**\"**（**⚠ 而**这一层**在**\"**读方**\"**上**极实用**）；**②⚠ 而\"**胃里的停水**\"这一层**极准** ✓✓（**⚠ 它**在**\"**胃食管反流 → 咽部异物感（癔球症）**\"**上**有**真实对应**（**⚠ 故\"**咽部有东西**\"**（**可能**真**是**\"**胃里的东西上来了**\"**（**⚠ 而**这一层**在**今天**是**\"**咽喉反流（LPR）**\"**）；**③⚠ 而\"**重用半夏**\"这一层**是**\"**降逆化痰**\"**（**⚠ 而**\"**厚朴**\"**是**\"**行气**\"**（**⚠ 故**这个方**的**结构**是**\"**降 + 行**\"**（**⚠ 而**它**在**\"**气逆、**水停**\"**上**对应**）；**④⚠ 而\"**妇人以前做针线**\"这一层**是**一个**\"**生活史的推测**\"**（**⚠ 它**不是**病因**（**⚠ 故**本集**删除**\"**做针线导致**\"**（**保留**\"**胃中停水**\"**（**⚠ 而**它**的**现代对应**（**是**\"**久坐、**进食后平卧、**胃排空慢**\"**）。** **⚠ 本集按语**：**\"**从方推因**\"**这个读法**最值得学**（**⚠ 因为**它**让**\"**方**\"**变成**\"**一份病机说明书**\"**（**⚠ 而**\"**胃里的停水**\"**这个解释**（**让**\"**喉咙里的东西**\"**有了**一个**\"**下游**\"**的**解释**（**⚠ 故\"**咽部异物感**\"**（**要**问**\"**饭后是不是更明显、**躺下是不是更重**\"**（**⚠ 而**这两问**（**指向**\"**反流**\"** ✓）。","o":"RJ-3025 · 人纪·金匮要略·妇人杂病脉证治第二十二（PDF 第642页）"},{"t":"六、\"悲伤欲哭，象如神灵所作\"","h":"甘麦大枣汤：三味药，一个极重的症状群","c":"定义——**原文只有一句话，而它描述的**极传神**，须照录**：\"**'**妇人脏燥，悲伤欲哭，象如神灵所作，数欠喜伸，甘麦大枣汤主之**'。**\" **方与用法**：\"**'每天三餐给他吃甘麦大枣汤，小麦煮起很好吃，加些红枣、甘草在里面**'。**\" **讲义的展开**：\"**'这个太太呢，……**'。'**你会看到人家家里去拜访，看太太深更半夜在那里哭，是不是鬼呀**——**那就是甘麦大枣汤证**'。'**下面子宫太干了**——**也就是说她的这个阴部呢完全没有津液，都干的**'。'**一般人呢，应用的范围只是局限于这里，实际上不止**'。**\" **须说明（四层）**：**①三个症状**极准** ✓✓（**⚠ \"**悲伤欲哭**\"**（**情绪**（**⚠ \"**象如神灵所作**\"**（**行为异常、**不可解释**（**⚠ \"**数欠喜伸**\"**（**频繁打哈欠、**伸懒腰**（**⚠ 故**它**是**\"**情绪 + 行为 + 躯体**\"**三合一**）；**②⚠ 而\"**数欠喜伸**\"这一层**极精** ✓（**⚠ 频繁打哈欠**（**在**\"**疲劳、**缺氧、**抑郁、**药物反应**\"**上**是**一个**真实体征**（**⚠ 故\"**老打哈欠**\"**（**不**只是**\"**没睡好**\"**）；**③⚠ 而\"**脏燥**\"的\"**燥**\"这一层**讲义解为**\"**子宫太干、没有津液**\"**（**⚠ 这是一个**\"**局部化的解释**\"**（**⚠ 而**它**的**现代对应**（**是**\"**津液不足**\"**（**⚠ 故\"**悲伤欲哭 + 口干 + 皮肤干**\"**（**可以**连起来看**）；**④⚠ 而\"**三味药**\"这一层**极重要** ✓（**⚠ \"**小麦、**甘草、**大枣**\"**（**⚠ 三味**都**是**\"**食物/甘味**\"**（**⚠ 故**它**是**\"**一个极温和的方**\"**（**⚠ 而**它**的**价值**是**\"**可以天天吃、**不伤人**\"**（**⚠ 故**在**\"**情绪不稳、**睡眠差、**焦虑**\"**上**（**它**是**一个**\"**安全的支持**\"**）。** **⚠ 本集按语**：**\"**悲伤欲哭，象如神灵所作**\"**这十个字**是**全册**最好的**一个**\"**情绪症状的描述**\"**（**⚠ 因为**它**不**用**\"**抑郁**\"**这个词**（**它**用**\"**想哭、**不像自己、**老打哈欠**\"**（**⚠ 而**这**三个**（**任何**家属**都**能**观察到**（**⚠ 故\"**她最近老哭、**像变了个人**\"**（**是一个**值得**认真对待**的**描述**（**⚠ 而**\"**甘麦大枣汤**\"**是**一个**\"**可以日常用**\"**的**温和方**（**⚠ 而**若**症状**持续两周以上**（**仍**要**评估**）。","o":"RJ-3026 · 人纪·金匮要略·妇人杂病脉证治第二十二（PDF 第644页）"},{"t":"七、\"小孩子癫痫，也可用甘麦大枣汤\"","h":"一个\"摸腹肌\"的诊断，与它的边界","c":"要点——**讲义把甘麦大枣汤的用途扩到了**小儿癫痫**，并给了一个**可摸的体征**，须照录**：\"**'从发烧过以后呢，就一直在发癫痫。那我就常常在开那个甘麦大枣汤**'。'**所以不管男孩女孩发癫痫的时候，我会用甘麦大枣汤，因为**苦急**'。'**甘麦大枣汤出现的时候，尤其是小孩子癫痫，你摸他的腹肌是这样走的**——**压压，直的，都是一条一条直的上来**'。'**因为苦急**'。'**苦急的时候，他里面的津液（不足）**'。'**你甘麦大枣汤一下去以后，他的津液会上去**'。**\" **须说明（四层）**：**①\"**苦急**\"这个解释**极有意思**（**⚠ 它**把**\"**抽/紧**\"**归为**\"**津液不足**\"**（**⚠ 而**这一层**在**\"**低钙 → 肌肉痉挛**\"**上**有**真实对应** ✓）；**②⚠ 而\"**腹肌一条一条直的上来**\"这一层**极具体** ✓✓（**⚠ 它**是**\"**腹直肌紧张**\"**（**⚠ 而**这一层**在**\"**腹部肌张力增高**\"**上**可以**摸到**（**⚠ 故**这是**一个**\"**可以自己按的体征**\"**）；**③⚠ 而**这一段**的**安全边界**是**最高级**的**（**⚠ \"**癫痫**\"**必须**规范**使用**抗癫痫药**（**⚠ 而**\"**用甘麦大枣汤替代**\"**（**可以**导致**\"**癫痫持续状态 → 死亡**\"**（**⚠ 故**本集**须明确**：**甘麦大枣汤**可以**作为**\"**辅助/调理**\"**（**绝不可**替代**抗癫痫治疗**（**⚠ 而**同段\"**西药抗癫痫的药越吃越笨、**西药是给敌人吃的**\"**（**须**整段剔除**）**；**④⚠ 而\"**从发烧后一直发癫痫**\"这一层**须标**（**⚠ 热性惊厥**后**出现**\"**反复癫痫**\"**（**要**查**\"**脑电图、**影像**\"**（**⚠ 而**不是**\"**退烧没退干净**\"**）。** **⚠ 本集按语**：**\"**摸腹肌**\"**这个动作**是**一个**\"**极便宜的自查**\"**（**⚠ 而**它**的**价值**是**\"**肌张力**\"**（**⚠ 故\"**肚子摸起来硬邦邦的一条一条**\"**（**可以**提示**\"**紧张/痉挛**\"**（**⚠ 而**它**的**原因**（**要**查**（**⚠ 而**\"**癫痫**\"**这一层**（**则**必须**交给**神经科**（**⚠ 这是**本集**最不能让步的**一条线**）。","o":"RJ-3027 · 人纪·金匮要略·妇人杂病脉证治第二十二（PDF 第645页）"},{"t":"八、温经汤：\"寒就是缺氧，就是静止不动\"","h":"一个把\"寒\"翻译成现代语言的解释","c":"定义——**原文讲的是\"五十岁前后的妇人\"，而讲义把它扩展成了**一张\"助孕方\"**，须照录**：\"**'**妇人年五十所，病下利数十日不止，暮即发热，少腹里急，腹满，手掌烦热，唇口干燥，何也？**'。'**师曰：此病属带下。何以故？曾经半产，瘀血在少腹不去**'。**\" **讲义的展开**：\"**'『**手掌烦热**』——**手掌是阴，手背是阳，此处的手掌热是因为阴虚才产生的烦热**'。'**这个病就是所谓「**带下**」——对于妇人杂病，我们有一个统一的名称就叫「带下」**'。'**其原因是「曾经半产」，妇人年轻时可能流产过，造成「瘀血在少腹不去」**'。'**妇人停经时子宫会萎缩，如果用大剂的药去攻是不正确的**'。'**温经汤是中医过去用作**求子**的处方——所以大家可以在温经汤旁边写上「**长年血寒**」**'。'**「**寒**」就是冷，**就是里面有缺氧，就是静止不动**，是血块瘀积在子宫里面造成的**'。**\" **须说明（四层）**：**①\"**寒＝缺氧＝静止不动**\"这个翻译**极精** ✓✓（**⚠ 它**把**\"**寒**\"**从**\"**温度**\"**翻成了**\"**循环/代谢状态**\"**（**⚠ 而**这一层**在**\"**局部血流减少 → 组织缺氧 → 代谢低、**修复慢**\"**上**有**真实对应**（**⚠ 故**这是**全册**最好的**一个**\"**概念翻译**\"**）；**②⚠ 而\"**带下**\"这个词**极重要** ✓✓（**⚠ 现代**把**\"**带下**\"**理解成**\"**白带**\"**（**⚠ 而**原文**的**\"**带下**\"**是**\"**妇科杂病的总称**\"**（**⚠ 故**这是一个**极易**被**误读**的词**（**⚠ 而**它**的**正确读法**（**是**\"**带脉以下的病**\"**（**即**\"**盆腔/生殖系统**\"**）；**③⚠ 而\"**温经汤的适应证**\"这一层**极宽**（**⚠ \"**更年期、**月经不顺、**子宫瘀血、**不孕**\"**（**⚠ 而**它**的**核心**是**\"**虚 + 寒 + 瘀**\"**（**⚠ 故**它**是**一个**\"**补 + 温 + 通**\"**的**复合方**（**⚠ 而**它**的**十二味药**（**正好**分四组**：**吴茱萸（温肝）、**当归川芎芍药（补血）、**人参桂枝生姜甘草（行阳）、**阿胶（止血补血）、**丹皮（攻瘀**）**（**⚠ 故\"**硬攻会虚脱**\"**（**而**\"**温而通之**\"**才是**这个方的**方法** ✓✓）；**④⚠ 而\"**子宫内膜异位就是温经汤证**\"这一层**须标**（**⚠ \"**就是**\"**过头了**（**⚠ 子宫内膜异位**的**诊断**要**靠**\"**腹腔镜/影像**\"**（**⚠ 而**中药**可以**作为**\"**症状管理**\"**（**⚠ 故**不能**\"**以方代诊**\"**）。** **⚠ 本集按语**：**\"**寒就是缺氧，就是静止不动**\"**这句话**是**一个**\"**翻译的示范**\"**（**⚠ 因为**它**没有**停在**\"**寒**\"**这个字**（**它**给出了**\"**一个可以被理解的状态**\"**（**⚠ 而**这一层**在**\"**手脚冷、**痛经、**经血有块**\"**上**都**能**对上**（**⚠ 故\"**怕冷**\"**（**不是**\"**体质**\"**（**是**\"**一个可以改善的状态**\"**（**⚠ 而**改善的办法**（**从**\"**保暖、**运动、**改善循环**\"**开始**）。","o":"RJ-3028 · 人纪·金匮要略·妇人杂病脉证治第二十二（PDF 第653~655页）"},{"t":"九、\"转胞\"：能吃能喝，就是尿不出来","h":"一个\"饮食如故\"的组合，与它的急症边界","c":"定义——**原文的辨证只靠两句话**，而它的对比**极精**，须照录**：\"**'**问曰：妇人病，**饮食如故**，烦热不得卧，而反倚息者，何也？**'。'**师曰：此名**转胞**，不得溺也，以胞系了戾，故致此病，但当利小便则愈，肾气丸主之**'。**\" **讲义的展开**：\"**'**转胞就是子宫位置偏离正位**——**这个时候因为子宫压迫到膀胱，于是造成小便排不出**'。'**这个胎儿本身在子宫里面，或者子宫本身位置移动了，压迫到膀胱，小便不出来了**'。'**胞系了戾，故致此病**'。**\" **须说明（四层）**：**①\"**饮食如故 + 不得溺**\"这个组合**极精** ✓✓（**⚠ 它**说的是**\"**消化正常，只是尿不出**\"**（**⚠ 故\"**病在膀胱/子宫位置，不在肠胃**\"**（**⚠ 而**这一层**在**\"**急性尿潴留**\"**上**极重要**（**⚠ 因为**它**与**\"**肠胃病**\"**的**表现**完全**分开**）；**②⚠ 而\"**烦热不得卧，而反倚息**\"这一层**极准**（**⚠ \"**倚息**\"**＝**靠着才能呼吸**（**⚠ 而**这一层**在**\"**尿潴留 → 腹胀 → 膈肌上抬 → 呼吸困难**\"**上**有**对应**（**⚠ 故\"**躺不下、要靠着**\"**（**是一个**\"**急**\"**的信号**）；**③⚠ 而\"**子宫压迫膀胱**\"这一层**极重要** ✓✓（**⚠ 孕妇**的**\"**尿不出**\"**（**要**想到**\"**子宫嵌顿（incarcerated uterus）**\"**（**⚠ 而**它**是**一个**\"**妇科急症**\"**（**⚠ 故\"**孕中期突然尿不出**\"**（**立即**急诊**（**⚠ 而**不是**\"**肾气丸**\"**）；**④⚠ 而\"**但当利小便则愈**\"这一层**须**明确标**（**⚠ 急性尿潴留**的**第一处置**是**\"**导尿**\"**（**⚠ 而**不是**\"**吃丸药等它通**\"**（**⚠ 因为**膀胱**过度充盈**可以**造成**\"**肾损伤、**破裂**\"**（**⚠ 故\"**尿不出来超过 6~8 小时**\"**（**是**急诊**）。** **⚠ 本集按语**：**\"**饮食如故，不得溺**\"**这六个字**是**一个**极好的**\"**定位句**\"**（**⚠ 因为**它**把**\"**一个腹部不舒服**\"**（**定位到了**\"**泌尿/生殖**\"**（**⚠ 故\"**能吃能喝但尿不出**\"**（**不是**\"**上火**\"**（**是**\"**梗阻**\"**（**⚠ 而**\"**尿不出来**\"**（**是**一个**\"**按小时计**\"**的**急症**（**⚠ 故**这一条**最值得记的**（**不是**\"**肾气丸**\"**（**是**\"**尿不出要立刻处理**\"**）。","o":"RJ-3029 · 人纪·金匮要略·妇人杂病脉证治第二十二（PDF 第647页）"},{"t":"十、金匮二十二篇收官：这一册的\"骨架\"","h":"从\"治未病\"到\"妇人杂病\"，一条完整的线","c":"要点——**第二十二篇是金匮的最后一篇**，而把它与前面二十一篇连起来看，能看到**一条极清楚的骨架**，须照录**：\"**'**接着下来呢，大家看妇人杂病，这个杂病就是很多的妇科的病**'。**\" **以及全书的编排**：\"**'脏腑经络先后病 → 痉湿暍 → 百合狐惑阴阳毒 → 疟病 → 中风历节 → 血痹虚劳 → 肺痿肺痈 → 奔豚 → 胸痹 → 腹满寒疝宿食 → 五脏风寒积聚 → 痰饮咳嗽 → 消渴 → 水气 → 黄疸 → 惊悸吐衄 → 呕吐哕下利 → 疮痈肠痈 → 趺蹶手指臂 → 妇人妊娠 → 妇人产后 → 妇人杂病**'。**\" **须说明（四层）**：**①这一册的**编排**有一个**极清楚的方向** ✓（**⚠ 它**从**\"**总论（治未病）**\"**开始**（**然后**按**\"**外感 → 内伤 → 气血水 → 出血 → 呕吐下利 → 外科 → 妇科**\"**（**⚠ 故**它**不是**\"**按病名罗列**\"**（**是**\"**按病的层次**\"**）；**②⚠ 而**三个\"收口\"的位置**极重要**（**⚠ 第一篇**讲**\"**上工治未病**\"**（**⚠ 最后三篇**讲**\"**妇人**\"**（**⚠ 故**全书**的**两端**（**是**\"**预防**\"**与**\"**新生命的开始**\"**（**⚠ 而**这一层**是**一个**\"**极完整的闭环**\"**）；**③⚠ 而**这一册**最反复出现的一条**是**\"**补虚观**\"**（**⚠ \"**宁可将病人的脾胃强壮起，让病人感觉饿**\"**（**⚠ 它**在**血痹虚劳、**肺痿、**产后**三处**都**出现**（**⚠ 故**它**是**这一册**的**一个**\"**主旋律**\"**）；**④⚠ 而**本集**在**这一册里**标出的**\"**须否定/须剔除**\"**共**二十余处**（**⚠ 包括**\"**高血压会中风**\"**\"**肺炎是医师失治**\"**\"**糖尿病人胖是药造成的**\"**\"**舌诊三段方向反了**\"**\"**三阳结谓之消**\"**\"**天仓凹陷＝小偷**\"**\"**走路像鸭子主大贵**\"**\"**脉判男女**\"**（**⚠ 故**读这一册**（**要**带**\"**两把尺**\"**（**一把量\"**它说对了什么**\"**（**一把量\"**它说错了什么**\"**）。** **⚠ 本集按语**：**金匮二十二篇走完了**（**⚠ 这一册**的价值**（**不在**\"**它有多全**\"**（**在**\"**它把一部汉代的杂病书**（**拆成了**可以**一条一条**核对**的知识点**\"**（**⚠ 而**每一条**都**有**\"**原文出处 + 页码**\"**（**⚠ 故**任何一条**（**都**可以**回去**核**（**⚠ 这**是**这一册**与**\"**二手解读**\"**最大的不同** ✓）。","o":"RJ-3030 · 人纪·金匮要略·妇人杂病脉证治第二十二（PDF 第640页）"}];</script>
