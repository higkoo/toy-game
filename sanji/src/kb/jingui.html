气**\"**不是玄的**（**⚠ 它**可以**对应**\"**神经传导与感觉**\"**，**\"**血**\"**对应**\"**灌注与温度**\"**）；**③⚠ 而\"**电影院两小时**\"这个例子**极生活化**（**⚠ 它**说明\"**久坐 → 下肢血流减慢 → 站起时感觉与灌注恢复有先后**\"**）；**④⚠ 而\"**阳气走在前面、阴血跟在后面**\"这一层**可以当**\"**功能先于物质**\"**的比喻**（**⚠ 而**现代的说法**是**\"**神经信号先到、血流灌注随后**\"**（**⚠ 故这一层**是**\"**比喻对上了现象**\"**（**⚠ 而**两者**不必是\"同一件事**\"**）。** **⚠ 本集按语**：**这一段**是全册**最好的\"用日常经验讲理论\"的示范**（**⚠ 因为**它**不需要读者懂\"气血\"**（**只需要**坐过一次长凳**）——**⚠ 故\"**用一个共同体验**，**说明一个抽象概念**\"**，**是**最有效的解释方式** ✓。","o":"RJ-2929 · 人纪·金匮要略·五藏风寒积聚病脉证并治第十一（PDF 第312页）"},{"t":"十、这一篇的\"方\"：旋覆花汤与肾着汤","h":"两个极具体的方，与它们对应的两个\"怪证\"","c":"方法——**第十一篇虽然残缺，但仍留了两个**极具体的方证**，须照录**。**肝着**：\"**'**肝着，**其人常欲蹈其胸上**，先未苦时，但欲饮热，**旋覆花汤主之**'。**\" **肾着**：\"**'**肾着之病，**其人身体重，腰中冷，如坐水中**，形如水状，反不渴，**小便自利**，饮食如故，病属下焦，身劳汗出，衣里冷湿，久久得之，**腰以下冷痛、腹重如带五千钱**，**甘姜苓术汤主之**'。**\" **须说明（四层）**：**①\"**其人常欲蹈其胸上**\"这六个字**极精**（**⚠ 它描述的是\"**一个人总想捶自己的胸口**\"**（**⚠ 而\"**蹈**\"＝**踩/捶**（**⚠ 故这个动作**极有画面**（**⚠ 而它**对应的是**\"**胸中气机郁滞、想用外力把它捶开**\"**（**⚠ 而今天的对应**可能是**\"**胸闷、叹气才舒服**\"**）；**②⚠ 而\"**旋覆花汤**\"（旋覆花、葱、新绛）这一方**极简**（**⚠ 而\"**新绛**\"**是**\"**茜草汁染的帛**\"**（**⚠ 故它是**\"**活血通络**\"**的路子**（**⚠ 而这一层**与\"**肝着**\"**（**\"**着**\"＝**黏着不去**）**的\"**瘀**\"**是一致的** ✓）；**③⚠ 而\"**肾着**\"这一段**极精**（**⚠ \"**身体重、腰中冷、如坐水中**\"**（**⚠ 而\"**如坐水中**\"这四个字**把\"**腰冷**\"**讲成了一个画面**（**⚠ 而\"**腰以下冷痛、腹重如带五千钱**\"**（**⚠ \"**五千钱**\"**＝**一串铜钱挂在腰上**（**⚠ 极形象**）；**④⚠ 而\"**甘姜苓术汤**\"（**甘草、干姜、茯苓、白术**）**又名\"**肾着汤**\"**——**⚠ 而它**四味药**治\"**腰冷重**\"**（**⚠ 而\"**身劳汗出、衣里冷湿**\"这一句**是**病因**（**⚠ 即：**出汗后衣服湿冷**（**⚠ 故\"**肾着**\"**其实是**\"**寒湿伤腰**\"**（**⚠ 而这一层**与第 n39 条\"**热汗遇冷**\"**、第 n37 条\"**湿病禁下**\"**是**同一条线** ✓）。** **⚠ 本集按语**：**\"**如坐水中**\"与\"**如带五千钱**\"这两个比喻，**是**全书最好的两个\"症状描写\"**（**⚠ 而它们**不需要任何理论**（**只需要**读者**想象一下**（**⚠ 故\"**腰冷如坐水中**\"**这个说法**，**可以直接用来问病人**（**⚠ 而**答案是**\"**是/不是**\"**（**⚠ 故它**比\"**脉沉迟**\"**更好用**）。","o":"RJ-2930 · 人纪·金匮要略·五藏风寒积聚病脉证并治第十一（PDF 第310~312页）"},{"t":"一、四饮：四个定义，各抓一个能问出来的症状","h":"痰饮、悬饮、溢饮、支饮","c":"定义——**第十二篇开篇给了四种\"饮\"的定义，而每一句**都抓住了一个可以问出来的症状**，须照录**：\"**'**有痰饮，有悬饮，有溢饮，有支饮**'。**\" 四句定义**：\"**'**其人素盛今瘦，水走肠间，沥沥有声，谓之痰饮**'。'**饮后水流在胁下，咳唾引痛，谓之悬饮**'。'**饮水流行，归于四肢，当汗出而不汗出，身体疼重，谓之溢饮**'。'**咳逆倚息，短气不得卧，其形如肿，谓之支饮**'。**\" **须说明（四层）**：**①四个定义各有一个**最容易被问出来的特征**：\n\n| 名 | 原文的特征 | 一句问诊 |\n|---|---|---|\n| 痰饮 | 素盛今瘦、水走肠间、沥沥有声 | 肚子会不会咕噜叫？瘦了吗？ |\n| 悬饮 | 咳唾引痛 | 咳嗽的时候胁下会不会痛？ |\n| 溢饮 | 当汗出而不汗出、身体疼重 | 身上肿不肿？出不出汗？ |\n| 支饮 | 短气不得卧 | 平躺得下去吗？ |\n\n**——⚠ 故这四条**不是\"理论分类\"，**是\"四个入口\"**（**⚠ 而**这一类定义**，**在临床上**最有用**（**因为**它**能把\"说不清的不舒服\"**变成一个**可以回答的问题**）；**②⚠ 而\"**素盛今瘦**\"这四个字**极重要**（**⚠ \"**本来壮、现在瘦**\"**是一个**必须查的信号**（**⚠ 而**它**在今天是**\"**体重下降**\"**（**⚠ 而**不明原因的体重下降**要**查**糖尿病、甲亢、肿瘤、结核、抑郁**）；**③⚠ 而\"**沥沥有声**\"这一层**极准**（**⚠ 肠鸣音**确实是**可听的**（**⚠ 而**肠鸣 + 消瘦 + 腹泻**是**一组需要查的信号**）；**④⚠ 而\"**当汗出而不汗出**\"这一层**极精**（**⚠ 它说的是**\"**该出汗的时候没出汗，水就停在皮下了**\"**（**⚠ 而**这一层**与\"**水肿**\"**的机制**确实**对得上**（**⚠ 故\"**溢饮**\"**＝**\"**水肿**\"**的古代版** ✓）。** **⚠ 本集按语**：**这一段**最值得记的是\"**四个入口**\"**（**⚠ 而**它**可以**直接拿去问**（**⚠ 故\"**饮**\"**这个抽象的名词**，**落到最后**就是**四个\"**是/不是**\"**（**⚠ 而**能被回答的问题**，**才是有用的问题**）。","o":"RJ-2931 · 人纪·金匮要略·痰饮咳嗽病脉证并治第十二（PDF 第341~342页）"},{"t":"二、\"饮由内发，水由外感\"","h":"两篇之间的分界，一句就够","c":"要点——**讲义在开篇就说明了\"饮\"与\"水\"的区别，而这一层**决定了后面两篇怎么读**，须照录**：\"**'**饮跟水怎么区分呢？**'。'**张仲景认为，饮是由内发、水是由外感**'。'**饮之内发，是因喜怒忧思悲恐、七情六欲造成的**'。'**水是外感造成的，就是风寒暑湿燥热**'。'所以**在水气病脉证篇的时候，诸位将会看到很多外感的表症**，像往来寒热、发热发冷等'。'**而在饮症的时候是看不到外症的，只看到咳嗽、看到内症**'。**\" **须说明（四层）**：**①\"**饮由内发、水由外感**\"这八个字**是**两篇的分界线**（**⚠ 而它**给了读者一个\"**判断该读哪一篇**\"**的入口**（**⚠ \"**有表症（发热恶寒）→ 水气篇；无表症只有咳嗽 → 痰饮篇**\"**）；**②⚠ 而这一层**极重要**（**⚠ 因为**饮病篇**的方**（苓桂术甘、十枣、己椒苈黄**）**都不是\"**解表**\"**（**⚠ 故\"**没有表症**\"**是真的**（**⚠ 而**它**也**解释了\"**为什么饮病篇里**几乎没有麻黄**\"**）；**③⚠ 而\"**七情造成饮**\"这一层**须标**（**⚠ \"**情绪**\"**确实**能影响**食欲、**胃肠动力、**水盐代谢**（**⚠ 而**把\"**饮**\"**归因于\"**喜怒忧思**\"**是**一个**笼统的归因**（**⚠ 故**真正的路径**是**\"**情绪 → 吃喝/作息变化 → 水液代谢改变**\"**）；**④⚠ 而\"**水是风寒暑湿燥热**\"这一层**也须标**（**⚠ \"**外感**\"**与\"**水肿**\"**的关系**在**肾病、心衰、肝病**上**更直接**（**⚠ 故\"**外感致水**\"**只覆盖了\"**一部分**\"**）。** **⚠ 本集按语**：**\"**有表症 / 无表症**\"**这个分法**极实用**（**⚠ 因为**它**是一个**可以在床边立刻判断的二分类**（**⚠ 故**读《金匮》这两篇**，**先问\"**有没有发热恶寒**\"**，**比先背\"**四饮八水**\"**有用**。","o":"RJ-2932 · 人纪·金匮要略·痰饮咳嗽病脉证并治第十二（PDF 第341页）"},{"t":"三、\"这个是小人，我把他救回干什么\"","h":"一段必须整段否定的伦理主张","c":"风险——**讲义在这一段从\"饮病由七情内发\"**推出了一套\"看人下药\"的主张**，须照录并明确否定**：\"**'**从这里也可以解读出**有饮病的人到底在想什么**——所以**有时候我们不需要看相，只要听到这个人得什么病，我们就知道遇到是哪种人了**'。'所以**人有时不要太明**——太明的话：「**这个是小人，小人我把他救回干什么？**」'。'**我将他救回会造成全家倒霉**——**就是他这种恶人才会得到这种病的**'。'他好不容易生病已经不能去做坏事了，**我将他救回、给他延长生命再去做恶，旁边的亲人就很可怜**'。'所以**有时候治病要多考虑一下**——**看看如果是坏人，你就要多想一想了**'。'**这就是张仲景的观念**，张仲景没有写出——**他为什么不写？就是要让你去想通，你想通就是你的学问了**'。**\" **须说明（四层，逐层否）**：**①\"**听到得什么病就知道是什么人**\"这一层**在事实上不成立**（**⚠ 疾病与\"人品\"**没有对应**（**⚠ 任何人都能得任何病**（**⚠ 故\"**病＝人品的标签**\"**是**一个**错误的因果**）；**②⚠ 而\"**小人不救**\"这一层**与医学伦理**直接冲突**（**⚠ 现代医学的**第一原则**是\"**不因病人的身份、行为、信仰而拒绝救治**\"**（**⚠ 《日内瓦宣言》**明言\"**我不容许**宗教、国籍、种族、政党、地位**介入我的职责与病人之间**\"**）——**⚠ 故**这不是\"**可以多想一想**\"的问题**，**是**一条**明确的边界**；**③⚠ 而\"**我把他救回会造成全家倒霉**\"这一层**是**归因错误**（**⚠ 一个人的行为**由**他自己**负责**（**⚠ 而**医生\"救了他\"**与\"**他此后作恶**\"**之间**没有因果**（**⚠ 故**这种推理**把\"**他人的选择**\"**算到了**\"**医者的头上**\"**）；**④⚠ 而\"**这就是张仲景的观念**\"这一层**须辨**（**⚠ 《金匮》原文**并没有**这样主张**（**⚠ 这是**讲义作者的引申**（**⚠ 故\"**张仲景没有写出、要你想通**\"**这个说法**是**为引申找依据**（**⚠ 而**本集**一律**不采**此法**）。** **⚠ 本集按语**：**这一段**是**全册里最需要整段否定的地方**（**⚠ 而**它的危险**在于**：**它**把\"**医者的判断权**\"**扩展到了\"**生命的取舍权**\"**（**⚠ 而**这条线**一旦越过**，**就没有边界了**（**⚠ 故**本集的处置是**：**保留其\"七情与病有关\"的观察**，**删除其\"按人品决定救治\"的主张**，**并注明\"现代医学不允许以病人身份或行为为由拒绝救治\"**。","o":"RJ-2933 · 人纪·金匮要略·痰饮咳嗽病脉证并治第十二（PDF 第341页）"},{"t":"四、\"水在肠内\"与\"水在肠壁之间\"","h":"一个用大便形态分出来的鉴别","c":"方法——**讲义把\"痰饮\"里\"水走肠间\"分成了两种，而分法**只用两件事**，须照录**：\"**'**有痰饮的人，水会跑到肠里面**'。'**水进入肠间的时候有两种状况**：'。'**如果水在肠内跑的时候，病人的大便一定是呈瞬间水泄下的样子**'。'**如果大便是硬的，而肠里面又咕噜咕噜的叫，表示水是在肠壁之间、就是在肠的外面**'。'**跟肠里有水饮是不同的——水会入肠，就是痰饮造成的**'。'我们**正常状况应该是喝了水以后到胃里面就会气化**；**如果中膈上面有痰饮，我们饮食后食物与水到胃里面，食物会消化，但是水进入以后就没有办法完全气化**'。'**因为有痰饮在膈上面，使得小肠的热力不够，没有办法把水完全气化掉**——**这个时候水就慢慢从肠壁渗出去，渗到小肠壁的外面**；**肠外面都是腹膜，于是水就停留在肠与腹膜间的地方**'。**\" **须说明（四层）**：**①\"**水在肠内 → 水泄；水在肠壁之间 → 大便硬而肠鸣**\"这个鉴别**极精** ✓（**⚠ 它用**两个可观察项**（**大便形态 ＋ 肠鸣音**）**分开**两种\"水停\"**（**⚠ 故它**是**一个\"**不用仪器**\"**的鉴别**）；**②⚠ 而这一层**极重要**（**⚠ 因为**它**给了一个**\"**为什么有人肚子咕噜叫却不腹泻**\"**的解释**（**⚠ 而\"**大便硬 + 肠鸣**\"**在临床上**确实见于**肠易激（便秘型）、**肠梗阻早期、**腹水**）；**③⚠ 而\"**水停在肠与腹膜之间**\"这一层**极准**（**⚠ 它描述的**正是**\"**腹水 / 肠间积液**\"**（**⚠ 而\"**肠壁外的水**\"**确实**不引起腹泻**（**⚠ 故\"**水在肠外**\"**＝**\"**腹水**\"**的古代版**）；**④⚠ 而\"**中膈有痰饮 → 小肠热力不够 → 水不气化**\"这一层**须标**（**⚠ 而它的**合理内核**是**\"**上腹部的病变**\"**确实会**影响**\"**消化吸收**\"**（**⚠ 故\"**膈上有饮**\"**可以读作**\"**胃/十二指肠的动力或炎症**\"**）。** **⚠ 本集按语**：**这一段**最值得记的是\"**用大便形态分水的位置**\"**（**⚠ 而它**有一个现代的对照**：**\"**水样便 + 肠鸣亢进**\"**vs**\"**便秘 + 肠鸣亢进 + 腹胀**\"**是**两条完全不同的路**（**⚠ 前者**要**查感染、吸收不良**；**后者**要**查梗阻、动力**）——**⚠ 故\"**咕噜叫**\"**这个现象**，**要**配上\"**大便是什么样**\"**才有意义**。","o":"RJ-2934 · 人纪·金匮要略·痰饮咳嗽病脉证并治第十二（PDF 第342页）"},{"t":"五、\"病痰饮者，当以温药和之\"","h":"六个字，是这一篇的总纲","c":"定义——**原文只有这六个字，而讲义把它抬到了\"基本原则\"的位置，须照录**：\"**'**病痰饮者，当以温药和之**'。**\" **讲义的展开**：\"**'**所有的饮大部分都兼有痰**——**痰的源是因为一个人湿太盛，湿久会生痰**，所以**无论是寒湿、热湿都会生成痰**'。'**最初就是水气的湿没有被排除掉，慢慢就变成痰**；**痰饮会造成堵塞**——**如果有一层痰积在一处，会让水停下，于是水就跟痰混在一起，变成黏液**'。'所以我们**治饮病的时候，攻水的同时病人除了会吐出水，还会吐许多白色的黏液、白津出**，**这就是痰饮**'。'所以**张仲景说「当以温药和之」**——**所有的饮病张仲景认为都是寒湿造成的**，所以**说要开温药给病人，这是一个基本原则**'。'**就是我们刚刚讲，我们开温的药利水**'。**\" **须说明（四层）**：**①\"**当以温药和之**\"这六个字**是**这一篇的**总纲**（**⚠ 而它**统摄了后面所有方**（**苓桂术甘、肾气丸、五苓散**都是温**）——**⚠ 故**读这一篇**，**先记这六个字**，**后面的方**就**有了方向**；**②⚠ 而\"**温药\"**不是\"**热药**\"**（**⚠ \"**和之**\"**这两个字**极重要**（**⚠ 它说的是**\"**用温药把它调和开**\"**（**而不是\"**用热药把它烤干**\"**）；**③⚠ 而\"**湿久生痰、痰阻水停**\"这一层**极精**（**⚠ 它描述了**\"**痰与水互相包裹**\"**（**⚠ 而**这个图像**在\"**慢性支气管炎**\"**上**确实对得上**（**黏液栓 + 分泌物潴留**）；**④⚠ 而\"**攻水时会吐出白色黏液**\"这一层**须标**（**⚠ 十枣汤类**攻逐**会引起**剧烈呕吐腹泻**（**⚠ 而\"**吐出白黏液**\"**不能当作\"**药有效**\"的证据**（**⚠ 那是**药物刺激**的结果**）。** **⚠ 本集按语**：**\"**温药和之**\"**这六个字**最值得记的是\"**和**\"**（**⚠ 不是\"**攻**\"、不是\"**下**\"、不是\"**燥**\"**（**⚠ 故**这一篇**的**主线**是\"**把水化开、让它自己走**\"**（**⚠ 而**它的**反面**（**\"**用猛烈药把水打出去**\"**）**只用于\"**急**\"**（**如十枣汤**）——**⚠ 故\"**温药和之**\"**是**常态**，\"**攻逐**\"**是**例外**。","o":"RJ-2935 · 人纪·金匮要略·痰饮咳嗽病脉证并治第十二（PDF 第350~351页）"},{"t":"六、四饮的\"西医名字\"","h":"一份极有用的中西对照","c":"要点——**讲义为四饮各配了一个现代病名，而这份对照**极有用**，须照录**：\"**'**一般说西医看悬饮的话，西医叫它「**浆液肋膜炎**」——像水浆一样停积在肋间**'。'我们**前面刚刚讲的痰饮，常常肚子里面咕噜咕噜有声音的，西医可能叫「**慢胃病**」，中医叫做痰饮**'。'**溢饮**——**中医叫做皮肤水肿，西医直接叫水肿**'。'**支饮**——**中医叫做支饮，西医叫做胸水，表示是胸腔里面积水**'。'**刚刚讲的悬饮是水停在肋膜中间；支饮，水已经跑到肺里面去了**'。'**水在肺里面，造成病人咳逆**——「**倚息**」就是**病人不能躺下去睡，只能坐着休息**，又一直咳不停，然后躺不下去，一躺下去不得了，马上就咳**'。**\" **须说明（四层）**：**①这份对照**让抽象的名词落到了具体的影像**（**⚠ \"**悬饮 → 胸腔积液**\"**（**⚠ \"**支饮 → 肺水肿/胸水**\"**（**⚠ \"**溢饮 → 水肿**\"**（**⚠ 故\"**四饮**\"**不再是**四个**看不懂的**字**）；**②⚠ 而\"**悬饮停在肋膜之间、支饮在肺里**\"这个区分**极准** ✓（**⚠ 胸腔积液**（**肋膜腔**）**vs**肺水肿**（**肺泡**）**（**⚠ 而两者的**症状**确实不同**（**⚠ 故\"**悬**\"**与\"**支**\"**两个字**分别指**\"**悬在肋间**\"**与\"**支撑在胸中**\"**）；**③⚠ 而\"**倚息、不能卧、只能坐着**\"这一层**极重要**（**⚠ 它描述的**正是**\"**端坐呼吸（orthopnea）**\"**（**⚠ 而\"**一躺下去水就往肺里冲**\"**这个解释**也**对得上**（**⚠ 平卧时**静脉回流增加、**肺淤血加重** ✓）；**④⚠ 而\"**痰饮 → 慢胃病**\"这一层**须标**（**⚠ \"**肚子咕噜叫**\"**最可能**是**功能性消化不良、**肠易激、**乳糖不耐**（**⚠ 故\"**慢胃病**\"**这个对应**太笼统**（**⚠ 而**它**提示了一个方向**）。** **⚠ 本集按语**：**这一份对照**是**讲义最有价值的贡献之一**（**⚠ 因为**它**给了读者一个\"**对得上今天**\"**的梯子**（**⚠ 而**没有这把梯子**，\"**四饮**\"**就是四个**悬空的名词**（**⚠ 故**读古书**，**先找\"**今天的名字**\"**，**再回头看\"**古人的分类**\"**，**是**一条好路**）。","o":"RJ-2936 · 人纪·金匮要略·痰饮咳嗽病脉证并治第十二（PDF 第342页）"},{"t":"七、\"他只要过来说，我这个咳嗽都不能躺下去\"","h":"一个病人自己会说的入口，极好用","c":"要点——**讲义指出\"不能平卧\"这件事**病人自己会讲**，而这一层**极好用**，须照录**：\"**'**所谓不能卧，就是在肺里面有积水了**'。'**当肺里面有积水的时候，你平躺、一躺平以后，水会回逆上去，回逆上去以后，呼吸会更短**——**那就必须要坐起来比较舒服**'。'**因为你一坐起来，水就跑到肺的下方去了**'。'**那你如果一躺下去的时候，水就往肺里面冲，那就会喘息、咳嗽得很厉害，所以必须要坐在那里，会比较舒服**'。'**好，那你不用去担心他这个不知道——病人啊，人很奇怪，人会自己去调理的**'。'**他肺里面有水的时候他自己就知道，不能躺下去啊！他一定要坐到那边**'。'**所以不用你等——他只要过来说，医生啊，我这个咳嗽都不能躺下去，你就已经知道他有积水了**'。**\" **须说明（四层）**：**①\"**病人自己会讲**\"这一层**极精**（**⚠ 它**说明\"**最可靠的体征**\"**往往**是\"**病人自己的主诉**\"**（**⚠ 而\"**不能躺下去**\"**这个描述**极常见**（**⚠ 故它**是一个\"**一开口就能抓到**\"**的入口**）；**②⚠ 而\"**躺平 → 水回逆 → 咳更厉害 → 坐起来舒服**\"这个机制**极准** ✓（**⚠ 平卧时**肺淤血加重、**气道阻力增加**（**⚠ 故\"**端坐呼吸**\"**是**心衰的经典体征**）；**③⚠ 而\"**坐起来水就跑到肺的下方**\"这个解释**也**对得上**（**⚠ 重力**使**液体下沉**（**⚠ 故\"**坐起来舒服**\"**有**重力因素**）；**④⚠ 而这一层的**临床意义**极重要**（**⚠ \"**咳嗽 + 不能平卧**\"**要**优先查**心力衰竭**（**⚠ 而**心衰**的**早期表现**正是**\"**夜间咳嗽、需要垫高枕头、不能平躺**\"**（**⚠ 故\"**能不能躺下去**\"**这一问**，**比**\"**咳嗽多久**\"**有用**）。** **⚠ 本集按语**：**\"**我这个咳嗽都不能躺下去**\"**这一句**是**一个\"**免费的心脏彩超指征**\"**（**⚠ 而**它**只需**一句话就能问出来**（**⚠ 故**在家庭里**，**老人若\"**咳嗽、夜里要坐起来**\"**，**应先查心**（**而不是先\"**治肺**\"**）。","o":"RJ-2937 · 人纪·金匮要略·痰饮咳嗽病脉证并治第十二（PDF 第350页）"},{"t":"八、苓桂术甘汤：四味药，四件事","h":"一张只有四味的方，而每一味都说清了\"干什么\"","c":"方法——**苓桂术甘汤是这个方证最浅的一层，而讲义把四味药的**分工**说清了**，须照录**：\"**'**心下有痰饮，胸胁支满，目眩，苓桂术甘汤主之**'。**\" 方**：\"**茯苓三两，桂枝三两，白术三两，甘草二两**。**右四味，以水六升，煮取三升，分温三服，小便则利**。**\" **讲义的分工（五行）**：\"**'**张仲景为什么要用**桂枝**？因为**桂枝本就能行胃阳**，而且**桂枝又是阳药、是温药**……**桂枝在本草里面是可以壮心阳**'。'大家想想看，**心阳一壮起，心火就下行，火生土，所以胃阳就跟着旺起**；**胃热起，这个水就化掉了**'。'当水化开以后，我们靠**白术去利湿**——因为**当初水停在胃里面，一定同时影响到脾脏**，而**脾胃是表里关系**，这个**胃水会让脾有湿停在里面**'。'我们开了温药以后，一定同时要开利水的药，所以开**茯苓**在里面**'。'苓桂术甘汤里面的**甘草**，最主要是**让药停在胃的地方，取它的缓的**'。**\" **须说明（四层）**：**①四味药**各有分工**：\n\n| 药 | 干啥 |\n|---|---|\n| 桂枝 | 壮心阳 → 心火下行 → 火生土 → 胃阳旺 |\n| 白术 | 去脾湿（脾胃相表里，胃水会连累脾） |\n| 茯苓 | 利水（把化开的水从小便排走） |\n| 甘草 | 缓，让药停在胃部 |\n\n**——⚠ 故这张方**是一个\"**开（桂枝）→ 化（白术）→ 排（茯苓）→ 定位（甘草）**\"**的完整链条**（**⚠ 而**它**只有四味**（**⚠ 故\"**方小而理全**\"**是**经方的一个特征** ✓）；**②⚠ 而\"**辛甘发散为阳**\"这一层**极重要**（**⚠ 桂枝 + 甘草**＝**阳药**（**⚠ 而\"**酸苦为阴**\"**（**白芍 + 黄芩/黄连**）**（**⚠ 故**经方的配伍**有一个\"**阴阳**\"**的底层逻辑**（**⚠ 而**它**是可以核对**的**（**⚠ 尝药味**就行**：**酸、苦 → 阴；辛、甘 → 阳**）；**③⚠ 而\"**小便则利**\"这四个字**极重要**（**⚠ 它**说明了**\"**药后的观察点**\"**（**⚠ 故\"**吃完药看小便**\"**是**一个**可验证的疗效信号**（**⚠ 而**这一层**与第 n42 条\"**问小便颜色**\"**是**同一条线**）；**④⚠ 而\"**甘草让药停在胃**\"这一层**须标**（**⚠ \"**甘草缓中**\"**是**中医学的通行说法**（**⚠ 而**它**不是**药理学机制**（**⚠ 故\"**取它的缓**\"**是一个**经验总结**）。** **⚠ 本集按语**：**苓桂术甘汤**是**全书**最\"**小**\"**的方之一**（**⚠ 而它**治的**是\"**头昏、心下胀、心慌**\"**这一组**（**⚠ 而**这组**在今天是**\"**体位性头晕、**功能性消化不良、**心悸**\"**（**⚠ 故\"**四味药治一组小症状**\"**是**这张方的定位**。","o":"RJ-2938 · 人纪·金匮要略·痰饮咳嗽病脉证并治第十二（PDF 第351~352页）"},{"t":"九、\"法院的天平\"","h":"全册最好的一个比喻：头昏，问题在基座","c":"要点——**讲义用\"法院门口的天平\"解释了\"为什么胃里有水会头昏\"，而这是**全册最好的一个比喻**，须照录**：\"**'**我最平常用的一个概念**——**我跟老外怎么解释？**'。'**你这个跟老外说阴阳五行、表里虚实寒热，他跟你眨眼**'。'我说**你到法院去，看到有天平在那边**——**唉，对呀，大家都知道**'。'**这个基座呢，就在横膈膜的地方**'。'**当我们有水饮停在横膈膜这个地方的时候，这个水一晃动一下，上面是不是就会不平衡哪！**'。'**所以你看到上面有不平衡，实际上是基座有问题**'。'**所以中医治疗中耳不平衡、头昏眩很严重，我们是把横膈上的水排掉，他就好了**'。**\" **须说明（四层）**：**①这个比喻**极精** ✓✓（**⚠ 它**把\"**头昏**\"**（上）**与\"**胃/横膈的水**\"**（下）**连了起来**（**⚠ 而\"**基座不稳 → 上面晃**\"**是一个**人人都懂的画面**（**⚠ 故它**不需要\"**阴阳**\"**就**能讲通**）；**②⚠ 而\"**治中耳不平衡、头昏眩，是把横膈上的水排掉**\"这一层**须标**（**⚠ 而\"**内耳不平衡（耳石症、梅尼埃）**\"**的**主因**在**内耳**（**⚠ 而\"**把胃里的水排掉**\"**不能**复位耳石**（**⚠ 故\"**头昏**\"**要**先分**\"**天旋地转**\"**（**内耳/前庭**）**与\"**昏沉头重**\"**（**全身/代谢**）；**③⚠ 而\"**讲给老外听**\"这一层**极有意思**（**⚠ 它**示范了\"**用对方的文化符号解释中医**\"**（**⚠ 而**这是**一个**有效的沟通策略** ✓）；**④⚠ 而\"**基座 ↔ 横膈膜**\"这个映射**也**有生理上的对应**（**⚠ 横膈**是**呼吸与腹压的分界**（**⚠ 而**腹部胀满确实会**影响**呼吸与头部的静脉回流**（**⚠ 故\"**上面晃、下面不稳**\"**这层**不是**空话**）。** **⚠ 本集按语**：**这个比喻**是**全册**最值得学的一个**（**⚠ 因为**它**示范了\"**用一个共有的经验，替代一个陌生的术语**\"**（**⚠ 而**这一招**在**任何科普里**都有效**（**⚠ 故\"**法院的天平**\"**这五个字**，**比**\"**水气上泛**\"**好一百倍**。","o":"RJ-2939 · 人纪·金匮要略·痰饮咳嗽病脉证并治第十二（PDF 第351~352页）"},{"t":"十、\"多运动出汗，这个饮就会排掉\"","h":"最便宜的一条\"治饮\"建议","c":"方法——**讲义在开篇给了一条**不需要药的治饮法**，须照录**：\"**'**先跟诸位有个基本的概念**：**我们每个人多多少少难免都有一点饮**，这个**饮就是水饮**'。'那平常呢，**我们为什么要去做练功夫、多做劳力工作、多做一些运动？**'。'**就是运动出汗的话，这个饮就会排掉**'。'**这个饮从哪里来呢？**'。'**可能是你喝水喝太快了**——**运动嘛，喝水喝太快，嗝在那个中间，打嗝一下，实际上饮就进去了**'。**\" **须说明（四层）**：**①\"**每个人多多少少有一点饮**\"这一层**极诚实**（**⚠ 它**没有把\"**饮**\"**说成**一个**稀有的病**（**⚠ 而**它**是**\"**一种亚健康状态**\"**（**⚠ 故\"**治饮**\"**不是**\"**打一场仗**\"**）；**②⚠ 而\"**运动出汗 → 饮排掉**\"这一条**极实用**（**⚠ 因为**它**不需要药、不需要辨证**（**⚠ 而\"**出汗**\"**确实**是**一条**水液排泄通路**（**⚠ 故**这是**\"**最便宜的一条治饮建议**\"** ✓）；**③⚠ 而\"**喝水喝太快、嗝在中间**\"这个描述**极生动**（**⚠ 它**给出**一个**具体的\"**饮**\"**来源**（**⚠ 而**这个来源**在**\"**吃饭太快、边吃边说话**\"**上**确实对得上**（**⚠ 故**细嚼慢咽**是**一条**极便宜的预防**）；**④⚠ 而\"**打嗝一下，饮就进去了**\"这一层**须标**（**⚠ \"**嗝**\"=**吞入空气**（**⚠ 而\"**空气**\"**与\"**水饮**\"**不是一回事**（**⚠ 故**这个说法**是**比喻**（**⚠ 而**它的**合理内核**是**\"**吃太快会吞气、会打乱胃肠动力**\"**）。** **⚠ 本集按语**：**\"**多运动出汗**\"**这五个字**是**全册**最容易执行的一条**（**⚠ 而它**恰好**与**第 n40 条\"**人是动物，你就要动**\"**是**同一条**（**⚠ 故**这本书里**\"**运动**\"**出现的次数很少**，**但每次出现**都**在最关键的地方** ✓。","o":"RJ-2940 · 人纪·金匮要略·痰饮咳嗽病脉证并治第十二（PDF 第342~343页）"},{"t":"一、\"消渴就是类似今日的糖尿病\"","h":"一句定性，与它的《内经》出处（须校一字）","c":"定义——**讲义开篇就把\"消渴\"与\"糖尿病\"对上了，并引了《内经》的一句，须照录并校**：\"**'**这篇谈论到的**消渴，就是类似今日的糖尿病**'。'而**西方医学并没有真正深入的去了解消渴的原因在哪里**——**中医在汉朝时期就已经讨论到这个问题了**'。'**金匮里面张仲景只有提到两种消渴**，**我又增加了一种**在这里'。'它的成因，**按照黄帝内经的说明是「三阳结谓之消渴」**'。'大家就想，**什么叫「三阳结」？这就是问题**'。'**根据我们临床的经验看**……**第一个阳指的是胃，第二个阳指的是大肠**——**胃和大肠，这两个是所谓的二阳**'。'**过热，什么叫过热？就是蠕动太快了**'。'**如果是单纯的胃蠕动太快，这是白虎汤证**'。**\" **须说明（四层）**：**①\"**消渴＝糖尿病**\"这个对应**方向是对的**（**⚠ 消渴**的核心是**多饮、多食、多尿、消瘦**（**⚠ 而 2 型糖尿病**的典型正是**\"三多一少\"**（**⚠ 故**两者在\"**症状群**\"上**高度重叠** ✓）；**②⚠ 而\"**三阳结谓之消渴**\"这一句**引错了**（**⚠ 《素问·阴阳别论》原文是「**二阳结谓之消**」**（**⚠ \"**二阳**\"＝**阳明**（**胃与大肠**）——**⚠ 故**讲义自己下文说的\"**第一个阳是胃、第二个阳是大肠、这两个是所谓的二阳**\"**恰好**与\"**二阳结**\"**对上了**（**⚠ 而它**开头写成了\"**三阳结**\"**（**⚠ 这是**一个**可核的引文错字**（**⚠ 而**\"**三阳**\"**在《内经》里**指**太阳**（**⚠ 与\"**消**\"**无关**）；**③⚠ 而\"**过热就是蠕动太快**\"这一层**极重要**（**⚠ 它**把\"**消渴**\"**从\"**阴虚**\"**改成了\"**动力过快**\"**（**⚠ 而\"**胃肠蠕动过快**\"**在**\"**胃排空加速、**餐后血糖骤升骤降**\"**上**确实有对应**（**⚠ 故**这个解释**比\"**阴虚**\"**更接近\"**代谢**\"**）；**④⚠ 而\"**白虎汤证**\"这一层**也重要**（**⚠ 白虎汤**治\"**大热、大汗、大渴、脉洪大**\"**（**⚠ 而\"**大渴**\"**确实是**高血糖的渗透性利尿所致**（**⚠ 故\"**上消用白虎**\"**这条线**在\"**口渴**\"**上是**对的**）。** **⚠ 本集按语**：**这一篇**最值得记的是\"**消渴 ≈ 糖尿病**\"这个对应**（**⚠ 而**它**让一本汉代的书写的东西**，**可以拿到今天来读**（**⚠ 而**第二值得记的**是\"**二阳结**\"**这个机制**（**⚠ 即：**胃肠过热 → 消化太快 → 水被抽走 → 多尿**\"**（**⚠ 而这一层**在\"**高血糖 → 渗透性利尿 → 多尿**\"**上**确实对得上** ✓）。","o":"RJ-2941 · 人纪·金匮要略·消渴小便不利淋病脉证并治第十三（PDF 第390页）"},{"t":"二、\"小火煮肉，肉会变脂肪\"","h":"一个极妙的比喻，与它的合理内核","c":"要点——**讲义用\"小火煮肉\"解释了\"为什么胰脏会变成一块肥肉\"，而这是**一个极妙的比喻**，须照录并核**：\"**'**其中间的地带，在胃的下方有一个脏，中医叫「**脺肉**」，西医叫做**胰脏**'。'大家做个实验：**今天晚上回家，拿一小锅水，不要煮滚，开一点点火**——**当水表面上有一点蒸气、还没有滚时，你拿一块肉丢下去，小火慢慢的煮**'。'**那个肉是不会被煮烂的，但是会变脂肪，其质会变**'。'**西医发现到这一点，就说「糖尿病的原因是从胰脏发炎（来的）」**'。**\" **须说明（四层）**：**①这个比喻**的画面极准** ✓✓（**⚠ \"**低温、长时间**\"**→**\"**肉的性质改变**\"**（**⚠ 而\"**慢炖**\"**确实是**结缔组织分解、脂肪析出**（**⚠ 故\"**其质会变**\"**这个说法**在\"**口感/质地**\"上**是对的**）；**②⚠ 而\"**肉会变脂肪**\"这一句**须标**（**⚠ 肉里的**脂肪**是**析出的**（**不是**转化来的**（**⚠ 而\"**肉变成脂肪**\"**不是一个化学转化**（**⚠ 故**这是**比喻**，**不是**机制**）；**③⚠ 而\"**胰脏变成脂肪**\"这一层**却**有真实的对应** ✓（**⚠ 现代有一个词：**胰腺脂肪浸润（pancreatic lipomatosis）**（**⚠ 而它**确实**与**肥胖、代谢综合征、2 型糖尿病**相关**（**⚠ 故\"**胰脏变成一块肥肉**\"**不是**空话**（**⚠ 它是**一个**真实的病理**）；**④⚠ 而\"**小火慢煮**\"这个比喻**解释的**是\"**持续的低强度刺激**\"**（**⚠ 而它**恰好**对应**\"**久坐 + 睡前吃宵夜**\"**（**⚠ 故\"**不是大火烧焦，是小火慢慢把质地煮坏**\"**这个图像**极贴切** ✓）。** **⚠ 本集按语**：**这个比喻**是**全册**最好的\"**用厨房经验讲病理**\"**之一**（**⚠ 而它**只需要**一锅水、一块肉、一点火**（**⚠ 故它**比\"**胰岛 β 细胞功能衰竭**\"**更好懂**（**⚠ 而**它**说的其实**就是\"**慢性、低度、持续的负荷**\"**（**⚠ 而\"**慢性低度负荷**\"**正是**现代对\"**代谢性疾病**\"**的核心描述** ✓）。","o":"RJ-2942 · 人纪·金匮要略·消渴小便不利淋病脉证并治第十三（PDF 第390~391页）"},{"t":"三、三消三方","h":"上消人参白虎、下消肾气丸、中消泽兰丸","c":"方法——**讲义把糖尿病分成三种，各配一个方，而其中有一个**是讲义自创的**，须照录并标**：\"**'经方里面，张仲景只用二个处方治疗上消和下消**'。'**单纯的大肠太热、肾脏的功能不行的时候，他的处方是金匮肾气丸**'。'**如果是单纯的上焦太热——因为是胃太热了造成肺里面跟着燥热，病人会大渴、渴饮千杯不能止渴，这时仲师用的是人参白虎汤**'。'**临床上看下消症时，仲师用的是肾气丸；中消的就是我现在使用的泽兰丸**'。'**人参白虎汤治疗上消效果非常的迅速**'。'**糖尿病的症状有三种**：**第一种是上消糖尿病，主要症状是口渴得很厉害、喝水再多都无法止渴**——**只要人参白虎汤喝下去，几剂药之后血糖就会恢复正常**'。'**第二种是下消糖尿病，主要症状是阳不举**——**肾气丸可能你要吃较长的时间，连续吃个半年左右**'。'**第三种是中消糖尿病，饥食百碗不能解饥**——**因为肉过热而造成的，就是我现在要介绍的**'。'**张仲景对于中消没有开立处方，其实就是我用的泽兰丸**'。**\" **须说明（四层）**：**①三消的**对应**极清楚**：\n\n| 消 | 主症 | 讲义给的方 |\n|---|---|---|\n| 上消 | 渴饮千杯不能止渴 | 人参白虎汤 |\n| 中消 | 饥食百碗不能解饥 | 泽兰丸（讲义自创） |\n| 下消 | 阳不举 | 金匮肾气丸 |\n\n**——⚠ 故\"**三多一少**\"**被分到了三个方**（**⚠ 而\"**多饮 → 上消**\"、\"**多食 → 中消**\"、\"**多尿/阳痿 → 下消**\"**（**⚠ 而这一层**在\"**症状归经**\"上**极清楚**）；**②⚠ 而\"**张仲景只用二个处方**\"这一句**极诚实**（**⚠ 它**明确说了\"**中消没有方**\"**（**⚠ 而\"**泽兰丸**\"**是**讲义自己的方**（**⚠ 故**这一层**须标**（**⚠ 不是仲景方**）；**③⚠ 而\"**几剂药之后血糖就会恢复正常**\"这一句**须标**（**⚠ 人参白虎汤**对\"**高血糖的高渗状态**\"**可能**有**短期的症状缓解**（**⚠ 而\"**血糖恢复正常**\"**不等于\"**糖尿病治愈**\"**（**⚠ 而\"**几剂药**\"**这个说法**会让病人**停药**（**⚠ 故**这一层**须改为\"**须监测血糖、不可自行停药**\"**）；**④⚠ 而\"**肾气丸吃半年**\"这一层**也有一个合理的对应**（**⚠ 肾气丸**（**八味地黄丸**）**含**附子、桂枝**（**⚠ 而\"**下消**\"**用\"**温阳**\"**的思路**与\"**糖尿病肾病/性功能减退**\"**在中医辨证上**确有对应**（**⚠ 而\"**阳不举**\"**的**第一件事**是**查血管、神经、药物、激素**（**不是先\"**补肾**\"**）。** **⚠ 本集按语**：**三消三方**这个框架**最值得记的是\"**按主症分**\"**（**⚠ 而它**比\"**按血糖分**\"**更**贴近病人的感受**（**⚠ 而\"**多饮、多食、多尿**\"**这三件事**，**每个病人都能自己说**（**⚠ 故**问诊**从这三句开始**，**比从\"**辨证**\"开始**有用**。","o":"RJ-2943 · 人纪·金匮要略·消渴小便不利淋病脉证并治第十三（PDF 第391页）"},{"t":"四、\"吃完马上又饿，不吃就手抖\"","h":"一段对\"糖尿病前期\"的描写，极准","c":"要点——**讲义描述了一组**极具体的早期表现**，而这一组**在今天的名字**很清楚**，须照录**：\"**'**所以你最初期得到糖尿病的时候，吃东西会吃不饱、肚子饿了又要吃**——**这是糖尿病的先期预兆**'。'**给西医看时会说「是你的血糖太低了」**'。'**所以吃完食物后马上又饿**——**饿的时候如果不吃点东西，手就会颤抖，或者会心慌、心悸、冒冷汗、发热**——**必须赶快吃点东西下去，就会舒服一点**'。'**这是先期糖尿病的预兆**——**到了这个阶段，实际上就代表胰脏已经有问题了**'。**\" **须说明（四层）**：**①\"**吃完马上又饿 + 手抖 + 心慌 + 冒冷汗 + 发热 + 吃点东西就好**\"这一组**极准** ✓（**⚠ 这正是**\"**低血糖反应**\"**的典型**（**⚠ 而\"**吃点东西就好**\"**是**最好的确认**）：**②⚠ 而\"**给西医看会说血糖太低**\"这一句**也极准**（**⚠ 如果**测到**餐后 3~4 小时血糖偏低**，**那确实是**\"**反应性低血糖**\"**（**⚠ 而\"**反应性低血糖**\"**恰恰**是**\"**胰岛素抵抗/2 型糖尿病前期**\"**的**一个常见表现**（**因为**胰岛素分泌高峰延迟**（**⚠ 故\"**先期糖尿病的预兆**\"**这个判断**方向是对的** ✓）；**③⚠ 而\"**代表胰脏已经有问题了**\"这一层**也**有对应**（**⚠ β 细胞**的**分泌节律异常**（**⚠ 而\"**有问题**\"**不等于\"**坏了**\"**（**⚠ 故**这一层**应读作\"**功能紊乱的早期**\"**）；**④⚠ 而这一段的**临床意义**极大**（**⚠ 因为它**给了一个\"**可自测的早期信号**\"**（**⚠ 而**很多人**把\"**吃完就饿、手抖**\"**当成\"**胃好**\"**或\"**低血糖**\"**（**⚠ 故**这一层**最值得记**：**\"**饿到发抖、心慌、出冷汗**\"**不是\"**消化好**\"**（**是**血糖调节在报警**）。** **⚠ 本集按语**：**这一段**最有用的是它**把\"**糖尿病**\"**从一个\"**老年病**\"**提前到了\"**三十几岁的功能紊乱**\"**（**⚠ 而\"**手抖、心慌、冒汗**\"**这三个字**，**是**一个**可以自己观察的入口** ✓）。","o":"RJ-2944 · 人纪·金匮要略·消渴小便不利淋病脉证并治第十三（PDF 第391页）"},{"t":"五、\"糖尿病遗传是断章取义\"","h":"一个须修正一半的说法","c":"风险——**讲义否定了\"遗传\"，而这一层**只对了一半**，须照录并修正**：\"**'**西医说糖尿病会遗传，这是断章取义的说法**——**应该前面再加一句话「生活习惯」才对**'。'**并不是体质上会遗传**'。'**今天胰脏变成脂肪，生个儿子胰脏也是块脂肪，哪有这种事情？**'。'**其实是因为生活上有共同的习惯**'。'**做爸爸的在工厂、公司做生意很忙**……**回到家里面都很晚了**——**一回来就说「你们通通起，跟爸爸一起吃，爸爸要跟你们聊聊天」**'。'于是**大家一起吃宵夜**……**日日如此**'。'**父亲的生活习惯不对，于是得到糖尿病；结果儿子也被父亲感染到这种吃宵夜的习惯，于是儿子以后也是糖尿病**'。'**这就是生活习惯上的遗传**'。**\" **须说明（四层，逐层核）**：**①\"**生活习惯会在家庭里传递**\"这一层**是真的** ✓（**⚠ 家庭共享**饮食结构、**进餐时间、**运动量、**睡眠节律**（**⚠ 故\"**吃宵夜的习惯会传下去**\"**确实成立**）；**②⚠ 而\"**并不是体质上会遗传**\"这一句**须明确修正**（**⚠ 2 型糖尿病**的**遗传度**很高**（**⚠ 单卵双胎**的同病率**约 70~90%**（**双卵双胎**约 20~30%**）——**⚠ 故\"**体质不遗传**\"**是错的**（**⚠ 家族史**是**2 型糖尿病最重要的危险因素之一**）；**③⚠ 而\"**哪有这种事情**\"这一句的**类比**（**\"**父亲胰脏是脂肪，儿子胰脏也是脂肪**\"**）**也不成立**（**⚠ 遗传**传的是**\"**易感性**\"**（**基因变异**）**（**不是**\"**一个已经变性的器官**\"**（**⚠ 故**这个反驳**打的是一个**不存在的靶子**）；**④⚠ 而**正确的说法**是**：**遗传（易感性）＋ 环境（生活习惯）**共同作用**（**⚠ 而\"**共同生活习惯**\"**只是**环境的一部分**（**⚠ 故**讲义**看到了一半**，**否定了另一半**）。** **⚠ 本集按语**：**这一段**最值得留的是\"**吃宵夜的习惯会传下去**\"**（**⚠ 而**它**在临床上**确实**是**一个**可以干预的点**（**⚠ 故**问家族史**，**不只问\"**有没有糖尿病**\"**，**还要问\"**家里几点吃饭、吃不吃宵夜**\"** ✓）。","o":"RJ-2945 · 人纪·金匮要略·消渴小便不利淋病脉证并治第十三（PDF 第391~392页）"},{"t":"六、\"糖尿病人会胖，是打胰岛素造成的\"","h":"一个只有一半成立的因果","c":"风险——**讲义把\"胖\"归给了药，而这一层**须分为两半**，须照录并核**：\"**'**糖尿病的人会发胖，是因为打胰岛素、吃降血糖药造成的**——**并不是因为糖尿病才胖起的**'。'**如果有一种药让他不但不胖、反而让他瘦下去，光是病人会瘦下去就代表血糖下降**'。**\" **须说明（四层）**：**①\"**胰岛素与磺脲类会增重**\"这一层**是真的** ✓（**⚠ 胰岛素**促进**葡萄糖摄取与脂肪合成**（**⚠ 而\"**打胰岛素后体重上升**\"**是**一个**已知的副作用**（**⚠ 故**这一句**的前半段**成立**）；**②⚠ 而\"**并不是因为糖尿病才胖起的**\"这一句**把因果方向反了**（**⚠ 2 型糖尿病**患者中**约 80% 以上**超重或肥胖**（**⚠ 而\"**肥胖**\"**是**\"**胰岛素抵抗 → 2 型糖尿病**\"**的**最主要驱动因素**（**⚠ 故\"**胖**\"**在多数情况下**是\"**因**\"**，**不是\"**果**\"**（**⚠ 而\"**用药后进一步增重**\"**是**\"**叠加**\"**）；**③⚠ 而\"**瘦下去就代表血糖下降**\"这一层**须标**（**⚠ 体重下降**确实**可见于**血糖失控**（**因为**尿糖排出热量**）——**⚠ 故\"**瘦**\"**在\"**血糖很高**\"**的阶段**是**\"**病在加重**\"**（**⚠ 故\"**瘦＝好转**\"**这个等式**不成立**（**⚠ 而\"**减重**\"**在\"**2 型糖尿病**\"**的**早期干预**里**确实**是**有效的**（**⚠ 但那是\"**主动减重**\"**，**不是\"**病性消瘦**\"**）；**④⚠ 而这一段的**真正问题**是**：**它**用\"**药会致胖**\"**否定了\"**肥胖是病因**\"**（**⚠ 而**这**会**误导病人**把\"**体重管理**\"**放到\"**停药**\"**上去**（**⚠ 故**本集的处置是**：**保留\"**胰岛素可增重**\"**，**删除\"**胖是药造成的**\"**这个单向因果**，**并注明\"**肥胖是 2 型糖尿病最主要的可干预危险因素**\"**。** **⚠ 本集按语**：**体重**与**血糖**的关系**有两个方向**（**⚠ \"**胖 → 胰岛素抵抗 → 血糖高**\"**（**⚠ \"**血糖失控 → 尿糖排热 → 瘦**\"**）——**⚠ 故\"**胖了/瘦了**\"**要**先问\"**在哪个阶段**\"**（**而不是**先问\"**吃了什么药**\"**）。","o":"RJ-2946 · 人纪·金匮要略·消渴小便不利淋病脉证并治第十三（PDF 第392页）"},{"t":"七、\"人在睡觉，胃在动\"","h":"一句对\"睡前吃东西\"的精准刻画","c":"要点——**讲义把\"吃宵夜\"的危害说到了机制层，而这一句**极精**，须照录**：\"**'**这些致病原因，跟现在的工商业忙碌的社会行为，还有我们的生活习惯很有关系**'。'**每天坐在那边工作**——**我们的血糖本就需要多动把它消耗掉**，**结果因为坐在办公室的时间太多、缺乏运动**'。'**再加上有时候忙了一天，白天没有好好吃一顿，晚上回到家里面就吃个宵夜再睡觉**——**于是食物闷在胃里面过久**'。'**我们人睡觉的时候，胃里面没有东西比较健康**——**因为睡觉的时候胃的蠕动会慢慢减缓下**'。'**如果在睡觉前吃了许多食物到胃里面去，胃因为有食物在里面，胃又不能不动**——**于是在那边压挤**'。'**正常人晚上睡觉的时候，胃火就下降、蠕动就减缓**——**结果你吃食物下去刺激它蠕动，于是变成人在睡觉、胃在动**'。'**日久以后就造成血糖过高的情形**'。**\" **须说明（四层）**：**①\"**人在睡觉、胃在动**\"这六个字**极精** ✓✓（**⚠ 它**把\"**夜间本该休息的器官被迫加班**\"**讲成了一个**有画面的对照**（**⚠ 故它**比\"**夜间进食危害健康**\"**好记一百倍**）；**②⚠ 而\"**胃在夜里蠕动会减缓**\"这一层**有生理依据**（**⚠ 夜间**胃肠动力**确实**下降**（**⚠ 故\"**睡前大量进食**\"**会**延长胃排空时间**（**⚠ 而\"**食物闷在胃里**\"**这个描述**对得上**）；**③⚠ 而\"**食物在胃里压挤**\"这一层**也**有对应**（**⚠ 夜间**胃内压升高**（**⚠ 故**它**是**\"**胃食管反流、**夜间咳嗽、**睡眠质量下降**\"**的**一个来源**）；**④⚠ 而\"**日久就造成血糖过高**\"这一层**须标**（**⚠ 睡前进食**确实**影响**夜间与晨起血糖**（**⚠ 而\"**造成糖尿病**\"**是**一个**长期、多因素的**结果**（**⚠ 故**这一层**应读作\"**加重因素**\"**）。** **⚠ 本集按语**：**\"**人在睡觉、胃在动**\"**这一句**是**全册**最有画面的一句\"**生活方式批评**\"**（**⚠ 而它**直接推出**一条**极便宜的建议**：**睡前三小时不进食**（**⚠ 而**这条建议**在**胃食管反流、**血糖管理、**睡眠**上**同时有效** ✓）。","o":"RJ-2947 · 人纪·金匮要略·消渴小便不利淋病脉证并治第十三（PDF 第391~392页）"},{"t":"八、糖尿病的自然史：三条并发症通路","h":"\"脚上伤口化脓不愈、洗肾、心衰\"——一段极准的转归","c":"风险——**讲义描述了糖尿病未控制时的转归，而这一段**三条通路都对得上**，须照录**：\"**'**如果糖尿病没有被治好，到最后就会进入肝**——**肝脏是我们人体的最后一道防线，病到肝脏就停住了**'。'**这类病人到最后都会出现厥阴证**——**比如说嗜眠，嗜眠就是昏睡，然后疲倦、不想动**'。'**糖尿病患如果脚上有伤口的话，就会化脓不愈、骨头会生坏蛆**'。'**最后经过长期的洗肾，等到心脏衰竭就死掉了**'。**\" **须说明（四层）**：**①\"**脚上伤口化脓不愈、骨头生坏蛆**\"这一层**极准** ✓✓（**⚠ 它**正是**\"**糖尿病足**\"**（**⚠ 而\"**骨头生坏蛆**\"**＝**\"**骨髓炎 + 坏死**\"**（**⚠ 故**这四个字**是**一个**极准确的**并发症描述**）；**②⚠ 而\"**长期洗肾 → 心脏衰竭 → 死亡**\"这一层**也极准** ✓✓（**⚠ 它**描述的**正是**\"**糖尿病肾病 → 终末期肾病 → 透析 → 心血管死亡**\"**这条链**（**⚠ 而**糖尿病患者**在透析人群中**占比很高**（**⚠ 故**这一段**是**一个**准确的\"**自然史**\"**）；**③⚠ 而\"**嗜眠、疲倦、不想动**\"这一层**须标**（**⚠ 它**可能**对应**\"**高血糖高渗状态、**酮症酸中毒、**甲减、**抑郁**\"**（**⚠ 故**\"**嗜睡**\"**在糖尿病里**是一个**要查的急症信号**）；**④⚠ 而\"**病到肝脏就停住了**\"这一层**须标**（**⚠ 糖尿病**的**靶器官**是**血管**（**⚠ 故**它**影响**心、脑、肾、眼、足、神经**（**⚠ 而\"**肝**\"**不是**终点**）。** **⚠ 本集按语**：**这一段**是**全册**对\"**糖尿病为什么要认真治**\"**回答得最好的一段**（**⚠ 因为**它**没有讲\"**阴阳**\"**（**它讲了**三件**可以看见的事**（**⚠ 而**这三件事**在**任何一个内分泌科的病房里**都**看得到**（**⚠ 故\"**这段话是对的**\"**（**⚠ 而**它的结论**——\"**要控制血糖、要护足、要查肾**\"**（**是**今天所有指南的第一条** ✓）。","o":"RJ-2948 · 人纪·金匮要略·消渴小便不利淋病脉证并治第十三（PDF 第392页）"},{"t":"九、\"三十五到四十五岁最容易\"","h":"一句关于\"发病年龄\"的观察，与它的社会背景","c":"要点——**讲义指出了糖尿病的一个**高发年龄段**，而这一层**在今天是可核的**，须照录**：\"**'**男人在三十五岁到四十五岁这中间最容易遇到这种问题**'。'**一般人的事业于此时迈向巅峰，大家都拼命在向前冲事业**，**结果小孩子也养成吃宵夜的习惯**'。'**所以很多人到了五十几岁、钱是赚到了，当想要去享受时，却被发现得到糖尿病**'。'**中国人的观念是「民以食为天」，饮食是一种人间享受**——**结果因为糖尿病而不能随便吃东西**'。'**而小孩子从小跟着父亲到大，也是吃宵夜吃出习惯**——**不吃东西手脚会发抖，晚上一定要吃了才能睡觉**'。'**这就是原因**'。**\" **须说明（四层）**：**①\"**三十五到四十五岁**\"这个年龄段**与今天的流行病学**有一个对应**（**⚠ 2 型糖尿病**的发病年龄**在提前**（**⚠ 而**\"**三十几岁确诊**\"**已不罕见**（**⚠ 故**这个观察**方向是对的**）；**②⚠ 而\"**事业巅峰 + 宵夜 + 缺运动**\"这一组**极准**（**⚠ 它**描述的**正是**\"**中年男性代谢综合征**\"**的**典型生活方式**（**⚠ 而\"**应酬、晚睡、久坐**\"**是**三个**可干预的点**）；**③⚠ 而\"**五十几岁钱赚到了，想享受时发现得病**\"这一句**极有分量**（**⚠ 它**是**一句\"**代偿延迟**\"**的写照**（**⚠ 而**这一层**在**劝人早查**上**比任何说教都有效**）；**④⚠ 而\"**饮食是一种人间享受，结果因为糖尿病而不能随便吃**\"这一层**须标**（**⚠ 糖尿病**的饮食**不是\"**不能吃**\"**（**是\"**会吃**\"**（**⚠ 故**这一层**应改为\"**需要学习怎么吃**\"**（**⚠ 而**\"**不能随便吃**\"**这类说法**会**加重病人的负担与病耻感**）。** **⚠ 本集按语**：**这一段**最值得记的是\"**五十几岁才发现**\"**（**⚠ 因为**2 型糖尿病**的**早期**往往**没有症状**（**⚠ 故\"**三十五岁以后**，**每年查一次空腹血糖 + 糖化血红蛋白**\"**是**一条**极具体的建议**（**⚠ 而有家族史、超重、久坐的人**应**更早开始** ✓）。","o":"RJ-2949 · 人纪·金匮要略·消渴小便不利淋病脉证并治第十三（PDF 第392页）"},{"t":"十、\"这种病多见于富贵人家\"","h":"一句\"富贵病\"的来历","c":"要点——**讲义用\"古人的运动量\"解释了为什么这病\"多见于富贵人家\"，须照录**：\"**'**古时又没有飞机、车子之类**——**要拜访隔壁邻居都要走好几公里**，**多数人的运动量都很多**'。'**所以这种病多见于富贵人家**'。'**现在车子很多，大家养尊处优、坐在那边没有动**——**于是造成很多人得到糖尿病**'。**\" **须说明（四层）**：**①\"**富贵人家**\"这个说法**极准** ✓（**⚠ 糖尿病**在历史上**确实**被称为\"**富贵病**\"**（**⚠ 因为**它**与\"**吃得好、动得少**\"**相关**（**⚠ 故**这个名字**至今仍在用**）；**②⚠ 而\"**走几公里拜访邻居**\"这个对比**极生动**（**⚠ 它**把\"**运动量**\"**从\"**健身**\"**拉回到了\"**日常生活**\"**（**⚠ 而**现代人**的\"**运动量不足**\"**不是\"**没去健身房**\"**（**是\"**日常活动被机器替代**\"**（**⚠ 故**这一层**极重要**）；**③⚠ 而\"**养尊处优、坐着没动**\"这一层**与第 n40 条\"**尊荣人，骨弱肌肤盛**\"**是**同一个画像**（**⚠ 故**两千年前的\"**尊荣人**\"**与今天的\"**久坐族**\"**是**同一类人** ✓）；**④⚠ 而这一层**最有用**的是它**推出了一条**不需要花钱的建议**（**⚠ \"**把日常活动加回来**\"**（**⚠ 如**走楼梯、**步行通勤、**站着打电话**（**⚠ 而**它**比\"**办健身卡**\"**更容易坚持** ✓）。** **⚠ 本集按语**：**\"**富贵病**\"**这三个字**有一个**反面的价值**（**⚠ 它**提醒**：**这不是\"**命**\"**（是\"**生活方式**\"**（**⚠ 而**生活方式**可以改**（**⚠ 故\"**富贵病**\"**不是**一句抱怨**（**是一句\"**可以改**\"**的提示** ✓）。","o":"RJ-2950 · 人纪·金匮要略·消渴小便不利淋病脉证并治第十三（PDF 第392页）"},{"t":"一、五水：五个定义，四个区分维度","h":"风水、皮水、正水、石水、黄汗","c":"定义——**原文一口气给了五种\"水\"，而它们的区分**只用了四个维度**，须照录**：\"**'**病有风水，有皮水，有正水，有石水，有黄汗**'。**\" 五个定义**：\"**'**风水，**其脉自浮，外证骨节疼痛，恶风**'。'**皮水，其脉亦浮，外证胕肿、按之没指，不恶风，其腹如鼓，不渴，当发其汗**'。'**正水，其脉沉迟，外证自喘**'。'**石水，其脉自沉，外证腹满不喘**'。'**黄汗，其脉沉迟，身发热，胸满，四肢头面肿，久不愈，必致痈脓**'。**\" **须说明（四层）**：**①这五个定义**其实只用了四个维度**：\n\n| 名 | 脉 | 恶风？ | 喘？ | 肿在哪 / 特点 |\n|---|---|---|---|---|\n| 风水 | 浮 | 恶风 | — | 骨节疼痛 |\n| 皮水 | 浮 | 不恶风 | — | 胕肿、按之没指、腹如鼓、不渴 |\n| 正水 | 沉迟 | — | 自喘 | 里 |\n| 石水 | 沉 | — | 不喘 | 腹满 |\n| 黄汗 | 沉迟 | — | — | 身发热、胸满、四肢头面肿、汗黄 |\n\n**——⚠ 故**看病时**只需问四件事**（**⚠ 脉浮还是沉？**怕不怕风？**喘不喘？**肿在哪？**（**⚠ 而**这四件事**都能在床边**当场得到**（**⚠ 故\"**五水**\"**不是**五个**要背的名词**（**是**四个**可查的维度**）；**②⚠ 而\"**恶风**\"与\"**不恶风**\"这一对**极重要**（**⚠ 风水**有**表证（恶风）**（**⚠ 皮水**没有**表证**（**⚠ 故\"**怕不怕风**\"**区分了\"**邪在表**\"**与\"**水已入里**\"**（**⚠ 而**这一层**是**\"**该发汗还是该利水**\"**的分界**）；**③⚠ 而\"**喘**\"与\"**不喘**\"**也极重要**（**⚠ 正水**自喘**（**⚠ 石水**腹满不喘**（**⚠ 故\"**喘**\"**提示**\"**水已经影响到心肺**\"**（**⚠ 而不喘**说明**\"**水还在下/在腹**\"**）；**④⚠ 而\"**胕肿、按之没指**\"这一层**极准**（**⚠ 它**＝**\"**凹陷性水肿**\"**（**⚠ 而\"**腹如鼓**\"**＝**\"**腹水**\"**（**⚠ 故**皮水**其实**是**\"**全身性水肿 + 腹水**\"**）。** **⚠ 本集按语**：**这五水的**实用价值**不在\"**背五个名字**\"**（**在\"**四个维度**\"**（**⚠ 而**它们**恰好**对应**现代查体**最基础的四步**（**⚠ 故**今天的医生**问\"**有没有水肿、**怕不怕风、**喘不喘、**按下去有没有坑**\"**（**与张仲景问的**是**同一组问题** ✓）。","o":"RJ-2951 · 人纪·金匮要略·水气病脉证并治第十四（PDF 第418页）"},{"t":"二、\"一层比一层深\"","h":"五水不是五种病，是一条进程","c":"要点——**讲义把五水排成了一个**由浅入深的次序**，而这一层**比记住五个名字重要**，须照录**：\"**'**现在讲的水气病跟前面的饮病不一样**：**饮病是内发的病造成的水肿，而这里的水气病是外感引起的**'。'**一开始感受到风邪时没有立刻被排掉，于是造成的水肿，这就叫风水**'。'**风水如果没有去掉，日久就慢慢严重的变成皮水**；**皮水再没被治好时，就变成里水**'。'**积水的过程就是这个样子——所以是一层比一层深**'。'那基本上，**是因为先有风水**——**病人有风水了，结果碰到医生不晓得如何去治他，结果水跑到更里面，就变成皮水**'。'**那皮水呢，再失去治疗的时机，才会跑到正水跟石水、黄汗，这是里水**'。'**这是水的源头**'。**\" **须说明（四层）**：**①\"**一层比一层深**\"这五个字**是**这一篇的骨架**（**⚠ 而它**把五个名词**变成了**一条**进程**（**⚠ 故\"**风水**\"**不是**\"**另一种病**\"**（**是\"**同一条路的早期**\"**）；**②⚠ 而\"**表证失治 → 水气**\"这一层**极重要**（**⚠ 它**给了一个**\"**可以打断的链条**\"**（**⚠ 故\"**在表证阶段治好，就不会有水病**\"**（**⚠ 而**这一层**是**预防的入口**）；**③⚠ 而\"**碰到医生不晓得如何治**\"这一句**极诚实**（**⚠ 它**承认了**\"**误治/失治**\"**是**链条的推手**（**⚠ 而**这一层**在今天的对应**是**\"**感染后未彻底处理、**水肿被当成别的病**\"**）；**④⚠ 而\"**正水跟石水、黄汗**\"**被归为\"**里水**\"**（**⚠ 而\"**里水**\"**另有一个更细的定义**（**⚠ 在后面的条文里**）——**⚠ 而**这一层**须标**（**⚠ \"**里水**\"**在《金匮》里**既指\"**病位在里**\"**（**也指**\"**一个具体的方证（里水，越婢加术汤主之）**\"**（**⚠ 故**两个含义**不能混**）。** **⚠ 本集按语**：**\"**一层比一层深**\"**这个框架**有一个**现代对应**（**⚠ 它**很像**\"**代偿 → 失代偿 → 终末**\"**（**⚠ 而**水气**从\"**皮下**\"**到\"**腹水/胸水**\"**到\"**全身**\"**（**⚠ 故\"**深度**\"**可以**对应**\"**液体在哪个腔隙**\"**（**⚠ 而**这一层**是**影像学**能**看见的**（**⚠ 故\"**五水**\"**与\"**B 超**\"**能对上** ✓）。","o":"RJ-2952 · 人纪·金匮要略·水气病脉证并治第十四（PDF 第418~419页）"},{"t":"三、\"按之没指\"与\"胫骨前的一个洞\"","h":"一段极精的水肿查体手法","c":"方法——**讲义把\"皮水\"的\"胕肿、按之没指\"落到了具体的**检查部位**，而这一层**极实用**，须照录**：\"**'**「**皮水，其脉亦浮，外证胕肿，按之没指**」……**「老师，你怎么知道他是皮水？」**'。'**你看病人的脚胕、脚后跟的地方**——**我们讲的「胕」就是照海、太溪这一带肿起，你一压，凹个洞下去**'。'**然后还有脾经经过的胫骨这个骨头**——**诸位摸摸看这个骨头是不是平平扁扁的**'。'**当体内有水肿时，就会肿在这边**——**你按下去就凹一个洞，但是身体外面还没肿起**'。**\" **须说明（四层）**：**①\"**按之没指**\"这四个字**极准** ✓（**⚠ 它**＝**\"**凹陷性水肿（pitting edema）**\"**（**⚠ 而\"**压一个洞、久久不回弹**\"**是**它的判据**（**⚠ 故**这是一个**任何人都能做的检查**）；**②⚠ 而\"**照海、太溪一带**\"这个位置**极准**（**⚠ 内踝与跟腱之间**（**⚠ 而**这一带**正好是**\"**最容易先肿、又最容易被忽视**\"**的地方**（**⚠ 故**查水肿**从**内踝开始** ✓）；**③⚠ 而\"**胫骨前面**\"这一层**极重要** ✓✓（**⚠ \"**胫骨前**\"**是**\"**凹陷性水肿最经典的检查部位**\"**（**⚠ 因为**胫骨表面**没有肌肉覆盖**（**⚠ 故\"**按下去一个洞**\"**最容易显出来**（**⚠ 而\"**身体外面还没肿起**\"**这一句**极精**（**⚠ 它**说明**\"**早期水肿**\"**可以**\"**看不见、但按得出**\"**（**⚠ 故\"**看不出肿**\"**不等于**\"**没有水肿**\"**）；**④⚠ 而\"**脾经经过的胫骨**\"这一层**是一个**脏腑归类的解释**（**⚠ 而**它的合理内核**是\"**下肢水肿确实与低蛋白、静脉回流、心/肾功相关**\"**（**⚠ 故\"**按胫骨**\"**这个动作**与\"**脾**\"**的标签**可以分开看**）。** **⚠ 本集按语**：**这一段**是**全书**最\"**可以立刻做**\"**的一段**（**⚠ 而它**教的是**\"**怎么按、按哪里、看什么**\"**（**⚠ 故\"**按胫骨前面、看有没有坑**\"**这七个字**，**是**一个**不需要仪器的体检**（**⚠ 而**它**在**心衰、肾病、肝硬化、低蛋白、**药物性水肿**上**都**适用** ✓）。","o":"RJ-2953 · 人纪·金匮要略·水气病脉证并治第十四（PDF 第418页）"},{"t":"四、\"两个气化点：肺与三焦\"","h":"一套关于\"水为什么会停\"的解释","c":"要点——**讲义指出了体内\"气化水\"的两个场所，而这一层**极重要**，须照录**：\"**'「**其腹如鼓**」——**皮水大部分是由于三焦运送水的热度不够**'。'**我们身上真正在气化水的所在：一个是在三焦里面的水进入三焦时在气化，另一个在肺上面也在气化**'。'**如果在肺上面气化不足时，就发生风水**——**因为水在表、肺主皮毛在表**'。'**如果是三焦系统没有办法把水气化掉，会因为水停滞在三焦系统而肿起，就是这里在讲的皮水**'。**\" **须说明（四层）**：**①\"**两个气化点：肺 + 三焦**\"这个模型**极清晰** ✓（**⚠ 而它**把\"**水肿**\"**分成了**\"**表（肺）**\"**与\"**里（三焦）**\"**（**⚠ 故\"**风水**\"**与\"**皮水**\"**各有**一个**\"**失职的器官**\"**（**⚠ 而**这一层**让\"**五水**\"**有了**一个**统一的地基**）；**②⚠ 而\"**肺主皮毛在表**\"这一层**极重要**（**⚠ 它**解释了**\"**为什么肺的问题会先从皮肤表现出来**\"**（**⚠ 而**这一层**在\"**水肿先从眼睑/面部开始**\"**上**有对应**（**⚠ 而**更重要的对应**是**\"**肺水肿 → 端坐呼吸、泡沫痰**\"** ✓）；**③⚠ 而\"**三焦**\"**在这里**不只是一个\"**穴位**\"**（**它是一个\"**体腔的间隙**\"**（**⚠ 而**这一层**在**\"**腹膜腔、**胸膜腔、**组织间隙**\"**上**有对应**（**⚠ 故\"**三焦的水停滞**\"**可以读作**\"**第三间隙积液**\"** ✓）；**④⚠ 而\"**运送水的热度不够**\"这一层**是一个**\"**阳气推动**\"**的说法**（**⚠ 而**它的合理内核**是\"**心输出量、**淋巴回流、**静脉压力**\"**（**⚠ 故\"**热度不够**\"**可能对应**\"**回流动力不足**\"**）。** **⚠ 本集按语**：**\"**肺 + 三焦**\"**这个双点模型**最有用**（**⚠ 因为**它**把\"**水肿**\"**的**来源**分成了**\"**上源（肺）**\"**与\"**通道（三焦）**\"**（**⚠ 而**这两条**在**今天**恰好**对应**\"**心源性**\"**与\"**体液分布/淋巴**\"**（**⚠ 故\"**治水**\"**要么\"**宣肺**\"（**发汗**）**要么\"**通三焦**\"（**利水**）——**⚠ 而这**正是**下一段\"**腰以上发汗、腰以下利小便**\"**的来源** ✓）。","o":"RJ-2954 · 人纪·金匮要略·水气病脉证并治第十四（PDF 第418页）"},{"t":"五、黄汗：皮肤不黄，汗是黄的","h":"一个极精确的鉴别，与\"船夫\"的来历","c":"定义——**讲义把\"黄汗\"与\"黄疸\"分得极清，而这一层**是一个**极精确的鉴别**，须照录**：\"**'**黄汗是怎么得到的呢？过去在很多船夫的身上看到这种病**'。'这些船夫**是专门划船载客人渡江的**——**划到目的地后身体很热，于是流很多汗出**'。'到对岸后**在等下一批要渡江的客人时，因为全身大汗，所以就跳到水里面去凉快一下**'。'**并不是说因为跳到黄河游泳才造成身黄，其实跳到长江也会出黄汗的**'。'**因为运动所生的汗源自三焦**——**当人体正在流汗时却跳到水里面，体外的寒水将皮肤毛孔封住了**'。'**表被封住后，里面的水因为很热又要散出**——**要散又出不去**'。'**于是表面上看他皮肤并没有发黄，可是流出的汗液却是黄的，这就是黄汗**'。'**你看到病人如果皮肤是黄的，这是黄疸**'。'**黄汗就是：你看病人皮肤没有黄，可是流出的汗却是黄的**'。'**所以以前最多得到黄汗的就是渡船的船夫**'。**\" **须说明（四层）**：**①\"**皮肤不黄、汗是黄的**\"**与\"**皮肤黄**\"这一对**极精** ✓✓（**⚠ 它**用**一个\"**看哪里**\"**就分开了两个病**（**⚠ 故**这是**一个**极低成本**的鉴别**）；**②⚠ 而\"**运动出的汗源自三焦**\"这一层**有一个真实的对应** ✓（**⚠ 大量出汗 → **毛孔张开 → **冷水刺激 → **毛孔骤闭**（**⚠ 而\"**汗要出又出不去**\"**这个描述**在\"**黄汗/色汗症**\"**上**确实有对应**（**⚠ 而**更常见的对应**是**\"**大量出汗后受凉 → 感冒/肌痛**\"**）；**③⚠ 而\"**船夫**\"这个画像**极准**（**⚠ 它**在**\"**汗出当风、汗出入水**\"**这一类病因上**是**一个**经典的例子**（**⚠ 而**今天**对应**\"**运动后冲冷水、**大汗后进空调房**\"**（**⚠ 故**这一层**有**今天的版本**）；**④⚠ 而\"**黄汗**\"**在医学上的**真身**须标**（**⚠ 真正的\"**色汗**\"**极罕见**（**⚠ 而**\"**腋下衣服发黄**\"**更常见的原因是**\"**汗液 + 皮肤菌群 + 铝盐止汗剂**\"**（**⚠ 故\"**黄汗**\"**可以读作**\"**一种汗液异常的观察**\"**（**而不必是\"**一个独立的病**\"**）。** **⚠ 本集按语**：**\"**皮肤黄 vs 汗黄**\"**这个鉴别**最值得记**（**⚠ 因为**它**只问一句**（**⚠ 而**它**把两个**完全不同的病**（**黄疸（肝胆）**与**黄汗（汗液异常）**）**分开**（**⚠ 故**遇到\"**身上发黄**\"**，**第一句要问**\"**是皮肤黄还是衣服黄**\"** ✓）。","o":"RJ-2955 · 人纪·金匮要略·水气病脉证并治第十四（PDF 第418~419页）"},{"t":"六、\"腋下衣服发黄\"","h":"一个最好用的体征，极具体","c":"要点——**讲义把\"黄汗\"的**最具体体征**说清了，须照录**：\"**'所以以前最多得到黄汗的就是渡船的船夫**——**最特别的表现症状就是在衣服腋下部位出现黄黄的颜色**，**这就是黄汗了**'。**\" **须说明（四层）**：**①\"**衣服腋下部位发黄**\"这一条**极具体** ✓✓（**⚠ 它**是**一个**\"**看得见、摸得着**\"**的证据**（**⚠ 而**\"**黄汗**\"**这个名字**正是**从这里来的**（**⚠ 故**这是一个**\"**病名与体征完全对应**\"**的罕见例子**）；**②⚠ 而\"**腋下**\"这个部位**也极准**（**⚠ 腋下**是**大汗腺与皮脂腺最密集**的地方**（**⚠ 而**汗液 + 菌群分解**会**产生色素**（**⚠ 故\"**腋下发黄**\"**有**真实的生理基础**）；**③⚠ 而这一层的**实用价值**是**：**它**给了**一个**\"**不用问、只要看**\"**的入口**（**⚠ 故**遇到\"**汗味重、衣服发黄**\"**的人**，**可以**直接问\"**你的白衬衫腋下是不是黄的**\"** ✓）；**④⚠ 而\"**黄汗**\"**这个证的**现代对应**须说明**（**⚠ 多数是**\"**色汗症/腋毛癣（棒状杆菌感染）**\"**（**⚠ 而**少数**与**肝胆疾病（胆红素）**相关**（**⚠ 故\"**汗黄**\"**要**先看**\"**眼白黄不黄**\"**（**⚠ 若眼白也黄，是黄疸，不是黄汗**）。** **⚠ 本集按语**：**\"**衣服腋下发黄**\"**这七个字**是**全册**最\"**具体**\"**的一个体征**（**⚠ 而它**恰好**是**\"**问诊的极致**\"**（**⚠ 因为**它**不需要病人描述\"**感觉**\"**（**只需要**看一眼**衬衫**）——**⚠ 故\"**好体征**\"**的标准**是**\"**可以被第三个人核实**\"**（**⚠ 而\"**腋下发黄**\"**正好**符合**。","o":"RJ-2956 · 人纪·金匮要略·水气病脉证并治第十四（PDF 第419页）"},{"t":"七、\"疮家不可发汗\"","h":"一条汗法的禁忌，与它的判据","c":"风险——**讲义在讲\"水病用汗法\"时，立刻补了**禁忌**，须照录**：\"**'**我们不管是风水还是皮水，都是汗解，用汗来解**'。'**当用汗法的时候，一定要处方之前先确定，这个病人可不可以承受你的汗药**'。'**比如说这个病人坐在你的对面，头上长了很大的疮，已经告诉你不要用汗药了**'。'**你还在开个麻黄汤，诸如此类的**'。'**那如果说「老师，他说疮家不能发汗，那怎么办呢？」——小便把他排掉嘛**'。'**所以我们总是有方法**'。'**但有些禁忌，大家按照经方的禁忌**——**你只要按照禁忌（就不会错）**'。**\" **须说明（四层）**：**①\"**疮家不可发汗**\"这一条**极重要** ✓（**⚠ 它是**《伤寒论》**的**一条**明确禁忌**（**⚠ 而**它的机制**是**\"**疮疡本身耗伤津液，再发汗会进一步脱水、**加重感染扩散**\"**）；**②⚠ 而\"**头上长了很大的疮**\"这个例子**极具体**（**⚠ 它**说明\"**禁忌**\"**是**\"**看得见的**\"**（**⚠ 而不需要**背条文**（**⚠ 故**这是一个**\"**床边就能判断**\"**的禁忌**）；**③⚠ 而\"**小便把他排掉**\"这一句**极精**（**⚠ 它**给了**一条**\"**替代通路**\"**（**⚠ 而\"**总要有方法**\"**这个态度**是**一个**好的临床思维**（**⚠ 故\"**不能发汗就利水**\"**（**而**不能\"**硬发**\"**）；**④⚠ 而汗法的**其他禁忌**须补**（**⚠ 讲义只举了\"**疮家**\"**一例**（**⚠ 而《伤寒论》**还有**\"**淋家、**衄家、**亡血家、**汗家、**咽喉干燥者**\"**等**（**⚠ 故\"**发汗**\"**在**\"**脱水、**出血、**体虚**\"**上**都**要慎**（**⚠ 而**这一层**与**今天**\"**退烧药/发汗药**\"**的使用**是**同一条安全线**）。** **⚠ 本集按语**：**\"**疮家不可发汗**\"**这一条**在今天**有一个**不太被注意的对应**（**⚠ 一个**皮肤有大面积感染/溃疡**的人**（**⚠ 若**大量出汗/用发汗药**（**⚠ 会**加重脱水与感染**（**⚠ 故\"**有开放性伤口时，别急着发汗**\"**是**一条**可以照做的建议** ✓）。","o":"RJ-2957 · 人纪·金匮要略·水气病脉证并治第十四（PDF 第419~420页）"},{"t":"八、\"所有的水肿，久了都会化脓\"","h":"一段关于\"末端失养\"的转归","c":"风险——**讲义把\"久不愈必致痈脓\"扩到了所有水肿，而这一层**有真实的对应**，须照录**：\"**'「**久不愈，必致痈脓**」——**不单单是黄汗，所有的水肿如果长时间没有治好，到头都会化脓**'。'**因为我们四肢的末梢如果没有办法接受到正常的营养时，日久就会化脓坏死，生出坏蛆，很危险的**'。'**病人到最后都是因此而死**'。**\" **须说明（四层）**：**①\"**末梢没有营养 → 化脓坏死**\"这一层**极准** ✓✓（**⚠ 它**描述的**正是**\"**缺血性溃疡 + 感染 + 坏疽**\"**（**⚠ 而\"**坏蛆**\"**＝**\"**组织坏死**\"**（**⚠ 故**这一段**是**一个**准确的\"**外周血管病变**\"**描述**）；**②⚠ 而\"**水肿 → 化脓**\"这条链**有一个**真实的机制**（**⚠ 水肿**使**组织间压升高 → 毛细血管灌注下降 → 皮肤变薄、易破、愈合差**（**⚠ 故\"**水肿的腿**\"**确实**容易**\"**破皮、感染、溃疡**\"** ✓✓）；**③⚠ 而\"**病人到最后都是因此而死**\"这一层**须标**（**⚠ 它是**\"**一部分**\"**（**⚠ 而**现代**有**清创、**血运重建、**抗生素、**负压引流**（**⚠ 故\"**必死**\"**这个说法**是**旧时代的判断**）；**④⚠ 而这一段**最实用的**是它**提示**了**一件事**（**⚠ \"**水肿的腿**\"**要**当\"**高危皮肤**\"**对待**（**⚠ 故**保湿、**防破、**每日检查脚趾缝**（**⚠ 而**这一层**与**第 n44 条\"**糖尿病足**\"**是**同一条线** ✓）。** **⚠ 本集按语**：**\"**末梢没有营养**\"**这六个字**是**一个**准确的\"**缺血**\"**描述**（**⚠ 而**它**把\"**水肿**\"**从一个\"**美容问题**\"**拉到了\"**安全问题**\"**（**⚠ 故**一个**下肢长期水肿的人**，**要**查**动脉（**摸足背动脉**）**、要**护皮肤**、要**看有没有破口**（**⚠ 而**这三件事**，**都不需要**\"**辨证**\"**。","o":"RJ-2958 · 人纪·金匮要略·水气病脉证并治第十四（PDF 第419页）"},{"t":"九、\"表证失治，水就累积在身体里\"","h":"一个\"可以被打断\"的链条","c":"要点——**讲义把水病的来源归到了\"表证失治\"，而这一层**是一个**可以预防的入口**，须照录**：\"**'**水病呢，是外来的**——**就是表证失治**'。'**本来是桂枝汤证或者葛根汤证**——你遇到那个（**不用经方的**），**他就不会用麻黄汤、桂枝汤、葛根汤**'。'**表证没有去掉以后，这水慢慢的累积在身体里面**'。'**这失治，就是表证失去治疗的时机以后，才会造成水病的**'。'**所以说你如果一开始得了伤寒表证，或者重风，或者是温病的表证**——**经方有温病嘛，我们用葛根汤，就发掉，就根本不会有水病**'。**\" **须说明（四层）**：**①\"**表证失治 → 水气**\"**这条链**给了**一个**\"**可以打断**\"**的节点**（**⚠ 故\"**早治**\"**不只是\"**快点好**\"**（**是\"**防止并发症**\"**（**⚠ 而\"**这一层**在**\"**感染后肾炎**\"**上**确有对应**（**⚠ 如**链球菌感染后肾小球肾炎** ✓✓）；**②⚠ 而\"**水累积在身体里**\"这一层**须标**（**⚠ 感染后水肿**的**真实机制**是**\"**免疫复合物沉积 → 肾小球损伤 → 水钠潴留**\"**（**⚠ 而**不是\"**表邪没发出去**\"**（**⚠ 故\"**失治**\"**这个说法**在**方向上是\"**早治可防**\"**（**⚠ 而**在**机制上是\"**另一条路**\"**）；**③⚠ 而这一段里\"**那种药是拿来涮牙漱口的**\"这一句**是**对同行的**情绪攻击**（**⚠ 它**不含任何可核的信息**（**⚠ 故**本集**一律剔除**）；**④⚠ 而\"**经方有温病，我们用葛根汤**\"这一层**也是一句**可争的说法**（**⚠ \"**温病**\"**与\"**伤寒**\"**的**治法**在**历史上有过长期争论**（**⚠ 而**这一层**在**第 n22 条（经方与温病之争）**已经处理过**（**⚠ 故**此处**不重复**）。** **⚠ 本集按语**：**\"**表证失治 → 水气**\"**这个框架**最值得留的是\"**早治**\"**（**⚠ 而**它的**反面**（**\"**某些药不管用**\"**）**是一个**流派之争**（**⚠ 故**本集**只留\"**链条**\"，**删\"**攻击**\"**（**⚠ 而**这一层**与**整本册子的处理方式**是**一致**的**。","o":"RJ-2959 · 人纪·金匮要略·水气病脉证并治第十四（PDF 第418~419页）"},{"t":"十、\"腰以上发汗，腰以下利小便\"","h":"一句水肿治则，极简、极实用","c":"方法——**这一篇的核心治则只有一句，而它**按\"肿在哪\"分开两条路**，须照录**：\"**'**诸有水者，**腰以下肿，当利小便；腰以上肿，当发其汗乃愈**'。**\" **须说明（四层）**：**①\"**腰以上发汗、腰以下利小便**\"这十二个字**是**全书**最简的一条治则**（**⚠ 而它**按\"**位置**\"**分**\"**通路**\"**（**⚠ 故\"**肿在哪**\"**决定了\"**水从哪走**\"**）；**②⚠ 而这一层**有**生理上的依据** ✓（**⚠ 腰以上**（**肺、**头面**）**的**水**更**依赖**\"**宣肺、**发汗**\"**（**⚠ 因为**肺主皮毛**、**汗腺**在**体表**（**⚠ 腰以下**（**下肢、**腹**）**的**水**更**依赖**\"**利小便**\"**（**⚠ 因为**重力**使**液体**下**沉**、**肾/膀胱**是**主要出口**）；**③⚠ 而\"**乃愈**\"这两个字**也**重要**（**⚠ 它**说明**这是**\"**可以治愈**\"**的**（**⚠ 故**\"**水肿**\"**在**早期**是**\"**可逆**\"**的**（**⚠ 而**这一层**在**\"**心衰/肾病**\"**的**早期**确实**成立**）；**④⚠ 而这一条**须配一条禁忌**（**⚠ \"**发汗**\"**要**看**\"**能不能承受**\"**（**⚠ 见上条\"**疮家不可发汗**\"**（**⚠ 故\"**腰以上发汗**\"**也**不是**\"**一律发汗**\"**）。** **⚠ 本集按语**：**\"**腰以上发汗、腰以下利小便**\"**这一句**最好用的地方**是**它**把\"**水肿**\"**从\"**一个整体**\"**拆成了**\"**两个区**\"**（**⚠ 而**\"**区**\"**的**边界**是**腰**（**⚠ 故**看水肿**，**先看\"**在哪**\"**（**⚠ 而**这一层**与**第 n43 条\"**按位置分证**\"**是**同一路** ✓）。","o":"RJ-2960 · 人纪·金匮要略·水气病脉证并治第十四（PDF 第418页）"},{"t":"一、黄瘅与黄汗：两个\"黄\"不是一回事","h":"一个在血里，一个在汗里","c":"定义——**讲义开篇就把\"黄瘅\"与上一篇的\"黄汗\"分开了，而这一分**极清楚**，须照录**：\"**'现在要介绍中医的**黄瘅病**。**黄瘅跟黄汗完全是不一样的**'。'**黄瘅是胆汁分泌出，跑到皮肤表面上去，或跑到血脉里面看到的黄**'。'**我上篇介绍的黄汗，是讲食物的营养进入脾脏、再自脾脏里出的黄，进入三焦油网里面，病人流的是黄汗**'。'**黄疸病呢，意思就是黄色的病。前面介绍的黄汗并不是真正的黄色的病**'。'**所以前面黄汗是：你没有流汗的时候是正常人**；**这个呢，就是你可以看到黄色**'。**\" **须说明（四层）**：**①\"**黄瘅在血里，黄汗在汗里**\"这一分**极精** ✓✓（**⚠ 黄瘅**＝**\"**看得到的黄**\"**（**皮肤、眼白**）**（**⚠ 黄汗**＝**\"**看不到的黄**\"**（**只有衣服上有**）**（**⚠ 故**两者的**区别**是\"**黄在哪里**\"**（**不是\"**黄的程度**\"**）；**②⚠ 而\"**黄瘅是胆汁跑到血脉里面**\"这一层**极准** ✓✓（**⚠ 它**描述的**正是**\"**梗阻性/肝细胞性黄疸**\"**（**胆红素入血 → 皮肤、巩膜黄染**）——**⚠ 故**这个机制**在今天就**叫\"**高胆红素血症**\"**；**③⚠ 而\"**黄汗是食物的营养进入脾脏、再自脾脏里出**\"这一层**是一个**\"**脾主肌肉/三焦**\"**的说法**（**⚠ 而**它的合理内核**是\"**汗液的成分异常**\"**（**⚠ \"**营养从脾出**\"**是一个**比喻**）；**④⚠ 而\"**没有流汗的时候是正常人**\"这一句**极重要**（**⚠ 它**给了**一个**最简单的鉴别**（**⚠ 故**遇到\"**身上发黄**\"**，**第一句问**\"**不流汗的时候黄不黄**\"**（**⚠ 若**不流汗也黄 → 黄疸**（**若**只有汗黄 → 黄汗**）。** **⚠ 本集按语**：**这两篇**放在一起**极有意思**（**⚠ 因为**它们**共享一个\"**黄**\"字**（**而**机制**完全不同**（**⚠ 故\"**同名不同病**\"**在古书里**极常见**（**⚠ 而**分清的办法**很朴素**：**问\"**黄在哪里**\"**、**问\"**什么时候黄**\"**）。","o":"RJ-2961 · 人纪·金匮要略·黄疸病脉证并治第十五（PDF 第477~478页）"},{"t":"二、阳黄与阴黄：颜色一亮一暗","h":"一个只看颜色的分法，与它的时间差别","c":"定义——**讲义把黄疸按颜色分成了两类，而这两类**连治疗时间都不同**，须照录**：\"**'中医呢，黄色分两种，一种是**阳黄**，一种是**阴黄**'。'**阳黄的颜色看起来比较鲜黄，像橘子一样很鲜亮、光鲜亮丽的黄**——**这种黄比较好治，常常很快就可以治好，我治大概在十天左右**'。'**但是阴黄，一种黑黑暗暗的黄，就比较难治**'。**\" **须说明（四层）**：**①\"**阳黄＝鲜黄如橘子；阴黄＝暗黑暗黄**\"这个分法**极形象** ✓（**⚠ 而它**在今天的对应**有一个真实的依据**（**⚠ \"**鲜黄**\"**更常见于**\"**梗阻性黄疸（胆道梗阻）**\"**（**⚠ \"**暗黄/黄绿/黄褐**\"**更常见于**\"**肝细胞性黄疸、**慢性肝病**\"**（**⚠ 故\"**颜色**\"**确实**能**提示**\"**类型**\"**）；**②⚠ 而\"**阳黄十天左右就好、阴黄难治**\"这一层**极重要**（**⚠ 它**把\"**颜色**\"**与\"**预后**\"**接上了**（**⚠ 而**这一层**在**\"**急性胆管梗阻（可解除）**\"**与\"**慢性肝硬化（不可逆）**\"**上**确实对得上** ✓）；**③⚠ 而\"**像橘子一样**\"这个比喻**极精**（**⚠ 它**把\"**鲜黄**\"**讲成了一个**可想象的颜色**（**⚠ 故\"**橘子色**\"**可以直接用来问病人**（**⚠ 而**\"**黄得像橘子还是黄得像土**\"**这个问法**极有效**）；**④⚠ 而\"**阴黄**\"**在**中医里**另有一个**含义**（**⚠ 它**有时**指\"**寒湿发黄**\"**（**⚠ 有时**指\"**慢性肝病面容**\"**（**⚠ 故\"**阴黄**\"**这个词**须按上下文**读**（**⚠ 而**本集**取\"**颜色暗**\"**这个最朴素的一层**）。** **⚠ 本集按语**：**\"**鲜黄/暗黄**\"**这个二分**是**一个**极好的\"**床边分诊**\"**（**⚠ 因为**它**只需要**看一眼**（**⚠ 而它**指向**的方向**很不同**（**⚠ \"**鲜黄 + 痛 + 发热**\"**要**查**胆道梗阻（**急诊**）**（**⚠ \"**暗黄 + 消瘦 + 腹水**\"**要**查**肝硬化/肿瘤**（**⚠ 故\"**黄得亮不亮**\"**这一问**，**能决定**\"**先看哪个科**\"**）。","o":"RJ-2962 · 人纪·金匮要略·黄疸病脉证并治第十五（PDF 第478页）"},{"t":"三、\"胆汁跑到血里面，就全身发黄\"","h":"一段极准的机制描述","c":"定义——**讲义把黄疸的机制讲成了一条完整的链，而这一条**与现代的\"梗阻性黄疸\"完全对得上**，须照录**：\"**'我们的胃肠消化过程是：肝分泌酸液给胃，脾分泌甜液给胃，胆分泌苦液到十二指肠帮助消化**'。'**如果有浊物堵在胆管里面，会造成胆汁没有办法排出去**——**这个浊物就是湿与热**'。'**湿停在里面不走，自然就有热会累积，这个热就是发炎**'。'**结果造成胆汁回逆到肝脏里面**'。'**肝本身是血脏，胆汁跑到血里面，之后马上进入全身血脉**——**而胆汁的原色就是黄色，于是病人就全身发黄**'。'**黄瘅病的原因就在此**'。**\" **须说明（四层）**：**①\"**胆管堵 → 胆汁排不出去 → 回流入血 → 全身发黄**\"这条链**极准** ✓✓（**⚠ 它**逐字对应**\"**胆道梗阻 → 结合胆红素反流入血 → 皮肤巩膜黄染**\"**（**⚠ 故**这一段**是**全册**机制描述**最准的一段**之一**）；**②⚠ 而\"**浊物就是湿与热**\"这一层**是一个**归类**（**⚠ 而**它的现实对应**是**\"**胆结石、**肿瘤、**炎症狭窄**\"**（**⚠ 故\"**浊物**\"**可以读作\"**梗阻物**\"**）；**③⚠ 而\"**湿停不走，热就累积，这个热就是发炎**\"这一层**极精**（**⚠ 它**把\"**湿热**\"**译成了\"**淤积 + 炎症**\"**（**⚠ 而\"**淤积导致炎症**\"**在**胆道感染（胆管炎）**上**完全成立** ✓）；**④⚠ 而\"**肝是血脏**\"这一层**极重要**（**⚠ 胆红素**确实**经肝细胞处理**（**⚠ 故\"**肝是血的加工厂**\"**（**⚠ 而\"**胆汁入血**\"**这个画面**让\"**全身发黄**\"**有了**一个**清楚的理由**）。** **⚠ 本集按语**：**这一段**最值得记的是\"**颜色从哪里来**\"**（**⚠ 因为**\"**黄**\"**不是\"**皮肤的病**\"**（**是\"**血里有胆红素**\"**（**⚠ 故\"**治黄**\"**不能**\"**往皮肤上抹**\"**（**要**\"**通胆道、**治肝**\"**（**⚠ 而**这一层**与**上一篇\"**黄汗**\"**正好**对照**（**⚠ 一个在**血**，一个在**汗**）。","o":"RJ-2963 · 人纪·金匮要略·黄疸病脉证并治第十五（PDF 第478页）"},{"t":"四、\"趺阳脉紧而数\"","h":"同一个脉里，一个寒一个热","c":"要点——**原文用\"趺阳脉紧而数\"描述了一种**\"一寒一热并存\"的状态**，须照录**：\"**'「**趺阳脉紧而数，数则为热，热则消谷**」——**代表胃的蠕动很快，食物吃下去马上就消化掉**'。'「**紧则为寒，食即为满**」——**「老师，怎么又热又寒呢？」这里指的是脾脏寒**'。'**正常的脾和胃，两个是表里关系：胃是表，脾是里**'。'**当脾脏寒、就是脾脏功能衰弱了，可是胃的蠕动还是很快**——**所以会摸到趺阳脉紧而数**'。'**紧代表脾脏寒、脾脏功能衰弱；而胃还是一直在蠕动**——**于是就出现「食即为满」这个症状**'。**\" **须说明（四层）**：**①\"**紧＝寒（脾）、数＝热（胃）**\"这一层**极重要**（**⚠ 它**说明了\"**同一个脉里可以有两个信息**\"**（**⚠ 故\"**摸脉**\"**不是**\"**摸一个数**\"**（**是**\"**摸一组矛盾**\"**）；**②⚠ 而\"**脾寒胃热**\"这个组合**在临床上有对应** ✓（**⚠ 它**对应**\"**胃排空快（易饿、能吃）**\"**＋**\"**消化吸收差（腹胀、便溏、乏力）**\"**（**⚠ 而**这正是**很多\"**能吃但不长肉**\"**的人的样子**（**⚠ 故\"**食即为满**\"**这三个字**极精**（**\"**一吃就胀**\"**）；**③⚠ 而\"**脾胃是表里**\"这一层**是一个**脏腑配对**（**⚠ 而**它的合理内核**是\"**胃（受纳）与脾（运化）是同一套流程的两段**\"**（**⚠ 故\"**一个快一个慢**\"**会**互相拖累**）；**④⚠ 而\"**肾火入胃让胃蠕动**\"这一层**（下文提到）**是一个**\"**火源**\"**的说法**（**⚠ 而**它的现实对应**是**\"**整体代谢率**\"**（**⚠ 故\"**胃火**\"**可以读作\"**代谢活跃**\"**）。** **⚠ 本集按语**：**\"**紧而数**\"**这个脉**最值得学的是\"**矛盾并列**\"**（**⚠ 因为**病人的身上**常常**同时有\"**太快的**\"**与\"**太慢的**\"**（**⚠ 而**好的诊断**是**\"**把两个都抓住**\"**（**而不是**\"**选一个解释**\"**）——**⚠ 故\"**能吃却胀**\"**这个组合**，**比**\"**能吃**\"**或**\"**胀**\"**单独一个**更有信息**。","o":"RJ-2964 · 人纪·金匮要略·黄疸病脉证并治第十五（PDF 第478页）"},{"t":"五、\"早上口苦，就是胆汁逆行了\"","h":"一个极好用的入口","c":"要点——**讲义把\"口苦\"和\"胆汁逆行\"接了起来，而这一层**极好用**，须照录**：\"**'**当湿热梗到两胁胁时，胆汁就会逆行上**——**于是早上起就有口苦的感觉，这就是小柴胡汤证**'。'**如果是整个堵在中焦的话，胆汁会回流到血里面去**——**于是「食即为满」，一吃食物就胀满，胃里面被撑得很胀满**'。**\" **须说明（四层）**：**①\"**早上口苦＝胆汁逆行上**\"这一层**极精** ✓（**⚠ 口苦**确实**与**胆汁反流/胃食管反流**相关**（**⚠ 而\"**早上**\"**这个时间点**也极准**（**⚠ 因为**平卧一夜**后**反流更容易发生**（**⚠ 故\"**晨起口苦**\"**是一个**值得问的症状**）；**②⚠ 而\"**小柴胡汤证**\"这一层**是一个**方证归类的说法**（**⚠ \"**口苦、咽干、目眩**\"**确实是**小柴胡汤的经典证**（**⚠ 故\"**晨起口苦**\"**在小柴胡汤的框架里**有**位置**（**⚠ 而**今天**它**也可以**对应**\"**胃食管反流、**胆汁反流性胃炎**\"**）；**③⚠ 而\"**湿热梗在两胁**\"这一层**极重要**（**⚠ \"**两胁**\"**是**肝胆的体表区**（**⚠ 而\"**右胁痛 + 黄疸**\"**在今天是**\"**胆道梗阻的典型**\"**（**⚠ 故\"**两胁**\"**这个位置**极有信息量**）；**④⚠ 而\"**堵在中焦 → 回流到血里 → 食即为满**\"这一层**把\"**两个方向**\"**分开了**（**⚠ \"**上行（口苦）**\"**vs**\"**入血（黄疸）**\"**（**⚠ 而**这一层**是**一个**清晰的**\"**分流**\"**模型** ✓）。** **⚠ 本集按语**：**\"**晨起口苦**\"**这四个字**是**一个**极便宜的问诊**（**⚠ 因为**它**不需要任何检查**（**⚠ 而它**能**指向**\"**胆汁反流**\"**（**⚠ 故**遇到**\"**胃不好**\"**的人**，**问一句**\"**早上起来嘴里苦不苦**\"**，**比问**\"**胃酸多不多**\"**更有用** ✓）。","o":"RJ-2965 · 人纪·金匮要略·黄疸病脉证并治第十五（PDF 第478页）"},{"t":"六、\"锅底没火，只在上面加热\"","h":"一个关于糖尿病的比喻，极妙","c":"要点——**讲义用水与火的关系讲了\"中医与西医治糖尿病的不同\"，而这一组比喻**极妙**，须照录并核**：\"**'**西医控制糖尿病人的血糖使用胰岛素**……**当（中医所说的）下焦肾水没了，他们就在上游放水下补充**——**好像一个城市没有水了，就把水库里面的水放些下来**'。'**中医的想法却不是这样**——**中医的想法是：饭要煮熟，需要火在饭锅下加热**'。'**所以像中药里的肾气丸就是去壮肾火**——**肾阳强了、水气化上，于是口渴就好了**'。'**西医从胰脏下手，就只能是控制**；**中医从下面加热、让肾脏的火往上走，就是治疗**'。'**如果肾火不上、只是肠胃的火上，就变成只是腑里面过热**——**这是燥热，不是真阳**'。'**结果等于是把胰脏当成一块肥肉，放到温水里面慢慢的烫熟了**'。'**这就是体内心血管动脉硬化与胰脏变成脂肪的原因所在**'。**\" **须说明（四层）**：**①\"**水库放水 vs 锅底加火**\"这一对**极精** ✓✓（**⚠ 它**把\"**补充（外源）**\"**与\"**激发（内生）**\"**分成了**两个**截然不同的思路**（**⚠ 而**这两个思路**在**任何慢病管理里**都**存在**）；**②⚠ 而\"**锅底没火、只在上面加热，就把锅里的肉烫熟**\"这一层**极重要** ✓✓（**⚠ 它**解释了**\"**为什么'**只补上面'**会**'**把器官烫坏'**\"**（**⚠ 而**这个图像**与第 n44 条\"**小火煮肉变脂肪**\"**是**同一个**（**⚠ 故**两处**互相印证**）；**③⚠ 而\"**西医只是控制**\"这一层**须标**（**⚠ 胰岛素与口服药**确实**不能\"**治愈**\"**2 型糖尿病**（**⚠ 而它们**能**显著减少并发症**（**⚠ UKPDS：**HbA1c 每降 1%，微血管并发症降约 25%**（**⚠ 故\"**控制**\"**本身**就是**有价值的**（**⚠ 而\"**只是控制**\"**这个说法**会**贬低**一个**有效的手段**）；**④⚠ 而\"**燥热不是真阳**\"这一层**极精**（**⚠ 它**区分了**\"**代偿性的亢进**\"**与\"**真正的动力**\"**（**⚠ 而**这**在**甲亢、**交感兴奋、**发热**上**都**成立**（**⚠ 故\"**看起来很有火**\"**不等于**\"**有真火**\"**）。** **⚠ 本集按语**：**\"**锅底的火**\"**这个比喻**是**全册**解释\"**为什么不能只补表面**\"**最好的一个**（**⚠ 而它**不需要\"**肾阳**\"**这个概念**（**只需要**一口锅**（**⚠ 故\"**火要在锅底下**\"**这六个字**，**能让人**立刻**明白**\"**治本**\"**是什么意思**。","o":"RJ-2966 · 人纪·金匮要略·黄疸病脉证并治第十五（PDF 第478页）"},{"t":"七、\"十天不退，反而更重，就要想到四种病\"","h":"一个\"疗效时间窗\"与一份\"红旗清单\"","c":"风险——**原文给了黄疸的**治疗期限**，而讲义把它变成了一份**鉴别清单**，须照录**：\"**'**黄疸之病，**当以十八日为期，治之十日以上瘥，反剧为难治**'。'**「当以十八日为期」就是治疗期间，应该十天左右就恢复了**'。'**如果治疗超过十天以上没好，而病情反而更加剧，表示病人体内必然有其他更严重的问题存在**——**这就很难治了，但是难治并不是说不能治**'。'**我们中医怎么知道病患身体里有肝癌呢？**……**答案是我们帮他治疗十天，如果十天以后黄没有退、反而更严重**'。'**第一个就是肝癌会有这种情形**'。'**第二个是胰脏癌**'。'**还有第三种是在十二指肠的地方有肿瘤，十二指肠里面长了肿瘤堵到胆道，造成胆汁回流**'。'**还有第四种西医讲的坏死肝炎**——**有一种病毒很厉害，一进入肝脏就会让肝细胞死掉**'。'**现在还有一种就是所谓猛爆肝炎**'。**\" **须说明（四层）**：**①\"**十天为窗**\"这一层**极重要** ✓✓（**⚠ 它**给了**一个**\"**疗效观察期**\"**（**⚠ 而\"**过了这个窗口还不好**\"**＝**\"**要改诊断**\"**（**⚠ 故\"**时间**\"**在这里**是**一个**诊断工具**（**不只是**\"**等**\"**）；**②⚠ 而那份清单**四项全对** ✓✓（**⚠ \"**肝癌**\"、\"**胰脏癌/胆管癌**\"、\"**十二指肠肿瘤（壶腹部）**\"、\"**重型肝炎**\"**（**⚠ 这四种**正是**\"**黄疸十天不退**\"**的**四大原因**（**⚠ 故**这一份清单**是**全册**最实用的**一份**\"**红旗信号**\"**）；**③⚠ 而\"**难治并不是说不能治**\"这一句**极重要**（**⚠ 它**防止了**\"**一听到难治就放弃**\"**（**⚠ 故\"**难治**\"**应读作**\"**要转诊、要升级检查**\"**（**而不是**\"**没救了**\"**）；**④⚠ 而\"**猛爆肝炎**\"这一层**须标**（**⚠ 它**＝**\"**急性肝衰竭**\"**（**⚠ 而**它的**死亡率**高**（**⚠ 需要**ICU、**人工肝、**肝移植评估**（**⚠ 故\"**黄疸 + 意识改变 + 凝血异常**\"**＝**立即急诊**（**而不是**\"**吃中药观察十天**\"**）。** **⚠ 本集按语**：**\"**十天**\"**这个窗口**是**全册**最值得照搬的一条**（**⚠ 因为它**把\"**等待**\"**变成了\"**有期限的观察**\"**（**⚠ 而\"**无期限的观察**\"**是**最危险的**（**⚠ 故\"**黄疸十天不退，就要查影像与肿瘤标志物**\"**是**一条**可以写进流程的建议** ✓）。","o":"RJ-2967 · 人纪·金匮要略·黄疸病脉证并治第十五（PDF 第491页）"},{"t":"八、\"阳黄治成阴黄是恶化，阴黄治成阳黄是好转\"","h":"一个\"方向性\"的疗效指标","c":"要点——**讲义给了一个**只看颜色变化**的进退判据，而这一层**极精**，须照录**：\"**'**这个病人发黄**，诸位从这个千年以来的经验……**黄疸，这种病就是鲜黄**'。'**我们发黄疸有分阳黄和阴黄：阳黄是很鲜黄，阴黄是很暗黄**'。'**这个黄病当以十八日为期，治之十日左右就好了**；**如果十天没有好、超过十八天还没有好，病是很重的**'。'**一般来说，阳黄是一个礼拜、十天就好了；阴黄就不这样子，要很长一段时间**'。'**那你如果病人到你这里，从阳黄治到阴黄，你也不必了**——**从此以后也不用治肝胆的病了**'。'**如果是阴黄，把它治成阳黄，这个很厉害**——**病从里走表**'。'**从这里可以看出，这都是经验**'。**\" **须说明（四层）**：**①\"**阳黄 → 阴黄 ＝ 恶化**\"这一层**极重要** ✓✓（**⚠ 它**是一个**\"**方向性**\"**指标**（**⚠ 鲜**→**暗**＝**变坏**（**⚠ 而**这一层**在临床上**确实**成立**（**⚠ 因为**\"**鲜黄**\"**多对应**\"**可解除的梗阻**\"**，\"**暗黄**\"**多对应**\"**慢性/不可逆的肝病**\"**）；**②⚠ 而\"**阴黄 → 阳黄 ＝ 好转**\"这一层**也**重要**（**⚠ \"**从里走表**\"**这个说法**对应**\"**病情由深转浅**\"**（**⚠ 而**这一层**在**\"**黄疸消退期**\"**确实**可以看到**（**⚠ 故\"**颜色变亮**\"**是一个**好消息**）；**③⚠ 而\"**从阳黄治到阴黄，你也不必了**\"这一句**极重**（**⚠ 它**说明**\"**方向错了**\"**比\"**慢**\"**更严重**（**⚠ 而**这一层**对**任何治疗**都**适用**（**⚠ 故\"**看趋势，不只看单点**\"**）；**④⚠ 而\"**这都是经验**\"这一层**极诚实**（**⚠ 它**承认了**\"**这是观察出来的**\"**（**而不是**\"**推出来的**\"**（**⚠ 故**这一条**是**一个**\"**可积累的观察**\"**（**⚠ 而**它**值得**写进随访记录**）。** **⚠ 本集按语**：**\"**颜色变亮还是变暗**\"**这个指标**极便宜**（**⚠ 而它**有一个**同类的指标**（**⚠ \"**小便颜色**\"**（**⚠ 见第 n42 条**）**——**⚠ 故\"**黄疸的进退**\"**可以**用**三件**最便宜的事**跟踪**（**眼白颜色、**尿色、**皮肤亮度**（**⚠ 而**这三件事**都不需要**抽血** ✓）。","o":"RJ-2968 · 人纪·金匮要略·黄疸病脉证并治第十五（PDF 第492页）"},{"t":"九、\"肝分泌酸、脾分泌甜、胆分泌苦\"","h":"一句关于\"三液助消化\"的说法","c":"要点——**讲义用\"三液\"解释了消化的分工，而这一层**极有意思**，须照录**：\"**'我们的胃肠消化过程是：**肝分泌酸液给胃，脾分泌甜液给胃，胆分泌苦液到十二指肠帮助消化**'。**\" **须说明（四层）**：**①\"**三种液体，三种味道，三个器官**\"这个框架**极整齐**（**⚠ 而它**在**现代生理上**有一个**部分对应**（**⚠ \"**肝分泌酸液**\"**（**⚠ 胆汁**含**胆酸**（**⚠ 而**胆汁是肝分泌的** ✓**（**⚠ \"**胆分泌苦液到十二指肠**\"**✓（**胆汁确实排入十二指肠**（**⚠ \"**脾分泌甜液**\"**（**⚠ 胰液**含**消化酶**（**⚠ 而**中医的\"**脾**\"**包含了\"**胰**\"**（**⚠ 故\"**甜液**\"**可以读作\"**胰液**\"**）；**②⚠ 而\"**酸、甜、苦**\"这三个味道**极精**（**⚠ 它**把\"**三种消化液**\"**讲成了**三个**可以记住的**味道**（**⚠ 故\"**酸、甜、苦**\"**比\"**胃酸、**胰液、**胆汁**\"**好记**）；**③⚠ 而这一层**的**价值**在于**：**它**指出了**\"**消化是三个器官的协作**\"**（**⚠ 而\"**任何一个出问题，都会影响整个流程**\"**（**⚠ 故**胆管堵 → 不只是\"**不消化**\"**（**还会\"**黄疸**\"**）；**④⚠ 而\"**肝是血脏、胆是苦液**\"这一组**也**解释了**\"**胆汁入血会黄**\"**（**⚠ 因为**胆汁的原色是黄的**（**⚠ 而**它**进入**血**后**就**\"**染**\"**了**全身**（**⚠ 故\"**黄**\"**的来源**是**\"**胆汁的颜色**\"**）。** **⚠ 本集按语**：**\"**酸、甜、苦**\"**这个三分**最有用**的是它**给了一个**\"**问诊的入口**\"**（**⚠ \"**嘴里苦不苦**\"**（**胆汁反流**）**（**⚠ \"**吃了甜的胀不胀**\"**（**胰酶不足**）**（**⚠ \"**胃里酸不酸**\"**（**胃酸**）——**⚠ 故\"**三个味道**\"**对应**三个**可以问的症状** ✓）。","o":"RJ-2969 · 人纪·金匮要略·黄疸病脉证并治第十五（PDF 第478页）"},{"t":"十、谷瘅：食物堵在胃里","h":"一个\"吃出来的黄\"","c":"定义——**原文把\"谷瘅\"的成因归到了\"食谷\"，而讲义把它讲成了一条**\"食物堵在胃里**\"的链**，须照录**：\"**'**这段就是说：我们食谷在胃里消化掉以后，可是食物没有办法往下走，于是食物就堵在胃里面**'。'**结果「胃中苦浊，浊气下流」**——**只有食物里面的水可以渗下，也就是浊气，不是很干净的水**'。'**这本就是带了很多湿、很多浊物的水**——**因为没有办法进入我们的三焦系统**'。'**从胃上面下后就逐渐渗到膀胱里面，使得膀胱里面积到很多湿湿黏黏的湿热**'。'**这种状况就是这段中医所谓的小便不通的原因**'。'**故「阴被其寒，热流膀胱，身体尽黄，名曰谷瘅」**'。'**所以被称作谷瘅——瘅病就是发黄，有黄瘅也有黑瘅**'。'**最重要的是：这里要称为谷瘅，就是说这个病是食谷所产生的**'。**\" **须说明（四层）**：**①\"**谷瘅＝吃出来的黄**\"这个名字**极准**（**⚠ 它**把\"**病因**\"**写进了**\"**名字**\"**（**⚠ 而**这一层**在**\"**酒精性肝病**\"（酒疸）**上**也**一样**（**⚠ 故**《金匮》**有**谷疸、酒疸、女劳疸**三个**按病因命名的疸**）；**②⚠ 而\"**食物堵在胃 → 浊气下流 → 小便不通**\"这条链**须标**（**⚠ 它**的合理内核**是\"**胃排空延迟 + 肠道菌群/腐败产物**\"**（**⚠ 而\"**小便不通**\"**对应**\"**尿少**\"**（**⚠ 而**真正的**\"**尿少**\"**在**黄疸**上**更常**源于**\"**肝肾综合征、**脱水**\"**）；**③⚠ 而\"**带湿带浊的水渗到膀胱**\"这一层**是一个**\"**湿热下注**\"**的说法**（**⚠ 而**它的现实对应**是**\"**尿路刺激、**尿黄**\"**（**⚠ 故\"**小便黄**\"**在**黄疸**上**是**一个**真实体征**（**因为**尿胆原/胆红素**）；**④⚠ 而\"**有黄瘅也有黑瘅**\"这一句**须说明**（**⚠ \"**黑瘅**\"**＝**\"**面色黧黑**\"**（**⚠ 它**在**\"**慢性肝病（肝硬化）**\"**上**确实可见**（**⚠ 故\"**黄转黑**\"**是**一个**恶化信号**（**⚠ 与上条\"**阳黄转阴黄**\"**一致**）。** **⚠ 本集按语**：**\"**谷瘅**\"**这个名字**最有价值的地方**是**它**承认了**\"**有些黄疸是吃出来的**\"**（**⚠ 而**今天**对应**\"**酒精性肝病、**非酒精性脂肪肝**\"**（**⚠ 故\"**病因写在名字里**\"**（**是一个**极好的命名传统**（**⚠ 而它**提醒**：**问\"**喝不喝酒、**吃得多不多**\"**，**比问\"**怕不怕冷**\"**更早**。","o":"RJ-2970 · 人纪·金匮要略·黄疸病脉证并治第十五（PDF 第478~479页）"},{"t":"一、\"动即为惊，弱即为悸\"","h":"六个字，分开两个症状","c":"定义——**原文用六个字分开了\"惊\"与\"悸\"，而讲义把两个脉**摸法说清了**，须照录**：\"**'**寸口脉动而弱，**动即为惊，弱即为悸**'。**\" **讲义的展开**：\"**'「**动**」就是**脉左右跳，跳的不平均**'。'一个人当他受到惊吓的时候，脉就会这样跳，这就是动脉**'。'**心神、心气一伤，脉就开始乱动**'。'当你摸到病人的脉，**如果重按就没有，就是弱脉**'。'「**弱**」就是**很微弱**——**因为瞬间受到惊吓，肝里面的血全部分散开，没有办法集中到正常的血液循环系统里面**'。'**这条条辨是说：如果摸到病人的寸位有动脉，代表这个人是受到惊吓；如果脉很弱的时候，重按都没有，就代表是「悸」**'。**\" **须说明（四层）**：**①\"**动＝惊、弱＝悸**\"这一分**极重要**（**⚠ 它**把两个**常被混用**的词**分开了**（**⚠ 而\"**惊**\"**是**\"**一个事件**\"**（**\"**受了吓**\"**）**（**\"**悸**\"**是**\"**一个状态**\"**（**\"**心慌**\"**）——**⚠ 故**两者**不是**\"**程度**\"**的区别**（**是**\"**有没有起因**\"**的区别**）；**②⚠ 而\"**重按就没有＝弱脉**\"这一层**极准** ✓（**⚠ \"**弱脉**\"**＝**\"**举之无力、按之空虚**\"**（**⚠ 而**它**在**中医里**主**\"**气血不足**\"**（**⚠ 故\"**摸不到**\"**不是**\"**没有脉**\"**（**是**\"**脉很浅、很虚**\"**）；**③⚠ 而\"**肝血分散**\"这一层**是一个**\"**受惊 → 血不集中**\"**的说法**（**⚠ 而**它的合理内核**是**\"**交感神经兴奋 → 血流重新分布**\"**（**⚠ 故\"**受惊时手脚冰凉、心慌**\"**是**真的**）；**④⚠ 而**两个的**临床意义**是**：**\"**惊**\"**要**\"**定心**\"**（**炙甘草汤加减、**酸枣仁**）**（**\"**悸**\"**要**\"**去水饮**\"**（**这不是**一件事**）。** **⚠ 本集按语**：**\"**动/弱**\"**这一对**最值得学的是它**示范了**\"**用一个动作（重按）**\"**分开两个脉**（**⚠ 而\"**重按**\"**这个动作**是**脉诊里**最基础的一步**（**⚠ 故\"**浮取**\"**与\"**沉取**\"**，**是**两个**必须都做的**（**⚠ 而\"**只摸一次就下结论**\"**（**是**一个**常见的错**）。","o":"RJ-2971 · 人纪·金匮要略·惊悸吐衄下血胸满瘀血病脉证治第十六（PDF 第507页）"},{"t":"二、\"动脉是左右跳，不是上下跳\"","h":"一句手法，极具体","c":"方法——**讲义把\"动脉\"与\"平脉\"的区别说到了**方向**，而这一层**极具体**，须照录**：\"**'这个「**动**」呢，是**左右跳动**'。'**病人受到惊吓的时候，你一摸他的脉呢，是左右跳的，不是上下跳的**'。'**平常我们摸脉呢，我们摸上去是上下跳**'。'**你摸到这惊脉，它是左右跳**——**一下子跳这边、一下子跳那边，乱跳的**'。'**这就是受到惊吓**'。**\" **须说明（四层）**：**①\"**左右跳 vs 上下跳**\"这个区分**极具体** ✓✓（**⚠ 而**它**是**一个**\"**手上能感觉到**\"**的区别**（**⚠ 故它**比\"**脉动不安**\"**这种形容词**有用得多**）；**②⚠ 而\"**左右跳**\"**在今天的对应**有一个**真实的解释**（**⚠ 它**可能**对应**\"**血管搏动的不规则、**肌肉震颤、**交感兴奋时的脉管移动**\"**（**⚠ 故\"**受惊时脉在指下滑来滑去**\"**（**可以读作**\"**脉位不稳定**\"**）；**③⚠ 而\"**平常摸脉是上下跳**\"这一句**也**极准**（**⚠ 正常脉**是**\"**一个点上的搏动**\"**（**⚠ 而\"**左右跑**\"**说明**\"**搏动点**在移动**\"**（**⚠ 故**这是一个\"**位置**\"**的问题**，**不是\"**力度**\"**的问题**）；**④⚠ 而这一层**的**教学价值**极重要**（**⚠ 因为**它**给了一个\"**可以被教**\"**的感觉标准**（**⚠ 而\"**感觉**\"**一旦**能被**描述**（**就能**被**传递**）。** **⚠ 本集按语**：**\"**左右跳**\"**这三个字**是**全册**最具体的一个**脉象描述**（**⚠ 而它**恰好**说明**：**脉诊**不是**\"**玄学**\"**（**它**是**\"**触觉**\"**（**⚠ 故\"**能说清**\"**的脉**，**才**是**能学**的脉** ✓）。","o":"RJ-2972 · 人纪·金匮要略·惊悸吐衄下血胸满瘀血病脉证治第十六（PDF 第507页）"},{"t":"三、\"悸就是心慌，好像有什么事要发生\"","h":"一句极准的症状描写，与\"水饮\"的关系","c":"要点——**讲义把\"悸\"讲成了一种**没有起因的心慌**，须照录**：\"**'「**悸**」比较偏重于**水饮产生的悸**'。'**悸就是心慌**——**没有受到任何环境影响，可是病人就会感觉到心慌慌的，好像有什么事情要发生一样**'。'**这个悸呢，是水饮**——**因为身上有水饮才会看到悸**'。'所以我们讲**心下悸、脐下悸**……**脐下悸的时候我们用茯苓**'。'**脐下动悸**……**就是水饮所致**'。**\" **须说明（四层）**：**①\"**心慌慌的、好像有什么事情要发生**\"这一句**极准** ✓✓（**⚠ 它**是**\"**心悸**\"**最好的**病人语言**（**⚠ 而**它**恰好**对应**\"**焦虑时的躯体感觉**\"**（**⚠ 故\"**无起因的心慌**\"**要**查**心律、**甲亢、**贫血、**焦虑**）；**②⚠ 而\"**悸＝水饮**\"这一层**是一个**归因**（**⚠ \"**心下悸、脐下悸**\"**在**中医里**确实**与**\"**水气**\"**相关**（**⚠ 而\"**茯苓**\"**是**利水**的**（**⚠ 故\"**脐下悸 → 茯苓**\"**是**一个**方证**（**⚠ 而**它的合理内核**是**\"**体液潴留/水肿**\"**）；**③⚠ 而\"**脐下**\"这个位置**极重要**（**⚠ 脐下**是**\"**膀胱/下腹**\"**区**（**⚠ 而\"**脐下悸动**\"**在**今天**要**想到**\"**腹主动脉搏动（正常或动脉瘤）**\"**（**⚠ 故\"**脐下跳得厉害**\"**要**摸一摸**\"**是\"**自己感觉**\"**还是\"**能摸到一团**\"**（**⚠ 后者**要**查**腹主动脉**）；**④⚠ 而\"**没有受任何环境影响**\"这一句**极重要**（**⚠ 它**把\"**悸**\"**与**\"**惊**\"**分开了**（**⚠ 故**问诊**第一句是**\"**有没有诱因**\"**（**⚠ 有诱因 → 惊**（**无诱因 → 悸**）。** **⚠ 本集按语**：**\"**好像有什么事情要发生**\"**这九个字**是**全册**最好的**症状描写**之一**（**⚠ 因为**它**不是**\"**医学词**\"**（**是**\"**人的话**\"**（**⚠ 故\"**病人说心慌**\"**时**，**追问一句**\"**是不是觉得有不好的事要发生**\"**（**若能确认**，**就**指向**\"**焦虑/惊恐**\"**（**而不只是**\"**心律**\"**）。","o":"RJ-2973 · 人纪·金匮要略·惊悸吐衄下血胸满瘀血病脉证治第十六（PDF 第507页）"},{"t":"四、\"14 岁以下流鼻血，不要去担心\"","h":"一条流传很广的说法，须一分为二","c":"风险——**讲义给了一条\"儿童流鼻血不用怕\"的说法，而这一条**有一半是真、一半须否定**，须照录并核**：\"**'14 岁以下小孩子，因为先天纯阳之体，他抵抗力很强的时候，他流鼻血时烧会退**'。'**会流鼻血的小孩子，14 岁以下，是不会发高烧的**'。'**他只要准备发高烧之前，他就流个鼻血，流个鼻血就把身体的热退掉了**——**有地方宣泄掉**'。'**所以小朋友流鼻血不要去担心他**'。'**那如果这个人 28 岁呢，那就要担心他了**'。**\" **须说明（四层）**：**①\"**儿童鼻出血很常见、且多数无害**\"这一层**基本成立** ✓（**⚠ 儿童**鼻黏膜血管丰富、**易受干燥与抠鼻影响**（**⚠ 故\"**小朋友偶尔流鼻血**\"**确实**不必恐慌**（**⚠ 而**正确的处置**是**\"**压迫止血、查血常规**\"**）；**②⚠ 而\"**流鼻血会把高热退掉**\"这一层**须明确否定**（**⚠ 鼻出血**不**\"**带走热量**\"**（**⚠ 出血量**通常只有几毫升**（**⚠ 对体温**没有**可测影响**（**⚠ 故\"**流鼻血退热**\"**是**一个**因果倒置**（**⚠ 真实情况**是**\"**发热时鼻黏膜充血 → 更容易出血**\"**（**是**\"**热导致出血**\"**，**不是**\"**出血退了热**\"**）；**③⚠ 而\"**14 岁以下不会发高烧**\"这一层**是**明显错的**（**⚠ 儿童**是**高热的高发人群**（**⚠ 故这一句**必须**整句删去**）；**④⚠ 而\"**28 岁就要担心**\"这一层**的方向**是对的**（**⚠ 成人**单侧、反复、**量大的鼻出血**要**查**鼻咽癌、**高血压、**凝血障碍、**药物（抗凝）**（**⚠ 故\"**年龄**\"**在这里**是**一个**风险分层**）。** **⚠ 本集按语**：**这一段**最危险的地方**是**它**用\"**纯阳之体**\"**解释了一个**不存在的保护**（**⚠ 而**它**可能让家长**忽略**\"**反复鼻出血 + 面色苍白**\"**（**⚠ 而后者**可能是**\"**缺铁性贫血、**血小板减少、**凝血因子缺乏**\"**（**⚠ 故\"**儿童流鼻血**\"**的正确说法**是**：**多数无害，**但\"**反复 + 量大 + 有瘀斑 + 面色苍白**\"**要**查血**。","o":"RJ-2974 · 人纪·金匮要略·惊悸吐衄下血胸满瘀血病脉证治第十六（PDF 第508页）"},{"t":"五、\"目睛晕黄，衄未止\"","h":"一个用眼白判断\"血停没停\"的指标","c":"要点——**原文给了一个**极具体的观察点**，而它**只需看眼白**，须照录**：\"**'**师曰：**尺脉浮，目睛晕黄，衄未止；晕黄去，目睛慧了，知衄今止**'。**\" **讲义的展开**：\"**'「**目睛晕黄**」——**眼白的地方是黄色的，叫做晕黄**'。'**晕黄的现象，除了指这里的黄色很多、眼白变成很浓浊以外**——**最重要是眼睛周围这一圈黄的特别厉害，像月亮的晕**，**就是所谓的「晕黄」**'。'**我们知道肝开窍在眼睛**——**出现黄色，我们就知道肝里有蓄热**'。'**如果「晕黄去」、眼睛的黄没了**，「**目睛慧了**」**就是眼睛变得很清澈**——**代表肝肾的热退去，这个时候流鼻血会自止**'。'所以**这个条辨主要讲的是：当流鼻血愈后，我们需要再看看他的眼睛**——**如果眼睛还是很晕黄，代表他还会再流鼻血**'。**\" **须说明（四层）**：**①\"**看眼白**\"这个动作**极便宜** ✓（**⚠ 它**不需要**抽血、不需要设备**（**⚠ 而它**给了**一个**\"**治疗有没有效**\"**的终点**（**⚠ 故\"**出血停没停**\"**可以**用**\"**眼白清不清**\"**来跟踪**）；**②⚠ 而\"**像月亮的晕**\"这个描述**极精** ✓（**⚠ 它**把\"**黄染的范围（环状）**\"**讲成了**\"**月晕**\"**（**⚠ 而**真性黄疸**的**巩膜黄染**确实**从周边开始**（**⚠ 故\"**环状黄**\"**与**\"**均匀黄**\"**在**程度**上**不同**）；**③⚠ 而\"**肝开窍于目**\"这一层**是一个**脏腑对应**（**⚠ 而**它的现实对应**是**\"**巩膜黄染 → 胆红素升高**\"**（**⚠ 故\"**眼白黄**\"**确实**是**肝/胆**的**窗口** ✓）；**④⚠ 而这一层**的**真价值**是**：**它**把\"**一个主观的'**血止了没**'\"**变成了**\"**一个客观的'**黄退了没**'\"**（**⚠ 故\"**用可观察的替代不可观察的**\"**（**是**一个好方法** ✓）。** **⚠ 本集按语**：**\"**目睛晕黄**\"**这四个字**在**今天**有一个**更好的名字**（**\"**巩膜黄染**\"**）**（**⚠ 而**看的位置**是**同一个**（**⚠ 故\"**看眼白**\"**这个动作**（**两千年没变**（**⚠ 而它**仍然**是**最便宜的一个**肝胆指标** ✓）。","o":"RJ-2975 · 人纪·金匮要略·惊悸吐衄下血胸满瘀血病脉证治第十六（PDF 第508页）"},{"t":"六、\"衄家不可汗\"与\"汗血同源\"","h":"一条极重要的禁忌，与它的原理","c":"风险——**原文给了失血者的一条**绝对禁忌**，而讲义把它扩到了所有\"亡血家\"，须照录**：\"**'**衄家不可汗，汗出必颧上陷，脉紧急，直视不能眴，不得眠**'。**\" **讲义的展开**：\"**'常常会流鼻血的人不能发汗**——**不要说衄家，凡亡血家都不可汗**，**这是治病原则**'。'**所有病人只要出过大血**，如**刚开完刀后在病房恢复中时得到感冒**——**结果你给他一剂麻黄汤**，于是**「汗出必颧上陷，脉紧急，直视不能眴，不得眠」**'。'**中医的观念里面，叫汗血同源**——**汗跟血是同一个源**'。'**当你一发汗的时候，汗出颧上陷**'。'**汗血是同源，本已经亡血，再被发汗，病人就亡阴了**——**就是津液没了**'。'**这个时候阳热无阴的制衡，热会往上跑**——**于是体热就四散出，没有办法控制**'。**\" **须说明（四层）**：**①\"**亡血家不可汗**\"这一条**极重要** ✓（**⚠ 它**是**《伤寒论》**的一条**明确禁忌**（**⚠ 而**它的机制**是**\"**血容量已经不足，再发汗会进一步减少有效循环血量**\"**（**⚠ 故**它**在**今天**对应**\"**贫血/术后/失血者，慎用大量发汗退热**\"**）；**②⚠ 而\"**汗血同源**\"这四个字**极精**（**⚠ 它**说的是**\"**汗与血都来自体液**\"**（**⚠ 而**这一层**在**\"**大量出汗 → 血液浓缩 → 血容量下降**\"**上**完全成立** ✓）；**③⚠ 而\"**颧上陷**\"这一层**须标**（**⚠ 它**是**\"**眼窝/颞部凹陷**\"**（**⚠ 而**它的真实含义**是**\"**脱水导致的眼窝凹陷**\"**（**⚠ 故\"**颧上陷**\"**可以读作**\"**重度脱水的体征**\"**（**⚠ 而**这一层**在**婴幼儿腹泻脱水**上**极为典型**）；**④⚠ 而\"**直视不能眴、不得眠**\"这一层**极重要**（**⚠ 它**描述**\"**眼睛闭不上、睡不着**\"**（**⚠ 而**这一层**在**严重脱水/电解质紊乱/临终**上**确实可见**（**⚠ 故\"**术后 + 感冒 + 发汗 → 眼窝凹陷 + 躁动不眠**\"**是**一个**危险组合**（**⚠ 须**立即补液、就医**）。** **⚠ 本集按语**：**\"**汗血同源**\"**这四个字**最实用**（**⚠ 它**给了**一条**极具体的提醒**（**\"**刚失过血/刚做完手术的人，别用发汗药退烧**\"**（**⚠ 而**这条**在**家庭护理里**极常见**（**⚠ 故\"**失血者发汗**\"**＝**\"**用两次脱水换一次退热**\"**（**⚠ 这是**一个**可以避免的错误** ✓）。","o":"RJ-2976 · 人纪·金匮要略·惊悸吐衄下血胸满瘀血病脉证治第十六（PDF 第509页）"},{"t":"七、\"眼睛闭不起，就是阳要脱出了\"","h":"一个极重要的临终体征","c":"风险——**讲义描述了一个**极具体的濒危状态**，而这一层**极重要**，须照录**：\"**'**如果你把阴通通发掉了，阴和阳应该相互配合**——**有阴可以把阳拉住，有阳可以把阴固住**'。'**这个时候阳变成纯阳——孤阳冲上来，就是这样直视不能眴**'。'**病人的眼睛就瞪在那里，闭都闭不起**'。'**诸位可能没有看过快要死亡的人**——**眼睛真的是闭不起，你叫他闭他也闭不起**'。'**因为阳亢、阳就要脱出了**——**此时根本没有办法睡，就只能坐在那里**'。'**这就已经很危险了**'。'**如果遇到这种情形，你必须开大剂补气血的汤剂给病人，以救于万一**'。**\" **须说明（四层）**：**①\"**眼睛闭不起**\"这个观察**极准** ✓✓（**⚠ 它**在**临终**上**确实可见**（**⚠ \"**眼睑不能完全闭合**\"**是**\"**深度昏迷/濒死期**\"**的**一个体征**（**⚠ 故**这是一个**\"**家属可以看见**\"**的危险信号**）；**②⚠ 而\"**只能坐着、不能睡**\"这一层**也**极准**（**⚠ 它**对应**\"**端坐呼吸 + 躁动**\"**（**⚠ 故\"**不能平卧 + 不能入睡 + 眼神异常**\"**＝**急症**）；**③⚠ 而\"**阳要脱出**\"这一层**是一个**中医的**\"**阴阳离决**\"**概念**（**⚠ 而**它的现实对应**是**\"**循环衰竭/多器官功能障碍**\"**（**⚠ 故\"**阳脱**\"**可以读作**\"**休克**\"**）；**④⚠ 而\"**大剂补气血以救万一**\"这一层**须标**（**⚠ 真正的处置**是**\"**立即呼叫急救、建立静脉通路、给氧**\"**（**⚠ 而\"**汤剂**\"**不能**替代**\"**抢救**\"**（**⚠ 故**这一层**应改为**\"**先送急诊，中医可以在恢复期参与**\"**）。** **⚠ 本集按语**：**\"**眼睛闭不起**\"**这四个字**是**全册**最值得家属知道的一个体征**（**⚠ 因为**它**肉眼可见**（**⚠ 而它**指向**\"**已经很危险了**\"**（**⚠ 故\"**老人突然闭不上眼、只能坐着、叫不醒**\"**＝**立刻打 120**（**而不是**\"**再观察一晚**\"**）。","o":"RJ-2977 · 人纪·金匮要略·惊悸吐衄下血胸满瘀血病脉证治第十六（PDF 第509页）"},{"t":"八、\"血好像一个水袋，弹没有了就易破\"","h":"全册最好的一个比喻：阳虚为什么出血","c":"要点——**讲义用一个\"水袋\"解释\"为什么阳虚会出血\"，而这是**全册最好的一个比喻**，须照录**：\"**'**正常的血应该留在肝里面**——**有一天如果出现阳不足时，阴就会离经，血就逆行而上，于是就流鼻血**'。'**如果浮到头面上，就会流鼻血；如果在身体里面阳虚掉，阴也会失守而下血**'。'**血好像一个水袋**——**这个袋子本身有弹（弹性）才能把水固在里面**'。'**弹没有了，中医就叫做阳虚**——**这个时候水袋就易破，水就流出**'。'**如果在下焦的话，血管破裂掉，跑到大便里**'。**\" **须说明（四层）**：**①这个比喻**极精** ✓✓（**⚠ 它**把\"**血管的张力**\"**讲成了**\"**水袋的弹性**\"**（**⚠ 而\"**弹性没了 → 水渗出来**\"**是一个**人人都懂的画面**（**⚠ 故它**不需要\"**气不摄血**\"**就**能讲通**）；**②⚠ 而\"**阳虚 → 血管张力下降 → 出血**\"这一层**有真实的对应** ✓（**⚠ \"**血管壁的完整性**\"**（**⚠ 而**它**受**\"**血压、**胶原、**血小板、**维生素 C/K**\"**影响**（**⚠ 故\"**弹性**\"**这个比喻**极贴切**（**如**维生素 C 缺乏 → 毛细血管脆性增加 → 牙龈出血、皮下瘀斑**（**这正是\"**弹性没了**\"**））；**③⚠ 而\"**在上则衄、在下则便血**\"这一层**极精**（**⚠ 它**把\"**同一机制**\"**分成了**\"**两个出口**\"**（**⚠ 故\"**流鼻血与便血**\"**可能**是**同一件事的两个方向**）；**④⚠ 而这一层**的**价值**是**：**它**把\"**出血**\"**从**\"**血太多**\"**改成了**\"**装血的袋子坏了**\"**（**⚠ 而\"**袋子坏了**\"**这个思路**在**今天**叫**\"**血管完整性**\"**（**⚠ 故\"**止血**\"**不只是**\"**凝血**\"**（**还要**\"**修袋子**\"**（**如**补维生素 C/K、**控制血压、**改善胶原代谢**）。** **⚠ 本集按语**：**\"**水袋的弹性**\"**这个比喻**是**全书**最能\"**一图讲清**\"**的比喻**之一**（**⚠ 而它**恰好**说明了\"**为什么老年人一碰就瘀**\"**（**⚠ 因为**他们的\"**袋子**\"**老化了**（**⚠ 故\"**瘀斑**\"**不是**\"**血热**\"**（**常是**\"**血管脆**\"**（**而这**要**查**血压、**血小板、**凝血、**维生素**）。","o":"RJ-2978 · 人纪·金匮要略·惊悸吐衄下血胸满瘀血病脉证治第十六（PDF 第510~511页）"},{"t":"九、三种出血，三种脉","h":"一段\"以脉定位出血\"的分法","c":"方法——**原文用一句把三种出血配了三种脉，而这一层**极清楚**，须照录**：\"**'**病人**面无色，无寒热，脉沉弦者，衄**；**脉浮弱，手按之绝者，下血**；**烦欬者，必吐血**'。**\" **讲义的展开**：\"**'「**病人面无色**」——什么叫面无色？就是**气色非常的黯淡，面色非常的薄白，没有气血的样子**'。'**问他「你会不会冷？会不会热？」答：「都不会」**——就是**没有表症**'。'**再摸他的脉，又沉又弦**——**沉代表病在里，也代表肾；弦代表肝**'。'**所以当一个人就算没有寒热的症状，但是病人的气色却黯淡无光、脉又沉弦，我们就知道：阳虚后阴会往上走，一样会造成流鼻血**'。'「**脉浮弱**」**什么叫脉浮弱？轻轻摸到皮表时，就感觉到有脉，叫做浮脉**；**用浮的方法去摸，结果发现这浮脉很微弱、手指重按时就按不到脉了**——**这表示病人在下血**'。'**如果「烦欬者，必吐血」**'。**\" **须说明（四层）**：**①三种出血**三种脉**：\n\n| 出血 | 脉 | 提示 |\n|---|---|---|\n| 衄（鼻血） | 沉弦 | 阳浮于上，阴不能守 |\n| 下血（便血） | 浮弱、重按绝 | 阴失守于下 |\n| 吐血 | 烦欬 | 气逆于上 |\n\n**——⚠ 故**这一段**是**一个**\"**以脉定方向**\"**的示范**（**⚠ 而\"**方向**\"**比\"**病因**\"**更早**能**得到**；**②⚠ 而\"**面无色、无寒热**\"这一层**极重要**（**⚠ \"**无寒热**\"**排除了**\"**表证/感染**\"**（**⚠ 故\"**面色白 + 无发热**\"**把**注意力**指向**\"**慢性失血/贫血**\"**（**⚠ 而**这一层**在**今天**对应**\"**查血常规 + 铁**\"**）；**③⚠ 而\"**重按就按不到**\"这一层**极准**（**⚠ 它**＝**\"**脉很虚**\"**（**⚠ 而\"**虚**\"**在**\"**失血**\"**上**确实**（**因为**血容量下降、**代偿性血管收缩**）**（**⚠ 故\"**浮而无力**\"**可以对应**\"**血容量不足**\"**）；**④⚠ 而\"**烦欬者必吐血**\"这一层**须标**（**⚠ \"**咳嗽 + 烦躁 + 吐血**\"**要**优先**查**\"**肺结核、**支气管扩张、**肺癌**\"**（**⚠ 而**不是**\"**气逆**\"**（**⚠ 故**这一条**在今天是**\"**立即查胸部 CT**\"**）。** **⚠ 本集按语**：**\"**三种出血、三种脉**\"**最值得记的是\"**方向**\"**（**⚠ 因为**\"**血从上面出还是下面出**\"**（**决定**\"**先看耳鼻喉还是先看消化/肛肠**\"**（**⚠ 而\"**面色**\"**与\"**寒热**\"**这两个信息**，**比**脉**更容易**先得到**。","o":"RJ-2979 · 人纪·金匮要略·惊悸吐衄下血胸满瘀血病脉证治第十六（PDF 第510~511页）"},{"t":"十、\"天仓凹陷就是小偷\"","h":"一段必须整段剔除的相术","c":"风险——**讲义在解释\"颧上陷\"时，滑入了一套**看相断人**的话，须照录并整段剔除**：\"**'**颧上是在两个眉毛旁边的天仓位**——**这个在相书上面叫做天仓**'。'**天仓如果很饱满，代表祖上有积德；天仓凹下去的，代表祖上无德**'。'**如果眼白有一大片血丝在里面，这叫做「猪眼」**；**如果眼睛再大一点，变成「鸡蛋眼」**；**鸡蛋眼再配上旁边眼白很多黄黄的血丝，就叫做「羊眼」**'。'**遇到这两种人，你就闪远一点**——**这个人非奸即盗，大坏蛋一个**'。'**那如果你看到一个人，天仓是凹进去的、地格也是凹进去，然后精神好好的、在马路上跑，那就是小偷啊**'。'**他既败祖业，自己又不留财产**'。'**看地格，对不对？那就是小偷啊**'。'**地格很大、大大的两个地格，那财产很多，就房地产很多**'。'**天仓很大的人，祖产很多**'。**\" **须说明（四层，逐层否）**：**①\"**天仓饱满＝祖上有德**\"这一层**是**相术**（**⚠ 而**它与**\"**脾肾/气血**\"**没有**任何可验证的关系**（**⚠ 故**它**不是**医学**）；**②⚠ 而\"**眼睛大 + 眼白血丝＝非奸即盗**\"这一层**极危险**（**⚠ 眼白血丝**的**真实原因**是**\"**熬夜、**干眼、**结膜炎、**饮酒、**高血压**\"**（**⚠ 与\"**人品**\"**毫无关系**（**⚠ 故**这一段**是**一个**\"**以貌断人**\"**的**典型**（**⚠ 而**它**可能**导致**\"**歧视与误判**\"**（**⚠ 本集**一律剔除**）；**③⚠ 而\"**天仓凹、地格凹、精神好＝小偷**\"这一层**更**荒谬**（**⚠ 面颊/颞部凹陷**的**真实原因**是**\"**体重下降、**脱水、**衰老、**颞肌萎缩**\"**（**⚠ 故**它与**\"**是否偷东西**\"**无关**（**⚠ 而**这一段**把\"**一个体征**\"**直接**变成**\"**一个人的罪名**\"**（**⚠ 这**是**最坏的推理**）；**④⚠ 而\"**天仓大＝祖产多、地格大＝房地产多**\"这一层**须标**（**⚠ 这是**\"**面相经济学**\"**（**⚠ 而**它**与**\"**祖产**\"**没有任何**因果**（**⚠ 故**本集**只保留\"**颧上陷＝脱水/消瘦**\"**这个**医学层**（**⚠ 而**把**全部相术**删去**）。** **⚠ 本集按语**：**这一段**是**全册**最需要\"**整段切掉**\"的地方之一**（**⚠ 因为**它**从\"**一个脱水体征**\"**滑到了\"**给人定罪**\"**（**⚠ 而**中间**只用了**\"**相书上说**\"**四个字**（**⚠ 故\"**体征**\"**与**\"**人品**\"**之间**（**必须**有一条**不可越过的线**（**⚠ 而**本集的处置**是**：**\"**颧上陷**\"**保留为**\"**脱水/消瘦**\"**（**\"**天仓/地格/猪眼/羊眼**\"**一律删除**，**并注明\"**以貌断人不是医学**\"**。","o":"RJ-2980 · 人纪·金匮要略·惊悸吐衄下血胸满瘀血病脉证治第十六（PDF 第509~510页）"},{"t":"一、\"呕家有痈脓，不可治呕\"","h":"一条极重要的区别：吐脓不能止，吐血必须止","c":"风险——**原文给了呕吐的一条**反直觉**的处理原则，而讲义把它讲清了**边界**，须照录**：\"**'**夫呕家有痈脓，不可治呕，脓尽自愈**'。**\" **讲义的展开**：\"**'如果遇到呕吐的病家，吐到后来吐脓出，我们就知道是胃痈**'。'**如果没有咳嗽，完全是呕吐，吐到后来吐脓出**——**脓就是黄黄黏黏的痰水，就像我们身上一般的脓疡，就是胃里面化脓了**'。'**像这种情形，我们尽量不要去止呕，让病人把脓通通吐出**'。'**而吐血是要去止的——千万不可以误会，以为吐家不要去止吐**'。'**此处说的是吐脓，不是吐血不止**'。'**遇到吐脓的病人，「脓尽自愈」——让他将脓吐尽，而自己会好的**'。'**你把他治住了，这个脓吐不出来坏事，更坏事——闷在里面不出来，内脏都坏死了**'。'**就好像酒客喝酒喝太多了，呕吐——你看他呕吐，本来去止他的呕，他吐掉就醒过来；结果你止住，这是不对的**'。**\" **须说明（四层）**：**①\"**吐脓不止、吐血要止**\"这一对**极重要** ✓✓（**⚠ 因为**\"**吐脓**\"**是**\"**排出感染物**\"**（**止住它＝把脓闷在里面**（**⚠ \"**吐血**\"**是**\"**失血**\"**（**止住它＝保命**（**⚠ 故**同样是\"**吐**\"，**方向完全相反**）；**②⚠ 而\"**脓尽自愈**\"这一层**有一些道理**（**⚠ 胃内脓肿/化脓性感染**排空后**确实**可能缓解**（**⚠ 而**现代**的处置**是**\"**引流 + 抗生素 + 内镜**\"**（**⚠ 故\"**脓尽自愈**\"**只能当**\"**不要盲目止吐**\"**（**不能当**\"**不用就医**\"**）；**③⚠ 而\"**内脏都坏死了**\"这一层**极重**（**⚠ 它**说明**\"**脓在里面**\"**是**\"**感染扩散**\"**（**⚠ 故**\"**呕吐物有脓/有臭味**\"**＝**立即就医**（**⚠ 而**不是**\"**止吐观察**\"**）；**④⚠ 而\"**酒客呕吐**\"这个例子**极生活化**（**⚠ 它**说明**\"**有些呕吐是身体在排**\"**（**⚠ 而**止住它**（**反而**把**酒精/毒素**留在体内**（**⚠ 故\"**该吐的时候不要止**\"**（**是**一个**可以推广的原则**）。** **⚠ 本集按语**：**\"**吐什么**\"**比\"**吐不吐**\"**更重要**（**⚠ 因为**\"**吐脓/吐咖啡色物/吐鲜血/吐胆汁**\"**四者**的**处置**完全不同**（**⚠ 故**看到呕吐**，**第一句要问**\"**吐出来的是什么颜色、什么样子**\"** ✓。","o":"RJ-2981 · 人纪·金匮要略·呕吐哕下利病脉证治第十七（PDF 第536页）"},{"t":"二、三个\"呕与渴\"的关系","h":"三种顺序，三种判断","c":"方法——**原文用\"呕与渴的先后\"分出了三种情况，而这一层**极精**，须照录**：\"**'**先呕却渴者，此为欲解**；**先渴却呕者，为水停心下，此属饮家**'。'**呕家本渴，今不渴者，以心下有支饮故也，此属支饮**'。**\" **讲义的展开**：\"**'「**先呕却渴者，此为欲解**」——**一个病人呕吐完了，立刻就说口渴，这就表示要好了**'。'**一般在喝酒喝太多就会恶心呕吐，吐完后第一个现象就是口渴**'。'**你要用 commonsense 想：他呕吐了，胃的津液是不是去掉很多了？那津液丧失很多了，本来就应该口渴**'。'「**先渴却呕者**」——**因为口渴而去喝水，喝下去后又呕吐出**——**从这个症状我们就可以知道此人「水停心下」**'。'「**呕家本渴，今不渴者**」——**就是说呕家照理说水吐掉后应该会口渴，结果病人不口渴**'。'**这是因为吐了半天，水饮无法跟着出**——**表示此吐家本身还有支饮**'。**\" **须说明（四层）**：**①三个顺序**三个判断**：\n\n| 顺序 | 含义 | 提示 |\n|---|---|---|\n| 先呕 → 后渴 | 津液去了，胃在要水 | 快要好了 |\n| 先渴 → 喝水就呕 | 水停在胃里下不去 | 饮家（水停心下） |\n| 呕了半天 → 不渴 | 水饮在胃外，没跟着吐出来 | 支饮 |\n\n**——⚠ 故**\"**渴不渴**\"**是**一个**极便宜的**\"**病在哪一层**\"**的判据**（**⚠ 而**它**只需**问一句**）；**②⚠ 而\"**先呕却渴＝欲解**\"这一层**极重要**（**⚠ 它**把\"**口渴**\"**从\"**坏事**\"**改成了**\"**好事**\"**（**⚠ 而**这一层**在**\"**呕吐后口渴**\"**上**确实**是**\"**体液丢失后的正常反应**\"**（**⚠ 故\"**吐完渴了**\"**不必**担心**）；**③⚠ 而\"**先渴却呕**\"这一层**极精** ✓（**⚠ 它**描述了**\"**喝水就吐**\"**（**⚠ 而这一层**在**\"**幽门梗阻、**胃排空障碍**\"**上**确实可见**（**⚠ 而**它**也**是**\"**水停心下**\"**的**一个**可观察入口**）；**④⚠ 而\"**呕而不渴**\"这一层**极重要** ✓✓（**⚠ 它**说明**\"**吐了半天水没少**\"**（**因为**水不在胃里**（**⚠ 故\"**不渴**\"**反而是**\"**水在胃外**\"**的证据**（**⚠ 而**这一层**极反直觉**（**⚠ 故**它**值得**单独记**）。** **⚠ 本集按语**：**\"**呕与渴的先后**\"**这个框架**最有用**的是它**示范了**\"**用两个症状的**顺序**\"**（**⚠ 而**不是**\"**用两个症状的**有无**\"**（**⚠ 因为**顺序**能**提示**\"**因果方向**\"**（**⚠ 故**问诊**要**问\"**先哪个后哪个**\"**（**不要只问\"**有没有**\"**）。","o":"RJ-2982 · 人纪·金匮要略·呕吐哕下利病脉证治第十七（PDF 第536~537页）"},{"t":"三、小半夏汤与苓桂术甘汤：一个\"有没有晕\"","h":"两首治\"水饮\"的方，只差一个症状","c":"方法——**讲义把两首\"治饮\"的方分开了，而分界**只有一个症状**，须照录**：\"**'此时像**苓桂术甘汤、小半夏汤等都可以把这胃里的水饮去掉**——**只是饮的种类不同而已**'。'**苓桂术甘汤能治的饮，是已经造成头昏眩的饮**'。'**小半夏汤主症是恶心而无头晕眩**'。'**小半夏汤只是在胃里面而已**；**苓桂术甘汤是在整个横隔里面**'。'**所以苓桂术甘汤的病人一定会有晕眩，而小半夏汤的病人就是恶心而已、不会有晕眩**——**因为它只在胃里面**'。'**这是它的差异，这个区分点**'。**\" **须说明（四层）**：**①\"**有没有晕眩**\"**这个分界**极精** ✓✓（**⚠ 它**用**一个症状**分开了**两首方**（**⚠ 而**这个症状**恰好**对应**\"**水在胃内**\"**vs**\"**水在横膈**\"**（**⚠ 故\"**问一句晕不晕**\"**就能选方**）；**②⚠ 而\"**小半夏汤在胃里、苓桂术甘汤在横隔**\"这个定位**极重要**（**⚠ 它**是**\"**以部位分方**\"**的示范**（**⚠ 而**这一层**在**\"**胃内积液**\"**与**\"**膈上/胸膜腔积液**\"**上**有对应**）；**③⚠ 而\"**小半夏汤**\"（半夏 + 生姜）的**组成**极简**（**⚠ \"**半夏、生姜**\"**两味**（**⚠ 而\"**生姜解半夏毒**\"**（**⚠ 故**这是**一个**\"**用毒药 + 解药**\"**同方的例子**（**⚠ 而**生半夏**有毒**（**⚠ 故**本集**须标**：**生半夏需炮制/专业使用，0.2 g 即可中毒，不可自配**）；**④⚠ 而\"**只是恶心而已**\"这一层**极精**（**⚠ 它**说明**\"**小半夏汤证**\"**极轻**（**⚠ 故**它**是**\"**一个症状一个方**\"**的**最小单位**（**⚠ 而**这一层**在**\"**妊娠呕吐、**化疗后恶心**\"**上**有**今天的对应**）。** **⚠ 本集按语**：**\"**有没有晕**\"**这一问**是**全篇**最实用的一个分界**（**⚠ 因为**它**把\"**恶心**\"**与\"**头昏**\"**分成了**两条路**（**⚠ 而**这两条路**的**方**完全不同**（**⚠ 故**问诊**要**问全**（**不要只问\"**想不想吐**\"**）。","o":"RJ-2983 · 人纪·金匮要略·呕吐哕下利病脉证治第十七（PDF 第537页）"},{"t":"四、\"脉数，但不是胃热\"","h":"一个关于\"发汗后\"的例外","c":"要点——**原文设了一个问，而答案**极反直觉**，须照录**：\"**'**问曰：病人脉数，数为热，当消谷引饮，而反吐者，何也？**'。'**师曰：以发其汗，令阳微，隔气虚，脉乃数**——**数为胃热，不能消谷，胃中虚冷故也**'。'**脉弦者虚也，胃气无余，朝食暮吐，变为胃反**'。**\" **讲义的展开**：\"**'这种情形是病人吃了发汗药所引发的**'。'**有的人吃麻黄汤或者是桂枝汤、葛根汤之后，汗发出，结果造成中膈上焦气虚**'。'**因为我们的肺气是走表的，发汗了以后肺阳变虚**'。'**结果脉也可以摸到是数脉，但是这种情形就跟胃没有关系**'。'**这个脉数是因为发汗引起的**'。'**此时没有办法把食物消化掉，是因为这类人平时胃中就比较虚冷造成的**'。**\" **须说明（四层）**：**①\"**脉数不一定是热**\"这一层**极重要** ✓✓（**⚠ 它**说明**\"**一个脉象**\"**要**放在**\"**一个背景**\"**里读**（**⚠ 而**这个背景**是**\"**刚发过汗**\"**（**⚠ 故\"**发汗后脉数**\"**≠**\"**胃热**\"**（**⚠ 而**它**可能是**\"**代偿性的心搏加快**\"**）；**②⚠ 而\"**胃中虚冷 → 不能消谷 → 反吐**\"这一层**极重要**（**⚠ 它**解释了**\"**为什么有人吃了就吐**\"**（**⚠ 而\"**胃寒**\"**在**\"**胃动力不足、**胃排空延迟**\"**上**有对应**）；**③⚠ 而\"**朝食暮吐，变为胃反**\"这一层**极重要** ✓✓（**⚠ \"**早上吃的、晚上吐出来**\"**是**\"**胃排空严重延迟**\"**（**⚠ 而**这**在**\"**幽门梗阻**\"**上**极为典型**（**⚠ 故\"**朝食暮吐**\"**这四个字**是**一个**外科级别的信号**（**⚠ 须**查胃镜**）；**④⚠ 而\"**医反下攻之，今脉反弦，故名曰虚**\"这一层**极重要**（**⚠ 它**说明了**\"**误下会让虚更虚**\"**（**⚠ 而**这一层**在**第 n42 条\"**大下后里虚**\"**上**已经出现过**（**⚠ 故**这是**一个**反复出现的主题**：**虚证**不可**攻**）。** **⚠ 本集按语**：**\"**朝食暮吐**\"**这四个字**最值得记**（**⚠ 因为**它**描述的**是一个**\"**定时**\"**（**⚠ 而\"**定时呕吐**\"**在**\"**幽门梗阻、**胃轻瘫、**食管裂孔疝**\"**上**都**要**查**（**⚠ 故\"**早上吃的晚上吐**\"**＝**必须**做胃镜**（**不是**\"**胃寒**\"**）。","o":"RJ-2984 · 人纪·金匮要略·呕吐哕下利病脉证治第十七（PDF 第537页）"},{"t":"五、\"哕而腹满，观其前后\"","h":"打嗝的三个阶段，一段极完整的阶梯","c":"方法——**原文给了打嗝的一条**极简的指示**，而讲义把它展开成了**三个阶段**，须照录**：\"**'**哕而腹满，观其前后，知何部不利，利之愈**'。**\" **讲义的展开**：\"**'打嗝有三个处方：一个是橘皮汤，橘皮竹茹汤，还有就是下段要讨论的汤方**'。'**打嗝时如果同时有肚子胀满，而且是胃有虚热所产生的嗝逆，就是橘皮汤证**'。'**如果没有好，我们就要看到底是大便不通还是小便不通？知道何处不利，将之利出后嗝逆就好了**'。'**但是这只是一般的嗝逆**'。'**如果连橘皮竹茹汤都不能将之治好，再加上利了大小便都不能治好时，这就是胃气绝了**'。'**这个时候不要再用橘皮汤，也不用再帮病人通利大小便了**——**直接使用茯苓四逆汤，或是通脉四逆汤加葱白下去通其阳气**'。'**一定要很快的把胃气壮起才行，否则病家很危险**'。**\" **须说明（四层）**：**①\"**观其前后**\"这三个字**极精** ✓✓（**⚠ \"**前**\"＝**小便**（**\"**后**\"＝**大便**（**⚠ 而\"**打嗝 + 腹满**\"**要**先查**\"**大便通不通、小便通不通**\"**（**⚠ 故**这是**一个**极具体的\"**下一步**\"**）；**②⚠ 而打嗝的**三个阶段**极完整**：\n\n| 阶段 | 表现 | 处置 |\n|---|---|---|\n| 一 | 打嗝 + 腹满（虚热） | 橘皮汤 / 橘皮竹茹汤 |\n| 二 | 橘皮汤无效 | 查大便、小便，通利之 |\n| 三 | 通利后仍不止 | 胃气绝 → 茯苓四逆汤 / 通脉四逆汤 |\n\n**——⚠ 故**这是一个**\"**从轻到危**\"**的**完整阶梯**（**⚠ 而**它**给了**一个**\"**什么时候该紧张**\"**的标准**；**③⚠ 而\"**胃气绝**\"这一层**极重要**（**⚠ 它**说明**\"**顽固性打嗝**\"**在**重症**上**是**一个**坏信号**（**⚠ 而**这一层**在现代**有对应**（**⚠ 顽固性呃逆**可见于**尿毒症、**脑卒中、**肿瘤、**电解质紊乱**（**⚠ 故\"**打嗝超过 48 小时**\"**要**查**肾功能、**电解质、**神经系统**）；**④⚠ 而\"**利之愈**\"这三个字**极精**（**⚠ 它**说明**\"**打嗝的原因是'**下面不通**'\"**（**⚠ 而\"**通了就好**\"**（**⚠ 这一层**在**\"**腹胀 → 膈肌受压 → 呃逆**\"**上**有对应**（**⚠ 故\"**打嗝**\"**可以**是**\"**腹压高**\"**的**一个信号**）。** **⚠ 本集按语**：**\"**观其前后**\"**这三个字**是**全篇**最好的一个\"**下一步指示**\"**（**⚠ 因为**它**把**一个**\"**没头绪的症状**\"**（**变成了**\"**两个可查的出口**\"**（**⚠ 故\"**打嗝不止**\"**（**先问**\"**大便几天没解、小便顺不顺**\"**（**⚠ 而**这**比**\"**喝口水压一压**\"**有用** ✓）。","o":"RJ-2985 · 人纪·金匮要略·呕吐哕下利病脉证治第十七（PDF 第541页）"},{"t":"六、\"似喘不喘，似呕不呕，似哕不哕\"","h":"一个\"说不清哪里不舒服\"的证，与它的方","c":"定义——**原文用三个\"似……不……\"描述了一种**极难说清的状态**，须照录**：\"**'**病人胸中似喘不喘，似呕不呕，似哕不哕，彻心中愦愦然无奈者，生姜半夏汤主之**'。**\" 方**：\"**半夏半升，生姜汁一升**。**右二味，以水三升，煮半夏，取二升，内生姜汁，煮取一升半，小冷，分四服，日三夜一服。止，停后服**。**\" **讲义的展开**：\"**'生姜半夏汤就只是生姜半夏两味而已**——**这个是针对「胸中似喘不喘」为主症用的**'。'**大家注意看，为什么用那么多生姜？**'。'**大家看最后两行：「右二味，以水三升」，先煮半夏以后再放生姜汁**'。'**换句话说，生姜是取汁、取生姜汁入药的，并不是直接放下去一起煮**'。'**这个处方是采用半夏能够取水的药，生姜生用能够加强散水的力量，所以用生姜汁就是有这个功能在**'。'**这个条辨是说：当水饮在胃里面停积的比较多时，就必须要加强散水的力量**'。'**「胸中似喘不喘」，因为水邪在中膈，使得肺里面变寒**'。**\" **须说明（四层）**：**①三个\"**似……不……**\"**极精** ✓✓（**⚠ 它**描述的**是**\"**有那个感觉、但不到那个程度**\"**（**⚠ 而这**正是**\"**一种说不清的难受**\"**（**⚠ 故\"**愦愦然无奈**\"**这四个字**极传神**（**\"**心里乱糟糟的、没办法**\"**）；**②⚠ 而\"**取生姜汁**\"这个剂型**极重要** ✓（**⚠ 它**说明**\"**生姜生用**\"**与**\"**生姜煮过**\"**作用不同**（**⚠ 而\"**生用加强散水**\"**（**⚠ 故\"**先煮半夏、后下姜汁**\"**是**一个**极讲究的**工艺**（**⚠ 故\"**中药的煎法**\"**（**不是**\"**随便煮**\"**）；**③⚠ 而\"**半夏只有生姜用量的一半**\"这一层**极重要**（**⚠ 生姜汁一升**vs**半夏半升**（**⚠ 故\"**生姜的量**\"**大于**\"**半夏**\"**（**⚠ 而**这一层**与\"**生姜解半夏毒**\"**是**同一条线**（**⚠ 故\"**重生姜**\"**既**\"**增效**\"**又**\"**减毒**\"**）；**④⚠ 而\"**分四服、日三夜一服**\"这一层**极精**（**⚠ 它**说明**\"**小量频服**\"**（**⚠ 而**这一层**在**\"**止呕**\"**上**极有道理**（**⚠ 故\"**一次喝一大碗**\"**（**反而**会**吐**（**⚠ 而\"**少量多次**\"**（**才**留得住**）。** **⚠ 本集按语**：**\"**似喘不喘、似呕不呕、似哕不哕**\"**这十二个字**是**全册**最好的**\"**症状群**\"**描述**之一**（**⚠ 因为**它**承认了**\"**有些难受说不清**\"**（**⚠ 而\"**说不清**\"**不是**\"**没有病**\"**（**⚠ 故**遇到**\"**查不出原因、但就是难受**\"**的人**，**这一条**比**\"**你没事**\"**有温度** ✓）。","o":"RJ-2986 · 人纪·金匮要略·呕吐哕下利病脉证治第十七（PDF 第559~560页）"},{"t":"七、\"吃黄瓜拉黄瓜\"","h":"一句极准的\"下利清谷\"，与一个真实医案","c":"定义——**讲义用**极生活化**的话解释了\"下利清谷\"，须照录**：\"**'病人出现下利清谷的症状，有的人会持续几年之久**'。'**美国医院里面一位小儿科医师就是这样**——**下利清谷已经有五年之久了**'。'**可是最近六个月他受不了了，一天要跑十几次厕所**'。'**六个月都没有办法出去渡假——带着尿布如何去渡假呢？**'。'**结果只好到我诊所治疗**'。'**下利清谷，代表肠胃里虚寒了**'。'**病人陈述的症状是说：「我一直感觉到东西没有办法待在胃里面，吃下去就跑出，很难过」**'。'**这就是所谓的下利清谷**'。'**如果有一个人下利清谷，吃了黄瓜就拉出来黄瓜，吃了西瓜拉西瓜、吃了青菜拉青菜**'。**\" **须说明（四层）**：**①\"**吃黄瓜拉黄瓜**\"这六个字**极精** ✓✓（**⚠ 它**把\"**完谷不化（食物原样排出）**\"**讲成了**一个**人人能懂的画面**（**⚠ 而**这一层**在**\"**消化不良、**胰腺外分泌不足、**肠道通过时间过短**\"**上**确实可见**（**⚠ 故\"**吃啥拉啥**\"**是一个**极明确的信号**）；**②⚠ 而\"**东西没办法待在胃里**\"这一层**也**极准**（**⚠ 它**描述的**是**\"**胃排空过快 + 吸收不足**\"**（**⚠ 而\"**吃下去就跑出**\"**这个感觉**（**是**\"**一个真实的病人语言**\"**）；**③⚠ 而\"**五年之久**\"这一层**极重要**（**⚠ 它**说明**\"**慢性腹泻**\"**可以**拖很久**（**⚠ 而**拖久了的代价**是**\"**营养耗竭、**电解质紊乱、**社交受限**\"**（**⚠ \"**带着尿布如何渡假**\"**这一句**（**是**一个**极真实的**\"**生活质量**\"**的写照**）；**④⚠ 而\"**虚寒**\"**这个归因**须标**（**⚠ 慢性腹泻**要**查**\"**乳糖不耐、**小肠细菌过度生长、**胰腺外分泌功能、**甲亢、**炎症性肠病**\"**（**⚠ 故\"**虚寒**\"**是一个**分类**（**不是一个**\"**查完了**\"**）。** **⚠ 本集按语**：**\"**吃黄瓜拉黄瓜**\"**这六个字**是**全册**最好的**\"**用一个饭碗讲清一个病**\"**（**⚠ 而它**恰好**说明**：**\"**腹泻**\"**不是**\"**拉稀**\"**（**是**\"**食物没被处理**\"**（**⚠ 故\"**看大便里有没有食物原形**\"**（**是一个**极便宜的分级**（**⚠ 有原形 → 消化吸收问题**（**无水样 → 分泌/动力问题**）。","o":"RJ-2987 · 人纪·金匮要略·呕吐哕下利病脉证治第十七（PDF 第581页）"},{"t":"八、\"下利清谷，不可攻其表\"","h":"一条极重要的先后秩序","c":"风险——**原文给了一条**明确的禁忌**，而讲义把它讲成了一个\"**先里后表**\"**的规则**，须照录**：\"**'**下利清谷，不可攻其表，汗出必胀满**'。**\" **讲义的展开**：\"**'这时病人里寒很盛，我们应该开温里的药给他才对**——**因为发表药是攻表阳被寒约束时用的**'。'**如果里寒重时你用发表的药，会让表虚掉而里寒外出，就会感到腹胀满**'。'**这种是虚胀，不是实胀——是气闷在那里不能动**'。'**因为阳气被发表药发掉了，所以肚子会胀满**'。'**像遇到这种情形，病人下利清谷，你要开大剂的温中药物给病人服用**'。'**如果他是麻黄汤证——恶寒无汗、骨节疼痛，结果病人下利**——**这个时候你绝对不可以攻表，要先解里**'。'**如果你一攻表的时候，身体会胀满**'。**\" **须说明（四层）**：**①\"**下利清谷不可攻表**\"这一条**极重要** ✓✓（**⚠ 它**说**\"**里虚寒未解时，不能先解表**\"**（**⚠ 而**这一层**与**第 n47 条\"**亡血家不可发汗**\"**、第 n45 条\"**疮家不可发汗**\"**是**同一组禁忌**（**⚠ 故**汗法**有**三个\"**不可以**\"**：**亡血、**疮家、**下利清谷**）；**②⚠ 而\"**汗出必胀满**\"这一层**极精**（**⚠ 它**描述**\"**发汗后腹胀**\"**（**⚠ 而\"**虚胀**\"**（**⚠ 因为**\"**阳气被发掉了**\"**（**⚠ 故\"**发汗后肚子胀**\"**（**不一定是**\"**吃撑了**\"**（**可能是**\"**阳气被散**\"**）；**③⚠ 而\"**先解里**\"这个规则**极重要**（**⚠ 它**是**\"**表里同病时先治哪个**\"**的**一条答案**（**⚠ 而**这一层**在**\"**感染 + 腹泻**\"**上**有对应**（**⚠ 故\"**又感冒又拉肚子**\"**（**先**\"**治里**\"**（**而不是**先**\"**发汗**\"**）；**④⚠ 而\"**虚胀不是实胀**\"这一层**极重要**（**⚠ 它**把\"**胀**\"**分成了**\"**有物**\"**与**\"**无物**\"**（**⚠ 而**这一层**与**第 n42 条\"**按之不痛为虚**\"**是**同一条线**（**⚠ 故\"**胀**\"**要**先分**\"**实**\"**与**\"**虚**\"**（**再定**\"**攻**\"**与**\"**补**\"**）。** **⚠ 本集按语**：**\"**下利清谷不可攻其表**\"**这条**最实用**（**⚠ 因为**它**说**\"**身上有两个病时，先救那个会要命的**\"**（**⚠ 而**腹泻脱水**（比**鼻塞**更急**（**⚠ 故\"**又拉又感冒**\"**（**先**\"**温里、补水**\"**（**而不是**\"**先**\"**发汗退烧**\"** ✓）。","o":"RJ-2988 · 人纪·金匮要略·呕吐哕下利病脉证治第十七（PDF 第581页）"},{"t":"九、\"肾火入胃，胃才能蠕动\"","h":"一段关于\"胃的动力从哪来\"的说法","c":"要点——**讲义在解释\"趺阳脉紧而数\"时，给了一个**\"火源**\"模型**，须照录**：\"**'**我们胃的热、就是胃蠕动的源有二**'。'**中医的观念是：肾脏的火往外走时，一个火进入膀胱气化尿液，一个肾脏的火进入胃，让胃蠕动起**'。'**所以当脾脏寒、就是脾脏功能衰弱了，可是胃的蠕动还是很快**'。**\" **须说明（四层）**：**①\"**一个火分两路（膀胱 + 胃）**\"这个模型**极整齐**（**⚠ 而**它**把\"**肾阳**\"**当成了**一个**\"**总火源**\"**（**⚠ 而**这一层**在**\"**整体代谢率/体温**\"**上**有一个**模糊的对应**（**⚠ 故\"**肾火**\"**可以读作**\"**基础代谢的动力**\"**）；**②⚠ 而\"**脾寒胃热**\"这个组合**极重要**（**⚠ 它**是**一个**\"**一快一慢**\"**的**矛盾**（**⚠ 而**这一层**在**\"**能吃但不长肉**\"**上**极常见**（**⚠ 故\"**食即为满**\"**（**一吃就胀**）**）；**③⚠ 而\"**肾火**\"**这个说法**须标**（**⚠ 它**不是**\"**一个器官的火**\"**（**⚠ 而**它是**\"**下焦整体功能**\"**的**一个比喻**（**⚠ 故\"**火源**\"**这个词**（**读作**\"**动力来源**\"**（**而不是**\"**一个火炉**\"**）；**④⚠ 而这一层**与**第 n46 条\"**锅底的火**\"**是**同一个比喻系统**（**⚠ 故**讲义**在**不同篇章**反复用**\"**火与锅**\"**（**⚠ 而**这一组比喻**是**这本讲义的**\"**底层语言**\"**）。** **⚠ 本集按语**：**\"**火在锅底下**\"**这一组比喻**最有用**的地方**是**它**给了一个**\"**看哪里**\"**的指示**（**⚠ \"**看锅底（下焦）**\"**（**而不是**\"**看锅面（症状）**\"**（**⚠ 而**这一层**在**\"**治本**\"**上**是**一句**极通俗的**解释** ✓）。","o":"RJ-2989 · 人纪·金匮要略·呕吐哕下利病脉证治第十七（PDF 第538页）"},{"t":"十、\"先煮半夏，后下姜汁\"","h":"一个容易被忽略的煎法细节","c":"方法——**生姜半夏汤的煎法**极讲究**，而这一层**在方剂学上极重要**，须照录**：\"**'**右二味，以水三升，煮半夏，取二升，内生姜汁，煮取一升半，小冷，分四服，日三夜一服**'。'**先煮半夏以后再放生姜汁**——**换句话说，生姜是取汁、取生姜汁入药的，并不是直接放下去一起煮**'。'**这个处方是采用半夏能够取水的药，生姜生用能够加强散水的力量**'。'**所以用生姜汁就是有这个功能在**'。**\" **须说明（四层）**：**①\"**后下姜汁**\"这个细节**极重要** ✓（**⚠ 它**说明**\"**同一个药，**生用**与**煮过**\"**作用不同**（**⚠ 而\"**挥发性的成分**\"**会**被**长时间加热破坏**（**⚠ 故\"**后下**\"**（**是**一个**有物理依据的工艺**）；**②⚠ 而\"**小冷、分四服**\"这一层**极精**（**⚠ \"**小冷**\"**＝**稍凉**（**⚠ 而\"**分四服**\"**＝**少量多次**（**⚠ 故\"**止呕的药**\"**要**\"**凉一点、少一点、多次**\"**（**⚠ 而**这一层**在**\"**呕吐时胃很敏感**\"**上**极有道理**）；**③⚠ 而\"**日三夜一服**\"这一层**极重要**（**⚠ 它**说明**\"**夜里也要给药**\"**（**⚠ 故\"**呕吐/腹泻**\"**不能**\"**白天治、夜里停**\"**（**⚠ 而**这一层**在**\"**急性胃肠炎**\"**上**（**是**一个**可以照做的细节**）；**④⚠ 而\"**生姜生用加强散水**\"这一层**须标**（**⚠ 生姜**的**止呕作用**（**是**有**现代依据的**（**⚠ 姜辣素/姜烯酚**抑制**5-HT3**（**⚠ 故\"**生姜止呕**\"**（**在**\"**妊娠呕吐、**晕车**\"**上**确实有效** ✓）。** **⚠ 本集按语**：**\"**后下**\"**这两个字**是**全册**最容易被忽略的一个**工艺细节**（**⚠ 而它**说明**\"**煎药**\"**不是**\"**把药丢进去煮**\"**（**⚠ 故\"**该后下的后下、该先煎的先煎**\"**（**是**一条**\"**可以影响疗效**\"**的操作**（**⚠ 而**这一层**在**任何**\"**自己煎药**\"**的人身上**都**值得说一句**。","o":"RJ-2990 · 人纪·金匮要略·呕吐哕下利病脉证治第十七（PDF 第559~560页）"},{"t":"一、\"浮数脉 + 恶寒 + 有痛处 = 痈\"","h":"一个与\"麻黄汤证\"三字之差的鉴别","c":"定义——**原文给了一个**极精的三联征**，而讲义把它与麻黄汤证分开了**，须照录**：\"**'**诸浮数脉，应当发热，而反洒淅恶寒，若有痛处，当发其痈**'。**\" **讲义的展开**：\"**'「**应当发热，而反洒淅恶寒**」——照理说如果病人无汗、脉又很数，理当发热，结果病人不但不发热，反而恶寒**——**就是病人身上患有脓疮的疾病**'。'**当皮表有痈脓时，我们体内的阳会出相抗，此时病人就会感觉到身冷**'。'**脉浮就是病在表，脉数就是有热，所以这是表热要发出的现象**'。'**如果皮肤表面尚未见到脓出现，但是如果病人有痛处，这痛处里面就是脓的所在**'。'**脉浮而且紧，加上恶寒身痛，才是麻黄汤证**'。**\" **须说明（四层）**：**①两个三联征**只差一点**：\n\n| 证 | 脉 | 恶寒 | 其他 |\n|---|---|---|---|\n| 麻黄汤证 | 浮**紧** | 有 | **全身**骨节疼痛 |\n| 痈（化脓） | 浮**数** | 有 | **一个固定**痛处 |\n\n**——⚠ 故\"**痛是全身还是固定一处**\"**是**最关键的区分**（**⚠ 而\"**固定痛处**\"**＝**\"**脓正在那里形成**\"**）；**②⚠ 而\"**脉数但反而不发热**\"这一层**极精**（**⚠ 它**说明**\"**热被'**聚**'**在某处**\"**（**⚠ 而\"**局部的化脓**\"**可以**让**全身**不发热**（**⚠ 故\"**脉数 + 不发热**\"**是一个**值得警觉的组合**）；**③⚠ 而\"**有痛处**\"这三个字**极重要** ✓✓（**⚠ 它**把**一个**\"**没有外观的痈**\"**（**变成了**\"**可以问出来的一处痛**\"**（**⚠ 故\"**摸着脉数、但看不出什么**\"**（**问一句**\"**哪里痛**\"**（**比**\"**再观察**\"**有用**）；**④⚠ 而\"**当发其痈**\"这一层**须标**（**⚠ 它**不是\"**发汗**\"**（是\"**让痈发出来**\"**（**⚠ 而\"**现代**的处置**是**\"**抗感染、必要时切开引流**\"**）。** **⚠ 本集按语**：**\"**浮数 + 恶寒 + 一处痛**\"**这九个字**是**一个**极便宜的三联征**（**⚠ 而它**在**\"**深部脓肿/早期阑尾炎/肝脓肿**\"**上**确实**可以**先**被**问出来**（**⚠ 故\"**发烧但找不到原因**\"**（**问一句**\"**身上有没有一处特别痛**\"** ✓）。","o":"RJ-2991 · 人纪·金匮要略·疮痈肠痈浸淫病脉证并治第十八（PDF 第583页）"},{"t":"二、\"以手掩肿上，热者为有脓\"","h":"一个\"一摸就知道\"的检查","c":"方法——**原文给了一个**只有一句话的检查法**，而它**极实用**，须照录**：\"**'**师曰：诸痈肿，欲知有脓无脓，**以手掩肿上，热者为有脓，不热者为无脓**'。**\" **讲义的展开**：\"**'这个师，张仲景说了：所有的痈肿，你知道他有脓无脓，手去摸他**'。'**这句话讲得很好**——**用手摸他的时候，热者为有脓，不热者为无脓**'。'**这个脓出现的地方，可能是你的腹膜炎**——**腹膜炎可能是盲肠破裂，或者是胆破裂**'。'**但是基本上诊断就是热，手摸上去是热的**'。**\" **须说明（四层）**：**①\"**热者为有脓**\"这一条**极准** ✓✓（**⚠ 化脓**＝**局部炎症反应**（**⚠ 而\"**局部温度升高**\"**是**炎症的**四个经典体征之一**（**红、肿、热、痛**）——**⚠ 故\"**摸一摸**\"**是**\"**一个两千年前的物理检查**\"**）；**②⚠ 而\"**不热者为无脓**\"这一层**也**有道理**（**⚠ 早期**（**未化脓**）**只是**\"**肿/硬/痛**\"**（**⚠ 而\"**变热**\"**提示**\"**液化/化脓**\"**（**⚠ 故\"**热不热**\"**可以**提示**\"**化脓的阶段**\"**）；**③⚠ 而\"**腹膜炎、盲肠破裂、胆破裂**\"这一层**极重要**（**⚠ \"**腹部的脓肿**\"**是**最危险的**（**⚠ 而\"**手摸上去是热的**\"**在**\"**腹膜炎**\"**上**确实**可见**（**⚠ 故\"**肚子某处一摸就热、一按就痛**\"**＝**急诊**）；**④⚠ 而\"**万一是女孩子阴部就不方便**\"这一层**极诚实**（**⚠ 它**承认了**\"**有些部位不能摸**\"**（**⚠ 故\"**替代办法**\"**是**\"**问：那块地方是不是比别处热**\"**（**⚠ 而**这一层**在**今天的远程问诊**上**也**适用**）。** **⚠ 本集按语**：**\"**热者为有脓**\"**这五个字**是**全册**最好的一个\"**床旁检查**\"**（**⚠ 因为它**只需要**一只手**（**⚠ 而它**对应**\"**炎症的局部温度升高**\"**（**⚠ 故\"**身上有个包，摸上去烫不烫**\"**（**是一个**可以自己做的分级**（**⚠ 烫 → 就医**（**不烫 → 观察**）。","o":"RJ-2992 · 人纪·金匮要略·疮痈肠痈浸淫病脉证并治第十八（PDF 第583页）"},{"t":"三、痈与疽：一浅一深、一急一缓、一热一不热","h":"三个维度分开两个字","c":"定义——**讲义把\"痈\"与\"疽\"分成了三组对应，而这三组**极整齐**，须照录**：\"**'**我们中医用「疽」这个字，就代表病比较深；用「痈」就表示病比较浅、在皮表**'。'**用「痈」，就是病比较急；用「疽」，病比较缓**'。'**痈的症状都是发热，疽的症状都不发热**'。'**这是痈和疽的区分法**'。**\" **须说明（四层）**：**①三个维度**极整齐**：\n\n| | 痈 | 疽 |\n|---|---|---|\n| 深浅 | 浅（皮表） | 深 |\n| 缓急 | 急 | 缓 |\n| 发热 | 有热 | 不发热 |\n\n**——⚠ 故**这是**一个**\"**三个词分一个病谱**\"**的示范**（**⚠ 而**它**只需要**\"**看深浅、**看快慢、**摸热不热**\"**）；**②⚠ 而\"**痈＝浅、急、热**\"这一组**在今天的对应**是**\"**急性化脓性感染（脓肿、蜂窝织炎）**\"**（**⚠ 而\"**红、肿、热、痛 + 发热**\"**正好**对得上** ✓）；**③⚠ 而\"**疽＝深、缓、不热**\"这一层**也**有对应**（**⚠ 它**对应**\"**深部感染/慢性溃疡/坏疽**\"**（**⚠ 而\"**不发热**\"**恰恰**是**\"**局部血供差、免疫反应弱**\"**（**⚠ 故\"**深而不热**\"**反而**更危险**（**⚠ 因为**它**可能**是**\"**坏疽**\"**）；**④⚠ 而**这一组区分**的**价值**是**：**它**提醒**\"**热不等于重，不热不等于轻**\"**（**⚠ \"**不热的深部感染**\"**（**可能是**\"**已经坏死了**\"**（**⚠ 故\"**摸着不热、但很深、很久**\"**（**要**更警惕**）。** **⚠ 本集按语**：**\"**痈/疽**\"**这两个字**在**今天的口语里**已经**不用了**（**⚠ 而**它的内核**还在**（**\"**浅的脓肿**\"**vs**\"**深的坏疽**\"**（**⚠ 故**读古书时**（**\"**痈**\"**译成**\"**急性化脓**\"**（**\"**疽**\"**译成**\"**深部坏死**\"**（**是**一条**可靠的对应** ✓）。","o":"RJ-2993 · 人纪·金匮要略·疮痈肠痈浸淫病脉证并治第十八（PDF 第584页）"},{"t":"四、\"让脓浮到表面上\"","h":"一个极有画面感的治疗目标，与讲义的自用方","c":"方法——**讲义把\"排痈\"的目标讲成了一个动作（**把脓\"**托**\"到表面**），并给了自己常用的方，须照录**：\"**'**仙方活命饮的目的，就是让它浮到表面上**'。'**但是不需要用到这么多药**——**临床上我用得最多的就是小柴胡汤**'。'**开小柴胡汤的技巧：柴胡重用到五钱，黄芩用到六钱，半夏两钱就可以**'。'**半夏少一点，是不要把水利掉太多；黄芩去消炎；党参跟柴胡等量使用五钱**'。'**这个处方最重要的是后面要加桂枝与白芍**'。'**桂枝能够行阳**——**利用小柴胡汤的方剂配合桂枝，就可以让脓从半表半里、肌肉中间浮到皮肤表面上**'。'**桂枝白芍等量，它就能够浮到表面上**'。'**吃这个下去以后，差不多一剂、两剂，痈脓就浮到皮肤表面上了**'。**\" **须说明（四层）**：**①\"**让脓浮到表面**\"这个目标**极有画面感** ✓（**⚠ 它**说的是**\"**把深部的脓肿'**托**'**到**可以处理的地方**\"**（**⚠ 而\"**浮**\"**这个字**（**把**\"**深 → 浅**\"**讲成了**\"**一个方向**\"**）；**②⚠ 而\"**小柴胡 + 桂枝白芍**\"这个加法**有一个**\"**半表半里**\"**的框架**（**⚠ \"**柴胡**\"**走**半表半里**（**\"**桂枝白芍**\"**调和营卫、**往外**（**⚠ 故\"**深部的脓**\"**要**\"**往外托**\"**（**⚠ 而**这一层**在**中医外科**里**叫**\"**托毒**\"**）；**③⚠ 而\"**半夏少一点，不要把水利掉太多**\"这一层**极精** ✓（**⚠ 它**说明**\"**排脓需要津液**\"**（**⚠ 而\"**利水太过**\"**会**让
