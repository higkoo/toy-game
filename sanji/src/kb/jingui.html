<script>const D=[{"t":"《金匮要略》全书结构","h":"二十二篇的编排与\"方后专论\"体例","c":"要点——《人纪·金匮要略》依原书**二十二篇**顺序讲解，自\"藏府经络先后病\"至\"妇人杂病\"。其编排上有一个极具个人特色的体例：**每讲完一组方剂，即插入一段以现代病名为题的\"专论\"**，把经典方与当代重大疾病直接对接。据目录可见的专论包括：**\"糖尿病专论\"**（第十三篇消渴小便不利淋病，PDF 第410页）、**\"肝癌、肝硬化、肝阴实\"**（第十四篇水气病，第474页）、**\"肾衰竭与尿毒症处方（专论）\"**（第十七篇呕吐哕下利病，第548页）、**\"胰脏癌（专论）\"**（同篇，第557页）、**\"肺癌论述\"**（同篇，第580页）、**\"胃癌主力方\"**（第十六篇惊悸吐衄下血胸满瘀血病，第530页）、**\"大肠癌有什么特征呢？\"**（第十八篇疮痈肠痈，第593页）。这一体例的价值在于：它把《金匮》的\"辨证论治\"落到了**具体病种**上，读者不必自己揣摩\"这条方治什么病\"，而是直接看到倪海厦的判断。但也须注意——**这些专论是他的临床心得，不是《金匮》原文**，阅读时应与经文分开看待。","o":"RJ-2849 · 目录（PDF 第6~9页）"},{"t":"《金匮要略》全书结构","h":"穿插其间的文式易筋经十二式","c":"要点——一个容易被忽略的细节：**《金匮要略》讲稿中夹入了\"文式易筋经\"的十二式**，按篇次推进，第**七**式在第355页（痰饮篇十枣汤后）、第**八**式在第401页（消渴篇文蛤散后）、第**九、十**式在第440页（水气篇越婢汤后）、第**十一**式在第476页（肝癌专论后）、第**十二**式在第519页（瘀血篇）。这一安排不是随意点缀，而是**\"讲方—练功\"交替**的授课节奏：倪海厦在讲完一段峻猛方剂（十枣汤、越婢汤等）后，转入形体锻炼的讲解，使学员在长时间听讲中得以调整身形。由此也可推知，**文式易筋经共十二式**，散见于《金匮》与《针灸》两部讲稿中，而非独立成篇——现存单独的《文式易筋经-倪解》docx 仅五千余字，是后人的辑录。","o":"RJ-2850 · 目录·各篇（PDF 第6~8页）"},{"t":"二、消渴篇","h":"消渴篇的方剂谱系与糖尿病的经方对应","c":"方法——第十三篇\"**消渴小便不利淋病脉证并治**\"（PDF 第389页起）是糖尿病相关条文的正宗主脉，其收录方剂构成一个完整的谱系：**肾气丸方**（注\"见妇人杂病\"）、**五苓散方**（注\"见痰饮\"）、**文蛤散方**、**栝蒌瞿麦丸方**、**蒲灰散方**、**茯苓戎盐汤方**、**白虎加人参汤方**（注\"见暍病\"）、**猪苓汤方**，以及居中的**\"糖尿病专论\"**（第410页）。这个谱系可按病机分为三组：**①肾气丸**——针对下焦肾阳虚、气化不利（消渴日久及肾）；**②白虎加人参汤**——针对上中焦热盛、气津两伤（即《伤寒论》第一八三条\"大渴而烦、欲饮水数升\"之证）；**③五苓散、猪苓汤、栝蒌瞿麦丸、蒲灰散、茯苓戎盐汤、文蛤散**——针对\"小便不利\"这一组症状，分别对应气化不利、水热互结、上燥下寒、湿热瘀阻等不同机转。这一分组的实用意义在于：**同为消渴，取方取决于\"渴与小便\"的关系**——渴而小便多者多属肾气不固（肾气丸），渴而小便不利者多属气化或水热（五苓散、猪苓汤），大渴而烦者属热盛（白虎加人参汤）。这也是倪海厦在糖尿病专题中反复强调\"顾肾\"的经典依据。","o":"RJ-2851 · 第十三篇 消渴小便不利淋病脉证并治（PDF 第389~416页）"},{"t":"二、消渴篇","h":"\"糖尿病专论\"的位置","c":"要点——\"**糖尿病专论**\"被安排在消渴篇中段（PDF 第410页），介于白虎加人参汤与猪苓汤之间。这一位置本身传达了一个判断：倪海厦不把糖尿病视为独立病种，而是**在\"消渴\"这一经典证候群中给糖尿病定位**——即在诸多\"渴\"与\"小便不利\"的证型里，糖尿病属其中之一，须按证分型而非按病名统一处方。对照他在专题篇中的表述（\"第二型糖尿病可以治好，第一型无法确定\"），可见其临床路径是：**先辨消渴之证型（肾气丸证／白虎加人参汤证／五苓散证……），再论该患者是否落在可治范围**。这与现代医学\"按病因分 1 型、2 型\"的路径完全不同——前者以\"证\"为单位，后者以\"病\"为单位。读者若不了解这一层，容易把\"糖尿病专论\"误读为\"一张统治糖尿病的方\"。","o":"RJ-2852 · 第十三篇 消渴小便不利淋病脉证并治·糖尿病专论（PDF 第410页）"},{"t":"三、重病专论","h":"肝病三阶：从水气到肝阴实","c":"要点——第十四篇**水气病**（第417页起）讲至半途，插入\"**肝癌、肝硬化、肝阴实**\"专论（第474页）。这一安排说明倪海厦把肝病的终末阶段（肝硬化、肝癌）**归入\"水气\"范畴**来理解——即腹水、水肿是肝病由气分转入血分、由功能转为实质（\"阴实\"）之后的主要表现。其方剂脉络在此篇中亦可见：**越婢汤**、**防己黄芪汤**（注\"见湿病\"）、**防己茯苓汤**、**越婢加术汤**、**甘草麻黄汤**、**麻黄附子汤**、**蒲灰散**、**黄芪芍药桂枝苦酒汤**（注\"虚证用\"）、**桂枝加黄芪汤**（注\"实症用\"）、**桂甘姜枣麻辛附子汤**、**枳术汤**——几乎全为\"治水\"之方（发汗、利小便、温阳化气三类）。由此可归纳其思路：**治肝病之腹水，不在肝而在水，水去则肝得缓**。另\"肝阴实\"一词是他的用语，指肝实质内形成有形的占位（对应影像可见的肿块），与\"肝阳虚\"相对，属其自创的辨证层级。","o":"RJ-2853 · 第十四篇 水气病脉证并治·肝癌、肝硬化、肝阴实（PDF 第417~476页）"},{"t":"三、重病专论","h":"肾衰竭与尿毒症的处方专论","c":"要点——第十七篇**呕吐哕下利病**（第535页起）中，在**四逆汤方之后**紧接\"**肾衰竭与尿毒症处方（专论）**\"（第548页），随后才是小柴胡汤、大半夏汤等。这一位置极有讲究：**四逆汤是回阳救逆之方**，而肾衰竭末期多见少阴亡阳、浊阴上逆（呕吐），故以四逆汤为前导，再转入专论。同篇还有两处与重病相关的安排：**\"胰脏癌（专论）\"**（第557页，位于半夏干姜散之后）、**\"肺癌论述\"**（第580页，位于紫参汤之后），以及一条极短的急诊方——**\"定喘急诊（麻黄2，甘草1）\"**（第581页），这是全篇少见的**明确给出比例**的处方（麻黄二、甘草一），用于喘急之救急。这些专论的共同特征是：**先立一个经典方证的框架，再填入现代病名**；读者若只看病名而不看前面的方证铺垫，会失去辨证依据。","o":"RJ-2854 · 第十七篇 呕吐哕下利病脉证治（PDF 第535~581页）"},{"t":"四、治法与方群","h":"黄疸的方剂层次：茵陈蒿汤为阳黄第一方","c":"方法——第十五篇**黄疸病**（第477页起）所收方剂呈现清晰层次：**茵陈蒿汤**被直接标注为\"**专治阳黄疸第一方**\"（第492页）；其后为**硝石矾石散**（注\"这里是火硝，**必须是西医没有动过病人**\"——即要求未经西医干预者方可用）、**栀子大黄汤**（注\"**无黄症**\"）、**桂枝加黄芪汤**（注\"见水气\"）、**猪膏发煎**、**茵陈五苓散**、**大黄硝石汤**、**小半夏汤**（注\"见痰饮\"）、**柴胡汤**（注\"即小柴胡汤见呕吐，按本方加减法，腹痛去黄芩加芍药\"）、**小建中汤**。据此可分出三层：**阳黄**——茵陈蒿汤（清热利湿攻下）、栀子大黄汤、大黄硝石汤；**阴黄／虚黄**——小建中汤（建中以退黄）、桂枝加黄芪汤；**兼证处理**——茵陈五苓散（黄而小便不利）、柴胡汤（黄而少阳证）。其中\"**必须是西医没有动过病人**\"这条限定语尤其值得注意，它反映倪海厦对经方在\"未经干预\"状态下才可信的一贯立场。","o":"RJ-2855 · 第十五篇 黄瘅（疸）病并治（PDF 第477~505页）"},{"t":"四、治法与方群","h":"排脓六方的分工","c":"方法——第十八篇**疮痈肠痈浸淫病**（第582页起）集中了倪海厦补充的排脓方群，他在方名后逐一标注用途，形成六方分工：**①仙方活命饮**（标\"补充\"\"排脓汤方 2\"）；**②阳和汤**（标\"补充经方家用的很多的排脓处方\"\"排脓汤方 1\"）；**③大黄牡丹汤**（治肠痈）；**④薏苡附子败酱散**（标\"排脓方 3\"）；**⑤排脓散**（标\"排脓汤 4，**胃化脓用**\"）；**⑥排脓汤**（标\"排脓汤 5，用于**肺化脓、喉癌、舌癌的基础方**\"）。此外另有两个倪师自拟方：**\"肝脓疡汤方（倪师补充）——排脓汤 6，用于肝化脓：皮肤冷、手烫\"**，以及**\"胰脏炎方＝排脓散方＋苓桂甘枣汤（倪师补充）\"**。这一组的价值在于**按病位分工**：胃（排脓散）、肺／喉／舌（排脓汤）、肠（大黄牡丹汤、薏苡附子败酱散）、肝（肝脓疡汤）、胰（胰脏炎方），构成一张\"化脓性疾病的部位—方剂\"对照表。其中\"**皮肤冷、手烫**\"四字是极精炼的辨证眼目——**外冷内热**，正是脓已成而热郁于里的征象。","o":"RJ-2856 · 第十八篇 疮痈肠痈浸淫病脉证并治（PDF 第582~595页）"},{"t":"五、妇人三篇","h":"妊娠、产后、杂病的方剂分工","c":"方法——妇人病占三篇，方剂可按阶段划分。**第二十篇妊娠病**（第608页）：**桂枝茯苓丸**（妊娠宿有癥病）、**附子汤**（注\"见伤寒论\"）、**胶艾汤**、**当归芍药散**、**干姜人参半夏丸**（妊娠呕吐）、**当归贝母苦参丸**、**葵子茯苓散**、**当归散**、**白朮散**，另有\"**《补充》难产方**\"（注\"或死胎用，这里用重剂，**以两计**\"）。**第二十一篇产后病**（第629页）：**枳实芍药散**、**下瘀血汤**、**阳旦汤**、**竹叶汤**、**竹皮大丸**、**白头翁加甘草阿胶汤**。**第二十二篇杂病**（第640页）：**半夏厚朴汤**（咽中如有炙肉）、**甘麦大枣汤**（脏躁）、**温经汤**（注\"**助孕，治不孕症**\"）、**土瓜根散**、**胶艾汤**、**大黄甘遂汤**、**抵当汤**、**矾石丸**、**红蓝花酒**，另有\"**妇人带下（补充）**\"。三篇的方剂重心各不相同：妊娠重在**安胎与去癥并行**（桂枝茯苓丸治\"宿有癥病\"而妊娠者，正是\"有故无殒\"之法）；产后重在**去瘀与补虚并行**（下瘀血汤攻瘀、竹叶汤扶正）；杂病重在**情志与调经**（甘麦大枣汤治脏躁、半夏厚朴汤治梅核气、温经汤调经助孕）。","o":"RJ-2857 · 第二十~二十二篇（PDF 第608~662页）"},{"t":"六、诊断","h":"瘀血判断法","c":"方法——第十六篇**惊悸吐衄下血胸满瘀血病**（第506页起）中，于脉诊论述之后单列\"**瘀血判断法**\"（第518页），其后才是救逆汤、半夏麻黄丸、柏叶汤、黄土汤等方。这一编排说明：**在给出治瘀诸方之前，倪海厦先立\"如何判断有瘀\"的标准**——顺序上先诊后治。同篇所收方剂亦可分为两组：**治血上出**（柏叶汤治吐血、黄土汤\"亦主吐衄\"、泻心汤、赤豆当归散\"见狐惑中\"）、**治惊悸**（桂枝去芍药加蜀漆牡蛎龙骨救逆汤、半夏麻黄丸）。其中黄土汤与柏叶汤同主吐衄而寒热虚实不同——柏叶汤偏于虚寒（吐血不止、血色淡），黄土汤偏于虚寒而兼脾虚（先便后血、远血），两者常被并列比较。另目录在此篇后附\"**诸泻心汤小结**\"（第531页），是对前述五泻心汤的横向归纳，属少见的\"回顾式\"编排。","o":"RJ-2858 · 第十六篇 惊悸吐衄下血胸满瘀血病脉证治（PDF 第506~534页）"},{"t":"一、\"见肝之病，知肝传脾，当先实脾\"","h":"\"上工治未病\"在金匮里的第一次落地","c":"定义——**《金匮要略》开篇第一问就是\"上工治未病\"，而张仲景给的不是原则，是**一条具体的推演链**，须照录**：\"**'问曰：**上工治未病，何也**？'。'师曰：**夫治未病者，见肝之病，知肝传脾，当先实脾**——**四季脾王不受邪，即勿补之**'。'**中工不晓相传，见肝之病，不解实脾，惟治肝也**'。'夫肝之病，**补用酸，助用焦苦，益用甘味之药调之**——**酸入肝，焦苦入心，甘入脾**'。'**脾能伤肾，肾气微弱，则水不行；水不行，则心火气盛，则伤肺；肺被伤，则金气不行；金气不行，则肝气盛**——故**实脾，则肝自愈**。**此治肝补脾之要妙也**'。'**肝虚则用此法，实则不在用之**'。'经曰：**虚虚实实，补不足，损有余**，是其义也。**余藏准此**'。**\" **须说明（四层）**：**①\"**见肝之病，知肝传脾**\"这八个字，是**中医\"治未病\"最著名的一条落地**（**它把\"未病\"具体化为\"下一个将要病的脏\"**）——**⚠ 而它背后的模型是**五行相克**（**肝木克脾土**）；**②⚠ 而\"**四季脾王不受邪，即勿补之**\"这一句**极重要**（**它给\"先实脾\"设了一个**例外**：**脾当令时不必补**）——**⚠ 故\"先实脾\"**不是无条件的**（**⚠ 而这一句**最容易被忽略**，**导致\"见肝病就补脾\"的机械做法**）；**③⚠ 而\"**补用酸、助用焦苦、益用甘味**\"这三个字，**讲义给了三个对应的方**：**补（酸）→乌梅丸；助（焦苦）→吴茱萸汤；益（甘）→小建中汤**——**⚠ 而讲义同时提醒**\"**小建中汤为治肝补脾不二法门，这不是法则，误用之则大误病情矣**\"**（**⚠ 即：**小建中汤只是\"用它的甘味调脾胃\"，**不是\"用它治肝病\"**）——**⚠ 这一句**极重要**（**它防的是\"把一个方当成万能的\"**）；**④⚠ 而\"**实脾则肝自愈**\"这条推演链**极长**（**脾伤肾→肾水不行→心火盛→伤肺→肺金不行→肝气盛→肝自愈**）——**⚠ 这是**五行生克绕一圈**（**讲义自己说\"这是他的阴阳五行，绕一圈而已\"**）——**⚠ 故这一段**可以当\"模型\"读**，**不能当\"机制\"读**（**因为**它绕了五步，**而每一步都不可观测**）。** **⚠ 附\"**余藏准此**\"这四个字**极重要**（**它说：**治心、治肺、治肾，**照这个模式推**）——**⚠ 而本集建议**：**\"先安未受邪之地\"这个思路，**确有价值**（**如：**肝病查脾、心病查肾**）；**⚠ 而把它绑在\"五行绕一圈\"的链条上，**则是**过度推演**。","o":"RJ-2859 · 人纪·金匮要略·脏腑经络先后病脉证第一（PDF 第28~34页）"},{"t":"二、\"千般疢难，不越三条\"","h":"\"三因\"学说的源头，一句话把万病归了三类","c":"定义——**第一篇里有一段把\"人为什么会病\"归成三类，而它是后世\"三因学说\"的源头，须完整照录**：\"**'夫人禀五常，因风气而生长——**风气虽能生万物，亦能害万物**，如水能浮舟，亦能覆舟**'。'若**五藏元真通畅，人即安和**；**客气邪风，中人多死**'。'**千般疢（chèn）难，不越三条**：**一者，经络受邪，入藏府，为内所因也；二者，四肢九窍，血脉相传，壅塞不通，为外皮肤所中也；三者，房室、金刃、虫兽所伤**'。'**以此详之，病由都尽**'。**\" **须说明（四层）**：**①这三条，**是中医病因学的骨架****：**内因（经络受邪入脏腑）、外因（四肢九窍壅塞）、不内外因（房室、金刃、虫兽）**——**⚠ 而\"三因\"这个说法，**到南宋陈无择《三因极一病证方论》才正式定名**（**而源头就在这里**）；**②⚠ 而讲义把这三条**翻成了白话**：**\"虫蛇刀伤（外科）＋内因（喜怒忧思悲恐的情志）＋外感（风寒暑湿燥热）\"**——**⚠ 这个翻法**与原文字面不完全一致**（**原文\"内所因\"是\"经络受邪入脏腑\"，**而讲义读成\"情志\"**）——**⚠ 但**两种读法都对**（**因为**情志确实能伤脏腑**）；**③⚠ 而\"**风气虽能生万物，亦能害万物**\"这一句**极精**（**\"如水能浮舟，亦能覆舟\"**）——**⚠ 它把\"风\"说成了**中性的力量**（**不是\"邪\"，**是\"同一个东西的两面\"**）——**⚠ 这一层**极重要**（**它比\"风邪致病\"要准确**：**风本身不坏，**坏在\"人受不住\"**）；**④⚠ 而\"**五藏元真通畅，人即安和**\"这一句，**是**全书最正面的一句健康定义****（**\"元真通畅\"＝气血通行无阻**）——**⚠ 故按这句话，**\"健康\"不是一个指标，**是一个\"通\"的状态**（**⚠ 而\"通\"这件事，**确实有可观察的对应**：**大便通、小便通、月经通、汗出得出来**）。** **⚠ 附一段**极具体的\"防病\"清单**（**见第八条**）：**\"四肢才觉重滞，即导引、吐纳、针灸、膏摩\"**——**⚠ 这是**在\"病还没入脏腑\"时**该做的事**（**⚠ 而它**全是\"物理手段\"**，**不是吃药**）。","o":"RJ-2860 · 人纪·金匮要略·脏腑经络先后病脉证第一（PDF 第35页）"},{"t":"三、六个\"补虚\"的缺点","h":"一份极完整的\"误补致变\"清单","c":"风险——**讲义在这一段列了**六种\"把病当阴虚去补\"的后果**，而这是一份**完整的、可对照的\"误治清单\"**，须完整照录**：\"**'**那我就来给诸位归纳六个补虚的缺点**——就是临床上我们可以看到的'。'**第一个**：如果你是**疟证**，病人**下痢不止**，你把它当成阴虚去补他——**造成痞**（**痞证，心下痞**）。**我们的泻心汤就是这样来的**'。'**第二个**：病人没有往来寒热，就是下痢（**包括痢血、大便排血**），你把它当阴虚来治——**造成臌胀**（**腹部就变大**）'。'**第三个**：病人是**咳嗽**，你把他当阴虚来治——**成为痿**（**肺痿，肺会萎缩掉**）。这我看的非常多'。'**第四个**：病人是**痰饮**（胸腔里面有痰、肋骨之间有痰、里面有积水），你当阴虚治——**病人会出现肿**（**浮肿、脸肿起来**）'。'**第五个**：病人**吐血、泄精（梦遗）**，你当阴虚治——**造成劳证**'。'**第六个**：**湿阻在中焦**（或用**承气汤**清掉就可以），一看又是阴虚，去补阴——**就会成格**（**阴阳会相格**）'。'**所以有六大弊端**'。**\" **须说明（四层）**：**①这六条的共同结构**是：**\"某证（六种之一）＋ 误判为阴虚 ＋ 用补阴药 ＝ 某变证（痞/臌胀/痿/肿/劳/格）\"**——**⚠ 故它是一张**\"证—误—变\"的三列表**（**⚠ 而这张表**极有临床价值**：**它提醒\"补\"之前先辨虚实**）；**②⚠ 而这一层的**正确解读**是**：**\"**阴虚**\"是一个需要证据的判断**（**舌红少苔、脉细数、五心烦热、盗汗**）——**⚠ 而\"**咳嗽就滋阴、下痢就补阴**\"**是把\"症状\"当成了\"证\"**（**⚠ 这是**这份清单真正在批评的事**）；**③⚠ 而\"**肺结核（TB）……美国人用的很多，就是我讲过维他命，吃到后来肺都萎缩掉了**\"这一句**须单独标**（**它把\"肺痿\"归因于\"补阴＋维他命\"**）——**⚠ 而肺结核的标准治疗是**抗结核药**（**⚠ 故这一句**须明确否定**：**肺结核必须规范抗结核治疗**，**不能以\"滋阴\"替代**）；**④⚠ 而讲义自己的**结论**是**\"**我们经方家知道他是阴虚，我们不会开补阴的药给他，我们会开**阳的药，让他阴自回**\"**——**⚠ 这一层**极重要**（**它是\"正治\"与\"反治\"之别**：**虚证不一定用补药**，**可以用\"恢复功能\"的办法**）——**⚠ 而\"**阴自回**\"这个思路，**确有道理**（**如：**脾胃好了，**气血自然生**）。** **⚠ 本集按语**：**这六条是全册**最实用的一处**（**它给的是\"什么时候不该补\"**）——**⚠ 而\"**不该补**\"比\"该补什么\"**更难判断**（**⚠ 故这份清单**值得当\"问诊时的六个反问\"用**：**我在补的这个人，**他真的是虚吗？**","o":"RJ-2861 · 人纪·金匮要略·脏腑经络先后病脉证第一（PDF 第33~34页）"},{"t":"四、\"活的树不能涂油漆\"","h":"全册最好的一个比喻，与它要攻击的东西","c":"要点——**讲义在这一段用一个**极准的比喻**说明\"为什么不该乱补\"，须照录**：\"**'**肝脏呢，好像一棵**活的树**——你如果是**一块木板**，把它砍成一块木板，它死了，你涂上油漆，可以保存很久**'。'**你把它那个**活的树**涂个油漆看看？**太过**'。'**这就是维他命会致命**——你不要去看他光吵，光去看**自然界的象**就知道了'。'你这本来是**虚证，不会死人**；你想办法把它变成**实证**。'。'**所以维他命是给敌人吃的，自己不要吃**'。**\" **须说明（四层）**：**①这个比喻**极精**（**它一句话说清了\"补\"的边界**：**死的木板可以涂漆（防腐）；活的树涂漆就闷死了**）——**⚠ 而它对应的意思是：**活的组织需要\"通\"，**不需要\"封\"**（**⚠ 而\"补\"若把通道封住，**就成了\"实\"**）；**②⚠ 而这一层**与前面第三条的\"六个补虚缺点\"**是**同一件事的两种说法**（**补阴→成实→成痞/臌/痿/肿**）——**⚠ 故\"涂油漆\"这个比喻，**是那张清单的形象版**；**③⚠ 而\"**维他命是给敌人吃的**\"这句话**极重**（**⚠ 而它的**正确部分**是：**脂溶性维生素（A、D、E、K）过量确有毒性**（**维生素 A 过量致肝损、维 E 过量增加出血**）——**⚠ 而它的**错误部分**是：**\"所有维生素都有害\"**（**叶酸孕前防神经管缺陷、维生素 D 防佝偻、B12 治恶性贫血**）——**⚠ 故这一句**须一分为二**；**④⚠ 而本集对这个比喻的评价是**：**作为**\"不要盲目进补\"的警句**，它极好**；**作为**\"维生素有害\"的医学结论**，它不成立**。** **⚠ 附一句**极准的自省**：\"**你不要去看他光吵，光去看自然界的象就知道了**\"**——**⚠ 这一句**其实承认了\"以象喻理\"的方法**（**⚠ 而\"以象喻理\"在**说理**上有力，在**判断**上危险**（**⚠ 因为**比喻只说明\"像什么\"，**不说明\"是什么\"**）。","o":"RJ-2862 · 人纪·金匮要略·脏腑经络先后病脉证第一（PDF 第32页）"},{"t":"五、\"虚证不会死，实证才会死\"","h":"一句极有洞见、也极须限定的判断","c":"风险——**讲义在这里提出了一句极重的判断，而它既有洞见、又是全册最危险的一句之一，须照录并加限定**：\"**'病人呢，会死的时候哦，病人呢，都是**实**——很少，几乎不会有人呢，因为**虚**而死，都是因为**实证**而死**'。'这个**实**呢，不管是**阴实**或怎么样子，**实证会死人，虚证不会死人**'。'所以你看那个人呢，**很瘦弱，那个风一吹就倒了，可是很长寿**啊——**他不会死，为什么？虚证**'。'**你不能有实证**。这个我们一遇到实证赶快把他**变成虚证**，就很好**'。**\" **须说明（四层）**：**①这一句的**洞见**在于**：**虚证（功能低下）本身可以长期共存**（**而\"实\"（有物堵住、有邪留着）**会持续消耗**）——**⚠ 故\"**通**\"比\"补\"更要紧**（**这与前面\"元真通畅，人即安和\"一致 ✓**）；**②⚠ 而这一句的**危险**在于**：**\"虚证不会死人\"会被读成\"没劲、瘦、贫血不要紧\"**——**⚠ 而事实上**：**重度贫血、心衰、晚期肿瘤的恶病质、重度营养不良**，**都是\"虚\"的样子，**而都能致死**——**⚠ 故这一句**须明确否定**（**\"虚\"可以是**致命疾病的早期表现****）；**③⚠ 而\"**一遇到实证赶快把他变成虚证**\"这一层**也须限定**（**\"实证\"一旦被\"泻\"过头，**就成了\"虚\"**，**而\"虚\"到极点同样危险**）——**⚠ 故中医学的标准说法是**\"**虚实夹杂者，攻补兼施**\"**（**而不是\"一味泻实\"**）；**④⚠ 而\"**风一吹就倒可是很长寿**\"这一句**是**个案观察**（**它不能推出\"瘦弱＝长寿\"**）——**⚠ 而它**会误导**：**一个瘦弱的老人若因此不去查\"为什么瘦\"**（**肿瘤、结核、甲亢、糖尿病**），**就错过了早期诊断**。** **⚠ 本集按语（须强调）**：**\"**实证会死、虚证不会死**\"这句话，**最好改成**：\"**急性的、有物阻塞的、持续消耗的状态，**要尽快处理；**而\"虚\"本身，**必须查明原因**——**⚠ 因为**\"虚\"不是一个诊断**，**是一个结果**。","o":"RJ-2863 · 人纪·金匮要略·脏腑经络先后病脉证第一（PDF 第32页）"},{"t":"六、\"我不贪，你的病就已经去掉百分之八十\"","h":"一句极精的情志观，与它举的两个例子","c":"要点——**讲义在讲\"三因\"时，插了一段关于**情志与病**的话，而它是全册**最直白的一段\"心理病因学\"**，须照录**：\"**'为什么我常常跟大家讲「**要有平常心**」？比方说，妈妈坐在那边**烦恼儿子闹同恋**（同性恋），**如果你烦恼后的第二天他就不闹了，这个烦恼我们就可以做**——**问题是你没有办法解决**！'。'所有人都在那边哀声叹气的怨叹，**实际上于事无补**——**而且不但是于事无补，反而造成自己身体障碍更多**，然后让更多人都担心，**这是恶循环**'。'基本上一个人如果能够有个观念「**我不贪**」，**你的病就已经去掉百分之八十**'。'譬如说做婆婆的你，**媳妇才一进门你就贪了**——什么叫贪？**你希望媳妇帮你煮饭洗衣服烧菜**。结果媳妇没做，你就很难过很生气，你就开始**忧、悲、思、怒**——**这就是很多病的源**'。'很多病源就是我常讲的「**这是婆婆病，这是媳妇病**」，其实都是因为**生气**才出的'。**\" **须说明（四层）**：**①\"**如果你烦恼后的第二天他就不闹了，这个烦恼我们就可以做**\"这一句**极精**（**它给\"该不该烦恼\"立了一个标准**：**烦恼有没有用**）——**⚠ 而这一句**其实是**全段最有价值的一层**（**它把\"情绪\"变成了一个**可以问的问题****：**这件事我能改变吗？**）；**②⚠ 而\"**我不贪，病就去掉百分之八十**\"这一句**极重**（**⚠ 而\"贪\"在这里的定义**极准**：**\"你希望媳妇帮你煮饭洗衣服烧菜\"**——**⚠ 即：**\"贪\"不是\"要钱\"，**是\"要求别人按你的期待做\"**）；**③⚠ 而\"**婆婆病、媳妇病**\"这两个词**极生动**（**它把\"家庭关系里的病\"**命名了**）——**⚠ 而这一层**确有对应**：**长期的家庭紧张**与**高血压、失眠、胃病、抑郁**的关联**是有证据的**（**⚠ 而\"去掉百分之八十\"这个数**没有依据**，**须标为修辞**）；**④⚠ 而**这一段须标一处**：**\"烦恼儿子闹同恋（同性恋）\"**——**⚠ 这一句**把\"同性恋\"当成了\"要解决的问题\"**（**⚠ 须明确否定**：**性取向不是病、不需要\"纠正\"**；**⚠ 而\"母亲为此烦恼\"这件事**是真的**（**但那个\"烦恼\"的来源**是**社会压力与误解**，**不是孩子本身**）。** **⚠ 本集按语**：**这一段最值得留的，**是那个**\"烦恼有没有用\"的判据**（**⚠ 而它一旦成立，**\"我不贪\"这三个字，**就从\"道德要求\"变成了\"省力的办法\"**）。","o":"RJ-2864 · 人纪·金匮要略·脏腑经络先后病脉证第一（PDF 第35页）"},{"t":"七、\"养慎\"六法","h":"一份\"病还没入脏腑时\"该做的事","c":"方法——**第一篇给了**一段极具体的\"防病操作\"**，而它是**全册少见的\"预防清单\"**，须完整照录**：\"**'**若人能养慎**：**不令邪风干杵经络**；**适中经络，未流传藏府，即医治之**'。'**四肢才觉重滞，即导引、吐纳、针灸、膏摩**——**勿令九窍闭塞**'。'更能**无犯王法、禽兽灾伤**；**房室勿令竭乏**；**服食节其冷、热、苦、酸、辛、甘**'。'**不遗形体有衰，病则无由入其腠理**'。'**腠者，是三焦通会元真之处，为血气所注；理者，是皮肤藏府之文理也**'。**\" **须说明（四层）**：**①这一段给了**六条\"养慎\"**：**避邪风、早治（未入脏腑即治）、四肢重滞即导引吐纳针灸膏摩、不犯王法、不犯禽兽灾伤、房室不竭、饮食节五味**——**⚠ 而**前三条是\"医学的\"**，**后四条是\"生活的\"**（**⚠ 而\"无犯王法\"这一条**极有意思**：**它把\"坐牢\"算成了一种\"病因\"**）；**②⚠ 而\"**四肢才觉重滞，即导引、吐纳、针灸、膏摩**\"这一句**极重要**（**它说的是**\"刚觉得手脚沉，就动起来\"**）——**⚠ 而这一层**极其现代**：**\"重滞\"＝循环变慢**，**而\"导引\"＝活动**（**⚠ 故\"久坐后起来走\"**，**在这句话里是**被写进经典的**）；**③⚠ 而\"**勿令九窍闭塞**\"这五个字**是**全段的关键**（**\"九窍\"＝两眼、两耳、两鼻孔、口、前阴、后阴**）——**⚠ 故\"养慎\"的目标**不是\"进补\"，**是\"保持通畅\"**（**⚠ 这与前面\"元真通畅，人即安和\"一致 ✓**）；**④⚠ 而\"**腠者，是三焦通会元真之处；理者，是皮肤藏府之文理**\"这一句**是**\"腠理\"的定义**（**⚠ 而它是**全书最基础的一个解剖概念**（**\"病从腠理入\"**）——**⚠ 而\"腠理\"这个词，**在现代解剖学里没有对应**（**⚠ 故它**是一套\"功能模型\"的词**，**不是\"结构\"的词**）。** **⚠ 本集按语**：**这六条里，**真正能立刻做的只有三条**：**别久坐（四肢重滞就动）、别过食（节五味）、别纵欲（房室勿令竭乏）**——**⚠ 而这三条**不需要任何理论**（**它们本身就是\"常识的医学化\"**）。","o":"RJ-2865 · 人纪·金匮要略·脏腑经络先后病脉证第一（PDF 第35页）"},{"t":"八、\"非寒不泄\"","h":"一条\"泻实\"的用药原则，与\"阴自回\"的治法观","c":"方法——**讲义在这一段给了两条**用药原则**，而它们合起来是\"虚实两治\"的总纲，须照录**：\"**'**实证出现的时候，我们要把实要渲泄掉**——所以**非寒不泄**，**一定要用寒凉的药才能够把实泄掉**'。'所以我们在处方的时候，常常会看到**像厥阴篇后面，我们用附子、黄芩、黄连、干姜**——老师，这个**黄芩黄连跟附子干姜还用在一起**，张仲景还用在这个处方里，为什么？**就是非寒不泄**'。'**我们知道他是阴虚，我们不会开补阴的药给他——我们会开用阳的药，让他阴自回最好**'。'所以**阴呢，是让他自己回头**，是最好的方式'。**\" **须说明（四层）**：**①\"**非寒不泄**\"这四个字，**是张仲景\"泻实\"的用药特征**（**大黄、黄连、黄芩、芒硝**）——**⚠ 而\"**寒热并用**\"（**附子＋黄芩黄连**）**正是经方最典型的配伍**（**如：**乌梅丸、**半夏泻心汤类**）——**⚠ 故这一层**可核**（**方剂里确实寒热同用**）；**②⚠ 而\"**让他阴自回**\"这一层**极重要**（**它是\"治本\"的思路**：**不直接补阴，**而是\"恢复身体自己生阴的能力\"**）——**⚠ 而这与\"**补**\"是两种思路**：**补＝给东西；**自回＝修功能**（**⚠ 而后者**确实更根本**）；**③⚠ 而\"**非寒不泄**\"这一层**须限定**（**\"实\"有寒实、热实之分****：**寒实（如寒积便秘）**要用**温下（大黄附子汤）**，**不是\"非寒不泄\"**）——**⚠ 故这一句**只对\"热实\"成立**；**④⚠ 而本集对此的总评**：**这两条是**\"经方用药\"的两个方向**（**泻实用寒、补虚用\"回\"**）——**⚠ 而它们**都没有\"剂量\"**（**⚠ 而\"剂量\"恰恰是经方最要紧的一层**（**见本集第 n08 条\"克数不能直接照抓\"**）。** **⚠ 附一句**极重的提醒**（**讲义在另一处说**）：**\"**处方的时候，我们常常会看到……黄芩黄连跟附子干姜还用在一起**\"**——**⚠ 这种配伍**在外行看来是\"矛盾的\"**（**寒药＋热药**）——**⚠ 而它**恰恰是\"辨虚实、分寒热、各走各路\"的体现**（**⚠ 故\"寒热并用\"**不能当\"乱用\"**，**它要求**先辨清\"哪一部分寒、哪一部分热\"**）。","o":"RJ-2866 · 人纪·金匮要略·脏腑经络先后病脉证第一（PDF 第34页）"},{"t":"一、刚痉与柔痉：以\"有汗无汗\"分","h":"痉病的两型、两个方，与它对应的证","c":"定义——**《金匮》第二篇把\"痉病\"分成两型，而分型的依据只有一条：**有汗、无汗**，须照录**：\"**'**太阳病，发热、无汗、反恶寒者，名曰**刚痉**'。'**太阳病，发热汗出，而不恶寒，名曰**柔痉**'。**\" **讲义的点解**：\"**'同样是痉，中医分两个。一个是刚，一个是柔——**刚，简单讲是**无汗**；**柔就是有汗**'。'张仲景开的两个方子，一个是**葛根汤**，一个是**栝蒌桂枝汤**——得到痉病的时候就这两个处方'。**\" **须说明（四层）**：**①\"**刚痉＝太阳伤寒（无汗、恶寒）＋痉**\"；**\"柔痉＝太阳中风（有汗、不恶寒）＋痉**\"**——**⚠ 故这两个名字**不是\"病重病轻\"，而是\"表实/表虚\"**（**⚠ 这一点**极重要**：**\"刚\"不是\"更强\"，**\"柔\"不是\"更轻\"**）；**②⚠ 而\"**无汗/有汗**\"这个判据**本身可观察**（**摸皮肤、问出汗**）——**⚠ 它是**全书里最\"可复核\"的一类判据之一**；**③⚠ 而两个方**也对得上**：**葛根汤（桂枝汤＋葛根＋麻黄）**用于\"**无汗、项背强几几**\"；**栝蒌桂枝汤（桂枝汤＋栝蒌根）**用于\"**有汗、身体强几几**\"**——**⚠ 而两方的差别**就在\"汗\"**（**有汗不用麻黄，**而加栝蒌根（天花粉）生津**）；**④⚠ 而\"**栝蒌桂枝汤\"这个名字里的\"栝蒌根\"，**正是\"生津\"的药**（**⚠ 而后文\"痉病的总因＝津液不足\"（见第二条）**恰好呼应**）。** **⚠ 本集按语**：**这一段最难被替代的，**是那个**\"看有没有汗\"**的判断**——**⚠ 它简单到不需要理论**（**而简单到不需要理论的判据，**往往最可靠**）。","o":"RJ-2867 · 人纪·金匮要略·痉湿暍病脉证治第二（PDF 第62~63页）"},{"t":"二、\"痉病的成因就是水不足\"","h":"一条把三种痉病统一起来的解释","c":"要点——**讲义把\"痉病\"的成因归到一个点上，而这一层**在原文里是隐含的、在讲义里被说明了**，须照录**：\"**'现在是太阳病在发热的时候，一摸到病人的脉，**不浮、沉又细**，**代表里虚寒了**——沉脉代表里症，细脉代表里寒很盛'。'身体里面的寒很盛，代表我们整个脏腑功能都变差了，中医叫做寒太盛，**这个时候容易造成痉病，难治**'。'**痉病的成因就是水不足**——**当人身上的水分不够了，就会产生筋挛，开始壮热、大热**'。'当里寒很盛的时候，我们水喝到胃里面去它**不会补充水**，因为里寒很盛，水一下去就被排掉了——**水分补充不到时就会出现问题，这就是痉病的成因**'。'**所有的痉病，不管是刚痉、柔痉，包括后面还有一个大承气汤证，通通是因为伤到津液引起的，就是津液不足了**'。**\" **须说明（四层）**：**①\"**痉＝津液不足→筋失濡养→抽搐\"**这个模型**极简、极一致**（**它用一个\"水\"解释了三种痉**）——**⚠ 而这一层**在中医里是标准说法**（**\"津液不足，筋脉失养则瘛疭\"**）；**②⚠ 而\"**脉沉细者名曰痉，为难治**\"这一条**极重要**（**它把\"脉沉细\"当成\"难治\"的标记**）——**⚠ 而\"沉细\"这个脉**确实对应\"里虚、血容量不足\"**（**如：**失水、失血、休克早期**）；**③⚠ 而\"**里寒很盛，水喝下去就被排掉了**\"这一句**须标**（**它描述的是\"喝水不吸收\"**）——**⚠ 而现代医学里\"喝水不吸收、尿多\"**最典型的是**尿崩症、糖尿病高渗、肾小管问题**（**⚠ 而这些**都是急症**，**不是\"里寒\"**）；**④⚠ 而\"**通通是因为伤到津液**\"这个统一解释**有一个代价**：**它把\"刚痉、柔痉、大承气汤证\"**三种治法完全不同的证**，**归到了同一个\"因\"**（**⚠ 而\"同因不同治\"，**在临床上**其实很常见**（**如：**失水与感染都能发热，**而治法相反**）——**⚠ 故\"统一成因\"这一层**可以当\"提示\"，**不能当\"诊断\"**）。** **⚠ 本集按语**：**\"**水不足**\"这个解释，**有一个极实用的推论**：**发热的人，**要看他\"能不能喝水、**喝了尿不尿\"**（**⚠ 而这一条**在家庭护理里**可以真做**）——**⚠ 而它**不能替代**对\"颈项强直\"的警觉**（**见第三条**）。","o":"RJ-2868 · 人纪·金匮要略·痉湿暍病脉证治第二（PDF 第63页）"},{"t":"三、\"痉＝脑膜炎\"这个对应，须一分为二","h":"一处必须澄清的概念替换，与一条最高级警告","c":"风险——**讲义在开篇就把\"痉病\"直接等同于\"脑膜炎\"，**而这个对应既有道理、又极危险**，须照录并拆解**。**原文（讲义）**：\"**'中医讲的痉病区分为**刚痉和柔痉**二种，**类似西医讲的「脑脊髓神经炎」，简言叫「脑膜炎」**'。'这个第一个呢，痉，**就是我们这个痉呢，讲的就是脑膜炎**'。**\" **须说明（四层）**：**①\"**痉**\"在《金匮》里**是一个**证候名**（**项背强急、口噤、角弓反张、抽搐**）——**⚠ 而\"**脑膜炎**\"是一个**疾病诊断**（**病原体＋脑膜炎症**）——**⚠ 故两者**不是同一个层级的东西**（**一个是\"症状组合\"，**一个是\"病因结论\"**）；**②⚠ 而**确实有重叠**（**脑膜炎的\"颈项强直\"**正是\"项背强几几\"**）——**⚠ 故\"痉病**包含**脑膜炎\"是对的**（**但\"痉病**就是**脑膜炎\"不对**）；**③⚠ 而这一条**极重要**：**\"**痉**\"还包含**破伤风（牙关紧闭、角弓反张）、**高热惊厥（小儿常见）、**低钙抽搐、**癫痫、**狂犬病、**癔症性抽搐**——**⚠ 而这些**治法完全不同**（**破伤风要抗毒素＋镇静、**低钙要补钙、**癫痫要抗癫痫药**）；**④⚠ 而\"**刚痉/柔痉**\"这个分型**尤其不能套到脑膜炎上**（**脑膜炎不分\"有汗/无汗\"**，**而分\"细菌性/病毒性/结核性\"**，**治法从\"抗生素\"到\"抗结核\"到\"支持治疗\"**，**差别极大**）。** **⚠ 本集按语（最高级警告）**：**若一个孩子出现\"**发热 ＋ 颈项强直 ＋ 呕吐 ＋ 精神差/意识改变**\"，**唯一该做的是立刻急诊**——**⚠ 不是\"辨刚痉柔痉、**服葛根汤观察一剂\"**（**⚠ 因为**细菌性脑膜炎**可在数小时内进展至休克、**脑疝、死亡**，**而抗生素每早一小时，**结局就差一分**）；**⚠ 故本集对\"痉病\"的处理是**：**照录其方证（葛根汤、栝蒌桂枝汤），**并明确标注\"**此处的'痉'是证候名，**不是脑膜炎的诊断；**凡疑似脑膜炎，**立即急诊，**不可先服药观察\"**。","o":"RJ-2869 · 人纪·金匮要略·痉湿暍病脉证治第二（PDF 第62页）"},{"t":"四、\"微微似欲汗出者，风湿俱去也\"","h":"一条全篇最要紧的治风湿原则","c":"方法——**原文给了治风湿的**发汗标准**，而讲义把它讲得极细，须完整照录**：\"**'**风湿相抟（tuán），一身尽疼痛，法当汗出而解**——值**天阴雨不止**，医云此可发汗；**汗之病不愈者，何也？**'。'**盖发其汗，汗大出者，但风气去，湿气在，是故不愈也**'。'**若治风湿者，发其汗，但微微似欲出汗者，风湿俱去也**'。**\" **讲义的点解（极具体）**：\"**'所以我们开给风湿病人吃发表的药时，病人应该是出现**全身微汗**表示病去，**而不是大汗淋漓**——因为**大汗表示迅速出汗，而湿行是很慢的**，因此会造成**风去了，而湿还是停在身体里面**'。'如果是**微汗出而且摸上去有很黏的感觉，才表示湿出了**'。'**我们运动完得到的汗，跟我们洗完澡以后得到的汗摸起来是不一样的——运动完的汗是黏黏的、很湿，因为你动了，湿就出；洗澡后流的汗，滑滑的，就不会这样**'。**\" **须说明（四层）**：**①\"**汗大出者，风气去，湿气在**\"这一句**极精**（**它给了一个\"为什么大汗无效\"的机制**：**风性轻、湿性重而缓**，**大汗只能把\"轻的\"带走**）——**⚠ 而\"**风轻湿重**\"这个模型**可以当比喻**；**②⚠ 而\"**微微似欲汗出**\"这五个字**是**全篇最要紧的一句**（**⚠ 它给了\"发汗\"一个**剂量标准**（**不是\"发透\"，是\"欲出未出\"**）——**⚠ 而这一层**在临床上极难把握**（**故讲义说\"处方的剂量要控制得很好\"**）；**③⚠ 而\"**运动完的汗黏、洗澡后的汗滑**\"这一条**极精**（**⚠ 它是**全书里最\"可当场验证\"的一个判据之一**：**你运动完摸自己的汗，**是黏的；**你洗完澡再摸，**是滑的**）——**⚠ 而这一层**脱开风湿**也成立**（**\"黏\"的汗确实意味着\"出汗多、水分丢失多\"**）；**④⚠ 而\"**值天阴雨不止**\"这一句**很有意思**（**它说\"天气潮湿时发汗，病不容易好\"**）——**⚠ 而这一层**有一个朴素的道理**：**外界湿度高时，**汗不容易蒸发**（**⚠ 故\"微微汗出\"在潮湿天**更难把握**）。** **⚠ 本集按语**：**\"**微汗**\"这条原则，**其实是\"所有发汗法\"的通则**（**⚠ 而它**极难被遵守**，**因为**人一难受就想\"快点好\"**（**⚠ 故\"欲速则不达\"这四个字，**在这一条里**是字面意思**）。","o":"RJ-2870 · 人纪·金匮要略·痉湿暍病脉证治第二（PDF 第83~84页）"},{"t":"五、\"湿家不可攻下\"","h":"一条禁忌，与它列出的三个死候","c":"风险——**原文与讲义都给\"湿病\"立了一条**明确的禁忌**，并列出\"下之\"之后的**死候**，须照录**：\"**'**湿家下之（攻下），额上汗出、微喘、小便利者，死；下利不止者，亦死**'。**\" **讲义的点解**：\"**'湿家的人**不可以攻下**，忌讳攻下**——因为中湿，中焦是湿的'。'如果把它攻下，**额上汗出、微喘、小便利者，都是死症**'。'为什么？**湿在这边的时候，我们的食物、精神的营养、身体的精髓通通在里面**——你一攻下，**湿还是在这边，但阳热就往上走**'。'我们**正常的热应该往下走、寒往上走**，所以**头面身体是冷的，手脚是温热的，这才是正常的人**'。'但你如果是遇到这种有湿的人，攻下的时候，**因为湿，攻下你是攻不下来的**——比如我们知道这个人湿，**你开承气汤下去也不可能把湿攻下来的**'。'那湿还在那边，**就反而肠胃里面没有食物的营养**，没有精髓在里面支撑到身体的时候，**热往上跑**，就变成那样了'。'当你在阳虚的时候，**上焦虚掉的时候，病人会微喘，讲话就没有办法喘过气来**'。'**小便利者**——湿家的人呢，**小便不利**，这个小便利，就代表**你的津液丧失掉了**，等于像你遗精出来一样，**没有办法控制**，**这都是死症**'。**\" **须说明（四层）**：**①这一条的**禁忌**是对的**（**\"湿\"不在肠胃之实，**攻下攻不到它**，**而会伤津液**）——**⚠ 故\"湿家禁下\"**有道理**；**②⚠ 而三个\"死候\"**极重要**：**额上汗出（阳浮于上）、微喘（上焦虚）、小便利（津液不能固）**——**⚠ 而这三条**合起来**恰好是\"**阳气外脱、津液不固**\"的**休克前兆**（**⚠ 故\"死症\"这个判断**在当时的条件下**是对的**）；**③⚠ 而\"**正常的热应该往下走、寒往上走**\"这一句**极重要**（**它是一条\"寒热分布\"的正常模型**：**头面冷、手脚温**）——**⚠ 而这一条**可以当**\"家里人摸手脚\"的常识**（**⚠ 而它**不能当\"体温\"**（**手脚温不等于体温正常**，**高热时手脚可能是凉的**））；**④⚠ 而\"**小便利＝津液丧失**\"这一句**须标**（**在\"攻下之后尿多\"，**确实提示\"脱水\"**）——**⚠ 但\"小便利\"本身**不是\"死\"**（**⚠ 故\"死症\"这个词**要按\"当时的条件\"读**）。** **⚠ 本集按语**：**这一条最值得记的，**是\"**攻下攻不到湿**\"这个观察**（**它说的是\"**用药要对准病位**\"**）——**⚠ 而这一层**与前面第 n36 条\"六个补虚缺点\"**是**同一类道理**（**⚠ 即：**病不在那里，**药却往那里去**，**于是\"病没去、人受伤\"**）。","o":"RJ-2871 · 人纪·金匮要略·痉湿暍病脉证治第二（PDF 第82~83页）"},{"t":"六、\"风痛游走，湿痛固定\"","h":"一条极简的\"三邪鉴别\"，与它对应的用药分工","c":"要点——**讲义给了\"风、湿、寒\"三邪在**疼痛表现上**的鉴别，而这一层**可以当场问诊**，须照录**：\"**'**风的性呢，是到处游走**——比如说一个病人来找你：「我关节痛，但是这种关节痛很奇怪，**今天痛左边，明天痛右边，后天痛肩膀**」——**所以风是没有固定一个地方痛的**'。'**湿呢，不是——湿就是固定一个地方痛**'。'如果说病人跑来说：「我**全身骨头都痛**，随时都是骨头都在痛」——**那就是风湿都有**'。'**风寒湿，靠在一起**——中医为什么要把它分**风、湿、寒**？因为**我们有的药是去风的，有的药是去湿的，有的药是去寒的**。所以我们会把它写成有风寒湿，**我们知道开去风的药、开去湿的药、开去寒的药，放在一起，风寒湿它就会去掉**'。**\" **须说明（四层）**：**①\"**风痛游走、湿痛固定**\"这一组**极精**（**⚠ 而它**在临床上**确有对应**：**游走性关节痛**常见于**风湿热、早期类风湿、系统性红斑狼疮**；**固定性疼痛**常见于**骨关节炎、局部劳损**）；**②⚠ 而\"**寒**\"的鉴别（原文未在此段展开）**通常是\"**痛而冷、得温则减**\"**——**⚠ 故三邪的鉴别**其实各有一个**可观察的维度**（**位置变不变（风）、**固定不固定（湿）、**喜温喜冷（寒）**）；**③⚠ 而\"**分开用药**\"这一层**极重要**（**它说明\"风寒湿\"**不是\"一个东西\"，**而是\"三个可以分别对付的东西\"**）——**⚠ 而这一层**与现代\"多靶点治疗\"**其实相通**（**⚠ 但\"分别用药\"**必须以\"分别辨证\"为前提**）；**④⚠ 而\"**全身骨头都痛，那就是风湿都有**\"这一句**须标**（**\"全身骨痛\"**在临床上最该先排除的**是**多发性骨髓瘤、骨转移、甲旁亢、重度维生素 D 缺乏**）——**⚠ 故\"全身骨痛\"**不是\"风湿都有\"**，**而是一个需要查因的信号**。** **⚠ 本集按语**：**\"**游走还是固定**\"这个问题，**可以在问诊时一句话问出来**——**⚠ 而它**极有用**（**⚠ 因为**它把\"一片模糊的痛\"**分成了两类**，**而两类的原因和治疗**完全不同**）。","o":"RJ-2872 · 人纪·金匮要略·痉湿暍病脉证治第二（PDF 第84页）"},{"t":"七、\"阳脱\"与\"阴脱\"","h":"一段极准的濒死观察，与它的两名","c":"要点——**讲义在讲\"攻下致危\"时，插了一段关于**濒死时二便**的观察，而它**极准、极具体**，须照录**：\"**'**如果攻下了以后，病人出现**小便利**，就是小便一直不断的出**——照理说湿家的话小便应该不利的，现在反而小便利了，**这就是阳已经虚脱了**'。'如果**下利不止者，就是里阴脱了**'。'所以当一个人**被吊死时，在断气的刹那间，小便大便会一起出**——**小便出叫做阳脱，大便出就叫阴脱**，这就是**阴阳两脱之症**，见到这些症状时表示病人已经死了'。**\" **须说明（四层）**：**①\"**断气刹那，二便俱出**\"这个观察**极准**（**它对应\"**括约肌在死亡时松弛**\"，**是真的**）——**⚠ 故这一层**是**可核的生理观察**；**②⚠ 而\"**阳脱＝小便出、阴脱＝大便出**\"这个命名**是**古代的\"阴阳\"框架**（**⚠ 而它把\"两种排泄\"**配给了\"两种气\"**，**这一层**是理论的，**不是观察的**）；**③⚠ 而\"**湿家小便利＝阳脱**\"这一层**须标**（**在\"攻下之后尿多\"的情况下，**更常见的解释是**\"脱水＋渗透性利尿\"**）——**⚠ 故\"阳脱\"这个词**可以当\"**病情极危**\"的代号读**，**不宜当\"机制\"读**；**④⚠ 而\"**见到这些症状时表示病人已经死了**\"这一句**须明确纠正**（**\"二便失禁\"在**濒死期（临终前数小时至数日）**就会出现**，**而病人**可能还活着**）——**⚠ 故本集的处置是**：**照录其观察（二便俱出＝极危），**但明确标注\"**二便失禁不等于死亡，**须立即评估生命体征\"**。** **⚠ 本集按语**：**这一段最值得记的，**是\"**照理说湿家小便应该不利，现在反而小便利了**\"这个\"**反常即警**\"的思路**——**⚠ 而这一层**极有用**（**⚠ \"本该少的东西变多了\"、\"本该多的变少了\"，**在任何医学里**都是要警觉的信号**）。","o":"RJ-2873 · 人纪·金匮要略·痉湿暍病脉证治第二（PDF 第82页）"},{"t":"八、\"湿病在表\"与\"纳药鼻中\"","h":"一条\"病位很浅\"的处理，与它的分寸","c":"方法——**原文给了\"湿病\"里**病位最浅**的一种，而它的处理方式**极特别**（**不用汤药，**用\"纳药鼻中\"**），须照录**：\"**'**湿家病，身疼发热、面黄而喘、头痛鼻塞而烦，其脉大，自能饮食，腹中和无病**——病在头中寒湿，故鼻塞，**纳药鼻中则愈**'。**\" **须说明（四层）**：**①这一条的**判据**极清楚**：\"**自能饮食、腹中和无病**\"**——**⚠ 即：**\"能吃、肚子没事\"**，**说明\"病不在里\"**（**⚠ 故它的病位**被限定在\"头\"**）；**②⚠ 而\"**病在头中寒湿，故鼻塞**\"**与\"**纳药鼻中**\"**是一对**（**病在哪，**药就往哪**）——**⚠ 而这一层**与\"攻下攻不到湿\"（第五条）**正好相反**（**一个是\"药不对位\"，**一个是\"药对着位\"**）；**③⚠ 而\"**纳药鼻中**\"这个做法**在今天是**可行的**（**鼻腔给药确实起效快**）——**⚠ 但\"**纳什么药**\"原文没给方**（**⚠ 而后世多注为\"瓜蒂散\"（搐鼻）**，**而瓜蒂有毒**）——**⚠ 故本集**不推荐自配搐鼻药**；**④⚠ 而\"**面黄而喘**\"这两个症状**须单独标**（**\"面黄\"＋\"喘\"**在今天是**肝胆病、贫血、心衰、肺病**的常见组合**）——**⚠ 故\"面黄而喘、但能吃、肚子没事\"这一组，**不能只用\"头中寒湿\"解释**（**⚠ 须先排除器质性疾病**）。** **⚠ 本集按语**：**这一段的价值，**在它**示范了一个\"判断病位\"的思路**：**问\"能不能吃、肚子有没有事\"**——**⚠ 而\"能吃、肚子没事\"**确实是**\"病不在中焦\"最朴素的证据**（**⚠ 故这一条**可以当\"自查\"用**：**一个发热的人若胃口如常，**说明\"里\"还安**）。","o":"RJ-2874 · 人纪·金匮要略·痉湿暍病脉证治第二（PDF 第84页）"},{"t":"九、\"这一篇把病都治完了\"","h":"一份对\"短篇\"的自我评价，与它的分寸","c":"要点——**讲义在这一篇开篇有一句自评，说明\"短篇未必轻\"**：\"**'诸位不要看这个**短短的一篇**，**这短短的一篇把病都治完了**——经方就是这样子：你只要会用它，哇那真的是**药到病除，一剂下去就到了**'。'所以我们看处方的时候**不可以那么死板，不可以那么死板**'。**\" **须说明（四层）**：**①\"**短短一篇把病都治完了**\"这句话**极有感染力**（**⚠ 而它**在\"痉湿暍\"这一篇上**不成立**：**这一篇只讲了三类病**（**痉、湿、暍**），**而\"晕、喘、痛、肿\"的绝大部分原因**不在这里）；**②⚠ 而\"**一剂下去就到了**\"这一层**须标**（**⚠ \"一剂知\"是**经方的自我描述**（**⚠ 而它**对\"**方证完全吻合**\"的病例**确实常见**（**如：**单纯的表证、单纯的便秘**）——**⚠ 而它**对复杂病例**不成立**）；**③⚠ 而\"**不可以那么死板**\"这一句**反而是全段最好的**（**⚠ 因为**它说的是\"**要随证调整**\"**）——**⚠ 而\"随证调整\"**恰恰**是经方**最难学的一层**（**⚠ 故\"不死板\"**不等于\"随便加减\"**）；**④⚠ 而这一段**附了一个医案**（**腰痛＋肾结石**）：**\"**委中、阴谷一下去，照理说腰痛就好了……但就是这一点腰痛**\"**→**\"**结石有压痛点，针在石头的压痛点，一下去，痛就没了**\"**→**\"**处方开下去，猪苓汤**\"**——**⚠ 而这个案**有意思**（**它示范了\"针＋药\"的配合**）——**⚠ 而\"**猪苓汤**\"确实**是\"水热互结、小便不利\"的方**（**⚠ 而\"肾结石\"**用它**须有\"水热\"的证**，**不是\"看到结石就用\"**）。** **⚠ 本集按语**：**\"短篇把病都治完了\"这句话，**最该反着读**：**这一篇短，**是因为它只讲了三类病**（**⚠ 而\"三类病讲清楚\"，**比\"一百类病讲不清楚\"**要好**（**⚠ 故\"短\"在这里**是优点**）。","o":"RJ-2875 · 人纪·金匮要略·痉湿暍病脉证治第二（PDF 第62页）"},{"t":"一、百合病的定义","h":"中医文献里最精确的一段\"多系统、查无实据\"的描述","c":"定义——**《金匮》第三篇对\"百合病\"的描述，是全书**最精确的一段症候群记录**，须完整照录**：\"**'**论曰：**百合病者，百脉一宗，悉致其病也**'。'**意欲食，复不能食**；**常默默然**；**欲卧不能卧，欲行不能行**；**饮食或有美时，或有不欲闻食臭时**；**如寒无寒，如热无热**；**口苦，小便赤**；**诸药不能治，得药则剧吐利**；**如有神灵者**；**身形如和，其脉微数**'。**\" **须说明（四层）**：**①这一段有**九个\"矛盾\"**：**想吃又吃不下、想睡又睡不好、想走又没力气、一时觉得香一时闻着就恶心、像冷又不冷、像热又不热**——**⚠ 故\"矛盾\"本身就是这个证的**特征**（**⚠ 而\"如寒无寒、如热无热\"这八个字**最精**：**它说的是\"主观感觉与客观征象不一致\"**）；**②⚠ 而\"**诸药不能治，得药则剧吐利**\"这一句**极重要**（**它描述的是\"对治疗不耐受\"**）——**⚠ 而\"**身形如和**\"（外表看起来没什么）**与\"**其脉微数**\"（脉稍快）**是**唯一两个客观所见**（**⚠ 故\"查不出问题，但人就是不舒服\"**是这一证的核心**）；**③⚠ 而\"**如有神灵者**\"这一句**指幻觉或异样感**（**讲义解作\"突然看到神仙怪物\"**）——**⚠ 而\"**幻觉**\"是一个**必须评估的症状**（**它可能是**精神分裂、**谵妄、**药物副作用、**脑部病变**）**（**⚠ 故\"如有神灵\"**不能只用\"肺魄不守\"解释**）；**④⚠ 而\"**百脉一宗**\"这四个字**是\"百合\"这个名字的来源**（**\"百\"＝百脉，\"合\"＝一宗**）——**⚠ 故\"百合\"**不是\"一百个症状\"，**是\"百条脉归一个源头\"**（**⚠ 而讲义读成\"症状很多\"，**这一层**是引申**）。** **⚠ 本集按语**：**这一段最值得记的，**是\"**欲卧不能卧、欲行不能行**\"这八个字**（**⚠ 它写的是**一种\"想做而做不到\"的状态**（**⚠ 而这**恰好是**抑郁/焦虑最典型的主观体验之一**）——**⚠ 故\"百合病\"**在今天的对应**，**不是\"神经衰弱\"一个词能盖住的**（**见第六条**）。","o":"RJ-2876 · 人纪·金匮要略·百合狐惑阴阳毒证治第三（PDF 第111页）"},{"t":"二、\"一个病 ＋ 三种误治 ＝ 四个方\"","h":"一组极干净的结构，与它的四方","c":"方法——**百合病在《金匮》里**不是一个方**，**而是四个方**，而四方的分野**极清楚：**有没有被误治、被什么误治**，须照录**：\"**'**百合病，不经吐、下、发汗，病形如初者，百合地黄汤主之**'。**\" **讲义的展开**：\"**'**第一种是纯百合证**——就是单纯百合病，**单纯的百合证就是百合地黄汤证**'。'如果**百合病被发汗了**，就是原本是百合病，结果被医师**误汗**了——我们就用**百合知母汤**'。'**百合病如果被误攻下了**——就是**百合滑石代赭汤**'。'**百合病如果被误吐**——就是**百合鸡子汤**'。**\" **须说明（四层）**：**①这个结构**极干净**：**一张\"基线方\" ＋ 三张\"误治后的补方\"**——**⚠ 故它承认了一件事：**病人常常在来看你之前**已经被别人治坏了**（**⚠ 而\"治坏了以后再治\"，**要换方**）；**②⚠ 而三张补方**各有方向**：**误汗（伤了津液）→百合知母汤（知母生津清热）**；**误下（伤了中气）→百合滑石代赭汤（滑石利水、代赭降逆）**；**误吐（伤了胃气）→百合鸡子汤（鸡子黄养胃阴）**——**⚠ 而这三方**共有一个底：**百合**（**百合是\"润\"的药**）；**③⚠ 而\"**百合地黄汤**\"（百合＋生地黄汁）**是本方**——**⚠ 生地黄汁**在经方里**极特殊**（**用\"汁\"而非\"干\"**，**意在\"养血凉血\"**）——**⚠ 故这个方**不是\"安神方\"，**是\"养阴血方\"**；**④⚠ 而讲义对\"为什么这些条辨不放在前面\"给了一个**传说式解释**（**\"以前是用竹简做成书，小徒弟勾到门槛，竹简散开……\"**）——**⚠ 这一层**须标**：**它是**一个传说**（**⚠ 而《金匮》条文的错简问题，**在文献学上**确有讨论**（**但原因不是\"小徒弟摔倒\"**）。** **⚠ 本集按语**：**\"**一个病四个方**\"这个结构，**其实是**全书最好的一处\"分层\"**（**⚠ 按\"有没有被治坏\"分层**，**比\"按症状多少\"分层**要准确**（**⚠ 因为**\"被误治\"是**一个可问清的事实**）。","o":"RJ-2877 · 人纪·金匮要略·百合狐惑阴阳毒证治第三（PDF 第112~113页）"},{"t":"三、\"五脏藏神\"与\"魄＝白＋鬼\"","h":"一组情志—五脏对应，与一个惊人的拆字巧合","c":"定义——**讲义把\"情志病\"归到五脏，并给了一个**极具体、且有一个惊人巧合的解释**，须照录**：\"**'**在中医的观念里面，**肝藏魂；心藏神；脾藏意；肺藏魄；肾藏志**'。'**当我们五脏非常协调的时候，人就是心情很好、很开朗、想法就会正面**'。'**当你的脏腑失掉平衡的时候，就会产生不同的反应**'。'一个人如果说**常常白天能看到鬼**——你看那个**魄**：**是不是白天看鬼**？（所以千万简体字不要改掉）'。'那如果儿子奇怪，**常常说有看到东西**——**魄**；这个儿子呢，**什么都不想干，每天在那里晃晃荡荡的**——**志！没有志啊**'。'（小孩）**不能集中注意力，在教室里面**——**脾！**（脾藏意）'。**\" **须说明（四层）**：**①\"**肝魂、心神、脾意、肺魄、肾志**\"这五条，**是中医\"五神\"的标准配置 ✓**（**出自《素问·宣明五气》一系**）——**⚠ 而这一层**可核**；**②⚠ 而\"**魄＝白＋鬼**\"这个拆字**极妙**（**\"魄\"字确由\"白\"与\"鬼\"构成**）——**⚠ 而\"**白天看到鬼**\"这个读法**把\"魄\"与\"幻觉\"接上了**（**⚠ 而\"**简体字不要改**\"这一句**有道理**：**汉字的结构本身携带意义**，**简化后这层信息就丢了**）；**③⚠ 而\"**不能集中注意力 → 脾（意）**\"与\"**什么都不想干 → 肾（志）**\"这两条**极实用**（**⚠ 它们把两个极常见的主诉**（**注意力差、没动力**）**各指了一个方向**）——**⚠ 而这一层**与\"疏肝、健脾、补肾\"的治法**是**同一条线**；**④⚠ 而\"**五脏协调则心情好、想法正面**\"这一句**须标**（**它把\"情绪\"完全归到\"五脏\"**）——**⚠ 而现代医学里**情绪有**神经递质、内分泌、社会心理**三层原因**（**⚠ 故\"调五脏\"**可以是\"一条路\"，**不是\"唯一的路\"**）。** **⚠ 本集按语**：**\"**魄＝白天见鬼**\"这个读法，**是全册**最漂亮的一处\"拆字解字\"**（**⚠ 而它**同时提醒**：**这类解释**是\"从字形反推意思\"**（**⚠ 而\"从字形反推\"**在训诂学上**有传统**，**在医学上**不可靠**（**\"魄\"的本义是\"依附形体而存在的精神\"，**不是\"白天见鬼\"**））。","o":"RJ-2878 · 人纪·金匮要略·百合狐惑阴阳毒证治第三（PDF 第112~113页）"},{"t":"四、\"睡眠是魂要归肝\"","h":"一句极好的\"为什么会失眠\"，与\"魂不守\"的两种后果","c":"要点——**讲义用\"魂、魄\"两个字，解释了\"失眠\"与\"幻觉\"两件事，而这一层**极简、也极形象**，须照录**：\"**'**忧能伤肺，**魄就没有办法存在血里面**——所以「**如有神灵者**」就是**肺魄不守**'。'**魂不能归肝**——就是当**肝血伤到后，人会虚弱**……**当魂不守的时候，病人就不能睡觉**'。'**我们人的睡眠是魂要归肝，人才能睡着**'。'**神经衰弱、歇斯底里的人**，如果是比较严重的，他**小便一小完，哇头很痛**——为什么？**因为他身上津液不足**'。**\" **须说明（四层）**：**①\"**睡眠是魂要归肝**\"这五个字**极精**（**它把\"入睡\"说成\"魂回到肝里\"**）——**⚠ 而\"**魂归肝**\"这个模型**与\"肝藏血、卧则血归于肝\"是连着的**（**⚠ 故\"血不足 → 魂无所归 → 睡不着\"**这一条链**在中医内部是通的**）；**②⚠ 而\"**魂不守则不能睡、魄不守则见神灵**\"这一组**极对称**（**⚠ 它把\"失眠\"与\"幻觉\"**各配了一个\"神\"**）——**⚠ 而这一层**作为比喻极好**（**作为诊断**不可靠**）；**③⚠ 而\"**小便完头痛**\"的机制**（**\"津液不足，小便又伤津\"**）**极具体**（**⚠ 而\"**排尿后头痛**\"在临床上**确有对应**（**如：**低颅压性头痛、**排尿性晕厥的前驱**）——**⚠ 故这一层**可以当\"提示\"**，**不宜当\"百合病专属\"**）；**④⚠ 而本集对这一段的处置是**：**保留\"魂归肝\"这个**比喻**（**它有助于理解\"血虚失眠\"**），**同时标注**：**\"**失眠**\"在今天是**一个可评估的症状**（**睡眠呼吸暂停、焦虑、抑郁、药物、甲状腺、疼痛、夜尿**），**⚠ 不能一概归到\"魂不归肝\"**。** **⚠ 附一句**极好的自我说明**：\"**你有什么症状都告诉我，我不在乎你告诉我说「我背后有一个人一直在那里晃来晃去」——你什么都可以告诉我，对我来说都 makes sense**\"**——**⚠ 这一层**极重要**（**它示范了\"问诊时不打断、不评判\"**）——**⚠ 而\"**不评判**\"恰恰是**让病人说出关键症状的前提**（**⚠ 而它**也可能**把一个需要精神科评估的症状**载到\"百合病\"这条船上**（**见下条**）。","o":"RJ-2879 · 人纪·金匮要略·百合狐惑阴阳毒证治第三（PDF 第112~113页）"},{"t":"五、百合病 vs 躯体症状障碍","h":"一个极贴切的现代对应，与它必须留的边界","c":"要点——**讲义把百合病\"近似于现代的神经衰弱症与厌食症\"，而本集认为**更贴切的现代对应是\"躯体症状障碍\"**，须说明两者的一致与不一致**。**讲义原文**：\"**'**百合病近似于现代的**神经衰弱症与厌食症**'。'你说仲师讲的是什么呢？**他讲的是神经衰弱症**'。**\" **对照（三条一致）**：**①\"多系统症状\"**（**百合病有九组矛盾症状；**躯体症状障碍要求**\"多种躯体症状\"**）✓**；**②\"与检查结果不相称\"**（**百合病\"身形如和\"；**躯体症状障碍要求\"症状与检查结果不成比例\"**）✓**；**③\"对治疗反应差\"**（**百合病\"诸药不能治\"；**躯体症状障碍常见\"反复就医、疗效不佳\"**）✓**。**须说明（四层）**：**①故**三者高度一致**（**⚠ 故\"百合病\"**是中医里对这种状态**最早、最完整的一次描述**）——**⚠ 这一层**是它的价值**；**②⚠ 而**关键区别**在于**：\"**百合病是排除性诊断**\"，**而\"现代诊断\"也一样**（**⚠ 两者都要求**\"先排除器质性疾病\"**）——**⚠ 故\"百合病\"**不能用来\"跳过检查\"**（**⚠ 这是**最要紧的一条**）；**③⚠ 而\"**神经衰弱**\"这个词**在今天的诊断体系里**已基本不用**（**更接近的是\"躯体症状障碍\"、\"自主神经功能紊乱\"、\"焦虑/抑郁的躯体化表现\"**）——**⚠ 故\"神经衰弱\"这个对应**只是\"近似\"**，**不是\"等同\"**；**④⚠ 而\"**厌食症**\"这个对应**须单独标**（**百合病有\"意欲食复不能食\"，**而神经性厌食**有\"体重显著下降、体象障碍、怕胖\"**——**⚠ 两者**不是一回事**（**⚠ 而神经性厌食**有明确的死亡风险**（**营养不良、电解质紊乱、心律失常**））。** **⚠ 本集按语（须强调）**：**\"**百合病**\"这个框架**最大的风险**是**它可能把一个\"尚未查出的器质病\"**归到\"情志\"**（**⚠ 故本集建议：**凡\"多系统、查不出、久不愈\"的人，**第一步是\"把该查的查完\"**（**甲状腺功能、血糖、血常规、肝肾功能、电解质、维生素 B12、自身免疫抗体、必要时影像**），**第二步才是\"是不是百合病\"**（**⚠ 因为**\"查不出\"不等于\"没有\"**）。","o":"RJ-2880 · 人纪·金匮要略·百合狐惑阴阳毒证治第三（PDF 第111页）"},{"t":"六、病程三层：二十日、四十日、六十日","h":"一个\"按症状轻重分愈期\"的分层，与它的性质","c":"数据——**原文给了三个\"愈期\"，而分层的依据是**小便时的反应**，须照录并核**：\"**'**每溺时头痛者，**六十日乃愈**'。'若溺时头不痛、**淅淅然者**（像有风在耳朵里吹），**四十日愈**'。'若溺快然、但头眩者，**二十日愈**'。'其证或未病预见，或病四五日而出，或病二十日、或一月后见者，**各随证治之**'。**\" **复核（一步）**：**三层**排列有序**——**症状越重（头痛）→ 愈期越长（60 日）；症状居中（淅淅然）→ 40 日；症状最轻（头眩）→ 20 日**——**⚠ 故\"**越重越久**\"这个方向**是对的**（**✓ 逻辑自洽**）。** **须说明（四层）**：**①这个分层**在逻辑上成立**（**⚠ 而\"60/40/20\"这三个具体数字**没有依据**（**为什么不是 61 天？**为什么是 20 而不是 21？**）——**⚠ 故它们是**\"叙述细节\"**，**不是\"可检验的预测\"**；**②⚠ 而\"**各随证治之**\"这一句**极重要**（**它把这套\"愈期\"**限定为\"参考\"**（**⚠ 即：**还是按具体证治，**不是\"等 60 天\"**）——**⚠ 故原文**自己留了余地**；**③⚠ 而\"**愈期**\"这类断言**的实际风险**是**让病人\"等待\"**（**⚠ 一个人若被告知\"六十天会好\"，**他可能**不去复诊、不查原因**（**⚠ 而\"六十天\"过去**没好，**又可能被告知\"病比较深\"**）——**⚠ 故本集对这类\"日月数\"**一律标为\"旧时的预后经验\"**；**④⚠ 而\"**其证或未病预见**\"这一句**有意思**（**它说\"病还没发就能预见到\"**）——**⚠ 而这一层**是**\"脉证\"的思路**（**⚠ 不宜当\"预报\"读**）。** **⚠ 本集按语**：**这一段的**真正价值**不在\"60 天\"，**而在它**做了一件事**：**\"**按症状的轻重，**给不同的愈期\"**（**⚠ 而\"分层\"这个做法本身**是对的**（**⚠ 现代医学的\"分级\"**也是这个思路**）——**⚠ 只是它用的\"层\"**（**小便时头不痛/痛**）**不是\"可测的指标\"**。","o":"RJ-2881 · 人纪·金匮要略·百合狐惑阴阳毒证治第三（PDF 第111页）"},{"t":"七、\"世界上本都很简单，可是被人想复杂了\"","h":"一段极准的情志观察，与两个具体的例子","c":"要点——**讲义在讲百合病时，插了一段**关于\"神经衰弱是怎么来的\"**的观察，而它**极具体、极生动**，须照录**：\"**'这个发生在很多的太太、妈妈身上——**她们时常制造出许多世界上原本不存在的问题**，比方说：「**媳妇重要还是妈妈重要？**」**可是这不能讲出口**，因为心知这是不对的，**但她还是要去表现出很多动作**'。'**儿子一回家，两个人拿两双拖鞋在那边，看儿子会穿谁拿的**'。'日久以后，就有**忧**——而**忧能伤到肺**'。'每天在那边想一些有的没有——**我常讲，世界上的问题本都很简单，可是被人想复杂了**'。'所以很多人有神经衰弱，因此常常生病，生完病以后还是没好'。'还有一些妇人，**一天到晚都在担心子女，或者一天到晚在喝下午茶，然后专门议论人家长短，自己没有中心主见，自己也不知道自己想要什么**——这种人很多，大部分都有神经衰弱'。**\" **须说明（四层）**：**①\"**两双拖鞋**\"这个画面**极精**（**它把\"婆媳之间的竞争\"**变成了一个**具体可见的动作**）——**⚠ 而这一层**极重要**（**\"关系紧张\"**不是抽象的，**它是由**一个个具体的小动作**积起来的**）；**②⚠ 而\"**这不能讲出口，因为心知这是不对的**\"这一句**极准**（**它描述的是\"**明知不该，但控制不住**\"**）——**⚠ 而这**恰恰是\"情绪\"与\"行为\"之间的那段缝隙**；**③⚠ 而\"**世界上的问题本都很简单，可是被人想复杂了**\"这一句**是**全册最好的一句\"劝人\"的话**（**⚠ 而它**同时是一句\"诊断\"**（**\"把简单想复杂\"，**本身就是病**））；**④⚠ 而\"**喝下午茶、议论人家长短、没有中心主见**\"这一段**须标**（**⚠ 它是**对一类人的\"画像\"**，**带有**评判色彩**（**\"议论人家长短\"**是一个道德评价，**不是症状**）——**⚠ 故本集**保留其\"观察\"，**删去其\"贬抑\"**。** **⚠ 本集按语**：**这一段最值得留的，**是\"**拖鞋**\"这个画面**（**⚠ 因为**它说明\"**情绪问题**\"**不是\"心里的事\"，**是\"关系里的事\"**（**⚠ 故\"百合病\"**若真有一个\"社会病因\"，**那就是**\"一个说不出口的竞争\"**（**⚠ 而这一层**比\"肝藏魂\"**更能解释\"为什么这些症状**集中在中老年女性**\"）。","o":"RJ-2882 · 人纪·金匮要略·百合狐惑阴阳毒证治第三（PDF 第112页）"},{"t":"八、\"欲卧不能卧\"的机制解释","h":"一条\"水不生木\"的推演，与它可观察的对应","c":"要点——**讲义对\"欲卧不能卧\"给了一条**五行推演**的解释，须照录并核**：\"**'那常常呢，**默默然，又不讲话，想躺下来又不能躺下来**——**卧下来不能卧的原因是什么？**'。'这个**肾**啊，**当你肾水很足的时候，肾水很足就生到肝，就会能够躺下来**'。'这个**魄是静、魂是动**——**动和静之间，讲的就是肝脏和肺**'。'**当你的肾脏、肾水不够的时候，水没有办法去生木，病人就在动、动来动去**——所以想躺下来又不能躺下来，**就是水不能去生木**'。'**所以当你水能够生木的时候，肝就静下来了**'。**\" **须说明（四层）**：**①这条推演**在五行框架里是通的**（**肾（水）生肝（木）；**木主\"动\"；**水不足则木失养而\"动\"不止**）——**⚠ 故\"**水不生木**\"这个说法**自洽**；**②⚠ 而\"**魄是静、魂是动**\"这一组**也自洽**（**肺（金）主收敛（静）；**肝（木）主升发（动）**）——**⚠ 而这一层**把\"动/静\"配给了\"肝/肺\"**（**⚠ 而\"**欲卧不能卧、欲行不能行**\"**恰好是\"动不了、也静不了\"**——**⚠ 故这八个字**在五行框架里**有一个精确的对应**）；**③⚠ 而**可观察的对应**是**：**\"烦躁、坐立不安、躺不住\"**这些表现**（**⚠ 它们**确实**常见于**焦虑、不宁腿综合征、甲亢、心衰（端坐呼吸）**——**⚠ 故\"躺不下来\"**是一个**该查因的症状**（**⚠ 而\"端坐呼吸\"**是**心衰的急症信号**）；**④⚠ 而\"**水能生木，肝就静下来**\"这一句**须标**（**它给了一个\"治法方向\"**（**滋水涵木**）——**⚠ 而\"**滋水涵木**\"**是**中医的常法**（**如：**六味地黄丸类**）——**⚠ 故这一层**可以当\"思路\"**（**⚠ 而\"**躺不下来**\"若伴\"**喘、不能平卧、下肢肿**\"，**先查心脏**，**不是\"滋水\"**）。** **⚠ 本集按语**：**这一段是全书\"五行推演\"里**较清楚的一处**（**⚠ 因为\"动/静\"**这一对**有直观的对应**（**⚠ 而\"**想躺躺不下**\"**这个体验，**用\"动与静\"来解释**，**比用\"阴阳\"解释**要容易懂**（**⚠ 故\"比喻清楚\"**是这一段的价值**，**\"机制正确\"**不是**）。","o":"RJ-2883 · 人纪·金匮要略·百合狐惑阴阳毒证治第三（PDF 第113页）"},{"t":"一、疟病总纲","h":"疟脉自弦：五种脉象，五条出路","c":"疟病的第一条条辨立的是脉法总纲：「师曰：**疟脉自弦，弦数者多热，弦迟者多寒。弦小紧者下之差，弦迟者可温之，弦紧者可发汗、针灸也，浮大者可吐之，弦数者风发也，以饮食消息止之**。」讲义拆解为——**弦是少阳的脉**，摸到弦脉多半有往来寒热（忽冷忽热），不论少阳证还是疟疾都如此；**弦数**是热，**弦迟**是寒；**弦而紧**为半表半里兼阳明，须攻下（即大柴胡汤一类）；**弦迟**可温；**弦紧**可发汗或针灸；**浮大**可吐；**弦数而属风发**者，则以饮食调养消息止之。这一条的实质是把疟病按「脉＋寒热偏向」直接分流到汗、下、温、吐、针灸、饮食六条治疗通道，是全书少见的「一条条辨带出整套治法选择」的写法。","o":"RJ-2884 · 人纪·金匮要略·疟病脉证并治第四（PDF 第132页）"},{"t":"一、疟病总纲","h":"疟母：痰血结成的痞块与鳖甲煎丸","c":"疟病迁延不愈会结成块：「问曰：**疟病结为癥瘕，如其不差，当云何？师曰：此名疟母，急治之。以月一日发，当以十五日愈；设不差，当月尽解，宜鳖甲煎丸**。」讲义解释——疟病之后结成一块停在腹中的叫**疟母**；若发生在三焦淋巴系统可用小柴胡汤和解；只有**寒疟**才会聚结，热疟会四散不聚。关于主治方鳖甲煎丸（二十三味，含鳖甲、乌扇即射干、黄芩、凌霄、蛰虫、紫薇、蜂巢、蜣螂等），讲义有一句极重要的自述：**「我跟诸位讲过，我没有用过这个处方，用不到，用不到这个处方。因为当我们发现有疟母，如果真的有疟症的时候，你辩证按照症状来治，把痰去掉就好了。」** 讲义同时指出方中大量药（凌霄、紫薇、蜂巢、蜣螂）**不属经方用药**，怀疑此方非仲景原方。","o":"RJ-2885 · 人纪·金匮要略·疟病脉证并治第四（PDF 第135页）"},{"t":"二、三种疟的分型","h":"瘅疟：但热不寒，津血两伤","c":"「师曰：**阴气孤绝，阳气独发，则热而少气烦冤，手足热而欲呕，名曰瘅疟。若但热不寒者，邪气内藏于心，外舍分肉之间，令人消铄脱肉**。」讲义的解读分两步——**「阴气孤绝」的两条来路**：一是失津（被吐、下、汗使津液流光），二是亡血（血也不足）；此时「阳气独发」，所以**表面发热而实为虚热**。「手足热而欲呕」看似阳明，实为热闷在内所致。若邪气内藏于胃、外伏于肌肉关节之间，则**令人消铄脱肉**（越来越瘦）。治法上，讲义说临床必用**小柴胡汤**；若兼津伤，则**小柴胡汤加白虎**——这就是仲景的思路。讲义另把瘅疟的病位定性为「大部分停留在肠胃里面」。","o":"RJ-2886 · 人纪·金匮要略·疟病脉证并治第四（PDF 第136页）"},{"t":"二、三种疟的分型","h":"温疟：脉如平而但热，白虎加桂枝汤","c":"「**温疟者，其脉如平，身无寒但热，骨节疼烦，时呕，白虎加桂枝汤主之**。」方为知母六两、甘草二两（炙）、石膏一斤、粳米二合、桂枝三两。讲义的辨析极清楚：**温疟与瘅疟的区别在病位**——温疟「时呕、脉如平、身无寒但热、骨节烦疼」，是**热在肺**，故不觉在肠胃；瘅疟则发生在胃，故用小柴胡加白虎。温疟的病机是「本自太阳经热，后部分已入阳明成热，部分又入肺」。**加桂枝的道理**：桂枝主四肢，用枝是取其「到四肢末梢」之性（同理，用花蕾治鼻脑、用根茎治肠胃）。**剂量权衡**：太阳证少、阳明证多则加重白虎；脉浮则太阳证多，重用桂枝。","o":"RJ-2887 · 人纪·金匮要略·疟病脉证并治第四（PDF 第137页）"},{"t":"二、三种疟的分型","h":"牝疟：疟多寒者，蜀漆散与一处可疑的药味","c":"「**疟多寒者，名曰牝疟，蜀漆散主之**。」方为蜀漆（烧去腥）、云母（烧二日夜）、龙骨等分，为散，未发前以浆水服半钱。讲义指出这是**寒痰**所致——痰饮分寒热两种，抽烟或吸鸦片者多为热痰（浓稠黄胶），寒痰堵住则为牝疟。**蜀漆**（又名常山苗）祛痰力极强，服后浊痰整块咳出；**云母**烧两日夜去天然毒，取金石之阳，专主**中膈过寒引起的极度眩晕**（讲义强调：若中焦是水隔而非痰隔，苓桂术甘汤证；痰隔则苓桂术甘无效，必须用云母通利中膈）。**一处必须标出的可疑**：讲义说「这里的龙骨，实际上我认为是跟牡蛎弄错了，应该要用过牡蛎比较好」——理由是寒疟需咸味软坚打散胶痰，龙骨则偏于潜阳。此为讲师的个人校勘意见，非原文，须与经文分开看待。","o":"RJ-2888 · 人纪·金匮要略·疟病脉证并治第四（PDF 第137~138页）"},{"t":"三、贯穿全篇的两条原则","h":"无痰不疟：所有疟都有痰","c":"讲义反复申明一条原则：「**中医过去对疟证有一个观念，就是所有的疟都有痰**，临床上看到有往来寒热，无论是间日疟、隔日疟、一日疟都有，所以有句话叫做『**无痰不疟**』。」由此推出的处方原则是——**不论寒痰热痰，设计处方时通通都会加入祛痰的药**；因痰的位置不同，加入的祛痰药与配伍也随之区分。讲义举了一个自己的实例：一位病人心包被痰哽住，怎么咳都咳不出，呼吸时胸口痛，查又不是心脏病——用**桂枝汤加蜀漆龙骨牡蛎救逆汤**，蜀漆下去后立刻咳出「好大的一粒」痰，连出数颗，胸腔气闷四散而开。这一条把「疟」从「外感病」扩展成「外感＋痰结」的复合模型。","o":"RJ-2889 · 人纪·金匮要略·疟病脉证并治第四（PDF 第138页）"},{"t":"三、贯穿全篇的两条原则","h":"蜀漆与常山苗：一处药源替换的实情","c":"讲义交代了一处极具体的临床现实：「**临床上开处方时不能写蜀漆，写常山就可以了。蜀漆药房买不到，就用常山苗代替**」；但同时明确——「**其实蜀漆跟常山苗不一样，可是因为没有真正的蜀漆，所以现在都用常山苗取代它，实际上两者是不一样的药物**」。另补充一条药学史信息：**西医的奎宁即从常山提炼而来**。讲义还描述了蜀漆的性状与毒性：蜀漆是四川漆树的树皮，树皮黏性极强，「手才一出力手就打不开了，因为粘住了」，属很毒的药，须洗去腥味。这一组内容的价值在于：它把「书上写某个药、实际抓不到」这一古今皆有的困境说透了，并给出了替代路径与其代价。","o":"RJ-2890 · 人纪·金匮要略·疟病脉证并治第四（PDF 第138~139页）"},{"t":"四、补充方与针灸","h":"外台秘要三方：牝疟、劳疟、寒疟的替补","c":"讲义从《外台秘要》补入三方，理由是「补充前面这个比较含糊的地方，或是有些方子还没有出来」。**①牡蛎汤**（牡蛎四两熬、麻黄四两去节、甘草二两、蜀漆三两用常山苗代），治牝疟。**②柴胡去半夏加栝蒌汤**（柴胡八两、人参、黄芩、甘草各三两、栝蒌根四两、生姜二两、大枣十二枚），治疟病发渴者，亦治劳疟——劳疟指在外做劳力工作的人；讲义解释：往来寒热而**不呕**者，可去半夏、加栝蒌根，因有燥渴之象。**③柴胡桂姜汤**（柴胡半斤、桂枝三两、干姜二两、黄芩三两、栝蒌根四两、牡蛎三两熬、甘草二两炙），治疟寒多、微有热或但寒不热，「服一剂如神」。讲义给出一条实用退路：**若找不到蜀漆、云母（云母还要烧两天两夜），寒疟就用柴胡桂姜汤**——以干姜去中膈寒湿、牡蛎咸以软坚，若痰仍未尽，可加常山、天南星。","o":"RJ-2891 · 人纪·金匮要略·疟病脉证并治第四（PDF 第139~140页）"},{"t":"四、补充方与针灸","h":"治疟的针灸配穴与「合方」思路","c":"讲义在讲柴胡去半夏加栝蒌汤时顺带点出针灸路径：「**你如果配合针灸，我们前面介绍过，在针灸的时候有讲过，比如说我们曲池啊、外关啊、委中啊，都可以治疗疟疾**。」三穴分属手阳明（曲池）、手少阳（外关）、足太阳（委中），覆盖了疟病寒热往来的少阳层面与太阳层面。这一条与第一条「弦紧者可发汗、针灸也」互为呼应——**针与药在疟病上不是二选一，而是可并行**。讲义对疟病整体的态度也在此表明：温病家「看到什么病都是阴虚」，一见疟之往来寒热便用滋阴，这是方向性错误；正治应从脾胃着手，先把痰去掉。","o":"RJ-2892 · 人纪·金匮要略·疟病脉证并治第四（PDF 第139~140页）"},{"t":"五、附于篇末的方论","h":"四物汤四味：各司其职，不可一概而论","c":"疟病篇末附有四物汤讲解（当归、川芎、白芍、熟地）。讲义的核心观点是**四味分工完全不同，不能笼统称为「补血」**：**当归**有油脂、主**润肠**——血之源在食物，肠胃不好则血的源头断绝，故当归的作用是让肠胃功能恢复、间接生血；**川芎**主**活血**，能让血管结构变好，把肌肉组织间瘀血排掉（讲义举服阿司匹林、抗凝药者易瘀，用川芎可收血管）；**白芍**主**行血化瘀、破血**；**熟地**（色黑）才是四味中**真正补血**的药。**剂量随证而变**：脚冰、静脉曲张重者加重白芍；血亏、胃口差者加重熟地；头痛剧烈者加重川芎；血虚兼便秘者加重当归（「他很虚，大黄一下去更虚，用当归把大便通出来」）。这一段虽附于疟病篇，实为全书方论中讲「药性—剂量—加减」最透的一段。","o":"RJ-2893 · 人纪·金匮要略·疟病脉证并治第四（PDF 第141~142页）"},{"t":"一、\"不要去想象高血压会中风\"","h":"一篇讲中风的文章，开篇先把最主要的可控危险因素排除掉了","c":"风险——**第五篇讲中风，而讲义开篇就用两句话把\"高血压\"这个因素排除掉了，须照录并**逐条否定**。**原文**：\"**'这个呢，中风基本上的一个概念就是说，**人是在气血两虚的状态之下就会引发中风**，这是中医的观念'。'我们在讲中医的时候，**你不要去想去啊高血压会中风，不要去想这些**'。'一般高血压，老师，这个血压很高，怎么会虚啊？应该是实才对？**不对，都不要这样子去想**。**中医就是中医**'。'那西医讲的高血压中风——**如果有可以真的可以吃降血压药真的可以预防中风的话，那世界上没有人中风了嘛？**'。'你跑到医院去看，**很多人都是中风躺那边**——你问他**你在中风之前有没有吃西药？有啊，可是他照样中风**'。**\" **须说明（四层，逐条核）**：**①\"**高血压会中风**\"这个说法**是对的，而且是现代医学里最硬的一条**——**⚠ 收缩压每升高 10 mmHg，卒中风险约增加 30%**（**多国队列研究一致**）；**②⚠ 而\"**吃降压药不能预防中风**\"这一句**是错的**——**⚠ 多项大型随机对照试验显示，降压治疗可降低卒中风险约 **35%~40%****（**如 PROGRESS、SPRINT、ALLHAT**）——**⚠ 而这**不是\"个案观察\"，**是\"上万人的对照组数据\"**；**③⚠ 而\"**很多人中风前吃过西药，可是他照样中风**\"这个论证**在逻辑上不成立**（**⚠ 它忽略了\"吃了药的人\"与\"没吃药的人\"**卒中的发生率差多少**）——**⚠ 这一类\"我见过吃药也中风的人\"，**是**幸存者偏差**（**⚠ 因为**\"吃了药没中风的人\"**不会躺在医院里让你看见**）；**④⚠ 故本集的处置是**最高级警告**：**本段\"不要去想高血压\"与\"降压药不能预防中风\"两句，**属于必须明确否定的内容**（**⚠ 一个人若因此停药，**卒中风险会显著上升**（**尤其已有 TIA、房颤、糖尿病、吸烟史者**）；**⚠ 中风的危险因素里，**可干预的有**高血压、糖尿病、血脂异常、吸烟、房颤、肥胖、缺乏运动、高盐饮食**——**⚠ 而\"气血两虚\"**不在这一列里**（**它是\"证\"，**不是\"危险因素\"**）。** **⚠ 本集按语**：**这一段的**真正的价值**，是\"**气血两虚**\"这个\"证\"的描述**（**⚠ 一个人若长期乏力、面色淡、脉细弱，**确实提示要查贫血、心功能、营养**）——**⚠ 而\"气血两虚\"**不能取代\"量血压\"**（**⚠ 因为**血压高这件事**本身没有症状**（**\"沉默的杀手\"**）——**⚠ 故\"摸脉知中风\"，**替代不了\"量血压\"**。","o":"RJ-2894 · 人纪·金匮要略·中风历节病脉证并治第五（PDF 第143页）"},{"t":"二、中风的四级分层","h":"\"在络、在经、入腑、入藏\"——一段极准的严重程度梯度","c":"定义——**原文给了中风按**病位深浅**的四级分层，而这一层**是全书里与现代表现最吻合的一段**，须完整照录**：\"**'**邪在于络，肌肤不仁；邪在于经，即重不胜；邪入于府，即不识人；邪入于藏，舌则难言，口吐涎沫**'。**\" **讲义的点解**：\"**'若风邪只是停留在**络**上面，不在经上面，病人感觉到的是「**肌肤不仁**」——就是**麻木不仁感**'。'如果「**邪在于经**」到了血脉神经很深的地方，病人感觉到的是「**即重不胜**」——就是**四肢感觉到很沉重**'。'如果邪跑到**腑**里面去，主症是「**不识人**」——**邪进入脑部，影响记性，必不识人**'。'如果「**邪入于藏**」——藏是属于**心脏**这个部分，我们**藏神**的，**心开窍在舌**，「**舌则难言**」就是**讲不出话**，「**口吐涎沫**」'。**\" **须说明（四层）**：**①这四级**与今天的\"卒中严重度\"高度对应**：**麻木（感觉障碍）→ 肢体沉重（偏瘫）→ 意识障碍（不识人）→ 失语＋吞咽困难（口吐涎沫）** ——**⚠ 故它是**一个\"由浅入深\"的梯度**（**⚠ 而\"口吐涎沫\"这一层**极重要**：**它对应\"**吞咽功能受损、唾液不能咽下**\"**——**⚠ 而\"吞咽障碍\"**是**卒中后吸入性肺炎与窒息的主要原因**）；**②⚠ 而\"**邪入于府，即不识人**\"这一层**须标**（**\"不识人\"＝意识障碍/认知障碍**）——**⚠ 而**意识障碍**是**大面积梗死、脑出血、脑疝**的信号**（**⚠ 故\"不识人\"**是**急诊指征**，**不是\"慢慢调\"**）；**③⚠ 而\"**舌则难言**\"这一条**极准**（**失语症**）；**④⚠ 而\"**心开窍于舌**\"这个解释**是中医的藏象说**（**⚠ 而失语的现代机制是**左侧大脑中动脉供血区（Broca/Wernicke区）损伤**）——**⚠ 故\"心开窍于舌\"**可以当\"**语言与心（神）相关**\"的比喻读**，**不能当\"定位\"读**。** **⚠ 本集按语**：**这四句话**是这一篇最好的部分**（**⚠ 因为它**给出了一个\"从麻木到失语\"的严重度阶梯**（**⚠ 而**临床上的 FAST 筛查（Face 面瘫、Arm 上肢无力、Speech 言语障碍、Time 记时间）**，**恰好对应\"在络→在经→在藏\"**）——**⚠ 故这四级**可以当\"**家里人怎么判断\"**用**（**⚠ 而**判断之后的第一件事**，**是打 120**）。","o":"RJ-2895 · 人纪·金匮要略·中风历节病脉证并治第五（PDF 第145~146页）"},{"t":"三、\"中风先兆\"三条","h":"一份极有价值的预警清单，与它三个时间窗的对与错","c":"风险——**讲义列了**中风的三个先兆**，而这三条**各对了一半**，须逐条照录、逐条核**。**原文（三条先兆）**：\"**'中风有先兆。**第一个，**失眠**——这个失眠是**没有原因的失眠**，**家里面都很好、也没有人生病、也没有什么事情**……**任何事情都没有，就是睡不好**。**没有原因的失眠，持续半年，那一定中风**'。'第二个呢，**手麻**——**手前面三个指头麻**（**肺经跟心包经还有大肠经**），**代表大概三个月，三个月以内**，**有时候两个月就中风了**——**一般来说平均三个月之内就会有中风的机会**'。'第三个呢，**足胫骨麻**——就是在**足阳明胃经上面一路下来，从胃经的足三里下来到解溪的地方麻**——**这个是大概两个礼拜以内就会中风**'。**\" **逐条核对（三条）**：**①\"**没有原因的失眠，持续半年，一定中风**\"——**⚠ 这一条**不成立**（**失眠**不是卒中的预测因子**（**⚠ 而\"失眠\"**背后可能是**睡眠呼吸暂停（OSA）**（**⚠ 而 OSA **确实是卒中的独立危险因素**）——**⚠ 故\"失眠\"这一条**若要成立，**须改成\"**打鼾＋白天嗜睡＋夜间憋醒 → 查睡眠呼吸监测**\"**）；**②⚠ 而\"**手前面三个指头麻**\"这一条**对了一半**——**⚠ \"**麻木**\"确实是卒中的预警信号**（**⚠ 但它对应的是\"**TIA（短暂性脑缺血发作）**\"，**而 TIA 的特征是**\"**突发、短暂（数分钟至数小时）、单侧、可伴无力或言语障碍**\"**（**⚠ 而\"**拇指、食指、中指**\"这三指**是**正中神经的分布区**（**⚠ 故\"三指麻\"**在临床上最常见的病因**是**腕管综合征、颈椎病、糖尿病周围神经病**，**不是卒中**）；**③⚠ 而\"**三个月**\"这个时间窗**反而**接近对的**（**⚠ TIA 后 **7 天内**卒中风险约 **5%~10%**，**90 天内**约 **10%~20%**——**⚠ 故\"三个月\"**恰好是\"90 天\"**（**⚠ 而\"**两个礼拜**\"这一条**与 TIA 的\"7 天高风险期\"也接近** ✓）。** **⚠ 本集按语（须强调）**：**这一组\"先兆\"**最值得保留的是\"**麻木是一项预警**\"**（**⚠ 而最须改掉的是\"**等三个月看会不会中风**\"这个态度**——**⚠ 正确的处置是**：**凡\"突发、单侧、短暂的麻木或无力或言语不清\"，**立即急诊**（**⚠ 因为**TIA 是\"**卒中的最后一次警告**\"，**而它的处理窗口**是\"**小时**\"，**不是\"月\"**）；**⚠ 而\"长期的、双手的、夜间加重的手指麻\"，**查**腕管、颈椎、血糖**（**⚠ 不是\"等中风\"**）。","o":"RJ-2896 · 人纪·金匮要略·中风历节病脉证并治第五（PDF 第144~145页）"},{"t":"四、\"打麻将到海底捞卡二饼，当场昏过去\"","h":"一个极生动的\"卒厥\"画面，与情绪—卒中的真实关联","c":"要点——**讲义用两个具体的场景说明\"瞬间发生的中风\"，须照录**：\"**'有的人呢**突然发中风**——**有的人生气**……**爸爸跟女儿吵架，吵就一下中风下去**；或者**跟太太吵架**什么的，会有得中风'。'还有呢，**太兴奋**——**打麻将，海底捞卡二饼，她一摸到哇，当场人昏过去**；到急诊室**拉出来时候手还握着**，**打开来麻将牌还在里面**'。'这种就是**太亢奋的中风**，很多了，**也会中风**'。'这种就是**卒厥**，瞬间发生的'。'**可是瞬间发生这个事情，他如果气血很旺的人不会有瞬间发生的事**'。**\" **须说明（四层）**：**①\"**手还握着、打开来麻将牌还在里面**\"这个画面**极精**（**它把\"卒中\"写成了一个**动作被打断的瞬间**）——**⚠ 而这一层**极重要**（**卒中常常发生在\"情绪激动/用力\"的那一刻**）；**②⚠ 而\"**生气、吵架、太兴奋**\"与卒中的关联**是真实的**（**⚠ 应激可**升高血压、增加心率、促凝**（**⚠ 而\"**情绪激动后 2 小时内**\"**卒中风险确有升高**（**多项研究一致**）；**③⚠ 而\"**气血很旺的人不会有瞬间发生的事**\"这一句**须标**（**⚠ \"气血旺\"**没有可测的对应**（**⚠ 而真正能降低\"瞬间卒中\"风险的**，**是**控制血压、**戒烟、**治房颤**）——**⚠ 故这一层**是\"说法\"，**不是\"保护\"**；**④⚠ 而\"**卒厥**\"这个词**极准**（**\"卒\"＝突然，\"厥\"＝昏倒**）——**⚠ 而它**最接近的现代诊断**是**\"**突然意识丧失**\"**（**⚠ 而其原因**可能是**卒中、**心律失常、**肺栓塞、**低血糖、**癫痫**（**⚠ 故\"昏倒\"**第一步是**测血糖、**查心电图**）。** **⚠ 本集按语**：**这一段最值得记的，**是\"**情绪激动的那一刻，**是卒中的高发时刻**\"**（**⚠ 而它的实用推论**是：**家里有高血压的老人，**不要在他情绪最激动的时候**再争辩**（**⚠ 这不是\"劝人忍气\"，**是\"减少一个可避免的诱因\"**）。","o":"RJ-2897 · 人纪·金匮要略·中风历节病脉证并治第五（PDF 第145页）"},{"t":"五、\"超过一个月再找我们就没有用了\"","h":"一句会让病人放弃康复的话，与它必须纠正的两处","c":"风险——**讲义在这里说了两句极重的话，而它们**都会造成实际的伤害**，须照录并纠正**。**原文**：\"**'但是所有中风的病人，除了在经、在脉、在络上面的这类中风，**一年两年找中医治尚没有关系**'。'但是如果病情**入腑入脏**后，**已经半身不遂了、嘴巴讲不出话**，这种情形**一旦超过一个月后再找我们就没有用了**'。'可是**西医往往就让病家两三个月后再找我们**，这时**已经失去治病的时机**'。'而**这病是不会立即产生死亡的**，**因此造成许多病人长年卧榻的悲剧**'。**\" **须说明（四层，逐条纠正）**：**①\"**这病是不会立即产生死亡的**\"这一句**是错的，而且是**必须明确否定的**——**⚠ 脑卒中是中国居民**死亡的首位原因**（**每年约 200 万人死于卒中**）——**⚠ 而**大面积梗死、脑出血、脑疝**可在**数小时至数日内致死**（**⚠ 故\"不会立即死亡\"这个说法，**会让人**延误急诊**；**②⚠ 而\"**超过一个月再找我们就没有用了**\"这一句**须纠正**（**⚠ 卒中后**康复的黄金期是**3~6 个月**（**⚠ 而**一年以后**仍有**功能改善的空间**（**⚠ 故\"一个月后无用\"**会让病人**放弃康复**（**⚠ 而\"放弃\"**是卒中后抑郁与卧床并发症（肺炎、压疮、深静脉血栓）的主要原因**）；**③⚠ 而\"**西医往往让病家两三个月后再找我们**\"这一句**须标**（**⚠ 这是**对现代卒中流程的误解**（**⚠ 现代流程是**\"**急性期（0~7 天）在卒中单元监护 → 尽早（24~48 小时内）开始康复**\"**（**⚠ 而\"康复\"**不是\"等两三个月\"**）；**④⚠ 而\"**在络在经的中风，一年两年治尚没有关系**\"这一层**也有风险**（**⚠ 因为**\"在络在经\"**可能正是 TIA/小卒中**（**⚠ 而它们**是\"**下一次大卒中的预警**\"**（**⚠ 故\"没关系\"这三个字，**会让人**不去做二级预防**）。** **⚠ 本集按语（最高级警告）**：**这一段的**真正危险**在于它给出了一个**\"时间判断\"**（**\"一个月\"**）——**⚠ 而对卒中来说，**最要紧的是\"**小时**\"**（**⚠ 静脉溶栓窗 **4.5 小时**、**取栓窗可延至 24 小时**）——**⚠ 故任何\"**再等等看**\"**的建议**（**包括\"过一个月再说\"**）**在卒中面前**都是有害的**。","o":"RJ-2898 · 人纪·金匮要略·中风历节病脉证并治第五（PDF 第146页）"},{"t":"六、历节：尿酸结晶挤在骨头旁边","h":"一段与痛风高度吻合的描述，且点到了\"结晶\"","c":"要点——**讲义对\"历节\"成因的解释，**罕见地提到了\"尿酸结晶\"**，而这一层**与现代痛风高度吻合**，须照录**：\"**'现在讲的历节，它的起因中医认为是**肝肾两虚**——有一天**肾脏的新陈代谢功能不是很好**，它**没有办法把废物排泄出去**时，由于**水生木**，因此**所有的脏东西会因此而进入肝脏**'。'如果此时**肝脏本身又虚了**，脏东西到了肝里面等待分解时，**肝没有办法把它排出**，这个时候**脏的物质就会沉积在身体里面**，也就是所谓**尿酸沉积在身体里面**'。'逐渐的沉积日久以后，就会**囤积在骨头旁边**——因为**尿酸是呈结晶状**，**挤在骨头旁边当然会很痛**'。'痛起的时候，就感觉**脚好像放在油锅里面，烫而且肿**——那种**滚烫的感觉很痛**，**脚背也肿起**，常常发生在**脚背还有脚关节的地方**'。**\" **须说明（四层）**：**①\"**尿酸沉积、结晶状、挤在骨头旁边**\"这三层**全部正确** ✓（**痛风＝单钠尿酸盐结晶沉积在关节及周围组织**）——**⚠ 而\"**肝没有办法把它排出**\"这一层**须改**（**⚠ 尿酸主要经**肾脏（约 2/3）与肠道（约 1/3）排出**，**而肝脏是**生成尿酸的地方**（**嘌呤代谢**）**（**⚠ 故\"肝排不出\"**方向错了**）；**②⚠ 而\"**脚好像放在油锅里面，烫而且肿**\"这一句**极精**（**⚠ 这是**痛风急性发作最典型的描述**（**⚠ 而\"**烫、红、肿、剧痛、夜间发作、第一跖趾关节**\"**是**痛风的经典五联**）——**⚠ 而讲义提了**脚背、脚关节**，**方向对了**；**③⚠ 而\"**肝肾两虚 → 尿酸排不出**\"这个链条**里，\"**肾功能下降导致尿酸排泄减少**\"**是对的** ✓（**⚠ 而\"**水生木、脏东西进肝**\"**这一层**是五行推演**，**不是机制**）；**④⚠ 而\"**痛会持续两个礼拜以上，一般痛一个礼拜到两个礼拜慢慢就会消除**\"这一句（在下一段）**极准** ✓（**⚠ 痛风首次发作**多在**数日内至两周内自行缓解**）。** **⚠ 本集按语**：**这一段**是全书里\"中医描述与现代病理最接近\"的一处**（**⚠ 因为它**说到了\"结晶\"**（**⚠ 而\"结晶\"是一个**可观察的实体**（**⚠ 故\"历节\"**在痛风这一支上**是可以被验证的**（**⚠ 而它的**治法**（**利湿、通络、泄浊**）**与\"降尿酸\"**并不冲突**（**⚠ 但**急性期**的西药（**秋水仙碱、NSAIDs、激素**）**与降尿酸药（**别嘌醇、非布司他**）**不能被\"利湿通络\"替代**）。","o":"RJ-2899 · 人纪·金匮要略·中风历节病脉证并治第五（PDF 第163~164页）"},{"t":"七、\"一下热一下冷\"","h":"一段关于\"家务劳动怎么伤手\"的观察，极具体","c":"要点——**讲义对\"历节\"的成因给了一个**极生活化的解释**，而它**确有可核的对应**，须照录**：\"**'这个得到病的原因呢，跟**黄汗**一样**'。'过去我们有**黄芪苦酒汤**——**黄河旁边的那个渡船夫，太热了，天气太热，跳到水里面去，流汗了就跳到水里面去**，**历节在这里得到的**'。'**很多妇女呢，手出问题**——就是她过去呢，**我们没有洗衣机，用手去洗（衣服）**，**那一下热一下冷、一下热一下冷**'。'那**现代人呢，煮菜**——**一下冷水、一下热水**，**一下手放在烤箱里面，一下手放在冷水里面洗菜**，**寒热变化太快**，**这个就会造成历节的原因**'。**\" **须说明（四层）**：**①\"**一下热一下冷**\"这条观察**极准**（**⚠ 手部**反复冷热刺激**会**引起血管反复收缩舒张、局部循环紊乱**（**⚠ 而**长期如此**与**手部腱鞘炎、雷诺现象、关节劳损**的关联**是有据的**）；**②⚠ 而\"**洗衣妇、厨工**\"这两个人群**也极准**（**⚠ 这类职业的**手部劳损、腱鞘炎（\"妈妈手\"）、接触性皮炎**发病率确实高**（**⚠ 故这一条**是\"职业医学\"的雏形**）；**③⚠ 而\"**渡船夫跳进冷水**\"这个例子**与\"黄汗\"相连**（**⚠ \"黄汗\"在《金匮》里**是\"汗出沾衣、色如黄柏汁\"**（**⚠ 而它的机制**是\"**出汗后受冷，汗不得出**\"**（**⚠ 故\"**热汗遇冷**\"**是这两件事的共同点** ✓）；**④⚠ 而\"**寒热变化太快会造成历节**\"这一层**须标**（**⚠ 它**提示了一个**可避免的诱因**（**⚠ 而它**不能解释**所有的关节炎**（**⚠ 因为**类风湿、痛风、骨关节炎**各有各的机制**）。** **⚠ 本集按语**：**这一段**最实用**（**⚠ 因为它**给了一个\"能改的习惯\"**：**洗手、洗菜时用温水**（**⚠ 而这一层**极便宜、极简单**（**⚠ 故它**是全书里**少数\"立刻能做\"的建议**）。","o":"RJ-2900 · 人纪·金匮要略·中风历节病脉证并治第五（PDF 第164页）"},{"t":"八、\"历节分三种\"与三种的边界","h":"一个分类，与它对应的三个现代病","c":"定义——**讲义把\"历节\"相关的一类病分成三种，而三种**对应的现代病差别极大**，须照录并说明**：\"**'现在我们要进入历节。**历节这个症分为三种**：**第一种呢，我们叫**风痹**；**第二个呢，我们称之为**血痹**；**第三个就是**历节**'。'**中医有中医的名称，对照西医来说可能就是类风湿性关节炎、一般的风湿关节炎**'。'**血痹**——就是**很顽固的麻**，有的麻十几年都在麻，**黄芪五物汤专门治疗麻的症状**——**麻是非常不易被治好的**，而这是**血痹特有的症状**，也就是**血虚**'。**\" **须说明（四层）**：**①三分法**在原文里**是清楚的**：**风痹（风邪为主、游走性疼痛）、血痹（以麻为主、血虚）、历节（关节变形疼痛、深入筋骨）**——**⚠ 而**现代对应**分别是**：**风痹 ≈ 早期关节炎/风湿性多肌痛；血痹 ≈ 周围神经病（含腕管、糖尿病）、雷诺；历节 ≈ 类风湿、痛风、骨关节炎****；**②⚠ 而\"**历节 ≈ 类风湿性关节炎**\"这个对应**须标**（**⚠ \"类风湿\"**有**明确的自身抗体（RF、抗CCP）与对称性小关节破坏**（**⚠ 而\"历节\"**可以包含痛风（**单关节、第一跖趾、尿酸高**）、**骨关节炎（**负重关节、骨赘**）、**反应性关节炎**（**⚠ 故\"历节\"**是一个\"证\"，**不是\"一个病\"**）；**③⚠ 而\"**血痹用黄芪五物汤**\"这一条**极重要**（**黄芪桂枝五物汤**是\"**血痹**\"的正方**（**⚠ 而它的方义是\"**补气行血、温通经脉**\"**（**⚠ 故\"**麻**\"**用\"**补气活血**\"**，**思路是通的**）；**④⚠ 而\"**麻是非常不易被治好**\"这一句**极诚实**（**⚠ 周围神经病的恢复**确实慢**（**⚠ 而它的**第一步是**查明原因**（**糖尿病、B12 缺乏、甲减、酒精、药物、颈椎/腰椎**）——**⚠ 因为**\"病因可治\"比\"症状可治\"更要紧**）。** **⚠ 本集按语**：**这个三分法**最有用的是\"**麻**\"与\"**痛**\"的区分**（**⚠ 因为**\"麻\"指向神经**（**⚠ 而\"痛\"指向关节/软组织**）——**⚠ 故问诊时**一句\"**你是麻还是痛**\"，**方向就分开了**。","o":"RJ-2901 · 人纪·金匮要略·中风历节病脉证并治第五（PDF 第163~164页）"},{"t":"九、\"气血两虚\"这个模型，能解释什么、不能解释什么","h":"一个\"证\"与一个\"危险因素\"的区别","c":"要点——**把第五篇的核心模型（\"气血两虚→中风\"）与现代的\"危险因素\"并列，可以说清\"证\"与\"因\"的区别，须列清**。**\"气血两虚\"能解释的（两条）**：**①\"**虚\"的人**耐力差、易疲乏、面色淡、脉细弱**——**⚠ 这些**确实提示**贫血、心功能不全、营养不良、慢性病**（**⚠ 而这些**都需要查**）；**②⚠ 而\"**血虚→肢体麻木、抽筋、无力**\"**确有对应**（**⚠ 如**B12 缺乏性周围神经病、**贫血性乏力**）。**\"气血两虚\"不能替代的（四条）**：**①**血压**（**⚠ \"虚\"的人**也可以高血压**（**⚠ 而高血压**多数无症状**）；**②**血糖**（**⚠ 糖尿病**是**卒中等危因素**）；**③**血脂**（**⚠ 动脉粥样硬化**的底子**）；**④⚠ 房颤**（**⚠ 心源性卒中的主要原因**（**⚠ 而它**需要**抗凝**，**不是\"补气\"**）。**须说明（三层）**：**①故\"**气血两虚**\"**是一个\"证\"**（**⚠ 它描述的是\"人的状态\"**（**⚠ 而\"**高血压**\"**是一个\"危险因素\"**（**⚠ 它描述的是\"一个可测的数\"**）；**②⚠ 而两者**不是\"二选一\"**（**⚠ 一个人**可以既\"气血两虚\"又\"高血压\"**（**⚠ 故\"辨证\"与\"量血压\"**应并行**）；**③⚠ 而**最要紧的一句**是**：**\"**气血两虚**\"**若不查明原因**（**贫血？心衰？肿瘤？**），**它本身**就是一个需要解释的结果**（**⚠ 而\"**补气补血**\"**若不做检查**，**可能掩盖**（**如**消化道出血、**缺铁性贫血、**骨髓问题**）。** **⚠ 本集按语**：**\"**气血两虚**\"这四个字**最容易被当成\"结论\"**（**⚠ 而它**其实是一个\"问题\"**（**⚠ 问的是**：**你为什么虚？**（**⚠ 而这个问题**有答案**（**⚠ 故\"补\"**之前，**先问\"为什么虚\"**）。","o":"RJ-2902 · 人纪·金匮要略·中风历节病脉证并治第五（PDF 第143~146页）"},{"t":"一、\"尊荣人\"：一个七百年前的\"久坐＋营养过剩\"画像","h":"\"骨弱肌肤盛\"——全篇最准的一个病因描述","c":"定义——**《金匮》给\"血痹\"的来源下了一个极具体的定义，而它**与今天的\"代谢综合征\"高度吻合**，须照录**：\"**'问曰：**血痹病从何得之**？'。'师曰：**夫尊荣人，骨弱肌肤盛**——**重因疲劳汗出，不时动摇，加被微风，遂得之**'。'但以脉自微涩，在寸口、关上小紧；**宜针引阳气，令脉和，紧去则愈**'。**\" **讲义的点解**：\"**'「**尊荣人**」就是家里面**养尊处优的有钱人**，他只在乎如何享受——结果「**骨弱，肌肤盛**」：**骨头很弱，肌肤很盛，因为他缺少运动**'。'**很有钱的人过去没有什么劳力工作要做，都有仆人帮他做，所以骨头比较弱**；**肌肤比较盛，因为他吃得很丰盛**——**身体比较胖**'。'**人很胖，骨头很小**……**一个很胖的人，骨头很小**'。'**一般来说，你运动，在中医的观念里面，从这里看出来，运动绝对对身体是好的——人是动物，你就要动**'。'**那你不动的话，养尊处优的话，非常容易得到病**'。**\" **须说明（四层）**：**①\"**骨弱肌肤盛**\"这五个字**极精**（**它说的是\"**肌肉脂肪多、骨骼与肌力弱**\"**）——**⚠ 而这一组在现代有一个名字**：**\"**肌少性肥胖（sarcopenic obesity）**\"**（**⚠ 即\"体重正常或偏高，而肌肉量与肌力不足\"**）——**⚠ 故这段描述**跨越七百年仍然准确** ✓；**②⚠ 而\"**尊荣人**\"这个画像**也极准**（**\"有人伺候、少动、吃得好\"**）——**⚠ 而今天**这个画像**不再只属于\"有钱人\"**（**⚠ 久坐办公、外卖、电梯、代步**，**使\"尊荣人\"成了**多数城市人的常态**）；**③⚠ 而\"**人是动物，你就要动**\"这六个字**是**全册最朴素的一句健康建议**（**⚠ 而它**不需要任何理论**（**⚠ 而它**恰好是\"气血两虚\"（见第 n39 条）**最便宜的解法**）；**④⚠ 而\"**疲劳汗出、不时动摇、加被微风**\"这三层**须标**（**讲义把它解作\"行房后流汗当风\"**）——**⚠ 这是**古代的读法**（**⚠ 而它的**合理内核**是**\"**出汗后受凉**\"**（**⚠ 而这一层**与\"**热汗遇冷**\"（见第 n39 条历节）**是同一个模型**）。** **⚠ 本集按语**：**\"**骨弱肌肤盛**\"这五个字，**值得**当作一张\"体检单\"**看**（**⚠ 它问的是**：**你的肌肉够不够？**（**⚠ 而这个问题**在今天是**能量化的**（**握力、步速、体成分**）——**⚠ 故这一段**不需要\"信\"，**只需要\"量\"**。","o":"RJ-2903 · 人纪·金匮要略·血痹虚劳病脉证并治第六（PDF 第176页）"},{"t":"二、\"痹就是麻木\"与一个精确的鉴别","h":"血痹只麻不痛，痹证麻痛并见","c":"定义——**原文与讲义都给\"痹\"下了一个极简的定义，而讲义附的\"评按\"给了一处**精确的鉴别**，须照录**。**讲义原文**：\"**'**痹的定义就是麻木，没有感觉**'。'痹就是麻木，**有点麻木皮肤的时候，在皮肤上有麻木的时候，我们针灸就可以帮他**'。**\" **评按（极重要）**：\"**'血痹系指**卧出而风吹之，血凝于肤者为痹**（《素问·五藏生成篇》）——**与风寒湿所致痹证不同**'。'**血痹以肌肉麻痹无痛感；痹证则麻痛并见**'。**\" **须说明（四层）**：**①\"**血痹以肌肉麻痹无痛感，痹证则麻痛并见**\"这一句**极准**（**⚠ 它把\"麻\"与\"痛\"**分成了两个维度**（**⚠ 而这**恰好对应**两个不同的病理**：**麻＝感觉神经/血供**；**痛＝关节/软组织/炎症**）——**⚠ 这一层**与第 n39 条\"血痹（麻）/历节（痛）\"的分法**完全一致 ✓**；**②⚠ 而\"**痹的定义就是麻木**\"这一层**须标**（**\"痹\"在古汉语里**本义是\"**闭塞不通**\"**（**⚠ 故\"痹\"**可以指\"麻木\"，**也可以指\"疼痛\"**（**⚠ 而《金匮》在这里**把它限定了**）；**③⚠ 而\"**宜针引阳气，令脉和，紧去则愈**\"这一条**极重要**（**它说\"轻的血痹，**针灸就行，**不用吃药**\"）——**⚠ 而\"**针引阳气**\"这个说法**对应\"**促进局部循环**\"**（**⚠ 而\"**局部循环改善**\"**对\"麻木\"**确实有效**（**如：**腕管综合征的物理治疗**）；**④⚠ 而本集的处置是**：**\"麻\"这个症状，**第一步是**分清\"**哪一条神经/血管**\"**（**⚠ 而它的方向**有四个**：**颈椎/腰椎（根性）、腕管/肘管（卡压）、糖尿病（代谢性）、脑血管（中枢性）**）——**⚠ 而这四个方向**治法完全不同**（**⚠ 故\"凡麻皆血痹\"**会误事**。** **⚠ 本集按语**：**\"**麻\"与\"痛\"**这两个字，**在问诊时**一定要分开问**（**⚠ 因为**\"麻\"**指向\"感觉通路\"，**\"痛\"**指向\"组织损伤\"**（**⚠ 而**混着问**，**两个方向**都会丢**。","o":"RJ-2904 · 人纪·金匮要略·血痹虚劳病脉证并治第六（PDF 第176~177页）"},{"t":"三、黄芪桂枝五物汤：桂枝汤去甘草、加黄芪、重用生姜","h":"一张\"改一味、改一量\"的方，与它为什么要这样改","c":"方法——**原文给了血痹的正方，而讲义把它**三处改动**的理由讲清了，须照录**：\"**'**血痹，阴阳俱微，寸口关上微，尺中小紧，外证身体不仁，如风痹状——**黄芪桂枝五物汤主之**'。**\" **方（原文）**：\"**黄芪三两，芍药三两，桂枝三两，生姜六两，大枣十二枚**。右五味，以水六升，煮取二升，温服七合，日三服**\"**。**讲义的展开（三处改动）**：\"**'**黄芪桂枝五物汤的处方，就是把**桂枝汤里面的甘草拿掉、改成黄芪**——同样是桂枝汤，你把甘草拿掉、换成黄芪，就叫做黄芪桂枝五物汤**'。'这个处方的重点就是**黄芪、芍药、桂枝是等量，生姜要加重**'。'**如果只加两片，就没有效了，麻还是会照麻**——生姜**加重到五片、六片**，很辣'。'**这是因为要利用「辛甘发散为阳」，才能够让黄芪的药力从肠胃发散到四肢上去**'。'**黄芪走表**——所以**皮肤麻木不仁的时候，只要病人出现麻木不仁，大家都可以想到要用黄芪**'。'**桂枝汤之所以要有桂枝白芍，就是要增加脾脏的功能**——**脾脏的功能强起，气血就会兴盛**'。**\" **须说明（四层）**：**①这张方**只有两处改动**（**去甘草、加黄芪**）＋**一处加量**（**生姜三两 → 六两**，**翻倍**）——**⚠ 故它是\"**最小改动\"的示范**（**⚠ 而\"生姜重用\"这一层**极重要**：**它是\"**引药到表**\"的剂量手段**）；**②⚠ 而**生姜六两**这个数**可核**（**原文\"生姜六两\"**，**而桂枝、芍药、黄芪各三两**）——**⚠ 故\"生姜是桂枝的两倍\"**（**⚠ 而\"只加两片没效\"**这一层**是讲义的临床经验**（**不是原文**）；**③⚠ 而\"**去掉甘草**\"这一处**极妙**（**⚠ 甘草**在桂枝汤里是\"**调和诸药、守中**\"**（**⚠ 而去掉它**，**是为了\"**不守中、专走表**\"**）——**⚠ 故\"去甘草\"**是\"**让药力往外走**\"**（**⚠ 而这一层**与\"重用生姜\"**是**同一个方向**：**往外、往表**）；**④⚠ 而\"**桂枝白芍增加脾脏功能**\"这一层**须标**（**⚠ 它是**藏象说**（**⚠ 而\"**桂枝汤\"的现代解释**是\"**调节自主神经、改善末梢循环**\"**（**⚠ 而两者**都要有\"证\"才对得上**）。** **⚠ 本集按语**：**这张方**最值得学的是\"**改动的方向**\"**（**去守中的、加走表的、加量引经**）——**⚠ 而它**同时提醒**：**\"同一个方，**改一味药、改一个量**，**治的病就不同**\"**（**⚠ 故\"**方\"不是\"药名\"，**是\"结构\"**。","o":"RJ-2905 · 人纪·金匮要略·血痹虚劳病脉证并治第六（PDF 第177页）"},{"t":"四、\"把脾胃强壮起来，让病人感觉饿\"","h":"一段极好的\"补虚观\"，与它第三次出现","c":"要点——**讲义在这一段说清了\"经方怎么补虚\"，而这是**全册第三次说同一件事**（**前两次见第 n36 条\"六个补虚缺点\"、第 n38 条\"活的树涂油漆\"**），须照录**：\"**'**伤寒论里经方的正治法，**一般是不赞成给病人吃太多的补药**——除非是病人很虚弱，我们才会给他；**否则的话我们都不会给病人补药**'。'**我们宁可将病人的脾胃强壮起，让病人感觉饿、可以吃，然后让他的肠胃能够吸收食物，这是最好根治补虚的方法**'。'所以**黄芪桂枝五物汤吃下去后胃口会开**——**胃口一开、吃了食物，血就被补足了**'。**\" **须说明（四层）**：**①\"**让病人感觉饿**\"这五个字**极精**（**⚠ 它把\"补虚\"的目标**定在\"**恢复食欲**\"**（**而不是\"给营养\"**）——**⚠ 而这一层**极重要**（**因为**\"能吃\"**是**\"能活\"最直接的指标**）；**②⚠ 而\"**这是最好根治补虚的方法**\"这一句**极重**（**⚠ 它把\"补\"从一个\"动作\"变成了一个\"**结果**\"**（**⚠ 即：**脾胃强 → 能吃 → 血自生**（**⚠ 而\"血自生\"**不需要\"补血药\"**）；**③⚠ 而这一条**与前面两次**完全一致 ✓**（**n36：\"我们会开阳的药，让他阴自回\"**；**n38：\"活的树涂油漆会死\"**；**本处：\"让脾胃强壮，让他饿\"**）——**⚠ 故这是**这本讲义里**最稳定的一个观点**（**⚠ 而**它是对的**（**⚠ 因为**\"营养吸收\"**确实是\"气血\"的来源**）；**④⚠ 而\"**胃口一开、吃了食物，血就被补足了**\"这一句**须标**（**⚠ 它**忽略了一件事**：**\"能吃\"不等于\"能吸收\"**（**⚠ 如**慢性萎缩性胃炎、**胰腺外分泌不足、**短肠综合征**（**⚠ 故\"能吃却不长\"**的人**要查吸收**）。** **⚠ 本集按语**：**\"**让病人感觉饿**\"这个标准，**极朴素、也极好用**（**⚠ 一个恢复期的病人，**若开始觉得饿，**就是好转的最早信号**（**⚠ 而它**比任何\"指标\"**都早**（**⚠ 故\"**今天想吃什么**\"这个问题，**在查房时**比\"舌苔如何\"**更实在**）。","o":"RJ-2906 · 人纪·金匮要略·血痹虚劳病脉证并治第六（PDF 第177~178页）"},{"t":"五、舌诊三段的方向，与通行相反","h":"一处必须标出的可核错误，而它已是第二次出现","c":"风险——**讲义在讲\"热在上焦\"时，给了**舌诊三段的定位**，而它与通行的舌诊**恰好相反**，须照录并核**。**原文（讲义）**：\"**'**我们将舌头分成三段看：**舌头最里面就是**上焦**，**舌头的中央是**中焦**，**舌尖的部位就是**下焦**'。'如果你**舌头最里面黄黄的**，就代表**上焦有热**；如果是**中间黄黄的**，就是**中焦有热**；如果黄苔出现又厚又黏，就是**湿热重症**；如果是**舌头前面的舌苔很黄厚**，就是有**湿热在下焦**'。'这个湿热在下焦，很可能就是**膀胱炎、尿道炎，或者是肛门痔疮**等等'。**\" **复核（两步）**：**①**通行舌诊的定位**（**《中医诊断学》与临床通例**）为：**舌尖 → 心肺（上焦）；舌中 → 脾胃（中焦）；舌根 → 肾/下焦**；**②⚠ 而讲义的三段是**舌根（最里面）→ 上焦；舌中 → 中焦；舌尖 → 下焦**——**⚠ 即**上焦与下焦对调了**。** **须说明（四层）**：**①故这是一处**可核的错误**（**⚠ 而它**不是\"流派差异\"**（**因为**舌的解剖位置与脏腑的对应，**在古今主流文献里是一致的**（**⚠ 故\"舌尖主下焦\"**没有依据**）；**②⚠ 而这一处错**已在本集出现过一次**（**第 n30 条，人纪学生案例里的\"舌尖主下焦、舌根主上焦\"**）——**⚠ 故这是**第二次**（**⚠ 而这说明**这个错**不是笔误**，**而是**这本讲义（或它的底本）**系统性的一个错**（**⚠ 故**凡按此读舌，**上焦与下焦的判断**会全部颠倒**）；**③⚠ 而它的**实际后果**很具体**：**一个\"舌尖红\"（心火）**的人，**按此读成\"下焦热\"**（**⚠ 而治法**从\"清心\"变成\"清下焦\"**（**⚠ 方向就反了**）；**④⚠ 而本集的处置是**：**照录其说**，**明确标为错误**，**并给出通行标准**（**舌尖心肺、舌中脾胃、舌根肾**）。** **⚠ 附一处**极重要的正面知识**（**同段）**：\"**'**脉诊中的**寸、关、尺**也是代表**上、中、下焦**的不同位置**'。'如果你摸到一个病人的脉，**寸脉跳得很数，但是尺脉却摸不到**，这就表示病人是**下寒上热**——知道病人有下寒，我们就要开**去下寒的药，像附子、细辛**'。'上热我们就要开去热的药，**把去上热的药和去下寒的药合并**在一个处方中，**就是治上热下寒最好用的处方**'。**\" **——⚠ 这一层**是对的** ✓（**寸关尺配三焦，**是通行说法**（**⚠ 而\"**上热下寒**\"**用\"**寒热并用**\"**（**附子＋清热药**），**是经方的常法**）。","o":"RJ-2907 · 人纪·金匮要略·肺痿肺痈咳嗽上气病脉证治第七（PDF 第210~211页）"},{"t":"六、肺痿的四个来源","h":"四条路径，全部指向\"津液没了\"","c":"定义——**原文给了\"肺痿\"的四个来源，而四条**全部指向同一个结果**，须完整照录**：\"**'问曰：**热在上焦者，因咳为肺痿**——肺痿之病，从何得之？'。'师曰：**或从汗出，或从呕吐，或从消渴、小便利数，或从便难、又被快药下利——重亡津液，故得之**'。**\" **讲义逐条解释（四条）**：\"**'**第一种**：热在上焦，是因为**汗发掉以后，热没有去，还是停留在肺中，日久就造成肺痿**'。'**第二种**：『或从呕吐』——**吐太多，土不及生金，使得中焦津液丧失**——**肺的津液源是靠中焦给的**'。'**第三种**：『或从消渴』——**水喝下去就从小便出来，人体根本不吸收，当然没有办法把水气化给肺**——**简单讲就是肺的源头没了**'。'**第四种**：『或从便难，又被快药下利』——**本就大便很难、津液不足了，结果医师没看到病人是因为津液不足而便秘，于是选用承气汤攻下**'。**\" **须说明（四层）**：**①这四条**有一个共同的名字**：**\"**重亡津液**\"**（**⚠ 而\"重\"字**读 zhòng（严重地）或 chóng（反复地）**，**两读都通**）——**⚠ 故\"肺痿\"**在《金匮》里**的定位是**\"**津液耗竭所致的肺虚**\"**；**②⚠ 而\"**肺的津液源是靠中焦给的**\"这一句**极重要**（**它把\"肺\"的滋养**归到了\"脾胃\"**（**⚠ 而这与\"培土生金\"**是**同一条路**）——**⚠ 故\"**补水**\"**不是\"喝水\"**，**是\"**让脾胃把水变成津液**\"**；**③⚠ 而\"**吐太多、土不及生金**\"这一层**极准**（**⚠ 反复呕吐**确实导致**脱水、电解质紊乱、误吸**（**⚠ 而**慢性呕吐**（如**幽门梗阻、**神经性呕吐**）**确实是\"津液耗竭\"的典型**）；**④⚠ 而\"**消渴、小便利数**\"这一条**极准**（**⚠ 糖尿病（消渴）**的**多尿 → 脱水**是**真实存在的**（**⚠ 而\"**肺痿\"若对应\"糖尿病引起的消瘦与呼吸肌无力**\"，**方向是对的**）。** **⚠ 本集按语**：**这四条**合起来是一句话**：**\"**津液从哪里丢的，**肺就从哪里枯**\"**（**⚠ 而它**给了一个极实用的提醒**：**长期呕吐、长期多尿、长期腹泻、过度发汗**这四种人，**都要\"补液\"**（**⚠ 而\"**补液\"**是最便宜的医学**）。","o":"RJ-2908 · 人纪·金匮要略·肺痿肺痈咳嗽上气病脉证治第七（PDF 第210~211页）"},{"t":"七、\"渴了就赶快用白虎汤\"","h":"一条\"防转肺痈\"的截断法，与它的分寸","c":"方法——**讲义在这一段给了一条**极具体的\"截断\"操作**，须照录**：\"**'当病人本就有大便难的问题，然后「**又被快药下利**」——就是**本就大便很难、津液不足了，结果医师没看到病人是因为津液不足而便秘，于是选用承气汤攻下**'。'攻下去以后，**如果病家津液自己流回胃中，就不会有口渴现象**'。'**如果病人口渴，代表说病人津液丧失了**——这时**赶快用白虎汤，去帮助病人补足所丧失的津液**'。'**如果你不及，是隔了一个礼拜去看他，这时病人就可能转成肺痈了**'。**\" **须说明（四层）**：**①\"**渴 → 白虎汤**\"这个对应**在经方里是对的吗？**——**⚠ 部分对**（**白虎汤（石膏、知母、粳米、甘草）**确实**治\"大热、大汗、大渴、脉洪大\"**（**⚠ 而\"**口渴\"**只是四证之一**（**⚠ 故\"**只凭口渴就用白虎汤**\"**不对**）；**②⚠ 而\"**津液自己流回胃中，就不会渴**\"这一层**有意思**（**⚠ 它把\"**口渴\"当成\"**津液是否恢复**\"的标志**（**⚠ 而这**确实**是一个**可观察的指标**）；**③⚠ 而\"**隔一个礼拜就可能转成肺痈**\"这一层**须标**（**⚠ \"肺痈\"（肺脓肿）**的成因是**感染（细菌、误吸、血源播散）**（**⚠ 而\"**脱水\"**本身**不会\"变成\"肺脓肿**（**⚠ 故\"**一周成痈**\"**是一个**叙述性说法**）；**④⚠ 而这一段的**合理内核**是**：**\"**脱水会让呼吸道分泌物变稠、纤毛清除功能下降**\"**（**⚠ 而这一层**确实增加了肺部感染的风险**（**⚠ 故\"**脱水 → 肺部感染风险↑**\"**是对的**（**⚠ 而\"**脱水 → 肺脓肿**\"**是夸大了**）。** **⚠ 本集按语**：**\"**渴了就补液**\"这条思路**极朴素**（**⚠ 而它**在家庭护理里**立刻可用**（**⚠ 而\"**白虎汤**\"**须有\"**大热大汗大渴脉洪大**\"**才用**（**⚠ 故\"**口渴**\"**不该单独成为用药依据**）。","o":"RJ-2909 · 人纪·金匮要略·肺痿肺痈咳嗽上气病脉证治第七（PDF 第211页）"},{"t":"八、\"很多肺炎都是医师失治造成的\"","h":"一句须一分为二的归因，与它必须剔除的部分","c":"风险——**讲义把\"肺炎\"的成因归到\"医师失治\"，并由此推出一串结论，须照录并逐层拆**：\"**'**很多现在所谓的肺炎，就是我们这里讲的肺痈，其实都是因为**医师失治**才造成的问题**'。'**肺炎就是因为感冒没有好、拖延时日才引发的**'。'**如果一个人得到感冒，碰到我们经方家，一剂汤药就可以解决**——但是也只有我们经方家可以做得到'。'**如果现在到处都是经方家的话，大家这辈子就再也遇不到肺炎的病人**'。'**一个医院或诊所看病，应该是病人越看、病就越轻才对，哪有说越看、病越多？病情变得越重？**'。**\" **须说明（四层）**：**①\"**感冒拖延可引发肺炎**\"这一层**部分对**（**⚠ \"**流感后肺炎**\"（病毒性肺炎、继发细菌性肺炎）**确实存在**（**⚠ 尤其**老人、幼儿、慢病患者**）——**⚠ 故\"**别把感冒拖成肺炎**\"**这个提醒是对**的**；**②⚠ 而\"**肺炎都是医师失治造成的**\"这一句**须明确否定**（**⚠ 肺炎的病因是**病原体**（**肺炎链球菌、流感嗜血杆菌、支原体、病毒、真菌**）**（**⚠ 而**很多肺炎**是**\"直接发生\"的**，**没有\"感冒前驱\"**（**⚠ 故\"**失治**\"**不是主因**）；**③⚠ 而\"**到处都是经方家，就再也遇不到肺炎**\"这一句**须明确否定**（**⚠ 抗生素时代之前，**肺炎是**主要死因**（**⚠ 而**抗生素使肺炎死亡率大幅下降**——**⚠ 这是\"病原体被抑制\"的功劳，**不是\"方证更准\"**（**⚠ 故\"**用经方就不会有肺炎**\"**与医学史相反**）；**④⚠ 而\"**病人越看越多、病情越重**\"这一层**须标**（**⚠ 它是对现代医学的**误解**（**⚠ 现代医学处理的是**老龄化、慢病、肿瘤、创伤**（**⚠ 而\"**病越看越多**\"**恰恰是\"**人活得更久**\"的结果**（**⚠ 故\"**看病人数增加 ≠ 医学无效**\"）——**⚠ 而**同一段里\"西医希望每个人都要有一张病床，这不是笑话是什么\"**属于**对同行的情绪攻击**，**本集一律剔除**（**⚠ 因为它**不含任何可核的信息**）。** **⚠ 本集按语**：**这一段**可保留的只有一句**：**\"**感冒没好在拖，会拖出肺炎**\"**（**⚠ 而它的正确版本是**：**\"**流感/感冒后若出现持续高热、气促、胸痛、咳脓痰，**要查胸片**\"**（**⚠ 因为**肺炎**需要**抗生素**）。","o":"RJ-2910 · 人纪·金匮要略·肺痿肺痈咳嗽上气病脉证治第七（PDF 第211~212页）"},{"t":"九、肺痿、肺胀、肺痈：三个定义的边界","h":"三个病名各抓住一个可观察的特征","c":"定义——**讲义用三句话把这一篇的三个病名分开了，而这三句**各对应一个现代病**，须照录并核**：\"**'中医的观念里面，什么叫做肺痿？肺痈？**如果我这样讲，你就一目了然了**'。'这个「**痿**」就是**萎缩了**，叫做痿——**也就是肺脏萎缩掉**'。'所谓「**肺气胀**」，就是**胀到一直是在吸气的状态之下**——**无论是吸气或是呼气，肺都是胀在那边、不会变大与缩小**，这就是**肺胀**'。'**肺痈就是肺里面已经化脓**'。'大致上可以区分为这**三大系统**，处方也只有几个而已'。**\" **须说明（四层）**：**①\"**肺痿＝肺脏萎缩**\"这一条**极准**（**⚠ 它对应**肺纤维化、肺不张、间质性肺病晚期**（**⚠ 而\"**肺痿\"的原文表现是\"**咳唾涎沫、脉虚数**\"**（**⚠ 故\"**萎缩\"**是**影像与病理的对应**）；**②⚠ 而\"**肺胀＝胀在那边、不会变大缩小**\"这一条**极准**（**⚠ 它对应**COPD 的肺过度充气（桶状胸、膈肌低平、残气量增加）**（**⚠ 而\"**吸气呼气都胀着**\"**恰好是\"**气体陷闭**\"**）；**③⚠ 而\"**肺痈＝肺里面化脓**\"这一条**极准**（**⚠ 它对应**肺脓肿**（**⚠ 典型表现**：**咳大量脓臭痰、高热、胸片见空洞伴液平**）**（**⚠ 故\"**痈**\"这个字**用得极准**（**\"痈\"＝化脓性感染**）；**④⚠ 而\"**处方也只有几个而已**\"这一句**极诚实**（**⚠ 而这一篇的方**（**苇茎汤、桔梗汤、皂荚丸、射干麻黄汤、麦门冬汤、葶苈大枣泻肺汤**）**确实只有**七八个**（**⚠ 故\"**病名多、方少**\"**是这一篇的特点**（**⚠ 而**方少**不等于**覆盖全**（**如**肺脓肿需要**引流＋抗生素**（**⚠ 而\"**苇茎汤**\"**替代不了**）。** **⚠ 本集按语**：**这三个名字**各抓住了一个\"可观察的特征\"**（**萎缩、胀、化脓**）——**⚠ 而\"**各抓一个特征**\"**是最好的命名方式**（**⚠ 因为它**不需要理论**，**只需要看**（**⚠ 故这三个词**比\"阴阳\"**更好用**（**⚠ 而它们**恰好**对得上今天的影像学**）。","o":"RJ-2911 · 人纪·金匮要略·肺痿肺痈咳嗽上气病脉证治第七（PDF 第210页）"},{"t":"一、一套完整的水循环模型","h":"从\"心移热于小肠\"到\"大肠的水回到肺\"","c":"定义——**第八篇开篇用一段极完整的推演，说明了\"水在体内怎么走\"，须照录**：\"**'这是肚脐，我们叫**神阙**——**小肠呢，是火；大肠呢，是金**；最上面呢，这是**肺，肺也是金**；这是**心脏，也是火**'。'**心脏不断的跳动**……**心会移热于小肠**，这都是《黄帝内经》讲的'。'**当小肠火很盛的时候**，我们食物吃下去有两种水：**第一个，喝的水**——你不管喝开水、喝茶，都是这样，**喝的水到了胃以后就气化掉了**，因为水它直接就是水，所以**蒸化得很快**'。'**还有一种水，是在食物里面**……**饭里面一定有水**……**食物里面的水，会在胃里面咀嚼了以后到了小肠**——**小肠里面很热，因为有火**，这个火再把小肠蒸化一次，代表说**你把食物消化掉了**'。'消化掉以后**变成糟粕跟水**……**水跟糟粕进入大肠以后，小肠的火在下面烧，这个水就气化出来**——**所以水会从大肠再回到肺里面去**，因为**金（大肠）和金（肺）是相通的**'。**\" **须说明（四层）**：**①这套模型**有五个环节**（**心 → 小肠（火）→ 胃（气化饮水）→ 小肠（蒸化食中之水）→ 大肠 → 肺**）——**⚠ 而它的**核心驱动**是\"**小肠的火**\"（**⚠ 故\"小肠温度\"**是整套水液代谢的**枢纽**）；**②⚠ 而这一层**与现代生理有一半吻合**（**⚠ 胃确实吸收水；**小肠确实吸收大部分水；**结肠确实吸收剩余水分**）——**⚠ 而\"**水从大肠到肺**\"这一层**须标**（**⚠ 现代：结肠吸收的水**经门静脉入肝 → 体循环**（**⚠ 而\"**肺与大肠相表里**\"**是**中医的藏象配对**（**⚠ 故\"**水到肺**\"**应读作\"**水液上承、散布周身**\"**，**而不是\"**解剖上的管道**）；**③⚠ 而\"**小肠在管脚的温度**\"（在下一段）**这一层**极重要**（**⚠ 它把\"**脚冷**\"**与\"**小肠温度**\"接上了**（**⚠ 而\"**脚冷**\"**在临床上确实是**外周循环与心输出量的一个指标**（**⚠ 故\"**摸脚\"**是一个**便宜、可重复的观察**）；**④⚠ 而\"**西医只知道大肠吸收水，那大肠那么聪明啊**\"这一句**是**情绪化表达**（**⚠ 而它的**合理内核**是\"**大肠不是主动选择，而是被动渗透/吸收**\"**（**⚠ 本集保留其观察、剔除其嘲讽**）。** **⚠ 本集按语**：**这套模型**最值得记的是\"**火在上面烧、水从下面升**\"这个画面**（**⚠ 而它**对应的是一个**极真实现象**：**体温（核心温度）驱动水液蒸发与转运**（**⚠ 而\"**小肠温度不足 → 水不气化 → 下痢**\"**这一层**在\"**腹泻**\"上**确实有对应**（**如**肠道菌群失调、**消化酶不足、**乳糖不耐**）——**⚠ 故这一段**是\"模型\"，**不是\"机制\"**（**但它**推出的结论**常常对得上**。","o":"RJ-2912 · 人纪·金匮要略·奔豚气病脉证并治第八（PDF 第237页）"},{"t":"二、\"肺癌一定会下痢\"，与\"治好了怎么知道\"","h":"全册推理最完整的一处：模型 → 预测 → 验证","c":"要点——**讲义从上面那套水循环模型**推出一个具体结论**，而这个结论**带一个可观察的验证指标**，须照录**：\"**'**我请问你，如果肺里面有实、有东西挡到**——**肺是阴脏**……**肺家有阴实的症的时候，东西堵到，水是不是上不去？**'。'**就会回头回到大肠里面去，所以肺癌一定会下痢**'。'这个你不用去记，**想就知道了**，有没有道理？'。'那你把他治得——**你说老师，我怎么知道他好了？很简单嘛，下痢没了嘛，commonsense**'。**\" **须说明（四层）**：**①这一段**是全书里**唯一一处完整的\"模型 → 预测 → 验证\"链条**（**⚠ 模型：**肺主水之上源**；**预测：**肺有实则水不下行、反从大肠出 → 下痢**；**验证：**下痢消失＝肺实已去**）——**⚠ 而这一层**极重要**（**⚠ 因为它**给了一个\"疗效判据\"**（**⚠ 而\"**判据\"**是**任何医学**都必须有的东西**）；**②⚠ 而\"**肺癌一定会下痢**\"这一句**须标**（**⚠ 肺癌的常见症状是**咳嗽、咯血、胸痛、气促、消瘦**（**⚠ 而\"下痢\"**不是肺癌的典型表现**（**⚠ 故\"**一定**\"这两个字**过头了**（**⚠ 但\"**肺癌病人出现腹泻**\"**确实可见**（**⚠ 原因包括**肿瘤相关腹泻、**化疗/靶向药副作用、**肠道转移、**菌群改变**）——**⚠ 而这些**与\"水道不通\"**无关**）；**③⚠ 而\"**想就知道了**\"这一句**极有感染力**（**⚠ 它示范了\"**用模型推结果**\"的思维方式**（**⚠ 而这种思维**在\"**有明确机制**\"的领域**是对的**（**⚠ 在\"**机制不明确**\"的领域**就会出错**）；**④⚠ 而\"**commonsense**\"这个词**用在这里**极准**（**⚠ 它说的是\"**这是常识**\"**）——**⚠ 而**常识的价值**在于\"**可以被检验**\"**（**⚠ 故\"**下痢没了**\"**确实**是一个**可检验的指标**（**⚠ 而\"**下痢没了**\"**不等于\"**肺癌好了**\"**（**⚠ 因为**肿瘤缩小**要靠影像**）。** **⚠ 本集按语**：**这一段**最值得留的**是它的**结构**（**⚠ 而它的**内容是**\"待核\"的**（**⚠ 故本集的处置是**：**保留这个\"模型—预测—验证\"的推理样式**，**并标注\"肺癌的标准评估是影像与病理，不是下痢的有无\"**。","o":"RJ-2913 · 人纪·金匮要略·奔豚气病脉证并治第八（PDF 第237~238页）"},{"t":"三、\"脚是冷的\"与\"小肠的温度\"","h":"一条把\"脚温\"当指标的说法，与它可摸的部分","c":"要点——**讲义把\"脚的温度\"与\"小肠的温度\"接了起来，而这一层**在临床上有可摸的部分**，须照录**：\"**'那你哪一天，小肠的温度不够了——**我有时候（问）小肠的温度为什么不够？因为心脏的力量不够了，所以温度下降**'。'温度下降以后，**这个水就没有办法气化**，那**水跟糟粕就出来了**——**是不是就下痢了？**'。'中医把它**定义成寒**——**不然你告诉我要怎么讲？只有这个「寒」字最传神**'。'那你老师怎么知道它寒？**因为小肠在管脚的温度嘛，所以脚是冷的**'。'**那你脚寒到一定的程度**——老师我脚是冷的，但是我还没有下痢，**那你只是一点点寒**；**很严重的寒的话就会下痢了**'。**\" **须说明（四层）**：**①\"**脚冷 → 小肠温度不足 → 水不气化 → 下痢**\"这条链**有三段**（**⚠ 而只有第一段**（**脚冷**）**是可摸的**（**⚠ 故它是\"**一条可观察的链头**\"**）；**②⚠ 而\"**脚冷**\"**在临床上的意义**是**真实的**（**⚠ 它提示**外周循环差、**心输出量下降、**甲减、**贫血、**雷诺、**糖尿病周围血管病**（**⚠ 故\"**脚冷**\"**是一个**值得查的信号**（**⚠ 而不只是\"寒\"**）；**③⚠ 而\"**只有这个「寒」字最传神**\"这一句**极诚实**（**⚠ 它承认**\"寒\"是一个**\"描述性标签\"**（**而不是\"机制\"**）——**⚠ 故\"**寒**\"**在中医里**常常是**\"一组表现的名字\"**（**⚠ 而\"**名字**\"**与\"**原因**\"**是两件事**；**④⚠ 而\"**一点点寒**\"与\"**很严重的寒**\"这个分级**极实用**（**⚠ 它给了一个**\"程度\"的概念**（**⚠ 而\"**程度**\"**是任何医学都要分的**（**⚠ 故\"**脚冷但不拉**\"**vs**\"**脚冷而且拉**\"**是两个阶段**（**⚠ 而**第二阶段**要**查原因**（**不是\"再补一点\"**）。** **⚠ 本集按语**：**\"**脚是冷的**\"这三个字**是**全段最实在的一句**（**⚠ 因为**它**不需要辨证**（**只需要摸**）——**⚠ 而**一个老人若长期脚冷、走不远**，**第一步是**查下肢动脉（踝肱指数）**（**⚠ 因为**下肢动脉硬化**与**冠心病**是**同一件事的两个部位**（**⚠ 故\"**脚冷**\"**可能**是心脏的\"**另一张嘴**\"。","o":"RJ-2914 · 人纪·金匮要略·奔豚气病脉证并治第八（PDF 第238页）"},{"t":"四、\"越练口水越多，否则你练错了\"","h":"一个能自我验证的练功判据，极难得","c":"方法——**讲义给了\"为什么练腹式呼吸\"的解释，并附了一个**可以自己验证的判据**，须照录**：\"**'那我们**为什么要练功夫**——**吸气进去要到腹式呼吸**：因为**吸气进去以后，到了腹式的话，就是想尽办法把心火往下导，导到小肠里面去**'。'当**心火进入小肠**以后，**小肠的温度会增加**；增加以后，**大肠里面的水会气化上来到肺里面去，然后再到喉咙里面去**'。'所以**你在练功夫、打坐或者是练气的时候，越练津液是不是越多？口水的津——口水会越来越多**'。'你如果练了半天，**口水、嘴巴越来越干，你练错了**——你来找我，重新帮你修正一下'。'**要练，越练口水越多才对**'。**\" **须说明（四层）**：**①\"**越练口水越多**\"这个判据**极难得**（**⚠ 因为**它**可以被自己检验**（**⚠ 而\"**口水多**\"**对应**副交感张力升高、**唾液腺分泌增加**（**⚠ 而这**确实是**\"放松\"的一个生理标志** ✓）；**②⚠ 而\"**腹式呼吸 → 把心火往下导**\"这个解释**有一个现代对应**（**⚠ 腹式呼吸**确实**增加迷走神经张力、**降低交感张力、**改善心率变异性**（**⚠ 故\"**心火往下导**\"**可以读作\"**让上焦的紧张降下来**\"**）；**③⚠ 而\"**练错了**\"这个判断**极重要**（**⚠ 它给了\"**练功**\"一个**可以失败的标准**（**⚠ 而**有失败标准的练习**，**才可能被改进**（**⚠ 故\"**口水变干**\"**是一个**明确的负面反馈**（**而**它**是**真的**：**张口呼吸、过度换气**会让口腔干燥**）；**④⚠ 而\"**心火 → 小肠 → 大肠 → 肺 → 喉咙**\"这一整条**是**那套水循环模型**的延续**（**⚠ 故它**把\"练功\"**也纳进了\"水气化\"这个框架**（**⚠ 而这一层**值得记的是\"**练功要练到'润'，不是练到'燥'**\"** ✓）。** **⚠ 本集按语**：**这一段**是全册里**最\"可操作\"的一处**（**⚠ 因为**它给了一个**\"你练对了没有\"的自测**（**⚠ 而**这类自测**在养生领域**极少见**（**⚠ 故\"**越练口水越多**\"**这六个字，**比一百句\"气沉丹田\"**有用**。","o":"RJ-2915 · 人纪·金匮要略·奔豚气病脉证并治第八（PDF 第238页）"},{"t":"五、\"四部病，都由惊发\"","h":"一句把四种病归到\"受惊\"的说法","c":"定义——**原文把四种病归到同一个起因，须照录**：\"**'所以，**病有奔豚，有吐脓，有惊怖，有火邪**——这**四部**，这种病呢，**都是由惊发得到的**——**受到惊吓**'。'你一受到惊吓的时候，**心脏会跳得很快**，对不对？'。'（奔豚者），**从少腹起，上冲咽喉，发作欲死，复还止，皆从惊恐得之**'。**\" **须说明（四层）**：**①\"**奔豚**\"这个名字**极形象**（**\"奔\"＝奔跑，\"豚\"＝猪**）——**⚠ 它描述的是\"**一股气从少腹往上冲，像小猪在跑**\"**（**⚠ 故\"**奔豚**\"**是一个**\"感觉的描述\"**（**⚠ 而它的现代对应**可能是**\"**腹主动脉搏动感增强**\"、\"**胃肠胀气上冲**\"、\"**惊恐发作时的躯体感觉**\"**）；**②⚠ 而\"**四部都由惊发**\"这一层**极重要**（**⚠ 它把四种看似无关的病**归到了一个\"**情绪触发**\"**）——**⚠ 而\"**惊恐 → 心悸 → 气上冲**\"**这条链**在**惊恐发作（panic attack）**里**确实**是**典型表现** ✓**（**心悸、胸闷、窒息感、头晕**）；**③⚠ 而\"**吐脓**\"与\"**火邪**\"**归到\"惊\"**，**则**不成立**（**⚠ \"吐脓\"＝肺脓肿/支气管扩张**（**⚠ 而\"**火邪**\"＝热病**（**⚠ 两者**都有明确的病因**（**感染/热）**；**④⚠ 而原文的\"**皆从惊恐得之**\"这一句**在《金匮》里**是**针对奔豚的**（**⚠ 而讲义**把它扩到了四部**（**⚠ 故本集**只把\"惊→奔豚\"**这一条**记为成立**（**⚠ 其余三条**记为\"旧说\"**）。** **⚠ 本集按语**：**\"**奔豚**\"**这个证的**真正价值**，**不在\"猪跑\"这个比喻**，**而在它**承认了一件事**：**有些\"身体症状\"是由\"情绪\"直接触发的**（**⚠ 而这一层**在今天是**有名字的**（**\"**躯体化**\"、\"**惊恐发作**\"**）——**⚠ 故\"**奔豚**\"**可以当**\"古代对惊恐发作的描述\"**读**（**⚠ 而**它的治法**（**桂枝加桂汤、奔豚汤**）**是否有效**，**要看\"**是不是那个证**\"**。","o":"RJ-2916 · 人纪·金匮要略·奔豚气病脉证并治第八（PDF 第238页）"},{"t":"六、三处痛，三个\"膜\"","h":"一段\"症状—解剖位置\"的对应，极清楚","c":"定义——**第九篇开篇把\"心脏附近的痛\"按**位置**分成了三种，而三种**各对应一个解剖结构**，须照录**：\"**'如果这个病原体进入我们的**横膈系统**——如果是**横膈膜受到感染而发炎**的时候，西医就叫做**横膈膜炎**；而中医看到横膈膜炎的症状，用的形容词是「**逆抢心**」——**从胸胁部位往心脏里面痛**'。'如果这个病毒跑到**胸腔中间**时，这个地方叫做**纵膈膜**……**纵膈膜有发炎**的时候，病人会感觉到**痛在胸腔的正中央**，会出现「**心痛彻背，背痛彻心**」的特殊痛感**'。'还有一种是**心囊发炎**——心囊就是**心的外膜**，中医称为**心包**，西医叫**心囊**……这外膜一旦感染到炎症时，这种问题所引发的症状就是「**悬心痛**」'。**\" **须说明（四层）**：**①这三组对应**极清楚**：\n\n| 原文证名 | 讲义所指部位 | 痛的位置 |\n|---|---|---|\n| 逆抢心（胁下逆抢心） | 横膈膜 | 从胸胁往心 |\n| 心痛彻背、背痛彻心 | 纵膈膜 | 胸腔正中央，前后贯穿 |\n| 悬心痛 | 心包（心囊） | 心前区，持续集中一处 |\n\n**——⚠ 故它是**一个\"**按位置分证**\"的示范**（**⚠ 而\"**位置**\"**是最容易问、最容易核的一层**）；**②⚠ 而这一层的**价值**在于**：**它把\"心口痛\"**分成了**三种可描述的类型**（**⚠ 而**今天的分法**（**心绞痛、心包炎、主动脉夹层、食管痉挛、肋软骨炎**）**也是按\"位置＋性质\"分的** ✓；**③⚠ 而\"**心痛彻背、背痛彻心**\"这八个字**极重要**（**⚠ 它是**\"**前后贯穿的痛**\"**（**⚠ 而这**恰好**是**主动脉夹层的典型描述**（**⚠ 也可见于**急性心梗、**急性胰腺炎**）；**④⚠ 而\"**悬心痛**\"这一条**须标**（**\"**持续集中在一处、痛起会心慌**\"**）——**⚠ 而\"**心包炎**\"的典型是**\"**坐位前倾时痛减、平卧时痛重**\"**（**⚠ 故\"**位置＋体位**\"**才够分**。** **⚠ 本集按语**：**这一段**最值得记的**是\"**按位置分**\"**这个方法**（**⚠ 而**它的正确用法**是**\"**先问在哪，再问什么性质**\"**（**⚠ 因为**\"**在哪**\"**能立刻缩小范围**（**⚠ 而\"**什么性质**\"**才能定病因**）。","o":"RJ-2917 · 人纪·金匮要略·胸痹心痛短气病脉证并治第九（PDF 第248页）"},{"t":"七、\"张仲景并不去管它\"","h":"一句\"只辨症状、不辨病因\"的自我说明，与它必须补的一课","c":"风险——**讲义明确说了\"仲景不管病因\"，而这一层**在绝大多数病上可行、在少数病上致命**，须照录并标**：\"**'**这些中医在处方时都无所谓**——或者是**心痛彻背、背痛彻心**，对西医说可能是**有脂肪或是瘀血块堵塞在动脉血管里面**，也可能是**主动脉血管破裂了**——**张仲景并不去管它**'。'**我们中医是依照病人的症状开立处方**'。'所以如果病家的心脏出现**持续的痛、而且集中在一处痛、痛起会心慌慌的**，这就是**心包炎**'。**\" **须说明（四层）**：**①\"**依照症状开方**\"这一层**在中医内部是自洽的**（**同证同方**）——**⚠ 而它**有一个前提**：**不同的病因，**不能表现成同一个证**（**⚠ 而这个前提**不成立**）；**②⚠ 而\"**主动脉血管破裂了**\"这六个字**极危险**（**⚠ \"**主动脉夹层**\"**的典型是**\"**突发的、撕裂样的胸背痛**\"**（**⚠ 而它**可以在**数分钟内致死**（**⚠ 故\"**不管它**\"**在这里**等于**放弃了一个**可救的急症**）；**③⚠ 而本例**最要紧的一句**是**：**\"**心痛彻背、背痛彻心**\"**在《金匮》里**是**\"**胸痹**\"**（**⚠ 而在今天**它**首先**要排除**急性心梗与主动脉夹层**（**⚠ 故\"**同一个症状，**两种处置**\"**（**⚠ 而这**不是\"中西医之争**\"，**是\"**先救命、后治病**\"**）；**④⚠ 而本集的处置是**最高级警告**：**凡\"**突发撕裂样胸背痛 ＋ 血压双臂不等 ＋ 脉搏不对称**\"**，**立即急诊**（**⚠ 这是**主动脉夹层的典型**（**⚠ 而\"**按症状开方**\"**会耽误**（**⚠ 所以**这一段**必须**加一句\"**先排除致命病因**\"**。** **⚠ 本集按语**：**\"**只辨症状**\"**这个方法**有一个**明确的适用边界**：**当\"**不同的病因**\"**确实**会\"**表现成同一个证**\"**时，**只辨证**就会漏**（**⚠ 而\"**胸痛**\"**正是**最典型的例子**（**⚠ 因为**心梗、夹层、肺栓塞、气胸、食管破裂**都能\"**痛在胸口**\"**（**⚠ 故\"**胸痛**\"**是最不能\"**只辨症状**\"**的一个症状**。","o":"RJ-2918 · 人纪·金匮要略·胸痹心痛短气病脉证并治第九（PDF 第248~249页）"},{"t":"八、\"一息五至为正常\"","h":"一套可数的脉率分级，与它对应的\"生死\"","c":"数据——**讲义给了一套**极具体的脉率分级**，而它**可以数**，须照录**：\"**'**脉当取太过与不及**——我们脉呢，**一息四至、五至**'。'这个「**一息**」**不是病人的一息，是医生的一息**——**你在摸病人的时候，不是看他呼吸**……**要依据你的呼吸**'。'所以一息：**你的一呼一吸，病人的脉跳五下，这个做标准**'。'**到七（下），到三（下）**——这个呢，**慢慢加快、加速，就是热**'。'**到了八下以后、到十下，就是凶**——**快死掉了**'。'**当你三下以后，掉到了两下、掉到一下**——**这个一下、两下之间呢，就已经死症了**'。'**到这个九下、十下之间呢，都是死症**'。**\" **须说明（四层）**：**①\"**一息五至**\"这条**有一个极重要的技术细节**（**⚠ 它明确\"**以医生的呼吸为准**，**不是病人的**\"**）——**⚠ 而这一层**极精**（**⚠ 因为**病人的呼吸频率**会因病情而变**（**⚠ 而用病人的呼吸**算脉率**会失真**）——**⚠ 故\"**以医者之息为准**\"**是一个**朴素的标准化的努力** ✓；**②⚠ 而**换算**：**一息五至 ≈ 每分钟 60~80 次**（**⚠ 成人静息心率正常为 60~100**）——**⚠ 故\"**五至为正常**\"**与通行标准吻合 ✓**；**③⚠ 而\"**七至→热；八至到十至→凶/死**\"这一层**须标**（**⚠ 七至 ≈ 84~100 次**（**⚠ 而\"**心率快**\"**确实**提示**发热、失血、心衰、甲亢、感染**（**⚠ 而**十至 ≈ 120 次**（**⚠ 而\"**静息心率 >120**\"**确实是**危重信号**（**⚠ 故这个分级**方向是对的**（**⚠ 只是\"**死症**\"**要按\"**当时的条件**\"读**）；**④⚠ 而\"**三至以下→死症**\"这一层**须标**（**⚠ 三至 ≈ 36~48 次**（**⚠ 而\"**严重心动过缓**\"**可以是**三度房室传导阻滞、**病态窦房结**（**⚠ 而**这些**今天**可以**装起搏器**）。** **⚠ 本集按语**：**这一套**最值得学的是\"**把脉变成可数的数**\"**（**⚠ 而\"**数**\"**一旦可数，**就可以**比较**（**⚠ 故\"**七下变八下＝变坏，七下变六下＝变好**\"**（见下条）**是一个**真正的\"可追踪指标\"**（**⚠ 而**这类指标**在整本书里**极为稀少**。","o":"RJ-2919 · 人纪·金匮要略·胸痹心痛短气病脉证并治第九（PDF 第250页）"},{"t":"九、\"五下一止是五年，十下一止是十年\"","h":"一个不成立的算法，与它里面那条真的判据","c":"风险——**讲义给了\"代脉\"（早搏/停搏）的分级与一个**寿命推算**，须照录并核**：\"**'还有一个呢，是**结脉**——这个脉来的时候，**好像有绳子在上面打结**……你摸上去的时候，**一结一结的**，有个动动动动——**结脉**。这种呢，**都是心脏都有问题的**'。'**不及呢，代脉**——比如说，**它跳跳、停停，跳跳、停停**'。'那在《黄帝内经》它就下定义了：**我们允许心脏跳五十四下停一下，这是正常**'。'所以你摸到病人「你这个脉怎么会停一下」——**五十四下以上停一下是常态**'。'你如果**每五下一止，很准时**——**在《黄帝内经》的定义就是说：你的心脏还可以用五年**；**那十下一止呢，就是还可以用十年**'。'所以我们看到这个心痛胸痹的时候，我们基本要有这个概念'。'那本来是十下一止，**吃了你的药以后变成五下一止、或两下一止——就心脏不好了**'。'那你吃了，**十下一止变成十五下一止、二十下一止，到五十四下一止**——**可以了，你不用（再吃药）了，你好了**'。**\" **须说明（四层，逐条核）**：**①\"**结脉＝像绳子打结**\"、**\"代脉＝跳跳停停**\"这两个描述**极准** ✓（**⚠ 现代：**早搏（期前收缩）**在脉上**确实**表现为\"**一次提前、一次代偿间歇**\"**）——**⚠ 故这两个名字**用得极形象**；**②⚠ 而\"**五十四下一止是常态**\"这一层**可核**（**⚠ 54 次心跳出现 1 次早搏 ≈ 每分钟 1 次以内**（**⚠ 而\"**偶发早搏**\"**在健康人中**确实常见**（**⚠ 故这一条**方向是对的** ✓）；**③⚠ 而\"**五下一止＝五年、十下一止＝十年**\"这个算法**不成立**（**⚠ 早搏的频率**与**寿命**之间**没有这种线性关系**（**⚠ 早搏的预后**取决于**有没有结构性心脏病、**心功能、**早搏负荷（>10% 有风险）**（**⚠ 故\"**五年/十年**\"**是一个**没有依据的算术**（**⚠ 而它**会让一个\"五下一止\"的人**以为自己只剩五年**）；**④⚠ 而\"**十下一止 → 十五 → 二十 → 五十四下一止＝好了**\"这一条**却是**真的** ✓（**⚠ 因为**早搏减少**确实**是**一个**可观察的疗效指标**（**⚠ 而这**恰好**是**这一段里**唯一\"可追踪\"的东西**（**⚠ 故本集的处置是**：**保留\"早搏频率变化＝疗效指标\"**（**⚠ 删除\"十年/五年\"的寿命推算**）。** **⚠ 本集按语**：**这一段**是**\"好观察 + 坏推论\"**的典型**（**⚠ 前半**（结脉、代脉、五十四下一止）**是**准的**（**⚠ 后半**（五年、十年）**是**编的**（**⚠ 而**两者被写在同一段里**（**⚠ 故**读者最容易把\"准的观察\"**当成\"支持那个不成立的推论\"的依据**（**⚠ 这一层**是整本书最需要警惕的一种结构**。","o":"RJ-2920 · 人纪·金匮要略·胸痹心痛短气病脉证并治第九（PDF 第250~251页）"},{"t":"一、\"按之不痛为虚，痛者为实\"","h":"六个字的腹诊诀，与它对应的两种治法","c":"方法——**原文给了判\"腹满\"虚实最直接的一条方法，而它只有六个字**，须照录**：\"**'**病者腹满，**按之不痛为虚，痛者为实，可下之**'。'**舌黄未下者，下之黄自去**'。**\" **讲义的展开**：\"**'**我们按他肚子，病人有**拒按**现象就是**实症**——**实者可下**'。'实症的病人**舌头一定是黄的**；「未下者」就是**没有攻下之前的舌头一定是发黄的**——**下了以后大便清出、肚子里面宿便被清除后，黄色的舌苔就会退掉**'。**\" **须说明（四层）**：**①\"**按之不痛为虚、痛者为实**\"这六个字，是**全书最简的\"腹诊\"判据**（**⚠ 而它**可操作**（**只需要一只手**（**⚠ 故它**是\"不需要仪器\"的诊断里最硬的一条**）；**②⚠ 而\"**拒按**\"这个反应**极准**（**⚠ \"**痛而拒按**\"**在临床上确实是**\"**有实邪（炎症、积滞、脓肿）**\"**（**⚠ 而\"**痛而喜按**\"**对应**\"**虚（痉挛、缺血、空腔脏器）**\"**（**⚠ 故\"**喜按/拒按**\"**是一个**极有信息量的问诊**）；**③⚠ 而\"**舌黄＝宿便**\"这一条**须标**（**⚠ \"**舌苔黄**\"**在中医里**代表\"**热**\"，**而\"**宿便**\"只是\"**热**\"的一种**（**⚠ 故\"**见黄苔就攻下**\"**会误**（**⚠ 如**感染性发热、**肝胆病、**口腔卫生差**都能黄苔**）；**④⚠ 而\"**可下之**\"这三个字**须限定**（**⚠ \"可下\"**不等于\"**该下**\"**（**⚠ 而**它要求**\"**有可下之证**\"（**⚠ 故**原文**紧跟着说\"**舌黄未下者**\"**（**⚠ 即：**舌黄 ＋ 腹满 ＋ 拒按**三者俱全**才\"可下\"**）。** **⚠ 本集按语**：**\"**按一按**\"这个动作**在日常护理里**极有用**（**⚠ 一个腹痛的人，**你是\"**按下去他会躲**\"还是\"**按下去他反而舒服**\"**（**⚠ 这一条**能立刻分开**\"**要急诊**\"与\"**可以观察**\"**（**⚠ 而\"**拒按 ＋ 发热 ＋ 腹硬**\"**是**腹膜炎的信号**（**⚠ 故\"**按之痛者为实**\"**在今天是**\"**立即就医**\"**）。","o":"RJ-2921 · 人纪·金匮要略·腹满寒疝宿食病脉证并治第十（PDF 第278页）"},{"t":"二、\"去按天枢穴\"","h":"一个具体的触诊点，与\"怎么按\"","c":"方法——**讲义把\"按哪里\"说清了，而这一层**在原文里没有**，须照录**：\"**'那你手去按他的肚子的时候，**不要鸡同鸭讲**——你按了半天，他肚子很大，**他按在旁边、没有压到重点**'。'我们去查到底是虚实的时候，**我们就按天枢穴**——所以**针灸要很熟**：天枢、中脘、下脘、关元，**尤其天枢你按按**'。'你按到他，**按下去，他没有感觉到、他不难过**——'医生你多按按，没有关系'——**这个就是虚，里面没有东西**'。'你按到他**非常痛、不要按**——**那拒按的现象，就是实**'。**\" **须说明（四层）**：**①\"**不要鸡同鸭讲**\"这一句**极精**（**⚠ 它点出了一个真实的临床问题**：**病人的\"肚子\"与医生的\"手\"，**没有对上一个\"标准点\"**（**⚠ 故\"**定位**\"**比\"**用力**\"**更重要**）；**②⚠ 而\"**天枢**\"这个选点**极准**（**⚠ 天枢**在**脐旁二寸**（**腹直肌外缘**）——**⚠ 而它**恰好是**\"**结肠（升、降结肠）的体表投影**\"**（**⚠ 故\"**按天枢最痛**\"**提示**\"**结肠里有东西**\"**（**⚠ 而这一层**与\"**宿便**\"**是**同一条线** ✓）；**③⚠ 而\"**中脘、下脘、关元**\"这一组**也极准**（**⚠ 它们**是**腹中线上的三个点**（**上腹、中腹、下腹**）——**⚠ 故\"**按哪一段痛**\"**就能**大致分出\"**病在哪一段**\"**；**④⚠ 而\"**按下去他很舒服、还想让你多按**\"这一条**极精**（**⚠ 它是**\"**虚**\"**最直观的判据**（**⚠ 而\"**喜按**\"**在临床上**确实**提示**\"**空腔脏器痉挛、缺血、虚弱**\"**（**⚠ 故\"**想让你多按**\"**比\"**痛不痛**\"**更有信息**）。** **⚠ 本集按语**：**这一段**最值得记的是\"**有标准点**\"**（**⚠ 而它**在家庭里也能用**：**按肚脐两边**（**天枢**）**和**肚脐正中上下**，**问\"哪里最不舒服\"**（**⚠ 而**答案**能帮医生少走几步**（**⚠ 而**它**不能替代影像与化验**）。","o":"RJ-2922 · 人纪·金匮要略·腹满寒疝宿食病脉证并治第十（PDF 第279页）"},{"t":"三、\"第三碗再喝下去，就太过了\"","h":"一个极好的\"停药标准\"，与它背后的分寸","c":"方法——**讲义用\"大承气汤三碗\"的例子说明了\"何时该停\"，而这一层**极重要**，须照录**：\"**'**攻完了以后，再看看舌苔**——还是黄的就需要再攻，**直到舌苔黄都退掉了，就该停止**'。'**如果再攻就太过了，会伤到正气，所以不可以乱攻的**'。'**就是说有大承气汤三碗，喝了第一碗之后，如果舌头还是黄的，就再喝第二碗；第二碗喝完舌苔变淡白了，就是已经好了**'。'结果你认为「**倒掉好可惜，这个药那么好**」——于是**将第三碗再喝下去，这就太过了**'。'**过与不及都不好，中医是讲究中庸的医学**'。**\" **须说明（四层）**：**①\"**舌苔变淡白就是好了**\"这一条**极具体**（**⚠ 它给了**一个\"**停药的观察点**\"**（**⚠ 而\"**停药标准**\"**是**任何治疗**都必须有的**（**⚠ 而**没有停药标准的治疗**，**必然过量**）；**②⚠ 而\"**倒掉好可惜**\"这个心理**极准**（**⚠ 它是**\"**沉没成本**\"**在用药上的表现**（**⚠ 而**这种心理**在临床上**极常见**（**⚠ 而它**导致**\"**病好了还继续吃**\"**（**⚠ 故\"**可惜**\"这两个字**害人**）；**③⚠ 而\"**过与不及都不好**\"这一句**极重要**（**⚠ 它把\"**用药**\"**放到了\"**分寸**\"**这个框架里**（**⚠ 而\"**分寸**\"**恰好是**经方最讲究的东西**（**⚠ 故\"**中病即止**\"**这四个字**是**全书用药的**一条通则**）；**④⚠ 而\"**中医是讲究中庸的医学**\"这一层**须标**（**⚠ \"**中庸**\"**在这里**指\"**剂量与疗程的适度**\"**（**⚠ 而它**不是\"**什么病都慢慢调**\"**（**⚠ 因为**急症**要\"**快、准、狠**\"**（**⚠ 故\"**中庸**\"**指\"**恰到好处**\"**，**不是\"**折中**\"**）。** **⚠ 附一条**极实用的\"远程判据\"**（**同段）**：\"**'**老师这个舌苔黄，我们看不到病人，在电话里怎么办？'。'**你问病人，小便是黄的，还是淡的**'。'**原来小便时很深黄，现在吃你的药以后变成中黄，那继续吃，不要停**'。'**医生我可不可以停药？你小便什么颜色？淡黄、清澈的淡黄——好，你可以停药了**'。'**小便颜色变淡了以后，代表浊气、里面的热没有了**'。'**美国人很好玩，都是刷舌苔，所以你不能以他的舌苔**（判断）**——或者是吃薄荷，舌苔蓝色的，舌苔看不到了，就问他小便颜色，也可以知道**'。**\" **——⚠ 这一层**极重要** ✓（**\"**问小便颜色**\"**是**一个\"**不需要看舌头**\"**的替代判据**（**⚠ 而它的**合理内核**：**尿色深＝浓缩＝脱水/热/胆红素**（**⚠ 故\"**尿色变淡**\"**确实**提示**\"**体内热与脱水在缓解**\"**）。","o":"RJ-2923 · 人纪·金匮要略·腹满寒疝宿食病脉证并治第十（PDF 第278~279页）"},{"t":"四、趺阳脉：一个在脚背上的脉","h":"\"胃气\"的体表窗口，与它的位置","c":"定义——**原文用\"趺阳脉\"判胃气，而讲义把它的位置说清了，须照录**：\"**'**趺阳脉就是**胃经的**冲阳脉**——冲阳脉应该是**缓的、比较洪、比较缓**，代表**胃气正常**'。'现在是「**微弦**」，**代表里面有寒**'。'**冲阳在脚上面，足阳明胃经上的冲阳脉**，**微弦**——**弦呢，代表是寒、有寒水**'。'**法当腹满**——这个腹满跟腹痛不一样：**胀满**；**腹满者必便难**'。'意思是说，**如果你摸到的胃上的脉是寒的、胃里面是冷的，应该是肚子胀满**；**结果这个人没有胀满的话，就是便秘**'。'**所以一个实一个虚**：**如果是胀满的话，就是虚；如果便秘的话，就是实**'。'**反正都是寒**'。**\" **须说明（四层）**：**①\"**趺阳脉＝冲阳穴（足背动脉）**\"这一条**可核** ✓（**⚠ 冲阳**在**足背最高点、第二三跖骨之间**（**⚠ 而\"**趺阳脉**\"**就是**\"**摸足背动脉的搏动**\"**）；**②⚠ 而\"**足背动脉**\"**在今天是**一个重要体征**（**⚠ 它**用于**评估下肢血供、**诊断下肢动脉硬化（**⚠ 而\"**摸不到足背动脉**\"**＝**下肢动脉闭塞的信号**（**⚠ 故\"**趺阳脉**\"**这个古老的做法**今天仍在使用** ✓）；**③⚠ 而\"**微弦＝有寒**\"这一层**须标**（**⚠ \"**弦**\"**在脉学里**主\"**肝、痛、饮**\"**（**⚠ 而\"**寒**\"**是其中的一种解释**（**⚠ 故\"**弦＝寒水**\"**是一个**流派内的约定**）；**④⚠ 而\"**胀满为虚、便秘为实**\"这一条**极精**（**⚠ 它把\"**同一个症状（腹大）**\"**分成了**\"**有物**\"与\"**无物**\"**（**⚠ 而\"**有没有东西**\"**正是**虚实的分界** ✓）。** **⚠ 本集按语**：**\"**趺阳脉**\"**这个做法**最值得保留**（**⚠ 因为**它**是一个**\"**摸得到的循环指标**\"**（**⚠ 而它**比\"**脉象**\"**更客观**（**⚠ 故\"**摸脚背的脉**\"**这件事**，**在今天的糖尿病足筛查里**是标准动作** ✓）。","o":"RJ-2924 · 人纪·金匮要略·腹满寒疝宿食病脉证并治第十（PDF 第278页）"},{"t":"五、\"这一篇条辨散失得最多\"","h":"一段罕见的文献学自述，与它给出的三个原因","c":"要点——**第十一篇开篇有一段**关于这本书自身残缺的说明**，而这类\"自述\"在全书里极少，须照录**：\"**'过去所有的经方家都晓得，**伤寒金匮本就是一个断简残篇的古籍医书**——而其中**又以这一篇里面条辨散失得最多**，可是**又最重要**'。'**为什么会散落？**其中有许多原因：**有时因为人心太坏，将最优质的部份偷走**；**或者是只传子、不传外的恶习**；**或是战乱的原因**'。'于是变成断简残篇，**自伤寒杂病论分成伤寒与金匮二书以来，就不是很齐全**——所以**研究这篇时要稍微体谅一下张仲景**'。'**过去很多北派的经方家把这篇当成宝，一直在研究，实际上本篇失落掉很多条辨**'。'也有的经方家认为「**这篇失落很多条辨，我们不要在乎它，因为方子也不多**」——**实际上诸位还是要研究一下较好**'。**\" **须说明（四层）**：**①这是**全册唯一一处\"承认原书残缺\"的段落**（**⚠ 而这一层**极重要**（**因为它**打破了\"经典完整无缺\"的假设**（**⚠ 故它**允许读者**\"**看到缺口**\"**）；**②⚠ 而它给的**三个原因**（**藏私、只传子、战乱**）**各有一半道理**（**⚠ 而**文献学上**更重要的原因是**\"**竹简/抄本的物理损毁与传抄讹误**\"**（**⚠ 故\"**人心太坏**\"**这一类解释**是**推测**）；**③⚠ 而\"**这一篇失落最多、又最重要**\"这一句**极有分量**（**⚠ 因为它**承认了\"**最重要的东西**\"**恰恰**是\"**最不完整的东西**\"**（**⚠ 而**这一层**对读者的意义是**：**不要把一个残缺的框架**当成完整的系统**）；**④⚠ 而\"**方子也不多**\"这一句**也极诚实**（**⚠ 第十一篇**确实只有**几个方**（**旋覆花汤、甘草干姜茯苓白术汤、**肾着汤**）——**⚠ 故\"**方少**\"**与\"**条辨缺失**\"**是同一件事的两面**。** **⚠ 本集按语**：**这一段**最值得记的是\"**要体谅一下**\"**这四个字**（**⚠ 它**是一个**很成熟的读古书的态度**（**⚠ 故读《金匮》时**，**遇到\"条辨跳跃、方证不接\"**，**不一定是\"你不懂\"**，**可能是\"书缺了\"** ✓）。","o":"RJ-2925 · 人纪·金匮要略·五藏风寒积聚病脉证并治第十一（PDF 第310页）"},{"t":"六、\"天上没有云，太阳直射\"","h":"一个关于\"肺中风\"的比喻，极准","c":"要点——**讲义用\"天空有没有云\"来解释\"肺的燥与湿\"，而这一组比喻**极准**，须照录**：\"**'**风，我们不管身处何处，**只要风进到身体里面就一定会产生热**'。'**心肺的地方本就是阳气的出入所在**，因为**上焦本就是很热之地**'。'**内经云：上焦如雾**——意思是**水气蒸发起就像雾气一般**，然后**升到头顶上，再慢慢宣泄下**，这是**常态**'。'在这个状态之下，**当肺中到风时，风吹火更旺，于是就热上加热**——**就好像整个胸腔里没有云、太阳直接照射一样**'。'在高热状态之下**是没有水分的**，因此第一个呈现的症状是「**口燥而喘**」'。'**因为热气主上升，就像热气球会上升一般，于是肺就胀起，因此病人会喘**'。'**最好的健康的气候，是天上云很多，但是也不要乌云密布**——**乌云密布、里面水分很多，变成小青龙汤证**；**而这个（肺中风）呢，是太阳直射、完全没有云**'。**\" **须说明（四层）**：**①\"**上焦如雾**\"这个比喻**极精**（**⚠ 它把\"**上焦的津液**\"**说成\"**雾**\"**（**⚠ 而\"**雾**\"**的特点是**\"**有形而无定形、弥漫而轻**\"**（**⚠ 故\"**上焦如雾**\"**恰好对应**\"**呼吸道的气道湿化**\"**）；**②⚠ 而\"**没有云、太阳直射**\"这个状态**极准**（**⚠ 它对应**\"**气道干燥、分泌物黏稠**\"**（**⚠ 而\"**口燥而喘**\"**正是**这个状态的主诉**（**⚠ 故这一层**可以当\"**干燥环境对呼吸道的影响**\"**读**）；**③⚠ 而\"**乌云密布＝小青龙汤证**\"这一层**极精**（**⚠ 小青龙汤**治\"**外寒内饮**\"**（**⚠ 而\"**水气太多**\"**确实是**小青龙的证**（**⚠ 故\"**云太多**\"**与\"**云太少**\"**是两个方向**（**⚠ 而**中间那个\"**云很多但不满**\"**才是\"**常态**\"** ✓）；**④⚠ 而这一组比喻**最有价值的地方**是**它给了一个\"**度的标准**\"**（**⚠ 即：**健康不是一个\"更多\"，**是一个\"**适中**\"**（**⚠ 故\"**太干**\"**与\"**太湿**\"**都不好**（**⚠ 而这**恰好**与中医\"**燥湿相济**\"**的思路一致**）。** **⚠ 本集按语**：**\"**上焦如雾**\"这五个字，**可以当**\"**呼吸道需要湿化**\"**的古代版**（**⚠ 而它在今天**有一个具体对应**：**干燥环境（空调、暖气）**会**增加气道感染风险**（**⚠ 故\"**加湿**\"**是**一条**极便宜的护理措施** ✓）。","o":"RJ-2926 · 人纪·金匮要略·五藏风寒积聚病脉证并治第十一（PDF 第310~311页）"},{"t":"七、\"肺中寒，吐浊涕\"","h":"一个\"寒包热\"的模型，极反直觉","c":"要点——**原文只有四个字，而讲义把它解成了一个**\"寒在外、热在内**\"的结构，须照录**：\"**'**寒则束，即寒能约束**……**如果病人身上太热的时候，你摸他的脉，脉就是很奔放的、很大的**；**如果是寒，脉就缩小了**——**寒则收缩，热则奔放**'。'**肺本身被寒束到的时候**，因为**肺本属阳、胸腔是阳之聚所**，**阳要从我们的肺扩散到四肢**，所以**内经里面讲肺是布达津液**'。'**现在整个肺被寒束到，毛孔都无法出汗了，于是肺热散不出去而停在里面**'。'**当热散不出去，热就一定与湿混和**——而**脾脏不断供给它水津，结果到了肺又散不出去，慢慢累积在肺部**'。'**此时吐出看到就是浊涕——很黄浓的涕，是肺热症**'。'**而实际上肺热的原因是寒把肺束到**——**所以是因为肺热散不出去、闷在那边日久，才会吐浊涕**'。**\" **须说明（四层）**：**①\"**寒在外 → 毛孔闭 → 热散不出 → 热与湿混 → 黄浓涕**\"这条链**极完整**（**⚠ 而它**给了一个**\"**为什么寒能生热象**\"**的解释**（**⚠ 而这个解释**在\"**感冒初期**\"上**确有对应**（**如**受凉后鼻塞、分泌物变稠**）；**②⚠ 而\"**黄浓涕＝热症**\"这一条**在今天是**主流判据**（**⚠ 而讲义**说\"**它的原因是寒**\"**——**⚠ 这一层**须标**（**⚠ \"**黄浓涕**\"**在临床上**主要**提示**\"**细菌感染或炎症加重**\"**（**⚠ 故\"**见黄涕就给寒药**\"**与\"**见黄涕就给温药**\"**都不对**（**⚠ 而**要看\"**有没有发热、病程多久、有没有鼻窦压痛**\"**）；**③⚠ 而\"**寒则收缩、热则奔放**\"这一层**极准**（**⚠ 它说的是\"**血管的舒缩**\"**（**⚠ 而这**确实是**\"**脉的大小**\"**的物理基础** ✓）；**④⚠ 而\"**肺是布达津液**\"这一句**极重要**（**⚠ 它把\"**肺**\"**定位为\"**把津液送到四肢**\"**（**⚠ 而这一层**与\"**肺主皮毛**\"**是一致的**（**⚠ 故\"**皮肤干**\"**与\"**肺**\"**确实有关系**（**⚠ 而**它**不能推出\"**皮肤干＝肺病**\"**）。** **⚠ 本集按语**：**\"**寒包热**\"这个结构**最值得记的**是**它的\"**反向思维**\"**（**⚠ 即：**看见热象**，**先问\"**热是不是被什么闷住了**\"**（**⚠ 而这个问法**极有用**（**⚠ 如**发烧却不出汗、**脸红却手脚冷**、**口干却不想喝水**——**⚠ 这些**都是\"**闷住了**\"的样子** ✓）。","o":"RJ-2927 · 人纪·金匮要略·五藏风寒积聚病脉证并治第十一（PDF 第311~312页）"},{"t":"八、肺死脉：\"如葱叶，下无根\"","h":"一段极准的脉形描述，与一个意外的用处","c":"定义——**原文用两句话描述\"肺死脉\"，而这两句**各有可核的部分**，须照录**：\"**'**肺死脉：**浮之虚，按之弱如葱叶，下无根者，死**'。**\" **讲义的展开**：\"**'「**浮之虚**」就是你**轻轻按到皮肤表面上就可以摸到脉，跳得没有力、很虚**'。'「**按之弱如葱叶**」——**再按到骨边，感觉脉没有力，而脉形又是中空的脉、像葱叶般**，**这就一定有危险了**'。'**此时如果手有麻木，就是黄芪五物汤证**'。'**如果手没有麻**，重按他的脉，**按到下面像葱叶一样里面空的，就知道里虚了**'。'「**下无根者，死**」——什么叫做**无根脉**？**按脉有时候有、有时候又没有，这种现象就是肺的真脏脉**'。**\" **须说明（四层）**：**①\"**如葱叶**\"这个脉形描述**极准**（**⚠ 它对应**\"**芤脉**\"**（**⚠ 芤＝**如按葱管，中空**）——**⚠ 而\"**芤脉**\"**在今天是**\"**失血/血容量不足**\"**的典型脉**（**⚠ 故\"**按之如葱叶**\"**＝**\"**脉管里血不够**\"** ✓）；**②⚠ 而\"**浮之虚、按之无力**\"这一层**也准**（**⚠ 它对应**\"**脉压差变小、搏动弱**\"**（**⚠ 而这种脉**确实**见于**休克、心衰、大出血**）；**③⚠ 而\"**下无根**\"这一句**极重要**（**⚠ \"**无根**\"＝**\"**重按至骨仍摸不到**\"**（**⚠ 而\"**无根脉**\"**在脉学里**是**\"**元气将绝**\"**的信号**（**⚠ 而它**在临床上**确实**见于**极度虚弱/临终**）；**④⚠ 而\"**如果手有麻木，就是黄芪五物汤证**\"这一句**极重要**（**⚠ 它把\"**芤脉＋手麻**\"**配到了\"**血痹**\"**（**⚠ 而这一层**与第 n40 条\"血痹用黄芪桂枝五物汤\"**完全接上** ✓（**⚠ 故\"**脉中空＋四肢麻**\"**＝**\"**血虚不能濡养**\"**）。** **⚠ 本集按语**：**\"**如葱叶**\"这三个字**是**全书最好的一个脉象比喻**（**⚠ 因为**它**把\"**脉管中空**\"**讲成了**\"**一根葱**\"**（**⚠ 而\"**中空**\"这件事**是可以想见的**（**⚠ 故它**比\"**芤**\"这个字**好懂**（**⚠ 而\"**中空**\"的物理含义**就是**\"**血管里血少**\"**（**⚠ 故\"**脉如葱叶**\"**应当**先想到**\"**失血/脱水**\"**（**⚠ 而不是\"**死**\"**）。","o":"RJ-2928 · 人纪·金匮要略·五藏风寒积聚病脉证并治第十一（PDF 第312页）"},{"t":"九、\"坐电影院两小时，起来先麻后热\"","h":"一个\"气先行、血后行\"的观察，人人可试","c":"要点——**讲义用一个**人人有过的体验**来说明\"气与血的先后\"，而这一层**极可验证**，须照录**：\"**'**我们全身的血要运行，**一定是阳气走在前面、阴血跟在后面**'。'**比方说你坐在电影院里面二个小时后脚麻掉了**，**起立时你会先感觉到一阵麻麻的向下肢去，然后热跟着再下去**'。'**这就是气先行、血后行的明证**'。**\" **须说明（四层）**：**①\"**先麻后热**\"这个观察**极准** ✓（**⚠ 久坐后站起**，**首先是\"**针刺感/麻木**\"，**随后是\"**一股热流**\"**（**⚠ 故\"**气先行**\"**在这里**对应\"**感觉的恢复**\"**，\"**血后行**\"**对应\"**温度的恢复**\"**）；**②⚠ 而这一层**极重要**（**⚠ 因为**它**把\"**气血**\"**落到了**\"**两个可以被感觉到的现象**\"**（**⚠ 故\"**
