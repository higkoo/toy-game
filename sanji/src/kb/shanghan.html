<script>const D=[{"t":"一、六经辨证提纲","h":"阳明病提纲：\"胃家实\"","c":"定义——《伤寒论》第一九五条：\"**阳明之为病，胃家实也**\"。倪海厦讲授阳明病，先立表里之辨。**阳明病的三种来路**（第一九四条）：\"病有'**太阳阳明**'、'**正阳阳明**'、'**少阳阳明**'，何谓也？答曰：'**太阳阳明**'者，**发汗脾约**是也；'**正阳阳明**'者，**胃家实**是也；'**少阳阳明**'者，**利小便，胃中燥实，大便难**是也。\"**阳明外证**（第一九七条）：\"**身热，汗自出，不恶寒，反恶热也**\"。**转属阳明的机制**（第一九六条）：\"太阳、少阳病，若发汗、若下、若利小便，**亡津液，胃中干燥，因转属阳明**；不更衣，内实，大便难者，此名阳明也\"。这一组条文给出阳明病的**核心特征**：病位在\"胃家\"（胃肠），病性为\"实\"（有形之邪结聚），表现为**但热不寒、汗出、大便难**。与太阳病的\"恶寒发热\"形成对照——**恶寒与恶热的有无，是表证与里证的分水岭**。","o":"RJ-2738 · 《伤寒论》第一九四~一九七条（PDF 第10页）"},{"t":"一、六经辨证提纲","h":"误治所生的三种变证：结胸、痞、协热利","c":"风险——《伤寒论》第一四四条点明误下的两类后果：\"**病发于阳，而反下之，热入，因作'结胸'；病发于阴，而反下之，因作'痞'**。所以成结胸者，**以下之太早故也**。\"**结胸与脏结的鉴别**（第一四二条）：\"'**结胸**'——**按之痛，寸脉浮，关脉沉**；'**脏结**'——**如结胸状，饮食如故，时时下利，寸脉浮，关脉小细沉紧**，**舌上白苔滑者，难治**。\"**结胸的两条死候**：第一四六条\"**结胸证，其脉浮大者，不可下，下之则死**\"；第一四七条\"**结胸证悉具，烦躁者，亦死**\"。**小结胸与大结胸的分界**（第一五二条）：\"'**小结胸**'病，**正在心下，按之则痛，脉浮滑者，'小陷胸汤'主之**\"——病位局限、按之才痛、脉浮滑，属轻证；大陷胸汤则用于\"从心下至少腹硬满而痛不可近\"者。这一组条文的教学价值在于：**同一误治，因患者体质（阳／阴）不同而生不同变证**，故临床上\"下之太早\"的危险不在泻下本身，而在**时机与对象判断错误**。","o":"RJ-2739 · 《伤寒论》第一四二、一四四、一四六、一四七、一五二条（PDF 第8~9页）"},{"t":"二、代表方证","h":"白虎汤与白虎加人参汤的用法边界","c":"方法——**白虎加人参汤证**（第一八三条）：\"'伤寒'，若吐、若下后，七八日不解，**热结在里，表里俱热，时时恶风，大渴而烦，舌上干燥，欲饮水数升者，'白虎加人参汤'主之**。\"（第一八四条）\"'伤寒'，**无大热，口燥渴，心烦，背微恶寒者**，'白虎加人参汤'主之。\"**白虎汤的禁忌与鉴别**（第一八五条）：\"'伤寒'，**脉浮，发热，无汗，其表不解者，不可与'白虎汤'**；**渴欲饮水，无表证者**，'白虎加人参汤'主之。\"（第一九一条）\"'伤寒'，**脉浮滑**，此**表有寒，里有热**，'白虎汤'主之。\"三条合看，边界极清晰：**白虎汤用于\"里有热\"而无表证者**；**表未解（脉浮、发热、无汗）时禁用**，因石膏性寒，早用则遏表邪入里；**兼气津两伤（大渴、欲饮水数升、舌上干燥）时加人参**。其中\"背微恶寒\"一症尤须辨——它看似表证，实为热盛伤气、阳气不能外达之象，与太阳病的\"恶寒\"性质不同。","o":"RJ-2740 · 《伤寒论》第一八三、一八四、一八五、一九一条（PDF 第9~10页）"},{"t":"二、代表方证","h":"三承气汤的鉴别与\"试探法\"","c":"方法——**大承气汤的确定指征**（第二二四条）：\"'阳明病'，脉迟，虽汗出，不恶寒，其身必重，短气，腹满而喘，**有潮热者**，此外欲解，可攻里也。**手足濈然汗出者，此大便已硬也，'大承气汤'主之**。\"**试探法**（第二二五条）：\"'阳明病'，**潮热，大便已硬者，可与'大承气汤'；不硬者，不可与之**。若不大便六七日，**恐有燥屎，欲知之法，少与'小承气汤'，汤入腹中，转矢气者，此有燥屎，乃可攻之；若不转矢气者，此但初头硬后必溏，不可攻之**——攻之必胀满，不能食也。\"**何时改用小承气**（第二三二条）：\"'阳明病'，**谵语，有潮热，反不能食者，宜'大承气汤'下之，胃中必有燥屎五六枚也；若能食者，但硬耳，宜'小承气汤'。\"**调胃承气汤**则用于\"不吐、不下、心烦者\"（第二二三条），属缓下。这一组条文展示了张仲景**\"以药试病\"**的思路：在攻下与否两可之间，先以小承气汤试探，观察**是否转矢气（放屁）**——转矢气说明燥屎阻塞、肠气可通而不能下，故可攻；不转矢气则属虚滞，攻之必伤。这是**以最小的干预获取诊断信息**的范例。","o":"RJ-2741 · 《伤寒论》第二二三、二二四、二二五、二三二条（PDF 第10~12页）"},{"t":"二、代表方证","h":"三承气类方之外：\"不可攻\"的五种情形","c":"风险——仲景对攻下设置了多重警戒线。**①呕多**（第二二〇条）：\"'伤寒'，**呕多，虽有阳明证，不可攻之**\"——呕为病势向上，攻下逆其势。**②心下硬满**（第二二一条）：\"'阳明病'，**心下硬满者，不可攻之；攻之，利遂不止者死，利止者愈**\"。**③面合赤色**（第二二二条）：\"'阳明病'，**发热，面合赤色，不可攻之；攻之，小便不利者，必发黄也**\"——面赤为热郁于上，攻下则热陷发黄。**④胃中虚冷**（第二一〇条）：\"'阳明病'，**不能食，攻其热必哕**；所以然者，**胃中虚冷故也；以其人本虚，故攻其热必哕**\"。**⑤表未解**（第一七九条）：\"'伤寒'，大下后，复发汗，**心下'痞'，恶寒者，表未解也，不可攻'痞'，当先解表，表解乃可攻'痞'**\"。这五条的共同逻辑是：**攻下以\"实\"为前提，凡见虚象（不能食、心下硬满而属虚）、病势向上（呕）、病位偏上（面赤）、表邪未尽（恶寒）者，皆不可攻**。其中\"攻之利遂不止者死\"一句，是仲景对误下致危的罕见明言。","o":"RJ-2742 · 《伤寒论》第二一〇、二二〇、二二一、二二二、一七九条（PDF 第10~11页）"},{"t":"二、代表方证","h":"五泻心汤的分证与\"痞\"的层次","c":"方法——\"痞\"指心下满而不痛（与结胸的\"按之痛\"相对）。**①大黄黄连泻心汤**（第一六九条）：\"'心下'痞'，**按之濡，其脉关上浮者**，'大黄黄连泻心汤'主之\"——无形热邪壅滞，按之柔软。**②附子泻心汤**（第一七〇条）：\"'心下'痞'，**而复恶寒，汗出者**，'附子泻心汤'主之\"——热痞兼表阳虚，寒热并用。**③生姜泻心汤**（第一七二条）：\"'伤寒'，汗出，解之后，**胃中不和，心下痞硬，干噫食臭，胁下有水气，腹中雷鸣，下利者**\"——水气偏重。**④甘草泻心汤**（第一七三条）：\"'伤寒'、'中风'，医反下之，其人**下利，日数十行，谷不化，腹中雷鸣，心下痞硬而满，干呕，心烦不得安**……此非'热结'，但以**胃中虚，客气上结**，故使硬也\"——脾胃虚极而客气上逆。**⑤半夏泻心汤**（第一六四条）：\"'但满而不痛者，此为'痞'，'柴胡'不中与也，宜'半夏泻心汤'\"。**痞证的层次判断**（第一七四条）：\"'伤寒'，服汤药，**下利不止，心下痞硬**……医以'**理中**'与之，**利益甚**——'理中'者，**理中焦，此利在下焦**，'赤石脂禹余粮汤'主之；**复利不止者，当利其小便**\"。这一条尤其重要：**同一个\"下利\"，病位可在中焦（理中丸）或下焦（赤石脂禹余粮汤），或用利小便以实大便**——治痞不能只着眼于心下，须先辨病位。","o":"RJ-2743 · 《伤寒论》第一六四、一六九、一七〇、一七二、一七三、一七四条（PDF 第9~10页）"},{"t":"二、代表方证","h":"炙甘草汤与\"结、代、促\"三脉的定义","c":"定义——**炙甘草汤的指征**（第一九二条）：\"'伤寒'，**脉'结''代'，心动悸，'炙甘草汤'主之**。\"**三脉之辨**（第一九三条）：\"**脉，按之来缓，而时一止复来者，名曰'结'，阴也**；又**脉来数，而中止更来，及小数中止能自还者，名曰'促'，阳也**；**脉来缓，而中止不能自还，因而复动者，名曰'代'，阴也**；得此脉者，**必难治**。\"三者的关键差别在**\"能否自还\"与\"数／缓\"**：**结脉**——缓中一止、止后能回，属阴（多因气滞血瘀）；**促脉**——数中一止、止后能回，属阳（多因热盛或气逆）；**代脉**——缓中一止、止后不能即回、良久复动，属阴且**难治**（多主脏气衰微）。这一辨析的临床价值在于：**\"能否自还\"是判断预后的分水岭**——能自还者病浅，不能自还者病深。炙甘草汤以复脉立法，治\"心动悸\"而脉结代者，属气虚血少、心失所养之证。","o":"RJ-2744 · 《伤寒论》第一九二、一九三条（PDF 第10页）"},{"t":"二、代表方证","h":"抵当汤证与\"瘀热在里\"的三条判据","c":"方法——**抵当汤的指征**（第一三八条）：\"'太阳病'，六七日**表证仍在，下之，脉微而沉，反不结胸，其人发狂者，以热在下焦，少腹当硬满，小便自利者，下血乃愈**。所以然者，以'太阳'**随经，瘀热在里**故也，'抵当汤'主之。\"**与蓄水证的鉴别**（第一三九条）：\"'太阳病'，**身黄，脉沉结，少腹硬，小便不利者，为无血也；小便自利者，其人如狂者，血证谛也**，'抵当汤'主之。\"这两条给出了**\"蓄血\"的三条判据**：①**少腹硬满**（病位在下焦）；②**小便自利**（区别于蓄水的膀胱气化不利——蓄水则小便不利，蓄血则小便通利，因病不在膀胱而在血分）；③**其人如狂／发狂**（瘀热上扰神明）。其中\"**小便自利／不利**\"这一项是仲景区分血分与水分的关键鉴别点，其思路可推广至一切\"下焦病\"的辨证：**功能性问题（气化不利）多伴小便异常，器质性／血分问题则小便如常**。","o":"RJ-2745 · 《伤寒论》第一三八、一三九条（PDF 第8页）"},{"t":"二、代表方证","h":"风湿三方：从\"身体烦疼\"到\"骨节掣痛\"的三级划分","c":"方法——仲景治风湿三方，按病位深浅递进。**①桂枝附子汤**（第一八九条）：\"'伤寒'八九日，**风湿相搏，身体烦疼，不能自转侧，不呕，不渴，脉浮虚而涩者**，'桂枝附子汤'主之；**若其人大便溏，小便自利者**，'桂枝附子去桂加白术汤'主之\"。**②甘草附子汤**（第一九〇条）：\"**风湿相搏，骨节烦疼，掣痛，不得屈伸，近之则痛剧，汗出，短气，小便不利，恶风不欲去衣被，或身微肿者**，'甘草附子汤'主之。\"两者的分界在疼痛的性质：**\"身体烦疼、不能自转侧\"**是**肌肉层面**的痛（病浅）；**\"骨节烦疼、掣痛、不得屈伸、近之则痛剧\"**是**骨节层面**的痛（病深，且拒按）。这一分级与现代\"肌筋膜疼痛／关节炎\"的区分相通。另\"不呕、不渴\"两症在第一条中被特意点出，用意是**排除少阳与阳明**（呕属少阳、渴属阳明），确保病仍在表。","o":"RJ-2746 · 《伤寒论》第一八九、一九〇条（PDF 第9页）"},{"t":"二、代表方证","h":"热入血室：妇人经期感邪的专证","c":"方法——三条相连，构成一个完整的病证。**①**（第一五八条）\"妇人'中风'，发热恶寒，得之八九日，**经水适来**，热除而脉迟身凉，**胸胁下满，如结胸状，谵语者，此为热入血室也，当刺期门，随其实而泻之**。\"**②**（第一五九条）\"妇人'中风'，此为'热入血室'，**其血必结，故使如'疟'状，发作有时**，'**小柴胡汤**'主之。\"**③**（第一六〇条）\"妇人'伤寒'发热，**经水适来，昼日明了，暮则谵语，如见鬼状者**，此为'热入血室'，**无犯胃气及上下焦，必自愈**。\"三条合看，热入血室的**共同前提是\"经水适来\"**（月经适至，血室空虚，邪热乘虚而入），**主症是谵语与寒热如疟**，**治法三途**：**刺期门（泻其实）、小柴胡汤（和解）、或不予药待其自愈**（第三条属轻证，\"无犯胃气\"即不可妄攻）。其中\"**昼日明了、暮则谵语**\"这一\"昼轻夜重\"的规律，是热入血室最具特征性的表现，也提示情志与神志症状的发作有时间节律可循。","o":"RJ-2747 · 《伤寒论》第一五八、一五九、一六〇条（PDF 第8~9页）"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"伤寒论六经辨证总纲","c":"【传记】「**倪海厦（1954 年—2012 年），生于中国台湾台北，祖籍浙江瑞安，毕业于东吴大学政治系。****曾于美国佛罗里达州开立汉唐中医院，任院长与加州中医药大学博士指导教授，并任职佛罗里达州卫生署中医委员会最高委员会委员。****倪海厦耗时两年半，将中医经典《针灸大成》、《黄帝内经》、《神农本草经》、《伤寒论》、《金匮要略》等用通俗易懂的语言创作了多部讲学视频（称为人纪系列）。****倪海厦倡导『师徒制』训练方式，让学生从始至终直接跟着临床接触病患，直到改善为止。**」【全书结构】「**全 479 页、397 条条辨，按六经分篇：辨太阳病脉证并治法（上/中/下篇）条辨 1–193；辨阳明病脉证并治法条辨 194–276；辨少阳病脉证并治法条辨 278–287；辨太阴病脉证并治法条辨 288–296；辨少阴病脉证并治法条辨 297–340；辨厥阴病脉证并治法条辨 341–397。**」\n\n**【极重要】伤寒论 = 397 条条辨 / 六经分篇（太阳 193 条为最大篇）**\n\n```\n太阳（1–193）→ 阳明（194–276）→ 少阳（278–287）\n→ 太阴（288–296）→ 少阴（297–340）→ 厥阴（341–397）\n```\n\n**「太阳篇占全书近一半」——「这是最精的比重（外感初期的临床主场）。」** ✓✓","o":"RJ-2748 · 《人纪·伤寒论》传记与目录（PDF 第 1–8 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"太阳病总纲","c":"【条辨一】「**太阳之为病，脉浮，头项强痛而恶寒。**」讲义：「**太阳病就是人体最外一层——皮肤、肌肉、经络，受到外邪侵犯时出现的病。****为什么叫『太阳』？因为太阳经是人体最大的经络，从眼睛上来到头顶，然后沿着后背下来到脚的小趾。****太阳主一身之表，所以外感病第一步都是太阳病。****脉浮代表病在表，正气往外抗邪；头项强痛是太阳经循行部位的痛；恶寒是卫气被伤，不能温煦皮肤。****记住这三个症状——脉浮、头项强痛、恶寒，就是太阳病的总纲。**」\n\n**【最重要】太阳病总纲三症：脉浮 + 头项强痛 + 恶寒**\n\n```\n脉浮（病在表/正气抗邪）\n头项强痛（太阳经循行）\n恶寒（卫气被伤）\n```\n\n**「『太阳主一身之表』——这是最精的定位。」** ✓✓","o":"RJ-2749 · 《人纪·伤寒论》辨太阳病脉证并治法上篇 条辨一（PDF 第 21 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"太阳中风","c":"【条辨二】「**太阳病」发热，汗出，恶风，脉缓者，名为「中风」。**讲义：「**太阳病分两种：一种是有汗的，叫『中风』；一种是无汗的，叫『伤寒』。****这个『中风』跟现在说的脑中风完全不一样，这个是『太阳中风』，就是外感风邪。****症状是发热、汗出、恶风、脉缓。****为什么有汗？因为风性疏泄，把毛孔打开了，汗就出来了。****脉缓是因为汗出伤津，脉道松弛。**」\n\n**【最重要】太阳中风四症：发热 + 汗出 + 恶风 + 脉缓**\n\n```\n有汗 → 中风（风性疏泄、毛孔开）\n无汗 → 伤寒（寒性收引、毛孔闭）\n「此中风非脑中风」\n```\n\n**须「强「标」**：**「①『中风』为伤寒论术语，与脑卒中无关；②脑卒中须立即120；③不可混用」** ✓✓","o":"RJ-2750 · 《人纪·伤寒论》条辨二（PDF 第 25 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"太阳伤寒","c":"【条辨三】「**太阳病」，或已发热，或未发热，必恶寒，体痛，呕逆，脉阴阳俱紧者，名曰「伤寒」。**讲义：「**伤寒呢，就是寒邪伤到人体。****寒性收引，毛孔闭住了，所以没有汗。****『必恶寒』——一定有恶寒，这是关键；发热可以已经发生，也可以还没发生。****体痛是因为寒邪束住经络，气血不通则痛。****呕逆是胃气被寒气所扰。****脉阴阳俱紧——寸关尺三部脉都紧，紧代表寒、代表痛、代表收引。**」\n\n**【最重要】太阳伤寒：必恶寒 + 体痛 + 呕逆 + 脉阴阳俱紧（无汗）**\n\n```\n中风：汗出、脉缓\n伤寒：无汗、脉紧\n「必恶寒」为两者的共同点\n```\n\n**「脉阴阳俱紧」——「这是最精的伤寒脉。」** ✓✓","o":"RJ-2751 · 《人纪·伤寒论》条辨三（PDF 第 26 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"传与不传","c":"【条辨四】「**伤寒」一日，「太阳」受之，脉静者，为不传也；若脉数急者，为传也。**【条辨五】「**伤寒」二三日，「阳明」：「少阳」证不见者，为不传也；颇欲吐，若烦躁者，为传也。**讲义：「**怎么判断这个病会不会传经？****第一个看脉：脉静（脉象平稳、不快）就不传；脉数急（跳得快而急）就是传了。****第二个看症状：没有阳明证（但热不寒、口渴）、没有少阳证（往来寒热、胸胁苦满），就不传；如果出现想吐、烦躁，就表示要传了。****这就是『辨证知传』——不用等病传过去，提前就能知道。**」\n\n**【极重要】判断传经的两个指标：脉（静 vs 数急）+ 症状（有 vs 无）**\n\n```\n脉静 → 不传；脉数急 → 传\n无阳明/少阳证 → 不传\n欲吐/烦躁 → 将传\n「提前知传 = 提前拦截」\n```\n\n**「这是最精的『预测』思维（与 n41肺癌一定下痢」同源）。** ✓✓","o":"RJ-2752 · 《人纪·伤寒论》条辨四、五（PDF 第 29–30 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"温病","c":"【条辨六】「**太阳病」，发热而渴，不恶寒者，为「温病」。**讲义：「**温病跟太阳病不一样：太阳病是恶寒，温病是不恶寒、但发热而渴。****为什么？因为温病是内热，热从里面发出来，所以不恶寒；热伤津液，所以口渴。****这条很重要——张仲景在太阳病篇一开始就把温病点出来，是要跟伤寒区别开来。****温病不能用桂枝汤、麻黄汤这些温热的药去发汗，那是火上加油。**」\n\n**【最重要】温病 = 发热 + 而渴 + 不恶寒（与太阳伤寒的「恶寒」对立）**\n\n```\n太阳伤寒：恶寒（表寒）\n温病：不恶寒 + 渴（里热）\n温病禁汗（不能用桂枝/麻黄）\n```\n\n**须「强「标」**：**「①发热+口渴+不恶寒须查感染/肺炎；②温病须辨证（不可一概禁汗）；③高热须就诊」** ✓✓","o":"RJ-2753 · 《人纪·伤寒论》条辨六（PDF 第 31 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"风温","c":"【条辨七】「**若自汗出，身灼热者，名曰风温」。**【条辨八】「**风温」为病，脉阴阳俱浮，自汗出，身重，多眠睡，息必鼾，言语难出。****若发汗者，小便不利；若被下者，直视，失溲；若被火者，微发黄色，剧则如惊痫，时瘈疭；若火蒸之，一逆尚引日，再逆促命期。**讲义：「**风温的症状很特别：脉阴阳俱浮、自汗出、身重、多眠睡、呼吸会打鼾、说话困难。****这个『多眠睡、息必鼾』——很像现在的脑膜炎或者重症感染时的意识障碍。****下面讲的是误治的三种后果：发汗则小便不利（伤津）；攻下则直视、失溲（肝肾精伤）；用火（温针、艾灸）则发黄，严重的会抽搐。****『一逆尚引日，再逆促命期』——错一次还能拖几天，错两次就要命了。**」\n\n**【极重要】风温六症：脉浮 + 自汗 + 身重 + 多眠 + 鼾 + 言语难**\n\n```\n误汗 → 小便不利（伤津）\n误下 → 直视、失溲（伤肝肾）\n误火 → 发黄/抽搐\n「一逆尚引日，再逆促命期」\n```\n\n**须「绝「对「强「标」**：**「①多眠+鼾+言语难= 意识障碍，须立即急诊；②须排脑膜炎/脑炎/脓毒症；③绝对禁用火（艾灸/温针）」** ✓✓✓","o":"RJ-2754 · 《人纪·伤寒论》条辨七、八（PDF 第 32–33 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"阳数七阴数六","c":"【条辨九】「**病有发热恶寒者，发于阳」也；无热恶寒者，发于「阴」也。****发于「阳」者七日愈，发于「阴」者六日愈，以阳数七、阴数六故也。**讲义：「**发热恶寒的是阳证（在表），无热恶寒的是阴证（在里）。****为什么阳证七日愈、阴证六日愈？因为阳数是七、阴数是六。****这是《易经》的数理：七是少阳之数、是阳数；六是老阴之数、是阴数。****这个数字不是随便定的，是古人对病程的观察总结。**」\n\n**【极精】阳数七、阴数六（病程周期）**\n\n```\n发热恶寒（阳/表）→ 七日愈（阳数七）\n无热恶寒（阴/里）→ 六日愈（阴数六）\n```\n\n**须「标」**：**「①六日/七日为古人观察，无生理学依据；②病程须按实际病情；③不可据此停药」** ✓✓\n\n**「与天纪『阳数七阴数六』互证」——「这是跨册的内在一致。」** ✓✓","o":"RJ-2755 · 《人纪·伤寒论》条辨九（PDF 第 34 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"太阳病欲解时","c":"【条辨十一】「**太阳病」欲解时，从「巳」至「未」上。**讲义：「**太阳病什么时候容易好？从巳时到未时——就是上午 9 点到下午 3 点。****为什么？因为这个时候是阳气最旺的时候，太阳经的气也最旺，正能胜邪。****这个『欲解时』每一经都有，是张仲景的重要发现。****后面阳明病是申至戌（下午 3 点到晚上 9 点），少阳病是寅至辰（凌晨 3 点到上午 9 点）。**」\n\n**【极重要】太阳病欲解时：巳至未（9:00–15:00）**\n\n```\n太阳：巳–未（9–15 点，阳气最旺）\n阳明：申–戌（15–21 点）\n少阳：寅–辰（3–9 点）\n```\n\n**「这是最精的『时间医学』（与 n141六经轮流当令」一致）。** ✓✓","o":"RJ-2756 · 《人纪·伤寒论》条辨十一（PDF 第 35 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"热在皮肤寒在骨髓","c":"【条辨十三】「**病人身大热，反欲近衣者，热在皮肤，寒在骨髓也。****身大寒，反不欲近衣者，寒在皮肤，热在骨髓也。**」讲义：「**这条是辨真假寒热的绝招。****病人身上摸起来很热，但他反而想多穿衣服——这说明表面的热是假的，真正的寒在骨头里面。****反过来，病人身上摸起来很冷，但他不想多穿衣服——这是表面的寒是假的，真正的热在骨髓。****这就是『真寒假热』和『真热假寒』。****怎么看？就看他想不想穿衣、想不想盖被。****这是最简单也最可靠的鉴别。**」\n\n**【最重要】真假寒热的判据：想不想近衣**\n\n```\n身大热 + 欲近衣 → 热在皮肤、寒在骨髓（真寒假热）\n身大寒 + 不欲近衣 → 寒在皮肤、热在骨髓（真热假寒）\n```\n\n**须「绝「对「强「标」**：**「①此为辨证关键（用反药会死人）；②真寒假热须温里（如四逆汤）；③真热假寒须清里；④须结合脉/舌/体温」** ✓✓✓\n\n**「这是全篇最有价值的一条（辨真假寒热）。」** ✓✓","o":"RJ-2757 · 《人纪·伤寒论》条辨十三（PDF 第 36 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"桂枝汤证","c":"【条辨十五】「**太阳中风」，阳浮而阴弱，阳浮者热自发，阴弱者汗自出，啬啬恶寒，淅淅恶风，翕翕发热，鼻鸣，干呕者，「桂枝汤」主之。**讲义：「**阳浮而阴弱——寸脉浮、尺脉弱。****阳浮所以发热，阴弱所以汗出。****『啬啬恶寒』——冷得缩起来的样子；『淅淅恶风』——像冷水洒在身上的怕风；『翕翕发热』——热得像鸟羽覆盖一样（温热而不灼）。****鼻鸣是鼻塞呼吸有声，干呕是胃气上逆。****这就是桂枝汤的典型证候群。**」【桂枝汤方】「**桂枝三两（去皮）、芍药三两、甘草二两（炙）、生姜三两（切）、大枣十二枚（擘）。****上五味，㕮咀三味，以水七升，微火煮取三升，去滓，适寒温，服一升。****服已须臾，啜热稀粥一升余，以助药力。****温覆令一时许，遍身漐漐微似有汗者益佳，不可令如水流漓，病必不除。**」\n\n**【最重要】桂枝汤证：阳浮阴弱 + 啬啬恶寒 + 淅淅恶风 + 翕翕发热 + 鼻鸣 + 干呕**\n\n```\n桂枝汤 = 桂枝/芍药/甘草/生姜/大枣（五味）\n服后啜热稀粥（助药力）+ 温覆（取微汗）\n「不可令如水流漓，病必不除」（微汗为度）\n```\n\n**「啜粥温覆」——「这是最精的服药法（桂枝汤的疗效一半在服法）。」** ✓✓✓","o":"RJ-2758 · 《人纪·伤寒论》条辨十五及桂枝汤方（PDF 第 38–45 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"桂枝加葛根汤","c":"【条辨十七】「**太阳病」，项背强几几，及汗出，恶风者，「桂枝加葛根汤」主之。**讲义：「**『项背强几几』——这个『几几』读作『几几』（jǐn），形容脖子和后背僵硬、转动不灵活的样子，像小鸟学飞时伸着脖子。****这个症状在太阳经上，从后脑到后背。****葛根这味药专门能升津液、解肌，把僵硬的肌肉松开。****所以桂枝汤证再加上项背强几几，就加葛根。****临床上看，现在很多人脖子僵硬、肩膀酸痛，尤其是长期伏案工作的，这个方子很好用。**」【桂枝加葛根汤】「**葛根四两、桂枝二两、芍药二两、甘草二两、生姜三两、大枣十二枚。**」\n\n**【极重要】项背强几几 = 颈背僵硬 → 桂枝加葛根汤（葛根升津解肌）**\n\n```\n桂枝汤证 + 项背强几几 → 加葛根四两\n葛根：升津液、解肌（非发汗）\n```\n\n**须「标」**：**「①颈背僵硬须排颈椎病/脑膜炎（颈强直）；②葛根不可过量（升散）；③须配合针灸/康复」** ✓✓","o":"RJ-2759 · 《人纪·伤寒论》条辨十七及桂枝加葛根汤方（PDF 第 46–49 页）。"},{"t":"伤寒论·辨太阳病脉证并治法上篇（起）","h":"桂枝汤禁例","c":"【条辨十九】「**『太阳病』，三日，已发汗，若吐，若下，若温针，仍不解者，此为坏病，『桂枝』不中与也。****视其脉证，知犯何逆，随证治之。**」【条辨二十】「**『桂枝汤』本为解肌，若其人脉浮紧，发热，汗不出者，不可与也；当须认此，勿令误也。**」【条辨二一】「**若酒客病，不可与『桂枝汤』；得汤则呕，以酒客不喜甘故也。**」【条辨二二】「**若喘家作，『桂枝汤』加『厚朴』：『杏子仁』。**」【条辨二三】「**凡吐家，服『桂枝汤』，其后必吐脓血也。**」讲义：「**桂枝汤有四个禁忌：①已经汗、吐、下、温针都做过而病不好的是『坏病』，不能再用桂枝汤，要『观其脉证，知犯何逆，随证治之』；②脉浮紧、发热、无汗的是伤寒，不是中风，不能用桂枝汤（用错了会助热）；③酒客（长期喝酒的人）不能用，因为酒客胃里湿热，桂枝汤是甘温的，吃了会吐；④吐家（经常吐血的人）不能用，因为桂枝汤辛温，会动血。**」\n\n**【极重要】桂枝汤四大禁例**\n\n```\n① 坏病（汗吐下温针后不解）→ 观脉证、随证治之\n② 脉浮紧/无汗（伤寒）→ 不可与\n③ 酒客（湿热）→ 得汤则呕（不喜甘）\n④ 吐家（常吐血）→ 必吐脓血\n+ 喘家 → 加厚朴、杏仁\n```\n\n**「『知犯何逆，随证治之』——这是全书最精的治则（坏病总法）。」** ✓✓✓","o":"RJ-2760 · 《人纪·伤寒论》条辨十九至二三（PDF 第 50–52 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"结胸与藏结之辨","c":"【条辨一四二】「**问曰：病有结胸」，有「藏结」，其状何如？****答曰：按之痛，寸脉浮，关脉沉，名曰「结胸」也。****何谓「藏结」？****答曰：如「结胸」状，饮食如故，时时下利，寸脉浮，关脉小细沉紧，名曰「藏结」；****舌上白苔滑者，难治。**【条辨一四三】「**藏结」，无阳证，不往来寒热，其人反静，舌上苔滑者，不可攻也。**讲义：「**结胸和藏结表面上都像，但本质完全不同。****结胸是『按之痛』——手按下去就痛，这是实邪；寸脉浮（邪在胸）、关脉沉（水饮在里）。****藏结是『饮食如故、时时下利』——胃口还可以，但一直拉肚子；关脉『小细沉紧』——这是脏气虚寒、寒实内结。****最关键是舌苔：『舌上白苔滑』——白滑苔代表寒湿，正气已虚，所以『难治』『不可攻』。****结胸可攻（大陷胸汤），藏结不可攻——一攻就死。**」\n\n**【最重要】结胸（可攻）vs 藏结（不可攻）**\n\n| 鉴别 | 结胸 | 藏结 |\n|---|---|---|\n| **按诊** | 按之痛 | 如结胸状（不痛） |\n| **饮食** | — | **饮食如故** |\n| **大便** | — | **时时下利** |\n| **脉** | **寸浮、关沉** | **寸浮、关小细沉紧** |\n| **舌** | — | **白苔滑（难治）** |\n\n**「舌上白苔滑者，难治」——「这是最精的舌诊判生死。」** ✓✓✓","o":"RJ-2761 · 《人纪·伤寒论》条辨一四二、一四三（PDF 第 197–198 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"结胸与痞的成因","c":"【条辨一四四】「**病发于阳，而反下之，热入。因作结胸」。****病发于阴，而反下之，因作「痞」。****所以成「结胸」者，以下之太早故也。**讲义：「**这条讲结胸和痞是怎么来的——都是误下造成的。****病在阳（表证），应该发汗，结果用了下法，热邪内陷，跟胸中的水饮结在一起，就成了『结胸』。****病在阴（里虚），误用下法，胃气受伤，气机堵塞，就成了『痞』。****『痞』这个字就是堵塞不通的意思，但按下去是软的（不是硬块），所以叫『气痞』。****所以两个都是『下之太早』惹的祸——这就是为什么张仲景反复强调『先表后里』。**」\n\n**【极重要】结胸 vs 痞，都是误下所致**\n\n```\n病发于阳（表）+ 误下 → 热入 → 结胸（水热互结，按之痛/硬）\n病发于阴（里虚）+ 误下 → 痞（气机堵塞，按之软）\n病根：下之太早（当汗反下）\n```\n\n**「『下之太早』——这是全书最重要的治则警示。」** ✓✓","o":"RJ-2762 · 《人纪·伤寒论》条辨一四四（PDF 第 199 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"结胸如柔痉用大陷胸丸","c":"【条辨一四五】「**结胸」者，项亦强，如「柔痉」状，下之则和，宜「大陷胸丸」。**讲义：「**结胸的病人，有时候脖子也会僵硬，像『柔痉』一样——柔痉就是有汗的痉病，脖子强硬。****为什么结胸会脖子硬？因为水热结在胸中，气机不畅，津液不能上达颈部，筋脉失去濡养。****这个要用『大陷胸丸』——丸剂比汤剂缓，因为病在上部（胸），要用丸药慢慢化开，不能一下子猛攻。****大陷胸丸里有大黄、芒硝、葶苈子、杏仁，加白蜜做成丸。**」\n\n**【极重要】结胸见「项强如柔痉」→ 大陷胸丸（丸者缓也，病在上宜缓）**\n\n```\n结胸 + 项强如柔痉 → 大陷胸丸\n（大黄/芒硝/葶苈子/杏仁/白蜜）\n丸剂缓攻（上焦病不宜猛下）\n```\n\n**「上焦病用丸、下焦病用汤」——「这是最精的剂型选择。」** ✓✓","o":"RJ-2763 · 《人纪·伤寒论》条辨一四五及大陷胸丸方（PDF 第 200 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"结胸脉浮大不可下","c":"【条辨一四六】「**结胸证」，其脉浮大者，不可下，下之则死。**【条辨一四七】「**结胸证」悉具，烦躁者，亦死。**讲义：「**这两条是结胸的死证预警。****第一条：结胸证本来应该脉沉（实邪在里），如果脉反而浮大——说明邪还在表、正气外浮，这时候用大陷胸汤攻下，正气一散就死了。****第二条：结胸的症状全部具备，再加上『烦躁』——烦躁代表正气已乱、心神不安，这是危候，也是死证。****所以结胸辨两条：脉浮大不可下、烦躁者死。****这就是『能攻』和『不能攻』的分界。**」\n\n**【最重要】结胸两大死证：脉浮大（不可下）+ 烦躁（死）**\n\n```\n脉浮大 → 不可下（下之则死）\n诸证悉具 + 烦躁 → 死\n```\n\n**须「绝「对「强「标」**：**「①此为古代危候，现代须立即急诊；②须排脓胸/胸膜炎/气胸/心梗；③须CT/超声/引流/抗生素」** ✓✓✓","o":"RJ-2764 · 《人纪·伤寒论》条辨一四六、一四七（PDF 第 202 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"大陷胸汤证","c":"【条辨一四八】「**太阳病」，脉浮而动数，浮则为风，数则为热，动则为痛，头痛发热，而微汗出，及恶寒者，表未解也，医反下之，动数变迟，客气动膈，膈内拒痛，短气躁烦，心中懊憹，胃中空虚，阳气内陷，心下因鞕，则为「结胸」，「大陷胸汤」主之。**【条辨一四九】「**伤寒」六七日，「结胸」热实，脉沉而紧，心下痛，按之石鞕者，「大陷胸汤」主之。**讲义：「**大陷胸汤的典型证：心下（胃部）痛，按下去像石头一样硬（『按之石鞕』），脉沉而紧。****为什么会这样？水热互结在胸腹之间，形成实质性的硬块。****大陷胸汤只有三味药：大黄、芒硝、甘遂。****甘遂是峻下逐水的猛药，能把水热从大便排出去；大黄、芒硝攻实。****这个方子非常峻猛——吃下去会大泻，所以只能用于实证、壮实之人。**」\n\n**【最重要】大陷胸汤三大主证：心下痛 + 按之石鞕 + 脉沉紧**\n\n```\n大陷胸汤 = 大黄 + 芒硝 + 甘遂（3 味）\n峻下逐水（水热互结）\n「按之石鞕」为眼目\n```\n\n**须「绝「对「强「标」**：**「①甘遂有毒，峻下可致脱水/电解质紊乱；②须住院/专业医师；③绝对不可自服；④体虚/孕妇/老人禁」** ✓✓✓","o":"RJ-2765 · 《人纪·伤寒论》条辨一四八、一四九及大陷胸汤方（PDF 第 202–206 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"小结胸汤证","c":"【条辨一五二】「**小结胸病」，正在心下，按之则痛，脉浮滑者，「小陷胸汤」主之。**讲义：「**小结胸跟大结胸的区别，就看『按之痛』和『按之石鞕』。****小结胸：正在心下（胃部），按下去才痛（不按不痛），脉浮滑——浮是热、滑是痰。****这是痰热结在心下，比较轻浅。****小陷胸汤三味：黄连、半夏、栝蒌实。****黄连清 heat、半夏去痰、栝蒌实（全瓜蒌）宽胸散结。****临床上这个方子治胃炎、食道炎、胸膜炎初期很好用。**」\n\n**【最重要】小结胸 = 正在心下 + 按之则痛 + 脉浮滑 → 小陷胸汤**\n\n```\n小结胸（轻浅/痰热）：按之则痛、脉浮滑\n大结胸（重实/水热）：按之石鞕、脉沉紧\n小陷胸汤 = 黄连 + 半夏 + 栝蒌实（3 味）\n```\n\n**「按之则痛 vs 按之石鞕」——「这是最精的大小结胸分界。」** ✓✓","o":"RJ-2766 · 《人纪·伤寒论》条辨一五二（PDF 第 208 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"文蛤散","c":"【条辨一五五】「**病在阳，应以汗解之，反以冷水潠之，若灌之，其热被劫不得去，弥更益烦，肉上粟起，意欲饮水，反不渴者，服文蛤散」；若不差者，与「五苓散」。**讲义：「**这条讲的是用冷水浇身来退热的错误做法。****病在表本来应该发汗，结果用冷水喷、用冷水灌，热被冷水逼住出不来，反而更烦躁。****『肉上粟起』——皮肤上起鸡皮疙瘩，这是寒邪束表的表现。****『意欲饮水，反不渴』——想喝水但又不渴，这是水气在表、津液未伤。****文蛤散（海蛤壳研粉）能散水气、清热；如果还不好，就用五苓散利水。**」\n\n**【极重要】冷水潠身之误 → 热被劫、肉上粟起 → 文蛤散/五苓散**\n\n```\n应激性退热（冷水灌）→ 热不得去 + 肉上粟起\n文蛤散（海蛤粉）→ 散水清热\n不差 → 五苓散\n```\n\n**须「强「标」**：**「①高热不可用冷水浇/酒精擦（可致寒战/儿童惊厥）；②须用退热药；③物理降温须规范」** ✓✓","o":"RJ-2767 · 《人纪·伤寒论》条辨一五五及文蛤散方（PDF 第 211–212 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"寒实结胸用三物小白散","c":"【条辨一五六】「**寒实结胸」，无热证者，与「三物小白散」，「陷胸汤」不可服。**讲义：「**这条是与大陷胸汤对应的『寒实结胸』。****前面讲的结胸都是热实（有热），而这条是『寒实』——没有热象，是寒邪跟痰水结在胸中。****既然是寒实，就不能用大陷胸汤（那是寒药），要用『三物小白散』——桔梗、巴豆、贝母。****巴豆是热性的峻下药，能开通寒结。****记住：热实结胸用大陷胸汤，寒实结胸用三物小白散——一寒一热，不能搞错。**」\n\n**【最重要】热实结胸（大陷胸汤）vs 寒实结胸（三物小白散）**\n\n```\n热实（有热象）→ 大陷胸汤（大黄/芒硝/甘遂，寒下）\n寒实（无热象）→ 三物小白散（桔梗/巴豆/贝母，热下）\n「陷胸汤不可服」（寒证禁用寒下）\n```\n\n**须「绝「对「强「标」**：**「①巴豆含巴豆油（剧毒），可致胃肠穿孔；②须专业医师/住院；③绝对不可自服」** ✓✓✓","o":"RJ-2768 · 《人纪·伤寒论》条辨一五六及三物小白散方（PDF 第 213 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"热入血室","c":"【条辨一五八】「**妇人中风」，发热恶寒，得之八九日，经水迟来，热除而脉迟身凉，胸胁下满。****如结胸状，谵语者，此为热入血室也，当刺期门，随其实而泻之。**【条辨一五九】「**妇人中风」，发热恶寒，经水适来，得之七八日，热除而脉迟身凉，胸胁下满如结胸状，谵语者，此为「热入血室」，其血必结，故使如「疟」状，发作有时，「小柴胡汤」主之。**【条辨一六〇】「**妇人伤寒」发热，经水适来，昼日明了，暮则谵语，如见鬼状者，此为「热入血室」，无犯胃气及上下焦，必自愈。**讲义：「**张仲景讲『热入血室』这三个条辨，把妇科月经期感冒讲透了。****女人来月经的时候，血室空虚，外邪容易乘虚而入，直接进入血室（子宫）。****症状特点：发热恶寒，然后热退、脉迟、身凉，但胸胁下满、说胡话。****最有意思的是『昼日明了，暮则谵语，如见鬼状』——白天清醒，晚上说胡话像见鬼一样。****这就是热入血室的特征。****治法：刺期门；或者用小柴胡汤。****最重要的是最后一句『无犯胃气及上下焦，必自愈』——不要乱攻，让她自己好。**」\n\n**【最重要】热入血室三条**\n\n```\n① 经水适来/迟来 + 胸胁下满 + 谵语 → 刺期门\n② + 其血必结 + 如疟状发作有时 → 小柴胡汤\n③ 昼日明了、暮则谵语如见鬼状 → 无犯胃气及上下焦（必自愈）\n```\n\n**「昼日明了，暮则谵语」——「这是最精的时间性谵语（与 n52热入血室」互证）。** ✓✓✓\n\n**须「强「标」**：**「①谵语/如见鬼状须排感染/中枢受累/精神病；②须查血常规/血培/头CT；③不可仅按热入血室治」** ✓✓","o":"RJ-2769 · 《人纪·伤寒论》条辨一五八、一五九、一六〇（PDF 第 218–221 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"柴胡桂枝汤","c":"【条辨一六一】「**伤寒」六七日，发热微恶寒，支节烦疼，微呕，心下支结，外证未去者，「柴胡桂枝汤」主之。**讲义：「**柴胡桂枝汤是小柴胡汤和桂枝汤的合方。****什么时候用？病既有太阳表证（发热微恶寒、支节烦疼），又有少阳证（微呕、心下支结）。****『支结』就是胸胁下有个东西支撑着、结在一起的感觉，这是少阳的典型证。****这个方子临床上非常好用——治疗感冒合并肠胃不适、或者关节痛加上胃口不好。****柴胡桂枝各半汤的意思：小柴胡汤和桂枝汤各取一半的剂量合起来。**」\n\n**【极重要】柴胡桂枝汤 = 小柴胡 + 桂枝（太阳少阳并病）**\n\n```\n太阳证（发热微恶寒、支节烦疼）\n+ 少阳证（微呕、心下支结）\n→ 柴胡桂枝汤（各半量合方）\n```\n\n**「这是最精的『合方』思路（经方的叠加使用）。」** ✓✓","o":"RJ-2770 · 《人纪·伤寒论》条辨一六一及柴胡桂枝汤方（PDF 第 221 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"柴胡桂枝干姜汤","c":"【条辨一六二】「**伤寒五六日，已发汗而复下之。****胸胁满，微结，小便不利，渴而不呕，但头汗出，往来寒热，心烦者，此为未解也，柴胡桂枝干姜汤」主之。**讲义：「**这条有几个眼目：『胸胁满微结』（少阳）、『小便不利』（水停）、『渴而不呕』（津伤而胃无热）、『但头汗出』（热郁于上、不能下达）、『往来寒热』（少阳）、『心烦』（热扰）。****这是汗下之后，少阳未解、水饮内停、津液受伤的复杂局面。****柴胡桂枝干姜汤：柴胡、桂枝、干姜、栝蒌根、黄芩、牡蛎、甘草。****干姜温中、栝蒌根生津、牡蛎散结。****这个方子后人用来治『痨症』——虚劳、长期低热、盗汗。**」\n\n**【极重要】柴胡桂枝干姜汤（少阳未解 + 水停 + 津伤）**\n\n```\n胸胁满微结 + 小便不利 + 渴而不呕\n+ 但头汗出 + 往来寒热 + 心烦\n→ 柴胡桂枝干姜汤（7 味）\n```\n\n**「但头汗出 = 热郁于上」——「这是最精的半身汗鉴别。」** ✓✓","o":"RJ-2771 · 《人纪·伤寒论》条辨一六二及柴胡桂枝干姜汤方（PDF 第 225 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇：结胸与热入血室","h":"半夏泻心汤治痞","c":"【条辨一六四】「**伤寒」五六日，呕而发热者，「柴胡汤证」具，而以他药下之，「柴胡证」仍在者，复与「柴胡汤」，此虽已下之，不为逆，必蒸蒸而振，却发热汗出而解；****若心下满而硬痛者，此为「结胸」也，「大陷胸汤」主之；****但满而不痛者，此为「痞」，「柴胡」不中与也，宜「半夏泻心汤」。**讲义：「**这条把误下后的三种转归讲清了：****①柴胡证还在——继续用小柴胡汤，会『蒸蒸而振』然后汗出而解（这是战汗）；②心下满而硬痛——变成结胸，用大陷胸汤；③但满而不痛——这是痞，用半夏泻心汤。****半夏泻心汤是治痞的主方：半夏、黄芩、黄连、干姜、人参、甘草、大枣。****寒热并用（芩连清热、干姜温中），辛开苦降（半夏辛开、芩连苦降），补泻兼施（人参甘草大枣补中）。****这是治疗肠胃病的第一方。**」\n\n**【最重要】误下三转归：柴胡证 / 结胸 / 痞**\n\n```\n柴胡证仍在 → 小柴胡汤（蒸蒸而振→汗出而解）\n心下满硬痛 → 结胸（大陷胸汤）\n但满而不痛 → 痞（半夏泻心汤）\n```\n\n**「半夏泻心汤 = 寒热并用 + 辛开苦降 + 补泻兼施」——「这是最精的组方结构。」** ✓✓✓","o":"RJ-2772 · 《人纪·伤寒论》条辨一六四及半夏泻心汤方（PDF 第 231 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"十枣汤证","c":"【条辨一六七】「**太阳中风」下利，呕逆，表解者，乃可攻之：****其人漐漐汗出，发作有时，头痛，心下痞鞕满，引胁下痛，呕即短气，汗出不恶寒者，此表解里未和也，「十枣汤」主之。**讲义：「**十枣汤是攻逐水饮的第一方。****怎么判断是水饮？看几个眼目：『漐漐汗出』（一阵阵出汗）、『发作有时』（定时发）、『心下痞鞕满』（胃部硬满）、『引胁下痛』（牵扯到胁下痛）、『呕即短气』（呕的时候气短）。****最关键的是『汗出不恶寒』——出汗但不恶寒，说明表已解，病在里面（水饮）。****这水饮在胸胁之间（『悬饮』）。****十枣汤：甘遂、芫花、大戟三味峻药，加十枚大枣。****三个猛药加十个红枣，为什么？红枣护胃，缓三药的峻猛，不让它们伤脾胃。**」\n\n**【最重要】十枣汤四大眼目：漐漐汗出、发作有时、心下痞鞕满、引胁下痛**\n\n```\n十枣汤 = 甘遂 + 芫花 + 大戟（各等分/峻药）+ 大枣十枚（护胃）\n「汗出不恶寒」→ 表解里未和（可攻）\n```\n\n**须「绝「对「强「标」**：**「①三药皆峻，可致剧烈腹泻/脱水/电解质紊乱；②须住院/专业医师；③绝对不可自服；④大枣必须十枚（护胃）”** ✓✓✓","o":"RJ-2773 · 《人纪·伤寒论》条辨一六七及十枣汤方（PDF 第 236 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"大黄黄连泻心汤","c":"【条辨一六九】「**心下痞」，按之濡，其脉关上浮者，「大黄黄连泻心汤」主之。**讲义：「**这条是『热痞』。****『按之濡』——按下去软的，说明是气痞，没有实质之物（跟结胸的『按之石鞕』正好相反）。****『其脉关上浮』——关脉（候中焦）浮，说明热在中焦。****这是无形之热邪结在心下，所以用大黄黄连泻心汤。****注意煎法很特别：『上二味，以麻沸汤二升渍之，须臾绞去滓，分温再服』——用滚水冲泡一下，不煎煮！****为什么？因为要取其『气』（清上焦热），不要取其『味』（泻下）。****这是经方里最特殊的服法。**」\n\n**【极重要】热痞：按之濡 + 关上浮 → 大黄黄连泻心汤（麻沸汤渍之，不煮）**\n\n```\n结胸：按之石鞕（实）→ 大陷胸汤\n热痞：按之濡（无形）→ 大黄黄连泻心汤（泡服取气）\n```\n\n**「滚水冲泡不煎煮，取气不取味」——「这是全书最精的煎服法（治上焦如羽）。」** ✓✓✓","o":"RJ-2774 · 《人纪·伤寒论》条辨一六九及大黄黄连泻心汤方（PDF 第 241 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"附子泻心汤","c":"【条辨一七〇】「**心下痞」，而复恶寒，汗出者，「附子泻心汤」主之。**讲义：「**这条是『寒热错杂』的痞。****上面心下痞（热），下面又恶寒、汗出（阳虚）。****这是上有热、下有寒，或者说『表阳虚而里有热』。****怎么治？如果只用大黄黄连，会更伤阳气；如果只用附子，热又清不掉。****所以张仲景用『附子泻心汤』——把大黄、黄连、黄芩用滚水泡（取气清上热），另外单独用附子一味煮（取味温下寒），然后把两种药汁合在一起服。****这个方子的配伍是中医『寒热并用』的最高典范。**」\n\n**【极重要】附子泻心汤：痞（热）+ 恶寒汗出（阳虚）→ 上热下寒分开治**\n\n```\n大黄/黄连/黄芩 → 麻沸汤泡（清上热）\n附子 → 另煮（温下寒）\n两汁合服（寒热并行）\n```\n\n**「分开煎、合起来服」——「这是最精的双向配伍。」** ✓✓","o":"RJ-2775 · 《人纪·伤寒论》条辨一七〇及附子泻心汤方（PDF 第 243 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"生姜泻心汤","c":"【条辨一七二】「**伤寒」，汗出，解之后，胃中不和，心下痞鞕，干噫食臭，胁下有水气，腹中雷鸣，下利者，「生姜泻心汤」主之。**讲义：「**这条的病机是『胃中不和、水气内停』。****几个关键症状：****『干噫食臭』——打嗝带出食物的酸臭味，这是典型的宿食不化；****『胁下有水气』——肋下停水；****『腹中雷鸣』——肚子里咕噜咕噜响（水气流动的声音）；****『下利』。****生姜泻心汤在半夏泻心汤的基础上，把干姜减到一两，另外加生姜四两。****为什么加生姜？生姜能散水气、止呕、开胃。****临床上这个方治胃炎、肠炎、消化不良，肚子咕噜响是关键依据。**」\n\n**【极重要】生姜泻心汤四大症：干噫食臭 + 胁下有水气 + 腹中雷鸣 + 下利**\n\n```\n半夏泻心汤（干姜三两）→ 生姜泻心汤（干姜减为 1 两 + 生姜 4 两）\n生姜 → 散水气/止呕\n「腹中雷鸣」为核心指征\n```\n\n**「干噫食臭」——「这是最精的宿食指标（打嗝带酸臭味）。」** ✓✓","o":"RJ-2776 · 《人纪·伤寒论》条辨一七二及生姜泻心汤方（PDF 第 245 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"甘草泻心汤","c":"【条辨一七三】「**『伤寒』：『中风』，医反下之，其人下利，日数十行，谷不化，腹中雷鸣，心下痞鞭而满，干呕，心烦不得安，医见心下『痞』，谓病不尽，复下之，其痞益甚，此非『热结』，但以胃中虚，客气上结，故使鞭也，『甘草泻心汤』主之。**」讲义：「**这条最精彩的是『谷不化』——拉出来的还是完整的谷物，一天几十次，这是脾胃虚到了极点，完全不能消化。****『心烦不得安』——不是热的烦躁，而是虚烦。****医生说『心下痞』还没好，再用下法，结果痞更重了。****张仲景点出真相：『此非热结，但以胃中虚，客气上结，故使鞭也』——这不是热结，是胃气虚极了，虚气上逆结在一起，所以按着硬。****甘草泻心汤就是把黄连泻心汤里的甘草加量（从三两加到四两），补中气的力量最强。**」\n\n**【最重要】甘草泻心汤：谷不化 + 日数十行 + 心烦不安 + 痞鞭满**\n\n```\n病机：「胃中虚，客气上结」（非热结！）\n甘草加量（4 两）→ 补中气为君\n误下→痞更重（越攻越虚）\n```\n\n**「『此非热结，但以胃中虚』——这是全书最精的一句纠错（误下伤中）。」** ✓✓✓\n\n**须「强「标」**：**「①谷不化（完谷不化）+ 日数十行须立即查感染/吸收/内镜；②不可再用攻下；③须补液/纠正电解质」** ✓✓","o":"RJ-2777 · 《人纪·伤寒论》条辨一七三及甘草泻心汤方（PDF 第 247 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"赤石脂禹余粮汤","c":"【条辨一七四】「**『伤寒』，服汤药，下利不止，心下痞鞭，服『泻心汤』已，复以他药下之，利不止，医以『理中』与之，利益甚：****『理中』者，理中焦，此利在下焦，『赤石脂禹余粮汤』主之；复利水止者，当利其小便。**」讲义：「**这条讲的是『分层治利』的思维。****① 先用泻心汤治中焦的痞，不行；② 再用理中汤治中焦虚寒，利反而更重——因为病不在中焦；③ 判断『此利在下焦』——下焦（大肠、肾）滑脱不禁；④ 用赤石脂禹余粮汤——两味都是矿物药，能『涩肠固脱』，是止利的最后一道防线；⑤ 如果还不好，『当利其小便』——用利小便的方法来实大便（『利小便以实大便』）。****这就是治利的四个层次：中焦→下焦→膀胱。**」\n\n**【极重要】治下利四层次：泻心汤（中焦痞）→ 理中（中焦寒）→ 赤石脂禹余粮（下焦滑脱）→ 利小便实大便**\n\n```\n「理中者，理中焦；此利在下焦」\n赤石脂 + 禹余粮（矿物涩肠固脱）\n最后一招：利小便以实大便\n```\n\n**「利小便以实大便」——「这是最精的『分利』思维。」** ✓✓✓","o":"RJ-2778 · 《人纪·伤寒论》条辨一七四及赤石脂禹余粮汤方（PDF 第 249 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"旋覆代赭汤","c":"【条辨一七六】「**『伤寒』，发汗，若吐，若下，解后心下痞鞭，噫气不除者，『旋覆代赭石汤』主之。**」讲义：「**这条的核心症状是『噫气不除』——打嗝、嗳气，一直打个不停，怎么都止不住。****为什么？汗吐下之后，胃气受伤，痰浊留在心下，胃气上逆。****旋覆代赭石汤：旋覆花、代赭石、半夏、生姜、人参、甘草、大枣。****旋覆花降气消痰，代赭石重镇降逆（像石头一样把上逆的气压下去），半夏生姜止呕，人参甘草大枣补胃。****这个方子临床上治打嗝、嗳气、反酸、胃食道逆流非常好用——特别是那种『怎么都止不住』的。**」\n\n**【最重要】噫气不除（打嗝不止）→ 旋覆代赭汤**\n\n```\n旋覆花（降气消痰）+ 代赭石（重镇降逆）\n+ 半夏/生姜（止呕）+ 人参/甘草/大枣（补胃）\n```\n\n**「代赭石『重镇』」——「这是最精的物理化解释（用重量压住上逆之气）。」** ✓✓\n\n**须「强「标」**：**「①打嗝不止须排胃癌/食道癌/膈肌痉挛；②须胃镜；③不可只靠中药」** ✓✓","o":"RJ-2779 · 《人纪·伤寒论》条辨一七六及旋覆代赭石汤方（PDF 第 252 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"桂枝人参汤","c":"【条辨一七八】「**『太阳病』，外证未除而数下之，遂协热下利，利下不止，心下痞鞭，表里不解者，『桂枝人参汤』主之。**」讲义：「**『协热下利』——本来是表证，反复误下，表邪内陷，跟里寒一起造成下利。****『利下不止、心下痞鞭、表里不解』——表证还在（外证未除），里也虚了（下利、痞）。****桂枝人参汤就是理中汤加桂枝：人参、白术、干姜、甘草（理中汤）+ 桂枝。****理中汤温中健脾止利，桂枝解表。****这是『表里双解』的又一个范式——但跟桂枝人参汤配伍不同的是，这里的桂枝是后下（取其解表）。**」\n\n**【极重要】协热下利（表证误下致利）→ 桂枝人参汤（理中 + 桂枝）**\n\n```\n表证未除 + 数下 → 协热下利\n桂枝人参汤 = 理中汤（人参/白术/干姜/甘草）+ 桂枝\n桂枝后下（取解表之气）\n```\n\n**「这是最精的『表里双解』。」** ✓✓","o":"RJ-2780 · 《人纪·伤寒论》条辨一七八及桂枝人参汤方（PDF 第 255 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"瓜蒂散催吐","c":"【条辨一八一】「**病如『桂枝证』，头不痛，项不强，寸脉微浮，胸中痞鞭，气上冲咽喉，不得息者，此为胸有寒也，当吐之，宜『瓜蒂散』。**」讲义：「**这条是『吐法』的代表。****症状像桂枝汤证，但『头不痛、项不强』（不是太阳经的病）；『寸脉微浮』（病在上部）；『胸中痞鞭，气上冲咽喉，不得息』——胸中硬，有气往上冲到喉咙，呼吸都困难。****张仲景说『此为胸有寒也，当吐之』——这是寒痰堵在胸中，位置高，当用吐法把它吐出来。****瓜蒂散：瓜蒂（甜瓜蒂）+ 赤小豆，研末，用豆豉汤送服，一服即吐。****这是『其高者因而越之』的具体应用——病在上的，用吐法。**」\n\n**【极重要】吐法代表：胸中痞鞭 + 气上冲咽喉 + 不得息 → 瓜蒂散**\n\n```\n瓜蒂（甜瓜蒂）+ 赤小豆（研末）+ 豆豉汤送服\n「其高者，因而越之」（病在上用吐法）\n```\n\n**须「绝「对「强「标」**：**「①瓜蒂有毒（可致剧烈呕吐/脱水/电解质紊乱）；②须专业医师；③老人/儿童/体虚/孕妇禁；④现代极少用」** ✓✓✓","o":"RJ-2781 · 《人纪·伤寒论》条辨一八一及瓜蒂散方（PDF 第 257 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"藏结死证","c":"【条辨一八二】「**病肋下素有『痞』，连在肋旁，痛引少腹，入阴筋者，此为『藏结』，死。**」讲义：「**这条是藏结的死证。****『肋下素有痞』——肋下本来就有个硬块；『连在肋旁』——硬块连着肋旁；『痛引少腹』——痛牵扯到小腹；『入阴筋』——痛到阴部（阴囊、会阴）。****这一串症状说明：邪从胁下（肝经）、到少腹（肝经/任脉）、到阴筋，一路下走，是阴寒实邪深入三阴。****张仲景直接判『死』——这是绝症。****为什么要写这条？是让医生知道什么时候该收手，不要乱治。**」\n\n**【最重要】藏结死证：胁下痞连肋旁 + 痛引少腹 + 入阴筋**\n\n```\n「胁下素有痞」→「连在肋旁」→「痛引少腹」→「入阴筋」\n阴寒实邪深入三阴 → 死（绝症）\n```\n\n**须「绝「对「强「标」**：**「①此类症状须立即排腹部CT/超声（肿瘤/转移/腹膜）；②须查睾丸/前列腺/盆腔；③不可按『死』放弃治疗」** ✓✓✓\n\n**「写『死』是为了让医生知道何时收手」——「这是最精的医疗边界。」** ✓✓","o":"RJ-2782 · 《人纪·伤寒论》条辨一八二（PDF 第 260–261 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"白虎加人参汤","c":"【条辨一八三】「**『伤寒』，若吐，若下后，七八日不解，热结在里，表里俱热，时汗，恶风，大渴而烦，舌上干燥，欲饮水数升者，『白虎加人参汤』主之。**」【条辨一八四】「**『伤寒』，无大热，口燥渴，心烦，背微恶寒者，『白虎加人参汤』主之。**」【条辨一八五】「**『伤寒』，脉浮，发热，无汗，其表不解者，不可与『白虎汤』。****渴欲饮水，无表证者，『白虎加人参汤』主之。**」讲义：「**白虎加人参汤的核心指征是『大渴、舌上干燥、欲饮水数升』——这是热盛伤津，津液大亏。****白虎汤（石膏、知母、甘草、粳米）清气分大热；加人参补气生津。****条辨一八四『无大热，口燥渴，心烦，背微恶寒』——这是热盛但热不显于外，反而背微恶寒（阳气不能布达背部），也是白虎加人参汤证。****条辨一八五很重要：『其表不解者，不可与白虎汤』——表证还在，用白虎汤会把邪气冰伏在内，出不来。****必须是『无表证』才能用。**」\n\n**【最重要】白虎加人参汤 vs 白虎汤的分界：大渴/舌上干燥/欲饮水数升**\n\n```\n白虎汤：脉浮滑、表有寒里有热（清大热）\n白虎加人参汤：大渴 + 舌上干燥 + 欲饮水数升（热盛伤津）\n铁律：「表不解者，不可与白虎汤」（冰伏邪气）\n```\n\n**「『表不解不可与白虎汤』——这是最精的禁忌。」** ✓✓✓","o":"RJ-2783 · 《人纪·伤寒论》条辨一八三至一八五（PDF 第 261–263 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"黄芩汤与黄连汤","c":"【条辨一八七】「**『太阳』与『少阳』合病，自下利者，与『黄芩汤』；若呕者，『黄芩加半夏生姜汤』主之。**」【条辨一八八】「**『伤寒』，胸中有热，胃下有邪气，腹中痛，欲呕吐者，『黄连汤』主之。**」讲义：「**黄芩汤：黄芩、芍药、甘草、大枣。****这是治『热利』的主方——太阳少阳合病，热邪下迫大肠，造成下利。****黄芩清少阳热、芍药甘草缓急止痛、大枣和中。****后世治痢疾的方子多从黄芩汤化出。****黄连汤：黄连、甘草、干姜、桂枝、人参、半夏、大枣。****这条讲的『胸中有热、胃下有邪气』——上热下寒：上面胸中有热（想呕），下面胃中有寒（腹痛）。****黄连清上热、干姜温下寒、桂枝通阳、人参补中。****黄连汤是『上热下寒』的代表方。**」\n\n**【极重要】黄芩汤（热利）与黄连汤（上热下寒）**\n\n```\n黄芩汤 = 黄芩/芍药/甘草/大枣（太阳少阳合病自下利）\n黄连汤 = 黄连/甘草/干姜/桂枝/人参/半夏/大枣（胸热+胃寒腹痛欲呕）\n```\n\n**「黄连汤 = 上热下寒的典范」——「这是最精的寒热错杂方。」** ✓✓","o":"RJ-2784 · 《人纪·伤寒论》条辨一八七、一八八及两方（PDF 第 264–266 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"风湿三方与白虎汤","c":"【条辨一八九】「**『伤寒』，八九日，风湿相搏，身体烦疼，不能自转侧，不呕，不渴，脉浮虚而濇者，『桂枝附子汤』主之；若其人大便溏，小便自利者，『桂枝附子去桂枝加白术汤』主之。**」【条辨一九〇】「**风湿相搏，骨节烦疼，掣痛，不得屈伸，近之则痛剧，汗出，短气，小便不利，恶风不欲去衣被，或身微肿者，『甘草附子汤』主之。**」【条辨一九一】「**『伤寒』脉浮滑，此表有寒，里有热，『白虎汤』主之。**」讲义：「**风湿三方：****① 桂枝附子汤——风湿在表，身体烦疼、不能转侧、脉浮虚而涩（涩=湿）；② 桂枝附子去桂加白术汤——如果大便溏、小便自利，说明湿在里，去掉桂枝（怕发散太过），加白术健脾燥湿；③ 甘草附子汤——『骨节烦疼、掣痛不得屈伸、近之则痛剧』，这是风湿最重的地方（关节），止痛为主。****临床上这三个方治风湿性关节炎、痛风。****白虎汤证：脉浮滑、表有寒里有热。**」\n\n**【极重要】风湿三方分工**\n\n| 方 | 病位 | 主症 |\n|---|---|---|\n| **桂枝附子汤** | 表（肌肉） | 身体烦疼、不能转侧、脉浮虚涩 |\n| **桂枝附子去桂加白术汤** | 里（脾湿） | + 大便溏、小便自利 |\n| **甘草附子汤** | 关节（最重） | 骨节掣痛、不得屈伸、近之则痛剧 |\n\n**「近之则痛剧」——「这是最精的关节痛特征（触痛）。」** ✓✓","o":"RJ-2785 · 《人纪·伤寒论》条辨一八九至一九一及三方（PDF 第 268–273 页）。"},{"t":"伤寒论·辨太阳病脉证并治法下篇（续）：泻心汤、十枣汤、炙甘草汤","h":"炙甘草汤","c":"【条辨一九二】「**『伤寒』，脉『结』『代』，心动悸，『炙甘草汤』主之。**」【条辨一九三】「**脉，按之来缓，而时一止复来者，名曰『结』，阴也。****又脉来数，而中止更来，及小数中止能自还者，名曰『促』，阳也。****脉来缓，而中止不能自还，因而复动者，名曰『代』，阴也；得此脉者，必难治。**」讲义：「**炙甘草汤是治心律不整的第一方。****主证：『脉结代、心动悸』——脉搏有停顿（结/代），心脏跳得厉害（心悸）。****炙甘草汤九味：炙甘草、生姜、人参、生地黄、桂枝、阿胶、麦门冬、麻仁、大枣。****这个方子最特别的是生地黄用一斤（量极大），配麦冬、阿胶、麻仁滋阴养血；人参甘草补气；桂枝生姜通阳。****这是『气阴双补』。****条辨一九三辨三种脉：结脉（缓而时一止）、促脉（数而中止能自还）、代脉（中止不能自还）。****『代脉最难治』。**」\n\n**【最重要】炙甘草汤 = 脉结代 + 心动悸（心律不整第一方）**\n\n```\n炙甘草汤（9 味）：炙甘草/生姜/人参/生地黄(一斤)/桂枝/阿胶/麦门冬/麻仁/大枣\n气阴双补（生地一斤为君）\n┌ 结脉：缓而时一止（阴）\n├ 促脉：数而中止能自还（阳）\n└ 代脉：中止不能自还（阴，难治）\n```\n\n**须「绝「对「强「标」**：**「①心动悸/脉结代须立即心电图/Holter；②须排房颤/早搏/传导阻滞/心衰；③不可以炙甘草汤代替抗凝/起搏/消融」** ✓✓✓\n\n**「生地一斤」——「这是最精的剂量眼目（滋阴为主）。」** ✓✓","o":"RJ-2786 · 《人纪·伤寒论》条辨一九二、一九三及炙甘草汤方（PDF 第 274–280 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"阳明病总纲","c":"【条辨一九四】「**问曰：病有『太阳阳明』，有『正阳阳明』，有『少阳阳明』，何谓也？****答曰：『太阳阳明』者，发汗脾约是也；『正阳阳明』者，胃家实是也；『少阳阳明』者，利小便，胃中燥实，大便难是也。**」【条辨一九五】「**阳明之为病，胃家实也。**」讲义：「**阳明病就是肠胃里面的实热。****『胃家实』这三个字是阳明病的总纲——胃家（包括胃和大肠）有实邪。****阳明病有三个来源：****① 太阳阳明——太阳病发汗太过，津液受伤，脾不能为胃行津液，肠子干燥（『脾约』）；② 正阳阳明——本来就是肠胃实热，直接发作；③ 少阳阳明——少阳病用了利小便的药，津液从下走，胃中干燥。****这三条路都通到同一个终点：胃家实。**」\n\n**【最重要】阳明病总纲 = 「胃家实」；三个来源：太阳阳明（脾约）/ 正阳阳明 / 少阳阳明**\n\n```\n太阳阳明 → 发汗太过 → 脾约（津伤便硬）\n正阳阳明 → 胃家实（本自实热）\n少阳阳明 → 利小便 → 胃中燥实\n```\n\n**「『胃家实』三字——这是全篇最凝练总纲。」** ✓✓✓","o":"RJ-2787 · 《人纪·伤寒论》条辨一九四、一九五（PDF 第 283 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"阳明病外证","c":"【条辨一九七】「**问曰：阳明病，外证云何？****答曰：身热，汗自出，不恶寒，反恶热也。**」【条辨一九八】「**问曰：病有得之一日，不发热而恶寒者，何也？****答曰：虽得之一日，恶寒将自罢，即自汗出而恶热也。**」【条辨一九九】「**问曰：恶寒何故自罢？****答曰：『阳明』居中土也，万物所归，无所复传，始虽恶寒，二日自止，此为『阳明病』也。**」讲义：「**阳明病的外证就三句话：『身热、汗自出、不恶寒、反恶热』。****这四个症状把阳明病的性格讲透了——热、汗、不怕冷、反而怕热。****为什么不恶寒？因为阳明是『中土，万物所归，无所复传』——阳明是终点站，所有的邪气到这里都归土，不再往别处传了。****所以一开始可能有点恶寒，但两天就自己停了，转成汗出而恶热。**」\n\n**【最重要】阳明病四大外证：身热 + 汗自出 + 不恶寒 + 反恶热**\n\n```\n「阳明居中土，万物所归，无所复传」（终点站）\n初起可恶寒 → 二日自止 → 转汗出而恶热\n```\n\n**「阳明是终点站」——「这是最精的病机定位。」** ✓✓","o":"RJ-2788 · 《人纪·伤寒论》条辨一九七、一九八、一九九（PDF 第 284–285 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"能食为中风不能食为中寒","c":"【条辨二〇六】「**【阳明病】，若能食，名【中风】，不能食，名【中寒】。**」【条辨二〇七】「**【阳明病】，若【中寒】，不能食，小便不利，手足濈濈然汗出，此欲作【固瘕】，必大便初鞭后溏，所以然者，以胃中冷，水榖不别故也。**」讲义：「**阳明病分两种：能吃饭的叫『中风』（这里的『中风』指阳明中风，是热），不能吃饭的叫『中寒』。****为什么不能食？因为胃里有寒，寒则不消谷，所以不想吃。****条辨二〇七更细：不能食 + 小便不利 + 手足濈濈然汗出，这是要形成『固瘕』（一种顽固的腹中积块），大便一定『初鞭后溏』——前面硬后面稀。****为什么？『以胃中冷，水榖不别故也』——胃冷，水谷分不清，所以混杂在一起。****这就是寒热在阳明病里也要分清的证明。**」\n\n**【极重要】阳明病也要分寒热：能食（中风/热）vs 不能食（中寒）**\n\n```\n能食 → 阳明中风（热）\n不能食 + 小便不利 + 手足汗 → 中寒 → 固瘕\n「初鞭后溏」= 胃中冷、水谷不别\n```\n\n**「初鞭后溏」——「这是最精的寒热混杂便象（与 n225转矢气」互证）。** ✓✓","o":"RJ-2789 · 《人纪·伤寒论》条辨二〇六、二〇七（PDF 第 288–289 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"阳明病欲解时","c":"【条辨二〇九】「**【阳明】病，欲解时，从申至戌上。**」讲义：「**阳明病什么时候容易好？从申时到戌时——下午 3 点到晚上 9 点。****为什么？因为申酉戌是阳明经当令的时辰，阳明之气最旺，正能胜邪。****前面太阳病是巳至未（上午 9 点到下午 3 点），少阳病是寅至辰（凌晨 3 点到早上 9 点）。****这个『欲解时』三经连起来，正好覆盖了一天 24 小时的后半段——阳气最旺的时段。****临床上观察，阳明病的高热往往在傍晚（日晡所）加重，这是『日晡潮热』。**」\n\n**【极重要】阳明病欲解时：申至戌（15:00–21:00）**\n\n```\n太阳：巳–未（9–15）\n阳明：申–戌（15–21）\n少阳：寅–辰（3–9）\n「日晡潮热」= 傍晚加重的发热\n```\n\n**「日晡潮热」——「这是最精的时间-症状对应（与 n256 前条合看）。」** ✓✓","o":"RJ-2790 · 《人纪·伤寒论》条辨二〇九（PDF 第 290 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"胃中虚冷攻热必哕","c":"【条辨二一〇】「**【阳明病】，不能食，攻其热必哕；所以然者，胃中虚冷故也，以其人本虚，故攻其热必哕。**」讲义：「**这条是极重要的禁忌。****阳明病不能吃饭——已经提示胃中虚冷了，这时候如果去『攻其热』（用苦寒攻下），一定会『哕』（打嗝、干呕）。****为什么？『胃中虚冷故也，以其人本虚』——这个人本来就是虚的，胃是冷的，你再用寒药攻，胃气就败了。****记住：不能食的阳明病，绝对不能攻！这是辨虚实的生死线。**」\n\n**【极重要】「不能食 + 攻其热必哕」——虚寒禁攻**\n\n```\n不能食（胃中虚冷）→ 不可攻\n攻之 → 哕（胃气败）\n「以其人本虚」\n```\n\n**须「强「标」**：**「①阳明病不能食须先辨虚实；②虚寒禁苦寒攻下；③须查胃镜/电解质」** ✓✓✓","o":"RJ-2791 · 《人纪·伤寒论》条辨二一〇（PDF 第 290 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"但欲漱水不欲咽必衄","c":"【条辨二一八】「**【阳明病】，口燥，但欲漱水，不欲咽者，此必衄。**」讲义：「**『口燥，但欲漱水，不欲咽』——嘴巴干，只想用水漱漱口，不想咽下去。****为什么不想咽？因为有热在血分，不在气分。****水入胃能解气分之热，但解不了血分之热，所以病人本能地不想咽。****『此必衄』——这种热在血分的情况，往往会从鼻子出血（衄血）来解。****这是『红汗』——热随血解。****临床上见这种『漱水不欲咽』的，就知道热在血分，要小心出血。**」\n\n**【极重要】「但欲漱水不欲咽」= 热在血分（将衄血）**\n\n```\n气分热 → 渴而欲饮（咽）\n血分热 → 但欲漱水不欲咽（此必衄）\n「红汗」= 热随血解\n```\n\n**须「强「标」**：**「①漱水不欲咽须查血常规/凝血；②衄血须查血小板/凝血功能；③反复鼻血须耳鼻喉」** ✓✓","o":"RJ-2792 · 《人纪·伤寒论》条辨二一八（PDF 第 294 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"阳明四不可攻","c":"【条辨二二〇】「**【伤寒】，呕多，难有【阳明证】，不可攻之。**」【条辨二二一】「**【阳明病】，心下鞭满者，不可攻之，攻之，利遂不止者死，利止者愈。**」【条辨二二二】「**【阳明病】，发热，面含赤色，不可攻之。****攻之，小便不利者，必发黄也。**」讲义：「**这三条讲阳明病『不可攻』的四种情况：****① 呕多——呕是少阳/胃气上逆的表现，邪在上焦，攻下会把邪气引入，且伤胃气；② 心下鞭满——病在心下（胃部），不在肠道，攻下无益反伤；③ 面合赤色——热在表（阳气怫郁在上），不是里实，攻下会伤津，小便不利就发黄；④（隐含）不能食（上条）。****这就是『阳明四不可攻』——凡是病位不在肠、或正气已虚、或热不在里的，都不能攻。**」\n\n**【最重要】阳明四不可攻：呕多 / 心下鞭满 / 面合赤色 / 不能食**\n\n```\n呕多（邪在上）→ 不可攻\n心下鞭满（病不在肠）→ 不可攻（攻之利不止者死）\n面合赤色（热在表）→ 不可攻（攻之必发黄）\n不能食（胃虚冷）→ 不可攻\n```\n\n**「攻之，利遂不止者死」——「这是最精的攻下警戒。」** ✓✓✓","o":"RJ-2793 · 《人纪·伤寒论》条辨二二〇、二二一、二二二（PDF 第 294–295 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"三承气汤分工","c":"【条辨二二四】「**【阳明病】，脉迟，虽汗出，不恶寒，其身必重，短气，腹满而喘，有潮热者，此外欲解，可攻里也。****手足濈然汗出者，此大便已鞭也，【大承气汤】主之。**」【三方】「**大承气汤方：大黄四两、厚朴半斤、枳实五枚、芒硝三合。****小承气汤方：大黄四两、厚朴二两、枳实三枚。****调胃承气汤方：大黄四两、芒硝半斤、甘草二两。**」讲义：「**三个承气汤是张仲景攻下的三把刀，各有分工：****① 大承气汤——四味齐全（大黄、厚朴、枳实、芒硝），力量最猛。主治『痞、满、燥、实、坚』俱全的重症。****② 小承气汤——只有大黄、厚朴、枳实，没有芒硝，力量轻。主治痞满实而无燥坚（大便已硬但未干结）。****③ 调胃承气汤——大黄、芒硝、甘草。加甘草是为了缓和大黄的峻猛，让药力在中焦缓缓作用。主治蒸蒸发热、谵语、大便不通而腹不胀满。****记住口诀：大承气（痞满燥实坚）、小承气（痞满实）、调胃承气（燥实而无痞满）。**」\n\n**【最重要】三承气汤分工（痞满燥实坚）**\n\n| 方 | 组成 | 主治 |\n|---|---|---|\n| **大承气汤** | 大黄4/厚朴8/枳实5/芒硝3 | 痞+满+燥+实+坚（最猛） |\n| **小承气汤** | 大黄4/厚朴2/枳实3（无芒硝） | 痞+满+实（无燥坚） |\n| **调胃承气汤** | 大黄4/芒硝8/甘草2 | 燥+实（无痞满），甘草缓峻 |\n\n**「手足濈然汗出 = 大便已硬」——「这是最精的腹诊替代指征。」** ✓✓✓","o":"RJ-2794 · 《人纪·伤寒论》条辨二二四及三承气汤方（PDF 第 296–305 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"转矢气辨燥屎","c":"【条辨二二五】「**阳明病」，潮热：大便已鞕者，可与「大承气汤」；不鞕者，不可与之。****若不大便六七日，恐有燥屎，欲知之法，少与「小承气汤」，汤入腹中，转矢气者，此有燥屎，乃可攻之；****若不转矢气者，此但初头鞕后必溏，不可攻之，攻之必胀满，不能食也，欲饮水者，与水则哕。**讲义：「**这条是最精的『试探法』。****怎么知道肠子里有没有燥屎（干硬的粪便）？张仲景教了一个办法：先给一点小承气汤（轻剂），观察反应——****① 如果『转矢气』（放屁），说明有燥屎，气被药力推动，可以攻；② 如果不放屁，说明只是『初头硬后必溏』——前面硬后面稀（不是真燥屎），不能攻；③ 硬攻的后果：胀满不能食、喝水就打嗝。****这就是『以药试病』——用最小的代价换取诊断信息。**」\n\n**【最重要】试探法：先给小承气汤，转矢气 = 有燥屎（可攻）；不转矢气 = 初硬后溏（不可攻）**\n\n```\n转矢气（放屁）→ 有燥屎 → 可攻\n不转矢气 → 初头硬后必溏 → 不可攻（攻之胀满不能食）\n```\n\n**「以药试病」——「这是全书最精的诊断智慧（用小代价换信息）。」** ✓✓✓","o":"RJ-2795 · 《人纪·伤寒论》条辨二二五（PDF 第 303–306 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"谵语与郑声","c":"【条辨二二六】「**夫实则谵语，虚则郑声，郑声，重语也。**」讲义：「**这条辨虚实最精。****『谵语』——说胡话，声音高亢、语无伦次，这是实证（热扰心神）。****『郑声』——声音低微、反复重复同一句话（『重语也』），这是虚证（心神失养）。****为什么叫『郑声』？因为郑国的音乐被认为是『淫靡而软弱』的，用来比喻声音低微重复。****临床上：谵语要攻（承气汤），郑声要补（不能攻）。****一句话辨虚实：声音高亢 vs 声音低微重复。**」\n\n**【最重要】谵语（实/高亢）vs 郑声（虚/低微重复）**\n\n```\n谵语：声音高亢、语无伦次 → 实 → 可攻\n郑声：声音低微、重复同句（重语）→ 虚 → 不可攻\n```\n\n**须「强「标」**：**「①谵语/郑声须排感染/脱水/电解质/脑病；②须查血糖/钠/氨；③不可仅凭声音虚实用药」** ✓✓✓","o":"RJ-2796 · 《人纪·伤寒论》条辨二二六（PDF 第 306 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"谵语死证","c":"【条辨二二七】「**谵语，直视，喘满者，死；下利者，亦死。**」【条辨二二八】「**发汗很多，若重发汗者，亡其阳，谵语，脉短者，死；脉自和者，生。**」【条辨二二九】「**伤寒」，若吐，若下后，不解，不大便五六日，日晡所发潮热，不恶寒，独语如见鬼状；若剧者，发则不识人，循衣摸床，惕而不安，微喘，直视；脉弦者生，濇者死。**讲义：「**这几条是阳明病的死证预警：****① 谵语 + 直视 + 喘满 → 死（邪热伤及肝肾之阴，目直视是肝阴绝）；② 谵语 + 下利 → 死（热邪下陷，阴液枯竭）；③ 重发汗 + 谵语 + 脉短 → 死（亡阳，脉短是气血将绝）；④ 『循衣摸床、惕而不安、微喘、直视』——这是危重病人的典型动作（无意识地摸衣服、摸床沿），加上恐惧不安、微喘、眼睛直视。****『脉弦者生，涩者死』——弦脉还有胃气，涩脉是气血枯竭。**」\n\n**【最重要】四大死证与「循衣摸床」危象**\n\n```\n谵语 + 直视 + 喘满 → 死\n谵语 + 下利 → 死\n重发汗 + 谵语 + 脉短 → 死\n循衣摸床 + 惕而不安 + 微喘 + 直视 → 危（脉弦生/脉涩死）\n```\n\n**须「绝「对「强「标」**：**「①循衣摸床、直视、不识人须立即急诊；②须排脓毒症/脑病/器官衰竭；③不可按『死』放弃」** ✓✓✓\n\n**「循衣摸床」——「这是最精的危重体征（现代 ICU 仍可观察）。」** ✓✓✓","o":"RJ-2797 · 《人纪·伤寒论》条辨二二七、二二八、二二九（PDF 第 306–307 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（上）：胃家实与三承气汤","h":"急下三证","c":"【条辨二六七】「**『伤寒』六七日，目中不了了，睛不和，无表里证，大便难，身微热者，此为实也，急下之，宜『大承气汤』。**」【条辨二六八】「**『阳明病』，发热汗多者，急下之，宜『大承气汤』。**」【条辨二六九】「**发汗，不解，腹满痛者，急下之，宜『大承气汤』。**」【条辨二七〇】「**腹满不减，减不足言，当下之，宜『大承气汤』。**」讲义：「**这四条是阳明病的『急下证』——不是慢慢攻，是必须马上攻：****① 『目中不了了，睛不和』——眼睛看不清、眼球转动不灵活，这是热极伤肝肾之阴，马上要失明或危重，急下存阴；② 『发热汗多』——汗多得止不住，津液快耗干了，急下才能保津；③ 『腹满痛』——肚子胀满而痛，实邪已成，急下；④ 『腹满不减，减不足言』——胀满一直不减轻，说明是实证（不是虚胀）。****这四条的共同逻辑：邪热太盛，再不攻就要把阴液耗光——『急下存阴』。**」\n\n**【最重要】阳明急下四证：目中不了了睛不和 / 发热汗多 / 腹满痛 / 腹满不减**\n\n```\n① 目中不了了、睛不和（热伤肝肾阴）→ 急下存阴\n② 发热汗多（津液将竭）→ 急下保津\n③ 腹满痛（实已成）→ 急下\n④ 腹满不减、减不足言（非虚胀）→ 当下\n```\n\n**须「绝「对「强「标」**：**「①此为实证急下；②但须排腹膜炎/肠梗阻/器官衰竭；③须立即急诊/手术评估」** ✓✓✓\n\n**「急下存阴」——「这是全书最精的『攻中带补』逻辑。」** ✓✓✓","o":"RJ-2798 · 《人纪·伤寒论》条辨二六七至二七〇（PDF 第 342–343 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"茵陈蒿汤治黄疸","c":"【条辨二五一】「**阳明病」，发热汗出，此为越热，不能发黄也。****但头汗出，身无汗，剂颈而还，小便不利，渴饮水浆者，此为瘀热在里，身必发黄，「茵陈蒿汤」主之。**讲义：「**这条把黄疸的成因讲得极清楚。****先立一个对照：『发热汗出』——热能从汗出去，就不会发黄（『此为越热，不能发黄』）。****真正的黄疸是：『但头汗出，身无汗，剂颈而还』——只有头出汗，身上不出汗，汗到脖子就停了（『剂颈而还』）；****『小便不利』——小便也不通；****『渴饮水浆』——想喝水。****这三个加起来：热出不去（无汗）、水排不出（无尿）、热与水湿相合，就成了『瘀热在里』，一定要发黄。****茵陈蒿汤：茵陈蒿、栀子、大黄。****茵陈是退黄专药，栀子清三焦热从小便出，大黄通大便。**」\n\n**【最重要】黄疸三条件：无汗（但头汗出剂颈而还）+ 小便不利 + 渴 → 瘀热在里必发黄**\n\n```\n茵陈蒿汤 = 茵陈蒿 + 栀子 + 大黄（3 味）\n茵陈 → 退黄专药\n「热有出路（汗/尿）则不黄」\n```\n\n**「剂颈而还」——「这是最精的半身汗定位（热郁于上）。」** ✓✓✓","o":"RJ-2799 · 《人纪·伤寒论》条辨二五一及茵陈蒿汤方（PDF 第 328–329 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"蓄血善忘","c":"【条辨二五二】「**阳明证，其人善忘者，必有蓄血。****所以然者，本有久瘀之血，故令善忘；****矢虽鞭，大便反易，其色必黑，宜抵当汤。**」讲义：「**这条极妙——『善忘』（健忘）居然是蓄血（瘀血）的表现。****为什么瘀血会让人健忘？因为瘀血阻滞，神明被蒙，记不住事。****怎么确认？两个证据：****① 『矢虽鞭，大便反易』——大便虽然硬，但排起来反而容易（因为瘀血润滑）；② 『其色必黑』——大便颜色是黑的（瘀血的颜色）。****这三点：善忘 + 便硬反易 + 便色黑，就是蓄血，用抵当汤。****这个方子（水蛭、虻虫、桃仁、大黄）是破血逐瘀最猛的一张牌。**」\n\n**【最重要】蓄血三征：善忘 + 矢虽鞭而大便反易 + 其色必黑**\n\n```\n善忘（瘀血蒙蔽神明）\n矢硬反易（瘀血润滑）\n色黑（瘀血本色）\n→ 抵当汤（水蛭/虻虫/桃仁/大黄）\n```\n\n**须「绝「对「强「标」**：**「①黑便须排上消化道出血（与瘀血鉴别）；②须胃镜/粪隐血；③抵当汤为峻剂，须住院/专业医师」** ✓✓✓\n\n**「善忘 = 瘀血」——「这是最精的『脑-血』关联（现代可解为慢性缺血/微循环）。」** ✓✓","o":"RJ-2800 · 《人纪·伤寒论》条辨二五二（PDF 第 331 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"燥屎四辨","c":"【条辨二五四】「**病人不大便五六日，绕脐痛，烦燥，发作有时者，此有燥矢，故使不大便也。**」【条辨二五六】「**大下后，六七日不便，烦不解，腹满者，此有燥矢也，所以然者，又有宿食故也，宜『大承气汤』。**」【条辨二五七】「**病人小便不利，大便乍难乍易，时有微热，喘冒不得卧者，有燥屎也，宜『大承气汤』。**」讲义：「**这三条讲怎么认出『燥屎』（干硬的宿粪）：****① 『绕脐痛、烦躁、发作有时』——肚脐周围痛，一阵阵发作（肠子在努力推动干粪）；② 『大下后六七日不便、烦不解、腹满』——攻下之后又六七天不解大便，烦躁不减、肚子胀，说明还有宿食；③ 『小便不利、大便乍难乍易、时有微热、喘冒不得卧』——小便不通（津液从大便走），大便有时难有时易，微热，喘而头昏得不能躺下。****最精的是第三条：『喘冒不得卧』——肠中燥屎上迫，导致喘息不能平卧。这是『腑气不通则肺气不降』。**」\n\n**【极重要】燥屎四辨：绕脐痛 / 大下后复结 / 喘冒不得卧 / 转矢气**\n\n```\n绕脐痛 + 烦躁 + 发作有时 → 燥屎\n大下后六七日不便 + 腹满 → 宿食\n小便不利 + 大便乍难乍易 + 喘冒不得卧 → 燥屎\n```\n\n**须「强「标」**：**「①绕脐痛须排肠梗阻/阑尾；②喘冒不得卧须排心衰/肺病；③须立即急诊」** ✓✓","o":"RJ-2801 · 《人纪·伤寒论》条辨二五四、二五六、二五七（PDF 第 333–334 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"吴茱萸汤","c":"【条辨二五八】「**食谷欲呕者，属『阳明』也，『吴茱萸汤』主之。**」讲义：「**『食谷欲呕』——一吃饭就想吐。****为什么属阳明？因为阳明（胃）里有寒，寒则不能受纳，一吃就想吐出来。****吴茱萸汤：吴茱萸、人参、生姜、大枣。****吴茱萸是止呕的专药，但它的止呕是『温胃止呕』——专门治寒性的呕吐；人参大枣补胃，生姜止呕。****这个方子临床上治：胃下垂、胃酸反流、吃饭就呕、头痛（吴茱萸汤也治厥阴头痛）。****注意：如果是热的呕吐（口苦、舌红），绝对不能用吴茱萸汤——那是火上加油。**」\n\n**【最重要】吴茱萸汤：食谷欲呕（胃寒）**\n\n```\n吴茱萸汤 = 吴茱萸 + 人参 + 生姜 + 大枣（4 味）\n主治：胃寒呕吐 / 胃下垂 / 胃酸反流 / 厥阴头痛\n热性呕吐禁（火上加油）\n```\n\n**须「强「标」**：**「①吴茱萸有毒，过量可致肝损；②呕吐须查因（幽门/颅内/化疗）；③热证禁」** ✓✓","o":"RJ-2802 · 《人纪·伤寒论》条辨二五八及吴茱萸汤方（PDF 第 334–335 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"猪苓汤","c":"【条辨二四〇】「**阳明病」，心中懊憹，舌上胎者，宜「栀子豉汤」主之。****若渴欲饮水，口干舌燥者，「白虎加人参汤」主之。**（后半）「**若脉浮，发热，渴欲饮水，小便不利者，猪苓汤」主之。**【猪苓汤方】「**猪苓、茯苓、泽泻、阿胶、滑石（各一两）。**」讲义：「**猪苓汤的眼目是：『脉浮、发热、渴欲饮水、小便不利』——有热、有渴、尿不通。****这是水热互结在下焦（膀胱、尿道）——水排不出去，热也下不去。****猪苓汤五味：猪苓、茯苓、泽泻利水，滑石清热利窍，阿胶滋阴（防止利水伤阴）。****阿胶在这里极关键——利尿药会把阴液也排出去，加阿胶护住阴分。****临床上治肾结石、膀胱结石、尿道炎、前列腺炎。**」\n\n**【极重要】猪苓汤：脉浮发热 + 渴欲饮水 + 小便不利（水热结下焦）**\n\n```\n猪苓汤 = 猪苓/茯苓/泽泻（利水）+ 滑石（清热）+ 阿胶（护阴）\n「利水必护阴」（阿胶的作用）\n```\n\n**须「强「标」**：**「①血尿/排尿痛须查感染/结石/肿瘤；②须尿常规 + 超声；③阿胶须烊化冲服」** ✓✓","o":"RJ-2803 · 《人纪·伤寒论》条辨二四〇及猪苓汤方（PDF 第 312–313 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"猪苓汤禁忌","c":"【条辨二四一】「**阳明病」汗出多而渴者，不可与「猪苓汤」，以汗多胃中燥，「猪苓汤」复利其小便故也。**讲义：「**这条讲的是猪苓汤的禁忌。****『汗出多而渴』——已经出了很多汗，津液大伤，口渴。****这时候如果再用猪苓汤（利尿），就是雪上加霜——本来津液就不够，还要从小便排出去。****『以汗多胃中燥，猪苓汤复利其小便故也』——汗多胃已经干燥，再利小便，津液更亏。****所以：汗多口渴的不利尿，尿少口渴的才利尿。****这是『辨证用利尿』的黄金法则：要看津液的来源（汗 vs 尿）。**」\n\n**【极重要】猪苓汤禁忌：汗出多而渴者不可与（汗多已伤津，再利尿则更伤）**\n\n```\n汗多而渴 → 禁利尿（津已亏）\n小便不利而渴 → 可利尿\n「看津液从哪里丢的」\n```\n\n**须「强「标」**：**「①脱水须先补液再利尿；②须查电解质/肾功；③不可机械利尿」** ✓✓✓","o":"RJ-2804 · 《人纪·伤寒论》条辨二四一（PDF 第 315 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"表热里寒用四逆汤","c":"【条辨二四二】「**脉浮而迟，表热里寒，下利清糓者，四逆汤」主之。**讲义：「**『脉浮而迟』——脉浮是表热，脉迟是里寒（迟主寒）。****『表热里寒』——外面看着热，里面是冷的。****『下利清谷』——拉出来的还是没消化的食物（完谷不化），这是里寒的铁证。****这时候用四逆汤（生附子、干姜、甘草）——回阳救逆。****这是极重要的一条：明明是阳明病篇，却出现四逆汤证，说明『阳明病』只是一个病位标签，寒热虚实才是决定用方的关键。****记住：看到下利清谷，不管什么篇，都要想到四逆汤。**」\n\n**【最重要】表热里寒 + 下利清谷 → 四逆汤（不分篇，看实质）**\n\n```\n脉浮（表热）+ 脉迟（里寒）+ 下利清谷 → 四逆汤\n「完谷不化」= 里寒铁证\n```\n\n**须「绝「对「强「标」**：**「①下利清谷须立即查感染/吸收；②四逆汤含生附子（乌头碱有毒）；③须专业医师/急诊」** ✓✓✓","o":"RJ-2805 · 《人纪·伤寒论》条辨二四二（PDF 第 315 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"麻仁丸治脾约","c":"【条辨二六二】「**『跌阳』脉浮而涩，浮则胃气强，则小便数，浮濇相搏，大便则难，其脾约，『麻仁丸』主之。**」【麻仁丸方】「**麻子仁二升、芍药半斤、枳实半斤、大黄一斤、厚朴一尺、杏仁一升。**」讲义：「**『趺阳脉』就是冲阳脉（脚背上），候胃气。****『浮则胃气强』——胃热盛（浮主热）；『涩则小便数』——涩主津亏，津液从尿走所以小便多；『浮涩相搏，大便则难』——胃热 + 津亏 = 大便难。****『其脾约』——脾的津液被约束住了（脾本来要为胃输布津液，现在被胃热约束了）。****麻仁丸六味：麻子仁、芍药、枳实、大黄、厚朴、杏仁。****就是小承气汤加麻子仁、芍药、杏仁——润肠通便。****做成蜜丸，缓缓润下，不像承气汤那样猛攻。**」\n\n**【最重要】脾约 = 胃热 + 津亏（趺阳脉浮而涩）→ 麻仁丸（润下）**\n\n```\n麻仁丸 = 小承气汤（大黄/枳实/厚朴）+ 麻子仁 + 芍药 + 杏仁\n蜜丸缓润（老人/体虚便秘首选）\n趺阳脉 = 冲阳穴（脚背）\n```\n\n**须「标」**：**「①便秘须查因（饮食/药物/甲状腺/肠病）；②老人便秘须排肠梗阻；③不可久用泻药」** ✓✓","o":"RJ-2806 · 《人纪·伤寒论》条辨二六二及麻仁丸方（PDF 第 338–340 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"茵陈蒿汤证（二）","c":"【条辨二七四】「**『伤寒』七八日，身黄如橘子色，小便不利，腹微满者，『茵陈篙汤』主之。**」讲义：「**『身黄如橘子色』——这是阳黄的特征：黄色鲜明、像橘子皮的颜色（不是阴黄那种晦暗如烟熏）。****这是湿热发黄。****配『小便不利、腹微满』——湿热堵在里面出不去。****茵陈蒿汤（茵陈、栀子、大黄）：茵陈退黄、栀子清 heat 从小便出、大黄通大便。****记住阳黄和阴黄的区别：****阳黄——色鲜明如橘子，属湿热，用茵陈蒿汤（清利）；阴黄——色晦暗如烟熏，属寒湿，用茵陈术附汤（温化）。****用反了会死人。**」\n\n**【最重要】阳黄（如橘子色/湿热/茵陈蒿汤）vs 阴黄（如烟熏/寒湿/温化）**\n\n```\n阳黄：鲜明如橘子 → 湿热 → 茵陈蒿汤（清利）\n阴黄：晦暗如烟熏 → 寒湿 → 茵陈术附汤（温化）\n```\n\n**须「绝「对「强「标」**：**「①黄疸须查肝功/胆红素/超声/CT；②须排肝炎/胆管阻塞/胰头癌；③不可仅凭颜色分阴阳」** ✓✓✓","o":"RJ-2807 · 《人纪·伤寒论》条辨二七四（PDF 第 346 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"栀子柏皮汤","c":"【条辨二七五】「**『伤寒』瘀热在里，身必发黄，『栀子柏皮汤』主之。**」【栀子柏皮汤方】「**栀子十五个、甘草一两、黄柏二两。**」讲义：「**栀子柏皮汤是治黄疸的轻剂。****只有三味：栀子、甘草、黄柏。****栀子清三焦热（从小便出），黄柏清下焦湿热，甘草和中。****什么时候用？病比较轻——没有腹满（肠里没有实邪）、没有表证，就是单纯的热在里、身黄。****跟茵陈蒿汤的区别：茵陈蒿汤有大黄（要攻大便），栀子柏皮汤没有大黄（不攻，只清利）。****所以：黄疸 + 腹满便结 → 茵陈蒿汤；黄疸 + 无腹满 → 栀子柏皮汤。**」\n\n**【极重要】栀子柏皮汤（黄疸轻剂，无大黄不攻）**\n\n```\n栀子柏皮汤 = 栀子 + 甘草 + 黄柏（3 味）\n黄疸 + 腹满便结 → 茵陈蒿汤（含大黄）\n黄疸 + 无腹满 → 栀子柏皮汤（不含大黄）\n```","o":"RJ-2808 · 《人纪·伤寒论》条辨二七五及栀子柏皮汤方（PDF 第 346–347 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"麻黄连翘赤小豆汤","c":"【条辨二七六】「**『伤寒』身黄发热者，『麻黄连翘赤小豆汤』主之。**」【方】「**麻黄二两、连翘二两、杏仁四十个、赤小豆一升、大枣十二枚、生梓白皮一升、生姜二两、甘草二两。**」讲义：「**这条是黄疸兼表证——『身黄发热』，还有外感。****所以用麻黄连翘赤小豆汤：麻黄、杏仁、生姜发汗解表；连翘、赤小豆、生梓白皮清热利湿退黄；甘草大枣和中。****这是『表里双解』的退黄方。****临床上这个方子非常好用——不单治黄疸，还治皮肤病：疥癣、湿疹、皮肤瘙痒。****为什么？因为皮肤病多是表有邪、里有湿，跟黄疸的病机一样（湿热在表里之间）。****这就是『异病同治』。**」\n\n**【最重要】麻黄连翘赤小豆汤：黄疸兼表证 + 皮肤病（疥癣/湿疹）**\n\n```\n麻黄/杏仁/生姜（解表）+ 连翘/赤小豆/生梓白皮（清利退黄）\n异病同治：黄疸 ↔ 皮肤病（同为湿热在表里）\n```\n\n**须「强「标」**：**「①麻黄有升压/心悸风险；②皮肤病须皮肤科确诊；③黄疸须查因」** ✓✓","o":"RJ-2809 · 《人纪·伤寒论》条辨二七六及麻黄连翘赤小豆汤方（PDF 第 347–349 页）。"},{"t":"伤寒论·辨阳明病脉证并治法（下）：黄疸、蓄血、猪苓汤","h":"少阳病总纲","c":"【条辨二七七】「**『少阳』之为病，口苦：咽干：目眩也。**」【条辨二七八】「**『少阳中风』，两耳无所闻，目赤，胸中满而烦者，不可吐：下，吐：下则悸而惊。**」【条辨二七九】「**『伤寒』，脉弦细：头痛：发热者，属『少阳』，不可发汗，发汗则谵语。**」【条辨二八〇】「**本『太阳病』，不解，转入『少阳』者，协下鞭满，干呕不能食者，往来寒热，尚未吐：下，脉弦紧者，与『小柴胡汤』。**」讲义：「**少阳病三大主证：『口苦、咽干、目眩』——六个字就是少阳病的总纲。****为什么？少阳胆经，胆汁上溢则口苦；热伤津则咽干；胆火上炎则目眩。****少阳病的禁忌：不可吐、不可下、不可发汗。****为什么？少阳是『半表半里』，汗则伤表、下则伤里、吐则伤上，都会把邪气往里逼。****少阳病的主方是小柴胡汤，主证是『往来寒热、胸胁苦满、默默不欲饮食、心烦喜呕』——但见一证便是，不必悉具。**」\n\n**【最重要】少阳病总纲：口苦 + 咽干 + 目眩（六字）**\n\n```\n禁忌：不可吐、不可下、不可发汗（半表半里）\n主方：小柴胡汤\n主证：往来寒热 + 胸胁苦满 + 默默不欲食 + 心烦喜呕\n「但见一证便是，不必悉具」\n```\n\n**「口苦咽干目眩」——「这是最精的六字总纲。」** ✓✓✓","o":"RJ-2810 · 《人纪·伤寒论》条辨二七七至二八〇（PDF 第 352–355 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"太阴病总纲","c":"【条辨二八七】「**太阴之为病，腹满而吐，食不下，若下之，必胸下结鞭，自利益甚，时腹自痛。**」讲义：「**太阴病就是脾胃虚寒。****三大主证：『腹满而吐、食不下、自利益甚、时腹自痛』。****腹满（胀）、吐、吃不下、拉肚子越来越重、肚子一阵阵自己痛——这一串就是脾胃虚寒的典型。****关键的一句是『若下之，必胸下结鞭』——如果误用攻下，就会出现胸下硬结。****为什么？太阴病本质是虚寒，攻下会更伤脾阳。****所以太阴病的治则是『当温之』——温补脾阳，代表方是理中汤、四逆汤。**」\n\n**【最重要】太阴病总纲：腹满而吐 + 食不下 + 自利益甚 + 时腹自痛**\n\n```\n病机：脾胃虚寒\n治则：当温之（理中汤/四逆辈）\n禁忌：不可下（下之必胸下结鞭）\n```\n\n**「自利益甚、时腹自痛」——「这是最精的虚寒下利特征。」** ✓✓✓","o":"RJ-2811 · 《人纪·伤寒论》条辨二八七（PDF 第 361 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"太阴中风与欲解时","c":"【条辨二八八】「**太阴中风，四肢烦疼，脉阳微阴湿而长者，为欲愈。**」【条辨二八九】「**太阴病欲解时，从亥至丑时**（太阴病，病欲解时，从亥到丑时）。」讲义：「**太阴中风——四肢烦疼（手脚酸痛烦躁），这是脾主四肢，风寒伤脾的表现。****脉『阳微阴涩而长』——微是气虚、涩是血少、长是有胃气（长脉代表正气还在）。****有胃气就是『欲愈』——往好的方向走。****太阴病欲解时：亥至丑（晚上 9 点到凌晨 3 点）——这是阴气最盛的时候，太阴（阴中之至阴）得天时之助。**」\n\n**【极重要】太阴中风：四肢烦疼 + 脉阳微阴涩而长（有胃气＝欲愈）**\n\n```\n太阴中风 → 四肢烦疼（脾主四肢）\n欲解时：亥至丑（21:00–03:00）\n「长脉 = 有胃气 = 向愈」\n```","o":"RJ-2812 · 《人纪·伤寒论》条辨二八八、二八九（PDF 第 362 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"太阴病可发汗","c":"【条辨二九〇】「**太阴病脉浮者，可发汗，宜桂枝汤。**」讲义：「**这条看似矛盾——太阴病是里虚寒，怎么可以发汗？****关键在『脉浮』——脉浮说明邪还在表，太阴病兼有表证。****这时候先用桂枝汤解表，表解了再治里。****这就是『先表后里』的原则在太阴病上的运用。****但注意：必须脉浮（有表证）才能发汗；如果脉沉（纯里证），就不能发汗。**」\n\n**【极重要】太阴病脉浮（有表证）→ 可发汗，宜桂枝汤（先表后里）**\n\n```\n脉浮 → 邪在表 → 桂枝汤解表\n脉沉 → 纯里 → 不可发汗（当温之）\n```\n\n**「先表后里」——「这是最精的治疗次序。」** ✓✓","o":"RJ-2813 · 《人纪·伤寒论》条辨二九〇（PDF 第 363 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"自利不渴属太阴","c":"【条辨二九一】「**自利不渴者，寒故也，当温之，宜服四逆。**」讲义：「**这条是辨太阴与少阴的关键：『自利不渴』。****自利（拉肚子）但不口渴——说明是寒（寒则不耗津，所以不渴）。****如果是热利，一定会口渴（热伤津）。****所以『不渴』这两个字，就是寒利的铁证。****治法：『当温之』——温补，用四逆辈（四逆汤、理中汤）。****这条与后面少阴病的『自利而渴』正好形成对照：****太阴：自利不渴（纯寒）；少阴：自利而渴（寒在下、虚火上炎）。**」\n\n**【最重要】「自利不渴者，寒故也，当温之」**\n\n```\n自利 + 不渴 → 寒（太阴）→ 温之（四逆辈）\n自利 + 渴 → 少阴（下焦虚寒、引水自救）\n热利 → 必渴（热伤津）\n```\n\n**「『不渴』定寒热」——「这是最精的一问定寒热。」** ✓✓✓","o":"RJ-2814 · 《人纪·伤寒论》条辨二九一（PDF 第 363 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"脾家实腐秽当去","c":"【条辨二九二】「**伤寒，脉浮而缓，手足自温者，系在太阴；太阴当身发黄；若小便自利者，不能发黄；至七八日，虽暴烦，下利日十数行，必自止，以脾家实，腐秽当去故也。**」讲义：「**这条讲的是『正复邪去』的好现象。****脉浮而缓、手足自温——这是太阴病（脾主四肢，脾阳还在所以手足温）。****太阴可能发黄（湿郁），但如果小便自利，湿有出路，就不会发黄。****到了七八天，突然烦躁、一天拉十几次——这看起来像变坏，其实是好事：『以脾家实，腐秽当去故也』——脾的功能恢复了，正在把肠子里积的腐败东西排出去。****所以『必自止』——排完就自己停了。****这是『药后/病后反应』的经典解释：看起来加重，其实是正气在驱邪。**」\n\n**【极重要】「脾家实，腐秽当去」——下利十数行反是向愈**\n\n```\n太阴病 + 暴烦 + 下利日十数行 → 脾家实（正复驱邪）→ 必自止\n小便自利 → 湿有出路 → 不发黄\n```\n\n**「看起来加重、其实是排邪」——「这是最精的病程判断（不可见下利即止之）。」** ✓✓✓","o":"RJ-2815 · 《人纪·伤寒论》条辨二九二（PDF 第 364 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"桂枝加芍药汤与桂枝加大黄汤","c":"【条辨二九三】「**本太阳病，医反下之，因而腹满时痛者，属太阴也，桂枝加芍药汤主之；大实痛者，桂枝加大黄汤主之。**」【两方】「**桂枝加芍药汤：桂枝三两、芍药六两、甘草二两、生姜三两、大枣十二枚。****桂枝加大黄汤：桂枝三两、芍药六两、甘草二两、生姜三两、大枣十二枚、大黄二两。**」讲义：「**太阳病误下，邪陷太阴，造成腹满时痛。****① 『腹满时痛』——肚子胀、一阵阵痛（不是持续剧痛），这是脾络不和，用桂枝加芍药汤：桂枝汤原方把芍药加倍（三两→六两）。****为什么加芍药？芍药能『缓急止痛』、能『和脾络』。****② 『大实痛』——痛得厉害、拒按，这是有实邪，加芍药再加**大黄**（二两）通下。****这两个方的分界就看：痛是『时痛』（可忍）还是『大实痛』（拒按）。****这就是『虚实之分，一味之差』——同一张方，加一味大黄，从补变攻。**」\n\n**【最重要】桂枝加芍药汤（腹满时痛/虚）vs 桂枝加大黄汤（大实痛/实）**\n\n```\n腹满时痛（可忍）→ 桂枝加芍药汤（芍药加倍 6 两，缓急和络）\n大实痛（拒按）→ 桂枝加大黄汤（+ 大黄 2 两）\n「一味之差，攻补立判」\n```\n\n**「芍药加倍」——「这是最精的『单味加量改方向』。」** ✓✓✓","o":"RJ-2816 · 《人纪·伤寒论》条辨二九三及两方（PDF 第 365 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"胃气弱易动","c":"【条辨二九四】「**『太阴』为病，脉弱，其人续自便利，设当行『大黄』、『芍药』者，宜减之，以其人胃气弱，易动故也。**」讲义：「**这条是剂量警告。****太阴病本来就脉弱（气虚），而且『续自便利』（一直在拉肚子）。****这种情况下即使用大黄、芍药（这两个都是偏寒、偏泻的药），也要减量。****『以其人胃气弱，易动故也』——胃气弱的人，一点点药就能搅动肠胃。****这是张仲景反复强调的『因人施量』——同样的方子，体弱的人要减量。****跟前面『虚人老人儿童用薄药』是一个道理。**」\n\n**【极重要】胃气弱 + 自便利 → 大黄芍药宜减量（易动）**\n\n```\n脉弱 + 续自便利 → 减大黄/芍药\n「胃气弱，易动故也」\n「因人施量」（体弱减量）\n```","o":"RJ-2817 · 《人纪·伤寒论》条辨二九四（PDF 第 366 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"少阴病总纲","c":"【条辨二九五】「**『少阴』之为病，脉微细，但欲寐也。**」讲义：「**少阴病总纲只有六个字：『脉微细，但欲寐』。****『脉微细』——微是阳气虚（跳得弱），细是阴血少（脉管细），这是阴阳两虚。****『但欲寐』——只想睡觉，但又不是真睡（似睡非睡、迷迷糊糊）。****为什么会这样？少阴是心肾，心主神明、肾主藏精。心肾阳气不足，神明不振，就想睡；但精血不足，又睡不实。****这就是『但欲寐』的深意——不是疲劳想睡，是阳气虚极的昏沉。****临床上见到『脉微细、但欲寐』，就知道是少阴病（心肾阳虚），要用四逆汤、附子汤这类温阳的方子。**」\n\n**【最重要】少阴病总纲：脉微细 + 但欲寐**\n\n```\n脉微（阳虚）+ 细（阴血少）= 阴阳两虚\n但欲寐 = 似睡非睡、昏沉（阳气虚极）\n病位：心肾（少阴）\n```\n\n**须「绝「对「强「标」**：**「①脉微细 + 嗜睡须立即查血压/血糖/电解质/甲状腺；②须排休克/脓毒症/心衰；③须急诊」** ✓✓✓\n\n**「但欲寐 ≠ 疲劳」——「这是最精的鉴别（昏沉 vs 困倦）。」** ✓✓✓","o":"RJ-2818 · 《人纪·伤寒论》条辨二九五（PDF 第 367 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"自利而渴属少阴","c":"【条辨二九六】「**『少阴病』，欲吐不吐，心烦，但欲寐，五六日，自利而渴者，属『少阴』也，虚，故引水自救；****若小便色白者，『少阴病』形悉具。****小便白者，以下焦虚，有寒，不能制水，故令色白也。**」讲义：「**这条与太阴的『自利不渴』正好对照：少阴病是『自利而渴』。****为什么渴？『虚，故引水自救』——下焦虚寒，津液不能上承，所以口渴，但喝水是为了自救（不是真有热）。****怎么确认是少阴而不是热利？看小便：『小便色白』。****『以下焦虚，有寒，不能制水，故令色白也』——下焦虚寒，膀胱不能气化，小便清长色白。****所以：自利 + 渴 + 小便清白 = 少阴寒证（不是热利）。****如果是热利，小便会黄赤。**」\n\n**【最重要】少阴「自利而渴」+「小便色白」= 下焦虚寒（引水自救）**\n\n```\n太阴：自利不渴\n少阴：自利而渴（虚→引水自救）+ 小便色白\n热利：小便黄赤\n「小便颜色 = 寒热的分水岭」\n```\n\n**「小便色白」——「这是最精的寒热判别（一看小便即知）。」** ✓✓✓","o":"RJ-2819 · 《人纪·伤寒论》条辨二九六（PDF 第 368 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"亡阳与少阴禁汗","c":"【条辨二九七】「**病人脉阴阳俱紧，反汗出者，亡阳也；此属『少阴』，法当咽痛，而复吐：利。**」【条辨二九八】「**『少阴病』，咳而下利，谵语者，被火气劫故也，小便必难，以强责『少阴』汗也。**」【条辨二九九】「**『少阴病』，脉细沉数，病为在里，不可发汗。**」【条辨三〇〇】「**『少阴病』，脉微，不可发汗，亡阳故也；阳已虚，尺脉弱濇者，复不可下之。**」讲义：「**少阴病最关键的一条禁忌：不可发汗。****① 『脉阴阳俱紧，反汗出』——脉紧本该无汗（寒），现在反而出汗，这是『亡阳』（阳气外泄）；② 『咳而下利，谵语』——如果误用火法强迫发汗，就会小便困难（津液被劫）；③ 『脉细沉数，病为在里，不可发汗』——脉沉说明病在里，发汗会把里阳也散掉；④ 『脉微不可发汗，亡阳故也』+『尺脉弱涩者，复不可下之』——脉微不能汗，尺脉弱涩不能下。****总结：少阴病既不可汗、也不可下——因为阴阳两虚，汗下都会耗竭。**」\n\n**【最重要】少阴病双禁：不可发汗、不可攻下**\n\n```\n脉阴阳俱紧 + 反汗出 → 亡阳\n脉细沉数 → 病在里，不可发汗\n脉微 → 不可发汗（亡阳）\n尺脉弱涩 → 不可下\n```\n\n**须「绝「对「强「标」**：**「①少阴病（阴阳两虚）禁汗/禁下；②误汗可致亡阳/休克；③须立即急诊」** ✓✓✓","o":"RJ-2820 · 《人纪·伤寒论》条辨二九七至三〇〇（PDF 第 370–371 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"少阴病可治之证","c":"【条辨三〇一】「**『少阴病』，脉紧，至七八日，自下利，胸暴烦，手足反温，脉紧反去者，为欲解也，渴烦，下利，必自愈。**」【条辨三〇二】「**『少阴病』，下利，恶寒而倦卧，若利自止，手足温者，可治。**」【条辨三〇三】「**『少阴病』，恶寒而倦，时自烦，欲去衣被者，可治。**」讲义：「**这三条讲少阴病的『可治』之象——都是『阳气回来了』的表现：****① 『手足反温、脉紧反去』——手脚从冷转温、紧脉消失，这是阳气恢复，『欲解』；② 『利自止，手足温』——拉肚子自己停了、手脚温热，可治；③ 『时自烦，欲去衣被』——有时烦躁、想掀被子（阳气回来，不再怕冷），可治。****共同点：『手足温』。****为什么手足温这么重要？因为四肢是阳气之末，阳气够不够，看手脚最准。****少阴病最怕的就是手脚一直冷——那说明阳气回不来。**」\n\n**【最重要】少阴病「可治」三征：手足温 / 利自止 / 欲去衣被**\n\n```\n手足反温 → 阳气回（欲解）\n利自止 + 手足温 → 可治\n时自烦 + 欲去衣被 → 可治（阳回不畏寒）\n「四肢为阳气之末」→ 看手脚判生死\n```\n\n**「手足温」——「这是最精的阳气指标（与 n87常人脚面冷脚底热」互证）。** ✓✓✓","o":"RJ-2821 · 《人纪·伤寒论》条辨三〇一至三〇三（PDF 第 372–373 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"少阴病欲解时与灸法","c":"【条辨三〇五】「**少阴病」，欲解时，从子至寅上。**【条辨三〇六】「**少阴病」，吐，利，手足不逆冷，反发热者，不死；脉不至者，灸少阴七壮。**讲义：「**少阴病欲解时：子至寅（晚上 11 点到凌晨 5 点）——这是阳气初生的时候（子时一阳生），少阴病得此时之助容易好转。****条辨三〇六讲两个要点：****① 『吐利，手足不逆冷，反发热者，不死』——虽然吐利，但手脚不冷、反而发热，这是阳气还在（『不死』）；② 『脉不至者，灸少阴七壮』——如果摸不到脉（脉不至），用灸法灸少阴经（太溪穴）七壮，把阳气引回来。****『七壮』的『壮』是灸的单位（一个艾炷叫一壮）。****这是急救法——脉都没有了，用灸法回阳。**」\n\n**【极重要】少阴病欲解时（子至寅）+ 脉不至灸少阴七壮（急救）**\n\n```\n欲解时：子至寅（23:00–05:00，一阳生）\n「手足不逆冷，反发热者，不死」\n脉不至 → 灸少阴（太溪）七壮（回阳急救）\n```\n\n**须「绝「对「强「标」**：**「①脉不至须立即CPR/120；②灸法不可代替急救；③须同步生命支持」** ✓✓✓","o":"RJ-2822 · 《人纪·伤寒论》条辨三〇五、三〇六（PDF 第 374 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"热在膀胱必便脓血","c":"【条辨三〇七】「**少阴病」，八九日，一身手足尽热者，若热在膀胱，必便脓血也。**讲义：「**这条讲的是少阴病的一个特殊转归。****少阴病本该是寒证（手足冷），但如果『一身手足尽热』——全身手脚都热了，这是阳气恢复过头，或者寒邪化热。****『若热在膀胱，必便脓血』——热移到膀胱，会尿血（便脓血）。****为什么少阴病会转到膀胱？因为肾与膀胱相表里，少阴（肾）的热会传给膀胱。****临床上这就是尿路感染、膀胱炎的表现——尿频、尿急、尿痛、尿血。****所以少阴病不是只有寒证，也可以化热——这就是『少阴热化证』。**」\n\n**【极重要】少阴热化：一身手足尽热 → 热在膀胱 → 便脓血（尿血）**\n\n```\n少阴寒化 → 手足冷、但欲寐\n少阴热化 → 一身手足尽热 → 膀胱 → 尿血\n「肾与膀胱相表里」\n```\n\n**须「强「标」**：**「①尿血须立即查尿常规/培/超声/CT；②须排结石/肿瘤/结核；③须抗生素治疗」** ✓✓✓","o":"RJ-2823 · 《人纪·伤寒论》条辨三〇七（PDF 第 375 页）。"},{"t":"伤寒论·辨太阴病与少阴病脉证并治法（上）","h":"少阴病三禁","c":"讲义总结「**少阴病的三大禁忌**」：「**① 禁汗——少阴病阴阳两虚，发汗则亡阳（『脉微，不可发汗，亡阳故也』）；② 禁下——『尺脉弱涩者，复不可下之』，下之则竭阴；③ 禁火——『被火气劫故也』，用火法（艾灸、温针）强迫发汗，会劫夺津液，导致小便难、谵语。****少阴病的治则只有一个字：『温』。****温阳（四逆汤、附子汤）、回阳（通脉四逆汤）、滋阴清热（黄连阿胶汤，用于热化证）。****记住：少阴病是本，寒热是标——先辨寒化热化，再定温清。**」\n\n**【最重要】少阴病三禁（汗/下/火）与治则（温）**\n\n```\n禁汗（亡阳）、禁下（竭阴）、禁火（劫津）\n治则：温（四逆汤/附子汤）\n热化证例外：黄连阿胶汤（滋阴清热）\n「先辨寒化热化，再定温清」\n```\n\n**须「绝「对「强「标」**：**「①阴阳两虚者禁汗/下/火；②误治可致亡阳/休克；③须急诊」** ✓✓✓","o":"RJ-2824 · 《人纪·伤寒论》少阴病篇小结（条辨二九五至三〇七，PDF 第 367–375 页）。"},{"t":"伤寒论·辨少阴病脉证并治法（下）：麻黄附子细辛汤、黄连阿胶汤、真武汤","h":"麻黄附子细辛汤","c":"【条辨三一五】「**『少阴病』，始得之，反发热，脉沉者，『麻黄附子细辛汤』主之。**」【方】「**麻黄二两、细辛二两、附子一枚（炮）。**」讲义：「**这条是少阴病兼表证的主方，也是『太少两感』的经典。****怎么认？『始得之，反发热，脉沉』——刚开始就发热（本该少阴病不发热），但脉是沉的（不是浮）。****发热 + 脉沉 = 表有邪、里阳虚（太少两感）。****这时候如果只用麻黄发汗，会把少阴阳气散掉（亡阳）；如果只用附子温里，表邪出不去。****所以张仲景把两者合起来：麻黄发汗解表、附子温阳、细辛通彻表里（既散表寒又温里）。****这是『温阳解表』的典范。****临床上治：阳虚感冒、老慢支急性发作、过敏性鼻炎（流清涕不止）。**」\n\n**【最重要】麻黄附子细辛汤 = 少阴兼表（发热 + 脉沉）**\n\n```\n麻黄（解表）+ 附子（温阳）+ 细辛（通表里）\n「太少两感」= 表邪 + 里阳虚\n只汗则亡阳；只温则表不解 → 必须合用\n```\n\n**须「绝「对「强「标」**：**「①附子含乌头碱（有毒），须炮制/久煎；②麻黄有升压/心悸风险；③须专业医师；④心脏病/高血压慎」** ✓✓✓","o":"RJ-2825 · 《人纪·伤寒论》条辨三一五及麻黄附子细辛汤方（PDF 第 367 页后段）。"},{"t":"伤寒论·辨少阴病脉证并治法（下）：麻黄附子细辛汤、黄连阿胶汤、真武汤","h":"麻黄附子甘草汤","c":"【条辨三一六】「**『少阴病』，得之二三日，『麻黄附子甘草汤』微发汗，以二三日无里证，故微发汗也。**」【方】「**麻黄二两、甘草二两、附子一枚（炮）。**」讲义：「**这条跟麻黄附子细辛汤是兄弟方，区别在『二三日』和『无里证』。****麻黄附子细辛汤：始得之（刚发病）+ 发热脉沉 + 细辛（通彻表里，力量强）。****麻黄附子甘草汤：得之二三日（稍久）+ 无里证（没有下利、呕吐等里证）+ 甘草（缓和，微发汗）。****『以二三日无里证，故微发汗也』——因为还没有里证，所以只微发汗。****这个『微』字很关键：少阴病阳气不足，不能大汗，只能微微发汗。****这就是张仲景的『分寸感』——同样的温阳解表，新病用细辛（峻），稍久用甘草（缓）。**」\n\n**【极重要】麻黄附子细辛汤（初病/峻）vs 麻黄附子甘草汤（稍久/微发汗）**\n\n```\n细辛汤：始得之 + 发热脉沉（细辛通表里）\n甘草汤：二三日 + 无里证（甘草缓和，微发汗）\n「少阴不可大汗，只可微发汗」\n```\n\n**「微发汗」——「这是最精的分寸感（阳虚禁大汗）。」** ✓✓","o":"RJ-2826 · 《人纪·伤寒论》条辨三一六及麻黄附子甘草汤方（PDF 第 367 页后段）。"},{"t":"伤寒论·辨少阴病脉证并治法（下）：麻黄附子细辛汤、黄连阿胶汤、真武汤","h":"黄连阿胶汤","c":"【条辨三一七】「**『少阴病』，得之二三日以上，心中烦，不得卧，『黄连阿胶汤』主之。**」【方】「**黄连四两、黄芩二两、芍药二两、阿胶三两、鸡子黄二枚。**」讲义：「**黄连阿胶汤是治失眠的第一方（少阴热化证）。****主证只有六个字：『心中烦，不得卧』——心里烦、睡不着。****为什么？少阴热化——肾水不足，心火亢盛（心肾不交），所以烦而睡不着。****黄连阿胶汤五味：黄连、黄芩清心火；芍药酸收；阿胶滋阴养血；鸡子黄（生蛋黄）引药入心、补心中之血。****这个方子治的是『阴虚火旺』型失眠——特征是：舌红少苔、脉细数、心烦、口干、手脚心热。****不是所有失眠都能用——阳虚的、痰湿的用了会更糟。**」\n\n**【最重要】黄连阿胶汤 = 心中烦 + 不得卧（少阴热化/心肾不交）**\n\n```\n黄连/黄芩（清心火）+ 芍药（酸收）+ 阿胶（滋阴）+ 鸡子黄（生/引药入心）\n阴虚火旺型失眠：舌红少苔 + 脉细数 + 心烦 + 手足心热\n```\n\n**须「强「标」**：**「①失眠须查焦虑/抑郁/OSA；②CBT-I为一线；③生鸡蛋有沙门氏风险；④阳虚/痰湿禁」** ✓✓✓","o":"RJ-2827 · 《人纪·伤寒论》条辨三一七及黄连阿胶汤方（PDF 第 367 页后段）。"},{"t":"伤寒论·辨少阴病脉证并治法（下）：麻黄附子细辛汤、黄连阿胶汤、真武汤","h":"附子汤","c":"【条辨三一九】「**『少阴病』，身体痛，手足寒，骨节痛，脉沉者，『附子汤』主之。**」【方】「**附子二枚（炮）、茯苓三两、人参二两、白术四两、芍药三两。**」讲义：「**附子汤的眼目是：『身体痛、骨节痛、手足寒、脉沉』。****这是少阴阳虚，寒湿痹阻——阳虚则寒，寒则气血不通，不通则痛。****注意跟麻黄附子细辛汤的区别：那个有发热（表邪），这个没有发热（纯里寒）。****附子汤五味：附子（温阳，用量二枚——重剂）、茯苓白术（健脾祛湿）、人参（补气）、芍药（和血缓痛）。****这是『温阳 + 祛湿 + 补气』的组合。****临床上治：风湿性关节炎、阳虚型腰痛、产后身痛（产后百节空虚，最怕寒）。**」\n\n**【最重要】附子汤：身体痛 + 骨节痛 + 手足寒 + 脉沉（阳虚寒湿）**\n\n```\n附子（2 枚，重用）+ 茯苓/白术（祛湿）+ 人参（补气）+ 芍药（和血）\n「阳虚则寒，寒则不通，不通则痛」\n无发热（纯里寒，区别于麻黄附子细辛汤）\n```\n\n**须「强「标」**：**「①附子2枚为重剂，须炮制/久煎；②关节痛须排风湿/痛风/感染；③须专业医师」** ✓✓","o":"RJ-2828 · 《人纪·伤寒论》条辨三一九及附子汤方（PDF 第 367 页后段）。"},{"t":"伤寒论·辨少阴病脉证并治法（下）：麻黄附子细辛汤、黄连阿胶汤、真武汤","h":"桃花汤","c":"【条辨三二〇】「**『少阴病』，下利，便脓血，『桃花汤』主之。**」【方】「**赤石脂一斤（一半全用，一半筛末）、干姜一两、粳米一升。**」讲义：「**桃花汤治的是『下利便脓血』。****为什么叫桃花汤？因为赤石脂是红色的，煮出来的汤色如桃花。****三味：赤石脂（涩肠固脱，一半煮一半冲服）、干姜（温中）、粳米（养胃）。****这条的关键是『少阴病』——下利便脓血属于虚寒（滑脱不固），不是热利。****怎么分？热利（白头翁汤证）——腹痛、里急后重、大便臭秽；虚寒利（桃花汤证）——不臭、滑脱不禁、手足冷。****用错了会危重：热利用桃花汤（涩住）会把热邪闭在里面；虚寒利用白头翁汤（寒凉）会更虚脱。**」\n\n**【最重要】桃花汤（虚寒滑脱便脓血）vs 白头翁汤（热利便脓血）**\n\n```\n桃花汤 = 赤石脂（涩）+ 干姜（温）+ 粳米（养胃）\n虚寒利：不臭、滑脱不禁、手足冷 → 桃花汤\n热利：臭秽、里急后重、腹痛 → 白头翁汤\n```\n\n**须「绝「对「强「标」**：**「①便脓血须立即查粪培/结肠镜；②须排痢疾/溃疡性结肠炎/癌；③须抗生素/对症」** ✓✓✓","o":"RJ-2829 · 《人纪·伤寒论》条辨三二〇及桃花汤方（PDF 第 367 页后段）。"},{"t":"伤寒论·辨少阴病脉证并治法（下）：麻黄附子细辛汤、黄连阿胶汤、真武汤","h":"猪肤汤与咽痛三方","c":"【条辨三二四】「**『少阴病』，下利，咽痛，胸满，心烦，『猪肤汤』主之。**」【方】「**猪肤一斤。****上一味，以水一斗，煮取五升，去滓，加白蜜一升，白粉五合，熬香，和令相得，温分六服。**」【条辨三二五】「**『少阴病』，二三日，咽痛者，可与『甘草汤』；不差，与『桔梗汤』。**」【条辨三二六】「**『少阴病』，咽中伤，生疮，不能语言，声不出者，『苦酒汤』主之。**」讲义：「**少阴病咽痛有四个层次：****① 猪肤汤——下利 + 咽痛 + 胸满 + 心烦，这是阴虚津伤（虚火上炎），用猪皮熬汤（猪肤滋阴润燥）加白蜜、米粉；② 甘草汤——单纯的咽痛，生甘草清热解毒；③ 桔梗汤——甘草汤不效，加桔梗（开喉、排脓）；④ 苦酒汤——咽中溃烂生疮、说不出话，用苦酒（醋）+ 半夏 + 鸡蛋清（去壳），少少含咽。****苦酒汤的用法很特别：把鸡蛋开一个小孔，倒出蛋黄，装入醋和半夏，放在火上烤，然后含在口中。**」\n\n**【最重要】少阴咽痛四层：猪肤汤 / 甘草汤 / 桔梗汤 / 苦酒汤**\n\n```\n猪肤汤（阴虚津伤 + 下利）\n甘草汤（单纯咽痛）→ 不差 → 桔梗汤（开喉排脓）\n苦酒汤（咽烂声不出：醋+半夏+蛋清，含咽）\n```\n\n**须「强「标」**：**「①咽痛/声哑超2周须喉镜；②咽烂须排扁桃体炎/脓肿/白喉；③须就诊」** ✓✓","o":"RJ-2830 · 《人纪·伤寒论》条辨三二四至三二六及三方（PDF 第 367 页后段）。"},{"t":"伤寒论·辨少阴病脉证并治法（下）：麻黄附子细辛汤、黄连阿胶汤、真武汤","h":"白通汤","c":"【条辨三二八】「**『少阴病』，下利，『白通汤』主之。**」【方】「**葱白四茎、干姜一两、附子一枚（生，去皮，破八片）。**」讲义：「**白通汤是回阳救逆的急方。****主证：少阴病下利（拉肚子不止），脉微（阳气将绝）。****三味：葱白、干姜、生附子。****葱白的作用最特别——『通阳』。葱是空心的、上通下达，能把阳气通到四肢百骸。****干姜温中，生附子回阳（这里用生附子，力量比炮附子强得多，用于急救）。****这个方子的名字『白通』就是『用白色的葱白通阳』。****临床上这是急救方——脉微欲绝、四肢冰冷、下利不止的时候用。**」\n\n**【最重要】白通汤 = 葱白 + 干姜 + 生附子（回阳通阳急救）**\n\n```\n葱白（中空，通阳达四肢）+ 干姜（温中）+ 生附子（回阳）\n「白通」= 白葱通阳\n急救：脉微欲绝 + 四肢冷 + 下利不止\n```\n\n**须「绝「对「强「标」**：**「①生附子有大毒（乌头碱），须专业炮制/久煎；②须住院/急诊；③绝对不可自服；④须同步抗休克」** ✓✓✓","o":"RJ-2831 · 《人纪·伤寒论》条辨三二八及白通汤方（PDF 第 367 页后段）。"},{"t":"伤寒论·辨少阴病脉证并治法（下）：麻黄附子细辛汤、黄连阿胶汤、真武汤","h":"白通加猪胆汁汤","c":"【条辨三二九】「**『少阴病』，下利，脉微者，与『白通汤』。****利不止，厥逆无脉，干呕烦者，『白通加猪胆汁汤』主之。****服汤，脉暴出者死，微续者生。**」【方】「**葱白四茎、干姜一两、附子一枚（生）、人尿五合、猪胆汁一合。**」讲义：「**这条讲的是『热药被格拒』的处理。****病人吃了白通汤，利还止不住，而且『厥逆无脉』（手脚冰冷、摸不到脉）、『干呕烦』（干呕烦躁）。****这是阴寒极盛，把热药『拒之门外』（格拒）——药一进去就被顶出来了。****怎么办？加『人尿』（童子尿）和『猪胆汁』——这两味都是寒性的，掺在热药里，能让药『骗过』阴寒，进得去。****这叫『反佐法』——用寒药引热药入阴。****最后一句极重要：『脉暴出者死，微续者生』——脉突然冒出来是回光返照（死），脉慢慢回来才是真恢复（生）。**」\n\n**【最重要】白通加猪胆汁汤（反佐法）+「脉暴出者死，微续者生」**\n\n```\n阴寒极盛 → 热药被格拒 → 加人尿/猪胆汁（寒性反佐）\n「脉暴出者死」（回光返照）\n「微续者生」（渐进恢复）\n```\n\n**须「绝「对「强「标」**：**「①此为危重急救；②人尿有感染/伦理问题；③须立即急诊/ICU；④绝对不可自制」** ✓✓✓\n\n**「脉暴出者死」——「这是最精的回光返照判据（与 n180蜡烛最后一瞬变大」互证）。** ✓✓✓","o":"RJ-2832 · 《人纪·伤寒论》条辨三二九及白通加猪胆汁汤方（PDF 第 367 页后段）。"},{"t":"伤寒论·辨少阴病脉证并治法（下）：麻黄附子细辛汤、黄连阿胶汤、真武汤","h":"真武汤","c":"【条辨三三〇】「**『少阴病』，二三日至四五日，腹痛，小便不利，四肢沉重疼痛，自下利者，此为有水气，其人或咳，或小便利，或下利，或呕者，『真武汤』主之。**」【方】「**茯苓三两、芍药三两、生姜三两、白术二两、附子一枚（炮）。**」讲义：「**真武汤是治『阳虚水泛』的第一方。****眼目：『腹痛、小便不利、四肢沉重疼痛、自下利』。****『四肢沉重疼痛』是关键——水湿停在四肢，重得像灌了铅。****『小便不利』——水排不出去。****『自下利』——水从大便走。****这是肾阳虚，不能主水，水液泛滥。****真武汤五味：附子（温肾阳）、白术茯苓（健脾利水）、生姜（散水）、芍药（和血、防利水伤阴）。****临床上治：水肿、心衰水肿、甲减水肿、美尼尔氏症（头晕、站不稳）、慢性肾炎。**」【加减】「**若咳者，加五味子、细辛、干姜；若小便利者，去茯苓；若下利者，去芍药，加干姜；若呕者，去附子，加生姜。**」\n\n**【最重要】真武汤 = 阳虚水泛（四肢沉重疼痛 + 小便不利 + 自下利）**\n\n```\n真武汤 = 附子（温肾）+ 白术/茯苓（健脾利水）+ 生姜（散水）+ 芍药（护阴）\n「四肢沉重疼痛」= 水湿停四肢的眼目\n加减法：咳加五味子细辛干姜 / 呕去附加生姜\n```\n\n**须「强「标」**：**「①水肿须查心/肾/肝/甲状腺；②须查BNP/肌酐/尿常规；③附子须炮制；④利尿剂为规范」** ✓✓✓","o":"RJ-2833 · 《人纪·伤寒论》条辨三三〇及真武汤方（PDF 第 367 页后段）。"},{"t":"伤寒论·辨少阴病脉证并治法（下）：麻黄附子细辛汤、黄连阿胶汤、真武汤","h":"通脉四逆汤","c":"【条辨三三一】「**『少阴病』，下利清谷，里寒外热，手足厥逆，脉微欲绝，身反不恶寒，其人面色赤，或腹痛，或干呕，或咽痛，或利止脉不出者，『通脉四逆汤』主之。**」【方】「**甘草二两（炙）、附子大者一枚（生用）、干姜三两（强人可四两）。**」讲义：「**通脉四逆汤是四逆汤的加强版，治『真寒假热』的危证。****几个眼目：『下利清谷』（完谷不化）、『里寒外热』（里面冷外面热）、『手足厥逆』（手脚冰冷）、『脉微欲绝』（脉快没了）、『身反不恶寒』（反而不怕冷）、『面色赤』（脸发红）。****这是『戴阳证』——阴寒极盛，把仅剩的一点阳气逼到头上（面赤），所以『身反不恶寒、面赤』是假热。****跟四逆汤的区别：四逆汤用干姜一两半，通脉四逆汤用干姜三两（加倍），附子用大者一枚（重用）。****力量更猛，专门用来『通脉』——把快断的阳气接回来。**」\n\n**【最重要】通脉四逆汤（真寒假热/戴阳证）**\n\n```\n下利清谷 + 里寒外热 + 手足厥逆 + 脉微欲绝 + 面赤（戴阳）\n= 四逆汤加重（干姜 1.5→3 两，附子大者一枚）\n「面赤」= 假热（阳气被逼上浮）\n```\n\n**须「绝「对「强「标」**：**「①此为休克/危重，须立即急诊/ICU；②生附子/大剂干姜有毒；③绝对不可自服；④须同步扩容/升压」** ✓✓✓\n\n**「戴阳证」——「这是最精的真寒假热（面赤如妆）。」** ✓✓✓","o":"RJ-2834 · 《人纪·伤寒论》条辨三三一及通脉四逆汤方（PDF 第 367 页后段）。"},{"t":"伤寒论·辨少阴病脉证并治法（下）：麻黄附子细辛汤、黄连阿胶汤、真武汤","h":"四逆散","c":"【条辨三三二】「**『少阴病』，四逆，其人或咳，或悸，或小便不利，或腹中痛，或泄利下重者，『四逆散』主之。**」【方】「**甘草、枳实、柴胡、芍药各十分。**」讲义：「**四逆散跟四逆汤只差一个字，但完全是两回事。****四逆汤（汤）——治阳虚寒盛（真寒），用附子干姜；****四逆散（散）——治『阳郁』（阳气被郁住，不能达于四肢），用柴胡、枳实、芍药、甘草。****怎么分？四逆汤的四逆是『冷到肘膝』（真寒）；四逆散的四逆是『只冷到手腕脚踝』（阳郁不达），而且脉不微（不是阳气虚）。****四逆散四味：柴胡（疏肝解郁、透阳）、枳实（破气）、芍药（和血）、甘草（和中）。****这就是『疏肝理气』的祖方。****临床上治：胆结石、胆囊炎、胃病、胁痛、月经不调。**」\n\n**【最重要】四逆散（阳郁）vs 四逆汤（阳虚）**\n\n```\n四逆散：柴胡/枳实/芍药/甘草 → 疏肝透阳（冷至腕踝、脉不微）\n四逆汤：附子/干姜/甘草 → 回阳救逆（冷至肘膝、脉微）\n「一字之差，寒热天渊」\n```\n\n**「冷到肘膝 vs 冷到手腕」——「这是最精的四肢冷鉴别。」** ✓✓✓","o":"RJ-2835 · 《人纪·伤寒论》条辨三三二及四逆散方（PDF 第 367 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"厥阴病总纲","c":"【厥阴病提纲】「**『厥阴』之为病，消渴，气上撞心，心中疼热，饥而不欲食，食则吐蚘，下之利不止。**」讲义：「**厥阴病的提纲有五个症状，全部是『上热下寒』的表现：****① 『消渴』——渴得厉害（上热）；② 『气上撞心』——有气往上冲到心口（肝气上逆）；③ 『心中疼热』——心口发热而痛（上热）；④ 『饥而不欲食』——饿但不想吃（胃热而脾寒）；⑤ 『食则吐蚘』——一吃饭就吐蛔虫（下寒，虫子往上跑）。****为什么是上热下寒？厥阴是肝与心包，是『阴尽阳生』的地方——最深的阴，也是阳气初生之处。****病到厥阴，阴阳错乱：上面有热、下面有寒。****『下之利不止』——这种病绝对不能攻下，一攻就利不止。**」\n\n**【最重要】厥阴病提纲：消渴 + 气上撞心 + 心中疼热 + 饥不欲食 + 食则吐蛔**\n\n```\n五个症状 = 上热（消渴/疼热）+ 下寒（不欲食/吐蛔）\n「阴尽阳生」→ 阴阳错乱\n绝对禁下（下之利不止）\n```\n\n**须「强「标」**：**「①吐蛔须驱虫治疗（阿苯达唑）；②消渴须查血糖；③上热下寒须辨证；④禁攻下」** ✓✓✓","o":"RJ-2836 · 《人纪·伤寒论》辨厥阴病脉证并治法 提纲（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"厥阴病欲解时","c":"【条辨三四二】「**厥阴病欲解时，从丑至卯上。**」讲义：「**厥阴病什么时候容易好？从丑时到卯时——凌晨 1 点到早上 7 点。****为什么？因为丑寅卯是阳气初生、逐渐增长的时段（『阴尽阳生』）。****厥阴病本质是阴阳错乱，需要阳气的启动来恢复平衡，所以这个时段最有利。****把六经的欲解时连起来看：****太阳巳至未（9–15）、阳明申至戌（15–21）、少阳寅至辰（3–9）、太阴亥至丑（21–3）、少阴子至寅（23–5）、厥阴丑至卯（1–7）。****这就是完整的『六经时间医学』地图。**」\n\n**【极重要】厥阴病欲解时：丑至卯（1:00–7:00）**\n\n```\n太阳 9–15｜阳明 15–21｜少阳 3–9\n太阴 21–3｜少阴 23–5｜厥阴 1–7\n「六经时间医学完整地图」\n```\n\n**「六经欲解时」——「这是全书最完整的时间-经络对应表。」** ✓✓✓","o":"RJ-2837 · 《人纪·伤寒论》条辨三四二（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"厥热胜负","c":"【条辨三四六】「**厥利者，……**」讲义：「**厥阴病最重要的观察指标是『厥与热的胜负』——看手脚冷和发热哪个多。****① 厥多热少——病在进（阳气越来越弱）；② 热多厥少——病在退（阳气回升）；③ 厥热相等——将愈；④ 厥四日、热三日——病进；⑤ 厥五日、热五日——自愈。****这个观察非常实用：不用看别的，就数病人手脚冷几天、发热几天。****为什么？因为厥阴病本质是阳气与阴邪的拉锯战——热代表阳气，厥代表阴邪。****热多则阳胜，厥多则阴胜。****这是『以时间辨胜负』的思维，比任何单一症状都可靠。**」\n\n**【最重要】厥热胜负：热多厥少＝病退；厥多热少＝病进**\n\n```\n厥多热少 → 病进（阴胜）\n热多厥少 → 病退（阳胜）\n厥热相等 → 将愈\n「数冷几天、热几天」= 最简胜负判断\n```\n\n**「以时间辨胜负」——「这是最精的观察法（不依赖仪器）。」** ✓✓✓","o":"RJ-2838 · 《人纪·伤寒论》条辨三四六（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"乌梅丸","c":"【条辨三五三、三五四】「**『伤寒』，脉微而厥，至七八日肤冷，其人躁无暂安时者，此为『藏厥』，非『蚘厥』也。****蚘厥者，其人当吐蚘。****今病者静，而复时烦，此为『藏寒』，蚘上入膈，故烦，须臾复止，得食而呕，又烦者，蚘闻食臭出，其人当自吐蚘。****蚘厥者，『乌梅丸』主之。****又主久利。**」【方】「**乌梅三百枚、细辛六两、干姜十两、黄连一斤、当归四两、附子六两（炮）、蜀椒四两、桂枝六两、人参六两、黄柏六两。**」讲义：「**乌梅丸是治蛔厥（蛔虫）的主方，同时也治久利。****怎么认蛔厥？****① 『病者静，而复时烦』——安静的时候突然烦躁（虫子动了）；② 『蚘上入膈，故烦，须臾复止』——一阵烦一阵停（虫子上来又下去）；③ 『得食而呕，又烦者，蚘闻食臭出』——一吃饭就呕、又烦，因为虫子闻到饭香跑出来了。****『蚘厥』= 蛔虫引起的四肢厥冷。****乌梅丸十味，是经方里药味最多的方之一：乌梅（酸收，安蛔）、细辛干姜蜀椒桂枝附子（温下寒）、黄连黄柏（清上热）、人参当归（补气血）。****寒热并用、攻补兼施——这是厥阴病『上热下寒』的完美对应。**」\n\n**【最重要】乌梅丸 = 蛔厥 + 久利（十味，寒热并用）**\n\n```\n蛔厥三征：静而复时烦 / 须臾复止 / 得食而呕又烦\n乌梅丸（10 味）：乌梅（安蛔）+ 温下寒（辛/姜/椒/桂/附）+ 清上热（连/柏）+ 补（参/归）\n「又主久利」\n```\n\n**须「强「标」**：**「①蛔虫须用驱虫药（阿苯达唑/甲苯）；②腹痛剧烈须排胆道蛔虫/肠梗阻；③乌梅丸须专业医师；④附子/细辛有毒」** ✓✓","o":"RJ-2839 · 《人纪·伤寒论》条辨三五三、三五四及乌梅丸方（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"厥的定义","c":"【条辨】「**凡厥者，阴阳气不相顺接，便为厥。****厥者，手足逆冷者是也。**」讲义：「**这是『厥』的定义，极其重要。****『阴阳气不相顺接』——阴气（在里、在下）与阳气（在表、在上）不能顺利交接。****为什么？正常情况，阳气从里出表、从下上升，阴气从表入里、从上下降，形成一个循环。****一旦这个循环断了——比如阳虚不能外达、或者阳郁不能疏泄——阳气到不了四肢末端，手脚就冷了。****『厥者，手足逆冷者是也』——厥就是手脚冷。****但要注意：厥只是一个症状，背后的原因有多种：阳虚（四逆汤）、阳郁（四逆散）、血虚寒厥（当归四逆汤）、蛔厥（乌梅丸）、热厥（白虎汤）。****所以见厥不能一概温补，要辨原因。**」\n\n**【最重要】厥的定义：阴阳气不相顺接 → 手足逆冷**\n\n```\n五种厥：阳虚（四逆汤）/ 阳郁（四逆散）/ 血虚寒（当归四逆汤）\n/ 蛔厥（乌梅丸）/ 热厥（白虎汤）\n「见厥不能一概温补」\n```\n\n**「阴阳气不相顺接」——「这是最精的厥的病机定义。」** ✓✓✓","o":"RJ-2840 · 《人纪·伤寒论》辨厥阴病篇「厥」的定义条（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"厥深热深","c":"【条辨】「**『伤寒』一二日至四五日，厥者必发热；前热者，后必厥。****厥深者，热亦深；厥微者，热亦微。****厥应下之，而反发汗者，必口伤烂赤。**」讲义：「**这条讲『热厥』——真热假寒。****『厥者必发热；前热者，后必厥』——先发热后手脚冷，这是热深厥深（热邪内闭，阳气不能外达）。****『厥深者，热亦深；厥微者，热亦微』——手脚冷得越厉害，说明里面的热也越重。****这个逻辑很反直觉：越冷反而是热！****治法：『厥应下之』——热厥要用攻下（把里热泻掉，阳气自然外达）。****『而反发汗者，必口伤烂赤』——如果误当寒证去发汗，会更伤津液，造成口腔溃烂。****这就是真热假寒的危险：用反了药，火上加油。**」\n\n**【最重要】热厥：厥深者热亦深，厥微者热亦微（真热假寒）**\n\n```\n先热后厥 → 热厥（热邪内闭）\n冷得越重 → 内热越重\n治：下之（泻里热）；禁发汗（反致口伤烂赤）\n```\n\n**须「绝「对「强「标」**：**「①真热假寒用温药可致死亡；②须辨脉/舌/腹；③须立即就诊」** ✓✓✓\n\n**「厥深热深」——「这是最精的反直觉（越冷越是热）。」** ✓✓✓","o":"RJ-2841 · 《人纪·伤寒论》辨厥阴病篇「热厥」条（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"当归四逆汤","c":"【条辨三六六】「**手足厥寒，脉细欲绝者，『当归四逆汤』主之。**」【方】「**当归三两、桂枝三两、芍药三两、细辛三两、甘草二两（炙）、通草二两、大枣二十五枚。**」讲义：「**当归四逆汤治『血虚寒厥』——手脚冰冷 + 脉细欲绝。****注意两个关键字：『脉细』——血虚（脉管里血少）；『欲绝』——快摸不到了。****这是血虚 + 寒，血虚则脉细，寒则收引、血脉不通，所以手脚冰冷。****当归四逆汤七味：当归（养血）、桂枝汤去生姜（调和营卫）、细辛（温经散寒）、通草（通血脉）、大枣（补血）。****为什么去生姜？因为生姜发散，血虚的人不宜再散。****这个方子临床上治：冻疮（第一方）、雷诺氏症（手指遇冷变白发紫）、疝气、痛经、末梢循环障碍。**」\n\n**【最重要】当归四逆汤 = 手足厥寒 + 脉细欲绝（血虚寒厥）**\n\n```\n当归（养血）+ 桂枝/芍药/甘草/大枣（桂枝汤去生姜）+ 细辛（温经）+ 通草（通血脉）\n主治：冻疮 / 雷诺氏症 / 痛经 / 疝气 / 末梢循环\n「去生姜」（血虚不宜散）\n```\n\n**须「强「标」**：**「①冻疮/雷诺须排结缔组织病/血管病；②细辛有毒（马兜铃酸）；③须专业医师」** ✓✓","o":"RJ-2842 · 《人纪·伤寒论》条辨三六六及当归四逆汤方（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"当归四逆加吴茱萸生姜汤","c":"【条辨三六七】「**若其人内有久寒者，宜『当归四逆加吴茱萸生姜汤』。**」【方】「**当归三两、桂枝三两、芍药三两、细辛三两、甘草二两、通草二两、大枣二十五枚、吴茱萸二升、生姜半斤。****上九味，以水六升、清酒六升，合煮取五升，分温五服。**」讲义：「**这条是当归四逆汤的加强版。****当归四逆汤证 +『内有久寒』（身体里有长期的寒、积寒）——比如：长期的白带（清稀如水）、小腹冷痛、寒性痛经、不孕（宫寒）。****加吴茱萸（温肝散寒、降逆）、生姜（散寒）。****最特别的煮法：『以水六升、清酒六升，合煮』——水和酒各一半！****为什么要加酒？酒能温通血脉、引药到四肢末梢和子宫。****这是经方里少数用酒煎的方子（另一个是炙甘草汤用清酒）。**」\n\n**【极重要】当归四逆加吴茱萸生姜汤（内有久寒）+ 水酒各半煎**\n\n```\n当归四逆汤 + 吴茱萸（温肝降逆）+ 生姜（散寒）\n主治：白带清稀/宫寒痛经/不孕/小腹冷痛\n煎法：水六升 + 清酒六升（酒温通血脉）\n```\n\n**「水酒各半」——「这是最精的煎法（酒为引）。」** ✓✓","o":"RJ-2843 · 《人纪·伤寒论》条辨三六七及当归四逆加吴茱萸生姜汤方（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"麻黄升麻汤","c":"【条辨三七二】「**『伤寒』六七日，大下后，寸脉沉而迟，手足厥逆，下部脉不至，喉咽不利，唾脓血，泄利不止者，为难治，『麻黄升麻汤』主之。**」【方】「**麻黄二两半、升麻一两一分、当归一两一分、知母、黄芩、葳蕤各十八铢，石膏、白术、干姜、芍药、天门冬、桂枝、茯苓、甘草各六铢。**」讲义：「**麻黄升麻汤是经方里药味最多的方（14 味），也是治『上热下寒』最复杂的方。****这个病很凶：『大下后』——误用峻下之后，出现：****① 『寸脉沉而迟、手足厥逆、下部脉不至』——上焦脉沉迟、手脚冷、下部（尺脉）摸不到，这是阳气被伤、下焦虚寒；② 『喉咽不利、唾脓血』——上面咽喉溃烂、吐脓血，这是热毒在上；③ 『泄利不止』——下面又拉肚子不止，这是下寒。****上热（喉烂唾脓血）+ 下寒（厥逆泄利）+ 正虚，张仲景直接说『为难治』。****方中：麻黄、升麻、桂枝发越阳气；知母、黄芩、石膏、葳蕤、天冬清上热；干姜、白术、茯苓、甘草温下寒；当归、芍药养血。****十四味药齐上，这就是『面面俱到』的救急方。**」\n\n**【极重要】麻黄升麻汤（14 味，上热下寒最复杂方）**\n\n```\n上热（喉咽不利、唾脓血）+ 下寒（厥逆、泄利不止）+ 正虚\n14 味：发阳（麻黄/升麻/桂枝）+ 清上热（知母/黄芩/石膏/天冬）+ 温下（干姜/术/苓）+ 养血（归/芍）\n「为难治」\n```\n\n**须「绝「对「强「标」**：**「①唾脓血 + 泄利须立即急诊；②须排肺脓肿/结核/肿瘤；③麻黄升压；④不可自服」** ✓✓✓","o":"RJ-2844 · 《人纪·伤寒论》条辨三七二及麻黄升麻汤方（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"干姜黄连黄芩人参汤","c":"【条辨三七四】「**『伤寒』，本自寒下，医复吐下之，寒格，更逆吐下，若食入口即吐，『干姜黄连黄芩人参汤』主之。**」讲义：「**这条讲『寒格』——下寒把上热格在外面。****本来是寒证下利，医生又用吐法下法，造成『寒格』：下面的寒气把热格住，热不能下，反而上逆，所以『食入口即吐』——饭一进口马上就吐出来。****注意这个『即』字——是马上吐，不是过一会儿才吐。****如果是过一会儿才吐（朝食暮吐），那是胃寒/幽门梗阻；一进口即吐，是『格拒』。****干姜黄连黄芩人参汤四味：干姜温下寒、黄连黄芩清上热、人参补中气。****这是最简单的寒热并治方。**」\n\n**【极重要】「食入口即吐」= 寒格（下寒格热于上）→ 干姜黄连黄芩人参汤**\n\n```\n食入口即吐（立即吐） = 格拒\n朝食暮吐（过一会儿） = 胃寒/幽门梗阻\n干姜（温下）+ 连/芩（清上）+ 人参（补中）\n```\n\n**须「强「标」**：**「①食入即吐须排贲门痉挛/食道病变；②朝食暮吐须胃镜（幽门）；③须查因」** ✓✓\n\n**「食入口即吐 vs 朝食暮吐」——「这是最精的时间-病位对应。」** ✓✓✓","o":"RJ-2845 · 《人纪·伤寒论》条辨三七四及干姜黄连黄芩人参汤方（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"白头翁汤","c":"【条辨三八七】「**『热利』下重者，『白头翁汤』主之。**」【方】「**白头翁二两、黄连、黄柏、秦皮各三两。**」讲义：「**白头翁汤是治『热利』的主方。****三个关键词：『热利』（热性下利）、『下重』（里急后重，肛门坠胀、想拉又拉不出）。****热利的特征：大便臭秽、肛门灼热、里急后重、小便黄赤、舌红苔黄。****白头翁汤四味：白头翁（清热解毒、凉血治痢的要药）、黄连、黄柏（清湿热）、秦皮（清肝热、涩肠）。****这是治痢疾（细菌性痢疾、阿米巴痢疾）的经典方。****跟桃花汤的区别：桃花汤治虚寒滑脱（不臭、无里急后重）；白头翁汤治热利（臭秽、里急后重）。****这就是『一寒一热、一涩一通』。**」\n\n**【最重要】白头翁汤 = 热利 + 下重（里急后重）**\n\n```\n白头翁（治痢要药）+ 黄连/黄柏（清湿热）+ 秦皮（清热涩肠）\n热利：臭秽 + 里急后重 + 肛门灼热 + 小便黄赤\nvs 桃花汤（虚寒滑脱、不臭、无里急后重）\n```\n\n**须「绝「对「强「标」**：**「①热利须立即查粪培/血常规；②须排细菌性痢疾/阿米巴/溃疡性结肠炎；③须抗生素+补液」** ✓✓✓","o":"RJ-2846 · 《人纪·伤寒论》条辨三八七及白头翁汤方（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"戴阳与郁冒","c":"【条辨三八二】「**『伤寒』，脉促，手足厥逆者，可灸之。****『下利』，脉沉弦者，下重也；脉大者，为未止；脉微弱数者，为欲自止，虽发热不死。**」【戴阳条】「**『下利』，脉沉而迟，其人面少赤，身有微热，下利清谷者，必郁冒，汗出而解，病人必微厥。****所以然者，其面戴阳，下虚故也。**」讲义：「**『戴阳』是危重的假热象。****『下利清谷』（拉完谷不化）+『脉沉而迟』（脉沉迟，阳虚）+『面少赤』（脸上有点红）+『身有微热』——这是阴寒极盛，把一点阳气逼到头上（脸上红），所以叫『戴阳』（像戴着红色面具）。****『病人必微厥』——手脚会微冷。****最后『必郁冒，汗出而解』——如果病人出现一阵昏蒙然后出汗，那是阳气恢复、病解的好兆头。****张仲景点出：『其面戴阳，下虚故也』——脸上红是因为下面（下焦）虚，不是真热。****这就是『真寒假热』的又一个版本。**」\n\n**【最重要】戴阳证：下利清谷 + 脉沉迟 + 面少赤 + 身微热（下虚故也）**\n\n```\n面红 = 假热（阳气被逼上浮）\n「其面戴阳，下虚故也」\n转好：郁冒 → 汗出而解\n```\n\n**须「绝「对「强「标」**：**「①下利清谷 + 面赤须立即急诊；②须排休克/消化道出血；③面红不可当热证清」** ✓✓✓\n\n**「戴阳」——「这是最精的假热命名（面赤如戴面具）。」** ✓✓✓","o":"RJ-2847 · 《人纪·伤寒论》条辨三八二及戴阳条（PDF 第 359 页后段）。"},{"t":"伤寒论·辨厥阴病脉证并治法（终篇）：乌梅丸、当归四逆汤、白头翁汤","h":"伤寒论全书总纲","c":"讲义总结「**伤寒论的核心思维**」：「**① 六经辨证：太阳（表）→ 阳明（里实热）→ 少阳（半表半里）→ 太阴（脾虚寒）→ 少阴（心肾阳虚）→ 厥阴（阴阳错乱）。****② 三焦辨治：上焦（心肺）、中焦（脾胃）、下焦（肝肾）。****③ 保胃气、存津液：全书处处强调『不可攻』『不可汗』『不可下』，都是为了保护胃气和津液。****④ 治未病：见到太阳病就防止传经（『先表后里』）。****⑤ 辨证求本：不看症状名称，看病机（寒热虚实）。****⑥ 方证对应：397 条条辨、112 方，每一方都有精确的适应证和禁忌证。****全书 479 页、约 60.6 万字，是中医临床的根基——『不懂伤寒，不足以言医』。**」\n\n**【最重要】伤寒论六大核心思维**\n\n```\n① 六经辨证（太阳→阳明→少阳→太阴→少阴→厥阴）\n② 三焦辨治\n③ 保胃气、存津液\n④ 治未病（先表后里）\n⑤ 辨证求本（辨病机不辨病名）\n⑥ 方证对应（397 条 / 112 方）\n
