    return color === online.hostColor ? online.hostUid : online.guestUid;
  }

  function nameOf(uid) {
    var seenName = online.seen[uid] && online.seen[uid].n;
    if (uid === online.hostUid) return online.hostName || seenName || '房主';
    if (uid === online.guestUid) return online.guestName || seenName || '朋友';
    return seenName || '朋友';
  }

  function handleMsg(raw) {
    var m;
    try { m = JSON.parse(raw); } catch (e) { return; }
    if (!m || !m.t) return;
    online.lastHeard = Date.now();
    /* 房主回执到达（状态/同意/拒绝/已满），撤销“没连上房间”的超时提示 */
    if (online.joinTimer && (m.t === 'st' || m.t === 'ok' || m.t === 'no' || m.t === 'busy')) {
      online.joinHeard = true;
    }
    /* 弱网重试/轮询和 SSE 可能收到同一条消息，用 mid 去重，避免重复落子 */
    if (m.mid) {
      if (online.seenMids.indexOf(m.mid) >= 0) return;
      online.seenMids.push(m.mid);
      if (online.seenMids.length > 160) online.seenMids.shift();
    }

    if (m.t === 'hi') {
      if (!m.u || m.u === myUid()) return;
      var nm = (typeof m.n === 'string') ? m.n : '';
      var prev = online.seen[m.u] && online.seen[m.u].n;
      online.seen[m.u] = { n: nm || prev || '', ts: Date.now(), p: m.p || '' };
      if (m.u === online.guestUid && nm) online.guestName = nm;
      if (online.role === 'host') {
        /* 修复：房间已有对手时原先静默忽略申请，申请人永远停在“等对方同意”且毫无提示 */
        if (online.guestUid && m.u && m.u !== online.guestUid) {
          publish({ t: 'busy', u: m.u, b: online.hostUid });
        }
        renderPending();
        refreshOnlineUI();
        broadcastState(nm && m.u === online.guestUid);
      }
      return;
    }

    if (m.t === 'busy') {
      if (m.u === myUid()) {
        setStatus('这个房间已经有人啦，去「房间」列表看看别的吧');
      }
      return;
    }

    if (m.t === 'mv') {
      if (online.role !== 'host') return;
      if (m.u !== online.guestUid) return;
      var bad = over || turn !== friendColor() || m.q !== online.seq;
      if (!bad && (m.x < 0 || m.y < 0 || m.x >= N || m.y >= N)) bad = true;
      if (!bad && board[m.y][m.x] !== 0) bad = true;
      if (bad) {
        /* 朋友已先行显示：这里驳回后立刻回推真实盘面，让他回滚重画。
           对局已结束(over)时同样要回推，否则对方多出的乐观棋子
           要一直等到下一次心跳（最长 8 秒）才被纠正 */
        online.seq++;
        broadcastState(!over);
        return;
      }
      place(m.x, m.y);
      return;
    }

    if (m.t === 'sync') {
      if (online.role === 'host' && m.u === online.guestUid) broadcastState(true);
      return;
    }

    if (m.t === 'ok') {
      if (m.u === myUid() || (m.gp && m.gp === myPid())) {
        online.role = 'guest';
        if (m.b) online.hostUid = m.b;
        if (m.bp) online.hostPid = m.bp;
        online.guestUid = myUid();
        online.guestPid = myPid();
        setStatus('房主同意啦，你' + (myColor() === BLACK ? '执黑' : '执白') + '！');
        refreshOnlineUI();
      }
      return;
    }

    if (m.t === 'no') {
      if (m.u === myUid()) {
        online.role = 'spec';
        setStatus('房主拒绝了你，先观战啦');
        refreshOnlineUI();
      }
      return;
    }

    if (m.t === 'kick') {
      if (m.u === myUid() || (m.gp && m.gp === myPid())) {
        /* 被房主移出：彻底释放座位（转观战），并停掉心跳，
           否则还会继续占着对方的名额发心跳 */
        online.role = 'spec';
        online.guestUid = '';
        online.guestName = '';
        online.guestPid = '';
        if (online.hbTimer) { window.clearInterval(online.hbTimer); online.hbTimer = 0; }
        setStatus('房主让你先观战啦');
        refreshOnlineUI();
        updateTurnUI();
      } else if (online.role === 'host' && m.u === online.guestUid) {
        online.guestUid = '';
        online.guestName = '';
        online.guestPid = '';
        online.guestSince = 0;
        online.seq++;
        renderPending();
        refreshOnlineUI();
        updateTurnUI();
        broadcastState(true);
      }
      return;
    }

    if (m.t === 'bye') {
      if (online.role === 'host') {
        if (m.u && m.u !== online.hostUid) delete online.seen[m.u];
        /* 对手真的走了：清掉座位并停掉对他的状态广播，避免一直对着空频道发消息 */
        if (online.guestUid && m.u === online.guestUid) {
          online.guestUid = '';
          online.guestName = '';
          online.guestPid = '';
          online.undoReq = '';
          online.seq++;
          broadcastState(true);
          setStatus('对手离开了房间，可以等新朋友上桌');
        }
        renderPending();
        refreshOnlineUI();
      } else if (m.u === online.hostUid) {
        setStatus('房主关闭了房间');
        closeStream();
        online.role = 'none';
        online.room = '';
        online.topic = '';
        refreshOnlineUI();
        showBanner('房间已关闭', '可以自己创建一个新房间');
      }
      return;
    }

    if (m.t === 'undo') {
      if (online.role !== 'host' || !online.guestUid) return;
      if (m.u !== online.guestUid) return;
      if (over) return;
      online.undoReq = m.u;
      renderUndoAsk();
      setStatus(nameOf(m.u) + ' 请求悔棋');
      return;
    }

    if (m.t === 'undo-ok') {
      if (m.u === myUid()) setStatus('房主已同意，已成功悔棋');
      return;
    }

    if (m.t === 'undo-no') {
      if (m.u === myUid()) setStatus('房主已拒绝你，暂时无法悔棋');
      return;
    }

    if (m.t === 'st') {
      /* 修复：建房时若收到对端的状态广播，说明这个房间号已经被人占用，
         换一个号重建，避免两个房主互相覆盖状态。 */
      if (online.roomProbe && !online.roomProbe.done && Date.now() < online.roomProbe.until) {
        var probeCode = online.roomProbe.code;
        if (m.b && m.b !== myUid()) {
          onRoomProbeConflict();
          return;
        }
        /* 对端也是自己（重连场景）则不算冲突 */
        if (m.b === myUid()) { online.roomProbe.done = true; }
        else if (m.b) { onRoomProbeConflict(); return; }
        else if (m.bp && m.bp === myPid()) { online.roomProbe.done = true; }
      }
      applyRemoteState(m);
    }
  }

  function buildState() {
    var wl = [];
    for (var i = 0; i < winCells.length; i++) wl.push([winCells[i].x, winCells[i].y]);
    var mv = [];
    for (var j = 0; j < moves.length; j++) mv.push([moves[j].x, moves[j].y, moves[j].c]);
    return {
      t: 'st', q: online.seq, n: N, m: mv,
      b: online.hostUid, bn: online.hostName, bp: online.hostPid || '',
      w: online.guestUid || '', wn: online.guestName || '', gp: online.guestPid || '',
      hc: online.hostColor,
      u: turn, o: over ? 1 : 0, wi: winner || 0, wl: wl,
      wq: (over && winner) ? (winner === online.hostColor ? online.hostUid : online.guestUid) : ''
    };
  }

  /* 修复：访客崩溃后房间座位永久被占。
     原实现只有在访客主动发 bye 时才释放座位；一旦访客直接杀进程/断网，
     bye 永远收不到，房间就再也进不来第二个人（房主还一直对着空座位广播）。
     这里用心跳时间戳做兜底：访客每 12 秒发一次 hi，超过 GUEST_STALE_MS 没来，
     就判定对方已离线，主动清掉座位并重新开放房间。 */
  function reclaimStaleGuest() {
    if (online.role !== 'host' || !online.guestUid) return;
    var info = online.seen[online.guestUid];
    var last = info && info.ts ? info.ts : 0;
    /* 从未收到过心跳，但对方已登记为访客：也给一段宽限时间 */
    if (!last) {
      if (online.guestSince && Date.now() - online.guestSince < GUEST_STALE_MS) return;
      last = online.guestSince || 0;
    }
    if (!last) return;
    if (Date.now() - last < GUEST_STALE_MS) return;
    var goneName = online.guestName || '朋友';
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.guestSince = 0;
    online.seq++;
    renderPending();
    refreshOnlineUI();
    updateTurnUI();
    broadcastState(true);
    setStatus(goneName + ' 掉线了，座位已释放');
    showBanner(goneName + ' 掉线了', '座位已释放，可以邀请新朋友进来');
  }

  function broadcastState(force) {
    if (online.role !== 'host' || !online.topic) return;
    var now = Date.now();
    if (!force && now - online.lastStateAt < 1200) {
      if (!online.stateTimer) {
        online.stateTimer = window.setTimeout(function () {
          online.stateTimer = 0;
          broadcastState(true);
        }, 1200);
      }
      return;
    }
    online.lastStateAt = now;
    publish(buildState());
  }

  function _movesPrefixMatch(localMoves, remoteArr) {
    if (!localMoves || !localMoves.length) return false;
    if (!remoteArr || remoteArr.length < localMoves.length) return false;
    for (var i = 0; i < localMoves.length; i++) {
      var a = remoteArr[i];
      var m = localMoves[i];
      if (a[0] !== m.x || a[1] !== m.y || a[2] !== m.c) return false;
    }
    return true;
  }

  function applyRemoteState(st) {
    if (typeof st.q !== 'number') return;
    if (replay.on) {
      online.lastState = Date.now();
      return;
    }
    if (st.q <= online.lastSeq) {
      /* 同一帧的心跳：不重绘棋盘，但名字可能刚更新，同步一下显示 */
      online.lastState = Date.now();
      if (st.bn) online.hostName = st.bn;
      if (st.wn) online.guestName = st.wn;
      if (st.bp) online.hostPid = st.bp;
      if (st.gp) online.guestPid = st.gp;
      if (st.hc) online.hostColor = st.hc === WHITE ? WHITE : BLACK;
      if (st.w && !online.guestUid) {
        online.guestUid = st.w;
        online.role = (myUid() === online.hostUid) ? 'host' : (myUid() === st.w ? 'guest' : 'spec');
      }
      updateTurnUI();
      refreshOnlineUI();
      return;
    }
    if (online.role === 'host' && st.b === myUid()) {
      /* 房主自己的广播回显：只记账，不重绘，避免胜利后被清盘重画 */
      online.lastSeq = st.q;
      online.seq = st.q;
      online.lastState = Date.now();
      return;
    }
    /* guest 乐观确认：如果权威状态与本地乐观渲染一致，跳过 emptyBoard+重建，避免闪烁 */
    if (online.role === 'guest') {
      var remoteArr = st.m || [];
      var prefixMatch = (remoteArr.length >= moves.length);
      if (prefixMatch) {
        for (var pi = 0; pi < moves.length; pi++) {
          var rm = remoteArr[pi];
          if (!rm || rm[0] !== moves[pi].x || rm[1] !== moves[pi].y || rm[2] !== moves[pi].c) {
            prefixMatch = false; break;
          }
        }
      }
      var localTurn = turn;
      if (prefixMatch && !st.o) {
        online.lastSeq = st.q;
        online.seq = st.q;
        online.lastState = Date.now();
        online.hostUid = st.b || '';
        online.hostName = st.bn || '房主';
        if (st.bp) online.hostPid = st.bp;
        if (st.gp) online.guestPid = st.gp;
        if (st.w) online.guestUid = st.w;
        if (st.wn) online.guestName = st.wn;
        if (st.hc) online.hostColor = st.hc === WHITE ? WHITE : BLACK;
        for (var ai = moves.length; ai < remoteArr.length; ai++) {
          var arm = remoteArr[ai];
          board[arm[1]][arm[0]] = arm[2];
          moves.push({ x: arm[0], y: arm[1], c: arm[2] });
        }
        turn = st.u === WHITE ? WHITE : BLACK;
        hoverCell = null;
        thinking = false;
        draw();
        updateTurnUI();
        refreshOnlineUI();
        var pendingWin = online.recordPending;
        online.recordPending = false;
        return;
      }
      if (prefixMatch && st.o) {
        online.lastSeq = st.q;
        online.seq = st.q;
        online.lastState = Date.now();
        online.hostUid = st.b || '';
        online.hostName = st.bn || '房主';
        if (st.bp) online.hostPid = st.bp;
        if (st.gp) online.guestPid = st.gp;
        if (st.w) online.guestUid = st.w;
        if (st.wn) online.guestName = st.wn;
        if (st.hc) online.hostColor = st.hc === WHITE ? WHITE : BLACK;
        for (var ai2 = moves.length; ai2 < remoteArr.length; ai2++) {
          var arm2 = remoteArr[ai2];
          board[arm2[1]][arm2[0]] = arm2[2];
          moves.push({ x: arm2[0], y: arm2[1], c: arm2[2] });
        }
        turn = st.u === WHITE ? WHITE : BLACK;
        var wasOver = over;
        over = !!st.o;
        winner = st.wi || 0;
        winCells = [];
        var wl = st.wl || [];
        for (var wli = 0; wli < wl.length; wli++) winCells.push({ x: wl[wli][0], y: wl[wli][1] });
        hoverCell = null;
        thinking = false;
        draw();
        updateTurnUI();
        refreshOnlineUI();
        var pendingWin2 = online.recordPending;
        online.recordPending = false;
        if (over && (!wasOver || pendingWin2)) {
          pulse();
          online.undoReq = '';
          renderUndoAsk();
          recordNow();
          var wq2 = (typeof st.wq === 'string' && st.wq) ? st.wq : winnerUidOf(winner);
          var iWin = !!wq2 && wq2 === myUid();
          var winName = nameOf(wq2);
          if (winner === 0) {
            setMood('calm');
            showBanner('平局啦！', '棋盘下满了，再来一局吧');
            setStatus('平局啦！');
          } else if (iWin) {
            setMood('happy');
            showBanner('你赢啦！', '五颗连成一线，太棒啦！');
            setStatus('你赢啦，好厉害！');
          } else {
            setMood('oops');
            showBanner(winName + ' 赢啦！', '差一点点，再来一局好不好？');
            setStatus(winName + ' 赢啦，别灰心！');
          }
        }
        return;
      }
    }
    online.lastSeq = st.q;
    online.seq = st.q;
    online.lastState = Date.now();
    online.hostUid = st.b || '';
    online.hostName = st.bn || '房主';
    online.hostPid = st.bp || online.hostPid || '';
    online.guestUid = st.w || '';
    online.guestName = st.wn || '';
    online.guestPid = st.gp || online.guestPid || '';
    online.role = (myUid() === online.hostUid) ? 'host' : (st.w && myUid() === st.w ? 'guest' : 'spec');
    if (st.hc) online.hostColor = st.hc === WHITE ? WHITE : BLACK;

    var sizeChanged = (N !== st.n);
    /* 修复：原代码 N = st.n || N 未做范围校验，恶意/异常包可让 N 变成 1e9，
       emptyBoard() 随即分配超大数组导致内存耗尽。限定在 9/13/15 路。 */
    var newN = st.n || N;
    if (newN !== 9 && newN !== 13 && newN !== 15) newN = N;
    N = newN;
    emptyBoard();
    moves = [];
    var arr = st.m || [];
    for (var i = 0; i < arr.length; i++) {
      var a = arr[i];
      /* 修复：原代码未校验坐标，越界会抛 TypeError 让页面崩溃 */
      if (!a || a[0] < 0 || a[1] < 0 || a[0] >= N || a[1] >= N) continue;
      var mvColor = (a[2] === BLACK || a[2] === WHITE) ? a[2] : BLACK;
      board[a[1]][a[0]] = mvColor;
      moves.push({ x: a[0], y: a[1], c: mvColor });
    }
    turn = st.u === WHITE ? WHITE : BLACK;
    var wasOver = over;
    over = !!st.o;
    winner = st.wi || 0;
    winCells = [];
    var wl = st.wl || [];
    for (var k = 0; k < wl.length; k++) winCells.push({ x: wl[k][0], y: wl[k][1] });
    hoverCell = null;
    thinking = false;

    if (sizeChanged) relayout(); else draw();
    updateTurnUI();
    refreshOnlineUI();

    var pendingWin = online.recordPending;
    online.recordPending = false;

    if (over && (!wasOver || pendingWin)) {
      pulse();
      online.undoReq = '';
      renderUndoAsk();
      recordNow();
      var wq = (typeof st.wq === 'string' && st.wq) ? st.wq : winnerUidOf(winner);
      var iWin = !!wq && wq === myUid();
      var winName = nameOf(wq);
      if (winner === 0) {
        setMood('calm');
        showBanner('平局啦！', '棋盘下满了，再来一局吧');
        setStatus('平局啦！');
      } else if (online.role === 'spec') {
        showBanner(winName + ' 赢啦！', '本局结束，等房主开新一局');
        setStatus('观战结束 · ' + winName + ' 获胜');
      } else if (iWin) {
        setMood('happy');
        showBanner('你赢啦！', '五颗连成一线，太棒啦！');
        setStatus('你赢啦，好厉害！');
      } else {
        setMood('oops');
        showBanner(winName + ' 赢啦！', '差一点点，再来一局好不好？');
        setStatus(winName + ' 赢啦，别灰心！');
      }
    } else if (!over) {
      if (wasOver) banner.classList.remove('show');
      if (online.role === 'host') setStatus(turn === myColor() ? '轮到你啦！' : '等朋友落子…');
      else if (online.role === 'guest') setStatus(turn === myColor() ? '轮到你啦！' : '等房主落子…');
      else setStatus('观战中 · 等他们下棋');
    }
  }

  function swapHostColor() {
    if (online.role !== 'host' || !online.room) return;
    if (moves.length !== 0 || over) {
      setStatus('已经开局啦，想换颜色就先重开一局');
      return;
    }
    online.hostColor = online.hostColor === BLACK ? WHITE : BLACK;
    online.seq++;
    updateTurnUI();
    refreshOnlineUI();
    broadcastState(true);
    setStatus(online.hostColor === BLACK ? '现在你执黑，先手' : '现在你执白，朋友先手');
  }

  function refreshOnlineUI() {
    if (!onlinePanel) return;
    onlinePanel.classList.toggle('on', mode === 'online');
    var inRoom = !!online.room;
    if (onlineEmpty) onlineEmpty.style.display = inRoom ? 'none' : 'flex';
    if (onlineRoom) onlineRoom.hidden = !inRoom;
    if (spectatorBadge) spectatorBadge.classList.toggle('on', mode === 'online' && inRoom && online.role === 'spec');
    if (!inRoom) return;

    if (roomCodeEl) roomCodeEl.textContent = online.room;
    var people = countWatchers();
    var selfName = me.name || '我';
    var mine = myColor() === BLACK ? '执黑' : '执白';
    var meta = '';
    if (online.role === 'host') {
      meta = '你（' + selfName + '）' + mine + ' · ' + (online.guestUid ? ('对手：' + nameOf(online.guestUid)) : '等朋友上桌');
    } else if (online.role === 'guest') {
      meta = '你（' + selfName + '）' + mine + ' · 房主：' + online.hostName;
    } else {
      meta = '观战中 · 房主：' + online.hostName + (online.guestUid ? (' · 朋友：' + nameOf(online.guestUid)) : '');
    }
    if (online.role !== 'host' && people > 0) meta += ' · 一起观战 ' + people + ' 人';
    online.baseMeta = meta;
    if (roomMetaEl) roomMetaEl.textContent = meta + netSuffix();
    if (roomTools) roomTools.classList.toggle('on', online.role === 'host');
    if (kickGuestBtn) kickGuestBtn.hidden = !(online.role === 'host' && online.guestUid);
    if (colorHint) colorHint.textContent = online.hostColor === BLACK ? '现在执黑先手' : '现在执白后手';
    renderPending();
    renderUndoAsk();
  }

  function countWatchers() {
    var now = Date.now();
    var n = 0;
    for (var uid in online.seen) {
      if (!Object.prototype.hasOwnProperty.call(online.seen, uid)) continue;
      if (uid === myUid() || uid === online.hostUid || uid === online.guestUid) continue;
      if (now - online.seen[uid].ts < 25000) n++;
    }
    return n;
  }

  function renderPending() {
    if (!pendingListEl) return;
    pendingListEl.innerHTML = '';
    if (online.role !== 'host' || online.guestUid) return;
    var now = Date.now();
    var list = [];
    for (var uid in online.seen) {
      if (!Object.prototype.hasOwnProperty.call(online.seen, uid)) continue;
      if (uid === myUid() || uid === online.hostUid || uid === online.guestUid) continue;
      if (online.denied[uid]) continue;
      if (now - online.seen[uid].ts > 90000) continue;
      list.push({ uid: uid, n: online.seen[uid].n || '朋友', ts: online.seen[uid].ts, p: online.seen[uid].p || '' });
    }
    list.sort(function (a, b) { return a.ts - b.ts; });
    var limit = Math.min(3, list.length);
    for (var i = 0; i < limit; i++) {
      (function (item) {
        var row = document.createElement('div');
        row.className = 'pending-item';
        var label = document.createElement('span');
        label.textContent = item.n + ' 申请加入';
        var okBtn = document.createElement('button');
        okBtn.type = 'button';
        okBtn.className = 'mini-btn coral';
        okBtn.textContent = '同意';
        okBtn.addEventListener('click', function () { approve(item.uid, item.p, item.n); });
        var noBtn = document.createElement('button');
        noBtn.type = 'button';
        noBtn.className = 'mini-btn ghost';
        noBtn.textContent = '拒绝';
        noBtn.addEventListener('click', function () { deny(item.uid); });
        row.appendChild(label);
        row.appendChild(okBtn);
        row.appendChild(noBtn);
        pendingListEl.appendChild(row);
      })(list[i]);
    }
  }

  function approve(uid, pid, name) {
    if (online.role !== 'host' || online.guestUid) return;
    online.guestUid = uid;
    online.guestPid = pid || (online.seen[uid] && online.seen[uid].p) || '';
    online.guestName = name || online.guestName || nameOf(uid);
    online.guestSince = Date.now();
    publish({ t: 'ok', u: uid, b: online.hostUid, bp: online.hostPid || myPid(), gp: online.guestPid });
    renderPending();
    refreshOnlineUI();
    updateTurnUI();
    online.seq++;
    broadcastState(true);
    lobbyHeartbeat();
    setStatus('同意啦！' + online.guestName + ' 执白棋');
  }

  function deny(uid) {
    online.denied[uid] = 1;
    publish({ t: 'no', u: uid, b: online.hostUid });
    renderPending();
    refreshOnlineUI();
  }

  /* 修复：kick 消息原来只处理接收端，房主根本没有发送的入口，
     也就无法把赖着不走的对手请出房间。这里补上发送端：
     房主点「移出对手」后广播 kick，被请的人转为观战并离开座位。 */
  function kickGuest() {
    if (online.role !== 'host' || !online.guestUid) return;
    var uid = online.guestUid;
    var pid = online.guestPid || '';
    var name = online.guestName || nameOf(uid);
    publish({ t: 'kick', u: uid, p: pid, gp: pid, b: online.hostUid, bp: online.hostPid || myPid() });
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.guestSince = 0;
    online.seq++;
    renderPending();
    refreshOnlineUI();
    updateTurnUI();
    broadcastState(true);
    setStatus('已把 ' + name + ' 移出房间');
    showBanner(name + ' 已被移出', '你可以邀请新朋友进来');
  }

  function renderUndoAsk() {
    if (!undoAskEl) return;
    var show = !replay.on && online.role === 'host' && !!online.undoReq && !over;
    undoAskEl.hidden = !show;
    if (show && undoAskText) undoAskText.textContent = nameOf(online.undoReq) + ' 请求悔棋';
  }

  function hostUndo(uid) {
    if (online.role !== 'host' || !online.room) return false;
    if (over || !moves.length) return false;
    /* 修复：原代码硬编码 BLACK/WHITE，房主"换颜色"后双方悔棋都会失效。
       改为按 online.hostColor 推导实际执子方。 */
    var myColor = online.hostColor;
    var oppColor = myColor === BLACK ? WHITE : BLACK;
    var color = (uid === online.hostUid) ? myColor : oppColor;
    if (moves[moves.length - 1].c !== color) return false;
    popMove();
    turn = color;
    winner = 0;
    winCells = [];
    over = false;
    hoverCell = null;
    banner.classList.remove('show');
    updateTurnUI();
    draw();
    online.seq++;
    broadcastState(true);
    return true;
  }

  function createRoom(code) {
    if (!code) code = makeRoomCode();
    /* 修复：已在房间时直接建新房会静默覆盖订阅，不给旧房间发 bye、
       旧大厅心跳也会继续广播，留在旧房间的朋友要等 40 秒超时才发现房主没了 */
    if (online.room && online.room !== code) leaveRoom(true);
    online.uid = me.uid;
    online.role = 'host';
    online.hostUid = myUid();
    online.hostName = me.name;
    online.hostPid = myPid();
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.seen = {};
    online.denied = {};
    online.seq = 0;
    online.undoReq = '';
    online.hostColor = BLACK;
    newGame(false);
    subscribe(code);
    startLobbyPublish();
    refreshOnlineUI();
    if (presence.started) pushPresence();
    setStatus('房间建好啦，把邀请发给朋友吧');
    window.setTimeout(function () { broadcastState(true); }, 260);
    if (online.hbTimer) window.clearInterval(online.hbTimer);
    online.hbTimer = window.setInterval(function () {
      /* 没有对手时不用定时发全量状态，减少公共中转的消息量 */
      if (online.role === 'host' && online.guestUid) broadcastState(false);
      /* 修复：访客崩溃后座位会永久占着，这里按心跳超时自动释放 */
      reclaimStaleGuest();
    }, 8000);
  }

  /* 修复：房间号填错/房主已离开时，申请人会永远停在“等对方同意”且毫无反馈。
     加入后 12 秒内若没有收到房主的任何回执（st/ok/no/busy），给出明确提示。 */
  function armJoinWatch() {
    if (online.joinTimer) window.clearTimeout(online.joinTimer);
    online.joinHeard = false;
    online.joinTimer = window.setTimeout(function () {
      online.joinTimer = 0;
      if (online.joinHeard) return;
      if (!online.room || online.role === 'host' || online.role === 'guest') return;
      setStatus('没连上这个房间，房主可能已离开，确认下房间号再试试');
    }, 12000);
  }

  function joinRoom(code) {
    if (!code) return false;
    code = String(code).replace(/[^0-9]/g, '').slice(0, 6);
    if (code.length !== 6) {
      setStatus('房间号是 6 位数字哦');
      return false;
    }
    /* 修复：从旧房间切换时原先直接覆盖订阅，不发 bye（旧对手卡 40 秒）、
       旧大厅心跳残留。同房间重复加入（重连场景）则不拆链路。 */
    if (online.room && online.room !== code) leaveRoom(true);
    online.uid = me.uid;
    online.role = 'spec';
    online.hostUid = '';
    online.hostPid = '';
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.seen = {};
    online.denied = {};
    online.seq = 0;
    online.undoReq = '';
    online.hostColor = BLACK;
    newGame(false);
    subscribe(code);
    refreshOnlineUI();
    if (presence.started) pushPresence();
    setStatus('正在加入房间 ' + code + ' …');
    sendHi();
    armJoinWatch();
    if (online.hbTimer) window.clearInterval(online.hbTimer);
    online.hbTimer = window.setInterval(sendHi, 12000);
  }

  function sendHi() {
    if (!online.topic || online.role === 'host') return;
    publish({ t: 'hi', u: myUid(), p: myPid(), n: me.name });
  }

  /* 修复：访客关掉页面时房间座位会一直留着。
     原来只在点「离开」按钮时才发 bye；直接关标签页/杀进程就收不到，
     房主那边座位就一直被占着。
     这里在页面隐藏/卸载时用 sendBeacon 补发一条 bye（比 fetch 可靠，
     页面正在关闭时也能把请求发出去），房主也能立刻把座位释放掉。 */
  function sendByeBeacon() {
    if (!online.topic || online.role === 'host') return;
    var payload = JSON.stringify({ t: 'bye', u: myUid(), p: myPid() });
    try {
      if (navigator.sendBeacon) {
        var ok = navigator.sendBeacon(RELAY + online.topic, new Blob([payload], { type: 'text/plain' }));
        if (ok) return;
      }
    } catch (e) { /* ignore */ }
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', RELAY + online.topic, true);
      xhr.setRequestHeader('Content-Type', 'text/plain');
      xhr.send(payload);
    } catch (e) { /* ignore */ }
  }

  function leaveRoom(silent) {
    stopLobbyPublish(true);
    closeLobby();
    if (online.topic) {
      publish({ t: 'bye', u: myUid() });
    }
    if (online.hbTimer) { window.clearInterval(online.hbTimer); online.hbTimer = 0; }
    if (online.joinTimer) { window.clearTimeout(online.joinTimer); online.joinTimer = 0; }
    online.joinHeard = false;
    if (online.stateTimer) { window.clearTimeout(online.stateTimer); online.stateTimer = 0; }
    closeStream();
    online.room = '';
    online.topic = '';
    online.role = 'none';
    online.hostUid = '';
    online.hostPid = '';
    online.guestUid = '';
    online.guestPid = '';
    online.seen = {};
    online.seenMids = [];
    /* 修复：原 leaveRoom 未清理 denied，被拒绝过的用户在后续房间内仍会被静默忽略，
       看似“加不进去” */
    online.denied = {};
    online.lastSeq = -1;
    online.seq = 0;
    online.uid = '';
    online.undoReq = '';
    if (roomInputEl) roomInputEl.value = '';
    refreshOnlineUI();
    if (presence.started) pushPresence();
    if (!silent) setStatus('已离开房间');
  }

  function setConn(text) {
    if (mode === 'online' && text) setStatus(text);
  }

  /* ---------------- 房间大厅 ---------------- */

  function publishTo(topic, msg) {
    if (!topic) return Promise.resolve(false);
    try {
      return timedFetch(RELAY + topic, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(msg)
      }, 4000).then(function (r) { return r.ok; }).catch(function () { return false; });
    } catch (e) { return Promise.resolve(false); }
  }

  function lobbyHeartbeat() {
    if (!online.room || online.role !== 'host') return;
    publishTo(LOBBY_TOPIC, {
      t: 'lobby', r: online.room, n: me.name || '房主', p: myPid(),
      s: N, g: online.guestUid ? 1 : 0, ts: Date.now()
    });
  }

  function startLobbyPublish() {
    stopLobbyPublish(false);
    if (!online.room || online.role !== 'host') return;
    lobbyHeartbeat();
    /* 修复：原大厅心跳 6s → 3s，轮询 since 窗口 45s → 90s。
       弱网下消息延迟可能好几秒，原设置容易导致好友“看不到房间” */
    lobby.pubTimer = window.setInterval(lobbyHeartbeat, 3000);
  }

  function stopLobbyPublish(withOut) {
    if (lobby.pubTimer) {
      window.clearInterval(lobby.pubTimer);
      lobby.pubTimer = 0;
    }
    if (withOut && online.room && online.role === 'host') {
      publishTo(LOBBY_TOPIC, { t: 'lobby-out', r: online.room, p: myPid(), ts: Date.now() });
    }
  }

  function openLobby() {
    if (!roomLobby) return;
    if (mode !== 'online') forceMode('online');
    lobby.open = true;
    roomLobby.classList.add('on');
    roomLobby.setAttribute('aria-hidden', 'false');
    if (lobbySubEl) lobbySubEl.textContent = '正在刷新…';
    if (lobbyListEl) lobbyListEl.innerHTML = '<div class="lobby-empty">正在找房间…</div>';
    pollLobby();
    if (lobby.listTimer) window.clearInterval(lobby.listTimer);
    lobby.listTimer = window.setInterval(pollLobby, 3000);
  }

  function closeLobby() {
    lobby.open = false;
    if (roomLobby) {
      roomLobby.classList.remove('on');
      roomLobby.setAttribute('aria-hidden', 'true');
    }
    if (lobby.listTimer) {
      window.clearInterval(lobby.listTimer);
      lobby.listTimer = 0;
    }
  }

  function pollLobby() {
    if (lobby.loading) return;
    lobby.loading = true;
    /* 修复：原裸 fetch 无超时，弱网下 lobby.loading 永远为 true，
       大厅列表从此不再发起请求（一直转圈且不重试） */
    timedFetch(RELAY + LOBBY_TOPIC + '/json?poll=1&since=90s', { cache: 'no-store' }, 5000)
      .then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.text();
      })
      .then(function (txt) { parseLobby(txt); })
      .catch(function () {
        if (lobby.open && lobbySubEl) lobbySubEl.textContent = '大厅连不上，稍后再试';
      })
      .then(function () { lobby.loading = false; });
  }

  function parseLobby(txt) {
    var map = {};
    var lines = String(txt || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/^\s+|\s+$/g, '');
      if (!line) continue;
      var outer;
      try { outer = JSON.parse(line); } catch (e) { continue; }
      if (!outer || outer.event !== 'message' || typeof outer.message !== 'string') continue;
      var m;
      try { m = JSON.parse(outer.message); } catch (e) { continue; }
      if (!m || (m.t !== 'lobby' && m.t !== 'lobby-out')) continue;
      var code = String(m.r || '');
      if (!/^[0-9]{6}$/.test(code)) continue;
      var when = typeof outer.time === 'number' ? outer.time : Math.floor((m.ts || 0) / 1000);
      if (map[code] && map[code].when > when) continue;
      map[code] = {
        code: code,
        name: String(m.n || '房主').slice(0, 16),
        size: Number(m.s) || 0,
        full: !!m.g,
        pid: String(m.p || ''),
        when: when,
        out: m.t === 'lobby-out'
      };
    }
    var list = [];
    for (var code2 in map) {
      if (!Object.prototype.hasOwnProperty.call(map, code2)) continue;
      var it = map[code2];
      if (it.out) continue;
      if (it.code === online.room) continue;
      if (it.pid && it.pid === myPid()) continue;
      list.push(it);
    }
    list.sort(function (a, b) { return b.when - a.when; });
    lobby.items = list.slice(0, 20);
    renderLobby();
  }

  function renderLobby() {
    if (!lobbyListEl) return;
    if (lobbySubEl) {
      lobbySubEl.textContent = lobby.items.length
        ? ('共 ' + lobby.items.length + ' 个房间，点「加入」等房主同意')
        : '看看谁在开房';
    }
    lobbyListEl.innerHTML = '';
    if (!lobby.items.length) {
      var empty = document.createElement('div');
      empty.className = 'lobby-empty';
      empty.textContent = '现在还没有人开房间\n点「创建房间」，朋友就能在这里看到你';
      lobbyListEl.appendChild(empty);
      return;
    }
    for (var i = 0; i < lobby.items.length; i++) {
      (function (it) {
        var row = document.createElement('div');
        row.className = 'lobby-item';
        var ava = document.createElement('div');
        ava.className = 'lobby-ava';
        ava.textContent = (it.name || '房').charAt(0);
        var info = document.createElement('div');
        info.className = 'lobby-info';
        var nm = document.createElement('div');
        nm.className = 'lobby-name';
        nm.textContent = it.name + ' 的房间';
        var sub = document.createElement('small');
        sub.textContent = '房间 ' + it.code + (it.size ? (' · ' + it.size + ' 路') : '') + (it.full ? ' · 对局中' : ' · 等待加入');
        info.appendChild(nm);
        info.appendChild(sub);
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mini-btn coral';
        btn.textContent = it.full ? '对局中' : '加入';
        btn.disabled = !!it.full;
        if (!it.full) {
          btn.addEventListener('click', function () { enterLobbyRoom(it); });
        }
        row.appendChild(ava);
        row.appendChild(info);
        row.appendChild(btn);
        lobbyListEl.appendChild(row);
      })(lobby.items[i]);
    }
  }

  function enterLobbyRoom(it) {
    if (!it || !it.code) return;
    closeLobby();
    if (mode !== 'online') forceMode('online');
    joinRoom(it.code);
    setStatus('已向 ' + (it.name || '房主') + ' 发出加入请求，等对方同意…');
  }

  function inviteLink() {
    return 'https://www.bilibili.com/toy/idol-gomoku/index.html?room=' + online.room;
  }

  function copyText(text) {
    return new Promise(function (resolve) {
      function fallback() {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          resolve(!!ok);
        } catch (e) { resolve(false); }
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { resolve(true); }, fallback);
          return;
        }
      } catch (e) { /* ignore */ }
      fallback();
    });
  }

  /* ---------------- 对局记录 & 回放 ---------------- */

  function loadRecords() {
    try {
      var raw = window.localStorage.getItem(RECORD_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) records = arr.slice(0, RECORD_MAX);
    } catch (e) { /* ignore */ }
  }

  function saveRecords() {
    try {
      window.localStorage.setItem(RECORD_KEY, JSON.stringify(records.slice(0, RECORD_MAX)));
    } catch (e) { /* ignore */ }
  }

  function finishRecord(skip) {
    if (skip) return;
    if (mode === 'online' && online.role === 'guest') {
      /* 朋友本地先落子，等房主确认这一帧后真正入历史 */
      online.recordPending = true;
      return;
    }
    recordNow();
  }

  function recordNow() {
    if (!moves.length) return;
    var key = mode + '|' + N + '|' + moves.length + '|' + (winner || 0);
    if (lastRecordKey === key) return;
    lastRecordKey = key;
    var m = [];
    for (var i = 0; i < moves.length; i++) m.push([moves[i].x, moves[i].y, moves[i].c]);
    records.unshift({
      ts: Date.now(), n: N, m: m, wi: winner || 0, mode: mode,
      opp: mode === 'online' ? onlineOpponent() : '',
      oppName: mode === 'online' ? nameOf(onlineOpponent()) : '',
      oppPid: mode === 'online' ? onlineOpponentPid() : ''
    });
    if (records.length > RECORD_MAX) records.length = RECORD_MAX;
    saveRecords();
  }

  function latestRecord() {
    return records.length ? records[0] : null;
  }

  function modeLabel(m) {
    return m === 'ai' ? '人机' : (m === 'pvp' ? '双人' : (m === 'online' ? '联机' : '对局'));
  }

  function openHistory() {
    if (replay.on) stopReplay();
    renderHistory();
    if (historyPanel) historyPanel.classList.add('on');
  }

  function closeHistory() {
    if (historyPanel) historyPanel.classList.remove('on');
  }

  function renderHistory() {
    if (!historyList) return;
    historyList.innerHTML = '';
    if (!records.length) {
      var empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = '还没有对弈记录，先下一局吧';
      historyList.appendChild(empty);
      return;
    }
    for (var i = 0; i < records.length; i++) {
      (function (rec) {
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'history-item';
        var log = document.createElement('span');
        log.className = 'hi-log ' + (rec.wi === 1 ? 'b' : (rec.wi === 2 ? 'w' : 'd'));
        var txt = document.createElement('span');
        txt.className = 'hi-text';
        var t1 = document.createElement('b');
        t1.textContent = rec.wi === 1 ? '黑棋赢啦' : (rec.wi === 2 ? '白棋赢啦' : '平局');
        var t2 = document.createElement('span');
        t2.textContent = (rec.n || 13) + ' 路 · ' + ((rec.m || []).length) + ' 手 · ' + modeLabel(rec.mode);
        txt.appendChild(t1);
        txt.appendChild(t2);
        var go = document.createElement('span');
        go.className = 'hi-go';
        go.textContent = '看回放';
        item.appendChild(log);
        item.appendChild(txt);
        if (rec.mode === 'online' && rec.opp && !isFriend(rec.opp)) {
          var addF = document.createElement('span');
          addF.className = 'hi-go add';
          addF.textContent = '加好友';
          addF.addEventListener('click', function (ev) {
            ev.stopPropagation();
            friendAction(rec.opp, rec.oppName || '朋友', '', rec.oppPid || '');
            renderHistory();
          });
          item.appendChild(addF);
        }
        item.appendChild(go);
        item.addEventListener('click', function () {
          closeHistory();
          startReplay(rec);
        });
        historyList.appendChild(item);
      })(records[i]);
    }
  }

  function startReplay(rec) {
    if (!rec || !rec.m || !rec.m.length) {
      setStatus('还没有对局记录，先下一局吧');
      return;
    }
    if (replay.on) stopReplay();
    replay.on = true;
    replay.rec = rec;
    replay.saved = {
      N: N, board: board, moves: moves.slice(), turn: turn,
      over: over, winner: winner, winCells: winCells.slice(),
      banner: banner.classList.contains('show'),
      title: winText.textContent, sub: winSub.textContent,
      status: statusEl.textContent
    };
    replay.i = 0;
    banner.classList.remove('show');
    actionRow.classList.add('replaying');
    replayActions.classList.add('on');
    applyReplayFrame();
    replayPlay();
  }

  function applyReplayFrame() {
    var rec = replay.rec;
    var i = replay.i;
    var sizeChanged = (N !== rec.n);
    N = rec.n;
    emptyBoard();
    moves = [];
    for (var k = 0; k < i; k++) {
      var a = rec.m[k];
      if (!a || a[0] >= N || a[1] >= N) continue;
      board[a[1]][a[0]] = a[2];
      moves.push({ x: a[0], y: a[1], c: a[2] });
    }
    turn = (i % 2 === 0) ? BLACK : WHITE;
    over = false;
    winner = 0;
    winCells = [];
    if (i >= rec.m.length && (rec.wi || rec.m.length >= rec.n * rec.n)) {
      over = true;
      winner = rec.wi || 0;
      if (rec.wi) {
        var last = rec.m[rec.m.length - 1];
        var line = findWin(last[0], last[1], rec.wi);
        if (line) winCells = line;
      }
    }
    hoverCell = null;
    thinking = false;
    if (sizeChanged) relayout(); else draw();
    updateTurnUI();
    if (rpPrevBtn) rpPrevBtn.disabled = (i <= 0);
    if (rpNextBtn) rpNextBtn.disabled = (i >= rec.m.length);
    setStatus('回放中 · 第 ' + i + ' / ' + rec.m.length + ' 手' + (over ? ' · 对局结束' : ''));
  }

  function replayPlay() {
    if (!replay.on) return;
    if (replay.timer) {
      window.clearInterval(replay.timer);
      replay.timer = 0;
      rpPlayBtn.textContent = '播放';
      return;
    }
    if (replay.i >= replay.rec.m.length) {
      replay.i = 0;
      applyReplayFrame();
    }
    rpPlayBtn.textContent = '暂停';
    replay.timer = window.setInterval(function () {
      if (!replay.on || replay.i >= replay.rec.m.length) {
        window.clearInterval(replay.timer);
        replay.timer = 0;
        rpPlayBtn.textContent = '播放';
        return;
      }
      replay.i++;
      applyReplayFrame();
    }, 450);
  }

  function replayStep(d) {
    if (!replay.on) return;
    if (replay.timer) {
      window.clearInterval(replay.timer);
      replay.timer = 0;
      rpPlayBtn.textContent = '播放';
    }
    var len = replay.rec.m.length;
    replay.i = Math.max(0, Math.min(len, replay.i + d));
    applyReplayFrame();
  }

  function stopReplay() {
    if (!replay.on) return;
    if (replay.timer) {
      window.clearInterval(replay.timer);
      replay.timer = 0;
    }
    replay.on = false;
    replay.rec = null;
    actionRow.classList.remove('replaying');
    replayActions.classList.remove('on');
    rpPlayBtn.textContent = '播放';
    var s = replay.saved;
    replay.saved = null;
    if (s) {
      N = s.N;
      board = s.board;
      moves = s.moves;
      turn = s.turn;
      over = s.over;
      winner = s.winner;
      winCells = s.winCells;
      relayout();
      updateTurnUI();
      if (s.banner) showBanner(s.title, s.sub);
      setStatus(s.status);
    }
  }

  /* ---------------- controls ---------------- */

  function popMove() {
    var m = moves.pop();
    if (m) board[m.y][m.x] = 0;
  }

  function undo() {
    if (replay.on) {
      stopReplay();
      return;
    }
    if (mode === 'online') {
      if (!online.room) {
        setStatus('先创建或加入房间才能悔棋哦');
        return;
      }
      if (over) {
        setStatus('本局结束啦，重新开始更痛快');
        return;
      }
      if (!moves.length) {
        setStatus('还没有落子可以悔棋哦');
        return;
      }
      if (online.role === 'host') {
        if (hostUndo(online.hostUid)) setStatus('悔棋成功，重新下一手吧');
        else setStatus('只能悔自己刚下的那一手哦');
      } else if (online.role === 'guest') {
        /* 修复：原硬编码 WHITE，房主换色后 guest 执黑时无法悔棋 */
        var guestColor = online.hostColor === BLACK ? WHITE : BLACK;
        if (moves[moves.length - 1].c !== guestColor) {
          setStatus('只能悔自己刚下的那一手哦');
          return;
        }
        publish({ t: 'undo', u: myUid() });
        setStatus('悔棋请求已发送，等房主同意…');
      } else {
        setStatus('观战中不能悔棋');
      }
      return;
    }
    if (!moves.length) {
      setStatus('还没有落子可以悔棋哦');
      return;
    }
    thinking = false;
    aiToken++;
    banner.classList.remove('show');
    over = false;
    winner = 0;
    winCells = [];
    hoverCell = null;
    /* 修复：悔棋后清掉上一局的记录键，否则重下到相同手数/胜负时会被判定重复而不入史 */
    lastRecordKey = '';
    setMood('calm');

    if (mode === 'ai' || mode === 'teach') {
      if (moves.length && moves[moves.length - 1].c === WHITE) popMove();
      if (moves.length && moves[moves.length - 1].c === BLACK) popMove();
    } else {
      popMove();
    }

    turn = moves.length % 2 === 0 ? BLACK : WHITE;
    updateTurnUI();
    draw();
    if ((mode === 'ai' || mode === 'teach') && turn === WHITE) {
      scheduleAI();
    } else {
      setStatus(mode === 'teach' ? '悔棋啦，继续跟着蓝圈下～' : '悔棋啦，再来一次！');
    }
  }

  function bindSeg(container, attr, handler) {
    var btns = container.querySelectorAll('button[' + attr + ']');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function (ev) {
        var el = ev.currentTarget;
        for (var j = 0; j < btns.length; j++) btns[j].classList.toggle('on', btns[j] === el);
        handler(el.getAttribute(attr));
      });
    }
  }

  function forceMode(v) {
    if (replay.on) stopReplay();
    if (mode === 'teach') leaveTeach();
    mode = v;
    highlightMode(v);
    newGame(true);
    refreshOnlineUI();
  }

  bindSeg(modeSeg, 'data-mode', function (v) {
    if (replay.on) stopReplay();
    if (mode === 'teach') leaveTeach();
    if (mode === 'online' && v !== 'online') leaveRoom(true);
    closeLobby();
    mode = v;
    newGame(true);
    refreshOnlineUI();
    if (v === 'ai') setStatus('人机对战 · 轮到你啦！');
    else if (v === 'pvp') setStatus('双人对战 · 黑棋先手，开始吧！');
    else setStatus('创建房间，或点「房间」看谁在开房');
  });

  bindSeg(diffSeg, 'data-diff', function (v) {
    diff = v;
    refreshSummary();
    setStatus('难度换成' + diffText(v) + '啦！');
  });

  bindSeg(sizeSeg, 'data-size', function (v) {
    if (mode === 'online' && online.room && online.role !== 'host') {
      setStatus('棋盘由房主设置哦');
      return;
    }
    N = parseInt(v, 10);
    newGame(true);
    if (mode === 'online' && online.room) {
      online.seq++;
      broadcastState(true);
    }
    setStatus('棋盘换成 ' + v + ' 路啦！');
  });

  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('restartBtn').addEventListener('click', function () {
    if (mode === 'online' && online.role !== 'host') {
      setStatus('等房主重新开始哦');
      return;
    }
    newGame(true);
    if (mode === 'online') {
      online.seq++;
      broadcastState(true);
    }
    if (mode !== 'teach') setStatus('新的一局，加油！');
  });
  document.getElementById('againBtn').addEventListener('click', function () {
    if (mode === 'teach') {
      if (teach.stage === 'lesson' && over && winner === BLACK) {
        teachStartMatch();
        return;
      }
      newGame(true);
      return;
    }
    if (mode === 'online' && online.role !== 'host') {
      setStatus('等房主重新开始哦');
      banner.classList.remove('show');
      return;
    }
    newGame(true);
    if (mode === 'online') {
      online.seq++;
      broadcastState(true);
    }
    setStatus('新的一局，加油！');
  });
  if (winHomeBtn) {
    winHomeBtn.addEventListener('click', function () { showHome(); });
  }

  if (undoOkBtn) {
    undoOkBtn.addEventListener('click', function () {
      var uid = online.undoReq;
      online.undoReq = '';
      renderUndoAsk();
      if (!uid) return;
      if (hostUndo(uid)) {
        publish({ t: 'undo-ok', u: uid });
        setStatus('已同意悔棋，已成功悔棋');
      } else {
        publish({ t: 'undo-no', u: uid });
        setStatus('这一手不方便悔棋，已告诉朋友');
      }
    });
  }
  if (undoNoBtn) {
    undoNoBtn.addEventListener('click', function () {
      var uid = online.undoReq;
      online.undoReq = '';
      renderUndoAsk();
      if (uid) publish({ t: 'undo-no', u: uid });
      setStatus('已拒绝悔棋');
    });
  }

  if (winFriendBtn) {
    winFriendBtn.addEventListener('click', function () {
      var opp = onlineOpponent();
      if (!opp) {
        winFriendBtn.hidden = true;
        return;
      }
      friendAction(opp, nameOf(opp), '', onlineOpponentPid());
    });
  }
  if (replayBtn) {
    replayBtn.addEventListener('click', function () { openHistory(); });
  }
  if (homeBtn) {
    homeBtn.addEventListener('click', function () { showHome(); });
  }
  if (homePanel) {
    var homeCards = homePanel.querySelectorAll('.home-card[data-enter]');
    for (var hc = 0; hc < homeCards.length; hc++) {
      (function (card) {
        card.addEventListener('click', function () {
          enterHomeMode(card.getAttribute('data-enter'));
        });
      })(homeCards[hc]);
    }
  }
  if (historyCloseBtn) {
    historyCloseBtn.addEventListener('click', function () { closeHistory(); });
  }
  if (winReplayBtn) {
    winReplayBtn.addEventListener('click', function () {
      var rec = latestRecord();
      if (!rec) return;
      startReplay(rec);
    });
  }
  if (rpPrevBtn) rpPrevBtn.addEventListener('click', function () { replayStep(-1); });
  if (rpNextBtn) rpNextBtn.addEventListener('click', function () { replayStep(1); });
  if (rpPlayBtn) rpPlayBtn.addEventListener('click', function () { replayPlay(); });
  if (rpExitBtn) rpExitBtn.addEventListener('click', function () { stopReplay(); });

  if (createRoomBtn) {
    createRoomBtn.addEventListener('click', function () {
      if (mode !== 'online') forceMode('online');
      online.roomTries = 0;
      createRoomWithRetry();
    });
  }
  if (joinRoomBtn) {
    joinRoomBtn.addEventListener('click', function () {
      var code = roomInputEl ? String(roomInputEl.value || '').trim() : '';
      if (!code) {
        setStatus('先输入 6 位房间号哦');
        return;
      }
      if (mode !== 'online') forceMode('online');
      joinRoom(code);
    });
  }
  if (roomListBtn) {
    roomListBtn.addEventListener('click', function () { openLobby(); });
  }
  if (lobbyCloseBtn) {
    lobbyCloseBtn.addEventListener('click', function () { closeLobby(); });
  }
  if (lobbyMask) {
    lobbyMask.addEventListener('click', function () { closeLobby(); });
  }
  if (copyLinkBtn) {
    copyLinkBtn.addEventListener('click', function () {
      if (!online.room) return;
      setStatus('正在复制邀请链接…');
      copyText(inviteLink()).then(function (ok) {
        setStatus(ok ? '邀请链接已复制，发给朋友吧'
          : ('复制失败，把房间号 ' + online.room + ' 发给朋友吧'));
      });
    });
  }
  if (swapColorBtn) {
    swapColorBtn.addEventListener('click', function () { swapHostColor(); });
  }
  if (kickGuestBtn) {
    kickGuestBtn.addEventListener('click', function () { kickGuest(); });
  }
  if (reconnectBtn) {
    reconnectBtn.addEventListener('click', reconnectRoom);
  }
  if (leaveRoomBtn) {
    leaveRoomBtn.addEventListener('click', function () {
      leaveRoom(false);
      newGame(true);
    });
  }

  if (settingToggle && configPanel) {
    settingToggle.addEventListener('click', function () {
      var open = configPanel.classList.toggle('open');
      settingToggle.classList.toggle('open', open);
    });
  }

  canvas.addEventListener('click', function (ev) {
    if (over || thinking || replay.on) return;
    if (historyPanel && historyPanel.classList.contains('on')) return;
    if (mode === 'online') {
      if (!online.room) return;
      var oc = hitTest(ev);
      if (!oc) return;
      if (online.role === 'host' && turn === myColor()) place(oc.x, oc.y);
      else if (online.role === 'guest' && turn === myColor()) sendMove(oc.x, oc.y);
      return;
    }
    if ((mode === 'ai' || mode === 'teach') && turn !== BLACK) return;
    var c = hitTest(ev);
    if (c) place(c.x, c.y);
  });

  if (window.PointerEvent) {
    canvas.addEventListener('pointermove', function (ev) {
      if (ev.pointerType !== 'mouse' || over || thinking || replay.on) return;
      if (mode === 'online') {
        if (!online.room || (online.role !== 'host' && online.role !== 'guest')) return;
        if (turn !== myColor()) return;
      }
      if ((mode === 'ai' || mode === 'teach') && turn !== BLACK) return;
      var c = hitTest(ev);
      var same = (!c && !hoverCell) || (c && hoverCell && c.x === hoverCell.x && c.y === hoverCell.y);
      if (!same) {
        hoverCell = c;
        draw();
      }
    });
    canvas.addEventListener('pointerleave', function () {
      if (hoverCell) { hoverCell = null; draw(); }
    });
  }

  var fsBtn = document.getElementById('fsBtn');
  function toggleBoardFs(force) {
    var on = force === undefined ? !fsOn : !!force;
    fsOn = on;
    if (wrapEl) wrapEl.classList.toggle('fs', on);
    document.body.classList.toggle('fs-lock', on);
    if (fsBtn) {
      fsBtn.textContent = on ? '✕' : '⛶';
      fsBtn.title = on ? '退出全屏' : '全屏棋盘';
      fsBtn.setAttribute('aria-label', on ? '退出全屏' : '全屏棋盘');
    }
    window.setTimeout(relayout, 60);
  }
  if (fsBtn) {
    fsBtn.addEventListener('click', function (ev) {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      toggleBoardFs();
    });
  }
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (lobby.open) closeLobby();
      else if (fsOn) toggleBoardFs(false);
    }
  });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(relayout, 120);
  });

  if (window.ResizeObserver) {
    try {
      new ResizeObserver(function () { relayout(); }).observe(wrapEl);
    } catch (e) { /* ignore */ }
  }

  if (window.setInterval) window.setInterval(function () {
    if (mode !== 'online' || !online.room) return;
    if (online.role === 'host') {
      renderPending();
      refreshOnlineUI();
    } else if (!over && Date.now() - online.lastState > 12000) {
      setStatus('房主暂时不在线，等一等…');
    }
  }, 3000);

  /* ---------------- boot ---------------- */
  loadScore();
  paintScore();
  loadRecords();
  initIdentity();
  loadFriends();
  renderFriends();
  startPresence();
  bindToyLinks();
  window.addEventListener('offline', function () {
    if (online.room) setConn('网络断了，恢复后会自动重连（也可点「重连」）');
  });
  window.addEventListener('online', function () {
    if (!online.room) return;
    online.pollFails = 0;
    online.pollDelay = 1200;
    setConn('网络恢复，正在重连…');
    restartStream();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !online.room || !online.pollOn) return;
    online.pollDelay = 1200;
    if (online.pollTimer) {
      window.clearTimeout(online.pollTimer);
      online.pollTimer = 0;
    }
    if (!online.polling) pollOnce();
  });
  /* 修复：页面被关闭/切后台时补发 bye，让房主及时释放座位 */
  window.addEventListener('pagehide', function () { sendByeBeacon(); });
  window.addEventListener('beforeunload', function () { sendByeBeacon(); });
  var roomParam = null;
  try {
    var m = /[?&]room=([0-9]{6})/.exec(window.location.search || '');
    if (m) roomParam = m[1];
  } catch (e) { /* ignore */ }
  if (roomParam) {
    showGame();
    forceMode('online');
    joinRoom(roomParam);
  } else {
    newGame(false);
    updateTurnUI();
    showHome();
    relayout();
    refreshOnlineUI();
  }
})();
</script>
<script>
/* ===== TOY 原生底栏（评论 / 收藏 / 点赞）适配 =====
 * TOY 容器底部有一条原生互动栏，以「覆盖」方式浮在 WebView 之上：页面可用高度
 * 不变，但底部约 60~70px 会被盖住。env(safe-area-inset-bottom) 只反映系统安全区
 * （刘海 / Home Indicator），不含 TOY 自己的原生栏，在容器里通常是 0，靠它留白
 * 完全无效。这里在原生容器中推出需要预留的底部高度并写入 --toy-bottom-inset；
 * Web 环境下该变量等于系统安全区，行为与改动前完全一致。
 */
(function () {
  var root = document.documentElement;
  var NATIVE_BAR = 64;   // TOY 原生互动栏实测高度（CSS px），容器未上报时的兜底
  var env = 0;           // 系统安全区底部高度（px）
  var timer = null;

  function envBottom() {
    try {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:0;bottom:0;width:0;height:0;padding-bottom:env(safe-area-inset-bottom,0px);';
      document.body.appendChild(d);
      var v = parseFloat(getComputedStyle(d).paddingBottom) || 0;
      if (d.parentNode) d.parentNode.removeChild(d);
      return v > 0 ? v : 0;
    } catch (e) { return 0; }
  }

  function apply(px) {
    var v = Math.max(0, Math.round(px) || 0);
    root.style.setProperty('--toy-bottom-inset', v + 'px');
  }

  /* 找出 SDK 命名空间：不同容器里挂在 window.toy 或 window.Toy.toy。
     官方 SDK 用 defineProperty 定义 window.Toy（getter），这里统一按「有该方法」判定。 */
  function sdkNs() {
    var cands = [];
    try { if (window.Toy) cands.push(window.Toy); } catch (e) {}
    try { if (window.toy) cands.push(window.toy); } catch (e) {}
    for (var i = 0; i < cands.length; i++) {
      var c = cands[i];
      if (!c) continue;
      if (typeof c.getContainerState === 'function') return c;
      if (c.toy && typeof c.toy.getContainerState === 'function') return c.toy;
    }
    return null;
  }

  /* 由容器状态推出底部需要预留的总高度（含系统安全区） */
  function fromState(st) {
    if (st && st.immersive === true) { apply(env); return; }   // 沉浸模式无原生栏
    var reported = 0;
    if (st && st.safeArea && typeof st.safeArea.bottom === 'number') reported = st.safeArea.bottom;
    apply(Math.max(env, NATIVE_BAR, reported));
  }

  function probe() {
    var sdk = sdkNs();
    if (!sdk) return false;
    var settled = false;
    try {
      var p = sdk.getContainerState();
      if (p && typeof p.then === 'function') {
        p.then(
          function (st) { settled = true; fromState(st); },
          function () { settled = true; apply(env); }   // Web 端不支持 → 仅系统安全区
        );
        setTimeout(function () { if (!settled) fromState(null); }, 900);
      } else {
        settled = true;
        apply(env);
      }
    } catch (e) {
      settled = true;
      apply(env);
    }
    return true;
  }

  function boot() {
    env = envBottom();
    var tries = 0;
    timer = setInterval(function () {
      if (probe()) { clearInterval(timer); timer = null; return; }
      if (++tries > 24) { clearInterval(timer); timer = null; apply(env); }
    }, 150);
  }

  function refresh() {
    env = envBottom();
    var sdk = sdkNs();
    if (!sdk) { apply(env); return; }
    try {
      var p = sdk.getContainerState();
      if (p && typeof p.then === 'function') p.then(fromState, function () { apply(env); });
      else apply(env);
    } catch (e) { apply(env); }
  }

  if (document.body) boot();
  else document.addEventListener('DOMContentLoaded', boot);

  window.addEventListener('resize', refresh);
  window.addEventListener('orientationchange', function () { setTimeout(refresh, 260); });

  /* 原生栏展开 / 收起时容器会广播状态变化，跟着重新预留 */
  function watch() {
    var sdk = sdkNs();
    if (!sdk || typeof sdk.onContainerChange !== 'function') return;
    try {
      sdk.onContainerChange(function (st) { fromState(st && st.state ? st.state : st); });
    } catch (e) { /* 部分容器不支持订阅，忽略 */ }
  }
  if (document.body) setTimeout(watch, 400);
  else document.addEventListener('DOMContentLoaded', function () { setTimeout(watch, 400); });
})();
</script>

</body>
</html>
