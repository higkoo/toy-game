<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0C0B0A" />
<title>郭生白 · 视频全集｜大医传承 · 本能系统医学</title>
<link rel="icon" href="img/icon.jpg" />
<script src="https://s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js" defer></script>
<style>
:root{
  --bg:#0C0B0A;
  --card:#141210;
  --text:#F4EDE6;
  --dim:#A2968B;
  --faint:#6F645B;
  --line:rgba(244,237,230,.10);
  --accent:#E8642B;
  --accent-soft:#F08A54;
  --bottom-inset:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  background:
    radial-gradient(900px 520px at 18% -10%, rgba(232,100,43,.16), transparent 62%),
    radial-gradient(760px 460px at 96% 4%, rgba(120,92,66,.14), transparent 64%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}

.app{position:relative;max-width:720px;margin:0 auto}

/* ---------- 首屏 ---------- */
.hero{
  position:relative;overflow:hidden;
  height:58vh;
  height:clamp(320px,58dvh,620px);
  border-radius:0 0 26px 26px;
  background:#171310;
}
.hero-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:34% 40%;
  transform:scale(1.02);
}
.hero-shade{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(12,11,10,.62) 0%,rgba(12,11,10,.10) 26%,rgba(12,11,10,.44) 58%,#0C0B0A 100%);
}
.hero-glow{
  position:absolute;inset:auto -20% -30% -20%;height:46%;
  background:radial-gradient(60% 100% at 50% 100%, rgba(232,100,43,.24), transparent 72%);
  pointer-events:none;
}
.topbar{
  position:relative;z-index:3;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(16px + env(safe-area-inset-top)) 18px 0;
}
.brand{display:flex;align-items:center;gap:9px;font-size:11.5px;letter-spacing:.2em;color:rgba(255,255,255,.9)}
.brand-seal{
  width:25px;height:25px;border-radius:7px;display:grid;place-items:center;
  background:var(--accent);color:#190c05;font-size:12px;font-weight:800;letter-spacing:0;
}
.top-meta{
  font-size:10.5px;letter-spacing:.08em;color:rgba(255,255,255,.76);
  padding:5px 10px;border-radius:999px;
  border:1px solid rgba(255,255,255,.2);background:rgba(12,11,10,.28);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  white-space:nowrap;
}
.hero-body{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding:0 18px 26px;
}
.eyebrow{
  display:flex;align-items:center;gap:8px;
  margin:0 0 10px;font-size:10.5px;letter-spacing:.24em;color:var(--accent-soft);
}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--accent-soft);flex:0 0 auto}
.hero-title{
  margin:0;font-size:clamp(46px,13vw,76px);line-height:.98;font-weight:800;
  letter-spacing:-.035em;color:#fff;text-shadow:0 4px 34px rgba(0,0,0,.38);
}
.hero-title span{
  display:block;margin-top:13px;font-size:.33em;font-weight:500;
  letter-spacing:.18em;color:rgba(255,255,255,.8);text-shadow:none;
}
.hero-sub{margin:13px 0 0;font-size:12px;letter-spacing:.03em;color:rgba(255,255,255,.66)}
.hero-stats{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0 0}
.stat{
  font-size:10.5px;letter-spacing:.04em;color:rgba(255,255,255,.86);
  padding:5px 10px;border-radius:999px;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.hero-cta{
  display:inline-flex;align-items:center;gap:9px;
  margin-top:18px;height:46px;padding:0 20px;border-radius:999px;
  background:var(--accent);color:#1b0d06;font-size:13.5px;font-weight:700;
  box-shadow:0 10px 30px rgba(232,100,43,.3);
  transition:transform .16s ease, box-shadow .16s ease;
}
.hero-cta:active{transform:scale(.97);box-shadow:0 4px 16px rgba(232,100,43,.24)}
.hero-cta svg{width:15px;height:15px}

/* ---------- 合集导航 ---------- */
.shelf{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:26px 18px 2px;
}
.shelf h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
.shelf-hint{font-size:10.5px;letter-spacing:.12em;color:var(--faint);white-space:nowrap}
.tabs-bar{
  position:sticky;top:0;z-index:30;
  padding:12px 0 13px;
  background:linear-gradient(180deg,rgba(12,11,10,.97) 0%,rgba(12,11,10,.86) 78%,rgba(12,11,10,.6) 100%);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.tabs{
  display:flex;gap:8px;overflow-x:auto;
  padding:0 18px;
  scrollbar-width:none;-ms-overflow-style:none;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;min-width:128px;text-align:left;
  display:grid;gap:3px;padding:10px 13px;
  border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.035);
  color:var(--dim);scroll-snap-align:start;
  transition:background .18s ease,color .18s ease,border-color .18s ease;
}
.tab:active{background:rgba(255,255,255,.08)}
.tab.is-active{
  background:var(--accent);border-color:transparent;color:#1b0d06;
  box-shadow:0 8px 24px rgba(232,100,43,.24);
}
.tab-no{font-size:9.5px;letter-spacing:.18em;opacity:.72;font-variant-numeric:tabular-nums}
.tab-name{font-size:13px;font-weight:600;white-space:nowrap}
.tab-count{font-size:9.5px;letter-spacing:.06em;opacity:.72}

/* ---------- 合集信息卡 ---------- */
main{padding:18px 18px calc(118px + var(--bottom-inset))}
.collection{
  position:relative;overflow:hidden;
  border-radius:20px;border:1px solid var(--line);
  background:var(--card);
  scroll-margin-top:96px;
}
.coll-media{position:relative;aspect-ratio:16/9;background:#1d1915}
.coll-media img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 42%;
}
.coll-media::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(12,11,10,.28) 0%,transparent 42%,rgba(20,18,16,.94) 100%);
}
.coll-kicker{
  position:absolute;top:12px;left:12px;z-index:2;
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 10px;border-radius:999px;
  font-size:10px;letter-spacing:.14em;color:#fff;
  background:rgba(12,11,10,.6);border:1px solid rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  font-variant-numeric:tabular-nums;
}
.coll-kicker i{width:4px;height:4px;border-radius:50%;background:var(--accent-soft)}
.coll-body{padding:15px 16px 18px}
.coll-name{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.coll-intro{margin:8px 0 0;font-size:12.5px;line-height:1.7;color:var(--dim)}
.coll-link{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:14px;padding-bottom:2px;
  font-size:11.5px;letter-spacing:.04em;color:var(--accent-soft);
  border-bottom:1px solid rgba(232,100,43,.42);
}
.coll-link svg{width:11px;height:11px}

/* ---------- 搜索 ---------- */
.search{
  display:flex;align-items:center;gap:10px;
  height:46px;margin-top:16px;padding:0 14px;
  border-radius:14px;border:1px solid var(--line);background:var(--card);
  transition:border-color .18s ease;
}
.search:focus-within{border-color:rgba(232,100,43,.42)}
.search svg{width:15px;height:15px;color:var(--faint);flex:0 0 auto}
.search input{
  flex:1;min-width:0;background:none;border:0;outline:none;
  color:var(--text);font-size:13.5px;font-family:inherit;
}
.search input::placeholder{color:var(--faint)}
.search-clear{
  width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.08);color:var(--dim);font-size:14px;line-height:1;
}
.search-clear:active{background:rgba(255,255,255,.14)}

/* ---------- 章节列表 ---------- */
.list-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:22px 0 4px;
  font-size:10.5px;letter-spacing:.18em;color:var(--faint);
}
.list-head b{font-weight:500;color:var(--dim);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.list{border-bottom:1px solid var(--line)}
.row{
  width:100%;display:grid;grid-template-columns:42px 1fr 36px;align-items:center;gap:10px;
  padding:13px 2px;text-align:left;
  border-top:1px solid var(--line);
  transition:background .15s ease;
}
.row:active{background:rgba(255,255,255,.045)}
.row-no{
  font-size:11.5px;letter-spacing:.06em;color:var(--faint);
  font-variant-numeric:tabular-nums;
}
.row.is-seen .row-no{color:var(--accent-soft)}
.row-title{
  font-size:13.5px;line-height:1.5;font-weight:500;color:var(--text);
  word-break:break-word;
}
.row.is-seen .row-title{color:#BEB1A5}
.row-badge{
  display:inline-block;margin-left:7px;vertical-align:2px;
  padding:1px 5px;border-radius:4px;
  font-size:8.5px;letter-spacing:.08em;font-weight:600;
  color:#1b0d06;background:var(--accent-soft);
}
.row-play{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.14);color:var(--accent-soft);
  transition:background .16s ease,border-color .16s ease;
}
.row:active .row-play{background:rgba(232,100,43,.18);border-color:rgba(232,100,43,.42)}
.row-play svg{width:11px;height:11px}
.empty{padding:44px 0 40px;text-align:center;font-size:12.5px;color:var(--faint);letter-spacing:.04em}

/* ---------- 底部操作区 ---------- */
.dock{
  position:fixed;left:50%;bottom:0;z-index:40;
  width:100%;max-width:720px;
  transform:translateX(-50%);
  padding:10px 16px calc(10px + var(--bottom-inset));
  background:linear-gradient(180deg,rgba(12,11,10,.66) 0%,rgba(12,11,10,.96) 34%,rgba(12,11,10,.99) 100%);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.08);
}
.dock-inner{display:flex;align-items:center;gap:14px}
.dock-info{flex:1;min-width:0}
.dock-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:10.5px;letter-spacing:.1em;color:var(--faint)}
.dock-line em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-seen{font-size:10.5px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.dock-seen b{font-size:14px;color:var(--text);font-weight:700}
.bar{margin-top:7px;height:4px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#C94F1E,#F08A54);transition:width .3s ease}
.dock-btn{
  flex:0 0 auto;height:44px;padding:0 18px;border-radius:12px;
  background:var(--accent);color:#1b0d06;
  font-size:12.5px;font-weight:700;white-space:nowrap;
  box-shadow:0 6px 20px rgba(232,100,43,.24);
  transition:transform .16s ease;
}
.dock-btn:active{transform:scale(.97)}

/* ---------- 浮层提示 ---------- */
.toast{
  position:fixed;left:50%;z-index:60;
  bottom:calc(116px + var(--bottom-inset));
  max-width:calc(100vw - 40px);
  padding:10px 16px;border-radius:999px;
  font-size:12px;line-height:1.4;text-align:center;color:var(--text);
  background:rgba(40,34,29,.97);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 12px 34px rgba(0,0,0,.4);
  opacity:0;transform:translate(-50%,10px);
  transition:opacity .2s ease,transform .2s ease;
  pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 小屏 / 矮屏 ---------- */
@media (max-width:360px){
  .hero-title{font-size:44px}
  .hero-sub{font-size:11px}
  .tab{min-width:116px;padding:9px 11px}
  .tab-name{font-size:12.5px}
  .coll-name{font-size:19px}
  .row{grid-template-columns:36px 1fr 34px;gap:8px}
  .row-title{font-size:13px}
}
@media (max-height:620px){
  .hero{height:318px}
  .hero-stats{display:none}
  .hero-title{font-size:40px}
  .hero-title span{margin-top:10px}
  .eyebrow{margin-bottom:7px}
  .hero-sub{margin-top:9px}
  .hero-cta{height:40px;margin-top:12px}
  .hero-body{padding-bottom:20px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">

  <header class="hero">
    <img class="hero-img" src="img/cover-main.jpg" alt="大医传承 · 郭生白" fetchpriority="high" />
    <div class="hero-shade"></div>
    <div class="hero-glow"></div>
    <div class="topbar">
      <span class="brand"><span class="brand-seal">本</span>大医传承</span>
      <span class="top-meta" id="topMeta">4 个合集 · 164 集</span>
    </div>
    <div class="hero-body">
      <p class="eyebrow"><i></i>郭生白 · 本能系统医学</p>
      <h1 class="hero-title">郭生白<span>视频全集</span></h1>
      <p class="hero-sub">说白伤寒论 · 大医传承 · 本能系统论</p>
      <div class="hero-stats">
        <span class="stat">4 个合集</span>
        <span class="stat">164 集完整收录</span>
      </div>
      <button class="hero-cta" id="startBtn" type="button">
        开始学习
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/></svg>
      </button>
    </div>
  </header>

  <section class="shelf">
    <h2>选集入口</h2>
    <span class="shelf-hint">按原合集顺序</span>
  </section>

  <div class="tabs-bar">
    <div class="tabs" id="tabs" role="tablist" aria-label="视频合集"></div>
  </div>

  <main>
    <section class="collection" id="collectionCard" aria-live="polite">
      <div class="coll-media">
        <img id="collCover" src="img/cover-main.jpg" alt="" />
        <span class="coll-kicker" id="collKicker">合集 01<i></i><span>20 集</span></span>
      </div>
      <div class="coll-body">
        <h2 class="coll-name" id="collName">说白伤寒论</h2>
        <p class="coll-intro" id="collIntro"></p>
        <a class="coll-link" id="collLink" href="#" target="_blank" rel="noopener noreferrer">
          在 B 站打开合集
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2h6v6M10 2 4.5 7.5M9 7.5v2.5H2V3h2.5"/></svg>
        </a>
      </div>
    </section>

    <div class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="m10.6 10.6 3 3"/></svg>
      <input id="search" type="search" inputmode="search" autocomplete="off" placeholder="在本合集中搜索章节" aria-label="搜索当前合集章节" />
      <button class="search-clear" id="searchClear" type="button" aria-label="清空搜索" hidden>×</button>
    </div>

    <div class="list-head">
      <span>章节目录</span>
      <b id="listMeta">20 集</b>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden>没有找到匹配的章节</div>
  </main>

  <footer class="dock" id="dock">
    <div class="dock-inner">
      <div class="dock-info">
        <div class="dock-line">
          <em id="dockName">说白伤寒论</em>
          <span class="dock-seen">已看 <b id="seenCount">0</b> / <span id="seenTotal">20</span></span>
        </div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      </div>
      <button class="dock-btn" id="continueBtn" type="button">继续学习</button>
    </div>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';

  var DATA = window.BENNENG_DATA;
  if (!DATA || !DATA.collections || !DATA.collections.length) return;

  var SEEN_KEY = 'benneng.seen.v1';
  var ACTIVE_KEY = 'benneng.active.v1';

  var tabsEl = document.getElementById('tabs');
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var searchEl = document.getElementById('search');
  var searchClearEl = document.getElementById('searchClear');
  var collCardEl = document.getElementById('collectionCard');
  var collCoverEl = document.getElementById('collCover');
  var collKickerEl = document.getElementById('collKicker');
  var collNameEl = document.getElementById('collName');
  var collIntroEl = document.getElementById('collIntro');
  var collLinkEl = document.getElementById('collLink');
  var listMetaEl = document.getElementById('listMeta');
  var dockNameEl = document.getElementById('dockName');
  var seenCountEl = document.getElementById('seenCount');
  var seenTotalEl = document.getElementById('seenTotal');
  var barFillEl = document.getElementById('barFill');
  var continueBtn = document.getElementById('continueBtn');
  var toastEl = document.getElementById('toast');

  var seen = new Set(readArray(SEEN_KEY));
  var active = clampIndex(readNumber(ACTIVE_KEY), DATA.collections.length);
  var query = '';
  var toastTimer = null;

  function readArray(key) {
    try {
      var v = JSON.parse(localStorage.getItem(key) || '[]');
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function readNumber(key) {
    try { return parseInt(localStorage.getItem(key), 10) || 0; } catch (e) { return 0; }
  }
  function clampIndex(n, len) { return n >= 0 && n < len ? n : 0; }
  function write(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function current() { return DATA.collections[active]; }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  /* Toy SDK 在不同容器里可能挂在 window.Toy 或 window.toy 下，统一探测 */
  function toyApi() {
    var roots = [];
    try { if (window.Toy) roots.push(window.Toy); } catch (e) {}
    try { if (window.toy) roots.push(window.toy); } catch (e) {}
    for (var i = 0; i < roots.length; i++) {
      var o = roots[i];
      if (!o) continue;
      if (typeof o.navigate === 'function') return o;
      if (o.toy && typeof o.toy.navigate === 'function') return o.toy;
    }
    return null;
  }

  function openVideo(video) {
    markSeen(video.bv);
    var api = toyApi();
    if (api) {
      try {
        var r = api.navigate({ type: 'video', id: video.bv });
        if (r && typeof r.catch === 'function') {
          r.catch(function () { copyFallback(video); });
        }
        return;
      } catch (e) {}
    }
    copyFallback(video);
  }

  /* 非 Toy 容器 / 导航失败时：复制链接，交给 B 站 App 打开 */
  function copyFallback(video) {
    var url = 'https://www.bilibili.com/video/' + video.bv;
    var copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {}, function () {});
        copied = true;
      }
    } catch (e) {}
    showToast(copied ? '已复制视频链接 · ' + video.bv : '视频地址：' + url);
  }

  function markSeen(bv) {
    if (seen.has(bv)) { updateDock(); return; }
    seen.add(bv);
    write(SEEN_KEY, JSON.stringify(Array.from(seen)));

    var row = listEl.querySelector('[data-bv="' + bv + '"]');
    if (row) {
      row.classList.add('is-seen');
      var titleEl = row.querySelector('.row-title');
      if (titleEl && !titleEl.querySelector('.row-badge')) {
        var badge = document.createElement('span');
        badge.className = 'row-badge';
        badge.textContent = '已看';
        titleEl.appendChild(badge);
      }
    }
    updateDock();
  }

  function renderTabs() {
    tabsEl.innerHTML = DATA.collections.map(function (c, i) {
      return '<button class="tab' + (i === active ? ' is-active' : '') + '" type="button" role="tab"'
        + ' aria-selected="' + (i === active ? 'true' : 'false') + '" data-index="' + i + '">'
        + '<span class="tab-no">合集 ' + pad(i + 1) + '</span>'
        + '<span class="tab-name">' + esc(c.name) + '</span>'
        + '<span class="tab-count">' + c.count + ' 集</span>'
        + '</button>';
    }).join('');
  }

  function renderCollection() {
    var c = current();
    collCoverEl.src = c.cover;
    collCoverEl.alt = c.name + ' 封面';
    collKickerEl.innerHTML = '合集 ' + pad(active + 1) + '<i></i><span>' + c.count + ' 集</span>';
    collNameEl.textContent = c.name;
    collIntroEl.textContent = c.intro;
    collLinkEl.href = c.listUrl;
    dockNameEl.textContent = c.name;
    seenTotalEl.textContent = c.count;
    searchEl.value = '';
    query = '';
    searchClearEl.hidden = true;
  }

  function renderList() {
    var c = current();
    var q = query.trim().toLowerCase();
    var items = c.videos.filter(function (v) {
      return !q || v.t.toLowerCase().indexOf(q) !== -1 || v.bv.toLowerCase().indexOf(q) !== -1;
    });

    listEl.innerHTML = items.map(function (v) {
      var isSeen = seen.has(v.bv);
      return '<button class="row' + (isSeen ? ' is-seen' : '') + '" type="button" data-bv="' + v.bv + '"'
        + ' aria-label="第 ' + v.n + ' 讲：' + esc(v.t) + '">'
        + '<span class="row-no">' + pad(v.n) + '</span>'
        + '<span class="row-title">' + esc(v.t) + (isSeen ? '<span class="row-badge">已看</span>' : '') + '</span>'
        + '<span class="row-play" aria-hidden="true">'
        + '<svg viewBox="0 0 12 12" fill="currentColor"><path d="M3.2 1.6a.7.7 0 0 1 1.06-.6l6.1 4.4a.7.7 0 0 1 0 1.2l-6.1 4.4a.7.7 0 0 1-1.06-.6V1.6Z"/></svg>'
        + '</span></button>';
    }).join('');

    var hasItems = items.length > 0;
    emptyEl.hidden = hasItems;
    listMetaEl.textContent = q ? ('匹配 ' + items.length + ' 集') : (c.count + ' 集');
  }

  function updateDock() {
    var c = current();
    var done = c.videos.filter(function (v) { return seen.has(v.bv); }).length;
    seenCountEl.textContent = done;
    seenTotalEl.textContent = c.count;
    barFillEl.style.width = (c.count ? (done / c.count) * 100 : 0).toFixed(1) + '%';
    continueBtn.textContent = done >= c.count ? '重新温习' : '继续学习';
  }

  function setActive(index, options) {
    active = index;
    write(ACTIVE_KEY, String(active));
    renderTabs();
    renderCollection();
    renderList();
    updateDock();

    if (options && options.scroll) {
      collCardEl.scrollIntoView({
        behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
        block: 'start'
      });
    }
  }

  tabsEl.addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    var index = parseInt(tab.getAttribute('data-index'), 10);
    if (index === active) {
      collCardEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    setActive(index, { scroll: true });
  });

  listEl.addEventListener('click', function (e) {
    var row = e.target.closest('.row');
    if (!row) return;
    var bv = row.getAttribute('data-bv');
    var c = current();
    var video = c.videos.filter(function (v) { return v.bv === bv; })[0];
    if (video) openVideo(video);
  });

  searchEl.addEventListener('input', function () {
    query = searchEl.value;
    searchClearEl.hidden = !query;
    renderList();
  });

  searchClearEl.addEventListener('click', function () {
    searchEl.value = '';
    query = '';
    searchClearEl.hidden = true;
    renderList();
    searchEl.focus();
  });

  continueBtn.addEventListener('click', function () {
    var c = current();
    var next = c.videos.filter(function (v) { return !seen.has(v.bv); })[0] || c.videos[0];
    if (next) openVideo(next);
  });

  document.getElementById('startBtn').addEventListener('click', function () {
    collCardEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('topMeta').textContent = DATA.collections.length + ' 个合集 · ' + DATA.total + ' 集';

  renderTabs();
  renderCollection();
  renderList();
  updateDock();

  /* ===== Toy 原生底栏适配 =====
   * Toy 容器底部有一条原生互动栏覆盖在 WebView 上，env(safe-area-inset-bottom)
   * 不包含它。这里通过 SDK 的容器状态推出底部需要预留的高度，写入 --bottom-inset。 */
  (function () {
    var root = document.documentElement;
    var NATIVE_BAR = 64;
    var env = 0;
    var timer = null;

    function envBottom() {
      try {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;left:0;bottom:0;width:0;height:0;padding-bottom:env(safe-area-inset-bottom,0px);';
        document.body.appendChild(d);
        var v = parseFloat(getComputedStyle(d).paddingBottom) || 0;
        if (d.parentNode) d.parentNode.removeChild(d);
        return v > 0 ? v : 0;
      } catch (e) { return 0; }
    }
    function apply(px) {
      root.style.setProperty('--bottom-inset', Math.max(0, Math.round(px) || 0) + 'px');
    }
    function sdkNs() {
      var cands = [];
      try { if (window.Toy) cands.push(window.Toy); } catch (e) {}
      try { if (window.toy) cands.push(window.toy); } catch (e) {}
      for (var i = 0; i < cands.length; i++) {
        var c = cands[i];
        if (!c) continue;
        if (typeof c.getContainerState === 'function') return c;
        if (c.toy && typeof c.toy.getContainerState === 'function') return c.toy;
      }
      return null;
    }
    function fromState(st) {
      if (st && st.immersive === true) { apply(env); return; }
      var reported = 0;
      if (st && st.safeArea && typeof st.safeArea.bottom === 'number') reported = st.safeArea.bottom;
      apply(Math.max(env, NATIVE_BAR, reported));
    }
    function probe() {
      var sdk = sdkNs();
      if (!sdk) return false;
      var settled = false;
      try {
        var p = sdk.getContainerState();
        if (p && typeof p.then === 'function') {
          p.then(function (st) { settled = true; fromState(st); },
                 function () { settled = true; apply(env); });
          setTimeout(function () { if (!settled) fromState(null); }, 900);
        } else {
          apply(env);
        }
      } catch (e) { apply(env); }
      return true;
    }
    function refresh() {
      env = envBottom();
      var sdk = sdkNs();
      if (!sdk) { apply(env); return; }
      try {
        var p = sdk.getContainerState();
        if (p && typeof p.then === 'function') p.then(fromState, function () { apply(env); });
        else apply(env);
      } catch (e) { apply(env); }
    }
    function boot() {
      env = envBottom();
      var tries = 0;
      timer = setInterval(function () {
        if (probe()) { clearInterval(timer); timer = null; return; }
        if (++tries > 24) { clearInterval(timer); timer = null; apply(env); }
      }, 150);
    }
    if (document.body) boot();
    else document.addEventListener('DOMContentLoaded', boot);
    window.addEventListener('resize', refresh);
    window.addEventListener('orientationchange', function () { setTimeout(refresh, 260); });
  })();
})();
</script>
</body>
</html>
