    if (!els.friendPanel) return;
    if (els.historyPanel && els.historyPanel.classList.contains('on')) closeHistory();
    renderFriends();
    els.friendPanel.classList.add('on');
  }

  function closeFriends() {
    if (els.friendPanel) els.friendPanel.classList.remove('on');
  }

  function renderFriends() {
    if (!els.friendList) return;
    els.friendList.innerHTML = '';
    var now = Date.now();
    var onCount = 0;
    for (var k = 0; k < friends.length; k++) {
      var sn = presence.seen[friendKeyOf(friends[k])];
      var inRoomK = !!online.room && (friends[k].p === onlineOpponentPid() || friends[k].u === onlineOpponent());
      var seenHereK = !!(online.seen && ((online.seen[friends[k].u] && now - online.seen[friends[k].u].ts < 120000) ||
                                         (online.seen[friends[k].p] && now - online.seen[friends[k].p].ts < 120000)));
      if ((sn && now - sn.ts < FRIEND_ONLINE_MS) || inRoomK || seenHereK) onCount++;
    }
    if (els.friendCount) els.friendCount.textContent = String(onCount);
    if (!friends.length) {
      var empty = document.createElement('div');
      empty.className = 'friend-empty';
      empty.textContent = '还没有好友，联机下完一局可以加对方';
      els.friendList.appendChild(empty);
      return;
    }
    for (var i = 0; i < friends.length; i++) {
      (function (f) {
        var seen = presence.seen[friendKeyOf(f)] || null;
        var inRoom = !!online.room && (f.p === onlineOpponentPid() || (!!f.u && f.u === onlineOpponent()));
        var seenHere = !!(online.seen && ((online.seen[f.u] && (now - online.seen[f.u].ts < 120000)) ||
                                          (online.seen[f.p] && (now - online.seen[f.p].ts < 120000))));
        var on = (!!seen && (now - seen.ts < FRIEND_ONLINE_MS)) || inRoom || seenHere;
        var room = (seen && seen.r) ? seen.r : (inRoom ? online.room : '');
        var row = document.createElement('div');
        row.className = 'friend-row';
        row.appendChild(friendAvatar(f));

        var main = document.createElement('div');
        main.className = 'friend-main';
        var name = document.createElement('span');
        name.className = 'friend-name';
        name.textContent = f.n || '朋友';
        var sub = document.createElement('span');
        sub.className = 'friend-sub';
        var dot = document.createElement('i');
        dot.className = 'friend-dot' + (on ? ' on' : '');
        sub.appendChild(dot);
        var txt = document.createElement('span');
        txt.textContent = on ? (room ? ('在线 · 房间 ' + room) : '在线') : '离线';
        sub.appendChild(txt);
        main.appendChild(name);
        main.appendChild(sub);
        row.appendChild(main);

        if (on) {
          var join = document.createElement('button');
          join.type = 'button';
          join.className = 'friend-join';
          if (room) {
            join.textContent = '进入房间';
            join.addEventListener('click', function () { joinFriendRoom(room); });
          } else {
            join.textContent = '邀战';
            join.addEventListener('click', function () { challengeFriend(f); });
          }
          row.appendChild(join);
        }
        els.friendList.appendChild(row);
      })(friends[i]);
    }
  }

  /* 好友在线且不在房间：建一个房，把房号通过好友主题直接推给对方 */
  function challengeFriend(f) {
    var key = friendKeyOf(f);
    if (!key) return;
    closeFriends();
    if (online.room) leaveRoom(true);
    if (mode !== 'online') forceMode('online');
    online.roomTries = 0;
    /* 修复：房间号可能撞号。原实现建房后立刻把房号发给好友，
       一旦这个号已被别人占用，好友进来进的却是别人的房间。
       现在先建房探测，确认没被占用后再把邀请发出去。 */
    online.roomInvite = { key: key, friend: f };
    createRoomWithRetry();
    setStatus('正在建房…');
  }

  /* 房间号探测通过（没撞号）后，才把邀请发给好友 */
  function sendRoomInvite() {
    var inv = online.roomInvite;
    if (!inv) return;
    online.roomInvite = null;
    var code = online.room;
    publishTopic(friendTopic(inv.key), {
      t: 'inv', u: myUid(), p: myPid(), n: me.name, f: me.face || '', r: code, g: 'go'
    });
    setStatus('已邀请 ' + ((inv.friend && inv.friend.n) || '好友') + '，房间 ' + code + '，等他进来');
  }

  /* 收到好友邀战：没在局中就直接进房，正在下棋就回一句“稍后再约” */
  function acceptInvite(m) {
    var key = m.p || m.u;
    var code = String(m.r || '').replace(/[^0-9]/g, '').slice(0, 6);
    if (!key || code.length !== 6) return;
    if (m.g && m.g !== 'go') return;
    if (!isFriend(key)) return;
    var sig = key + '|' + code;
    var now = Date.now();
    if (inviteSeen[sig] && now - inviteSeen[sig] < 60000) return;
    inviteSeen[sig] = now;
    if (online.room === code) return;
    if (online.room && !over) {
      publishTopic(friendTopic(key), { t: 'invno', u: myUid(), p: myPid(), n: me.name });
      setStatus((m.n || '好友') + ' 邀你下围棋，你这局还没下完');
      return;
    }
    joinFriendRoom(code);
    setStatus((m.n || '好友') + ' 邀你下围棋，进房间 ' + code + ' 啦');
  }

  function joinFriendRoom(code) {
    code = String(code || '').replace(/[^0-9]/g, '').slice(0, 6);
    if (code.length !== 6) {
      setStatus('好友房间号不完整，稍后再试');
      return;
    }
    closeFriends();
    if (mode === 'online' && online.room) leaveRoom(true);
    if (mode !== 'online') forceMode('online');
    joinRoom(code);
    setStatus('正在进入好友房间 ' + code + ' …');
  }

  function closeStream() {
    /* 让所有还在路上的轮询/SSE 回调失效，避免旧房间的响应写进新房间 */
    online.gen++;
    stopPolling();
    stopLinkWatch();
    if (online.es) {
      try { online.es.close(); } catch (e) { /* ignore */ }
      online.es = null;
    }
  }

  function subscribe(room) {
    var topic = TOPIC_PREFIX + room.toLowerCase();
    var sameRoom = online.topic === topic;
    online.room = room;
    online.topic = topic;
    /* 重连同一个房间时保留游标和去重表，避免把已经处理过的落子再放一遍；
       只有换房间才从头同步。 */
    if (!sameRoom) {
      online.lastSeq = -1;
      online.lastTs = Math.floor(Date.now() / 1000) - 120;
      online.seenMids = [];
    }
    online.fail = 0;
    online.pollFails = 0;
    online.pollDelay = 1200;
    online.lastState = Date.now();
    closeStream();
    startLinkWatch();
    /* SSE 建立前先轮询兜底：部分 WebView 里 SSE 会静默连不上，不能干等 */
    startPolling();
    try {
      if (window.EventSource) {
        var es = new window.EventSource(RELAY + online.topic + '/sse');
        online.es = es;
        es.onopen = function () {
          if (online.es !== es) return;
          online.fail = 0;
          online.lastHeard = Date.now();
          /* 不打断已经在途的轮询：让它把断线期间的消息处理完，避免切换瞬间漏一手 */
          stopPolling(false);
          setConn('房间连接好了');
        };
        es.onmessage = function (ev) {
          if (online.es !== es) return;
          var outer;
          try { outer = JSON.parse(ev.data); } catch (e) { return; }
          if (!outer || outer.event !== 'message' || !outer.message) return;
          if (outer.time) online.lastTs = Math.max(online.lastTs, outer.time);
          handleMsg(outer.message);
        };
        es.onerror = function () {
          if (online.es !== es) return;
          online.fail++;
          /* 断了就立刻回退轮询，SSE 自己重连成功后 onopen 会再停掉轮询 */
          startPolling();
          setConn('实时连接断开，已切到轮询重连…');
        };
      }
    } catch (e) { /* 已经在轮询 */ }
  }

  function startPolling() {
    if (online.pollOn) return;
    online.pollOn = true;
    online.pollDelay = 1200;
    /* 刚接入时快速对齐状态，10 秒后降到 2.5 秒，避免把公共中转刷限流 */
    online.pollFastUntil = Date.now() + 10000;
    setConn('轮询模式连接房间中…');
    pollOnce();
  }

  function stopPolling(abort) {
    online.pollOn = false;
    if (online.pollTimer) {
      window.clearTimeout(online.pollTimer);
      online.pollTimer = 0;
    }
    /* abort === false 表示切到 SSE：保留在途请求，等它自己收尾 */
    if (abort !== false) {
      online.polling = false;
      if (online.pollCtrl) {
        try { online.pollCtrl.abort(); } catch (e) { /* ignore */ }
        online.pollCtrl = null;
      }
    }
  }

  function schedulePoll() {
    if (!online.pollOn) return;
    online.pollTimer = window.setTimeout(function () {
      online.pollTimer = 0;
      pollOnce();
    }, online.pollDelay);
  }

  function pollOnce() {
    if (!online.pollOn || online.polling || !online.topic) return;
    var gen = online.gen;
    var url = RELAY + online.topic + '/json?poll=1';
    if (online.lastTs) url += '&since=' + online.lastTs;
    var ctrl = null;
    var opts = { cache: 'no-store' };
    if (window.AbortController) {
      ctrl = new window.AbortController();
      online.pollCtrl = ctrl;
      opts.signal = ctrl.signal;
    }
    /* 弱网下请求可能一直挂着：给自己加超时，失败后按退避节奏重试 */
    var timer = window.setTimeout(function () {
      if (ctrl) { try { ctrl.abort(); } catch (e) { /* ignore */ } }
    }, POLL_TIMEOUT_MS);
    online.polling = true;
    window.fetch(url, opts).then(readNdjson).then(function (list) {
      window.clearTimeout(timer);
      if (gen !== online.gen) return;
      online.polling = false;
      online.pollCtrl = null;
      /* 这里不再要求 pollOn：切到 SSE 时保留的在途轮询也要把消息处理完 */
      var wasDown = online.pollFails >= 3;
      online.pollFails = 0;
      online.lastHeard = Date.now();
      online.pollDelay = Date.now() < online.pollFastUntil ? 1200 : 2500;
      for (var i = 0; i < list.length; i++) {
        if (list[i].time) online.lastTs = Math.max(online.lastTs, list[i].time);
        if (list[i].message) handleMsg(list[i].message);
      }
      if (wasDown && mode === 'online' && online.room) setConn('连接恢复了');
      updateRoomMeta();
      if (online.pollOn) schedulePoll();
    }).catch(function () {
      window.clearTimeout(timer);
      if (gen !== online.gen) return;
      online.polling = false;
      online.pollCtrl = null;
      if (!online.pollOn) return;
      online.pollFails++;
      if (online.pollFails >= 3 && mode === 'online' && online.room) {
        setConn('网络有点慢，正在自动重试…（也可点「重连」）');
      }
      online.pollDelay = online.pollFails <= 1 ? 1500 : Math.min(online.pollDelay * 2, 8000);
      updateRoomMeta();
      schedulePoll();
    });
  }

  /* 房间信息里常驻显示网络提示，卡的时候不用只盯着棋盘干等 */
  function netSuffix() {
    return online.pollFails >= 3 ? ' · 网络慢，正在自动重试（可点「重连」）' : '';
  }

  function updateRoomMeta() {
    if (!els.roomMeta || !online.room) return;
    els.roomMeta.textContent = (online.baseMeta || '') + netSuffix();
  }

  function setConn(text) {
    if (text) setStatus(text);
    updateRoomMeta();
  }

  /* 弱网看门狗：长时间收不到房间消息就重建连接（处理半开连接/静默断流） */
  function checkLink() {
    updateRoomMeta();
    if (!online.room || mode !== 'online') return;
    if (window.navigator && window.navigator.onLine === false) {
      setConn('网络断了，恢复后会自动重连（也可点「重连」）');
      return;
    }
    /* 轮询自己带超时和退避重试，已经处于轮询兜底时别再重建，避免把退避节奏重置成猛刷 */
    if (online.pollOn) return;
    /* 房主一个人等客时没有消息是正常的，放宽阈值并静默刷新，不打扰界面 */
    var alone = online.role === 'host' && !online.guestPid && !online.guestUid;
    var staleMs = alone ? LINK_STALE_MS * 3 : LINK_STALE_MS;
    if (Date.now() - online.lastHeard > staleMs) {
      if (!alone) setConn('连接卡住了，正在自动重连…（也可点「重连」）');
      restartStream();
    }
  }

  function startLinkWatch() {
    stopLinkWatch();
    online.lastHeard = Date.now();
    online.linkTimer = window.setInterval(checkLink, 6000);
  }

  function stopLinkWatch() {
    if (online.linkTimer) {
      window.clearInterval(online.linkTimer);
      online.linkTimer = 0;
    }
  }

  function restartStream() {
    if (online.room) subscribe(online.room);
  }

  /* 手动重连：卡住时不用干等，重建 SSE/轮询并主动要一次完整棋局状态 */
  function reconnectRoom() {
    if (!online.room) return;
    setConn('正在重连房间…');
    online.pollFails = 0;
    subscribe(online.room);
    window.setTimeout(function () {
      if (!online.room) return;
      if (online.role === 'host') broadcastState(true);
      else if (online.role === 'guest') publish({ t: 'sync', u: myUid(), p: myPid() });
    }, 350);
    window.setTimeout(function () {
      if (online.room) setConn('已重连，正在同步棋局…');
    }, 2500);
  }

  function createRoom(code) {
    ensureProfile();
    if (!code) code = makeRoomCode();
    online.uid = me.uid;
    online.role = 'host';
    online.hostUid = myUid();
    online.hostName = me.name;
    online.hostPid = myPid();
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.seen = {};
    online.denied = {};
    online.seq = 0;
    online.hostColor = BLACK;
    online.undoReq = '';
    newGame(false);
    subscribe(code);
    startLobbyPublish();
    refreshOnlineUI();
    setStatus('房间建好啦，把邀请发给朋友');
    window.setTimeout(function () { broadcastState(true); }, 260);
    if (presence.started) pushPresence();
    if (online.hbTimer) window.clearInterval(online.hbTimer);
    online.hbTimer = window.setInterval(function () {
      /* 没有对手时不用定时发全量状态，减少公共中转的消息量，避免被限流 */
      if (online.role === 'host' && (online.guestPid || online.guestUid)) broadcastState(false);
      /* 修复：访客崩溃后座位会永久占着，这里按心跳超时自动释放 */
      reclaimStaleGuest();
    }, 8000);
  }

  function joinRoom(code) {
    if (!code) return false;
    code = String(code).replace(/[^0-9]/g, '').slice(0, 6);
    if (code.length !== 6) {
      setStatus('房间号是 6 位数字哦');
      return false;
    }
    ensureProfile();
    online.uid = me.uid;
    online.role = 'spec';
    online.hostUid = '';
    online.hostName = '房主';
    online.hostPid = '';
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.seen = {};
    online.denied = {};
    online.seq = 0;
    online.hostColor = BLACK;
    online.undoReq = '';
    newGame(false);
    subscribe(code);
    refreshOnlineUI();
    setStatus('正在加入房间 ' + code + ' …');
    sendHi();
    if (presence.started) pushPresence();
    if (online.hbTimer) window.clearInterval(online.hbTimer);
    online.hbTimer = window.setInterval(sendHi, 12000);
    return true;
  }

  function sendHi() {
    if (!online.topic || online.role === 'host') return;
    publish({ t: 'hi', u: myUid(), p: myPid(), n: me.name });
  }

  /* 修复：访客关掉页面时房间座位会一直留着。
     原来只在点「离开」时发 bye；直接关标签页/杀进程就收不到，
     房主那边座位就一直被占着。
     这里用 sendBeacon 在页面隐藏/卸载时补发一条 bye（页面正在关闭时也能发出去）。 */
  function sendByeBeacon() {
    if (!online.topic || online.role === 'host') return;
    var payload = JSON.stringify({ t: 'bye', u: myUid(), p: myPid() });
    try {
      if (navigator.sendBeacon) {
        var ok = navigator.sendBeacon(RELAY + online.topic, new Blob([payload], { type: 'text/plain' }));
        if (ok) return;
      }
    } catch (e) { /* ignore */ }
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', RELAY + online.topic, true);
      xhr.setRequestHeader('Content-Type', 'text/plain');
      xhr.send(payload);
    } catch (e) { /* ignore */ }
  }

  function leaveRoom(silent) {
    stopLobbyPublish(true);
    closeLobby();
    if (online.topic && !silent) publish({ t: 'bye', u: myUid(), p: myPid() });
    closeStream();
    if (online.hbTimer) {
      window.clearInterval(online.hbTimer);
      online.hbTimer = 0;
    }
    online.room = '';
    online.topic = '';
    online.role = 'none';
    online.hostUid = '';
    online.hostPid = '';
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.seen = {};
    online.denied = {};
    online.seenMids = [];
    online.lastSeq = -1;
    online.lastTs = 0;
    online.undoReq = '';
    online.baseMeta = '';
    if (online.stateTimer) { window.clearTimeout(online.stateTimer); online.stateTimer = 0; }
    refreshOnlineUI();
    if (presence.started) pushPresence();
  }

  /* ---------------- 房间大厅 ---------------- */

  function lobbyHeartbeat() {
    if (!online.room || online.role !== 'host') return;
    publishTopic(LOBBY_TOPIC, {
      t: 'lobby', r: online.room, n: me.name || '房主', p: myPid(),
      s: N, g: online.guestPid ? 1 : 0, ts: Date.now()
    });
  }

  function startLobbyPublish() {
    stopLobbyPublish(false);
    if (!online.room || online.role !== 'host') return;
    lobbyHeartbeat();
    lobby.pubTimer = window.setInterval(lobbyHeartbeat, 6000);
  }

  function stopLobbyPublish(withOut) {
    if (lobby.pubTimer) {
      window.clearInterval(lobby.pubTimer);
      lobby.pubTimer = 0;
    }
    if (withOut && online.room && online.role === 'host') {
      publishTopic(LOBBY_TOPIC, { t: 'lobby-out', r: online.room, p: myPid(), ts: Date.now() });
    }
  }

  function openLobby() {
    if (!els.roomLobby) return;
    if (mode !== 'online') forceMode('online');
    lobby.open = true;
    els.roomLobby.classList.add('on');
    els.roomLobby.setAttribute('aria-hidden', 'false');
    if (els.lobbySub) els.lobbySub.textContent = '正在刷新…';
    if (els.lobbyList) els.lobbyList.innerHTML = '<div class="lobby-empty">正在找房间…</div>';
    pollLobby();
    if (lobby.listTimer) window.clearInterval(lobby.listTimer);
    lobby.listTimer = window.setInterval(pollLobby, 5000);
  }

  function closeLobby() {
    lobby.open = false;
    if (els.roomLobby) {
      els.roomLobby.classList.remove('on');
      els.roomLobby.setAttribute('aria-hidden', 'true');
    }
    if (lobby.listTimer) {
      window.clearInterval(lobby.listTimer);
      lobby.listTimer = 0;
    }
  }

  function pollLobby() {
    if (lobby.loading) return;
    lobby.loading = true;
    timedFetch(RELAY + LOBBY_TOPIC + '/json?poll=1&since=45s', { cache: 'no-store' }, REQUEST_TIMEOUT_MS)
      .then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.text();
      })
      .then(function (txt) { parseLobby(txt); })
      .catch(function () {
        if (lobby.open && els.lobbySub) els.lobbySub.textContent = '大厅连不上，稍后再试';
      })
      .then(function () { lobby.loading = false; });
  }

  function parseLobby(txt) {
    var map = {};
    var lines = String(txt || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/^\s+|\s+$/g, '');
      if (!line) continue;
      var outer;
      try { outer = JSON.parse(line); } catch (e) { continue; }
      if (!outer || outer.event !== 'message' || typeof outer.message !== 'string') continue;
      var m;
      try { m = JSON.parse(outer.message); } catch (e) { continue; }
      if (!m || (m.t !== 'lobby' && m.t !== 'lobby-out')) continue;
      var code = String(m.r || '');
      if (!/^[0-9]{6}$/.test(code)) continue;
      var when = typeof outer.time === 'number' ? outer.time : Math.floor((m.ts || 0) / 1000);
      if (map[code] && map[code].when > when) continue;
      map[code] = {
        code: code,
        name: String(m.n || '房主').slice(0, 16),
        size: Number(m.s) || 0,
        full: !!m.g,
        pid: String(m.p || ''),
        when: when,
        out: m.t === 'lobby-out'
      };
    }
    var list = [];
    for (var code2 in map) {
      if (!Object.prototype.hasOwnProperty.call(map, code2)) continue;
      var it = map[code2];
      if (it.out) continue;
      if (it.code === online.room) continue;
      if (it.pid && it.pid === myPid()) continue;
      list.push(it);
    }
    list.sort(function (a, b) { return b.when - a.when; });
    lobby.items = list.slice(0, 20);
    renderLobby();
  }

  function renderLobby() {
    if (!els.lobbyList) return;
    if (els.lobbySub) {
      els.lobbySub.textContent = lobby.items.length
        ? ('共 ' + lobby.items.length + ' 个房间，点「加入」等房主同意')
        : '看看谁在开房';
    }
    els.lobbyList.innerHTML = '';
    if (!lobby.items.length) {
      var empty = document.createElement('div');
      empty.className = 'lobby-empty';
      empty.textContent = '现在还没有人开房间\n点「创建房间」，朋友就能在这里看到你';
      els.lobbyList.appendChild(empty);
      return;
    }
    for (var i = 0; i < lobby.items.length; i++) {
      (function (it) {
        var row = document.createElement('div');
        row.className = 'lobby-item';
        var ava = document.createElement('div');
        ava.className = 'lobby-ava';
        ava.textContent = (it.name || '房').charAt(0);
        var info = document.createElement('div');
        info.className = 'lobby-info';
        var nm = document.createElement('div');
        nm.className = 'lobby-name';
        nm.textContent = it.name + ' 的房间';
        var sub = document.createElement('small');
        sub.textContent = '房间 ' + it.code + (it.size ? (' · ' + it.size + ' 路') : '') + (it.full ? ' · 对局中' : ' · 等待加入');
        info.appendChild(nm);
        info.appendChild(sub);
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mini-btn coral';
        btn.textContent = it.full ? '对局中' : '加入';
        btn.disabled = !!it.full;
        if (!it.full) {
          btn.addEventListener('click', function () { enterLobbyRoom(it); });
        }
        row.appendChild(ava);
        row.appendChild(info);
        row.appendChild(btn);
        els.lobbyList.appendChild(row);
      })(lobby.items[i]);
    }
  }

  function enterLobbyRoom(it) {
    if (!it || !it.code) return;
    closeLobby();
    if (mode !== 'online') forceMode('online');
    joinRoom(it.code);
    setStatus('已向 ' + (it.name || '房主') + ' 发出加入请求，等对方同意…');
  }

  function handleMsg(raw) {
    var m = raw;
    if (typeof raw === 'string') {
      try { m = JSON.parse(raw); } catch (e) { return; }
    }
    if (!m || typeof m !== 'object' || !m.t) return;
    online.lastHeard = Date.now();
    /* 弱网重试/轮询和 SSE 可能收到同一条消息，用 mid 去重，避免重复落子 */
    if (m.mid) {
      if (online.seenMids.indexOf(m.mid) >= 0) return;
      online.seenMids.push(m.mid);
      if (online.seenMids.length > 160) online.seenMids.shift();
    }
    if (m.t === 'hi') {
      var hid = m.p || m.u;
      if (!hid || hid === myPid()) return;
      online.seen[hid] = { n: m.n || '朋友', ts: Date.now(), p: m.p || '', u: m.u || '' };
      if (online.role === 'host') {
        renderPending();
        refreshOnlineUI();
        broadcastState(false);
      }
      return;
    }
    if (m.t === 'mv') {
      if (online.role !== 'host') return;
      if (!isGuestMsg(m)) return;
      var bad = over || turn !== friendColor() || m.q !== online.seq;
      if (!bad && (typeof m.x !== 'number' || typeof m.y !== 'number')) bad = true;
      if (!bad && (!inBoard(m.x, m.y) || at(m.x, m.y))) bad = true;
      if (bad) {
        /* 朋友已先本地落子：驳回后立刻回推真实盘面，让他回滚重画 */
        if (!over) {
          online.seq++;
          broadcastState(true);
        }
        return;
      }
      place(m.x, m.y);
      return;
    }
    if (m.t === 'pass') {
      if (online.role !== 'host') return;
      if (!isGuestMsg(m)) return;
      if (over || turn !== friendColor() || m.q !== online.seq) {
        if (!over) {
          online.seq++;
          broadcastState(true);
        }
        return;
      }
      doPass(true);
      return;
    }

    if (m.t === 'sync') {
      if (online.role === 'host' && isGuestMsg(m)) broadcastState(true);
      return;
    }
    if (m.t === 'ok') {
      if (online.role === 'host') return;
      if ((m.gp && m.gp === myPid()) || (!m.gp && m.u === myUid())) {
        online.role = 'guest';
        if (m.b) online.hostUid = m.b;
        if (m.bp) online.hostPid = m.bp;
        online.guestUid = myUid();
        online.guestPid = myPid();
        setStatus('房主同意啦，你执' + (myColor() === BLACK ? '黑' : '白') + '！');
        refreshOnlineUI();
      }
      return;
    }
    if (m.t === 'no') {
      if (online.role === 'host') return;
      if ((m.gp && m.gp === myPid()) || (!m.gp && m.u === myUid())) {
        online.role = 'spec';
        setStatus('房主拒绝了你，先观战啦');
        refreshOnlineUI();
      }
      return;
    }
    if (m.t === 'kick') {
      if (online.role === 'host') return;
      if ((m.gp && m.gp === myPid()) || (!m.gp && m.u === myUid())) {
        /* 被房主移出：彻底释放座位（转观战），并停掉心跳，
           否则还会继续占着对方的名额发心跳 */
        online.role = 'spec';
        online.guestPid = '';
        online.guestUid = '';
        online.guestName = '';
        if (online.hbTimer) { window.clearInterval(online.hbTimer); online.hbTimer = 0; }
        setStatus('房主让你先观战啦');
        refreshOnlineUI();
        updateTurnUI();
      }
      return;
    }
    if (m.t === 'undo') {
      if (online.role === 'host' && isGuestMsg(m)) {
        online.undoReq = idOf(m);
        renderUndoAsk();
      }
      return;
    }
    if (m.t === 'undo-ok') {
      if (online.role === 'host') return;
      if ((m.gp && m.gp === myPid()) || (!m.gp && m.u === myUid())) setStatus('房主已同意，已成功悔棋');
      return;
    }
    if (m.t === 'undo-no') {
      if (online.role === 'host') return;
      if ((m.gp && m.gp === myPid()) || (!m.gp && m.u === myUid())) setStatus('房主已拒绝你，暂时无法悔棋');
      return;
    }
    if (m.t === 'bye') {
      if (online.role === 'host' && isGuestMsg(m)) {
        online.guestUid = '';
        online.guestName = '';
        online.guestPid = '';
        online.seq++;
        renderPending();
        refreshOnlineUI();
        updateTurnUI();
        broadcastState(true);
      } else if (online.role !== 'host' && (m.p === online.hostPid || (!m.p && m.u === online.hostUid))) {
        closeStream();
        if (online.hbTimer) { window.clearInterval(online.hbTimer); online.hbTimer = 0; }
        online.role = 'none';
        online.room = '';
        online.topic = '';
        refreshOnlineUI();
        setStatus('房主关闭了房间');
        showBanner('房间已关闭', '可以自己创建一个新房间');
      }
      return;
    }
    if (m.t === 'st') {
      /* 修复：建房时若收到对端的状态广播，说明这个房间号已经被人占用，
         换一个号重建，避免两个房主互相覆盖状态。 */
      if (online.roomProbe && !online.roomProbe.done && Date.now() < online.roomProbe.until) {
        if (m.bp && m.bp === myPid()) { online.roomProbe.done = true; }
        else if (m.b && m.b !== myUid()) { onRoomProbeConflict(); return; }
        else if (m.b) { onRoomProbeConflict(); return; }
      }
      applyRemoteState(m);
      return;
    }
  }

  /* ntfy.sh 单条消息上限 4096 字节。19 路长对局的全量 mv 数组可能超过这个限制，
     服务端会直接 413，表现就是“突然同步不动了”。超过阈值时改用紧凑编码：
     每手 3 个字符（x/y 用 36 进制，虚手用 z，颜色 1/2）。 */
  function utf8ByteLen(text) {
    try { return new Blob([text]).size; } catch (e) { return String(text).length * 3; }
  }

  var MOVE_CHARS = '0123456789abcdefghijklmnopqrstuvwxyz';

  function encodeMoves(mv) {
    var out = '';
    for (var i = 0; i < mv.length; i++) {
      var a = mv[i];
      var pass = (a[0] === -1 && a[1] === -1);
      out += (pass ? 'z' : MOVE_CHARS.charAt(a[0])) +
             (pass ? 'z' : MOVE_CHARS.charAt(a[1])) +
             (a[2] === WHITE ? '2' : '1');
    }
    return out;
  }

  function decodeMoves(str) {
    var out = [];
    for (var i = 0; i + 2 < str.length; i += 3) {
      var xc = str.charAt(i), yc = str.charAt(i + 1), cc = str.charAt(i + 2);
      var c = cc === '2' ? WHITE : BLACK;
      if (xc === 'z' && yc === 'z') { out.push([-1, -1, c]); continue; }
      var x = parseInt(xc, 36), y = parseInt(yc, 36);
      if (isNaN(x) || isNaN(y)) continue;
      out.push([x, y, c]);
    }
    return out;
  }

  function buildState() {
    var mv = [];
    for (var i = 0; i < moves.length; i++) {
      var m = moves[i];
      mv.push(m.pass ? [-1, -1, m.c] : [m.x, m.y, m.c]);
    }
    var st = {
      t: 'st', q: online.seq, n: N, mv: mv,
      b: online.hostUid, bn: online.hostName, bp: online.hostPid || '',
      w: online.guestUid || '', wn: online.guestName || '', gp: online.guestPid || '',
      hc: online.hostColor,
      u: turn, o: over ? 1 : 0, wi: winner || 0, sc: scoreRes,
      wq: (over && winner) ? (winner === online.hostColor ? online.hostUid : online.guestUid) : '',
      wqp: (over && winner) ? winnerPidOf(winner) : ''
    };
    if (utf8ByteLen(JSON.stringify(st)) > 3800) {
      st.mv = encodeMoves(mv);
      st.mvc = 1;
    }
    return st;
  }

  function broadcastState(force) {
    if (online.role !== 'host' || !online.topic) return;
    var now = Date.now();
    if (!force && now - online.lastStateAt < 1200) {
      if (!online.stateTimer) {
        online.stateTimer = window.setTimeout(function () {
          online.stateTimer = 0;
          broadcastState(true);
        }, 1200);
      }
      return;
    }
    online.lastStateAt = now;
    publish(buildState());
  }

  /* 角色按设备 pid 判定：同一账号两台设备也能分清谁是房主、谁是对手 */
  function roleFromState() {
    if (online.hostPid && myPid() === online.hostPid) return 'host';
    if (online.guestPid && myPid() === online.guestPid) return 'guest';
    if (!online.hostPid && online.hostUid && myUid() === online.hostUid) return 'host';
    if (!online.guestPid && online.guestUid && myUid() === online.guestUid) return 'guest';
    return 'spec';
  }

  function applyRemoteState(st) {
    if (typeof st.q !== 'number') return;
    if (replay.on) {
      online.lastState = Date.now();
      return;
    }
    if (st.q <= online.lastSeq) {
      online.lastState = Date.now();
      if (st.bn) online.hostName = st.bn;
      if (st.wn) online.guestName = st.wn;
      if (st.bp) online.hostPid = st.bp;
      if (st.gp) online.guestPid = st.gp;
      if (st.b) online.hostUid = st.b;
      if (st.w) online.guestUid = st.w;
      if (st.hc) online.hostColor = st.hc === WHITE ? WHITE : BLACK;
      online.role = roleFromState();
      updateTurnUI();
      refreshOnlineUI();
      return;
    }
    if (online.role === 'host' && ((st.bp && st.bp === myPid()) || (!st.bp && st.b === myUid()))) {
      online.lastSeq = st.q;
      online.seq = st.q;
      online.lastState = Date.now();
      return;
    }
    online.lastSeq = st.q;
    online.seq = st.q;
    online.lastState = Date.now();
    online.hostUid = st.b || '';
    online.hostName = st.bn || '房主';
    online.hostPid = st.bp || online.hostPid || '';
    online.guestUid = st.w || '';
    online.guestName = st.wn || '';
    online.guestPid = st.gp || online.guestPid || '';
    online.role = roleFromState();
    if (st.hc) online.hostColor = st.hc === WHITE ? WHITE : BLACK;

    var sizeChanged = (N !== (st.n || N));
    if (sizeChanged) {
      /* 修复：原代码 N = st.n || N 未做范围校验，异常包可让 N 变成极大值 */
      var newN = st.n || N;
      if (newN !== 9 && newN !== 13 && newN !== 19) newN = N;
      N = newN;
      saveSettings();
      updateSegmentStates();
    }
    var remoteMoves = [];
    var rawMv = st.mv || [];
    if (st.mvc && typeof rawMv === 'string') rawMv = decodeMoves(rawMv);
    for (var mi = 0; mi < rawMv.length; mi++) {
      var a = rawMv[mi];
      if (!a) continue;
      /* 修复：越界坐标一律丢弃，避免污染棋盘。
         注意虚手用 [-1,-1,c] 作哨兵，必须先判定 pass 再做坐标范围校验，
         否则 a[1] === -1 会被 a[1] < 0 拦掉 -> 远端虚手丢失，
         连虚手永远达不到 2 次，对局卡在"永远不终局"。 */
      var isPass = (a[0] === -1 && a[1] === -1);
      if (!isPass) {
        if (a[0] < 0 || a[0] >= N || a[1] < 0 || a[1] >= N) continue;
      }
      remoteMoves.push({ x: isPass ? -1 : a[0], y: isPass ? -1 : a[1], c: a[2], pass: isPass });
    }
    var wasOver = over;
    var pendingWin = online.recordPending;
    online.recordPending = false;
    rebuild(remoteMoves);
    if (st.o) {
      over = true;
      winner = st.wi || 0;
      scoreRes = st.sc || null;
      if ((!wasOver || pendingWin) && online.role !== 'spec') recordNow();
      var subText = resultSub(scoreRes);
      {
        var wq = (typeof st.wq === 'string' && st.wq) ? st.wq : winnerUidOf(winner);
        var wqp = (typeof st.wqp === 'string' && st.wqp) ? st.wqp : winnerPidOf(winner);
        var iWin = wqp ? wqp === myPid() : (!!wq && wq === myUid());
        var winName = nameOf(wqp || wq);
        if (online.role === 'spec' && winner) {
          showBanner(winName + ' 赢啦', subText);
        } else if (winner === 0) {
          setMood('calm');
          showBanner('平局啦', subText);
        } else if (iWin) {
          setMood('happy');
          showBanner('你赢啦！', subText);
        } else {
          setMood('oops');
          showBanner(winName + ' 赢啦', subText);
        }
      }
    } else {
      over = false;
      winner = 0;
      scoreRes = null;
      if (wasOver) hideBanner();
    }
    if (sizeChanged) relayout(); else draw();
    updateTurnUI();
    refreshOnlineUI();
    if (!over) {
      if (online.role === 'host') setStatus(turn === myColor() ? '轮到你啦' : '等朋友落子…');
      else if (online.role === 'guest') setStatus(turn === myColor() ? '轮到你啦' : '等房主落子…');
      else setStatus('观战中 · 等他们下棋');
    }
  }

  function refreshOnlineUI() {
    if (!els.onlinePanel) return;
    els.onlinePanel.classList.toggle('on', mode === 'online');
    var inRoom = !!online.room;
    if (els.onlineEmpty) els.onlineEmpty.style.display = inRoom ? 'none' : 'flex';
    if (els.onlineRoom) els.onlineRoom.hidden = !inRoom;
    if (els.spectatorBadge) {
      els.spectatorBadge.classList.toggle('on', mode === 'online' && inRoom && online.role === 'spec');
    }
    updateTurnUI();
    if (!inRoom) {
      renderPending();
      renderUndoAsk();
      return;
    }
    if (els.roomCode) els.roomCode.textContent = online.room;
    var people = countWatchers();
    var selfName = me.name || '我';
    var mine = myColor() === BLACK ? '执黑' : '执白';
    var meta = '';
    if (online.role === 'host') {
      meta = '你（' + selfName + '）' + mine + ' · ' + (online.guestPid || online.guestUid ? ('对手：' + nameOf(online.guestPid || online.guestUid)) : '等朋友上桌');
    } else if (online.role === 'guest') {
      meta = '你（' + selfName + '）' + mine + ' · 房主：' + online.hostName;
    } else {
      meta = '观战中 · 房主：' + online.hostName + (online.guestPid || online.guestUid ? (' · 朋友：' + nameOf(online.guestPid || online.guestUid)) : '');
    }
    if (online.role !== 'host' && people > 0) meta += ' · 一起观战 ' + people + ' 人';
    online.baseMeta = meta;
    if (els.roomMeta) els.roomMeta.textContent = meta + netSuffix();
    if (els.roomTools) els.roomTools.classList.toggle('on', online.role === 'host');
    if (els.kickGuestBtn) els.kickGuestBtn.hidden = !(online.role === 'host' && online.guestPid);
    if (els.colorHint) els.colorHint.textContent = online.hostColor === BLACK ? '现在执黑先手' : '现在执白后手';
    renderPending();
    renderUndoAsk();
  }

  function countWatchers() {
    var now = Date.now();
    var n = 0;
    for (var uid in online.seen) {
      if (!Object.prototype.hasOwnProperty.call(online.seen, uid)) continue;
      if (uid === myPid() || uid === online.hostPid || uid === online.guestPid) continue;
      if (uid === myUid() || uid === online.hostUid || uid === online.guestUid) continue;
      if (now - online.seen[uid].ts < 25000) n++;
    }
    return n;
  }

  function renderPending() {
    if (!els.pendingList) return;
    els.pendingList.innerHTML = '';
    if (online.role !== 'host' || online.guestPid || over) return;
    var picked = 0;
    for (var uid in online.seen) {
      if (!Object.prototype.hasOwnProperty.call(online.seen, uid)) continue;
      if (uid === myPid() || uid === online.hostPid || uid === online.guestPid) continue;
      if (online.denied[uid]) continue;
      if (Date.now() - online.seen[uid].ts > 60000) continue;
      if (picked >= 3) break;
      picked++;
      (function (who) {
        var item = document.createElement('div');
        item.className = 'pending-item';
        var name = document.createElement('span');
        name.textContent = nameOf(who) + ' 申请加入';
        var okBtn = document.createElement('button');
        okBtn.type = 'button';
        okBtn.className = 'mini-btn coral';
        okBtn.textContent = '同意';
        okBtn.addEventListener('click', function () { approve(who, ''); });
        var noBtn = document.createElement('button');
        noBtn.type = 'button';
        noBtn.className = 'mini-btn ghost';
        noBtn.textContent = '拒绝';
        noBtn.addEventListener('click', function () { deny(who); });
        item.appendChild(name);
        item.appendChild(okBtn);
        item.appendChild(noBtn);
        els.pendingList.appendChild(item);
      })(uid);
    }
  }

  function approve(id, name) {
    if (online.role !== 'host' || online.guestPid) return;
    var s = online.seen[id] || {};
    online.guestPid = id;
    online.guestUid = s.u || (s.p ? '' : id);
    online.guestName = name || nameOf(id);
    online.guestSince = Date.now();
    publish({ t: 'ok', u: online.guestUid || id, b: online.hostUid, bp: online.hostPid || myPid(), gp: id });
    online.seq++;
    renderPending();
    refreshOnlineUI();
    updateTurnUI();
    broadcastState(true);
    lobbyHeartbeat();
    setStatus('同意 ' + nameOf(id) + ' 一起下棋');
  }

  function deny(id) {
    if (online.role !== 'host') return;
    online.denied[id] = 1;
    var s = online.seen[id] || {};
    publish({ t: 'no', u: s.u || id, gp: id });
    online.seen[id] = { n: s.n || '朋友', ts: Date.now(), p: s.p || '', u: s.u || '' };
    renderPending();
    refreshOnlineUI();
  }

  function renderUndoAsk() {
    if (!els.undoAsk) return;
    var show = online.role === 'host' && !!online.undoReq && !over;
    els.undoAsk.hidden = !show;
    if (show && els.undoAskText) els.undoAskText.textContent = nameOf(online.undoReq) + ' 请求悔棋';
  }

  function answerUndo(ok) {
    var who = online.undoReq;
    if (!who) return;
    online.undoReq = '';
    renderUndoAsk();
    publish({ t: ok ? 'undo-ok' : 'undo-no', u: online.guestUid || who, gp: online.guestPid || who });
    if (!ok) {
      setStatus('已拒绝悔棋，朋友暂时无法悔棋');
      return;
    }
    var back = Math.min(2, moves.length);
    rebuild(moves.slice(0, moves.length - back));
    online.seq++;
    broadcastState(true);
    setStatus('已同意悔棋，已成功悔棋');
  }

  function swapHostColor() {
    if (online.role !== 'host' || !online.room) return;
    if (moves.length !== 0) {
      setStatus('已经开局啦，想换颜色就先重开一局');
      return;
    }
    online.hostColor = online.hostColor === BLACK ? WHITE : BLACK;
    online.seq++;
    updateTurnUI();
    refreshOnlineUI();
    broadcastState(true);
    setStatus(online.hostColor === BLACK ? '现在你执黑，先手' : '现在你执白，朋友先手');
  }

  function inviteLink() {
    var base = String(window.location.href || '').split('#')[0].split('?')[0];
    return base + '?room=' + online.room;
  }

  function copyText(text) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(fallbackCopy(text)); });
      } else {
        resolve(fallbackCopy(text));
      }
    });
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) { return false; }
  }

  /* ---------- 身份 ---------- */
  function lsFirst(keys) {
    for (var i = 0; i < keys.length; i++) {
      try { var v = window.localStorage.getItem(keys[i]); if (v) return v; } catch (e) { /* ignore */ }
    }
    return '';
  }

  function saveSharedIdentity() {
    try {
      window.localStorage.setItem('idol_uid', me.uid);
      window.localStorage.setItem('idol_name', me.name);
      window.localStorage.setItem('idol_face', me.face || '');
      window.localStorage.setItem(PID_KEY, me.pid);
    } catch (e) { /* ignore */ }
  }

  function initIdentity() {
    var saved = lsFirst(['idol_uid', 'gm_uid', 'go_uid']);
    var cachedName = lsFirst(['idol_name', 'go_name', 'gm_name']);
    me.uid = saved || ('g' + Math.random().toString(36).slice(2, 8));
    me.name = (cachedName && cachedName.length <= 24) ? cachedName : ('游客' + me.uid.slice(1, 5).toUpperCase());
    me.pid = lsFirst([PID_KEY, 'go_pid_v1', 'gomoku_pid_v1']);
    if (!me.pid) {
      me.pid = 'p' + Math.random().toString(36).slice(2, 9);
    }
    me.face = lsFirst(['idol_face', 'go_face', 'gm_face']);
    online.uid = me.uid;
    saveSharedIdentity();
    showOpenApp();
    if (els.openAppBtn) {
      els.openAppBtn.addEventListener('click', function () {
        if (IS_MOBILE && !IN_APP) openInBiliApp();
        else ensureProfile();
      });
    }
  }

  function showOpenApp() {
    if (!els.openAppBtn) return;
    els.openAppBtn.hidden = false;
    els.openAppBtn.textContent = (IS_MOBILE && !IN_APP) ? '用B站打开' : '登录';
    if (els.userMe) els.userMe.hidden = true;
  }

  function openInBiliApp() {
    var web = 'https://www.bilibili.com/toy/idol-go/index.html';
    var deep = 'bilibili://toy/detail/49760694176768';
    var left = false;
    var start = Date.now();
    function onHide() { if (document.hidden) left = true; }
    function go(url) {
      try {
        if (window.self !== window.top) { window.top.location.href = url; return; }
      } catch (e) { /* 跨域时退回自身 */ }
      try { window.location.href = url; } catch (e) { /* ignore */ }
    }
    try {
      document.addEventListener('visibilitychange', onHide);
      go(deep);
    } catch (e) { /* ignore */ }
    window.setTimeout(function () {
      try { document.removeEventListener('visibilitychange', onHide); } catch (e) { /* ignore */ }
      if (!left && Date.now() - start > 900) go(web);
    }, 1100);
  }

  function goToToy(url) {
    if (!url) return;
    try {
      if (window.self !== window.top) {
        window.top.location.href = url;
        return;
      }
    } catch (e) { /* 跨域时退回自身 */ }
    try { window.location.href = url; } catch (e2) { /* ignore */ }
  }

  function bindToyLinks() {
    var links = document.querySelectorAll('.foot-link');
    for (var i = 0; i < links.length; i++) {
      (function (a) {
        a.addEventListener('click', function (ev) {
          var url = a.href;
          if (!url) return;
          ev.preventDefault();
          try {
            if (window.self !== window.top) {
              window.top.location.href = url;
            } else {
              window.location.href = url;
              return;
            }
          } catch (e) { /* 跨域时退回自身 */ }
          window.setTimeout(function () {
            try { window.location.href = url; } catch (e2) { /* ignore */ }
          }, 600);
        });
      })(links[i]);
    }
  }

  function ensureProfile() {
    if (profileTried) return;
    profileTried = true;
    if (IS_MOBILE && !IN_APP) return;
    var sdk = window.toy || window.Toy || null;
    if (!sdk || typeof sdk.getUserProfile !== 'function') return;
    try {
      var p = sdk.getUserProfile();
      if (p && typeof p.then === 'function') {
        p.then(function (res) { applyProfile(res); }).catch(function () { /* ignore */ });
      } else {
        applyProfile(p);
      }
    } catch (e) { /* ignore */ }
  }

  function applyProfile(res) {
    if (!res || typeof res !== 'object') return;
    var mid = res.mid || res.uid || '';
    var nm = res.uname || res.nickname || res.name || '';
    var face = res.face || res.avatar || res.head_url || '';
    if (mid) {
      var oldUid = me.uid;
      me.uid = 'u' + mid;
      online.uid = me.uid;
      if (oldUid && oldUid !== me.uid) {
        me.aliases.push(oldUid);
        announceUidChange(oldUid, me.uid);
      }
      stopPresence();
      startPresence();
    }
    if (nm) {
      me.name = String(nm);
    }
    if (face) me.face = String(face);
    saveSharedIdentity();
    showProfile(face, me.name);
    updateTurnUI();
    refreshOnlineUI();
    if (online.room && nm) {
      if (online.role === 'host') {
        online.hostName = me.name;
        online.seq++;
        broadcastState(true);
      } else if (online.role === 'guest') {
        sendHi();
      }
    }
  }

  function showProfile(face, name) {
    if (face) {
      me.face = String(face);
      try { window.localStorage.setItem('go_face', me.face); } catch (eF) { /* ignore */ }
    }
    if (!els.userMe) return;
    if (face && els.userFace) {
      els.userFace.src = face;
      els.userFace.hidden = false;
    } else if (els.userFace) {
      els.userFace.hidden = true;
    }
    if (name && els.userName) els.userName.textContent = name;
    els.userMe.hidden = false;
    if (els.openAppBtn) els.openAppBtn.hidden = true;
  }

  /* ---------- 历史对弈 / 回放 ---------- */
  function modeLabel(m) {
    return m === 'ai' ? '人机' : (m === 'pvp' ? '双人' : (m === 'online' ? '联机' : '对局'));
  }

  function openHistory() {
    if (replay.on) stopReplay();
    closeFriends();
    renderHistory();
    if (els.historyPanel) els.historyPanel.classList.add('on');
  }

  function closeHistory() {
    if (els.historyPanel) els.historyPanel.classList.remove('on');
  }

  function renderHistory() {
    if (!els.historyList) return;
    els.historyList.innerHTML = '';
    if (!records.length) {
      var empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = '还没有对弈记录，先下一局吧';
      els.historyList.appendChild(empty);

    }
    for (var i = 0; i < records.length; i++) {
      (function (rec) {
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'history-item';
        var log = document.createElement('span');
        log.className = 'hi-log ' + (rec.wi === 1 ? 'b' : (rec.wi === 2 ? 'w' : 'd'));
        var txt = document.createElement('span');
        txt.className = 'hi-text';
        var t1 = document.createElement('b');
        t1.textContent = rec.wi === 1 ? '黑棋赢啦' : (rec.wi === 2 ? '白棋赢啦' : '平局');
        var t2 = document.createElement('span');
        t2.textContent = (rec.n || 9) + ' 路 · ' + ((rec.mv || []).length) + ' 手 · ' + modeLabel(rec.mode);
        txt.appendChild(t1);
        txt.appendChild(t2);
        var go = document.createElement('span');
        go.className = 'hi-go';
        go.textContent = '看回放';
        item.appendChild(log);
        item.appendChild(txt);
        if (rec.mode === 'online' && rec.opp && !isFriend(rec.opp)) {
          var addF = document.createElement('span');
          addF.className = 'hi-go add';
          addF.textContent = '加好友';
          addF.addEventListener('click', function (ev) {
            ev.stopPropagation();
            friendAction(rec.opp, rec.oppName || '朋友', '', rec.oppPid || '');
            renderHistory();
          });
          item.appendChild(addF);
        }
        item.appendChild(go);
        item.addEventListener('click', function () {
          closeHistory();
          startReplay(rec);
        });
        els.historyList.appendChild(item);
      })(records[i]);
    }
  }

  function startReplay(rec) {
    if (!rec || !rec.mv || !rec.mv.length) {
      setStatus('还没有对局记录，先下一局吧');
      return;
    }
    if (replay.on) stopReplay();
    aiToken++;
    thinking = false;
    replay.on = true;
    replay.rec = rec;
    replay.list = rec.mv.slice();
    replay.idx = 0;
    replay.saved = {
      N: N, moves: moves.slice(), turn: turn, over: over, winner: winner,
      scoreRes: scoreRes,
      bannerOn: !!(els.winBanner && els.winBanner.classList.contains('show')),
      title: els.bannerTitle ? els.bannerTitle.textContent : '',
      sub: els.bannerSub ? els.bannerSub.textContent : '',
      status: els.status ? els.status.textContent : ''
    };
    hideBanner();
    if (els.actionRow) els.actionRow.hidden = true;
    if (els.replayActions) els.replayActions.hidden = false;
    if (els.rpPlay) els.rpPlay.textContent = '播放';
    applyReplayFrame();
    replayPlay();
  }

  function applyReplayFrame() {
    var rec = replay.rec;
    if (!rec) return;
    var sizeChanged = (N !== (rec.n || N));
    N = rec.n || N;
    var sub = [];
    for (var k = 0; k < replay.idx; k++) {
      var a = replay.list[k];
      if (!a) continue;
      sub.push({ x: a[0], y: a[1], c: a[2], pass: a[0] < 0 });
    }
    rebuild(sub);
    over = false;
    winner = 0;
    scoreRes = null;
    if (replay.idx >= replay.list.length) {
      over = true;
      winner = rec.wi || 0;
      scoreRes = rec.sc || null;
      updateTurnUI();
      draw();
    }
    if (sizeChanged) relayout();
    if (els.rpPrev) els.rpPrev.disabled = replay.idx <= 0;
    if (els.rpNext) els.rpNext.disabled = replay.idx >= replay.list.length;
    var tag = '';
    if (replay.idx >= replay.list.length) {
      tag = winner === BLACK ? ' · 黑棋胜' : (winner === WHITE ? ' · 白棋胜' : ' · 平局');
    }
    setStatus('回放中 · 第 ' + replay.idx + ' / ' + replay.list.length + ' 手' + tag);
  }

  function replayPlay() {
    if (!replay.on) return;
    if (replay.timer) {
      window.clearInterval(replay.timer);
      replay.timer = 0;
      replay.playing = false;
      if (els.rpPlay) els.rpPlay.textContent = '播放';
      return;
    }
    if (replay.idx >= replay.list.length) {
      replay.idx = 0;
      applyReplayFrame();
    }
    replay.playing = true;
    if (els.rpPlay) els.rpPlay.textContent = '暂停';
    replay.timer = window.setInterval(function () {
      if (!replay.on || replay.idx >= replay.list.length) {
        window.clearInterval(replay.timer);
        replay.timer = 0;
        replay.playing = false;
        if (els.rpPlay) els.rpPlay.textContent = '播放';
        return;
      }
      replay.idx++;
      applyReplayFrame();
    }, 480);
  }

  function replayStep(d) {
    if (!replay.on) return;
    if (replay.timer) {
      window.clearInterval(replay.timer);
      replay.timer = 0;
      replay.playing = false;
      if (els.rpPlay) els.rpPlay.textContent = '播放';
    }
    var len = replay.list.length;
    replay.idx = Math.max(0, Math.min(len, replay.idx + d));
    applyReplayFrame();
  }

  function stopReplay() {
    if (!replay.on) return;
    if (replay.timer) {
      window.clearInterval(replay.timer);
      replay.timer = 0;
    }
    replay.on = false;
    replay.playing = false;
    replay.rec = null;
    replay.list = [];
    replay.idx = 0;
    if (els.rpPlay) els.rpPlay.textContent = '播放';
    if (els.actionRow) els.actionRow.hidden = false;
    if (els.replayActions) els.replayActions.hidden = true;
    var s = replay.saved;
    replay.saved = null;
    if (!s) return;
    N = s.N;
    rebuild(s.moves);
    over = s.over;
    winner = s.winner;
    scoreRes = s.scoreRes;
    updateTurnUI();
    draw();
    if (s.bannerOn) showBanner(s.title, s.sub);
    if (s.status) setStatus(s.status);
    if (!over && mode === 'ai' && turn === WHITE) scheduleAI();
  }

  /* ---------- 事件绑定 ---------- */
  function bindSeg(container, attr, handler) {
    if (!container) return;
    var btns = container.querySelectorAll('button[' + attr + ']');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function (ev) {
        var el = ev.currentTarget;
        for (var j = 0; j < btns.length; j++) btns[j].classList.toggle('on', btns[j] === el);
        handler(el.getAttribute(attr));
      });
    }
  }

  function forceMode(v) {
    if (replay.on) stopReplay();
    if (mode === 'online' && v !== 'online') leaveRoom(true);
    mode = v;
    updateSegmentStates();
    newGame(true);
    refreshOnlineUI();
  }

  bindSeg(els.modeSeg, 'data-mode', function (v) {
    if (replay.on) stopReplay();
    if (mode === 'online' && v !== 'online') leaveRoom(true);
    closeLobby();
    mode = v;
    newGame(true);
    refreshOnlineUI();
    if (v === 'ai') setStatus('人机对战 · 轮到你啦');
    else if (v === 'pvp') setStatus('双人对战 · 黑棋先手，开始吧');
    else setStatus('创建房间，或点「房间」看谁在开房');
  });

  bindSeg(els.diffSeg, 'data-diff', function (v) {
    diff = v;
    updateSummary();
    setStatus('难度换成' + (v === 'easy' ? '简单' : v === 'normal' ? '普通' : '困难') + '啦');
  });

  bindSeg(els.sizeSeg, 'data-size', function (v) {
    if (mode === 'online' && online.room && online.role !== 'host') {
      setStatus('棋盘由房主设置哦');
      return;
    }
    N = parseInt(v, 10);
    newGame(true);
    if (mode === 'online' && online.room) {
      online.seq++;
      broadcastState(true);
    }
    setStatus('棋盘换成 ' + v + ' 路啦');
  });

  if (els.homeBtn) {
    els.homeBtn.addEventListener('click', function () {
      goToToy('https://www.bilibili.com/toy/idol-gomoku/index.html');
    });
  }

  if (els.settingToggle) {
    els.settingToggle.addEventListener('click', function () { toggleSettings(); });
  }

  if (els.createRoomBtn) {
    els.createRoomBtn.addEventListener('click', function () {
      if (mode !== 'online') forceMode('online');
      online.roomTries = 0;
      createRoomWithRetry();
    });
  }

  if (els.joinRoomBtn) {
    els.joinRoomBtn.addEventListener('click', function () {
      var code = els.roomInput ? String(els.roomInput.value || '').trim() : '';
      if (!code) {
        setStatus('先输入 6 位房间号哦');
        return;
      }
      if (mode !== 'online') forceMode('online');
      joinRoom(code);
    });
  }

  if (els.roomListBtn) {
    els.roomListBtn.addEventListener('click', function () { openLobby(); });
  }

  if (els.lobbyClose) {
    els.lobbyClose.addEventListener('click', function () { closeLobby(); });
  }

  if (els.lobbyMask) {
    els.lobbyMask.addEventListener('click', function () { closeLobby(); });
  }

  if (els.roomInput) {
    els.roomInput.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && els.joinRoomBtn) els.joinRoomBtn.click();
    });
  }

  if (els.copyLinkBtn) {
    els.copyLinkBtn.addEventListener('click', function () {
      if (!online.room) return;
      setStatus('正在复制邀请链接…');
      copyText(inviteLink()).then(function (ok) {
        setStatus(ok ? '邀请链接已复制，发给朋友吧'
          : ('复制失败，把房间号 ' + online.room + ' 发给朋友吧'));
      });
    });
  }

  if (els.swapColorBtn) {
    els.swapColorBtn.addEventListener('click', function () { swapHostColor(); });
  }
  if (els.kickGuestBtn) {
    els.kickGuestBtn.addEventListener('click', function () { kickGuest(); });
  }

  if (els.reconnectBtn) {
    els.reconnectBtn.addEventListener('click', function () { reconnectRoom(); });
  }

  if (els.leaveRoomBtn) {
    els.leaveRoomBtn.addEventListener('click', function () {
      leaveRoom(false);
      newGame(true);
    });
  }

  if (els.undoOkBtn) {
    els.undoOkBtn.addEventListener('click', function () { answerUndo(true); });
  }
  if (els.undoNoBtn) {
    els.undoNoBtn.addEventListener('click', function () { answerUndo(false); });
  }

  if (els.passBtn) {
    els.passBtn.addEventListener('click', function () {
      if (replay.on) return;
      if (over) { setStatus('本局结束啦，点重新开始'); return; }
      if (mode === 'online') {
        if (!online.room) { setStatus('先创建或加入房间哦'); return; }
        if (online.role !== 'host' && online.role !== 'guest') { setStatus('观战中不能虚手'); return; }
        if (turn !== myColor()) { setStatus('等对方落子哦'); return; }
        doPass(false);
        return;
      }
      if (mode === 'ai' && turn !== BLACK) { setStatus('等电脑下完哦'); return; }
      doPass(false);
    });
  }

  if (els.undoBtn) {
    els.undoBtn.addEventListener('click', function () {
      if (replay.on) stopReplay();
      if (mode === 'online') {
        if (!online.room) { setStatus('先创建或加入房间才能悔棋哦'); return; }
        if (online.role !== 'host' && online.role !== 'guest') { setStatus('观战中不能悔棋'); return; }
        if (over) { setStatus('本局结束啦，重新开始更痛快'); return; }
      }
      undo();
    });
  }

  function restartGame() {
    if (replay.on) stopReplay();
    if (mode === 'online' && online.role !== 'host') {
      setStatus('等房主重新开始哦');
      hideBanner();
      return;
    }
    newGame(true);
    if (mode === 'online') {
      online.seq++;
      broadcastState(true);
    }
    setStatus('新的一局，加油');
  }

  if (els.restartBtn) els.restartBtn.addEventListener('click', restartGame);
  if (els.againBtn) els.againBtn.addEventListener('click', restartGame);

  if (els.replayBtn) {
    els.replayBtn.addEventListener('click', function () { openHistory(); });
  }
  if (els.historyClose) {
    els.historyClose.addEventListener('click', function () { closeHistory(); });
  }
  if (els.friendToggle) {
    els.friendToggle.addEventListener('click', function () { openFriends(); });
  }
  if (els.friendClose) {
    els.friendClose.addEventListener('click', function () { closeFriends(); });
  }
  if (els.winFriendBtn) {
    els.winFriendBtn.addEventListener('click', function () {
      var opp = onlineOpponent();
      if (!opp) {
        els.winFriendBtn.hidden = true;
        return;
      }
      friendAction(opp, nameOf(opp), '', onlineOpponentPid());
    });
  }
  if (els.rpPrev) els.rpPrev.addEventListener('click', function () { replayStep(-1); });
  if (els.rpNext) els.rpNext.addEventListener('click', function () { replayStep(1); });
  if (els.rpPlay) els.rpPlay.addEventListener('click', function () { replayPlay(); });
  if (els.rpExit) els.rpExit.addEventListener('click', function () { stopReplay(); });

  var fsBtn = document.getElementById('fsBtn');
  function toggleBoardFs(force) {
    var on = force === undefined ? !fsOn : !!force;
    fsOn = on;
    if (els.boardWrap) els.boardWrap.classList.toggle('fs', on);
    document.body.classList.toggle('fs-lock', on);
    if (fsBtn) {
      fsBtn.textContent = on ? '✕' : '⛶';
      fsBtn.title = on ? '退出全屏' : '全屏棋盘';
      fsBtn.setAttribute('aria-label', on ? '退出全屏' : '全屏棋盘');
    }
    window.setTimeout(relayout, 60);
  }
  if (fsBtn) {
    fsBtn.addEventListener('click', function (ev) {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      toggleBoardFs();
    });
  }
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (lobby.open) closeLobby();
      else if (fsOn) toggleBoardFs(false);
    }
  });

  if (canvas) {
    canvas.addEventListener('click', function (ev) {
      if (over || thinking || replay.on) return;
      if (els.historyPanel && els.historyPanel.classList.contains('on')) return;
      var c = hitTest(ev);
      if (!c) return;
      if (mode === 'online') {
        if (!online.room) return;
        if (turn !== myColor() || online.role !== 'host' && online.role !== 'guest') return;
        place(c.x, c.y);
        return;
      }
      if (mode === 'ai' && turn !== BLACK) return;
      place(c.x, c.y);
    });
  }

  if (window.PointerEvent && canvas) {
    canvas.addEventListener('pointermove', function (ev) {
      if (ev.pointerType !== 'mouse' || over || thinking || replay.on) return;
      if (mode === 'online') {
        if (!online.room || online.role !== 'host' && online.role !== 'guest') return;
        if (turn !== myColor()) return;
      }
      if (mode === 'ai' && turn !== BLACK) return;
      var c = hitTest(ev);
      var same = (!c && !hoverCell) || (c && hoverCell && c.x === hoverCell.x && c.y === hoverCell.y);
      if (!same) {
        hoverCell = c;
        draw();
      }
    });
    canvas.addEventListener('pointerleave', function () {
      if (hoverCell) { hoverCell = null; draw(); }
    });
  }

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(relayout, 120);
  });

  if (window.ResizeObserver && wrapEl) {
    try {
      new window.ResizeObserver(function () { relayout(); }).observe(wrapEl);
    } catch (e) { /* ignore */ }
  }

  if (window.setInterval) {
    window.setInterval(function () {
      if (mode !== 'online' || !online.room) return;
      if (online.role === 'host') {
        renderPending();
        refreshOnlineUI();
      } else if (online.role === 'guest' && !over && Date.now() - online.lastState > 12000) {
        setStatus('房主暂时不在线，等一等…');
      }
    }, 3000);
  }

  /* ---------- 启动 ---------- */
  if (els.verTag) els.verTag.textContent = VERSION;
  loadSettings();
  loadScore();
  loadRecords();
  initIdentity();
  loadFriends();
  renderFriends();
  startPresence();
  bindToyLinks();
  updateSegmentStates();
  /* 弱网：断网/恢复/切回前台时主动重建连接，不用等用户手动刷新 */
  window.addEventListener('offline', function () {
    if (online.room) setConn('网络断了，恢复后会自动重连（也可点「重连」）');
  });
  window.addEventListener('online', function () {
    if (!online.room) return;
    online.pollFails = 0;
    online.pollDelay = 1200;
    setConn('网络恢复，正在重连…');
    reconnectRoom();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !online.room) return;
    if (online.pollOn) {
      online.pollDelay = 1200;
      if (online.pollTimer) {
        window.clearTimeout(online.pollTimer);
        online.pollTimer = 0;
      }
      if (!online.polling) pollOnce();
    } else if (Date.now() - online.lastHeard > LINK_STALE_MS) {
      reconnectRoom();
    }
  });
  /* 修复：页面被关闭/切后台时补发 bye，让房主及时释放座位 */
  window.addEventListener('pagehide', function () { sendByeBeacon(); });
  window.addEventListener('beforeunload', function () { sendByeBeacon(); });
  var roomParam = null;
  try {
    var rm = /[?&]room=([0-9]{6})/.exec(window.location.search || '');
    if (rm) roomParam = rm[1];
  } catch (e) { /* ignore */ }
  if (roomParam) {
    forceMode('online');
    joinRoom(roomParam);
  } else {
    newGame(false);
    relayout();
    refreshOnlineUI();
    if (mode === 'ai') setStatus('轮到你啦，点交叉点落子');
    else if (mode === 'pvp') setStatus('黑棋先手，开始吧');
    else setStatus('创建房间，或点「房间」看谁在开房');
  }
})();
</script>
</body>
</html>
