  /* 修复：页面被关闭/切后台时补发 bye，让房主及时释放座位 */
  window.addEventListener('pagehide', function () { sendByeBeacon(); });
  window.addEventListener('beforeunload', function () { sendByeBeacon(); });
  var roomParam = null;
  try {
    var rm = /[?&]room=([0-9]{6})/.exec(window.location.search || '');
    if (rm) roomParam = rm[1];
  } catch (e) { /* ignore */ }
  if (roomParam) {
    forceMode('online');
    joinRoom(roomParam);
  } else {
    newGame(false);
    relayout();
    refreshOnlineUI();
    if (mode === 'ai') setStatus('轮到你啦，点交叉点落子');
    else if (mode === 'pvp') setStatus('黑棋先手，开始吧');
    else setStatus('创建房间，或点「房间」看谁在开房');
  }
})();
</script>
<script>
/* ===== TOY 原生榜单积分 =====
 * 用 SDK 的 submitScore 上报「累计绝对值」，而不是增量：
 *   - 棋牌：按难度阶梯胜负加减，每结算一局上报一次；
 *   - 内容：打开一次 +1，一直累计。
 * SDK 在部分容器里异步就绪（benneng 用 defer 加载），这里统一做就绪重试；
 * 非 TOY 容器（本地预览 / 普通浏览器）静默跳过，不报错、不刷请求。
 * 详见各 README 的「榜单」一节。
 */
(function () {
  'use strict';
  var BOARD = 1;        /* 每个 Toy 有独立榜单，统一用 1 号榜 */
  var WAIT_MAX = 40;    /* 40 × 150ms ≈ 6s 等 SDK 就绪 */
  var MIN = -16777216, MAX = 16777215;   /* SDK 允许的 score 范围 ±2^24 */
  var sent = {};        /* 本次页面已发起过的分值，避免重复提交占 QPS */

  function sdk() {
    var w = window;
    var list = [w.toy, w.Toy, w.toy && w.toy.toy, w.Toy && w.Toy.toy];
    for (var i = 0; i < list.length; i++) {
      if (list[i] && typeof list[i].submitScore === 'function') return list[i];
    }
    return null;
  }
  function num(k, d) {
    try {
      var v = window.localStorage.getItem(k);
      return v === null ? d : (parseInt(v, 10) || 0);
    } catch (e) { return d; }
  }
  function put(k, v) {
    try { window.localStorage.setItem(k, String(v)); } catch (e) {}
    return v;
  }
  function clamp(v) { return v < MIN ? MIN : (v > MAX ? MAX : v); }

  function send(score, wait, retry) {
    var t = sdk();
    if (!t) {
      if (wait < WAIT_MAX) window.setTimeout(function () { send(score, wait + 1, retry); }, 150);
      return;
    }
    if (sent[score]) return;
    sent[score] = 1;
    var fail = function () {
      delete sent[score];
      if (retry < 2) window.setTimeout(function () { send(score, 0, retry + 1); }, 1500);
    };
    try {
      var r = t.submitScore({ score: score, board: BOARD });
      if (r && typeof r.catch === 'function') r.catch(fail);
    } catch (e) { fail(); }
  }

  window.ToyRank = {
    /* 累加 delta 后上报累计绝对值；delta 为 0 也会上报（保证「玩过/看过」有记录） */
    add: function (key, delta) {
      var v = put(key, clamp(num(key, 0) + delta));
      send(v, 0, 0);
      return v;
    },
    /* 内容类：打开一次 +1；gapMs 内重复打开不重复计分，防止刷新刷分 */
    visit: function (key, gapMs) {
      var now = Date.now(), gap = gapMs || 15000, at = key + '.at';
      if (now - num(at, 0) < gap) return num(key, 0);
      put(at, now);
      return window.ToyRank.add(key, 1);
    },
    /* 只上报当前累计值、不增减：棋牌页打开时调一次，保证「来过」就有一次提交 */
    touch: function (key) {
      var v = num(key, 0);
      send(v, 0, 0);
      return v;
    },
    value: function (key) { return num(key, 0); }
  };
})();
window.ToyRank.touch('go.rank.v1');
</script>
<script>
/* ===== TOY 原生底栏（评论 / 收藏 / 点赞）适配 =====
 * TOY 容器底部有一条原生互动栏，以「覆盖」方式浮在 WebView 之上：页面可用高度
 * 不变，但底部约 60~70px 会被盖住。env(safe-area-inset-bottom) 只反映系统安全区
 * （刘海 / Home Indicator），不含 TOY 自己的原生栏，在容器里通常是 0，靠它留白
 * 完全无效。这里在原生容器中推出需要预留的底部高度并写入 --toy-bottom-inset；
 * Web 环境下该变量等于系统安全区，行为与改动前完全一致。
 */
(function () {
  var root = document.documentElement;
  var NATIVE_BAR = 64;   // TOY 原生互动栏实测高度（CSS px），容器未上报时的兜底
  var env = 0;           // 系统安全区底部高度（px）
  var timer = null;

  function envBottom() {
    try {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:0;bottom:0;width:0;height:0;padding-bottom:env(safe-area-inset-bottom,0px);';
      document.body.appendChild(d);
      var v = parseFloat(getComputedStyle(d).paddingBottom) || 0;
      if (d.parentNode) d.parentNode.removeChild(d);
      return v > 0 ? v : 0;
    } catch (e) { return 0; }
  }

  function apply(px) {
    var v = Math.max(0, Math.round(px) || 0);
    root.style.setProperty('--toy-bottom-inset', v + 'px');
  }

  /* 找出 SDK 命名空间：不同容器里挂在 window.toy 或 window.Toy.toy。
     官方 SDK 用 defineProperty 定义 window.Toy（getter），这里统一按「有该方法」判定。 */
  function sdkNs() {
    var cands = [];
    try { if (window.Toy) cands.push(window.Toy); } catch (e) {}
    try { if (window.toy) cands.push(window.toy); } catch (e) {}
    for (var i = 0; i < cands.length; i++) {
      var c = cands[i];
      if (!c) continue;
      if (typeof c.getContainerState === 'function') return c;
      if (c.toy && typeof c.toy.getContainerState === 'function') return c.toy;
    }
    return null;
  }

  /* 由容器状态推出底部需要预留的总高度（含系统安全区） */
  function fromState(st) {
    if (st && st.immersive === true) { apply(env); return; }   // 沉浸模式无原生栏
    var reported = 0;
    if (st && st.safeArea && typeof st.safeArea.bottom === 'number') reported = st.safeArea.bottom;
    apply(Math.max(env, NATIVE_BAR, reported));
  }

  function probe() {
    var sdk = sdkNs();
    if (!sdk) return false;
    var settled = false;
    try {
      var p = sdk.getContainerState();
      if (p && typeof p.then === 'function') {
        p.then(
          function (st) { settled = true; fromState(st); },
          function () { settled = true; apply(env); }   // Web 端不支持 → 仅系统安全区
        );
        setTimeout(function () { if (!settled) fromState(null); }, 900);
      } else {
        settled = true;
        apply(env);
      }
    } catch (e) {
      settled = true;
      apply(env);
    }
    return true;
  }

  function boot() {
    env = envBottom();
    var tries = 0;
    timer = setInterval(function () {
      if (probe()) { clearInterval(timer); timer = null; return; }
      if (++tries > 24) { clearInterval(timer); timer = null; apply(env); }
    }, 150);
  }

  function refresh() {
    env = envBottom();
    var sdk = sdkNs();
    if (!sdk) { apply(env); return; }
    try {
      var p = sdk.getContainerState();
      if (p && typeof p.then === 'function') p.then(fromState, function () { apply(env); });
      else apply(env);
    } catch (e) { apply(env); }
  }

  if (document.body) boot();
  else document.addEventListener('DOMContentLoaded', boot);

  window.addEventListener('resize', refresh);
  window.addEventListener('orientationchange', function () { setTimeout(refresh, 260); });

  /* 原生栏展开 / 收起时容器会广播状态变化，跟着重新预留 */
  function watch() {
    var sdk = sdkNs();
    if (!sdk || typeof sdk.onContainerChange !== 'function') return;
    try {
      sdk.onContainerChange(function (st) { fromState(st && st.state ? st.state : st); });
    } catch (e) { /* 部分容器不支持订阅，忽略 */ }
  }
  if (document.body) setTimeout(watch, 400);
  else document.addEventListener('DOMContentLoaded', function () { setTimeout(watch, 400); });
})();
</script>

</body>
