if (els.qrSendBtn) { els.qrSendBtn.hidden = false; els.qrSendBtn.textContent = '我已粘贴邀请码，继续'; }
/* App 内置浏览器不支持摄像头扫码，隐藏扫码按钮，只保留粘贴入口 */
if (els.qrScanBtn) { els.qrScanBtn.hidden = IN_APP; els.qrScanBtn.textContent = '扫房主的二维码'; }
if (els.qrSwitchBtn) { els.qrSwitchBtn.hidden = false; els.qrSwitchBtn.textContent = '我是发起方：生成我的码'; }
setQRTip('第 1 步：输入朋友的邀请码', '把朋友给你的邀请码粘贴到下面输入框，再点「我已粘贴邀请码」', '第 1 步：输入朋友的邀请码');
    openQRModal();
  }

  /* 访客提交邀请码后：生成 Answer + 等待收房主 ICE，然后展示回复码 */
  function qrGuestSubmitOffer() {
    var text = (els.qrTextInput && els.qrTextInput.value || '').trim();
    if (!text) { setStatus('请先粘贴邀请码'); return; }
    var sdp;
    if (text.indexOf('1|') === 0) {
      sdp = text.substring(2);
    } else {
      /* 兼容旧格式：尝试 base64 解码 */
      try {
        var payload = JSON.parse(b64Decode(text));
        if (payload && payload.sdp) sdp = payload.sdp;
      } catch (e) { /* ignore */ }
    }
    if (!sdp) { setStatus('邀请码格式有误'); return; }
    /* 解析 SDP 中的 ICE candidate 行 */
    var iceCandidates = [];
    var sdpLines = sdp.split(/\r?\n/);
    for (var i = 0; i < sdpLines.length; i++) {
      if (sdpLines[i].startsWith('a=candidate:')) {
        var candStr = sdpLines[i].substring('a=candidate:'.length);
        var parts = candStr.split(' ');
        if (parts.length >= 8) {
          iceCandidates.push({
            candidate: candStr,
            sdpMid: parts[2] || '0',
            sdpMLineIndex: parseInt(parts[1], 10) || 0
          });
        }
      }
    }
    qrState.pc = p2pCreateQR(false);
    var desc = new RTCSessionDescription({ type: 'offer', sdp: sdp });
    qrState.pc.setRemoteDescription(desc).then(function () {
      /* 把房主的 ICE candidate 加到访客的 pc 上 */
      var addPromises = [];
      for (var i = 0; i < iceCandidates.length; i++) {
        try {
          addPromises.push(qrState.pc.addIceCandidate(new RTCIceCandidate(iceCandidates[i])).catch(function () { /* ignore */ }));
        } catch (e) { /* ignore */ }
      }
      return Promise.all(addPromises);
    }).then(function () {
      return qrState.pc.createAnswer();
    }).then(function (ans) {
      return qrState.pc.setLocalDescription(ans);
    }).then(function () {
      /* 等 ICE 收集真正 complete（同上） */
      return waitIceGather(qrState.pc, 2500);
    }).then(function () {
      var sdp = qrState.pc.localDescription.sdp;
      /* 把 ICE candidate 追加到 SDP 中 */
      var withIce = appendICESDP(sdp, qrState.gathered);
      var compact = compactSDP(withIce);
      /* 前缀 "2|" = answer，后跟 SDP */
      var text = '2|' + compact;
      qrState.answerSent = true;
      qrState.iceB64 = '';
      renderQR(els.qrCode, text);
      if (els.qrTextInput) {
        els.qrTextInput.value = text;
        els.qrTextInput.readOnly = true;
        els.qrTextInput.hidden = false;
      }
      if (els.qrSendBtn) { els.qrSendBtn.hidden = false; els.qrSendBtn.textContent = '我已把回复码发给房主'; }
      setQRTip('第 2 步：把回复码发给房主', '复制下面的文字串发给房主，或让房主扫你屏幕上的二维码', '');
      qrState.step = 2;
    }).catch(function () { setStatus('建立连接失败，请重试'); qrStop(); });
  }

  /* 房主提交访客的回复码 + 访客 ICE，完成信令交换 */
  function qrHostSubmitAnswer() {
    var text = (els.qrTextInput && els.qrTextInput.value || '').trim();
    if (!text) { setStatus('请先粘贴朋友的回复码'); return; }
    var sdp;
    if (text.indexOf('2|') === 0) {
      sdp = text.substring(2);
    } else {
      /* 兼容旧格式 */
      try {
        var payload = JSON.parse(b64Decode(text));
        if (payload && payload.sdp) sdp = payload.sdp;
      } catch (e) { /* ignore */ }
    }
    if (!sdp) { setStatus('回复码格式有误'); return; }
    /* 解析 SDP 中的 ICE candidate 行 */
    var iceCandidates = [];
    var sdpLines = sdp.split(/\r?\n/);
    for (var i = 0; i < sdpLines.length; i++) {
      if (sdpLines[i].startsWith('a=candidate:')) {
        var candStr = sdpLines[i].substring('a=candidate:'.length);
        var parts = candStr.split(' ');
        if (parts.length >= 8) {
          iceCandidates.push({
            candidate: candStr,
            sdpMid: parts[2] || '0',
            sdpMLineIndex: parseInt(parts[1], 10) || 0
          });
        }
      }
    }
    var desc = new RTCSessionDescription({ type: 'answer', sdp: sdp });
    qrState.pc.setRemoteDescription(desc).then(function () {
      /* 把 visitor 的 ICE candidate 加到房主的 pc 上 */
      var addPromises = [];
      for (var i = 0; i < iceCandidates.length; i++) {
        try {
          addPromises.push(qrState.pc.addIceCandidate(new RTCIceCandidate(iceCandidates[i])).catch(function () { /* ignore */ }));
        } catch (e) { /* ignore */ }
      }
      return Promise.all(addPromises);
    }).then(function () {
      setQRTip('连接成功', '正在建立直接连接…', '');
      qrState.step = 3;
      if (els.qrWait) els.qrWait.hidden = false;
      if (els.qrWaitTxt) els.qrWaitTxt.textContent = '正在建立 P2P 连接…';
    }).catch(function () { setStatus('连接失败，请重试'); qrStop(); });
  }

  /* 创建扫码直连的 PeerConnection（与 ntfy 的 p2pCreate 独立） */
  function p2pCreateQR(isHost) {
    var RTC = window.RTCPeerConnection || window.webkitRTCPeerConnection;
    var pc = new RTC({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    });
    var dc = null;
    if (isHost) {
      dc = pc.createDataChannel('game', { ordered: true });
      bindQRDataChannel(dc);
    } else {
      pc.ondatachannel = function (ev) {
        dc = ev.channel;
        qrState.dc = dc; /* 访客端必须写回，否则只能收不能发 */
        bindQRDataChannel(dc);
      };
    }
    pc.onicecandidate = function (ev) {
      if (ev.candidate) {
        qrState.gathered.push(ev.candidate.toJSON());
        /* 扫码直连：ICE candidate 通过文字框/QR 码自动交换 */
        var cands = qrState.gathered;
        if (cands.length > 0) {
          var icePayload = JSON.stringify({ t: 'q-ice', c: cands });
          qrState.iceB64 = b64Encode(icePayload);
        }
      }
    };
    pc.oniceconnectionstatechange = function () {
      var st = pc.iceConnectionState;
      if (st === 'connected' && !qrState.on) {
        qrState.on = true;
        qrP2pConnected();
      }
      if (st === 'disconnected' || st === 'failed') {
        if (qrState.on) {
          qrState.on = false;
          /* 退回 ntfy */
          setStatus('P2P 连接断了，正在切回普通通道');
          qrStop();
          /* 恢复原有 ntfy 通道 */
          if (online.room) {
            startPolling();
          }
        }
      }
    };
    qrState.pc = pc;
    qrState.dc = dc;
    return pc;
  }

  function bindQRDataChannel(dc) {
    dc.onopen = function () {
      qrState.on = true;
      qrP2pConnected();
    };
    dc.onclose = function () {
      if (qrState.on) {
        qrState.on = false;
        setStatus('P2P 连接断了');
        qrStop();
      }
    };
    dc.onmessage = function (ev) {
      var txt = ev.data;
      if (typeof txt !== 'string') return;
      online.lastHeard = Date.now();
      /* 复用 p2pOnData 的处理 */
      p2pOnData(txt);
    };
  }

  /* 扫码 P2P 连通后的处理 */
  function qrP2pConnected() {
    if (!qrState.on) return;
    /* 迁移到主 p2pState */
    p2pState.pc = qrState.pc;
    p2pState.dc = qrState.dc;
    p2pState.on = true;
    p2pState.offerSent = qrState.offerSent;
    p2pState.answerSent = qrState.answerSent;
    p2pState.gathered = qrState.gathered;
    p2pState.trickleDone = true;

    /* 如果在房间中：复用现有 P2P 通道 */
    if (online.room) {
      p2pOnConnected();
      closeQRModal();
      return;
    }

    /* 不在房间：创建扫码直连独立对局（仅 DataChannel 通信） */
    online.role = qrState.mode === 'host' ? 'host' : 'guest';
    online.hostUid = qrState.mode === 'host' ? myUid() : 'peer';
    online.hostName = qrState.mode === 'host' ? me.name : '朋友';
    online.hostPid = qrState.mode === 'host' ? myPid() : 'peer';
    online.guestUid = qrState.mode === 'guest' ? myUid() : 'peer';
    online.guestName = qrState.mode === 'guest' ? me.name : '朋友';
    online.guestPid = qrState.mode === 'guest' ? myPid() : 'peer';
    online.seen = {};
    online.seq = 0;
    online.lastSeq = -1;
    online.seenMids = [];
    newGame(false);
    refreshOnlineUI();
    if (online.role === 'host') {
      broadcastState(true);
    } else {
      sendHi();
    }
    setStatus('扫码直连已建立，消息不再经过服务器');
    closeQRModal();
  }

/* 提交按钮的点击逻辑 */
function qrSubmit() {
if (qrState.mode === 'guest' && qrState.step === 1) {
qrGuestSubmitOffer();
} else if (qrState.mode === 'host' && qrState.step === 2) {
qrHostSubmitAnswer();
}
}

/* --- 摄像头扫码逻辑 --- */
/* 使用 BarcodeDetector API（Chrome 94+ 支持）检测 QR 码。
   不支持的浏览器提示用户改用粘贴方式。 */
function qrStopScan() {
qrState.scanActive = false;
if (qrState.scanTimer) {
  window.clearInterval(qrState.scanTimer);
  qrState.scanTimer = 0;
}
if (qrState.scanStream) {
  try {
    qrState.scanStream.getTracks().forEach(function (tr) { tr.stop(); });
  } catch (e) { /* ignore */ }
  qrState.scanStream = null;
}
if (els.qrScanner) els.qrScanner.classList.remove('on');
if (els.qrScanBtn) {
    els.qrScanBtn.textContent = qrState.mode === 'host' ? '扫联机码' : '扫房主的二维码';
}
if (els.qrScanTip) els.qrScanTip.textContent = '将二维码放入框内';
}

function qrStartScan() {
if (qrState.scanActive) { qrStopScan(); return; }

qrState.scanTarget = qrState.mode === 'host' ? 'host' : 'guest';

/* B站 App 内置浏览器不支持摄像头扫码，优先提示并尝试 scheme */
if (IN_APP) {
  var tipMsg = 'B站 App 内暂不支持摄像头扫码，请用 Chrome/Safari 打开本页面再扫，或直接粘贴文字串';
  if (els.qrScanTip) { els.qrScanTip.textContent = tipMsg; }
  if (els.qrScanner) els.qrScanner.classList.add('on');
  if (els.qrVideo) els.qrVideo.parentElement.style.display = 'none';
  setStatus(tipMsg);
  /* 尝试 bilibili:// scheme 唤起原生扫码（部分版本可能支持） */
  try {
    var schemeUrl = 'bilibili://scan_qr';
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = schemeUrl;
    document.body.appendChild(iframe);
    setTimeout(function () { document.body.removeChild(iframe); }, 1000);
  } catch (e) { /* ignore */ }
  return;
}

/* 检查 BarcodeDetector 支持 */
if (typeof window.BarcodeDetector === 'undefined') {
  if (els.qrScanTip) { els.qrScanTip.textContent = '当前浏览器不支持摄像头扫码，请用 Chrome 浏览器，或直接粘贴文字串'; }
  if (els.qrScanner) els.qrScanner.classList.add('on');
  setStatus('当前浏览器不支持摄像头扫码，请用 Chrome 浏览器，或直接粘贴文字串');
  return;
}
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  if (els.qrScanTip) { els.qrScanTip.textContent = '当前环境不支持摄像头访问，请直接粘贴文字串'; }
  if (els.qrScanner) els.qrScanner.classList.add('on');
  setStatus('当前环境不支持摄像头访问，请直接粘贴文字串');
  return;
}

if (els.qrScanTip) els.qrScanTip.textContent = '正在启动摄像头…';
if (els.qrScanner) els.qrScanner.classList.add('on');
setStatus('正在启动摄像头…');

navigator.mediaDevices.getUserMedia({
  video: { facingMode: 'environment' },
  audio: false
}).then(function (stream) {
  qrState.scanStream = stream;
  qrState.scanActive = true;

  if (els.qrScanner) els.qrScanner.classList.add('on');
  if (els.qrVideo) {
    els.qrVideo.srcObject = stream;
    els.qrVideo.setAttribute('playsinline', 'true');
  }
  if (els.qrScanTip) els.qrScanTip.textContent = '正在识别…';

  /* 切换按钮文案 */
  if (els.qrScanBtn) els.qrScanBtn.textContent = '关闭摄像头';

  /* 开始循环检测 */
  qrState.scanTimer = window.setInterval(function () {
    if (!qrState.scanActive) return;
    qrDetectFrame().then(function (result) {
      if (result) {
        qrStopScan();
        qrOnScanSuccess(result);
      }
    }).catch(function () { /* 忽略检测错误 */ });
  }, 300);
}).catch(function (err) {
  qrState.scanActive = false;
  var msg;
  if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
    msg = '摄像头权限被拒绝。请在浏览器地址栏左侧的「锁/设置」图标中允许摄像头访问，然后重新点击扫码；或直接粘贴文字串';
  } else if (err && err.name === 'NotFoundError') {
    msg = '未检测到摄像头设备，请直接粘贴文字串';
  } else {
    msg = '摄像头启动失败：' + (err && err.message ? err.message : '') + '，请直接粘贴文字串';
  }
  if (els.qrScanTip) els.qrScanTip.textContent = msg;
  setStatus(msg);
});
}

/* 对当前视频帧进行 QR 码检测 */
function qrDetectFrame() {
if (!els.qrVideo || !els.qrVideo.videoWidth) return Promise.resolve(null);
var detector = new window.BarcodeDetector({ formats: ['qr_code'] });
return detector.detect(els.qrVideo).then(function (codes) {
  if (codes && codes.length > 0) {
    /* 取第一个检测到的 QR 码内容 */
    for (var i = 0; i < codes.length; i++) {
      if (codes[i].rawValue && codes[i].rawValue.indexOf('|') > -1) {
        return codes[i].rawValue;
      }
    }
    /* 没找到含 | 的，取第一个 */
    if (codes[0].rawValue) return codes[0].rawValue;
  }
  return null;
});
}

/* 扫码成功后的处理 */
function qrOnScanSuccess(text) {
var target = qrState.scanTarget;
/* 验证格式：应有 "1|" 或 "2|" 前缀 */
if (!text || (text.indexOf('1|') !== 0 && text.indexOf('2|') !== 0)) {
  setStatus('二维码内容不是有效的邀请码，请重试或直接粘贴文字串');
  return;
}
/* 访客必须扫 "1|" 开头的 offer */
if (target === 'guest' && text.indexOf('1|') !== 0) {
  setStatus('请扫描房主的邀请码（1| 开头）');
  return;
}
/* 房主必须扫 "2|" 开头的 answer */
if (target === 'host' && text.indexOf('2|') !== 0) {
  setStatus('请扫描朋友的回复码（2| 开头）');
  return;
}

/* 填入文本框 */
if (els.qrTextInput) {
  els.qrTextInput.value = text;
  els.qrTextInput.readOnly = true;
}

setStatus('扫码成功，正在处理…');

/* 触发提交流程 */
if (target === 'guest' && qrState.step === 1) {
  qrGuestSubmitOffer();
} else if (target === 'host' && qrState.step === 2) {
  qrHostSubmitAnswer();
}
}

/* 统一发消息：P2P 优先，ntfy 兜底 */
  function sendGameMsg(msg) {
    if (!msg.mid) msg.mid = newMid();
    if (p2pState.on && p2pState.dc) {
      var ok = p2pSend(msg);
      if (ok) {
        online.lastHeard = Date.now();
        return Promise.resolve(true);
      }
    }
    return publish(msg);
  }

  function publish(msg) {
    if (!msg.mid) msg.mid = newMid();
    /* P2P 已连通：走 DataChannel，不再发 ntfy。
       必须放在 topic 检查之前——扫码直连的独立对局没有 ntfy room topic，
       否则建连成功后落子/状态消息会被静默丢弃，看起来连上了却动不了。 */
    if (p2pState.on && p2pState.dc && p2pSend(msg)) {
      online.lastHeard = Date.now();
      return Promise.resolve(true);
    }
    if (!online.topic) return Promise.resolve(false);
    var body = JSON.stringify(msg);
    var attempt = 0;
    var limited = false;
    function send() {
      attempt++;
      return timedFetch(RELAY + online.topic, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: body
      }, PUBLISH_TIMEOUT_MS).then(function (r) {
        if (r && r.status === 429) { limited = true; return false; }
        return !!(r && r.ok);
      }, function () {
        return false;
      }).then(function (ok) {
        if (ok) online.lastHeard = Date.now();
        if (ok || limited || attempt >= 3) return ok;
        return new Promise(function (resolve) {
          window.setTimeout(function () { resolve(send()); }, attempt === 1 ? 500 : 1200);
        });
      });
    }
    return send();
  }

  /* ---------------- 好友 & 在线状态 ---------------- */

  function loadFriends() {
    var keys = [FRIEND_KEY, FRIEND_KEY + '_bak'];
    for (var lk = 0; lk < LEGACY_FRIEND_KEYS.length; lk++) {
      keys.push(LEGACY_FRIEND_KEYS[lk], LEGACY_FRIEND_KEYS[lk] + '_bak');
    }
    /* 合并共用列表和旧版各自的列表，避免升级后好友丢失 */
    var merged = [];
    for (var ki = 0; ki < keys.length; ki++) {
      try {
        var raw = window.localStorage.getItem(keys[ki]);
        if (!raw) continue;
        var arr = JSON.parse(raw);
        if (!Array.isArray(arr)) continue;
        for (var i = 0; i < arr.length && merged.length < 50; i++) {
          var f = arr[i];
          if (!f || !((typeof f.u === 'string' && f.u) || (typeof f.p === 'string' && f.p))) continue;
          if (!f.p) f.p = f.u;
          var hit = null;
          for (var j = 0; j < merged.length; j++) {
            if ((f.p && merged[j].p === f.p) || (f.u && merged[j].u === f.u)) { hit = merged[j]; break; }
          }
          if (hit) {
            if (!hit.p && f.p) hit.p = f.p;
            if (!hit.u && f.u) hit.u = f.u;
            if (!hit.n && f.n) hit.n = f.n;
            if (!hit.f && f.f) hit.f = f.f;
          } else {
            merged.push({ p: f.p || '', u: f.u || '', n: f.n || '', f: f.f || '' });
          }
        }
      } catch (e) { /* try next */ }
    }
    friends = merged;
    saveFriends();
  }

  function saveFriends() {
    try {
      var raw = JSON.stringify(friends);
      window.localStorage.setItem(FRIEND_KEY, raw);
      window.localStorage.setItem(FRIEND_KEY + '_bak', raw);
    } catch (e) { /* ignore */ }
  }

  function friendTopic(uid) {
    return PRESENCE_PREFIX + String(uid || '').toLowerCase();
  }

  function publishTopic(topic, msg) {
    if (!topic) return Promise.resolve(false);
    return timedFetch(RELAY + topic, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(msg)
    }, REQUEST_TIMEOUT_MS).then(function (r) { return r.ok; }).catch(function () { return false; });
  }

  function findFriend(uid) {
    if (!uid) return null;
    for (var i = 0; i < friends.length; i++) {
      if (friends[i].u === uid || friends[i].p === uid) return friends[i];
    }
    return null;
  }

  function isFriend(uid) {
    return !!findFriend(uid);
  }

  function friendKeyOf(f) {
    return (f && (f.p || f.u)) || '';
  }

  function addFriend(key, name, face, uid) {
    if (!key) return null;
    if (key === myPid() || (uid && uid === myUid() && key === myUid())) return null;
    var f = findFriend(key);
    if (!f) {
      f = { p: key, u: uid || '', n: '', f: '' };
      friends.push(f);
    } else {
      f.p = key;
      if (uid) f.u = uid;
    }
    if (name) f.n = String(name);
    if (face) f.f = String(face);
    saveFriends();
    renderFriends();
    return f;
  }

  function friendAction(uid, name, face, pid) {
    var key = pid || uid;
    if (!key) return;
    if (key === myPid()) return;
    var fresh = !isFriend(key);
    addFriend(key, name || '朋友', face || '', uid || (pid ? '' : key));
    publishTopic(friendTopic(key), { t: 'fa', u: myUid(), p: myPid(), n: me.name, f: me.face || '' });
    setStatus(fresh ? ('已和 ' + (name || '朋友') + ' 加为好友') : '你们已经是好友啦');
    refreshFriendBtn();
  }

  function refreshFriendBtn() {
    if (!els.winFriendBtn) return;
    var opp = onlineOpponent();
    var opid = onlineOpponentPid();
    els.winFriendBtn.hidden = !(mode === 'online' && over && (opp || opid) && !isFriend(opid || opp));
  }

  function onlineOpponentPid() {
    if (online.role === 'host') return online.guestPid || '';
    if (online.role === 'guest') return online.hostPid || '';
    return '';
  }

  function onlineOpponent() {
    if (online.role === 'host') return online.guestUid || '';
    if (online.role === 'guest') return online.hostUid || '';
    return '';
  }

  function pushPresence() {
    if (!me.uid) return;
    var fs = [];
    for (var i = 0; i < friends.length && i < 50; i++) {
      if (friends[i]) { var fk = friendKeyOf(friends[i]); if (fk) fs.push(fk); }
    }
    var msg = {
      t: 'p', u: me.uid, p: myPid(), n: me.name, f: me.face || '',
      r: (online.role === 'host' && online.room) ? online.room : '', g: 'go',
      fs: fs
    };
    publishTopic(friendTopic(myPid()), msg);
    /* 旧版好友还在按账号 uid 订阅：隔一会儿在 uid 主题补一条带 pid 的心跳，对方收到后自动迁移到 pid */
    var nowMs = Date.now();
    if (!presence.lastLegacy || nowMs - presence.lastLegacy > 45000) {
      presence.lastLegacy = nowMs;
      var legacy = [me.uid].concat(me.aliases || []);
      for (var k = 0; k < legacy.length && k < 4; k++) {
        var lu = legacy[k];
        if (!lu || lu === myPid()) continue;
        publishTopic(friendTopic(lu), msg);
      }
    }
  }

  /* 登录后 uid 变了：在旧主题上广播一条改名消息，好友那边跟着换主题，不再显示离线 */
  function announceUidChange(oldUid, newUid) {
    if (!oldUid || !newUid || oldUid === newUid) return;
    publishTopic(friendTopic(oldUid), {
      t: 'iu', o: oldUid, u: newUid, p: myPid(), n: me.name, f: me.face || ''
    });
  }

  function startPresence() {
    if (presence.started || !me.uid) return;
    presence.started = true;
    pushPresence();
    /* 修复：原心跳 30s/轮询 45s/UI 10s，好友在线感知最坏要 75 秒以上、
       离线判定窗口却长达 3 分钟——「朋友明明在下棋却显示离线」。与五子棋对齐。 */
    presence.hb = window.setInterval(pushPresence, 12000);
    presence.poll = window.setInterval(pollPresence, 12000);
    presence.ui = window.setInterval(renderFriends, 5000);
    startOwnPresenceStream();
    pollPresence();
  }

  /* 自己的好友主题挂一路 SSE：好友「邀战」能立刻收到，不用等 30 秒轮询 */
  function startOwnPresenceStream() {
    if (presence.es || !window.EventSource || !me.uid) return;
    try {
      var es = new window.EventSource(RELAY + friendTopic(myPid()) + '/sse');
      presence.es = es;
      es.onmessage = function (ev) {
        try {
          var o = JSON.parse(ev.data);
          var inner = o && typeof o.message === 'string' ? o.message : ev.data;
          handleOwnPresenceMsg(typeof inner === 'string' ? JSON.parse(inner) : inner);
        } catch (e) { /* ignore */ }
      };
      es.onerror = function () {
        try { es.close(); } catch (e) { /* ignore */ }
        if (presence.es === es) presence.es = null;
        /* 弱网下 SSE 会静默断开：稍后重建，否则好友邀战/在线状态要等轮询才更新 */
        if (!presence.started || presence.retry) return;
        presence.retry = window.setTimeout(function () {
          presence.retry = 0;
          if (presence.started) startOwnPresenceStream();
        }, 8000);
      };
    } catch (e) { presence.es = null; }
  }

  function stopPresence() {
    if (presence.hb) window.clearInterval(presence.hb);
    if (presence.poll) window.clearInterval(presence.poll);
    if (presence.ui) window.clearInterval(presence.ui);
    if (presence.retry) { window.clearTimeout(presence.retry); presence.retry = 0; }
    if (presence.es) {
      try { presence.es.close(); } catch (e) { /* ignore */ }
      presence.es = null;
    }
    presence.hb = 0;
    presence.poll = 0;
    presence.ui = 0;
    presence.started = false;
    presencePaused = false;
    presence.since = {};
    presence.seen = {};
    presence.busy = {};
  }

  /* ---- presence 网络节流 ----
     好友在线心跳原本 12s 一轮、每个好友一个 topic 请求，10 个好友约 55 请求/分钟，
     会把 ntfy 公共中转的限流额度耗光，导致棋局消息被 429 挤掉。
     对战期间降到 60s；P2P 直连后完全停发。 */
  var presencePaused = false, presenceThrottled = false;
  var PRESENCE_FAST_MS = 12000, PRESENCE_SLOW_MS = 60000;
  function presenceTimers(ms) {
    if (!presence.started || presencePaused) return;
    if (presence.hb) window.clearInterval(presence.hb);
    if (presence.poll) window.clearInterval(presence.poll);
    presence.hb = window.setInterval(pushPresence, ms);
    presence.poll = window.setInterval(pollPresence, ms);
  }
  function pausePresenceNet() {
    if (!presence.started || presencePaused) return;
    presencePaused = true;
    if (presence.hb) { window.clearInterval(presence.hb); presence.hb = 0; }
    if (presence.poll) { window.clearInterval(presence.poll); presence.poll = 0; }
  }
  function resumePresenceNet() {
    if (!presence.started || !presencePaused) return;
    presencePaused = false;
    pushPresence();
    presenceTimers(presenceThrottled ? PRESENCE_SLOW_MS : PRESENCE_FAST_MS);
    pollPresence();
  }
  function throttlePresence(on) {
    if (presenceThrottled === on) return;
    presenceThrottled = on;
    presenceTimers(on ? PRESENCE_SLOW_MS : PRESENCE_FAST_MS);
  }

  function pollPresence() {
    if (!me.uid) return;
    pollPresenceTopic(friendTopic(myPid()), true);
    /* 自己的旧账号主题：旧版好友按 uid 发来的加好友/心跳还能收到（降频，避免公共频道限流） */
    var nowMs = Date.now();
    if (!presence.lastLegacyPoll || nowMs - presence.lastLegacyPoll > 45000) {
      presence.lastLegacyPoll = nowMs;
      var legacy = [me.uid].concat(me.aliases || []);
      for (var k = 0; k < legacy.length && k < 4; k++) {
        var lu = legacy[k];
        if (!lu || lu === myPid()) continue;
        pollPresenceTopic(friendTopic(lu), true);
      }
    }
    /* 好友多时不要一次性打满公共中转的请求配额：每轮最多查 12 个，轮转推进。
       在线判定阈值是 180 秒，45 秒一轮、多轮覆盖完全够用。 */
    var total = friends.length;
    var limit = Math.min(total, 12);
    var start = total ? (presence.rr || 0) % total : 0;
    for (var i = 0; i < limit; i++) {
      var idx = (start + i) % total;
      pollPresenceTopic(friendTopic(friendKeyOf(friends[idx])), false);
    }
    if (total) presence.rr = (start + limit) % total;
  }

  /* ntfy 的 /json 是 NDJSON：一行一条消息（多条时整段 JSON.parse 会直接抛错），必须逐行解析 */
  function readNdjson(r) {
    if (r && !r.ok) return Promise.reject(new Error('http ' + r.status));
    return r.text().then(function (txt) {
      var out = [], lines = String(txt || '').split('\n');
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].replace(/^\s+|\s+$/g, '');
        if (!line) continue;
        try { out.push(JSON.parse(line)); } catch (e) { /* 坏行跳过 */ }
      }
      return out;
    });
  }

  function pollPresenceTopic(topic, own) {
    if (!topic || presence.busy[topic]) return;
    presence.busy[topic] = 1;
    var prev = presence.since[topic];
    var since = prev || (own ? '6h' : '10m');
    timedFetch(RELAY + topic + '/json?poll=1&since=' + since, {}, REQUEST_TIMEOUT_MS)
      .then(readNdjson)
      .then(function (list) {
        var maxTime = 0;
        for (var i = 0; i < list.length; i++) {
          if (list[i] && list[i].time) maxTime = Math.max(maxTime, list[i].time);
          var raw = list[i] && list[i].message;
          if (!raw) continue;
          var m;
          try { m = JSON.parse(raw); } catch (e) { continue; }
          if (own) handleOwnPresenceMsg(m);
          else handlePresenceMsg(m);
        }
        if (maxTime) presence.since[topic] = Math.max(1, maxTime - 1);
        else if (typeof prev === 'number') presence.since[topic] = prev;
        else presence.since[topic] = Math.floor(Date.now() / 1000) - 30;
      }).catch(function () { /* 失败不推进游标，下轮重试 */ })
      .then(function () { delete presence.busy[topic]; });
  }

  function isMyKey(key) {
    if (!key) return false;
    if (key === myPid()) return true;
    if (key === myUid()) return true;
    return !!(me.aliases && me.aliases.indexOf(key) >= 0);
  }

  /* 自己的主题：别人加我的 fa、我自己心跳里的 fs —— localStorage 被清也能把好友找回来 */
  function handleOwnPresenceMsg(m) {
    if (!m || !m.t) return;
    if (m.t === 'fa') { handlePresenceMsg(m); return; }
    if (m.t === 'inv') { acceptInvite(m); return; }
    if (m.t === 'invno') {
      setStatus((m.n || '好友') + ' 正在对局中，稍后再约');
      return;
    }
    var key = m.p || m.u;
    if (!key || !isMyKey(key)) return;
    if (m.t === 'p' && Array.isArray(m.fs)) {
      var changed = false;
      for (var i = 0; i < m.fs.length && i < 50; i++) {
        var kid = m.fs[i];
        if (typeof kid !== 'string' || !kid || isMyKey(kid)) continue;
        if (!findFriend(kid)) { friends.push({ p: kid, u: '', n: '', f: '' }); changed = true; }
      }
      if (changed) { saveFriends(); renderFriends(); }
    }
  }

  function handlePresenceMsg(m) {
    if (!m || !m.t) return;
    var key = m.p || m.u;
    if (!key) return;
    if (m.t === 'iu') {
      if (isMyKey(m.p || m.u)) return;
      var old = findFriend(m.o) || findFriend(m.u);
      if (old) {
        old.p = m.p || m.u;
        if (m.u) old.u = m.u;
        if (m.n) old.n = m.n;
        if (m.f) old.f = m.f;
        saveFriends();
        renderFriends();
      }
      return;
    }
    if (isMyKey(key) || (m.u && m.u === myUid() && !m.p)) return;
    if (m.t === 'p') {
      var prev = presence.seen[key] || {};
      presence.seen[key] = {
        ts: Date.now(),
        n: typeof m.n === 'string' && m.n ? m.n : (prev.n || '朋友'),
        f: typeof m.f === 'string' ? m.f : (prev.f || ''),
        r: typeof m.r === 'string' ? m.r : ''
      };
      if (m.u && m.u !== key) presence.seen[m.u] = presence.seen[key];
      var fr = findFriend(key) || (m.u ? findFriend(m.u) : null);
      if (fr) {
        var needSave = false;
        if (key && fr.p !== key) { fr.p = key; needSave = true; }
        if (m.n && fr.n !== m.n) { fr.n = String(m.n); needSave = true; }
        if (m.f && fr.f !== m.f) { fr.f = String(m.f); needSave = true; }
        if (m.u && fr.u !== m.u) { fr.u = String(m.u); needSave = true; }
        if (needSave) saveFriends();
      }
      renderFriends();
      return;
    }
    if (m.t === 'fa') {
      var fresh = !isFriend(key);
      addFriend(key, m.n || '朋友', m.f || '', m.u || '');
      if (fresh) {
        setStatus((m.n || '朋友') + ' 也加你为好友啦');
        renderFriends();
      }
    }
  }

  function friendAvatar(f) {
    var box = document.createElement('span');
    box.className = 'friend-avatar';
    if (f.f) {
      var img = document.createElement('img');
      img.src = f.f;
      img.alt = '';
      img.addEventListener('error', function () {
        box.removeChild(img);
        box.textContent = initialOf(f.n);
      });
      box.appendChild(img);
    } else {
      box.textContent = initialOf(f.n);
    }
    return box;
  }

  function initialOf(name) {
    var s = String(name || '友').trim();
    return s ? s.slice(-1) : '友';
  }

  function openFriends() {
    if (!els.friendPanel) return;
    if (els.historyPanel && els.historyPanel.classList.contains('on')) closeHistory();
    renderFriends();
    els.friendPanel.classList.add('on');
  }

  function closeFriends() {
    if (els.friendPanel) els.friendPanel.classList.remove('on');
  }

  function renderFriends() {
    if (!els.friendList) return;
    els.friendList.innerHTML = '';
    var now = Date.now();
    var onCount = 0;
    for (var k = 0; k < friends.length; k++) {
      var sn = presence.seen[friendKeyOf(friends[k])];
      var inRoomK = !!online.room && (friends[k].p === onlineOpponentPid() || friends[k].u === onlineOpponent());
      var seenHereK = !!(online.seen && ((online.seen[friends[k].u] && now - online.seen[friends[k].u].ts < 120000) ||
                                         (online.seen[friends[k].p] && now - online.seen[friends[k].p].ts < 120000)));
      if ((sn && now - sn.ts < FRIEND_ONLINE_MS) || inRoomK || seenHereK) onCount++;
    }
    if (els.friendCount) els.friendCount.textContent = String(onCount);
    if (!friends.length) {
      var empty = document.createElement('div');
      empty.className = 'friend-empty';
      empty.textContent = '还没有好友，联机下完一局可以加对方';
      els.friendList.appendChild(empty);
      return;
    }
    for (var i = 0; i < friends.length; i++) {
      (function (f) {
        var seen = presence.seen[friendKeyOf(f)] || null;
        var inRoom = !!online.room && (f.p === onlineOpponentPid() || (!!f.u && f.u === onlineOpponent()));
        var seenHere = !!(online.seen && ((online.seen[f.u] && (now - online.seen[f.u].ts < 120000)) ||
                                          (online.seen[f.p] && (now - online.seen[f.p].ts < 120000))));
        var on = (!!seen && (now - seen.ts < FRIEND_ONLINE_MS)) || inRoom || seenHere;
        var room = (seen && seen.r) ? seen.r : (inRoom ? online.room : '');
        var row = document.createElement('div');
        row.className = 'friend-row';
        row.appendChild(friendAvatar(f));

        var main = document.createElement('div');
        main.className = 'friend-main';
        var name = document.createElement('span');
        name.className = 'friend-name';
        name.textContent = f.n || '朋友';
        var sub = document.createElement('span');
        sub.className = 'friend-sub';
        var dot = document.createElement('i');
        dot.className = 'friend-dot' + (on ? ' on' : '');
        sub.appendChild(dot);
        var txt = document.createElement('span');
        txt.textContent = on ? (room ? ('在线 · 房间 ' + room) : '在线') : '离线';
        sub.appendChild(txt);
        main.appendChild(name);
        main.appendChild(sub);
        row.appendChild(main);

        if (on) {
          var join = document.createElement('button');
          join.type = 'button';
          join.className = 'friend-join';
          if (room) {
            join.textContent = '进入房间';
            join.addEventListener('click', function () { joinFriendRoom(room); });
          } else {
            join.textContent = '邀战';
            join.addEventListener('click', function () { challengeFriend(f); });
          }
          row.appendChild(join);
        }
        els.friendList.appendChild(row);
      })(friends[i]);
    }
  }

  /* 好友在线且不在房间：建一个房，把房号通过好友主题直接推给对方 */
  function challengeFriend(f) {
    var key = friendKeyOf(f);
    if (!key) return;
    closeFriends();
    if (online.room) leaveRoom(true);
    if (mode !== 'online') forceMode('online');
    online.roomTries = 0;
    /* 修复：房间号可能撞号。原实现建房后立刻把房号发给好友，
       一旦这个号已被别人占用，好友进来进的却是别人的房间。
       现在先建房探测，确认没被占用后再把邀请发出去。 */
    online.roomInvite = { key: key, friend: f };
    createRoomWithRetry();
    setStatus('正在建房…');
  }

  /* 房间号探测通过（没撞号）后，才把邀请发给好友 */
  function sendRoomInvite() {
    var inv = online.roomInvite;
    if (!inv) return;
    online.roomInvite = null;
    var code = online.room;
    publishTopic(friendTopic(inv.key), {
      t: 'inv', u: myUid(), p: myPid(), n: me.name, f: me.face || '', r: code, g: 'go'
    });
    setStatus('已邀请 ' + ((inv.friend && inv.friend.n) || '好友') + '，房间 ' + code + '，等他进来');
  }

  /* 收到好友邀战：没在局中就直接进房，正在下棋就回一句“稍后再约” */
  function acceptInvite(m) {
    var key = m.p || m.u;
    var code = String(m.r || '').replace(/[^0-9]/g, '').slice(0, 6);
    if (!key || code.length !== 6) return;
    if (m.g && m.g !== 'go') return;
    if (!isFriend(key)) return;
    var sig = key + '|' + code;
    var now = Date.now();
    if (inviteSeen[sig] && now - inviteSeen[sig] < 60000) return;
    inviteSeen[sig] = now;
    if (online.room === code) return;
    if (online.room && !over) {
      publishTopic(friendTopic(key), { t: 'invno', u: myUid(), p: myPid(), n: me.name });
      setStatus((m.n || '好友') + ' 邀你下围棋，你这局还没下完');
      return;
    }
    joinFriendRoom(code);
    setStatus((m.n || '好友') + ' 邀你下围棋，进房间 ' + code + ' 啦');
  }

  function joinFriendRoom(code) {
    code = String(code || '').replace(/[^0-9]/g, '').slice(0, 6);
    if (code.length !== 6) {
      setStatus('好友房间号不完整，稍后再试');
      return;
    }
    closeFriends();
    if (mode === 'online' && online.room) leaveRoom(true);
    if (mode !== 'online') forceMode('online');
    joinRoom(code);
    setStatus('正在进入好友房间 ' + code + ' …');
  }

  function closeStream() {
    /* 让所有还在路上的轮询/SSE 回调失效，避免旧房间的响应写进新房间 */
    online.gen++;
    stopPolling();
    stopLinkWatch();
    if (online.es) {
      try { online.es.close(); } catch (e) { /* ignore */ }
      online.es = null;
    }
  }

  function subscribe(room) {
    throttlePresence(true); /* 对战期间让 ntfy 额度优先给棋局消息 */
    var topic = TOPIC_PREFIX + room.toLowerCase();
    var sameRoom = online.topic === topic;
    online.room = room;
    online.topic = topic;
    /* 重连同一个房间时保留游标和去重表，避免把已经处理过的落子再放一遍；
       只有换房间才从头同步。 */
    if (!sameRoom) {
      online.lastSeq = -1;
      online.lastTs = Math.floor(Date.now() / 1000) - 120;
      online.seenMids = [];
    }
    online.fail = 0;
    online.pollFails = 0;
    online.pollDelay = 1200;
    online.lastState = Date.now();
    closeStream();
    startLinkWatch();
    /* SSE 建立前先轮询兜底：部分 WebView 里 SSE 会静默连不上，不能干等 */
    startPolling();
    try {
      if (window.EventSource) {
        var es = new window.EventSource(RELAY + online.topic + '/sse');
        online.es = es;
        es.onopen = function () {
          if (online.es !== es) return;
          online.fail = 0;
          online.lastHeard = Date.now();
          /* 不打断已经在途的轮询：让它把断线期间的消息处理完，避免切换瞬间漏一手 */
          stopPolling(false);
          setConn('房间连接好了');
        };
        es.onmessage = function (ev) {
          if (online.es !== es) return;
          var outer;
          try { outer = JSON.parse(ev.data); } catch (e) { return; }
          if (!outer || outer.event !== 'message' || !outer.message) return;
          if (outer.time) online.lastTs = Math.max(online.lastTs, outer.time);
          handleMsg(outer.message);
        };
        es.onerror = function () {
          if (online.es !== es) return;
          online.fail++;
          /* 断了就立刻回退轮询，SSE 自己重连成功后 onopen 会再停掉轮询 */
          startPolling();
          setConn('实时连接断开，已切到轮询重连…');
        };
      }
    } catch (e) { /* 已经在轮询 */ }
  }

  function startPolling() {
    if (online.pollOn) return;
    online.pollOn = true;
    online.pollDelay = 1200;
    /* 刚接入时快速对齐状态，10 秒后降到 2.5 秒，避免把公共中转刷限流 */
    online.pollFastUntil = Date.now() + 10000;
    setConn('轮询模式连接房间中…');
    pollOnce();
  }

  function stopPolling(abort) {
    online.pollOn = false;
    if (online.pollTimer) {
      window.clearTimeout(online.pollTimer);
      online.pollTimer = 0;
    }
    /* abort === false 表示切到 SSE：保留在途请求，等它自己收尾 */
    if (abort !== false) {
      online.polling = false;
      if (online.pollCtrl) {
        try { online.pollCtrl.abort(); } catch (e) { /* ignore */ }
        online.pollCtrl = null;
      }
    }
  }

  function schedulePoll() {
    if (!online.pollOn) return;
    online.pollTimer = window.setTimeout(function () {
      online.pollTimer = 0;
      pollOnce();
    }, online.pollDelay);
  }

  function pollOnce() {
    if (!online.pollOn || online.polling || !online.topic) return;
    var gen = online.gen;
    var url = RELAY + online.topic + '/json?poll=1';
    if (online.lastTs) url += '&since=' + online.lastTs;
    var ctrl = null;
    var opts = { cache: 'no-store' };
    if (window.AbortController) {
      ctrl = new window.AbortController();
      online.pollCtrl = ctrl;
      opts.signal = ctrl.signal;
    }
    /* 弱网下请求可能一直挂着：给自己加超时，失败后按退避节奏重试 */
    var timer = window.setTimeout(function () {
      if (ctrl) { try { ctrl.abort(); } catch (e) { /* ignore */ } }
    }, POLL_TIMEOUT_MS);
    online.polling = true;
    window.fetch(url, opts).then(readNdjson).then(function (list) {
      window.clearTimeout(timer);
      if (gen !== online.gen) return;
      online.polling = false;
      online.pollCtrl = null;
      /* 这里不再要求 pollOn：切到 SSE 时保留的在途轮询也要把消息处理完 */
      var wasDown = online.pollFails >= 3;
      online.pollFails = 0;
      online.lastHeard = Date.now();
      online.pollDelay = Date.now() < online.pollFastUntil ? 1200 : 2500;
      for (var i = 0; i < list.length; i++) {
        if (list[i].time) online.lastTs = Math.max(online.lastTs, list[i].time);
        if (list[i].message) handleMsg(list[i].message);
      }
      if (wasDown && mode === 'online' && online.room) setConn('连接恢复了');
      updateRoomMeta();
      if (online.pollOn) schedulePoll();
    }).catch(function () {
      window.clearTimeout(timer);
      if (gen !== online.gen) return;
      online.polling = false;
      online.pollCtrl = null;
      if (!online.pollOn) return;
      online.pollFails++;
      if (online.pollFails >= 3 && mode === 'online' && online.room) {
        setConn('网络有点慢，正在自动重试…（也可点「重连」）');
      }
      online.pollDelay = online.pollFails <= 1 ? 1500 : Math.min(online.pollDelay * 2, 8000);
      updateRoomMeta();
      schedulePoll();
    });
  }

  /* 房间信息里常驻显示网络提示，卡的时候不用只盯着棋盘干等 */
  function netSuffix() {
    return online.pollFails >= 3 ? ' · 网络慢，正在自动重试（可点「重连」）' : '';
  }

  function updateRoomMeta() {
    if (!els.roomMeta || !online.room) return;
    els.roomMeta.textContent = (online.baseMeta || '') + netSuffix();
  }

  function setConn(text) {
    if (text) setStatus(text);
    updateRoomMeta();
  }

  /* 弱网看门狗：长时间收不到房间消息就重建连接（处理半开连接/静默断流） */
  function checkLink() {
    updateRoomMeta();
    if (!online.room || mode !== 'online') return;
    if (window.navigator && window.navigator.onLine === false) {
      setConn('网络断了，恢复后会自动重连（也可点「重连」）');
      return;
    }
    /* 轮询自己带超时和退避重试，已经处于轮询兜底时别再重建，避免把退避节奏重置成猛刷 */
    if (online.pollOn) return;
    /* 房主一个人等客时没有消息是正常的，放宽阈值并静默刷新，不打扰界面 */
    var alone = online.role === 'host' && !online.guestPid && !online.guestUid;
    var staleMs = alone ? LINK_STALE_MS * 3 : LINK_STALE_MS;
    if (Date.now() - online.lastHeard > staleMs) {
      if (!alone) setConn('连接卡住了，正在自动重连…（也可点「重连」）');
      restartStream();
    }
  }

  function startLinkWatch() {
    stopLinkWatch();
    online.lastHeard = Date.now();
    online.linkTimer = window.setInterval(checkLink, 6000);
  }

  function stopLinkWatch() {
    if (online.linkTimer) {
      window.clearInterval(online.linkTimer);
      online.linkTimer = 0;
    }
  }

  function restartStream() {
    if (online.room) subscribe(online.room);
  }

  /* 手动重连：卡住时不用干等，重建 SSE/轮询并主动要一次完整棋局状态 */
  function reconnectRoom() {
    if (!online.room) return;
    setConn('正在重连房间…');
    online.pollFails = 0;
    subscribe(online.room);
    window.setTimeout(function () {
      if (!online.room) return;
      if (online.role === 'host') broadcastState(true);
      else if (online.role === 'guest') publish({ t: 'sync', u: myUid(), p: myPid() });
    }, 350);
    window.setTimeout(function () {
      if (online.room) setConn('已重连，正在同步棋局…');
    }, 2500);
  }

  function createRoom(code) {
    ensureProfile();
    if (!code) code = makeRoomCode();
    online.uid = me.uid;
    online.role = 'host';
    online.hostUid = myUid();
    online.hostName = me.name;
    online.hostPid = myPid();
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.seen = {};
    online.denied = {};
    online.seq = 0;
    online.hostColor = BLACK;
    online.undoReq = '';
    newGame(false);
    subscribe(code);
    startLobbyPublish();
    refreshOnlineUI();
    setStatus('房间建好啦，把邀请发给朋友');
    window.setTimeout(function () { broadcastState(true); }, 260);
    /* P2P：房主提前发起 offer，访客进房后通过 hi 触发补发（见 handleMsg） */
    if (p2pCanUse()) {
      window.setTimeout(function () { if (online.role === 'host' && !p2pState.on) p2pStartHost(); }, 500);
    }
    if (presence.started) pushPresence();
    if (online.hbTimer) window.clearInterval(online.hbTimer);
    online.hbTimer = window.setInterval(function () {
      /* 没有对手时不用定时发全量状态，减少公共中转的消息量，避免被限流 */
      if (online.role === 'host' && (online.guestPid || online.guestUid)) broadcastState(false);
      /* 修复：访客崩溃后座位会永久占着，这里按心跳超时自动释放 */
      reclaimStaleGuest();
    }, 8000);
  }

  /* 修复：房间号填错/房主已离开时，申请人会永远停在“正在加入房间”且毫无反馈。
     加入后 12 秒内若没有收到房主的任何回执（st/ok/no/busy），给出明确提示。 */
  function armJoinWatch() {
    if (online.joinTimer) window.clearTimeout(online.joinTimer);
    online.joinHeard = false;
    online.joinTimer = window.setTimeout(function () {
      online.joinTimer = 0;
      if (online.joinHeard) return;
      if (!online.room || online.role === 'host' || online.role === 'guest') return;
      setStatus('没连上这个房间，房主可能已离开，确认下房间号再试试');
    }, 12000);
  }

  function joinRoom(code) {
    if (!code) return false;
    code = String(code).replace(/[^0-9]/g, '').slice(0, 6);
    if (code.length !== 6) {
      setStatus('房间号是 6 位数字哦');
      return false;
    }
    ensureProfile();
    online.uid = me.uid;
    online.role = 'spec';
    online.hostUid = '';
    online.hostName = '房主';
    online.hostPid = '';
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.seen = {};
    online.denied = {};
    online.seq = 0;
    online.hostColor = BLACK;
    online.undoReq = '';
    newGame(false);
    subscribe(code);
    refreshOnlineUI();
    setStatus('正在加入房间 ' + code + ' …');
    sendHi();
    armJoinWatch();
    if (presence.started) pushPresence();
    if (online.hbTimer) window.clearInterval(online.hbTimer);
    online.hbTimer = window.setInterval(sendHi, 12000);
    return true;
  }

  function sendHi() {
    if (!online.topic || online.role === 'host') return;
    publish({ t: 'hi', u: myUid(), p: myPid(), n: me.name });
  }

  /* 修复：访客关掉页面时房间座位会一直留着。
     原来只在点「离开」时发 bye；直接关标签页/杀进程就收不到，
     房主那边座位就一直被占着。
     这里用 sendBeacon 在页面隐藏/卸载时补发一条 bye（页面正在关闭时也能发出去）。 */
  function sendByeBeacon() {
    if (!online.topic || online.role === 'host') return;
    var payload = JSON.stringify({ t: 'bye', u: myUid(), p: myPid() });
    /* P2P 已连通：优先通过 DataChannel 发 bye，对方立刻能收到 */
    if (p2pState.on && p2pState.dc) {
      p2pSend({ t: 'bye', u: myUid(), p: myPid(), mid: newMid() });
      return;
    }
    try {
      if (navigator.sendBeacon) {
        var ok = navigator.sendBeacon(RELAY + online.topic, new Blob([payload], { type: 'text/plain' }));
        if (ok) return;
      }
    } catch (e) { /* ignore */ }
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', RELAY + online.topic, true);
      xhr.setRequestHeader('Content-Type', 'text/plain');
      xhr.send(payload);
    } catch (e) { /* ignore */ }
  }

  function leaveRoom(silent) {
    throttlePresence(false); /* 离房恢复好友在线感知频率 */
    stopLobbyPublish(true);
    closeLobby();
    if (online.topic && !silent) {
      /* P2P 已连通：直接走 DataChannel 发 bye；否则走 ntfy */
      if (p2pState.on && p2pState.dc) {
        p2pSend({ t: 'bye', u: myUid(), p: myPid(), mid: newMid() });
      } else {
        publish({ t: 'bye', u: myUid(), p: myPid() });
      }
    }
    closeStream();
    /* P2P：彻底关闭 PeerConnection 与 DataChannel，避免泄漏连接 */
    p2pStop();
    if (online.hbTimer) {
      window.clearInterval(online.hbTimer);
      online.hbTimer = 0;
    }
    if (online.joinTimer) { window.clearTimeout(online.joinTimer); online.joinTimer = 0; }
    online.joinHeard = false;
    online.room = '';
    online.topic = '';
    online.role = 'none';
    online.hostUid = '';
    online.hostPid = '';
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.seen = {};
    online.denied = {};
    online.seenMids = [];
    online.lastSeq = -1;
    online.lastTs = 0;
    online.undoReq = '';
    online.baseMeta = '';
    if (online.stateTimer) { window.clearTimeout(online.stateTimer); online.stateTimer = 0; }
    refreshOnlineUI();
    if (presence.started) pushPresence();
  }

  /* ---------------- 房间大厅 ---------------- */

  function lobbyHeartbeat() {
    if (!online.room || online.role !== 'host') return;
    publishTopic(LOBBY_TOPIC, {
      t: 'lobby', r: online.room, n: me.name || '房主', p: myPid(),
      s: N, g: online.guestPid ? 1 : 0, ts: Date.now()
    });
  }

  function startLobbyPublish() {
    stopLobbyPublish(false);
    if (!online.room || online.role !== 'host') return;
    lobbyHeartbeat();
    lobby.pubTimer = window.setInterval(lobbyHeartbeat, 6000);
  }

  function stopLobbyPublish(withOut) {
    if (lobby.pubTimer) {
      window.clearInterval(lobby.pubTimer);
      lobby.pubTimer = 0;
    }
    if (withOut && online.room && online.role === 'host') {
      publishTopic(LOBBY_TOPIC, { t: 'lobby-out', r: online.room, p: myPid(), ts: Date.now() });
    }
  }

  function openLobby() {
    if (!els.roomLobby) return;
    if (mode !== 'online') forceMode('online');
    lobby.open = true;
    els.roomLobby.classList.add('on');
    els.roomLobby.setAttribute('aria-hidden', 'false');
    if (els.lobbySub) els.lobbySub.textContent = '正在刷新…';
    if (els.lobbyList) els.lobbyList.innerHTML = '<div class="lobby-empty">正在找房间…</div>';
    pollLobby();
    if (lobby.listTimer) window.clearInterval(lobby.listTimer);
    lobby.listTimer = window.setInterval(pollLobby, 5000);
  }

  function closeLobby() {
    lobby.open = false;
    if (els.roomLobby) {
      els.roomLobby.classList.remove('on');
      els.roomLobby.setAttribute('aria-hidden', 'true');
    }
    if (lobby.listTimer) {
      window.clearInterval(lobby.listTimer);
      lobby.listTimer = 0;
    }
  }

  function pollLobby() {
    if (lobby.loading) return;
    lobby.loading = true;
    timedFetch(RELAY + LOBBY_TOPIC + '/json?poll=1&since=45s', { cache: 'no-store' }, REQUEST_TIMEOUT_MS)
      .then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.text();
      })
      .then(function (txt) { parseLobby(txt); })
      .catch(function () {
        if (lobby.open && els.lobbySub) els.lobbySub.textContent = '大厅连不上，稍后再试';
      })
      .then(function () { lobby.loading = false; });
  }

  function parseLobby(txt) {
    var map = {};
    var lines = String(txt || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/^\s+|\s+$/g, '');
      if (!line) continue;
      var outer;
      try { outer = JSON.parse(line); } catch (e) { continue; }
      if (!outer || outer.event !== 'message' || typeof outer.message !== 'string') continue;
      var m;
      try { m = JSON.parse(outer.message); } catch (e) { continue; }
      if (!m || (m.t !== 'lobby' && m.t !== 'lobby-out')) continue;
      var code = String(m.r || '');
      if (!/^[0-9]{6}$/.test(code)) continue;
      var when = typeof outer.time === 'number' ? outer.time : Math.floor((m.ts || 0) / 1000);
      if (map[code] && map[code].when > when) continue;
      map[code] = {
        code: code,
        name: String(m.n || '房主').slice(0, 16),
        size: Number(m.s) || 0,
        full: !!m.g,
        pid: String(m.p || ''),
        when: when,
        out: m.t === 'lobby-out'
      };
    }
    var list = [];
    for (var code2 in map) {
      if (!Object.prototype.hasOwnProperty.call(map, code2)) continue;
      var it = map[code2];
      if (it.out) continue;
      if (it.code === online.room) continue;
      if (it.pid && it.pid === myPid()) continue;
      list.push(it);
    }
    list.sort(function (a, b) { return b.when - a.when; });
    lobby.items = list.slice(0, 20);
    renderLobby();
  }

  function renderLobby() {
    if (!els.lobbyList) return;
    if (els.lobbySub) {
      els.lobbySub.textContent = lobby.items.length
        ? ('共 ' + lobby.items.length + ' 个房间，点「加入」等房主同意')
        : '看看谁在开房';
    }
    els.lobbyList.innerHTML = '';
    if (!lobby.items.length) {
      var empty = document.createElement('div');
      empty.className = 'lobby-empty';
      empty.textContent = '现在还没有人开房间\n点「创建房间」，朋友就能在这里看到你';
      els.lobbyList.appendChild(empty);
      return;
    }
    for (var i = 0; i < lobby.items.length; i++) {
      (function (it) {
        var row = document.createElement('div');
        row.className = 'lobby-item';
        var ava = document.createElement('div');
        ava.className = 'lobby-ava';
        ava.textContent = (it.name || '房').charAt(0);
        var info = document.createElement('div');
        info.className = 'lobby-info';
        var nm = document.createElement('div');
        nm.className = 'lobby-name';
        nm.textContent = it.name + ' 的房间';
        var sub = document.createElement('small');
        sub.textContent = '房间 ' + it.code + (it.size ? (' · ' + it.size + ' 路') : '') + (it.full ? ' · 对局中' : ' · 等待加入');
        info.appendChild(nm);
        info.appendChild(sub);
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mini-btn coral';
        btn.textContent = it.full ? '对局中' : '加入';
        btn.disabled = !!it.full;
        if (!it.full) {
          btn.addEventListener('click', function () { enterLobbyRoom(it); });
        }
        row.appendChild(ava);
        row.appendChild(info);
        row.appendChild(btn);
        els.lobbyList.appendChild(row);
      })(lobby.items[i]);
    }
  }

  function enterLobbyRoom(it) {
    if (!it || !it.code) return;
    closeLobby();
    if (mode !== 'online') forceMode('online');
    joinRoom(it.code);
    setStatus('已向 ' + (it.name || '房主') + ' 发出加入请求，等对方同意…');
  }

  function handleMsg(raw) {
    var m = raw;
    if (typeof raw === 'string') {
      try { m = JSON.parse(raw); } catch (e) { return; }
    }
    if (!m || typeof m !== 'object' || !m.t) return;
    online.lastHeard = Date.now();
    /* WebRTC 信令：房主/访客建连时交换 SDP 与 ICE；P2P 连通后信令自动忽略 */
    if (m.t === 'sdp-offer' || m.t === 'sdp-answer' || m.t === 'ice') {
      if (!p2pState.on) p2pOnSignal(m);
      return;
    }
    /* 房主回执到达（状态/同意/拒绝/已满），撤销“没连上房间”的超时提示 */
    if (online.joinTimer && (m.t === 'st' || m.t === 'ok' || m.t === 'no' || m.t === 'busy')) {
      online.joinHeard = true;
    }
    /* 弱网重试/轮询和 SSE 可能收到同一条消息，用 mid 去重，避免重复落子 */
    if (m.mid) {
      if (online.seenMids.indexOf(m.mid) >= 0) return;
      online.seenMids.push(m.mid);
      if (online.seenMids.length > 160) online.seenMids.shift();
    }
    if (m.t === 'hi') {
      var hid = m.p || m.u;
      if (!hid || hid === myPid()) return;
      online.seen[hid] = { n: m.n || '朋友', ts: Date.now(), p: m.p || '', u: m.u || '' };
      if (online.role === 'host') {
        /* 修复：房间已有对手时原先静默忽略申请，申请人永远停在“正在加入房间”且毫无提示 */
        if ((online.guestPid || online.guestUid) && hid !== online.guestPid && m.u !== online.guestUid) {
          publish({ t: 'busy', u: m.u || '', p: m.p || '', b: online.hostUid });
        }
        renderPending();
        refreshOnlineUI();
        broadcastState(false);
        /* P2P：房主收到访客 hi 时补发 offer，覆盖访客比 offer 更早到达的情况 */
        if (p2pCanUse() && !p2pState.on && !p2pState.pc) {
          p2pStartHost();
        }
      }
      return;
    }
    if (m.t === 'mv') {
      if (online.role !== 'host') return;
      if (!isGuestMsg(m)) return;
      var bad = over || turn !== friendColor() || m.q !== online.seq;
      if (!bad && (typeof m.x !== 'number' || typeof m.y !== 'number')) bad = true;
      if (!bad && (!inBoard(m.x, m.y) || at(m.x, m.y))) bad = true;
      if (bad) {
        /* 朋友已先本地落子：驳回后立刻回推真实盘面，让他回滚重画 */
        if (!over) {
          online.seq++;
          broadcastState(true);
        }
        return;
      }
      place(m.x, m.y);
      return;
    }
    if (m.t === 'pass') {
      if (online.role !== 'host') return;
      if (!isGuestMsg(m)) return;
      if (over || turn !== friendColor() || m.q !== online.seq) {
        if (!over) {
          online.seq++;
          broadcastState(true);
        }
        return;
      }
      doPass(true);
      return;
    }

    if (m.t === 'sync') {
      if (online.role === 'host' && isGuestMsg(m)) broadcastState(true);
      return;
    }
    if (m.t === 'ok') {
      if (online.role === 'host') return;
      if ((m.gp && m.gp === myPid()) || (!m.gp && m.u === myUid())) {
        online.role = 'guest';
        if (m.b) online.hostUid = m.b;
        if (m.bp) online.hostPid = m.bp;
        online.guestUid = myUid();
        online.guestPid = myPid();
        setStatus('房主同意啦，你执' + (myColor() === BLACK ? '黑' : '白') + '！');
        /* 房主同意后会立刻广播 st，回合文案会把入座确认秒覆盖——锁定几秒让用户看清 */
        online.statusLockUntil = Date.now() + 4000;
        refreshOnlineUI();
      }
      return;
    }
    if (m.t === 'no') {
      if (online.role === 'host') return;
      if ((m.gp && m.gp === myPid()) || (!m.gp && m.u === myUid())) {
        online.role = 'spec';
        setStatus('房主拒绝了你，先观战啦');
        refreshOnlineUI();
      }
      return;
    }
    if (m.t === 'busy') {
      /* 房主回执：房间已有人。申请人据此离开“正在加入房间”的死等状态 */
      if ((m.p && m.p === myPid()) || (!m.p && m.u === myUid())) {
        setStatus('这个房间已经有人啦，去「房间」列表看看别的吧');
      }
      return;
    }
    if (m.t === 'kick') {
      if (online.role === 'host') return;
      if ((m.gp && m.gp === myPid()) || (!m.gp && m.u === myUid())) {
        /* 被房主移出：彻底释放座位（转观战），并停掉心跳，
           否则还会继续占着对方的名额发心跳 */
        online.role = 'spec';
        online.guestPid = '';
        online.guestUid = '';
        online.guestName = '';
        if (online.hbTimer) { window.clearInterval(online.hbTimer); online.hbTimer = 0; }
        setStatus('房主让你先观战啦');
        refreshOnlineUI();
        updateTurnUI();
      }
      return;
    }
    if (m.t === 'undo') {
      if (online.role === 'host' && isGuestMsg(m)) {
        online.undoReq = idOf(m);
        renderUndoAsk();
      }
      return;
    }
    if (m.t === 'undo-ok') {
      if (online.role === 'host') return;
      if ((m.gp && m.gp === myPid()) || (!m.gp && m.u === myUid())) setStatus('房主已同意，已成功悔棋');
      return;
    }
    if (m.t === 'undo-no') {
      if (online.role === 'host') return;
      if ((m.gp && m.gp === myPid()) || (!m.gp && m.u === myUid())) setStatus('房主已拒绝你，暂时无法悔棋');
      return;
    }
    if (m.t === 'bye') {
      if (online.role === 'host' && isGuestMsg(m)) {
        online.guestUid = '';
        online.guestName = '';
        online.guestPid = '';
        online.seq++;
        renderPending();
        refreshOnlineUI();
        updateTurnUI();
        broadcastState(true);
      } else if (online.role !== 'host' && (m.p === online.hostPid || (!m.p && m.u === online.hostUid))) {
        closeStream();
        if (online.hbTimer) { window.clearInterval(online.hbTimer); online.hbTimer = 0; }
        online.role = 'none';
        online.room = '';
        online.topic = '';
        refreshOnlineUI();
        setStatus('房主关闭了房间');
        showBanner('房间已关闭', '可以自己创建一个新房间');
      }
      return;
    }
    if (m.t === 'st') {
      /* 修复：建房时若收到对端的状态广播，说明这个房间号已经被人占用，
         换一个号重建，避免两个房主互相覆盖状态。 */
      if (online.roomProbe && !online.roomProbe.done && Date.now() < online.roomProbe.until) {
        if (m.bp && m.bp === myPid()) { online.roomProbe.done = true; }
        else if (m.b && m.b !== myUid()) { onRoomProbeConflict(); return; }
        else if (m.b) { onRoomProbeConflict(); return; }
      }
      applyRemoteState(m);
      return;
    }
  }

  /* ntfy.sh 单条消息上限 4096 字节。19 路长对局的全量 mv 数组可能超过这个限制，
     服务端会直接 413，表现就是“突然同步不动了”。超过阈值时改用紧凑编码：
     每手 3 个字符（x/y 用 36 进制，虚手用 z，颜色 1/2）。 */
  function utf8ByteLen(text) {
    try { return new Blob([text]).size; } catch (e) { return String(text).length * 3; }
  }

  var MOVE_CHARS = '0123456789abcdefghijklmnopqrstuvwxyz';

  function encodeMoves(mv) {
    var out = '';
    for (var i = 0; i < mv.length; i++) {
      var a = mv[i];
      var pass = (a[0] === -1 && a[1] === -1);
      out += (pass ? 'z' : MOVE_CHARS.charAt(a[0])) +
             (pass ? 'z' : MOVE_CHARS.charAt(a[1])) +
             (a[2] === WHITE ? '2' : '1');
    }
    return out;
  }

  function decodeMoves(str) {
    var out = [];
    for (var i = 0; i + 2 < str.length; i += 3) {
      var xc = str.charAt(i), yc = str.charAt(i + 1), cc = str.charAt(i + 2);
      var c = cc === '2' ? WHITE : BLACK;
      if (xc === 'z' && yc === 'z') { out.push([-1, -1, c]); continue; }
      var x = parseInt(xc, 36), y = parseInt(yc, 36);
      if (isNaN(x) || isNaN(y)) continue;
      out.push([x, y, c]);
    }
    return out;
  }

  function buildState() {
    var mv = [];
    for (var i = 0; i < moves.length; i++) {
      var m = moves[i];
      mv.push(m.pass ? [-1, -1, m.c] : [m.x, m.y, m.c]);
    }
    var st = {
      t: 'st', q: online.seq, n: N, mv: mv,
      b: online.hostUid, bn: online.hostName, bp: online.hostPid || '',
      w: online.guestUid || '', wn: online.guestName || '', gp: online.guestPid || '',
      hc: online.hostColor,
      u: turn, o: over ? 1 : 0, wi: winner || 0, sc: scoreRes,
      wq: (over && winner) ? (winner === online.hostColor ? online.hostUid : online.guestUid) : '',
      wqp: (over && winner) ? winnerPidOf(winner) : ''
    };
    if (utf8ByteLen(JSON.stringify(st)) > 3800) {
      st.mv = encodeMoves(mv);
      st.mvc = 1;
    }
    return st;
  }

  function broadcastState(force) {
    if (online.role !== 'host' || !online.topic) return;
    var now = Date.now();
    if (!force && now - online.lastStateAt < 1200) {
      if (!online.stateTimer) {
        online.stateTimer = window.setTimeout(function () {
          online.stateTimer = 0;
          broadcastState(true);
        }, 1200);
      }
      return;
    }
    online.lastStateAt = now;
    publish(buildState());
  }

  /* 角色按设备 pid 判定：同一账号两台设备也能分清谁是房主、谁是对手 */
  function roleFromState() {
    if (online.hostPid && myPid() === online.hostPid) return 'host';
    if (online.guestPid && myPid() === online.guestPid) return 'guest';
    if (!online.hostPid && online.hostUid && myUid() === online.hostUid) return 'host';
    if (!online.guestPid && online.guestUid && myUid() === online.guestUid) return 'guest';
    return 'spec';
  }

  function applyRemoteState(st) {
    if (typeof st.q !== 'number') return;
    if (replay.on) {
      online.lastState = Date.now();
      return;
    }
    if (st.q <= online.lastSeq) {
      online.lastState = Date.now();
      if (st.bn) online.hostName = st.bn;
      if (st.wn) online.guestName = st.wn;
      if (st.bp) online.hostPid = st.bp;
      if (st.gp) online.guestPid = st.gp;
      if (st.b) online.hostUid = st.b;
      if (st.w) online.guestUid = st.w;
      if (st.hc) online.hostColor = st.hc === WHITE ? WHITE : BLACK;
      online.role = roleFromState();
      updateTurnUI();
      refreshOnlineUI();
      return;
    }
    if (online.role === 'host' && ((st.bp && st.bp === myPid()) || (!st.bp && st.b === myUid()))) {
      online.lastSeq = st.q;
      online.seq = st.q;
      online.lastState = Date.now();
      return;
    }
    online.lastSeq = st.q;
    online.seq = st.q;
    online.lastState = Date.now();
    online.hostUid = st.b || '';
    online.hostName = st.bn || '房主';
    online.hostPid = st.bp || online.hostPid || '';
    online.guestUid = st.w || '';
    online.guestName = st.wn || '';
    online.guestPid = st.gp || online.guestPid || '';
    online.role = roleFromState();
    if (st.hc) online.hostColor = st.hc === WHITE ? WHITE : BLACK;

    var sizeChanged = (N !== (st.n || N));
    if (sizeChanged) {
      /* 修复：原代码 N = st.n || N 未做范围校验，异常包可让 N 变成极大值 */
      var newN = st.n || N;
      if (newN !== 9 && newN !== 13 && newN !== 19) newN = N;
      N = newN;
      saveSettings();
      updateSegmentStates();
    }
    var remoteMoves = [];
    var rawMv = st.mv || [];
    if (st.mvc && typeof rawMv === 'string') rawMv = decodeMoves(rawMv);
    for (var mi = 0; mi < rawMv.length; mi++) {
      var a = rawMv[mi];
      if (!a) continue;
      /* 修复：越界坐标一律丢弃，避免污染棋盘。
         注意虚手用 [-1,-1,c] 作哨兵，必须先判定 pass 再做坐标范围校验，
         否则 a[1] === -1 会被 a[1] < 0 拦掉 -> 远端虚手丢失，
         连虚手永远达不到 2 次，对局卡在"永远不终局"。 */
      var isPass = (a[0] === -1 && a[1] === -1);
      if (!isPass) {
        if (a[0] < 0 || a[0] >= N || a[1] < 0 || a[1] >= N) continue;
      }
      remoteMoves.push({ x: isPass ? -1 : a[0], y: isPass ? -1 : a[1], c: a[2], pass: isPass });
    }
    var wasOver = over;
    var pendingWin = online.recordPending;
    online.recordPending = false;
    rebuild(remoteMoves);
    if (st.o) {
      over = true;
      winner = st.wi || 0;
      scoreRes = st.sc || null;
      if ((!wasOver || pendingWin) && online.role !== 'spec') recordNow();
      var subText = resultSub(scoreRes);
      {
        var wq = (typeof st.wq === 'string' && st.wq) ? st.wq : winnerUidOf(winner);
        var wqp = (typeof st.wqp === 'string' && st.wqp) ? st.wqp : winnerPidOf(winner);
        var iWin = wqp ? wqp === myPid() : (!!wq && wq === myUid());
        var winName = nameOf(wqp || wq);
        if (online.role === 'spec' && winner) {
          showBanner(winName + ' 赢啦', subText);
        } else if (winner === 0) {
          setMood('calm');
          showBanner('平局啦', subText);
        } else if (iWin) {
          setMood('happy');
          showBanner('你赢啦！', subText);
        } else {
          setMood('oops');
          showBanner(winName + ' 赢啦', subText);
        }
      }
    } else {
      over = false;
      winner = 0;
      scoreRes = null;
      if (wasOver) hideBanner();
    }
    if (sizeChanged) relayout(); else draw();
    updateTurnUI();
    refreshOnlineUI();
    if (!over) {
      /* 一次性提示（如入座确认）锁定期内不覆盖，几秒后由下一次 st 自然纠正 */
      if (Date.now() >= (online.statusLockUntil || 0)) {
        if (online.role === 'host') setStatus(turn === myColor() ? '轮到你啦' : '等朋友落子…');
        else if (online.role === 'guest') setStatus(turn === myColor() ? '轮到你啦' : '等房主落子…');
        else setStatus('观战中 · 等他们下棋');
      }
    }
  }

  function refreshOnlineUI() {
    if (!els.onlinePanel) return;
    els.onlinePanel.classList.toggle('on', mode === 'online');
    var inRoom = !!online.room;
    if (els.onlineEmpty) els.onlineEmpty.style.display = inRoom ? 'none' : 'flex';
    if (els.onlineRoom) els.onlineRoom.hidden = !inRoom;
    if (els.spectatorBadge) {
      els.spectatorBadge.classList.toggle('on', mode === 'online' && inRoom && online.role === 'spec');
    }
    updateTurnUI();
    if (!inRoom) {
      renderPending();
      renderUndoAsk();
      return;
    }
    if (els.roomCode) els.roomCode.textContent = online.room;
    var people = countWatchers();
    var selfName = me.name || '我';
    var mine = myColor() === BLACK ? '执黑' : '执白';
    var meta = '';
    if (online.role === 'host') {
      meta = '你（' + selfName + '）' + mine + ' · ' + (online.guestPid || online.guestUid ? ('对手：' + nameOf(online.guestPid || online.guestUid)) : '等朋友上桌');
    } else if (online.role === 'guest') {
      meta = '你（' + selfName + '）' + mine + ' · 房主：' + online.hostName;
    } else {
      meta = '观战中 · 房主：' + online.hostName + (online.guestPid || online.guestUid ? (' · 朋友：' + nameOf(online.guestPid || online.guestUid)) : '');
    }
    if (online.role !== 'host' && people > 0) meta += ' · 一起观战 ' + people + ' 人';
    online.baseMeta = meta;
    if (els.roomMeta) els.roomMeta.textContent = meta + netSuffix();
    if (els.roomTools) els.roomTools.classList.toggle('on', online.role === 'host');
    if (els.kickGuestBtn) els.kickGuestBtn.hidden = !(online.role === 'host' && online.guestPid);
    if (els.colorHint) els.colorHint.textContent = online.hostColor === BLACK ? '现在执黑先手' : '现在执白后手';
    renderPending();
    renderUndoAsk();
  }

  function countWatchers() {
    var now = Date.now();
    var n = 0;
    for (var uid in online.seen) {
      if (!Object.prototype.hasOwnProperty.call(online.seen, uid)) continue;
      if (uid === myPid() || uid === online.hostPid || uid === online.guestPid) continue;
      if (uid === myUid() || uid === online.hostUid || uid === online.guestUid) continue;
      if (now - online.seen[uid].ts < 25000) n++;
    }
    return n;
  }

  function renderPending() {
    if (!els.pendingList) return;
    els.pendingList.innerHTML = '';
    if (online.role !== 'host' || online.guestPid || over) return;
    var picked = 0;
    for (var uid in online.seen) {
      if (!Object.prototype.hasOwnProperty.call(online.seen, uid)) continue;
      if (uid === myPid() || uid === online.hostPid || uid === online.guestPid) continue;
      if (online.denied[uid]) continue;
      if (Date.now() - online.seen[uid].ts > 60000) continue;
      if (picked >= 3) break;
      picked++;
      (function (who) {
        var item = document.createElement('div');
        item.className = 'pending-item';
        var name = document.createElement('span');
        name.textContent = nameOf(who) + ' 申请加入';
        var okBtn = document.createElement('button');
        okBtn.type = 'button';
        okBtn.className = 'mini-btn coral';
        okBtn.textContent = '同意';
        okBtn.addEventListener('click', function () { approve(who, ''); });
        var noBtn = document.createElement('button');
        noBtn.type = 'button';
        noBtn.className = 'mini-btn ghost';
        noBtn.textContent = '拒绝';
        noBtn.addEventListener('click', function () { deny(who); });
        item.appendChild(name);
        item.appendChild(okBtn);
        item.appendChild(noBtn);
        els.pendingList.appendChild(item);
      })(uid);
    }
  }

  function approve(id, name) {
    if (online.role !== 'host' || online.guestPid) return;
    var s = online.seen[id] || {};
    online.guestPid = id;
    online.guestUid = s.u || (s.p ? '' : id);
    online.guestName = name || nameOf(id);
    online.guestSince = Date.now();
    publish({ t: 'ok', u: online.guestUid || id, b: online.hostUid, bp: online.hostPid || myPid(), gp: id });
    online.seq++;
    renderPending();
    refreshOnlineUI();
    updateTurnUI();
    broadcastState(true);
    lobbyHeartbeat();
    setStatus('同意 ' + nameOf(id) + ' 一起下棋');
  }

  function deny(id) {
    if (online.role !== 'host') return;
    online.denied[id] = 1;
    var s = online.seen[id] || {};
    publish({ t: 'no', u: s.u || id, gp: id });
    online.seen[id] = { n: s.n || '朋友', ts: Date.now(), p: s.p || '', u: s.u || '' };
    renderPending();
    refreshOnlineUI();
  }

  function renderUndoAsk() {
    if (!els.undoAsk) return;
    var show = online.role === 'host' && !!online.undoReq && !over;
    els.undoAsk.hidden = !show;
    if (show && els.undoAskText) els.undoAskText.textContent = nameOf(online.undoReq) + ' 请求悔棋';
  }

  function answerUndo(ok) {
    var who = online.undoReq;
    if (!who) return;
    online.undoReq = '';
    renderUndoAsk();
    publish({ t: ok ? 'undo-ok' : 'undo-no', u: online.guestUid || who, gp: online.guestPid || who });
    if (!ok) {
      setStatus('已拒绝悔棋，朋友暂时无法悔棋');
      return;
    }
    var back = Math.min(2, moves.length);
    rebuild(moves.slice(0, moves.length - back));
    online.seq++;
    broadcastState(true);
    setStatus('已同意悔棋，已成功悔棋');
  }

  function swapHostColor() {
    if (online.role !== 'host' || !online.room) return;
    if (moves.length !== 0) {
      setStatus('已经开局啦，想换颜色就先重开一局');
      return;
    }
    online.hostColor = online.hostColor === BLACK ? WHITE : BLACK;
    online.seq++;
    updateTurnUI();
    refreshOnlineUI();
    broadcastState(true);
    setStatus(online.hostColor === BLACK ? '现在你执黑，先手' : '现在你执白，朋友先手');
  }

  function inviteLink() {
    var base = String(window.location.href || '').split('#')[0].split('?')[0];
    return base + '?room=' + online.room;
  }

  function copyText(text) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(fallbackCopy(text)); });
      } else {
        resolve(fallbackCopy(text));
      }
    });
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) { return false; }
  }

  /* ---------- 身份 ---------- */
  function lsFirst(keys) {
    for (var i = 0; i < keys.length; i++) {
      try { var v = window.localStorage.getItem(keys[i]); if (v) return v; } catch (e) { /* ignore */ }
    }
    return '';
  }

  function saveSharedIdentity() {
    try {
      window.localStorage.setItem('idol_uid', me.uid);
      window.localStorage.setItem('idol_name', me.name);
      window.localStorage.setItem('idol_face', me.face || '');
      window.localStorage.setItem(PID_KEY, me.pid);
    } catch (e) { /* ignore */ }
  }

  function initIdentity() {
    var saved = lsFirst(['idol_uid', 'gm_uid', 'go_uid']);
    var cachedName = lsFirst(['idol_name', 'go_name', 'gm_name']);
    me.uid = saved || ('g' + Math.random().toString(36).slice(2, 8));
    me.name = (cachedName && cachedName.length <= 24) ? cachedName : ('游客' + me.uid.slice(1, 5).toUpperCase());
    me.pid = lsFirst([PID_KEY, 'go_pid_v1', 'gomoku_pid_v1']);
    if (!me.pid) {
      me.pid = 'p' + Math.random().toString(36).slice(2, 9);
    }
    me.face = lsFirst(['idol_face', 'go_face', 'gm_face']);
    online.uid = me.uid;
    saveSharedIdentity();
    showOpenApp();
    if (els.openAppBtn) {
      els.openAppBtn.addEventListener('click', function () {
        if (IS_MOBILE && !IN_APP) openInBiliApp();
        else ensureProfile();
      });
    }
  }

  function showOpenApp() {
    if (!els.openAppBtn) return;
    els.openAppBtn.hidden = false;
    els.openAppBtn.textContent = (IS_MOBILE && !IN_APP) ? '用B站打开' : '登录';
    if (els.userMe) els.userMe.hidden = true;
  }

  function openInBiliApp() {
    var web = 'https://www.bilibili.com/toy/idol-go/index.html';
    var deep = 'bilibili://toy/detail/49760694176768';
    var left = false;
    var start = Date.now();
    function onHide() { if (document.hidden) left = true; }
    function go(url) {
      try {
        if (window.self !== window.top) { window.top.location.href = url; return; }
      } catch (e) { /* 跨域时退回自身 */ }
      try { window.location.href = url; } catch (e) { /* ignore */ }
    }
    try {
      document.addEventListener('visibilitychange', onHide);
      go(deep);
    } catch (e) { /* ignore */ }
    window.setTimeout(function () {
      try { document.removeEventListener('visibilitychange', onHide); } catch (e) { /* ignore */ }
      if (!left && Date.now() - start > 900) go(web);
    }, 1100);
  }

  function goToToy(url) {
    if (!url) return;
    try {
      if (window.self !== window.top) {
        window.top.location.href = url;
        return;
      }
    } catch (e) { /* 跨域时退回自身 */ }
    try { window.location.href = url; } catch (e2) { /* ignore */ }

            } else {

              return;
            }
          } catch (e) { /* 跨域时退回自身 */ }
          window.setTimeout(function () {

  function startReplay(rec) {
    if (!rec || !rec.mv || !rec.mv.length) {
      setStatus('还没有对局记录，先下一局吧');
      return;
    }
    if (replay.on) stopReplay();
    aiToken++;
    thinking = false;
    replay.on = true;
    replay.rec = rec;
    replay.list = rec.mv.slice();
    replay.idx = 0;
    replay.saved = {
      N: N, moves: moves.slice(), turn: turn, over: over, winner: winner,
      scoreRes: scoreRes,
      bannerOn: !!(els.winBanner && els.winBanner.classList.contains('show')),
      title: els.bannerTitle ? els.bannerTitle.textContent : '',
      sub: els.bannerSub ? els.bannerSub.textContent : '',
      status: els.status ? els.status.textContent : ''
    };
    hideBanner();
    if (els.actionRow) els.actionRow.hidden = true;
    if (els.replayActions) els.replayActions.hidden = false;
    if (els.rpPlay) els.rpPlay.textContent = '播放';
    applyReplayFrame();
    replayPlay();
  }

  function applyReplayFrame() {
    var rec = replay.rec;
    if (!rec) return;
    var sizeChanged = (N !== (rec.n || N));
    N = rec.n || N;
    var sub = [];
    for (var k = 0; k < replay.idx; k++) {
      var a = replay.list[k];
      if (!a) continue;
      sub.push({ x: a[0], y: a[1], c: a[2], pass: a[0] < 0 });
    }
    rebuild(sub);
    over = false;
    winner = 0;
    scoreRes = null;
    if (replay.idx >= replay.list.length) {
      over = true;
      winner = rec.wi || 0;
      scoreRes = rec.sc || null;
      updateTurnUI();
      draw();
    }
    if (sizeChanged) relayout();
    if (els.rpPrev) els.rpPrev.disabled = replay.idx <= 0;
    if (els.rpNext) els.rpNext.disabled = replay.idx >= replay.list.length;
    var tag = '';
    if (replay.idx >= replay.list.length) {
      tag = winner === BLACK ? ' · 黑棋胜' : (winner === WHITE ? ' · 白棋胜' : ' · 平局');
    }
    setStatus('回放中 · 第 ' + replay.idx + ' / ' + replay.list.length + ' 手' + tag);
  }

  function replayPlay() {
    if (!replay.on) return;
    if (replay.timer) {
      window.clearInterval(replay.timer);
      replay.timer = 0;
      replay.playing = false;
      if (els.rpPlay) els.rpPlay.textContent = '播放';
      return;
    }
    if (replay.idx >= replay.list.length) {
      replay.idx = 0;
      applyReplayFrame();
    }
    replay.playing = true;
    if (els.rpPlay) els.rpPlay.textContent = '暂停';
    replay.timer = window.setInterval(function () {
      if (!replay.on || replay.idx >= replay.list.length) {
        window.clearInterval(replay.timer);
        replay.timer = 0;
        replay.playing = false;
        if (els.rpPlay) els.rpPlay.textContent = '播放';
        return;
      }
      replay.idx++;
      applyReplayFrame();
    }, 480);
  }

  function replayStep(d) {
    if (!replay.on) return;
    if (replay.timer) {
      window.clearInterval(replay.timer);
      replay.timer = 0;
      replay.playing = false;
      if (els.rpPlay) els.rpPlay.textContent = '播放';
    }
    var len = replay.list.length;
    replay.idx = Math.max(0, Math.min(len, replay.idx + d));
    applyReplayFrame();
  }

  function stopReplay() {
    if (!replay.on) return;
    if (replay.timer) {
      window.clearInterval(replay.timer);
      replay.timer = 0;
    }
    replay.on = false;
    replay.playing = false;
    replay.rec = null;
    replay.list = [];
    replay.idx = 0;
    if (els.rpPlay) els.rpPlay.textContent = '播放';
    if (els.actionRow) els.actionRow.hidden = false;
    if (els.replayActions) els.replayActions.hidden = true;
    var s = replay.saved;
    replay.saved = null;
    if (!s) return;
    N = s.N;
    rebuild(s.moves);
    over = s.over;
    winner = s.winner;
    scoreRes = s.scoreRes;
    updateTurnUI();
    draw();
    if (s.bannerOn) showBanner(s.title, s.sub);
    if (s.status) setStatus(s.status);
    if (!over && mode === 'ai' && turn === WHITE) scheduleAI();
  }
