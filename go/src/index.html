<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#eaf8ff" />
<title>小偶像围棋</title>
<script src="https://s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
<style>
:root{
  --ink:#33405c;
  --ink-soft:#7889a8;
  --sun:#ffc94d;
  --sun-deep:#f0a93a;
  --sky:#6fc9ff;
  --sky-deep:#45aee6;
  --sky-soft:#e6f6ff;
  --coral:#ff8fa3;
  --coral-deep:#e86a86;
  --mint:#6bdcbf;
  --wood:#e9c48a;
  --wood-deep:#d7a962;
  --card:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;min-height:100%;display:flex;flex-direction:column;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 12% 2%, #ffffff 0%, rgba(255,255,255,0) 38%),
    radial-gradient(circle at 86% 8%, #d6f1ff 0%, rgba(214,241,255,0) 42%),
    radial-gradient(circle at 50% 108%, #ffeecb 0%, rgba(255,238,203,0) 56%),
    linear-gradient(170deg,#eaf8ff 0%,#fff1f7 52%,#fff8ea 100%);
  background-attachment:fixed;overflow-x:hidden;
}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.75;filter:blur(.5px)}
.c1{width:150px;height:76px;left:-42px;top:6%;box-shadow:60px 14px 0 -6px #fff,110px -2px 0 -14px #fff}
.c2{width:120px;height:60px;right:-30px;top:22%;box-shadow:-46px 12px 0 -8px #fff}
.c3{width:170px;height:80px;left:46%;bottom:-46px;transform:translateX(-50%)}
.dot{position:absolute;font-size:14px;color:#ffbfd0;animation:bob 7s ease-in-out infinite}
.d1{left:7%;top:14%}
.d2{right:9%;top:34%;color:#9fdcff;animation-delay:-2s;font-size:12px}
.d3{left:14%;bottom:20%;color:#ffd98c;animation-delay:-4s;font-size:16px}
.d4{right:13%;bottom:26%;color:#b6e8ff;animation-delay:-1s;font-size:11px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.app{
  position:relative;z-index:1;flex:1 1 auto;min-height:0;
  width:100%;max-width:520px;margin:0 auto;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:9px;
}
.topbar{display:flex;align-items:center;gap:10px;padding:0 2px}
.mascot{
  width:52px;height:52px;flex:0 0 52px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(160deg,#ffe9a8,#ffd166 58%,#ffc04d);
  box-shadow:0 4px 0 rgba(240,169,58,.55), inset 0 0 0 3px #fff;
}
.mascot svg{width:36px;height:36px;display:block}
.mascot .m-normal,.mascot .m-happy,.mascot .m-think,.mascot .m-oops{display:none}
.mascot.calm .m-normal{display:block}
.mascot.happy .m-happy{display:block}
.mascot.think .m-think{display:block}
.mascot.oops .m-oops{display:block}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.5px;color:#3d4a68}
.brand h1 .heart{color:#ff9db1;font-size:14px}
.brand p{margin:3px 0 0;font-size:11px;color:var(--ink-soft);letter-spacing:.6px}
.open-app{
  appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:11px;
  color:#fff;background:linear-gradient(160deg,#ffb3c2,#ff8fa3);border-radius:999px;
  padding:7px 10px;box-shadow:0 3px 0 var(--coral-deep);white-space:nowrap;
}
.user-me{display:flex;align-items:center;gap:5px}
.user-me img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 4px rgba(120,150,190,.25)}
.user-me span{font-size:10.5px;font-weight:800;color:#7d8ead;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.panel{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;
  padding:12px;border-radius:26px;background:var(--card);
  border:2px solid #fff;box-shadow:0 6px 0 #ffe4bb, 0 18px 28px rgba(120,160,200,.16);
}
.row{display:flex;align-items:center;gap:8px}
.settingbar{display:flex;align-items:center;gap:8px}
.setting-toggle{
  appearance:none;border:2px solid #e7f3ff;background:#f6fbff;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:12px;color:#4d7bb0;
  display:flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:999px;
  box-shadow:0 3px 0 #e7f1fb;transition:transform .12s, box-shadow .12s;
}
.setting-toggle:active{transform:translateY(2px);box-shadow:0 1px 0 #e7f1fb}
.setting-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;transition:transform .22s}
.setting-toggle.open svg{transform:rotate(180deg)}
.setting-summary{flex:1;font-size:11.5px;font-weight:700;color:#9aabc7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.config{display:none;flex-direction:column;gap:8px}
.config.open{display:flex}

.online{display:none;flex-direction:column;gap:6px}
.online.on{display:flex}
.online-empty{display:flex;gap:6px;align-items:center}
.room-input{
  flex:1;min-width:0;height:34px;border:2px solid #e7f3ff;border-radius:12px;
  padding:0 10px;font-family:inherit;font-size:12.5px;font-weight:700;color:#3d4a68;
  background:#f9fcff;outline:none;
}
.room-input::placeholder{color:#aab9d0;font-weight:600}
.mini-btn{
  appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:12px;
  color:#fff;background:linear-gradient(160deg,#93daff,#5fc0f5);
  box-shadow:0 3px 0 var(--sky-deep);border-radius:12px;height:34px;padding:0 12px;
  white-space:nowrap;transition:transform .12s, box-shadow .12s;
}
.mini-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sky-deep)}
.mini-btn.coral{background:linear-gradient(160deg,#ffb3c2,#ff8fa3);box-shadow:0 3px 0 var(--coral-deep)}
.mini-btn.coral:active{box-shadow:0 1px 0 var(--coral-deep)}
.mini-btn.ghost{background:#f7fbff;color:#6c85a6;border:2px solid #e7f3ff;box-shadow:0 3px 0 #eaf3fb}
.mini-btn.ghost:active{box-shadow:0 1px 0 #eaf3fb}
.room-card{display:flex;flex-direction:column;gap:6px}
.room-line{display:flex;gap:6px;align-items:center}
.room-code{flex:1;font-size:12px;font-weight:700;color:#7d8ead;white-space:nowrap}
.room-code b{font-size:14px;color:#e86a86;letter-spacing:1.6px}
.room-meta{font-size:11px;font-weight:700;color:#93a3c0;line-height:1.4}
.room-tools{display:none;align-items:center;gap:6px}
.room-tools.on{display:flex}
.room-hint{flex:1;min-width:0;font-size:10.5px;font-weight:700;color:#9aabc7}
.pending{display:flex;flex-direction:column;gap:5px}
.pending-item{
  display:flex;align-items:center;gap:6px;
  background:#fff8ef;border:2px solid #ffe6c4;border-radius:12px;padding:4px 8px;
}
.pending-item span{flex:1;min-width:0;font-size:11.5px;font-weight:800;color:#b07a3c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pending-item .mini-btn{height:28px;font-size:11px;padding:0 9px;border-radius:9px}
.undo-ask{
  display:flex;align-items:center;gap:6px;
  background:#fff8ef;border:2px solid #ffe6c4;border-radius:12px;padding:5px 8px;
}
.undo-ask span{flex:1;min-width:0;font-size:11.5px;font-weight:800;color:#b07a3c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo-ask .mini-btn{height:26px;font-size:11px;padding:0 8px;border-radius:9px}

/* ---------- 房间大厅 ---------- */
.lobby{position:fixed;inset:0;z-index:60;display:none}
.lobby.on{display:block}
.lobby-mask{
  position:absolute;inset:0;background:rgba(45,58,84,.38);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.lobby-card{
  position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;gap:10px;max-height:76vh;
  padding:14px 14px calc(16px + env(safe-area-inset-bottom));
  background:#fff;border-radius:24px 24px 0 0;
  box-shadow:0 -10px 30px rgba(90,120,160,.22);
}
.lobby-head{display:flex;align-items:center;gap:8px}
.lobby-title-wrap{flex:1;min-width:0}
.lobby-title{font-size:15px;font-weight:800;color:#3d4a68}
.lobby-sub{font-size:10.5px;font-weight:700;color:#9aabc7;margin-top:2px}
.lobby-list{
  flex:1 1 auto;min-height:90px;overflow-y:auto;
  display:flex;flex-direction:column;gap:7px;-webkit-overflow-scrolling:touch;
}
.lobby-item{
  display:flex;align-items:center;gap:9px;
  background:#f7fbff;border:2px solid #e7f3ff;border-radius:14px;padding:7px 9px;
}
.lobby-ava{
  width:31px;height:31px;flex:0 0 31px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(160deg,#ffe9a8,#ffd166);color:#8a6a2e;font-size:13px;font-weight:800;
}
.lobby-info{flex:1;min-width:0}
.lobby-name{font-size:12.5px;font-weight:800;color:#3d4a68;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lobby-info small{display:block;font-size:10.5px;font-weight:700;color:#9aabc7;margin-top:2px}
.lobby-item .mini-btn{height:30px;font-size:11.5px;padding:0 11px;border-radius:10px;flex:0 0 auto}
.lobby-item .mini-btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.lobby-empty{text-align:center;font-size:12px;font-weight:700;color:#9aabc7;line-height:1.9;padding:22px 8px;white-space:pre-line}
.lobby-foot{text-align:center;font-size:10.5px;font-weight:700;color:#b3c1d6}

.row-label{flex:0 0 38px;font-size:11.5px;font-weight:800;letter-spacing:.5px;color:#8fa2bf}
.seg{flex:1;display:flex;gap:4px;background:var(--sky-soft);border-radius:999px;padding:4px}
.seg button{
  flex:1;appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:13px;color:#6c85a6;
  border-radius:999px;padding:7px 6px;white-space:nowrap;
  transition:transform .12s, background .2s, color .2s, box-shadow .2s;
}
.seg button:active{transform:scale(.95)}
.seg button.on{color:#fff;background:linear-gradient(160deg,#ffb3c2,#ff8fa3);box-shadow:0 3px 0 var(--coral-deep)}
.seg.mini button{font-size:12px;padding:6px 4px}
.seg.mini button.on{background:linear-gradient(160deg,#93daff,#5fc0f5);box-shadow:0 3px 0 var(--sky-deep)}

.turnbar{display:flex;align-items:center;gap:7px}
.turn{
  flex:1;display:flex;align-items:center;gap:7px;
  background:#f7fbff;border:2px solid var(--sky-soft);border-radius:16px;
  padding:6px 9px;transition:border-color .2s, box-shadow .2s, background .2s;
}
.turn.active{background:#fffdf5;border-color:#ffd166;box-shadow:0 3px 0 #ffe3a5}
.chip{width:17px;height:17px;border-radius:50%;flex:0 0 17px}
.chip.b{background:radial-gradient(circle at 32% 28%,#8090ad,#3d4967 62%,#252d42);box-shadow:0 2px 4px rgba(70,90,130,.3)}
.chip.w{background:radial-gradient(circle at 32% 28%,#fff,#f3f8fd 60%,#dceaf6);box-shadow:inset 0 0 0 1px rgba(120,190,235,.8)}
.turn span{font-size:12.5px;font-weight:800;color:#7d8ead;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn.active span{color:#c56a1f}
.status{text-align:center;font-size:11.5px;font-weight:600;color:#93a3c0;min-height:16px;letter-spacing:.2px}

.board-wrap{position:relative;flex:1 1 auto;min-height:200px;display:flex;align-items:center;justify-content:center}
.board-wrap.fs{
  position:fixed;inset:0;z-index:40;border-radius:0;
  background:linear-gradient(170deg,#eaf8ff 0%,#fff1f7 52%,#fff8ea 100%);
  padding:14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
}
body.fs-lock{overflow:hidden}
.fs-btn{
  position:absolute;top:8px;left:8px;z-index:6;
  width:30px;height:30px;padding:0;border-radius:10px;
  border:2px solid #e7f3ff;background:rgba(255,255,255,.9);
  color:#5f7ea5;font-family:inherit;font-size:14px;font-weight:800;line-height:1;
  cursor:pointer;box-shadow:0 2px 6px rgba(120,160,200,.22);
  transition:transform .12s;
}
.fs-btn:active{transform:scale(.94)}
canvas{
  display:block;flex:0 0 auto;border-radius:18px;
  border:3px solid #ffe0a3;
  box-shadow:0 6px 0 #fff1d6, 0 14px 22px rgba(140,170,205,.18);
  touch-action:manipulation;cursor:pointer;
}
.spectator-badge{
  position:absolute;top:8px;right:8px;z-index:2;display:none;
  background:rgba(255,255,255,.92);border:2px solid #ffe0a3;border-radius:999px;
  padding:2px 10px;font-size:11px;font-weight:800;color:#c56a1f;
  box-shadow:0 2px 6px rgba(200,150,90,.2);
}
.spectator-badge.on{display:block}

.win-banner{
  position:absolute;inset:0;z-index:3;display:none;place-items:center;
  background:rgba(255,251,240,.82);backdrop-filter:blur(6px);border-radius:18px;
}
.win-banner.show{display:grid;animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.win-card{
  text-align:center;padding:20px 24px;border-radius:22px;
  background:linear-gradient(170deg,#fffdf6,#fff4f7);
  box-shadow:0 6px 0 #ffe1a8, 0 18px 30px rgba(150,170,210,.2);
  border:2px solid #fff;max-width:92%;
  animation:pop .36s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.win-card .big{font-size:23px;font-weight:800;letter-spacing:1px;color:#e86a86}
.win-card .sm{font-size:12px;color:#8fa2bf;margin-top:6px;line-height:1.5}
.win-card button{
  margin-top:14px;appearance:none;border:0;cursor:pointer;font-family:inherit;
  padding:10px 26px;border-radius:999px;font-size:14px;font-weight:800;color:#fff;
  background:linear-gradient(160deg,#ffb3c2,#ff8fa3);
  box-shadow:0 4px 0 var(--coral-deep);transition:transform .12s;
}
.win-card button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-deep)}
.win-card button.ghost-friend{
  background:#f7fbff;color:#6c85a6;box-shadow:0 3px 0 #e8f1fb;
  font-size:12.5px;padding:8px 18px;
}
.win-card button.ghost-friend:active{box-shadow:0 1px 0 #e8f1fb}

.history{
  position:absolute;inset:0;z-index:5;display:none;flex-direction:column;gap:6px;
  padding:10px;border-radius:18px;background:rgba(255,253,245,.97);
  border:3px solid #ffe0a3;box-shadow:0 6px 0 #fff1d6, 0 14px 22px rgba(140,170,205,.18);
}
.history.on{display:flex}
.history-head{display:flex;align-items:center;gap:6px}
.history-head b{flex:1;font-size:13px;font-weight:800;color:#3d4a68}
.history-list{
  flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;
  padding-right:2px;-webkit-overflow-scrolling:touch;
}
.history-item{
  appearance:none;cursor:pointer;font-family:inherit;text-align:left;
  display:flex;align-items:center;gap:8px;flex:0 0 auto;
  background:#fff;border:2px solid #eef6ff;border-radius:14px;padding:8px 10px;
  box-shadow:0 3px 0 #eef4fb;transition:transform .12s, box-shadow .12s;
}
.history-item:active{transform:translateY(2px);box-shadow:0 1px 0 #eef4fb}
.hi-log{width:22px;height:22px;border-radius:50%;flex:0 0 22px}
.hi-log.b{background:radial-gradient(circle at 32% 28%,#8090ad,#3d4967 62%,#252d42)}
.hi-log.w{background:radial-gradient(circle at 32% 28%,#fff,#f3f8fd 60%,#dceaf6);box-shadow:inset 0 0 0 1px rgba(120,190,235,.8)}
.hi-log.d{background:linear-gradient(160deg,#ffe6a8,#ffc94d)}
.hi-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hi-text b{font-size:12.5px;font-weight:800;color:#3d4a68}
.hi-text span{font-size:10.5px;font-weight:700;color:#9aabc7}
.hi-go{font-size:11px;font-weight:800;color:#e86a86;white-space:nowrap}
.hi-go.add{color:#4d9fd8}
.history-empty{text-align:center;font-size:11.5px;color:#9aabc7;padding:22px 0}

/* ---------- 好友 ---------- */
.friend-count{
  display:inline-block;min-width:16px;padding:0 4px;border-radius:999px;
  font-size:10px;font-weight:800;color:#fff;background:linear-gradient(160deg,#93daff,#5fc0f5);
  margin-left:2px;text-align:center;line-height:16px;
}
.friends{
  position:absolute;inset:0;z-index:6;display:none;flex-direction:column;gap:6px;
  padding:10px;border-radius:18px;background:rgba(255,253,245,.97);
  border:3px solid #ffe0a3;box-shadow:0 6px 0 #fff1d6, 0 14px 22px rgba(140,170,205,.18);
}
.friends.on{display:flex}
.friends-head{display:flex;align-items:center;gap:6px}
.friends-head b{flex:1;font-size:13px;font-weight:800;color:#3d4a68}
.friend-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px;-webkit-overflow-scrolling:touch}
.friend-empty{text-align:center;font-size:11.5px;color:#9aabc7;padding:22px 0;line-height:1.7}
.friend-row{
  display:flex;align-items:center;gap:8px;flex:0 0 auto;
  padding:7px 9px;border-radius:14px;background:#fff;border:2px solid #eef6ff;
  box-shadow:0 3px 0 #eef4fb;
}
.friend-avatar{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;overflow:hidden;
  display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;
  background:linear-gradient(160deg,#ffb3c2,#ff8fa3);
}
.friend-avatar img{width:100%;height:100%;object-fit:cover}
.friend-main{flex:1;min-width:0}
.friend-name{display:block;font-size:11.5px;font-weight:800;color:#3d4a68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend-sub{display:block;margin-top:1px;font-size:10px;font-weight:700;color:#9aabc7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c9d4e4;margin-right:4px;vertical-align:middle}
.friend-dot.on{background:#54d18a;box-shadow:0 0 0 3px rgba(84,209,138,.16)}
.friend-join{
  appearance:none;cursor:pointer;font-family:inherit;flex:0 0 auto;
  padding:5px 9px;border-radius:10px;border:2px solid #fff;
  background:linear-gradient(165deg,#ffb3c2,#ff8fa3);color:#fff;
  font-size:10px;font-weight:800;letter-spacing:.3px;box-shadow:0 2px 0 #e86a86;
}
.friend-join:active{transform:translateY(2px);box-shadow:0 0 0 #e86a86}

.scorebar{display:flex;align-items:center;justify-content:center;gap:14px}
.score-label{font-size:11.5px;font-weight:800;color:#9aabc7}
.score-label b{font-size:14px;color:#5d7297;margin:0 1px}
.actions{display:flex;gap:8px}
.btn{
  flex:1;appearance:none;border:0;cursor:pointer;font-family:inherit;
  height:42px;border-radius:14px;font-size:13px;font-weight:800;color:#4d7bb0;
  background:linear-gradient(160deg,#f7fcff,#e9f5ff);
  box-shadow:0 4px 0 #d8ebfa;transition:transform .12s, box-shadow .12s;
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d8ebfa}
.btn.coral{color:#fff;background:linear-gradient(160deg,#ffb3c2,#ff8fa3);box-shadow:0 4px 0 var(--coral-deep)}
.btn.coral:active{box-shadow:0 2px 0 var(--coral-deep)}
.btn[disabled]{opacity:.45;pointer-events:none}
.actions.replay[hidden]{display:none}
.foot{text-align:center;font-size:10px;color:#b6c4d8;letter-spacing:.6px}
.foot-cur{color:#9db0cb}
.foot-sep{margin:0 4px;color:#d2deec}
.foot a{color:inherit;text-decoration:none}
.foot a:active{color:#e86a86}
.ver{
  position:fixed;z-index:1;pointer-events:none;user-select:none;opacity:.7;
  right:calc(12px + env(safe-area-inset-right));
  bottom:calc(6px + env(safe-area-inset-bottom));

<script>
(function () {
  'use strict';
  var BLACK = 1, WHITE = 2;
  var KOMI = { 9: 5.5, 13: 6.5, 19: 7.5 };
  var STORE_KEY = 'go_idol_v1';
  var RECORD_KEY = 'go_records_v1';
  var RECORD_MAX = 30;
  var VERSION = 'v18';
  var UA = (window.navigator && window.navigator.userAgent) || '';
  var IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(UA);
  var IN_APP = /BiliApp/i.test(UA);
  var profileTried = false;

  var els = {
    mascot: document.getElementById('mascot'),
    openAppBtn: document.getElementById('openAppBtn'),
    userMe: document.getElementById('userMe'),
    userFace: document.getElementById('userFace'),
    userName: document.getElementById('userName'),
    homeBtn: document.getElementById('homeBtn'),
    settingToggle: document.getElementById('settingToggle'),
    settingSummary: document.getElementById('settingSummary'),
    configPanel: document.getElementById('configPanel'),
    modeSeg: document.getElementById('modeSeg'),
    diffRow: document.getElementById('diffRow'),
    diffSeg: document.getElementById('diffSeg'),
    sizeSeg: document.getElementById('sizeSeg'),
    onlinePanel: document.getElementById('onlinePanel'),
    onlineEmpty: document.getElementById('onlineEmpty'),
    onlineRoom: document.getElementById('onlineRoom'),
    createRoomBtn: document.getElementById('createRoomBtn'),
    roomListBtn: document.getElementById('roomListBtn'),
    roomInput: document.getElementById('roomInput'),
    joinRoomBtn: document.getElementById('joinRoomBtn'),
    roomLobby: document.getElementById('roomLobby'),
    lobbyMask: document.getElementById('lobbyMask'),
    lobbyClose: document.getElementById('lobbyClose'),
    lobbyList: document.getElementById('lobbyList'),
    lobbySub: document.getElementById('lobbySub'),
    roomCode: document.getElementById('roomCode'),
    roomMeta: document.getElementById('roomMeta'),
    copyLinkBtn: document.getElementById('copyLinkBtn'),
    reconnectBtn: document.getElementById('reconnectBtn'),
    leaveRoomBtn: document.getElementById('leaveRoomBtn'),
    roomTools: document.getElementById('roomTools'),
    swapColorBtn: document.getElementById('swapColorBtn'),
    kickGuestBtn: document.getElementById('kickGuestBtn'),
    colorHint: document.getElementById('colorHint'),
    undoAsk: document.getElementById('undoAsk'),
    undoAskText: document.getElementById('undoAskText'),
    undoOkBtn: document.getElementById('undoOkBtn'),
    undoNoBtn: document.getElementById('undoNoBtn'),
    pendingList: document.getElementById('pendingList'),
    turnBlack: document.getElementById('turnBlack'),
    turnWhite: document.getElementById('turnWhite'),
    labelBlack: document.getElementById('labelBlack'),
    labelWhite: document.getElementById('labelWhite'),
    boardWrap: document.getElementById('boardWrap'),
    canvas: document.getElementById('board'),
    spectatorBadge: document.getElementById('spectatorBadge'),
    winBanner: document.getElementById('winBanner'),
    bannerTitle: document.getElementById('bannerTitle'),
    bannerSub: document.getElementById('bannerSub'),
    againBtn: document.getElementById('againBtn'),
    historyPanel: document.getElementById('historyPanel'),
    historyList: document.getElementById('historyList'),
    historyClose: document.getElementById('historyClose'),
    friendToggle: document.getElementById('friendToggle'),
    friendCount: document.getElementById('friendCount'),
    friendPanel: document.getElementById('friendPanel'),
    friendList: document.getElementById('friendList'),
    friendClose: document.getElementById('friendClose'),
    winFriendBtn: document.getElementById('winFriendBtn'),
    status: document.getElementById('status'),
    capBlack: document.getElementById('capBlack'),
    capWhite: document.getElementById('capWhite'),
    capGoal: document.getElementById('capGoal'),
    moveCount: document.getElementById('moveCount'),
    actionRow: document.getElementById('actionRow'),
    replayActions: document.getElementById('replayActions'),
    passBtn: document.getElementById('passBtn'),
    undoBtn: document.getElementById('undoBtn'),
    restartBtn: document.getElementById('restartBtn'),
    replayBtn: document.getElementById('replayBtn'),
    rpPrev: document.getElementById('rpPrev'),
    rpPlay: document.getElementById('rpPlay'),
    rpNext: document.getElementById('rpNext'),
    rpExit: document.getElementById('rpExit'),
    verTag: document.getElementById('verTag')
  };

  var canvas = els.canvas;
  var wrapEl = els.boardWrap;
  var ctx = null;

  /* ---------- 棋局状态 ---------- */
  var N = 9;
  var board = [];
  var moves = [];
  var caps = { b: 0, w: 0 };
  var turn = BLACK;
  var over = false;
  var winner = 0;
  var scoreRes = null;
  var koPoint = null;
  var passCount = 0;
  var lastMove = null;
  var thinking = false;
  var aiToken = 0;
  var mode = 'ai';
  var diff = 'easy';
  var hoverCell = null;
  var replay = { on: false, list: [], idx: 0, timer: 0, playing: false, rec: null };
  var records = [];
  var lastRecordKey = '';

  var score = { b: 0, w: 0 };
  var lastSaved = '';
  var me = { uid: '', name: '', face: '', aliases: [], pid: '' };

  function emptyBoard(n) {
    n = n || N;
    board = new Array(n * n);
    for (var i = 0; i < board.length; i++) board[i] = 0;
  }

  function inBoard(x, y) { return x >= 0 && y >= 0 && x < N && y < N; }
  function at(x, y) { return board[y * N + x]; }

  /* ---------- 本地存档 ---------- */
  function loadSettings() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && (o.mode === 'ai' || o.mode === 'pvp')) mode = o.mode;
      if (o && (o.diff === 'easy' || o.diff === 'normal' || o.diff === 'hard')) diff = o.diff;
      if (o && (o.n === 9 || o.n === 13 || o.n === 19)) N = o.n;
    } catch (e) { /* ignore */ }
  }

  function saveSettings() {
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify({ mode: mode, diff: diff, n: N }));
    } catch (e) { /* ignore */ }
  }

  function loadScore() {
    try {
      var raw = window.localStorage.getItem('go_score_v1');
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && typeof o.b === 'number' && typeof o.w === 'number') score = { b: o.b, w: o.w };
    } catch (e) { /* ignore */ }
  }

  function saveScore() {
    try { window.localStorage.setItem('go_score_v1', JSON.stringify(score)); } catch (e) { /* ignore */ }
  }

  function loadRecords() {
    try {
      var raw = window.localStorage.getItem(RECORD_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) records = arr.slice(0, RECORD_MAX);
    } catch (e) { /* ignore */ }
  }

  function saveRecords() {
    try { window.localStorage.setItem(RECORD_KEY, JSON.stringify(records.slice(0, RECORD_MAX))); } catch (e) { /* ignore */ }
  }

  /* ---------- 基础 UI ---------- */
  function setStatus(text) {
    if (els.status) els.status.textContent = text;
    if (mode === 'online' && text && online.room) online.lastState = online.lastState || Date.now();
  }

  function setMood(kind) {
    if (!els.mascot) return;
    els.mascot.className = 'mascot ' + (kind || 'calm');
  }

  function showBanner(title, sub) {
    if (!els.winBanner) return;
    els.bannerTitle.textContent = title;
    els.bannerSub.textContent = sub || '';
    els.winBanner.classList.add('show');
    refreshFriendBtn();
  }

  function hideBanner() {
    if (els.winBanner) els.winBanner.classList.remove('show');
    if (els.winFriendBtn) els.winFriendBtn.hidden = true;
  }

  function toggleSettings(force) {
    if (!els.configPanel) return;
    var open = force === undefined ? !els.configPanel.classList.contains('open') : !!force;
    els.configPanel.classList.toggle('open', open);
    if (els.settingToggle) els.settingToggle.classList.toggle('open', open);
  }

  function updateSummary() {
    if (!els.settingSummary) return;
    var m = mode === 'ai' ? '人机' : (mode === 'online' ? '联机' : '双人');
    var d = diff === 'easy' ? '简单' : diff === 'normal' ? '普通' : '困难';
    els.settingSummary.textContent = mode === 'ai'
      ? (m + ' · ' + d + ' · ' + N + ' 路')
      : (m + ' · ' + N + ' 路');
  }

  function updateSegmentStates() {
    var i, btns;
    if (els.modeSeg) {
      btns = els.modeSeg.querySelectorAll('button');
      for (i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-mode') === mode);
    }
    if (els.diffSeg) {
      btns = els.diffSeg.querySelectorAll('button');
      for (i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-diff') === diff);
    }
    if (els.sizeSeg) {
      btns = els.sizeSeg.querySelectorAll('button');
      for (i = 0; i < btns.length; i++) btns[i].classList.toggle('on', Number(btns[i].getAttribute('data-size')) === N);
    }
    if (els.diffRow) els.diffRow.style.display = mode === 'ai' ? 'flex' : 'none';
    updateSummary();
  }

  /* ---------- 棋盘几何 ---------- */
  var view = { css: 0, pad: 0, cell: 0, dpr: 1 };
  var fsOn = false;

  function relayout() {
    if (!canvas || !wrapEl) return;
    var w = wrapEl.clientWidth || 320;
    var h = wrapEl.clientHeight || 320;
    var css = Math.min(w, h, fsOn ? 1600 : 470);
    if (css < 190) css = 190;
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = css + 'px';
    canvas.style.height = css + 'px';
    canvas.width = Math.round(css * dpr);
    canvas.height = Math.round(css * dpr);
    try { ctx = canvas.getContext('2d'); } catch (e) { ctx = null; }
    view.css = css;
    view.dpr = dpr;
    view.pad = Math.round(css * (N >= 19 ? 0.048 : N >= 13 ? 0.058 : 0.072)) + 2;
    view.cell = (css - 2 * view.pad) / (N - 1);
    draw();
  }

  function starPoints(n) {
    if (n === 9) return [[2, 2], [6, 2], [4, 4], [2, 6], [6, 6]];
    if (n === 13) return [[3, 3], [9, 3], [6, 6], [3, 9], [9, 9]];
    if (n === 19) {
      return [[3, 3], [9, 3], [15, 3], [3, 9], [9, 9], [15, 9], [3, 15], [9, 15], [15, 15]];
    }
    return [];
  }

  function drawWood() {
    var css = view.css;
    var g = ctx.createLinearGradient(0, 0, css, css);
    g.addColorStop(0, '#f4dcae');
    g.addColorStop(.55, '#e9c48a');
    g.addColorStop(1, '#dcae6c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, css, css);
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = '#b98a4e';
    ctx.lineWidth = 1;
    for (var i = 0; i < 5; i++) {
      var y = css * (0.14 + i * 0.18);
      ctx.beginPath();
      for (var x = 0; x <= css; x += 12) {
        ctx.lineTo(x, y + Math.sin((x / css) * 6.28 + i) * css * 0.012);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    if (!ctx) return;
    var css = view.css, dpr = view.dpr, pad = view.pad, cell = view.cell;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, css, css);
    drawWood();

    var i, x, y;
    ctx.strokeStyle = 'rgba(112,78,40,.62)';
    ctx.lineWidth = Math.max(1, cell * 0.045);
    for (i = 0; i < N; i++) {
      x = pad + i * cell;
      ctx.beginPath();
      ctx.moveTo(pad, x);
      ctx.lineTo(pad + (N - 1) * cell, x);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, pad);
      ctx.lineTo(x, pad + (N - 1) * cell);
      ctx.stroke();
    }

    var stars = starPoints(N);
    ctx.fillStyle = 'rgba(120,78,42,.85)';
    for (i = 0; i < stars.length; i++) {
      ctx.beginPath();
      ctx.arc(pad + stars[i][0] * cell, pad + stars[i][1] * cell, Math.max(2, cell * 0.11), 0, 6.2832);
      ctx.fill();
    }

    var r = cell * 0.46;
    for (y = 0; y < N; y++) {
      for (x = 0; x < N; x++) {
        var v = at(x, y);
        if (!v) continue;
        drawStone(pad + x * cell, pad + y * cell, r, v);
      }
    }

    if (hoverCell && !over && !replay.on && !thinking && !at(hoverCell.x, hoverCell.y)) {
      ctx.save();
      ctx.globalAlpha = 0.34;
      drawStone(pad + hoverCell.x * cell, pad + hoverCell.y * cell, r, turn);
      ctx.restore();
    }

    if (lastMove && lastMove.x >= 0 && at(lastMove.x, lastMove.y)) {
      var lx = pad + lastMove.x * cell;
      var ly = pad + lastMove.y * cell;
      ctx.beginPath();
      ctx.arc(lx, ly, Math.max(2, r * 0.28), 0, 6.2832);
      ctx.fillStyle = at(lastMove.x, lastMove.y) === BLACK ? 'rgba(255,255,255,.9)' : 'rgba(60,70,95,.9)';
      ctx.fill();
    }

    if (koPoint) {
      ctx.save();
      ctx.strokeStyle = 'rgba(232,106,134,.75)';
      ctx.lineWidth = 2;
      var kx = pad + koPoint.x * cell;
      var ky = pad + koPoint.y * cell;
      ctx.strokeRect(kx - r * 0.55, ky - r * 0.55, r * 1.1, r * 1.1);
      ctx.restore();
    }
  }

  function drawStone(cx, cy, r, color) {
    if (color === BLACK) {
      var g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.34, r * 0.15, cx, cy, r);
      g.addColorStop(0, '#8b99b5');
      g.addColorStop(.55, '#3d4967');
      g.addColorStop(1, '#232a3d');
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 6.2832);
      ctx.fillStyle = g;
      ctx.fill();
    } else {
      var gw = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.34, r * 0.15, cx, cy, r);
      gw.addColorStop(0, '#ffffff');
      gw.addColorStop(.62, '#f6fafe');
      gw.addColorStop(1, '#dfeaf5');
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 6.2832);
      ctx.fillStyle = gw;
      ctx.fill();
      ctx.lineWidth = Math.max(1, r * 0.1);
      ctx.strokeStyle = 'rgba(120,190,235,.65)';
      ctx.stroke();
    }
  }

  function hitTest(ev) {
    if (!canvas) return null;
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: view.css, height: view.css };
    var w = rect.width || view.css;
    var px = (ev.clientX - rect.left) * (view.css / w);
    var py = (ev.clientY - rect.top) * (view.css / (rect.height || view.css));
    var x = Math.round((px - view.pad) / view.cell);
    var y = Math.round((py - view.pad) / view.cell);
    if (!inBoard(x, y)) return null;
    var dx = px - (view.pad + x * view.cell);
    var dy = py - (view.pad + y * view.cell);
    if (Math.sqrt(dx * dx + dy * dy) > view.cell * 0.62) return null;
    return { x: x, y: y };
  }

  /* ---------- 围棋规则 ---------- */
  function neighbors(x, y, n) {
    var out = [];
    if (x > 0) out.push([x - 1, y]);
    if (x < n - 1) out.push([x + 1, y]);
    if (y > 0) out.push([x, y - 1]);
    if (y < n - 1) out.push([x, y + 1]);
    return out;
  }

  function groupLibs(bd, x, y, n) {
    var color = bd[y * n + x];
    if (!color) return 0;
    var seen = {};
    var libs = {};
    var stack = [[x, y]];
    seen[y * n + x] = 1;
    while (stack.length) {
      var cur = stack.pop();
      var ns = neighbors(cur[0], cur[1], n);
      for (var i = 0; i < ns.length; i++) {
        var nx = ns[i][0], ny = ns[i][1], idx = ny * n + nx;
        if (!bd[idx]) {
          libs[idx] = 1;
        } else if (bd[idx] === color && !seen[idx]) {
          seen[idx] = 1;
          stack.push([nx, ny]);
        }
      }
    }
    var count = 0;
    for (var k in libs) if (Object.prototype.hasOwnProperty.call(libs, k)) count++;
    return count;
  }

  /* 返回 (x,y) 所在气群的气点坐标列表（用于判定打劫） */
  function groupLibPoints(bd, x, y, n) {
    var color = bd[y * n + x];
    if (!color) return [];
    var seen = {};
    var libs = [];
    var stack = [[x, y]];
    seen[y * n + x] = 1;
    while (stack.length) {
      var cur = stack.pop();
      var ns = neighbors(cur[0], cur[1], n);
      for (var i = 0; i < ns.length; i++) {
        var nx = ns[i][0], ny = ns[i][1], idx = ny * n + nx;
        if (!bd[idx]) {
          if (!seen[idx]) { seen[idx] = 1; libs.push([nx, ny]); }
        } else if (bd[idx] === color && !seen[idx]) {
          seen[idx] = 1;
          stack.push([nx, ny]);
        }
      }
    }
    return libs;
  }

  function groupStones(bd, x, y, n) {
    var color = bd[y * n + x];
    var seen = {};
    var out = [];
    var stack = [[x, y]];
    seen[y * n + x] = 1;
    while (stack.length) {
      var cur = stack.pop();
      out.push(cur);
      var ns = neighbors(cur[0], cur[1], n);
      for (var i = 0; i < ns.length; i++) {
        var nx = ns[i][0], ny = ns[i][1], idx = ny * n + nx;
        if (bd[idx] === color && !seen[idx]) {
          seen[idx] = 1;
          stack.push([nx, ny]);
        }
      }
    }
    return out;
  }

  function captureDead(bd, x, y, n, color) {
    var captured = [];
    var ns = neighbors(x, y, n);
    for (var i = 0; i < ns.length; i++) {
      var nx = ns[i][0], ny = ns[i][1], idx = ny * n + nx;
      if (!bd[idx] || bd[idx] === color) continue;
      if (groupLibs(bd, nx, ny, n) === 0) {
        var stones = groupStones(bd, nx, ny, n);
        for (var j = 0; j < stones.length; j++) {
          var sx = stones[j][0], sy = stones[j][1];
          bd[sy * n + sx] = 0;
          captured.push([sx, sy]);
        }
      }
    }
    return captured;
  }

  function legalMove(x, y, color, bd, n, ko) {
    if (x < 0 || y < 0 || x >= n || y >= n) return { ok: false, why: 'out' };
    if (bd[y * n + x]) return { ok: false, why: 'taken' };
    if (ko && ko.x === x && ko.y === y) return { ok: false, why: 'ko' };
    var nb = bd.slice();
    nb[y * n + x] = color;
    var captured = captureDead(nb, x, y, n, color);
    if (!captured.length && groupLibs(nb, x, y, n) === 0) return { ok: false, why: 'suicide' };
    /* 打劫判定（修复）：
       原逻辑只要「恰好提了 1 子」就记为劫，会把角上提子等普通提子误判成劫，
       从而禁掉对方本来合法的一手。
       标准简单 ko 需同时满足：
         1) 恰好提掉 1 子；
         2) 提子方刚落下的这口气群只剩 1 个气；
         3) 这唯一的气正好是被提掉那子的位置（即对方立即回提会形成同形）。
       只有满足全部三条才设 ko 点。 */
    var ko2 = null;
    if (captured.length === 1) {
      var libs = groupLibPoints(nb, x, y, n);
      if (libs.length === 1 && libs[0][0] === captured[0][0] && libs[0][1] === captured[0][1]) {
        ko2 = { x: captured[0][0], y: captured[0][1] };
      }
    }
    return { ok: true, board: nb, captured: captured, ko: ko2 };
  }

  /* ---------- 落子 ---------- */
  function place(x, y) {
    if (over || thinking || replay.on) return false;
    var seq0 = online.seq;
    var res = legalMove(x, y, turn, board, N, koPoint);
    if (!res.ok) {
      if (res.why === 'ko') setStatus('这里刚形成劫，换一手再提吧');
      else if (res.why === 'suicide') setStatus('这样下自己就没气了，换个地方');
      return false;
    }
    var color = turn;
    board = res.board;
    koPoint = res.ko;
    passCount = 0;
    lastMove = { x: x, y: y };
    moves.push({ x: x, y: y, c: color });
    if (res.captured.length) {
      if (color === BLACK) caps.b += res.captured.length; else caps.w += res.captured.length;
    }
    hoverCell = null;
    turn = turn === BLACK ? WHITE : BLACK;
    thinking = false;
    paintCounts();
    updateTurnUI();
    draw();
    if (checkCaptureWin()) return true;
    if (tryNaturalEnd()) return true;
    if (autoPassIfStuck()) return true;

    if (mode !== 'online') {
      if (mode === 'ai' && turn === WHITE) {
        setMood('calm');
        setStatus(capsText(caps.b, caps.w) || '轮到电脑啦，稍等一下');
        scheduleAI();
        return true;
      }
      setMood('calm');
      setStatus(mode === 'ai' ? '轮到你啦，点交叉点落子' : (turn === BLACK ? '轮到黑棋啦' : '轮到白棋啦'));
      return true;
    }

    if (online.role === 'host') {
      setStatus(turn === myColor() ? '轮到你啦' : '等朋友落子…');
      online.seq++;
      broadcastState(true);
    } else if (online.role === 'guest') {
      /* 本地已先落子（含提子、打劫），这里只负责同步给房主 */
      publish({ t: 'mv', u: myUid(), p: myPid(), x: x, y: y, q: seq0 }).then(function (ok) {
        if (ok) return;
        online.lastSeq = -1;
        publish({ t: 'sync', u: myUid(), p: myPid() });
        setStatus('网络不太稳，正在和房主重新同步…');
      });
      setStatus('已落子，正在同步给房主…');
    }
    return true;
  }

  function capsText(b, w) {
    if (b || w) return '黑提 ' + b + ' 子 · 白提 ' + w + ' 子';
    return '';
  }

  function paintCounts() {
    if (els.capBlack) els.capBlack.textContent = String(caps.b);
    if (els.capWhite) els.capWhite.textContent = String(caps.w);
    if (els.capGoal) els.capGoal.textContent = String(captureGoal());
    if (els.moveCount) els.moveCount.textContent = String(moves.length);
  }

  /* 提子结算：9 路提满 20 子、13 路 25 子、19 路 30 子即结束 */
  function captureGoal() {
    return N === 19 ? 30 : (N === 13 ? 25 : 20);
  }

  function checkCaptureWin() {
    if (over) return false;
    if (mode === 'online' && online.role !== 'host') return false;
    var goal = captureGoal();
    if (caps.b < goal && caps.w < goal) return false;
    finishGame(true);
    return true;
  }

  function updateTurnUI() {
    if (els.labelBlack) els.labelBlack.textContent = labelOf(BLACK);
    if (els.labelWhite) els.labelWhite.textContent = labelOf(WHITE);
    if (els.turnBlack) els.turnBlack.classList.toggle('active', !over && turn === BLACK);
    if (els.turnWhite) els.turnWhite.classList.toggle('active', !over && turn === WHITE);
    paintCounts();
  }

  function labelOf(c) {
    if (mode === 'online') {
      var blackName = online.hostColor === BLACK
        ? (online.hostName || (online.role === 'host' ? me.name : '') || '房主')
        : (online.guestName || (online.role === 'guest' ? me.name : '') || '等朋友');
      var whiteName = online.hostColor === BLACK
        ? (online.guestName || (online.role === 'guest' ? me.name : '') || '等朋友')
        : (online.hostName || (online.role === 'host' ? me.name : '') || '房主');
      return (c === BLACK ? blackName + ' · 黑' : whiteName + ' · 白');
    }
    if (mode === 'ai') return c === BLACK ? '你 · 黑棋' : '电脑 · 白棋';
    return c === BLACK ? '黑棋' : '白棋';
  }

  /* ---------- 人机 ---------- */
  /* 修复：原签名只有 (color)，困难档却传入 (m.res.board, color) 两个实参，
     导致盘面参数被丢弃、color 形参拿到数组，"模拟对手回应"完全失效。
     现改为可选传入盘面/劫点，默认沿用全局状态。 */
  function legalCandidates(color, bd, ko) {
    var useBoard = bd || board;
    var useKo = (ko === undefined) ? koPoint : ko;
    var list = [];
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        if (useBoard[y * N + x]) continue;
        var r = legalMove(x, y, color, useBoard, N, useKo);
        if (r.ok) list.push({ x: x, y: y, res: r });
      }
    }
    return list;
  }

  function hasEmptyPoint() {
    for (var i = 0; i < board.length; i++) if (!board[i]) return true;
    return false;
  }

  function hasLegalFor(color) {
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        if (at(x, y)) continue;
        if (legalMove(x, y, color, board, N, koPoint).ok) return true;
      }
    }
    return false;
  }

  /* 棋盘下满，或黑白都已无处可下：直接数子结束，不用再点两次虚手 */
  function tryNaturalEnd() {
    if (over) return false;
    if (mode === 'online' && online.role !== 'host') return false;
    if (!hasEmptyPoint() || (!hasLegalFor(BLACK) && !hasLegalFor(WHITE))) {
      finishGame();
      return true;
    }
    return false;
  }

  /* 当前一方已无处可下时自动虚手，避免卡在“一直不结束” */
  function autoPassIfStuck() {
    if (over || replay.on) return false;
    if (mode === 'online') {
      if (online.role === 'spec') return false;
      if (turn !== myColor()) return false;
    }
    if (hasLegalFor(turn)) return false;
    doPass(true);
    return true;
  }

  function aiHeuristic(cand, color) {
    var s = cand.res.captured.length * 14;
    var libs = groupLibs(cand.res.board, cand.x, cand.y, N);
    if (libs === 1) s -= 9;
    else if (libs === 2) s += 1;
    else s += 5;
    var ns = neighbors(cand.x, cand.y, N);
    for (var i = 0; i < ns.length; i++) {
      /* 修复：原用全局 at()，在模拟盘面上评估时会读到错误的盘面 */
      var v = cand.res.board[ns[i][1] * N + ns[i][0]];
      if (v === color) s += 3;
      else if (v) s += 2;
    }
    var mid = (N - 1) / 2;
    var d = Math.max(Math.abs(cand.x - mid), Math.abs(cand.y - mid));
    s += (mid - d) * 0.7;
    return s;
  }

  function sortCandidates(list, color) {
    for (var i = 0; i < list.length; i++) list[i].score = aiHeuristic(list[i], color);
    list.sort(function (a, b) { return b.score - a.score; });
    return list;
  }

  function pickAIMove(color) {
    var cand = legalCandidates(color);
    if (!cand.length) return null;
    var i;
    if (diff === 'easy') {
      var caps = [];
      for (i = 0; i < cand.length; i++) if (cand[i].res.captured.length) caps.push(cand[i]);
      if (caps.length && Math.random() < 0.7) return caps[Math.floor(Math.random() * caps.length)];
      return cand[Math.floor(Math.random() * cand.length)];
    }
    var sorted = sortCandidates(cand, color);
    if (diff === 'normal') {
      var top = sorted.slice(0, Math.min(4, sorted.length));
      return top[Math.floor(Math.random() * top.length)];
    }
    /* 困难：前 8 手里，模拟对手最佳回应，取净收益最高 */
    var bestMove = sorted[0], bestValue = -1e9;
    var probe = sorted.slice(0, Math.min(8, sorted.length));
    var oppColor = color === BLACK ? WHITE : BLACK;
    for (i = 0; i < probe.length; i++) {
      var m = probe[i];
      var reply = 0;
      /* 修复：传入 m.res.board 与对方劫点，让对手回应真正基于"我方已落子"的盘面 */
      var opp = legalCandidates(oppColor, m.res.board, m.res.ko);
      for (var j = 0; j < opp.length; j++) {
        var v = aiHeuristic(opp[j], oppColor);
        if (v > reply) reply = v;
      }
      var value = m.score - reply * 0.55;
      if (value > bestValue) { bestValue = value; bestMove = m; }
    }
    return bestMove;
  }

  function scheduleAI() {
    if (mode !== 'ai' || over || replay.on) return;
    thinking = true;
    var token = ++aiToken;
    setMood('think');
    setStatus('电脑想一步…');
    window.setTimeout(function () {
      if (token !== aiToken || mode !== 'ai' || over) { thinking = false; return; }
      thinking = false;
      var mv = pickAIMove(WHITE);
      if (!mv) { doPass(true); return; }
      place(mv.x, mv.y);
    }, 420);
  }

  /* ---------- 虚手 / 终局数子 ---------- */
  function doPass(auto) {
    if (over || replay.on) return;
    var color = turn;
    moves.push({ x: -1, y: -1, c: color, pass: true });
    passCount++;
    koPoint = null;
    lastMove = null;
    turn = turn === BLACK ? WHITE : BLACK;
    hoverCell = null;
    updateTurnUI();
    draw();

    /* 修复（联机连虚手永不终局）：
       访客端必须先把虚手发给房主，由房主统一判定终局。
       原代码把 passCount>=2 的终局判断放在发送之前，访客连下第二手虚手时
       会在此处直接 finishGame() 并 return，导致 'pass' 消息根本没发出去，
       房主永远等不到第二手虚手，对局卡在"一直不结束"。
       现在访客端先发消息并返回，终局一律以房主广播为准。 */
    if (mode === 'online' && online.role === 'guest') {
      publish({ t: 'pass', u: myUid(), p: myPid(), q: online.seq });
      setStatus('虚手已发送，等房主同步…');
      return;
    }

    if (passCount >= 2) {
      finishGame();
      return;
    }
    if (tryNaturalEnd()) return;
    if (autoPassIfStuck()) return;
    if (mode === 'online') {
      if (online.role === 'host') {
        setStatus(turn === myColor() ? '轮到你啦' : '等朋友落子…');
        online.seq++;
        broadcastState(true);
      } else if (online.role === 'guest') {
        publish({ t: 'pass', u: myUid(), p: myPid(), q: online.seq });
        setStatus('虚手已发送，等房主同步…');
      }
      return;
    }
    if (mode === 'ai' && turn === WHITE) {
      setStatus('你虚手了，电脑接着下');
      scheduleAI();
      return;
    }
    setStatus('虚手一次 · 双方连续虚手就数子结束');
  }

  /* 找出所有空区（不含任何子），返回每个空区的信息：
     { cells:[下标...], borders:[相邻子下标...], edge:是否接触棋盘边缘 }
     skip 是一个"当作空点处理"的下标集合（用于死子判定：把待检查的气群
     暂时当成已经提掉，这样它腾出的空间才会并入口袋，口袋边界才算得准）。
     skip 里的点不会出现在 borders 中。 */
  function collectRegions(bd, n, skip) {
    var total = n * n;
    var visited = [];
    var regions = [];
    var i;
    for (i = 0; i < total; i++) visited[i] = false;
    for (i = 0; i < total; i++) {
      if (visited[i]) continue;
      if (bd[i] && !(skip && skip[i])) continue;
      var stack = [i];
      var cells = [];
      var borders = {};
      var edge = false;
      visited[i] = true;
      while (stack.length) {
        var idx = stack.pop();
        cells.push(idx);
        var x = idx % n, y = Math.floor(idx / n);
        if (x === 0 || y === 0 || x === n - 1 || y === n - 1) edge = true;
        var ns = neighbors(x, y, n);
        for (var j = 0; j < ns.length; j++) {
          var nidx = ns[j][1] * n + ns[j][0];
          if (skip && skip[nidx]) {
            /* 被"提掉"的子：当作空点继续扩展，且不算作口袋边界 */
            if (!visited[nidx]) { visited[nidx] = true; stack.push(nidx); }
            continue;
          }
          if (bd[nidx]) borders[nidx] = 1;
          else if (!visited[nidx]) { visited[nidx] = true; stack.push(nidx); }
        }
      }
      var bl = [];
      for (var k in borders) if (Object.prototype.hasOwnProperty.call(borders, k)) bl.push(parseInt(k, 10));
      regions.push({ id: regions.length, cells: cells, borders: bl, edge: edge });
    }
    return regions;
  }

  /* 找出某个气群的所有子与所有相邻空点 */
  function collectGroup(bd, n, start) {
    var color = bd[start];
    var stones = [];
    var libSet = {};
    var stack = [start];
    var seen = {};
    seen[start] = 1;
    while (stack.length) {
      var cur = stack.pop();
      stones.push(cur);
      var cx = cur % n, cy = Math.floor(cur / n);
      var ns = neighbors(cx, cy, n);
      for (var j = 0; j < ns.length; j++) {
        var nidx = ns[j][1] * n + ns[j][0];
        if (!bd[nidx]) libSet[nidx] = 1;
        else if (bd[nidx] === color && !seen[nidx]) { seen[nidx] = 1; stack.push(nidx); }
      }
    }
    var libs = [];
    for (var k in libSet) if (Object.prototype.hasOwnProperty.call(libSet, k)) libs.push(parseInt(k, 10));
    return { color: color, stones: stones, libs: libs };
  }

  /* 判断哪些子是死子（修复）：
     中国规则数子前必须先清死子，否则终局比分会错（死子被当成活子算）。
     这里用「口袋判据」，四个条件同时成立才算死子：
       1) 该气群自己没有眼位：在原盘面上找不到"只被自己颜色围住"的空区；
       2) 该气群的所有气都落在同一个封闭口袋里（口袋不接触棋盘边缘）；
       3) 这个口袋的四边只被对方颜色围住（把自己排除在外再算）；
       4) 对方围着口袋的子数明显多于自己 —— 对方有余力把自己提掉。
     第 3 条必须"排除自己"：直接看原盘面时，这片子自己也会把口袋标成
     "接触到己方"，于是永远判不出死子（这是修复前的真实 bug）。
     第 4 条用来区分「白孤子落在黑的大口袋里」（死）和
     「黑棋围出一大片地」（活）这两种对称情形。 */
  function findDeadStones(bd, n) {
    var total = n * n;
    var dead = [];
    var seen = {};
    var i;
    for (i = 0; i < total; i++) {
      if (!bd[i]) continue;
      if (seen[i]) continue;
      var g = collectGroup(bd, n, i);
      for (var s0 = 0; s0 < g.stones.length; s0++) seen[g.stones[s0]] = 1;

      if (!g.libs.length) {
        /* 已经没气了，本来就是死子 */
        for (var dz = 0; dz < g.stones.length; dz++) dead.push(g.stones[dz]);
        continue;
      }
      /* 条件 1：有没有只被自己颜色围住的空区（有就是有眼位，不算死） */
      var hasOwnEye = false;
      var regions0 = collectRegions(bd, n, null);
      for (var r0 = 0; r0 < regions0.length && !hasOwnEye; r0++) {
        var reg0 = regions0[r0];
        var onlyOwn = reg0.borders.length > 0;
        for (var b0 = 0; b0 < reg0.borders.length; b0++) {
          if (bd[reg0.borders[b0]] !== g.color) { onlyOwn = false; break; }
        }
        if (onlyOwn) hasOwnEye = true;
      }
      if (hasOwnEye) continue;

      /* 排除自己后重新划分空区，判断自己所有气落在哪些口袋里 */
      var skip = {};
      for (var s1 = 0; s1 < g.stones.length; s1++) skip[g.stones[s1]] = 1;
      var regions = collectRegions(bd, n, skip);
      var libRegion = {};
      var bad = false;
      for (var li = 0; li < g.libs.length; li++) {
        var found = null;
        for (var r = 0; r < regions.length; r++) {
          var cells = regions[r].cells;
          for (var c = 0; c < cells.length; c++) {
            if (cells[c] === g.libs[li]) { found = regions[r]; break; }
          }
          if (found) break;
        }
        if (!found) { bad = true; break; }
        libRegion[found.id] = found;
      }
      if (bad || !Object.keys(libRegion).length) continue;
      /* 所有气必须落在同一个口袋里 */
      var pocketKeys = Object.keys(libRegion);
      if (pocketKeys.length !== 1) continue;
      var pocket = libRegion[pocketKeys[0]];
      /* 条件 2：口袋必须封闭（不接触棋盘边缘） */
      if (pocket.edge) continue;
      /* 条件 3：口袋四边只能有对方颜色 */
      var oppBorders = {};
      var hasOwnBorder = false;
      for (var b = 0; b < pocket.borders.length; b++) {
        var bi = pocket.borders[b];
        if (bd[bi] === g.color) hasOwnBorder = true;
        else oppBorders[bi] = 1;
      }
      if (hasOwnBorder) continue;
      var oppCount = Object.keys(oppBorders).length;
      if (!oppCount) continue;
      /* 条件 4：对方子数要多于自己，否则说明是"大片己方阵地"，不是死子 */
      if (oppCount <= g.stones.length) continue;

      for (var s = 0; s < g.stones.length; s++) dead.push(g.stones[s]);
    }
    return dead;
  }

  function scoreBoard() {
    /* 修复：先清理死子再数子。
       原实现直接统计棋盘上所有子，死子（被对方围住、实际已死）也算成对方的活子，
       导致终局比分错误。现在把死子从盘面上移除（记入对方 territory）。 */
    var scoreBd = board.slice();
    var dead = findDeadStones(scoreBd, N);
    var deadCount = dead.length;
    for (var d = 0; d < dead.length; d++) scoreBd[dead[d]] = 0;

    var bStones = 0, wStones = 0, bTerr = 0, wTerr = 0, neutral = 0;
    var total = N * N;
    var visited = [];
    var i;
    for (i = 0; i < total; i++) {
      visited[i] = false;
      if (scoreBd[i] === BLACK) bStones++;
      else if (scoreBd[i] === WHITE) wStones++;
    }
    for (i = 0; i < total; i++) {
      if (scoreBd[i] || visited[i]) continue;
      var stack = [i];
      var region = [];
      var borders = { b: 0, w: 0 };
      visited[i] = true;
      while (stack.length) {
        var idx = stack.pop();
        region.push(idx);
        var x = idx % N, y = Math.floor(idx / N);
        var ns = neighbors(x, y, N);
        for (var j = 0; j < ns.length; j++) {
          var nidx = ns[j][1] * N + ns[j][0];
          if (scoreBd[nidx] === BLACK) borders.b = 1;
          else if (scoreBd[nidx] === WHITE) borders.w = 1;
          else if (!visited[nidx]) { visited[nidx] = true; stack.push(nidx); }
        }
      }
      if (borders.b && !borders.w) bTerr += region.length;
      else if (borders.w && !borders.b) wTerr += region.length;
      else neutral += region.length;
    }
    var komi = KOMI[N] || 6.5;
    return {
      b: bStones + bTerr, w: wStones + wTerr + komi, komi: komi,
      bStones: bStones, wStones: wStones, bTerr: bTerr, wTerr: wTerr,
      neutral: neutral, dead: deadCount
    };
  }

  function fmtScoreButable(v) {
    return String(v % 1 === 0 ? v : v.toFixed(1));
  }

  function resultSub(sc) {
    if (!sc) return '';
    if (sc.caps) return '黑提 ' + sc.b + ' 子 · 白提 ' + sc.w + ' 子';
    var deadTxt = sc.dead > 0 ? '（已清 ' + sc.dead + ' 个死子）' : '';
    return '黑 ' + fmtScoreButable(sc.b) + ' 目 · 白 ' + fmtScoreButable(sc.w) + ' 目' +
      (typeof sc.komi === 'number' ? '（含贴目 ' + sc.komi + '）' : '') + deadTxt;
  }

  function finishGame(byCapture) {
    if (over) return;
    over = true;
    thinking = false;
    var sc;
    if (byCapture) {
      sc = { b: caps.b, w: caps.w, caps: true };
      scoreRes = sc;
      winner = sc.b > sc.w ? BLACK : (sc.w > sc.b ? WHITE : 0);
    } else {
      sc = scoreBoard();
      scoreRes = sc;
      winner = sc.b > sc.w ? BLACK : (sc.w > sc.b ? WHITE : 0);
    }
    updateTurnUI();
    draw();
    var subText = resultSub(sc);
    var endLabel = byCapture ? '提子满 ' + captureGoal() + ' 子' : '数子结束';
    if (mode === 'online') {
      var wqp = winnerPidOf(winner);
      var wq = winnerUidOf(winner);
      var iWin = wqp ? wqp === myPid() : (!!wq && wq === myUid());
      var winName = nameOf(wqp || wq);
      if (winner === 0) {
        showBanner('平局啦', subText);
        setStatus(endLabel + ' · 平局');
      } else if (online.role === 'spec') {
        showBanner(winName + ' 赢啦', subText);
        setStatus('观战结束 · ' + winName + ' 获胜');
      } else if (iWin) {
        setMood('happy');
        showBanner('你赢啦！', subText);
        setStatus('你赢啦，好厉害');
      } else {
        setMood('oops');
        showBanner(winName + ' 赢啦', subText);
        setStatus(winName + ' 赢啦，别灰心');
      }
      online.seq++;
      if (online.role === 'host') broadcastState(true);
      finishRecord();
      return;
    }
    if (mode === 'ai') {
      if (winner === WHITE) {
        setMood('oops');
        showBanner('电脑赢啦', subText);
        setStatus(byCapture ? (endLabel + '，电脑赢啦') : '电脑赢啦，别灰心');
      } else if (winner === BLACK) {
        setMood('happy');
        showBanner('你赢啦！', subText);
        setStatus(byCapture ? (endLabel + '，你赢啦！') : '你赢啦，好厉害');
        score.b++;
        saveScore();
      } else {
        setMood('calm');
        showBanner('平局啦', subText);
        setStatus(endLabel + ' · 平局');
      }
    } else {
      if (winner === BLACK) {
        setMood('happy');
        showBanner('黑棋赢啦！', subText);
        score.b++;
      } else if (winner === WHITE) {
        setMood('happy');
        showBanner('白棋赢啦！', subText);
        score.w++;
      } else {
        setMood('calm');
        showBanner('平局啦', subText);
      }
      saveScore();
      setStatus(endLabel + ' · ' + (winner === BLACK ? '黑棋胜' : winner === WHITE ? '白棋胜' : '平局'));
    }
    recordNow();
  }

  function finishRecord() {
    if (mode === 'online' && online.role === 'guest') {
      /* 朋友本地先落子，等房主确认终局后再入历史 */
      online.recordPending = true;
      return;
    }
    recordNow();
  }

  function recordNow() {
    var key = N + '|' + moves.length + '|' + winner;
    if (key === lastRecordKey) return;
    lastRecordKey = key;
    var mv = [];
    for (var i = 0; i < moves.length; i++) {
      var m = moves[i];
      mv.push(m.pass ? [-1, -1, m.c] : [m.x, m.y, m.c]);
    }
    records.unshift({
      ts: Date.now(), n: N, mv: mv, wi: winner || 0, mode: mode, sc: scoreRes,
      opp: mode === 'online' ? onlineOpponent() : '',
      oppName: mode === 'online' ? nameOf(onlineOpponent()) : '',
      oppPid: mode === 'online' ? onlineOpponentPid() : ''
    });
    if (records.length > RECORD_MAX) records.length = RECORD_MAX;
    saveRecords();
  }

  /* ---------- 重开 / 悔棋 ---------- */
  function newGame(fromRestart) {
    aiToken++;
    lastRecordKey = '';
    online.recordPending = false;
    closeHistory();
    closeFriends();
    hideBanner();
    resetState();
    updateTurnUI();
    relayout();
    setMood('calm');
    if (mode === 'ai') setStatus('轮到你啦，点交叉点落子');
    else if (mode === 'online') setStatus(online.room ? '等房间状态…' : '先创建或加入房间');
    else setStatus('黑棋先手，开始吧');
    if (fromRestart) saveSettings();
  }

  function resetState() {
    board = new Array(N * N);
    for (var i = 0; i < board.length; i++) board[i] = 0;
    moves = [];
    caps = { b: 0, w: 0 };
    turn = BLACK;
    over = false;
    winner = 0;
    scoreRes = null;
    koPoint = null;
    passCount = 0;
    lastMove = null;
    thinking = false;
    hoverCell = null;
    replay.on = false;
    if (els.actionRow) els.actionRow.hidden = false;
    if (els.replayActions) els.replayActions.hidden = true;
    if (els.spectatorBadge) els.spectatorBadge.classList.remove('on');
  }

  function rebuild(list) {
    var nb = new Array(N * N);
    for (var i = 0; i < nb.length; i++) nb[i] = 0;
    board = nb;
    caps = { b: 0, w: 0 };
    koPoint = null;
    lastMove = null;
    passCount = 0;
    over = false;
    winner = 0;
    scoreRes = null;
    moves = [];
    for (var j = 0; j < list.length; j++) {
      var m = list[j];
      if (m.pass || m.x < 0) {
        moves.push({ x: -1, y: -1, c: m.c, pass: true });
        passCount++;
        koPoint = null;
        lastMove = null;
        continue;
      }
      var r = legalMove(m.x, m.y, m.c, board, N, koPoint);
      if (!r.ok) continue;
      board = r.board;
      koPoint = r.ko;
      passCount = 0;
      lastMove = { x: m.x, y: m.y };
      if (r.captured.length) {
        if (m.c === BLACK) caps.b += r.captured.length; else caps.w += r.captured.length;
      }
      moves.push({ x: m.x, y: m.y, c: m.c });
    }
    turn = moves.length % 2 ? WHITE : BLACK;
    thinking = false;
    hoverCell = null;
    updateTurnUI();
    draw();
  }

  function undo() {
    if (replay.on) return;
    if (mode === 'online') {
      if (!online.room || !online.role) return;
      if (online.role === 'host') {
        if (!moves.length) { setStatus('还没有落子哦'); return; }
        var keep = moves.slice(0, Math.max(0, moves.length - 1));
        rebuild(keep);
        online.seq++;
        broadcastState(true);
        setStatus('已撤回一手');
      } else if (online.role === 'guest') {
        publish({ t: 'undo', u: myUid(), p: myPid(), q: online.seq });
        setStatus('悔棋请求已发给房主…');
      }
      return;
    }
    if (over) return;
    if (!moves.length) { setStatus('还没有落子哦'); return; }
    var back = 1;
    if (mode === 'ai') {
      if (moves.length >= 2) back = 2;
      else back = 1;
    }
    var keep2 = moves.slice(0, Math.max(0, moves.length - back));
    rebuild(keep2);
    hideBanner();
    setStatus(mode === 'ai' ? '悔棋成功，轮到你啦' : '悔棋成功');
  }

  /* ---------- 联机 ---------- */
  var RELAY = 'https://ntfy.sh/';
  var TOPIC_PREFIX = 'bg-go-';
  var LOBBY_TOPIC = TOPIC_PREFIX + 'lobby';
  /* 访客心跳超时阈值：超过这个时间没收到心跳，就认为对方已崩溃/断线，释放座位 */
  var GUEST_STALE_MS = 40000;
  /* 弱网参数：所有联机请求必须有超时，否则半开连接会一直占着浏览器连接数 */
  var REQUEST_TIMEOUT_MS = 4000;
  var PUBLISH_TIMEOUT_MS = 3000;
  var POLL_TIMEOUT_MS = 5000;
  var LINK_STALE_MS = 20000;
  /* 好友列表 / 设备身份 / 在线频道 与五子棋共用，两边的朋友都能看到对方在线 */
  var FRIEND_KEY = 'idol_friends_v1';
  var LEGACY_FRIEND_KEYS = ['go_friends_v1', 'gomoku_friends_v1'];
  var PRESENCE_PREFIX = 'bg-idol-presence-';
  var FRIEND_ONLINE_MS = 180000;
  var PID_KEY = 'idol_pid_v1';
  var friends = [];
  var inviteSeen = {};
  var presence = { seen: {}, since: {}, busy: {}, hb: 0, poll: 0, ui: 0, es: null, retry: 0, started: false };
  var online = {
    room: '', topic: '', role: 'none', hostUid: '', hostName: '房主', hostPid: '',
    guestUid: '', guestName: '', guestPid: '', seq: 0, lastSeq: -1,
    es: null, fail: 0, pollTimer: 0, lastTs: 0, pollFails: 0,
    pollOn: false, polling: false, pollCtrl: null, pollDelay: 1200, pollFastUntil: 0,
    lastHeard: 0, linkTimer: 0, midSeq: 0, seenMids: [], gen: 0,
    hbTimer: 0, watchdog: 0, lastStateAt: 0, stateTimer: 0, seen: {}, denied: {}, lastState: 0,
    uid: '', hostColor: BLACK, undoReq: '', recordPending: false, baseMeta: '',
    /* 修复：记录访客入座时间与建房探测状态，用于掉线释放与房间号查重 */
    guestSince: 0, roomProbe: null, roomTries: 0, roomInvite: null
  };
  /* 房间大厅：房主定时广播房间信息，其他人打开「房间」时轮询汇总 */
  var lobby = { open: false, listTimer: 0, pubTimer: 0, loading: false, items: [] };

  function myUid() { return online.uid || me.uid; }

  /* 房间身份统一用设备 pid：同一账号在两台设备上也能区分，不会自己收到自己的消息 */
  function idOf(m) { return (m && (m.p || m.u)) || ''; }

  function isGuestMsg(m) {
    var id = idOf(m);
    if (online.guestPid) return id === online.guestPid;
    return !!online.guestUid && (m.u === online.guestUid);
  }

  /* 每台设备一个固定身份：好友在线状态/加好友都用它，避免同账号或换账号导致频道对不上 */
  function myPid() {
    return me.pid || me.uid;
  }

  function friendColor() {
    return online.hostColor === BLACK ? WHITE : BLACK;
  }

  /* 谁赢了：按“胜利颜色 → 账号”的映射取 uid，避免两台设备颜色/角色不同步时张冠李戴 */
  function winnerUidOf(color) {
    if (!color) return '';
    var mine = myColor();
    if (mine && color === mine) return myUid();
    if (online.role === 'host') return online.guestUid || '';
    if (online.role === 'guest') return online.hostUid || '';
    return color === online.hostColor ? online.hostUid : online.guestUid;
  }

  /* 同账号多设备时 uid 分不清是谁赢，按设备 pid 判定 */
  function winnerPidOf(color) {
    if (!color) return '';
    if (online.role === 'host') return color === online.hostColor ? myPid() : (online.guestPid || '');
    if (online.role === 'guest') return color === friendColor() ? myPid() : (online.hostPid || '');
    return color === online.hostColor ? (online.hostPid || '') : (online.guestPid || '');
  }

  function myColor() {
    if (online.role === 'host') return online.hostColor;
    if (online.role === 'guest') return friendColor();
    return 0;
  }

  function nameOf(id) {
    var seenName = online.seen[id] && online.seen[id].n;
    if (id === online.hostPid || (id && !online.hostPid && id === online.hostUid)) return online.hostName || seenName || '房主';
    if (id === online.guestPid || (id && !online.guestPid && id === online.guestUid)) return online.guestName || seenName || '朋友';
    return seenName || '朋友';
  }

  function makeRoomCode() {
    var code = '';
    for (var i = 0; i < 6; i++) code += String(Math.floor(Math.random() * 10));
    if (code[0] === '0') code = '1' + code.slice(1);
    return code;
  }

  /* 修复：房间号碰撞检测。
     6 位数字房间号空间有限，随机生成必然会撞号。
     原实现直接用随机号建房，若该号已被别人占用，两个房主同时往同一频道发消息，
     双方状态互相覆盖，棋局直接错乱。
     这里建房后监听一小段时间：若收到对端的状态广播(st)，说明该号已有房主，
     换一个号重建，最多尝试若干次。 */
  function createRoomWithRetry() {
    var code = makeRoomCode();
    online.roomProbe = { code: code, until: Date.now() + 1200, done: false };
    createRoom(code);
    /* 探测窗口结束后若没有发现冲突，就认为房号可用 */
    window.setTimeout(function () {
      var pr = online.roomProbe;
      if (!pr || pr.done) return;
      pr.done = true;
      if (online.room === pr.code) sendRoomInvite();
    }, 1400);
  }

  function onRoomProbeConflict() {
    if (!online.roomProbe || online.roomProbe.done) return;
    online.roomProbe.done = true;
    var tries = (online.roomTries || 0) + 1;
    online.roomTries = tries;
    if (tries > 5) {
      online.roomProbe = null;
      leaveRoom(true);
      setStatus('房间号一直被占用，请稍后再试');
      return;
    }
    leaveRoom(true);
    setStatus('房间号被占用，正在换一个…');
    createRoomWithRetry();
  }

  /* 修复：访客崩溃后房间座位永久被占。
     原实现只有访客主动发 bye 时才释放座位；一旦访客直接杀进程/断网，
     bye 永远收不到，房间再也进不来第二个人。
     这里用心跳时间戳兜底：访客每 12 秒发一次 hi，超过 GUEST_STALE_MS 没来
     就判定对方已离线，主动清掉座位并重新开放房间。 */
  function reclaimStaleGuest() {
    if (online.role !== 'host' || !online.guestPid) return;
    var info = online.seen[online.guestPid];
    var last = info && info.ts ? info.ts : 0;
    if (!last) {
      if (online.guestSince && Date.now() - online.guestSince < GUEST_STALE_MS) return;
      last = online.guestSince || 0;
    }
    if (!last) return;
    if (Date.now() - last < GUEST_STALE_MS) return;
    var goneName = online.guestName || '朋友';
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.guestSince = 0;
    online.seq++;
    renderPending();
    refreshOnlineUI();
    updateTurnUI();
    broadcastState(true);
    setStatus(goneName + ' 掉线了，座位已释放');
    showBanner(goneName + ' 掉线了', '座位已释放，可以邀请新朋友进来');
  }

  /* 修复：kick 只处理接收端，房主没有发送入口，无法把赖着不走的对手请出去。
     这里补上发送端：房主点「移出对手」后广播 kick，被请的人转为观战并离开座位。 */
  function kickGuest() {
    if (online.role !== 'host' || !online.guestPid) return;
    var pid = online.guestPid;
    var uid = online.guestUid || '';
    var name = online.guestName || nameOf(pid);
    publish({ t: 'kick', u: uid, p: pid, gp: pid, b: online.hostUid, bp: online.hostPid || myPid() });
    online.guestUid = '';
    online.guestName = '';
    online.guestPid = '';
    online.guestSince = 0;
    online.seq++;
    renderPending();
    refreshOnlineUI();
    updateTurnUI();
    broadcastState(true);
    setStatus('已把 ' + name + ' 移出房间');
    showBanner(name + ' 已被移出', '你可以邀请新朋友进来');
  }

  /* 弱网兜底：所有联机请求都带超时，避免半开连接把界面拖死 */
  function timedFetch(url, opts, ms) {
    opts = opts || {};
    if (!window.AbortController) return window.fetch(url, opts);
    var ac = new window.AbortController();
    var timer = window.setTimeout(function () { try { ac.abort(); } catch (e) { /* ignore */ } }, ms || REQUEST_TIMEOUT_MS);
    opts.signal = ac.signal;
    return window.fetch(url, opts).then(function (r) {
      window.clearTimeout(timer);
      return r;
    }, function (e) {
      window.clearTimeout(timer);
      throw e;
    });
  }

  /* 每条消息带唯一 mid：轮询和 SSE 会重复投递同一条消息，接收端据此去重，
     否则重复的 mv/pass 会被当成新一手，触发房主反复回推全量状态。 */
  function newMid() {
    online.midSeq++;
    return myPid() + '-' + Date.now().toString(36) + '-' + online.midSeq;
  }

  function publish(msg) {
    if (!online.topic) return Promise.resolve(false);
    if (!msg.mid) msg.mid = newMid();
    var body = JSON.stringify(msg);
    var attempt = 0;
    var limited = false;
    function send() {
      attempt++;
      return timedFetch(RELAY + online.topic, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: body
      }, PUBLISH_TIMEOUT_MS).then(function (r) {
        if (r && r.status === 429) { limited = true; return false; }
        return !!(r && r.ok);
      }, function () {
        return false;
      }).then(function (ok) {
        if (ok) online.lastHeard = Date.now();
        if (ok || limited || attempt >= 3) return ok;
        return new Promise(function (resolve) {
          window.setTimeout(function () { resolve(send()); }, attempt === 1 ? 500 : 1200);
        });
      });
    }
    return send();
  }

  /* ---------------- 好友 & 在线状态 ---------------- */

  function loadFriends() {
    var keys = [FRIEND_KEY, FRIEND_KEY + '_bak'];
    for (var lk = 0; lk < LEGACY_FRIEND_KEYS.length; lk++) {
      keys.push(LEGACY_FRIEND_KEYS[lk], LEGACY_FRIEND_KEYS[lk] + '_bak');
    }
    /* 合并共用列表和旧版各自的列表，避免升级后好友丢失 */
    var merged = [];
    for (var ki = 0; ki < keys.length; ki++) {
      try {
        var raw = window.localStorage.getItem(keys[ki]);
        if (!raw) continue;
        var arr = JSON.parse(raw);
        if (!Array.isArray(arr)) continue;
        for (var i = 0; i < arr.length && merged.length < 50; i++) {
          var f = arr[i];
          if (!f || !((typeof f.u === 'string' && f.u) || (typeof f.p === 'string' && f.p))) continue;
          if (!f.p) f.p = f.u;
          var hit = null;
          for (var j = 0; j < merged.length; j++) {
            if ((f.p && merged[j].p === f.p) || (f.u && merged[j].u === f.u)) { hit = merged[j]; break; }
          }
          if (hit) {
            if (!hit.p && f.p) hit.p = f.p;
            if (!hit.u && f.u) hit.u = f.u;
            if (!hit.n && f.n) hit.n = f.n;
            if (!hit.f && f.f) hit.f = f.f;
          } else {
            merged.push({ p: f.p || '', u: f.u || '', n: f.n || '', f: f.f || '' });
          }
        }
      } catch (e) { /* try next */ }
    }
    friends = merged;
    saveFriends();
  }

  function saveFriends() {
    try {
      var raw = JSON.stringify(friends);
      window.localStorage.setItem(FRIEND_KEY, raw);
      window.localStorage.setItem(FRIEND_KEY + '_bak', raw);
    } catch (e) { /* ignore */ }
  }

  function friendTopic(uid) {
    return PRESENCE_PREFIX + String(uid || '').toLowerCase();
  }

  function publishTopic(topic, msg) {
    if (!topic) return Promise.resolve(false);
    return timedFetch(RELAY + topic, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(msg)
    }, REQUEST_TIMEOUT_MS).then(function (r) { return r.ok; }).catch(function () { return false; });
  }

  function findFriend(uid) {
    if (!uid) return null;
    for (var i = 0; i < friends.length; i++) {
      if (friends[i].u === uid || friends[i].p === uid) return friends[i];
    }
    return null;
  }

  function isFriend(uid) {
    return !!findFriend(uid);
  }

  function friendKeyOf(f) {
    return (f && (f.p || f.u)) || '';
  }

  function addFriend(key, name, face, uid) {
    if (!key) return null;
    if (key === myPid() || (uid && uid === myUid() && key === myUid())) return null;
    var f = findFriend(key);
    if (!f) {
      f = { p: key, u: uid || '', n: '', f: '' };
      friends.push(f);
    } else {
      f.p = key;
      if (uid) f.u = uid;
    }
    if (name) f.n = String(name);
    if (face) f.f = String(face);
    saveFriends();
    renderFriends();
    return f;
  }

  function friendAction(uid, name, face, pid) {
    var key = pid || uid;
    if (!key) return;
    if (key === myPid()) return;
    var fresh = !isFriend(key);
    addFriend(key, name || '朋友', face || '', uid || (pid ? '' : key));
    publishTopic(friendTopic(key), { t: 'fa', u: myUid(), p: myPid(), n: me.name, f: me.face || '' });
    setStatus(fresh ? ('已和 ' + (name || '朋友') + ' 加为好友') : '你们已经是好友啦');
    refreshFriendBtn();
  }

  function refreshFriendBtn() {
    if (!els.winFriendBtn) return;
    var opp = onlineOpponent();
    var opid = onlineOpponentPid();
    els.winFriendBtn.hidden = !(mode === 'online' && over && (opp || opid) && !isFriend(opid || opp));
  }

  function onlineOpponentPid() {
    if (online.role === 'host') return online.guestPid || '';
    if (online.role === 'guest') return online.hostPid || '';
    return '';
  }

  function onlineOpponent() {
    if (online.role === 'host') return online.guestUid || '';
    if (online.role === 'guest') return online.hostUid || '';
    return '';
  }

  function pushPresence() {
    if (!me.uid) return;
    var fs = [];
    for (var i = 0; i < friends.length && i < 50; i++) {
      if (friends[i]) { var fk = friendKeyOf(friends[i]); if (fk) fs.push(fk); }
    }
    var msg = {
      t: 'p', u: me.uid, p: myPid(), n: me.name, f: me.face || '',
      r: (online.role === 'host' && online.room) ? online.room : '', g: 'go',
      fs: fs
    };
    publishTopic(friendTopic(myPid()), msg);
    /* 旧版好友还在按账号 uid 订阅：隔一会儿在 uid 主题补一条带 pid 的心跳，对方收到后自动迁移到 pid */
    var nowMs = Date.now();
    if (!presence.lastLegacy || nowMs - presence.lastLegacy > 45000) {
      presence.lastLegacy = nowMs;
      var legacy = [me.uid].concat(me.aliases || []);
      for (var k = 0; k < legacy.length && k < 4; k++) {
        var lu = legacy[k];
        if (!lu || lu === myPid()) continue;
        publishTopic(friendTopic(lu), msg);
      }
    }
  }

  /* 登录后 uid 变了：在旧主题上广播一条改名消息，好友那边跟着换主题，不再显示离线 */
  function announceUidChange(oldUid, newUid) {
    if (!oldUid || !newUid || oldUid === newUid) return;
    publishTopic(friendTopic(oldUid), {
      t: 'iu', o: oldUid, u: newUid, p: myPid(), n: me.name, f: me.face || ''
    });
  }

  function startPresence() {
    if (presence.started || !me.uid) return;
    presence.started = true;
    pushPresence();
    presence.hb = window.setInterval(pushPresence, 30000);
    presence.poll = window.setInterval(pollPresence, 45000);
    presence.ui = window.setInterval(renderFriends, 10000);
    startOwnPresenceStream();
    pollPresence();
  }

  /* 自己的好友主题挂一路 SSE：好友「邀战」能立刻收到，不用等 30 秒轮询 */
  function startOwnPresenceStream() {
    if (presence.es || !window.EventSource || !me.uid) return;
    try {
      var es = new window.EventSource(RELAY + friendTopic(myPid()) + '/sse');
      presence.es = es;
      es.onmessage = function (ev) {
        try {
          var o = JSON.parse(ev.data);
          var inner = o && typeof o.message === 'string' ? o.message : ev.data;
          handleOwnPresenceMsg(typeof inner === 'string' ? JSON.parse(inner) : inner);
        } catch (e) { /* ignore */ }
      };
      es.onerror = function () {
        try { es.close(); } catch (e) { /* ignore */ }
        if (presence.es === es) presence.es = null;
        /* 弱网下 SSE 会静默断开：稍后重建，否则好友邀战/在线状态要等轮询才更新 */
        if (!presence.started || presence.retry) return;
        presence.retry = window.setTimeout(function () {
          presence.retry = 0;
          if (presence.started) startOwnPresenceStream();
        }, 8000);
      };
    } catch (e) { presence.es = null; }
  }

  function stopPresence() {
    if (presence.hb) window.clearInterval(presence.hb);
    if (presence.poll) window.clearInterval(presence.poll);
    if (presence.ui) window.clearInterval(presence.ui);
    if (presence.retry) { window.clearTimeout(presence.retry); presence.retry = 0; }
    if (presence.es) {
      try { presence.es.close(); } catch (e) { /* ignore */ }
      presence.es = null;
    }
    presence.hb = 0;
    presence.poll = 0;
    presence.ui = 0;
    presence.started = false;
    presence.since = {};
    presence.seen = {};
    presence.busy = {};
  }

  function pollPresence() {
    if (!me.uid) return;
    pollPresenceTopic(friendTopic(myPid()), true);
    /* 自己的旧账号主题：旧版好友按 uid 发来的加好友/心跳还能收到（降频，避免公共频道限流） */
    var nowMs = Date.now();
    if (!presence.lastLegacyPoll || nowMs - presence.lastLegacyPoll > 45000) {
      presence.lastLegacyPoll = nowMs;
      var legacy = [me.uid].concat(me.aliases || []);
      for (var k = 0; k < legacy.length && k < 4; k++) {
        var lu = legacy[k];
        if (!lu || lu === myPid()) continue;
        pollPresenceTopic(friendTopic(lu), true);
      }
    }
    /* 好友多时不要一次性打满公共中转的请求配额：每轮最多查 12 个，轮转推进。
       在线判定阈值是 180 秒，45 秒一轮、多轮覆盖完全够用。 */
    var total = friends.length;
    var limit = Math.min(total, 12);
    var start = total ? (presence.rr || 0) % total : 0;
    for (var i = 0; i < limit; i++) {
      var idx = (start + i) % total;
      pollPresenceTopic(friendTopic(friendKeyOf(friends[idx])), false);
    }
    if (total) presence.rr = (start + limit) % total;
  }

  /* ntfy 的 /json 是 NDJSON：一行一条消息（多条时整段 JSON.parse 会直接抛错），必须逐行解析 */
  function readNdjson(r) {
    if (r && !r.ok) return Promise.reject(new Error('http ' + r.status));
    return r.text().then(function (txt) {
      var out = [], lines = String(txt || '').split('\n');
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].replace(/^\s+|\s+$/g, '');
        if (!line) continue;
        try { out.push(JSON.parse(line)); } catch (e) { /* 坏行跳过 */ }
      }
      return out;
    });
  }

  function pollPresenceTopic(topic, own) {
    if (!topic || presence.busy[topic]) return;
    presence.busy[topic] = 1;
    var prev = presence.since[topic];
    var since = prev || (own ? '6h' : '10m');
    timedFetch(RELAY + topic + '/json?poll=1&since=' + since, {}, REQUEST_TIMEOUT_MS)
      .then(readNdjson)
      .then(function (list) {
        var maxTime = 0;
        for (var i = 0; i < list.length; i++) {
          if (list[i] && list[i].time) maxTime = Math.max(maxTime, list[i].time);
          var raw = list[i] && list[i].message;
          if (!raw) continue;
          var m;
          try { m = JSON.parse(raw); } catch (e) { continue; }
          if (own) handleOwnPresenceMsg(m);
          else handlePresenceMsg(m);
        }
        if (maxTime) presence.since[topic] = Math.max(1, maxTime - 1);
        else if (typeof prev === 'number') presence.since[topic] = prev;
        else presence.since[topic] = Math.floor(Date.now() / 1000) - 30;
      }).catch(function () { /* 失败不推进游标，下轮重试 */ })
      .then(function () { delete presence.busy[topic]; });
  }

  function isMyKey(key) {
    if (!key) return false;
    if (key === myPid()) return true;
    if (key === myUid()) return true;
    return !!(me.aliases && me.aliases.indexOf(key) >= 0);
  }

  /* 自己的主题：别人加我的 fa、我自己心跳里的 fs —— localStorage 被清也能把好友找回来 */
  function handleOwnPresenceMsg(m) {
    if (!m || !m.t) return;
    if (m.t === 'fa') { handlePresenceMsg(m); return; }
    if (m.t === 'inv') { acceptInvite(m); return; }
    if (m.t === 'invno') {
      setStatus((m.n || '好友') + ' 正在对局中，稍后再约');
      return;
    }
    var key = m.p || m.u;
    if (!key || !isMyKey(key)) return;
    if (m.t === 'p' && Array.isArray(m.fs)) {
      var changed = false;
      for (var i = 0; i < m.fs.length && i < 50; i++) {
        var kid = m.fs[i];
        if (typeof kid !== 'string' || !kid || isMyKey(kid)) continue;
        if (!findFriend(kid)) { friends.push({ p: kid, u: '', n: '', f: '' }); changed = true; }
      }
      if (changed) { saveFriends(); renderFriends(); }
    }
  }

  function handlePresenceMsg(m) {
    if (!m || !m.t) return;
    var key = m.p || m.u;
    if (!key) return;
    if (m.t === 'iu') {
      if (isMyKey(m.p || m.u)) return;
      var old = findFriend(m.o) || findFriend(m.u);
      if (old) {
        old.p = m.p || m.u;
        if (m.u) old.u = m.u;
        if (m.n) old.n = m.n;
        if (m.f) old.f = m.f;
        saveFriends();
        renderFriends();
      }
      return;
    }
    if (isMyKey(key) || (m.u && m.u === myUid() && !m.p)) return;
    if (m.t === 'p') {
      var prev = presence.seen[key] || {};
      presence.seen[key] = {
        ts: Date.now(),
        n: typeof m.n === 'string' && m.n ? m.n : (prev.n || '朋友'),
        f: typeof m.f === 'string' ? m.f : (prev.f || ''),
        r: typeof m.r === 'string' ? m.r : ''
      };
      if (m.u && m.u !== key) presence.seen[m.u] = presence.seen[key];
      var fr = findFriend(key) || (m.u ? findFriend(m.u) : null);
      if (fr) {
        var needSave = false;
        if (key && fr.p !== key) { fr.p = key; needSave = true; }
        if (m.n && fr.n !== m.n) { fr.n = String(m.n); needSave = true; }
        if (m.f && fr.f !== m.f) { fr.f = String(m.f); needSave = true; }
        if (m.u && fr.u !== m.u) { fr.u = String(m.u); needSave = true; }
        if (needSave) saveFriends();
      }
      renderFriends();
      return;
    }
    if (m.t === 'fa') {
      var fresh = !isFriend(key);
      addFriend(key, m.n || '朋友', m.f || '', m.u || '');
      if (fresh) {
        setStatus((m.n || '朋友') + ' 也加你为好友啦');
        renderFriends();
      }
    }
  }

  function friendAvatar(f) {
    var box = document.createElement('span');
    box.className = 'friend-avatar';
    if (f.f) {
      var img = document.createElement('img');
      img.src = f.f;
      img.alt = '';
      img.addEventListener('error', function () {
        box.removeChild(img);
        box.textContent = initialOf(f.n);
      });
      box.appendChild(img);
    } else {
      box.textContent = initialOf(f.n);
    }
    return box;
  }

  function initialOf(name) {
    var s = String(name || '友').trim();
    return s ? s.slice(-1) : '友';
  }

  function openFriends() {
