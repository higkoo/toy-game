<script>const D=[{"t": "一、琴", "h": "古琴与修身", "c": "**古人抚琴，重在调心，不在炫技。**琴声被当作安顿心神的方式。一种乐器，被赋予了修养的功能。", "o": "文化史话整理 · 琴棋雅集", "g": "风物"}, {"t": "一、琴", "h": "伯牙子期与知音", "c": "**「高山流水遇知音」的典故，让琴成了心灵相通的象征。**知音难觅，是中国人情感表达的重要母题。", "o": "文化史话整理 · 琴棋雅集", "g": "典故"}, {"t": "一、琴", "h": "琴曲与四季", "c": "**许多琴曲以自然为题，如《春晓吟》《秋塞吟》。**音乐与自然节律的对应，是传统审美的重要内容。", "o": "文化史话整理 · 琴棋雅集", "g": "典故"}, {"t": "一、琴", "h": "琴的形制与天地", "c": "**古琴的形制、尺寸常被赋予天地象征。**一件乐器的构造，被解释为宇宙秩序的缩影。", "o": "文化史话整理 · 琴棋雅集", "g": "风物"}, {"t": "二、棋", "h": "围棋与天地", "c": "**围棋棋盘象征天地，黑白二子象征阴阳。**一局棋，被看作宇宙运行的模型。", "o": "文化史话整理 · 琴棋雅集", "g": "典故"}, {"t": "二、棋", "h": "弈棋与静心", "c": "**古人认为弈棋可以凝神静气。**棋不仅是竞技，也是一种心性的修炼。", "o": "文化史话整理 · 琴棋雅集", "g": "风物"}, {"t": "二、棋", "h": "棋品与人品", "c": "**传统常以棋风论人品，讲究「棋品」。**一种游戏，被纳入道德评价的体系。", "o": "文化史话整理 · 琴棋雅集", "g": "典故"}, {"t": "二、棋", "h": "烂柯山的传说", "c": "**「烂柯」传说讲樵夫观仙人下棋，斧柄朽烂，世事已非。**一局棋，成了时间流逝的隐喻。", "o": "文化史话整理 · 琴棋雅集", "g": "典故"}, {"t": "三、书", "h": "书法与气", "c": "**传统书论讲究「气韵生动」，以气论文字。**写字被看作气息的流动与心性的流露。", "o": "文化史话整理 · 琴棋雅集", "g": "典故"}, {"t": "三、书", "h": "王羲之与兰亭", "c": "**《兰亭集序》既是书法名作，也是文学名篇。**一篇文字，成就了双重经典。", "o": "文化史话整理 · 琴棋雅集", "g": "人物"}, {"t": "三、书", "h": "临帖与修养", "c": "**练字讲求临帖、持之以恒，被当作磨炼心性的过程。**日复一日的临写，是一种静的修行。", "o": "文化史话整理 · 琴棋雅集", "g": "风物"}, {"t": "三、书", "h": "书法的身体性", "c": "**书法讲究执笔、运腕、身法，是身体的艺术。**写字时身体的舒展，本身就被认为有益身心。", "o": "文化史话整理 · 琴棋雅集", "g": "风物"}, {"t": "四、画", "h": "文人画与写意", "c": "**文人画重写意、轻形似，强调抒发胸臆。**画的是物，抒的是心。", "o": "文化史话整理 · 琴棋雅集", "g": "典故"}, {"t": "四、画", "h": "山水画与卧游", "c": "**古人看山水画，称为「卧游」，不必出门而游山水。**一幅画，提供了精神上的远行。", "o": "文化史话整理 · 琴棋雅集", "g": "典故"}, {"t": "四、画", "h": "梅兰竹菊四君子", "c": "**四君子题材，把人格理想寄托于草木。**画花画竹，其实是画自己的志向。", "o": "文化史话整理 · 琴棋雅集", "g": "风物"}, {"t": "四、画", "h": "绘画与养生", "c": "**作画、赏画被认为可以怡情养性。**艺术活动在传统里，被赋予了安顿心灵的功能。", "o": "文化史话整理 · 琴棋雅集", "g": "风物"}, {"t": "五、雅集文化", "h": "兰亭雅集", "c": "**王羲之等人在兰亭曲水流觞、诗文唱和，成为雅集的典范。**一次聚会，定义了文人交往的理想样式。", "o": "文化史话整理 · 琴棋雅集", "g": "典故"}, {"t": "五、雅集文化", "h": "竹林七贤", "c": "**竹林七贤以放达、清谈著称，象征一种精神自由。**他们的人格与生活方式，影响了后世文人。", "o": "文化史话整理 · 琴棋雅集", "g": "人物"}, {"t": "五、雅集文化", "h": "以西园雅集为题材", "c": "**后世常以「西园雅集」等题材作画，追慕前贤。**对雅集的想象，本身就是一种文化传统。", "o": "文化史话整理 · 琴棋雅集", "g": "典故"}, {"t": "五、雅集文化", "h": "茶、香、琴、书", "c": "**这几样器物，构成了文人雅集的基本元素。**雅，是一种被精心设计的生活美学。", "o": "文化史话整理 · 琴棋雅集", "g": "风物"}];</script>
