<script>const D=[{"t": "一、四象与神话", "h": "青龙、白虎：四方之神", "c": "**古有青龙、白虎、朱雀、玄武「四象」，分别对应东西南北。**以四象之名入方，是把天地的方位观念带入命名。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "一、四象与神话", "h": "小青龙与大青龙", "c": "**「青龙」之名，取东方木神、升发之象。**名字里带着神话色彩，让一张方子有了想象力。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "一、四象与神话", "h": "白虎与西方之象", "c": "**白虎对应西方金气，在传统文化中主肃杀。**以白虎名方，是取象于天地秩序，而非字面。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "一、四象与神话", "h": "以龙蛇命名的意象", "c": "**传统命名常用龙、蛇等意象，取其灵动、变化。**名字的意象，往往比具体内容更先被记住。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "二、人格与心境", "h": "逍遥：一种精神理想", "c": "**「逍遥」出自《庄子》，指无拘无束的精神境界。**以之命名，寄托着对自在心境的向往。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "二、人格与心境", "h": "玉屏风：屏风与君子", "c": "**屏风是古代隔断空间的家具，「玉」显其贵。**以此为名，既有器物之美，又取「屏障」保护的意象。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "二、人格与心境", "h": "归脾、养心：名字里的情志", "c": "**有些方名直接写入「脾」「心」等字，也有「定志」「安神」一类。**这些名字反映出古人对身心关系的语言习惯。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "二、人格与心境", "h": "以「君子」为名", "c": "**传统文化常以君子之德喻物，方名中亦可见。**命名的背后，是一整套价值语言。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "三、器物与自然", "h": "桂枝：以主药为名", "c": "**许多方名取自其中一味主药，如桂枝之类。**以主药名方，是最朴素也最直观的命名方式。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "三、器物与自然", "h": "以植物名方", "c": "**芍药、麻黄、杏仁等植物之名，常直接进入方名。**草木之名入方，是博物学与传统语言的交汇。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "三、器物与自然", "h": "以泉、露、丹为名", "c": "**「甘露」「玉露」「丹」等字，带着神仙方术的色彩。**名字里的仙气，反映出古人对「灵验」的向往。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "三、器物与自然", "h": "「汤、散、丸、丹」的讲究", "c": "**传统剂型有汤、散、丸、丹、膏等，各有名称与形态。**从剂型名，也能读出一门学问的分类方式。", "o": "文化史话整理 · 方名拾趣", "g": "风物"}, {"t": "四、数字与秩序", "h": "方名里的数字", "c": "**「一」「二」「三」乃至「十」常出现在方名中，或表味数，或表次序。**数字入名，是分类与记忆的需要。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "四、数字与秩序", "h": "以方位命名的方", "c": "**有些方名带东、西、南、北，取方位之象。**把空间观念带进命名，是整体思维的体现。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "四、数字与秩序", "h": "古方与今方", "c": "**称「古方」「今方」，是一种时间上的区分。**一古今之别，背后是学术源流的变迁。", "o": "文化史话整理 · 方名拾趣", "g": "典籍"}, {"t": "四、数字与秩序", "h": "经方：一个特定的概念", "c": "**「经方」原指经验之方，后被用来尊称经典中的方剂。**一个词的含义，会随学术史而变。", "o": "文化史话整理 · 方名拾趣", "g": "典籍"}, {"t": "五、命名的文化", "h": "方名与记忆", "c": "**好的方名便于记诵，是知识口传时代的智慧。**名字取得巧，流传就广。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "五、命名的文化", "h": "方名的避俗与求雅", "c": "**古人给方取名，往往避俗求雅。**雅化的命名，是文化趣味的一种表达。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "五、命名的文化", "h": "同名与异名", "c": "**同一内容可能有多个名字，不同内容也可能同名。**名实之辨，是传统学术的重要课题。", "o": "文化史话整理 · 方名拾趣", "g": "典籍"}, {"t": "五、命名的文化", "h": "方名在文学里", "c": "**方名偶尔进入诗词、小说，成了文化符号。**名字一旦流传，就脱离原本语境独立生活。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}, {"t": "五、命名的文化", "h": "命名的寓意与期许", "c": "**方名常寄托着古人对健康的美好期许。**名字本身，就是一种心理的安顿。", "o": "文化史话整理 · 方名拾趣", "g": "典故"}];</script>

(function () {
  'use strict';

  function num() { try { return parseInt(window.localStorage.getItem(KEY), 10) || 0; } catch (e) { return 0; } }
  function put(v) { try { window.localStorage.setItem(KEY, String(v)); } catch (e) {} }
  function sdk() {
    var list = [window.toy, window.Toy, window.toy && window.toy.toy, window.Toy && window.Toy.toy];
    for (var i = 0; i < list.length; i++) if (list[i] && typeof list[i].submitScore === 'function') return list[i];
    return null;
  }
  function send(score) {
    var t = sdk(); if (!t) return;
    try { t.submitScore({ score: score, board: 1 }); } catch (e) {}
  }
  var sk = KEY + '.seen', seen = [];
  try { seen = JSON.parse(window.localStorage.getItem(sk) || '[]') || []; } catch (e) { seen = []; }
  if (!Array.isArray(seen)) seen = [];
  if (seen.indexOf(FILE) === -1) {
    seen.push(FILE);
    try { window.localStorage.setItem(sk, JSON.stringify(seen)); } catch (e) {}
    var v = num() + 1; put(v); send(v);
  }
})();
