<script>const D=[{"t": "一、经典群像", "h": "《难经》：以问答解经典", "c": "**《难经》以设问作答的形式，讨论《内经》中的疑难。**「难」是诘问、辨析之意。以问答体著书，是古人讲学的一种常见方式。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "一、经典群像", "h": "《针灸甲乙经》的编次", "c": "**皇甫谧把散乱的经脉内容编次成《针灸甲乙经》，以天干分卷。**「甲乙」是编次的序号。一部书的有序，来自整理者的条理之功。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "一、经典群像", "h": "《脉经》：王叔和的集大成", "c": "**王叔和著《脉经》，把前代散见的诊察内容系统化。**他把经验编成可传授的体系。集大成之作，往往由善于整理的学者完成。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "一、经典群像", "h": "《诸病源候论》：一部病因症候的百科", "c": "**隋代巢元方等编撰《诸病源候论》，广列各种症候与源流。**它体现了古人对现象分类归纳的巨大热情。分类，是认识世界的第一步。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "一、经典群像", "h": "《备急千金要方》：孙思邈的巨著", "c": "**孙思邈《千金要方》卷帙浩繁，兼收博采。**书名「千金」，取人命贵重之意。一部书的分量，往往与其背后的生命观相称。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "一、经典群像", "h": "《外台秘要》：王焘的汇编", "c": "**唐代王焘编《外台秘要》，广泛汇集前代方书内容。**他勤于搜罗，保存了许多已散佚的文献。汇编之功，在于「存亡继绝」。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "二、本草一脉", "h": "《本草经集注》的体例创新", "c": "**陶弘景《本草经集注》按自然属性重新分类药物，首创按玉石、草木、虫兽等分部的体例。**分类方式的改变，是学术进步的重要标志。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "二、本草一脉", "h": "《新修本草》：图文并茂的官修书", "c": "**《新修本草》由朝廷组织编修，附有药图与图经。**图文并茂的形式，是博物学传播的一大进步。看见，才更容易认识。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "二、本草一脉", "h": "《本草纲目》的分类体系", "c": "**李时珍《本草纲目》按水、火、土、金石、草、谷、菜、果、木等分部，体系严整。**从无机到有机、从植物到动物，暗含着朴素的自然演进次序。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "二、本草一脉", "h": "《本草纲目》的海外回响", "c": "**《本草纲目》很早就传入日本、欧洲，被译介研究。**一部书越出海疆，就成了世界认识中国的一扇窗。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "三、宋元整理", "h": "校正医书局：官方的校勘机构", "c": "**宋代设校正医书局，由学者校勘刊行包括医籍在内的典籍。**印刷术加官方校勘，让许多古籍第一次有了稳定版本。技术加制度，成就了知识的普及。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "三、宋元整理", "h": "《太平惠民和剂局方》", "c": "**宋代由官方颁行《和剂局方》，规范成方。**它是药物配方标准化的早期尝试。标准化，是知识走向公共领域的重要一步。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "三、宋元整理", "h": "《圣济总录》：一部宏大的官修书", "c": "**北宋官修《圣济总录》，规模宏大，汇集大量内容。**官修大书，体现着一个时代对知识的系统整理欲望。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "三、宋元整理", "h": "金元四大家的著述之争", "c": "**金元时期学派林立，各家著述争鸣。**不同主张互相论辩，共同把医学思想推向深入。学术的活力，往往来自分歧而非一致。", "o": "文化史话整理 · 典籍流传", "g": "人物"}, {"t": "四、明清集大成", "h": "《医宗金鉴》：官方教科书", "c": "**清代官修《医宗金鉴》，内容系统、图文并茂，长期作为医学教育的读本。**一本好的教科书，影响远胜许多专门著作。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "四、明清集大成", "h": "《古今图书集成》中的医部", "c": "**大型类书《古今图书集成》设有医药相关部类，汇集历代文献。**类书是古代的知识数据库，为后人保存了大量材料。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "四、明清集大成", "h": "《四库全书》与医籍整理", "c": "**清代编修《四库全书》，收录并整理大量医籍。**大型丛书工程，对典籍的保存与辨析功不可没。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "四、明清集大成", "h": "丛书的流行", "c": "**明清刊刻了大量医学丛书，把多种著作汇编出版。**丛书让零散的著述得以成体系流传，是知识传播的重要形式。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "五、藏书与版本", "h": "抄本时代：一本书的接力", "c": "**在印刷术普及前，书籍靠手工抄写流传。**每一次抄写都是一次再生产，也带来新的异同。抄本时代，书籍是稀缺而珍贵的。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "五、藏书与版本", "h": "刻本与坊刻", "c": "**雕版印刷兴起后，书坊大量刊刻书籍。**商业出版让知识传播加速，也带来了版本的多样与讹误。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "五、藏书与版本", "h": "藏书楼：经典的避风港", "c": "**历代藏书家递相守护，使许多珍贵文本逃过散佚。**天一阁等著名藏书楼，是文化传承的无名英雄。", "o": "文化史话整理 · 典籍流传", "g": "风物"}, {"t": "五、藏书与版本", "h": "辑佚：从碎片中重建", "c": "**辑佚学从类书、注文中搜集散佚古籍的片段，尽力还原原书。**这是学者最具耐心的工作之一，一字一句地从遗忘中打捞。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "五、藏书与版本", "h": "目录学：给知识编地图", "c": "**目录学为书籍分类、解题，是治学的门径。**《四库全书总目》等目录著作，本身就是一部学术史。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "五、藏书与版本", "h": "版本之辨", "c": "**同一部书的不同版本，文字往往有出入。**校勘学家比对众本，力求还原原貌。版本之学，是对文本负责的学问。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "六、典籍的当代", "h": "古籍数字化", "c": "**当代把古籍扫描、识别、入库，让珍本得以广泛查阅。**技术改变了典籍的获取方式，也带来新的校勘可能。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "六、典籍的当代", "h": "今译与普及", "c": "**把古籍译成今语、加以注释，是让经典活下去的重要方式。**普及不是简化，而是搭建当代人与古代的桥。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "六、典籍的当代", "h": "经典的在日本遗存", "c": "**一些在中国散佚的古籍，因传入日本而被保存下来。**后来学者据回流版本补缀，是文化交流的一段佳话。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "六、典籍的当代", "h": "从藏书到开放获取", "c": "**典籍从秘藏珍本，逐渐走向开放的公共知识。**知识如何被更多人共享，是贯穿古今的话题。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}, {"t": "六、典籍的当代", "h": "一部书的生命史", "c": "**从写成、传抄、刊刻到今译，一部书不断被重新出版。**经典之所以为经典，不在从未中断，而在总能被重新读懂。", "o": "文化史话整理 · 典籍流传", "g": "典籍"}];</script>
