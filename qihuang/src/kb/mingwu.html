<script>const D=[{"t": "一、得名之趣", "h": "人参：从形状到星名", "c": "**人参因根形似人而得名，「参」字又与天上星宿同名。**药物之名，往往兼具形与象。", "o": "文化史话整理 · 本草名物", "g": "典故"}, {"t": "一、得名之趣", "h": "黄芪：黄耆的长者之意", "c": "**「黄芪」古作「黄耆」，「耆」指老者，言其为药中长者。**一字之变，藏着命名观念的流变。", "o": "文化史话整理 · 本草名物", "g": "典故"}, {"t": "一、得名之趣", "h": "茯苓：松之精灵", "c": "**茯苓多生于松根，古人视为松树精华所聚。**名字里带着山林清气，是文人偏爱的意象。", "o": "文化史话整理 · 本草名物", "g": "风物"}, {"t": "一、得名之趣", "h": "半夏：时令写进名字", "c": "**半夏因农历五月采挖而得名，名字本身就是物候记录。**以时命名，是本草取名的常见方式。", "o": "文化史话整理 · 本草名物", "g": "风物"}, {"t": "一、得名之趣", "h": "陈皮：时间的味道", "c": "**陈皮之「陈」，点出存放陈久之意。**传统里重视「陈久」，把时间纳入品质观念。", "o": "文化史话整理 · 本草名物", "g": "风物"}, {"t": "一、得名之趣", "h": "甘草：众药之和", "c": "**甘草味甘，被古人称为「国老」，取其在群药中的调和之象。**一个别称，把药物人格化了。", "o": "文化史话整理 · 本草名物", "g": "典故"}, {"t": "二、异物与珍奇", "h": "龙涎香：海上的珍异", "c": "**龙涎香是海洋中的珍稀物产，但因来源神秘，在古代充满传奇色彩。**珍奇之物，往往最先进入想象与文学。", "o": "文化史话整理 · 本草名物", "g": "风物"}, {"t": "二、异物与珍奇", "h": "琥珀：松脂的化石", "c": "**古人认为琥珀是松脂入地千年所化，带着时间的想象。**一种树脂化石，被赋予了岁月的诗意。", "o": "文化史话整理 · 本草名物", "g": "风物"}, {"t": "二、异物与珍奇", "h": "珊瑚：海中的树", "c": "**珊瑚被视为海中珍宝，形似树枝，常入诗赋。**来自深海的奇物，是古人想象力的源泉。", "o": "文化史话整理 · 本草名物", "g": "风物"}, {"t": "二、异物与珍奇", "h": "珍珠：蚌病成珠", "c": "**「蚌病成珠」的说法，把珍珠的形成与磨砺相连。**一种自然现象，被升华为苦难成就美好的比喻。", "o": "文化史话整理 · 本草名物", "g": "典故"}, {"t": "二、异物与珍奇", "h": "犀与象：远方来的奇物", "c": "**古代文献常记象牙、香料等外来珍物，作为异域奇观。**它们是中外交流物证的早期形态。", "o": "文化史话整理 · 本草名物", "g": "风物"}, {"t": "三、草木与文学", "h": "香草美人的传统", "c": "**屈原以香草美人喻君子德行，开创了中国文学的象征传统。**草木从此不只是植物，更是人格的隐喻。", "o": "文化史话整理 · 本草名物", "g": "典故"}, {"t": "三、草木与文学", "h": "菊与隐逸", "c": "**陶渊明爱菊，让菊花与隐逸生活结下不解之缘。**「采菊东篱下」，一句诗塑造了一种生活理想。", "o": "文化史话整理 · 本草名物", "g": "典故"}, {"t": "三、草木与文学", "h": "兰亭与兰草", "c": "**兰亭因兰草得名，又因王羲之《兰亭集序》成了书法圣地。**一株草，串起了文学与书法的双重记忆。", "o": "文化史话整理 · 本草名物", "g": "典故"}, {"t": "三、草木与文学", "h": "红豆与相思", "c": "**红豆因王维的诗，成为相思的经典意象。**植物的文化生命，有时远超其自然生命。", "o": "文化史话整理 · 本草名物", "g": "典故"}, {"t": "三、草木与文学", "h": "梧桐与秋意", "c": "**「梧桐一叶落，天下尽知秋」，梧桐成了报秋的树。**一叶知秋，是中国人特有的敏感。", "o": "文化史话整理 · 本草名物", "g": "典故"}, {"t": "四、博物与贸易", "h": "香药的贸易之路", "c": "**沉香、檀香等香料沿海路传入，形成繁荣的香药贸易。**一条香路，也是文化交往之路。", "o": "文化史话整理 · 本草名物", "g": "风物"}, {"t": "四、博物与贸易", "h": "药材市场的形成", "c": "**古代药材交易集中在集市与药行，形成独特的商业民俗。**一味药从山野到城市，走的是一条社会链条。", "o": "文化史话整理 · 本草名物", "g": "风物"}, {"t": "四、博物与贸易", "h": "道地与伪品", "c": "**讲究道地的同时，古人对伪品早有警惕，发展出辨别的经验。**真伪之辨，是药学实践的重要内容。", "o": "文化史话整理 · 本草名物", "g": "典籍"}, {"t": "四、博物与贸易", "h": "进贡与物产", "c": "**地方常以珍异物产进贡，药材也是其中一类。**物产流动背后，是各地交往与经济往来的联系。", "o": "文化史话整理 · 本草名物", "g": "风物"}, {"t": "五、名物之学", "h": "《尔雅》与草木之名", "c": "**《尔雅》设有释草、释木、释虫、释鱼等篇，是名物学的源头。**给万物正名，是传统学术的基础工作。", "o": "文化史话整理 · 本草名物", "g": "典籍"}, {"t": "五、名物之学", "h": "陆玑《毛诗草木鸟兽虫鱼疏》", "c": "**此书专门解释《诗经》中的动植物，是最早的博物学专著之一。**读诗而识物，是传统的读法。", "o": "文化史话整理 · 本草名物", "g": "典籍"}, {"t": "五、名物之学", "h": "名物与训诂", "c": "**考订名物，需要训诂、方言、民俗等多方面的知识。**一个名字的确认，往往是一场小型的学术工程。", "o": "文化史话整理 · 本草名物", "g": "典籍"}, {"t": "五、名物之学", "h": "图谱的力量", "c": "**本草图、草木图让名物知识可视化。**看图识字、见图认物，是跨越文字障碍的传播方式。", "o": "文化史话整理 · 本草名物", "g": "风物"}, {"t": "五、名物之学", "h": "博物学的当代意义", "c": "**传统博物学强调观察与记录，这种精神对今天仍有启发。**认识万物，是人类永恒的好奇。", "o": "文化史话整理 · 本草名物", "g": "典籍"}];</script>
