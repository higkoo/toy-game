<script>const D=[{"t": "一、颂扬之辞", "h": "悬壶济世", "c": "**传说东汉时有老翁悬葫芦卖药，后人遂以「悬壶」称行医。**「济世」即救助世人。一个葫芦，因传说成了医者的标志；老药铺门前的葫芦招牌，至今仍在延续这个意象。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "一、颂扬之辞", "h": "杏林春暖", "c": "**源自董奉种杏的传说，后世以「杏林」称医界，「杏林春暖」颂扬医德。**它赞美的不是技术，而是不图回报的仁心。一个行业用典故定义自己的价值，是很有意思的文化现象。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "一、颂扬之辞", "h": "橘井泉香", "c": "**相传汉代苏仙公留下井水与橘叶救人的传说，后人以「橘井泉香」称颂医者。**它常与「杏林春暖」并举，一南一北两则传说，共同构成中医「仁心济世」的自我形象。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "一、颂扬之辞", "h": "妙手回春", "c": "**「回春」意为让春天回来，「妙手回春」赞颂高超的医术。**字面带着夸张的想象。夸张，是语言赞美一个人时最常用的修辞。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "一、颂扬之辞", "h": "起死回生", "c": "**形容把看似无望的局面挽回，本用于赞叹医术。**如今也广泛用于比喻濒临失败之事重新有了转机。医学词汇进入日常，往往先是夸张，继而泛化。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "一、颂扬之辞", "h": "华佗再世 · 扁鹊重生", "c": "**「华佗再世」「扁鹊重生」都是以古之名医作比，赞颂今人医术高明。**把历史人物当作最高评价标准，是中国文化里常见的修辞方式。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "二、诊察之语", "h": "望闻问切", "c": "**指望气色、闻声音、问情况、切脉象四种诊察方法。**跳出具体语境，这四个字提供了一套「全面收集信息再下判断」的方法论，今日常用其引申义。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "二、诊察之语", "h": "对症下药", "c": "**本指针对具体情况采取措施，今泛指针对问题采取相应办法。**它说中了一个朴素道理：解决问题之前，先要看清问题。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "二、诊察之语", "h": "标本兼治", "c": "**「标」指表层现象，「本」指根本原因，「标本兼治」即兼顾表象与根源。**这个说法早已走出医界，成为处理复杂问题的常用语。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "二、诊察之语", "h": "防患未然", "c": "**与「治未病」思想相通，强调在问题发生前先做准备。**「渴而穿井，斗而铸锥」是它著名的比喻。凡事预则立，是这句成语的核心。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "三、警醒之辞", "h": "讳疾忌医", "c": "**出自扁鹊见蔡桓公的寓言：疾在浅表时易治，病人却一再否认，终至不救。**它讲的是不愿正视自身问题的普遍弱点，流传两千多年，正因为这弱点至今仍在。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "三、警醒之辞", "h": "病入膏肓", "c": "**「膏肓」古人指药力难及之处，「病入膏肓」比喻事态严重难以挽回。**出自《左传》的典故，把身体的深层与局势的深重，做了形象的对应。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "三、警醒之辞", "h": "心腹之患", "c": "**指藏在内部、最为切近的祸患。**以身体部位比喻事态的轻重缓急，是汉语里极常见的取喻方式。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "三、警醒之辞", "h": "积劳成疾", "c": "**指长期劳累导致身体出问题。**它提醒人劳逸结合，也是传统养生观念在语言里的沉淀。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "四、泛指之语", "h": "仁心仁术", "c": "**称颂医者既有仁爱之心，又有高明之术。**「心」在「术」之前，点明了传统医德里德先于技的价值次序。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "四、泛指之语", "h": "妙手丹心", "c": "**「妙手」言其技，「丹心」言其诚。**技术与赤诚并举，是对医者最完整的期待。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "四、泛指之语", "h": "悬壶之喜", "c": "**贺人开业行医之辞，取「悬壶济世」之意。**一句贺语，浓缩了整个行业对自己的理解。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "四、泛指之语", "h": "杏林高手", "c": "**对医术高明者的敬称，与「杏林春暖」同源。**以一处杏林，指代整个医学群体，是借代修辞的妙用。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "四、泛指之语", "h": "对症之药", "c": "**比喻正好能解决问题的办法。**从医学借来，强调「合适」比「贵重」更重要。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "四、泛指之语", "h": "药到病除", "c": "**形容作用迅速，今也常夸张地比喻办法立竿见影。**作为语言，它表达对「灵验」的向往，使用时多多半是修辞。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "五、文化衍生", "h": "中医成语里的身体观", "c": "**大量成语以身体为喻：心腹、手足、眉目、肝胆。**这些说法把身体当作理解世界的比例尺，反映出传统文化「近取诸身」的认知方式。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "五、文化衍生", "h": "从医理到哲理：成语的跨越", "c": "**「标本」「虚实」「缓急」等词，都从医学进入日常，成为通用的分析语言。**一套术语能跨域流传，说明它抓住了某种普遍结构。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "五、文化衍生", "h": "成语里的药名", "c": "**「甘草」「当归」等药名常进入诗词与谜语。**药名因音义之美，成了语言游戏的元素。名字取得好，本身就是一种文化传播力。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "五、文化衍生", "h": "「医」字的多重含义", "c": "**「医」既可指治病，也可引申为治理、补救，如「医国」。**一个字的多义，映照出传统里「治病」与「治国」同构的观念。", "o": "文化史话整理 · 医林成语", "g": "典故"}, {"t": "五、文化衍生", "h": "成语的生命力", "c": "**一个成语能流传，往往因为它说中了某种恒常的人性或处境。**中医成语之所以鲜活，正因它们根植于每个人都有的身体经验。", "o": "文化史话整理 · 医林成语", "g": "典故"}];</script>
