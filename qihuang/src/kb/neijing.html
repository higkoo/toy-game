<script>const D=[{"t": "一、其书", "h": "《黄帝内经》不是一个人写的", "c": "**《黄帝内经》并非出自一人一时之手。**多数学者认为，它的主体篇章大约形成于战国至西汉这段漫长的时期，由多人陆续撰写、汇编而成。\n\n「作者不明」并不减损它的分量。恰恰相反，**一部历经数百年沉淀的书，才真正承载得起「经典」二字**——它是一代代思想的合力，而非某一个天才的灵光。", "o": "中国医学史 · 文化史话整理", "g": "典籍"}, {"t": "一、其书", "h": "为什么要「托名黄帝」", "c": "**古人著书，常有「托名」的习惯**：把著作归于某位受人尊崇的古代圣王，以表明学问渊源有自。《黄帝内经》之名，正是这种文化心理的体现。\n\n「托名」不是欺骗，而是一种**表达敬意与确立正统的方式**。在传统学术里，书名往往就是一种立场声明。", "o": "古籍著录与辨伪 · 文化史话整理", "g": "典故"}, {"t": "一、其书", "h": "《素问》与《灵枢》：两个书名怎么讲", "c": "**《素问》可理解为「平素问答」**——以问答的形式，讲论平素所当知晓的道理；**《灵枢》则可理解为「神灵之枢机」**，喻其内容的枢要。\n\n两个书名都带着浓厚的古典意味：一个平实，一个玄远，合起来正好映出这部书兼重日常与玄理的气质。", "o": "古籍书名释义 · 文化史话整理", "g": "典籍"}, {"t": "二、阴阳五行", "h": "阴阳：从日照的向背到一对哲学范畴", "c": "**「阴」「阳」的本义，与日光有关**：向阳的一面为阳，背阴的一面为阴。后来这对朴素的方位词，被一步步抽象成解释万物的范畴——动静、刚柔、寒热、男女，皆可用阴阳来归纳。\n\n阴阳真正的价值，不在给事物贴标签，而在于它强调**「一切都在关系与变化之中」**：阴中有阳，阳中有阴，消长转化，没有绝对静止的一端。", "o": "中国哲学史 · 文化史话整理", "g": "典籍"}, {"t": "二、阴阳五行", "h": "五行：五种材料，还是五种德行", "c": "**「五行」最早见于《尚书·洪范》，指水、火、木、金、土。**「行」有「德行」「运行」之意，所以五行不只是五种物质，更是五种运行着的秩序。\n\n后来五行被用来统摄方位、季节、颜色、声音等，形成一张巨大的「对应关系网」。这是一套典型的中国式思维：**用有限的几个符号，把纷繁的世界编织成一个有条理的整体。**", "o": "《尚书·洪范》 · 中国哲学史", "g": "典籍"}, {"t": "二、阴阳五行", "h": "天人相应：把人看作一个小宇宙", "c": "**「天人相应」是传统思想里极重要的一条信念**：天有日月星辰、四时寒暑，人也有与之对应的节律与结构。由此发展出「人身一小天地」的说法。\n\n用今天的眼光看，它未必是严谨的科学结论，却是一次宏大的**「把人放回自然」的尝试**——反对把人从天地间孤立出来理解。这种整体观，至今仍影响着中国人的思维方式。", "o": "中国哲学史 · 文化史话整理", "g": "典籍"}, {"t": "三、节气与物候", "h": "二十四节气：写在历法里的自然观察", "c": "**节气源于古人观天象、察物候的长期积累。**他们用日影的长短测定冬至、夏至，又逐步细分出二十四节气，用来指导农时与起居。\n\n《内经》里已大量出现与四时、节气相关的论述。节气不是抽象的数字，而是一套**把天文、气候、物候与人的生活统一起来的知识体系**，至今仍是中国人认知季节的语言。", "o": "中国古代历法 · 文化史话整理", "g": "风物"}, {"t": "三、节气与物候", "h": "五运六气：一套推演气候的术数", "c": "**「五运六气」是用干支来推演岁时节气变化的一套框架。**它把天干地支、五行与一年的气候联系起来，试图找出气候流转的规律。\n\n今天更宜把它视作古人**「以数求理」的一种努力**：面对难以把握的自然变化，他们尝试用符号系统建立可推演的模型。这种努力本身，就是科学思想史上的有趣一页。", "o": "传统术数文化研究 · 文化史话整理", "g": "典籍"}, {"t": "四、文字与思想", "h": "「恬淡虚无」：一种生活的理想", "c": "**《上古天真论》里有一句广为流传的话：「恬淡虚无，真气从之，精神内守。」**它描绘的是一种内心安宁、不过度外求的生活状态。\n\n把它当作一种**人生哲学**来读，比当作任何具体规则都更有意味：在充满欲望与焦虑的生活里，「精神内守」提醒人把注意力收回自身，守住内心的从容。", "o": "《素问·上古天真论》 · 文化史话整理", "g": "典籍"}, {"t": "四、文字与思想", "h": "《内经》里的比喻艺术", "c": "**《内经》很会用比喻讲道理。**它说阳气像天与日，失去则万物不明；用煮水时清升浊降，来说明升降的道理。\n\n这些比喻让抽象的哲理变得可感可见。**一部经典的说服力，很多时候来自它讲道理的方式，而不只是道理本身。**读《内经》，不妨也欣赏它的文字。", "o": "《黄帝内经》文学性研究 · 文化史话整理", "g": "典籍"}, {"t": "四、文字与思想", "h": "「治未病」：把眼光放在事先", "c": "**「治未病」的字面意思，是在问题尚未成形时先着手。**它出自《内经》的比喻：渴了才挖井、要打了才造兵器，究竟太迟。\n\n撇开具体的医学语境，这四个字其实是一句极通用的处世智慧：**凡事预则立，把功夫下在事情发生之前。**从个人修养到经营管理，都能用得上。", "o": "《素问·四气调神大论》 · 文化史话整理", "g": "典故"}, {"t": "四、文字与思想", "h": "医与巫：一次漫长的分离", "c": "**在早期社会，医疗与巫术曾长期交织在一起。**从「巫医不分」到逐渐形成经验性的医学体系，是一次漫长的观念转变。\n\n《内经》的意义之一，正在于它大量用自然界的道理来解释身体，**把解释权从神秘转向了可观察、可讨论的领域**。这一步，是医学走向独立的关键。", "o": "医学起源史 · 文化史话整理", "g": "典籍"}, {"t": "四、文字与思想", "h": "《内经》的版本之旅", "c": "**我们今天读到的《内经》，是经过多次整理、校勘、注释才定型的。**唐代王冰注《素问》、补入七篇大论，宋代又设校正医书局刊行，都是流传史上的重要节点。\n\n一部书能穿越两千年仍可读，靠的是一代代整理者的接力。**版本史，就是一部书被不断「重新出版」的历史。**", "o": "古籍版本学 · 文化史话整理", "g": "典籍"}];</script>
