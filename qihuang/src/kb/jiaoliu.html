<script>const D=[{"t": "一、东传日本与朝鲜", "h": "中医东传日本", "c": "**中医很早就传入日本，深刻影响了当地医学。**典籍、方药与制度，都成为日本医学的养分。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "一、东传日本与朝鲜", "h": "日本古方派", "c": "**日本古方派尊崇《伤寒论》，主张回归原书。**一派之学在异乡得到强化，是文化传播的有趣现象。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "一、东传日本与朝鲜", "h": "朝鲜医学的传统", "c": "**中医传入朝鲜半岛，与当地传统结合，形成独特体系。**《东医宝鉴》等著作，是这种融合的成果。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "一、东传日本与朝鲜", "h": "典籍的海外保存", "c": "**一些在中国散佚的古籍，因传入日本、朝鲜而被保存。**后来据回流版本补缀，是文化交流的佳话。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "二、丝绸之路", "h": "丝路上的药材", "c": "**丝绸之路沿线，药材是重要的交易品。**胡椒、香料、珍奇药物沿路传入，改变了物产格局。", "o": "文化史话整理 · 中外交流", "g": "风物"}, {"t": "二、丝绸之路", "h": "胡药与香料", "c": "**带「胡」字的药名，往往提示其外来来源。**一个字，记录了交流的历史。", "o": "文化史话整理 · 中外交流", "g": "典故"}, {"t": "二、丝绸之路", "h": "敦煌文献里的医药", "c": "**敦煌遗书中保存了医药文献，反映丝路重镇的医疗面貌。**一纸残卷，连着一段交流史。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "二、丝绸之路", "h": "商旅与知识的流动", "c": "**商旅不仅带货，也带走知识与观念。**贸易之路，往往也是文化之路。", "o": "文化史话整理 · 中外交流", "g": "风物"}, {"t": "三、西渐与译介", "h": "针灸传入欧洲", "c": "**针灸约在十七世纪被介绍到欧洲，后来逐渐传播。**一门古老的技艺，在异乡获得新的理解。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "三、西渐与译介", "h": "《本草纲目》的西译", "c": "**《本草纲目》被译介到欧洲，成为西方认识中国博物学的重要窗口。**一部书，承担着文化使者的角色。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "三、西渐与译介", "h": "植物图谱的交流", "c": "**中西植物图谱的交流，推动了博物学的发展。**图像是一种跨越语言的通用语言。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "三、西渐与译介", "h": "传教士与医药", "c": "**明清来华传教士也带来西方医药知识，形成双向交流。**交流从来不是单向的。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "四、近代的互鉴", "h": "西医东渐", "c": "**近代西方医学大量传入中国，带来观念与制度的冲击。**传统医学如何回应，是那个时代的课题。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "四、近代的互鉴", "h": "汇通与改良", "c": "**面对新学，有人主张汇通，有人主张保存，形成持续讨论。**争论本身，就是思想活跃的证明。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "四、近代的互鉴", "h": "留洋与归国", "c": "**不少医者出国学习，归国后推动医学教育与研究的变革。**人员的流动，带动知识的流动。", "o": "文化史话整理 · 中外交流", "g": "人物"}, {"t": "四、近代的互鉴", "h": "译书与术语", "c": "**翻译西方医书，创造了大量新术语，丰富了汉语。**语言的扩容，是文化吸收的直接结果。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "五、交流的启示", "h": "交流带来变化", "c": "**任何医学传统都在交流中不断变化，纯粹「原生」并不存在。**开放，是学问保持活力的条件。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "五、交流的启示", "h": "误读也是理解", "c": "**跨文化传播中常有误读，但误读也可能激发新的创造。**理解从不完全，却始终有价值。", "o": "文化史话整理 · 中外交流", "g": "典故"}, {"t": "五、交流的启示", "h": "互鉴而非对立", "c": "**不同医学传统之间，既有差异，也有可互相借鉴之处。**对话，比对立更有建设性。", "o": "文化史话整理 · 中外交流", "g": "典籍"}, {"t": "五、交流的启示", "h": "从物产到观念", "c": "**交流先从物产开始，渐及技术，最后触及观念。**物质与思想，层层递进。", "o": "文化史话整理 · 中外交流", "g": "风物"}, {"t": "五、交流的启示", "h": "中医的世界意义", "c": "**中医作为文化与传统，正在被世界重新认识。**它的价值，不止于医学本身。", "o": "文化史话整理 · 中外交流", "g": "典籍"}];</script>

(function () {
  'use strict';
  var KEY = 'qihuang.rank.v1', FILE = 'jiaoliu.html';
  function num() { try { return parseInt(window.localStorage.getItem(KEY), 10) || 0; } catch (e) { return 0; } }
  function put(v) { try { window.localStorage.setItem(KEY, String(v)); } catch (e) {} }
  function sdk() {
    var list = [window.toy, window.Toy, window.toy && window.toy.toy, window.Toy && window.Toy.toy];
    for (var i = 0; i < list.length; i++) if (list[i] && typeof list[i].submitScore === 'function') return list[i];
    return null;
  }
  function send(score) {
    var t = sdk(); if (!t) return;
    try { t.submitScore({ score: score, board: 1 }); } catch (e) {}
  }
  var sk = KEY + '.seen', seen = [];
  try { seen = JSON.parse(window.localStorage.getItem(sk) || '[]') || []; } catch (e) { seen = []; }
  if (!Array.isArray(seen)) seen = [];
  if (seen.indexOf(FILE) === -1) {
    seen.push(FILE);
    try { window.localStorage.setItem(sk, JSON.stringify(seen)); } catch (e) {}
    var v = num() + 1; put(v); send(v);
  }
})();
</script>
