<script>const D=[{"t": "一、诗词中的医药", "h": "药名入诗：一种文字游戏", "c": "**诗人把药名嵌入诗句，谐音双关，别有情趣。**药名因音义之美，成了文学的语言素材。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "一、诗词中的医药", "h": "白居易与养生诗", "c": "**白居易写过多首谈论起居、闲适的诗，把日常调摄写成生活情趣。**诗里的养生，是一种从容的生活态度。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "一、诗词中的医药", "h": "苏轼的旷达与医药", "c": "**苏轼通晓医理，留下与医药相关的文字，更以旷达著称。**他的人生态度，与传统的养生智慧相通。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "一、诗词中的医药", "h": "陆游的医药笔记", "c": "**陆游笔记中记有医药、养生的内容，反映出文人博学的传统。**读万卷书，也读草木之书。", "o": "文化史话整理 · 医与文艺", "g": "典籍"}, {"t": "一、诗词中的医药", "h": "王维与红豆：药名成诗", "c": "**「红豆生南国」让相思子这种药物意象，成了千古相思的象征。**一味药因诗而获得了永恒的生命。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "二、书画中的医影", "h": "医家与书法", "c": "**许多古代医家兼擅书法，把士人的修养带入医门。**傅青主既是名医，也是一代书家。医与艺，在传统里本不分家。", "o": "文化史话整理 · 医与文艺", "g": "人物"}, {"t": "二、书画中的医影", "h": "本草图谱：给万物画像", "c": "**本草书常配精美图谱，图文并置，兼具科学与艺术价值。**一图一文，是古人认识世界的双重路径。", "o": "文化史话整理 · 医与文艺", "g": "风物"}, {"t": "二、书画中的医影", "h": "《清明上河图》里的药铺", "c": "**《清明上河图》描绘了宋代市井，其中可见药铺招牌。**一幅画，为后人保存了医药行业的城市实景。", "o": "文化史话整理 · 医与文艺", "g": "风物"}, {"t": "二、书画中的医影", "h": "文人画与草木", "c": "**文人画常以梅兰竹菊为题材，寄寓人格。**这些植物也多是本草中的药物，实用与审美在一株草上统一。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "三、小说戏曲", "h": "《红楼梦》里的医药", "c": "**《红楼梦》写到大量医药、饮食、养生细节，反映清代贵族生活。**一部小说，也是一部生活文化的百科。", "o": "文化史话整理 · 医与文艺", "g": "典籍"}, {"t": "三、小说戏曲", "h": "《西游记》中的药名", "c": "**《西游记》里常有以药名、草木名做的对仗与游戏。**神魔小说里，也藏着博物学的趣味。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "三、小说戏曲", "h": "戏曲中的医生形象", "c": "**传统戏曲里常有医者角色，或诙谐，或正直。**舞台上的医生，折射着大众对这一行业的想象。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "三、小说戏曲", "h": "说书与民间医话", "c": "**说书、评弹中常有医者的故事，流传于市井。**民间口头传统，是医学文化扩散的重要渠道。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "四、文艺与医理", "h": "以医喻文：文章的「脉」", "c": "**古人常以医理比喻文章，讲「脉络」「起承转合」。**身体、文章、天地，在传统批评里常被视同构。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "四、文艺与医理", "h": "「文以载道」与「医以载仁」", "c": "**文章承载道理，医术承载仁心。**两种说法并列，反映出传统对「技术」与「价值」关系的理解。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "四、文艺与医理", "h": "琴棋书画与养生", "c": "**传统把抚琴、弈棋、习字、作画视为修身养性的方式。**艺术活动被赋予了调适身心的意义。", "o": "文化史话整理 · 医与文艺", "g": "风物"}, {"t": "四、文艺与医理", "h": "园林与医：居处的学问", "c": "**古典园林讲究通风、采光、借景，营造出宜人的居处。**环境与人身心关系，是传统建筑关心的问题。", "o": "文化史话整理 · 医与文艺", "g": "风物"}, {"t": "四、文艺与医理", "h": "茶道与清谈", "c": "**茶、香、琴、书构成文人清雅生活的元素。**这种生活方式，本身就被认为有助于内心的安宁。", "o": "文化史话整理 · 医与文艺", "g": "风物"}, {"t": "五、传播与想象", "h": "医者形象的文化演变", "c": "**从神医传说到市井医生，医者形象在文艺中不断变化。**形象的变化，折射着社会对医学的认知。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "五、传播与想象", "h": "「悬壶」的文艺符号", "c": "**一个葫芦，从传说走进招牌、绘画与文学。**符号的力量，在于它能被反复赋予新意。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "五、传播与想象", "h": "杏林意象的流传", "c": "**「杏林」从一处传说中的树林，变成整个行业的代称。**意象一旦成立，就获得了独立的生命。", "o": "文化史话整理 · 医与文艺", "g": "典故"}, {"t": "五、传播与想象", "h": "医学与民俗节庆", "c": "**药王庙会、端午采药等习俗，把医药融入节庆。**医学不只在上层典籍里，也在民间的岁时节令中。", "o": "文化史话整理 · 医与文艺", "g": "风物"}, {"t": "五、传播与想象", "h": "文艺里的医学伦理", "c": "**小说戏曲常讲医者的贫富贵贱一视同仁。**文艺是价值观传播的有力载体，医学伦理借此深入人心。", "o": "文化史话整理 · 医与文艺", "g": "典故"}];</script>
