 <p class="intro">《伤寒论》把经验整理成体系，也把一位东汉学者的名字留在了历史里。这里讲张仲景的故事、这本书的成书与分合，以及「辨证」这种思维方式背后的文化意味。</p>

<script>const D=[{"t": "一、其书与人", "h": "张仲景：一位把学问写成书的人", "c": "**张仲景是东汉末年的学者，被后世尊称为「医圣」。**他所处的时代动荡，目睹亲族凋零，于是发愤整理前代经验，著成《伤寒杂病论》。\n\n关于他的生平，可靠的史料不多，但一个形象却清晰可辨：**一位在乱世里坚持把零散经验写成系统之书的读书人。**", "o": "《后汉书》相关记载 · 文化史话整理", "g": "人物"}, {"t": "一、其书与人", "h": "「坐堂医生」与「堂」字的来历", "c": "**民间传说，张仲景曾任长沙太守，公开发诊于公堂之上。**后世于是把医者坐诊称作「坐堂」，药铺也多称「堂」。\n\n这个传说是否确凿另说，但它解释了一个有趣的语言现象：**今天遍布街头的「XX 堂」，藏着一段关于医者公开、坐堂行医的历史想象。**", "o": "中医民俗与语言 · 文化史话整理", "g": "典故"}, {"t": "一、其书与人", "h": "一本书，如何分成两部", "c": "**《伤寒杂病论》原为一部，后在流传中逐渐分成《伤寒论》与《金匮要略》两部。**前者偏于外感，后者偏于杂病——这是传统目录学对其内容的概括。\n\n一部书的分合，反映了后人对知识的不同整理方式。**书的形态会变，但其中沉淀的思想，却在分分合合中延续下来。**", "o": "中医文献学 · 文化史话整理", "g": "典籍"}, {"t": "二、思想框架", "h": "「六经」：一种归纳的框架", "c": "**「六经」指太阳、阳明、少阳、太阴、少阴、厥阴，本是经脉与循行的概念。**在《伤寒论》里，它们被用来把纷繁的证候归纳为六种大的类型。\n\n它的价值在于**「分类」这一动作本身**：面对复杂多变的现象，先找到几个大的类目，再安放具体细节。这是传统学术「以简驭繁」的典型方法。", "o": "中国医学思想史 · 文化史话整理", "g": "典籍"}, {"t": "二、思想框架", "h": "「辨证」二字，说的是一种思维方式", "c": "**「辨证」的核心，是不孤立地看待一个现象，而是把它放进整体的关系里判断。**同样的表现，因上下文不同，可能被理解为不同的问题；这正是「同病异治、异病同治」一类说法的思想基础。\n\n从文化角度看，辨证是一种**重视具体情境、反对一刀切的思维方式**，与传统思想中重「关系」、重「权变」的特质一脉相承。", "o": "中国医学思想史 · 文化史话整理", "g": "典籍"}, {"t": "二、思想框架", "h": "方名里的文字学", "c": "**《伤寒论》中的方剂，许多以主药或意象命名。**这些名字简洁古朴，读来如同一组组小小的标题。\n\n不必深究具体内容，单看命名方式，也能体会到古人的趣味：**用一个词，为复杂的事物立一个便于记忆的名目。**这与诗人为诗题取名，是同一种心思。", "o": "中医方剂命名文化 · 文化史话整理", "g": "典故"}, {"t": "三、流传与影响", "h": "从竹简到刊本：版本的流转", "c": "**《伤寒论》的传世文本，经历过抄写、整理、刊刻的漫长过程。**宋代校正医书局的刊行，是其中一个关键节点，使本书得以较稳定地流传。\n\n每一种版本，都是一次重新整理。**我们今天读到的经典，其实是无数次传抄与校勘之后的产物。**", "o": "古籍版本学 · 文化史话整理", "g": "典籍"}, {"t": "三、流传与影响", "h": "注解传统：与古人对话", "c": "**历代学者为《伤寒论》作注，形成庞大的注释传统。**注家们或循文解释，或借题发挥，把当代的理解一层层叠加到原书之上。\n\n读经典而不读注，往往难得其门而入。**注释，是后人与前人持续的一场对话**，经典因此始终「活着」。", "o": "中医注释学史 · 文化史话整理", "g": "典籍"}, {"t": "三、流传与影响", "h": "东渡日本：古方派的兴起", "c": "**《伤寒论》很早就传入日本，并对当地医学产生深远影响。**日本「古方派」尊崇仲景，主张回归原书，形成独具特色的学术流派。\n\n一本书在异乡被重新发现、重新解释，甚至反过来影响本土——**这是经典跨文化传播的一个生动案例。**", "o": "中日医学交流史 · 文化史话整理", "g": "典籍"}, {"t": "三、流传与影响", "h": "「医圣」称号是怎么来的", "c": "**后世尊张仲景为「医圣」，与孔子称「至圣」、关羽称「武圣」相类。**「圣」在传统语境里，是某领域达到极高境界、堪为典范者的称号。\n\n一个称号的确立，往往需要长时间的公认。**「医圣」二字，是后世对一位整理者最高的致意。**", "o": "传统文化称谓研究 · 文化史话整理", "g": "典故"}, {"t": "三、流传与影响", "h": "南阳的仲景祠", "c": "**相传张仲景为南阳人，当地至今有纪念他的祠庙。**士人之乡以乡贤为荣，立祠祭祀，是中国地方社会的悠久传统。\n\n祠庙里的香火，把一个历史人物变成了地方文化的一部分。**从书页到祠堂，是一位学者的另一种「流传」。**", "o": "地方文化史 · 文化史话整理", "g": "风物"}, {"t": "三、流传与影响", "h": "乱世著书：一种文化韧性", "c": "**在动荡的年代里坚持整理学问，是中国士人反复出现的身影。**从孔子厄而作《春秋》，到司马迁幽而著《史记》，再到乱世中的医书编纂，背后是同一种文化韧性。\n\n外在越混乱，越要留下点什么——**这或许正是经典得以诞生的隐秘条件。**", "o": "中国文化史 · 文化史话整理", "g": "人物"}];</script>

    var list = [window.toy, window.Toy, window.toy && window.toy.toy, window.Toy && window.Toy.toy];
