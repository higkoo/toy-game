 <p class="intro">本草学是一门关于草木金石的传统博物之学。这里讲神农的传说、三品分类的智慧、药名背后的典故，以及一部部本草书怎样把天地间的物产编成知识体系。</p>

<script>const D=[{"t": "一、神农传说", "h": "神农尝百草：一个关于探索的神话", "c": "**传说神农氏为了辨识物产，亲自尝遍百草，历尽艰险。**这个神话未必实有其事，却极为传神地刻画出古人获取知识的方式——**用身体去试，用经验去记**。\n\n「尝百草」因此成为勇于探索、以自身求证的象征。它是中国科学精神最古老的一则寓言。", "o": "上古神话研究 · 文化史话整理", "g": "典故"}, {"t": "一、神农传说", "h": "《神农本草经》为何托名神农", "c": "**《神农本草经》成书于汉代，却冠以神农之名。**与《内经》托名黄帝一样，这是传统文化中「尊古崇本」的表现：把学问追溯到传说中的圣王，以示其源远而可信。\n\n书名是一种态度。它告诉我们：古人对知识的来源，有一种特别的敬意与想象。", "o": "本草文献学 · 文化史话整理", "g": "典故"}, {"t": "二、分类与体例", "h": "上、中、下三品：古人的分类智慧", "c": "**《神农本草经》把所收的物产分为上、中、下三品。**这是一种朴素的等级分类：把性质平和、被视为上乘的列为上品，其余依次归类。\n\n三品分类未必符合现代标准，但它体现出古人**「为纷繁万物建立秩序」的努力**——先分类，再认识，是一切学问起步时的共同动作。", "o": "《神农本草经》研究 · 文化史话整理", "g": "典籍"}, {"t": "二、分类与体例", "h": "三百六十五味：一个象征性的数字", "c": "**《神农本草经》所收药物之数，被说成三百六十五，与一年的天数相应。**这类「以数配象」的做法，在传统典籍中十分常见。\n\n数字在这里不只是计数，更是一种**象征：把一本关于物产的书，与一整年的天时对应起来**，暗示人与天地物候同处一个秩序之中。", "o": "本草文献学 · 文化史话整理", "g": "典籍"}, {"t": "三、药名与博物", "h": "药名里的汉语趣味", "c": "**许多药名本身就是绝妙的汉语词条。**「当归」被解作「应当归来」，寄托着相思与盼归之意；「甘草」因其味甘而得名，名字直白可爱。\n\n药名进入了诗词、谜语与对联，成为语言游戏的一部分。**一样东西有了动人的名字，也就有了被人记住的理由。**", "o": "汉语词汇与文化 · 文化史话整理", "g": "典故"}, {"t": "三、药名与博物", "h": "道地：古人也讲究「原产地」", "c": "**「道地药材」是传统药学里一个重要观念**：同样一种物产，因产地不同，品质被认为有高下之分。\n\n这其实是一种朴素的**地理品质意识**——把土壤、气候、产地与物产品质联系起来。今天强调「原产地」「风土」，与古人的「道地」观念，隔着千年遥相呼应。", "o": "药材地理文化 · 文化史话整理", "g": "风物"}, {"t": "三、药名与博物", "h": "本草书里的博物学", "c": "**古代本草书，其实是一本本博物志。**除了草木，还收载动物、矿物、器物，甚至神话传说中的异物。\n\n读本草，能读到古人对整个世界的好奇与整理：他们把田野、山川、市井里的物产一一登记命名，试图为万物建立一份清单。**这是中国土生土长的博物学传统。**", "o": "中国博物学史 · 文化史话整理", "g": "典籍"}, {"t": "三、药名与博物", "h": "从《尔雅》到本草：名物之学", "c": "**中国的本草学，与古老的「名物之学」一脉相承。**《尔雅》一类训诂书，早已教人如何给草木虫鱼分类命名；本草继承了这套方法，并加以扩充。\n\n「名」是认识世界的第一步。**把万物一一叫出名字，就是古人理解世界的方式。**", "o": "训诂学与名物学 · 文化史话整理", "g": "典籍"}, {"t": "四、文献流传", "h": "陶弘景与《本草经集注》", "c": "**南朝学者陶弘景，把《神农本草经》与后来的新内容整理到一起，编成《本草经集注》。**他重新编排品类，注明产地与采集时令。\n\n陶弘景是那种典型的「山中宰相」式人物——隐居山林却学问广博。他对本草的整理，让一部古老的书获得了新的条理。", "o": "《梁书·陶弘景传》 · 文化史话整理", "g": "人物"}, {"t": "四、文献流传", "h": "《新修本草》：一部官修的药典", "c": "**唐代组织学者编修《新修本草》，由政府颁行，是中国古代著名的官修本草。**它附有图谱，图文并茂，规模和权威都超过前代。\n\n官修意味着本草从私人著述，上升为**国家层面的知识工程**——知识的整理与颁布，从此有了官方力量参与。", "o": "中国药学史 · 文化史话整理", "g": "典籍"}, {"t": "四、文献流传", "h": "《本草纲目》：李时珍的博物巨著", "c": "**明代李时珍耗费数十年，遍访四方，编成《本草纲目》。**全书不仅汇总药物，还广涉动物、植物、矿物、天文、地理，被后世视为博物学的集大成之作。\n\n它早已超出一本「药书」的范畴，而是一部**关于中国传统自然知识的百科全书**，影响远播海外。", "o": "《明史·李时珍传》 · 文化史话整理", "g": "人物"}, {"t": "四、文献流传", "h": "药材市场与城市生活", "c": "**本草不只存在于书里，也活跃在市井之间。**古代的药材行会、药铺、集市，构成了城市生活的重要一部分；药名、招牌、行话，沉淀出独特的商业民俗。\n\n一味药从山野走到案头，走的是一条由采集、贸易到知识记录的长路。**本草学背后，是一整条社会的链条。**", "o": "城市生活史 · 文化史话整理", "g": "风物"}, {"t": "四、文献流传", "h": "本草图谱：给万物画像", "c": "**本草书常配有图谱，把草木虫鱼画出来。**这些图未必处处精确，却承载着「看图识物」的朴素愿望。\n\n图文并置，是传统博物学的重要方法：**文字给出名称与归类，图像给出形状与辨认的线索。**一图一文之间，是古人认识世界的双重路径。", "o": "中国博物学史 · 文化史话整理", "g": "风物"}];</script>
