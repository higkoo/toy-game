<script>const D=[{"t": "一、名篇箴言", "h": "大医精诚：一篇关于「心」的文字", "c": "**孙思邈《大医精诚》讲为医者当先有仁心，不论贵贱贫富，皆如至亲。**它把「德」置于「术」之前，是中国传统职业伦理的经典文本。", "o": "文化史话整理 · 医德佳话", "g": "典籍"}, {"t": "一、名篇箴言", "h": "不为良相，便为良医", "c": "**相传范仲淹有言：「不为良相，便为良医。」**把行医与治国并举，因为二者都在「济世」。一句话提升了医术在士人心中的地位。", "o": "文化史话整理 · 医德佳话", "g": "典故"}, {"t": "一、名篇箴言", "h": "仁心仁术：心在术先", "c": "**传统评价医者，必先问其心，再论其术。**「仁心仁术」四字，把价值次序说得清清楚楚。技术可以学，仁心却需要修。", "o": "文化史话整理 · 医德佳话", "g": "典故"}, {"t": "一、名篇箴言", "h": "「勿以善小而不为」的医者版", "c": "**传统医训中多有劝人谨慎、仁爱的格言，强调细节见人心。**一句句朴素的话，构成了一个行业的道德底色。", "o": "文化史话整理 · 医德佳话", "g": "典故"}, {"t": "二、仁爱的故事", "h": "董奉种杏：不取分文", "c": "**董奉施治不取钱财，只让病家种杏树，日久成林。**「杏林春暖」由此而来。一个关于不图回报的故事，成为医德的千年象征。", "o": "文化史话整理 · 医德佳话", "g": "典故"}, {"t": "二、仁爱的故事", "h": "壶翁悬壶：夜间入壶的传说", "c": "**传说老翁悬壶卖药，白天行医，夜里跳入壶中。**「悬壶济世」由此而来。神奇传说背后，是人们对医者「超凡济世」的想象。", "o": "文化史话整理 · 医德佳话", "g": "典故"}, {"t": "二、仁爱的故事", "h": "橘井泉香：一份临别的嘱托", "c": "**相传苏仙公升仙前嘱家人以井水橘叶救人，后来果然救了许多人。**一份临别的牵挂，化作流传千年的医德佳话。", "o": "文化史话整理 · 医德佳话", "g": "典故"}, {"t": "二、仁爱的故事", "h": "孙思邈救蛇：传说里的仁心", "c": "**民间有孙思邈救助生灵、因而获报的传说。**这类故事未必是史实，却寄托着人们对「仁爱及物」的向往。", "o": "文化史话整理 · 医德佳话", "g": "典故"}, {"t": "三、风骨与担当", "h": "傅青主的气节", "c": "**明末清初傅青主坚守气节，行医济世，兼具学者与医者风骨。**他的形象说明，传统里医者常与士人的品格相连。", "o": "文化史话整理 · 医德佳话", "g": "人物"}, {"t": "三、风骨与担当", "h": "史册之外的医者日常", "c": "**多数医者一生默默行医乡里，被写进地方志与口碑。**他们没有传奇，却撑起了医学传承的日常根基。", "o": "文化史话整理 · 医德佳话", "g": "人物"}, {"t": "三、风骨与担当", "h": "面对疫病的担当", "c": "**历史上疫病流行时，总有医者挺身而出，记录、救治、著书。**吴又可《温疫论》便是这样的时代回应。担当，是医德的另一面。", "o": "文化史话整理 · 医德佳话", "g": "人物"}, {"t": "三、风骨与担当", "h": "师徒相传的郑重", "c": "**传统师徒之间，授受医书与经验极为郑重。**这种郑重，是对知识、也是对生命的敬畏。", "o": "文化史话整理 · 医德佳话", "g": "人物"}, {"t": "四、医德的语言", "h": "「济世」二字", "c": "**「济世」即救助世人，是传统医者自我理解的核心词。**一个行业用什么词定义自己，往往就有什么样的追求。", "o": "文化史话整理 · 医德佳话", "g": "典故"}, {"t": "四、医德的语言", "h": "「仁术」：医乃仁术", "c": "**「医乃仁术」是流传极广的说法，强调医学本质上是仁爱之术。**技术若无仁心，便失去灵魂。", "o": "文化史话整理 · 医德佳话", "g": "典故"}, {"t": "四、医德的语言", "h": "医者与「父母心」", "c": "**传统称医者当怀「父母心」，视病家如亲人。**这种把医患关系亲情化的表达，体现出强烈的人情关怀。", "o": "文化史话整理 · 医德佳话", "g": "典故"}, {"t": "四、医德的语言", "h": "「慎」字诀", "c": "**传统医训极重一个「慎」字：慎思、慎言、慎行。**面对生命，谨慎本身就是一种德行。", "o": "文化史话整理 · 医德佳话", "g": "典故"}];</script>
