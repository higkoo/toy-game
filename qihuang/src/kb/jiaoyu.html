<script>const D=[{"t": "一、师徒相传", "h": "师徒之谊", "c": "**传统医学靠师徒口传心授，师徒关系极为郑重。**授受之间，传的不只是知识，还有职业的规矩。", "o": "文化史话整理 · 医学教育", "g": "人物"}, {"t": "一、师徒相传", "h": "入门与拜师", "c": "**拜师有礼，入门有规，是传统行会的常见做法。**仪式感，强化了知识的郑重与责任的承担。", "o": "文化史话整理 · 医学教育", "g": "风物"}, {"t": "一、师徒相传", "h": "侍诊与抄方", "c": "**学徒随师侍诊、抄录方药，在实践中学。**「跟诊」是最古老也最有效的临床教学。", "o": "文化史话整理 · 医学教育", "g": "人物"}, {"t": "一、师徒相传", "h": "衣钵与传承", "c": "**「传衣钵」比喻师门真传的授受。**一个词，道出了传统传承的郑重与排他。", "o": "文化史话整理 · 医学教育", "g": "典故"}, {"t": "二、官办医学", "h": "太医署的教学", "c": "**唐代太医署设博士、助教，招收学生，分科教学。**官办医学教育，让知识传授有了制度保障。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "二、官办医学", "h": "宋代的医学教育", "c": "**宋代设医学，招生的规模与考核制度都较完备。**教育制度的成熟，是学术繁荣的基础。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "二、官办医学", "h": "地方医学", "c": "**各州府也设医学，培养地方医者。**教育网络的铺开，让医学走出京城。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "二、官办医学", "h": "分科教学的传统", "c": "**古代医学教育有分科，如大方脉、小方脉、针灸等。**分科，是专业化与规模化的前提。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "三、教材与读本", "h": "《黄帝内经》作为教材", "c": "**《内经》长期是医者的必读书，是理论教育的核心教材。**一部经典，充当了千年的教科书。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "三、教材与读本", "h": "《伤寒论》的传授", "c": "**《伤寒论》在教学中地位极高，历代注本众多。**注释与教材，往往是同一批书。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "三、教材与读本", "h": "通俗读本的兴起", "c": "**明清出现许多通俗医书，便于初学者入门。**知识的普及，靠的是有人愿意把它讲浅显。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "三、教材与读本", "h": "歌诀与类书", "c": "**「汤头歌诀」一类读物，把知识编成顺口溜。**记忆术，是传统教育的重要组成部分。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "四、方法与理念", "h": "诵读与讲解", "c": "**先诵读经典，再由老师讲解，是传统教学的基本流程。**先记后懂，是符合当时条件的路径。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "四、方法与理念", "h": "临证与实践", "c": "**传统强调「读万卷书，行万里路」，也重视临床实践。**书本与实践的结合，是培养医者的关键。", "o": "文化史话整理 · 医学教育", "g": "典故"}, {"t": "四、方法与理念", "h": "问答与辩难", "c": "**师徒之间问答辩难，是启发式教学的雏形。**《内经》的问答体，或也反映了这种教学场景。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "四、方法与理念", "h": "因材施教", "c": "**传统教育讲究因材施教，根据学生资质施教。**这一理念，同样体现在医学传授中。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "五、教育的变迁", "h": "从师承到学校", "c": "**近代医学教育逐渐从师承转向学校教育，规模化培养人才。**教育方式的转变，是时代变迁的缩影。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "五、教育的变迁", "h": "教材的现代化", "c": "**现代教材分科更细、体系更严，与传统读本大异其趣。**教材的变化，反映着知识组织方式的变化。", "o": "文化史话整理 · 医学教育", "g": "典籍"}, {"t": "五、教育的变迁", "h": "女子学医", "c": "**近代女子逐渐获得学医机会，改变了医者群体的构成。**教育机会的扩展，是社会进步的标志。", "o": "文化史话整理 · 医学教育", "g": "人物"}, {"t": "五、教育的变迁", "h": "师承的当代价值", "c": "**如今师承教育重新受到重视，补充院校教育的不足。**传统方式在当代被重新发现。", "o": "文化史话整理 · 医学教育", "g": "典籍"}];</script>
