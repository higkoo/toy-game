<script>const D=[{"t": "一、调制之器", "h": "药碾：滚动的智慧", "c": "**药碾由碾槽与碾轮组成，用来研磨药物。**一件简单的器物，把费力的工作变得省力。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "一、调制之器", "h": "药臼与捣药", "c": "**药臼、药杵是传统药铺的常见器具。**月宫捣药的玉兔传说，也让药臼带上了神话色彩。", "o": "文化史话整理 · 医药器物", "g": "典故"}, {"t": "一、调制之器", "h": "药柜与抽屉", "c": "**传统药柜由许多小抽屉组成，每格放一味药。**密密麻麻的抽屉，是一座药物的图书馆。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "一、调制之器", "h": "戥子与称量", "c": "**戥子是称量贵重物品的小秤，也曾用于药材交易。**器物的小巧，映照出对精确的需求。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "二、诊察之具", "h": "脉枕", "c": "**诊脉时垫腕的枕，称脉枕，多为瓷制或木制。**一件小小的用具，让诊察的姿势变得舒适而郑重。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "二、诊察之具", "h": "铜人与教学", "c": "**针灸铜人是古代医学教学的著名器物。**它把书上的知识，变成了可以指认的立体模型。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "二、诊察之具", "h": "诊箱与出诊", "c": "**医者出诊携带药箱，里面分格存放器具与药物。**一个箱子，就是一个移动的小型药铺。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "三、贮藏与盛放", "h": "药罐与陶器", "c": "**传统药物多贮于陶罐、瓷瓶，防潮避光。**容器与药物的关系，是博物学的重要一环。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "三、贮藏与盛放", "h": "葫芦：最经典的药器", "c": "**葫芦既是容器，也是医者的象征。**从实用到符号，一件器物的文化生命被不断延长。", "o": "文化史话整理 · 医药器物", "g": "典故"}, {"t": "三、贮藏与盛放", "h": "药橱的排列", "c": "**药橱按类别、性味排列，本身是一套知识的空间化。**药柜的格子，就是一部立体的本草书。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "三、贮藏与盛放", "h": "香炉与熏香", "c": "**香炉用于焚香，香料也多与药物相通。**焚香的场景，是医药与生活美学交汇之处。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "四、器物与知识", "h": "器物让知识可触摸", "c": "**铜人、药柜、图谱，都把抽象知识变成可感的东西。**看见与触摸，是理解的重要途径。", "o": "文化史话整理 · 医药器物", "g": "典籍"}, {"t": "四、器物与知识", "h": "器具的标准化", "c": "**器具形制的统一，有助于知识的规范传播。**统一的器物，是统一的知识的前提。", "o": "文化史话整理 · 医药器物", "g": "典籍"}, {"t": "四、器物与知识", "h": "器物上的铭文", "c": "**一些医药器物上刻有铭文、药名，兼具实用与文献价值。**一件器物，也是一份文本。", "o": "文化史话整理 · 医药器物", "g": "典籍"}, {"t": "四、器物与知识", "h": "从器物看生活", "c": "**医药器物，反映的是古人真实的生活场景。**它们比文字更直观地呈现了过去。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "五、物尽其用", "h": "废物利用的智慧", "c": "**传统器具多用竹、木、陶、铜等寻常材料。**就地取材，是民间智慧的重要特征。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "五、物尽其用", "h": "器物与手工艺", "c": "**药碾、药柜的制作，往往由熟练的工匠完成。**医药器物，也是手工业的一部分。", "o": "文化史话整理 · 医药器物", "g": "风物"}, {"t": "五、物尽其用", "h": "器物在文学里", "c": "**药碾、药杵、葫芦常出现在诗词与绘画中。**器物进入艺术，成了文化意象。", "o": "文化史话整理 · 医药器物", "g": "典故"}, {"t": "五、物尽其用", "h": "器物的收藏", "c": "**古老的医药器物，如今成为收藏与研究的对象。**实用的旧物，成了历史的见证。", "o": "文化史话整理 · 医药器物", "g": "风物"}];</script>
