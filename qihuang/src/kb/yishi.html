<script>const D=[{"t": "一、官署沿革", "h": "太医署：唐代的医学机构", "c": "**唐代设太医署，兼具医疗、教学与管理职能。**把医学纳入官署体系，是制度化的开始。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "一、官署沿革", "h": "太医院：明清的中央医署", "c": "**明清设太医院，为宫廷与官员提供医药服务。**一个机构的设置，反映出医学在国家中的位置。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "一、官署沿革", "h": "翰林医官院：宋代的医官机构", "c": "**宋代设翰林医官院，管理医官与医药事务。**宋代制度繁杂精密，医事管理也随之细化。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "一、官署沿革", "h": "地方医官与医学", "c": "**除中央机构外，地方也设医官与医学，服务一方。**制度的触角延伸到地方，是医学普及的组织基础。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "二、职官与品级", "h": "医官的品级", "c": "**历代医官有品级、俸禄，属于官僚体系的一部分。**给医者定品级，既是认可，也是约束。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "二、职官与品级", "h": "「大夫」称呼的由来", "c": "**「大夫」本是官名，后来成了对医者的尊称。**一个称呼的转移，藏着职业地位变迁的历史。", "o": "文化史话整理 · 医事制度", "g": "典故"}, {"t": "二、职官与品级", "h": "御医与民间医者", "c": "**服务于宫廷的医者与民间医者，处境与定位大不相同。**制度的分割，塑造了不同的医者生涯。", "o": "文化史话整理 · 医事制度", "g": "人物"}, {"t": "二、职官与品级", "h": "女医与产婆", "c": "**古代也有女医、稳婆等，服务特定人群。**在严格的礼制下，她们占据着特殊而必要的位置。", "o": "文化史话整理 · 医事制度", "g": "人物"}, {"t": "三、考课与选拔", "h": "医者的考课制度", "c": "**历代对医官有考核，宋代尤为重视，定期考查。**把考核引入医学，是专业化的表现。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "三、考课与选拔", "h": "医学考试的题目", "c": "**古代医学考试考经典、考理解，也问实际操作。**考试内容，反映着一个时代认为什么最重要。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "三、考课与选拔", "h": "师承与举荐", "c": "**除考试外，师承与举荐也是医者入行的重要途径。**制度之外，人情与传承同样起作用。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "三、考课与选拔", "h": "「儒医」的理想", "c": "**传统推崇「儒医」，认为医者当有文化修养。**理想医者的形象，是由制度与观念共同塑造的。", "o": "文化史话整理 · 医事制度", "g": "人物"}, {"t": "四、药政与管理", "h": "药品的征集与储备", "c": "**历代有药品征集、储备制度，以应对疫病与灾荒。**药物储备，是国家治理的一部分。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "四、药政与管理", "h": "和剂局与成药", "c": "**宋代设和剂局，按规范制作、出售成药。**成药的标准化与官营，是医药公共化的早期尝试。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "四、药政与管理", "h": "药材的征税与进贡", "c": "**药材作为物产，也涉及征税与进贡。**一味药背后，有经济与制度的链条。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "四、药政与管理", "h": "禁伪与定点", "c": "**官方对药品真伪、售卖有管理规定。**讲求「道地」之外，制度也在维护品质。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "五、制度文化", "h": "医事与礼制", "c": "**宫廷医疗讲究礼数，诊视、用药都有规矩。**礼制渗透到医疗，是传统社会的特点。", "o": "文化史话整理 · 医事制度", "g": "典故"}, {"t": "五、制度文化", "h": "医案与档案", "c": "**官方医案记录诊治过程，兼具管理与史料价值。**一份医案，也是一份历史档案。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "五、制度文化", "h": "疫病与国家的应对", "c": "**历史上疫病流行时，国家会组织赈济与医药。**公共卫生的雏形，早已存在于传统治理中。", "o": "文化史话整理 · 医事制度", "g": "典籍"}, {"t": "五、制度文化", "h": "医者的社会地位", "c": "**医者地位历代有升降，与制度、观念密切相关。**一个职业的声望，是社会价值观的晴雨表。", "o": "文化史话整理 · 医事制度", "g": "人物"}, {"t": "五、制度文化", "h": "制度与传承", "c": "**官署、学校、考试共同构成了医学传承的制度网络。**个人天才之外，制度才是长久的保障。", "o": "文化史话整理 · 医事制度", "g": "典籍"}];</script>
