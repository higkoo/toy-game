<script>const D=[{"t": "一、星空秩序", "h": "二十八宿：天空的坐标", "c": "**古人把黄道附近的星空分为二十八个区域，称「二十八宿」。**它们像天空的路标，用于观测日月运行。给繁星建立秩序，是认识宇宙的第一步。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "一、星空秩序", "h": "三垣：天上的宫廷", "c": "**北天极附近分为紫微、太微、天市三垣，星官多以宫廷官署命名。**天上的星图，是人间秩序的一面镜子。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "一、星空秩序", "h": "北斗七星：斗柄指时", "c": "**古人以北斗斗柄的指向判断季节：「斗柄东指，天下皆春」。**七颗星成了一座天然时钟。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "一、星空秩序", "h": "北极星：不动的中心", "c": "**北极星位于天球北极附近，看似不动，古人视为天的中心。**「譬如北辰，居其所而众星共之」，以它比喻德行。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "一、星空秩序", "h": "银河：天上之河", "c": "**银河在古人眼中是一条真正的「河」，有牛郎织女的传说。**天文现象与神话交织，是各文明的共同特点。", "o": "文化史话整理 · 星官与历法", "g": "典故"}, {"t": "一、星空秩序", "h": "彗星与客星：不速之客", "c": "**古人把彗星、新星称为「客星」，记为天象异变。**对异常天象的持续记录，是古代天文学的重要遗产。", "o": "文化史话整理 · 星官与历法", "g": "典籍"}, {"t": "二、授时与历法", "h": "观天授时：历法的目的", "c": "**历法的核心任务，是安排农时、指导生活。**「敬天」首先意味着把人类活动放进天时秩序里。", "o": "文化史话整理 · 星官与历法", "g": "典籍"}, {"t": "二、授时与历法", "h": "阴阳合历：农历的智慧", "c": "**中国传统历法兼顾月亮圆缺与太阳回归，是阴阳合历。**它既照顾月相，又贴合季节，是一套精巧的时间系统。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "二、授时与历法", "h": "闰月：调和阴阳", "c": "**为使月份与季节对应，历法设置了闰月。**「十九年七闰」是古人找出的调和周期。置闰，是时间计算的智慧。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "二、授时与历法", "h": "干支纪时：六十甲子", "c": "**十天干与十二地支相配成六十甲子，用于纪年、月、日、时。**这套编号循环往复，用了几千年，至今仍在民俗中使用。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "二、授时与历法", "h": "十二时辰", "c": "**古人把一天分为十二个时辰，以地支命名。**「子时」「午时」等词，至今还在日常语言里活跃。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "二、授时与历法", "h": "生肖与地支", "c": "**十二生肖与十二地支相配，形成独特的纪年文化。**把动物与年份对应，让抽象的时间变得亲切可记。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "三、仪器与观测", "h": "圭表：用影子量时间", "c": "**立表测影，以影长定冬至夏至与年长。**一根杆、一片影子，就能读出时间节律，是「以简测繁」的典范。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "三、仪器与观测", "h": "浑天仪：把天装进仪器", "c": "**浑天仪以圆环模拟天体运行，是古代重要的天文仪器。**把宇宙做成可旋转的模型，是惊人的想象力。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "三、仪器与观测", "h": "漏刻：滴水的时钟", "c": "**漏刻以水滴计时，是古代重要的计时工具。「刻」作为时间单位，沿用至今。**让水均匀地滴，就是让时间可见。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "三、仪器与观测", "h": "日晷：太阳的钟面", "c": "**日晷利用日影投在盘面上的位置计时。**有太阳的地方就有时间，是最直观的计时方式。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "三、仪器与观测", "h": "观象台：古代的天文机构", "c": "**历代设有观象台与天文官，负责观测天象、编制历法。**天文在中国古代，是事关国计民生的官方之学。", "o": "文化史话整理 · 星官与历法", "g": "典籍"}, {"t": "四、天文与思想", "h": "天人感应：天象与人事", "c": "**传统思想相信天象与人间事务存在关联。**这种观念虽有时代局限，却推动了古人持续、细致地观测天空。", "o": "文化史话整理 · 星官与历法", "g": "典籍"}, {"t": "四、天文与思想", "h": "盖天、浑天与宣夜", "c": "**古代有盖天、浑天、宣夜等宇宙学说，争论天地结构。**不同宇宙模型的并立，是先秦至汉思想活力的体现。", "o": "文化史话整理 · 星官与历法", "g": "典籍"}, {"t": "四、天文与思想", "h": "《步天歌》：给星星写诗", "c": "**《步天歌》以七言韵文描述星官位置，便于记诵。**把天文知识编成歌诀，是传统的记忆术。", "o": "文化史话整理 · 星官与历法", "g": "典籍"}, {"t": "四、天文与思想", "h": "星占与历算之间", "c": "**古代天文常与星占交织，但历算部分积累了严谨的数学知识。**科学与观念，在历史上常常相伴而行。", "o": "文化史话整理 · 星官与历法", "g": "典籍"}, {"t": "四、天文与思想", "h": "天文与方位", "c": "**天文观测与地理方位密切相关，「分野」说把星区对应地域。**把天与地对应，是整体观的一种表达。", "o": "文化史话整理 · 星官与历法", "g": "典籍"}, {"t": "五、历法的文化", "h": "农历与节日", "c": "**春节、中秋、端午等传统节日，多依农历而定。**历法不只是计时，更塑造了一个民族的生活节奏。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "五、历法的文化", "h": "节气入选世界遗产", "c": "**二十四节气被列入人类非物质文化遗产。**一套古老的时间知识，成为世界认可的文化财富。", "o": "文化史话整理 · 星官与历法", "g": "典籍"}, {"t": "五、历法的文化", "h": "历法与农谚", "c": "**大量农谚把天时与农事经验编成顺口溜。**这是农民口传的历法，朴素而实用。", "o": "文化史话整理 · 星官与历法", "g": "风物"}, {"t": "五、历法的文化", "h": "时间观念的变迁", "c": "**从观天授时到标准时钟，人类对时间的理解不断变化。**时间观的变化，折射出整个社会的变迁。", "o": "文化史话整理 · 星官与历法", "g": "典籍"}];</script>
