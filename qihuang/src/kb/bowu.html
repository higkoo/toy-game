<script>const D=[{"t": "一、草木有情", "h": "岁寒三友：松竹梅", "c": "**松、竹、梅经冬不凋，被并称「岁寒三友」，象征坚贞。**把三种植物的物性，提炼为人格的标尺。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "一、草木有情", "h": "花中四君子", "c": "**梅、兰、竹、菊合称「四君子」，各有高洁、幽雅、虚心、淡泊之德。**以花拟人，是传统的审美方式。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "一、草木有情", "h": "莲：出淤泥而不染", "c": "**莲出自淤泥而花洁，被周敦颐誉为「花之君子」。**一种植物的生长特性，被升华为道德理想。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "一、草木有情", "h": "牡丹：花开时节动京城", "c": "**牡丹以富丽著称，唐代长安赏牡丹成风。**一种花，能牵动一座城的季节与情感。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "一、草木有情", "h": "芍药与牡丹：花中二绝", "c": "**古人以牡丹为花王、芍药为花相，并称「花中二绝」。**给花排座次，是文人雅趣的一部分。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "二、虫鱼鸟兽", "h": "鹤：仙禽之象", "c": "**鹤在中国文化中是长寿、高洁的象征，常与仙人相伴。**一种鸟，承载了人们对超脱的向往。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "二、虫鱼鸟兽", "h": "龟：长寿与占卜", "c": "**龟以长寿著称，又因甲壳用于占卜而具神秘色彩。**「龟龄」成为祝寿之辞。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "二、虫鱼鸟兽", "h": "鱼：年年有余", "c": "**「鱼」谐音「余」，象征富足有余。**年画、剪纸里的鱼，是春节最常见的吉祥图案。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "二、虫鱼鸟兽", "h": "蝙蝠：福的谐音", "c": "**蝙蝠因谐音「福」，在传统装饰中广受欢迎。**倒飞的蝙蝠寓意「福到」。谐音，是民俗取吉的重要方式。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "二、虫鱼鸟兽", "h": "蝉：居高声自远", "c": "**蝉饮露而鸣，古人视为高洁的象征。**虞世南「居高声自远，非是藉秋风」，借蝉说品格。", "o": "文化史话整理 · 博物杂识", "g": "典故"}, {"t": "二、虫鱼鸟兽", "h": "蝴蝶：庄周梦蝶", "c": "**「庄周梦蝶」的典故，让蝴蝶成为物我两忘、人生如梦的哲学意象。**一只蝶，承载了深刻的哲学思考。", "o": "文化史话整理 · 博物杂识", "g": "典故"}, {"t": "三、器物与生活", "h": "铜镜：照见古今", "c": "**铜镜是古人日常用具，也常作为随葬品与馈赠之物。**一面镜子，照见容貌，也照见时代审美。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "三、器物与生活", "h": "扇：怀袖雅物", "c": "**折扇、团扇既是用具，也是书画载体，是文人的「怀袖雅物」。**一柄扇子，可以是一件移动的艺术品。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "三、器物与生活", "h": "砚：文房之宝", "c": "**砚台是文房四宝之一，讲究石质、雕工与铭文。**一方砚，凝结着文人对手感和审美的追求。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "三、器物与生活", "h": "香：一缕中的天地", "c": "**焚香是古人读书、静坐、待客的常事，形成独特的香文化。**一缕香气，营造出一个安顿身心的空间。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "三、器物与生活", "h": "茶器：从煮到点", "c": "**饮茶方式的演变，带来茶器的变化，也塑造了不同时代的茶风。**器物的变化，折射生活方式的变迁。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "四、风土与地理", "h": "九州：天下的想象", "c": "**《禹贡》把天下分为九州，奠定「九州」作为中国的代称。**一种地理划分，成了文化共同体的想象基础。", "o": "文化史话整理 · 博物杂识", "g": "典籍"}, {"t": "四、风土与地理", "h": "山川与地脉", "c": "**传统重视山川形势，形成了关于地理环境的独特观念。**择水而居、依山而建，包含着长期的生活经验。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "四、风土与地理", "h": "江南：从地理到意象", "c": "**「江南」不只是地理区域，更是诗词里温润秀美的文化意象。**一个地名，承载了无尽的审美想象。", "o": "文化史话整理 · 博物杂识", "g": "典故"}, {"t": "四、风土与地理", "h": "长安与洛阳：古都的双子星", "c": "**长安、洛阳长期是文化中心，见证了无数历史。**古都的兴衰，是中国历史的一条主线。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "四、风土与地理", "h": "丝绸之路上的物产", "c": "**葡萄、石榴、胡麻等物产沿丝路传入，改变了中国的物质生活。**一条商路，也是物产与文化的交流之路。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "五、博物学精神", "h": "《尔雅》：名物之学源头", "c": "**《尔雅》是中国最早的解释词义、分类名物的著作。**给万物命名分类，是认识世界的第一步。", "o": "文化史话整理 · 博物杂识", "g": "典籍"}, {"t": "五、博物学精神", "h": "博物与格物", "c": "**「格物致知」讲推究事物之理，是传统学术的重要方法。**观察万物，从中求理，是朴素的科学精神。", "o": "文化史话整理 · 博物杂识", "g": "典籍"}, {"t": "五、博物学精神", "h": "方志中的物产志", "c": "**地方志常设物产一门，记录当地草木、矿藏、风俗。**方志是博物学资料的巨大宝库。", "o": "文化史话整理 · 博物杂识", "g": "典籍"}, {"t": "五、博物学精神", "h": "博物图谱的传统", "c": "**从本草图到花鸟画，图像始终承担记录万物的功能。**图文互证，是传统博物学的重要方法。", "o": "文化史话整理 · 博物杂识", "g": "风物"}, {"t": "五、博物学精神", "h": "奇物与异闻", "c": "**古代博物书也收录奇珍异闻，反映出对未知世界的好奇。**好奇，是科学萌芽的心理土壤。", "o": "文化史话整理 · 博物杂识", "g": "典故"}];</script>
