<script>const D=[{"t": "一、医德佳话", "h": "杏林春暖：一个关于回报的故事", "c": "**相传三国时医者董奉，为人施治不取钱财，只让病家种杏树。**日久杏树成林，后人遂以「杏林」称医界，以「杏林春暖」颂扬医德。\n\n这个故事的重点不在医术，而在**「不取回报、以德为先」的品格**。一个行业用自己的典故来定义其值所在，是很有意思的文化现象。", "o": "中医典故与医德文化 · 文化史话整理", "g": "典故"}, {"t": "一、医德佳话", "h": "悬壶济世：葫芦里的来历", "c": "**传说东汉时有老翁卖药，悬挂一只葫芦于市，白天行医，夜里跳入壶中。**后人称行医为「悬壶」，称医者的善举为「悬壶济世」。\n\n一只小小的葫芦，因这段传说成了医者的标志。**老药铺门前的葫芦招牌，至今仍在延续这个近千年的意象。**", "o": "《后汉书·方术列传》相关记载 · 文化史话整理", "g": "典故"}, {"t": "一、医德佳话", "h": "橘井泉香：另一则温暖传说", "c": "**相传汉代苏仙公升仙前，嘱咐家人以井水与橘叶救人。**后来乡里疫病流行，家人依言而行，果然救了许多人。后人以「橘井泉香」与「杏林春暖」并举，同称医德。\n\n「杏林」与「橘井」，一南一北两则传说，共同构成了中医**「以仁心济世」的自我形象**。", "o": "中医典故与医德文化 · 文化史话整理", "g": "典故"}, {"t": "一、医德佳话", "h": "大医精诚：一篇关于「心」的文字", "c": "**唐代孙思邈在书中写下《大医精诚》一篇，讲为医者应有的心性。**他强调「先发大慈恻隐之心」，不论贵贱贫富，皆如至亲一般对待。\n\n这篇文字之所以动人，在于它把「技术」置于「德行」之后：**先做一个仁厚的人，才配谈医术。**这是中国传统职业伦理的一份经典文本。", "o": "《备急千金要方》 · 文化史话整理", "g": "典籍"}, {"t": "二、名医风流", "h": "扁鹊：一个名字，一种象征", "c": "**「扁鹊」本是上古传说中的神医名号，后来被用作对良医的尊称。**战国时有一位医者，因医术高明，人们便以「扁鹊」称之。\n\n一个名字被反复「借用」，说明它已升华为一种象征。**在中文里，「扁鹊」几乎就是「神医」的代名词。**", "o": "《史记·扁鹊仓公列传》 · 文化史话整理", "g": "人物"}, {"t": "二、名医风流", "h": "华佗与五禽戏：模仿动物的古老体操", "c": "**传说华佗模仿虎、鹿、熊、猿、鸟五种动物的姿态，编成一套导引运动的套路，称「五禽戏」。**\n\n不论传说细节如何，五禽戏体现了一种极有趣的思想：**向自然学习，从动物的运动中汲取身体的智慧。**它至今仍是一套广为流传的健身方法。", "o": "中国传统导引术 · 文化史话整理", "g": "典故"}, {"t": "二、名医风流", "h": "李时珍：走向田野的学者", "c": "**李时珍编《本草纲目》，不满足于伏案读书，而是遍访四方、实地采录。**他不耻下问，向农夫、渔人、猎户请教，把民间经验收入书中。\n\n这种「走向田野」的态度，在当时极为难得。**博物学的根基，永远在书本之外的广阔天地里。**", "o": "《明史·李时珍传》 · 文化史话整理", "g": "人物"}, {"t": "二、名医风流", "h": "孙思邈：从隐士到「药王」", "c": "**孙思邈一生隐居，屡辞朝廷征召，却以学问与德行赢得后世尊崇，被民间称为「药王」。**\n\n他的形象很能代表传统士人的理想：**不慕荣利，却以学问济世；身在山林，心系苍生。**后世为他立祠，至今香火不绝。", "o": "《旧唐书·孙思邈传》 · 文化史话整理", "g": "人物"}, {"t": "三、活进汉语的中医", "h": "「对症下药」：一句话的来历", "c": "**「对症下药」今天泛指针对具体问题采取相应办法。**它本源于对诊疗行为的概括：先辨明情况，再决定用什么方法。\n\n这个成语之所以流传，是因为它说中了一个朴素道理：**解决问题之前，先要看清问题。**它早已走出医界，成为通用的汉语表达。", "o": "汉语成语源流 · 文化史话整理", "g": "典故"}, {"t": "三、活进汉语的中医", "h": "「望闻问切」：四种了解人的方式", "c": "**「望、闻、问、切」被概括为中医了解情况的四种方法：看气色、听声音、问情况、触脉搏。**\n\n跳出具体语境，这四个字其实提供了一套**「全面收集信息再下判断」的方法论**。中国人常说「望闻问切」，用的正是这个引申义。", "o": "中医诊断文化 · 文化史话整理", "g": "典故"}, {"t": "三、活进汉语的中医", "h": "「妙手回春」与「起死回生」", "c": "**「妙手回春」「起死回生」都是赞颂高超医术的成语**，字面带着「让春天回来」「让死者复生」的夸张想象。\n\n汉语在这些成语里，赋予医者近乎神奇的色彩。**夸张，是语言赞美一个人时最常用的修辞。**", "o": "汉语成语源流 · 文化史话整理", "g": "典故"}, {"t": "三、活进汉语的中医", "h": "「讳疾忌医」：一则寓言的力量", "c": "**「讳疾忌医」出自扁鹊见蔡桓公的故事**：疾在浅表时易治，病人却一再否认，终至不可挽回。\n\n这则寓言讲的是一个普遍的人性弱点——**不愿正视自己的问题**。它之所以流传两千多年，正因为这弱点至今仍在每个人身上。", "o": "《韩非子·喻老》 · 文化史话整理", "g": "典故"}, {"t": "四、民俗与信仰", "h": "药王信仰与民间祭祀", "c": "**民间有祭祀「药王」的传统，所奉人物因地域而异，孙思邈、扁鹊等都被尊奉。**庙会、香火、传说，构成了独特的药王信仰民俗。\n\n对一个行业的祖师进行祭祀，是传统社会的形式之一。**它表达的是感恩，也是对这个行业价值的集体确认。**", "o": "中国民间信仰 · 文化史话整理", "g": "风物"}, {"t": "四、民俗与信仰", "h": "「不为良相，便为良医」", "c": "**相传范仲淹有言：「不为良相，便为良医。」**意思是：若不能做治理天下的宰相，就做一位救人的医生。\n\n这句话把「医」提到了与「相」相当的高度——**两者都是在「济世」，只是方式不同。**它是传统士人价值观里极动人的一句。", "o": "士人文化史 · 文化史话整理", "g": "人物"}];</script>
