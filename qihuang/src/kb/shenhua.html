<script>const D=[{"t": "一、人文初祖", "h": "神农尝百草：探索的寓言", "c": "**传说神农为辨识物产，亲尝百草，历尽艰险。**它是关于勇于探索、以身求证的最古老寓言。", "o": "文化史话整理 · 神话与医", "g": "典故"}, {"t": "一、人文初祖", "h": "黄帝与岐伯的对话", "c": "**《黄帝内经》以黄帝与岐伯问答的形式展开。**托名圣君与贤臣的对话，是古人立说的常见方式。", "o": "文化史话整理 · 神话与医", "g": "典故"}, {"t": "一、人文初祖", "h": "伏羲制九针", "c": "**传说伏羲观察天地人身，制作九种针具。**把工具的发明归于人文初祖，是为学问「立根」。", "o": "文化史话整理 · 神话与医", "g": "典故"}, {"t": "一、人文初祖", "h": "雷公与医理的传授", "c": "**古籍中常有黄帝与雷公讨论医理的段落。**借神话人物之口讲道理，让抽象内容有了场景感。", "o": "文化史话整理 · 神话与医", "g": "典故"}, {"t": "一、人文初祖", "h": "伯高、少师等神话人物", "c": "**《内经》中还有伯高、少师等人物参与问答。**一个个神话角色，构成了丰富的对话场景。", "o": "文化史话整理 · 神话与医", "g": "典故"}, {"t": "二、神仙与方术", "h": "蓬莱仙山与不死药", "c": "**古代有蓬莱三神山与不死药的传说，影响深远。**对长寿的向往，催生了丰富的神仙想象。", "o": "文化史话整理 · 神话与医", "g": "典故"}, {"t": "二、神仙与方术", "h": "炼丹术与医药", "c": "**炼丹术追求长生，却在过程中积累了化学与博物知识。**动机与结果，有时并不一致。", "o": "文化史话整理 · 神话与医", "g": "典籍"}, {"t": "二、神仙与方术", "h": "葛洪与抱朴子", "c": "**东晋葛洪著《抱朴子》，广论神仙、炼丹与博物。**他的书，是研究古代方术思想的重要文献。", "o": "文化史话整理 · 神话与医", "g": "人物"}, {"t": "二、神仙与方术", "h": "八仙与葫芦", "c": "**铁拐李悬葫芦的形象，与「悬壶济世」的医者意象相通。**神仙传说与医药符号，互相借力。", "o": "文化史话整理 · 神话与医", "g": "典故"}, {"t": "三、地方的药王", "h": "孙思邈的药王信仰", "c": "**民间尊孙思邈为药王，立庙祭祀，香火不绝。**由人而神，是对医者功德的最高纪念。", "o": "文化史话整理 · 神话与医", "g": "风物"}, {"t": "三、地方的药王", "h": "各地药王的不同面目", "c": "**不同地区所奉药王人物各异，有扁鹊、孙思邈、韦慈藏等。**一地有一地的药王，反映出信仰的地方性。", "o": "文化史话整理 · 神话与医", "g": "风物"}, {"t": "三、地方的药王", "h": "药王庙会", "c": "**药王庙会期间，有祭祀、交易、演剧等活动。**一个信仰节日，也是地方社会的盛会。", "o": "文化史话整理 · 神话与医", "g": "风物"}, {"t": "三、地方的药王", "h": "药签与求药", "c": "**一些庙宇有「药签」，供人求取。**这是信仰与医疗交织的民俗现象，反映了民众的求助心理。", "o": "文化史话整理 · 神话与医", "g": "风物"}, {"t": "四、神话的解读", "h": "神话不是史实", "c": "**神话不必当作史实，却真实反映了古人的观念与情感。**读神话，是读一个时代的精神世界。", "o": "文化史话整理 · 神话与医", "g": "典故"}, {"t": "四、神话的解读", "h": "托名与立说", "c": "**把著作托名圣王，是确立学术正统的方式。**书名与作者，往往是一种立场声明。", "o": "文化史话整理 · 神话与医", "g": "典籍"}, {"t": "四、神话的解读", "h": "神话与知识的起源", "c": "**每个文明都用神话解释知识从何而来。**「神农尝百草」回答的，正是这个问题。", "o": "文化史话整理 · 神话与医", "g": "典故"}, {"t": "四、神话的解读", "h": "从神话到史传", "c": "**随着史学发展，人们逐渐从神话转向人事记录。**《史记》中的医者传记，标志着这种转变。", "o": "文化史话整理 · 神话与医", "g": "典籍"}, {"t": "五、传说的生命力", "h": "传说的口耳相传", "c": "**许多医药传说靠民间口耳相传，未被正史收录。**民间记忆，是文化史的重要组成部分。", "o": "文化史话整理 · 神话与医", "g": "风物"}, {"t": "五、传说的生命力", "h": "传说的地域色彩", "c": "**同一传说在不同地方有不同版本。**地方的改写，让传说带着乡土的气息。", "o": "文化史话整理 · 神话与医", "g": "风物"}, {"t": "五、传说的生命力", "h": "传说与地方风物", "c": "**一些山川、井泉因传说得名，成为地方风物。**传说给地理景观赋予了文化意义。", "o": "文化史话整理 · 神话与医", "g": "风物"}, {"t": "五、传说的生命力", "h": "传说在当代", "c": "**古老的传说今天仍被讲述、改编，进入影视与游戏。**传统不是标本，而是活的资源。", "o": "文化史话整理 · 神话与医", "g": "典故"}];</script>

(function () {
  'use strict';
  var KEY = 'qihuang.rank.v1', FILE = 'shenhua.html';
  function num() { try { return parseInt(window.localStorage.getItem(KEY), 10) || 0; } catch (e) { return 0; } }
  function put(v) { try { window.localStorage.setItem(KEY, String(v)); } catch (e) {} }
  function sdk() {
    var list = [window.toy, window.Toy, window.toy && window.toy.toy, window.Toy && window.Toy.toy];
    for (var i = 0; i < list.length; i++) if (list[i] && typeof list[i].submitScore === 'function') return list[i];
    return null;
  }
  function send(score) {
    var t = sdk(); if (!t) return;
    try { t.submitScore({ score: score, board: 1 }); } catch (e) {}
  }
  var sk = KEY + '.seen', seen = [];
  try { seen = JSON.parse(window.localStorage.getItem(sk) || '[]') || []; } catch (e) { seen = []; }
  if (!Array.isArray(seen)) seen = [];
  if (seen.indexOf(FILE) === -1) {
    seen.push(FILE);
    try { window.localStorage.setItem(sk, JSON.stringify(seen)); } catch (e) {}
    var v = num() + 1; put(v); send(v);
  }
})();
