<script>const D=[{"t": "一、养生雅事", "h": "五禽戏：模仿动物的体操", "c": "**相传华佗模仿虎鹿熊猿鸟编成五禽戏，是一套导引运动。**向自然学习身体智慧，是极有趣的传统。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "一、养生雅事", "h": "八段锦：一套流传的导引术", "c": "**八段锦以八节动作组成，动作柔和，流传甚广。**它是传统导引文化的一部分，重在舒展与调息。", "o": "文化史话整理 · 典故拾遗", "g": "风物"}, {"t": "一、养生雅事", "h": "导引与按跷", "c": "**「导引」指活动肢体、调和呼吸，「按跷」指按摩。**这些是古代养生文化的重要内容，常见于典籍记载。", "o": "文化史话整理 · 典故拾遗", "g": "典籍"}, {"t": "一、养生雅事", "h": "吐纳与静坐", "c": "**传统讲究调息、静坐，追求内心的安宁。**这既是一种修养方法，也影响了后来的武术与气功文化。", "o": "文化史话整理 · 典故拾遗", "g": "典籍"}, {"t": "一、养生雅事", "h": "太极拳的源流", "c": "**太极拳相传明末清初成型，讲究以柔克刚、动静相宜。**它把武术、养生与哲学融为一体。", "o": "文化史话整理 · 典故拾遗", "g": "风物"}, {"t": "二、人物轶事", "h": "坐堂医生的来历", "c": "**传说张仲景任太守时坐堂行医，后世称医者坐诊为「坐堂」，药铺多称「堂」。**一段传说，解释了一个沿用至今的词。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "二、人物轶事", "h": "悬壶的葫芦", "c": "**老翁悬壶卖药的传说，让葫芦成了医者的标志。**老药铺门前的葫芦招牌，延续着这个千年意象。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "二、人物轶事", "h": "讳疾忌医的蔡桓公", "c": "**扁鹊一再提醒蔡桓公，桓公却讳言忌医，终至不救。**这则寓言讲的正视问题的人性弱点，至今警醒。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "二、人物轶事", "h": "医缓入梦：以医喻政", "c": "**医缓为晋侯诊病，借病劝其远离迷惑、亲近贤臣。**以医理喻政理，是古人进言的智慧。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "二、人物轶事", "h": "鲍姑艾灸的传说", "c": "**相传鲍姑善用艾灸，救人不计回报。**她的故事，是传统医学中女性医者的珍贵记忆。", "o": "文化史话整理 · 典故拾遗", "g": "人物"}, {"t": "三、文化符号", "h": "药王庙与民间信仰", "c": "**民间祭祀药王，所奉人物因地域而异。**庙会香火，构成了独特的医药民俗。", "o": "文化史话整理 · 典故拾遗", "g": "风物"}, {"t": "三、文化符号", "h": "葫芦：从器物到象征", "c": "**葫芦既是容器，又因传说成了医者与道家的象征。**一件寻常器物，被赋予了多重文化含义。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "三、文化符号", "h": "杏林的千年生命", "c": "**「杏林」从董奉的杏树，长成了整个医学界的代称。**一个意象能延续千年，靠的是不断被重新讲述。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "三、文化符号", "h": "橘井：另一处文化地标", "c": "**「橘井泉香」与「杏林春暖」并举，成为医德的象征。**两处意象，共同撑起行业的精神空间。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "三、文化符号", "h": "「医国」的比喻", "c": "**古人把治理国家比作调理身体，「医国」成了常用的比喻。**身体与国家的同构，是传统思想的鲜明特点。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "四、雅俗之间", "h": "药名谜的趣味", "c": "**以药名制谜、猜谜，是文人的雅趣。**「当归」可谜「应当归来」，音义双关，机趣盎然。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "四、雅俗之间", "h": "药名信与药名词", "c": "**有人把药名嵌入书信、词作，传递言外之意。**药名成了一种含蓄表达的密码。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "四、雅俗之间", "h": "民间药谚", "c": "**民间流传大量关于物候、采集的谚语，是口传的博物知识。**「三月三，荠菜当灵丹」一类，朗朗上口。", "o": "文化史话整理 · 典故拾遗", "g": "风物"}, {"t": "四、雅俗之间", "h": "端午采药的习俗", "c": "**端午有采药、挂艾、佩香囊的习俗。**一个节日，集中展现了传统医药与民俗的交融。", "o": "文化史话整理 · 典故拾遗", "g": "风物"}, {"t": "四、雅俗之间", "h": "重阳登高与菊花", "c": "**重阳有登高、赏菊、饮菊花酒的习俗。**节日、植物与祝寿文化，在菊花上汇合。", "o": "文化史话整理 · 典故拾遗", "g": "风物"}, {"t": "五、典故的流变", "h": "典故如何长生", "c": "**一个典故能流传，往往因为它说中了恒常的人性与处境。**「讳疾忌医」至今鲜活，正因这弱点人人都有。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "五、典故的流变", "h": "从典故到成语", "c": "**许多成语源自历史典故，在流传中逐渐脱离原境。**语义的泛化，是语言活力的表现。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "五、典故的流变", "h": "传说的史实内核", "c": "**传说未必是史实，却常折射出真实的观念与情感。**读传说，也是读一个时代的精神。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}, {"t": "五、典故的流变", "h": "地方传说与集体记忆", "c": "**许多医家传说只在地方流传，构成当地的集体记忆。**正史之外，民间记忆同样珍贵。", "o": "文化史话整理 · 典故拾遗", "g": "风物"}, {"t": "五、典故的流变", "h": "典故的当代价值", "c": "**古老典故在当代仍被引用，因为它们提供了理解现实的镜子。**传统不是过去，而是仍在使用的资源。", "o": "文化史话整理 · 典故拾遗", "g": "典故"}];</script>
