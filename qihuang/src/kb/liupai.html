<script>const D=[{"t": "一、经方一脉", "h": "经方派的传统", "c": "**经方派尊崇《伤寒论》《金匮要略》中的经典方。**他们强调回归原书，师法古人。尊经，是这一派的鲜明立场。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "一、经方一脉", "h": "「方证相应」的思想", "c": "**经方派讲究方与证相对应，强调针对性。**这种思路把复杂的诊治，归纳为清晰的对应关系。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "一、经方一脉", "h": "经方的守正与创新", "c": "**尊经并不等于泥古，许多经方家也有自己的发挥。**在守正与创新之间，是学术的张力所在。", "o": "文化史话整理 · 学术流派", "g": "人物"}, {"t": "一、经方一脉", "h": "经方在日本的传承", "c": "**日本古方派尊崇经方，形成独具特色的学术传统。**一派之学跨海生根，是学术生命力的证明。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "二、温病学派", "h": "温病学说的兴起", "c": "**明清时期，温病学说逐渐成熟，成为重要的学术流派。**它对热性病的认识，丰富了传统医学的理论。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "二、温病学派", "h": "叶天士与卫气营血", "c": "**叶天士提出卫、气、营、血的层次辨析，影响深远。**把复杂的病变分为层次，是归纳思想的体现。", "o": "文化史话整理 · 学术流派", "g": "人物"}, {"t": "二、温病学派", "h": "吴鞠通与三焦", "c": "**吴鞠通以三焦为纲，著《温病条辨》，自成体系。**不同学者用不同框架，共同丰富了温病学说。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "二、温病学派", "h": "温病与伤寒之争", "c": "**历史上温病派与伤寒派有过论辩，互相批评也互相补充。**学派的争鸣，推动了理论的深化。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "三、金元四家", "h": "金元学术的活跃", "c": "**金元时期学派林立，被称为医学史上的繁荣时代。**社会的变动，往往激发思想的活跃。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "三、金元四家", "h": "刘完素与寒凉", "c": "**刘完素倡导寒凉，强调火热病机。**一派的主张，是对当时常见问题的回应。", "o": "文化史话整理 · 学术流派", "g": "人物"}, {"t": "三、金元四家", "h": "张从正与攻邪", "c": "**张从正主张祛邪，反对一味进补。**他的观点，是对当时风气的纠偏。", "o": "文化史话整理 · 学术流派", "g": "人物"}, {"t": "三、金元四家", "h": "李东垣与脾胃", "c": "**李东垣著《脾胃论》，强调脾胃的根本作用。**乱世中的民生疾苦，塑造了他的学术关怀。", "o": "文化史话整理 · 学术流派", "g": "人物"}, {"t": "三、金元四家", "h": "朱丹溪与滋阴", "c": "**朱丹溪倡导滋阴，兼通理学。**把哲学思考带入医学，是金元学术的鲜明特点。", "o": "文化史话整理 · 学术流派", "g": "人物"}, {"t": "四、汇通与新学", "h": "中西汇通派", "c": "**近代出现主张汇通中西医学的学派，张锡纯等是其代表。**面对外来学问，如何取舍，是时代之问。", "o": "文化史话整理 · 学术流派", "g": "人物"}, {"t": "四、汇通与新学", "h": "「衷中参西」的主张", "c": "**张锡纯提出「衷中参西」，主张以中学为本、参酌西学。**一种折中立场，反映着转型期的思考。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "四、汇通与新学", "h": "改良与保存之争", "c": "**近代有主张改良医者，也有力主保存国粹者。**争论的背后，是传统如何面对现代的大问题。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "四、汇通与新学", "h": "学派与时代", "c": "**每一个学派的兴起，都回应着它所面对的时代问题。**学术不是书斋里的空想，而是对现实的应答。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "五、争鸣与融合", "h": "争鸣的价值", "c": "**不同学派的论辩，是学术活力的重要来源。**一致未必是好事，分歧往往孕育突破。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "五、争鸣与融合", "h": "流派之间的互相吸收", "c": "**学派虽分立，却常互相吸收、彼此渗透。**纯粹的分野并不存在，融合才是常态。", "o": "文化史话整理 · 学术流派", "g": "典籍"}, {"t": "五、争鸣与融合", "h": "门户之见与开放", "c": "**学派也可能形成门户之见，阻碍交流。**打破门户，需要开放的学术胸襟。", "o": "文化史话整理 · 学术流派", "g": "典故"}, {"t": "五、争鸣与融合", "h": "折中与集大成", "c": "**许多医家不专主一家，而是博采众长。**集大成者，往往能超越派别。", "o": "文化史话整理 · 学术流派", "g": "人物"}, {"t": "五、争鸣与融合", "h": "学派的当代理解", "c": "**今天回看流派，更重其思想价值，而非门户之分。**把争论看作思想资源，是成熟的学术态度。", "o": "文化史话整理 · 学术流派", "g": "典籍"}];</script>

/* 读册计分：与首页榜单共用同一 key 与去重集合，同一册只计一次 */
(function () {
  'use strict';
  var KEY = 'qihuang.rank.v1', FILE = 'liupai.html';
  function num() { try { return parseInt(window.localStorage.getItem(KEY), 10) || 0; } catch (e) { return 0; } }
  function put(v) { try { window.localStorage.setItem(KEY, String(v)); } catch (e) {} }
  function sdk() {
    var list = [window.toy, window.Toy, window.toy && window.toy.toy, window.Toy && window.Toy.toy];
    for (var i = 0; i < list.length; i++) if (list[i] && typeof list[i].submitScore === 'function') return list[i];
    return null;
  }
  function send(score) {
    var t = sdk(); if (!t) return;
    try { t.submitScore({ score: score, board: 1 }); } catch (e) {}
  }
  var sk = KEY + '.seen', seen = [];
  try { seen = JSON.parse(window.localStorage.getItem(sk) || '[]') || []; } catch (e) { seen = []; }
  if (!Array.isArray(seen)) seen = [];
  if (seen.indexOf(FILE) === -1) {
    seen.push(FILE);
    try { window.localStorage.setItem(sk, JSON.stringify(seen)); } catch (e) {}
    var v = num() + 1; put(v); send(v);
  }
})();
</script>
