<script>const D=[{"t": "一、书名释义", "h": "「金匮」是什么意思", "c": "**「匮」是柜子，「金匮」即金属铸就的书柜，用以珍藏贵重之物。**古人以「金匮玉函」形容极其珍贵的典籍，取「藏之宝阁」之意。\n\n用「金匮」作书名，是一种自我定位：**这本书被它的整理者视为值得珍藏的宝物。**书名的谦虚与郑重，往往就藏在这类细节里。", "o": "古代书名文化 · 文化史话整理", "g": "典故"}, {"t": "一、书名释义", "h": "「要略」二字，说的是一种编法", "c": "**「要略」意为「提取精要的编述」。**古人著书，有「全帙」与「要略」之分：前者求全，后者求的要领。\n\n以「要略」名书，等于告诉读者：这不是一部面面俱到的巨著，而是一份**经过取舍、直指要领的精编**。书名即体例，是传统目录学的常见做法。", "o": "古籍书名释义 · 文化史话整理", "g": "典籍"}, {"t": "二、发现与流传", "h": "一部书在馆阁里被重新找到", "c": "**相传《金匮要略》曾在宋代被学者于皇家藏书处发现，此前长期散落。**发现者将其整理出来，才使这部书重新进入学者的视野。\n\n古籍的命运常常如此：**不是被写出，而是被「重新发现」才得以存续。**藏书楼与整理者，是经典延续的另一半功臣。", "o": "中医文献学 · 文化史话整理", "g": "典籍"}, {"t": "二、发现与流传", "h": "从《伤寒杂病论》到《金匮要略》", "c": "**《金匮要略》与《伤寒论》本出一源，是那部散佚巨著的不同部分。**后人把偏于杂病的内容辑出，题以「金匮要略」之名，遂成独立的一部书。\n\n一本书的「出身」，常常很复杂。**分家之后的兄弟书，各自承载着原作的一半记忆。**", "o": "中医文献学 · 文化史话整理", "g": "典籍"}, {"t": "二、发现与流传", "h": "校勘：给古书「看病」", "c": "**古籍在传抄中难免出错，校勘就是比对不同版本、订正讹误的工作。**校勘者像侦探，从一个异体字、一处脱文里，推断原文的面貌。\n\n有意思的是，「校勘」常被称为给古书「治病」——**整理典籍与照料生命，在传统语言里竟共用一套比喻。**", "o": "古籍校勘学 · 文化史话整理", "g": "典籍"}, {"t": "三、藏书与整理", "h": "宋代的校正医书局", "c": "**宋代朝廷曾设专门机构校勘、刊行医学典籍。**在印刷术兴起的背景下，官方力量介入书籍整理，使许多古籍获得了稳定而广泛的传播。\n\n印刷术与官方校勘的结合，是知识传播史上的一次飞跃。**技术加制度，让经典第一次真正「普及」。**", "o": "宋代出版史 · 文化史话整理", "g": "典籍"}, {"t": "三、藏书与整理", "h": "藏书楼：经典的避风港", "c": "**在印刷与图书馆出现之前，私家藏书楼是典籍存续的重要依托。**历代战乱中，正是无数藏书家递相守护，才使珍贵文本逃过散佚的命运。\n\n「藏书」从来不只是爱好，而是一种**文化守护**。一部书能传到今天，背后往往是一串默默无闻的藏书人。", "o": "中国藏书史 · 文化史话整理", "g": "风物"}, {"t": "三、藏书与整理", "h": "清代考据学家的整理", "c": "**清代学者重考据，讲究「无一字无来历」**，对包括医籍在内的古籍做了大量校订、辑佚与注释工作。\n\n考据学的态度是：**不轻易相信，也不轻易否定，一切以证据说话。**这种严谨，为古籍的可读性打下坚实基础。", "o": "清代学术史 · 文化史话整理", "g": "人物"}, {"t": "四、文化侧面", "h": "「金匮玉函」的意象", "c": "**「金匮」「玉函」连用，是古典文学里常见的意象，泛指珍藏的秘籍。**小说戏曲里，常说某人得「金匮玉函之书」，便习得绝学。\n\n这个意象说明：在文化想象中，**知识本身就被视为珍宝**——藏在金柜玉匣里，等待有缘人开启。", "o": "古典文学意象 · 文化史话整理", "g": "典故"}, {"t": "四、文化侧面", "h": "医籍与士人的书房", "c": "**古代士人的书房里，医书常与经史并列。**「不为良相，便为良医」的说法，把行医与治国相提并论，提升了医术在士人心目中的地位。\n\n读一点医书，在传统读书人那里并不是怪事，而是**「格物致知」的一部分**——理解身体，与理解天下，同属学问。", "o": "士人文化史 · 文化史话整理", "g": "人物"}, {"t": "四、文化侧面", "h": "书名里的时代风气", "c": "**「金匮」「玉函」「要略」「秘录」这类书名用词，折射出特定的时代风气。**它们共同营造出一种郑重、珍秘的气质。\n\n给书取名，也是一门学问。**从书名，往往能读出一个时代的学术心态与审美趣味。**", "o": "古籍书名文化 · 文化史话整理", "g": "典故"}, {"t": "四、文化侧面", "h": "一部书的多次「重生」", "c": "**从散佚到发现、从抄本到刊本、从注释到今译，一部古籍会经历多次「重生」。**每一次重生，都是当代人重新与它相遇。\n\n经典之所以为经典，不在于它从未中断，而在于**它总能被一次次重新读懂**。这，或许才是「金匮」真正的寓意。", "o": "典籍流传史 · 文化史话整理", "g": "典籍"}];</script>

(function () {
  'use strict';
  var KEY = 'qihuang.rank.v1', FILE = 'jingui.html';
  function num() { try { return parseInt(window.localStorage.getItem(KEY), 10) || 0; } catch (e) { return 0; } }
  function put(v) { try { window.localStorage.setItem(KEY, String(v)); } catch (e) {} }
  function sdk() {
    var list = [window.toy, window.Toy, window.toy && window.toy.toy, window.Toy && window.Toy.toy];
    for (var i = 0; i < list.length; i++) if (list[i] && typeof list[i].submitScore === 'function') return list[i];
    return null;
  }
  function send(score) {
    var t = sdk(); if (!t) return;
    try { t.submitScore({ score: score, board: 1 }); } catch (e) {}
  }
  var sk = KEY + '.seen', seen = [];
  try { seen = JSON.parse(window.localStorage.getItem(sk) || '[]') || []; } catch (e) { seen = []; }
  if (!Array.isArray(seen)) seen = [];
  if (seen.indexOf(FILE) === -1) {
    seen.push(FILE);
    try { window.localStorage.setItem(sk, JSON.stringify(seen)); } catch (e) {}
    var v = num() + 1; put(v); send(v);
  }
})();
</script>
