 <p class="intro">二十四节气把太阳的运行、季节的更替与农事起居对应起来，是写在历法里的自然观察，也是中国人认知世界的共同语言。</p>

<script>const D=[{"t": "一、春", "h": "立春：东风解冻", "c": "**立春为二十四节气之首，标志春季开始。**古人有迎春、鞭春牛的习俗，劝勉农事。一个节气的到来，意味着新一轮劳作的开始。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "一、春", "h": "雨水：獭祭鱼", "c": "**雨水时节，降水渐多，古人以「獭祭鱼」等物候描述时令。**把动物的行为当作季节的信号，是古人观察自然的细致之处。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "一、春", "h": "惊蛰：春雷始鸣", "c": "**惊蛰之名，取春雷惊醒蛰伏昆虫之意。**一声春雷，被想象成唤醒万物的号角。节气的名字，本身就是一首小诗。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "一、春", "h": "春分：昼夜均而寒暑平", "c": "**春分这天昼夜几乎等长，古人由此讲「平分春色」。**有竖蛋等民间游戏。一个天文事实，被过成了有趣的生活仪式。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "一、春", "h": "清明：气清景明", "c": "**清明既是节气，也是节日，兼具扫墓与踏青两重内容。**慎终追远与亲近自然并存，体现出中国人对待生死与春天的双重态度。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "一、春", "h": "谷雨：雨生百谷", "c": "**谷雨意为降雨有利谷物生长，是春季最后一个节气。**有采茶、赏牡丹的习俗。节气的名字，直接写着农人的期盼。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "二、夏", "h": "立夏：万物并秀", "c": "**立夏标志夏季开始，古人有称人、吃蛋等习俗。**秤人祈福，是把对健康的祝愿，做成一个可见的仪式。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "二、夏", "h": "小满：麦粒渐满", "c": "**小满指麦粒渐饱但未熟，「满」而不溢，恰到好处。**中国人以「小满」为节气，暗含「满招损、谦受益」的处世智慧。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "二、夏", "h": "芒种：有芒者收，有芒者种", "c": "**芒种是农事最忙的时节，既收又种。**「芒种」二字，写尽了中国农耕文明的节奏——收获与播种，几乎同时发生。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "二、夏", "h": "夏至：日北至，昼最长", "c": "**夏至这天白昼最长，古人有祭地、吃面的习俗。**「冬至饺子夏至面」，一句民谚，把节气落到了餐桌。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "二、夏", "h": "小暑与大暑：暑气渐盛", "c": "**小暑、大暑依次标记暑热的递进。**古人以「温风至」「腐草为萤」等物候描述，把炎热写得颇有诗意。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "三、秋", "h": "立秋：凉风至", "c": "**立秋标志秋季开始，民间有「贴秋膘」的食俗。**季节转换，总是先被身体和餐桌感知。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "三、秋", "h": "处暑：暑气至此而止", "c": "**「处」有止息之意，处暑即暑热结束。**一个字的训诂，就把节气的含义说明白了。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "三、秋", "h": "白露：露凝而白", "c": "**白露时节昼夜温差大，露水凝结，「蒹葭苍苍，白露为霜」咏的正是此时。**节气与诗，互相成就。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "三、秋", "h": "秋分：昼夜再均", "c": "**秋分昼夜再度等长，也是收获的季节。**后被定为「中国农民丰收节」。一个古老节气，有了新的时代意义。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "三、秋", "h": "寒露与霜降：秋意渐深", "c": "**寒露、霜降依次标记秋意的加深，菊花、红叶是这个时节的主角。**赏菊、登高，把深秋过成了文化活动。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "四、冬", "h": "立冬：万物收藏", "c": "**立冬标志冬季开始，古人讲「藏」，万物进入休养。**民间有补冬的食俗。春生夏长、秋收冬藏，是一个完整的循环。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "四、冬", "h": "小雪与大雪：雪的层次", "c": "**小雪、大雪以雪量命名，标记冬季的深入。**「晚来天欲雪，能饮一杯无」，雪总能引发中国人的诗意。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "四、冬", "h": "冬至：日南至，夜最长", "c": "**冬至白昼最短，古人视为重要节点，有「冬至大如年」之说。**吃饺子、汤圆等习俗，寄托着团圆与期盼。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "四、冬", "h": "小寒与大寒：岁之将尽", "c": "**小寒、大寒是全年最冷的时段，也临近岁末。**寒冷到了极致，春天便不远了——节气里藏着中国人特有的希望。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "四、冬", "h": "数九与九九消寒图", "c": "**从冬至起「数九」，画九九消寒图记录寒暑流转。**把漫长的冬天，变成一件有仪式感的事，是古人对抗严寒的温柔方式。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "五、节气文化", "h": "节气与农事", "c": "**二十四节气最初是安排农事的时间坐标。**何时播种、何时收获，都写在节气的序列里。它是农耕文明的时间智慧。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "五、节气文化", "h": "节气与养生文化", "c": "**传统讲究顺应四时起居，春生夏长、秋收冬藏。**这种「顺时」的观念，是一种把人放回自然的生活哲学。", "o": "文化史话整理 · 节气与民俗", "g": "典籍"}, {"t": "五、节气文化", "h": "七十二候：更细的自然历", "c": "**古人把每个节气分为三候，共七十二候，以动植物现象标记时令。**「东风解冻」「蛰虫始振」，是一份极其细腻的自然观察日志。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}, {"t": "五、节气文化", "h": "节气入诗", "c": "**无数诗词以节气为题，写下四时之感。**节气不只是时间标记，更是中国人抒情的文化容器。", "o": "文化史话整理 · 节气与民俗", "g": "典故"}, {"t": "五、节气文化", "h": "节气成为世界遗产", "c": "**二十四节气被列入人类非物质文化遗产，成为中国文化的重要标识。**一套古老的时间知识，至今仍在指导生活。", "o": "文化史话整理 · 节气与民俗", "g": "典籍"}, {"t": "五、节气文化", "h": "节气与南北差异", "c": "**同一节气，南北气候物候差异很大。**节气源于黄河流域的观察，传播到各地后被重新理解，体现出知识的本土化。", "o": "文化史话整理 · 节气与民俗", "g": "风物"}];</script>
