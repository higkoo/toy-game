<script>const D=[{"t": "一、观天与授时", "h": "「天纪」二字怎么讲", "c": "**「天纪」可理解为「关于天的纪象与法度」。**古人观察天象，辨认规律，据此制定历法、安排农时——这被称为「观天授时」。\n\n「敬天」不等于迷信，它首先意味着**把人类活动放进天时秩序里去安排**。这是农耕文明最朴素也最深刻的一条经验。", "o": "中国古代天文学史 · 文化史话整理", "g": "典籍"}, {"t": "一、观天与授时", "h": "圭表测影：用影子量出一年", "c": "**古人立一根直杆（表）测日影，用影子的长短变化来确定冬至、夏至和一年的长度。**这种工具叫「圭表」，是中国最古老的天文仪器之一。\n\n只用一根杆子和一片影子，就能读出时间的节律。**这种「以简测繁」的智慧，令人惊叹。**", "o": "中国古代天文学史 · 文化史话整理", "g": "风物"}, {"t": "一、观天与授时", "h": "二十四节气与农耕文明", "c": "**节气把太阳的运行、季节的更替与农事活动精确地对应起来。**何时播种、何时收获，都写在节气的序列里。\n\n它是一套**「天时—农事—生活」三位一体的知识体系**，至今仍是中国人理解季节、安排生活的共同语言，并被列入人类非物质文化遗产。", "o": "中国农业文化史 · 文化史话整理", "g": "风物"}, {"t": "二、易象与数", "h": "伏羲画卦：《易经》的起点", "c": "**传说伏羲观天地万物，画八卦，用「—」与「--」两种符号概括世界的基本状态。**八卦再两两相重，成六十四卦。\n\n《易经》的独特之处在于：**用极简的符号系统，去模拟复杂世界的种种情境。**这是人类思想史上最早的形式化尝试之一。", "o": "《周易》文化研究 · 文化史话整理", "g": "典籍"}, {"t": "二、易象与数", "h": "河图洛书：两个神秘图案", "c": "**「河图」「洛书」是两组古老的点数图案，传说分别出自黄河与洛水。**它们以数字排列，蕴含对称与平衡的观念。\n\n从数学、哲学到传统术数，河图洛书被反复解释。**一个图案能被解读几千年，本身就成了文化史的一部分。**", "o": "易学文化研究 · 文化史话整理", "g": "典故"}, {"t": "二、易象与数", "h": "象数：中国传统的一种思维方式", "c": "**「象」是符号与形象，「数」是关系与度量。**象数之学，就是透过符号与其关系去把握世界——它重类比、重关联、重整体的对应。\n\n这种思维方式与西方的形式逻辑不同，各有长短。**理解象数，是理解中国传统学术的一把钥匙。**", "o": "中国哲学史 · 文化史话整理", "g": "典籍"}, {"t": "二、易象与数", "h": "《易经》里的变化哲学", "c": "**《易经》的核心，是一个「变」字。**它认为万物都处在变化之中，而变化的背后有可以理解的规律；所谓「穷则变，变则通」。\n\n这部书教给人的，与其说是占问答案，不如说是一种**在变动不居中保持清醒、顺势而为的智慧**。", "o": "《周易》文化研究 · 文化史话整理", "g": "典籍"}, {"t": "三、星空与历法", "h": "二十八宿：给星空划分区域", "c": "**古人把黄道附近的星空划分为二十八个区域，称「二十八宿」。**它们像天空中的坐标，被用来观测日月星辰的运行。\n\n这是中国天文学的独特创造。**给满天繁星建立秩序，是人类认识宇宙的第一步。**", "o": "中国古代天文学史 · 文化史话整理", "g": "风物"}, {"t": "三、星空与历法", "h": "三垣：天上也有紫禁城", "c": "**除二十八宿外，古人还把北天极附近分为「紫微、太微、天市」三垣。**星官的命名，大量借用地上的宫廷、官署与市井——天帝、太子、文昌、武曲……\n\n**天上的星图，其实是人间秩序的一面镜子。**读星官名，如同在读一份天上的「官职表」。", "o": "中国古代星官体系 · 文化史话整理", "g": "风物"}, {"t": "三、星空与历法", "h": "干支：一套用了几千年的编号", "c": "**十天干与十二地支相配，形成六十甲子，用来纪年、纪月、纪日、纪时。**这套编号系统沿用数千年，至今仍在农历与民俗中使用。\n\n干支的厉害之处在于它的**「循环性」与「兼容性」**：六十个组合循环往复，能把时间纳入一个整齐的框架。", "o": "中国历法文化 · 文化史话整理", "g": "风物"}, {"t": "四、地理与山川", "h": "《禹贡》九州：最早的地理志", "c": "**《尚书·禹贡》把天下分为九州，叙述各州的山川、土壤与物产。**这是中国最早的地理文献之一，奠定了「九州」作为天下代称的基础。\n\n「九州」不只是地理划分，更是一种**「天下一体」的文化想象**，深刻影响了中国人的空间观念。", "o": "《尚书·禹贡》 · 中国地理学史", "g": "典籍"}, {"t": "四、地理与山川", "h": "山川形势与传统环境观", "c": "**传统社会重视居所与山川的关系，形成了关于地形、水流、朝向的一整套环境观念。**抛开神秘化的部分，其中蕴含着对采光、通风、水源等实际因素的长期观察。\n\n作为一种文化现象，它反映了古人**「择居而安」的愿望**——希望在自然中找到与人和谐相处的位置。", "o": "传统环境观念研究 · 文化史话整理", "g": "风物"}, {"t": "四、地理与山川", "h": "天、地、人：三才的思想", "c": "**传统思想讲「三才」——天、地、人，认为三者各有所长，又彼此贯通。**人既受天地影响，也能「参天地之化育」。\n\n「三才」说体现了中国思想最根本的一个信念：**世界是一个整体，人不是旁观者，而是其中的参与者。**这种整体观，至今仍是我们理解传统的一把钥匙。", "o": "中国哲学史 · 文化史话整理", "g": "典籍"}];</script>
