 <p class="intro">中国人的饮食，从来不只是果腹。它连着节令、礼仪、养生观念与地方风土，是一部写在餐桌上的文化史。</p>

<script>const D=[{"t": "一、茶", "h": "茶：从药到饮", "c": "**茶最初被作为药物认识，后来逐渐成了日常饮品。**一片叶子的身份转变，是物质文化史的有趣课题。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "一、茶", "h": "陆羽与《茶经》", "c": "**唐代陆羽著《茶经》，系统论述茶的采制、器具与品饮。**他把饮茶提升为一门学问与艺术。", "o": "文化史话整理 · 饮食风物", "g": "典籍"}, {"t": "一、茶", "h": "点茶与斗茶", "c": "**宋代流行点茶、斗茶，以茶汤泡沫与色泽较量。**一种饮法，演变成风雅的社交游戏。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "一、茶", "h": "茶馆与市井", "c": "**茶馆是传统城市的重要公共空间，人们在此饮茶、谈事、听书。**一杯茶，撑起了市井生活的社交场。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "二、酒", "h": "酒为百药之长", "c": "**「酒为百药之长」是传统里常见的说法，反映出古人对酒的认识。**酒在礼仪、医药、文学中都有位置。", "o": "文化史话整理 · 饮食风物", "g": "典故"}, {"t": "二、酒", "h": "酒与礼仪", "c": "**传统饮酒有严格的礼数，乡饮酒礼等是重要的社会仪式。**酒是润滑剂，也是秩序的载体。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "二、酒", "h": "酒与诗", "c": "**「李白斗酒诗百篇」，酒与诗在中国文化里关系密切。**酒激发灵感，成了文学创作的文化想象。", "o": "文化史话整理 · 饮食风物", "g": "典故"}, {"t": "二、酒", "h": "酒令与雅趣", "c": "**古人饮酒行令，诗词、投壶、猜谜皆可入令。**酒令把饮酒变成一场文化游戏。", "o": "文化史话整理 · 饮食风物", "g": "典故"}, {"t": "三、食俗", "h": "八大菜系与地理", "c": "**川、鲁、粤、苏等菜系的形成，与各地物产、气候、习俗密切相关。**一方水土养一方人，也养一方味道。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "三、食俗", "h": "节令食品", "c": "**年糕、月饼、粽子、汤圆，节日各有其标志食物。**食物是节日最直观的文化符号。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "三、食俗", "h": "药食同源的观念", "c": "**传统讲究「药食同源」，许多日常食物也被赋予调养的意义。**厨房与药房的界限，在传统里本就模糊。", "o": "文化史话整理 · 饮食风物", "g": "典籍"}, {"t": "三、食俗", "h": "饮食与养生", "c": "**古人讲「食饮有节」，强调饮食的节律与适度。**这是一种关于分寸的生活智慧。", "o": "文化史话整理 · 饮食风物", "g": "典籍"}, {"t": "三、食俗", "h": "食补文化", "c": "**冬季进补、四时调食，是流传已久的饮食观念。**它体现着把饮食放进时间秩序里的思路。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "四、饮食与礼", "h": "宴饮的座次", "c": "**传统宴席讲究座次尊卑，是有形的礼仪秩序。**一张餐桌，浓缩着社会的伦理结构。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "四、饮食与礼", "h": "祭祀与食物", "c": "**祭祀用食物寄托着对先人的追思，形成独特的祭食文化。**食物是沟通人神、生死的媒介。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "四、饮食与礼", "h": "食不厌精，脍不厌细", "c": "**孔子论食，讲求精细与合礼，反映出饮食的文明化程度。**饮食的讲究，也是文化的讲究。", "o": "文化史话整理 · 饮食风物", "g": "典故"}, {"t": "四、饮食与礼", "h": "餐桌上的团圆", "c": "**年夜饭的团圆意义，远超食物本身。**一桌饭，是一个家庭一年一度的聚合仪式。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "五、饮食的传播", "h": "稻作与麦作", "c": "**南稻北麦的格局，塑造了中国饮食的基本面貌。**主粮的差异，深刻影响了各地的生活方式。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "五、饮食的传播", "h": "外来食材的融入", "c": "**葡萄、胡瓜、番薯、辣椒等外来食材，逐渐融入中国饮食。**饮食的开放，是文化吸收力的体现。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "五、饮食的传播", "h": "茶酒的外传", "c": "**茶与酒的制作技艺传到周边国家，形成各自的饮文化。**一种饮品，能长成跨国的文化。", "o": "文化史话整理 · 饮食风物", "g": "风物"}, {"t": "五、饮食的传播", "h": "饮食典籍", "c": "**《齐民要术》《东京梦华录》等书保留了大量饮食资料。**古籍里的菜单，是后人了解古人生活的窗口。", "o": "文化史话整理 · 饮食风物", "g": "典籍"}];</script>
