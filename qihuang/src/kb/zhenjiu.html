<script>const D=[{"t": "一、源起与传说", "h": "伏羲制九针：一个关于发明的传说", "c": "**古人习惯把重要的发明追溯到人文初祖。**关于针具，有「伏羲制九针」的说法——传说中伏羲氏观察天地与人身，制作了九种不同形制的针，各有各的用途。\n\n这类传说未必是史实，却透露出一个信息：**在古人的观念里，医术是与天地、阴阳一并被理解的**，不是孤立的技术。把发明权交给神话人物，是传统文化里给一门学问「立根」的常见方式。", "o": "文化史话整理 · 参《帝王世纪》辑佚", "g": "典故"}, {"t": "一、源起与传说", "h": "「针砭」二字，怎么成了批评的代名词", "c": "**砭**，是古代一种石制的医疗工具；**针**，是后来金属制成的细针。二者合称「针砭」，本指古老的医疗手段。\n\n后来读书人借它来比喻规劝与批评——「**针砭时弊**」就是说像用针石治病一样，指出社会的问题。一个医学词，就这样走进了日常语言，成了汉语里极有画面感的一个成语。", "o": "汉语成语源流 · 文化史话整理", "g": "典故"}, {"t": "二、器具与考古", "h": "砭石：针具之前的石头", "c": "**在金属针出现之前，古人用石头。**考古工作者在多处新石器时代遗址中，发现过一端尖锐、经过打磨的石器，被推测为早期的「砭石」。\n\n这些朴素的石器说明：对身体的关注，很早就和身边的材料结合在一起。从石头到金属，针具材质的变化，也是一部缩微的工具史。", "o": "考古发现综述 · 文化史话整理", "g": "风物"}, {"t": "二、器具与考古", "h": "马王堆帛书上的早期经脉", "c": "**1973 年，长沙马王堆汉墓出土了一批帛书**，其中抄写着有关经脉的内容，成书年代早于后世流传的经典。\n\n这些写在丝帛上的文字，让我们得以看见：关于身体通道的认识，曾经有过不同的描述体系，并非一开始就固定成后来的样子。**一条经脉图的演变，就是一段思想逐渐定型的历史。**", "o": "马王堆汉墓帛书整理报告 · 文化史话整理", "g": "典籍"}, {"t": "二、器具与考古", "h": "汉代墓葬里的金针与银针", "c": "**考古发掘中，曾出土过汉代的金属针具**，有金质、银质之分，制作已相当精细。\n\n这些实物把文献里的记载落到了可触摸的器物上：至迟在汉代，金属针具的制作工艺已经成熟。器物的精良，往往映照出一门学问当时的受重视程度。", "o": "汉代考古文物综述 · 文化史话整理", "g": "风物"}, {"t": "三、经络作为一种文化模型", "h": "经络：古人画给身体的一张「地图」", "c": "**经络学说的形成，是古人理解身体的一种方式。**他们把体内被感知到的路径与联系，归纳成一套有名称、有走向、有次序的系统，就像给一片土地绘制交通图。\n\n从早期帛书里较少的几条「脉」，到后世体系化的「十二经」，是一个由简到繁、由散到整的过程。它体现的是传统思维里**「以简驭繁、以象补形」**的特点。", "o": "中国医学思想史 · 文化史话整理", "g": "典籍"}, {"t": "三、经络作为一种文化模型", "h": "子午流注：把时间画进身体", "c": "**「子午」是一天里的两个时辰，「流注」是流动灌注。**古人把十二时辰与身体的十二条通道对应起来，形成一套把「时间」和「身体」联系起来的说法。\n\n今天读它，未必当作操作规程，更可以看作一种**世界观**：人和天地共用一套节律，一天的推移与身体的变化彼此呼应。这是「天人相应」思想最具体的一种表达。", "o": "传统时间观念研究 · 文化史话整理", "g": "典籍"}, {"t": "四、人物与故事", "h": "皇甫谧著《针灸甲乙经》", "c": "**皇甫谧是魏晋时期的学者，自号玄晏先生。**他原本潜心文史，中年之后转向医书整理，把散乱的经脉与腧穴内容编次成书，即后世所称的《针灸甲乙经》。\n\n他的故事有意思的地方在于：一位以文章名世的读书人，因为对一门学问的敬意而投入整理工作。**典籍的传承，常常靠这样「半路入行」的读书人。**", "o": "《晋书·皇甫谧传》 · 文化史话整理", "g": "人物"}, {"t": "四、人物与故事", "h": "宋代的针灸铜人", "c": "**北宋曾铸造过针灸铜人**，作为官方的医学教学模型。相传铜人体表标有经络与穴位，内部注水，用于考核——遮蔽穴位后让应试者指认，中则水出。\n\n铜人把抽象的文字知识变成了可观看、可触摸的立体教具，是中国古代医学教育的一件创举。几尊铜人的流传与散失，本身也是一段文物流转的故事。", "o": "宋代医学教育史 · 文化史话整理", "g": "风物"}, {"t": "四、人物与故事", "h": "从石到金：针具材质小史", "c": "**针具用材的演进，大致走过石、骨、青铜、铁、金银这条线。**每一种新材料出现，都会带来制作精度与形态的变化。\n\n材质小史提醒我们：医学器具从来不是凭空出现的，它总是和当时的采矿、冶炼、工艺水平绑在一起。**一件小小的针，连着整部技术史。**", "o": "中国医疗器械史 · 文化史话整理", "g": "风物"}, {"t": "四、人物与故事", "h": "针灸东传：一门学问的旅行", "c": "**针灸很早就走出国门，传入朝鲜半岛与日本，后来又辗转传到欧洲。**在异乡，它常被重新解释，与当地的思想传统结合，长出新的面貌。\n\n一门学问的生命力，往往就在这种「被重新理解」的过程里。针灸的旅行史，也是文化交流史的一个侧面。", "o": "中外文化交流史 · 文化史话整理", "g": "典籍"}];</script>
