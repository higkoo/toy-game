 <p class="intro">一味药的名字，往往藏着一段故事、一种意象、一份乡愁。这里只谈药名的来历与随之而来的文化趣味，不涉及任何医疗用途。</p>

<script>const D=[{"t": "一、药名里的情感", "h": "当归：应当归来", "c": "**「当归」之名，常被解作「应当归来」，寄托着思念与盼归之情。**古人以药名入诗、入信，借它表达情怀。一味药因名字而有了温度。", "o": "文化史话整理 · 药名趣谈", "g": "典故"}, {"t": "一、药名里的情感", "h": "甘草：众药之「国老」", "c": "**「甘草」因其味甘得名，古人又称它「国老」，取长者调和之美。**名字直白可爱，又带着一份人格化的想象。", "o": "文化史话整理 · 药名趣谈", "g": "典故"}, {"t": "一、药名里的情感", "h": "相思子与红豆", "c": "**红豆又名相思子，因色泽与传说，成了相思的象征。**王维「红豆生南国」一句，让这颗小小的种子进入了千年文学。", "o": "文化史话整理 · 药名趣谈", "g": "典故"}, {"t": "一、药名里的情感", "h": "合欢：夜合晨舒", "c": "**合欢之名，取自其叶昼开夜合的特性，古人借喻夫妻和睦。**观察自然现象，再赋予人文寓意，是传统的取名方式。", "o": "文化史话整理 · 药名趣谈", "g": "典故"}, {"t": "二、药名里的形状", "h": "人参：形如人", "c": "**「人参」之名，相传因其根形似人。**「参」字又与星宿「参」相关，名字里带着天地的意象。形与名之间，总有有趣的联想。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "二、药名里的形状", "h": "茯苓：松下的精灵", "c": "**茯苓多生于松根附近，古人视为松之精气所结，名字带着山林的清气。**它常出现在诗词与清谈里，是文人气十足的一味药。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "二、药名里的形状", "h": "半夏：生于夏之半", "c": "**「半夏」相传因农历五月、夏季过半时采得而得名。**以时令命名，是药物取名的常见方式，名字里就藏着一套物候历。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "二、药名里的形状", "h": "陈皮：陈久者为佳", "c": "**「陈皮」即陈放的橘皮，「陈」字点出了与时间的关系。**传统里讲究「陈久」，让「时间」成为品质观念的一部分。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "二、药名里的形状", "h": "何首乌：以人名药", "c": "**「何首乌」之名来自民间传说，与一位何姓人物相关。**以人名药，是世界各国药物命名的通例，名字背后往往是一个故事。", "o": "文化史话整理 · 药名趣谈", "g": "典故"}, {"t": "三、药名里的地理", "h": "道地药材：一方水土", "c": "**传统讲究「道地」，认为物产因产地而有高下。**这其实是一种朴素的地理品质意识，把土壤、气候与物产联系起来，与今日「原产地」观念遥相呼应。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "三、药名里的地理", "h": "四大怀药与怀庆府", "c": "**古怀庆府一带所产的几种药材，历史上并称「四大怀药」。**以地名标举物产，是中国传统商业文化的重要内容。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "三、药名里的地理", "h": "川药、广药与地域标签", "c": "**许多药材以产地冠名，如川、广、云、贵等。**一个地名，就是一张品质名片，构成了传统药材贸易的地理图景。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "三、药名里的地理", "h": "药名与丝绸之路", "c": "**不少药材之名带有外来音译的痕迹，见证着古代中西交流。**一味药的名字，可能就是一条商贸路线的化石。", "o": "文化史话整理 · 药名趣谈", "g": "典故"}, {"t": "四、药名与文学", "h": "药名入诗", "c": "**诗人常把药名嵌入诗句，谐音双关，别有情趣。**药名因音义之美，成了文学的语言素材。", "o": "文化史话整理 · 药名趣谈", "g": "典故"}, {"t": "四、药名与文学", "h": "药名谜与药名信", "c": "**古人有以药名作谜、作书的雅趣，借药名传达言外之意。**把药名当作一种密码，是文人游戏的高明之处。", "o": "文化史话整理 · 药名趣谈", "g": "典故"}, {"t": "四、药名与文学", "h": "《本草》里的博物诗", "c": "**本草书虽是药学著作，却常引诗句、记异闻，兼具文学性。**读本草，也能读到古代的博物情怀与文字趣味。", "o": "文化史话整理 · 药名趣谈", "g": "典籍"}, {"t": "四、药名与文学", "h": "药名与戏曲", "c": "**传统戏曲、曲艺中常有以药名串场的段子，机趣横生。**药名进入俗文学，说明它早已是大众熟知的语言素材。", "o": "文化史话整理 · 药名趣谈", "g": "典故"}, {"t": "五、草木金石杂识", "h": "菊：花中隐士", "c": "**菊花因陶渊明爱菊，成了隐逸与高洁的象征。**它可入药、可入食、可入诗，是传统文化里少有的「多功能」意象。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "五、草木金石杂识", "h": "莲：出淤泥而不染", "c": "**莲藕、莲子皆可食，莲花更是君子人格的象征。**一种植物兼具实用与象征，正是传统文化里博物与伦理合一的特点。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "五、草木金石杂识", "h": "松柏：岁寒知松柏", "c": "**松柏经冬不凋，成为坚贞不屈的象征。**《论语》「岁寒然后知松柏之后凋」，让一种树成了人格的标尺。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "五、草木金石杂识", "h": "兰：空谷幽兰", "c": "**兰花生于幽谷，不以无人而不芳，象征高洁自守。**屈原以兰自喻，从此兰成了君子之德的文化符号。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "五、草木金石杂识", "h": "竹：未出土时先有节", "c": "**竹中空有节、四季常青，象征谦逊与气节。**文人爱竹，画竹、咏竹，竹成了中国美术的重要题材。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "五、草木金石杂识", "h": "梅：凌寒独自开", "c": "**梅花凌寒而开，象征坚韧与报春。**「岁寒三友」松竹梅，把三种植物并置为理想人格的象征体系。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "五、草木金石杂识", "h": "金石入药：矿物的世界", "c": "**古代本草也收载矿物类药物，反映着古人对金石的认识。**从矿石到药材，是把地质世界纳入知识体系的一种方式。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "五、草木金石杂识", "h": "香药文化的兴起", "c": "**许多香料同时也是药材，香与药在传统里界限模糊。**焚香、佩香、药用，构成了古人物质生活的多重面向。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "五、草木金石杂识", "h": "茶：从饮品到文化", "c": "**茶最初被作为药物认识，后逐渐成为日常饮品与文化符号。**一片叶子如何从药到茶，是物质文化史的有趣课题。", "o": "文化史话整理 · 药名趣谈", "g": "风物"}, {"t": "五、草木金石杂识", "h": "酒与药：古老的搭档", "c": "**酒在传统里常与药并行，既可入药，也有自己的文化。**「酒为百药之长」一类说法，反映出古人对二者关系的理解。", "o": "文化史话整理 · 药名趣谈", "g": "典故"}];</script>

    var list = [window.toy, window.Toy, window.toy && window.toy.toy, window.Toy && window.Toy.toy];
