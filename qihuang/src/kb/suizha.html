<script>const D=[{"t": "一、读书之法", "h": "循序渐进", "c": "**古人读书讲究次序，由浅入深、由博返约。**「博学而笃志，切问而近思」，是治学的基本功夫。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "一、读书之法", "h": "诵读与涵泳", "c": "**传统重视诵读，在反复吟味中体会文义。**「书读百遍，其义自见」，讲的是沉浸式的理解。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "一、读书之法", "h": "不动笔墨不读书", "c": "**古人强调批注、札记，把思考留在书页上。**动笔，是让阅读真正发生的方式。", "o": "文化史话整理 · 读书随札", "g": "典故"}, {"t": "一、读书之法", "h": "知人论世", "c": "**读其书，需知其人、论其世。**把作品放回作者与时代，是理解的前提。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "二、校勘之法", "h": "校勘：为古书「治病」", "c": "**校勘比对版本、订正讹误，让文本更接近原貌。**有趣的是，整理典籍也常被称为给古书「治病」。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "二、校勘之法", "h": "对校与理校", "c": "**对校依据不同版本，理校凭学理推断。**两种方法并用，才不至于盲从或臆断。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "二、校勘之法", "h": "避讳与版本", "c": "**古人避皇帝名讳，改字缺笔，成为判断版本年代的线索。**小小的避讳，藏着时代的印记。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "二、校勘之法", "h": "讹误种种", "c": "**传抄刊刻中会产生脱文、衍文、错字、倒文。**辨误，是校勘家的日常功课。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "三、注释与阐释", "h": "注、疏、笺、释", "c": "**古人注释经典有多种体例：注、疏、笺、传、释，各有分工。**注释之学，是一座巨大的阐释传统。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "三、注释与阐释", "h": "注疏的层次", "c": "**注解释词义，疏再解释注，层层叠加。**经典的意义，就在这层层解释中不断生长。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "三、注释与阐释", "h": "六经注我与我注六经", "c": "**「六经注我」强调以己意贯通经典，「我注六经」强调忠实原文。**两种态度，代表阐释的不同取向。", "o": "文化史话整理 · 读书随札", "g": "典故"}, {"t": "三、注释与阐释", "h": "注家与时代", "c": "**每个时代的注释，都带着当代的问题意识。**读注，也是在读注释者所处的时代。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "四、考据与目录", "h": "考据：无一字无来历", "c": "**清代考据学讲究证据，凡立说必有依据。**这种严谨，是学术理性精神的体现。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "四、考据与目录", "h": "辑佚：打捞遗忘", "c": "**从类书、注文中搜集散佚文献的片段，尽力还原。**这是学者最具耐心的工作之一。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "四、考据与目录", "h": "目录：治学的门径", "c": "**目录不仅列书名，还要辨章学术、考镜源流。**好的目录，本身就是一部学术史。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "四、考据与目录", "h": "版本与藏书印", "c": "**古籍上的藏书印，记录着一部书的流转经历。**一方印记，是书籍生命史的路标。", "o": "文化史话整理 · 读书随札", "g": "风物"}, {"t": "五、札记杂谈", "h": "笔记体著作", "c": "**古人把读书所得、见闻杂记写成笔记，体例自由。**笔记里常有正史不载的鲜活材料。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "五、札记杂谈", "h": "读书札记的价值", "c": "**札记是思考的碎片，往往闪烁着真知。**许多重要见解，最初只是书页边的一点记录。", "o": "文化史话整理 · 读书随札", "g": "典故"}, {"t": "五、札记杂谈", "h": "博与约", "c": "**治学先求博，再求约；由广博而专精。**「由博返约」，是传统的治学理想。", "o": "文化史话整理 · 读书随札", "g": "典籍"}, {"t": "五、札记杂谈", "h": "学与思", "c": "**「学而不思则罔，思而不学则殆」，学与思不可偏废。**这是古今通用的治学箴言。", "o": "文化史话整理 · 读书随札", "g": "典故"}, {"t": "五、札记杂谈", "h": "疑与信", "c": "**读书要敢于疑，也要有所信。**在疑与信之间，是学术成熟的分寸。", "o": "文化史话整理 · 读书随札", "g": "典故"}, {"t": "五、札记杂谈", "h": "知识的传承", "c": "**从口传到抄写、到印刷、到数字，知识载体不断变化。**变的载体，不变的是传递文明的愿望。", "o": "文化史话整理 · 读书随札", "g": "典籍"}];</script>
