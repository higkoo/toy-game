 <div class="hd"><h1>历代医家</h1><span class="sub">先秦 · 汉魏 · 隋唐 · 宋元 · 明清 · 近现代 · 39 则</span>

 <p class="intro">一部中医史，是由一个个具体的人写成的。这里讲历代医家的生平、治学与传说——把他们还原为有血有肉的历史人物。</p>

<script>const D=[{"t": "一、先秦两汉", "h": "扁鹊：一个被借用了千年的名字", "c": "**「扁鹊」本是上古传说里的神医名号**，战国时有一位医者医术高明，人们便以「扁鹊」称之。一个名字被反复借用，说明它早已升华为「良医」的代名词。在中文里，说人是扁鹊，便是极高的赞誉。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "一、先秦两汉", "h": "淳于意与《诊籍》：最早的病案记录", "c": "**西汉医者淳于意，被后世视为病案记录的先行者。**他把诊治过的情况逐条记下，称为「诊籍」。这批留存下来的记录，是中国现存最早的医案文献，让后人得以窥见两千年前的医疗现场。", "o": "文化史话整理 · 历代医家", "g": "典籍"}, {"t": "一、先秦两汉", "h": "张仲景：乱世里著书的读书人", "c": "**张仲景是东汉末年的学者，后世尊称「医圣」。**相传他目睹亲族凋零，于是发愤整理前代经验，写成《伤寒杂病论》。关于他的可靠史料不多，但那个在乱世里坚持把零散经验写成系统之书的形象，却清晰可辨。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "一、先秦两汉", "h": "华佗：外科传说与五禽戏", "c": "**华佗是东汉末年最富传奇色彩的医者。**传说他首创麻醉药、擅长外科，又模仿虎鹿熊猿鸟编成「五禽戏」。这些传说未必均可考，却塑造出一个充满想象力、勇于创新的医者形象。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "一、先秦两汉", "h": "董奉：杏林春暖的主人公", "c": "**三国时医者董奉，相传为人施治不取钱财，只让病家种杏树。**日久杏树成林，「杏林」遂成为医界的雅称。一个关于不取回报的故事，为一个行业确立了它的道德标杆。", "o": "文化史话整理 · 历代医家", "g": "典故"}, {"t": "一、先秦两汉", "h": "医缓与医和：以医喻政的古人", "c": "**春秋时秦国医者医缓、医和，留下以医理劝诫国君的故事。**他们借身体之理，劝人君当节制欲望、亲近贤臣。这是「以医喻政」的传统，把医术上升为一种治国修身的语言。", "o": "文化史话整理 · 历代医家", "g": "典故"}, {"t": "二、魏晋南北朝", "h": "王叔和与《脉经》的整理", "c": "**西晋王叔和，相传整理了张仲景的散佚文字，并编著《脉经》。**在书籍靠传抄流传的年代，这样一位整理者至关重要——许多经典正是靠他们才没有散失。整理者，是文化传承的隐形功臣。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "二、魏晋南北朝", "h": "皇甫谧：从文史到医书的转向", "c": "**皇甫谧是魏晋学者，自号玄晏先生，以文章名世。**中年之后他转向医书整理，编成《针灸甲乙经》。一位文史学者「半路入行」成就医书经典，说明古代学问本不分家。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "二、魏晋南北朝", "h": "陶弘景：山中宰相与本草整理", "c": "**南朝陶弘景隐居山林，却学问广博，被时人称为「山中宰相」。**他把《神农本草经》与后来的内容整理成《本草经集注》，重新编排品类。隐逸与著述，在他身上并行不悖。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "二、魏晋南北朝", "h": "葛洪：炼丹术士的另一面", "c": "**东晋葛洪是炼丹家，也是一位博学的著述者。**他的《抱朴子》广涉神仙、炼丹、医药与博物，是研究古代方术与化学思想的重要文献。炼丹术里，藏着古代实验精神的萌芽。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "二、魏晋南北朝", "h": "鲍姑：史上留名的女医者", "c": "**相传葛洪之妻鲍姑，也是一位医者，尤以艾灸闻名。**在古代男性医者占据史册的情况下，鲍姑的名字能流传下来，格外难得。她是传统医学中女性智慧的一个珍贵剪影。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "三、隋唐", "h": "孙思邈：从隐士到「药王」", "c": "**唐代孙思邈一生隐居，屡辞朝廷征召，却以学问与德行赢得后世尊崇，民间称「药王」。**他所著《大医精诚》讲为医者当先有仁心，是一篇影响深远的职业伦理名文。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "三、隋唐", "h": "王冰注《素问》：一次关键的整理", "c": "**唐代王冰为《黄帝内经·素问》作注，并补入七篇大论。**我们今天读到的《素问》，很大程度上正是经他整理的面貌。一位注家，改写了这部经典此后的命运。", "o": "文化史话整理 · 历代医家", "g": "典籍"}, {"t": "三、隋唐", "h": "苏敬与《新修本草》：官修药典的诞生", "c": "**唐代由政府组织编修《新修本草》，附以图谱，由官方颁行。**这是中国古代著名的官修药典。知识整理从私人著述走向国家工程，是学术史上的一次重要转折。", "o": "文化史话整理 · 历代医家", "g": "典籍"}, {"t": "三、隋唐", "h": "孟诜与食疗：把日常饮食写进书里", "c": "**唐代孟诜著《食疗本草》，关注日常食物与养生的关系。**把目光从珍奇药材转向寻常饮食，体现了一种贴近生活的博物关怀。饮食文化，也是传统文化的重要一支。", "o": "文化史话整理 · 历代医家", "g": "典籍"}, {"t": "三、隋唐", "h": "陈藏器与《本草拾遗》", "c": "**唐代陈藏器遍搜民间用药经验，编成《本草拾遗》。**他补充了许多前代本草未收的内容。博物之学，从来不靠一人一时，而靠一代代人不断添补。", "o": "文化史话整理 · 历代医家", "g": "典籍"}, {"t": "四、两宋", "h": "钱乙：儿科名家的治学", "c": "**北宋钱乙以儿科著称，相传著《小儿药证直诀》。**他的学术由门人整理流传。一位专科医家的经验能被保存下来，往往依赖弟子后学的记录与整理。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "四、两宋", "h": "唐慎微与《经史证类备急本草》", "c": "**宋代唐慎微广搜博采，编成一部规模宏大的本草书。**他大量引用经史文献中的用药记载，使本草成为一门兼顾文献与实物的学问。集大成之作，往往由最广博的阅读者完成。", "o": "文化史话整理 · 历代医家", "g": "典籍"}, {"t": "四、两宋", "h": "王惟一与针灸铜人", "c": "**北宋王惟一奉命铸造针灸铜人，作为官方教学与考核的模型。**铜人身标经络穴位，内可注水，是古代医学教育的创举。把知识做成可触摸的器物，是传播方式的一大进步。", "o": "文化史话整理 · 历代医家", "g": "风物"}, {"t": "四、两宋", "h": "宋慈与《洗冤集录》：法医学的曙光", "c": "**南宋宋慈著《洗冤集录》，系统总结验尸断案的经验，被后世视为法医学的经典。**它强调以证据与细致观察断案，体现出可贵的实证精神。", "o": "文化史话整理 · 历代医家", "g": "典籍"}, {"t": "四、两宋", "h": "庞安时与许叔微：两位著述的医者", "c": "**北宋庞安时、许叔微都是学识渊博的医家，留下多部著作。**他们既重临床，也重著述，把经验写下来传给后人。著述，是医者超越个体生命的方式。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "五、金元", "h": "刘完素：寒凉一派的开创", "c": "**金代刘完素，后世列为「金元四大家」之一，倡导寒凉之学。**他强调运气与病机的关系，自成一家之言。学术流派的争鸣，是医学思想活跃的标志。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "五、金元", "h": "张从正：攻邪一派的主张", "c": "**金代张从正，主张治病当先祛邪，被归为「攻下派」。**他强调因势利导，反对一味进补。不同学派的论辩，共同丰富了传统医学的思想。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "五、金元", "h": "李东垣：脾胃学说的大家", "c": "**金元之际李东垣，著《脾胃论》，强调脾胃在身体中的根本地位。**他经历了战乱年代，从民生疾苦中体察到饮食与身体的关系。学说往往诞生于对时代的深切感受。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "五、金元", "h": "朱丹溪：滋阴一派的集大成", "c": "**元代朱丹溪倡导滋阴，为「金元四大家」之一。**他兼通理学，把哲学思考带入医学。医与哲相通，是传统学术的鲜明特色。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "六、明代", "h": "李时珍：走向田野的博物学家", "c": "**明代李时珍耗费数十年，遍访四方，编成《本草纲目》。**全书广涉动物、植物、矿物、天文、地理，是一部博物学巨著。他不耻下问、实地采录的态度，尤为难得。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "六、明代", "h": "张介宾：类经与全集", "c": "**明代张介宾编著《类经》，把《黄帝内经》按主题重新编排，又著《景岳全书》。**整理经典、汇通众说，是明代医学的重要风气。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "六、明代", "h": "吴又可：对疫病的观察", "c": "**明末吴又可著《温疫论》，对当时疫病的流传与特点做了细致观察。**在疫病流行的年代，把所见所思写成专书，是医者面对时代的回应。", "o": "文化史话整理 · 历代医家", "g": "典籍"}, {"t": "六、明代", "h": "汪昂：把医书写得通俗", "c": "**明代汪昂编撰多部通俗医书，便于读者记诵。**他注重把深奥内容讲得浅显。知识的普及，与知识的创造同样重要。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "七、清代", "h": "叶天士：温病学说的代表", "c": "**清代叶天士是温病学说的代表人物，留下大量医案与论述。**他强调因时因地制宜，讲究辨别层次。其学术通过门人笔录流传，影响深远。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "七、清代", "h": "吴鞠通与《温病条辨》", "c": "**清代吴鞠通著《温病条辨》，系统梳理温病理论。**他把前代经验编成条理清晰的著作。集大成，是把散落的经验安放有序。", "o": "文化史话整理 · 历代医家", "g": "典籍"}, {"t": "七、清代", "h": "王清任：敢于质疑的解剖探索", "c": "**清代王清任重视实物观察，亲自观察尸体脏腑，著《医林改错》。**他对旧说敢于提出质疑，体现出可贵的实证勇气。质疑与观察，是学术进步的动力。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "七、清代", "h": "徐灵胎：通贯古今的医学评论家", "c": "**清代徐灵胎学识广博，遍评古今医书，著述宏富。**他既能深入古典，又敢于评点得失。批判性阅读，是治学的重要功夫。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "七、清代", "h": "傅青主：医名之外的风骨", "c": "**明末清初傅青主，既是医者，也是书法家、学者，极富风骨。**他坚守气节，行医济世。医者的形象，在传统里常与士人的品格相连。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "七、清代", "h": "陈修园：普及医学的著述家", "c": "**清代陈修园著述甚多，力求通俗易懂，便于初学者。**他主张回归经典，又重视传播。让学问看得懂、学得会，是一种重要的贡献。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "八、近现代", "h": "张锡纯：中西汇通的探索", "c": "**近代张锡纯著《医学衷中参西录》，主张汇通中西之学。**他既尊崇传统经典，又乐于吸收新知。在时代剧变中，如何对待传统与外来学问，是他那一代人的共同课题。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "八、近现代", "h": "施今墨：近代医教育的推动者", "c": "**近代施今墨行医之余，致力于医学教育与整理。**他与同道创办学校，培养后学。传统的师徒相传，在近代逐渐转向现代的教育方式。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "八、近现代", "h": "蒲辅周：朴实的大家风范", "c": "**现代蒲辅周以严谨审慎著称，强调因人、因时、因地制宜。**他用药平和，重视扶正。大家的风范，往往体现在对分寸的把握上。", "o": "文化史话整理 · 历代医家", "g": "人物"}, {"t": "八、近现代", "h": "医者的群像：无名者的贡献", "c": "**史册留名的终究是少数，更多的医者终其一生默默行医乡里。**他们被写进地方志、家谱与口碑里。医学的传承，不只靠名家，也靠无数无名者的日常坚守。", "o": "文化史话整理 · 历代医家", "g": "人物"}];</script>
