 <p class="intro">经络与穴位的名字，是一套充满取象与想象的语言。这里讲这些名称从何而来、如何演变，它们怎样把身体画成一张有诗意的文化地图。</p>

<script>const D=[{"t": "一、经脉之名", "h": "「经」与「络」：从织物到身体", "c": "**「经」是织物的纵线，「络」是缠绕的丝。**古人借织布的意象，把身体中纵行的主干称为「经」，分支称为「络」。一套纺织词汇，成了描述身体的语言。", "o": "文化史话整理 · 经络文化", "g": "典故"}, {"t": "一、经脉之名", "h": "十二经的命名逻辑", "c": "**十二经以「手/足 + 阴/阳 + 脏腑」命名，如手太阴肺经、足阳明胃经。**名字里含着手足、阴阳、脏腑三重信息。一套命名法，就是一张身体的分类表。", "o": "文化史话整理 · 经络文化", "g": "典籍"}, {"t": "一、经脉之名", "h": "三阴三阳：从二到六", "c": "**阴阳各分太、少、厥（或明），由二而六。**这种细分，让阴阳从一对概念展开为六个层次。分类的细化，是思想走向精密的标志。", "o": "文化史话整理 · 经络文化", "g": "典籍"}, {"t": "一、经脉之名", "h": "奇经八脉：不循常道", "c": "**督、任、冲、带等八脉，被称为「奇经」，以别于十二正经。**「奇」是奇异、不常规之意。给非常规者单立一类，体现了分类思想的周全。", "o": "文化史话整理 · 经络文化", "g": "典籍"}, {"t": "一、经脉之名", "h": "任督二脉与「小周天」", "c": "**任督二脉在前後正中，常被道教内丹术借用来讲「小周天」循环。**一套医学概念，被另一种思想体系重新解释，是文化交流的常见现象。", "o": "文化史话整理 · 经络文化", "g": "典故"}, {"t": "二、穴位取名", "h": "穴位命名的取象", "c": "**许多穴位名取自自然与器物：涌泉如泉水涌出，合谷如两骨相合之谷。**以山水、谷、池、泉命名身体部位，是「近取诸身、远取诸物」的取象思维。", "o": "文化史话整理 · 经络文化", "g": "典故"}, {"t": "二、穴位取名", "h": "足三里：一个名字的多种解释", "c": "**「足三里」之名，古人有「三里即三寸」等多种说法。**一个穴名的来历，往往聚讼纷纭。名字的考据，本身就是一门有趣的学问。", "o": "文化史话整理 · 经络文化", "g": "典故"}, {"t": "二、穴位取名", "h": "百会、涌泉：上下呼应", "c": "**「百会」在巅顶，诸阳交会；「涌泉」在足底，如泉上涌。**一上一下，名字里含着天地的意象。身体被想象成一个小宇宙。", "o": "文化史话整理 · 经络文化", "g": "典故"}, {"t": "二、穴位取名", "h": "以星辰命名的穴位", "c": "**有些穴位以北斗、天枢等星名命名。**把星空的名字安放到身体上，是「天人相应」观念最直观的体现。", "o": "文化史话整理 · 经络文化", "g": "典故"}, {"t": "二、穴位取名", "h": "穴位名的文学色彩", "c": "**承山、飞扬、光明、翳风……许多穴名本身就是优美的词。**古人为身体部位取名时，显然也在追求诗意。", "o": "文化史话整理 · 经络文化", "g": "典故"}, {"t": "三、图谱与器物", "h": "古代的经络图", "c": "**经络图把抽象的通道画成可见的线条，是医学可视化的重要尝试。**图让人「看见」看不见的东西，是知识传播的革命。", "o": "文化史话整理 · 经络文化", "g": "风物"}, {"t": "三、图谱与器物", "h": "针灸铜人的故事", "c": "**宋代针灸铜人以穴位注水考核学徒，中则水出。**把知识做成可操作的器物，是古代医学教育的创举。", "o": "文化史话整理 · 经络文化", "g": "风物"}, {"t": "三、图谱与器物", "h": "帛书经脉图的发现", "c": "**马王堆帛书里的经脉图，让后人看见早期经络学说的另一种面貌。**考古发现，不断改写我们对历史的认识。", "o": "文化史话整理 · 经络文化", "g": "典籍"}, {"t": "三、图谱与器物", "h": "经络图与书法绘画", "c": "**一些古经络图兼具绘画与书法之美，是科学与艺术的结合。**古人画一张图，也把它当作作品来对待。", "o": "文化史话整理 · 经络文化", "g": "风物"}, {"t": "四、思想与流变", "h": "子午流注与时间观", "c": "**子午流注把十二时辰与经脉相配，体现「天人同构」的时间观。**读它，重点不在操作，而在那种把时间纳入身体的想象。", "o": "文化史话整理 · 经络文化", "g": "典籍"}, {"t": "四、思想与流变", "h": "经络与「气」的观念", "c": "**经络学说与「气」的思想密不可分。**「气」是古人理解生命活动的概念工具。理解经络，绕不开这套思想背景。", "o": "文化史话整理 · 经络文化", "g": "典籍"}, {"t": "四、思想与流变", "h": "经络学说的现代化", "c": "**近现代学者用新观念重新解释经络，形成持续至今的讨论。**古老概念如何与当代对话，是个开放的问题。", "o": "文化史话整理 · 经络文化", "g": "典籍"}, {"t": "四、思想与流变", "h": "经络在武术与气功中", "c": "**武术、气功常借用经络语言，形成各自的身体理论。**一套概念在不同实践中被重新使用，生命力由此延长。", "o": "文化史话整理 · 经络文化", "g": "典故"}, {"t": "四、思想与流变", "h": "经络文化的海外传播", "c": "**经络概念随针灸传到海外，被不同文化重新理解。**概念的旅行，往往产生意想不到的新意义。", "o": "文化史话整理 · 经络文化", "g": "典籍"}, {"t": "五、文化拾零", "h": "「脉络」一词的引申", "c": "**「脉络」从医理进入日常，指事物的条理与线索。**文章有脉络，历史有脉络。一个词跨域流传，说明它抓住了普遍结构。", "o": "文化史话整理 · 经络文化", "g": "典故"}, {"t": "五、文化拾零", "h": "经络与「通」的哲学", "c": "**经络讲究「通」，「不通则痛」一类说法深入人心。**「通」是中国思想里极重要的价值，从水路到人身，一以贯之。", "o": "文化史话整理 · 经络文化", "g": "典故"}, {"t": "五、文化拾零", "h": "穴位名的避讳与改字", "c": "**古籍中的穴位名，有时因避讳而改字。**一个字的改动，往往留下时代的印记。", "o": "文化史话整理 · 经络文化", "g": "典籍"}, {"t": "五、文化拾零", "h": "经络歌诀与记忆术", "c": "**古人把经络内容编成歌诀，便于记诵。**把知识编成韵文，是传统的记忆智慧。", "o": "文化史话整理 · 经络文化", "g": "典籍"}, {"t": "五、文化拾零", "h": "从经络看身体观", "c": "**经络学说把身体理解为相互关联的整体，而非零件的堆砌。**这种整体观，是传统生命思想最鲜明的特征之一。", "o": "文化史话整理 · 经络文化", "g": "典籍"}];</script>
