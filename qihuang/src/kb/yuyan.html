<script>const D=[{"t": "一、字源探微", "h": "「医」字的来历", "c": "**「医」的繁体字从「酉」，与酒有关。**古代医疗与酒关系密切，「医」字本身，就藏着一段物质文化史。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "一、字源探微", "h": "「药」字：从草木到金石", "c": "**「药」字本与草木相关，后来扩及金石、动物。**字义的扩大，反映着人们认识物产范围的拓展。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "一、字源探微", "h": "「病」与「疾」的分别", "c": "**古人「疾」「病」有别，轻者为疾、重者为病。**一对近义词的细微差别，体现语言的精密。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "一、字源探微", "h": "「症」与「证」", "c": "**「症」「证」二字在医学文献中用法屡变。**辨字辨义，是读懂古籍的基本功。", "o": "文化史话整理 · 医语源流", "g": "典籍"}, {"t": "一、字源探微", "h": "「方」字的多义", "c": "**「方」既有方药之意，也有方向、方法之义。**一个字的多义，映照出传统思想的关联思维。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "二、进入日常", "h": "心腹之患", "c": "**以身体的要害比喻最切近的祸患。**把身体当比例尺，是汉语取喻的重要方式。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "二、进入日常", "h": "病入膏肓", "c": "**「膏肓」指难以触及的深处，比喻事态严重。**一个医学典故，成了通用的日常成语。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "二、进入日常", "h": "「毛病」一词的来历", "c": "**「毛病」原与马的身体特征有关，后来泛指缺点。**词义的流转，往往出人意料。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "二、进入日常", "h": "「调理」的泛化", "c": "**「调理」从身体调养，引申为整理、安排。**比如说「调理一下关系」，用的是它的引申义。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "二、进入日常", "h": "「元气」的观念", "c": "**「元气」本是中国哲学概念，后进入日常，指精神与活力。**一个哲学词，成了人人会用的口语。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "三、语言与思维", "h": "以身体喻世界", "c": "**汉语大量用身体部位比喻事物：眉目、手足、心腹、骨干。**「近取诸身」，是认知世界的起点。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "三、语言与思维", "h": "「通」与「不通」", "c": "**「通」字在医学与日常中都极重要：通路、通气、通达。**一个字，承载着对顺畅状态的共同向往。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "三、语言与思维", "h": "「和」的价值", "c": "**「和」是传统思想的核心词，也贯穿医学语言。**从五味之和到心和气平，「和」是一种理想状态。", "o": "文化史话整理 · 医语源流", "g": "典籍"}, {"t": "三、语言与思维", "h": "数字在医语里", "c": "**「五脏六腑」「四时五味」等说法，用数字组织经验。**数字让知识变得整齐、便于记诵。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "三、语言与思维", "h": "医语中的比喻系统", "c": "**煮水、烧锅、草木生长，都是医语常用的比喻。**抽象的道理，借具体的意象来讲。", "o": "文化史话整理 · 医语源流", "g": "典籍"}, {"t": "四、雅俗之间", "h": "行话与俗语", "c": "**医药行话有些进入俗语，有些始终在小圈子里流传。**语言的流通，反映着知识的开放程度。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "四、雅俗之间", "h": "药名进入谜语", "c": "**药名因音义之美，常成为谜语的素材。**「当归」可射「应当归来」，是谐音双关的妙用。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "四、雅俗之间", "h": "医者在诗词里", "c": "**诗人偶尔以医者、药名入诗，别有情趣。**医学与文学，在语言层面早早相遇。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "四、雅俗之间", "h": "方言里的医药词", "c": "**各地方言保存了许多古老的医药词汇。**方言是语言演化的活化石。", "o": "文化史话整理 · 医语源流", "g": "风物"}, {"t": "五、语言的流变", "h": "古今词义之差", "c": "**同一个词，古今含义可能大不相同。**读古籍，最忌以今律古。", "o": "文化史话整理 · 医语源流", "g": "典籍"}, {"t": "五、语言的流变", "h": "外来词的融入", "c": "**不少医药词汇来自外语音译，逐渐融入汉语。**语言的开放，是文化开放的缩影。", "o": "文化史话整理 · 医语源流", "g": "典故"}, {"t": "五、语言的流变", "h": "新词与新知", "c": "**面对新知识，汉语不断创造新词来表达。**词汇的扩容，是思想扩容的印记。", "o": "文化史话整理 · 医语源流", "g": "典籍"}, {"t": "五、语言的流变", "h": "术语的规范化", "c": "**术语的统一下，是学术交流与传播的前提。**名不正则言不顺，古人早有此悟。", "o": "文化史话整理 · 医语源流", "g": "典籍"}, {"t": "五、语言的流变", "h": "语言是文化的镜子", "c": "**一个民族的语言，保存着它理解世界的方式。**从医语，能读出传统的思维密码。", "o": "文化史话整理 · 医语源流", "g": "典故"}];</script>

(function () {
  'use strict';
  var KEY = 'qihuang.rank.v1', FILE = 'yuyan.html';
  function num() { try { return parseInt(window.localStorage.getItem(KEY), 10) || 0; } catch (e) { return 0; } }
  function put(v) { try { window.localStorage.setItem(KEY, String(v)); } catch (e) {} }
  function sdk() {
    var list = [window.toy, window.Toy, window.toy && window.toy.toy, window.Toy && window.Toy.toy];
    for (var i = 0; i < list.length; i++) if (list[i] && typeof list[i].submitScore === 'function') return list[i];
    return null;
  }
  function send(score) {
    var t = sdk(); if (!t) return;
    try { t.submitScore({ score: score, board: 1 }); } catch (e) {}
  }
  var sk = KEY + '.seen', seen = [];
  try { seen = JSON.parse(window.localStorage.getItem(sk) || '[]') || []; } catch (e) { seen = []; }
  if (!Array.isArray(seen)) seen = [];
  if (seen.indexOf(FILE) === -1) {
    seen.push(FILE);
    try { window.localStorage.setItem(sk, JSON.stringify(seen)); } catch (e) {}
    var v = num() + 1; put(v); send(v);
  }
})();
